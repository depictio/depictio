[bumpversion]
current_version = 1.20.0
commit = True
tag = True
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(?:-b(?P<beta>\d+))?
serialize = 
	{major}.{minor}.{patch}-b{beta}
	{major}.{minor}.{patch}

[bumpversion:file:VERSION]

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:depictio/cli/pyproject.toml]

[bumpversion:file:helm-charts/depictio/Chart.yaml]
search = appVersion: "{current_version}"
replace = appVersion: "{new_version}"

[bumpversion:file:helm-charts/depictio/values.yaml]
search = tag: "{current_version}"
replace = tag: "{new_version}"

[bumpversion:file:docker-compose.yaml]
search = DEPICTIO_VERSION:-{current_version}
replace = DEPICTIO_VERSION:-{new_version}

[bumpversion:file:depictio/cli/configs/nextflow/modules/depictio/ingest/main.nf]
search = depictio-cli:{current_version}
replace = depictio-cli:{new_version}

[bumpversion:file:depictio/cli/configs/nextflow/modules/depictio/ingest/environment.yml]
search = depictio[local]=={current_version}
replace = depictio[local]=={new_version}
