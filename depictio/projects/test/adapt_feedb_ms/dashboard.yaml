# Adaptive Feedback Microscopy - Real-time Dashboard
title: "Microscopy Real-time Monitor"
subtitle: "Real-time monitoring of virtual microscopy experiment phenotype data"
project_tag: "Adaptive Feedback Microscopy"
dashboard_id: "750a1b2c3d4e5f6a7b8c9d20"

# Sidebar tab: neutral "Dashboard" pill in grey/black tones (tab_icon_color:
# dark → Mantine near-black active fill, matching the monochrome dashboard icon).
main_tab_name: "Dashboard"
tab_icon: "mdi:view-dashboard"
tab_icon_color: "dark"

# Left-panel sections — the collapsible outer level, above `group`. Optional:
# a section named by a component but omitted here still renders, expanded and
# without an icon. Declaring it fixes its position in the panel and lets it
# carry an icon, a hint and a default collapse state.
filter_sections:
  - name: "Sample"
    icon: "mdi:bacteria"
    description: "Which cells to look at"
  - name: "Morphology"
    icon: "mdi:shape-outline"
    collapsed: true

components:
  # ── Narrative intro (grid, right column, full width) ─────────────────────
  - tag: dashboard-intro
    component_type: text
    title: "Adaptive Feedback Microscopy — Real-time Monitor"
    order: 3
    alignment: left
    body: "Real-time cell phenotypes from **SVLT** (*Serving Vision to Living Things*) — on-demand computer vision that segments each acquired microscopy image into RoiSets and classifies every object on the fly. Scope with the **acquisition window** (footer) and **left-panel filters**."
    layout:
      x: 0
      y: 0
      w: 8
      h: 1

  # ── Timeline scrubber (placement: top → rendered as full-width footer) ────
  # `placement: top` routes this into the viewer's dedicated interactive panel,
  # which the React viewer renders as an always-visible, full-width footer
  # spanning both the filter sidebar and the content column. Lets the user
  # constrain every downstream component to a single acquisition window.
  # Switchable timescale (year/month/day/hour/minute) at runtime.

  - tag: acquisition-timeline
    component_type: interactive
    workflow_tag: python/microscopy_workflow
    data_collection_tag: microscopy_phenobase
    interactive_component_type: Timeline
    column_name: meta_acquisition_timestamp
    column_type: datetime
    placement: top
    timescale: minute
    title: "Acquisition window"
    icon_name: mdi:clock-outline

  # ── Left Panel: Filters ──────────────────────────────────────────────────

  # Taxa MultiSelect scoped to "large" cells only — demonstrates filter_expr
  # as advanced interactive scoping (the dropdown options reflect only taxa
  # whose features_area > 100, computed server-side via the safe Polars
  # filter expression evaluator).
  - tag: taxa-filter
    component_type: interactive
    workflow_tag: python/microscopy_workflow
    data_collection_tag: microscopy_phenobase
    interactive_component_type: MultiSelect
    column_name: classifications_taxa
    column_type: object
    filter_expr: "col('features_area') > 100"
    section: "Sample"
    title: "Taxa Class (large cells only)"
    icon_name: mdi:bacteria
    layout:
      x: 0
      y: 0
      w: 1
      h: 3

  # ── Combined "Shape filters" group, inside the "Morphology" section ──────
  # Interactive components sharing the same `group` render together inside one
  # collapsible card — visual grouping only, each control still emits its own
  # filter and they AND together via the existing filter pipeline. Group size
  # is capped server-side (MAX_INTERACTIVE_GROUP_SIZE), and every member of a
  # group must sit in the same `section`.

  - tag: area-range-filter
    component_type: interactive
    workflow_tag: python/microscopy_workflow
    data_collection_tag: microscopy_phenobase
    interactive_component_type: RangeSlider
    column_name: features_area
    column_type: float64
    group: "Shape filters"
    section: "Morphology"
    title: "Cell Area"
    icon_name: mdi:vector-square
    layout:
      x: 0
      y: 3
      w: 1
      h: 3

  - tag: eccentricity-range-filter
    component_type: interactive
    workflow_tag: python/microscopy_workflow
    data_collection_tag: microscopy_phenobase
    interactive_component_type: RangeSlider
    column_name: features_eccentricity
    column_type: float64
    group: "Shape filters"
    section: "Morphology"
    title: "Eccentricity"
    icon_name: mdi:shape-outline
    layout:
      x: 0
      y: 6
      w: 1
      h: 3

  - tag: solidity-range-filter
    component_type: interactive
    workflow_tag: python/microscopy_workflow
    data_collection_tag: microscopy_phenobase
    interactive_component_type: RangeSlider
    column_name: features_solidity
    column_type: float64
    group: "Shape filters"
    section: "Morphology"
    title: "Solidity"
    icon_name: mdi:diamond-stone
    layout:
      x: 0
      y: 9
      w: 1
      h: 3

  # ── Right Panel Row (y=2, h=5): 4 summary cards (uniform height) ──────
  # First two are single-metric cards; the last two are Tukey box-plot
  # distribution cards (aggregations: [box_plot_stats] + secondary_layout:
  # box_plot) — hero = median, with the full five-number summary + whiskers
  # + outliers rendered as a compact box-and-whisker strip.

  - tag: total-cells
    component_type: card
    workflow_tag: python/microscopy_workflow
    data_collection_tag: microscopy_phenobase
    aggregation: count
    column_name: index_index
    column_type: int64
    title: "Total Cells"
    icon_name: mdi:counter
    icon_color: "#2196F3"
    layout:
      x: 0
      y: 1
      w: 2
      h: 2

  - tag: mean-area
    component_type: card
    workflow_tag: python/microscopy_workflow
    data_collection_tag: microscopy_phenobase
    aggregation: average
    column_name: features_area
    column_type: float64
    title: "Mean Area"
    icon_name: mdi:vector-square
    icon_color: "#4CAF50"
    layout:
      x: 2
      y: 1
      w: 2
      h: 2

  # Tukey distribution card — box_plot_stats returns the compound five-number
  # summary (min/Q1/median/Q3/max) + 1.5×IQR whiskers + outliers; the
  # box_plot secondary layout draws it as a box-and-whisker strip.
  - tag: mean-solidity
    component_type: card
    workflow_tag: python/microscopy_workflow
    data_collection_tag: microscopy_phenobase
    aggregation: median
    aggregations:
      - box_plot_stats
    secondary_layout: box_plot
    column_name: features_solidity
    column_type: float64
    title: "Solidity Stats"
    icon_name: mdi:diamond-stone
    icon_color: "#FF9800"
    layout:
      x: 4
      y: 1
      w: 2
      h: 2

  - tag: area-summary
    component_type: card
    workflow_tag: python/microscopy_workflow
    data_collection_tag: microscopy_phenobase
    aggregation: median
    aggregations:
      - box_plot_stats
    secondary_layout: box_plot
    column_name: features_area
    column_type: float64
    icon_name: mdi:chart-box-outline
    icon_color: "#9C27B0"
    title: "Area Stats"
    layout:
      x: 6
      y: 1
      w: 2
      h: 2

  # ── Scatter row (y=3, h=5): the two highest-signal relationships ──────
  # Trimmed from five figures to two — the taxa-balance bar, area box, and
  # area histogram duplicated what the Tukey cards already show, so they were
  # dropped. Styled clean (plotly_white, unit axis labels, soft opacity).

  - tag: morphology-scatter
    component_type: figure
    workflow_tag: python/microscopy_workflow
    data_collection_tag: microscopy_phenobase
    visu_type: scatter
    dict_kwargs:
      x: features_area
      y: features_eccentricity
      color: classifications_taxa
      color_discrete_map: '{"1": "#4C6EF5", "2": "#F76707"}'
      category_orders: '{"classifications_taxa": [1, 2]}'
      labels: '{"features_area": "Cell area (px\u00b2)", "features_eccentricity": "Eccentricity", "classifications_taxa": "Taxa"}'
      opacity: 0.85
      template: plotly_white
      title: "Morphology \u2014 Area vs Eccentricity"
    selection_enabled: true
    selection_column: index_index
    layout:
      x: 0
      y: 3
      w: 4
      h: 5

  - tag: intensity-scatter
    component_type: figure
    workflow_tag: python/microscopy_workflow
    data_collection_tag: microscopy_phenobase
    visu_type: scatter
    dict_kwargs:
      x: features_intensity_mean-0
      y: features_intensity_mean-2
      color: classifications_taxa
      color_discrete_map: '{"1": "#4C6EF5", "2": "#F76707"}'
      category_orders: '{"classifications_taxa": [1, 2]}'
      labels: '{"features_intensity_mean-0": "Red channel intensity", "features_intensity_mean-2": "Blue channel intensity", "classifications_taxa": "Taxa"}'
      opacity: 0.85
      template: plotly_white
      title: "Intensity \u2014 Red vs Blue channel"
    selection_enabled: true
    selection_column: index_index
    layout:
      x: 4
      y: 3
      w: 4
      h: 5

  # ── Cell gallery (full width, compact thumbnail strip) ───────────────
  - tag: cell-gallery
    component_type: image
    workflow_tag: python/microscopy_workflow
    data_collection_tag: microscopy_phenobase
    image_column: patches_patches_2d_rgb_path
    s3_base_folder: "s3://depictio-bucket/750a1b2c3d4e5f6a7b8c9d10/images/phenobase/"
    thumbnail_size: 140
    columns: 6
    max_images: 500
    layout:
      x: 0
      y: 8
      w: 8
      h: 6

  # ── Detail table (full width, compact, key columns only) ─────────────
  - tag: detail-table
    component_type: table
    workflow_tag: python/microscopy_workflow
    data_collection_tag: microscopy_phenobase
    compact: true
    columns:
      - index_index
      - classifications_taxa
      - features_area
      - features_eccentricity
      - features_solidity
    page_size: 8
    row_selection_enabled: true
    row_selection_column: index_index
    layout:
      x: 0
      y: 14
      w: 8
      h: 4
