  description: Every catalog output, staged from the catalog's own fixtures
  version: 1.0.0
  variables:
  - name: DATA_ROOT
    description: Project directory holding the recipe seeds and the run tree
    required: true
  dashboards:
  - dashboards/overview.yaml
