    data_collection_tag: mosdepth_amplicon_coverage
    description: Amplicon coverage — raw mosdepth output, recognised by find
    config:
      type: Table
      metatype: Aggregate
      scan:
        mode: recursive
        scan_parameters:
          regex_config:
            pattern: mosdepth/amplicon/all_samples\.mosdepth\.coverage\.tsv
      dc_specific_properties:
        format: TSV
        polars_kwargs:
          separator: "\t"
        columns_description:
          chrom: String
          start: Int64
          end: Int64
          region: String
          coverage: Float64
          sample: String
  - id: 7a60dd03a5c6749cc2bfea48
    data_collection_tag: multiqc_report
    description: Synthetic MultiQC report carrying every section the catalog declares
    config:
      type: MultiQC
      scan:
        mode: recursive
        scan_parameters:
          regex_config:
            pattern: multiqc/multiqc_data/multiqc\.parquet
      dc_specific_properties:
        s3_location: null
        modules:
        - bcftools
        - bowtie2
        - cutadapt
        - fastp
        - fastqc
        - happy
        - iVar
        - kraken
        - mosdepth
        - multiqc_software_versions
        - quast
        - samtools
        - snpeff
        - sompy
        - summary_conformance_metrics
        - truvari
        plots:
          bcftools:
          - Indel Distribution
          bowtie2:
          - Paired-end alignments
          cutadapt:
          - Filtered Reads
          - Trimmed Sequence Lengths (3')
          fastp:
          - Filtered Reads
          fastqc:
          - Sequence Counts
          - Sequence Quality Histograms
          - Per Sequence Quality Scores
          - Status Checks
          happy:
          - INDEL
          - SNP
          iVar:
          - iVar Primer Counts
          kraken:
          - Top taxa
          mosdepth:
          - Cumulative coverage distribution
          - Average coverage per contig
          quast:
          - Assembly Statistics
          - Number of Contigs
          samtools:
          - Percent mapped
          - Alignment stats
          snpeff:
          - Variants by Genomic Region
          - Variant Effects by Impact
          - Variants by Effect Types
          - Variants by Functional Class
          sompy:
          - Combined
          - Indel
          - SNV
          summary_conformance_metrics:
          - summary_conformance_metrics-section
