# Bioimage examples: seven image cases for the bioimage_viewer, four OME-Zarr
# NGFF 0.4 stores (multichannel 2D, Visium-like spatial, 3D + time,
# multi-sample), a pyramidal OME-TIFF, a SpatialData store (zarr v3) and an
# OME-Zarr NGFF 0.5 store with sharded arrays, each with the table its points
# overlay and its filters read. The multi-sample images also have segmentation
# masks (a labels DC of plain TIFFs) drawn over them. Images come from scikit-image sample data;
# tables are derived from the pixels. Two synthetic cases test the viewer's
# reading rather than its looks: a small HCS plate (OME-Zarr plate, a well
# filter opens its well) and a shape gallery (one store per axis layout, plus
# one off the spec), and a registration (the steps of two image registrations,
# one failing at its affine step, with a metrics table) and a CLEM case (one
# HeLa cell, its FIB-SEM read in place and its light microscopy registered
# into it). See data/README.md,
# dev/bioimage/make_examples.py, dev/bioimage/make_plate_and_shapes.py and
# dev/bioimage/make_registration_example.py and dev/bioimage/make_clem_example.py
# to regenerate.
#
# Optional project: not part of the default seed set. Seed it with
# DEPICTIO_SEED_EXTRA_PROJECTS=bioimage_examples, or
# `depictio local up --examples bioimage_examples`.

id: "646b0f3c1e4a2d7f8e5b8f00"
name: "Bioimage Examples"
project_type: "advanced"
is_public: true
workflows:
  - id: "646b0f3c1e4a2d7f8e5b8f01"
    name: "bioimage_demo"
    engine:
      name: "python"
      version: "3.11"
    description: "Small OME-Zarr (NGFF 0.4 and 0.5), OME-TIFF and SpatialData images from scikit-image sample data, with derived cell and spot tables"
    # Flat: the data folder is one run, which is what the recursive multi-sample
    # DC below scans for stores.
    data_location:
      structure: "flat"
      locations:
        - /app/depictio/projects/init/bioimage_examples/data
    data_collections:
      # ----------------------------------------------------------------
      # 1. Multichannel 2D fluorescence (kidney, maximum projection)
      # ----------------------------------------------------------------
      - id: "646b0f3c1e4a2d7f8e5b8f02"
        data_collection_tag: "kidney_2d_image"
        description: "Mouse kidney, 3-channel confocal fluorescence, maximum projection (512 x 512)"
        config:
          type: "bioimage"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/bioimage_examples/data/kidney_2d.zarr"
          dc_specific_properties:
            format: "ome-zarr"
            ngff_version: "0.4"
            upload: true

      - id: "646b0f3c1e4a2d7f8e5b8f03"
        data_collection_tag: "kidney_2d_cells"
        description: "Nuclei segmented on the 450 nm channel of the kidney projection"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/bioimage_examples/data/kidney_2d_cells.csv"
          dc_specific_properties:
            format: "CSV"
            polars_kwargs:
              separator: ","
            columns_description:
              cell_id: "Nucleus identifier"
              sample: "Store the nucleus belongs to (kidney_2d)"
              x: "Centroid column, level-0 pixels"
              y: "Centroid row, level-0 pixels"
              area_px: "Area in pixels"
              area_um2: "Area in square micrometres"
              mean_em450: "Mean intensity, 450 nm channel"
              mean_em515: "Mean intensity, 515 nm channel"
              mean_em605: "Mean intensity, 605 nm channel"
              dominant_channel: "Brightest channel relative to its own 99th percentile"

      # ----------------------------------------------------------------
      # 2. Visium-like spatial: RGB tissue + spots
      # ----------------------------------------------------------------
      - id: "646b0f3c1e4a2d7f8e5b8f04"
        data_collection_tag: "ihc_spatial_image"
        description: "Colonic glands, DAB immunohistochemistry with hematoxylin (RGB, 512 x 512)"
        config:
          type: "bioimage"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/bioimage_examples/data/ihc_spatial.zarr"
          dc_specific_properties:
            format: "ome-zarr"
            ngff_version: "0.4"
            upload: true

      - id: "646b0f3c1e4a2d7f8e5b8f05"
        data_collection_tag: "ihc_spatial_spots"
        description: "Visium-like spots over the tissue, clustered on stain intensities, with synthetic counts"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/bioimage_examples/data/ihc_spatial_spots.csv"
          dc_specific_properties:
            format: "CSV"
            polars_kwargs:
              separator: ","
            columns_description:
              spot_id: "Spot identifier"
              sample: "Store the spot belongs to (ihc_spatial)"
              x: "Spot centre column, level-0 pixels"
              y: "Spot centre row, level-0 pixels"
              cluster: "k-means cluster on hematoxylin, DAB and brightness (C1 = most DAB)"
              gene_A: "Synthetic count, follows DAB"
              gene_B: "Synthetic count, follows hematoxylin"
              gene_C: "Synthetic count, left-to-right gradient"

      # ----------------------------------------------------------------
      # 3. 3D stack with a time axis (t, c, z, y, x)
      # ----------------------------------------------------------------
      - id: "646b0f3c1e4a2d7f8e5b8f06"
        data_collection_tag: "kidney_3d_timelapse_image"
        description: "Kidney volume, 2 channels x 8 planes x 5 timepoints (synthetic drift and bleaching)"
        config:
          type: "bioimage"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/bioimage_examples/data/kidney_3d_timelapse.zarr"
          dc_specific_properties:
            format: "ome-zarr"
            ngff_version: "0.4"
            upload: true

      - id: "646b0f3c1e4a2d7f8e5b8f07"
        data_collection_tag: "kidney_3d_timelapse_nuclei"
        description: "Nuclei of the first timepoint, segmented in 3D"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/bioimage_examples/data/kidney_3d_timelapse_nuclei.csv"
          dc_specific_properties:
            format: "CSV"
            polars_kwargs:
              separator: ","
            columns_description:
              cell_id: "Nucleus identifier"
              sample: "Store the nucleus belongs to (kidney_3d_timelapse)"
              x: "Centroid column, level-0 pixels"
              y: "Centroid row, level-0 pixels"
              z: "Centroid plane index"
              depth_band: "Upper, middle or lower third of the nuclei by depth"
              volume_voxels: "Volume in voxels"
              volume_um3: "Volume in cubic micrometres"
              mean_intensity: "Mean nuclear-channel intensity"

      # ----------------------------------------------------------------
      # 4. Multi-sample: one store per sample, a sample sheet, a cells table
      # ----------------------------------------------------------------
      # Recursive: every store named sample_*.zarr under the run becomes one
      # File, and the viewer picks the one whose name matches the selected
      # sample.
      - id: "646b0f3c1e4a2d7f8e5b8f08"
        data_collection_tag: "multi_sample_images"
        description: "Three crops of a human cell mitosis screen image, one store per sample"
        config:
          type: "bioimage"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: "sample_[A-Za-z0-9]+\\.zarr"
          dc_specific_properties:
            format: "ome-zarr"
            ngff_version: "0.4"
            upload: true

      # Segmentation masks of the three samples: plain uint16 TIFFs, as
      # segmentation tools write them, converted to OME-Zarr labels images at
      # ingest. `sample_pattern` names each mask's sample, so the viewer draws
      # the mask of the sample it shows; a mask value is the cells table's
      # `label`.
      - id: "646b0f3c1e4a2d7f8e5b8f1a"
        data_collection_tag: "multi_sample_labels"
        description: "Nucleus segmentation masks of the three samples, one TIFF per sample"
        config:
          type: "bioimage"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: "sample_[A-Za-z0-9]+_mask\\.tif"
          dc_specific_properties:
            format: "tiff"
            kind: "labels"
            sample_pattern: "^(.+?)_mask\\.tif$"
            upload: true

      - id: "646b0f3c1e4a2d7f8e5b8f09"
        data_collection_tag: "multi_sample_cells"
        description: "Nuclei of the three samples, with a heuristic mitotic call"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/bioimage_examples/data/multi_sample/cells.csv"
          dc_specific_properties:
            format: "CSV"
            polars_kwargs:
              separator: ","
            columns_description:
              cell_id: "Nucleus identifier"
              label: "Nucleus id in the segmentation masks, unique across samples"
              sample: "Sample (store name without .zarr)"
              x: "Centroid column, level-0 pixels of the sample's store"
              y: "Centroid row, level-0 pixels of the sample's store"
              area_px: "Area in pixels"
              mean_intensity: "Mean DNA intensity"
              eccentricity: "Eccentricity of the fitted ellipse"
              phase: "mitotic (bright and compact) or interphase: a heuristic"

      - id: "646b0f3c1e4a2d7f8e5b8f0a"
        data_collection_tag: "multi_sample_samples"
        description: "Sample sheet: one row per store"
        config:
          type: "Table"
          metatype: "Metadata"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/bioimage_examples/data/multi_sample/samples.csv"
          dc_specific_properties:
            format: "CSV"
            polars_kwargs:
              separator: ","
            columns_description:
              sample: "Sample name, equal to the store name without .zarr"
              condition: "Demo condition label"
              replicate: "Replicate number within the condition"
              tissue: "Sample type"
              stain: "Stained structure"
              crop_y: "Crop origin row in the source image"
              crop_x: "Crop origin column in the source image"
              n_cells: "Nuclei segmented in the sample"
              mitotic_fraction: "Share of nuclei called mitotic"

      # ----------------------------------------------------------------
      # 5. OME-TIFF: one pyramidal file, read with HTTP Range requests
      # ----------------------------------------------------------------
      - id: "646b0f3c1e4a2d7f8e5b8f0b"
        data_collection_tag: "lily_stem_image"
        description: "Lily of the valley stem, 2-channel confocal fluorescence, pyramidal OME-TIFF (480 x 480)"
        config:
          type: "bioimage"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/bioimage_examples/data/lily_stem.ome.tif"
          dc_specific_properties:
            format: "ome-tiff"
            upload: true

      - id: "646b0f3c1e4a2d7f8e5b8f0c"
        data_collection_tag: "lily_stem_cells"
        description: "Plant cells segmented between the cell walls of the lily stem"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/bioimage_examples/data/lily_stem_cells.csv"
          dc_specific_properties:
            format: "CSV"
            polars_kwargs:
              separator: ","
            columns_description:
              cell_id: "Cell identifier"
              sample: "File the cell belongs to (lily_stem)"
              x: "Centroid column, level-0 pixels"
              y: "Centroid row, level-0 pixels"
              area_px: "Lumen area in pixels"
              area_um2: "Lumen area in square micrometres"
              mean_ch1: "Mean Ch1 intensity over the lumen and its wall"
              mean_ch2: "Mean Ch2 intensity over the lumen and its wall"
              wall_type: "thick-walled (bright Ch2 wall) or thin-walled: a heuristic"

      # ----------------------------------------------------------------
      # 6. SpatialData: an H&E image, spots, nuclei and a table in one store
      # ----------------------------------------------------------------
      # Only the image element at image_path is shown (and uploaded); the spot
      # table the viewer and filters read is the CSV export below. The store is
      # zarr v3, its image NGFF 0.5 (spatialdata's default formats).
      - id: "646b0f3c1e4a2d7f8e5b8f0d"
        data_collection_tag: "skin_spatialdata_image"
        description: "Skin section, H&E (RGB, 640 x 896), the image element of a SpatialData store"
        config:
          type: "bioimage"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/bioimage_examples/data/skin_spatialdata.zarr"
          dc_specific_properties:
            format: "spatialdata"
            image_path: "images/he"
            ngff_version: "0.5"
            upload: true

      - id: "646b0f3c1e4a2d7f8e5b8f0e"
        data_collection_tag: "skin_spatialdata_spots"
        description: "Visium-like spots of the SpatialData store, read from its AnnData table, with synthetic counts"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/bioimage_examples/data/skin_spatialdata.zarr"
          dc_specific_properties:
            # Read straight from the store: obs columns, x/y from obsm["spatial"]
            # converted to images/he pixels, and the four genes from X.
            format: "spatialdata"
            spatialdata:
              table: "tables/table"
              image: "images/he"
              genes: ["gene_A", "gene_B", "gene_C", "gene_D"]
            columns_description:
              spot_id: "Spot identifier (instance key of the store's table)"
              sample: "Store the spot belongs to (skin_spatialdata)"
              x: "Spot centre column, level-0 pixels"
              y: "Spot centre row, level-0 pixels"
              cluster: "k-means cluster on hematoxylin, eosin and nuclear density (C1 = most hematoxylin)"
              n_nuclei: "Nuclei of the store's points element under the spot"
              total_counts: "Sum of the four synthetic gene counts (obs)"
              gene_A: "Synthetic count, follows hematoxylin"
              gene_B: "Synthetic count, follows eosin"
              gene_C: "Synthetic count, follows nuclear density"
              gene_D: "Synthetic count, top-to-bottom gradient"

      # ----------------------------------------------------------------
      # 7. NGFF 0.5 (sharded): zarr v3, each shard file holds many chunks
      # ----------------------------------------------------------------
      # The viewer reads a shard's index, then each chunk it needs, with HTTP
      # Range requests. The id pair is not contiguous: 8f10 to 8f15 are the
      # dashboards of this project.
      - id: "646b0f3c1e4a2d7f8e5b8f0f"
        data_collection_tag: "lily_sharded_image"
        description: "Lily of the valley stem, 3-channel confocal fluorescence, 12-bit, OME-Zarr NGFF 0.5 with sharded arrays (512 x 512)"
        config:
          type: "bioimage"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/bioimage_examples/data/lily_sharded.zarr"
          dc_specific_properties:
            format: "ome-zarr"
            ngff_version: "0.5"
            upload: true

      - id: "646b0f3c1e4a2d7f8e5b8f16"
        data_collection_tag: "lily_sharded_cells"
        description: "Plant cells segmented between the cell walls of the sharded lily stem store"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/bioimage_examples/data/lily_sharded_cells.csv"
          dc_specific_properties:
            format: "CSV"
            polars_kwargs:
              separator: ","
            columns_description:
              cell_id: "Cell identifier"
              sample: "Store the cell belongs to (lily_sharded)"
              x: "Centroid column, level-0 pixels"
              y: "Centroid row, level-0 pixels"
              area_px: "Lumen area in pixels"
              area_um2: "Lumen area in square micrometres"
              mean_ch1: "Mean Ch1 intensity (12-bit) over the lumen and its wall"
              mean_ch2: "Mean Ch2 intensity (12-bit) over the lumen and its wall"
              mean_ch4: "Mean Ch4 intensity (12-bit) over the lumen and its wall"
              wall_type: "thick-walled (bright Ch2 wall) or thin-walled: a heuristic"

      # ----------------------------------------------------------------
      # 6. Remote: read in place from the EMBL-EBI IDR, not uploaded
      # ----------------------------------------------------------------
      - id: "646b0f3c1e4a2d7f8e5b8f17"
        data_collection_tag: "idr_laminb1_image"
        description: "IDR study idr0062A (nuclear segmentation), LaminB1 and Dapi, read from the EMBL-EBI IDR (OME-Zarr NGFF 0.4, 2 x 236 x 275 x 271)"
        config:
          type: "bioimage"
          dc_specific_properties:
            format: "ome-zarr"
            ngff_version: "0.4"
            upload: false
            remote_stores:
              - "https://uk1s3.embassy.ebi.ac.uk/idr/zarr/v0.4/idr0062A/6001240.zarr"

      # One row per nucleus of the plane the remote viewer opens on (z=118, 0-based),
      # from the store's labels/0 (dev/bioimage/make_idr_nuclei.py). Not read from the IDR.
      - id: "646b0f3c1e4a2d7f8e5b8f19"
        data_collection_tag: "idr_laminb1_nuclei"
        description: "Nuclei of IDR idr0062A on the plane the viewer opens on: centroid, area, mean LaminB1 and Dapi"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/bioimage_examples/data/idr_laminb1_nuclei.csv"
          dc_specific_properties:
            format: "CSV"
            polars_kwargs:
              separator: ","
            columns_description:
              nucleus_id: "Label value of the nucleus in the store's labels/0"
              x: "Centroid column, level-0 pixels"
              y: "Centroid row, level-0 pixels"
              area_px: "Pixels of the nucleus on this plane"
              lamin_b1_mean: "Mean LaminB1 intensity under the nucleus (raw counts)"
              dapi_mean: "Mean Dapi intensity under the nucleus (raw counts)"

      # ----------------------------------------------------------------
      # 7. HCS plate: one OME-Zarr store, one image per well (NGFF plate)
      # ----------------------------------------------------------------
      - id: "646b0f3c1e4a2d7f8e5b8f20"
        data_collection_tag: "hcs_plate_image"
        description: "Synthetic 2 x 3 plate, one field per well, DNA and GFP (OME-Zarr NGFF 0.4 plate)"
        config:
          type: "bioimage"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/bioimage_examples/data/hcs_plate.zarr"
          dc_specific_properties:
            format: "ome-zarr"
            ngff_version: "0.4"
            upload: true

      - id: "646b0f3c1e4a2d7f8e5b8f21"
        data_collection_tag: "hcs_wells"
        description: "One row per well: treatment, dose and per-well readouts"
        config:
          type: "Table"
          metatype: "Metadata"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/bioimage_examples/data/hcs_wells.csv"
          dc_specific_properties:
            format: "CSV"
            polars_kwargs:
              separator: ","
            columns_description:
              well: "Well name (row letter, column number), as the plate names it"
              row: "Plate row"
              column: "Plate column"
              treatment: "Compound and dose of the column"
              dose_um: "Dose in micromolar"
              n_cells: "Cells in the well's field"
              gfp_mean: "Mean GFP of the well's cells"

      - id: "646b0f3c1e4a2d7f8e5b8f22"
        data_collection_tag: "hcs_cells"
        description: "One row per cell of the plate, with its well and field coordinates"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/bioimage_examples/data/hcs_cells.csv"
          dc_specific_properties:
            format: "CSV"
            polars_kwargs:
              separator: ","
            columns_description:
              cell_id: "Cell identifier, unique across the plate"
              well: "Well the cell is in"
              x: "Centroid column, level-0 pixels of the well's field"
              y: "Centroid row, level-0 pixels of the well's field"
              area_px: "Cell area in pixels"
              dna_mean: "Mean DNA intensity"
              gfp_mean: "Mean GFP intensity"

      # ----------------------------------------------------------------
      # 8. Shape gallery: one store per axis layout, one off the spec
      # ----------------------------------------------------------------
      - id: "646b0f3c1e4a2d7f8e5b8f23"
        data_collection_tag: "shape_gallery_images"
        description: "Small synthetic stores, one per axis layout (YX to TCZYX, float32, 8 channels) and one with axes off the NGFF spec"
        config:
          type: "bioimage"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: "shape_[a-z0-9]+\\.zarr"
          dc_specific_properties:
            format: "ome-zarr"
            ngff_version: "0.4"
            upload: true

      - id: "646b0f3c1e4a2d7f8e5b8f24"
        data_collection_tag: "shape_gallery_sheet"
        description: "One row per shape store: axes, shape, dtype and what it exercises"
        config:
          type: "Table"
          metatype: "Metadata"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/bioimage_examples/data/shapes/shapes.csv"
          dc_specific_properties:
            format: "CSV"
            polars_kwargs:
              separator: ","
            columns_description:
              sample: "Store name without .zarr"
              axes: "Axis order of the store"
              shape: "Array shape, in axis order"
              dtype: "Pixel type"
              note: "What the store exercises in the viewer"

      # ----------------------------------------------------------------
      # 9. Registration: the steps of an image registration, per sample
      # ----------------------------------------------------------------
      # One store per sample and step (and the fixed image of each sample). No
      # sample_pattern: every store stays its own sample name, which is what the
      # steps table's `store` column points at.
      - id: "646b0f3c1e4a2d7f8e5b8f27"
        data_collection_tag: "registration_images"
        description: "Synthetic registration of two samples: the fixed image and the moving image resampled after each step (raw, rigid, affine, B-spline), 384 x 384, 2 channels"
        config:
          type: "bioimage"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: "embryo_[a-z]+_(?:fixed|raw|rigid|affine|bspline)\\.zarr"
          dc_specific_properties:
            format: "ome-zarr"
            ngff_version: "0.4"
            upload: true

      - id: "646b0f3c1e4a2d7f8e5b8f28"
        data_collection_tag: "registration_steps"
        description: "One row per sample and registration step: the store it wrote, the fixed image, and its quality metrics"
        config:
          type: "Table"
          metatype: "Metadata"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/bioimage_examples/data/registration/registration_steps.csv"
          dc_specific_properties:
            format: "CSV"
            polars_kwargs:
              separator: ","
            columns_description:
              sample: "Sample the registration belongs to"
              step: "Registration step: raw (none), rigid, affine or bspline"
              step_order: "Position of the step, 0 for the uncorrected image"
              transform: "Kind of transform fitted at the step"
              store: "Store in the image collection holding the moving image after the step"
              fixed_store: "Store of the fixed image the step aligns to"
              ncc: "Normalised cross-correlation of channel 0 against the fixed image (1 is identical)"
              tre_px: "Mean target registration error over 20 landmarks, in pixels"
              folding_pct: "Share of pixels where the Jacobian determinant of the step's displacement is <= 0 (folding)"
              runtime_s: "Synthetic runtime of the step, in seconds"

      # ----------------------------------------------------------------
      # 10. CLEM: one HeLa cell, FIB-SEM read in place, LM registered into it
      # ----------------------------------------------------------------
      # Two stores in one DC: the EM volume read in place from the BioImage
      # Archive (EMPIAR-10819, bioformats2raw) and the light microscopy
      # resampled into its frame (dev/bioimage/make_clem_example.py), which the
      # viewer lays over the EM as an overlay.
      - id: "646b0f3c1e4a2d7f8e5b8f2a"
        data_collection_tag: "clem_images"
        description: "One HeLa cell: its FIB-SEM volume (EMPIAR-10819, 5 nm, read in place) and its light microscopy (DAPI, mitochondria, Golgi, lysosomes) registered into the EM frame"
        config:
          type: "bioimage"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
