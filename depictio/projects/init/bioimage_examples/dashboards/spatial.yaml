# Visium-like spatial: one tab of the bioimage examples.
#
# Regenerate the seed after editing:
#   uv run python -m depictio.dev_scripts.generate_dashboard_seeds bioimage_examples
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Spatial spots'
subtitle: 'Visium-like spots over an immunohistochemistry section'
icon: 'mdi:map-marker-outline'
icon_color: 'orange'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8f10'
is_main_tab: false
tab_order: 1
parent_dashboard_tag: fluorescence
tab_icon: 'mdi:map-marker-outline'
tab_icon_color: 'orange'

filter_sections:
  - name: 'Spots'
    icon: 'mdi:filter-variant'
    color: 'orange'
    description: 'Narrows the spots drawn over the tissue, the table and the cards'

grid_sections:
  - name: 'Tissue spots'
    icon: 'mdi:counter'
    color: 'orange'
    description: 'The spots under the tissue in numbers'
  - name: 'Tissue'
    icon: 'mdi:map-marker-outline'
    color: 'orange'
    description: 'The stained section with one point per spot; lasso spots to filter the table'

components:
  - tag: text-spatial
    index: omz-sp-text
    component_type: text
    title: 'Spatial spots over tissue'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Tissue spots'
    body: >
      Colonic glands stained for FHL2 (brown, DAB) with a hematoxylin counterstain (blue),
      overlaid with spots laid out like a Visium slide. Clusters group spots by their stain
      intensities, so C1 sits on the most DAB-positive tissue. The three gene counts are
      synthetic: gene_A follows DAB, gene_B follows hematoxylin, gene_C a left-to-right
      gradient. Pick clusters on the left, or lasso a region of the tissue.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: card-spatial-spots
    index: omz-sp-card-count
    component_type: card
    section: 'Tissue spots'
    workflow_tag: python/bioimage_demo
    data_collection_tag: ihc_spatial_spots
    aggregation: count
    column_name: spot_id
    column_type: object
    icon_name: mdi:counter
    title_font_size: md
    value_font_size: xl
    title: 'Spots under tissue'
    layout: { x: 0, y: 2, w: 2, h: 2 }

  - tag: card-spatial-clusters
    index: omz-sp-card-clusters
    component_type: card
    section: 'Tissue spots'
    workflow_tag: python/bioimage_demo
    data_collection_tag: ihc_spatial_spots
    aggregation: nunique
    column_name: cluster
    column_type: object
    secondary_layout: donut
    breakdown_col: cluster
    top_n_count: 4
    icon_name: mdi:chart-donut
    title_font_size: md
    value_font_size: xl
    title: 'Clusters'
    layout: { x: 2, y: 2, w: 2, h: 2 }

  - tag: card-spatial-gene-a
    index: omz-sp-card-gene-a
    component_type: card
    section: 'Tissue spots'
    workflow_tag: python/bioimage_demo
    data_collection_tag: ihc_spatial_spots
    aggregation: median
    secondary_layout: histogram
    column_name: gene_A
    column_type: int64
    icon_name: mdi:chart-histogram
    title_font_size: md
    value_font_size: xl
    title: 'gene_A counts'
    layout: { x: 4, y: 2, w: 2, h: 2 }

  - tag: card-spatial-gene-b
    index: omz-sp-card-gene-b
    component_type: card
    section: 'Tissue spots'
    workflow_tag: python/bioimage_demo
    data_collection_tag: ihc_spatial_spots
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: gene_B
    column_type: int64
    icon_name: mdi:chart-box-outline
    title_font_size: md
    value_font_size: xl
    title: 'gene_B counts'
    layout: { x: 6, y: 2, w: 2, h: 2 }

  - tag: viz-spatial
    index: omz-sp-viewer
    component_type: advanced_viz
    workflow_tag: python/bioimage_demo
    data_collection_tag: ihc_spatial_image
    title: 'Colonic glands, IHC'
    description: 'RGB brightfield section (nominal 0.5 um pixels). Points are spots, coloured by cluster.'
    section: 'Tissue'
    viz_kind: bioimage_viewer
    config:
      viz_kind: bioimage_viewer
      image_dc_tag: ihc_spatial_image
      image_wf_id: '646b0f3c1e4a2d7f8e5b8f01'
      image_dc_id: '646b0f3c1e4a2d7f8e5b8f04'
      points_dc_tag: ihc_spatial_spots
      points_wf_id: '646b0f3c1e4a2d7f8e5b8f01'
      points_dc_id: '646b0f3c1e4a2d7f8e5b8f05'
      cell_id_col: spot_id
      x_col: x
      y_col: y
      color_col: cluster
      points_sample_col: sample
      point_radius: 5
      show_scalebar: true
      selection_enabled: true
    layout: { x: 0, y: 0, w: 8, h: 9 }

  - tag: table-spatial-spots
    index: omz-sp-table
    component_type: table
    section: 'Tissue'
    workflow_tag: python/bioimage_demo
    data_collection_tag: ihc_spatial_spots
    title: 'Spots'
    description: 'One row per spot. A lasso on the tissue narrows it to the spots inside.'
    columns: [spot_id, cluster, gene_A, gene_B, gene_C]
    page_size: 50
    layout: { x: 0, y: 9, w: 8, h: 5 }

  - tag: filter-spatial-cluster
    index: omz-sp-f-cluster
    component_type: interactive
    workflow_tag: python/bioimage_demo
    data_collection_tag: ihc_spatial_spots
    interactive_component_type: MultiSelect
    column_name: cluster
    column_type: object
    title: 'Cluster'
    placement: left
    section: 'Spots'
    group: 'Spot filters'
    display:
      title_size: md
      icon_name: 'mdi:shape-outline'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-spatial-gene-a
    index: omz-sp-f-gene-a
    component_type: interactive
    workflow_tag: python/bioimage_demo
    data_collection_tag: ihc_spatial_spots
    interactive_component_type: RangeSlider
    column_name: gene_A
    column_type: int64
    title: 'gene_A counts'
    placement: left
    section: 'Spots'
    group: 'Spot filters'
    display:
      title_size: md
      icon_name: 'mdi:dna'
    layout: { x: 0, y: 3, w: 1, h: 3 }

  - tag: filter-spatial-gene-c
    index: omz-sp-f-gene-c
    component_type: interactive
    workflow_tag: python/bioimage_demo
    data_collection_tag: ihc_spatial_spots
    interactive_component_type: RangeSlider
    column_name: gene_C
    column_type: int64
    title: 'gene_C counts'
    placement: left
    section: 'Spots'
    group: 'Spot filters'
    display:
      title_size: md
      icon_name: 'mdi:dna'
    layout: { x: 0, y: 6, w: 1, h: 3 }
