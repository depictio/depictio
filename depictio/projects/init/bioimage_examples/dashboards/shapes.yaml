# Shape gallery: one tab of the bioimage examples.
#
# Regenerate the seed after editing:
#   uv run python -m depictio.dev_scripts.generate_dashboard_seeds bioimage_examples
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Shape gallery'
subtitle: 'Every axis layout the viewer reads, and one it refuses'
icon: 'mdi:axis-arrow'
icon_color: 'grape'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8f26'
is_main_tab: false
tab_order: 9
parent_dashboard_tag: fluorescence
tab_icon: 'mdi:axis-arrow'
tab_icon_color: 'grape'

filter_sections:
  - name: 'Store'
    icon: 'mdi:shape-outline'
    color: 'grape'
    description: 'The store picked here is the one the viewer opens'

grid_sections:
  - name: 'Gallery'
    icon: 'mdi:shape-outline'
    color: 'grape'
    description: 'One small store per axis layout'

components:
  - tag: text-shapes
    index: omz-shapes-text
    component_type: text
    title: 'One store per axis layout'
    order: 6
    alignment: left
    vertical_alignment: top
    section: 'Gallery'
    body: >
      Small synthetic OME-Zarr stores, one per layout NGFF allows: a single plane (YX),
      a stack (ZYX, a Z slider), a time series (TYX, a Time slider with play), every axis
      at once (TCZYX), float pixels (contrast from the data range) and eight channels (at
      most six show at once). The last one, shape_yxc, puts the channel axis after the
      spatial ones: the ingest's NGFF check flags it (the orange badge on the viewer) and
      the viewer says which axes it cannot draw, instead of failing silently.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-shapes
    index: omz-shapes-viewer
    component_type: advanced_viz
    workflow_tag: python/bioimage_demo
    data_collection_tag: shape_gallery_images
    title: 'Selected store'
    description: 'Pick a store on the left, or with the Sample picker of the viewer.'
    section: 'Gallery'
    viz_kind: bioimage_viewer
    config:
      viz_kind: bioimage_viewer
      image_dc_tag: shape_gallery_images
      image_wf_id: '646b0f3c1e4a2d7f8e5b8f01'
      image_dc_id: '646b0f3c1e4a2d7f8e5b8f23'
      store: shape_tczyx.zarr
      sample_dc_tag: shape_gallery_sheet
      sample_wf_id: '646b0f3c1e4a2d7f8e5b8f01'
      sample_dc_id: '646b0f3c1e4a2d7f8e5b8f24'
      sample_column: sample
      show_scalebar: true
    layout: { x: 0, y: 2, w: 8, h: 8 }

  - tag: table-shapes
    index: omz-shapes-sheet
    component_type: table
    section: 'Gallery'
    workflow_tag: python/bioimage_demo
    data_collection_tag: shape_gallery_sheet
    title: 'Stores'
    description: 'One row per store: its axes, shape, pixel type and what it exercises.'
    page_size: 10
    layout: { x: 0, y: 10, w: 8, h: 4 }

  - tag: filter-shapes-sample
    index: omz-shapes-f-sample
    component_type: interactive
    workflow_tag: python/bioimage_demo
    data_collection_tag: shape_gallery_sheet
    interactive_component_type: Select
    column_name: sample
    column_type: object
    title: 'Store'
    placement: left
    section: 'Store'
    display:
      title_size: md
      icon_name: 'mdi:axis-arrow'
    layout: { x: 0, y: 0, w: 1, h: 3 }
