# Registration: one tab of the bioimage examples.
#
# Regenerate the seed after editing:
#   uv run python -m depictio.dev_scripts.generate_dashboard_seeds bioimage_examples
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Registration'
subtitle: 'The steps of an image registration, each against the fixed image'
icon: 'mdi:layers-triple'
icon_color: 'orange'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8f29'
is_main_tab: false
tab_order: 6
parent_dashboard_tag: fluorescence
tab_icon: 'mdi:layers-triple'
tab_icon_color: 'orange'

filter_sections:
  - name: 'Sample'
    icon: 'mdi:test-tube'
    color: 'orange'
    description: 'The registration shown in the viewer and the table'

grid_sections:
  - name: 'Steps'
    icon: 'mdi:microscope'
    color: 'orange'
    description: 'One registration per sample: the image after each step, laid over the fixed image'
  - name: 'Quality'
    icon: 'mdi:chart-line'
    color: 'orange'
    description: 'Registration error and similarity at each step'

components:
  - tag: text-registration
    index: omz-reg-text
    component_type: text
    title: 'One registration, step by step'
    order: 6
    alignment: left
    vertical_alignment: top
    section: 'Steps'
    body: >
      Two synthetic samples, each registered in four steps as elastix or ANTs would do
      it: the raw moving image, then after a rigid, an affine and a B-spline transform.
      Pick a step in the viewer to see its output laid over the fixed image, with the
      step's metrics beside it. embryo_a improves at every step. embryo_b fails at the
      affine step: the shear is fitted the wrong way round, so it ends up further from
      the fixed image than after the rigid step, and the B-spline cannot fully recover
      and folds the image in one place. The plots draw both samples; the Sample filter
      narrows them and the viewer to one.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-registration
    index: omz-reg-viewer
    component_type: advanced_viz
    workflow_tag: python/bioimage_demo
    data_collection_tag: registration_images
    title: 'Registration steps'
    description: 'Each step of the selected sample: the moving image resampled into the fixed frame (384 x 384, nominal 0.5 um pixels), with the fixed image to compare it to.'
    section: 'Steps'
    viz_kind: bioimage_viewer
    config:
      viz_kind: bioimage_viewer
      image_dc_tag: registration_images
      image_wf_id: '646b0f3c1e4a2d7f8e5b8f01'
      image_dc_id: '646b0f3c1e4a2d7f8e5b8f27'
      steps_dc_tag: registration_steps
      steps_wf_id: '646b0f3c1e4a2d7f8e5b8f01'
      steps_dc_id: '646b0f3c1e4a2d7f8e5b8f28'
      steps_store_col: store
      steps_label_col: step
      steps_order_col: step_order
      steps_sample_col: sample
      steps_reference_col: fixed_store
      steps_metric_cols: [ncc, tre_px, folding_pct]
      show_scalebar: true
    layout: { x: 0, y: 2, w: 8, h: 9 }

  - tag: figure-registration-tre
    index: omz-reg-fig-tre
    component_type: figure
    section: 'Quality'
    workflow_tag: python/bioimage_demo
    data_collection_tag: registration_steps
    title: 'Target registration error'
    visu_type: line
    dict_kwargs:
      x: step_order
      y: tre_px
      color: sample
      markers: true
    layout: { x: 0, y: 11, w: 4, h: 4 }

  - tag: figure-registration-ncc
    index: omz-reg-fig-ncc
    component_type: figure
    section: 'Quality'
    workflow_tag: python/bioimage_demo
    data_collection_tag: registration_steps
    title: 'Normalised cross-correlation'
    visu_type: line
    dict_kwargs:
      x: step_order
      y: ncc
      color: sample
      markers: true
    layout: { x: 4, y: 11, w: 4, h: 4 }

  - tag: table-registration-steps
    index: omz-reg-steps
    component_type: table
    section: 'Quality'
    workflow_tag: python/bioimage_demo
    data_collection_tag: registration_steps
    title: 'Steps'
    description: 'One row per sample and step: the store it wrote and its metrics.'
    page_size: 10
    layout: { x: 0, y: 15, w: 8, h: 4 }

  - tag: filter-registration-sample
    index: omz-reg-f-sample
    component_type: interactive
    workflow_tag: python/bioimage_demo
    data_collection_tag: registration_steps
    interactive_component_type: Select
    column_name: sample
    column_type: object
    title: 'Sample'
    placement: left
    section: 'Sample'
    display:
      title_size: md
      icon_name: 'mdi:layers-triple'
    layout: { x: 0, y: 0, w: 1, h: 3 }
