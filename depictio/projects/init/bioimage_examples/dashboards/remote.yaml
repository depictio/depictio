# Remote: one tab of the bioimage examples, reading its store in place.
#
# Regenerate the seed after editing:
#   uv run python -m depictio.dev_scripts.generate_dashboard_seeds bioimage_examples
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
#
# The store is not uploaded: the API proxies its reads from the EMBL-EBI IDR, which
# the server reads only when DEPICTIO_BIOIMAGE_REMOTE_HTTPS_HOSTS lists its host
# (uk1s3.embassy.ebi.ac.uk). Without that, the tile says the host is not allow-listed.
title: 'Remote (IDR)'
subtitle: 'An OME-Zarr store read in place from the EMBL-EBI Image Data Resource'
icon: 'mdi:cloud-download-outline'
icon_color: 'blue'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8f18'
is_main_tab: false
tab_order: 7
parent_dashboard_tag: fluorescence
tab_icon: 'mdi:cloud-download-outline'
tab_icon_color: 'blue'

grid_sections:
  - name: 'Remote image'
    icon: 'mdi:cloud-outline'
    color: 'blue'
    description: 'Where the image comes from, and what the viewer reads'
  - name: 'Image'
    icon: 'mdi:microscope'
    color: 'blue'
    description: 'LaminB1 and Dapi channels, read in place; lasso nuclei to filter the table'
  - name: 'Nuclei'
    icon: 'mdi:counter'
    color: 'blue'
    description: 'The nuclei the viewer draws, in numbers and as a table'

components:
  - tag: text-remote
    index: omz-rm-text
    component_type: text
    title: 'Read in place from the IDR'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Remote image'
    body: >
      Study idr0062A of the Image Data Resource, a nuclear segmentation study, imaged in
      LaminB1 and Dapi. The viewer reads this OME-Zarr store (NGFF 0.4, three
      pyramid levels) through the Depictio API, chunk by chunk, as the image is panned.
      Nothing is copied to the server. The store also holds the authors' nucleus
      segmentation as a label image (labels/0, same geometry), drawn here as coloured
      outlines, one per nucleus, on the plane shown.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-remote
    index: omz-rm-viewer
    component_type: advanced_viz
    workflow_tag: python/bioimage_demo
    data_collection_tag: idr_laminb1_image
    title: 'IDR idr0062A, LaminB1 and Dapi'
    description: 'LaminB1 and Dapi channels of IDR study idr0062A, read remotely; the first view waits on the network. The dots are the nuclei of the plane the viewer opens on, and they stay put when the z slider moves.'
    section: 'Image'
    viz_kind: bioimage_viewer
    config:
      viz_kind: bioimage_viewer
      image_dc_tag: idr_laminb1_image
      image_wf_id: '646b0f3c1e4a2d7f8e5b8f01'
      image_dc_id: '646b0f3c1e4a2d7f8e5b8f17'
      points_dc_tag: idr_laminb1_nuclei
      points_wf_id: '646b0f3c1e4a2d7f8e5b8f01'
      points_dc_id: '646b0f3c1e4a2d7f8e5b8f19'
      cell_id_col: nucleus_id
      x_col: x
      y_col: y
      point_radius: 3
      selection_enabled: true
    layout: { x: 0, y: 2, w: 8, h: 6 }

  - tag: card-remote-nuclei
    index: omz-rm-card-count
    component_type: card
    section: 'Nuclei'
    workflow_tag: python/bioimage_demo
    data_collection_tag: idr_laminb1_nuclei
    aggregation: count
    column_name: nucleus_id
    column_type: int64
    icon_name: mdi:counter
    title_font_size: md
    value_font_size: xl
    title: 'Nuclei on this plane'
    layout: { x: 0, y: 0, w: 2, h: 2 }

  - tag: card-remote-area
    index: omz-rm-card-area
    component_type: card
    section: 'Nuclei'
    workflow_tag: python/bioimage_demo
    data_collection_tag: idr_laminb1_nuclei
    aggregation: median
    secondary_layout: histogram
    column_name: area_px
    column_type: int64
    icon_name: mdi:chart-histogram
    title_font_size: md
    value_font_size: xl
    title: 'Median area (px)'
    layout: { x: 2, y: 0, w: 2, h: 2 }

  - tag: table-remote-nuclei
    index: omz-rm-table
    component_type: table
    section: 'Nuclei'
    workflow_tag: python/bioimage_demo
    data_collection_tag: idr_laminb1_nuclei
    title: 'Nuclei'
    description: 'One row per nucleus on the plane. A lasso on the image narrows it to the nuclei inside.'
    columns: [nucleus_id, x, y, area_px, lamin_b1_mean, dapi_mean]
    page_size: 50
    layout: { x: 0, y: 2, w: 8, h: 5 }
