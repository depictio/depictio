# DA barplot (per contrast) — one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'DA barplot (per contrast)'
subtitle: 'Faceted top-N differentially-abundant taxa — one panel per contrast. Useful for side-by-side comparison.'
icon: 'mdi:chart-bar-stacked'
icon_color: 'pink'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d24'
is_main_tab: false
tab_order: 12
parent_dashboard_tag: volcano
tab_icon: 'mdi:chart-bar-stacked'
tab_icon_color: 'pink'

# Left-panel filter section. Deliberately not `persistent`: the 23 tabs of
# this family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Contrast scope'
    icon: 'mdi:filter-variant'
    color: 'pink'
    description: 'One contrast at a time, then the effect floor'

grid_sections:
  - name: 'Differential barplot'
    icon: 'mdi:chart-bar'
    color: 'pink'
    description: 'The same calls, drawn as a ranked bar chart'

components:
  - tag: text-da_barplot
    index: da-text
    component_type: text
    title: 'Differential abundance barplot'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Differential barplot'
    body: |
      The same ANCOM-BC table as the previous tab, drawn the way a differential-
      abundance figure usually is: top-N features by effect, bars signed by direction,
      one panel per contrast when more than one is selected. Where the volcano answers
      which features are significant, this one answers how large the differences are.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-da_barplot
    index: 'da-bar'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'ancombc_demo'
    title: 'DA barplot — faceted by contrast'
    description: 'Each panel shows the top-N taxa (by |lfc|) for one contrast. Bars coloured by direction; greyed when above the significance threshold.'
    section: 'Differential barplot'
    viz_kind: 'da_barplot'
    config:
      viz_kind: "da_barplot"
      feature_id_col: "feature_id"
      contrast_col: "contrast"
      lfc_col: "lfc"
      significance_col: "significance"
      label_col: "label"
      significance_threshold: 0.05
      top_n: 15
    layout: { x: 0, y: 2, w: 8, h: 8 }

  - tag: filter-da_barplot-contrast
    index: da-f-contrast
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'ancombc_demo'
    interactive_component_type: MultiSelect
    column_name: 'contrast'
    column_type: 'object'
    title: 'Contrast'
    placement: left
    section: 'Contrast scope'
    group: 'Call filters'
    display:
      title_size: md
      custom_color: '#E91E63'
      icon_name: 'mdi:bullseye-arrow'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-da_barplot-lfc
    index: da-f-lfc
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'ancombc_demo'
    interactive_component_type: RangeSlider
    column_name: 'lfc'
    column_type: 'float64'
    title: 'Log-fold change'
    placement: left
    section: 'Contrast scope'
    group: 'Call filters'
    display:
      title_size: md
      custom_color: '#1976D2'
      icon_name: 'mdi:trending-up'
    layout: { x: 0, y: 3, w: 1, h: 3 }
