# Pedigree: one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Pedigrees'
subtitle: 'Three families in the PED coding drawn as family trees: sex as the shape, affected status as the fill, a slash for a death.'
icon: 'mdi:family-tree'
icon_color: 'grape'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8f60'
is_main_tab: false
tab_order: 53
parent_dashboard_tag: volcano
tab_icon: 'mdi:family-tree'
tab_icon_color: 'grape'

# Left-panel filter section. Deliberately not `persistent`: the tabs of this
# family read different collections whose column names collide while their
# value domains do not overlap.
filter_sections:
  - name: 'Family scope'
    icon: 'mdi:filter-variant'
    color: 'grape'
    description: 'Restricts which families the trees and the table carry'

grid_sections:
  - name: 'Family trees'
    icon: 'mdi:family-tree'
    color: 'grape'
    description: 'Generations top to bottom, couples joined by a line, children hung from a sibship bar'
  - name: 'Individuals'
    icon: 'mdi:table'
    color: 'grape'
    description: 'The rows behind the trees, narrowed by the individuals picked on them'

components:
  - tag: text-pedigree
    index: ped-text
    component_type: text
    title: 'Pedigrees'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Family trees'
    body: >
      One row per individual with its father, mother, sex and affected status, as a PED file or
      an nf-core samplesheet writes them. A square is a male, a circle a female and a diamond a
      person of unknown sex; a filled symbol is affected, an open one unaffected and a hatched
      one of unknown status; a slash marks a death. The third family has no father in the table,
      so its children hang from the mother alone. Click an individual to narrow the table below
      to them. Input: the samplesheet of nf-core/raredisease or a PED file.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-pedigree
    index: 'ped-tree'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'pedigree_demo'
    title: 'Family trees'
    description: 'Each family on its own tree: founders on top, children under their parents; the outlined symbol is the individual picked.'
    section: 'Family trees'
    viz_kind: 'pedigree'
    config:
      viz_kind: "pedigree"
      individual_col: "individual"
      father_col: "father"
      mother_col: "mother"
      sex_col: "sex"
      status_col: "status"
      family_col: "family"
      label_col: "label"
      deceased_col: "deceased"
      show_labels: true
      selection_enabled: true
      selection_column: "individual"
    layout: { x: 0, y: 2, w: 8, h: 6 }

  - tag: table-pedigree
    index: 'ped-table'
    component_type: table
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'pedigree_demo'
    title: 'Individuals'
    section: 'Individuals'
    layout: { x: 0, y: 8, w: 8, h: 6 }

  - tag: filter-pedigree-family
    index: ped-f-family
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'pedigree_demo'
    interactive_component_type: MultiSelect
    column_name: 'family'
    column_type: 'object'
    title: 'Family'
    placement: left
    section: 'Family scope'
    group: 'Family filters'
    display:
      title_size: md
      icon_name: 'mdi:family-tree'
    layout: { x: 0, y: 0, w: 1, h: 3 }
