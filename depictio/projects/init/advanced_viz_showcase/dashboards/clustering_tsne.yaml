# Clustering: t-SNE — one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Clustering: t-SNE'
subtitle: 't-SNE on the same matrix (perplexity auto-clamped)'
icon: 'mdi:scatter-plot'
icon_color: 'grape'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d16'
is_main_tab: false
tab_order: 6
parent_dashboard_tag: volcano
tab_icon: 'mdi:scatter-plot'
tab_icon_color: 'grape'

# Left-panel filter section. Deliberately not `persistent`: the 23 tabs of
# this family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Projection scope'
    icon: 'mdi:filter-variant'
    color: 'grape'
    description: 'Restricts which points are drawn, not the projection itself'

grid_sections:
  - name: 't-SNE projection'
    icon: 'mdi:chart-scatter-plot'
    color: 'grape'
    description: 'Non-linear projection emphasising cluster separation'

components:
  - tag: text-clustering_tsne
    index: tsne-text
    component_type: text
    title: 't-SNE projection'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 't-SNE projection'
    body: |
      Like UMAP, a neighbourhood-preserving projection, but one that pushes clusters
      further apart and preserves even less global structure. Cluster sizes and inter-
      cluster distances are not interpretable here; membership is.
    layout: { x: 0, y: 0, w: 8, h: 1 }

  - tag: viz-clustering_tsne
    index: 'tsne-embedding'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'embedding_tsne'
    title: 't-SNE projection'
    description: 't-distributed Stochastic Neighbor Embedding (perplexity auto-clamped). Pre-computed (instant render).'
    section: 't-SNE projection'
    viz_kind: 'embedding'
    config:
      viz_kind: "embedding"
      sample_id_col: "sample_id"
      dim_1_col: "dim_1"
      dim_2_col: "dim_2"
      dim_3_col: "dim_3"
      cluster_col: "cluster"
      color_col: "color"
      point_size: 9
      show_density: false
    layout: { x: 0, y: 1, w: 8, h: 8 }

  - tag: filter-clustering_tsne-cluster
    index: tsne-f-cluster
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'embedding_tsne'
    interactive_component_type: MultiSelect
    column_name: 'cluster'
    column_type: 'object'
    title: 'Cluster'
    placement: left
    section: 'Projection scope'
    group: 'Point filters'
    display:
      title_size: md
      custom_color: '#8E44AD'
      icon_name: 'mdi:scatter-plot'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-clustering_tsne-color
    index: tsne-f-color
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'embedding_tsne'
    interactive_component_type: RangeSlider
    column_name: 'color'
    column_type: 'float64'
    title: 'Continuous value'
    placement: left
    section: 'Projection scope'
    group: 'Point filters'
    display:
      title_size: md
      custom_color: '#00BCD4'
      icon_name: 'mdi:blur'
    layout: { x: 0, y: 3, w: 1, h: 3 }
