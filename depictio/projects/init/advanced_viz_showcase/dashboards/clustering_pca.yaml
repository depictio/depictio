# Clustering: PCA — one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Clustering: PCA'
subtitle: 'Principal Component Analysis on the synthetic 90×200 feature matrix'
icon: 'mdi:atom'
icon_color: 'teal'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d12'
is_main_tab: false
tab_order: 4
parent_dashboard_tag: volcano
tab_icon: 'mdi:atom'
tab_icon_color: 'teal'

# Left-panel filter section. Deliberately not `persistent`: the 23 tabs of
# this family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Projection scope'
    icon: 'mdi:filter-variant'
    color: 'teal'
    description: 'Restricts which points are drawn, not the projection itself'

grid_sections:
  - name: 'PCA projection'
    icon: 'mdi:chart-scatter-plot'
    color: 'teal'
    description: 'Linear projection onto the first principal components'

components:
  - tag: text-clustering_pca
    index: pca-text
    component_type: text
    title: 'PCA projection'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'PCA projection'
    body: |
      A linear projection: axes are principal components, so distance along an axis
      means variance explained and the axes are directly comparable. This is the
      projection to trust when the question is how much structure there is, rather than
      what shape it has.
    layout: { x: 0, y: 0, w: 8, h: 1 }

  - tag: viz-clustering_pca
    index: 'pca-embedding'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'embedding_pca'
    title: 'PCA projection'
    description: 'Principal Component Analysis on the synthetic 90×80 sample×feature matrix. Pre-computed (instant render).'
    section: 'PCA projection'
    viz_kind: 'embedding'
    config:
      viz_kind: "embedding"
      sample_id_col: "sample_id"
      dim_1_col: "dim_1"
      dim_2_col: "dim_2"
      dim_3_col: "dim_3"
      cluster_col: "cluster"
      color_col: "color"
      point_size: 9
      show_density: false
      selection_enabled: true
    layout: { x: 0, y: 1, w: 8, h: 8 }

  - tag: filter-clustering_pca-cluster
    index: pca-f-cluster
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'embedding_pca'
    interactive_component_type: MultiSelect
    column_name: 'cluster'
    column_type: 'object'
    title: 'Cluster'
    placement: left
    section: 'Projection scope'
    group: 'Point filters'
    display:
      title_size: md
      custom_color: '#8E44AD'
      icon_name: 'mdi:scatter-plot'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-clustering_pca-color
    index: pca-f-color
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'embedding_pca'
    interactive_component_type: RangeSlider
    column_name: 'color'
    column_type: 'float64'
    title: 'Continuous value'
    placement: left
    section: 'Projection scope'
    group: 'Point filters'
    display:
      title_size: md
      custom_color: '#00BCD4'
      icon_name: 'mdi:blur'
    layout: { x: 0, y: 3, w: 1, h: 3 }
