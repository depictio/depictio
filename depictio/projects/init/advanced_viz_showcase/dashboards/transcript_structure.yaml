# Transcript structure: one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Isoforms of one gene'
subtitle: 'Isoforms of one gene stacked on a base-pair axis: exons as blocks, coding parts taller, introns as lines with strand chevrons, novel transcripts told apart from annotated ones. Splicing, not gene order.'
icon: 'mdi:chart-timeline-variant'
icon_color: 'grape'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d7c'
is_main_tab: false
tab_order: 39
parent_dashboard_tag: volcano
tab_icon: 'mdi:chart-timeline-variant'
tab_icon_color: 'grape'

# Left-panel filter section. Deliberately not `persistent`: the tabs of this
# family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Isoform scope'
    icon: 'mdi:filter-variant'
    color: 'grape'
    description: 'Restricts which genes, novelty classes and block types are drawn'

grid_sections:
  - name: 'Transcript structure'
    icon: 'mdi:chart-timeline-variant'
    color: 'grape'
    description: 'Isoforms of one gene, one lane per transcript'

components:
  - tag: text-transcript_structure
    index: ts-text
    component_type: text
    title: 'Isoforms of one gene'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Transcript structure'
    body: >
      One gene, one lane per isoform: exons are blocks, the coding part is drawn taller, the
      line between blocks is the intron and its chevrons give the strand. DPX1 opens with a
      skipped exon, an alternative first exon, an alternative 3' end, a retained intron and a
      novel isoform; the gene picker is in the header. Compare the Gene clusters tab, which
      draws whole genes as arrows along a contig. Input: bambu or StringTie GTF from
      nf-core/nanoseq or rnaseq, joined to per-transcript counts.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-transcript_structure
    index: 'ts-track'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'transcript_structure_demo'
    title: 'Isoform structures'
    description: 'Isoforms of the gene picked in the header. Lane colour is the novelty class, lane order and the bar on the right are the per-transcript expression. Colour scale and lane budget are in the settings.'
    section: 'Transcript structure'
    viz_kind: 'transcript_structure'
    config:
      viz_kind: "transcript_structure"
      controls_placement: "header"
      gene: "DPX1"
      transcript_id_col: "transcript_id"
      gene_id_col: "gene_id"
      chrom_col: "chrom"
      start_col: "start"
      end_col: "end"
      feature_col: "feature"
      strand_col: "strand"
      sample_col: "sample"
      gene_name_col: "gene_name"
      transcript_class_col: "transcript_class"
      expression_col: "expression"
      max_transcripts: 30
      exon_feature: "exon"
      cds_feature: "CDS"
      colour_by: "transcript_class"
      colour_scale: "Viridis"
    layout: { x: 0, y: 2, w: 8, h: 9 }

  - tag: filter-transcript_structure-gene
    index: ts-f-gene
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'transcript_structure_demo'
    interactive_component_type: MultiSelect
    column_name: 'gene_name'
    column_type: 'object'
    title: 'Gene'
    placement: left
    section: 'Isoform scope'
    group: 'Isoform filters'
    display:
      title_size: md
      icon_name: 'mdi:dna'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-transcript_structure-class
    index: ts-f-class
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'transcript_structure_demo'
    interactive_component_type: MultiSelect
    column_name: 'transcript_class'
    column_type: 'object'
    title: 'Novelty class'
    placement: left
    section: 'Isoform scope'
    group: 'Isoform filters'
    display:
      title_size: md
      icon_name: 'mdi:shape-outline'
    layout: { x: 0, y: 3, w: 1, h: 3 }

  - tag: filter-transcript_structure-feature
    index: ts-f-feature
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'transcript_structure_demo'
    interactive_component_type: MultiSelect
    column_name: 'feature'
    column_type: 'object'
    title: 'Block type'
    placement: left
    section: 'Isoform scope'
    group: 'Isoform filters'
    display:
      title_size: md
      icon_name: 'mdi:swap-vertical'
    layout: { x: 0, y: 6, w: 1, h: 3 }
