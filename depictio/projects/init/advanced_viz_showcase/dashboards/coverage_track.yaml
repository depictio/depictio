# Coverage track — one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Coverage track'
subtitle: 'Read-depth signal along a coordinate axis (mosdepth-style). Multi-sample faceting + SARS-CoV-2 gene-region annotation lane.'
icon: 'mdi:chart-areaspline-variant'
icon_color: 'blue'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d46'
is_main_tab: false
tab_order: 22
parent_dashboard_tag: volcano
tab_icon: 'mdi:chart-areaspline-variant'
tab_icon_color: 'blue'

# Left-panel filter section. Deliberately not `persistent`: the 23 tabs of
# this family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Track scope'
    icon: 'mdi:filter-variant'
    color: 'blue'
    description: 'Restricts which lanes and which depth range are drawn'

grid_sections:
  - name: 'Coverage track'
    icon: 'mdi:chart-line'
    color: 'blue'
    description: 'Depth along a reference, one lane per sample'

components:
  - tag: text-coverage_track
    index: cov-text
    component_type: text
    title: 'Coverage track'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Coverage track'
    body: |
      Per-position depth along the reference, one lane per sample, with an annotation
      lane naming the regions underneath. A dropout reads as a gap in one lane; a region
      the assay never covers reads as a gap in all of them. The log axis in the settings
      menu is what makes both visible at once.
    layout: { x: 0, y: 0, w: 8, h: 1 }

  - tag: viz-coverage_track
    index: 'cov-track'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'coverage_track_demo'
    title: 'Coverage track'
    description: 'Read-depth tracks along the SARS-CoV-2 reference. Sample multi-select faceting, gene-region colouring lane, log/linear y-scale, rolling-mean smoothing — all live in the Settings ⚙ popover.'
    section: 'Coverage track'
    viz_kind: 'coverage_track'
    config:
      viz_kind: "coverage_track"
      chromosome_col: "chrom"
      position_col: "position"
      value_col: "coverage"
      end_col: "end"
      sample_col: "sample"
      category_col: "gene_region"
      y_scale: "linear"
      smoothing_window: 0
      color_by: "category"
      show_annotation_lane: true
    layout: { x: 0, y: 1, w: 8, h: 8 }

  - tag: filter-coverage_track-sample
    index: cov-f-sample
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'coverage_track_demo'
    interactive_component_type: MultiSelect
    column_name: 'sample'
    column_type: 'object'
    title: 'Sample'
    placement: left
    section: 'Track scope'
    group: 'Track filters'
    display:
      title_size: md
      custom_color: '#1976D2'
      icon_name: 'mdi:flask'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-coverage_track-region
    index: cov-f-region
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'coverage_track_demo'
    interactive_component_type: MultiSelect
    column_name: 'gene_region'
    column_type: 'object'
    title: 'Region'
    placement: left
    section: 'Track scope'
    group: 'Track filters'
    display:
      title_size: md
      custom_color: '#45B8AC'
      icon_name: 'mdi:map-marker-path'
    layout: { x: 0, y: 3, w: 1, h: 3 }

  - tag: filter-coverage_track-coverage
    index: cov-f-coverage
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'coverage_track_demo'
    interactive_component_type: RangeSlider
    column_name: 'coverage'
    column_type: 'float64'
    title: 'Depth'
    placement: left
    section: 'Track scope'
    group: 'Track filters'
    display:
      title_size: md
      custom_color: '#00BCD4'
      icon_name: 'mdi:chart-line'
    layout: { x: 0, y: 6, w: 1, h: 3 }
