# Coverage track: one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
#
# One tile, two views of one binding (`views: [track, locus]`): the smoothed
# Plotly track with the median and IQR ribbon, and the GenomeSpy locus track.
# This is what replaced binding coverage_track and genome_view on the same
# collection in one tab, which the shipped-YAML lint now forbids.
title: 'Viral genome coverage'
subtitle: 'Read depth along the SARS-CoV-2 reference, one lane per sample, with the gene regions underneath: amplicon dropouts and uncovered regions at a glance.'
icon: 'mdi:chart-areaspline-variant'
icon_color: 'blue'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d46'
is_main_tab: false
tab_order: 22
parent_dashboard_tag: volcano
tab_icon: 'mdi:chart-areaspline-variant'
tab_icon_color: 'blue'

# Left-panel filter section. Deliberately not `persistent`: the tabs of this
# family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Track scope'
    icon: 'mdi:filter-variant'
    color: 'blue'
    description: 'Restricts which lanes and which depth range are drawn'

grid_sections:
  - name: 'Coverage track'
    icon: 'mdi:chart-line'
    color: 'blue'
    description: 'Depth along a reference, one lane per sample'

components:
  - tag: text-coverage_track
    index: cov-text
    component_type: text
    title: 'Viral genome coverage'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Coverage track'
    body: >
      Depth along the SARS-CoV-2 reference, one lane per sample, with the gene regions
      underneath: a gap in one lane is an amplicon dropout, a gap in every lane is a region
      the panel never covers. The header switches between the smoothed Track (Plotly, with
      log scale and smoothing in the settings) and the zoomable Locus view (GenomeSpy). Input:
      the mosdepth per-bin depth of nf-core/viralrecon, sarek or rnaseq.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-coverage_track
    index: 'cov-track'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'coverage_track_demo'
    title: 'Depth per sample along the reference'
    description: 'mosdepth 200 bp bins across the SARS-CoV-2 reference, faceted by sample and coloured by gene region. Switch Track and Locus in the header; smoothing and the log axis are in the settings.'
    section: 'Coverage track'
    viz_kind: 'coverage_track'
    config:
      viz_kind: "coverage_track"
      controls_placement: "header"
      chromosome_col: "chrom"
      position_col: "position"
      value_col: "coverage"
      end_col: "end"
      sample_col: "sample"
      category_col: "gene_region"
      y_scale: "linear"
      smoothing_window: 0
      color_by: "category"
      show_annotation_lane: true
      view: "track"
      views: ["track", "locus"]
    layout: { x: 0, y: 2, w: 8, h: 8 }

  - tag: filter-coverage_track-sample
    index: cov-f-sample
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'coverage_track_demo'
    interactive_component_type: MultiSelect
    column_name: 'sample'
    column_type: 'object'
    title: 'Sample'
    placement: left
    section: 'Track scope'
    group: 'Track filters'
    display:
      title_size: md
      icon_name: 'mdi:flask'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-coverage_track-region
    index: cov-f-region
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'coverage_track_demo'
    interactive_component_type: MultiSelect
    column_name: 'gene_region'
    column_type: 'object'
    title: 'Gene region'
    placement: left
    section: 'Track scope'
    group: 'Track filters'
    display:
      title_size: md
      icon_name: 'mdi:map-marker-path'
    layout: { x: 0, y: 3, w: 1, h: 3 }

  - tag: filter-coverage_track-coverage
    index: cov-f-coverage
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'coverage_track_demo'
    interactive_component_type: RangeSlider
    column_name: 'coverage'
    column_type: 'float64'
    title: 'Depth'
    placement: left
    section: 'Track scope'
    group: 'Track filters'
    display:
      title_size: md
      icon_name: 'mdi:chart-line'
    layout: { x: 0, y: 6, w: 1, h: 3 }
