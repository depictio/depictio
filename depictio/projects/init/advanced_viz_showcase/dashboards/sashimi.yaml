# Alternative splicing (sashimi), one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Alternative splicing'
subtitle: 'Read coverage and splice junctions per sample over one gene: a cassette exon skipped in the knockdown.'
icon: 'mdi:dna'
icon_color: 'violet'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d75'
is_main_tab: false
tab_order: 33
parent_dashboard_tag: volcano
tab_icon: 'mdi:vector-curve'
tab_icon_color: 'cyan'

# Left-panel filter section. Deliberately not `persistent`: the tabs of this
# family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Junction scope'
    icon: 'mdi:filter-variant'
    color: 'violet'
    description: 'Restricts which lanes, which junction class and which read support are drawn'

grid_sections:
  - name: 'Splice junctions'
    icon: 'mdi:dna'
    color: 'violet'
    description: 'Junction arcs over a gene locus, one lane per sample'

components:
  - tag: text-sashimi
    index: sash-text
    component_type: text
    title: 'Alternative splicing'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Splice junctions'
    body: >
      A sashimi plot: per sample, read coverage as bars and every splice junction as a dome from
      donor to acceptor, its height and width set by the reads crossing it. In the knockdowns the
      dome from exon 2 straight to exon 4 rises while coverage over exon 3 drops: that exon is
      skipped. Drag or scroll to zoom, raise Min reads to hide weak junctions, switch to Arcs for
      the Plotly panel. Inputs are STAR SJ.out.tab junctions plus binned coverage, as written by
      nf-core/rnaseq, rnafusion and nanoseq (synthetic exons placed in CHD4, hg38).
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-sashimi
    index: 'sash-arcs'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'sashimi_demo'
    title: 'Splice junctions and coverage'
    description: 'Coverage bars and junction domes per sample over a cassette-exon locus, known and novel junctions coloured apart, with the inferred exon model and the hg38 gene lane underneath.'
    section: 'Splice junctions'
    viz_kind: 'sashimi'
    config:
      viz_kind: "sashimi"
      chr_col: "chrom"
      start_col: "start"
      end_col: "end"
      count_col: "count"
      sample_col: "sample"
      annotation_col: "annotation"
      min_count: 1
      top_n: 25
      log_width: true
      max_arc_width: 3
      # Opens on the GenomeSpy view; the header switch goes back to the
      # Plotly arc panel. The gene lane and the axis come from hg38.
      view: "genomespy"
      views: ["genomespy", "plotly"]
      annotation: "hg38"
      controls_placement: "header"
      # Real read depth, from a second collection. The junction table counts
      # spliced reads only, so the exon support the renderer can infer from it
      # is an estimate; this is the measurement. The tag is what a dashboard
      # import resolves; the id is this project's static one, which the seed
      # path (no import step) needs to find the collection at all.
      coverage_dc_tag: "sashimi_coverage_demo"
      coverage_dc_id: "646b0f3c1e4a2d7f8e5b8d87"
      coverage_chr_col: "chromosome"
      coverage_position_col: "position"
      coverage_end_col: "end"
      coverage_value_col: "depth"
      coverage_sample_col: "sample"
      show_coverage: true
      coverage_height: 0.6
    layout: { x: 0, y: 2, w: 8, h: 8 }

  - tag: filter-sashimi-sample
    index: sash-f-sample
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'sashimi_demo'
    interactive_component_type: MultiSelect
    column_name: 'sample'
    column_type: 'object'
    title: 'Sample'
    placement: left
    section: 'Junction scope'
    group: 'Junction filters'
    display:
      title_size: md
      custom_color: '#7950F2'
      icon_name: 'mdi:flask'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-sashimi-annotation
    index: sash-f-annotation
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'sashimi_demo'
    interactive_component_type: MultiSelect
    column_name: 'annotation'
    column_type: 'object'
    title: 'Junction class'
    placement: left
    section: 'Junction scope'
    group: 'Junction filters'
    display:
      title_size: md
      custom_color: '#45B8AC'
      icon_name: 'mdi:dna'
    layout: { x: 0, y: 3, w: 1, h: 3 }

  - tag: filter-sashimi-count
    index: sash-f-count
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'sashimi_demo'
    interactive_component_type: RangeSlider
    column_name: 'count'
    column_type: 'int64'
    title: 'Read support'
    placement: left
    section: 'Junction scope'
    group: 'Junction filters'
    display:
      title_size: md
      custom_color: '#00BCD4'
      icon_name: 'mdi:counter'
    layout: { x: 0, y: 6, w: 1, h: 3 }
