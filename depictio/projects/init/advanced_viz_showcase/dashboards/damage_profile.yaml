# Damage profile: one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Damage profile'
subtitle: 'Ancient-DNA misincorporation frequency for 2 synthetic samples: C>T enriched at the 5-prime end, G>A at the 3-prime end, both decaying from ~0.3 at position 1.'
icon: 'mdi:dna'
icon_color: 'red'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d79'
is_main_tab: false
tab_order: 37
parent_dashboard_tag: volcano
tab_icon: 'mdi:dna'
tab_icon_color: 'red'

# Left-panel filter section. Deliberately not `persistent`: the tabs of this
# family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Profile scope'
    icon: 'mdi:filter-variant'
    color: 'red'
    description: 'Restricts which sample curves are drawn'

grid_sections:
  - name: 'Misincorporation profile'
    icon: 'mdi:dna'
    color: 'red'
    description: 'Substitution frequency by distance from the read end, 5-prime and 3-prime panels'

components:
  - tag: text-damage-profile
    index: dmg-text
    component_type: text
    title: 'Damage profile'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Misincorporation profile'
    body: >
      The classic aDNA deamination signature: C>T rises toward the 5' read end and G>A rises
      toward the 3' end, both starting near 0.3 at position 1 and decaying to background within
      about 10 bp. Every other substitution class sits flat near background throughout, which is
      what the highlighted lines are picked out against. Which ends to show, how far to draw, and
      which substitutions to highlight all live in the Settings ⚙ popover.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-damage-profile
    index: 'dmg-curve'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'damage_profile_demo'
    title: 'Misincorporation profile'
    description: '5-prime and 3-prime substitution frequency by position, 2 samples, C-to-T and G-to-A highlighted. Ends, max position and highlighted substitutions live in the Settings ⚙ popover.'
    section: 'Misincorporation profile'
    viz_kind: 'damage_profile'
    config:
      viz_kind: "damage_profile"
      sample_col: "sample"
      end_col: "end"
      position_col: "position"
      base_change_col: "base_change"
      frequency_col: "frequency"
      ends: "both"
      max_position: 25
      highlight: ["C>T", "G>A"]
    layout: { x: 0, y: 2, w: 8, h: 8 }

  - tag: filter-damage-profile-sample
    index: dmg-f-sample
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'damage_profile_demo'
    interactive_component_type: MultiSelect
    column_name: 'sample'
    column_type: 'object'
    title: 'Sample'
    placement: left
    section: 'Profile scope'
    group: 'Profile filters'
    display:
      title_size: md
      custom_color: '#E03131'
      icon_name: 'mdi:test-tube'
    layout: { x: 0, y: 0, w: 1, h: 3 }
