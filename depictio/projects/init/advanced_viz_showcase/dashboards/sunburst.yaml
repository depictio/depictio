# Sunburst — one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Sunburst'
subtitle: 'Hierarchical taxonomic composition'
icon: 'mdi:weather-sunny'
icon_color: 'orange'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d44'
is_main_tab: false
tab_order: 20
parent_dashboard_tag: volcano
tab_icon: 'mdi:weather-sunny'
tab_icon_color: 'orange'

# Left-panel filter section. Deliberately not `persistent`: the 23 tabs of
# this family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Taxonomic scope'
    icon: 'mdi:filter-variant'
    color: 'orange'
    description: 'Restricts which lineages the rings are built from'

grid_sections:
  - name: 'Hierarchy'
    icon: 'mdi:chart-donut'
    color: 'orange'
    description: 'The taxonomy as concentric rings, drillable in place'

components:
  - tag: text-sunburst
    index: sun-text
    component_type: text
    title: 'Sunburst'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Hierarchy'
    body: >
      The same taxonomy the stacked bars show, drawn as concentric rings from kingdom
      outwards. Clicking a wedge zooms into it rather than filtering the dashboard, so it is
      a way to read the hierarchy rather than to select from it. The left panel is what
      narrows the other tiles.
    layout: { x: 0, y: 0, w: 8, h: 1 }

  - tag: viz-sunburst
    index: 'sun-plot'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'stacked_taxonomy_demo'
    title: 'Taxonomic sunburst'
    description: 'Hierarchical taxonomic composition — Kingdom → Genus, arc size = abundance.'
    section: 'Hierarchy'
    viz_kind: 'sunburst'
    config:
      viz_kind: "sunburst"
      rank_cols: ["Kingdom", "Phylum", "Class", "Order", "Family", "Genus"]
      abundance_col: "abundance"
    layout: { x: 0, y: 1, w: 8, h: 8 }

  - tag: filter-sunburst-phylum
    index: sun-f-phylum
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'stacked_taxonomy_demo'
    interactive_component_type: MultiSelect
    column_name: 'Phylum'
    column_type: 'object'
    title: 'Phylum'
    placement: left
    section: 'Taxonomic scope'
    group: 'Taxonomy'
    display:
      title_size: md
      custom_color: '#F68B33'
      icon_name: 'mdi:bacteria'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-sunburst-genus
    index: sun-f-genus
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'stacked_taxonomy_demo'
    interactive_component_type: MultiSelect
    column_name: 'Genus'
    column_type: 'object'
    title: 'Genus'
    placement: left
    section: 'Taxonomic scope'
    group: 'Taxonomy'
    display:
      title_size: md
      custom_color: '#2E7D32'
      icon_name: 'mdi:bacteria'
    layout: { x: 0, y: 3, w: 1, h: 3 }
