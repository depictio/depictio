# Sample PCA: one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Sample PCA'
subtitle: 'Bulk RNA-seq samples on their first two principal components'
icon: 'mdi:chart-scatter-plot'
icon_color: 'violet'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8df3'
is_main_tab: false
tab_order: 51
parent_dashboard_tag: volcano
tab_icon: 'mdi:flask-outline'
tab_icon_color: 'violet'

# Left-panel filter section. Deliberately not `persistent`, like the other
# tabs of this family.
filter_sections:
  - name: 'Sample scope'
    icon: 'mdi:filter-variant'
    color: 'violet'
    description: 'Restricts which samples are drawn'

grid_sections:
  - name: 'Sample PCA'
    icon: 'mdi:chart-scatter-plot'
    color: 'violet'
    description: 'One large point per sample, coloured by disease state'

components:
  - tag: text-sample_pca
    index: spca-text
    component_type: text
    title: 'Sample PCA'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Sample PCA'
    body: >
      Eighty bulk RNA-seq samples in four disease states, one large point per sample on PC1 and
      PC2 of the normalised counts. With few points a big marker reads at a glance; Colour by
      switches to the sequencing batch. Input: the PCA table of an nf-core/rnaseq or
      nf-core/differentialabundance QC report.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-sample_pca
    index: 'spca-embedding'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'sample_pca_demo'
    title: 'Samples by disease state (PCA)'
    description: 'One point per sample on the first two principal components, coloured by disease state.'
    section: 'Sample PCA'
    viz_kind: 'embedding'
    config:
      viz_kind: "embedding"
      sample_id_col: "sample_id"
      dim_1_col: "PC1"
      dim_2_col: "PC2"
      cluster_col: "group"
      point_size: 25
      plot_style: "default"
      show_density: false
      selection_enabled: true
      controls_placement: "header"
    layout: { x: 0, y: 2, w: 8, h: 9 }

  - tag: filter-sample_pca-group
    index: spca-f-group
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'sample_pca_demo'
    interactive_component_type: MultiSelect
    column_name: 'group'
    column_type: 'object'
    title: 'Disease state'
    placement: left
    section: 'Sample scope'
    group: 'Samples'
    display:
      title_size: md
      custom_color: '#7E57C2'
      icon_name: 'mdi:flask-outline'
    layout: { x: 0, y: 0, w: 1, h: 3 }
