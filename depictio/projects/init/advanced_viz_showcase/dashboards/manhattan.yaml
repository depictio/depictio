# Manhattan — one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Manhattan'
subtitle: 'Generic chr/pos/score with threshold line, alternating bands and top-N locus labels'
icon: 'mdi:chart-line-stacked'
icon_color: 'orange'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d13'
is_main_tab: false
tab_order: 2
parent_dashboard_tag: volcano
tab_icon: 'mdi:chart-line-stacked'
tab_icon_color: 'orange'

# Left-panel filter section. Deliberately not `persistent`: the 23 tabs of
# this family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Scan scope'
    icon: 'mdi:filter-variant'
    color: 'orange'
    description: 'Restricts the scan to a region or a score range'

grid_sections:
  - name: 'Genome-wide scan'
    icon: 'mdi:chart-line'
    color: 'orange'
    description: 'Markers at their genomic position against significance'

components:
  - tag: text-manhattan
    index: man-text
    component_type: text
    title: 'Genome-wide scan'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Genome-wide scan'
    body: |
      Markers plotted at their genomic position against their score, with alternating
      bands separating the chromosomes and a threshold line across the plot. The peaks
      that clear the line are labelled by feature id. Restricting to one chromosome or
      raising the score floor on the left isolates a single locus.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-manhattan
    index: 'man-manhattan'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'manhattan_demo'
    title: 'Manhattan plot — chr × score'
    description: 'Per-chromosome significance with alternating bands and top-N locus labels. Tune the threshold line in Settings ⚙.'
    section: 'Genome-wide scan'
    viz_kind: 'manhattan'
    config:
      viz_kind: "manhattan"
      chr_col: "chr"
      pos_col: "pos"
      score_col: "score"
      feature_col: "feature"
      score_kind: "-log10(padj)"
      score_threshold: 5.0
      top_n_labels: 8
      # A Manhattan point is one feature at one locus, so the feature is what a
      # lasso is actually picking out. Unlike the embedding there is no default:
      # naming the wrong column here would emit a filter that silently matches
      # nothing, so the config has to say it out loud.
      selection_enabled: true
      selection_column: "feature"
    layout: { x: 0, y: 2, w: 8, h: 8 }

  - tag: filter-manhattan-chr
    index: man-f-chr
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'manhattan_demo'
    interactive_component_type: MultiSelect
    column_name: 'chr'
    column_type: 'object'
    title: 'Chromosome'
    placement: left
    section: 'Scan scope'
    group: 'Locus filters'
    display:
      title_size: md
      custom_color: '#F68B33'
      icon_name: 'mdi:dna'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-manhattan-score
    index: man-f-score
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'manhattan_demo'
    interactive_component_type: RangeSlider
    column_name: 'score'
    column_type: 'float64'
    title: 'Score'
    placement: left
    section: 'Scan scope'
    group: 'Locus filters'
    display:
      title_size: md
      custom_color: '#E74C3C'
      icon_name: 'mdi:chart-line'
    layout: { x: 0, y: 3, w: 1, h: 3 }
