# Differentially abundant taxa: one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Differentially abundant taxa'
subtitle: 'ANCOM-BC log fold changes of the top taxa, one panel per habitat contrast'
icon: 'mdi:chart-bar'
icon_color: 'red'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d23'
is_main_tab: false
tab_order: 11
parent_dashboard_tag: volcano
tab_icon: 'mdi:chart-bar'
tab_icon_color: 'red'

# Left-panel filter section. Deliberately not `persistent`: the 23 tabs of
# this family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Contrast scope'
    icon: 'mdi:filter-variant'
    color: 'red'
    description: 'One contrast at a time, then the effect and significance floors'

grid_sections:
  - name: 'Differential calls'
    icon: 'mdi:chart-bar'
    color: 'red'
    description: 'Log-fold change per feature, ranked and signed'

components:
  - tag: text-ancombc
    index: bc-text
    component_type: text
    title: 'ANCOM-BC results'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Differential calls'
    body: >
      ANCOM-BC results for three habitat contrasts, one panel per contrast: bars are the bias-
      corrected log fold change of the top taxa, signed by direction and greyed when the
      q-value misses the threshold. Top-N and the significance threshold sit in the tile
      header; the tabs inside the tile drill into one contrast. This is the differential
      abundance output of nf-core/ampliseq (ANCOM-BC through QIIME2).
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-ancombc
    index: 'bc-bar'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'ancombc_demo'
    title: 'Differential abundance (ANCOM-BC demo)'
    description: 'Top taxa by absolute log fold change per contrast, signed by direction, greyed above the q-value threshold. The tabs inside the tile drill into one contrast.'
    section: 'Differential calls'
    viz_kind: 'da_barplot'
    config:
      viz_kind: "da_barplot"
      feature_id_col: "feature_id"
      contrast_col: "contrast"
      lfc_col: "lfc"
      significance_col: "significance"
      label_col: "label"
      significance_threshold: 0.05
      top_n: 15
      contrast_view: "all"
      controls_placement: "header"
    layout: { x: 0, y: 2, w: 8, h: 9 }

  - tag: filter-ancombc-contrast
    index: bc-f-contrast
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'ancombc_demo'
    interactive_component_type: MultiSelect
    column_name: 'contrast'
    column_type: 'object'
    title: 'Contrast'
    placement: left
    section: 'Contrast scope'
    group: 'Call filters'
    display:
      title_size: md
      custom_color: '#E74C3C'
      icon_name: 'mdi:bullseye-arrow'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-ancombc-significance
    index: bc-f-significance
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'ancombc_demo'
    interactive_component_type: RangeSlider
    column_name: 'significance'
    column_type: 'float64'
    title: 'Significance'
    placement: left
    section: 'Contrast scope'
    group: 'Call filters'
    show_histogram: true
    display:
      title_size: md
      custom_color: '#F68B33'
      icon_name: 'mdi:target'
    layout: { x: 0, y: 3, w: 1, h: 3 }

  - tag: filter-ancombc-lfc
    index: bc-f-lfc
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'ancombc_demo'
    interactive_component_type: RangeSlider
    column_name: 'lfc'
    column_type: 'float64'
    title: 'Log-fold change'
    placement: left
    section: 'Contrast scope'
    group: 'Call filters'
    display:
      title_size: md
      custom_color: '#1976D2'
      icon_name: 'mdi:trending-up'
    layout: { x: 0, y: 6, w: 1, h: 3 }
