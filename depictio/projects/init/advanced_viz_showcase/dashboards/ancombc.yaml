# Differential abundance (with filters & cards) — one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Differential abundance (with filters & cards)'
subtitle: 'Signed-LFC horizontal bars of differentially-abundant taxa from an ANCOM-BC-style output. Use the contrast filter on the left or switch tabs in-viz to pick a contrast (or ''All'' for faceted side-by-side).'
icon: 'mdi:chart-bar'
icon_color: 'red'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d23'
is_main_tab: false
tab_order: 11
parent_dashboard_tag: volcano
tab_icon: 'mdi:chart-bar'
tab_icon_color: 'red'

# Left-panel filter section. Deliberately not `persistent`: the 23 tabs of
# this family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Contrast scope'
    icon: 'mdi:filter-variant'
    color: 'red'
    description: 'One contrast at a time, then the effect and significance floors'

grid_sections:
  - name: 'Differential calls'
    icon: 'mdi:chart-bar'
    color: 'red'
    description: 'Log-fold change per feature, ranked and signed'

components:
  - tag: text-ancombc
    index: bc-text
    component_type: text
    title: 'ANCOM-BC results'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Differential calls'
    body: >
      Compositionally corrected differential abundance, one row per feature and contrast.
      The bars are signed by direction and ordered by effect, so the two ends of the chart
      are the two directions of the comparison. Pick a contrast on the left first: every bar
      is conditional on it.
    layout: { x: 0, y: 0, w: 8, h: 1 }

  - tag: viz-ancombc
    index: 'bc-bar'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'ancombc_demo'
    title: 'Differential abundance (ANCOM-BC demo)'
    description: 'Top-N taxa by |lfc| per contrast. Bars are coloured by direction (blue = up, red = down). Bars with q > threshold are greyed out. Switch tabs to drill into a single contrast or use the ''All'' tab for faceted side-by-side comparison.'
    section: 'Differential calls'
    viz_kind: 'da_barplot'
    config:
      viz_kind: "da_barplot"
      feature_id_col: "feature_id"
      contrast_col: "contrast"
      lfc_col: "lfc"
      significance_col: "significance"
      label_col: "label"
      significance_threshold: 0.05
      top_n: 15
      contrast_view: "all"
    layout: { x: 0, y: 1, w: 8, h: 8 }

  - tag: filter-ancombc-contrast
    index: bc-f-contrast
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'ancombc_demo'
    interactive_component_type: MultiSelect
    column_name: 'contrast'
    column_type: 'object'
    title: 'Contrast'
    placement: left
    section: 'Contrast scope'
    group: 'Call filters'
    display:
      title_size: md
      custom_color: '#E74C3C'
      icon_name: 'mdi:bullseye-arrow'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-ancombc-significance
    index: bc-f-significance
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'ancombc_demo'
    interactive_component_type: RangeSlider
    column_name: 'significance'
    column_type: 'float64'
    title: 'Significance'
    placement: left
    section: 'Contrast scope'
    group: 'Call filters'
    display:
      title_size: md
      custom_color: '#F68B33'
      icon_name: 'mdi:target'
    layout: { x: 0, y: 3, w: 1, h: 3 }

  - tag: filter-ancombc-lfc
    index: bc-f-lfc
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'ancombc_demo'
    interactive_component_type: RangeSlider
    column_name: 'lfc'
    column_type: 'float64'
    title: 'Log-fold change'
    placement: left
    section: 'Contrast scope'
    group: 'Call filters'
    display:
      title_size: md
      custom_color: '#1976D2'
      icon_name: 'mdi:trending-up'
    layout: { x: 0, y: 6, w: 1, h: 3 }
