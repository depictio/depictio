# Lollipop plot — one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Lollipop plot'
subtitle: 'Variant tracks along cancer genes'
icon: 'mdi:chart-timeline-variant'
icon_color: 'blue'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d42'
is_main_tab: false
tab_order: 18
parent_dashboard_tag: volcano
tab_icon: 'mdi:chart-timeline-variant'
tab_icon_color: 'blue'

# Left-panel filter section. Deliberately not `persistent`: the 23 tabs of
# this family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Position scope'
    icon: 'mdi:filter-variant'
    color: 'blue'
    description: 'Restricts which effect classes and magnitudes are drawn'

grid_sections:
  - name: 'Positional effects'
    icon: 'mdi:chart-timeline-variant'
    color: 'blue'
    description: 'Effects placed along a sequence coordinate'

components:
  - tag: text-lollipop
    index: lol-text
    component_type: text
    title: 'Lollipop plot'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Positional effects'
    body: |
      Effects placed at their position along a sequence, stem height encoding magnitude
      and colour encoding class. It is the view that makes a mutational hotspot visible
      as a cluster of stems rather than a row in a table.
    layout: { x: 0, y: 0, w: 8, h: 1 }

  - tag: viz-lollipop
    index: 'lol-plot'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'lollipop_demo'
    title: 'Lollipop plot — variants by consequence'
    description: 'Per-gene variant tracks coloured by consequence. Marker size encodes effect strength.'
    section: 'Positional effects'
    viz_kind: 'lollipop'
    config:
      viz_kind: "lollipop"
      feature_id_col: "feature_id"
      position_col: "position"
      category_col: "category"
      effect_col: "effect"
      max_subplot_genes: 6
    layout: { x: 0, y: 1, w: 8, h: 8 }

  - tag: filter-lollipop-category
    index: lol-f-category
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'lollipop_demo'
    interactive_component_type: MultiSelect
    column_name: 'category'
    column_type: 'object'
    title: 'Effect class'
    placement: left
    section: 'Position scope'
    group: 'Effect filters'
    display:
      title_size: md
      custom_color: '#1976D2'
      icon_name: 'mdi:form-select'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-lollipop-effect
    index: lol-f-effect
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'lollipop_demo'
    interactive_component_type: RangeSlider
    column_name: 'effect'
    column_type: 'float64'
    title: 'Effect'
    placement: left
    section: 'Position scope'
    group: 'Effect filters'
    display:
      title_size: md
      custom_color: '#E74C3C'
      icon_name: 'mdi:trending-up'
    layout: { x: 0, y: 3, w: 1, h: 3 }
