# Genome view — one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
#
# Issue #1083. Two tiles on the SAME collection, stacked in one section: an
# advanced_viz tile binds exactly one data collection, so a multi-track genome
# view is several tiles sharing a region filter, not one tile over N
# collections. Brushing the top tile emits a chromosome + position pair that
# the bottom tile follows. The evaluation is in docs/design/genomespy-eval.md.
title: 'Genome view'
subtitle: 'GenomeSpy tracks on a chromosome-aware locus axis: bars, intervals, per-sample lanes and a region brush that filters the dashboard'
icon: 'tabler:dna-2'
icon_color: 'teal'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d7a'
is_main_tab: false
tab_order: 40
parent_dashboard_tag: volcano
tab_icon: 'tabler:dna-2'
tab_icon_color: 'teal'

# Left-panel filter section. Deliberately not `persistent`: the tabs of this
# family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Track scope'
    icon: 'mdi:filter-variant'
    color: 'teal'
    description: 'Restricts the tracks to a sample set, a region or a depth range'

grid_sections:
  - name: 'Coverage across the genome'
    icon: 'mdi:dna'
    color: 'teal'
    description: 'Two GenomeSpy tracks on one collection, linked by the region brush'
  - name: 'Markers on a locus axis'
    icon: 'mdi:chart-scatter-plot'
    color: 'teal'
    description: 'The Manhattan collection drawn by GenomeSpy, for the side-by-side comparison'

components:
  - tag: text-genome-view
    index: gv-text
    component_type: text
    title: 'Genome view'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Coverage across the genome'
    body: >
      Two tracks over the same coverage collection. Scroll to zoom into a locus, drag to pan
      along the genome, brush the axis to publish the chromosome and the position range as
      ordinary dashboard filters. The lower track follows that region instead of showing the
      whole reference. Depth is drawn as bars because GenomeSpy has no line mark. Per-sample
      lanes, the gene annotation lane and the mark type live in the Settings gear.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-genome-view-depth
    index: 'gv-depth'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'coverage_track_demo'
    title: 'Depth along the reference'
    description: 'Read depth per 200 bp bin, drawn as bars from the baseline. Brush the axis to publish a region filter; switch to per-sample lanes in Settings.'
    section: 'Coverage across the genome'
    viz_kind: 'genome_view'
    config:
      viz_kind: "genome_view"
      chr_col: "chrom"
      pos_col: "start"
      score_col: "coverage"
      end_col: "end"
      sample_col: "sample"
      category_col: "gene_region"
      mark: "bar"
      score_title: "mean depth"
      facet_by_sample: false
      max_facets: 6
      region_filter_enabled: true
      follow_region_filter: false
    layout: { x: 0, y: 2, w: 8, h: 6 }

  - tag: viz-genome-view-regions
    index: 'gv-regions'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'coverage_track_demo'
    title: 'Bins as intervals, following the brushed region'
    description: 'The same bins drawn as intervals coloured by gene region. This tile follows an incoming region filter, so a brush on the track above zooms it.'
    section: 'Coverage across the genome'
    viz_kind: 'genome_view'
    config:
      viz_kind: "genome_view"
      chr_col: "chrom"
      pos_col: "start"
      score_col: "coverage"
      end_col: "end"
      sample_col: "sample"
      category_col: "gene_region"
      mark: "rect"
      score_title: "mean depth"
      region_filter_enabled: false
      follow_region_filter: true
    layout: { x: 0, y: 8, w: 8, h: 5 }

  - tag: text-genome-view-markers
    index: gv-text-markers
    component_type: text
    title: 'Markers on a locus axis'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Markers on a locus axis'
    body: >
      The collection the Manhattan tab reads, on the same grammar: chromosomes are
      concatenated by the locus scale rather than laid out by hand, and the dashed rule is
      the significance threshold. Click a marker to filter the rest of the dashboard by
      feature. Compare it with the Manhattan tab for the same rows drawn in Plotly.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-genome-view-markers
    index: 'gv-markers'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'manhattan_demo'
    title: 'Markers by position and score'
    description: 'chr / pos / score on a chromosome-aware locus scale. Zoom with the wheel, pan by dragging; the threshold rule, mark type and assembly live in the Settings gear.'
    section: 'Markers on a locus axis'
    viz_kind: 'genome_view'
    config:
      viz_kind: "genome_view"
      chr_col: "chr"
      pos_col: "pos"
      score_col: "score"
      feature_col: "feature"
      score_title: "-log10(padj)"
      score_threshold: 5.0
      point_size: 5
      # A marker is one feature at one locus, so the feature is what a click
      # picks out, and the config has to say so.
      selection_enabled: true
      selection_column: "feature"
      # Its own collection has no region filter to follow, and brushing it would
      # publish contig names the coverage tiles do not share.
      region_filter_enabled: false
    layout: { x: 0, y: 2, w: 8, h: 7 }

  - tag: filter-genome-view-sample
    index: gv-f-sample
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'coverage_track_demo'
    interactive_component_type: MultiSelect
    column_name: 'sample'
    column_type: 'object'
    title: 'Sample'
    placement: left
    section: 'Track scope'
    group: 'Track filters'
    display:
      title_size: md
      icon_name: 'mdi:flask'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-genome-view-region
    index: gv-f-region
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'coverage_track_demo'
    interactive_component_type: MultiSelect
    column_name: 'gene_region'
    column_type: 'object'
    title: 'Gene region'
    placement: left
    section: 'Track scope'
    group: 'Track filters'
    display:
      title_size: md
      icon_name: 'mdi:map-marker-path'
    layout: { x: 0, y: 3, w: 1, h: 3 }

  - tag: filter-genome-view-depth
    index: gv-f-depth
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'coverage_track_demo'
    interactive_component_type: RangeSlider
    column_name: 'coverage'
    column_type: 'float64'
    title: 'Depth'
    placement: left
    section: 'Track scope'
    group: 'Track filters'
    display:
      title_size: md
      icon_name: 'mdi:chart-line'
    layout: { x: 0, y: 6, w: 1, h: 3 }

  - tag: filter-genome-view-score
    index: gv-f-score
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'manhattan_demo'
    interactive_component_type: RangeSlider
    column_name: 'score'
    column_type: 'float64'
    title: 'Score'
    placement: left
    section: 'Track scope'
    group: 'Marker filters'
    display:
      title_size: md
      icon_name: 'mdi:chart-bell-curve'
    layout: { x: 0, y: 9, w: 1, h: 3 }
