# Oncoplot — one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Oncoplot'
subtitle: 'Sample × gene mutation matrix'
icon: 'mdi:grid'
icon_color: 'red'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d45'
is_main_tab: false
tab_order: 21
parent_dashboard_tag: volcano
tab_icon: 'mdi:grid'
tab_icon_color: 'red'

# Left-panel filter section. Deliberately not `persistent`: the 23 tabs of
# this family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Mutation scope'
    icon: 'mdi:filter-variant'
    color: 'red'
    description: 'Restricts which genes and mutation classes are drawn'

grid_sections:
  - name: 'Mutation matrix'
    icon: 'mdi:relation-many-to-many'
    color: 'red'
    description: 'Samples against genes, coloured by mutation class'

components:
  - tag: text-oncoplot
    index: onc-text
    component_type: text
    title: 'Oncoplot'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Mutation matrix'
    body: |
      Samples on one axis, genes on the other, each cell coloured by the class of the
      mutation it carries. Rows and columns are reordered so that co-occurring mutations
      line up into blocks, which is the pattern the plot exists to surface. Filtering to
      one mutation class shows which genes carry it.
    layout: { x: 0, y: 0, w: 8, h: 1 }

  - tag: viz-oncoplot
    index: 'onc-plot'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'oncoplot_demo'
    title: 'Oncoplot — sample × gene mutation matrix'
    description: 'Discrete heatmap by mutation type, with per-sample and per-gene mutation count strips.'
    section: 'Mutation matrix'
    viz_kind: 'oncoplot'
    config:
      viz_kind: "oncoplot"
      sample_id_col: "sample_id"
      gene_col: "gene"
      mutation_type_col: "mutation_type"
    layout: { x: 0, y: 1, w: 8, h: 8 }

  - tag: filter-oncoplot-type
    index: onc-f-type
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'oncoplot_demo'
    interactive_component_type: MultiSelect
    column_name: 'mutation_type'
    column_type: 'object'
    title: 'Mutation class'
    placement: left
    section: 'Mutation scope'
    group: 'Mutation filters'
    display:
      title_size: md
      custom_color: '#E74C3C'
      icon_name: 'mdi:form-select'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-oncoplot-gene
    index: onc-f-gene
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'oncoplot_demo'
    interactive_component_type: MultiSelect
    column_name: 'gene'
    column_type: 'object'
    title: 'Gene'
    placement: left
    section: 'Mutation scope'
    group: 'Mutation filters'
    display:
      title_size: md
      custom_color: '#7B1FA2'
      icon_name: 'mdi:dna'
    layout: { x: 0, y: 3, w: 1, h: 3 }
