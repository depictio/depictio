# Phylogeny — one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Phylogeny'
subtitle: 'Bacterial phylogenetic tree with tip metadata (Microreact-style)'
icon: 'mdi:family-tree'
icon_color: 'lime'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d18'
is_main_tab: false
tab_order: 9
parent_dashboard_tag: volcano
tab_icon: 'mdi:family-tree'
tab_icon_color: 'lime'

grid_sections:
  - name: 'Phylogenetic tree'
    icon: 'mdi:family-tree'
    color: 'lime'
    description: 'A Newick tree with its metadata annotation strip'

components:
  - tag: text-phylogeny
    index: phylo-text
    component_type: text
    title: 'Phylogenetic tree'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Phylogenetic tree'
    body: >
      A Newick tree rendered with an annotation strip built from a separate metadata
      collection, joined on the tip label. This tab carries no left-panel filter: the tree
      reads two collections and only one is filterable, so a control would prune the strip
      and leave the topology untouched.
    layout: { x: 0, y: 0, w: 8, h: 1 }

  - tag: viz-phylogeny
    index: 'phylo-tree'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'bacterial_tree'
    title: 'Bacterial phylogeny (Newick)'
    description: 'Microreact-style rendering — 5 layouts (rectangular / circular / radial / diagonal / hierarchical), tip search, click any internal node to highlight its clade and export it as .nwk.'
    section: 'Phylogenetic tree'
    viz_kind: 'phylogenetic'
    config:
      viz_kind: "phylogenetic"
      tree_wf_id: "646b0f3c1e4a2d7f8e5b8d01"
      tree_dc_id: "646b0f3c1e4a2d7f8e5b8d09"
      metadata_wf_id: "646b0f3c1e4a2d7f8e5b8d01"
      metadata_dc_id: "646b0f3c1e4a2d7f8e5b8d0a"
      taxon_col: "taxon"
      color_col: "group"
      label_col: "resistance_profile"
      default_layout: "rectangular"
      ladderize: true
      show_metadata_strip: true
      show_branch_lengths: false
      show_internal_labels: false
    layout: { x: 0, y: 2, w: 8, h: 8 }
