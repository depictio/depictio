# Bacterial phylogeny: one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Bacterial phylogeny'
subtitle: 'Bacterial phylogenetic tree with tip metadata (Microreact-style)'
icon: 'mdi:family-tree'
icon_color: 'lime'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d18'
is_main_tab: false
tab_order: 9
parent_dashboard_tag: volcano
tab_icon: 'mdi:family-tree'
tab_icon_color: 'lime'

grid_sections:
  - name: 'Phylogenetic tree'
    icon: 'mdi:family-tree'
    color: 'lime'
    description: 'A Newick tree with its metadata annotation strip'

components:
  - tag: text-phylogeny
    index: phylo-text
    component_type: text
    title: 'Phylogenetic tree'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Phylogenetic tree'
    body: >
      A Newick tree of bacterial isolates with a metadata strip joined on the tip label.
      Colour by and tip search are in the tile header; click an internal node to highlight its
      clade and export it. The tree reads two collections, so the tab carries no filter that
      would prune the strip and leave the topology. Input: IQ-TREE or FastTree output of nf-
      core/bactmap or nf-core/pathogensurveillance.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-phylogeny
    index: 'phylo-tree'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'bacterial_tree'
    title: 'Bacterial phylogeny (Newick)'
    description: 'Five layouts (rectangular, circular, radial, diagonal, hierarchical), tip search, and a click on any internal node highlights its clade and exports it as Newick.'
    section: 'Phylogenetic tree'
    viz_kind: 'phylogenetic'
    config:
      viz_kind: "phylogenetic"
      tree_wf_id: "646b0f3c1e4a2d7f8e5b8d01"
      tree_dc_id: "646b0f3c1e4a2d7f8e5b8d09"
      metadata_wf_id: "646b0f3c1e4a2d7f8e5b8d01"
      metadata_dc_id: "646b0f3c1e4a2d7f8e5b8d0a"
      taxon_col: "taxon"
      color_col: "group"
      label_col: "resistance_profile"
      default_layout: "rectangular"
      ladderize: true
      show_metadata_strip: true
      show_branch_lengths: false
      show_internal_labels: false
      controls_placement: "header"
    layout: { x: 0, y: 2, w: 8, h: 9 }
