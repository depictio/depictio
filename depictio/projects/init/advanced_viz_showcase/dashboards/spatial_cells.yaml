# Spatial cells: one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
#
# The tab is the section 8 review of `spatial_cells` (docs/design/advanced-viz.md):
# the same mcquant cell table drawn by the new kind and, beside it, by the
# closest existing one, an `embedding` bound to the centroids. Both select on
# `cell_id`, so a lasso in either marks the same cells in the other.
title: 'Spatial cells'
subtitle: 'Segmented cells of two tonsil images drawn where they sit, beside the same cells as an embedding of their centroids: which of the two reads as tissue?'
icon: 'tabler:microscope'
icon_color: 'grape'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8e70'
is_main_tab: false
tab_order: 51
parent_dashboard_tag: volcano
tab_icon: 'tabler:microscope'
tab_icon_color: 'grape'

# The cell types are a known vocabulary, written out so both tiles and the
# filter chips give a type the same colour. Declared on this tab rather than
# on the family's main tab: no other tab of the showcase reads `cell_type`.
category_colors:
  cell_type:
    B cell: '#1c7ed6'
    Germinal centre B: '#7048e8'
    T cell: '#e8590c'
    Epithelial: '#2f9e44'
    Macrophage: '#c2255c'
    Stromal: '#868e96'

# Left-panel filter section. Deliberately not `persistent`: the tabs of this
# family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Cell scope'
    icon: 'mdi:filter-variant'
    color: 'grape'
    description: 'Restricts which cells both tiles draw'

grid_sections:
  - name: 'Cells in the image'
    icon: 'mdi:microscope'
    color: 'grape'
    description: 'The same cells drawn by spatial_cells and by an embedding of their centroids'

components:
  - tag: text-spatial-cells
    index: spatial-cells-text
    component_type: text
    title: 'Two readings of one cell table'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Cells in the image'
    body: >
      One mcquant table (nf-core/mcmicro) of two tonsil images: per cell, eight marker
      intensities, the centroid in image pixels and the segmentation morphology. On the left,
      spatial_cells draws each cell in its image's own frame (y down from the top-left, one
      image at a time), at the size of its area, coloured by cell type or by a marker picked
      from the panel, with the colour clipped to the 1st and 99th percentiles. On the right,
      an embedding of X_centroid and Y_centroid: the same cells, upside down (its y axis runs
      up), both images stacked in one frame, every cell one fixed-size dot. Pick a sample on
      the left to compare like with like; a lasso in either tile marks its cells in the other.
    layout: { x: 0, y: 0, w: 8, h: 3 }

  - tag: viz-spatial-cells
    index: 'spatial-cells-tissue'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'spatial_cells_demo'
    title: 'Cells in the image (spatial_cells)'
    description: 'Each cell at its centroid in its own image, sized by its area, coloured by cell type or by the marker picked. One image at a time; the colour range is clipped to percentiles of the image shown.'
    section: 'Cells in the image'
    viz_kind: 'spatial_cells'
    config:
      viz_kind: "spatial_cells"
      cell_id_col: "cell_id"
      x_col: "X_centroid"
      y_col: "Y_centroid"
      value_col: "CD20"
      category_col: "cell_type"
      sample_col: "sample"
      area_col: "Area"
      value_columns:
        - "DNA_1"
        - "CD3"
        - "CD20"
        - "CD45"
        - "PanCK"
        - "Ki67"
        - "CD68"
        - "aSMA"
      color_by: "category"
      legend_pos: "bottom"
      selection_enabled: true
    layout: { x: 0, y: 3, w: 4, h: 6 }

  - tag: viz-spatial-cells-embedding
    index: 'spatial-cells-embedding'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'spatial_cells_demo'
    title: 'The same cells as an embedding'
    description: 'An embedding bound to X_centroid and Y_centroid: equal aspect and a Colour-by menu, but its y axis runs upwards, both images share one frame and every cell is the same dot.'
    section: 'Cells in the image'
    viz_kind: 'embedding'
    config:
      viz_kind: "embedding"
      sample_id_col: "cell_id"
      dim_1_col: "X_centroid"
      dim_2_col: "Y_centroid"
      cluster_col: "cell_type"
      color_col: "cell_type"
      default_color_by: "cell_type"
      axis_prefix: "Centroid "
      point_size: 3
      legend_pos: "bottom"
      selection_enabled: true
    layout: { x: 4, y: 3, w: 4, h: 6 }

  - tag: filter-spatial-cells-sample
    index: spatial-cells-f-sample
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'spatial_cells_demo'
    interactive_component_type: MultiSelect
    column_name: 'sample'
    column_type: 'object'
    title: 'Image'
    placement: left
    section: 'Cell scope'
    group: 'Cell filters'
    display:
      title_size: md
      icon_name: 'tabler:photo'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-spatial-cells-type
    index: spatial-cells-f-type
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'spatial_cells_demo'
    interactive_component_type: MultiSelect
    column_name: 'cell_type'
    column_type: 'object'
    title: 'Cell type'
    placement: left
    section: 'Cell scope'
    group: 'Cell filters'
    display:
      title_size: md
      icon_name: 'tabler:microscope'
    layout: { x: 0, y: 3, w: 1, h: 3 }

  - tag: filter-spatial-cells-area
    index: spatial-cells-f-area
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'spatial_cells_demo'
    interactive_component_type: RangeSlider
    column_name: 'Area'
    column_type: 'int64'
    title: 'Cell area (px)'
    placement: left
    section: 'Cell scope'
    group: 'Cell filters'
    show_histogram: true
    display:
      title_size: md
      icon_name: 'mdi:chart-bell-curve'
    layout: { x: 0, y: 6, w: 1, h: 3 }
