# Recomputed projection: one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Recomputed projection'
subtitle: 'A projection recomputed by a worker on whatever the filters leave, cached per method, parameters and filters'
icon: 'mdi:lightning-bolt'
icon_color: 'grape'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d19'
is_main_tab: false
tab_order: 8
parent_dashboard_tag: volcano
tab_icon: 'mdi:tune'
tab_icon_color: 'grape'

# Left-panel filter section. Deliberately not `persistent`: the 23 tabs of
# this family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Feature scope'
    icon: 'mdi:filter-variant'
    color: 'grape'
    description: 'Restricts the rows the reduction is computed on'

grid_sections:
  - name: 'Live clustering'
    icon: 'mdi:tune'
    color: 'grape'
    description: 'The projection recomputed in the browser as you change its parameters'

components:
  - tag: text-clustering_live
    index: live-text
    component_type: text
    title: 'Live clustering'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Live clustering'
    body: >
      The only projection here computed on request rather than read from a table: the raw
      sample by feature matrix is reduced by a worker, and changing the method (PCA, UMAP,
      t-SNE, PCoA) in the tile header re-runs it on whatever the filters leave. Filter to two
      conditions on the left and the projection is recomputed on them alone, which a
      precomputed table cannot do. The input is any count matrix, such as the salmon merged
      counts of nf-core/rnaseq.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-clustering_live
    index: 'live-embedding'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'embedding_features'
    title: 'Live clustering (Celery)'
    description: 'Method and colour-by in the tile header. The API dispatches a Celery task and caches each (collection, method, parameters, filters) result, so a second run of the same combination is instant.'
    section: 'Live clustering'
    viz_kind: 'embedding'
    config:
      viz_kind: "embedding"
      sample_id_col: "sample_id"
      dim_1_col: "dim_1"
      dim_2_col: "dim_2"
      cluster_col: "cluster"
      color_col: "color"
      compute_method: "umap"
      umap_n_neighbors: 15
      umap_min_dist: 0.1
      tsne_perplexity: 30
      tsne_n_iter: 1000
      pcoa_distance: "bray_curtis"
      point_size: 7
      show_density: false
      selection_enabled: true
      controls_placement: "header"
    layout: { x: 0, y: 2, w: 8, h: 9 }

  - tag: filter-clustering_live-cluster
    index: live-f-cluster
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'embedding_features'
    interactive_component_type: MultiSelect
    column_name: 'cluster'
    column_type: 'object'
    title: 'Cluster'
    placement: left
    section: 'Feature scope'
    group: 'Point filters'
    display:
      title_size: md
      custom_color: '#8E44AD'
      icon_name: 'mdi:scatter-plot'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-clustering_live-color
    index: live-f-color
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'embedding_features'
    interactive_component_type: RangeSlider
    column_name: 'color'
    column_type: 'float64'
    title: 'Continuous value'
    placement: left
    section: 'Feature scope'
    group: 'Point filters'
    show_histogram: true
    display:
      title_size: md
      custom_color: '#00BCD4'
      icon_name: 'mdi:blur'
    layout: { x: 0, y: 3, w: 1, h: 3 }
