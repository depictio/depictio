# Gene fusions: one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Gene fusions'
subtitle: 'Six oncogenic gene fusions as their two partners end to end, protein domains placed along each lane and the breakpoint marked.'
icon: 'mdi:set-merge'
icon_color: 'grape'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d72'
is_main_tab: false
tab_order: 30
parent_dashboard_tag: volcano
tab_icon: 'mdi:dna'
tab_icon_color: 'grape'

# Left-panel filter section. Deliberately not `persistent`: the 23 tabs of
# this family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Fusion scope'
    icon: 'mdi:filter-variant'
    color: 'grape'
    description: 'Restricts which fusions, partners and domain classes are drawn'

grid_sections:
  - name: 'Fusion structure'
    icon: 'mdi:set-merge'
    color: 'grape'
    description: 'Partner lanes with their annotated protein domains'

components:
  - tag: text-fusion_structure
    index: fus-text
    component_type: text
    title: 'Fusion structure'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Fusion structure'
    body: >
      Six oncogenic fusions, each drawn as its two partners end to end: one lane per partner,
      one bar per protein domain, a dotted seam at the breakpoint, and the fill showing how
      much of each domain the fusion keeps. The number of fusions drawn is in the tile header;
      pick a fusion or a partner on the left. Input: Arriba or STAR-Fusion calls of nf-
      core/rnafusion.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-fusion_structure
    index: 'fus-struct'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'fusion_structure_demo'
    title: 'Retained protein domains'
    description: 'One facet per fusion, one lane per partner, one bar per domain coloured by domain class. The solid fill is the retained fraction, the outline the full domain. The fusion count sits in the tile header.'
    section: 'Fusion structure'
    viz_kind: 'fusion_structure'
    config:
      viz_kind: "fusion_structure"
      fusion_id_col: "fusion_id"
      partner_col: "partner"
      feature_col: "feature"
      start_col: "start"
      end_col: "end"
      breakpoint_col: "breakpoint"
      retained_col: "retained"
      colour_by_col: "domain_class"
      top_n: 6
      show_breakpoint: true
      controls_placement: "header"
    layout: { x: 0, y: 2, w: 8, h: 9 }

  - tag: filter-fusion_structure-fusion
    index: fus-f-fusion
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'fusion_structure_demo'
    interactive_component_type: MultiSelect
    column_name: 'fusion_id'
    column_type: 'object'
    title: 'Fusion'
    placement: left
    section: 'Fusion scope'
    group: 'Fusion filters'
    display:
      title_size: md
      custom_color: '#7950F2'
      icon_name: 'mdi:dna'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-fusion_structure-class
    index: fus-f-class
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'fusion_structure_demo'
    interactive_component_type: MultiSelect
    column_name: 'domain_class'
    column_type: 'object'
    title: 'Domain class'
    placement: left
    section: 'Fusion scope'
    group: 'Fusion filters'
    display:
      title_size: md
      custom_color: '#E64980'
      icon_name: 'mdi:vector-arrange-below'
    layout: { x: 0, y: 3, w: 1, h: 3 }

  - tag: filter-fusion_structure-partner
    index: fus-f-partner
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'fusion_structure_demo'
    interactive_component_type: MultiSelect
    column_name: 'partner'
    column_type: 'object'
    title: 'Partner gene'
    placement: left
    section: 'Fusion scope'
    group: 'Fusion filters'
    display:
      title_size: md
      custom_color: '#15AABF'
      icon_name: 'mdi:relation-many-to-many'
    layout: { x: 0, y: 6, w: 1, h: 3 }
