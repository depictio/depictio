# MA plot — one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'MA plot'
subtitle: 'Mean log intensity vs log2 fold change'
icon: 'mdi:chart-bell-curve'
icon_color: 'pink'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d40'
is_main_tab: false
tab_order: 16
parent_dashboard_tag: volcano
tab_icon: 'mdi:chart-bell-curve'
tab_icon_color: 'pink'

# Left-panel filter section. Deliberately not `persistent`: the 23 tabs of
# this family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Feature scope'
    icon: 'mdi:filter-variant'
    color: 'pink'
    description: 'Restricts the point cloud'

grid_sections:
  - name: 'MA plot'
    icon: 'mdi:chart-bell-curve'
    color: 'pink'
    description: 'Effect size against mean intensity'

components:
  - tag: text-ma
    index: ma-text
    component_type: text
    title: 'MA plot'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'MA plot'
    body: >
      Effect size against average intensity, the diagnostic companion to the volcano: a fold
      change that only appears at low intensity is usually noise, and it shows up here as a
      funnel opening to the left. The same feature set as the volcano tab, read against a
      different x axis.
    layout: { x: 0, y: 0, w: 8, h: 1 }

  - tag: viz-ma
    index: 'ma-plot'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'volcano_demo'
    title: 'MA plot — differential abundance'
    description: 'Mean log intensity vs log2 fold change — same tier-colour story as the volcano, different axis pairing.'
    section: 'MA plot'
    viz_kind: 'ma'
    config:
      viz_kind: "ma"
      feature_id_col: "feature_id"
      avg_log_intensity_col: "avg_log_intensity"
      log2_fold_change_col: "effect_size"
      significance_col: "significance"
      label_col: "label"
      significance_threshold: 0.05
      fold_change_threshold: 1.0
      top_n_labels: 15
    layout: { x: 0, y: 1, w: 8, h: 8 }

  - tag: filter-ma-category
    index: ma-f-category
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'volcano_demo'
    interactive_component_type: MultiSelect
    column_name: 'category'
    column_type: 'object'
    title: 'Category'
    placement: left
    section: 'Feature scope'
    group: 'Feature filters'
    display:
      title_size: md
      custom_color: '#E91E63'
      icon_name: 'mdi:form-select'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-ma-significance
    index: ma-f-significance
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'volcano_demo'
    interactive_component_type: RangeSlider
    column_name: 'significance'
    column_type: 'float64'
    title: 'Significance'
    placement: left
    section: 'Feature scope'
    group: 'Feature filters'
    display:
      title_size: md
      custom_color: '#F68B33'
      icon_name: 'mdi:target'
    layout: { x: 0, y: 3, w: 1, h: 3 }
