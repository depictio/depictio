title: ROC / PR curve (demo)
project_tag: Advanced Visualisations
is_main_tab: false
parent_dashboard_tag: Advanced Visualisations
tab_order: 25
icon: mdi:chart-bell-curve
icon_color: teal
components:
- component_type: text
  tag: roc-demo-intro
  title: ROC / PR curve
  order: 1
  alignment: left
  body: >
    Threshold-sweep curves, one per caller, on synthetic data. Use the panel's
    tab bar to switch between **PR curve** (precision vs recall), **ROC**
    (true-positive vs false-positive rate, with the random-classifier diagonal)
    and **vs threshold** (precision & recall vs quality). AUC is per curve.
  workflow_tag: advanced_viz_demo
  data_collection_tag: roc_curve_demo
  layout: {x: 0, y: 0, w: 8, h: 1}
# ── Filters ────────────────────────────────────────────────────────────────
# A different data collection: the curve table is one row per threshold, so
# `quality` is the sweep axis and clipping it is how you zoom into the part of
# the curve that matters.
- component_type: interactive
  tag: roc-filter-tool
  workflow_tag: advanced_viz_demo
  data_collection_tag: roc_curve_demo
  interactive_component_type: MultiSelect
  column_name: tool
  column_type: object
  custom_color: "#00897B"
  icon_name: mdi:filter-variant
  title: Caller
  layout: {x: 0, y: 1, w: 4, h: 3}
- component_type: interactive
  tag: roc-filter-quality
  workflow_tag: advanced_viz_demo
  data_collection_tag: roc_curve_demo
  interactive_component_type: RangeSlider
  column_name: quality
  column_type: float64
  custom_color: "#5E35B1"
  icon_name: mdi:tune
  title: Quality threshold
  layout: {x: 4, y: 1, w: 4, h: 3}

- component_type: advanced_viz
  workflow_tag: advanced_viz_demo
  data_collection_tag: roc_curve_demo
  viz_kind: roc_pr_curve
  config:
    viz_kind: roc_pr_curve
    recall_col: recall
    precision_col: precision
    fpr_col: fpr
    threshold_col: quality
    group_col: tool
  tag: roc-demo-viz
  title: ROC / PR curve
  layout: {x: 0, y: 4, w: 8, h: 10}
