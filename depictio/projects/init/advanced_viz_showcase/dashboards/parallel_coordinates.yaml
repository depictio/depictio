# Parallel coordinates: one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Library QC profile'
subtitle: 'One polyline per library across eight QC metrics. Degraded libraries are not the worst on any single axis; they are the ones that bend the same way across four of them.'
icon: 'mdi:chart-timeline-variant'
icon_color: 'teal'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8db0'
is_main_tab: false
tab_order: 46
parent_dashboard_tag: volcano
tab_icon: 'mdi:check-decagram'
tab_icon_color: 'teal'

# Left-panel filter section. Deliberately not `persistent`: the tabs of this
# family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Library scope'
    icon: 'mdi:filter-variant'
    color: 'teal'
    description: 'Restricts which libraries are drawn as polylines'

grid_sections:
  - name: 'Sample QC profile'
    icon: 'mdi:chart-timeline-variant'
    color: 'teal'
    description: 'Eight per-library metrics on parallel axes, coloured by group'

components:
  - tag: text-parallel-coordinates
    index: pcoords-text
    component_type: text
    title: 'Library QC profile'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Sample QC profile'
    body: >
      Eight QC metrics per library (MultiQC general statistics of nf-core/rnaseq), one axis
      each, one line per library coloured by group. The degraded libraries are not the worst
      on any single axis; they bend the same way across duplication, alignment rate and rRNA.
      Drag along the duplication axis to brush a range: the brush becomes a dashboard filter,
      and the Duplicates slider on the left shows the distribution you are cutting.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-parallel-coordinates
    index: 'pcoords-axes'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'parallel_coordinates_demo'
    title: 'Per-library QC profile'
    description: 'One polyline per library across eight metrics, coloured by group. Each axis is rescaled so the axes are comparable, while the tick labels keep the original units. Brushing an axis emits a range filter on that column.'
    section: 'Sample QC profile'
    viz_kind: 'parallel_coordinates'
    config:
      viz_kind: "parallel_coordinates"
      sample_col: "sample"
      group_col: "group"
      scale: "minmax"
      max_rows: 2000
      metric_cols:
        - "total_reads_m"
        - "percent_duplicates"
        - "percent_gc"
        - "mean_quality"
        - "percent_aligned"
        - "insert_size_median"
        - "percent_rrna"
        - "genes_detected"
      controls_placement: "header"
    layout: { x: 0, y: 2, w: 8, h: 9 }

  - tag: filter-parallel-coordinates-group
    index: pcoords-f-group
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'parallel_coordinates_demo'
    interactive_component_type: MultiSelect
    column_name: 'group'
    column_type: 'object'
    title: 'Group'
    placement: left
    section: 'Library scope'
    group: 'Library filters'
    display:
      title_size: md
      custom_color: '#0CA678'
      icon_name: 'mdi:test-tube'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-parallel-coordinates-duplicates
    index: pcoords-f-dup
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'parallel_coordinates_demo'
    interactive_component_type: RangeSlider
    column_name: 'percent_duplicates'
    column_type: 'float64'
    title: 'Duplicates (%)'
    placement: left
    section: 'Library scope'
    group: 'Library filters'
    show_histogram: true
    display:
      title_size: md
      custom_color: '#0CA678'
      icon_name: 'mdi:chart-bell-curve'
    layout: { x: 0, y: 3, w: 1, h: 3 }
