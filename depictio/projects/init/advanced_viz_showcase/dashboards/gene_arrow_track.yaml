# Gene arrow track: one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Gene clusters on contigs'
subtitle: 'Genes as strand-aware arrows along five bacterial contigs, with the called biosynthetic gene cluster shaded behind them: gene order and neighbourhood, not splicing.'
icon: 'mdi:dna'
icon_color: 'teal'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d73'
is_main_tab: false
tab_order: 31
parent_dashboard_tag: volcano
tab_icon: 'mdi:dna'
tab_icon_color: 'lime'

# Left-panel filter section. Deliberately not `persistent`: the 23 tabs of
# this family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Locus scope'
    icon: 'mdi:filter-variant'
    color: 'teal'
    description: 'Restricts which contigs, classes and strands are drawn'

grid_sections:
  - name: 'Gene arrow track'
    icon: 'mdi:dna'
    color: 'teal'
    description: 'Coding sequences along a contig, one lane per contig'

components:
  - tag: text-gene_arrow_track
    index: gat-text
    component_type: text
    title: 'Gene clusters on contigs'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Gene arrow track'
    body: >
      Whole genes as arrows along a contig, one lane per contig: an arrow points right on the
      + strand, left on the -, and the shaded band is the called biosynthetic gene cluster
      with its genes coloured by product class. The question here is gene order, strand and
      neighbourhood across a 20 to 40 kb locus, where the Isoforms tab asks how one gene is
      spliced. Input: antiSMASH or funcscan BGC calls, or Prokka and Bakta annotations from
      nf-core/mag and bacass.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-gene_arrow_track
    index: 'gat-track'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'gene_arrow_track_demo'
    title: 'Biosynthetic gene clusters'
    description: 'Five bacterial contigs, one arrow per coding sequence. Direction is the strand, colour the antiSMASH-style product class, the band behind each lane the called cluster. Labels and lane ordering are in the settings.'
    section: 'Gene arrow track'
    viz_kind: 'gene_arrow_track'
    config:
      viz_kind: "gene_arrow_track"
      controls_placement: "header"
      contig_col: "contig"
      feature_id_col: "feature_id"
      start_col: "start"
      end_col: "end"
      strand_col: "strand"
      class_col: "gene_class"
      label_col: "label"
      region_start_col: "region_start"
      region_end_col: "region_end"
      show_labels: true
      arrow_height: 0.5
    layout: { x: 0, y: 2, w: 8, h: 8 }

  - tag: filter-gene_arrow_track-contig
    index: gat-f-contig
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'gene_arrow_track_demo'
    interactive_component_type: MultiSelect
    column_name: 'contig'
    column_type: 'object'
    title: 'Contig'
    placement: left
    section: 'Locus scope'
    group: 'Locus filters'
    display:
      title_size: md
      icon_name: 'mdi:bacteria'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-gene_arrow_track-class
    index: gat-f-class
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'gene_arrow_track_demo'
    interactive_component_type: MultiSelect
    column_name: 'gene_class'
    column_type: 'object'
    title: 'Product class'
    placement: left
    section: 'Locus scope'
    group: 'Locus filters'
    display:
      title_size: md
      icon_name: 'mdi:dna'
    layout: { x: 0, y: 3, w: 1, h: 3 }

  - tag: filter-gene_arrow_track-strand
    index: gat-f-strand
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'gene_arrow_track_demo'
    interactive_component_type: MultiSelect
    column_name: 'strand'
    column_type: 'object'
    title: 'Strand'
    placement: left
    section: 'Locus scope'
    group: 'Locus filters'
    display:
      title_size: md
      icon_name: 'mdi:vector-arrange-below'
    layout: { x: 0, y: 6, w: 1, h: 3 }
