# Dot plot — one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Dot plot'
subtitle: 'Single-cell marker expression × cluster'
icon: 'mdi:dots-grid'
icon_color: 'teal'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d41'
is_main_tab: false
tab_order: 17
parent_dashboard_tag: volcano
tab_icon: 'mdi:dots-grid'
tab_icon_color: 'teal'

# Left-panel filter section. Deliberately not `persistent`: the 23 tabs of
# this family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Expression scope'
    icon: 'mdi:filter-variant'
    color: 'teal'
    description: 'Restricts which clusters and expression levels are shown'

grid_sections:
  - name: 'Expression dot plot'
    icon: 'mdi:chart-scatter-plot'
    color: 'teal'
    description: 'Gene against cluster, sized by fraction expressing'

components:
  - tag: text-dotplot
    index: dot-text
    component_type: text
    title: 'Dot plot'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Expression dot plot'
    body: |
      Genes on one axis and clusters on the other, each dot sized by the fraction of
      cells expressing the gene and coloured by mean expression. The two encodings
      answer different questions: size says how many, colour says how much, and a marker
      gene is the dot that is both large and bright in exactly one column.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-dotplot
    index: 'dot-plot'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'dotplot_demo'
    title: 'Marker dot plot'
    description: 'Mean expression (colour) × fraction expressing (size) across 6 PBMC-like clusters.'
    section: 'Expression dot plot'
    viz_kind: 'dot_plot'
    config:
      viz_kind: "dot_plot"
      cluster_col: "cluster"
      gene_col: "gene"
      mean_expression_col: "mean_expression"
      frac_expressing_col: "frac_expressing"
      max_dot_size: 22
      min_dot_size: 2
    layout: { x: 0, y: 2, w: 8, h: 8 }

  - tag: filter-dotplot-cluster
    index: dot-f-cluster
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'dotplot_demo'
    interactive_component_type: MultiSelect
    column_name: 'cluster'
    column_type: 'object'
    title: 'Cluster'
    placement: left
    section: 'Expression scope'
    group: 'Expression filters'
    display:
      title_size: md
      custom_color: '#45B8AC'
      icon_name: 'mdi:form-select'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-dotplot-frac
    index: dot-f-frac
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'dotplot_demo'
    interactive_component_type: RangeSlider
    column_name: 'frac_expressing'
    column_type: 'float64'
    title: 'Fraction expressing'
    placement: left
    section: 'Expression scope'
    group: 'Expression filters'
    display:
      title_size: md
      custom_color: '#2E7D32'
      icon_name: 'mdi:water-percent'
    layout: { x: 0, y: 3, w: 1, h: 3 }
