# Ranked tables: one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Ranked tables'
subtitle: 'Candidates as a leaderboard: medals on the first three, badges and bars in the cells, the fields behind a row in a popover, and the family of a variant drawn with its carriers.'
icon: 'mdi:podium'
icon_color: 'grape'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8f70'
is_main_tab: false
tab_order: 54
parent_dashboard_tag: volcano
tab_icon: 'mdi:podium'
tab_icon_color: 'grape'

# Badge colours are the dashboard's: a value written here wears the same colour
# on every tile. Values left out take the colorway.
category_colors:
  impact:
    HIGH: '#e03131'
    MODERATE: '#e8590c'
    LOW: '#2f9e44'
  status:
    Called: '#2f9e44'
    Candidate: '#e8590c'
    Not called: '#868e96'

# Left-panel filter section. Deliberately not `persistent`: the tabs of this
# family read different collections whose column names collide while their
# value domains do not overlap.
filter_sections:
  - name: 'Case scope'
    icon: 'mdi:filter-variant'
    color: 'grape'
    description: 'Restricts which cases the variants are ranked from'
  - name: 'Sample scope'
    icon: 'mdi:filter-variant'
    color: 'grape'
    description: 'Restricts which samples the outlier genes are ranked from'

grid_sections:
  - name: 'Top variants'
    icon: 'mdi:family-tree'
    color: 'grape'
    description: 'Candidate variants of two cases, ranked by rank score; click one to see its family'
  - name: 'Outlier genes'
    icon: 'mdi:table'
    color: 'grape'
    description: 'Genes of three samples ranked by significance, with the analyses that flagged them'

components:
  - tag: text-ranked
    index: rank-text
    component_type: text
    title: 'Ranked tables'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Top variants'
    body: >
      One row per candidate, ordered by a score. The rank sits in a medal (gold, silver and
      bronze for the first three), the gene is bold, the protein change monospace, the model and
      impact are badges and the score is a bar. Hover a row for the fields behind it. Click a row
      to pin its popover and pick the variant: the table below narrows to it, and the Family
      section draws the case with the proband marked and each member filled by genotype (solid
      homozygous alternate, half heterozygous, open reference, grey no call). Input: the ranked
      variants of nf-core/raredisease.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-ranked-variants
    index: 'rank-variants'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'ranked_variants_demo'
    title: 'Top candidates'
    description: 'Sorted by rank score; ties share a rank. Click a row to pin its popover.'
    section: 'Top variants'
    viz_kind: 'ranked_table'
    config:
      viz_kind: "ranked_table"
      title_col: "gene"
      subtitle_col: "hgvs_p"
      score_col: "rank_score"
      columns:
        - { column: "model_class", label: "Model", display: "badge" }
        - { column: "impact", label: "Impact", display: "badge" }
        - { column: "clinvar", label: "ClinVar", display: "badge" }
        - { column: "rank_score", label: "Rank score", display: "bar", max: 25 }
      labels:
        cadd: "CADD"
        gnomad_af: "gnomAD AF"
        chrom: "Chromosome"
        pos: "Position"
        gt_proband: "Proband"
        gt_mother: "Mother"
        gt_father: "Father"
      popover_columns: ["cadd", "gnomad_af", "chrom", "pos"]
      popover_grid_columns: ["gt_proband", "gt_mother", "gt_father"]
      top_n: 50
      medals: true
      selection_enabled: true
      selection_column: "variant_key"
      # Ids as well as tags: the seed is generated offline, and a tag is only
      # resolved to an id by the importer.
      family_wf_id: "646b0f3c1e4a2d7f8e5b8d01"
      family_dc_id: "646b0f3c1e4a2d7f8e5b8f72"
      family_dc_tag: "ranked_family_demo"
      family_individual_col: "individual"
      family_father_col: "father"
      family_mother_col: "mother"
      family_sex_col: "sex"
      family_status_col: "status"
      family_proband_col: "proband"
      family_family_col: "case_id"
      family_row_col: "case_id"
      genotypes_wf_id: "646b0f3c1e4a2d7f8e5b8d01"
      genotypes_dc_id: "646b0f3c1e4a2d7f8e5b8f73"
      genotypes_dc_tag: "ranked_genotypes_demo"
      genotypes_key_col: "variant_key"
      genotypes_row_col: "variant_key"
      genotypes_individual_col: "sample"
      genotypes_genotype_col: "gt_class"
      family_open: true
    layout: { x: 0, y: 2, w: 8, h: 8 }

  - tag: table-ranked-variants
    index: 'rank-variants-table'
    component_type: table
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'ranked_variants_demo'
    title: 'Variants'
    section: 'Top variants'
    layout: { x: 0, y: 10, w: 8, h: 5 }

  - tag: viz-ranked-outliers
    index: 'rank-outliers'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'ranked_outliers_demo'
    title: 'Outlier genes'
    description: 'Ranked by minus log10 p; hover for the statistics and the three analyses.'
    section: 'Outlier genes'
    viz_kind: 'ranked_table'
    config:
      viz_kind: "ranked_table"
      title_col: "gene"
      subtitle_col: "sample"
      score_col: "neg_log10_p"
      columns:
        - { column: "signal", label: "Signal", display: "badge" }
        - { column: "status", label: "Status", display: "badge" }
        - { column: "neg_log10_p", label: "-log10 p", display: "bar", decimals: 1, max: 8 }
      labels:
        pvalue: "p-value"
        padj: "Adjusted p"
        z_score: "z-score"
        delta_psi: "Delta PSI"
        expression: "Expression"
        splicing: "Splicing"
        mae: "MAE"
      popover_columns: ["pvalue", "padj", "z_score", "delta_psi"]
      popover_grid_columns: ["expression", "splicing", "mae"]
      top_n: 8
      selection_enabled: true
      selection_column: "gene"
    layout: { x: 0, y: 0, w: 8, h: 7 }

  - tag: table-ranked-outliers
    index: 'rank-outliers-table'
    component_type: table
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'ranked_outliers_demo'
    title: 'Outliers'
    section: 'Outlier genes'
    layout: { x: 0, y: 7, w: 8, h: 5 }

  - tag: filter-ranked-case
    index: rank-f-case
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'ranked_variants_demo'
    interactive_component_type: MultiSelect
    column_name: 'case_id'
    column_type: 'object'
    title: 'Case'
    placement: left
    section: 'Case scope'
    group: 'Case filters'
    display:
      title_size: md
      icon_name: 'mdi:family-tree'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-ranked-sample
    index: rank-f-sample
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'ranked_outliers_demo'
    interactive_component_type: MultiSelect
    column_name: 'sample'
    column_type: 'object'
    title: 'Sample'
    placement: left
    section: 'Sample scope'
    group: 'Sample filters'
    display:
      title_size: md
      icon_name: 'mdi:test-tube'
    layout: { x: 0, y: 0, w: 1, h: 3 }
