# GenomeSpy track — one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
#
# Spike for issue #1083: the same collection the Manhattan tab reads, drawn by
# GenomeSpy on a chromosome-aware locus axis. Compare the two tabs side by side;
# the evaluation is in docs/design/genomespy-eval.md.
title: 'GenomeSpy track'
subtitle: 'The Manhattan collection on a GenomeSpy locus axis: native genome zoom, chromosome grid, click-to-filter'
icon: 'tabler:dna-2'
icon_color: 'teal'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d77'
is_main_tab: false
tab_order: 35
parent_dashboard_tag: volcano
tab_icon: 'tabler:dna-2'
tab_icon_color: 'teal'

# Left-panel filter section. Deliberately not `persistent`: the tabs of this
# family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Track scope'
    icon: 'mdi:filter-variant'
    color: 'teal'
    description: 'Restricts the track to a chromosome set or a score range'

grid_sections:
  - name: 'Genome track'
    icon: 'tabler:dna-2'
    color: 'teal'
    description: 'Markers at their genomic position, drawn by GenomeSpy'

components:
  - tag: text-genomespy-track
    index: gst-text
    component_type: text
    title: 'GenomeSpy track'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Genome track'
    body: >
      The same markers as the Manhattan tab, on a GenomeSpy locus axis: chromosomes are
      concatenated by the grammar, so scroll to zoom into a locus and drag to pan along the
      genome. The dashed rule is the significance threshold. Click a marker to filter the
      rest of the dashboard by feature. The Settings ⚙ popover switches between points and
      intervals and picks a built-in assembly.
    layout: { x: 0, y: 0, w: 8, h: 1 }

  - tag: viz-genomespy-track
    index: 'gst-track'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'manhattan_demo'
    title: 'GenomeSpy track — chr × score'
    description: 'chr / pos / score on a chromosome-aware locus scale. Zoom with the wheel, pan by dragging; the threshold rule, mark type and assembly live in Settings ⚙.'
    section: 'Genome track'
    viz_kind: 'genomespy_track'
    config:
      viz_kind: "genomespy_track"
      chr_col: "chr"
      pos_col: "pos"
      score_col: "score"
      feature_col: "feature"
      score_title: "-log10(padj)"
      score_threshold: 5.0
      point_size: 5
      # Same rule as the Manhattan tab: a marker is one feature at one locus, so
      # the feature is what a click picks out, and the config has to say so.
      selection_enabled: true
      selection_column: "feature"
    layout: { x: 0, y: 2, w: 8, h: 8 }

  - tag: filter-genomespy-chr
    index: gst-f-chr
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'manhattan_demo'
    interactive_component_type: MultiSelect
    column_name: 'chr'
    column_type: 'object'
    title: 'Chromosome'
    placement: left
    section: 'Track scope'
    group: 'Locus filters'
    display:
      title_size: md
      icon_name: 'mdi:dna'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-genomespy-score
    index: gst-f-score
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'manhattan_demo'
    interactive_component_type: RangeSlider
    column_name: 'score'
    column_type: 'float64'
    title: 'Score'
    placement: left
    section: 'Track scope'
    group: 'Locus filters'
    display:
      title_size: md
      icon_name: 'mdi:chart-line'
    layout: { x: 0, y: 3, w: 1, h: 3 }
