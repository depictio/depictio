# Protein families: one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
#
# A profile HMM as a logo with the hits that matched it, the same hits as domain
# architectures, and the structure of the demo protein, linked on `entity` and
# `position`. The profile table reads the demo protein as its reference, so a
# state picked in the logo selects that residue in 3D; the hits table has no
# `position` (its domains pick on their own `start` and `end`), which is why its
# columns are all specific to it. Companion collections are bound by id, as the
# seed generator resolves no `*_dc_tag`.
#
# Compact tiles (w of 5 or less) keep their controls behind the settings icon:
# `controls_placement: popover` is set on the component AND in its config, as a
# docked or header strip would take the height of a canvas that has little.
title: 'Protein families'
subtitle: 'Profile HMM logos, the hits that matched them and their domain architectures, beside the structure they map onto.'
icon: 'mdi:family-tree'
icon_color: 'teal'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8de0'
is_main_tab: false
tab_order: 48
parent_dashboard_tag: volcano
tab_icon: 'mdi:family-tree'
tab_icon_color: 'teal'

# Left-panel filter section. Deliberately not `persistent`: the tabs of this
# family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Family scope'
    icon: 'mdi:filter-variant'
    color: 'teal'
    description: 'Narrows the domain hits, and with them the architectures and the hit lane under the logo'

grid_sections:
  - name: 'Families and architectures'
    icon: 'mdi:family-tree'
    color: 'teal'
    description: 'Two profile HMMs as logos, the domain hits of 34 proteins, and the structure they map onto'

components:
  - tag: text-protein-families
    index: fam-text
    component_type: text
    title: 'Protein families'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Families and architectures'
    body: >
      Two profile HMMs, DemoFamA (residues 30 to 101 of the demo protein) and DemoFamB (102 to 172),
      shown as logos with the domain hits that matched them, the same hits drawn as domain
      architectures, and the demo protein in 3D. The HMMs are estimated from the demo alignment by
      the fixture script, not by hmmbuild, and the hits are synthetic: scores follow identity times
      coverage. Click a state in the logo, a domain or a residue in 3D to select that range in every
      tile; hover marks it. The other 33 proteins are members of the alignment and have no structure,
      so only the demo protein follows into 3D; six of them are fragments, whose domains match only
      part of the model (zigzag edge).
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-families-logo
    index: 'fam-logo'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'protein_family_hmm_demo'
    title: 'Profile HMM logo'
    description: 'One stack per match state, letter heights from the emission probabilities (relative entropy above background), the insert probability and expected insert length beside it, and the hits that matched the model under it. Pick the model in the tile; click or brush states to select those residues of the demo protein.'
    section: 'Families and architectures'
    viz_kind: 'hmm_logo'
    config:
      viz_kind: "hmm_logo"
      profile_source: "hmm"
      entity_col: "entity"
      position_col: "position"
      model_col: "hmm_name"
      state_col: "hmm_position"
      letter_col: "hmm_letter"
      emission_col: "emission"
      insert_prob_col: "insert_prob"
      insert_length_col: "insert_length"
      occupancy_col: "occupancy"
      consensus_col: "consensus"
      rf_col: "rf"
      cs_col: "cs"
      height_mode: "relent_abovebg"
      color_scheme: "clustal"
      show_indel_rows: true
      show_consensus: true
      hits_wf_id: "646b0f3c1e4a2d7f8e5b8d01"
      hits_dc_id: "646b0f3c1e4a2d7f8e5b8de2"
      hits_model_col: "label"
      hits_entity_col: "entity"
      hits_from_col: "hmm_from"
      hits_to_col: "hmm_to"
      hits_length_col: "hmm_length"
      hits_evalue_col: "i_evalue"
      hits_score_col: "dom_score"
      hits_ali_from_col: "ali_from"
      hits_ali_to_col: "ali_to"
      hits_evalue_max: 0.01
      max_hits: 200
      selection_enabled: true
      follow_selection: true
    layout: { x: 0, y: 2, w: 8, h: 7 }

  - tag: viz-families-architecture
    index: 'fam-arch'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'protein_family_hits_demo'
    title: 'Domain architecture of each protein'
    description: 'One backbone per protein, all on the scale of the longest one, its domains coloured by family. A zigzag edge marks a partial match of the HMM on that side. Click a domain to select its span and its family.'
    section: 'Families and architectures'
    viz_kind: 'domain_architecture'
    controls_placement: popover
    config:
      viz_kind: "domain_architecture"
      controls_placement: popover
      entity_col: "entity"
      start_col: "start"
      end_col: "end"
      label_col: "label"
      protein_length_col: "protein_length"
      hmm_from_col: "hmm_from"
      hmm_to_col: "hmm_to"
      hmm_length_col: "hmm_length"
      hmm_coverage_col: "hmm_coverage"
      evalue_col: "i_evalue"
      source_col: "source"
      description_col: "description"
      accession_col: "accession"
      view: "proteins"
      scale: "shared"
      color_by: "label"
      partial_coverage: 0.9
      position_col_for_selection: "position"
      label_selection: true
      selection_enabled: true
      follow_selection: true
    layout: { x: 0, y: 9, w: 5, h: 7 }

  - tag: viz-families-structure
    index: 'fam-3d'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'protein_residues_demo'
    title: 'Structure of the demo protein'
    description: 'The model coloured by per-residue confidence. The residues picked in the logo or on a domain are drawn as red ball and stick.'
    section: 'Families and architectures'
    viz_kind: 'molecule_3d'
    controls_placement: popover
    config:
      viz_kind: "molecule_3d"
      controls_placement: popover
      structure_source: "file"
      structure_wf_id: "646b0f3c1e4a2d7f8e5b8d01"
      structure_dc_id: "646b0f3c1e4a2d7f8e5b8dd1"
      entity_col: "entity"
      position_col: "position"
      chain_col: "chain"
      color_mode: "plddt"
      representation: "cartoon"
      representations: ["cartoon"]
      highlight_site: true
      spin: false
      show_variants: false
      layout: "structure"
      selection_enabled: true
      follow_selection: true
    layout: { x: 5, y: 9, w: 3, h: 7 }

  - tag: table-families-hits
    index: 'fam-hits'
    component_type: table
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'protein_family_hits_demo'
    title: 'Domain hits'
    description: 'One row per domain hit, in the hmmsearch domain table columns. Scores and E-values are synthetic.'
    section: 'Families and architectures'
    columns:
      - entity
      - label
      - source
      - accession
      - start
      - end
      - protein_length
      - hmm_from
      - hmm_to
      - hmm_length
      - hmm_coverage
      - dom_score
      - i_evalue
      - acc
    layout: { x: 0, y: 16, w: 8, h: 5 }

  - tag: viz-families-architectures
    index: 'fam-archs'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'protein_family_hits_demo'
    title: 'Architectures'
    description: 'The proteins grouped by their ordered list of families, with the number of proteins sharing each architecture.'
    section: 'Families and architectures'
    viz_kind: 'domain_architecture'
    config:
      viz_kind: "domain_architecture"
      entity_col: "entity"
      start_col: "start"
      end_col: "end"
      label_col: "label"
      protein_length_col: "protein_length"
      hmm_from_col: "hmm_from"
      hmm_to_col: "hmm_to"
      hmm_length_col: "hmm_length"
      hmm_coverage_col: "hmm_coverage"
      evalue_col: "i_evalue"
      source_col: "source"
      description_col: "description"
      accession_col: "accession"
      view: "architectures"
      max_architectures: 15
      color_by: "label"
      position_col_for_selection: "position"
      label_selection: true
      selection_enabled: true
      follow_selection: true
    layout: { x: 0, y: 21, w: 8, h: 5 }

  - tag: filter-families-label
    index: fam-f-label
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'protein_family_hits_demo'
    interactive_component_type: MultiSelect
    column_name: 'label'
    column_type: 'object'
    title: 'Family'
    placement: left
    section: 'Family scope'
    group: 'Family filters'
    display:
      title_size: md
      icon_name: 'mdi:tag-multiple-outline'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-families-source
    index: fam-f-source
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'protein_family_hits_demo'
    interactive_component_type: MultiSelect
    column_name: 'source'
    column_type: 'object'
    title: 'Annotation source'
    placement: left
    section: 'Family scope'
    group: 'Family filters'
    display:
      title_size: md
      icon_name: 'mdi:database-outline'
    layout: { x: 0, y: 3, w: 1, h: 3 }

  - tag: filter-families-score
    index: fam-f-score
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'protein_family_hits_demo'
    interactive_component_type: RangeSlider
    column_name: 'dom_score'
    column_type: 'float64'
    title: 'Domain score (bits)'
    placement: left
    show_histogram: true
    section: 'Family scope'
    group: 'Hit filters'
    display:
      title_size: md
      icon_name: 'mdi:counter'
    layout: { x: 0, y: 6, w: 1, h: 3 }
