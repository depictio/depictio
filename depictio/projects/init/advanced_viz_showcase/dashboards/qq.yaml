# QQ plot — one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'QQ plot'
subtitle: 'Quantile-quantile of p-value distribution'
icon: 'mdi:chart-line'
icon_color: 'grape'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d43'
is_main_tab: false
tab_order: 19
parent_dashboard_tag: volcano
tab_icon: 'mdi:chart-line'
tab_icon_color: 'grape'

# Left-panel filter section. Deliberately not `persistent`: the 23 tabs of
# this family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Test scope'
    icon: 'mdi:filter-variant'
    color: 'grape'
    description: 'Restricts which tests enter the quantile comparison'

grid_sections:
  - name: 'Quantile-quantile'
    icon: 'mdi:chart-line'
    color: 'grape'
    description: 'Observed against expected significance'

components:
  - tag: text-qq
    index: qq-text
    component_type: text
    title: 'QQ plot'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Quantile-quantile'
    body: |
      Observed significance against what a null distribution would predict, with the
      diagonal drawn in. A curve that leaves the diagonal only at the top is genuine
      signal; one that lifts off along its whole length is inflation, and it means the
      test is miscalibrated rather than the biology being interesting.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-qq
    index: 'qq-plot'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'manhattan_demo'
    title: 'QQ plot — p-value distribution'
    description: 'Observed vs expected -log10(p). 95% CI band, hover surfaces designed-hit rsids.'
    section: 'Quantile-quantile'
    viz_kind: 'qq'
    config:
      viz_kind: "qq"
      p_value_col: "p_value"
      feature_id_col: "feature"
      show_ci: true
    layout: { x: 0, y: 2, w: 8, h: 8 }

  - tag: filter-qq-score
    index: qq-f-score
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'manhattan_demo'
    interactive_component_type: RangeSlider
    column_name: 'score'
    column_type: 'float64'
    title: 'Score'
    placement: left
    section: 'Test scope'
    group: 'Test filters'
    display:
      title_size: md
      custom_color: '#8E44AD'
      icon_name: 'mdi:chart-line'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-qq-chr
    index: qq-f-chr
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'manhattan_demo'
    interactive_component_type: MultiSelect
    column_name: 'chr'
    column_type: 'object'
    title: 'Chromosome'
    placement: left
    section: 'Test scope'
    group: 'Test filters'
    display:
      title_size: md
      custom_color: '#F68B33'
      icon_name: 'mdi:dna'
    layout: { x: 0, y: 3, w: 1, h: 3 }
