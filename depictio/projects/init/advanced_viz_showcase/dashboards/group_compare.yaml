# Group comparison — one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
#
# The only tab whose chart is not a picture of the collection but a test run
# over it: two groups of rows are compared feature by feature on the server as
# a background job. The tile opens on two clusters already compared
# (`default_group_a` / `default_group_b` + `auto_run`, one cached job), and the
# scatter beside it is where a reader makes groups of their own.
title: 'Cluster markers'
subtitle: 'Two groups of cells compared gene by gene: a rank-sum test per feature, a volcano, and the ranked markers behind it'
icon: 'mdi:scale-balance'
icon_color: 'grape'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d7b'
is_main_tab: false
tab_order: 38
parent_dashboard_tag: volcano
tab_icon: 'mdi:scale-balance'
tab_icon_color: 'grape'

# Left-panel filter section. Deliberately not `persistent`: the tabs of this
# family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Cell scope'
    icon: 'mdi:filter-variant'
    color: 'grape'
    description: 'Restricts which cells enter the comparison, by cluster'

grid_sections:
  - name: 'Two groups of cells, compared'
    icon: 'mdi:scale-balance'
    color: 'grape'
    description: 'Groups come from the cluster label or from a selection saved on the scatter; the test runs on the server and is cached'

components:
  - tag: text-group-compare
    index: gcp-text
    component_type: text
    title: 'Group comparison'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Two groups of cells, compared'
    body: >
      Every gene of a cell by gene matrix is tested between two groups of cells (a Wilcoxon
      rank-sum per gene) and drawn as a volcano with the ranked markers below; the tab opens on
      cluster_1 against cluster_2, whose planted markers gene_01 to gene_04 stand out. Change
      Group A or Group B in the tile header, or box-select cells on the scatter, save them as a
      group from the Analysis panel and pick that group instead. Inputs are per-cell matrices
      from nf-core/scrnaseq once clustered, or per-sample tables grouped by condition such as
      nf-core/rnaseq normalised counts.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-group-compare-scatter
    index: 'gcp-scatter'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'group_compare_demo'
    title: 'Cells by two marker genes'
    description: 'One point per cell, a cluster_1 marker against a cluster_2 marker, coloured by the cluster label. Box-select points and save them as a group to compare something other than the shipped labels.'
    section: 'Two groups of cells, compared'
    viz_kind: 'scatter_xy'
    config:
      viz_kind: "scatter_xy"
      x_col: "gene_01"
      y_col: "gene_03"
      label_col: "cell_id"
      color_col: "cluster"
      x_title: "gene_01 (cluster_1 marker)"
      y_title: "gene_03 (cluster_2 marker)"
      opacity: 0.7
      min_size: 6
      max_size: 6
      top_n_labels: 0
      legend_pos: "right"
      # A point here is one cell, so a selection names cells: that is what a
      # saved group has to capture for the comparison to resolve it to rows.
      selection_enabled: true
      selection_column: "cell_id"
    layout: { x: 0, y: 2, w: 3, h: 12 }

  - tag: viz-group-compare
    index: 'gcp-volcano'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'group_compare_demo'
    title: 'Group A against group B'
    description: 'Every gene tested between the two picked groups, drawn as effect size against adjusted significance. Groups and test sit in the header; the log1p transform, the two thresholds and the label budget in Settings.'
    section: 'Two groups of cells, compared'
    viz_kind: 'group_compare'
    config:
      viz_kind: "group_compare"
      index_col: "cell_id"
      group_col: "cluster"
      test: "wilcoxon"
      log_transform: true
      max_features: 2000
      min_observations: 3
      fdr_threshold: 0.05
      log2fc_threshold: 1.0
      top_n_labels: 10
      # Opens on two clusters already compared: one job per distinct request,
      # answered from the server's result cache on every later open.
      default_group_a: "cluster_1"
      default_group_b: "cluster_2"
      auto_run: true
      controls_placement: "header"
    layout: { x: 3, y: 2, w: 5, h: 12 }

  - tag: filter-group-compare-cluster
    index: gcp-f-cluster
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'group_compare_demo'
    interactive_component_type: MultiSelect
    column_name: 'cluster'
    column_type: 'object'
    title: 'Cluster'
    placement: left
    section: 'Cell scope'
    group: 'Cell filters'
    display:
      title_size: md
      icon_name: 'mdi:shape-outline'
    layout: { x: 0, y: 0, w: 1, h: 3 }
