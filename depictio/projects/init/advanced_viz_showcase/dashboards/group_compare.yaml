# Group comparison — one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
#
# The only tab whose chart is not a picture of the collection but a test run
# over it: the reader picks two groups of rows and the server compares every
# feature between them as a background job. The scatter beside it is where the
# groups come from, so the two tiles together are the whole loop.
title: 'Group comparison'
subtitle: 'Two groups of cells compared gene by gene on demand: a rank-sum test per feature, a volcano, and the ranked markers behind it'
icon: 'mdi:scale-balance'
icon_color: 'grape'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d7b'
is_main_tab: false
tab_order: 38
parent_dashboard_tag: volcano
tab_icon: 'mdi:scale-balance'
tab_icon_color: 'grape'

# Left-panel filter section. Deliberately not `persistent`: the tabs of this
# family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Cell scope'
    icon: 'mdi:filter-variant'
    color: 'grape'
    description: 'Restricts which cells enter the comparison, by cluster'

grid_sections:
  - name: 'Pick two groups'
    icon: 'mdi:chart-scatter-plot'
    color: 'grape'
    description: 'Where a selection becomes a group: lasso cells, save them, compare'
  - name: 'Differential test'
    icon: 'mdi:scale-balance'
    color: 'grape'
    description: 'A per-feature test between the two groups, run on the server and cached'

components:
  - tag: text-group-compare
    index: gcp-text
    component_type: text
    title: 'Group comparison'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Pick two groups'
    body: >
      The collection is a wide matrix: one row per cell, one column per gene. Box-select
      cells on the scatter and save the selection as a group from the Analysis panel, twice,
      then pick the two groups on the right and press Compare. The test runs as a background
      job and its result is cached, so the same comparison comes back instantly. With no
      saved group the two pickers fall back to the cluster labels the matrix shipped with.
      Six genes were planted as cluster markers, so a comparison between two clusters should
      return exactly those four that belong to them.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-group-compare-scatter
    index: 'gcp-scatter'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'group_compare_demo'
    title: 'Cells by two marker genes'
    description: 'One point per cell, a cluster_1 marker against a cluster_2 marker, coloured by the cluster label. Box-select points and save them as a group to compare something other than the shipped labels.'
    section: 'Pick two groups'
    viz_kind: 'scatter_xy'
    config:
      viz_kind: "scatter_xy"
      x_col: "gene_01"
      y_col: "gene_03"
      label_col: "cell_id"
      color_col: "cluster"
      x_title: "gene_01 (cluster_1 marker)"
      y_title: "gene_03 (cluster_2 marker)"
      opacity: 0.7
      min_size: 6
      max_size: 6
      top_n_labels: 0
      legend_pos: "right"
      # A point here is one cell, so a selection names cells: that is what a
      # saved group has to capture for the comparison to resolve it to rows.
      selection_enabled: true
      selection_column: "cell_id"
    layout: { x: 0, y: 2, w: 3, h: 10 }

  - tag: viz-group-compare
    index: 'gcp-volcano'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'group_compare_demo'
    title: 'Group A against group B'
    description: 'Every gene tested between the two picked groups, drawn as effect size against adjusted significance. The test, the log1p transform, the two thresholds and the label budget live in the Settings popover.'
    section: 'Differential test'
    viz_kind: 'group_compare'
    config:
      viz_kind: "group_compare"
      index_col: "cell_id"
      group_col: "cluster"
      test: "wilcoxon"
      log_transform: true
      max_features: 2000
      min_observations: 3
      fdr_threshold: 0.05
      log2fc_threshold: 1.0
      top_n_labels: 10
    layout: { x: 3, y: 2, w: 5, h: 10 }

  - tag: filter-group-compare-cluster
    index: gcp-f-cluster
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'group_compare_demo'
    interactive_component_type: MultiSelect
    column_name: 'cluster'
    column_type: 'object'
    title: 'Cluster'
    placement: left
    section: 'Cell scope'
    group: 'Cell filters'
    display:
      title_size: md
      icon_name: 'mdi:shape-outline'
    layout: { x: 0, y: 0, w: 1, h: 3 }
