# Stacked taxonomy — one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Stacked taxonomy'
subtitle: 'Per-sample composition. Toggle ''Normalise'' inside the viz to switch between raw counts and 0–100% stacks.'
icon: 'mdi:chart-bar-stacked'
icon_color: 'blue'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d14'
is_main_tab: false
tab_order: 3
parent_dashboard_tag: volcano
tab_icon: 'mdi:chart-bar-stacked'
tab_icon_color: 'blue'

# Left-panel filter section. Deliberately not `persistent`: the 23 tabs of
# this family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Taxonomic scope'
    icon: 'mdi:filter-variant'
    color: 'blue'
    description: 'Restricts which lineages are stacked'

grid_sections:
  - name: 'Community composition'
    icon: 'mdi:chart-bar'
    color: 'blue'
    description: 'Relative abundance per sample, stacked by taxon'

components:
  - tag: text-stacked_taxonomy
    index: tax-text
    component_type: text
    title: 'Stacked taxonomy'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Community composition'
    body: |
      One stacked bar per sample, segments sized by abundance and coloured by taxon.
      Switching the rank in the settings menu recomputes the stack from the lineage
      columns rather than re-aggregating upstream. Filtering to a phylum on the left is
      what turns a wall of colour into a readable comparison.
    layout: { x: 0, y: 0, w: 8, h: 1 }

  - tag: viz-stacked_taxonomy
    index: 'tax-stacked'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'stacked_taxonomy_demo'
    title: 'Stacked composition by sample'
    description: 'Per-sample relative abundance per rank. Toggle Normalise in Settings ⚙ to switch between raw counts and 0–100 % stacks.'
    section: 'Community composition'
    viz_kind: 'stacked_taxonomy'
    config:
      viz_kind: "stacked_taxonomy"
      sample_id_col: "sample_id"
      taxon_col: "taxon"
      rank_col: "rank"
      abundance_col: "abundance"
      default_rank: "Phylum"
      top_n: 12
      sort_by: "abundance"
      normalise_to_one: true
    layout: { x: 0, y: 1, w: 8, h: 8 }

  - tag: filter-stacked_taxonomy-phylum
    index: tax-f-phylum
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'stacked_taxonomy_demo'
    interactive_component_type: MultiSelect
    column_name: 'Phylum'
    column_type: 'object'
    title: 'Phylum'
    placement: left
    section: 'Taxonomic scope'
    group: 'Taxonomy'
    display:
      title_size: md
      custom_color: '#45B8AC'
      icon_name: 'mdi:bacteria'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-stacked_taxonomy-genus
    index: tax-f-genus
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'stacked_taxonomy_demo'
    interactive_component_type: MultiSelect
    column_name: 'Genus'
    column_type: 'object'
    title: 'Genus'
    placement: left
    section: 'Taxonomic scope'
    group: 'Taxonomy'
    display:
      title_size: md
      custom_color: '#2E7D32'
      icon_name: 'mdi:bacteria'
    layout: { x: 0, y: 3, w: 1, h: 3 }

  - tag: filter-stacked_taxonomy-sample
    index: tax-f-sample
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'stacked_taxonomy_demo'
    interactive_component_type: MultiSelect
    column_name: 'sample_id'
    column_type: 'object'
    title: 'Sample'
    placement: left
    section: 'Taxonomic scope'
    group: 'Taxonomy'
    display:
      title_size: md
      custom_color: '#1976D2'
      icon_name: 'mdi:flask'
    layout: { x: 0, y: 6, w: 1, h: 3 }
