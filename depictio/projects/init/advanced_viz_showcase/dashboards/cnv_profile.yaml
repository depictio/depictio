# Copy-number profile: one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Copy-number profile'
subtitle: 'A synthetic somatic profile over 5 chromosomes: 20 000 bins of log2 ratio, the called segments laid over them, and the B-allele frequency underneath that catches the copy-neutral LOH the log2 track cannot see.'
icon: 'mdi:chart-timeline-variant'
icon_color: 'red'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d7d'
is_main_tab: false
tab_order: 41
parent_dashboard_tag: volcano
tab_icon: 'mdi:chart-timeline-variant'
tab_icon_color: 'red'

# Left-panel filter section. Deliberately not `persistent`: the tabs of this
# family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Profile scope'
    icon: 'mdi:filter-variant'
    color: 'red'
    description: 'Restricts which sample, which chromosomes and which row type the profile is built from'

grid_sections:
  - name: 'Copy number'
    icon: 'mdi:dna'
    color: 'red'
    description: 'Bin-level evidence, the segments called over it, and the allele fractions underneath'

components:
  - tag: text-cnv-profile
    index: cnv-text
    component_type: text
    title: 'Copy-number profile'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Copy number'
    body: >
      Each point is a 20 kb bin, plotted at its log2 ratio against a diploid baseline, and the
      thick strokes are the segments a caller made over them: red where the segment reads as a
      gain, blue as a loss, grey where it is neutral. Read the two together. The gain on chr1 and
      the loss on chr2 are visible in the log2 track alone, but the chr3 event is not: its total
      copy number never moves, and only the B-allele frequency underneath shows it, splitting away
      from 0.5 because the region lost one parental haplotype. Sample, chromosome zoom, axis limit
      and marker size live in the Settings gear popover.
    layout: { x: 0, y: 0, w: 8, h: 3 }

  - tag: viz-cnv-profile
    index: 'cnv-track'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'cnv_profile_demo'
    title: 'Copy-number profile'
    description: '20 000 bins over 5 chromosomes with the called segments over them and the B-allele frequency below. Sample, chromosome zoom, log2 axis limit, marker size and the BAF panel live in the Settings gear popover.'
    section: 'Copy number'
    viz_kind: 'cnv_profile'
    config:
      viz_kind: "cnv_profile"
      sample_col: "sample"
      chrom_col: "chrom"
      start_col: "start"
      end_col: "end"
      log2_col: "log2"
      baf_col: "baf"
      copy_number_col: "copy_number"
      segment_col: "segment"
      label_col: "label"
      sample: "TUMOUR_A"
      y_range: 3.0
      show_baf: true
      point_size: 3
      gain_threshold: 0.3
      loss_threshold: -0.3
      max_bins: 50000
    layout: { x: 0, y: 3, w: 8, h: 10 }

  - tag: filter-cnv-profile-sample
    index: cnv-f-sample
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'cnv_profile_demo'
    interactive_component_type: MultiSelect
    column_name: 'sample'
    column_type: 'object'
    title: 'Sample'
    placement: left
    section: 'Profile scope'
    group: 'Profile filters'
    display:
      title_size: md
      custom_color: '#FA5252'
      icon_name: 'mdi:test-tube'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-cnv-profile-chrom
    index: cnv-f-chrom
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'cnv_profile_demo'
    interactive_component_type: MultiSelect
    column_name: 'chrom'
    column_type: 'object'
    title: 'Chromosome'
    placement: left
    section: 'Profile scope'
    group: 'Profile filters'
    display:
      title_size: md
      custom_color: '#E64980'
      icon_name: 'mdi:dna'
    layout: { x: 0, y: 3, w: 1, h: 3 }

  - tag: filter-cnv-profile-copy-number
    index: cnv-f-copy-number
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'cnv_profile_demo'
    interactive_component_type: RangeSlider
    column_name: 'copy_number'
    column_type: 'int64'
    title: 'Copy number'
    placement: left
    section: 'Profile scope'
    group: 'Profile filters'
    display:
      title_size: md
      custom_color: '#FD7E14'
      icon_name: 'mdi:numeric'
    layout: { x: 0, y: 6, w: 1, h: 3 }
