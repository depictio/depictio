# Copy-number profile: one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Copy number'
subtitle: 'Allele-specific copy number of a synthetic tumour in the ASCAT layout: nMajor and nMinor per segment, the log2 ratio of 20 000 bins with the calls over them, and the mirrored B-allele frequency that exposes the copy-neutral LOH the log2 track cannot see.'
icon: 'mdi:chart-timeline-variant'
icon_color: 'red'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d7d'
is_main_tab: false
tab_order: 41
parent_dashboard_tag: volcano
tab_icon: 'mdi:chart-timeline-variant'
tab_icon_color: 'red'

# Left-panel filter section. Deliberately not `persistent`: the tabs of this
# family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Profile scope'
    icon: 'mdi:filter-variant'
    color: 'red'
    description: 'Restricts which sample, which chromosomes and which row type the profile is built from'

grid_sections:
  - name: 'Copy number'
    icon: 'mdi:dna'
    color: 'red'
    description: 'Bin-level evidence, the segments called over it, and the allele fractions underneath'

components:
  - tag: text-cnv-profile
    index: cnv-text
    component_type: text
    title: 'Allele-specific copy number'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Copy number'
    body: >
      Top to bottom: nMajor (red) and nMinor (green) per called segment, the log2 ratio of each
      20 kb bin under segments coloured gain, neutral or loss, and the B-allele frequency with
      mirrored segment bands. On chr3 log2 stays flat while nMinor drops to 0 and the BAF splits,
      a copy-neutral LOH only the allele-specific tracks show. Scroll to zoom, shift-drag to brush
      a region, switch sample or view in the header; inputs come from nf-core/sarek (ASCAT,
      Control-FREEC, CNVkit), and the hg38 gene lane is only an orientation aid on this
      synthetic genome.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-cnv-profile
    index: 'cnv-track'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'cnv_profile_demo'
    title: 'Copy-number profile, ASCAT layout'
    description: 'TUMOUR_A over 5 chromosomes: allele-specific copy number, log2 ratio and mirrored BAF on one zoomable genome axis. The header switches sample, stacks both samples, or returns to the Plotly profile.'
    section: 'Copy number'
    viz_kind: 'cnv_profile'
    config:
      viz_kind: "cnv_profile"
      view: "locus"
      controls_placement: "header"
      sample_col: "sample"
      chrom_col: "chrom"
      start_col: "start"
      end_col: "end"
      log2_col: "log2"
      baf_col: "baf"
      copy_number_col: "copy_number"
      minor_copy_number_col: "minor_copy_number"
      segment_col: "segment"
      label_col: "label"
      sample: "TUMOUR_A"
      annotation: "hg38"
      facet_by_sample: false
      y_range: 3.0
      show_baf: true
      point_size: 3
      gain_threshold: 0.3
      loss_threshold: -0.3
      max_bins: 50000
    layout: { x: 0, y: 2, w: 8, h: 12 }

  - tag: filter-cnv-profile-sample
    index: cnv-f-sample
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'cnv_profile_demo'
    interactive_component_type: MultiSelect
    column_name: 'sample'
    column_type: 'object'
    title: 'Sample'
    placement: left
    section: 'Profile scope'
    group: 'Profile filters'
    display:
      title_size: md
      custom_color: '#FA5252'
      icon_name: 'mdi:test-tube'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-cnv-profile-chrom
    index: cnv-f-chrom
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'cnv_profile_demo'
    interactive_component_type: MultiSelect
    column_name: 'chrom'
    column_type: 'object'
    title: 'Chromosome'
    placement: left
    section: 'Profile scope'
    group: 'Profile filters'
    display:
      title_size: md
      custom_color: '#E64980'
      icon_name: 'mdi:dna'
    layout: { x: 0, y: 3, w: 1, h: 3 }

  - tag: filter-cnv-profile-copy-number
    index: cnv-f-copy-number
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'cnv_profile_demo'
    interactive_component_type: RangeSlider
    column_name: 'copy_number'
    column_type: 'int64'
    title: 'Copy number'
    placement: left
    section: 'Profile scope'
    group: 'Profile filters'
    display:
      title_size: md
      custom_color: '#FD7E14'
      icon_name: 'mdi:numeric'
    layout: { x: 0, y: 6, w: 1, h: 3 }
