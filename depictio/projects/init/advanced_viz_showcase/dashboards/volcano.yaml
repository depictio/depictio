# Advanced Visualisations — one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Advanced Visualisations'
subtitle: 'Showcase of advanced visualisation kinds (volcano, manhattan, clustering, …) backed by synthetic fixtures'
icon: 'mdi:chart-scatter-plot'
icon_color: 'red'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d00'
is_main_tab: true
tab_order: 0
main_tab_name: 'Volcano'
tab_icon: 'mdi:chart-scatter-plot'
tab_icon_color: 'red'

# Left-panel filter section. Deliberately not `persistent`: the 23 tabs of
# this family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Feature scope'
    icon: 'mdi:filter-variant'
    color: 'red'
    description: 'Restricts the point cloud before the thresholds are applied'

grid_sections:
  - name: 'Volcano'
    icon: 'mdi:chart-scatter-plot'
    color: 'red'
    description: 'Effect size against significance, with the thresholds drawn in'
  # Carries a single text tile and no data binding, which is what makes it safe
  # to fan out: there is no column name for a sibling tab to mis-resolve.
  - name: 'About this showcase'
    icon: 'mdi:information-outline'
    color: gray
    description: 'What this project is, and what it is not'
    collapsed: true
    persistent: true
    pin: bottom

components:
  - tag: text-volcano
    index: vol-text
    component_type: text
    title: 'Volcano plot'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Volcano'
    body: |
      Every feature placed by its effect size against its significance, with the two
      threshold lines drawn rather than assumed. The features worth reading are the ones
      far from the centre and high up; the top-N labels name them for you, and the
      search box in the settings menu finds a specific one. Narrowing the category or
      raising the significance floor on the left removes points rather than greying them
      out.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-volcano
    index: 'vol-volcano'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'volcano_demo'
    title: 'Volcano plot — differential abundance'
    description: 'Effect size vs significance with builtin thresholds, top-N labels and search. Settings ⚙ at top-right.'
    section: 'Volcano'
    viz_kind: 'volcano'
    config:
      viz_kind: "volcano"
      feature_id_col: "feature_id"
      effect_size_col: "effect_size"
      significance_col: "significance"
      label_col: "label"
      category_col: "category"
      significance_is_neg_log10: false
      significance_threshold: 0.05
      effect_threshold: 1.0
      top_n_labels: 15
    layout: { x: 0, y: 2, w: 8, h: 8 }

  - tag: filter-volcano-category
    index: vol-f-category
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'volcano_demo'
    interactive_component_type: MultiSelect
    column_name: 'category'
    column_type: 'object'
    title: 'Category'
    placement: left
    section: 'Feature scope'
    group: 'Feature filters'
    display:
      title_size: md
      custom_color: '#E74C3C'
      icon_name: 'mdi:form-select'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-volcano-significance
    index: vol-f-significance
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'volcano_demo'
    interactive_component_type: RangeSlider
    column_name: 'significance'
    column_type: 'float64'
    title: 'Significance'
    placement: left
    section: 'Feature scope'
    group: 'Feature filters'
    display:
      title_size: md
      custom_color: '#F68B33'
      icon_name: 'mdi:target'
    layout: { x: 0, y: 3, w: 1, h: 3 }

  - tag: filter-volcano-effect
    index: vol-f-effect
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'volcano_demo'
    interactive_component_type: RangeSlider
    column_name: 'effect_size'
    column_type: 'float64'
    title: 'Effect size'
    placement: left
    section: 'Feature scope'
    group: 'Feature filters'
    display:
      title_size: md
      custom_color: '#1976D2'
      icon_name: 'mdi:trending-up'
    layout: { x: 0, y: 6, w: 1, h: 3 }

  - tag: text-about-showcase
    index: vol-about
    component_type: text
    title: 'About this showcase'
    order: 4
    alignment: left
    vertical_alignment: top
    section: 'About this showcase'
    body: |
      Each tab of this project is one advanced visualisation kind, rendered from a small
      synthetic fixture rather than from a real pipeline run. The point is the kind:
      what question it answers, what its settings menu can change, and what a left-panel
      filter does to it. Nothing here is a result. For the same components on real data,
      look at the nf-core/ampliseq and nf-core/viralrecon reference projects.
    layout: { x: 0, y: 0, w: 8, h: 2 }
