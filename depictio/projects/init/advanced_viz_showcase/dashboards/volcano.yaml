# Differential expression: the main tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
#
# `title` is the name of the whole showcase dashboard (the breadcrumb prefix);
# the label of this tab is `main_tab_name`. The volcano, MA and QQ views used to
# be three tabs; they are one tile with a view switch now, which is why this tab
# binds `avg_log_intensity_col` (MA) and `p_value_col` (QQ).
title: 'Advanced Visualisations'
subtitle: 'Showcase of the advanced visualisation kinds, each on a small synthetic fixture'
icon: 'mdi:chart-scatter-plot'
icon_color: 'red'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d00'
is_main_tab: true
tab_order: 0
main_tab_name: 'Differential expression'
tab_icon: 'mdi:chart-scatter-plot'
tab_icon_color: 'red'

# Left-panel filter section. Deliberately not `persistent`: the tabs of this
# family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Feature scope'
    icon: 'mdi:filter-variant'
    color: 'red'
    description: 'Restricts the features drawn before the thresholds are applied'

grid_sections:
  - name: 'Differential expression'
    icon: 'mdi:chart-scatter-plot'
    color: 'red'
    description: 'One table of test results read as a volcano, an MA plot or a QQ plot'
  # Carries a single text tile and no data binding, which is what makes it safe
  # to fan out: there is no column name for a sibling tab to mis-resolve.
  - name: 'About this showcase'
    icon: 'mdi:information-outline'
    color: gray
    description: 'What this project is, and what it is not'
    collapsed: true
    persistent: true
    pin: bottom

components:
  - tag: text-volcano
    index: vol-text
    component_type: text
    title: 'Differential expression'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Differential expression'
    body: >
      One row per gene from a differential expression test, read three ways with the switch
      in the tile header: volcano (fold change against significance), MA (fold change
      against mean abundance, where low-count noise shows as a funnel) and QQ (observed
      against expected p-values, where a curve lifting off early means an inflated test).
      The input is a DESeq2 or limma results table as nf-core/differentialabundance
      publishes it after nf-core/rnaseq.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-volcano
    index: 'vol-volcano'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'volcano_demo'
    title: 'Differential expression'
    description: 'Volcano, MA and QQ views of the same test results. The view switch and the thresholds sit in the tile header.'
    section: 'Differential expression'
    viz_kind: 'volcano'
    config:
      viz_kind: "volcano"
      feature_id_col: "feature_id"
      effect_size_col: "effect_size"
      significance_col: "significance"
      label_col: "label"
      category_col: "category"
      significance_is_neg_log10: false
      significance_threshold: 0.05
      effect_threshold: 1.0
      top_n_labels: 15
      avg_log_intensity_col: "avg_log_intensity"
      log2_fold_change_col: "effect_size"
      p_value_col: "significance"
      fold_change_threshold: 1.0
      view: "volcano"
      views: ["volcano", "ma", "qq"]
      controls_placement: "header"
    layout: { x: 0, y: 2, w: 8, h: 9 }

  - tag: filter-volcano-category
    index: vol-f-category
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'volcano_demo'
    interactive_component_type: MultiSelect
    column_name: 'category'
    column_type: 'object'
    title: 'Category'
    placement: left
    section: 'Feature scope'
    group: 'Feature filters'
    display:
      title_size: md
      custom_color: '#E74C3C'
      icon_name: 'mdi:form-select'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-volcano-significance
    index: vol-f-significance
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'volcano_demo'
    interactive_component_type: RangeSlider
    column_name: 'significance'
    column_type: 'float64'
    title: 'P-value'
    placement: left
    section: 'Feature scope'
    group: 'Feature filters'
    show_histogram: true
    display:
      title_size: md
      custom_color: '#F68B33'
      icon_name: 'mdi:target'
    layout: { x: 0, y: 3, w: 1, h: 3 }

  - tag: filter-volcano-effect
    index: vol-f-effect
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'volcano_demo'
    interactive_component_type: RangeSlider
    column_name: 'effect_size'
    column_type: 'float64'
    title: 'Log2 fold change'
    placement: left
    section: 'Feature scope'
    group: 'Feature filters'
    display:
      title_size: md
      custom_color: '#1976D2'
      icon_name: 'mdi:trending-up'
    layout: { x: 0, y: 6, w: 1, h: 3 }

  - tag: text-about-showcase
    index: vol-about
    component_type: text
    title: 'About this showcase'
    order: 4
    alignment: left
    vertical_alignment: top
    section: 'About this showcase'
    body: >
      Each tab of this project is one advanced visualisation kind, rendered from a small
      synthetic fixture rather than a real run. Nothing here is a result. For the same
      components on real data, look at the nf-core/ampliseq and nf-core/viralrecon reference
      projects.
    layout: { x: 0, y: 0, w: 8, h: 1 }
