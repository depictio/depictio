# Ranked distribution: one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Gene stability'
subtitle: 'The most stable genes of a synthetic cohort, ranked by their stability score, each drawn with the spread of its normalised counts beside the score that ranked it.'
icon: 'mdi:chart-box-outline'
icon_color: 'grape'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8f50'
is_main_tab: false
tab_order: 52
parent_dashboard_tag: volcano
tab_icon: 'mdi:chart-box-outline'
tab_icon_color: 'grape'

# Left-panel filter section. Deliberately not `persistent`: the tabs of this
# family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing. Both collections of this tab carry
# `section` and `stability_score`, so each filter narrows both tiles.
filter_sections:
  - name: 'Gene scope'
    icon: 'mdi:filter-variant'
    color: 'grape'
    description: 'Restricts which genes are ranked, by expression section and by stability score'

grid_sections:
  - name: 'Stability ranking'
    icon: 'mdi:chart-box-outline'
    color: 'grape'
    description: 'The top genes by stability score, with the box statistics of their counts over the whole cohort'
  - name: 'Per-sample values'
    icon: 'mdi:chart-bell-curve'
    color: 'grape'
    description: 'The raw counts of the 40 most stable genes, summarised by the tile itself'

components:
  - tag: text-ranked-distribution
    index: rankdist-text
    component_type: text
    title: 'Gene stability'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Stability ranking'
    body: >
      Each row is a gene, ranked by its stability score (lower is more stable, as in
      nf-core/stableexpression): the box on the left is the spread of its normalised counts
      across 4332 samples, the lollipop on the right is the score itself. The boxes are
      coloured by expression section, so a stable gene reads the same whether it is highly or
      lowly expressed. Click a gene to select it on both tiles, and change Top N or the order
      in the controls.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-ranked-distribution-cohort
    index: 'rankdist-cohort'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'ranked_distribution_demo'
    title: 'Most stable genes across the cohort'
    description: 'The 25 genes with the lowest stability score out of 200. Each box summarises 4332 samples from statistics computed upstream, on a log axis because the sections span four decades of counts.'
    section: 'Stability ranking'
    viz_kind: 'ranked_distribution'
    config:
      viz_kind: "ranked_distribution"
      feature_id_col: "gene_id"
      score_col: "stability_score"
      rank_col: "rank"
      label_col: "gene_name"
      group_col: "section"
      q1_col: "q1"
      median_col: "median"
      q3_col: "q3"
      lower_col: "lower"
      upper_col: "upper"
      mean_col: "mean"
      top_n: 25
      ascending: true
      distribution: "box"
      orientation: "horizontal"
      score_label: "Stability score (lower is more stable)"
      value_label: "Normalised count"
      log_value: true
      max_features: 200
      selection_enabled: true
    layout: { x: 0, y: 2, w: 8, h: 5 }

  - tag: viz-ranked-distribution-values
    index: 'rankdist-values'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'ranked_distribution_values_demo'
    title: 'Per-sample counts of the most stable genes'
    description: 'The same ranking from the raw counts of 40 genes over 60 samples, one row per gene and sample: the tile computes each box itself, and can draw violins instead.'
    section: 'Per-sample values'
    viz_kind: 'ranked_distribution'
    config:
      viz_kind: "ranked_distribution"
      feature_id_col: "gene_id"
      score_col: "stability_score"
      label_col: "gene_name"
      group_col: "section"
      value_col: "value"
      top_n: 20
      ascending: true
      distribution: "violin"
      orientation: "horizontal"
      score_label: "Stability score (lower is more stable)"
      value_label: "Normalised count"
      log_value: true
      max_features: 40
      selection_enabled: true
    layout: { x: 0, y: 0, w: 8, h: 5 }

  - tag: filter-ranked-distribution-section
    index: rankdist-f-section
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'ranked_distribution_demo'
    interactive_component_type: MultiSelect
    column_name: 'section'
    column_type: 'object'
    title: 'Expression section'
    placement: left
    section: 'Gene scope'
    group: 'Gene filters'
    display:
      title_size: md
      icon_name: 'mdi:layers-outline'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-ranked-distribution-score
    index: rankdist-f-score
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'ranked_distribution_demo'
    interactive_component_type: RangeSlider
    column_name: 'stability_score'
    column_type: 'float64'
    title: 'Stability score'
    placement: left
    section: 'Gene scope'
    group: 'Gene filters'
    show_histogram: true
    display:
      title_size: md
      icon_name: 'mdi:chart-bell-curve'
    layout: { x: 0, y: 3, w: 1, h: 3 }
