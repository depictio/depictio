# Single-cell UMAP: one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Single-cell UMAP'
subtitle: 'Cells of a PBMC sample on their UMAP, coloured by annotated cell type'
icon: 'mdi:scatter-plot'
icon_color: 'indigo'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8df1'
is_main_tab: false
tab_order: 50
parent_dashboard_tag: volcano
tab_icon: 'mdi:blood-bag'
tab_icon_color: 'indigo'

# Left-panel filter section. Deliberately not `persistent`, like the other
# tabs of this family.
filter_sections:
  - name: 'Cell scope'
    icon: 'mdi:filter-variant'
    color: 'indigo'
    description: 'Restricts which cells are drawn, not the embedding itself'

grid_sections:
  - name: 'Cell embedding'
    icon: 'mdi:chart-scatter-plot'
    color: 'indigo'
    description: 'One point per cell, coloured by cell type'

components:
  - tag: text-sc_umap
    index: scumap-text
    component_type: text
    title: 'Single-cell UMAP'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Cell embedding'
    body: >
      4,355 cells from four donors, one point per cell on the UMAP of a clustered and annotated
      PBMC sample, coloured by cell type. Thousands of points draw small; Colour by switches to
      the donor or the number of detected genes. Input: the cell table of nf-core/scrnaseq
      after clustering and annotation (Scanpy or Seurat obs with its X_umap).
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-sc_umap
    index: 'scumap-embedding'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'sc_umap_demo'
    title: 'PBMC cells (UMAP)'
    description: 'One point per cell, coloured by annotated cell type. Pre-computed UMAP coordinates.'
    section: 'Cell embedding'
    viz_kind: 'embedding'
    config:
      viz_kind: "embedding"
      sample_id_col: "cell_id"
      dim_1_col: "umap_1"
      dim_2_col: "umap_2"
      cluster_col: "cell_type"
      axis_prefix: "UMAP"
      point_size: 3
      plot_style: "default"
      show_density: false
      selection_enabled: true
      controls_placement: "header"
    layout: { x: 0, y: 2, w: 8, h: 9 }

  - tag: filter-sc_umap-cell_type
    index: scumap-f-celltype
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'sc_umap_demo'
    interactive_component_type: MultiSelect
    column_name: 'cell_type'
    column_type: 'object'
    title: 'Cell type'
    placement: left
    section: 'Cell scope'
    group: 'Cells'
    display:
      title_size: md
      custom_color: '#3F51B5'
      icon_name: 'mdi:blood-bag'
    layout: { x: 0, y: 0, w: 1, h: 3 }
