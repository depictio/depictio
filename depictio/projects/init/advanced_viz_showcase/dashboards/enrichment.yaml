# Pathway enrichment (GSEA) — one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Pathway enrichment (GSEA)'
subtitle: 'Dot plot of top pathways across 5 ontologies. Drag the Source filter, tune padj / Top-N in Settings ⚙.'
icon: 'mdi:chart-bubble'
icon_color: 'violet'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d26'
is_main_tab: false
tab_order: 13
parent_dashboard_tag: volcano
tab_icon: 'mdi:chart-bubble'
tab_icon_color: 'violet'

# Left-panel filter section. Deliberately not `persistent`: the 23 tabs of
# this family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Term scope'
    icon: 'mdi:filter-variant'
    color: 'violet'
    description: 'Restricts which ontologies and which set sizes are shown'

grid_sections:
  - name: 'Enrichment'
    icon: 'mdi:chart-donut'
    color: 'violet'
    description: 'Enriched terms by normalised score and set size'

components:
  - tag: text-enrichment
    index: gsea-text
    component_type: text
    title: 'Gene-set enrichment'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Enrichment'
    body: >
      One point per enriched term, placed by normalised enrichment score, sized by how many
      genes the set contains and coloured by adjusted p-value. A large point far from zero
      is a big set moving coherently, a stronger claim than a small set with the same score.
    layout: { x: 0, y: 0, w: 8, h: 1 }

  - tag: viz-enrichment
    index: 'gsea-dotplot'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'gsea_demo'
    title: 'Pathway enrichment dot plot'
    description: 'Y-axis: pathway name. X-axis: normalised enrichment score (NES). Dot size = gene-set size. Dot colour = -log10(padj). Settings ⚙ tunes Top-N / padj threshold / source filter.'
    section: 'Enrichment'
    viz_kind: 'enrichment'
    config:
      viz_kind: "enrichment"
      term_col: "term"
      nes_col: "nes"
      padj_col: "padj"
      gene_count_col: "gene_count"
      source_col: "source"
      padj_threshold: 0.05
      top_n: 20
    layout: { x: 0, y: 2, w: 8, h: 8 }

  - tag: filter-enrichment-source
    index: gsea-f-source
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'gsea_demo'
    interactive_component_type: MultiSelect
    column_name: 'source'
    column_type: 'object'
    title: 'Ontology'
    placement: left
    section: 'Term scope'
    group: 'Term filters'
    display:
      title_size: md
      custom_color: '#7B1FA2'
      icon_name: 'mdi:form-select'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-enrichment-padj
    index: gsea-f-padj
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'gsea_demo'
    interactive_component_type: RangeSlider
    column_name: 'padj'
    column_type: 'float64'
    title: 'Adjusted p-value'
    placement: left
    section: 'Term scope'
    group: 'Term filters'
    display:
      title_size: md
      custom_color: '#F68B33'
      icon_name: 'mdi:target'
    layout: { x: 0, y: 3, w: 1, h: 3 }

  - tag: filter-enrichment-size
    index: gsea-f-size
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'gsea_demo'
    interactive_component_type: RangeSlider
    column_name: 'gene_count'
    column_type: 'int64'
    title: 'Genes in set'
    placement: left
    section: 'Term scope'
    group: 'Term filters'
    display:
      title_size: md
      custom_color: '#45B8AC'
      icon_name: 'mdi:counter'
    layout: { x: 0, y: 6, w: 1, h: 3 }
