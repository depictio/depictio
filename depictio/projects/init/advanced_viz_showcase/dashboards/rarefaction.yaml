# Rarefaction — one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
title: 'Rarefaction'
subtitle: 'Alpha-diversity vs sequencing depth across 18 samples in 3 habitats (gut / skin / soil).'
icon: 'mdi:chart-line'
icon_color: 'cyan'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8d22'
is_main_tab: false
tab_order: 10
parent_dashboard_tag: volcano
tab_icon: 'mdi:chart-line'
tab_icon_color: 'cyan'

# Left-panel filter section. Deliberately not `persistent`: the 23 tabs of
# this family read different collections whose column names collide while their
# value domains do not overlap, so a control fanned out from one tab would show
# up everywhere and bite on nothing.
filter_sections:
  - name: 'Curve scope'
    icon: 'mdi:filter-variant'
    color: 'cyan'
    description: 'Restricts which curves are drawn and over what depth range'

grid_sections:
  - name: 'Rarefaction curves'
    icon: 'mdi:chart-line'
    color: 'cyan'
    description: 'Diversity recomputed at increasing sequencing depth'

components:
  - tag: text-rarefaction
    index: rare-text
    component_type: text
    title: 'Rarefaction curves'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Rarefaction curves'
    body: >
      Diversity recomputed at a ladder of sequencing depths, several iterations per depth,
      with the spread drawn as a confidence band. A curve that flattens means the sample was
      sequenced deeply enough; one still climbing means richness is bounded by depth.
    layout: { x: 0, y: 0, w: 8, h: 1 }

  - tag: viz-rarefaction
    index: 'rare-curves'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'rarefaction_demo'
    title: 'Rarefaction curves (Faith PD)'
    description: 'Alpha-diversity rises with sequencing depth then plateaus. Drag the Habitat filter to colour-segregate; tune Top-N samples and ±SE band in the Settings popover.'
    section: 'Rarefaction curves'
    viz_kind: 'rarefaction'
    config:
      viz_kind: "rarefaction"
      sample_id_col: "sample_id"
      depth_col: "depth"
      metric_col: "faith_pd"
      metric_options: ["faith_pd", "observed_features", "shannon"]
      iter_col: "iter"
      group_col: "habitat"
      show_ci: true
    layout: { x: 0, y: 2, w: 8, h: 8 }

  - tag: filter-rarefaction-habitat
    index: rare-f-habitat
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'rarefaction_demo'
    interactive_component_type: MultiSelect
    column_name: 'habitat'
    column_type: 'object'
    title: 'Habitat'
    placement: left
    section: 'Curve scope'
    group: 'Curve filters'
    display:
      title_size: md
      custom_color: '#2E7D32'
      icon_name: 'mdi:leaf'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-rarefaction-sample
    index: rare-f-sample
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'rarefaction_demo'
    interactive_component_type: MultiSelect
    column_name: 'sample_id'
    column_type: 'object'
    title: 'Sample'
    placement: left
    section: 'Curve scope'
    group: 'Curve filters'
    display:
      title_size: md
      custom_color: '#45B8AC'
      icon_name: 'mdi:flask'
    layout: { x: 0, y: 3, w: 1, h: 3 }

  - tag: filter-rarefaction-depth
    index: rare-f-depth
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'rarefaction_demo'
    interactive_component_type: RangeSlider
    column_name: 'depth'
    column_type: 'int64'
    title: 'Depth'
    placement: left
    section: 'Curve scope'
    group: 'Curve filters'
    display:
      title_size: md
      custom_color: '#00BCD4'
      icon_name: 'mdi:chart-line'
    layout: { x: 0, y: 6, w: 1, h: 3 }
