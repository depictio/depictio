# HLA genotypes: one tab of the advanced-visualisation showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds advanced_viz_showcase
#
# The component `index` values are pinned rather than auto-generated: they are
# what keeps a regenerated seed byte-identical to the shipped one.
#
# `allele_grid` is INCUBATING (schemas.py): this tab draws it beside an
# oncoplot of the very same rows so the section 8 gate of
# docs/design/advanced-viz.md can be argued from the picture.
title: 'HLA genotypes'
subtitle: '24 donors typed at HLA-A, -B, -C, -DRB1 and -DQB1, drawn twice: as an allele grid and as an oncoplot of the same rows.'
icon: 'mdi:dna'
icon_color: 'grape'
icon_variant: filled
workflow_system: python
dashboard_id: '646b0f3c1e4a2d7f8e5b8da0'
is_main_tab: false
tab_order: 50
parent_dashboard_tag: volcano
tab_icon: 'mdi:dna'
tab_icon_color: 'grape'

# Left-panel filter section. Deliberately not `persistent`: the tabs of this
# family read different collections whose column names collide while their
# value domains do not overlap.
filter_sections:
  - name: 'Typing scope'
    icon: 'mdi:filter-variant'
    color: 'grape'
    description: 'Restricts which loci and donors the two genotype views draw'
  - name: 'Prediction scope'
    icon: 'mdi:filter-variant'
    color: 'grape'
    description: 'Restricts the epitope predictions by binder class'

grid_sections:
  - name: 'Genotypes, two ways'
    icon: 'mdi:scale-balance'
    color: 'grape'
    description: 'The same genotype table as an allele grid (left) and as an oncoplot (right)'
  - name: 'Epitope predictions'
    icon: 'mdi:table'
    color: 'grape'
    description: 'Peptide by allele binding predictions, narrowed by an allele picked on the grid'

components:
  - tag: text-allele-grid
    index: hla-text
    component_type: text
    title: 'HLA genotypes'
    order: 3
    alignment: left
    vertical_alignment: top
    section: 'Genotypes, two ways'
    body: >
      One table, two pictures. Left, the allele grid: a row per donor, a column per locus, each
      cell split into its two haplotypes and coloured by allele group, so every A*02 shares a hue;
      a homozygous locus is one merged cell with a dot. Right, an oncoplot of the same rows with
      the allele as the category: one value per cell, so a heterozygous locus shows only one of
      its two alleles. Click an allele half to narrow the predictions below to it, a donor name
      to pick that donor. Input: OptiType calls from nf-core/hlatyping, predictions from
      nf-core/epitopeprediction.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: viz-allele-grid
    index: 'hla-grid'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'allele_grid_demo'
    title: 'Allele grid: both haplotypes per cell'
    description: 'Each locus split into haplotype 1 and 2, coloured by allele group (hue) and allele (shade); side bars give the OptiType objective and the reads.'
    section: 'Genotypes, two ways'
    viz_kind: 'allele_grid'
    config:
      viz_kind: "allele_grid"
      sample_id_col: "sample_id"
      locus_col: "locus"
      allele_col: "allele"
      haplotype_col: "haplotype"
      category_col: "hla_class"
      value_col: "objective"
      reads_col: "reads"
      value_label: "Objective"
      reads_label: "Reads"
      resolution: 2
      sample_order: "alphabetical"
      show_labels: true
      side_bars: ["value", "reads"]
      selection_enabled: true
      selection_column: "allele"
    layout: { x: 0, y: 2, w: 4, h: 5 }

  - tag: viz-allele-oncoplot
    index: 'hla-onco'
    component_type: advanced_viz
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'allele_grid_demo'
    title: 'Oncoplot of the same rows'
    description: 'The closest existing kind: allele as the mutation category, one colour per cell, so the second allele of a heterozygous locus is hidden.'
    section: 'Genotypes, two ways'
    viz_kind: 'oncoplot'
    config:
      viz_kind: "oncoplot"
      sample_id_col: "sample_id"
      gene_col: "locus"
      mutation_type_col: "allele"
      sort_by_freq: false
    layout: { x: 4, y: 2, w: 4, h: 5 }

  - tag: table-epitopes
    index: 'hla-epitopes'
    component_type: table
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'epitope_predictions_demo'
    title: 'Epitope predictions'
    section: 'Epitope predictions'
    layout: { x: 0, y: 7, w: 8, h: 6 }

  - tag: filter-hla-locus
    index: hla-f-locus
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'allele_grid_demo'
    interactive_component_type: MultiSelect
    column_name: 'locus'
    column_type: 'object'
    title: 'Locus'
    placement: left
    section: 'Typing scope'
    group: 'Typing filters'
    display:
      title_size: md
      icon_name: 'mdi:dna'
    layout: { x: 0, y: 0, w: 1, h: 3 }

  - tag: filter-hla-class
    index: hla-f-class
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'allele_grid_demo'
    interactive_component_type: MultiSelect
    column_name: 'hla_class'
    column_type: 'object'
    title: 'HLA class'
    placement: left
    section: 'Typing scope'
    group: 'Typing filters'
    display:
      title_size: md
      icon_name: 'mdi:shape-outline'
    layout: { x: 0, y: 3, w: 1, h: 3 }

  - tag: filter-epitope-binder
    index: hla-f-binder
    component_type: interactive
    workflow_tag: advanced_viz_demo
    data_collection_tag: 'epitope_predictions_demo'
    interactive_component_type: MultiSelect
    column_name: 'binder'
    column_type: 'object'
    title: 'Binder class'
    placement: left
    section: 'Prediction scope'
    group: 'Prediction filters'
    display:
      title_size: md
      icon_name: 'mdi:magnet'
    layout: { x: 0, y: 6, w: 1, h: 3 }
