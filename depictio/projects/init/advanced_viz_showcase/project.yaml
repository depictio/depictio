# Advanced visualisation showcase — one dashboard per viz kind plus an
# overview tab. Backed by deterministic synthetic TSVs generated by
# scripts/generate_fixtures.py so the demo is reproducible and self-contained.

id: "646b0f3c1e4a2d7f8e5b8d00"
name: "Advanced Visualisations"
project_type: "advanced"
is_public: true
workflows:
  - id: "646b0f3c1e4a2d7f8e5b8d01"
    name: "advanced_viz_demo"
    engine:
      name: "python"
      version: "3.11"
    description: "Synthetic fixtures for the four advanced viz: volcano, embedding, manhattan, stacked taxonomy"
    data_location:
      structure: "sequencing-runs"
      runs_regex: "run_*"
      locations:
        - /app/depictio/projects/init/advanced_viz_showcase/data
    data_collections:
      # ----------------------------------------------------------------
      # 1. Volcano canonical schema (feature_id / effect_size / significance)
      # ----------------------------------------------------------------
      - id: "646b0f3c1e4a2d7f8e5b8d02"
        data_collection_tag: "volcano_demo"
        description: "Synthetic volcano: 200 features x 2 contrasts; ~15% are designed hits"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/volcano_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              feature_id: "Gene-like feature identifier (e.g. GENE042)"
              effect_size: "log2 fold change"
              significance: "p-value (raw — client toggles -log10 transform)"
              label: "Hover label (gene id here)"
              category: "Pathway label for colouring"
              avg_log_intensity: "Mean log intensity across replicates — drives the MA plot's x axis"

      # ----------------------------------------------------------------
      # 2. Four embedding DCs — same 90×200 feature matrix, projected with
      #    PCA / UMAP / t-SNE / PCoA respectively. Same canonical schema:
      #    sample_id / dim_1 / dim_2 / cluster / color. The four "Clustering"
      #    dashboard tabs each bind to one of these.
      # ----------------------------------------------------------------
      - id: "646b0f3c1e4a2d7f8e5b8d03"
        data_collection_tag: "embedding_pca"
        description: "PCA projection of a synthetic 90×200 sample×feature matrix (3 clusters)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/embedding_pca.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              sample_id: "Sample identifier (S000..S089)"
              dim_1: "PCA component 1"
              dim_2: "PCA component 2"
              dim_3: "PCA component 3 (drives the 3D view)"
              cluster: "True cluster label used to generate the point (control/treatment/recovery)"
              color: "Continuous gradient correlated with dim_1"

      - id: "646b0f3c1e4a2d7f8e5b8d06"
        data_collection_tag: "embedding_umap"
        description: "UMAP projection of the same synthetic feature matrix"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/embedding_umap.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              sample_id: "Sample identifier"
              dim_1: "UMAP dimension 1"
              dim_2: "UMAP dimension 2"
              dim_3: "UMAP dimension 3 (drives the 3D view)"
              cluster: "True cluster label"
              color: "Continuous gradient correlated with dim_1"

      - id: "646b0f3c1e4a2d7f8e5b8d07"
        data_collection_tag: "embedding_tsne"
        description: "t-SNE projection of the same synthetic feature matrix"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/embedding_tsne.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              sample_id: "Sample identifier"
              dim_1: "t-SNE dimension 1"
              dim_2: "t-SNE dimension 2"
              dim_3: "t-SNE dimension 3 (drives the 3D view)"
              cluster: "True cluster label"
              color: "Continuous gradient correlated with dim_1"

      - id: "646b0f3c1e4a2d7f8e5b8d08"
        data_collection_tag: "embedding_pcoa"
        description: "PCoA (Bray-Curtis) projection of a non-negative shift of the same matrix"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/embedding_pcoa.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              sample_id: "Sample identifier"
              dim_1: "PCoA dimension 1"
              dim_2: "PCoA dimension 2"
              dim_3: "PCoA dimension 3 (drives the 3D view)"
              cluster: "True cluster label"
              color: "Continuous gradient correlated with dim_1"

      # ----------------------------------------------------------------
      # 3. Manhattan (chr / pos / score, with a few designed hits)
      # ----------------------------------------------------------------
      - id: "646b0f3c1e4a2d7f8e5b8d04"
        data_collection_tag: "manhattan_demo"
        description: "Synthetic Manhattan: 23 chromosomes x ~40 noise points + 6 designed hits"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/manhattan_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              chr: "Chromosome label (chr1..chr22, chrX)"
              pos: "Genomic position (1-based)"
              score: "-log10(padj) — higher = more significant"
              feature: "SNP id for designed hits (empty otherwise)"
              score_kind: "Y-axis label hint for the renderer"
              p_value: "Raw p-value (derived from score; drives the QQ plot)"

      # ----------------------------------------------------------------
      # 4. Stacked taxonomy (sample_id / taxon / rank / abundance)
      # ----------------------------------------------------------------
      - id: "646b0f3c1e4a2d7f8e5b8d05"
        data_collection_tag: "stacked_taxonomy_demo"
        description: "Synthetic taxonomy: 18 samples x 9 taxa, two ranks (Phylum + Genus)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/stacked_taxonomy_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              sample_id: "Sample identifier (sample_gut_1 .. sample_soil_6)"
              taxon: "Taxon name at the indicated rank"
              rank: "Taxonomic rank (Phylum or Genus)"
              abundance: "Relative abundance, normalised within (sample, rank)"
              lineage: "Phylum;Genus path for Genus rows, Phylum alone for Phylum rows"
              Kingdom: "Top-level taxonomic kingdom (Bacteria) — sunburst root"
              Phylum: "Phylum — second-level sunburst arc"
              Class: "Class — third-level sunburst arc (synthetic '<Phylum>_class')"
              Order: "Order — fourth-level sunburst arc"
              Family: "Family — fifth-level sunburst arc"
              Genus: "Genus — leaf-level sunburst arc"

      # ----------------------------------------------------------------
      # 5. Phylogenetic tree (newick file + metadata table). The tree DC
      #    type=phylogeny — served via /advanced_viz/phylogeny/{dc_id}/newick.
      #    The metadata DC is a regular Table keyed by 'taxon'.
      # ----------------------------------------------------------------
      # The raw 90×80 feature matrix — input for live Celery PCA/UMAP/t-SNE/
      # PCoA. The clustering tabs use this DC + a method + params; the API's
      # /advanced_viz/compute_embedding endpoint dispatches a Celery task
      # that runs the dim-reduction on demand and returns 2D coords.
      - id: "646b0f3c1e4a2d7f8e5b8d0b"
        data_collection_tag: "embedding_features"
        description: "Sample × feature matrix used as input to live Celery clustering"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/embedding_features.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              sample_id: "Sample identifier (S000..S089)"

      # Rarefaction (alpha-diversity vs sequencing depth).
      - id: "646b0f3c1e4a2d7f8e5b8d20"
        data_collection_tag: "rarefaction_demo"
        description: "Synthetic alpha-rarefaction: 18 samples × 12 depths × 10 iters (Faith PD + observed_features), habitat-stratified"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/rarefaction_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              sample_id: "Sample identifier (sample_gut_1 .. sample_soil_6)"
              depth: "Subsampling depth (reads)"
              iter: "Iteration index for the rarefaction subsampling"
              faith_pd: "Faith's Phylogenetic Diversity at that depth"
              observed_features: "Number of observed features (richness)"
              habitat: "Sample habitat (gut / skin / soil)"

      # ANCOM-BC differentials (3 contrasts × 200 taxa).
      - id: "646b0f3c1e4a2d7f8e5b8d21"
        data_collection_tag: "ancombc_demo"
        description: "Synthetic ANCOM-BC: 200 taxa × 3 contrasts with lfc + significance + Phylum label"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/ancombc_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              feature_id: "Taxon identifier (OTU0000..OTU0199)"
              contrast: "Pairwise habitat contrast (gut_vs_skin / gut_vs_soil / skin_vs_soil)"
              lfc: "Signed log-fold change"
              significance: "FDR-adjusted p-value"
              label: "Phylum;taxon — display label"
              neg_log10_q: "-log10(significance), precomputed for convenience"

      # GSEA / GO / KEGG / Reactome pathway-enrichment dot plot.
      - id: "646b0f3c1e4a2d7f8e5b8d25"
        data_collection_tag: "gsea_demo"
        description: "Synthetic pathway-enrichment results across 5 ontologies (GO_BP / GO_CC / KEGG / Reactome / Hallmark)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/gsea_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              term: "Pathway / GO term name (with ontology prefix)"
              source: "Ontology source — GO_BP / GO_CC / KEGG / Reactome / Hallmark"
              nes: "Normalised enrichment score (signed)"
              padj: "FDR-adjusted p-value"
              gene_count: "Gene-set size"
              leading_edge: "Comma-separated leading-edge gene IDs"

      # UpSet plot input — binary set-membership table.
      - id: "646b0f3c1e4a2d7f8e5b8d28"
        data_collection_tag: "upset_demo"
        description: "Synthetic set-membership: 400 features × 5 contrasts (0/1 membership indicators)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/upset_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              feature_id: "Feature identifier"
              feature_group: "Categorical bucket (kinase / metabolic / signalling / structural / transcription_factor) — used by the dashboard MultiSelect to pre-filter intersections"
              contrastA: "1 if feature is differentially expressed in contrast A"
              contrastB: "1 if feature is differentially expressed in contrast B"
              contrastC: "1 if feature is differentially expressed in contrast C"
              contrastD: "1 if feature is differentially expressed in contrast D"
              contrastE: "1 if feature is differentially expressed in contrast E"

      # Single-cell marker dot plot fixture.
      - id: "646b0f3c1e4a2d7f8e5b8d30"
        data_collection_tag: "dotplot_demo"
        description: "Synthetic single-cell marker matrix: 6 clusters × 25 marker genes with cluster-specific expression"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/dotplot_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              cluster: "Cluster name (T_cell / B_cell / Monocyte / NK / Dendritic / Plasma)"
              gene: "Marker gene symbol"
              mean_expression: "Mean expression of the gene within the cluster (continuous → dot colour)"
              frac_expressing: "Fraction of cells in the cluster expressing the gene (0–1 → dot size)"

      # Lollipop / needle plot fixture — variant tracks along 4 genes.
      - id: "646b0f3c1e4a2d7f8e5b8d31"
        data_collection_tag: "lollipop_demo"
        description: "Synthetic variant tracks: 4 cancer genes × 50–80 variants × 5 consequence categories"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/lollipop_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              feature_id: "Gene the variant is on (TP53 / BRCA1 / EGFR / KRAS)"
              position: "1-based position along the gene"
              category: "Variant consequence (missense / synonymous / stop_gained / frameshift / splice_region)"
              effect: "Effect-strength score (drives marker size)"

      # Oncoplot fixture — long-format sample × gene × mutation observations.
      - id: "646b0f3c1e4a2d7f8e5b8d32"
        data_collection_tag: "oncoplot_demo"
        description: "Synthetic cancer cohort: 40 samples × 30 genes × 5 mutation types (sparse)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/oncoplot_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              sample_id: "Sample identifier (TCGA-000 .. TCGA-039)"
              gene: "Mutated gene symbol"
              mutation_type: "Mutation classification (Missense_Mutation / Nonsense_Mutation / Frame_Shift_Del / Frame_Shift_Ins / In_Frame_Del)"

      # Coverage track input — viralrecon-mosdepth-derived per-bin coverage.
      - id: "646b0f3c1e4a2d7f8e5b8d50"
        data_collection_tag: "coverage_track_demo"
        description: "SARS-CoV-2 coverage tracks (200 bp bins) for ~50 samples with SARS-CoV-2 gene-region annotation; sourced from a viralrecon-bowtie2-mosdepth run"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/coverage_track_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              chrom: "Reference contig / chromosome (MN908947.3 for SARS-CoV-2)"
              start: "Bin start position (0-based, half-open)"
              end: "Bin end position"
              position: "Bin centre — drives the renderer's x axis"
              coverage: "Mean read depth in the bin"
              sample: "Sample identifier (used as the per-track facet key)"
              gene_region: "SARS-CoV-2 gene-region annotation (ORF1ab / S / N / … / intergenic) — drives the coverage-track colouring lane"

      # Categorical-flow (Sankey) input — per-sample lineage classification.
      - id: "646b0f3c1e4a2d7f8e5b8d51"
        data_collection_tag: "categorical_flow_demo"
        description: "Per-sample Pangolin + Nextclade classification: qc_status → lineage → clade flow across SARS-CoV-2 samples"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/categorical_flow_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              sample_id: "Sample identifier"
              qc_status: "Pangolin QC pass/fail (Sankey step 1)"
              lineage: "Pangolin lineage assignment (Sankey step 2)"
              clade: "Nextclade WHO clade assignment (Sankey step 3)"

      - id: "646b0f3c1e4a2d7f8e5b8d09"
        data_collection_tag: "bacterial_tree"
        description: "Bacterial phylogeny (21 taxa) — Newick file for the phylogenetic viz"
        config:
          type: "phylogeny"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/bacterial_tree.nwk"
          dc_specific_properties:
            format: "newick"
            ladderize: true
            metadata_dc_tag: "bacterial_metadata"
            metadata_taxon_column: "taxon"

      - id: "646b0f3c1e4a2d7f8e5b8d0a"
        data_collection_tag: "bacterial_metadata"
        description: "Tip metadata for the bacterial phylogeny (group / habitat / resistance)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/bacterial_metadata.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              taxon: "Taxon name (joins to tip labels in the tree)"
              group: "Bacterial phylum (Proteobacteria / Firmicutes / ...)"
              habitat: "Habitat (Gut / Respiratory / Environmental / Soil)"
              genome_size_mb: "Genome size in megabases"
              resistance_profile: "MDR / Susceptible / Variable"

      # ----------------------------------------------------------------
      # Variant-benchmarking demo DCs (pr_benchmark / confusion_matrix /
      # metric_ci_bars / roc_pr_curve). Synthetic, so the curve has a real sweep.
      # ----------------------------------------------------------------
      - id: "646b0f3c1e4a2d7f8e5b8d60"
        data_collection_tag: "benchmark_demo"
        description: "Synthetic per-caller benchmark summary (precision/recall/F1 + counts + CIs)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/benchmark_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              tool: "Variant caller"
              precision: "Precision (0-1)"
              recall: "Recall (0-1)"
              f1: "F1 score (0-1)"
              tp: "True positives"
              fp: "False positives"
              fn: "False negatives"
              precision_lower: "Precision 95% CI lower"
              precision_upper: "Precision 95% CI upper"
              recall_lower: "Recall 95% CI lower"
              recall_upper: "Recall 95% CI upper"

      - id: "646b0f3c1e4a2d7f8e5b8d61"
        data_collection_tag: "roc_curve_demo"
        description: "Synthetic threshold sweep (3 tools × ~13 quality thresholds) for the PR/ROC curve"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/roc_curve_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              tool: "Variant caller (one curve per tool)"
              quality: "Quality threshold (sweep axis)"
              precision: "Precision at threshold (0-1)"
              recall: "Recall / TPR at threshold (0-1)"
              fpr: "False-positive rate at threshold (0-1) — enables the true ROC case"

      # Life-science advanced-viz kinds: one demo per kind added with the
      # nf-core template lot, where a template had to fall back to code mode.

      - id: "646b0f3c1e4a2d7f8e5b8d80"
        data_collection_tag: "profile_demo"
        description: "TSS enrichment profiles for 8 synthetic ATAC libraries across two conditions (+/-2 kb, 25 bp bins) with bootstrap confidence ribbons; two libraries are deliberately low-enrichment QC failures"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/profile_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              series: "ATAC library identifier (CTRL_rep1-4 / TREAT_rep1-4) - one curve per value"
              x: "Signed distance to the transcription start site in bp, -2000 to +2000 in 25 bp bins"
              y: "Normalised enrichment at that offset; 1.0 is the flanking background"
              lower: "Lower edge of the bootstrap 95% confidence ribbon"
              upper: "Upper edge of the bootstrap 95% confidence ribbon"

      - id: "646b0f3c1e4a2d7f8e5b8d81"
        data_collection_tag: "signal_matrix_demo"
        description: "ATAC-seq signal matrix around peak summits: 300 peaks x 41 offsets (-1000 to +1000 bp, 50 bp bins), classified as promoter / enhancer / background"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/signal_matrix_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              region_id: "Peak identifier - one matrix row per peak"
              position: "Offset from the peak summit in bp (-1000 to +1000, 50 bp bins) - one matrix column each"
              value: "Normalised ATAC-seq signal at that peak and offset, drawn as the cell colour"
              group: "Peak class (promoter / enhancer / background) - splits the matrix into panels"

      - id: "646b0f3c1e4a2d7f8e5b8d82"
        data_collection_tag: "fusion_structure_demo"
        description: "Six oncogenic gene fusions with their real protein-domain composition, retained fraction and breakpoint slot"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/fusion_structure_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              fusion_id: "Fusion call, written GENE1--GENE2 with the 5-prime partner first. One small multiple per value."
              partner: "Partner gene the domain sits on: one lane per partner inside that fusion's facet."
              feature: "Annotated protein domain contributed by that partner, listed N- to C-terminus."
              start: "Ordinal domain slot along the fusion, 0-based. Domains are laid end to end in listed order, 5-prime partner first - these are slots, not amino-acid coordinates."
              end: "End of the domain slot; always start + 1."
              breakpoint: "Slot of the fusion seam, i.e. the number of domains on the 5-prime partner. Identical on every row of a fusion."
              retained: "Fraction of the domain the fusion keeps, in [0, 1]: 1.0 if the breakpoint leaves it whole, 0.0 if it removes it entirely, a fraction if it cuts through."
              domain_class: "Functional class of the domain (Kinase, DNA binding, Oligomerisation, Receptor ectodomain, ...); drives the bar colour and the domain-class filter."

      - id: "646b0f3c1e4a2d7f8e5b8d83"
        data_collection_tag: "gene_arrow_track_demo"
        description: "Biosynthetic gene clusters on five bacterial contigs: one antiSMASH-style BGC region per contig with its flanking neighbourhood"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/gene_arrow_track_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              contig: "Contig / scaffold the gene sits on - one lane per distinct value"
              feature_id: "Locus tag of the coding sequence drawn as an arrow (CTG<n>_<ordinal>)"
              start: "CDS start position on the contig (1-based inclusive, always <= end)"
              end: "CDS end position on the contig"
              strand: "'+' or '-' - sets the arrow direction ('+' points right, '-' left)"
              gene_class: "antiSMASH-style product class of the BGC region the gene belongs to (NRPS / T1PKS / terpene / RiPP-like / betalactone), or 'flanking' outside the region - drives the arrow colour"
              label: "Short gene symbol for the cluster's biosynthetic genes, the locus-tag ordinal otherwise - drawn under the arrow"
              region_start: "Start of the called BGC region on this contig - left edge of the band behind the lane"
              region_end: "End of the called BGC region on this contig - right edge of the band"

      - id: "646b0f3c1e4a2d7f8e5b8d84"
        data_collection_tag: "gsea_running_score_demo"
        description: "GSEA running enrichment score over a ranked list of 800 genes for 5 Hallmark-style sets: two positively enriched, two negatively enriched, one flat"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/gsea_running_score_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              gene_set: "Hallmark-style gene set the curve belongs to - one running-score curve per set."
              rank: "1-based position in the ranked gene list, ordered by descending ranking metric."
              running_es: "Weighted Kolmogorov-Smirnov running enrichment score at that rank (scoring scheme 'weighted', p=1). Leaves zero at rank 1 and returns to zero at the last rank; its extremum is the enrichment score."
              member: "True where the gene at this rank belongs to the set. Drives the hit rug in the middle panel."
              metric: "The ranking metric the gene list was ordered by. A property of the rank, not of the set, so it repeats identically for every set."

      - id: "646b0f3c1e4a2d7f8e5b8d85"
        data_collection_tag: "sashimi_demo"
        description: "Splice junctions across an exon-skipping event: two loci on chr12 (the first inside the hg38 CHD4 footprint), 4 samples in two conditions, known and novel junctions"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/sashimi_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              chrom: "Chromosome the junction sits on. Two loci, ~45.7 Mb apart, share chr12 so the renderer clusters them into separate regions."
              start: "Donor coordinate of the intron - the left foot of the arc."
              end: "Acceptor coordinate of the intron - the right foot of the arc."
              count: "Uniquely mapping reads crossing the junction. Drives the arc width (log-scaled by default) and the label at the apex."
              sample: "Sample the junction was counted in; one lane per value. CTRL_rep1/rep2 and KD_rep1/rep2, two replicates per condition."
              annotation: "Junction class - known (annotated consecutive-exon intron) or novel (exon-skipping and alternative donor/acceptor sites). Colours the arcs."

      - id: "646b0f3c1e4a2d7f8e5b8d87"
        data_collection_tag: "sashimi_coverage_demo"
        description: "Binned read depth over the same two chr12 loci as sashimi_demo, 4 samples - the second collection the sashimi component binds for real coverage"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/sashimi_coverage_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              chromosome: "Chromosome the bin sits on. chr12 throughout, matching sashimi_demo so the two collections line up."
              position: "Start of the 50 bp bin. Binned rather than per-base, the way mosdepth and a bedGraph export write coverage."
              end: "End of the bin, so the profile is drawn as intervals rather than points."
              depth: "Mean read depth in the bin. Exons sit at their own level, introns at a low floor; the cassette exon E3 drops from ~230 in the controls to ~25 in the knockdowns, which is the same event the skipping arc reports."
              sample: "Sample the depth was measured in. Matches sashimi_demo's sample column, which is what lets each junction lane get its own profile."

      - id: "646b0f3c1e4a2d7f8e5b8d86"
        data_collection_tag: "scatter_xy_demo"
        description: "Replicate concordance for 900 genes: the same measurement made twice, with a tenth of the genes moved off the identity diagonal"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/scatter_xy_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              gene: "Gene identifier. Labels each point, and is the column the cross-filter emits when points are selected."
              rep_a: "Expression in replicate A, on the x axis. Same units as rep_b, which is what makes the identity diagonal meaningful."
              rep_b: "Expression in replicate B, on the y axis."
              mean_expression: "Mean of the two replicates. Drives the marker size, so the reader can see the off-diagonal points are not the faint ones."
              regulation: "up in B, down in B or unchanged. Colours the points; a tenth of the genes are regulated."

      # nf-core template lot 2: each kind exists because a megatest output
      # needed it and no existing kind could bind it (contact_map sits on the
      # JBrowse boundary: a binned matrix, never per-base signal).
      - id: "646b0f3c1e4a2d7f8e5b8d88"
        data_collection_tag: "contact_map_demo"
        description: "Hi-C contact matrix over three GRCh38 loci (HOXA, MYC, IGF2 and KCNQ1) at 10, 20 and 40 kb, one partition per resolution"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/contact_map_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              chrom: "Chromosome of the first bin. Named like the peak and coverage tracks so a brushed region reaches the matrix on its own column."
              start: "Start of the first bin, in GRCh38 coordinates."
              end: "End of the first bin."
              chrom2: "Chromosome of the second bin. Equal to chrom throughout; only intra-chromosomal contacts are in this demo."
              start2: "Start of the second bin."
              end2: "End of the second bin."
              count: "Contact count for the (bin1, bin2) pair. Power-law decay with distance, a boost inside each TAD and a focal dot at each loop anchor pair."
              resolution: "Bin size in base pairs: 10000, 20000 or 40000. The coarser levels are the 10 kb pixels summed over 2x2 and 4x4 blocks, as cooler coarsen does."

      # Locus tracks stacked under the contact matrix, on the same loci and the
      # same chrom / start column names, so one region moves all three.
      - id: "646b0f3c1e4a2d7f8e5b8dc1"
        data_collection_tag: "locus_peaks_demo"
        description: "CTCF peaks over the three contact-map loci: every TAD boundary, every loop anchor and a few internal sites"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/locus_peaks_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              chrom: "Chromosome."
              start: "Peak start."
              end: "Peak end."
              peak_id: "Peak identifier."
              score: "Peak strength as -log10 q-value. Loop anchors are the strongest, internal sites the weakest."
              peak_class: "Where the site sits: TAD boundary, loop anchor or internal."

      - id: "646b0f3c1e4a2d7f8e5b8dc2"
        data_collection_tag: "locus_coverage_demo"
        description: "CTCF and H3K27ac ChIP-seq depth in 2 kb bins over the three contact-map loci"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/locus_coverage_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              chrom: "Chromosome."
              start: "Bin start."
              end: "Bin end."
              coverage: "Normalised read depth in the bin."
              sample: "ChIP track: GM12878_CTCF, sharp at the CTCF peaks, or GM12878_H3K27ac, broad over the promoters of the genes in the window."

      - id: "646b0f3c1e4a2d7f8e5b8dc3"
        data_collection_tag: "somatic_snv_demo"
        description: "One tumour genome of somatic SNVs: a clock-like background plus three kataegis foci, for the rainfall view"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/somatic_snv_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              chr: "Chromosome (GRCh38)."
              pos: "Position of the variant."
              vaf: "Variant allele fraction. Bound as the score role; the rainfall view ignores it."
              mutation_class: "Base substitution class, reference base then alternate base, such as C to T. Colours the rainfall points."
              sample: "Tumour sample."

      - id: "646b0f3c1e4a2d7f8e5b8d89"
        data_collection_tag: "knee_plot_demo"
        description: "Two barcode-rank curves: a called-cell plateau followed by a power-law drop into the empty-droplet background"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/knee_plot_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              sample: "Sample / library the curve belongs to."
              rank: "Barcode rank, ascending from 1 (highest UMI count first)."
              umi_count: "UMI count at that rank."
              is_cell: "Whether this rank was called a cell. The boundary between true and false is the cutoff the renderer draws."

      - id: "646b0f3c1e4a2d7f8e5b8d8a"
        data_collection_tag: "damage_profile_demo"
        description: "Ancient-DNA misincorporation profile for 2 samples: C-to-T at the 5' end and G-to-A at the 3' end, both decaying from ~0.3 at position 1"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/damage_profile_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              sample: "Sample / library the profile belongs to."
              end: "Read end the position is measured from: 5p or 3p."
              position: "Distance from the read end, 1 to 25."
              base_change: "Substitution class: C-to-T, G-to-A, T-to-C, A-to-G or other."
              frequency: "Substitution frequency at that position. C-to-T at 5p and G-to-A at 3p are the deamination signature; every other class sits near background."

      - id: "646b0f3c1e4a2d7f8e5b8d8b"
        data_collection_tag: "group_compare_demo"
        description: "A 600 cell by 60 gene matrix in 3 clusters, with two planted marker genes per cluster: the wide shape a two-group differential test reads"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/group_compare_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              cell_id: "Observation identifier, one per row. The comparison names its rows with it; a lasso saved as a selection group captures its values."
              cluster: "Precomputed cluster label: cluster_1, cluster_2 or cluster_3. What the two group pickers fall back to when no selection group has been saved."
              gene_01: "Marker of cluster_1: eight times the background level in those cells, near background elsewhere."
              gene_02: "Second marker of cluster_1."
              gene_03: "Marker of cluster_2."
              gene_04: "Second marker of cluster_2."
              gene_05: "Marker of cluster_3."
              gene_06: "Second marker of cluster_3."
              gene_07: "Mildly enriched in cluster_3 only, so the effect-size line has something to cut."
              gene_08: "Mildly enriched in cluster_3 only."
              gene_09: "Mildly depleted in cluster_3 only."
              gene_10: "Background gene. gene_10 through gene_60 are drawn from one distribution with no cluster structure, which is what puts the cloud around zero on the volcano."

      # Isoform structures. The id sits in the 8d9x block rather than after the
      # 8d8x run because five kind agents added a DC to this file at once, and a
      # block of its own is what keeps the reserved ids from colliding.
      - id: "646b0f3c1e4a2d7f8e5b8d9c"
        data_collection_tag: "transcript_structure_demo"
        description: "Eight isoforms across two genes: exon skipping, an alternative first exon, an alternative 3' end, a retained intron and one novel transcript"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/transcript_structure_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              transcript_id: "Isoform the block belongs to. One lane of the plot per distinct value."
              gene_id: "Gene the isoform belongs to. The renderer draws one gene at a time and this is what it selects on."
              gene_name: "Readable gene symbol, shown in the gene picker beside the identifier."
              chrom: "Sequence the blocks sit on. Both genes of this demo are on chr7."
              start: "Block start in base pairs, 1-based inclusive as a GTF writes it."
              end: "Block end in base pairs, inclusive."
              feature: "Block type: exon, or CDS for the coding part of the same exon. CDS blocks are drawn taller, which is what leaves the UTRs visible either side of the ORF."
              strand: "Transcript strand. DPX1 is on the plus strand, DPX2 on the minus; the chevrons on the intron lines point the way each transcript is read."
              transcript_class: "Novelty class the caller assigned: known, NIC (novel in catalogue, reuses known junctions), NNC (novel, does not) or novel. Colours the lanes."
              sample: "Library the annotation was assembled from. One library here, so every isoform gets a lane of its own."
              expression: "Per-transcript expression in TPM. Orders the lanes, drives the bar beside each of them, and is the alternative lane colouring."

      - id: "646b0f3c1e4a2d7f8e5b8d8e"
        data_collection_tag: "genome_chord_demo"
        description: "40 rearrangement links over the 24 GRCh38 chromosomes: 6 recurrent heavy partners against a background of one-off events, in 4 classes"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/genome_chord_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              chrom_a: "Chromosome of the first breakpoint. Named as GRCh38 names them, so the ring can be laid out on the real chromosome lengths."
              pos_a: "Position of the first breakpoint, in base pairs along chrom_a."
              chrom_b: "Chromosome of the second breakpoint. Equal to chrom_a for the intra-chromosomal classes."
              pos_b: "Position of the second breakpoint, in base pairs along chrom_b."
              label: "Name of the link. The six recurrent events carry their gene-pair name; the rest are numbered. This is the column a click on a chord filters on."
              weight: "Supporting reads. Spans two orders of magnitude, which is what the log-scaled chord width is for."
              category: "Event class: translocation, inversion, deletion or duplication. Colours the chords; only translocations join two chromosomes."

      - id: "646b0f3c1e4a2d7f8e5b8d8d"
        data_collection_tag: "cnv_profile_demo"
        description: "A synthetic somatic copy-number profile: 20 000 bins over 5 chromosomes for 2 tumour samples, with the called segments in the same table"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/cnv_profile_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              sample: "Tumour sample the profile belongs to. TUMOUR_A carries six planted events, TUMOUR_B four different ones, so the sample selector changes the picture."
              chrom: "Chromosome of the bin or segment, on a synthetic 5-contig genome."
              start: "Start of the 20 kb bin, or of the called segment, in base pairs."
              end: "End of the same bin or segment."
              log2: "Log2 copy ratio against a diploid baseline. Around 0 for a balanced region, +0.58 for three copies, -1 for one, -2.6 for a homozygous deletion."
              baf: "B-allele frequency. A balanced region sits at 0.5; an unbalanced one splits into two bands, which is the only signal a copy-neutral LOH gives."
              copy_number: "Absolute copy number called for the row. Colours the bins when it is bound."
              minor_copy_number: "Minor-allele copy number (ASCAT nMinor); the major allele is copy_number minus it. 1 on a balanced region, 0 on a loss or a copy-neutral LOH, which is what separates the LOH from a normal diploid stretch."
              segment: "Row type: bin for the evidence, segment for the call. This is what lets one collection carry both tracks."
              label: "Short call label on the segments (CN 3 gain, CN 2 copy-neutral LOH). Empty on the bins, which have nothing to name."

      # The two portal-shaped kinds. Their ids sit in the 8dbx block rather
      # than after the 8d9x run for the same reason the 8d9x block exists:
      # several kind agents reserve ids in this file at once, and a block of
      # its own is what keeps them from colliding.
      - id: "646b0f3c1e4a2d7f8e5b8db1"
        data_collection_tag: "record_card_demo"
        description: "120 genes with the fields a fact panel groups: identity, location, differential expression, variant summary and two external identifiers"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/record_card_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              feature_id: "Stable gene identifier. The card is keyed on it, and it is the column the scatter beside the card publishes when a point is clicked."
              gene_symbol: "Readable gene symbol. The card uses it as the heading."
              gene_name: "Longer description of the gene, one line."
              biotype: "Gene class: protein_coding, lncRNA or pseudogene."
              chromosome: "Chromosome the gene sits on, over 5 synthetic contigs."
              start: "Gene start in base pairs."
              end: "Gene end in base pairs."
              strand: "Strand the gene is read from."
              effect_size: "Log2 fold change against the control condition. Every fourth gene is planted as a hit, which is what gives the scatter something worth clicking."
              significance: "Adjusted p-value for that effect."
              mean_expression: "Mean normalised expression across the cohort. The scatter's x axis."
              n_variants: "How many variants were called in this gene."
              top_consequence: "Most severe consequence among those variants."
              pathway: "Pathway the gene was assigned to. Colours the scatter and is the tab's first filter."
              ensembl_id: "Ensembl gene identifier. Rendered by the card as a link, built from a URL template."
              uniprot_id: "UniProt accession. Rendered as a link the same way."

      - id: "646b0f3c1e4a2d7f8e5b8db2"
        data_collection_tag: "parallel_coordinates_demo"
        description: "26 libraries over 8 QC metrics in 3 groups: the degraded group separates on the combination rather than on any single metric"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/parallel_coordinates_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              sample: "Library identifier, one per row. Each row is one polyline across the axes."
              group: "Library group: control, treated or degraded. Colours the polylines."
              total_reads_m: "Total reads in millions."
              percent_duplicates: "Duplicate rate as a percentage. High in the degraded group."
              percent_gc: "Mean GC content as a percentage. The axis the three groups overlap most on."
              mean_quality: "Mean base-call quality score."
              percent_aligned: "Percentage of reads that aligned to the reference."
              insert_size_median: "Median insert size in base pairs."
              percent_rrna: "Percentage of reads assigned to rRNA. The clearest single separator of the degraded group."
              genes_detected: "Number of genes with at least one assigned read."

# Region links. A genomic region travels as a chromosome filter plus a
# position range on the emitting collection's own columns; a region link
# renames that pair onto the target's columns (depictio/models/models/links.py),
# so the locus tabs can stack a peak track, a coverage track and a contact
# matrix read from three collections on one region. Every other tab keeps its
# filters scoped to its own collection.
links:
  - source_dc_id: "646b0f3c1e4a2d7f8e5b8dc1"  # locus_peaks_demo
    source_column: "chrom"
    target_dc_id: "646b0f3c1e4a2d7f8e5b8d88"  # contact_map_demo
    target_type: "table"
    link_config:
      resolver: "region"
      columns: { chrom: "chrom", pos: "start" }
    description: "A region brushed or typed on the CTCF peak track narrows the contact matrix"
  - source_dc_id: "646b0f3c1e4a2d7f8e5b8dc1"  # locus_peaks_demo
    source_column: "chrom"
    target_dc_id: "646b0f3c1e4a2d7f8e5b8dc2"  # locus_coverage_demo
    target_type: "table"
    link_config:
      resolver: "region"
      columns: { chrom: "chrom", pos: "start" }
    description: "A region brushed or typed on the CTCF peak track narrows the ChIP coverage"
