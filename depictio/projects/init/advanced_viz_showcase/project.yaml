# Advanced visualisation showcase — one dashboard per viz kind plus an
# overview tab. Backed by deterministic synthetic TSVs generated by
# scripts/generate_fixtures.py so the demo is reproducible and self-contained.

id: "646b0f3c1e4a2d7f8e5b8d00"
name: "Advanced Visualisations"
project_type: "advanced"
is_public: true
workflows:
  - id: "646b0f3c1e4a2d7f8e5b8d01"
    name: "advanced_viz_demo"
    engine:
      name: "python"
      version: "3.11"
    description: "Synthetic fixtures for the four advanced viz: volcano, embedding, manhattan, stacked taxonomy"
    data_location:
      structure: "sequencing-runs"
      runs_regex: "run_*"
      locations:
        - /app/depictio/projects/init/advanced_viz_showcase/data
    data_collections:
      # ----------------------------------------------------------------
      # 1. Volcano canonical schema (feature_id / effect_size / significance)
      # ----------------------------------------------------------------
      - id: "646b0f3c1e4a2d7f8e5b8d02"
        data_collection_tag: "volcano_demo"
        description: "Synthetic volcano: 200 features x 2 contrasts; ~15% are designed hits"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/volcano_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              feature_id: "Gene-like feature identifier (e.g. GENE042)"
              effect_size: "log2 fold change"
              significance: "p-value (raw — client toggles -log10 transform)"
              label: "Hover label (gene id here)"
              category: "Pathway label for colouring"
              avg_log_intensity: "Mean log intensity across replicates — drives the MA plot's x axis"

      # ----------------------------------------------------------------
      # 2. Four embedding DCs — same 90×200 feature matrix, projected with
      #    PCA / UMAP / t-SNE / PCoA respectively. Same canonical schema:
      #    sample_id / dim_1 / dim_2 / cluster / color. The four "Clustering"
      #    dashboard tabs each bind to one of these.
      # ----------------------------------------------------------------
      - id: "646b0f3c1e4a2d7f8e5b8d03"
        data_collection_tag: "embedding_pca"
        description: "PCA projection of a synthetic 90×200 sample×feature matrix (3 clusters)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/embedding_pca.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              sample_id: "Sample identifier (S000..S089)"
              dim_1: "PCA component 1"
              dim_2: "PCA component 2"
              dim_3: "PCA component 3 (drives the 3D view)"
              cluster: "True cluster label used to generate the point (control/treatment/recovery)"
              color: "Continuous gradient correlated with dim_1"

      - id: "646b0f3c1e4a2d7f8e5b8d06"
        data_collection_tag: "embedding_umap"
        description: "UMAP projection of the same synthetic feature matrix"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/embedding_umap.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              sample_id: "Sample identifier"
              dim_1: "UMAP dimension 1"
              dim_2: "UMAP dimension 2"
              dim_3: "UMAP dimension 3 (drives the 3D view)"
              cluster: "True cluster label"
              color: "Continuous gradient correlated with dim_1"

      - id: "646b0f3c1e4a2d7f8e5b8d07"
        data_collection_tag: "embedding_tsne"
        description: "t-SNE projection of the same synthetic feature matrix"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/embedding_tsne.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              sample_id: "Sample identifier"
              dim_1: "t-SNE dimension 1"
              dim_2: "t-SNE dimension 2"
              dim_3: "t-SNE dimension 3 (drives the 3D view)"
              cluster: "True cluster label"
              color: "Continuous gradient correlated with dim_1"

      - id: "646b0f3c1e4a2d7f8e5b8d08"
        data_collection_tag: "embedding_pcoa"
        description: "PCoA (Bray-Curtis) projection of a non-negative shift of the same matrix"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/embedding_pcoa.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              sample_id: "Sample identifier"
              dim_1: "PCoA dimension 1"
              dim_2: "PCoA dimension 2"
              dim_3: "PCoA dimension 3 (drives the 3D view)"
              cluster: "True cluster label"
              color: "Continuous gradient correlated with dim_1"

      # ----------------------------------------------------------------
      # 3. Manhattan (chr / pos / score, with a few designed hits)
      # ----------------------------------------------------------------
      - id: "646b0f3c1e4a2d7f8e5b8d04"
        data_collection_tag: "manhattan_demo"
        description: "Synthetic Manhattan: 23 chromosomes x ~40 noise points + 6 designed hits"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/manhattan_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              chr: "Chromosome label (chr1..chr22, chrX)"
              pos: "Genomic position (1-based)"
              score: "-log10(padj) — higher = more significant"
              feature: "SNP id for designed hits (empty otherwise)"
              score_kind: "Y-axis label hint for the renderer"
              p_value: "Raw p-value (derived from score; drives the QQ plot)"

      # ----------------------------------------------------------------
      # 4. Stacked taxonomy (sample_id / taxon / rank / abundance)
      # ----------------------------------------------------------------
      - id: "646b0f3c1e4a2d7f8e5b8d05"
        data_collection_tag: "stacked_taxonomy_demo"
        description: "Synthetic taxonomy: 18 samples x 9 taxa, two ranks (Phylum + Genus)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/stacked_taxonomy_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              sample_id: "Sample identifier (sample_gut_1 .. sample_soil_6)"
              taxon: "Taxon name at the indicated rank"
              rank: "Taxonomic rank (Phylum or Genus)"
              abundance: "Relative abundance, normalised within (sample, rank)"
              lineage: "Phylum;Genus path for Genus rows, Phylum alone for Phylum rows"
              Kingdom: "Top-level taxonomic kingdom (Bacteria) — sunburst root"
              Phylum: "Phylum — second-level sunburst arc"
              Class: "Class — third-level sunburst arc (synthetic '<Phylum>_class')"
              Order: "Order — fourth-level sunburst arc"
              Family: "Family — fifth-level sunburst arc"
              Genus: "Genus — leaf-level sunburst arc"

      # ----------------------------------------------------------------
      # 5. Phylogenetic tree (newick file + metadata table). The tree DC
      #    type=phylogeny — served via /advanced_viz/phylogeny/{dc_id}/newick.
      #    The metadata DC is a regular Table keyed by 'taxon'.
      # ----------------------------------------------------------------
      # The raw 90×80 feature matrix — input for live Celery PCA/UMAP/t-SNE/
      # PCoA. The clustering tabs use this DC + a method + params; the API's
      # /advanced_viz/compute_embedding endpoint dispatches a Celery task
      # that runs the dim-reduction on demand and returns 2D coords.
      - id: "646b0f3c1e4a2d7f8e5b8d0b"
        data_collection_tag: "embedding_features"
        description: "Sample × feature matrix used as input to live Celery clustering"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/embedding_features.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              sample_id: "Sample identifier (S000..S089)"

      # Rarefaction (alpha-diversity vs sequencing depth).
      - id: "646b0f3c1e4a2d7f8e5b8d20"
        data_collection_tag: "rarefaction_demo"
        description: "Synthetic alpha-rarefaction: 18 samples × 12 depths × 10 iters (Faith PD + observed_features), habitat-stratified"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/rarefaction_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              sample_id: "Sample identifier (sample_gut_1 .. sample_soil_6)"
              depth: "Subsampling depth (reads)"
              iter: "Iteration index for the rarefaction subsampling"
              faith_pd: "Faith's Phylogenetic Diversity at that depth"
              observed_features: "Number of observed features (richness)"
              habitat: "Sample habitat (gut / skin / soil)"

      # ANCOM-BC differentials (3 contrasts × 200 taxa).
      - id: "646b0f3c1e4a2d7f8e5b8d21"
        data_collection_tag: "ancombc_demo"
        description: "Synthetic ANCOM-BC: 200 taxa × 3 contrasts with lfc + significance + Phylum label"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/ancombc_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              feature_id: "Taxon identifier (OTU0000..OTU0199)"
              contrast: "Pairwise habitat contrast (gut_vs_skin / gut_vs_soil / skin_vs_soil)"
              lfc: "Signed log-fold change"
              significance: "FDR-adjusted p-value"
              label: "Phylum;taxon — display label"
              neg_log10_q: "-log10(significance), precomputed for convenience"

      # GSEA / GO / KEGG / Reactome pathway-enrichment dot plot.
      - id: "646b0f3c1e4a2d7f8e5b8d25"
        data_collection_tag: "gsea_demo"
        description: "Synthetic pathway-enrichment results across 5 ontologies (GO_BP / GO_CC / KEGG / Reactome / Hallmark)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/gsea_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              term: "Pathway / GO term name (with ontology prefix)"
              source: "Ontology source — GO_BP / GO_CC / KEGG / Reactome / Hallmark"
              nes: "Normalised enrichment score (signed)"
              padj: "FDR-adjusted p-value"
              gene_count: "Gene-set size"
              leading_edge: "Comma-separated leading-edge gene IDs"

      # UpSet plot input — binary set-membership table.
      - id: "646b0f3c1e4a2d7f8e5b8d28"
        data_collection_tag: "upset_demo"
        description: "Synthetic set-membership: 400 features × 5 contrasts (0/1 membership indicators)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/upset_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              feature_id: "Feature identifier"
              feature_group: "Categorical bucket (kinase / metabolic / signalling / structural / transcription_factor) — used by the dashboard MultiSelect to pre-filter intersections"
              contrastA: "1 if feature is differentially expressed in contrast A"
              contrastB: "1 if feature is differentially expressed in contrast B"
              contrastC: "1 if feature is differentially expressed in contrast C"
              contrastD: "1 if feature is differentially expressed in contrast D"
              contrastE: "1 if feature is differentially expressed in contrast E"

      # Single-cell marker dot plot fixture.
      - id: "646b0f3c1e4a2d7f8e5b8d30"
        data_collection_tag: "dotplot_demo"
        description: "Synthetic single-cell marker matrix: 6 clusters × 25 marker genes with cluster-specific expression"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/dotplot_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              cluster: "Cluster name (T_cell / B_cell / Monocyte / NK / Dendritic / Plasma)"
              gene: "Marker gene symbol"
              mean_expression: "Mean expression of the gene within the cluster (continuous → dot colour)"
              frac_expressing: "Fraction of cells in the cluster expressing the gene (0–1 → dot size)"

      # Lollipop / needle plot fixture — variant tracks along 4 genes.
      - id: "646b0f3c1e4a2d7f8e5b8d31"
        data_collection_tag: "lollipop_demo"
        description: "Synthetic variant tracks: 4 cancer genes × 50–80 variants × 5 consequence categories"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/lollipop_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              feature_id: "Gene the variant is on (TP53 / BRCA1 / EGFR / KRAS)"
              position: "1-based position along the gene"
              category: "Variant consequence (missense / synonymous / stop_gained / frameshift / splice_region)"
              effect: "Effect-strength score (drives marker size)"

      # Oncoplot fixture — long-format sample × gene × mutation observations.
      - id: "646b0f3c1e4a2d7f8e5b8d32"
        data_collection_tag: "oncoplot_demo"
        description: "Synthetic cancer cohort: 40 samples × 30 genes × 5 mutation types (sparse)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/oncoplot_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              sample_id: "Sample identifier (TCGA-000 .. TCGA-039)"
              gene: "Mutated gene symbol"
              mutation_type: "Mutation classification (Missense_Mutation / Nonsense_Mutation / Frame_Shift_Del / Frame_Shift_Ins / In_Frame_Del)"

      # Coverage track input — viralrecon-mosdepth-derived per-bin coverage.
      - id: "646b0f3c1e4a2d7f8e5b8d50"
        data_collection_tag: "coverage_track_demo"
        description: "SARS-CoV-2 coverage tracks (200 bp bins) for ~50 samples with SARS-CoV-2 gene-region annotation; sourced from a viralrecon-bowtie2-mosdepth run"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/coverage_track_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              chrom: "Reference contig / chromosome (MN908947.3 for SARS-CoV-2)"
              start: "Bin start position (0-based, half-open)"
              end: "Bin end position"
              position: "Bin centre — drives the renderer's x axis"
              coverage: "Mean read depth in the bin"
              sample: "Sample identifier (used as the per-track facet key)"
              gene_region: "SARS-CoV-2 gene-region annotation (ORF1ab / S / N / … / intergenic) — drives the coverage-track colouring lane"

      # Categorical-flow (Sankey) input — per-sample lineage classification.
      - id: "646b0f3c1e4a2d7f8e5b8d51"
        data_collection_tag: "categorical_flow_demo"
        description: "Per-sample Pangolin + Nextclade classification: qc_status → lineage → clade flow across SARS-CoV-2 samples"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/categorical_flow_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              sample_id: "Sample identifier"
              qc_status: "Pangolin QC pass/fail (Sankey step 1)"
              lineage: "Pangolin lineage assignment (Sankey step 2)"
              clade: "Nextclade WHO clade assignment (Sankey step 3)"

      - id: "646b0f3c1e4a2d7f8e5b8d09"
        data_collection_tag: "bacterial_tree"
        description: "Bacterial phylogeny (21 taxa) — Newick file for the phylogenetic viz"
        config:
          type: "phylogeny"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/bacterial_tree.nwk"
          dc_specific_properties:
            format: "newick"
            ladderize: true
            metadata_dc_tag: "bacterial_metadata"
            metadata_taxon_column: "taxon"

      - id: "646b0f3c1e4a2d7f8e5b8d0a"
        data_collection_tag: "bacterial_metadata"
        description: "Tip metadata for the bacterial phylogeny (group / habitat / resistance)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/bacterial_metadata.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              taxon: "Taxon name (joins to tip labels in the tree)"
              group: "Bacterial phylum (Proteobacteria / Firmicutes / ...)"
              habitat: "Habitat (Gut / Respiratory / Environmental / Soil)"
              genome_size_mb: "Genome size in megabases"
              resistance_profile: "MDR / Susceptible / Variable"

      # ----------------------------------------------------------------
      # Variant-benchmarking demo DCs (pr_benchmark / confusion_matrix /
      # metric_ci_bars / roc_pr_curve). Synthetic, so the curve has a real sweep.
      # ----------------------------------------------------------------
      - id: "646b0f3c1e4a2d7f8e5b8d60"
        data_collection_tag: "benchmark_demo"
        description: "Synthetic per-caller benchmark summary (precision/recall/F1 + counts + CIs)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/benchmark_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              tool: "Variant caller"
              precision: "Precision (0-1)"
              recall: "Recall (0-1)"
              f1: "F1 score (0-1)"
              tp: "True positives"
              fp: "False positives"
              fn: "False negatives"
              precision_lower: "Precision 95% CI lower"
              precision_upper: "Precision 95% CI upper"
              recall_lower: "Recall 95% CI lower"
              recall_upper: "Recall 95% CI upper"

      - id: "646b0f3c1e4a2d7f8e5b8d61"
        data_collection_tag: "roc_curve_demo"
        description: "Synthetic threshold sweep (3 tools × ~13 quality thresholds) for the PR/ROC curve"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/roc_curve_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              tool: "Variant caller (one curve per tool)"
              quality: "Quality threshold (sweep axis)"
              precision: "Precision at threshold (0-1)"
              recall: "Recall / TPR at threshold (0-1)"
              fpr: "False-positive rate at threshold (0-1) — enables the true ROC case"

      # Life-science advanced-viz kinds: one demo per kind added with the
      # nf-core template lot, where a template had to fall back to code mode.

      - id: "646b0f3c1e4a2d7f8e5b8d80"
        data_collection_tag: "profile_demo"
        description: "TSS enrichment profiles for 8 synthetic ATAC libraries across two conditions (+/-2 kb, 25 bp bins) with bootstrap confidence ribbons; two libraries are deliberately low-enrichment QC failures"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/profile_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              series: "ATAC library identifier (CTRL_rep1-4 / TREAT_rep1-4) - one curve per value"
              x: "Signed distance to the transcription start site in bp, -2000 to +2000 in 25 bp bins"
              y: "Normalised enrichment at that offset; 1.0 is the flanking background"
              lower: "Lower edge of the bootstrap 95% confidence ribbon"
              upper: "Upper edge of the bootstrap 95% confidence ribbon"

      - id: "646b0f3c1e4a2d7f8e5b8d81"
        data_collection_tag: "signal_matrix_demo"
        description: "ATAC-seq signal matrix around peak summits: 300 peaks x 41 offsets (-1000 to +1000 bp, 50 bp bins), classified as promoter / enhancer / background"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/signal_matrix_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              region_id: "Peak identifier - one matrix row per peak"
              position: "Offset from the peak summit in bp (-1000 to +1000, 50 bp bins) - one matrix column each"
              value: "Normalised ATAC-seq signal at that peak and offset, drawn as the cell colour"
              group: "Peak class (promoter / enhancer / background) - splits the matrix into panels"

      - id: "646b0f3c1e4a2d7f8e5b8d82"
        data_collection_tag: "fusion_structure_demo"
        description: "Six oncogenic gene fusions with their real protein-domain composition, retained fraction and breakpoint slot"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/fusion_structure_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              fusion_id: "Fusion call, written GENE1--GENE2 with the 5-prime partner first. One small multiple per value."
              partner: "Partner gene the domain sits on: one lane per partner inside that fusion's facet."
              feature: "Annotated protein domain contributed by that partner, listed N- to C-terminus."
              start: "Ordinal domain slot along the fusion, 0-based. Domains are laid end to end in listed order, 5-prime partner first - these are slots, not amino-acid coordinates."
              end: "End of the domain slot; always start + 1."
              breakpoint: "Slot of the fusion seam, i.e. the number of domains on the 5-prime partner. Identical on every row of a fusion."
              retained: "Fraction of the domain the fusion keeps, in [0, 1]: 1.0 if the breakpoint leaves it whole, 0.0 if it removes it entirely, a fraction if it cuts through."
              domain_class: "Functional class of the domain (Kinase, DNA binding, Oligomerisation, Receptor ectodomain, ...); drives the bar colour and the domain-class filter."

      - id: "646b0f3c1e4a2d7f8e5b8d83"
        data_collection_tag: "gene_arrow_track_demo"
        description: "Biosynthetic gene clusters on five bacterial contigs: one antiSMASH-style BGC region per contig with its flanking neighbourhood"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/gene_arrow_track_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              contig: "Contig / scaffold the gene sits on - one lane per distinct value"
              feature_id: "Locus tag of the coding sequence drawn as an arrow (CTG<n>_<ordinal>)"
              start: "CDS start position on the contig (1-based inclusive, always <= end)"
              end: "CDS end position on the contig"
              strand: "'+' or '-' - sets the arrow direction ('+' points right, '-' left)"
              gene_class: "antiSMASH-style product class of the BGC region the gene belongs to (NRPS / T1PKS / terpene / RiPP-like / betalactone), or 'flanking' outside the region - drives the arrow colour"
              label: "Short gene symbol for the cluster's biosynthetic genes, the locus-tag ordinal otherwise - drawn under the arrow"
              region_start: "Start of the called BGC region on this contig - left edge of the band behind the lane"
              region_end: "End of the called BGC region on this contig - right edge of the band"

      - id: "646b0f3c1e4a2d7f8e5b8d84"
        data_collection_tag: "gsea_running_score_demo"
        description: "GSEA running enrichment score over a ranked list of 800 genes for 5 Hallmark-style sets: two positively enriched, two negatively enriched, one flat"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/gsea_running_score_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              gene_set: "Hallmark-style gene set the curve belongs to - one running-score curve per set."
              rank: "1-based position in the ranked gene list, ordered by descending ranking metric."
              running_es: "Weighted Kolmogorov-Smirnov running enrichment score at that rank (scoring scheme 'weighted', p=1). Leaves zero at rank 1 and returns to zero at the last rank; its extremum is the enrichment score."
              member: "True where the gene at this rank belongs to the set. Drives the hit rug in the middle panel."
              metric: "The ranking metric the gene list was ordered by. A property of the rank, not of the set, so it repeats identically for every set."

      - id: "646b0f3c1e4a2d7f8e5b8d85"
        data_collection_tag: "sashimi_demo"
        description: "Splice junctions across an exon-skipping event: two loci on chr12, 4 samples in two conditions, known and novel junctions"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/sashimi_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              chrom: "Chromosome the junction sits on. Two loci, ~45.7 Mb apart, share chr12 so the renderer clusters them into separate regions."
              start: "Donor coordinate of the intron - the left foot of the arc."
              end: "Acceptor coordinate of the intron - the right foot of the arc."
              count: "Uniquely mapping reads crossing the junction. Drives the arc width (log-scaled by default) and the label at the apex."
              sample: "Sample the junction was counted in; one lane per value. CTRL_rep1/rep2 and KD_rep1/rep2, two replicates per condition."
              annotation: "Junction class - known (annotated consecutive-exon intron) or novel (exon-skipping and alternative donor/acceptor sites). Colours the arcs."

      - id: "646b0f3c1e4a2d7f8e5b8d86"
        data_collection_tag: "scatter_xy_demo"
        description: "Replicate concordance for 900 genes: the same measurement made twice, with a tenth of the genes moved off the identity diagonal"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "single"
            scan_parameters:
              filename: "/app/depictio/projects/init/advanced_viz_showcase/data/scatter_xy_demo.tsv"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
            columns_description:
              gene: "Gene identifier. Labels each point, and is the column the cross-filter emits when points are selected."
              rep_a: "Expression in replicate A, on the x axis. Same units as rep_b, which is what makes the identity diagonal meaningful."
              rep_b: "Expression in replicate B, on the y axis."
              mean_expression: "Mean of the two replicates. Drives the marker size, so the reader can see the off-diagonal points are not the faint ones."
              regulation: "up in B, down in B or unchanged. Colours the points; a tenth of the genes are regulated."

