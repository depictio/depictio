# Palmer Penguins Metrics & Filters Showcase - DashboardDataLite format
#
# Sister dashboard to iris/dashboards/metrics_showcase.yaml: exercises every
# multi-metric card layout (vertical / compact / box_plot / top_n / coverage /
# concentration) plus conditional aggregations, over the joined penguins DC.
# The left panel groups its interactive components into four families
# (Taxonomy, Bill morphology, Body size, Cohort) — max 3 members each
# (MAX_INTERACTIVE_GROUP_SIZE).
#
# Import with:
#   depictio-cli dashboard import \
#     depictio/projects/init/penguins/dashboards/metrics_showcase.yaml \
#     --config depictio/.depictio/admin_config.yaml
version: 1

title: "Penguins — Metrics & Filters Showcase"
subtitle: "Every multi-metric card layout, and left-panel filters grouped by family"
project_tag: "Palmer Penguins Species Comparison"

components:
  # ── Narrative intro ────────────────────────────────────────────────
  - tag: pshow-intro
    component_type: text
    title: "Palmer Penguins — Metrics & Filters Showcase"
    order: 2
    alignment: left
    body: "342 individuals of *Adelie*, *Chinstrap* and *Gentoo* across Biscoe, Dream and Torgersen. Cards below cover **every** secondary layout: Tukey box plots, compact and vertical stat strips, top-N breakdowns, coverage bars and concentration lines. Left-panel filters are grouped by family and AND together."
    layout: {x: 0, y: 0, w: 8, h: 1}

  # ── Row 1: distribution cards (box_plot layout) ────────────────────
  - tag: pshow-body-mass-box
    component_type: card
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: body_mass_g
    column_type: float64
    icon_name: mdi:weight
    icon_color: "#F68B33"
    title_color: "#F68B33"
    title_font_size: lg
    value_font_size: xl
    title: "Body Mass (g)"
    layout: {x: 0, y: 1, w: 4, h: 2}

  - tag: pshow-flipper-box
    component_type: card
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: flipper_length_mm
    column_type: float64
    icon_name: mdi:ruler
    icon_color: "#26A69A"
    title_color: "#26A69A"
    title_font_size: lg
    value_font_size: xl
    title: "Flipper Length (mm)"
    layout: {x: 4, y: 1, w: 4, h: 2}

  # ── Row 2: stat-strip cards (compact + vertical layouts) ───────────
  - tag: pshow-bill-length-compact
    component_type: card
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    aggregation: average
    aggregations: [std_dev, min, max]
    secondary_layout: compact
    column_name: bill_length_mm
    column_type: float64
    icon_name: mdi:arrow-expand-horizontal
    icon_color: "#1E88E5"
    title_color: "#1E88E5"
    title_font_size: lg
    value_font_size: xl
    title: "Bill Length — spread"
    layout: {x: 0, y: 3, w: 4, h: 2}

  - tag: pshow-bill-depth-vertical
    component_type: card
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    aggregation: median
    aggregations: [q1, q3, range]
    secondary_layout: vertical
    column_name: bill_depth_mm
    column_type: float64
    icon_name: mdi:format-line-spacing
    icon_color: "#7E57C2"
    title_color: "#7E57C2"
    title_font_size: lg
    value_font_size: xl
    title: "Bill Depth — quartiles"
    layout: {x: 4, y: 3, w: 4, h: 2}

  # ── Row 3: categorical + coverage cards ────────────────────────────
  - tag: pshow-species-topn
    component_type: card
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    aggregation: nunique
    column_name: species
    column_type: object
    secondary_layout: top_n
    breakdown_col: species
    top_n_count: 3
    icon_name: mdi:penguin
    icon_color: "#8BC34A"
    title_color: "#8BC34A"
    title_font_size: lg
    value_font_size: xl
    title: "Species (top 3)"
    layout: {x: 0, y: 5, w: 3, h: 2}

  - tag: pshow-individual-coverage
    component_type: card
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    aggregation: count
    column_name: individual_id
    column_type: object
    secondary_layout: coverage
    coverage_max: 342
    icon_name: mdi:counter
    icon_color: "#5C6BC0"
    title_color: "#5C6BC0"
    title_font_size: lg
    value_font_size: xl
    title: "Individuals in scope"
    layout: {x: 3, y: 5, w: 3, h: 2}

  - tag: pshow-island-concentration
    component_type: card
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    aggregation: count
    column_name: island
    column_type: object
    secondary_layout: concentration
    breakdown_col: island
    top_n_count: 2
    icon_name: mdi:chart-donut
    icon_color: "#FB8C00"
    title_color: "#FB8C00"
    title_font_size: lg
    value_font_size: xl
    title: "Island concentration"
    layout: {x: 6, y: 5, w: 2, h: 2}

  # ── Row 4: island breakdown + conditional aggregations ─────────────
  - tag: pshow-island-topn
    component_type: card
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    aggregation: nunique
    column_name: island
    column_type: object
    secondary_layout: top_n
    breakdown_col: island
    top_n_count: 3
    icon_name: mdi:island
    icon_color: "#00897B"
    title_color: "#00897B"
    title_font_size: md
    value_font_size: xl
    title: "Islands (top 3)"
    layout: {x: 0, y: 7, w: 3, h: 2}

  - tag: pshow-heavy-penguins
    component_type: card
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    aggregation: count
    column_name: body_mass_g
    column_type: float64
    filter_expr: "col('body_mass_g') > 5000"
    icon_name: mdi:filter-check-outline
    icon_color: "#E91E63"
    title_color: "#E91E63"
    title_font_size: md
    value_font_size: xl
    title: "Heavier than 5 kg"
    layout: {x: 3, y: 7, w: 2, h: 2}

  - tag: pshow-gentoo-flipper
    component_type: card
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    aggregation: average
    aggregations: [median, std_dev]
    secondary_layout: compact
    column_name: flipper_length_mm
    column_type: float64
    filter_expr: "col('species') == 'Gentoo'"
    icon_name: mdi:target
    icon_color: "#55A467"
    title_color: "#55A467"
    title_font_size: md
    value_font_size: xl
    title: "Gentoo flipper length"
    layout: {x: 5, y: 7, w: 3, h: 2}

  - tag: pshow-deep-bill-species
    component_type: card
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    aggregation: nunique
    column_name: species
    column_type: object
    filter_expr: "col('bill_depth_mm') >= 18"
    secondary_layout: top_n
    breakdown_col: species
    top_n_count: 3
    icon_name: mdi:filter-variant-plus
    icon_color: "#8E24AA"
    title_color: "#8E24AA"
    title_font_size: md
    value_font_size: xl
    title: "Species (bill depth ≥ 18 mm)"
    layout: {x: 0, y: 9, w: 4, h: 2}

  - tag: pshow-year-span
    component_type: card
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    aggregation: nunique
    column_name: year
    column_type: int64
    aggregations: [min, max]
    secondary_layout: compact
    icon_name: mdi:calendar-range
    icon_color: "#546E7A"
    title_color: "#546E7A"
    title_font_size: md
    value_font_size: xl
    title: "Survey years"
    layout: {x: 4, y: 9, w: 4, h: 2}

  # ── Left panel — grouped by family ─────────────────────────────────
  # Family 1 — Taxonomy & location
  - tag: pshow-filter-species
    component_type: interactive
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    interactive_component_type: MultiSelect
    column_name: species
    column_type: object
    group: "Taxonomy"
    custom_color: "#4C72B0"
    icon_name: mdi:penguin
    title: "Species"
    layout: {x: 0, y: 0, w: 1, h: 3}

  - tag: pshow-filter-island
    component_type: interactive
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    interactive_component_type: MultiSelect
    column_name: island
    column_type: object
    group: "Taxonomy"
    custom_color: "#8172B2"
    icon_name: mdi:island
    title: "Island"
    layout: {x: 0, y: 3, w: 1, h: 3}

  - tag: pshow-filter-sex
    component_type: interactive
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    interactive_component_type: SegmentedControl
    column_name: sex
    column_type: object
    group: "Taxonomy"
    custom_color: "#C44E52"
    icon_name: mdi:gender-male-female
    title: "Sex"
    layout: {x: 0, y: 6, w: 1, h: 3}

  # Family 2 — Bill morphology
  - tag: pshow-filter-bill-length
    component_type: interactive
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    interactive_component_type: RangeSlider
    column_name: bill_length_mm
    column_type: float64
    group: "Bill morphology"
    custom_color: "#937860"
    icon_name: bx:slider
    title: "Bill length (mm)"
    layout: {x: 0, y: 9, w: 1, h: 3}

  - tag: pshow-filter-bill-depth
    component_type: interactive
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    interactive_component_type: RangeSlider
    column_name: bill_depth_mm
    column_type: float64
    group: "Bill morphology"
    custom_color: "#937860"
    icon_name: bx:slider-alt
    title: "Bill depth (mm)"
    layout: {x: 0, y: 12, w: 1, h: 3}

  # Family 3 — Body size
  - tag: pshow-filter-body-mass
    component_type: interactive
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    interactive_component_type: RangeSlider
    column_name: body_mass_g
    column_type: float64
    group: "Body size"
    custom_color: "#DD8452"
    icon_name: mdi:weight
    title: "Body mass (g)"
    layout: {x: 0, y: 15, w: 1, h: 3}

  - tag: pshow-filter-flipper
    component_type: interactive
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    interactive_component_type: RangeSlider
    column_name: flipper_length_mm
    column_type: float64
    group: "Body size"
    custom_color: "#55A467"
    icon_name: mdi:ruler
    title: "Flipper length (mm)"
    layout: {x: 0, y: 18, w: 1, h: 3}

  # Family 4 — Cohort scoping. A plain Slider on the survey year plus two
  # species pickers scoped by filter_expr, showing how a group can mix
  # component flavours.
  - tag: pshow-filter-year
    component_type: interactive
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    interactive_component_type: Slider
    column_name: year
    column_type: int64
    group: "Cohort"
    custom_color: "#546E7A"
    icon_name: mdi:calendar-range
    title: "Survey year"
    layout: {x: 0, y: 21, w: 1, h: 3}

  - tag: pshow-filter-species-heavy
    component_type: interactive
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    interactive_component_type: MultiSelect
    column_name: species
    column_type: object
    filter_expr: "col('body_mass_g') > 5000"
    group: "Cohort"
    custom_color: "#DA8BC3"
    icon_name: mdi:filter-check
    title: "Species (> 5 kg)"
    layout: {x: 0, y: 24, w: 1, h: 3}

  - tag: pshow-filter-island-longbill
    component_type: interactive
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    interactive_component_type: MultiSelect
    column_name: island
    column_type: object
    filter_expr: "col('bill_length_mm') > 50"
    group: "Cohort"
    custom_color: "#DA8BC3"
    icon_name: mdi:filter-check
    title: "Island (bill > 50 mm)"
    layout: {x: 0, y: 27, w: 1, h: 3}

  # ── Figures ────────────────────────────────────────────────────────
  - tag: pshow-scatter-mass-flipper
    component_type: figure
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    visu_type: scatter
    title: "Body Mass vs Flipper Length"
    description: "Colour = species, symbol = island, size = bill length. Marginal box/violin show per-axis spread."
    title_size: h3
    dict_kwargs:
      x: flipper_length_mm
      y: body_mass_g
      color: species
      symbol: island
      size: bill_length_mm
      color_discrete_map: '{"Adelie": "#4C72B0", "Chinstrap": "#DD8452", "Gentoo": "#55A467"}'
      size_max: 15
      marginal_x: box
      marginal_y: violin
      trendline: lowess
      labels: '{"flipper_length_mm": "Flipper Length (mm)", "body_mass_g": "Body Mass (g)", "bill_length_mm": "Bill Length (mm)", "island": "Island", "species": "Species"}'
    layout: {x: 0, y: 11, w: 8, h: 5}

  - tag: pshow-scatter-bill-shape
    component_type: figure
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    visu_type: scatter
    title: "Bill Shape — Length vs Depth"
    description: "Chinstrap = long & deep; Gentoo = long & shallow; Adelie = short & deep."
    title_size: h3
    dict_kwargs:
      x: bill_length_mm
      y: bill_depth_mm
      color: species
      symbol: sex
      color_discrete_map: '{"Adelie": "#4C72B0", "Chinstrap": "#DD8452", "Gentoo": "#55A467"}'
      trendline: ols
    layout: {x: 0, y: 16, w: 4, h: 5}

  - tag: pshow-box-body-mass
    component_type: figure
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    visu_type: box
    title: "Body Mass by Species and Sex"
    description: "Grouped box + all points; sexual dimorphism is most visible in Gentoo. Mirrors the Tukey card above."
    title_size: h3
    dict_kwargs:
      x: species
      y: body_mass_g
      color: sex
      color_discrete_map: '{"male": "#4C72B0", "female": "#C44E52"}'
      boxmode: group
      points: all
      notched: true
      labels: '{"body_mass_g": "Body Mass (g)", "species": "Species", "sex": "Sex"}'
    layout: {x: 4, y: 16, w: 4, h: 5}

  - tag: pshow-hist-bill-depth
    component_type: figure
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    visu_type: histogram
    title: "Bill Depth Distribution by Species"
    description: "Overlay histogram with rug; Chinstrap and Adelie overlap heavily on bill depth."
    title_size: h3
    dict_kwargs:
      x: bill_depth_mm
      color: species
      color_discrete_map: '{"Adelie": "#4C72B0", "Chinstrap": "#DD8452", "Gentoo": "#55A467"}'
      barmode: overlay
      opacity: 0.7
      nbins: 30
      marginal: rug
      labels: '{"bill_depth_mm": "Bill Depth (mm)", "species": "Species"}'
    layout: {x: 0, y: 21, w: 8, h: 5}

  # ── Data table ─────────────────────────────────────────────────────
  - tag: pshow-data-table
    component_type: table
    workflow_tag: penguin_species_analysis
    data_collection_tag: joined_penguins_complete
    title: "Palmer Penguins Data"
    description: "Joined physical-features + demographics view feeding every tile above."
    title_size: h3
    title_align: left
    page_size: 15
    layout: {x: 0, y: 26, w: 8, h: 5}
