# Penguins Versioned: dashboard version 2 of 5, "v2 Second season".
#
# GENERATED by regenerate_dashboards.py. Edit that, not this file: the versions
# are only useful if they differ from each other in specific ways, which is a
# property of the set rather than of any one file.
#
# Imported by rebuild_demo.py right after batch 2 (batch_02_season_2008) is ingested.

version: 1
main_dashboard:
  title: Penguin Field Survey
  subtitle: Seasons 2007 and 2008
  project_tag: Penguins Versioned Demo
  main_tab_name: Overview
  tab_icon: mdi:penguin
  tab_icon_color: orange
  components:
  - tag: intro
    component_type: text
    title: Two seasons
    order: 2
    alignment: left
    body: '2008 arrives: 223 birds over two seasons. The body-mass chart now splits by season, which is
      where the next correction will show. Sex and species cards read *demographic_data*, the *Body mass
      by sex* row reads their persisted join, and the rest reads *physical_features*.'
    layout:
      x: 0
      y: 0
      w: 8
      h: 1
  - tag: card-birds
    component_type: card
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: physical_features
    aggregation: count
    column_name: individual_id
    column_type: object
    icon_name: mdi:counter
    icon_color: '#55A868'
    title_color: '#55A868'
    title_font_size: md
    value_font_size: xl
    title: Birds measured so far
    layout:
      x: 0
      y: 1
      w: 2
      h: 2
    secondary_layout: coverage
    coverage_max: 342
  - tag: card-mass
    component_type: card
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: physical_features
    aggregation: median
    column_name: body_mass_g
    column_type: float64
    icon_name: mdi:ruler
    icon_color: '#FF8C00'
    title_color: '#FF8C00'
    title_font_size: md
    value_font_size: xl
    title: Median body mass (g)
    layout:
      x: 2
      y: 1
      w: 2
      h: 2
  - tag: card-sexed
    component_type: card
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: demographic_data
    aggregation: count
    column_name: sex
    column_type: object
    icon_name: mdi:account-multiple-outline
    icon_color: '#C44E52'
    title_color: '#C44E52'
    title_font_size: md
    value_font_size: xl
    title: Sex recorded
    layout:
      x: 4
      y: 1
      w: 2
      h: 2
    secondary_layout: completeness
  - tag: card-species
    component_type: card
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: demographic_data
    aggregation: nunique
    column_name: species
    column_type: object
    icon_name: mdi:chart-donut
    icon_color: '#A034F0'
    title_color: '#A034F0'
    title_font_size: md
    value_font_size: xl
    title: Species mix
    layout:
      x: 6
      y: 1
      w: 2
      h: 2
    secondary_layout: donut
    breakdown_col: species
    top_n_count: 3
  - tag: filter-species
    component_type: interactive
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: demographic_data
    interactive_component_type: MultiSelect
    column_name: species
    column_type: object
    custom_color: '#FF8C00'
    icon_name: mdi:dna
    title: Species
    layout:
      x: 0
      y: 0
      w: 1
      h: 3
  - tag: filter-year
    component_type: interactive
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: demographic_data
    interactive_component_type: RangeSlider
    column_name: year
    column_type: int64
    custom_color: '#159090'
    icon_name: mdi:calendar-outline
    title: Season
    layout:
      x: 0
      y: 3
      w: 1
      h: 3
    show_marks: true
  - tag: fig-mass
    component_type: figure
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: physical_features
    visu_type: box
    title: Body mass by season
    description: Each species, season against season.
    title_size: h3
    dict_kwargs:
      x: year
      y: body_mass_g
      color: species
      boxmode: group
      color_discrete_map: '{"Adelie": "#FF8C00", "Chinstrap": "#A034F0", "Gentoo": "#159090"}'
      labels: '{"species": "Species", "island": "Island", "year": "Field season", "sex": "Sex", "body_mass_g":
        "Body mass (g)", "flipper_length_mm": "Flipper length (mm)", "bill_length_mm": "Bill length (mm)",
        "bill_depth_mm": "Bill depth (mm)"}'
    layout:
      x: 0
      y: 3
      w: 4
      h: 5
  - tag: fig-morph
    component_type: figure
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: physical_features
    visu_type: scatter
    title: Flipper vs mass, by species and island
    description: ''
    title_size: h3
    dict_kwargs:
      x: flipper_length_mm
      y: body_mass_g
      color: species
      symbol: island
      color_discrete_map: '{"Adelie": "#FF8C00", "Chinstrap": "#A034F0", "Gentoo": "#159090"}'
      labels: '{"species": "Species", "island": "Island", "year": "Field season", "sex": "Sex", "body_mass_g":
        "Body mass (g)", "flipper_length_mm": "Flipper length (mm)", "bill_length_mm": "Bill length (mm)",
        "bill_depth_mm": "Bill depth (mm)"}'
    layout:
      x: 4
      y: 3
      w: 4
      h: 5
  - tag: fig-mass-by-sex
    component_type: figure
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: joined_penguins_complete
    visu_type: box
    title: Body mass by sex
    description: 'Mass from physical_features, sex from demographic_data: the persisted join.'
    title_size: h3
    dict_kwargs:
      x: sex
      y: body_mass_g
      color: species
      boxmode: group
      color_discrete_map: '{"Adelie": "#FF8C00", "Chinstrap": "#A034F0", "Gentoo": "#159090"}'
      labels: '{"species": "Species", "island": "Island", "year": "Field season", "sex": "Sex", "body_mass_g":
        "Body mass (g)", "flipper_length_mm": "Flipper length (mm)", "bill_length_mm": "Bill length (mm)",
        "bill_depth_mm": "Bill depth (mm)"}'
    layout:
      x: 0
      y: 8
      w: 6
      h: 5
  - tag: card-joined
    component_type: card
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: joined_penguins_complete
    aggregation: average
    column_name: body_mass_g
    column_type: float64
    icon_name: mdi:chart-donut
    icon_color: '#5C6BC0'
    title_color: '#5C6BC0'
    title_font_size: md
    value_font_size: xl
    title: Mean body mass, by sex mix
    layout:
      x: 6
      y: 8
      w: 2
      h: 2
    secondary_layout: donut
    breakdown_col: sex
    top_n_count: 3
tabs:
- title: Islands & Seasons
  subtitle: Where each species was sampled, season by season
  tab_icon: mdi:map-marker-outline
  tab_icon_color: teal
  components:
  - tag: isl-intro
    component_type: text
    title: Where the birds were sampled
    order: 2
    alignment: left
    body: Read from *demographic_data* only. *Adelie* is found on all three islands, *Chinstrap* only
      on Dream and *Gentoo* only on Biscoe, so island and species are confounded for two of the three.
    layout:
      x: 0
      y: 0
      w: 8
      h: 1
  - tag: isl-filter-island
    component_type: interactive
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: demographic_data
    interactive_component_type: MultiSelect
    column_name: island
    column_type: object
    custom_color: '#8172B2'
    icon_name: mdi:map-marker-outline
    title: Island
    layout:
      x: 0
      y: 0
      w: 1
      h: 3
  - tag: isl-birds-per-island
    component_type: figure
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: demographic_data
    visu_type: histogram
    title: Birds per island
    description: Stacked counts per island.
    title_size: h3
    dict_kwargs:
      x: island
      color: species
      barmode: stack
      color_discrete_map: '{"Adelie": "#FF8C00", "Chinstrap": "#A034F0", "Gentoo": "#159090"}'
      labels: '{"species": "Species", "island": "Island", "year": "Field season", "sex": "Sex", "body_mass_g":
        "Body mass (g)", "flipper_length_mm": "Flipper length (mm)", "bill_length_mm": "Bill length (mm)",
        "bill_depth_mm": "Bill depth (mm)"}'
    layout:
      x: 0
      y: 1
      w: 4
      h: 5
  - tag: isl-sex-by-species
    component_type: figure
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: demographic_data
    visu_type: histogram
    title: Sex by species
    description: Birds with no recorded sex form their own bar.
    title_size: h3
    dict_kwargs:
      x: species
      color: sex
      barmode: group
      labels: '{"species": "Species", "island": "Island", "year": "Field season", "sex": "Sex", "body_mass_g":
        "Body mass (g)", "flipper_length_mm": "Flipper length (mm)", "bill_length_mm": "Bill length (mm)",
        "bill_depth_mm": "Bill depth (mm)"}'
    layout:
      x: 4
      y: 1
      w: 4
      h: 5
