# Penguins Versioned: dashboard version 4 of 5, "v4 Three seasons".
#
# GENERATED by regenerate_dashboards.py. Edit that, not this file: the versions
# are only useful if they differ from each other in specific ways, which is a
# property of the set rather than of any one file.
#
# Imported by rebuild_demo.py right after batch 4 (batch_04_season_2009) is ingested.

version: 1
main_dashboard:
  title: 'Palmer Penguins: Three Field Seasons'
  subtitle: '2007 to 2009: the complete survey'
  project_tag: Penguins Versioned Demo
  main_tab_name: Overview
  tab_icon: mdi:penguin
  tab_icon_color: orange
  brand_theme: &id001
    primary: '#159090'
    secondary: '#A034F0'
    tertiary: '#FF8C00'
    tint_mode: full
  filter_sections:
  - name: Cohort
    icon: mdi:account-group-outline
    color: teal
    description: Which birds to look at, on every tab
    persistent: true
    pin: top
  - name: Measurements
    icon: mdi:ruler
    color: indigo
    description: A body-mass range, read from physical_features
    collapsed: true
  grid_sections:
  - name: Cohort
    icon: mdi:account-group-outline
    color: teal
    description: How many birds, of which species, and what the census is missing
  - name: Morphometrics
    icon: mdi:ruler
    color: indigo
    description: Body mass, flipper and bill, from physical_features
  - name: Joined
    icon: mdi:set-merge
    color: violet
    description: 'physical_features joined to demographic_data: mass and sex on one row'
  - name: Records
    icon: mdi:table
    color: gray
    description: The measurement rows behind every chart
    collapsed: true
  components:
  - tag: intro
    component_type: text
    title: The complete survey
    order: 2
    alignment: left
    body: '2009 arrives: 342 birds over three seasons. Renamed, rebranded with the species palette and
      regrouped into sections. Both datasets moved at this step, and so did their join.'
    layout:
      x: 0
      y: 0
      w: 8
      h: 1
  - tag: card-birds
    component_type: card
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: physical_features
    aggregation: count
    column_name: individual_id
    column_type: object
    icon_name: mdi:counter
    icon_color: '#55A868'
    title_color: '#55A868'
    title_font_size: md
    value_font_size: xl
    title: Birds measured
    layout:
      x: 0
      y: 0
      w: 2
      h: 2
    secondary_layout: coverage
    coverage_max: 342
    section: Cohort
  - tag: card-sexed
    component_type: card
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: demographic_data
    aggregation: count
    column_name: sex
    column_type: object
    icon_name: mdi:account-multiple-outline
    icon_color: '#C44E52'
    title_color: '#C44E52'
    title_font_size: md
    value_font_size: xl
    title: Sex recorded, three seasons
    layout:
      x: 2
      y: 0
      w: 2
      h: 2
    secondary_layout: completeness
    section: Cohort
  - tag: card-species
    component_type: card
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: demographic_data
    aggregation: nunique
    column_name: island
    column_type: object
    icon_name: mdi:map-marker-outline
    icon_color: '#A034F0'
    title_color: '#A034F0'
    title_font_size: md
    value_font_size: xl
    title: Island balance
    layout:
      x: 4
      y: 0
      w: 2
      h: 2
    secondary_layout: composition
    breakdown_col: island
    top_n_count: 3
    section: Cohort
  - tag: card-mass
    component_type: card
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: physical_features
    aggregation: median
    column_name: body_mass_g
    column_type: float64
    icon_name: mdi:chart-box-outline
    icon_color: '#FF8C00'
    title_color: '#FF8C00'
    title_font_size: md
    value_font_size: xl
    title: Body mass (g)
    layout:
      x: 6
      y: 0
      w: 2
      h: 2
    aggregations:
    - box_plot_stats
    secondary_layout: box_plot
    section: Cohort
  - tag: filter-species
    component_type: interactive
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: demographic_data
    interactive_component_type: SegmentedControl
    column_name: species
    column_type: object
    custom_color: '#FF8C00'
    icon_name: mdi:dna
    title: Species
    layout:
      x: 0
      y: 0
      w: 1
      h: 3
    section: Cohort
  - tag: filter-year
    component_type: interactive
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: demographic_data
    interactive_component_type: RangeSlider
    column_name: year
    column_type: int64
    custom_color: '#159090'
    icon_name: mdi:calendar-outline
    title: Field season
    layout:
      x: 0
      y: 3
      w: 1
      h: 3
    show_marks: true
    section: Cohort
  - tag: filter-mass
    component_type: interactive
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: physical_features
    interactive_component_type: RangeSlider
    column_name: body_mass_g
    column_type: float64
    custom_color: '#A034F0'
    icon_name: bx:slider-alt
    title: Body mass (g)
    layout:
      x: 0
      y: 6
      w: 1
      h: 3
    section: Measurements
  - tag: fig-mass
    component_type: figure
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: physical_features
    visu_type: box
    title: Body mass by season and species
    description: Three seasons side by side, per species.
    title_size: h3
    dict_kwargs:
      x: year
      y: body_mass_g
      color: species
      boxmode: group
      notched: true
      color_discrete_map: '{"Adelie": "#FF8C00", "Chinstrap": "#A034F0", "Gentoo": "#159090"}'
      labels: '{"species": "Species", "island": "Island", "year": "Field season", "sex": "Sex", "body_mass_g":
        "Body mass (g)", "flipper_length_mm": "Flipper length (mm)", "bill_length_mm": "Bill length (mm)",
        "bill_depth_mm": "Bill depth (mm)"}'
    layout:
      x: 0
      y: 0
      w: 4
      h: 5
    section: Morphometrics
  - tag: fig-morph
    component_type: figure
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: physical_features
    visu_type: scatter
    title: 'Bill shape: length vs depth'
    description: The one view where Adelie and Chinstrap separate.
    title_size: h3
    dict_kwargs:
      x: bill_length_mm
      y: bill_depth_mm
      color: species
      color_discrete_map: '{"Adelie": "#FF8C00", "Chinstrap": "#A034F0", "Gentoo": "#159090"}'
      labels: '{"species": "Species", "island": "Island", "year": "Field season", "sex": "Sex", "body_mass_g":
        "Body mass (g)", "flipper_length_mm": "Flipper length (mm)", "bill_length_mm": "Bill length (mm)",
        "bill_depth_mm": "Bill depth (mm)"}'
    layout:
      x: 4
      y: 0
      w: 4
      h: 5
    section: Morphometrics
  - tag: fig-mass-hist
    component_type: figure
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: physical_features
    visu_type: histogram
    title: Body mass distribution by island
    description: Biscoe looks heavy because Gentoo lives there.
    title_size: h3
    dict_kwargs:
      x: body_mass_g
      color: island
      barmode: overlay
      opacity: 0.6
      nbins: 30
      color_discrete_map: '{"Biscoe": "#5B8FA8", "Dream": "#B07AA1", "Torgersen": "#8C7B6B"}'
      labels: '{"species": "Species", "island": "Island", "year": "Field season", "sex": "Sex", "body_mass_g":
        "Body mass (g)", "flipper_length_mm": "Flipper length (mm)", "bill_length_mm": "Bill length (mm)",
        "bill_depth_mm": "Bill depth (mm)"}'
    layout:
      x: 0
      y: 5
      w: 8
      h: 4
    section: Morphometrics
  - tag: fig-mass-by-sex
    component_type: figure
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: joined_penguins_complete
    visu_type: box
    title: Body mass by sex, three seasons
    description: 'Mass from physical_features, sex from demographic_data: the persisted join.'
    title_size: h3
    dict_kwargs:
      x: sex
      y: body_mass_g
      color: species
      boxmode: group
      color_discrete_map: '{"Adelie": "#FF8C00", "Chinstrap": "#A034F0", "Gentoo": "#159090"}'
      labels: '{"species": "Species", "island": "Island", "year": "Field season", "sex": "Sex", "body_mass_g":
        "Body mass (g)", "flipper_length_mm": "Flipper length (mm)", "bill_length_mm": "Bill length (mm)",
        "bill_depth_mm": "Bill depth (mm)"}'
    layout:
      x: 0
      y: 0
      w: 6
      h: 5
    section: Joined
  - tag: card-joined
    component_type: card
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: joined_penguins_complete
    aggregation: average
    column_name: body_mass_g
    column_type: float64
    icon_name: mdi:chart-donut
    icon_color: '#5C6BC0'
    title_color: '#5C6BC0'
    title_font_size: md
    value_font_size: xl
    title: Mean body mass, by sex mix
    layout:
      x: 6
      y: 0
      w: 2
      h: 2
    secondary_layout: donut
    breakdown_col: sex
    top_n_count: 3
    section: Joined
  - tag: table-measurements
    component_type: table
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: physical_features
    title: Measurements
    description: Every row of physical_features, with the season it arrived in.
    title_size: h3
    page_size: 50
    layout:
      x: 0
      y: 0
      w: 8
      h: 5
    section: Records
tabs:
- title: Islands & Seasons
  subtitle: Where each species was sampled, season by season
  tab_icon: mdi:map-marker-outline
  tab_icon_color: teal
  brand_theme: *id001
  components:
  - tag: isl-intro
    component_type: text
    title: Three seasons, three islands
    order: 2
    alignment: left
    body: 'The species and season filters on the left come from the Overview tab: its Cohort section is
      persistent, so it reaches this tab without being declared here. *Body mass by island* reads *physical_features*;
      the rest reads *demographic_data*.'
    layout:
      x: 0
      y: 0
      w: 8
      h: 1
  - tag: isl-filter-island
    component_type: interactive
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: demographic_data
    interactive_component_type: MultiSelect
    column_name: island
    column_type: object
    custom_color: '#8172B2'
    icon_name: mdi:map-marker-outline
    title: Island
    layout:
      x: 0
      y: 0
      w: 1
      h: 3
  - tag: isl-birds-per-island
    component_type: figure
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: demographic_data
    visu_type: histogram
    title: Birds per island and species
    description: Grouped, so each species reads against its own axis.
    title_size: h3
    dict_kwargs:
      x: island
      color: species
      barmode: group
      color_discrete_map: '{"Adelie": "#FF8C00", "Chinstrap": "#A034F0", "Gentoo": "#159090"}'
      labels: '{"species": "Species", "island": "Island", "year": "Field season", "sex": "Sex", "body_mass_g":
        "Body mass (g)", "flipper_length_mm": "Flipper length (mm)", "bill_length_mm": "Bill length (mm)",
        "bill_depth_mm": "Bill depth (mm)"}'
    layout:
      x: 0
      y: 1
      w: 4
      h: 5
  - tag: isl-sex-by-species
    component_type: figure
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: demographic_data
    visu_type: histogram
    title: Sex by species, three seasons
    description: Nine birds still have no recorded sex.
    title_size: h3
    dict_kwargs:
      x: species
      color: sex
      barmode: group
      color_discrete_map: '{"female": "#C44E52", "male": "#546E7A"}'
      labels: '{"species": "Species", "island": "Island", "year": "Field season", "sex": "Sex", "body_mass_g":
        "Body mass (g)", "flipper_length_mm": "Flipper length (mm)", "bill_length_mm": "Bill length (mm)",
        "bill_depth_mm": "Bill depth (mm)"}'
    layout:
      x: 4
      y: 1
      w: 4
      h: 5
  - tag: isl-mass-by-island
    component_type: figure
    workflow_tag: penguins_versioned_workflow
    data_collection_tag: physical_features
    visu_type: box
    title: Body mass by island
    description: Biscoe splits into its Adelie and Gentoo halves.
    title_size: h3
    dict_kwargs:
      x: island
      y: body_mass_g
      color: species
      boxmode: group
      color_discrete_map: '{"Adelie": "#FF8C00", "Chinstrap": "#A034F0", "Gentoo": "#159090"}'
      labels: '{"species": "Species", "island": "Island", "year": "Field season", "sex": "Sex", "body_mass_g":
        "Body mass (g)", "flipper_length_mm": "Flipper length (mm)", "bill_length_mm": "Bill length (mm)",
        "bill_depth_mm": "Bill depth (mm)"}'
    layout:
      x: 0
      y: 6
      w: 8
      h: 5
