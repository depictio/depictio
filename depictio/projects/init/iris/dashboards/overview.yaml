# Iris Dataset Dashboard - DashboardDataLite format
# This file can be imported directly with: depictio dashboard import overview.yaml
version: 1

title: "Iris Dataset Analysis"
subtitle: "Overview of sepal/petal measurements across the three Iris varieties"
project_tag: "Iris Dataset Project Data Analysis"
main_tab_name: "Overview"

# Tab strip identity. Without these the tab renders with no icon while its
# sibling has one, which reads as a rendering fault rather than a choice.
tab_icon: "mdi:flower-outline"
tab_icon_color: "violet"

# `filter_sections` and `grid_sections` are two independent lists: the first
# groups the left panel's interactive controls, the second groups everything
# else in the main grid.
#
# Every Iconify id used here — section icons, card icons, filter icons — must
# already appear as a literal somewhere in the viewer's own TypeScript source.
# `scripts/generate-icon-subset.mjs` builds the bundled icon set by scanning
# that source, and the app's `connect-src 'self'` CSP blocks the runtime Iconify
# API, so an id only a YAML knows about renders blank in a built deployment (it
# still shows under the Vite dev server, which sends no CSP). Section icons have
# the narrower list the editor's Sections manager offers
# (depictio/viewer/src/components/sections/sectionIcons.ts).
filter_sections:
  # Persistent: this filter renders in every tab's panel and the variety picked
  # here survives tab switches (FilterSectionSpec.persistent, cross-tab fan-out).
  # `pin` is left at its default "top": a shared filter is what the panel should
  # open with, on every tab.
  - name: "Variety"
    icon: "mdi:filter-variant"
    color: "blue"
    description: "Which flowers to look at, on every tab"
    persistent: true
  - name: "Measurements"
    icon: "mdi:ruler"
    color: "indigo"
    description: "All four measurement ranges, folded into one card"
  - name: "Scoped views"
    icon: "mdi:tune"
    color: "pink"
    description: "Options computed from a pre-filtered subset"
    collapsed: true

# Main-grid sections — the right panel's collapsible outer level. Components
# join one by setting `section:`; anything that sets none (the intro text here)
# renders above the accordion, ungrouped. A folded section keeps its cards'
# values visible in its header, so folding simplifies the dashboard without
# hiding its numbers.
grid_sections:
  - name: "Cohort"
    icon: "mdi:counter"
    color: "teal"
    description: "What the 150 records are made of, and how precisely they were measured"
  - name: "Measurements"
    icon: "mdi:ruler"
    color: "indigo"
    description: "One card per measurement, each with the summary its own shape calls for"
  - name: "Distributions"
    icon: "mdi:chart-bell-curve"
    color: "violet"
    description: "Where the three varieties separate, and where they do not"
  # Persistent: the raw-data table renders (read-only) on every tab in the
  # family — the "records in view wherever you land" slot of issue #858.
  # `pin: bottom` puts it after each tab's own sections: it is reference
  # material, so it should not come before the tab's own introduction. Set it
  # to "top" (the default) for shared content that has to lead instead.
  - name: "Raw Data"
    icon: "mdi:table"
    color: "gray"
    description: "Per-flower records behind every figure, shown on every tab"
    collapsed: true
    persistent: true
    pin: "bottom"

components:
  # ── Narrative intro ────────────────────────────────────────────────
  - tag: text-overview-intro
    component_type: text
    section: "Cohort"
    title: "Iris Dataset — Overview"
    order: 2
    alignment: left
    body: "Fisher's classic 150-flower dataset across three varieties (*Setosa*, *Versicolor*, *Virginica*), 50 of each. The four cards below count the cohort and say how finely it was measured — petal width takes only 22 distinct values across 150 flowers, which is why it discretises so cleanly. Filters on the left refine every tile."
    layout: { x: 0, y: 0, w: 8, h: 2 }

  # ── Cohort cards — one row of four, w=2 each ───────────────────────
  - tag: card-flowers
    component_type: card
    section: "Cohort"
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    aggregation: count
    column_name: variety
    column_type: object
    secondary_layout: coverage
    coverage_max: 150
    icon_name: mdi:counter
    icon_color: "#4CAF50"
    title_color: "#4CAF50"
    title_font_size: md
    value_font_size: xl
    title: "Flowers"
    layout: { x: 0, y: 2, w: 2, h: 2 }

  - tag: card-varieties
    component_type: card
    section: "Cohort"
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    aggregation: nunique
    column_name: variety
    column_type: object
    secondary_layout: donut
    breakdown_col: variety
    top_n_count: 3
    icon_name: mdi:chart-donut
    icon_color: "#2196F3"
    title_color: "#2196F3"
    title_font_size: md
    value_font_size: xl
    title: "Varieties"
    layout: { x: 2, y: 2, w: 2, h: 2 }

  # ``uniqueness`` counts what is *repeated*, which nothing else surfaces here:
  # petal width takes far fewer distinct values than there are flowers, because
  # the measurements were recorded to the nearest 0.1 cm.
  - tag: card-petal-width-resolution
    component_type: card
    section: "Cohort"
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    aggregation: nunique
    column_name: petal.width
    column_type: float64
    secondary_layout: uniqueness
    icon_name: mdi:decimal
    icon_color: "#00897B"
    title_color: "#00897B"
    title_font_size: md
    value_font_size: xl
    title: "Petal width values"
    layout: { x: 4, y: 2, w: 2, h: 2 }

  # ``filter_expr`` narrows the rows before the hero count, and ``gauge`` draws
  # it as a level against the whole cohort. 2.5 cm is the petal length no Setosa
  # reaches, so this dial is the non-Setosa share of the dataset.
  - tag: card-long-petals
    component_type: card
    section: "Cohort"
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    aggregation: count
    column_name: petal.length
    column_type: float64
    filter_expr: "col('petal.length') > 2.5"
    secondary_layout: gauge
    coverage_max: 150
    icon_name: mdi:gauge
    icon_color: "#607D8B"
    title_color: "#607D8B"
    title_font_size: md
    value_font_size: xl
    title: "Petals > 2.5 cm"
    layout: { x: 6, y: 2, w: 2, h: 2 }

  # ── Measurement cards — one row of four, w=2 each ──────────────────
  # Four columns, four secondary layouts, picked from what each column actually
  # does: the sepal measurements are unimodal (a Tukey box and a quartile grid
  # describe them fully), the petal measurements are bimodal (a five-number
  # summary would draw them the same as a flat column) and petal width has a
  # cut-off that splits the dataset cleanly in two.
  - tag: text-measurements
    component_type: text
    section: "Measurements"
    title: "Measurements"
    order: 2
    alignment: left
    body: "One card per measurement, each carrying the summary its own shape calls for: a box plot where the spread matters, a two-column stat grid where the quartiles do, a histogram where the shape is bimodal, and a threshold count where the question is really \"how many are above the line\". Four layouts on four columns of the same table — the point is that the layout follows the column, not the other way round."
    layout: { x: 0, y: 5, w: 8, h: 3 }

  - tag: card-sepal-length
    component_type: card
    section: "Measurements"
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: sepal.length
    column_type: float64
    icon_name: mdi:chart-box-outline
    icon_color: "#9C27B0"
    title_color: "#9C27B0"
    title_font_size: md
    value_font_size: xl
    title: "Sepal Length"
    layout: { x: 0, y: 8, w: 2, h: 2 }

  - tag: card-sepal-width
    component_type: card
    section: "Measurements"
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    aggregation: median
    aggregations: [min, q1, q3, max]
    secondary_layout: grid
    column_name: sepal.width
    column_type: float64
    icon_name: mdi:grid-large
    icon_color: "#7E57C2"
    title_color: "#7E57C2"
    title_font_size: md
    value_font_size: xl
    title: "Sepal Width"
    layout: { x: 2, y: 8, w: 2, h: 2 }

  - tag: card-petal-length
    component_type: card
    section: "Measurements"
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    aggregation: median
    secondary_layout: histogram
    column_name: petal.length
    column_type: float64
    icon_name: mdi:chart-histogram
    icon_color: "#43A047"
    title_color: "#43A047"
    title_font_size: md
    value_font_size: xl
    title: "Petal Length"
    layout: { x: 4, y: 8, w: 2, h: 2 }

  # ``threshold`` is the only layout that returns a verdict rather than a shape.
  # 0.8 cm is above every Setosa petal and below every other flower's, so the
  # pass/fail split here is exactly the Setosa / not-Setosa split.
  - tag: card-petal-width
    component_type: card
    section: "Measurements"
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    aggregation: count
    secondary_layout: threshold
    threshold_value: 0.8
    threshold_direction: min
    column_name: petal.width
    column_type: float64
    icon_name: mdi:check-decagram
    icon_color: "#F4511E"
    title_color: "#F4511E"
    title_font_size: md
    value_font_size: xl
    title: "Petal width cut-off"
    layout: { x: 6, y: 8, w: 2, h: 2 }

  # ── Interactive filters — left panel, one section each ─────────────
  - tag: variety-filter
    component_type: interactive
    section: "Variety"
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    interactive_component_type: MultiSelect
    column_name: variety
    column_type: object
    custom_color: "#DD8452"
    icon_name: mdi:filter-variant
    title: "Variety"
    layout: {x: 0, y: 0, w: 1, h: 3}

  # The four measurement sliders share a `group`, so the section holds one
  # collapsible card instead of four stacked ones — the nesting the left panel
  # is built around (section → group → control).
  - tag: sepal-length-filter
    component_type: interactive
    section: "Measurements"
    group: "Measurement ranges"
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    interactive_component_type: RangeSlider
    column_name: sepal.length
    column_type: float64
    custom_color: "#4C72B0"
    icon_name: mdi:ruler
    title: "Sepal length (cm)"
    layout: {x: 0, y: 3, w: 1, h: 3}

  - tag: sepal-width-filter
    component_type: interactive
    section: "Measurements"
    group: "Measurement ranges"
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    interactive_component_type: RangeSlider
    column_name: sepal.width
    column_type: float64
    custom_color: "#8172B2"
    icon_name: mdi:ruler
    title: "Sepal width (cm)"
    layout: {x: 0, y: 6, w: 1, h: 3}

  - tag: petal-length-filter
    component_type: interactive
    section: "Measurements"
    group: "Measurement ranges"
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    interactive_component_type: RangeSlider
    column_name: petal.length
    column_type: float64
    custom_color: "#55A467"
    icon_name: mdi:ruler
    title: "Petal length (cm)"
    layout: {x: 0, y: 9, w: 1, h: 3}

  - tag: petal-width-filter
    component_type: interactive
    section: "Measurements"
    group: "Measurement ranges"
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    interactive_component_type: RangeSlider
    column_name: petal.width
    column_type: float64
    custom_color: "#937860"
    icon_name: mdi:ruler
    title: "Petal width (cm)"
    layout: {x: 0, y: 12, w: 1, h: 3}

  # `filter_expr` narrows the rows the dropdown's options are computed from, so
  # this one lists only the varieties that have a flower with a sepal over 6 cm
  # — Setosa never appears.
  - tag: wide-petal-variety-filter
    component_type: interactive
    section: "Scoped views"
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    interactive_component_type: MultiSelect
    column_name: variety
    column_type: object
    filter_expr: "col('petal.width') > 1.8"
    custom_color: "#C44E52"
    icon_name: mdi:filter-cog-outline
    title: "Variety (petal width > 1.8 cm)"
    description: "34 of 150 flowers clear that width, and all 34 are Virginica — the
      dropdown collapsing to a single option is the filter working, not failing."
    layout: { x: 0, y: 15, w: 1, h: 3 }

  # ── Distribution figures ───────────────────────────────────────────
  # Hero: scatter matrix across all 4 measurement columns. Both halves
  # rendered for symmetry; diagonal acts as a per-variable distribution
  # tick strip. Rendered via code mode because `scatter_matrix` is a
  # plotly-express figure factory, not one of the core six visu_types
  # supported by the lite YAML schema.
  - tag: text-distributions
    component_type: text
    section: "Distributions"
    title: "Where the varieties separate"
    order: 2
    alignment: left
    body: "*Setosa* separates on petal size alone — it is linearly separable from the other two on either petal axis. *Versicolor* and *Virginica* overlap on every single measurement and only pull apart when petal length and width are read together, which is what the scatter matrix is for. Filter to one variety on the left and watch which panels stop being informative."
    layout: { x: 0, y: 6, w: 8, h: 2 }

  - tag: iris-scatter-matrix
    component_type: figure
    section: "Distributions"
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    visu_type: scatter
    mode: code
    title: "Iris pairwise measurements"
    description: "Scatter matrix across all four measurements (seaborn deep palette). Off-diagonal = pairwise scatter, diagonal = per-variable distribution. Every panel involving a petal measurement shows Setosa detached; no sepal-only panel does."
    title_size: h3
    code_content: |
      df_pd = df.to_pandas()
      fig = px.scatter_matrix(
          df_pd,
          dimensions=['sepal.length', 'sepal.width', 'petal.length', 'petal.width'],
          color='variety',
          color_discrete_map={'Setosa': '#4C72B0', 'Versicolor': '#DD8452', 'Virginica': '#55A467'},
          labels={'sepal.length': 'Sepal L', 'sepal.width': 'Sepal W', 'petal.length': 'Petal L', 'petal.width': 'Petal W'},
      )
      fig.update_traces(diagonal_visible=True, showupperhalf=True, marker=dict(size=4, opacity=0.75, line=dict(width=0.4, color='white')))
      fig.update_layout(dragmode='select')
    layout: { x: 0, y: 0, w: 8, h: 6 }

  # A box and a violin on the same axes, deliberately: petal length separates
  # all three varieties, sepal length leaves Versicolor and Virginica
  # overlapping. Two different marks rather than the same one twice, so the
  # contrast is between the columns and not just between two identical charts.
  - tag: petal-length-box
    component_type: figure
    section: "Distributions"
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    visu_type: box
    title: "Petal Length by Variety"
    description: "Box + all points; notched to show median CIs. The three boxes barely touch — petal length alone almost classifies the dataset."
    title_size: h3
    dict_kwargs:
      x: variety
      y: petal.length
      color: variety
      points: all
      notched: true
      color_discrete_map: '{"Setosa": "#4C72B0", "Versicolor": "#DD8452", "Virginica": "#55A467"}'
    layout: { x: 0, y: 8, w: 4, h: 5 }

  - tag: sepal-length-violin
    component_type: figure
    section: "Distributions"
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    visu_type: scatter
    mode: code
    title: "Sepal Length by Variety"
    description: "The sepal side, drawn as violins so the full shape shows: Versicolor and Virginica overlap across most of their range and both are broad rather than tight, which is why the sepal-only panels of the matrix look mixed."
    title_size: h3
    code_content: |
      fig = px.violin(
          df.to_pandas(),
          x='variety', y='sepal.length', color='variety',
          box=True, points='all',
          color_discrete_map={'Setosa': '#4C72B0', 'Versicolor': '#DD8452', 'Virginica': '#55A467'},
          labels={'sepal.length': 'Sepal length (cm)', 'variety': 'Variety'},
      )
      fig.update_traces(meanline_visible=True, marker=dict(size=4, opacity=0.6))
    layout: { x: 4, y: 8, w: 4, h: 5 }

  # Bivariate scatter with marginal distributions (violin top, rug right).
  # Five visual channels: x, y, color, size, symbol — packs four numeric
  # columns + the variety category into a single tile.
  - tag: sepal-petal-bivariate
    component_type: figure
    section: "Distributions"
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    visu_type: scatter
    title: "Sepal vs Petal Length (bivariate + marginals)"
    description: "Colour + symbol = variety, size = sepal width. Top marginal = violin, right marginal = rug ticks. The gap in the right-hand rug is the same 2.5 cm cut the Petals > 2.5 cm card counts."
    title_size: h3
    dict_kwargs:
      x: sepal.length
      y: petal.length
      color: variety
      size: sepal.width
      symbol: variety
      size_max: 18
      marginal_x: violin
      marginal_y: rug
      opacity: 0.85
      color_discrete_map: '{"Setosa": "#4C72B0", "Versicolor": "#DD8452", "Virginica": "#55A467"}'
    layout: { x: 0, y: 13, w: 8, h: 5 }

  # Plain scatter (no marginals/trendline) so lasso selection stays direct:
  # selections narrow the dashboard and can be saved as named groups
  # ("select & compare"). The bivariate above keeps its marginals instead.
  - tag: petal-shape-scatter
    component_type: figure
    section: "Distributions"
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    visu_type: scatter
    title: "Petal Shape — Length vs Width"
    description: "Lasso a cluster to filter the dashboard, or save the selection as a group. Note: iris has no per-flower ID, so a selection captures whole varieties."
    title_size: h3
    dict_kwargs:
      x: petal.length
      y: petal.width
      color: variety
      opacity: 0.85
      color_discrete_map: '{"Setosa": "#4C72B0", "Versicolor": "#DD8452", "Virginica": "#55A467"}'
    selection_enabled: true
    selection_column: variety
    layout: { x: 0, y: 18, w: 8, h: 5 }

  # ── Data table ─────────────────────────────────────────────────────
  - tag: text-raw-data
    component_type: text
    section: "Raw Data"
    title: "Records in view"
    order: 2
    alignment: left
    body: "This section is `persistent` and pinned to the bottom, so it follows you to the Petal tab: wherever you land, the cards and the table describe the rows the current filters actually leave standing. Collapsed by default because it is reference material, not the point of the page."
    layout: { x: 0, y: 0, w: 8, h: 1 }

  - tag: card-raw-flowers
    component_type: card
    section: "Raw Data"
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    title: "Flowers in view"
    column_name: variety
    column_type: object
    aggregation: count
    secondary_layout: coverage
    coverage_max: 150
    icon_name: mdi:counter
    icon_color: "gray"
    title_color: "gray"
    layout: { x: 0, y: 1, w: 2, h: 2 }

  - tag: card-raw-varieties
    component_type: card
    section: "Raw Data"
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    title: "Varieties in view"
    column_name: variety
    column_type: object
    aggregation: nunique
    secondary_layout: top_n
    breakdown_col: variety
    top_n_count: 3
    icon_name: mdi:chart-bar
    icon_color: "teal"
    title_color: "teal"
    layout: { x: 2, y: 1, w: 2, h: 2 }

  - tag: card-raw-sepal-length
    component_type: card
    section: "Raw Data"
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    title: "Sepal length"
    column_name: sepal.length
    column_type: float64
    aggregation: average
    aggregations: [median, std_dev, min, max]
    secondary_layout: compact
    icon_name: mdi:ruler
    icon_color: "indigo"
    title_color: "indigo"
    layout: { x: 4, y: 1, w: 2, h: 2 }

  - tag: card-raw-petal-length
    component_type: card
    section: "Raw Data"
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    title: "Petal length"
    column_name: petal.length
    column_type: float64
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    icon_name: mdi:chart-bell-curve
    icon_color: "violet"
    title_color: "violet"
    layout: { x: 6, y: 1, w: 2, h: 2 }

  - tag: data-table
    component_type: table
    section: "Raw Data"
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    title: "Iris Dataset"
    description: "Complete iris flower measurements across the three varieties."
    title_size: h3
    title_align: left
    page_size: 100
    layout: { x: 0, y: 3, w: 8, h: 5 }
