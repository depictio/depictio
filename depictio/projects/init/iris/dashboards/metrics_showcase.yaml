# Iris Metrics & Filters Showcase - DashboardDataLite format
#
# Exercises every multi-metric card layout shipped in this branch
# (vertical / compact / box_plot / top_n / coverage / concentration) plus
# conditional aggregations, and a left panel whose interactive components are
# bucketed into families via the `group` field (max 3 members per group —
# DashboardDataLite.validate_interactive_groups).
#
# Import with:
#   depictio-cli dashboard import \
#     depictio/projects/init/iris/dashboards/metrics_showcase.yaml \
#     --config depictio/.depictio/admin_config.yaml
version: 1

title: "Iris — Metrics & Filters Showcase"
subtitle: "Every multi-metric card layout, and left-panel filters grouped by family"
project_tag: "Iris Dataset Project Data Analysis"

components:
  # ── Narrative intro ────────────────────────────────────────────────
  - tag: text-showcase-intro
    component_type: text
    title: "Iris — Metrics & Filters Showcase"
    order: 2
    alignment: left
    body: "Fisher's 150-flower dataset rendered through **every** card layout: Tukey box plots, compact and vertical stat strips, top-N breakdowns, coverage bars and concentration lines. Left-panel filters are grouped by family (**Sepal**, **Petal**, **Variety**) and AND together."
    layout: {x: 0, y: 0, w: 8, h: 1}

  # ── Row 1: distribution cards (box_plot layout) ────────────────────
  # `box_plot_stats` returns the compound five-number summary + 1.5×IQR
  # whiskers + outliers in one payload; `secondary_layout: box_plot` draws it
  # as a box-and-whisker strip under the hero median.
  - tag: showcase-sepal-length-box
    component_type: card
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: sepal.length
    column_type: float64
    icon_name: mdi:flower-outline
    icon_color: "#9C27B0"
    title_color: "#9C27B0"
    title_font_size: lg
    value_font_size: xl
    title: "Sepal Length (cm)"
    layout: {x: 0, y: 1, w: 4, h: 2}

  - tag: showcase-petal-length-box
    component_type: card
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: petal.length
    column_type: float64
    icon_name: mdi:leaf
    icon_color: "#43A047"
    title_color: "#43A047"
    title_font_size: lg
    value_font_size: xl
    title: "Petal Length (cm)"
    layout: {x: 4, y: 1, w: 4, h: 2}

  # ── Row 2: stat-strip cards (compact + vertical layouts) ───────────
  # `compact` lays the secondary aggregations out horizontally, `vertical`
  # stacks them as label/value rows. Same data path, different density.
  - tag: showcase-sepal-width-compact
    component_type: card
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    aggregation: average
    aggregations: [std_dev, min, max]
    secondary_layout: compact
    column_name: sepal.width
    column_type: float64
    icon_name: mdi:arrow-expand-horizontal
    icon_color: "#1E88E5"
    title_color: "#1E88E5"
    title_font_size: lg
    value_font_size: xl
    title: "Sepal Width — spread"
    layout: {x: 0, y: 3, w: 4, h: 2}

  - tag: showcase-petal-width-vertical
    component_type: card
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    aggregation: median
    aggregations: [q1, q3, range]
    secondary_layout: vertical
    column_name: petal.width
    column_type: float64
    icon_name: mdi:format-line-spacing
    icon_color: "#00897B"
    title_color: "#00897B"
    title_font_size: lg
    value_font_size: xl
    title: "Petal Width — quartiles"
    layout: {x: 4, y: 3, w: 4, h: 2}

  # ── Row 3: categorical + coverage cards ────────────────────────────
  # `top_n` renders a mini horizontal bar chart of the most frequent values of
  # `breakdown_col`; `coverage` fills a bar of hero/coverage_max;
  # `concentration` surfaces only the top-N share as a single line.
  - tag: showcase-variety-topn
    component_type: card
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    aggregation: nunique
    column_name: variety
    column_type: object
    secondary_layout: top_n
    breakdown_col: variety
    top_n_count: 3
    icon_name: mdi:flower-tulip
    icon_color: "#2196F3"
    title_color: "#2196F3"
    title_font_size: lg
    value_font_size: xl
    title: "Varieties (top 3)"
    layout: {x: 0, y: 5, w: 3, h: 2}

  - tag: showcase-sample-coverage
    component_type: card
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    aggregation: count
    column_name: variety
    column_type: object
    secondary_layout: coverage
    coverage_max: 150
    icon_name: mdi:counter
    icon_color: "#4CAF50"
    title_color: "#4CAF50"
    title_font_size: lg
    value_font_size: xl
    title: "Flowers in scope"
    layout: {x: 3, y: 5, w: 3, h: 2}

  - tag: showcase-variety-concentration
    component_type: card
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    aggregation: count
    column_name: variety
    column_type: object
    secondary_layout: concentration
    breakdown_col: variety
    top_n_count: 2
    icon_name: mdi:chart-donut
    icon_color: "#FB8C00"
    title_color: "#FB8C00"
    title_font_size: lg
    value_font_size: xl
    title: "Variety concentration"
    layout: {x: 6, y: 5, w: 2, h: 2}

  # ── Row 4: conditional aggregation cards (filter_expr) ─────────────
  # `filter_expr` pre-filters the frame server-side (safe Polars evaluator)
  # before the aggregation runs — a scoped metric independent of the sidebar.
  - tag: showcase-long-petal-count
    component_type: card
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    aggregation: count
    column_name: petal.length
    column_type: float64
    filter_expr: "col('petal.length') > 4"
    icon_name: mdi:filter-check-outline
    icon_color: "#F4511E"
    title_color: "#F4511E"
    title_font_size: md
    value_font_size: xl
    title: "Petals > 4 cm"
    layout: {x: 0, y: 7, w: 2, h: 2}

  - tag: showcase-setosa-sepal-mean
    component_type: card
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    aggregation: average
    aggregations: [median, std_dev]
    secondary_layout: compact
    column_name: sepal.length
    column_type: float64
    filter_expr: "col('variety') == 'Setosa'"
    icon_name: mdi:target
    icon_color: "#4C72B0"
    title_color: "#4C72B0"
    title_font_size: md
    value_font_size: xl
    title: "Setosa sepal length"
    layout: {x: 2, y: 7, w: 3, h: 2}

  - tag: showcase-wide-sepal-varieties
    component_type: card
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    aggregation: nunique
    column_name: variety
    column_type: object
    filter_expr: "col('sepal.width') >= 3.5"
    secondary_layout: top_n
    breakdown_col: variety
    top_n_count: 3
    icon_name: mdi:filter-variant-plus
    icon_color: "#8E24AA"
    title_color: "#8E24AA"
    title_font_size: md
    value_font_size: xl
    title: "Varieties (sepal width ≥ 3.5)"
    layout: {x: 5, y: 7, w: 3, h: 2}

  # ── Left panel — grouped by family ─────────────────────────────────
  # Components sharing a `group` render inside one Mantine Paper with the
  # group name as its header. Grouping is purely presentational: each member
  # still emits its own filter and they AND together in the filter pipeline.
  # Hard cap of 3 members per group (MAX_INTERACTIVE_GROUP_SIZE).

  # Family 1 — Sepal geometry
  - tag: showcase-filter-sepal-length
    component_type: interactive
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    interactive_component_type: RangeSlider
    column_name: sepal.length
    column_type: float64
    group: "Sepal geometry"
    custom_color: "#4C72B0"
    icon_name: mdi:ruler
    title: "Sepal length (cm)"
    layout: {x: 0, y: 0, w: 1, h: 3}

  - tag: showcase-filter-sepal-width
    component_type: interactive
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    interactive_component_type: RangeSlider
    column_name: sepal.width
    column_type: float64
    group: "Sepal geometry"
    custom_color: "#4C72B0"
    icon_name: mdi:arrow-expand-horizontal
    title: "Sepal width (cm)"
    layout: {x: 0, y: 3, w: 1, h: 3}

  # Family 2 — Petal geometry
  - tag: showcase-filter-petal-length
    component_type: interactive
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    interactive_component_type: RangeSlider
    column_name: petal.length
    column_type: float64
    group: "Petal geometry"
    custom_color: "#55A467"
    icon_name: mdi:ruler
    title: "Petal length (cm)"
    layout: {x: 0, y: 6, w: 1, h: 3}

  - tag: showcase-filter-petal-width
    component_type: interactive
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    interactive_component_type: RangeSlider
    column_name: petal.width
    column_type: float64
    group: "Petal geometry"
    custom_color: "#55A467"
    icon_name: mdi:arrow-expand-horizontal
    title: "Petal width (cm)"
    layout: {x: 0, y: 9, w: 1, h: 3}

  # Family 3 — Variety pickers. Three flavours of the same column so the
  # group also demonstrates SegmentedControl / MultiSelect / scoped MultiSelect
  # side by side.
  - tag: showcase-filter-variety-segmented
    component_type: interactive
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    interactive_component_type: SegmentedControl
    column_name: variety
    column_type: object
    group: "Variety"
    custom_color: "#DD8452"
    icon_name: mdi:format-list-bulleted
    title: "Variety (single)"
    layout: {x: 0, y: 12, w: 1, h: 3}

  - tag: showcase-filter-variety-multi
    component_type: interactive
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    interactive_component_type: MultiSelect
    column_name: variety
    column_type: object
    group: "Variety"
    custom_color: "#DD8452"
    icon_name: mdi:filter-variant
    title: "Variety (multi)"
    layout: {x: 0, y: 15, w: 1, h: 3}

  - tag: showcase-filter-variety-scoped
    component_type: interactive
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    interactive_component_type: MultiSelect
    column_name: variety
    column_type: object
    filter_expr: "col('petal.length') > 4"
    group: "Variety"
    custom_color: "#C44E52"
    icon_name: mdi:filter-check
    title: "Variety (petal > 4 cm)"
    layout: {x: 0, y: 18, w: 1, h: 3}

  # ── Figures ────────────────────────────────────────────────────────
  - tag: showcase-petal-scatter
    component_type: figure
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    visu_type: scatter
    title: "Petal Length vs Width"
    description: "Bivariate petal signature — the cleanest variety separator. Size = sepal length, marginals = violin / rug."
    title_size: h3
    dict_kwargs:
      x: petal.length
      y: petal.width
      color: variety
      size: sepal.length
      symbol: variety
      size_max: 16
      marginal_x: violin
      marginal_y: rug
      opacity: 0.85
      color_discrete_map: '{"Setosa": "#4C72B0", "Versicolor": "#DD8452", "Virginica": "#55A467"}'
    layout: {x: 0, y: 9, w: 4, h: 5}

  - tag: showcase-sepal-box
    component_type: figure
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    visu_type: box
    title: "Sepal Length by Variety"
    description: "Box + all points; notched to show median CIs. Mirrors the Tukey card above at full size."
    title_size: h3
    dict_kwargs:
      x: variety
      y: sepal.length
      color: variety
      points: all
      notched: true
      color_discrete_map: '{"Setosa": "#4C72B0", "Versicolor": "#DD8452", "Virginica": "#55A467"}'
    layout: {x: 4, y: 9, w: 4, h: 5}

  - tag: showcase-width-histogram
    component_type: figure
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    visu_type: histogram
    title: "Sepal Width Distribution (overlay)"
    description: "Per-variety overlay; bars semi-transparent to expose the Setosa / Versicolor overlap."
    title_size: h3
    dict_kwargs:
      x: sepal.width
      color: variety
      nbins: 25
      barmode: overlay
      opacity: 0.7
      color_discrete_map: '{"Setosa": "#4C72B0", "Versicolor": "#DD8452", "Virginica": "#55A467"}'
    layout: {x: 0, y: 14, w: 8, h: 5}

  # ── Data table ─────────────────────────────────────────────────────
  - tag: showcase-data-table
    component_type: table
    workflow_tag: python/iris_workflow
    data_collection_tag: iris_table
    title: "Iris Measurements"
    description: "Per-flower sepal + petal measurements feeding every tile above."
    title_size: h3
    title_align: left
    page_size: 15
    layout: {x: 0, y: 19, w: 8, h: 5}
