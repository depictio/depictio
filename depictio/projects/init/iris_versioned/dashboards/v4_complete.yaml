# Iris Versioned — dashboard v4: the full dataset.
#
# Batch 4 adds Virginica on top of the corrected Setosa values, so the final
# state carries both kinds of change at once: new rows AND revised ones.
#
# Changes from v3:
#
#   REMOVED   the petal-length range filter — three varieties separate cleanly
#             by name, so filtering by measurement stopped earning its slot
#   RETYPED   the bar chart becomes a scatter again, now that a third group
#             makes the sepal/petal relationship worth seeing
#   ADDED     a data table exposing `depictio_run_id`, so which rows came from
#             which ingestion is visible rather than asserted
#
# Pair with data version 3. Restoring v1 from here is a visible subtraction of
# six components across four batches, which is what the timeline is for.
version: 1

title: "Iris Versioned — Survey"
subtitle: "Batch 4: the complete survey"
project_tag: "Iris Versioned Demo"

components:
  - tag: text-intro
    component_type: text
    title: "Complete survey"
    order: 2
    alignment: left
    body: "All three varieties, 150 flowers, with **Setosa's corrected measurements** carried through. This state has both new rows and revised ones."
    layout: {x: 0, y: 0, w: 8, h: 1}

  - tag: sample-count
    component_type: card
    workflow_tag: python/iris_versioned_workflow
    data_collection_tag: iris_versioned_table
    aggregation: count
    column_name: variety
    column_type: object
    icon_name: mdi:counter
    icon_color: "#4CAF50"
    title_color: "#4CAF50"
    title_font_size: xl
    value_font_size: xl
    title: "Flowers Measured"
    layout: {x: 0, y: 1, w: 2, h: 2}

  - tag: petal-mean
    component_type: card
    workflow_tag: python/iris_versioned_workflow
    data_collection_tag: iris_versioned_table
    aggregation: nunique
    column_name: variety
    column_type: object
    secondary_layout: top_n
    breakdown_col: variety
    top_n_count: 3
    icon_name: mdi:flower-tulip
    icon_color: "#2196F3"
    title_color: "#2196F3"
    title_font_size: xl
    value_font_size: xl
    title: "Varieties Surveyed"
    layout: {x: 2, y: 1, w: 2, h: 2}

  - tag: setosa-petal-mean
    component_type: card
    workflow_tag: python/iris_versioned_workflow
    data_collection_tag: iris_versioned_table
    aggregation: average
    column_name: petal.length
    column_type: float64
    icon_name: mdi:ruler
    icon_color: "#E64A19"
    title_color: "#E64A19"
    title_font_size: xl
    value_font_size: xl
    title: "Mean Petal Length"
    layout: {x: 4, y: 1, w: 2, h: 2}

  - tag: petal-max
    component_type: card
    workflow_tag: python/iris_versioned_workflow
    data_collection_tag: iris_versioned_table
    aggregation: max
    column_name: petal.length
    column_type: float64
    icon_name: mdi:arrow-expand-up
    icon_color: "#9C27B0"
    title_color: "#9C27B0"
    title_font_size: xl
    value_font_size: xl
    title: "Longest Petal"
    layout: {x: 6, y: 1, w: 2, h: 2}

  - tag: variety-filter
    component_type: interactive
    workflow_tag: python/iris_versioned_workflow
    data_collection_tag: iris_versioned_table
    interactive_component_type: MultiSelect
    column_name: variety
    column_type: object
    custom_color: "#DD8452"
    icon_name: mdi:filter-variant
    title: "Variety"
    layout: {x: 0, y: 0, w: 1, h: 3}

  - tag: petal-hist
    component_type: figure
    workflow_tag: python/iris_versioned_workflow
    data_collection_tag: iris_versioned_table
    visu_type: box
    title: "Petal Length by Variety"
    description: "Open this component's history to watch it change shape (histogram → box) and change data across four versions."
    title_size: h3
    dict_kwargs:
      x: variety
      y: petal.length
      color: variety
      points: all
      color_discrete_map: '{"Setosa": "#4C72B0", "Versicolor": "#DD8452", "Virginica": "#55A467"}'
    layout: {x: 0, y: 3, w: 4, h: 5}

  # Back to a scatter, now that a third variety makes the relationship between
  # sepal and petal worth seeing again.
  - tag: sepal-petal-scatter
    component_type: figure
    workflow_tag: python/iris_versioned_workflow
    data_collection_tag: iris_versioned_table
    visu_type: scatter
    title: "Sepal vs Petal"
    description: "A bar chart in v3, a scatter in v2 and here."
    title_size: h3
    dict_kwargs:
      x: sepal.length
      y: petal.length
      color: variety
      color_discrete_map: '{"Setosa": "#4C72B0", "Versicolor": "#DD8452", "Virginica": "#55A467"}'
    layout: {x: 4, y: 3, w: 4, h: 5}

  - tag: data-table
    component_type: table
    workflow_tag: python/iris_versioned_workflow
    data_collection_tag: iris_versioned_table
    title: "All Measurements"
    description: "Includes depictio_run_id, so which batch a row came from is visible rather than asserted."
    layout: {x: 0, y: 8, w: 8, h: 5}
