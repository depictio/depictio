# Iris Versioned — dashboard v1: the first collection.
#
# The first of FOUR dashboards in this demo, matching the first of four data
# versions. Import this one, then edit it into v2/v3/v4 (see README.md) so the
# version drawer shows a real progression rather than four unrelated imports.
#
# Deliberately sparse: a single variety has been collected, so most questions
# cannot be asked yet. Everything the later versions add is a response to data
# that did not exist here.
version: 1

title: "Iris Versioned — Survey"
subtitle: "Batch 1: Setosa only"
project_tag: "Iris Versioned Demo"

components:
  - tag: text-intro
    component_type: text
    title: "First collection"
    order: 2
    alignment: left
    body: "First collection batch: **Setosa** only, 50 flowers. Versicolor and Virginica have not been surveyed yet, so there is nothing to compare against."
    layout: {x: 0, y: 0, w: 8, h: 1}

  - tag: sample-count
    component_type: card
    workflow_tag: python/iris_versioned_workflow
    data_collection_tag: iris_versioned_table
    aggregation: count
    column_name: variety
    column_type: object
    icon_name: mdi:counter
    icon_color: "#4CAF50"
    title_color: "#4CAF50"
    title_font_size: xl
    value_font_size: xl
    title: "Flowers Measured"
    layout: {x: 0, y: 1, w: 4, h: 2}

  # The headline number for data time travel: 50 → 100 → 100 → 150 across the
  # four data versions. The step that does NOT move (v2 → v3) is the point.
  - tag: petal-mean
    component_type: card
    workflow_tag: python/iris_versioned_workflow
    data_collection_tag: iris_versioned_table
    aggregation: average
    column_name: petal.length
    column_type: float64
    icon_name: mdi:ruler
    icon_color: "#2196F3"
    title_color: "#2196F3"
    title_font_size: xl
    value_font_size: xl
    title: "Mean Petal Length"
    layout: {x: 4, y: 1, w: 4, h: 2}

  - tag: variety-filter
    component_type: interactive
    workflow_tag: python/iris_versioned_workflow
    data_collection_tag: iris_versioned_table
    interactive_component_type: MultiSelect
    column_name: variety
    column_type: object
    custom_color: "#DD8452"
    icon_name: mdi:filter-variant
    title: "Variety"
    layout: {x: 0, y: 0, w: 1, h: 3}

  - tag: petal-hist
    component_type: figure
    workflow_tag: python/iris_versioned_workflow
    data_collection_tag: iris_versioned_table
    visu_type: histogram
    title: "Petal Length Distribution"
    description: "One variety, so a histogram is all this batch supports. v2 replaces it with a box plot once there is something to compare."
    title_size: h3
    dict_kwargs:
      x: petal.length
      nbins: 20
      # A real list, not a quoted one. Plotly Express silently treats a string
      # here as a sequence of single characters, which knocks the histogram
      # down to a scatter — it renders, so nothing reports an error.
      color_discrete_sequence: ["#4C72B0"]
    layout: {x: 0, y: 3, w: 8, h: 5}
