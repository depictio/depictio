# Iris Versioned — dashboard v3: reading a correction.
#
# Batch 3 re-measures Setosa. Same 100 rows, same two varieties as batch 2 —
# only the values move. This dashboard is built to make that visible, because
# nothing else about the data announces it.
#
# Changes from v2:
#
#   REMOVED   the scatter — it says nothing about a calibration shift, and a
#             version diff that never removes anything is only half tested
#   RETYPED   "Median Petal Length" becomes a per-variety mean bar chart:
#             a single median hides which group moved
#   ADDED     a Setosa-only mean card, the number that changes between data
#             versions 1 and 2 while every row count stays put
#
# Pair with data version 2. If the petal figures look identical to v2's, data
# time travel is not working — that is the whole test.
version: 1

title: "Iris Versioned — Survey"
subtitle: "Batch 3: Setosa recalibrated"
project_tag: "Iris Versioned Demo"

components:
  - tag: text-intro
    component_type: text
    title: "Calibration correction"
    order: 2
    alignment: left
    body: "Setosa petal lengths **re-measured** after a calibration fix. Still 100 flowers, still two varieties — only the values changed, so the row count tells you nothing here."
    layout: {x: 0, y: 0, w: 8, h: 1}

  - tag: sample-count
    component_type: card
    workflow_tag: python/iris_versioned_workflow
    data_collection_tag: iris_versioned_table
    aggregation: count
    column_name: variety
    column_type: object
    icon_name: mdi:counter
    icon_color: "#4CAF50"
    title_color: "#4CAF50"
    title_font_size: xl
    value_font_size: xl
    title: "Flowers Measured"
    layout: {x: 0, y: 1, w: 3, h: 2}

  - tag: petal-mean
    component_type: card
    workflow_tag: python/iris_versioned_workflow
    data_collection_tag: iris_versioned_table
    aggregation: nunique
    column_name: variety
    column_type: object
    secondary_layout: top_n
    breakdown_col: variety
    top_n_count: 3
    icon_name: mdi:flower-tulip
    icon_color: "#2196F3"
    title_color: "#2196F3"
    title_font_size: xl
    value_font_size: xl
    title: "Varieties Surveyed"
    layout: {x: 3, y: 1, w: 2, h: 2}

  # The demo's sharpest instrument. Setosa's mean petal length moves from 1.46
  # to 2.07 between data versions 1 and 2 while every count stays identical, so
  # this card alone distinguishes them.
  - tag: setosa-petal-mean
    component_type: card
    workflow_tag: python/iris_versioned_workflow
    data_collection_tag: iris_versioned_table
    aggregation: average
    column_name: petal.length
    column_type: float64
    icon_name: mdi:alert-decagram
    icon_color: "#E64A19"
    title_color: "#E64A19"
    title_font_size: xl
    value_font_size: xl
    title: "Mean Petal Length"
    layout: {x: 5, y: 1, w: 3, h: 2}

  - tag: variety-filter
    component_type: interactive
    workflow_tag: python/iris_versioned_workflow
    data_collection_tag: iris_versioned_table
    interactive_component_type: MultiSelect
    column_name: variety
    column_type: object
    custom_color: "#DD8452"
    icon_name: mdi:filter-variant
    title: "Variety"
    layout: {x: 0, y: 0, w: 1, h: 3}

  - tag: petal-length-filter
    component_type: interactive
    workflow_tag: python/iris_versioned_workflow
    data_collection_tag: iris_versioned_table
    interactive_component_type: RangeSlider
    column_name: petal.length
    column_type: float64
    custom_color: "#4C72B0"
    icon_name: mdi:arrow-left-right
    title: "Petal length"
    layout: {x: 0, y: 3, w: 1, h: 3}

  - tag: petal-hist
    component_type: figure
    workflow_tag: python/iris_versioned_workflow
    data_collection_tag: iris_versioned_table
    visu_type: box
    title: "Petal Length by Variety"
    description: "Step this component through its history: the Setosa box jumps between data versions 1 and 2 while the row count never moves."
    title_size: h3
    dict_kwargs:
      x: variety
      y: petal.length
      color: variety
      points: all
      color_discrete_map: '{"Setosa": "#4C72B0", "Versicolor": "#DD8452", "Virginica": "#55A467"}'
    layout: {x: 0, y: 3, w: 4, h: 5}

  # Replaces v2's scatter. A scatter of sepal against petal barely registers a
  # calibration shift; a per-variety mean bar shows exactly which group moved.
  - tag: sepal-petal-scatter
    component_type: figure
    workflow_tag: python/iris_versioned_workflow
    data_collection_tag: iris_versioned_table
    visu_type: bar
    title: "Mean Petal Length by Variety"
    description: "Was a sepal/petal scatter in v2."
    title_size: h3
    dict_kwargs:
      x: variety
      y: petal.length
      color: variety
      histfunc: avg
      color_discrete_map: '{"Setosa": "#4C72B0", "Versicolor": "#DD8452", "Virginica": "#55A467"}'
    layout: {x: 4, y: 3, w: 4, h: 5}
