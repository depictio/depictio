# SARS-CoV-2 — second tab of the genome tracks showcase.
#
# Regenerate the seed after editing:
#   venv/bin/python -m depictio.dev_scripts.generate_dashboard_seeds genome_tracks_examples
title: 'SARS-CoV-2 variants'
subtitle: 'nf-core/viralrecon megatest: iVar calls and primer-trimmed reads, read in place from S3 on a custom assembly'
icon: 'mdi:virus'
icon_color: 'red'
icon_variant: filled
workflow_system: python
dashboard_id: '946b0f3c1e4a2d7f8e5bca20'
is_main_tab: false
tab_order: 1
parent_dashboard_tag: strandseq
tab_icon: 'mdi:virus'
tab_icon_color: 'red'

filter_sections:
  - name: 'Samples'
    icon: 'mdi:filter-variant'
    color: 'red'
    description: 'Which samples to look at'

grid_sections:
  - name: 'About'
    icon: 'mdi:information-outline'
    color: 'gray'
    description: 'Where the tracks come from'
  - name: 'Genome browser'
    icon: 'mdi:dna'
    color: 'orange'
    description: 'Pick samples on the left, see their variants and reads on the right'
  - name: 'Variants'
    icon: 'mdi:table'
    color: 'gray'
    description: 'Pick a variant to jump to it'

components:
  - tag: cov-intro
    index: cov-intro
    component_type: text
    section: 'About'
    title: 'Amplicon sequencing, read by range'
    order: 3
    alignment: left
    body: >
      The VCFs and BAMs stay in the public nf-core megatest bucket: the genome
      browser reads them by byte range through Depictio's API. The reference is a
      custom assembly (UCSC wuhCor1, aliased to MN908947.3). Pick samples in the
      scatter or the left panel to open their tracks; select a variant row to jump
      to it.
    layout: { x: 0, y: 0, w: 8, h: 2 }

  - tag: cov-scatter
    index: cov-scatter
    component_type: figure
    section: 'Genome browser'
    workflow_tag: python/genome_tracks_demo
    data_collection_tag: samples
    visu_type: scatter
    title: 'Coverage against variant load'
    description: 'Lasso samples to open their tracks.'
    title_size: h3
    dict_kwargs:
      x: coverage_median
      y: num_variants_total
      color: lineage
      log_x: true
      opacity: 0.85
      hover_data: ['sample', 'pct_genome_covered_10x']
    selection_enabled: true
    selection_column: sample
    layout: { x: 0, y: 0, w: 3, h: 8 }

  - tag: cov-browser
    index: cov-browser
    component_type: jbrowse
    section: 'Genome browser'
    workflow_tag: python/genome_tracks_demo
    data_collection_tag: tracks
    title: 'Variants and reads'
    description: 'iVar variant calls and primer-trimmed alignments, per sample'
    location: 'MN908947.3:21,500-25,400'
    max_tracks: 12
    initial_tracks: 4
    selection_enabled: true
    selection_column: sample
    preset: compact_amplicons
    # UCSC tracks of the wuhCor1 genome, resolved through the UCSC API: the ARTIC
    # V3 primers the megatest amplicons come from, and the Nextstrain clades.
    ucsc_tracks: [artic, nextstrainClade]
    locus_from:
      data_collection_tag: variants
      chrom_column: CHROM
      start_column: POS
      end_column: END
      padding: 150
      max_rows: 3
    config_overrides:
      # A gene track the collection does not ship, added from UCSC.
      extra_tracks:
        - type: FeatureTrack
          trackId: wuhCor1-genes
          name: NCBI genes
          category: [Annotation]
          adapter:
            type: BigBedAdapter
            bigBedLocation:
              uri: https://hgdownload.soe.ucsc.edu/gbdb/wuhCor1/ncbiGene.bb
              locationType: UriLocation
    layout: { x: 3, y: 0, w: 5, h: 8 }

  - tag: cov-table-variants
    index: cov-table-variants
    component_type: table
    section: 'Variants'
    workflow_tag: python/genome_tracks_demo
    data_collection_tag: variants
    title: 'Variant calls'
    description: 'Select a variant to jump to it and open the samples carrying it.'
    row_selection_enabled: true
    row_selection_column: mutation_label
    layout: { x: 0, y: 0, w: 8, h: 5 }

  - tag: cov-filter-lineage
    index: cov-filter-lineage
    component_type: interactive
    section: 'Samples'
    workflow_tag: python/genome_tracks_demo
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: lineage
    column_type: object
    title: 'Pangolin lineage'
    placement: left
    display: { title_size: md, icon_name: 'mdi:family-tree' }
    layout: { x: 0, y: 0, w: 1, h: 3 }
  - tag: cov-filter-sample
    index: cov-filter-sample
    component_type: interactive
    section: 'Samples'
    workflow_tag: python/genome_tracks_demo
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    title: 'Sample'
    placement: left
    display: { title_size: md, icon_name: 'mdi:test-tube' }
    layout: { x: 0, y: 3, w: 1, h: 3 }
