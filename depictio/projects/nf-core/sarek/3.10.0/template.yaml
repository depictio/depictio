          - "NA12878_200M.deepvariant_VEP.ann"
          - "NA12878_200M.freebayes.filtered"
          - "NA12878_200M.freebayes.filtered_snpEff"
          - "NA12878_200M.freebayes.filtered_VEP.ann"
          - "NA12878_200M.haplotypecaller.filtered"
