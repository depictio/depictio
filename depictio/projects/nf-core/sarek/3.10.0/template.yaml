          - "NA12878_200M.haplotypecaller.filtered_VEP.ann"
          - "NA12878_200M.manta.diploid_sv"
          - "NA12878_200M.manta.diploid_sv_snpEff"
          - "NA12878_200M.manta.diploid_sv_VEP.ann"
          - "NA12878_200M.strelka.variants"
          - "NA12878_200M.strelka.variants_snpEff"
          - "NA12878_200M.strelka.variants_VEP.ann"
