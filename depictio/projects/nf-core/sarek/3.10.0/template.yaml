    enabled: true

  # ----------------------------------------------------------------
  # Cohort QC locus section. The navigator (a genome_view on
  # mosdepth_windows) emits a chromosome and a position filter on its own
  # `chrom` / `pos` columns; these carry that pair to the two collections
  # stacked under it, so the per-target depth and the calls narrow to the same
  # region. No data is read to resolve them (resolver: region). All three name
  # their coordinates chrom / pos, which is also what lets the followers zoom
  # on the region client side. The file-backed VCF track needs no link: it
  # follows the region filter itself and reads only the window in view.

  #
  # No second (value) link may join mosdepth_windows to mosdepth_targets or
  # vcf_variants: the link resolver finds a link by its source and target
  # collections, so a direct link on the same pair is answered with the region
  # link and fails ("Unknown resolver type: region", SK-D15). The stage picker
  # that needed one is gone: the coverage recipes keep one mosdepth pass.
  # ----------------------------------------------------------------
  - source_dc_tag: "mosdepth_windows"
    source_column: "chrom"
    target_dc_tag: "mosdepth_targets"
    target_type: "table"
    link_config:
      resolver: "region"
      columns: {chrom: "chrom", pos: "pos"}
    description: "A region typed or brushed on the depth navigator narrows the per-target depth track"
    enabled: true

  - source_dc_tag: "mosdepth_windows"
    source_column: "chrom"
    target_dc_tag: "vcf_variants"
    target_type: "table"
    link_config:
      resolver: "region"
      columns: {chrom: "chrom", pos: "pos"}
    description: "A region typed or brushed on the depth navigator narrows the calls track"
    enabled: true

  - source_dc_tag: "samples"
    source_column: "sample_id"
    target_dc_tag: "mosdepth_windows"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the depth navigator by the samples picked in the left panel"
    enabled: true

  - source_dc_tag: "samples"
    source_column: "sample_id"
    target_dc_tag: "mosdepth_targets"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the per-target depth track by the samples picked in the left panel"
    enabled: true

