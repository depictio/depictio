- title: Copy number & MSI
  subtitle: Which regions gained or lost copies, and is the tumour unstable?
  tab_group: Somatic
  tab_order: 8
  tab_icon: mdi:chart-timeline-variant
  tab_icon_color: green
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Copy-number filters
    icon: mdi:filter-variant
    color: green
    description: The contigs and calling design of the genome views, the profile and the tables
  grid_sections:
  - name: Copy number at a glance
    icon: mdi:counter
    color: green
    description: How much of the genome is gained or lost, and the MSI score, per sample
  - name: Genome-wide gains and losses
    icon: mdi:chart-timeline-variant
    color: green
    description: Every called segment along the genome, one row per sample, with the gain and loss cut-offs
  - name: One tumour in detail
    icon: mdi:microscope
    color: green
    description: The bins and called segments of one sample, with a switch to zoom on a chromosome
  - name: Chromosome by chromosome
    icon: mdi:dna
    color: green
    description: Mean log2 ratio of each chromosome, per sample
  - name: Per tumour, altered genome and MSI
    icon: mdi:chart-bar
    color: green
    description: The share of the genome altered, and the MSI score against its usual cut-off
  - name: Tables
    icon: mdi:table
    color: gray
    description: The MSIsensor-pro summary, and one row per called segment with the bins behind it
    collapsed: true
  components:
  - component_type: text
    surface: card
    accent: green
    body: |
      ### How to read this tab
      - ![](icon:mdi:chart-timeline-variant) **log2 ratio** The coverage of a region in the tumour against the reference, on a log scale. 0 is balanced (two copies), +0.58 is about three copies, -1 about one copy.
      - ![](icon:mdi:arrow-up-bold-outline) **Gain** A called segment above +0.3, drawn in orange. The dashed line of the figures marks the cut-off.
      - ![](icon:mdi:arrow-down-bold-outline) **Loss** A called segment below -0.3, drawn in blue. The dashed line of the figures marks the cut-off.
      - ![](icon:mdi:percent-outline) **Genome altered** The megabases in gained or lost segments over the megabases [CNVkit](https://cnvkit.readthedocs.io) called.
      - ![](icon:mdi:barcode) **MSI score** The share of microsatellite sites whose length differs between a tumour and its matched normal ([MSIsensor-pro](https://github.com/xjtu-omics/msisensor-pro)). A tumour called without a normal has none.
    tag: sk-cn-intro
    index: cn-intro
    layout: {x: 0, y: 0, w: 5, h: 4}
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Where to look
      ::: steps
      1. ![](icon:mdi:counter) **Key figures** summarise the samples in view
      2. ![](icon:mdi:chart-timeline-variant) **Genome-wide** shows where the gains and losses sit
      3. ![](icon:mdi:magnify-scan) **One tumour** opens the bins and segments of a sample
      4. ![](icon:mdi:grid) **Chromosomes** compares the samples on one grid
      5. ![](icon:mdi:barcode) **MSI** ranks the tumours against the usual 20% cut-off
      :::
    tag: sk-cn-steps
    index: cn-steps
    layout: {x: 5, y: 0, w: 3, h: 4}
