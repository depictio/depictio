    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    interactive_component_type: MultiSelect
    column_name: consequence
    column_type: object
    display:
      icon_name: mdi:tag-outline
      custom_color: grape
      strip_label: Consequence
    section: Impact per call
    tag: sk-cs-filter-consequence
    index: cs-consequence-filter
    title: Consequence
    layout: {x: 2, y: 0, w: 2, h: 1}
  # MODIFIER calls (intergenic, intronic) are left out: they would fill every
  # bar. Aggregated before plotting, so the browser gets a few rows per caller.
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    use: snpeff/ann_variants
    visu_type: bar
    mode: code
    code_content: |-
      # Share of each caller's coding calls per impact class, in the family colours.
      order = ['HIGH', 'MODERATE', 'LOW']
      d = df.filter(pl.col('impact').is_in(order)).group_by(['caller', 'impact']).agg(pl.len().alias('calls'))
      d = d.with_columns((pl.col('calls') / pl.col('calls').sum().over('caller') * 100).alias('share')).sort('caller')
      fig = px.bar(d.to_pandas(), x='caller', y='share', color='impact', color_discrete_map=depictio_category_colors.get('impact') or {}, category_orders={'impact': order}, labels={'caller': '', 'share': 'Share of coding calls (%)', 'impact': 'Impact class'})
      fig.update_layout(margin=dict(t=10))
    section: Impact per call
    tag: sk-cs-fig-impact-share
    index: cs-impact-by-caller
    title: Impact classes per caller
    description: HIGH, MODERATE and LOW calls as shares of each caller's coding calls. MODIFIER calls (intergenic, intronic) are left out, they would fill every bar.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    visu_type: box
    mode: code
    code_content: |-
      # Allele fraction of every annotated call per impact class: the box spans the middle half, the whiskers the 5th to the 95th percentile. Summarised before plotting, so the browser gets four rows.
      order = ['HIGH', 'MODERATE', 'LOW', 'MODIFIER']
      colors = depictio_category_colors.get('impact') or {}
      stats = df.filter(pl.col('impact').is_in(order) & pl.col('vaf').is_not_null()).group_by('impact').agg(pl.col('vaf').quantile(0.05).alias('lo'), pl.col('vaf').quantile(0.25).alias('q1'), pl.col('vaf').median().alias('med'), pl.col('vaf').quantile(0.75).alias('q3'), pl.col('vaf').quantile(0.95).alias('hi'), pl.len().alias('n'))
      rows = {r['impact']: r for r in stats.iter_rows(named=True)}
      boxes = [go.Box(x=[k], q1=[rows[k]['q1']], median=[rows[k]['med']], q3=[rows[k]['q3']], lowerfence=[rows[k]['lo']], upperfence=[rows[k]['hi']], name=k, marker_color=colors.get(k), customdata=[[rows[k]['n']]], hovertemplate='%{x}<br>median %{median:.2f}<br>%{customdata[0]:,} calls<extra></extra>', showlegend=False) for k in order if k in rows]
      fig = go.Figure(boxes)
      fig.update_layout(margin=dict(t=10), yaxis_title='Variant allele fraction', xaxis_title='')
    section: Impact per call
    tag: sk-cs-fig-impact-vaf
    index: cs-impact-vaf
    title: Allele fraction per impact class
    description: Heterozygous calls band near 0.5 and homozygous ones near 1; a class that sits lower than
      the rest carries more doubtful calls.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: table
    workflow_tag: sarek
    data_collection_tag: snpeff_csv_stats
    use: snpeff/csv_stats
    row_selection_enabled: true
    row_selection_column: caller
    section: Consequence tables
    tag: sk-cs-table-sections
    index: cs-table-sections
    title: SnpEff summary sections
    description: One row per sample, caller, section and class, with its count and share.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    use: snpeff/ann_variants
    row_selection_enabled: true
    row_selection_column: variant_key
    section: Consequence tables
    tag: sk-cs-table-calls
    index: cs-table-calls
    title: Annotated variant calls
    description: Locus, allele, depth, allele fraction, gene, impact, consequence and protein change. Select a row to open its record.
    layout: {x: 0, y: 6, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: sk-cs-table-calls
      id_col: variant_key
      title_col: gene
      selection_source: table_selection
      sections:
        Locus: [chrom, pos, ref, alt, variant_type]
        Call: [sample, caller, filter_status, gt, qual, dp, vaf]
        Consequence: [gene, gene_id, impact, consequence, hgvs_p, aa_pos]
      link_templates:
        gene_id: "https://www.ensembl.org/id/{value}"
    section: Consequence tables
    tag: sk-cs-av-record
    index: cs-variant-record
    title: Variant record
    description: The picked call, one card per callset that made it. Empty until a call is picked.
    layout: {x: 5, y: 6, w: 3, h: 6}
# The gene-level view, from SnpEff's per-gene table and from the protein
