    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: cnv_segments
    visu_type: line
    mode: code
    code_content: |-
      # Called segments along the genome, one row per sample: height is the log2 ratio, red above 0.3 (gain), blue below -0.3 (loss), grey in between. Chromosomes in karyotype order, alternate ones shaded; the dashed lines are the cut-offs.
      key = pl.col('chrom').str.replace('^chr', '')
      rank = pl.when(key.str.contains('^[0-9]+$')).then(key.cast(pl.Int64, strict=False)).when(key == 'X').then(23).when(key == 'Y').then(24).when(key.is_in(['M', 'MT'])).then(25).otherwise(100)
      seg = df.filter(pl.col('segment') == 'segment').with_columns(key.alias('c'), rank.alias('r'), pl.when(pl.col('unit_type') == 'paired').then(0).when(pl.col('unit_type') == 'tumour_only').then(1).otherwise(2).alias('u')).with_row_index('sid')
      chroms = seg.group_by('c').agg(pl.col('r').first(), (pl.col('end').max() / 1e6).alias('len')).sort(['r', 'c']).with_columns((pl.col('len').cum_sum() - pl.col('len')).alias('off')).with_columns((pl.col('off') + pl.col('len')).alias('stop'), (pl.col('off') + pl.col('len') / 2).alias('mid'))
      seg = seg.join(chroms.select('c', 'off'), on='c').with_columns((pl.col('off') + pl.col('start') / 1e6).alias('x0'), (pl.col('off') + pl.col('end') / 1e6).alias('x1'), pl.when(pl.col('log2') > 0.3).then(pl.lit('Gain')).when(pl.col('log2') < -0.3).then(pl.lit('Loss')).otherwise(pl.lit('Neutral')).alias('state'))
      seg = seg.with_columns(pl.format('chr{}:{}-{} Mb, log2 {}, copy number {}', pl.col('c'), (pl.col('start') / 1e6).round(1), (pl.col('end') / 1e6).round(1), pl.col('log2').round(2), pl.col('copy_number')).alias('tip'))
      base = seg.select('sid', 'sample', 'u', 'state', 'log2', 'tip')
      poly = pl.concat([base.with_columns(seg['x0'].alias('x'), pl.lit(0.0).alias('y'), pl.lit(0).alias('k')), base.with_columns(seg['x0'].alias('x'), pl.col('log2').alias('y'), pl.lit(1).alias('k')), base.with_columns(((seg['x0'] + seg['x1']) / 2).alias('x'), pl.col('log2').alias('y'), pl.lit(2).alias('k')), base.with_columns(seg['x1'].alias('x'), pl.col('log2').alias('y'), pl.lit(3).alias('k')), base.with_columns(seg['x1'].alias('x'), pl.lit(0.0).alias('y'), pl.lit(4).alias('k')), base.with_columns(seg['x0'].alias('x'), pl.lit(0.0).alias('y'), pl.lit(5).alias('k')), base.with_columns(pl.lit(None, dtype=pl.Float64).alias('x'), pl.lit(None, dtype=pl.Float64).alias('y'), pl.lit(6).alias('k'))]).sort(['u', 'sample', 'state', 'sid', 'k'])
      steps = poly
      samples = steps.sort(['u', 'sample'])['sample'].unique(maintain_order=True).to_list()
      names = chroms['c'].to_list()
      starts = chroms['off'].to_list()
      stops = chroms['stop'].to_list()
      mids = chroms['mid'].to_list()
      amax = seg['log2'].abs().max()
      ymax = max(1.0, round(float(amax) + 0.25, 1))
      colors = depictio_category_colors.get('cn_state') or {}
      fig = px.line(steps.to_pandas(), x='x', y='y', color='state', facet_row='sample', custom_data=['tip'], category_orders={'sample': samples, 'state': ['Loss', 'Neutral', 'Gain']}, color_discrete_map={'Gain': colors.get('Gain', '#e8590c'), 'Loss': colors.get('Loss', '#1c7ed6'), 'Neutral': '#adb5bd'}, labels={'x': 'Genome position, chromosomes in karyotype order (Mb)', 'y': 'log2 ratio', 'state': 'Segment', 'sample': 'Sample'})
      fig.update_traces(fill='toself', line_width=1, hovertemplate='%{customdata[0]}<extra></extra>')
      for i in range(len(names)):
          if i % 2 == 0:
              fig.add_vrect(x0=starts[i], x1=stops[i], row='all', col='all', fillcolor='#868e96', opacity=0.08, line_width=0, layer='below')
      fig.update_xaxes(tickmode='array', tickvals=mids, ticktext=names, range=[0, stops[-1]], showgrid=False, tickfont_size=10)
      fig.update_yaxes(range=[-ymax, ymax], zeroline=True, zerolinecolor='#868e96', showgrid=False, title_font_size=11)
      fig.add_hline(y=0.3, line_dash='dash', line_width=1, line_color=colors.get('Gain', '#e8590c'), row='all', col='all', annotation_text='gain above 0.3', annotation_position='top left', annotation_font_size=10, annotation_font_color=colors.get('Gain', '#e8590c'))
      fig.add_hline(y=-0.3, line_dash='dash', line_width=1, line_color=colors.get('Loss', '#1c7ed6'), row='all', col='all', annotation_text='loss below -0.3', annotation_position='bottom left', annotation_font_size=10, annotation_font_color=colors.get('Loss', '#1c7ed6'))
      fig.for_each_annotation(lambda a: a.update(text=a.text.split('=')[-1]) if '=' in a.text else None)
      fig.update_layout(margin=dict(t=30, r=10), legend=dict(orientation='h', y=1.08, x=0, title_text=''))
    section: Genome-wide gains and losses
    tag: sk-cn-fig-genome
    index: cn-genome
    title: Gains and losses along the genome
    description: Each block is a called segment, as high as its log2 ratio. Orange above the 0.3 cut-off is a gain, blue below -0.3 is a loss, grey is balanced. Chromosomes follow the karyotype order and alternate in shade. One row per sample; narrow the samples or the contigs to read a row larger.
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: advanced_viz
    workflow_tag: sarek
    data_collection_tag: cnv_segments
    viz_kind: cnv_profile
    config:
      viz_kind: cnv_profile
      sample_col: sample
      chrom_col: chrom
      start_col: start
      end_col: end
      log2_col: log2
      baf_col: baf
      copy_number_col: copy_number
      segment_col: segment
      label_col: label
      annotation: '{GENOME}'
      # The template has a genome browser (Locus), so the profile stays on Plotly.
      view: plotly
      views: [plotly]
      show_baf: false
      facet_by_sample: false
      y_range: 2.5
      point_size: 4
      gain_threshold: 0.3
      loss_threshold: -0.3
    section: One tumour in detail
    tag: sk-cn-av-profile
    index: cn-profile
    title: Copy-number profile of one sample
    description: Each dot is a bin's log2 ratio against the reference and the strokes are CNVkit's called segments, red above 0.3 and blue below -0.3. Pick the sample and a chromosome to zoom on in the controls; the profile opens on a tumour. CNVkit gives no B-allele frequency here, so none is drawn. Open in genome browser shows the reads at the region.
    layout: {x: 0, y: 0, w: 8, h: 9}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: cnv_segments
    visu_type: heatmap
    mode: code
    code_content: |-
      # Length-weighted mean log2 ratio of the called segments, one cell per sample and chromosome: red where the chromosome is gained, blue where it is lost, white where it is balanced. The number is printed in the cells past the 0.3 cut-offs.
      key = pl.col('chrom').str.replace('^chr', '')
      rank = pl.when(key.str.contains('^[0-9]+$')).then(key.cast(pl.Int64, strict=False)).when(key == 'X').then(23).when(key == 'Y').then(24).when(key.is_in(['M', 'MT'])).then(25).otherwise(100)
      seg = df.filter(pl.col('segment') == 'segment').with_columns(key.alias('c'), rank.alias('r'), ((pl.col('end') - pl.col('start')) / 1e6).alias('mb'), pl.when(pl.col('unit_type') == 'paired').then(0).when(pl.col('unit_type') == 'tumour_only').then(1).otherwise(2).alias('u'))
      cell = seg.group_by(['u', 'sample', 'c', 'r']).agg(((pl.col('log2') * pl.col('mb')).sum() / pl.col('mb').sum()).alias('v')).with_columns(pl.when(pl.col('v').abs() >= 0.3).then(pl.col('v').map_elements(lambda x: f'{x:+.2f}', return_dtype=pl.Utf8)).otherwise(pl.lit('')).alias('t'))
      samples = cell.sort(['u', 'sample'])['sample'].unique(maintain_order=True).to_list()
      chroms = cell.sort(['r', 'c'])['c'].unique(maintain_order=True).to_list()
      wide = cell.pivot(on='c', index='sample', values='v').with_columns(pl.col('sample').cast(pl.Utf8))
      words = cell.pivot(on='c', index='sample', values='t')
      grid = pl.DataFrame({'sample': samples}).join(wide, on='sample', how='left').select(['sample'] + chroms)
      text = pl.DataFrame({'sample': samples}).join(words, on='sample', how='left').select(['sample'] + chroms)
      gain = depictio_category_colors.get('cn_state', {}).get('Gain', '#e8590c')
      loss = depictio_category_colors.get('cn_state', {}).get('Loss', '#1c7ed6')
      fig = go.Figure(go.Heatmap(z=grid.drop('sample').rows(), x=chroms, y=samples, text=text.drop('sample').fill_null('').rows(), texttemplate='%{text}', textfont=dict(size=10), colorscale=[[0, loss], [0.5, '#f8f9fa'], [1, gain]], zmin=-1.0, zmax=1.0, zmid=0, xgap=2, ygap=2, hovertemplate='Sample %{y}<br>Chromosome %{x}<br>Mean log2 %{z:.2f}<extra></extra>', colorbar=dict(title='Mean log2', thickness=12, len=0.9)))
      fig.update_yaxes(autorange='reversed', title_text='', automargin=True)
      fig.update_xaxes(title_text='Chromosome', type='category', side='bottom')
      fig.update_layout(margin=dict(t=10, r=10))
    section: Chromosome by chromosome
    tag: sk-cn-fig-heatmap
    index: cn-heatmap
    title: Mean log2 ratio per chromosome
    description: Length-weighted mean log2 ratio of the called segments of each chromosome, one row per sample. Orange is gained, blue is lost, white is balanced; the value is printed where it passes the 0.3 cut-offs. A chromosome with no called segment is left empty.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: cnv_summary
    visu_type: bar
    mode: code
    code_content: |-
      # Share of the called genome that is gained (red) or lost (blue) in each sample, the fraction of the genome altered, largest first. A segment counts when its log2 ratio is above 0.3 or below -0.3.
      d = df.filter(pl.col('fga_pct').is_not_null()).sort('fga_pct', descending=True).with_columns(pl.col('fga_pct').round(1).cast(pl.Utf8).alias('total'))
      samples = d['sample'].to_list()
      totals = d['fga_pct'].to_list()
      labels = d['total'].to_list()
      long = d.select('sample', pl.col('gained_pct').alias('Gain'), pl.col('lost_pct').alias('Loss'), 'gained_mb', 'lost_mb', 'covered_mb').unpivot(['Gain', 'Loss'], index=['sample', 'gained_mb', 'lost_mb', 'covered_mb'], variable_name='state', value_name='pct').with_columns(pl.when(pl.col('state') == 'Gain').then(pl.col('gained_mb')).otherwise(pl.col('lost_mb')).round(1).alias('mb'))
      colors = depictio_category_colors.get('cn_state') or {}
      top = min(118.0, max(10.0, max(totals) * 1.3))
      fig = px.bar(long.to_pandas(), x='pct', y='sample', color='state', orientation='h', barmode='stack', custom_data=['mb', 'covered_mb'], category_orders={'sample': samples, 'state': ['Gain', 'Loss']}, color_discrete_map={'Gain': colors.get('Gain', '#e8590c'), 'Loss': colors.get('Loss', '#1c7ed6')}, labels={'pct': 'Fraction of the genome altered (% of called Mb)', 'sample': '', 'state': 'Segment'})
      fig.update_traces(hovertemplate='%{y}: %{x:.1f}% of the called genome<br>%{customdata[0]} Mb of %{customdata[1]:.0f} Mb called<extra>%{fullData.name}</extra>')
      fig.add_trace(go.Scatter(x=totals, y=samples, mode='text', text=labels, texttemplate='%{text}%', textposition='middle right', showlegend=False, hoverinfo='skip', textfont=dict(size=12)))
      fig.update_yaxes(automargin=True)
      fig.update_xaxes(range=[0, top], ticksuffix='%')
      fig.update_layout(margin=dict(t=10, r=10), legend=dict(orientation='h', y=1.12, x=0, title_text=''))
    section: Per tumour, altered genome and MSI
    tag: sk-cn-fig-fga
    index: cn-fga
    title: Fraction of the genome altered
    description: Share of the called genome that is gained (orange) or lost (blue), largest first, with the total at the end of the bar. A segment counts when its log2 ratio is past the 0.3 or -0.3 cut-off. Hover a bar for the megabases behind it.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: msi
    visu_type: bar
    mode: code
    code_content: |-
      # MSIsensor-pro score of each tumour: the share of tested microsatellite sites whose length differs from the normal, largest first. The dashed line is the 20% usual cut-off, drawn for reference.
      cut = 20.0
      d = df.filter(pl.col('msi_score').is_not_null()).sort('msi_score', descending=True).with_columns(pl.when(pl.col('msi_score') >= 20.0).then(pl.lit('At or above 20%')).otherwise(pl.lit('Below 20%')).alias('band'), pl.format(' {}% ({} of {} sites)', pl.col('msi_score').round(1), pl.col('unstable_sites'), pl.col('total_sites')).alias('lab'))
      samples = d['sample'].to_list()
      scores = d['msi_score'].to_list()
      labels = d['lab'].to_list()
      top = max(30.0, max(scores) * 2.0)
      fig = px.bar(d.to_pandas(), x='msi_score', y='sample', color='band', orientation='h', category_orders={'sample': samples, 'band': ['Below 20%', 'At or above 20%']}, color_discrete_map={'Below 20%': '#69db7c', 'At or above 20%': '#2b8a3e'}, custom_data=['unstable_sites', 'total_sites'], labels={'msi_score': 'Unstable microsatellite sites (%)', 'sample': '', 'band': 'MSIsensor-pro score'})
      fig.update_traces(hovertemplate='%{y}: %{x:.2f}% unstable<br>%{customdata[0]} of %{customdata[1]} sites<extra></extra>')
      fig.add_trace(go.Scatter(x=scores, y=samples, mode='text', text=labels, textposition='middle right', showlegend=False, hoverinfo='skip', textfont=dict(size=12)))
      fig.add_vrect(x0=cut, x1=top, fillcolor='#2b8a3e', opacity=0.07, line_width=0, layer='below')
      fig.add_vline(x=cut, line_dash='dash', line_width=1.5, line_color='#2b8a3e', annotation_text='usual cut-off: 20%', annotation_position='top', annotation_font_size=11, annotation_font_color='#2b8a3e')
      fig.update_yaxes(automargin=True)
      fig.update_xaxes(range=[0, top], ticksuffix='%')
      fig.update_layout(margin=dict(t=30, r=10), legend=dict(orientation='h', y=-0.35, x=0, title_text=''))
    section: Per tumour, altered genome and MSI
    tag: sk-cn-fig-msi
    index: cn-msi
    title: MSI score per tumour
    description: Unstable microsatellite sites as a share of the sites tested, largest first, with the counts beside each bar. The dashed line is 20%, the cut-off MSIsensor-pro users most often apply; it is a convention, not a call, and the right value depends on the assay. A score over a handful of sites is noisy.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: table
    workflow_tag: sarek
    data_collection_tag: msi
    columns: [unit, unit_type, patient, sample, normal, total_sites, unstable_sites, msi_score]
    section: Tables
    tag: sk-cn-table-msi
    index: cn-table-msi
    title: MSIsensor-pro summary
    description: One row per tumour and its normal. A tumour with few tested sites gives a noisy score; read the sites beside it.
    layout: {x: 0, y: 0, w: 8, h: 3}
  - component_type: table
    workflow_tag: sarek
    data_collection_tag: cnv_segments
    columns: [unit, unit_type, sample, chrom, start, end, segment, log2, copy_number, depth, label, call_source]
    section: Tables
    tag: sk-cn-table-segments
    index: cn-table-segments
    title: Copy-number segments and bins
    description: Locus, log2 ratio, copy number and read depth of each segment (and of the bins behind it), as CNVkit wrote them.
    layout: {x: 0, y: 3, w: 8, h: 6}
- title: Germline vs somatic
  subtitle: Are the somatic calls really absent from the normal, and what did the tumour lose?
  tab_group: Somatic
  tab_order: 9
  tab_icon: mdi:compare-horizontal
  tab_icon_color: gray
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Comparison filters
    icon: mdi:filter-variant
    color: gray
    description: The caller and overlap of the call table, the normal's reads and the allele state of the sites
  grid_sections:
  - name: Comparison at a glance
    icon: mdi:counter
    color: gray
    description: The normal's germline variants, the somatic ones and what the normal and the tumour hold of each
  - name: Is it really somatic
    icon: mdi:chart-scatter-plot
    color: gray
    description: Each somatic variant by its allele fraction in the normal and in the tumour
  - name: What the tumour lost
    icon: mdi:chart-timeline-variant
    color: gray
    description: The tumour's allele fraction at the sites where the normal is heterozygous, along the genome
  - name: Comparison table
    icon: mdi:table
    color: gray
    description: One row per somatic call of a pair, with the normal's allele fraction and the overlap
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      The normal is the reference a somatic caller subtracts, so the two must be read together. First
      the check that matters most: a true somatic variant has reads in the tumour and none in the
      normal. Then the reverse question, on the normal's own variants: the sites where the patient is
      heterozygous show, in the tumour, which parental copy of a region was lost. Pick a patient in the
      sample filters to see one pair, and click a row of the table to see the tumour and the normal
      together in the Locus tab.
    tag: sk-gs-intro
    index: gs-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: somatic_vs_germline
    interactive_component_type: MultiSelect
    column_name: origin
    column_type: object
    display:
      icon_name: mdi:set-merge
      custom_color: orange
    section: Comparison filters
    tag: sk-gs-filter-origin
    index: gs-origin-filter
    title: Overlap with the normal
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: somatic_vs_germline
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: indigo
    section: Comparison filters
    tag: sk-gs-filter-caller
    index: gs-caller-filter
    title: Caller
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: somatic_variants
    interactive_component_type: MultiSelect
    column_name: normal_class
    column_type: object
    display:
      icon_name: mdi:account-outline
      custom_color: red
    section: Comparison filters
    tag: sk-gs-filter-normal
    index: gs-normal-filter
    title: Reads in the normal
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: germline_het_sites
    interactive_component_type: MultiSelect
    column_name: allele_state
    column_type: object
    display:
      icon_name: mdi:chart-timeline-variant
      custom_color: gray
    section: Comparison filters
    tag: sk-gs-filter-state
    index: gs-state-filter
    title: Allele state in the tumour
    layout: {x: 0, y: 9, w: 1, h: 3}
  # At a glance
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: patient_call_counts
    aggregation: sum
    column_name: variants
    column_type: int64
    secondary_layout: composition
    breakdown_col: call_class
    display:
      icon_name: mdi:set-all
      icon_color: gray.4
      caption: distinct PASS variants, by class
      format: si
    section: Comparison at a glance
    tag: sk-gs-card-variants
    index: gs-card-variants
    title: PASS variants
    description: Distinct PASS variants of the normals' germline calls and of the pairs' somatic calls, a variant several callers agree on counted once. The germline class is the larger by orders of magnitude, which is why a leak of even a small share of it matters.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: somatic_variants
    aggregation: count
    column_name: variant_key
    column_type: object
    secondary_layout: composition
    breakdown_col: normal_class
    display:
      icon_name: mdi:account-check-outline
      icon_color: gray.6
      caption: somatic variants, by reads in the normal
      format: si
    section: Comparison at a glance
    tag: sk-gs-card-clean
    index: gs-card-clean
    title: Somatic variants
    description: Distinct somatic variants of the pairs in view. The bar splits them by the allele fraction in the normal, Clean under 0.03, Trace from 0.03 to 0.10 and Germline-like from 0.10; nearly all should be clean.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: somatic_variants
    aggregation: count
    column_name: variant_key
    column_type: object
    filter_expr: "col('in_germline') == True"
    secondary_layout: composition
    breakdown_col: support
    display:
      icon_name: mdi:account-alert-outline
      icon_color: gray.8
      caption: also PASS germline calls of the normal
      format: si
    section: Comparison at a glance
    tag: sk-gs-card-inherited
    index: gs-card-inherited
    title: Inherited look-alikes
    description: "Somatic variants that a PASS germline call of the normal also holds: inherited variants the somatic callers failed to subtract. The bar splits them by the number of somatic callers that kept them."
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: germline_het_sites
    aggregation: count
    column_name: variant_key
    column_type: object
    secondary_layout: composition
    breakdown_col: allele_state
    display:
      icon_name: mdi:chart-timeline-variant
      icon_color: gray.9
      caption: heterozygous sites, by what the tumour kept
      format: si
    section: Comparison at a glance
    tag: sk-gs-card-loh
    index: gs-card-loh
    title: Heterozygous sites
    description: The normal's heterozygous germline SNVs (depth 10 or more in both samples) read in the tumour. The bar splits them into balanced (both copies kept), imbalanced and LOH-like (one parental allele nearly gone).
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Is it really somatic
  - component_type: text
    body: >
      **Look at** each somatic variant by its allele fraction in the normal (left to right) and in the
      tumour (bottom to top). **Expect** nearly all points at the far left, in the upper-left zone:
      reads in the tumour and none in the normal. **Worry if** points sit right of the vertical line
      (0.03): a variant that the normal carries is either inherited (orange, also in the normal's germline
      calls, and near 0.5 in both samples) or a sign of tumour cells in the normal, which shows as a
      diffuse fan of low normal fractions growing with the tumour's. A caller that subtracts the
      normal badly puts its calls there.
    section: Is it really somatic
    tag: sk-gs-text-somatic
    index: gs-text-somatic
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    workflow_tag: sarek
    data_collection_tag: somatic_variants
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: normal_vaf
      y_col: tumour_vaf
      label_col: variant_key
      color_col: origin
      x_title: Allele fraction in the normal
      y_title: Allele fraction in the tumour
      reference_line: diagonal
      quadrants:
        x: 0.03
        y: 0.1
        labels: [Somatic, Reads in both samples, Faint in both, Normal more than tumour]
      marker_size: 5
      opacity: 0.55
      marker_outline: false
      legend_pos: bottom
    section: Is it really somatic
    tag: sk-gs-av-scatter
    index: gs-vaf-scatter
    title: Tumour against normal allele fraction
    description: Each point is a distinct somatic variant. Upper left, 0.03 or less in the normal and above 0.10 in the tumour, is where a true somatic variant sits; right of the vertical line the normal carries it. The colour says whether the normal's germline calls hold the same variant, and the diagonal is equal fractions.
    layout: {x: 0, y: 1, w: 5, h: 6}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: somatic_variants
    visu_type: bar
    mode: code
    code_content: |-
      # Somatic variants by their allele fraction in the normal, in bins of 0.01 up to 0.5 (a higher fraction goes in the last bin), on a log axis so the few variants the normal carries stay visible beside the many it does not. The dotted lines are the 0.03 and 0.10 cut-offs of the classes.
      b = df.filter(pl.col('normal_vaf').is_not_null()).with_columns((pl.col('normal_vaf').clip(0, 0.499) / 0.01).floor().cast(pl.Int64).alias('bin'))
      g = b.group_by(['bin', 'normal_class']).agg(pl.len().alias('variants')).with_columns((pl.col('bin') * 0.01 + 0.005).alias('x'))
      fig = px.bar(g.sort('bin').to_pandas(), x='x', y='variants', color='normal_class', orientation='v', log_y=True, category_orders={'normal_class': ['Clean in the normal', 'Trace in the normal', 'Germline-like in the normal']}, color_discrete_map=depictio_category_colors.get('normal_class') or {}, labels={'x': 'Allele fraction in the normal', 'variants': 'Variants (log scale)', 'normal_class': 'Normal'})
      fig.update_traces(width=0.0095)
      fig.add_vline(x=0.03, line_dash='dot', line_color='#868e96')
      fig.add_vline(x=0.10, line_dash='dot', line_color='#868e96')
      fig.update_xaxes(range=[0, 0.5])
      fig.update_layout(margin=dict(t=10), bargap=0, legend=dict(orientation='h', y=1.12, x=0, title_text=''))
    section: Is it really somatic
    tag: sk-gs-fig-normal
    index: gs-normal-hist
    title: Allele fraction in the normal
    description: Distinct somatic variants per normal allele fraction, log scale. A true somatic callset is a tall bar at 0 and a short, flat tail; a second bump near 0.5 is inherited variants.
    layout: {x: 5, y: 1, w: 3, h: 6}
  - component_type: advanced_viz
    workflow_tag: sarek
    data_collection_tag: somatic_variants
    viz_kind: ranked_table
    config:
      viz_kind: ranked_table
      title_col: variant_key
      score_col: normal_vaf
      columns:
      - {column: origin, label: Overlap, display: badge}
      - {column: callers, label: Callers, display: text}
      - {column: normal_vaf, label: Normal AF, display: bar, decimals: 2, min: 0, max: 1}
      - {column: tumour_vaf, label: Tumour AF, display: bar, decimals: 2, min: 0, max: 1}
      - {column: normal_dp, label: Normal depth, display: number, decimals: 0}
      labels:
        gene: Gene
        impact: Impact
        germline_callers: Germline callers
        tumour_dp: Tumour depth
      popover_columns: [gene, impact, germline_callers, tumour_dp]
      filter_col: normal_class
      filter_values: [Trace in the normal, Germline-like in the normal]
      top_n: 15
      compact: true
    section: Is it really somatic
    tag: sk-gs-av-doubt
    index: gs-doubt-ranked
    title: Somatic calls the normal also carries
    description: The somatic variants with the highest allele fraction in the normal, the worst first. A variant the normal's germline calls also hold (orange) is inherited; one with a modest normal fraction and no germline call points at contamination.
    layout: {x: 0, y: 7, w: 8, h: 7}
  # What the tumour lost
  - component_type: text
    body: >
      **Look at** the tumour's allele fraction at the sites where the normal is heterozygous (a fraction
      near 0.5 in the normal). **Expect** a flat band at 0.5 on chromosomes where the tumour kept both
      copies; where it lost one parental copy (loss of heterozygosity, LOH) the band splits into two,
      near 0 and near 1, and a gained copy splits it near 0.33 and 0.67. A tumour that is not fully
      pure keeps the split bands off 0 and 1. **Worry if** the loss is on every chromosome of a sample
      whose copy-number profile is flat: a tumour and a normal that do not come from the same person
      read like that, so check the sample match in the MultiQC tab. Compare with
      [Copy number & MSI](tab:Copy number & MSI): a deletion explains LOH with a loss, otherwise it is
      copy-neutral.
    section: What the tumour lost
    tag: sk-gs-text-loh
    index: gs-text-loh
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: germline_het_sites
    visu_type: scatter
    mode: code
    code_content: |-
      # The tumour's allele fraction at the normal's heterozygous SNVs along the genome, chromosomes in karyotype order and shaded in turn, one dot per site. Grey sits near 0.5 (both copies), orange is imbalanced and red is LOH-like (under 0.15 or over 0.85). Chromosome lengths are the last site seen on each, so the axis is an approximation of the genome.
      d = df.select(['chrom', 'chrom_rank', 'pos', 'tumour_vaf', 'allele_state'])
      sizes = d.group_by(['chrom_rank', 'chrom']).agg(pl.col('pos').max().alias('end')).sort('chrom_rank').with_columns((pl.col('end').cum_sum() - pl.col('end')).alias('off'))
      d = d.join(sizes.select(['chrom', 'off']), on='chrom').with_columns(((pl.col('pos') + pl.col('off')) / 1e6).alias('x'))
      fig = px.scatter(d.to_pandas(), x='x', y='tumour_vaf', color='allele_state', render_mode='webgl', category_orders={'allele_state': ['Balanced', 'Imbalanced', 'LOH-like']}, color_discrete_map=depictio_category_colors.get('allele_state') or {}, custom_data=['chrom', 'pos'], labels={'x': 'Genome position, chromosomes in karyotype order (Mb)', 'tumour_vaf': 'Allele fraction in the tumour', 'allele_state': 'In the tumour'})
      fig.update_traces(marker=dict(size=3, opacity=0.5), hovertemplate='%{customdata[0]}:%{customdata[1]}<br>tumour allele fraction %{y:.2f}<extra>%{fullData.name}</extra>')
      mids = sizes.with_columns(((pl.col('off') + pl.col('end') / 2) / 1e6).alias('mid'), (pl.col('off') / 1e6).alias('x0'), ((pl.col('off') + pl.col('end')) / 1e6).alias('x1'))
      for row in mids.iter_rows(named=True):
          if row['chrom_rank'] % 2 == 0:
              fig.add_vrect(x0=row['x0'], x1=row['x1'], fillcolor='#868e96', opacity=0.1, line_width=0, layer='below')
      fig.add_hline(y=0.5, line_dash='dot', line_color='#868e96')
      fig.update_xaxes(tickmode='array', tickvals=mids['mid'].to_list(), ticktext=mids['chrom'].str.replace('^chr', '').to_list(), tickangle=0, title_text='Chromosome')
      fig.update_yaxes(range=[-0.02, 1.02])
      fig.update_layout(margin=dict(t=10), legend=dict(orientation='h', y=1.1, x=0, title_text='', itemsizing='constant'))
    section: What the tumour lost
    tag: sk-gs-fig-loh
    index: gs-loh-genome
    title: Tumour allele fraction at the normal's heterozygous sites
    description: One dot per heterozygous germline SNV of the normal, placed by genome position and by the share of the tumour's reads that carry the alternate allele. A single band at 0.5 is a balanced region; two bands near 0 and 1 are a region where a parental copy was lost.
    layout: {x: 0, y: 2, w: 8, h: 6}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: germline_het_sites
    visu_type: bar
    mode: code
    code_content: |-
      # Share of the normal's heterozygous sites of each chromosome that the tumour reads as LOH-like (allele fraction under 0.15 or over 0.85), in karyotype order. A chromosome near 100 % has lost a parental copy along its whole length; one near 0 kept both.
      g = df.group_by(['chrom_rank', 'chrom']).agg(pl.len().alias('sites'), (pl.col('allele_state') == 'LOH-like').sum().alias('lost')).with_columns((pl.col('lost') / pl.col('sites') * 100).alias('pct'), pl.col('chrom').str.replace('^chr', '').alias('label')).sort('chrom_rank')
      fig = px.bar(g.to_pandas(), x='label', y='pct', text='pct', custom_data=['lost', 'sites'], category_orders={'label': g['label'].to_list()}, color_discrete_sequence=['#868e96'], labels={'label': 'Chromosome', 'pct': 'Sites that look LOH (%)'})
      fig.update_traces(texttemplate='%{text:.0f}', textposition='outside', cliponaxis=False, hovertemplate='chromosome %{x}: %{y:.0f}% (%{customdata[0]} of %{customdata[1]} sites)<extra></extra>')
      fig.update_xaxes(type='category', tickmode='linear', dtick=1)
      fig.update_yaxes(range=[0, 112], ticksuffix='%')
      fig.update_layout(margin=dict(t=10))
    section: What the tumour lost
    tag: sk-gs-fig-loh-chrom
    index: gs-loh-chrom
    title: LOH-like sites per chromosome
    description: Share of each chromosome's heterozygous sites read as LOH-like in the tumour. Bars near 100 % are chromosomes that lost a parental copy; the sites behind each bar are in the hover.
    layout: {x: 0, y: 8, w: 8, h: 4}
  - component_type: table
    workflow_tag: sarek
    data_collection_tag: somatic_vs_germline
    columns: [unit, caller, chrom, pos, ref, alt, filter_status, tumour_vaf, tumour_dp, normal_vaf, normal_dp, normal_vaf_source, germline_callers, origin]
    section: Comparison table
    tag: sk-gs-table
    index: gs-table
    title: Somatic calls against the normal
    description: One row per somatic call of a pair, the filtered ones included, with the allele fraction and depth in both samples, where the normal's value comes from and how many germline callers made the same call.
    layout: {x: 0, y: 0, w: 8, h: 6}
# ============================================================================
# Annotation
# ============================================================================
# What the calls do to the transcripts: SnpEff's own CSV summary, then the
# same composition recomputed on the annotated calls.
- title: Consequences
  subtitle: What do the calls do to the transcripts?
  tab_group: Annotation
  tab_order: 10
  tab_icon: mdi:chart-donut
  tab_icon_color: red
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # The impact class and consequence pickers sit in the bar of the per-call
  # section, not here: three cards pin an impact class, which a left-panel
  # impact pick would turn into dashes.
  filter_sections:
  - name: Consequence filters
    icon: mdi:filter-variant
    color: red
