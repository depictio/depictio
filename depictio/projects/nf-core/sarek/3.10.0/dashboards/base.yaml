# ============================================================================
# Genes
# ============================================================================
# The gene-level view, from SnpEff's per-gene effect table and from the protein
# coordinates in the annotated VCF. This is where a reader stops asking about
# the run and starts asking about a gene.
- title: Genes
  subtitle: Which genes carry the calls, how the callsets differ on them, and where the variants sit on the protein
  tab_order: 6
  tab_icon: mdi:dna
  tab_icon_color: pink
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  advanced_viz_controls: header
  filter_sections:
  - name: Gene scope
    icon: mdi:filter-variant
    color: pink
    description: Which biotype and which caller to keep in the burden table and the lollipop
  - name: Protein scope
    icon: mdi:tune
    color: violet
    description: Which impact class to keep on the lollipop
  grid_sections:
  - name: Genes at a glance
    icon: mdi:counter
    color: pink
    description: How the variant burden distributes over genes
  - name: Burden across callsets
    icon: mdi:relation-many-to-many
    color: violet
    description: Do the callers separate more than the depths do
  - name: Along the protein
    icon: mdi:chart-timeline-variant
    color: indigo
    description: Coding variants at their amino-acid position
  - name: Gene table
    icon: mdi:table
    color: gray
    description: The per-gene burden behind the panels on this tab
    collapsed: true
  components:
  - component_type: text
    tag: sk-gn-intro
    section: Genes at a glance
    title: From a callset to a gene list
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      snpEff counts, for every gene, how many variants of each impact class a
      callset put on it. On a germline run the top of that list is usually
      long, repetitive, poorly mappable genes, so a high burden is a
      mappability signal before it is a biological one.
    workflow_tag: sarek
    data_collection_tag: snpeff_genes
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: sk-gn-card-burden
    index: sk-gn-card-burden
    section: Genes at a glance
    workflow_tag: sarek
    data_collection_tag: snpeff_genes
    use: snpeff/gene_burden_top
    aggregation: sum
    column_name: n_variants
    column_type: int64
    secondary_layout: top_n
    breakdown_col: gene_name
    top_n_count: 5
    display: {icon_name: 'mdi:counter', icon_color: '#D81B60', title_color: '#D81B60', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Variants on genes
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sk-gn-card-high
    index: sk-gn-card-high
    section: Genes at a glance
    workflow_tag: sarek
    data_collection_tag: snpeff_genes
    use: snpeff/genes
    aggregation: sum
    column_name: n_high
    column_type: int64
    secondary_layout: top_n
    breakdown_col: caller
    top_n_count: 3
    display: {icon_name: 'mdi:alert-outline', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: HIGH impact variants
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sk-gn-card-coding
    index: sk-gn-card-coding
    section: Genes at a glance
    workflow_tag: sarek
    data_collection_tag: snpeff_genes
    use: snpeff/genes
    aggregation: sum
    column_name: n_moderate
    column_type: int64
    secondary_layout: top_n
    breakdown_col: caller
    top_n_count: 3
    display: {icon_name: 'mdi:alert-circle-outline', icon_color: '#5E35B1', title_color: '#5E35B1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: MODERATE impact variants
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sk-gn-card-lolli
    index: sk-gn-card-lolli
    section: Genes at a glance
    workflow_tag: sarek
    data_collection_tag: snpeff_protein_lollipop
    use: snpeff/protein_lollipop
    aggregation: count
    column_name: variant_key
    column_type: object
    secondary_layout: top_n
    breakdown_col: gene
    top_n_count: 5
    display: {icon_name: 'mdi:chart-timeline-variant', icon_color: '#3949AB', title_color: '#3949AB', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Variants with a protein position
    layout: {x: 6, y: 2, w: 2, h: 2}


  - component_type: text
    tag: sk-gn-heat-intro
    section: Burden across callsets
    title: Which genes carry the burden, callset by callset
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The genes carrying the most coding variants as a gene by callset matrix
      of counts, clustered on both axes: callsets that cluster by caller
      rather than by sample mean the caller shapes the gene list more than the
      sample does. The matrix is fixed, the pickers in the left panel do not
      narrow it.
    workflow_tag: sarek
    data_collection_tag: snpeff_gene_heatmap
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: sk-gn-av-heat
    index: sk-gn-av-heat
    section: Burden across callsets
    workflow_tag: sarek
    data_collection_tag: snpeff_gene_heatmap
    use: snpeff/burden_matrix
    title: Variant burden, gene against callset
    description: The genes carrying the most coding variants; columns are callsets (sample and caller).
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 9}

  - component_type: text
    tag: sk-gn-lolli-intro
    section: Along the protein
    title: Where on the protein the variants sit
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Only variants whose protein change snpEff could compute appear here, at
      their amino-acid position. Several callsets stacking a variant at the
      same residue is a call they agree on; a lone stem is one caller's own.
    workflow_tag: sarek
    data_collection_tag: snpeff_protein_lollipop
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: sk-gn-av-lolli
    index: sk-gn-av-lolli
    section: Along the protein
    workflow_tag: sarek
    data_collection_tag: snpeff_protein_lollipop
    use: snpeff/coding_variant_needles
    config:
      max_subplot_genes: 4
      point_size: 8
      scale_points_by_effect: true
    title: Coding variants along the protein
    description: One lane per gene, one stem per variant, head colour by impact class and head size by allele fraction. Above four genes the tile switches to a single-gene picker.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: table
    tag: sk-gn-table-lolli
    section: Along the protein
    workflow_tag: sarek
    data_collection_tag: snpeff_protein_lollipop
    use: snpeff/protein_lollipop
    row_selection_enabled: true
    row_selection_column: variant_key
    title: Coding variants with a protein position
    description: Gene, amino-acid position, impact, consequence and protein change, one row per call.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 9, w: 8, h: 7}

  - component_type: text
    tag: sk-gn-table-intro
    section: Gene table
    title: The per-gene burden behind the panels
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per gene and callset, with the four impact counts summed over the
      gene's transcripts. Pick a gene here and the lollipop above opens on it.
    workflow_tag: sarek
    data_collection_tag: snpeff_genes
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: sk-gn-table-genes
    section: Gene table
    workflow_tag: sarek
    data_collection_tag: snpeff_genes
    use: snpeff/genes
    row_selection_enabled: true
    row_selection_column: gene_name
    title: Per-gene variant burden
    description: Gene, biotype and the HIGH, MODERATE, LOW and MODIFIER counts, one row per gene and callset.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 7}

  - component_type: interactive
    tag: sk-gn-filter-biotype
    index: sk-gn-biotype-filter
    section: Gene scope
    group: Gene scope
    workflow_tag: sarek
    data_collection_tag: snpeff_genes
    interactive_component_type: MultiSelect
    column_name: biotype
    column_type: object
    display: {title_size: md, custom_color: '#D81B60', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Biotype
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: sk-gn-filter-caller
    index: sk-gn-caller-filter
    section: Gene scope
    group: Gene scope
    workflow_tag: sarek
    data_collection_tag: snpeff_genes
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:dna'}
    placement: left
    title: Caller
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: sk-gn-filter-impact
    index: sk-gn-impact-filter
    section: Protein scope
    group: Protein scope
    workflow_tag: sarek
    data_collection_tag: snpeff_protein_lollipop
    interactive_component_type: MultiSelect
    column_name: impact
    column_type: object
    display: {title_size: md, custom_color: '#5E35B1', icon_name: 'mdi:alert-outline'}
    placement: left
    title: Impact class
    layout: {x: 0, y: 0, w: 1, h: 3}
