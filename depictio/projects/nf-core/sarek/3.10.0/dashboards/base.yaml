version: 1
# nf-core/sarek 3.10.0 dashboard, to the family rules of
# depictio/projects/nf-core/RULES.md (ampliseq is the reference).
#
# Funnel: the MultiQC report and the coverage (Data & QC) -> what each caller
# called, how clean it looks and which calls the callers share (Variant calls)
# -> what the calls do to the transcripts, which genes carry them and one
# region on one axis (Annotation).
#
# A run without `--tools` (mapping only) has no calls: every collection built
# from a VCF or a bcftools report is optional, so it imports with the Overview,
# MultiQC, Coverage and Locus tabs (depth and reads) and nothing else. The texts
# that cite a call count carry it as a live value, so the line goes with its data.
#
# Germline and somatic are two sets of tabs. A call belongs to a unit: a sample, or
# a tumour/normal pair named `<tumour>_vs_<normal>`. The germline tabs read the single
# samples only (a pair's or a tumour's callset never reaches them); the Somatic tabs
# read the pairs and the tumours called on their own, and exist only when the run
# has such data (somatic_calls, cnv_segments, msi, somatic_vs_germline are optional).
#
# Nothing here is a truth comparison: "concordance" is agreement between
# callers and samples. nf-core/variantbenchmarking has its own template.
#
# Structural-variant callers (Manta, TIDDIT) call few SNPs, so every Ts/Tv
# tile filters `ts_tv > 0`. The SnpEff collections are optional (a run without
# `--tools snpeff` prunes them, with the Consequences, Genes and Protein tabs and the
# Overview tiles and rows that read them).
main_dashboard:
  title: nf-core/sarek
  subtitle: Coverage, then the calls and genes the run produced
  project_tag: Sarek Germline Variant Calling
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab: figures, advanced viz and filter
  # chips all colour a value the same way.
  category_colors:
    # The callers are a known vocabulary, so they are pinned off the first palette slots
    # that `sample_id: auto` below hands to the first samples: a caller never wears the
    # colour of a sample in the same section. Any other caller takes a free slot.
    caller:
      '*': auto
      deepvariant: '#4a3aa7'
      haplotypecaller: '#008300'
      strelka: '#e87ba4'
      mutect2: '#0c8599'
      muse: '#862e9c'
      freebayes: '#eda100'
      manta: '#e34948'
      tiddit: '#868e96'
    status_label:
      '*': auto
      Normal: '#1098ad'
      Tumour: '#c2255c'
      Unknown: '#adb5bd'
    # A patient's design, and the same three values on a unit of calls: a tumour called
    # on its own is never drawn on the scale of a paired one.
    design:
      Paired: '#7048e8'
      Germline only: '#1098ad'
      Tumour-only: '#c2255c'
    unit_type:
      paired: '#7048e8'
      tumour_only: '#c2255c'
      germline: '#1098ad'
    call_class:
      Germline (normal): '#1098ad'
      Somatic (pair): '#7048e8'
    # A somatic call the normal's germline calls also hold is a likely leak of an
    # inherited variant: it takes the warm colour.
    origin:
      Also in the normal's germline calls: '#e8590c'
      Not in the normal's germline calls: '#7048e8'
    # How many somatic callers kept a variant, in one hue deepening with the agreement.
    support:
      '*': auto
      1 caller: '#ffe066'
      2 callers: '#fab005'
      3 callers: '#e67700'
    # The allele fraction of a somatic variant in the normal: clean is what a somatic
    # call should be, germline-like is what it should not.
    normal_class:
      Clean in the normal: '#2f9e44'
      Trace in the normal: '#f59f00'
      Germline-like in the normal: '#e03131'
    # The six substitution classes, a pyrimidine on the reference strand.
    substitution:
      C>A: '#1c7ed6'
      C>G: '#495057'
      C>T: '#e03131'
      T>A: '#adb5bd'
      T>C: '#40c057'
      T>G: '#f783ac'
    # What the tumour kept of a normal's heterozygous site.
    allele_state:
      Balanced: '#868e96'
      Imbalanced: '#f59f00'
      LOH-like: '#e03131'
    cn_state:
      Gain: '#e8590c'
      Loss: '#1c7ed6'
    variant_type:
      SNP: '#1c7ed6'
      INDEL: '#7048e8'
      MNP: '#0ca678'
      SV: '#f08c00'
    impact:
      HIGH: '#e03131'
      MODERATE: '#f08c00'
      LOW: '#1c7ed6'
      MODIFIER: '#adb5bd'
    # The worst impact class of a gene on the Protein tab's scatter.
    worst_impact:
      HIGH: '#e03131'
      MODERATE: '#f08c00'
      LOW: '#1c7ed6'
    mutation_class:
      transition: '#1c7ed6'
      transversion: '#e8590c'
    indel_class:
      insertion: '#0ca678'
      deletion: '#c2255c'
    # Structural-variant types: deletions and insertions keep the colours of the
    # indel classes they extend.
    svtype:
      DEL: '#c2255c'
      INS: '#0ca678'
      DUP: '#1c7ed6'
      INV: '#f08c00'
      BND: '#7048e8'
      CNV: '#868e96'
    # A caller writes its own FILTER reasons, more than the palette's eight on
    # a multi-caller run: the commonest take the palette, PASS stays green.
    filter_label:
      '*': 'auto:n_variants'
      PASS: '#2f9e44'
    inferred_sex:
      XX: '#c2255c'
      XY: '#1c7ed6'
    scope:
      region: '#1c7ed6'
      genome: '#868e96'
    # The browser colours a sample's reads by it and the depth lanes wear the same colour.
    sample_id: auto
  # Persistent: drawn in every tab's filter panel, picks kept across tabs.
  # Bound to the sample hub, which links to every per-sample collection.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Study design
    icon: mdi:account-group-outline
    color: gray
    appearance: plain
    description: Who was sequenced and how the tumours are paired with their normals. The tables list every sample, whatever the sample filters keep.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The sample hub behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Callsets).
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: indigo
      strip_label: Caller
    section: Key figures
    tag: sk-ov-kf-caller
    index: ov-kf-caller
    title: Caller
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: sk-ov-kf-sample
    index: ov-kf-sample
    title: Sample ID
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: text
    title: nf-core/sarek
    logo: https://raw.githubusercontent.com/nf-core/sarek/master/docs/images/nf-core-sarek_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/sarek/master/docs/images/nf-core-sarek_logo_dark.png
    order: 1
    body: >
      The study, the run that analysed it and what it found: how deeply the targets were covered
      and, for a run that called variants, what each caller called, which calls the callers share,
      what a tumour has that its normal has not and what the calls do to the transcripts.
      [Run parameters](params:)
    tag: sk-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/sarek maps each sample's reads and measures the depth over the intervals. A run that asks for callers (`--tools`) also calls variants and, with SnpEff or VEP, annotates them. Each tab answers one question, in the order of the steps above; a tab appears only when its data exists, so a run that stopped after the mapping has the first three and a run without a tumour has no Somatic group.

      Sarek calls every sample on its own and, when the sheet names a tumour (status 1) and a normal (status 0) for a patient, the pair as well. A pair is named `<tumour>_vs_<normal>`: the Variant calls and Annotation tabs read the normal samples called on their own, the Somatic tabs read the pairs, and the Design filter keeps the patients that were paired, tumour-only or germline only.

      Provenance: every setting and tool version on this page is read from the run's own `params.json` and software-versions report, and every number from the files the run wrote. The sample filters in the left panel apply to every tab; a bar above a section narrows that section only.
    tag: sk-ov-about
    index: ov-about
    layout: {x: 0, y: 13, w: 8, h: 3}
  # The study: who was sequenced, from the sample sheet. Each line cites one collection,
  # so a line goes with its data (a run without pairs has no pairs line).
  - component_type: text
    surface: card
    values:
      patients: {dc: samples, column: patient, aggregation: nunique, format: integer}
      samples: {dc: samples, column: sample_id, aggregation: nunique, format: integer}
      tumours: {dc: samples, column: sample_id, aggregation: count, filter_expr: "col('status_label') == 'Tumour'", format: integer}
      normals: {dc: samples, column: sample_id, aggregation: count, filter_expr: "col('status_label') == 'Normal'", format: integer}
      design: {dc: samples, column: design, aggregation: top}
      pairs: {dc: pairs, column: pair_id, aggregation: count, format: integer}
    body: |
      ### The study
      - ![](icon:mdi:account-group-outline) **Patients** {{patients}}, design: {{design}}
      - ![](icon:mdi:test-tube) **Samples** {{samples}}: {{tumours}} tumour and {{normals}} normal
      - ![](icon:mdi:link-variant) **Pairs** {{pairs}} tumour/normal, each tumour read against its own normal
      - ![](icon:mdi:dna) **Sequencing** whole exome (`wes` = {{param:wes}})
      - ![](icon:mdi:target) **Capture** {{param:intervals}}
      - ![](icon:mdi:file-table-outline) **Samplesheet** [as given to the run](params:input)
    tag: sk-ov-study
    index: ov-study
    layout: {x: 0, y: 1, w: 5, h: 6}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash.
  - component_type: text
    surface: card
    values:
      callsets: {dc: bcftools_stats_summary, column: sample, aggregation: count, format: integer}
      callers: {dc: bcftools_stats_summary, column: caller, aggregation: nunique, format: integer}
      pairs: {dc: pairs, column: pair_id, aggregation: count, format: integer}
    body: |
      ### The run
      - ![](icon:mdi:source-branch) **Pipeline** nf-core/sarek 3.10.0 on Nextflow {{param:Workflow.Nextflow}}
      - ![](icon:mdi:calendar-clock) **Run date** {{param:trace_report_suffix}}
      - ![](icon:mdi:map-marker-outline) **Reference** {{param:genome}}
      - ![](icon:mdi:content-cut) **Aligner** {{param:aligner}}
      - ![](icon:mdi:wrench-outline) **Tools** [the `--tools` list](params:tools)
      - ![](icon:mdi:flask-outline) **Somatic calling** Mutect2 (GATK {{param:MUTECT2_PAIRED.gatk4}}), Strelka {{param:STRELKA_SOMATIC.strelka}}, MuSE {{param:MUSE_CALL.muse}} on {{pairs}} pair(s)
      - ![](icon:mdi:set-merge) **Germline** Freebayes {{param:FREEBAYES.freebayes}}, annotation SnpEff {{param:SNPEFF_SNPEFF.snpeff}}, VEP {{param:ENSEMBLVEP_VEP.ensemblvep}}
      - ![](icon:mdi:tag-outline) **Annotation** SnpEff database {{param:snpeff_db}}, VEP cache {{param:vep_cache_version}}
      - ![](icon:mdi:layers-triple-outline) **Callsets** {{callsets}} from {{callers}} callers
      - ![](icon:mdi:tune) [All parameters and tool versions](params:)
    tag: sk-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 6}
  # A step past the depth cites a count from its tab's collection, so the import takes
  # the line out with its data: a run that called nothing keeps the first two steps.
  - component_type: text
    surface: card
    accent: green
    values:
      n_callsets: {dc: bcftools_stats_summary, column: sample, aggregation: count, format: integer}
      n_qc: {dc: callset_qc, column: callset, aggregation: count, format: integer}
      n_calls: {dc: vcf_variants, column: variant_key, aggregation: count, format: si}
      n_ann: {dc: snpeff_ann_variants, column: variant_key, aggregation: count, format: si}
      n_som: {dc: somatic_variants, column: variant_key, aggregation: count, format: integer}
      n_pairs: {dc: pairs, column: pair_id, aggregation: count, format: integer}
      n_seg: {dc: cnv_summary, column: n_segments, aggregation: sum, format: integer}
      n_het: {dc: germline_het_sites, column: variant_key, aggregation: count, format: si}
    body: |
      ### Steps from reads to genes
      Each step names its settings and the tab that shows its result. A step the run skipped drops out.

      ::: steps
      1. ![](icon:mdi:content-cut) **Map** Trim, align, mark duplicates · [Settings](params:aligner) · [MultiQC](tab:MultiQC)
      2. ![](icon:mdi:layers-outline) **Cover** Depth over the intervals · [Settings](params:intervals) · [Coverage](tab:Coverage)
      3. ![](icon:mdi:dna) **Call** {{n_callsets}} callsets, one per caller and sample · [Settings](params:tools) · [Yield](tab:Variant yield)
      4. ![](icon:mdi:check-decagram) **Check** Ts/Tv, PASS share and zygosity of {{n_qc}} callsets · [Settings](params:skip_tools) · [Quality](tab:Call quality)
      5. ![](icon:mdi:set-merge) **Compare** Calls the callers share, among {{n_calls}} calls · [Settings](params:joint_germline) · [Concordance](tab:Caller concordance)
      6. ![](icon:mdi:tag-outline) **Annotate** SnpEff effects and genes on {{n_ann}} calls · [Settings](params:snpeff) · [Consequences](tab:Consequences)
      7. ![](icon:mdi:flask-outline) **Somatic** {{n_som}} variants the tumour has and the normal has not, in {{n_pairs}} pairs · [Settings](params:tools) · [Somatic calls](tab:Somatic calls)
      8. ![](icon:mdi:chart-timeline-variant) **Copy number** {{n_seg}} segments of gain and loss, and microsatellite instability · [Settings](params:tools) · [Copy number & MSI](tab:Copy number & MSI)
      9. ![](icon:mdi:compare-horizontal) **Compare** the normal's own variants: {{n_het}} heterozygous sites read in the tumour for loss of a parental copy · [Germline vs somatic](tab:Germline vs somatic)
      :::
    tag: sk-ov-steps
    index: ov-steps
    layout: {x: 0, y: 7, w: 8, h: 6}
  # The design of the run in one card: every patient has a normal, a tumour, or both. The
  # hub is the one collection every route writes, so it keeps its slot on a mapping-only run.
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: samples
    aggregation: nunique
    column_name: patient
    column_type: object
    secondary_layout: top_n
    breakdown_col: design
    top_n_count: 3
    display:
      icon_name: mdi:account-group-outline
      icon_color: gray
      caption: patients, by design
      decimals: 0
    section: Key figures
    tag: sk-ov-kf-patients
    index: ov-kf-patients
    title: Patients
    description: Patients on the sample sheet. The bars rank the designs, where a patient is Paired (tumour and normal), Germline only or Tumour-only.
    layout: {x: 0, y: 0, w: 2, h: 2}
  # Key figures: one card per stage of the funnel, each opening the tab that explains it
  # in that tab's colour. The patients and depth cards read collections that every run
  # writes; a mapping-only run keeps those two, widened to the row.
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    aggregation: sum
    column_name: n_records
    column_type: int64
    secondary_layout: composition
    breakdown_col: caller
    display:
      icon_name: mdi:layers-triple-outline
      icon_color: teal
      caption: records over all callsets, by caller
      link: tab:Caller concordance
      format: si
    section: Key figures
    tag: sk-ov-kf-calls
    index: ov-kf-calls
    title: Variant calls
    description: Records the callers wrote, summed over the callsets. The bar splits them by caller.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # The `total` row of the region scope is mosdepth's own roll-up over the
  # intervals: one value per sample.
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: mosdepth_summary
    use: mosdepth/summary
    aggregation: median
    column_name: mean_depth
    column_type: float64
    filter_expr: "(col('scope') == 'region') & (col('chrom') == 'total')"
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:layers-outline
      icon_color: blue
      caption: median per sample, with its spread
      link: tab:Coverage
      decimals: 1
    section: Key figures
    tag: sk-ov-kf-depth
    index: ov-kf-depth
    title: Depth on target
    description: Median depth over the intervals, one value per sample. The box shows how it spreads.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_tstv
    use: bcftools/stats_tstv
    aggregation: median
    column_name: ts_tv
    column_type: float64
    filter_expr: "col('ts_tv') > 0"
    secondary_layout: threshold
    threshold_value: 1.8
    threshold_direction: min
    threshold_warn: 1.5
    display:
      icon_name: mdi:scale-balance
      icon_color: violet
      caption: median of the SNP callsets, floor 1.8
      link: tab:Variant yield
      decimals: 2
    section: Key figures
    tag: sk-ov-kf-tstv
    index: ov-kf-tstv
    title: Ts/Tv
    description: Median transition to transversion ratio of the callsets with SNPs. A human genome sits near
      2.0 to 2.1 and an exome near 2.8 to 3.0; below the 1.8 floor false calls dilute the transitions, and the
      bar turns red under 1.5.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the caller (it narrows every collection with a
  # caller column), then the sample.
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: indigo
      strip_label: Caller
    section: Findings
    tag: sk-ov-findings-caller
    index: ov-findings-caller
    title: Caller
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Sample
    section: Findings
    tag: sk-ov-findings-sample
    index: ov-findings-sample
    title: Sample ID
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data (the SnpEff row on a run without SnpEff).
  - component_type: text
    surface: card
    values:
      depth: {dc: mosdepth_summary, column: mean_depth, aggregation: median, filter_expr: "(col('scope') == 'region') & (col('chrom') == 'total')",
        format: 'decimals:1'}
      tstv: {dc: bcftools_stats_tstv, column: ts_tv, aggregation: median, filter_expr: "col('ts_tv') > 0", format: 'decimals:2'}
      shared: {dc: snpeff_variant_upset, column: sample_shared_pct, aggregation: median, format: 'decimals:0'}
      n_high: {dc: snpeff_ann_variants, column: variant_key, aggregation: count, filter_expr: "col('impact') == 'HIGH'",
        format: integer}
      n_hgenes: {dc: snpeff_ann_variants, column: gene, aggregation: nunique, filter_expr: "(col('impact') == 'HIGH') & (col('gene') != '')",
        format: integer}
      n_cons: {dc: somatic_variants, column: variant_key, aggregation: count, filter_expr: "col('consensus') == True", format: integer}
      burden: {dc: somatic_burden, column: per_mb, aggregation: median, filter_expr: "col('basis_kind') == 'consensus'", format: 'decimals:1'}
      n_loh: {dc: germline_het_sites, column: variant_key, aggregation: count, filter_expr: "col('allele_state') == 'LOH-like'", format: integer}
      n_het: {dc: germline_het_sites, column: variant_key, aggregation: count, format: integer}
    body: |
      - **{{depth}}x** median depth over the intervals – one value per sample [Coverage](tab:Coverage)
      - **{{tstv}}** median Ts/Tv of the callsets with SNPs – transitions over transversions [Quality](tab:Call quality)
      - **{{shared}}%** of a sample's PASS calls are made by two callers or more – agreement is not truth [Concordance](tab:Caller concordance)
      - **{{n_high}}** HIGH-impact calls on {{n_hgenes}} genes – SnpEff's most severe class [Consequences](tab:Consequences)
      - **{{n_cons}}** somatic variants kept by two callers or more – the set to quote, a variant counted once [Somatic calls](tab:Somatic calls)
      - **{{burden}}** somatic variants per megabase of the capture target – about 10 is the usual line for a high burden [Somatic calls](tab:Somatic calls)
      - **{{n_loh}}** of the normal's {{n_het}} heterozygous sites read as one parental allele only in the tumour – loss of heterozygosity [Germline vs somatic](tab:Germline vs somatic)
    section: Findings
    tag: sk-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 3}
  # One highlight per analysis tab, in the order of the rows above. A legend
  # of callsets or FILTER reasons would fill a half-width tile: the captions say
  # what the colour is instead.
  - component_type: highlight
    section: Findings
    source_tab: Variant yield
    source_component: vy-spectrum-sbs
    hide_legend: true
    caption: One bar per caller, its SNVs over the six substitution classes averaged over the samples; C>T and T>C are the transitions.
    tag: sk-ov-hl-spectrum
    index: ov-hl-spectrum
    layout: {x: 0, y: 3, w: 4, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Call quality
    source_component: cq-filter-partitions
    hide_legend: true
    caption: Calls per caller by FILTER value; the green slice is PASS, the rest is what the caller set aside.
    tag: sk-ov-hl-filter
    index: ov-hl-filter
    layout: {x: 4, y: 3, w: 4, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Caller concordance
    source_component: cc-vaf-dist
    caption: Share of each caller's calls per allele fraction; a clean diploid callset peaks near 0.5 (heterozygous) and near 1 (homozygous alternate).
    tag: sk-ov-hl-vaf
    index: ov-hl-vaf
    layout: {x: 0, y: 8, w: 4, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Consequences
    source_component: cs-impact-by-caller
    hide_legend: true
    caption: Each caller's coding calls by impact class (red HIGH, orange MODERATE, blue LOW), as shares.
    tag: sk-ov-hl-impact
    index: ov-hl-impact
    layout: {x: 4, y: 8, w: 4, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Somatic calls
    source_component: som-vaf-hist
    caption: The tumour allele fraction of every distinct somatic variant, stacked by the number of callers that kept it; a clonal variant of a diploid, pure tumour sits near 0.5.
    tag: sk-ov-hl-somatic
    index: ov-hl-somatic
    layout: {x: 0, y: 13, w: 4, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Germline vs somatic
    source_component: gs-loh-genome
    caption: The tumour allele fraction at the normal's heterozygous sites along the genome; where the band at 0.5 splits towards 0 and 1 the tumour lost a parental copy.
    tag: sk-ov-hl-loh
    index: ov-hl-loh
    layout: {x: 4, y: 13, w: 4, h: 5}
  # The design in two tables: every sample, and the pairs the somatic tabs read.
  - component_type: table
    workflow_tag: sarek
    data_collection_tag: samples
    columns: [sample_id, patient, sex, status_label, design, n_callers]
    section: Study design
    tag: sk-ov-table-samples
    index: ov-table-samples
    title: Samples
    description: One row per sample of the sheet, with its patient, sex, tumour or normal status, the patient's design and the number of callers run on it.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    workflow_tag: sarek
    data_collection_tag: pairs
    columns: [pair_id, patient, tumour, normal]
    section: Study design
    tag: sk-ov-table-pairs
    index: ov-table-pairs
    title: Tumour/normal pairs
    description: Each tumour with the normal of its patient. Sarek calls the pair as `<tumour>_vs_<normal>`, and the Somatic tabs read these calls.
    layout: {x: 0, y: 4, w: 8, h: 3}
  # Link-only tab tiles: each prints its tab's subtitle. A tab the run does not
  # have is left out, and a heading whose tabs are all missing is hidden.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Coverage](tab:Coverage)

      ### Variant calls
      - [Variant yield](tab:Variant yield)
      - [Call quality](tab:Call quality)
      - [Caller concordance](tab:Caller concordance)
      - [Structural variants](tab:Structural variants)

      ### Somatic
      - [Somatic calls](tab:Somatic calls)
      - [Copy number & MSI](tab:Copy number & MSI)
      - [Germline vs somatic](tab:Germline vs somatic)

      ### Annotation
      - [Consequences](tab:Consequences)
      - [Genes](tab:Genes)
      - [Protein](tab:Protein)
      - [Locus](tab:Locus)
    section: How to read this dashboard
    tag: sk-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 3}
  # Persistent sample filters: the tumour/normal status and the patient's design
  # first, then patient and sample.
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: status_label
    column_type: object
    display:
      icon_name: mdi:account-heart-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: sk-filter-status
    index: sample-filters-status
    title: Status
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: design
    column_type: object
    display:
      icon_name: mdi:account-multiple-outline
      custom_color: grape
    section: Sample filters
    group: Sample scope
    tag: sk-filter-design
    index: sample-filters-design
    title: Design
    layout: {x: 0, y: 2, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: patient
    column_type: object
    display:
      icon_name: mdi:account-group-outline
      custom_color: pink
    section: Sample filters
    group: Sample scope
    tag: sk-filter-patient
    index: sample-filters-patient
    title: Patient
    layout: {x: 0, y: 4, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: sk-filter-sample
    index: sample-filters-sample
    title: Sample ID
    layout: {x: 0, y: 7, w: 1, h: 3}
  - component_type: table
    workflow_tag: sarek
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Sample sheet
    tag: sk-sample-sheet
    index: sample-sheet
    title: Sample sheet
    description: One row per sample, with its patient, sex, status, design and the callers run on it. A sex of NA means the samplesheet did not state it; the Coverage tab infers it from the sex chromosomes.
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
# ============================================================================
# Data & QC
# ============================================================================
- title: MultiQC
  subtitle: Did reads, mapping and recalibration work for every sample?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  grid_sections:
  - name: QC overview
    icon: mdi:chart-box-outline
    color: orange
    description: Reads kept, mapping rate, duplication and coverage, per sample
  - name: Read quality
    icon: mdi:chart-bell-curve
    color: orange
    description: FastQC counts, base quality and GC content of the raw libraries
    collapsed: true
  - name: Alignment details
    icon: mdi:chart-bar
    color: orange
    description: Base-quality recalibration fit and insert sizes
    collapsed: true
  - name: Annotation panels
    icon: mdi:dna
    color: orange
    description: Where the annotated calls fall, and VEP's own summaries
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [MultiQC](https://multiqc.info) gathers the per-sample reports of FastQC, fastp, Samtools,
      GATK and mosdepth, and of the callers' bcftools, VCFtools, SnpEff and VEP when the run made
      calls. Read whether every sample kept its reads, mapped well and reached a usable depth
      before reading any call. A library carries a lane and a read suffix, so a sample can appear
      once per read; the per-caller summaries of the calls are on the Variant yield, Call quality
      and Consequences tabs.
    tag: sk-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: QC overview
    tag: sk-mqc-general-stats
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    use: multiqc/fastp
    selected_module: fastp
    selected_plot: Filtered Reads
    section: QC overview
    tag: sk-mqc-fastp-filtered
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Percent mapped
    section: QC overview
    tag: sk-mqc-samtools-mapped
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    use: multiqc/picard
    selected_module: picard
    selected_plot: Mark Duplicates
    section: QC overview
    tag: sk-mqc-picard-dup
    layout: {x: 0, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    use: multiqc/mosdepth
    selected_module: mosdepth
    selected_plot: Cumulative coverage distribution
    section: QC overview
    tag: sk-mqc-mosdepth-cov
    layout: {x: 4, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Counts
    section: Read quality
    tag: sk-mqc-fastqc-counts
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    section: Read quality
    tag: sk-mqc-fastqc-quality
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: sarek
    data_collection_tag: multiqc_data
