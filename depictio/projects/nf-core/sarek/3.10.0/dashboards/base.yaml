  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: sv_calls
    visu_type: bar
    mode: code
    code_content: |-
      # SV events per sample, stacked by type; a breakend is counted once. The colours are the SV-type colours of the dashboard.
      d = df.filter(pl.col('primary')).group_by(['sample', 'svtype']).agg(pl.len().alias('events')).sort(['sample', 'svtype'])
      colors = depictio_category_colors.get('svtype') or {}
      fig = px.bar(d.to_pandas(), x='sample', y='events', color='svtype', barmode='stack', color_discrete_map=colors, category_orders={'svtype': list(colors)}, labels={'sample': '', 'events': 'SV events', 'svtype': 'Type'})
      fig.update_xaxes(automargin=True)
      fig.update_layout(margin=dict(t=10))
    section: Types and lengths
    tag: sk-sv-fig-types
    index: sv-types-per-sample
    title: SV types per sample
    description: One stacked bar per sample, one segment per type.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: sv_calls
    visu_type: histogram
    mode: code
    code_content: |-
      # SV lengths on a log axis, one colour per type, in the colours and order of the bar beside it.
      # Binned on log10 of the length: plotly.js bins a log axis in linear space, which draws nothing.
      colors = depictio_category_colors.get('svtype') or {}
      d = df.filter(pl.col('size_bp') > 0).with_columns(pl.col('size_bp').cast(pl.Float64).log10().alias('log_len'))
      fig = px.histogram(d.to_pandas(), x='log_len', color='svtype', nbins=40, barmode='overlay', opacity=0.75, color_discrete_map=colors, category_orders={'svtype': list(colors)}, labels={'log_len': 'Length (bp)', 'svtype': 'Type', 'count': 'Events'})
      fig.update_xaxes(tickvals=[1, 2, 3, 4, 5, 6, 7], ticktext=['10', '100', '1k', '10k', '100k', '1M', '10M'])
      fig.update_yaxes(title_text='Events')
      fig.update_layout(margin=dict(t=10))
    section: Types and lengths
    tag: sk-sv-fig-sizes
    index: sv-size-hist
    title: SV length by type
    description: Events per length bin on a log axis, one colour per type; a breakend has no length and is not drawn.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: advanced_viz
    workflow_tag: sarek
    data_collection_tag: sv_calls
    viz_kind: ideogram
    config:
      viz_kind: ideogram
      chrom_col: chrom
      start_col: pos
      end_col: end
      category_col: svtype
      sample_col: sample
      label_col: svtype
      assembly: '{GENOME}'
      mode: auto
      orientation: horizontal
      facet_by_sample: false
      max_chromosomes: 24
    section: Along the genome
    tag: sk-sv-av-ideogram
    index: sv-ideogram
    title: SVs on the karyotype
    description: Every record on its chromosome, coloured by type, one sample at a time (picked above the chart). A deletion or duplication spans its length; a breakend and an insertion are a point. Click a chromosome to zoom along it.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: sarek
    data_collection_tag: sv_calls
    viz_kind: genome_chord
    config:
      viz_kind: genome_chord
      chrom_a_col: chrom
      pos_a_col: pos
      chrom_b_col: link_chrom
      pos_b_col: link_pos
      category_col: svtype
      label_col: svtype
      sample_col: sample
      assembly: '{GENOME}'
      colour_by: category
      intra_chromosomal: true
      max_links: 500
    section: Along the genome
    tag: sk-sv-av-chord
    index: sv-chord
    title: What each event joins
    description: One chord per event from its start to its far end, coloured by type. A breakend joins two loci, often on two chromosomes; a deletion, duplication or inversion links its two ends on one chromosome. Insertions have one locus and are not drawn.
    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: sv_calls
    visu_type: bar
    mode: code
    code_content: |-
      # Events per chromosome in karyotype order, stacked by type, one panel per sample.
      colors = depictio_category_colors.get('svtype') or {}
      d = df.filter(pl.col('primary')).group_by(['sample', 'chrom', 'svtype']).agg(pl.len().alias('events'))
      bare = pl.col('chrom').str.replace('^chr', '')
      rank = pl.coalesce(bare.cast(pl.Int64, strict=False), bare.replace_strict({'X': 100, 'Y': 101, 'M': 102, 'MT': 102}, default=200, return_dtype=pl.Int64))
      order = d.select('chrom').unique().with_columns(rank.alias('r')).sort(['r', 'chrom'])['chrom'].to_list()
      fig = px.bar(d.to_pandas(), x='chrom', y='events', color='svtype', facet_row='sample', barmode='stack', color_discrete_map=colors, category_orders={'svtype': list(colors), 'chrom': order}, labels={'chrom': '', 'events': 'Events', 'svtype': 'Type', 'sample': 'Sample'})
      fig.for_each_annotation(lambda a: a.update(text=a.text.split('=')[-1]))
      fig.update_layout(margin=dict(t=10, b=10), legend=dict(orientation='h', y=-0.12, yanchor='top', x=0, title_text=''))
    section: Along the genome
    tag: sk-sv-fig-per-chrom
    index: sv-per-chrom
    title: Events per chromosome
    description: Events on each chromosome in karyotype order, stacked by type, one row per sample. A chromosome far above its neighbours for one sample only points at a local rearrangement or a noisy region.
    layout: {x: 0, y: 6, w: 8, h: 4}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: sv_calls
    visu_type: heatmap
    mode: code
    code_content: |-
      # Events per type and size class; the cells hold the count, the shade its share of the type.
      colors = depictio_category_colors.get('svtype') or {}
      classes = ['50 bp-1 kb', '1-10 kb', '10-100 kb', '100 kb-1 Mb', '>1 Mb']
      size = pl.col('size_bp')
      cls = pl.when(size < 1_000).then(pl.lit(classes[0])).when(size < 10_000).then(pl.lit(classes[1])).when(size < 100_000).then(pl.lit(classes[2])).when(size < 1_000_000).then(pl.lit(classes[3])).otherwise(pl.lit(classes[4]))
      d = df.filter(pl.col('primary') & (size > 0)).with_columns(cls.alias('size_class')).group_by(['svtype', 'size_class']).agg(pl.len().alias('events'))
      # Types in the dashboard's SV-type order, any other after them.
      rank = pl.DataFrame({'svtype': list(colors), 'r': list(range(len(colors)))})
      types = d.select('svtype').unique().join(rank, on='svtype', how='left').sort(['r', 'svtype'], nulls_last=True)['svtype'].to_list()
      grid = pl.DataFrame({'svtype': types}).join(pl.DataFrame({'size_class': classes}), how='cross').join(d, on=['svtype', 'size_class'], how='left').with_columns(pl.col('events').fill_null(0))
      grid = grid.with_columns((pl.col('events') / pl.col('events').sum().over('svtype').clip(lower_bound=1) * 100).alias('share'))
      order = pl.DataFrame({'svtype': types})
      counts = order.join(grid.pivot(on='size_class', index='svtype', values='events'), on='svtype', how='left').select(classes).rows()
      share = order.join(grid.pivot(on='size_class', index='svtype', values='share'), on='svtype', how='left').select(classes).rows()
      fig = go.Figure(go.Heatmap(z=share, x=classes, y=types, text=counts, texttemplate='%{text}', colorscale='Greens', zmin=0, zmax=100, colorbar=dict(title='% of type'), hovertemplate='%{y}, %{x}: %{text} events (%{z:.0f}% of the type)<extra></extra>'))
      fig.update_yaxes(autorange='reversed')
      fig.update_layout(margin=dict(t=10), xaxis_title='Size class')
    section: Size classes and evidence
    tag: sk-sv-fig-size-class
    index: sv-size-class
    title: Types by size class
    description: Events per type and size class, the number in the cell and the shade its share of the type. Short-read callers find most deletions under 1 kb; a type piling up above 1 Mb is worth a look in the genome browser.
    layout: {x: 0, y: 0, w: 3, h: 4}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: sv_calls
    visu_type: bar
    mode: code
    code_content: |-
      # Per type, the share of events that PASS the caller's filters and the share it placed precisely.
      d = df.filter(pl.col('primary')).group_by('svtype').agg((pl.col('is_pass').mean() * 100).alias('PASS'), ((~pl.col('imprecise')).mean() * 100).alias('Precise breakpoints'), pl.len().alias('events'))
      colors = depictio_category_colors.get('svtype') or {}
      order = d.select('svtype').join(pl.DataFrame({'svtype': list(colors), 'r': list(range(len(colors)))}), on='svtype', how='left').sort('r', nulls_last=True)['svtype'].to_list()
      long = d.unpivot(index=['svtype', 'events'], on=['PASS', 'Precise breakpoints'], variable_name='measure', value_name='share')
      fig = px.bar(long.to_pandas(), x='svtype', y='share', color='measure', barmode='group', range_y=[0, 100], category_orders={'svtype': order}, color_discrete_sequence=['#5c940d', '#a9e34b'], custom_data=['events'], labels={'svtype': '', 'share': 'Share of events (%)', 'measure': ''})
      fig.update_traces(hovertemplate='%{x}: %{y:.0f}% of %{customdata[0]} events<extra>%{fullData.name}</extra>')
      fig.update_layout(margin=dict(t=10), legend=dict(orientation='h', y=1.02, yanchor='bottom', x=0))
    section: Size classes and evidence
    tag: sk-sv-fig-evidence
    index: sv-evidence
    title: Filters passed and precise breakpoints
    description: Per type, the share of events that pass the caller's own filters and the share whose breakpoints it placed to the base (the rest are IMPRECISE, located from read pairs only). Breakends and long events are usually the least precise.
    layout: {x: 3, y: 0, w: 3, h: 4}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: sv_calls
    visu_type: box
    mode: code
    code_content: |-
      # Caller QUAL per type, one box per type in the type colours, the events behind it as points.
      colors = depictio_category_colors.get('svtype') or {}
      d = df.filter(pl.col('primary') & pl.col('qual').is_not_null())
      fig = px.box(d.to_pandas(), x='svtype', y='qual', color='svtype', points='outliers', color_discrete_map=colors, category_orders={'svtype': d.select('svtype').unique().join(pl.DataFrame({'svtype': list(colors), 'r': list(range(len(colors)))}), on='svtype', how='left').sort('r', nulls_last=True)['svtype'].to_list()}, labels={'svtype': '', 'qual': 'QUAL'})
      fig.update_layout(margin=dict(t=10), showlegend=False)
    section: Size classes and evidence
    tag: sk-sv-fig-qual
    index: sv-qual
    title: Call quality by type
    description: The caller's QUAL per type (Tukey boxes). Each caller scales QUAL its own way, so compare types within one caller (the caller filter on the left).
    layout: {x: 6, y: 0, w: 2, h: 4}
  - component_type: table
    workflow_tag: sarek
    data_collection_tag: sv_calls
    section: SV table
    tag: sk-sv-table
    index: sv-table
    title: Structural variant records
    description: Locus, type, length, end, quality and FILTER, one row per record. A breakend is two rows, each naming the other side.
    layout: {x: 0, y: 0, w: 8, h: 6}
# ============================================================================
# Somatic
# ============================================================================
# The tumour/normal pairs and the tumours called on their own, read from the
# collections that hold no germline call: somatic_calls, cnv_segments, msi and
# the comparison with the normal's germline calls. Each is optional, so a run
# without a tumour keeps none of these three tabs, and a run whose paired callers
# found nothing has no Somatic calls tab (the VCFs are empty) while its
# copy-number and MSI files still feed the second one.
- title: Somatic calls
  subtitle: What did the tumour gain, and can the calls be trusted?
  tab_group: Somatic
  tab_order: 7
  tab_icon: mdi:target-variant
  tab_icon_color: yellow
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Somatic filters
    icon: mdi:filter-variant
    color: yellow
    description: Calling design, caller, type, callers in agreement and impact
  grid_sections:
  - name: Somatic at a glance
    icon: mdi:counter
    color: yellow
    description: Distinct variants, how many several callers agree on, the burden per megabase and the allele fraction
  - name: Who found them
    icon: mdi:set-merge
    color: yellow
    description: Calls each caller kept, and how often the callers agree on a variant
  - name: Allele fraction
    icon: mdi:chart-bell-curve
    color: yellow
    description: How much of the tumour's reads carry each variant, and whether the normal carries it too
  - name: Mutation spectrum
    icon: mdi:chart-bar
    color: yellow
    description: Which of the six single-base changes dominate
  - name: Impact on genes
    icon: mdi:dna
    color: yellow
    description: The variants that change a protein, ranked
  - name: Mutation burden
    icon: mdi:scale-balance
    color: yellow
    description: Somatic variants per megabase of the capture target
  - name: Somatic tables
    icon: mdi:table
    color: gray
    description: The merged variants, and the calls as each caller wrote them; a click centres the genome browser on a call
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      Somatic callers read a tumour against its matched normal and keep what the normal does not
      carry. This tab merges the calls that passed each caller's filters into one list of distinct
      variants, then asks, in order: who agrees on them, how much of the tumour's reads carry them,
      what kind of change they are, which genes they hit and how many there are per megabase.
      A tumour called without a normal has nothing subtracted and appears only in the call-level
      figure and table. [Germline vs somatic](tab:Germline vs somatic) checks the calls against the
      normal.
    tag: sk-som-intro
    index: som-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: somatic_calls
    interactive_component_type: MultiSelect
    column_name: unit_type
    column_type: object
    display:
      icon_name: mdi:account-multiple-outline
      custom_color: grape
    section: Somatic filters
    tag: sk-som-filter-design
    index: som-design-filter
    title: Calling design
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: somatic_calls
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: indigo
    section: Somatic filters
    tag: sk-som-filter-caller
    index: som-caller-filter
    title: Caller
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: somatic_calls
    interactive_component_type: MultiSelect
    column_name: variant_type
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: green
    section: Somatic filters
    tag: sk-som-filter-type
    index: som-type-filter
    title: Variant type
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: somatic_variants
    interactive_component_type: MultiSelect
    column_name: support
    column_type: object
    display:
      icon_name: mdi:set-merge
      custom_color: yellow
    section: Somatic filters
    tag: sk-som-filter-support
    index: som-support-filter
    title: Callers in agreement
    layout: {x: 0, y: 9, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: somatic_variants
    interactive_component_type: MultiSelect
    column_name: impact
    column_type: object
    display:
      icon_name: mdi:alert-circle-outline
      custom_color: red
    section: Somatic filters
    tag: sk-som-filter-impact
    index: som-impact-filter
    title: Impact
    layout: {x: 0, y: 12, w: 1, h: 3}
  # Somatic at a glance: four numbers over the distinct variants of the pairs.
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: somatic_variants
    aggregation: count
    column_name: variant_key
    column_type: object
    secondary_layout: composition
    breakdown_col: support
    display:
      icon_name: mdi:target-variant
      icon_color: yellow.4
      caption: distinct variants, by callers in agreement
      format: si
    section: Somatic at a glance
    tag: sk-som-kpi-variants
    index: som-kpi-variants
    title: Somatic variants
    description: Distinct variants (contig, position and alleles) that at least one somatic caller kept (FILTER PASS), the callers that made the same call merged. The bar splits them by how many callers kept each.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: somatic_variants
    aggregation: count
    column_name: variant_key
    column_type: object
    filter_expr: "col('consensus') == True"
    secondary_layout: composition
    breakdown_col: variant_type
    display:
      icon_name: mdi:set-merge
      icon_color: yellow.6
      caption: kept by 2+ callers, by type
      format: si
    section: Somatic at a glance
    tag: sk-som-kpi-consensus
    index: som-kpi-consensus
    title: Consensus variants
    description: Variants two callers or more kept. This is the set to trust and to quote; a variant one caller alone made is where the false positives live. The bar splits them by variant type.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: somatic_burden
    aggregation: median
    column_name: per_mb
    column_type: float64
    filter_expr: "col('basis_kind') == 'consensus'"
    display:
      icon_name: mdi:scale-balance
      icon_color: yellow.8
      caption: consensus variants per Mb of target
      decimals: 1
    section: Somatic at a glance
    tag: sk-som-kpi-burden
    index: som-kpi-burden
    title: Mutation burden
    description: Consensus variants divided by the megabases of the capture target (the summed length of the intervals the run was given), the median over the pairs in view. About 10 per megabase is the usual line for a high burden in an exome.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: somatic_variants
    aggregation: median
    column_name: tumour_vaf
    column_type: float64
    filter_expr: "col('consensus') == True"
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: yellow.9
      caption: median of consensus variants, with its spread
      decimals: 2
    section: Somatic at a glance
    tag: sk-som-kpi-vaf
    index: som-kpi-vaf
    title: Tumour allele fraction
    description: Median share of the tumour's reads that carry a consensus variant. A pure diploid tumour puts its clonal heterozygous variants near 0.5; a median far below that says low purity, subclonal variants or a copy gain.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Who found them
  - component_type: text
    body: >
      **Look at** how many calls each caller kept and how many callers back each variant.
      **Expect** most variants to be backed by two callers or more, and the callers to differ in how
      hard they filter, so their counts differ. **Worry if** a large share is backed by one caller
      alone: that is where false positives hide, and the consensus count is the safer figure.
    section: Who found them
    tag: sk-som-text-callers
    index: som-text-callers
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: somatic_calls
    visu_type: bar
    mode: code
    code_content: |-
      # PASS calls per caller, stacked by variant type, one panel per calling design. The calls a caller set aside (any FILTER but PASS) are not drawn: the call table has them. The colours are the variant-type colours of the dashboard.
      d = df.filter(pl.col('is_pass')).group_by(['unit_type', 'caller', 'variant_type']).agg(pl.len().alias('calls'))
      order = d.group_by('caller').agg(pl.col('calls').sum().alias('total')).sort('total', descending=True)['caller'].to_list()
      fig = px.bar(d.to_pandas(), x='caller', y='calls', color='variant_type', facet_col='unit_type', barmode='stack', category_orders={'caller': order, 'variant_type': ['SNP', 'INDEL', 'MNP']}, color_discrete_map=depictio_category_colors.get('variant_type') or {}, labels={'caller': '', 'calls': 'PASS calls', 'variant_type': 'Type', 'unit_type': 'Design'})
      fig.for_each_annotation(lambda a: a.update(text=a.text.split('=')[-1]))
      fig.update_xaxes(automargin=True)
      fig.update_layout(margin=dict(t=70), legend=dict(orientation='h', y=1.2, x=0))
    section: Who found them
    tag: sk-som-fig-callers
    index: som-callers-bar
    title: Calls each caller kept
    description: PASS calls per caller, one stacked bar per caller and one segment per variant type, one panel per calling design. A call is one caller's record, so a variant several callers made counts once for each.
    layout: {x: 0, y: 1, w: 4, h: 4}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: somatic_variants
    visu_type: bar
    mode: code
    code_content: |-
      # Distinct variants by the set of callers that kept them, the largest set first, coloured by how many callers are in the set. A set of one is a variant a single caller made.
      d = df.group_by(['callers', 'support']).agg(pl.len().alias('variants')).sort('variants')
      fig = px.bar(d.to_pandas(), x='variants', y='callers', color='support', orientation='h', text='variants', category_orders={'callers': d['callers'].to_list(), 'support': ['1 caller', '2 callers', '3 callers', '4 callers']}, color_discrete_map=depictio_category_colors.get('support') or {}, labels={'variants': 'Distinct variants', 'callers': '', 'support': 'Callers in agreement'})
      fig.update_traces(textposition='outside', cliponaxis=False)
      fig.update_yaxes(automargin=True)
      fig.update_layout(margin=dict(t=10, r=30), legend=dict(orientation='h', y=1.12, x=0, title_text=''))
    section: Who found them
    tag: sk-som-fig-overlap
    index: som-overlap-bar
    title: Which callers agree
    description: Each bar is one set of callers (joined with +) and counts the variants that exactly those callers kept. The colour is the size of the set; the lightest bars are the single-caller variants.
    layout: {x: 4, y: 1, w: 4, h: 4}
  # Allele fraction
  - component_type: text
    body: >
      **Look at** the share of the tumour's reads that carry each variant. **Expect** a mass around
      0.5 (a clonal heterozygous variant in a diploid, pure tumour), a second mass near 1 where the
      other copy was lost, and a tail under 0.2 of subclonal variants; calls backed by several
      callers should sit in the masses, and the normal should carry almost none of them.
      **Worry if** the whole distribution sits under 0.2 (low purity, or mostly noise), if the
      single-caller calls pile up at the far left, or if a visible share of variants has reads in the
      normal: that is germline leakage or a contaminated normal.
    section: Allele fraction
    tag: sk-som-text-vaf
    index: som-text-vaf
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: somatic_variants
    visu_type: histogram
    mode: code
    code_content: |-
      # Tumour allele fraction in bins of 0.04, stacked by how many callers kept the variant; the dotted line is 0.5, the clonal heterozygous position of a pure diploid tumour. The colours are the callers-in-agreement colours of the dashboard.
      d = df.select(['support', 'tumour_vaf', 'consensus']).drop_nulls('tumour_vaf')
      fig = px.histogram(d.to_pandas(), x='tumour_vaf', color='support', nbins=25, range_x=[0, 1], barmode='stack', category_orders={'support': ['4 callers', '3 callers', '2 callers', '1 caller']}, color_discrete_map=depictio_category_colors.get('support') or {}, labels={'tumour_vaf': 'Tumour allele fraction', 'support': 'Callers in agreement'})
      fig.update_traces(xbins=dict(start=0, end=1, size=0.04))
      fig.update_yaxes(title_text='Variants')
      fig.add_vline(x=0.5, line_dash='dot', line_color='#868e96', annotation_text='0.5', annotation_position='top')
      med = d.filter(pl.col('consensus'))['tumour_vaf'].median()
      if med is not None:
          fig.add_vline(x=med, line_color='#e67700', annotation_text='median of consensus ' + str(round(med, 2)), annotation_position='top right')
      fig.update_layout(margin=dict(t=30), legend=dict(orientation='h', y=1.15, x=0, title_text=''))
    section: Allele fraction
    tag: sk-som-fig-vaf
    index: som-vaf-hist
    title: Tumour allele fraction
    description: Distinct variants per allele-fraction bin, stacked by the number of callers that kept them. The dotted line is 0.5 and the solid one is the median of the consensus variants.
    layout: {x: 0, y: 1, w: 5, h: 4}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: somatic_variants
    visu_type: bar
    mode: code
    code_content: |-
      # Share of the variants of each callers-in-agreement group that have reads in the normal: trace (allele fraction 0.03 to 0.10) or germline-like (0.10 or more). A true somatic variant has none, so the bars should be small, and smaller the more callers agree.
      d = df.group_by(['support', 'normal_class']).agg(pl.len().alias('n')).with_columns((pl.col('n') / pl.col('n').sum().over('support') * 100).alias('share'))
      d = d.filter(pl.col('normal_class') != 'Clean in the normal')
      fig = px.bar(d.to_pandas(), x='support', y='share', color='normal_class', barmode='stack', custom_data=['n'], category_orders={'support': ['1 caller', '2 callers', '3 callers', '4 callers'], 'normal_class': ['Trace in the normal', 'Germline-like in the normal']}, color_discrete_map=depictio_category_colors.get('normal_class') or {}, labels={'support': '', 'share': 'Variants with reads in the normal (%)', 'normal_class': 'Normal'})
      fig.update_traces(hovertemplate='%{x}: %{y:.1f}% of its variants (%{customdata[0]})<extra>%{fullData.name}</extra>')
      fig.update_yaxes(ticksuffix='%')
      fig.update_layout(margin=dict(t=10), legend=dict(orientation='h', y=1.15, x=0, title_text=''))
    section: Allele fraction
    tag: sk-som-fig-normal
    index: som-normal-bar
    title: Reads in the normal
    description: Share of the variants that the normal also carries, by the number of callers that kept them. Trace is a normal allele fraction of 0.03 to 0.10, germline-like 0.10 or more.
    layout: {x: 5, y: 1, w: 3, h: 4}
  # Mutation spectrum
  - component_type: text
    body: >
      **Look at** which of the six single-base changes dominate (the reference taken as the
      pyrimidine, so C>T also counts G>A). **Expect** C>T to lead in most tumours (deamination of
      methylated cytosine, accumulating with age), with other classes rising under a mutagen: C>A with
      smoking, C>T and C>G with APOBEC activity; the consensus panel is the one to read.
      **Worry if** the single-caller panel looks different from the consensus one, above all an excess
      of C>A (oxidation during library preparation) or of C>T at low allele fraction (deamination of
      fixed tissue): that is the pattern of artefacts, not of mutations.
    section: Mutation spectrum
    tag: sk-som-text-spectrum
    index: som-text-spectrum
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: somatic_variants
    visu_type: bar
    mode: code
    code_content: |-
      # Share of the single-nucleotide variants in each of the six classes, one panel for the variants two callers or more kept and one for those a single caller made. The colours are the substitution colours of the dashboard.
      order = ['C>A', 'C>G', 'C>T', 'T>A', 'T>C', 'T>G']
      d = df.filter(pl.col('substitution').is_not_null()).with_columns(pl.when(pl.col('consensus')).then(pl.lit('2+ callers')).otherwise(pl.lit('1 caller')).alias('grp'))
      tot = d.group_by('grp').agg(pl.len().alias('total'))
      g = d.group_by(['grp', 'substitution']).agg(pl.len().alias('n')).join(tot, on='grp').with_columns((pl.col('n') / pl.col('total') * 100).alias('share'), (pl.col('grp') + pl.lit(' (') + pl.col('total').cast(pl.Utf8) + pl.lit(' SNVs)')).alias('panel')).sort(['panel', 'substitution'])
      fig = px.bar(g.to_pandas(), x='substitution', y='share', color='substitution', facet_col='panel', custom_data=['n'], category_orders={'substitution': order}, color_discrete_map=depictio_category_colors.get('substitution') or {}, labels={'substitution': '', 'share': 'Share of the SNVs (%)'})
      fig.update_traces(hovertemplate='%{x}: %{y:.1f}% (%{customdata[0]} variants)<extra></extra>')
      fig.for_each_annotation(lambda a: a.update(text=a.text.split('=')[-1]))
      fig.update_yaxes(ticksuffix='%')
      fig.update_layout(margin=dict(t=30), showlegend=False)
    section: Mutation spectrum
    tag: sk-som-fig-spectrum
    index: som-spectrum
    title: Substitution spectrum
    description: Share of the SNVs in each class, the reference folded onto the pyrimidine of the pair. Left, the variants a single caller made; right, those two callers or more kept. A trinucleotide (96-class) spectrum needs the reference sequence around each site and is not drawn.
    layout: {x: 0, y: 2, w: 8, h: 4}
  # Impact on genes
  - component_type: text
    body: >
      **Look at** the variants that change a protein: HIGH impact (a stop gained, a frameshift, a
      splice site) and MODERATE (a missense or an in-frame indel), ranked by impact, then by the callers
      in agreement, then by allele fraction. **Expect** a few percent of the variants to be
      protein-altering, mostly missense; most fall in introns, untranslated regions and between genes.
      **Worry if** the top of the list is backed by one caller, sits at a very low allele fraction or has
      reads in the normal: look at it in the genome browser before reporting it. Passengers
      outnumber drivers, so a long list is no evidence for one gene.
    section: Impact on genes
    tag: sk-som-text-genes
    index: som-text-genes
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    workflow_tag: sarek
    data_collection_tag: somatic_variants
    viz_kind: ranked_table
    config:
      viz_kind: ranked_table
      title_col: gene
      subtitle_col: hgvs_p
      score_col: priority
      columns:
      - {column: impact, label: Impact, display: badge}
      - {column: consequence, label: Consequence, display: text}
      - {column: callers, label: Callers, display: text}
      - {column: tumour_vaf, label: Tumour AF, display: bar, decimals: 2, min: 0, max: 1}
      - {column: normal_vaf, label: Normal AF, display: number, decimals: 2}
      labels:
        chrom: Contig
        pos: Position
        ref: Reference
        alt: Alternate
        tumour_dp: Tumour depth
        normal_dp: Normal depth
        n_callers: Callers in agreement
        normal_class: Normal
      popover_columns: [chrom, pos, ref, alt, n_callers, tumour_dp, normal_dp, normal_class]
      filter_col: impact
      filter_values: [HIGH, MODERATE]
      top_n: 25
      compact: true
    section: Impact on genes
    tag: sk-som-av-ranked
    index: som-genes-ranked
    title: Protein-altering somatic variants
    description: HIGH and MODERATE variants, ranked by impact, then by the number of callers that kept them, then by tumour allele fraction. Hover a row for the locus, the depths and what the normal holds.
    layout: {x: 0, y: 4, w: 8, h: 8}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: somatic_variants
    aggregation: count
    column_name: variant_key
    column_type: object
    filter_expr: "col('impact').is_in(['HIGH', 'MODERATE'])"
    secondary_layout: composition
    breakdown_col: impact
    display:
      icon_name: mdi:dna
      icon_color: yellow.6
      caption: HIGH and MODERATE variants
      format: si
    section: Impact on genes
    tag: sk-som-kpi-altering
    index: som-kpi-altering
    title: Protein-altering
    description: Variants SnpEff ranks HIGH (stop gained, frameshift, splice site) or MODERATE (missense, in-frame indel). The bar splits them by impact class.
    layout: {x: 0, y: 2, w: 4, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: somatic_variants
    aggregation: nunique
    column_name: gene
    column_type: object
    filter_expr: "col('impact').is_in(['HIGH', 'MODERATE'])"
    display:
      icon_name: mdi:format-list-bulleted
      icon_color: yellow.8
      caption: genes hit by a protein-altering variant
      format: si
    section: Impact on genes
    tag: sk-som-kpi-genes
    index: som-kpi-genes
    title: Genes hit
    description: Distinct genes with at least one HIGH or MODERATE somatic variant.
    layout: {x: 4, y: 2, w: 4, h: 2}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: somatic_variants
    visu_type: bar
    mode: code
    code_content: |-
      # The twelve commonest consequences of the variants inside genes (HIGH, MODERATE and LOW; MODIFIER is every call outside a coding sequence), coloured by SnpEff's impact class.
      d = df.filter(pl.col('impact').is_in(['HIGH', 'MODERATE', 'LOW'])).group_by(['consequence', 'impact']).agg(pl.len().alias('variants')).with_columns(pl.col('consequence').str.replace_all('_', ' ').alias('label')).sort('variants').tail(12)
      fig = px.bar(d.to_pandas(), x='variants', y='label', color='impact', orientation='h', text='variants', category_orders={'label': d['label'].to_list(), 'impact': ['HIGH', 'MODERATE', 'LOW']}, color_discrete_map=depictio_category_colors.get('impact') or {}, labels={'variants': 'Variants', 'label': '', 'impact': 'Impact'})
      fig.update_traces(textposition='outside', cliponaxis=False)
      fig.update_yaxes(automargin=True)
      fig.update_layout(margin=dict(t=10, r=30), legend=dict(orientation='h', y=1.1, x=0, title_text=''))
    section: Impact on genes
    tag: sk-som-fig-consequence
    index: som-consequence-bar
    title: Consequences in genes
    description: Variants per consequence, coloured by impact class. Silent changes (synonymous) are the LOW class and are expected to outnumber the stops and frameshifts many times over.
    layout: {x: 0, y: 12, w: 8, h: 5}
  # Mutation burden
  - component_type: text
    values:
      mb: {dc: somatic_burden, column: target_mb, aggregation: median, format: 'decimals:1'}
    body: >
      **Look at** the variants per megabase of the capture target. The denominator is the summed length of
      the intervals the run was given, {{mb}} Mb here, so the burden of an exome is not comparable to a
      per-genome count. **Expect** a few per megabase in most solid tumours and well under one in
      some; about 10 per megabase is the usual line for a high burden, and mismatch-repair deficient or
      hypermutated tumours go far above it. **Worry if** the callers disagree widely: the consensus bar
      is the figure to quote, and a gap between it and one caller is that caller's false positives or
      its sensitivity.
    section: Mutation burden
    tag: sk-som-text-burden
    index: som-text-burden
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: somatic_burden
    visu_type: bar
    mode: code
    code_content: |-
      # Somatic variants per megabase of the capture target, by the set of variants counted: the consensus (two callers or more), every caller's calls, and each caller alone, largest first, with the 10 per megabase line. Without a target size the counts are drawn instead.
      d = df.group_by('basis').agg(pl.col('per_mb').median().alias('per_mb'), pl.col('variants').sum().alias('variants'))
      per_mb = d['per_mb'].null_count() == 0
      col = 'per_mb' if per_mb else 'variants'
      d = d.sort(col)
      cmap = dict(depictio_category_colors.get('caller') or {})
      cmap['consensus (2+ callers)'] = '#e67700'
      cmap['any caller'] = '#ffd43b'
      fig = px.bar(d.to_pandas(), x=col, y='basis', color='basis', orientation='h', text_auto='.1f' if per_mb else True, custom_data=['variants'], category_orders={'basis': d['basis'].to_list()}, color_discrete_map=cmap, labels={'per_mb': 'Variants per megabase of target', 'variants': 'Variants', 'basis': ''})
      fig.update_traces(textposition='outside', cliponaxis=False, hovertemplate='%{y}: %{customdata[0]} variants<extra></extra>')
      if per_mb:
          fig.add_vline(x=10, line_dash='dot', line_color='#868e96', annotation_text='10 per Mb', annotation_position='top')
      fig.update_yaxes(automargin=True)
      fig.update_layout(margin=dict(t=30, r=30), showlegend=False)
    section: Mutation burden
    tag: sk-som-fig-burden
    index: som-burden-bar
    title: Burden by set of calls
    description: Variants per megabase for the consensus, for the union of the callers and for each caller alone, the median over the pairs in view. The dotted line is the usual 10 per megabase line for a high burden.
    layout: {x: 0, y: 1, w: 5, h: 4}
