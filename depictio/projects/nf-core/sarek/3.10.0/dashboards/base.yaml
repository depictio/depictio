  # --------------------------------------------------------------- annotation
  - component_type: text
    tag: sk-qc-annot-intro
    section: Annotation
    title: What kind of variants were called
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [SnpEff](https://pcingola.github.io/SnpEff/) and
      [VEP](https://www.ensembl.org/info/docs/tools/vep/index.html) both
      annotate the same calls with different vocabularies; SnpEff's impact
      classes and VEP's SIFT/PolyPhen predictions are two lenses on the same
      set of consequences. The Consequences and Genes tabs read SnpEff's own
      output files rather than these panels.
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: sk-qc-snpeff-impact
    section: Annotation
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    selected_module: snpeff
    selected_plot: Variant Effects by Impact
    use: multiqc/snpeff
    title: Effects by impact
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: sk-qc-snpeff-region
    section: Annotation
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    selected_module: snpeff
    selected_plot: Variants by Genomic Region
    use: multiqc/snpeff
    title: Variants by genomic region
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: sk-qc-vep-general
    section: Annotation
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    selected_module: vep
    selected_plot: General Statistics
    use: multiqc/vep
    title: VEP general statistics
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: sk-qc-vep-sift
    section: Annotation
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    selected_module: vep
    selected_plot: SIFT summary
    use: multiqc/vep
    title: SIFT summary
    title_size: sm
    title_align: left
    layout: {x: 4, y: 7, w: 4, h: 5}

  # ------------------------- sample sheet: the run in four numbers, every tab
  - component_type: text
    tag: sk-sheet-intro
    section: Sample sheet
    title: The design behind every panel, and the run in four numbers
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One individual, NA12878, sequenced twice: the same Agilent exome library
      at 75M and at 200M reads. The depth is the only factor this run varies,
      so it is the persistent filter beside the sample picker, and the reason
      every caller comparison below reads as depth sensitivity.
    workflow_tag: sarek
    data_collection_tag: samples
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: sk-glance-card-snps
    index: sk-glance-card-snps
    section: Run at a glance
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    aggregation: sum
    column_name: n_snps
    column_type: int64
    secondary_layout: top_n
    breakdown_col: caller
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: SNPs called
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: sk-glance-card-indels
    index: sk-glance-card-indels
    section: Run at a glance
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    aggregation: median
    aggregations: [box_plot_stats]
    column_name: n_indels
    column_type: int64
    secondary_layout: box_plot
    display: {icon_name: 'mdi:chart-box-outline', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Indels per callset
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: sk-glance-card-depth
    index: sk-glance-card-depth
    section: Run at a glance
    workflow_tag: sarek
    data_collection_tag: samples
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: donut
    breakdown_col: read_depth_label
    display: {icon_name: 'mdi:test-tube', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Samples by depth
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: sk-glance-card-tstv
    index: sk-glance-card-tstv
    section: Run at a glance
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_tstv
    use: bcftools/stats_tstv
    aggregation: average
    column_name: ts_tv
    column_type: float64
    secondary_layout: threshold
    threshold_value: 1.8
    threshold_direction: min
    threshold_warn: 1.5
    display: {icon_name: 'mdi:scale-balance', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mean Ts/Tv
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: table
    tag: sk-sheet-table-samples
    section: Sample sheet
    workflow_tag: sarek
    data_collection_tag: samples
    row_selection_enabled: false
    title: Sample hub
    description: One row per sample, with patient, status and read-depth condition.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 3}

  # -------------------------------------------------------- reference tables
  - component_type: text
    tag: sk-ref-intro
    section: Reference tables
    title: The rows behind every panel
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The per-sample, per-caller variant-count summary the Ts/Tv slider in
      the left panel reads. The caller comparison itself starts on the Variant
      yield tab.
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: sk-ref-table-summary
    section: Reference tables
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    row_selection_enabled: false
    title: Per-caller variant counts
    description: SNPs, indels and multiallelic sites, one row per sample and caller.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 4}

  # ---------------------------------------------------------------- filters
  - component_type: interactive
    tag: sk-filter-sample
    index: sk-sample-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: sarek
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:test-tube'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: sk-filter-depth
    index: sk-depth-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: sarek
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: read_depth_label
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:ruler'}
    placement: left
    title: Read depth
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: sk-filter-tstv
    index: sk-tstv-range
    section: QC thresholds
    group: Variant-call scope
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_tstv
    interactive_component_type: RangeSlider
    column_name: ts_tv
    column_type: float64
    show_histogram: true
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:scale-balance'}
    placement: left
    title: Ts/Tv ratio
    layout: {x: 0, y: 0, w: 1, h: 3}

  # Tab-local, not persistent: this tab's own control beside the pinned ones.
  # It narrows the pinned glance strip and the reference table that ride it.
  - component_type: interactive
    tag: sk-mq-filter-caller
    index: sk-mq-caller-filter
    section: Glance scope
    group: Caller
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    interactive_component_type: Select
    column_name: caller
    column_type: object
    display: {title_size: md, custom_color: '#FB8C00', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Variant caller
    layout: {x: 0, y: 0, w: 1, h: 3}

tabs:
# ============================================================================
# Cohort QC
# ============================================================================
# mosdepth ran twice per sample, on the duplicate-marked and on the
# recalibrated CRAM, and wrote a per-contig summary and a per-target bed. The
# bed is 212k targets per sample and stage. mosdepth_regions bins it to 1 Mb
# windows (mosdepth_windows renames them to chrom / pos) for the genome-wide
# navigator; mosdepth_targets keeps it per target for the depth track under it,
# which is only ever read narrowed to a region.
# The sex check is mosdepth's X/Y coverage as MultiQC exported it.
#
# Locus section (plan C.5): one genome_view navigator on mosdepth_windows opens
# on the TP53 neighbourhood and drives three tracks through the region links in
# template.yaml (per-target depth, the calls with the hg38 gene lane) and
# through follow_region_filter (the annotated VCFs read from their files).
# coverage_track and genome_view never share a collection here, which
# test_no_double_track_binding enforces.
- title: Cohort QC
  subtitle: How deeply the Agilent exome was covered, contig by contig and target by target, with the calls on the same axis
  tab_order: 2
  tab_icon: mdi:chart-bell-curve
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Coverage scope
    icon: mdi:filter-variant
    color: blue
    description: Which mosdepth pass and which contigs to keep in view; the pass reaches the navigator and the per-contig summary
  grid_sections:
  - name: Coverage at a glance
    icon: mdi:counter
    color: blue
    description: The four numbers that size the run's coverage
  - name: One locus, three tracks
    icon: mdi:dna
    color: indigo
    description: A depth navigator driving the per-target depth, the calls over the genes and the annotated VCFs on one axis
  - name: Depth per contig
    icon: mdi:chart-bar
    color: cyan
    description: mosdepth's own per-contig summary, over the whole contig and over the targets
  - name: Sex check
    icon: mdi:chart-scatter-plot
    color: grape
    description: X against Y coverage, and the sex the ratio implies
  - name: Duplication and mapping
    icon: mdi:check-decagram
    color: teal
    description: What MarkDuplicates and samtools made of the same alignments
  components:
  - component_type: text
    tag: sk-cov-intro
    section: Coverage at a glance
    title: Coverage is the ceiling on everything that follows
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A germline caller cannot report what was not sequenced, so the depth
      profile below is the honest bound on every caller comparison further in.
      The 200M library sits around two and a half times the depth of the 75M
      one, which is what makes the two a sensitivity pair rather than a
      replicate pair.
    workflow_tag: sarek
    data_collection_tag: mosdepth_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: sk-cov-card-mean
    index: sk-cov-card-mean
    section: Coverage at a glance
    workflow_tag: sarek
    data_collection_tag: mosdepth_summary
    use: mosdepth/summary
    aggregation: median
    aggregations: [box_plot_stats]
    column_name: mean_depth
    column_type: float64
    secondary_layout: box_plot
    display: {icon_name: 'mdi:chart-box-outline', icon_color: '#1E88E5', title_color: '#1E88E5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Depth per contig
    layout: {x: 0, y: 2, w: 2, h: 2}
  # Per-target depth over the whole exome. Cards do not read a genome_selection
  # region, so these stay run-wide while the locus section below narrows.
  - component_type: card
    tag: sk-cov-card-window
    index: sk-cov-card-window
    section: Coverage at a glance
    workflow_tag: sarek
    data_collection_tag: mosdepth_targets
    aggregation: median
    aggregations: [box_plot_stats]
    column_name: depth
    column_type: float64
    secondary_layout: box_plot
    display: {icon_name: 'mdi:chart-line', icon_color: '#3949AB', title_color: '#3949AB', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Depth per capture target
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sk-cov-card-targets
    index: sk-cov-card-targets
    section: Coverage at a glance
    workflow_tag: sarek
    data_collection_tag: mosdepth_targets
    aggregation: sum
    column_name: target_bp
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample_stage
    top_n_count: 4
    display: {icon_name: 'mdi:map-marker-outline', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Captured bases per lane
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sk-cov-card-xy
    index: sk-cov-card-xy
    section: Coverage at a glance
    workflow_tag: sarek
    data_collection_tag: mosdepth_xy_sex_check
    use: mosdepth/xy_sex_check
    aggregation: average
    column_name: xy_ratio
    column_type: float64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 4
    display: {icon_name: 'mdi:scale-balance', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: X to Y ratio
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: text
    tag: sk-cov-track-intro
    section: One locus, three tracks
    title: The TP53 neighbourhood, depth and calls on one axis
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The section opens on chr17:7,400,000-8,000,000 around TP53. The navigator
      is mean depth in 1 Mb windows over the whole genome; type a locus or a
      gene in its header, or brush its axis, and the tracks below follow: depth
      per capture target for each sample and pass, the calls of each caller
      over the hg38 genes, and the annotated VCFs read from their files. Look
      for Pro72Arg at chr17:7,676,154: four callers make it, and HaplotypeCaller
      filters it at 200M reads while passing it at 75M.
    workflow_tag: sarek
    data_collection_tag: mosdepth_windows
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: sk-cov-av-genome
    index: sk-cov-av-genome
    section: One locus, three tracks
    workflow_tag: sarek
    data_collection_tag: mosdepth_windows
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      controls_placement: header
      chr_col: chrom
      pos_col: pos
      end_col: end
      score_col: depth
      feature_col: sample_stage
      mark: rect
      assembly: hg38
      score_title: mean depth
      opacity: 0.8
      default_region: "chr17:7,400,000-8,000,000"
      region_filter_enabled: true
    title: Depth navigator, 1 Mb windows
    description: Target-length-weighted mean depth per megabase window on the hg38 axis. The locus field in the header (a region or a gene symbol) and a brush on this axis move every track below.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 3}
  - component_type: advanced_viz
    tag: sk-cov-av-track
    index: sk-cov-av-track
    section: One locus, three tracks
    workflow_tag: sarek
    data_collection_tag: mosdepth_targets
    viz_kind: coverage_track
    config:
      viz_kind: coverage_track
      chromosome_col: chrom
      position_col: pos
      end_col: end
      value_col: depth
      sample_col: sample_stage
      view_mode: facet
      color_by: sample
      mark: rect
      smoothing_window: 0
      show_annotation_lane: false
      view: track
      views: [track]
    title: Depth per capture target
    description: One lane per sample and mosdepth pass, one bar per capture target at its mean depth, clamped to the navigator's region. The gaps are the genome between exons, not drop-outs.
    title_size: h3
    layout: {x: 0, y: 5, w: 8, h: 4}
  - component_type: advanced_viz
    tag: sk-cov-av-calls
    index: sk-cov-av-calls
    section: One locus, three tracks
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    use: vcf/variant_genome_view
    config:
      mark: point
      assembly: hg38
      annotation: hg38
      score_title: variant allele fraction
      point_size: 5
      facet_by_sample: true
      max_facets: 5
      region_filter_enabled: false
      follow_region_filter: true
    title: Calls over the genes, one lane per caller
    description: Every call in the region at its allele fraction, one lane per caller, over the bundled hg38 gene lane. Heterozygous calls sit near 0.5, homozygous ones near 1.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 5}
  - component_type: advanced_viz
    tag: sk-cov-av-vcf
    index: sk-cov-av-vcf
    section: One locus, three tracks
    workflow_tag: sarek
    data_collection_tag: snpeff_vcf_files
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      source: file
      chr_col: chrom
      pos_col: pos
      assembly: hg38
      point_size: 6
      file_max_lanes: 8
      region_filter_enabled: false
      follow_region_filter: true
    title: The annotated VCFs, read from the files
    description: The snpEff-annotated VCF of each callset, range-read by the browser through its tabix index for the window in view, one lane per callset. It starts fetching below 1 Mb, which the default region already is.
    title_size: h3
    layout: {x: 0, y: 14, w: 8, h: 5}

  - component_type: text
    tag: sk-cov-contig-intro
    section: Depth per contig
    title: Whole contig against capture targets
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      mosdepth reports each contig twice when it runs with a capture bed: over
      the whole contig, where an exome reads a few reads per base, and over the
      targets on it, where it reads its real depth. The scope picker in the
      left panel switches between the two.
    workflow_tag: sarek
    data_collection_tag: mosdepth_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: sk-cov-fig-contig
    section: Depth per contig
    workflow_tag: sarek
    data_collection_tag: mosdepth_summary
    use: mosdepth/summary
    visu_type: bar
    dict_kwargs: {x: chrom, y: mean_depth, color: sample, barmode: group}
    title: Mean depth per contig
    description: One bar per sample. chrY reads close to zero on a female sample, which is the sex check below said differently.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 6}
  - component_type: table
    tag: sk-cov-table-contig
    section: Depth per contig
    workflow_tag: sarek
    data_collection_tag: mosdepth_summary
    use: mosdepth/summary
    row_selection_enabled: false
    title: Per-contig coverage summary
    description: Mean, minimum and maximum depth per contig, for both mosdepth passes and both scopes.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 8, w: 8, h: 6}

  - component_type: text
    tag: sk-cov-sex-intro
    section: Sex check
    title: X against Y coverage
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A male sample carries one X and one Y, so its X and Y depths land within
      a factor of two of each other; a female sample carries two X and no Y, so
      the ratio runs into the tens. The label is a heuristic read of that
      ratio, not a genotype call.
    workflow_tag: sarek
    data_collection_tag: mosdepth_xy_sex_check
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: sk-cov-av-sex
    index: sk-cov-av-sex
    section: Sex check
    workflow_tag: sarek
    data_collection_tag: mosdepth_xy_sex_check
    use: mosdepth/sex_check_scatter
    config:
      x_title: chromosome X mean depth
      y_title: chromosome Y mean depth
      reference_line: diagonal
      marker_size: 14
    title: X depth against Y depth
    description: One point per sample and mosdepth pass. A point far above the diagonal is a sample with two X chromosomes and no Y.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 6}
  - component_type: table
    tag: sk-cov-table-sex
    section: Sex check
    workflow_tag: sarek
    data_collection_tag: mosdepth_xy_sex_check
    use: mosdepth/xy_sex_check
    row_selection_enabled: false
    title: X and Y coverage per sample
    description: The four rows behind the plot above.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 8, w: 8, h: 3}

  - component_type: text
    tag: sk-cov-dup-intro
    section: Duplication and mapping
    title: What the same alignments looked like before the depth was measured
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      GATK4 MarkDuplicates and samtools ran on the CRAMs mosdepth then read, so
      their numbers bound the coverage above: a library whose duplicate
      fraction rises does not gain depth by being sequenced deeper.
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: sk-cov-mqc-dup
    section: Duplication and mapping
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    selected_module: picard
    selected_plot: Mark Duplicates
    use: multiqc/picard
    title: Duplication
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: sk-cov-mqc-mapped
    section: Duplication and mapping
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    selected_module: samtools
    selected_plot: Percent mapped
    use: multiqc/samtools
    title: Percent mapped
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: sk-cov-mqc-insert
    section: Duplication and mapping
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    selected_module: samtools
    selected_plot: Insert size distribution
    use: multiqc/samtools
    title: Insert size distribution
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 8, h: 5}

  - component_type: interactive
    tag: sk-cov-filter-stage
    index: sk-cov-stage-filter
    section: Coverage scope
    group: Coverage scope
    workflow_tag: sarek
    data_collection_tag: mosdepth_windows
    interactive_component_type: Select
    column_name: stage
    column_type: object
    display: {title_size: md, custom_color: '#1E88E5', icon_name: 'mdi:tune'}
    placement: left
    title: mosdepth pass
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: sk-cov-filter-chrom
    index: sk-cov-chrom-filter
    section: Coverage scope
    group: Coverage scope
    workflow_tag: sarek
    data_collection_tag: mosdepth_windows
    interactive_component_type: MultiSelect
    column_name: chrom
    column_type: object
    display: {title_size: md, custom_color: '#3949AB', icon_name: 'mdi:dna'}
    placement: left
    title: Contig
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: sk-cov-filter-scope
    index: sk-cov-scope-filter
    section: Coverage scope
    group: Coverage scope
    workflow_tag: sarek
    data_collection_tag: mosdepth_summary
    interactive_component_type: Select
    column_name: scope
    column_type: object
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Contig or targets
    layout: {x: 0, y: 6, w: 1, h: 3}

# ============================================================================
# Variant yield
# ============================================================================
# Everything the five callers' own summary reports carry, compared caller
# against caller: record counts and Ts/Tv from bcftools stats, the FILTER
# partition and the quality sweep from VCFtools, and the distribution blocks
# bcftools writes but no MultiQC panel breaks out per caller.
- title: Variant yield
  subtitle: How much each of the five germline callers called, and what its own filters kept
  tab_order: 3
  tab_icon: mdi:dna
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Caller scope
    icon: mdi:filter-variant
    color: grape
    description: Which caller to keep in view
  - name: Distribution scope
    icon: mdi:tune
    color: violet
    description: Which bcftools block and which FILTER partition to read
  grid_sections:
  - name: Caller yield
    icon: mdi:counter
    color: grape
    description: Total variant, SNP and indel counts, pooled across callers and samples
  - name: SNPs and indels by caller
    icon: mdi:chart-bar
    color: indigo
    description: Every caller's record counts side by side
  - name: Mutation spectra
    icon: mdi:chart-bar
    color: violet
    description: The substitution classes behind each caller's Ts/Tv, and its indel lengths, as shares of its own calls
  - name: Callset QC profile
    icon: mdi:chart-timeline-variant
    color: blue
    description: Eight QC numbers per callset on one plot, one line per sample and caller
  - name: Filters and what they cost
    icon: mdi:filter-variant
    color: orange
    description: How each caller's own FILTER column partitions its calls
  - name: Quality calibration
    icon: mdi:chart-line
    color: red
    description: Where each caller's quality score stops separating variants from noise
  - name: Distributions
    icon: mdi:chart-bell-curve
    color: cyan
    description: The indel-length, substitution, depth and allele-frequency blocks of bcftools stats
  - name: Variant tables
    icon: mdi:table
    color: gray
    description: The rows behind the panels on this tab
    collapsed: true
  components:
  - component_type: text
    tag: sk-vc-intro
    section: Caller yield
    title: Five callers, one exome, two depths
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      DeepVariant, FreeBayes, HaplotypeCaller and Strelka call SNPs and indels;
      Manta calls structural variants and reports a few dozen events rather
      than tens of thousands, which is why its cards read close to zero rather
      than missing. Germline exome calls usually land near Ts/Tv 2.0 to 2.1,
      and Manta reads 0.0 because it has almost no SNP to score a ratio on.
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: sk-vc-card-snps
    index: sk-vc-card-snps
    section: Caller yield
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    aggregation: sum
    column_name: n_snps
    column_type: int64
    secondary_layout: top_n
    breakdown_col: caller
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: SNPs called
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sk-vc-card-indels
    index: sk-vc-card-indels
    section: Caller yield
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    aggregation: sum
    column_name: n_indels
    column_type: int64
    secondary_layout: top_n
    breakdown_col: caller
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Indels called
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sk-vc-card-pass
    index: sk-vc-card-pass
    section: Caller yield
    workflow_tag: sarek
    data_collection_tag: vcftools_filter_summary
    use: vcftools/filter_summary
    aggregation: average
    column_name: pct_of_calls
    column_type: float64
    secondary_layout: donut
    breakdown_col: filter_label
    display: {icon_name: 'mdi:chart-donut', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Calls by FILTER
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sk-vc-card-tstv
    index: sk-vc-card-tstv
    section: Caller yield
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_tstv
    use: bcftools/stats_tstv
    aggregation: average
    column_name: ts_tv
    column_type: float64
    secondary_layout: threshold
    threshold_value: 1.8
    threshold_direction: min
    threshold_warn: 1.5
    display: {icon_name: 'mdi:scale-balance', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mean Ts/Tv
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: text
    tag: sk-vc-counts-intro
    section: SNPs and indels by caller
    title: Record counts, caller by caller
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      DeepVariant and HaplotypeCaller call the most SNPs; FreeBayes also
      reports MNPs, which is counted separately from its indels. The dot plot
      puts all five on one plane: size is the SNP fraction of each caller's
      records, colour is log10 of the record count, so Manta still reads on the
      same plot as callers two orders of magnitude above it.
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: sk-vc-av-dotplot
    index: sk-vc-av-dotplot
    section: SNPs and indels by caller
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    use: bcftools/caller_yield_dotplot
    config:
      controls_placement: header
      colour_scale: Viridis
      gene_sort: name
      cluster_sort: name
      max_dot_size: 30
      annotate_top_n: 0
    title: Caller yield and SNP fraction, per sample
    description: One dot per sample and caller. Colour is log10 of the total record count, size the fraction of those records that are SNPs.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 5}
  - component_type: figure
    tag: sk-vc-fig-snps
    section: SNPs and indels by caller
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    visu_type: bar
    dict_kwargs: {x: caller, y: n_snps, color: sample, barmode: group}
    title: SNPs called per caller
    description: One bar per sample; the gap between the two bars of a caller is what the extra 125M reads bought it.
    title_size: h3
    layout: {x: 0, y: 7, w: 4, h: 6}
  - component_type: figure
    tag: sk-vc-fig-indels
    section: SNPs and indels by caller
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    visu_type: bar
    dict_kwargs: {x: caller, y: n_indels, color: sample, barmode: group}
    title: Indels called per caller
    description: One bar per sample. FreeBayes' MNP calls are counted separately from its indels, which is why they do not add up to its SNP and indel total.
    title_size: h3
    layout: {x: 4, y: 7, w: 4, h: 6}

  - component_type: text
    tag: sk-vc-spectra-intro
    section: Mutation spectra
    title: Ts/Tv drawn as the bars it is made of
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each callset is normalised to its own total, so the bars compare shapes,
      not yields. C to T and T to C are the transitions; a germline exome is
      dominated by them, and a caller whose four transversion bars rise is the
      one with the lower Ts/Tv. DeepVariant's lower ratio comes from the
      RefCall records it keeps in the VCF. Indels read left to right from
      deletions to insertions; single-base events dominate every caller.
    workflow_tag: sarek
    data_collection_tag: bcftools_substitution_spectrum
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: sk-vc-fig-sbs
    section: Mutation spectra
    workflow_tag: sarek
    data_collection_tag: bcftools_substitution_spectrum
    visu_type: bar
    dict_kwargs: {x: substitution_class, y: fraction, color: callset, barmode: group}
    title: Substitution spectrum, six pyrimidine classes
    description: Share of each callset's SNVs per class, strand-folded onto the pyrimidine reference. C to T and T to C are transitions, the other four transversions.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 6}
  - component_type: figure
    tag: sk-vc-fig-indel-length
    section: Mutation spectra
    workflow_tag: sarek
    data_collection_tag: bcftools_indel_spectrum
    visu_type: bar
    dict_kwargs: {x: length, y: fraction, color: callset, barmode: group}
    title: Indel length spectrum, deletions negative
    description: Share of each callset's indels at each length within 20 bp. Manta is left out, its events are longer than the window.
    title_size: h3
    layout: {x: 0, y: 8, w: 8, h: 6}

  - component_type: text
    tag: sk-vc-profile-intro
    section: Callset QC profile
    title: Eight QC numbers, one line per callset
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One polyline per sample and caller across record count, SNP fraction,
      Ts/Tv, multiallelic share, PASS share, het to hom ratio, median depth and
      median heterozygous allele fraction. Lines of one caller that run
      parallel at both depths are a caller behaving consistently; brush an axis
      to keep the callsets inside a range. Manta has no SNV and is left out.
    workflow_tag: sarek
    data_collection_tag: callset_qc
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: sk-vc-av-profile
    index: sk-vc-av-profile
    section: Callset QC profile
    workflow_tag: sarek
    data_collection_tag: callset_qc
    viz_kind: parallel_coordinates
    config:
      viz_kind: parallel_coordinates
      controls_placement: header
      sample_col: callset
      group_col: caller
      scale: minmax
      metric_cols: [n_records, snp_fraction, ts_tv, multiallelic_pct, pass_pct, het_hom_ratio, median_dp, median_het_vaf]
    title: Callset QC profile
    description: Each axis is rescaled so the axes are comparable while the tick labels keep their units. Colour is the caller.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 8}

  - component_type: text
    tag: sk-vc-filter-intro
    section: Filters and what they cost
    title: What each caller threw away
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A caller's FILTER column is its own judgement on its own calls, and the
      partitions have very different Ts/Tv: DeepVariant's RefCall bucket sits
      near 0.3, which is what a bucket of noise looks like, while its PASS
      bucket sits above 2.5. The table gives every partition its ratio.
    workflow_tag: sarek
    data_collection_tag: vcftools_filter_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: sk-vc-fig-filter
    section: Filters and what they cost
    workflow_tag: sarek
    data_collection_tag: vcftools_filter_summary
    use: vcftools/filter_summary
    visu_type: bar
    dict_kwargs: {x: caller, y: n_variants, color: filter_label, barmode: stack}
    title: Calls per FILTER partition
    description: The height of a bar is everything the caller wrote; the PASS slice is what it stands behind.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 6}
  - component_type: table
    tag: sk-vc-table-filter
    section: Filters and what they cost
    workflow_tag: sarek
    data_collection_tag: vcftools_filter_summary
    use: vcftools/filter_summary
    row_selection_enabled: false
    title: FILTER breakdown per caller
    description: Calls, transitions, transversions and their ratio, one row per sample, caller and FILTER value.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 8, w: 8, h: 6}

  - component_type: text
    tag: sk-vc-qual-intro
    section: Quality calibration
    title: Where a caller's quality score stops meaning anything
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each curve is the Ts/Tv of the calls above a rising quality floor. A
      well-calibrated caller climbs toward the expected exome ratio and then
      flattens; the height of the flat part is the ceiling its score can reach,
      and where it flattens is the floor beyond which raising the threshold
      only costs sensitivity.
    workflow_tag: sarek
    data_collection_tag: vcftools_tstv_qual
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: sk-vc-av-qual
    index: sk-vc-av-qual
    section: Quality calibration
    workflow_tag: sarek
    data_collection_tag: vcftools_tstv_qual
    use: vcftools/tstv_quality_sweep
    config:
      x_title: quality floor
      y_title: Ts/Tv above the floor
    title: Ts/Tv against the quality floor
    description: One curve per sample and caller, decimated to 200 steps. The callers use different quality scales, so read the shape rather than the x position.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}

  - component_type: text
    tag: sk-vc-dist-intro
    section: Distributions
    title: The blocks bcftools writes and no panel breaks out per caller
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One long table holds the indel-length, substitution, quality, depth,
      allele-frequency and singleton blocks of every caller's bcftools stats
      report. Pick a block in the left panel: the quality block alone is 97
      percent of the rows, so the bar plot is unreadable until one is chosen.
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_sections
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: sk-vc-fig-dist
    section: Distributions
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_sections
    use: bcftools/stats_sections
    visu_type: bar
    dict_kwargs: {x: bin, y: count, color: caller, barmode: group}
    title: The chosen distribution, caller by caller
    description: The numeric blocks plot against their bin; the substitution and singleton blocks carry a label instead and read in the table below.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 6}
  - component_type: table
    tag: sk-vc-table-dist
    section: Distributions
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_sections
    use: bcftools/stats_sections
    row_selection_enabled: false
    title: bcftools stats distributions
    description: One row per sample, caller, block and bin. Filter to a block in the left panel before reading it.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 8, w: 8, h: 7}

  - component_type: text
    tag: sk-vc-tables-intro
    section: Variant tables
    title: The rows behind the panels above
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Both tables are filtered by the sample and caller pickers in the left
      panel and by the Ts/Tv floor pinned at the bottom of every tab.
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: sk-vc-table-summary
    section: Variant tables
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    row_selection_enabled: false
    title: Per-caller variant counts
    description: SNPs, indels, MNPs, others and multiallelic sites, one row per sample and caller.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 5}
  - component_type: table
    tag: sk-vc-table-tstv
    section: Variant tables
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_tstv
    use: bcftools/stats_tstv
    row_selection_enabled: false
    title: Per-caller Ts/Tv
    description: Transitions, transversions and their ratio, one row per sample and caller.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 7, w: 8, h: 5}

  - component_type: interactive
    tag: sk-vc-filter-caller
    index: sk-vc-caller-filter
    section: Caller scope
    group: Callers
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:dna'}
    placement: left
    title: Caller
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: sk-vc-filter-section
    index: sk-vc-section-filter
    section: Distribution scope
    group: Distributions
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_sections
    interactive_component_type: Select
    column_name: section
    column_type: object
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:chart-bell-curve'}
    placement: left
    title: bcftools block
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: sk-vc-filter-filterlabel
    index: sk-vc-filterlabel-filter
    section: Distribution scope
    group: Distributions
    workflow_tag: sarek
    data_collection_tag: vcftools_filter_summary
    interactive_component_type: MultiSelect
    column_name: filter_label
    column_type: object
    display: {title_size: md, custom_color: '#FB8C00', icon_name: 'mdi:filter-variant'}
    placement: left
    title: FILTER value
    layout: {x: 0, y: 3, w: 1, h: 3}

# ============================================================================
# Caller concordance
# ============================================================================
# The first tab that reads the VCFs themselves. One row per call, so the
# comparison is per variant rather than per count: which callsets claim the
# same locus and allele, and which genes they agree are hit.
- title: Caller concordance
  subtitle: Which calls the five callers share, and what the extra 125M reads added
  tab_order: 4
  tab_icon: mdi:set-merge
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Call scope
    icon: mdi:filter-variant
    color: teal
    description: Which caller, which kind of variant and which contig to keep in view
  grid_sections:
  - name: Concordance at a glance
    icon: mdi:counter
    color: teal
    description: How many calls each caller made, and what they look like
  - name: Which callsets agree
    icon: mdi:set-merge
    color: green
    description: Set intersections over variants and over genes
  - name: Depth sensitivity
    icon: mdi:chart-scatter-plot
    color: cyan
    description: Allele fraction against read depth, the plane a germline callset is read on
  - name: Calls along the genome
    icon: mdi:chart-line
    color: indigo
    description: Where the calls fall, and how dense they are
  - name: Call table
    icon: mdi:table
    color: gray
    description: The rows behind the panels on this tab
    collapsed: true
  components:
  - component_type: text
    tag: sk-cc-intro
    section: Concordance at a glance
    title: The same individual, twice, through five callers
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      NA12878 sequenced at 75M and at 200M reads, so a call present in one
      callset and absent in another is a sensitivity difference, not a
      disagreement about truth. There is no benchmark callset in this run: the
      honest reading of every intersection below is which caller keeps a call
      that the others drop, and what the deeper library adds.
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: sk-cc-card-calls
    index: sk-cc-card-calls
    section: Concordance at a glance
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    use: vcf/variants
    aggregation: count
    column_name: variant_key
    column_type: object
    secondary_layout: top_n
    breakdown_col: caller
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Calls read from the VCFs
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sk-cc-card-type
    index: sk-cc-card-type
    section: Concordance at a glance
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    use: vcf/variants
    aggregation: count
    column_name: variant_key
    column_type: object
    secondary_layout: donut
    breakdown_col: variant_type
    display: {icon_name: 'mdi:chart-donut', icon_color: '#43A047', title_color: '#43A047', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Calls by type
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sk-cc-card-vaf
    index: sk-cc-card-vaf
    section: Concordance at a glance
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    use: vcf/variants
    aggregation: average
    aggregations: [box_plot_stats]
    column_name: vaf
    column_type: float64
    secondary_layout: box_plot
    display: {icon_name: 'mdi:chart-box-outline', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Allele fraction
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sk-cc-card-dp
    index: sk-cc-card-dp
    section: Concordance at a glance
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    use: vcf/variants
    aggregation: median
    aggregations: [box_plot_stats]
    column_name: dp
    column_type: int64
    secondary_layout: box_plot
    display: {icon_name: 'mdi:chart-box-outline', icon_color: '#3949AB', title_color: '#3949AB', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Depth at the call
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: text
    tag: sk-cc-upset-intro
    section: Which callsets agree
    title: Two ways of asking the same question
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The first plot counts PASS calls that match on contig, position and
      allele, so a one-base difference in how two callers left-align the same
      indel reads as a disagreement. The second asks only whether a gene
      carries a coding variant, which is the question an analyst downstream of
      the callset asks and which survives those representation differences.
      Both are built from the annotated VCFs, so FreeBayes is present in both.
    workflow_tag: sarek
    data_collection_tag: snpeff_variant_upset
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: sk-cc-av-variant-upset
    index: sk-cc-av-variant-upset
    section: Which callsets agree
    workflow_tag: sarek
    data_collection_tag: snpeff_variant_upset
    use: snpeff/callset_variant_overlap
    config:
      sort_by: cardinality
      sort_order: descending
      min_size: 50
    title: PASS calls shared between callsets
    description: One set per caller and sample. The tallest bars are the calls every callset agrees on; the bars beside them are what one caller or one depth keeps alone.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 9}
  - component_type: advanced_viz
    tag: sk-cc-av-gene-upset
    index: sk-cc-av-gene-upset
    section: Which callsets agree
    workflow_tag: sarek
    data_collection_tag: snpeff_gene_upset
    use: snpeff/caller_gene_overlap
    config:
      sort_by: cardinality
      sort_order: descending
      min_size: 5
    title: Genes hit by a coding variant, shared between callers
    description: One set per caller, over the genes carrying at least one HIGH or MODERATE variant. Agreement is much higher here than at the variant level, which is the representation effect made visible.
    title_size: h3
    layout: {x: 0, y: 11, w: 8, h: 9}

  - component_type: text
    tag: sk-cc-vaf-intro
    section: Depth sensitivity
    title: Allele fraction against read depth
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A clean diploid callset stacks on two bands, near 0.5 for heterozygous
      calls and near 1.0 for homozygous ones. Points off those bands at low
      depth are where a caller is guessing, and the 75M and 200M libraries
      differ mostly in how far left that cloud reaches.
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: sk-cc-av-vaf
    index: sk-cc-av-vaf
    section: Depth sensitivity
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    use: vcf/vaf_against_depth
    config:
      controls_placement: header
      x_title: read depth at the call
      y_title: variant allele fraction
      log_x: true
      marker_size: 4
      reference_line: horizontal
      reference_value: 0.5
      density: true
      density_bins: 40
    title: Allele fraction against depth, as a density
    description: The calls binned on depth (log axis) and allele fraction, from the same row sample the scatter draws, so the heterozygous band at 0.5 and the homozygous band at 1 read as ridges rather than as a solid blob. The line marks the heterozygous expectation.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: figure
    tag: sk-cc-fig-vaf
    section: Depth sensitivity
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    use: vcf/variants
    visu_type: histogram
    dict_kwargs: {x: vaf, color: caller}
    title: Allele-fraction distribution per caller
    description: The same calls as a histogram. A caller with a heavy left tail is keeping low-fraction calls the others filtered.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 6}

  - component_type: text
    tag: sk-cc-genome-intro
    section: Calls along the genome
    title: Where the calls fall
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      An exome's calls cluster on the capture targets, so this is a density
      read rather than an association read: the dense stretches are gene-rich
      regions on target, and the empty stretches are the genome between them.
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: sk-cc-av-rainfall
    index: sk-cc-av-rainfall
    section: Calls along the genome
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    use: vcf/variant_rainfall
    config:
      mode: rainfall
      rainfall_class_col: variant_type
      marker_size_below: 3
    title: Rainfall, distance to the previous call
    description: One point per call at its position, height is log10 of the distance to the previous call on the same contig, colour is the variant type. Clusters of short distances are gene-dense exons on target, not kataegis, on a germline exome.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: advanced_viz
    tag: sk-cc-av-genome
    index: sk-cc-av-genome
    section: Calls along the genome
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    use: vcf/variant_genome_view
    config:
      controls_placement: header
      mark: point
      assembly: hg38
      score_title: variant allele fraction
      point_size: 3
      facet_by_sample: true
    title: The same calls on a genome axis, one lane per caller
    description: A chromosome-aware locus scale with native zoom. Drag to brush a region; the brush emits a contig and position filter the rest of the dashboard can read.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 7}

  - component_type: text
    tag: sk-cc-table-intro
    section: Call table
    title: The calls themselves
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per call as the caller wrote it, filtered by every picker on this
      tab. The annotated twin of this table, with gene and consequence, is on
      the Consequences tab.
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: sk-cc-table-calls
    section: Call table
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    use: vcf/variants
    row_selection_enabled: false
    title: Variant calls
    description: Locus, allele, quality, FILTER, genotype, depth and allele fraction, one row per call and caller.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 7}

  - component_type: interactive
    tag: sk-cc-filter-caller
    index: sk-cc-caller-filter
    section: Call scope
    group: Call scope
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:dna'}
    placement: left
    title: Caller
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: sk-cc-filter-type
    index: sk-cc-type-filter
    section: Call scope
    group: Call scope
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    interactive_component_type: MultiSelect
    column_name: variant_type
    column_type: object
    display: {title_size: md, custom_color: '#43A047', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Variant type
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: sk-cc-filter-chrom
    index: sk-cc-chrom-filter
    section: Call scope
    group: Call scope
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    interactive_component_type: MultiSelect
    column_name: chrom
    column_type: object
    display: {title_size: md, custom_color: '#3949AB', icon_name: 'mdi:map-marker-outline'}
    placement: left
    title: Contig
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: sk-cc-filter-dp
    index: sk-cc-dp-filter
    section: Call scope
    group: Call scope
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    interactive_component_type: RangeSlider
    column_name: dp
    column_type: int64
    show_histogram: true
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:chart-bell-curve'}
    placement: left
    title: Depth at the call
    layout: {x: 0, y: 9, w: 1, h: 3}

# ============================================================================
# Consequences
# ============================================================================
# What the calls do to the transcript, from two angles: SnpEff's own CSV
# summary (the counts it publishes) and the annotated VCF (one row per call,
# so the same composition can be filtered by depth, quality or contig).
- title: Consequences
  subtitle: "What SnpEff makes of the calls: impact classes, consequence terms and genomic regions"
  tab_order: 5
  tab_icon: mdi:chart-donut
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Composition scope
    icon: mdi:filter-variant
    color: orange
    description: Which SnpEff section and which caller to read
  - name: Impact scope
    icon: mdi:tune
    color: red
    description: Which impact class and consequence to keep in the per-call panels
  grid_sections:
  - name: Consequences at a glance
    icon: mdi:counter
    color: orange
    description: How the calls distribute over impact classes and regions
  - name: What kind of variants
    icon: mdi:chart-bar
    color: yellow
    description: SnpEff's own counts, section by section
  - name: Impact per call
    icon: mdi:chart-donut
    color: red
    description: The same composition computed on the annotated calls, filterable by depth and quality
  - name: Annotated calls
    icon: mdi:table
    color: gray
    description: One row per annotated call
    collapsed: true
  components:
  - component_type: text
    tag: sk-cs-intro
    section: Consequences at a glance
    title: Two readings of the same annotations
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      SnpEff publishes a summary of what it annotated, and it writes the
      annotation into the VCF. The sections below are the summary; the panels
      after them recompute the same composition from the calls themselves,
      which is what makes it filterable by caller, depth and contig. An exome
      is dominated by MODIFIER calls because the capture flanks are
      intergenic and intronic.
    workflow_tag: sarek
    data_collection_tag: snpeff_csv_stats
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: sk-cs-card-section
    index: sk-cs-card-section
    section: Consequences at a glance
    workflow_tag: sarek
    data_collection_tag: snpeff_csv_stats
    use: snpeff/csv_stats
    aggregation: sum
    column_name: count
    column_type: int64
    secondary_layout: donut
    breakdown_col: section
    display: {icon_name: 'mdi:chart-donut', icon_color: '#FB8C00', title_color: '#FB8C00', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Effects counted
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sk-cs-card-category
    index: sk-cs-card-category
    section: Consequences at a glance
    workflow_tag: sarek
    data_collection_tag: snpeff_csv_stats
    use: snpeff/csv_stats
    aggregation: sum
    column_name: count
    column_type: int64
    secondary_layout: top_n
    breakdown_col: category
    top_n_count: 4
    display: {icon_name: 'mdi:star-outline', icon_color: '#F9A825', title_color: '#F9A825', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Most common class
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sk-cs-card-impact
    index: sk-cs-card-impact
    section: Consequences at a glance
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    use: snpeff/impact_composition
    aggregation: count
    column_name: variant_key
    column_type: object
    secondary_layout: donut
    breakdown_col: impact
    display: {icon_name: 'mdi:chart-donut', icon_color: '#E53935', title_color: '#E53935', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Calls by impact
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sk-cs-card-consequence
    index: sk-cs-card-consequence
    section: Consequences at a glance
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    use: snpeff/ann_variants
    aggregation: count
    column_name: variant_key
    column_type: object
    secondary_layout: top_n
    breakdown_col: consequence
    top_n_count: 4
    display: {icon_name: 'mdi:dna', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Most common consequence
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: text
    tag: sk-cs-sections-intro
    section: What kind of variants
    title: SnpEff's own counts
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Impact classes, functional classes, consequence terms, genomic regions,
      variant types and zygosity, one section at a time. The zygosity section
      reports counts only, so its percent column is empty by design.
    workflow_tag: sarek
    data_collection_tag: snpeff_csv_stats
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: sk-cs-fig-sections
    section: What kind of variants
    workflow_tag: sarek
    data_collection_tag: snpeff_csv_stats
    use: snpeff/composition_bars
    visu_type: bar
    dict_kwargs: {x: category, y: count, color: caller, barmode: group}
    title: The chosen section, caller by caller
    description: Pick a section in the left panel. The gap between two callers on the same class is where their annotations disagree.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 6}
  - component_type: table
    tag: sk-cs-table-sections
    section: What kind of variants
    workflow_tag: sarek
    data_collection_tag: snpeff_csv_stats
    use: snpeff/csv_stats
    row_selection_enabled: false
    title: SnpEff composition sections
    description: One row per sample, caller, section and class, with the count and its share of the section.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 8, w: 8, h: 7}

  - component_type: text
    tag: sk-cs-impact-intro
    section: Impact per call
    title: The same composition, recomputed on the calls
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Every call carries SnpEff's most severe annotation for it, so the
      composition below answers to the pickers the published summary cannot.
      The scatter asks whether the HIGH-impact calls sit at the same depth as
      the rest. Click a call and the card beside it shows that variant in every
      callset that made it; it opens on TP53 Pro72Arg, which HaplotypeCaller
      filters at 200M reads and passes at 75M.
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: sk-cs-av-impact
    index: sk-cs-av-impact
    section: Impact per call
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    use: snpeff/annotated_vaf_against_depth
    config:
      controls_placement: header
      x_title: read depth at the call
      y_title: variant allele fraction
      log_x: true
      marker_size: 4
      selection_enabled: true
      selection_column: variant_key
      legend_pos: bottom
    title: Allele fraction against depth, coloured by impact
    description: One point per annotated call. A HIGH-impact call at low depth and low allele fraction is the one to distrust. Click a point to open it in the card.
    title_size: h3
    layout: {x: 0, y: 2, w: 5, h: 9}
  - component_type: advanced_viz
    tag: sk-cs-av-record
    index: sk-cs-av-record
    section: Impact per call
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: variant_key
      title_col: gene
      selection_source: any
      default_record: "chr17:7676154:G:C"
      sections:
        Locus: [chrom, pos, ref, alt, variant_type]
        Call: [sample, caller, filter_status, gt, qual, dp, vaf]
        Consequence: [gene, gene_id, impact, consequence, hgvs_p, aa_pos]
      link_templates:
        gene_id: "https://www.ensembl.org/Homo_sapiens/Gene/Summary?g={value}"
    title: Variant record
    description: The selected call as a fact panel, one card per callset that made it, with the gene linked to Ensembl.
    title_size: h3
    layout: {x: 5, y: 2, w: 3, h: 9}
  - component_type: figure
    tag: sk-cs-fig-impact
    section: Impact per call
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    use: snpeff/ann_variants
    visu_type: histogram
    dict_kwargs: {x: vaf, color: impact}
    title: Allele fraction by impact class
    description: If the impact classes sat at different allele fractions, the annotation would be tracking coverage rather than biology. They do not.
    title_size: h3
    layout: {x: 0, y: 11, w: 8, h: 6}

  - component_type: text
    tag: sk-cs-calls-intro
    section: Annotated calls
    title: One row per annotated call
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Everything the call table on the concordance tab carries, plus the gene,
      the impact class, the consequence term and the protein change SnpEff
      assigned to it.
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: sk-cs-table-calls
    section: Annotated calls
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    use: snpeff/ann_variants
    row_selection_enabled: false
    title: Annotated variant calls
    description: Locus, allele, depth, allele fraction, gene, impact, consequence and protein change.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 7}

  - component_type: interactive
    tag: sk-cs-filter-section
    index: sk-cs-section-filter
    section: Composition scope
    group: Composition
    workflow_tag: sarek
    data_collection_tag: snpeff_csv_stats
    interactive_component_type: Select
    column_name: section
    column_type: object
    display: {title_size: md, custom_color: '#FB8C00', icon_name: 'mdi:shape-outline'}
    placement: left
    title: SnpEff section
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: sk-cs-filter-caller
    index: sk-cs-caller-filter
    section: Composition scope
    group: Composition
    workflow_tag: sarek
    data_collection_tag: snpeff_csv_stats
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display: {title_size: md, custom_color: '#F9A825', icon_name: 'mdi:dna'}
    placement: left
    title: Caller
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: sk-cs-filter-impact
    index: sk-cs-impact-filter
    section: Impact scope
    group: Impact
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    interactive_component_type: MultiSelect
    column_name: impact
    column_type: object
    display: {title_size: md, custom_color: '#E53935', icon_name: 'mdi:alert-outline'}
    placement: left
    title: Impact class
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: sk-cs-filter-consequence
    index: sk-cs-consequence-filter
    section: Impact scope
    group: Impact
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    interactive_component_type: MultiSelect
    column_name: consequence
    column_type: object
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:dna'}
    placement: left
    title: Consequence
    layout: {x: 0, y: 3, w: 1, h: 3}

# ============================================================================
# Genes
# ============================================================================
# The gene-level view, from SnpEff's per-gene effect table and from the protein
# coordinates in the annotated VCF. This is where a reader stops asking about
# the run and starts asking about a gene.
- title: Genes
  subtitle: Which genes carry the calls, how the callsets differ on them, and where the variants sit on the protein
  tab_order: 6
  tab_icon: mdi:dna
  tab_icon_color: pink
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Gene scope
    icon: mdi:filter-variant
    color: pink
    description: Which biotype and which caller to keep in the gene panels
  - name: Protein scope
    icon: mdi:tune
    color: violet
    description: Which impact class to keep on the lollipop
  grid_sections:
  - name: Genes at a glance
    icon: mdi:counter
    color: pink
    description: How the variant burden distributes over genes
  - name: Which genes are hit
    icon: mdi:shape-outline
    color: grape
    description: The most damaged genes, callset by callset
  - name: Burden across callsets
    icon: mdi:relation-many-to-many
    color: violet
    description: Do the callers separate more than the depths do
  - name: Along the protein
    icon: mdi:chart-timeline-variant
    color: indigo
    description: Coding variants at their amino-acid position
  - name: Gene table
    icon: mdi:table
    color: gray
    description: The per-gene burden behind the panels on this tab
    collapsed: true
  components:
  - component_type: text
    tag: sk-gn-intro
    section: Genes at a glance
    title: From a callset to a gene list
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      SnpEff counts, for every gene it knows, how many variants of each impact
      class a callset put on it. The genes at the top of that list on a normal
      germline exome are the long, repetitive, poorly mappable ones, the mucins
      and the titin-scale genes: a high burden here is a mappability signal
      before it is a biological one.
    workflow_tag: sarek
    data_collection_tag: snpeff_genes
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: sk-gn-card-burden
    index: sk-gn-card-burden
    section: Genes at a glance
    workflow_tag: sarek
    data_collection_tag: snpeff_genes
    use: snpeff/gene_burden_top
    aggregation: sum
    column_name: n_variants
    column_type: int64
    secondary_layout: top_n
    breakdown_col: gene_name
    top_n_count: 5
    display: {icon_name: 'mdi:counter', icon_color: '#D81B60', title_color: '#D81B60', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Variants on genes
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sk-gn-card-high
    index: sk-gn-card-high
    section: Genes at a glance
    workflow_tag: sarek
    data_collection_tag: snpeff_genes
    use: snpeff/genes
    aggregation: sum
    column_name: n_high
    column_type: int64
    secondary_layout: top_n
    breakdown_col: caller
    top_n_count: 3
    display: {icon_name: 'mdi:alert-outline', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: HIGH impact variants
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sk-gn-card-coding
    index: sk-gn-card-coding
    section: Genes at a glance
    workflow_tag: sarek
    data_collection_tag: snpeff_genes
    use: snpeff/genes
    aggregation: median
    aggregations: [box_plot_stats]
    column_name: n_coding
    column_type: int64
    secondary_layout: box_plot
    display: {icon_name: 'mdi:chart-box-outline', icon_color: '#5E35B1', title_color: '#5E35B1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Coding burden per gene
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sk-gn-card-lolli
    index: sk-gn-card-lolli
    section: Genes at a glance
    workflow_tag: sarek
    data_collection_tag: snpeff_protein_lollipop
    use: snpeff/protein_lollipop
    aggregation: count
    column_name: variant_key
    column_type: object
    secondary_layout: top_n
    breakdown_col: gene
    top_n_count: 5
    display: {icon_name: 'mdi:chart-timeline-variant', icon_color: '#3949AB', title_color: '#3949AB', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Variants with a protein position
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: text
    tag: sk-gn-onco-intro
    section: Which genes are hit
    title: The most damaged genes, callset by callset
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One column per sample and caller, one row per gene, coloured by the most
      severe impact that cell carries. A gene that reads HIGH for one caller
      and MODERATE for another is a disagreement about a single call, which is
      exactly the kind of difference a count-level comparison hides.
    workflow_tag: sarek
    data_collection_tag: snpeff_oncoplot
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: sk-gn-av-onco
    index: sk-gn-av-onco
    section: Which genes are hit
    workflow_tag: sarek
    data_collection_tag: snpeff_oncoplot
    use: snpeff/gene_impact_grid
    config:
      sort_by_freq: true
    title: Impact grid over the 30 most damaged genes
    description: Columns are sample and caller pairs, rows are genes, colour is the most severe impact class in the cell.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 9}

  - component_type: text
    tag: sk-gn-heat-intro
    section: Burden across callsets
    title: Do the callers separate more than the depths do
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The same genes as a matrix of variant counts, clustered on both axes. If
      the two depths of one caller cluster together before the five callers of
      one depth do, the callers agree more with themselves across depth than
      with each other, which is the result to expect from a well-behaved run.
    workflow_tag: sarek
    data_collection_tag: snpeff_gene_heatmap
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: sk-gn-av-heat
    index: sk-gn-av-heat
    section: Burden across callsets
    workflow_tag: sarek
    data_collection_tag: snpeff_gene_heatmap
    use: snpeff/burden_matrix
    title: Variant burden, gene against callset
    description: The 40 genes carrying the most coding variants. Columns are sample and caller pairs.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 9}

  - component_type: text
    tag: sk-gn-lolli-intro
    section: Along the protein
    title: Where on the protein the variants sit
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Only variants whose protein change SnpEff could compute appear here, at
      their amino-acid position, so the positions inside a lane are comparable.
      A lane where several callsets stack a variant at the same residue is a
      call they agree on; a lone stem is one caller's own.
    workflow_tag: sarek
    data_collection_tag: snpeff_protein_lollipop
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: sk-gn-av-lolli
    index: sk-gn-av-lolli
    section: Along the protein
    workflow_tag: sarek
    data_collection_tag: snpeff_protein_lollipop
    use: snpeff/coding_variant_needles
    config:
      max_subplot_genes: 4
      point_size: 8
      scale_points_by_effect: true
    title: Coding variants along the protein
    description: One lane per gene, one stem per variant, head colour by impact class and head size by allele fraction. Above four genes the tile switches to a single-gene picker.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: table
    tag: sk-gn-table-lolli
    section: Along the protein
    workflow_tag: sarek
    data_collection_tag: snpeff_protein_lollipop
    use: snpeff/protein_lollipop
    row_selection_enabled: false
    title: Coding variants with a protein position
    description: Gene, amino-acid position, impact, consequence and protein change, one row per call.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 9, w: 8, h: 7}

  - component_type: text
    tag: sk-gn-table-intro
    section: Gene table
    title: The per-gene burden behind the panels
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per gene and callset, with the four impact counts summed over the
      gene's transcripts. Pick a gene here and the lollipop above opens on it.
    workflow_tag: sarek
    data_collection_tag: snpeff_genes
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: sk-gn-table-genes
    section: Gene table
    workflow_tag: sarek
    data_collection_tag: snpeff_genes
    use: snpeff/genes
    row_selection_enabled: true
    title: Per-gene variant burden
    description: Gene, biotype and the HIGH, MODERATE, LOW and MODIFIER counts, one row per gene and callset.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 7}

  - component_type: interactive
    tag: sk-gn-filter-biotype
    index: sk-gn-biotype-filter
    section: Gene scope
    group: Gene scope
    workflow_tag: sarek
    data_collection_tag: snpeff_genes
    interactive_component_type: MultiSelect
    column_name: biotype
    column_type: object
    display: {title_size: md, custom_color: '#D81B60', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Biotype
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: sk-gn-filter-caller
    index: sk-gn-caller-filter
    section: Gene scope
    group: Gene scope
    workflow_tag: sarek
    data_collection_tag: snpeff_genes
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:dna'}
    placement: left
    title: Caller
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: sk-gn-filter-impact
    index: sk-gn-impact-filter
    section: Protein scope
    group: Protein scope
    workflow_tag: sarek
    data_collection_tag: snpeff_protein_lollipop
    interactive_component_type: MultiSelect
    column_name: impact
    column_type: object
    display: {title_size: md, custom_color: '#5E35B1', icon_name: 'mdi:alert-outline'}
    placement: left
    title: Impact class
    layout: {x: 0, y: 0, w: 1, h: 3}
