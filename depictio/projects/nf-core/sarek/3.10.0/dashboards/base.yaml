  # The section's own bar: impact class and consequence narrow the per-call
  # tiles below, not the cards above.
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    interactive_component_type: MultiSelect
    column_name: impact
