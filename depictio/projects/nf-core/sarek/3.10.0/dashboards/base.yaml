version: 1
# nf-core/sarek 3.10.0 dashboard, to the family rules of
# depictio/projects/nf-core/RULES.md (ampliseq is the reference).
#
# Funnel: the MultiQC report and the coverage (Data & QC) -> what each caller
# called, how clean it looks and which calls the callers share (Variant calls)
# -> what the calls do to the transcripts, which genes carry them and one
# region on one axis (Annotation).
#
# Nothing here is a truth comparison: "concordance" is agreement between
# callers and samples. nf-core/variantbenchmarking has its own template.
#
# Structural-variant callers (Manta, TIDDIT) call few SNPs, so every Ts/Tv
# tile filters `ts_tv > 0`. The SnpEff collections are optional (a run without
# `--tools snpeff` prunes them, with the Consequences and Genes tabs and the
# Overview tiles and rows that read them).
main_dashboard:
  title: nf-core/sarek
  subtitle: Germline variant calls, from coverage to the genes they hit
  project_tag: Sarek Germline Variant Calling
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab: figures, advanced viz and filter
  # chips all colour a value the same way.
  category_colors:
    caller: auto
    status_label:
      '*': auto
      Normal: '#1098ad'
      Tumour: '#c2255c'
      Unknown: '#adb5bd'
    variant_type:
      SNP: '#1c7ed6'
      INDEL: '#7048e8'
      MNP: '#0ca678'
      SV: '#f08c00'
    impact:
      HIGH: '#e03131'
      MODERATE: '#f08c00'
      LOW: '#1c7ed6'
      MODIFIER: '#adb5bd'
    mutation_class:
      transition: '#1c7ed6'
      transversion: '#e8590c'
    indel_class:
      insertion: '#0ca678'
      deletion: '#c2255c'
    # A caller writes its own FILTER reasons, more than the palette's eight on
    # a multi-caller run: the commonest take the palette, PASS stays green.
    filter_label:
      '*': 'auto:n_variants'
      PASS: '#2f9e44'
    inferred_sex:
      XX: '#c2255c'
      XY: '#1c7ed6'
    scope:
      region: '#1c7ed6'
      genome: '#868e96'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs.
  # Bound to the sample hub, which links to every per-sample collection.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The sample hub behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Callsets).
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: indigo
      strip_label: Caller
    section: Key figures
    tag: sk-ov-kf-caller
    index: ov-kf-caller
    title: Caller
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: sk-ov-kf-sample
    index: ov-kf-sample
    title: Sample ID
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: text
    title: nf-core/sarek
    order: 1
    body: >
      Germline variant calling from reads to genes: how deeply the targets were covered, what
      each caller called, which calls the callers share and what they do to the transcripts.
      [Run parameters](params:)
    tag: sk-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/sarek maps each sample's reads, measures the depth over the intervals, calls variants with one or more callers and annotates the calls with SnpEff. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The sample filters in the left panel apply to every tab: narrow the samples once and the whole dashboard follows. A bar above a section narrows that section only.
    tag: sk-ov-about
    index: ov-about
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash.
  - component_type: text
    surface: card
    values:
      samples: {dc: samples, column: sample_id, aggregation: nunique, format: integer}
      callsets: {dc: bcftools_stats_summary, column: sample, aggregation: count, format: integer}
      callers: {dc: bcftools_stats_summary, column: caller, aggregation: nunique, format: integer}
    body: |
      ### The run
      - ![](icon:mdi:test-tube) **Samples** {{samples}}
      - ![](icon:mdi:layers-triple-outline) **Callsets** {{callsets}} from {{callers}} callers
      - ![](icon:mdi:map-marker-outline) **Genome** {{param:genome}}
      - ![](icon:mdi:content-cut) **Aligner** {{param:aligner}}
    tag: sk-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Six steps from reads to genes
      Each step names its settings and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:content-cut) **Map** Trim, align, mark duplicates · [Settings](params:aligner) · [MultiQC](tab:MultiQC)
      2. ![](icon:mdi:layers-outline) **Cover** Depth over the intervals · [Settings](params:intervals) · [Coverage](tab:Coverage)
      3. ![](icon:mdi:dna) **Call** One callset per caller and sample · [Settings](params:tools) · [Yield](tab:Variant yield)
      4. ![](icon:mdi:check-decagram) **Check** Ts/Tv, PASS share, zygosity · [Settings](params:skip_tools) · [Quality](tab:Call quality)
      5. ![](icon:mdi:set-merge) **Compare** Calls the callers share · [Settings](params:joint_germline) · [Concordance](tab:Caller concordance)
      6. ![](icon:mdi:tag-outline) **Annotate** SnpEff effects and genes · [Settings](params:snpeff) · [Consequences](tab:Consequences)
      :::
    tag: sk-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each on a collection every
  # run writes, each opening the tab that explains it in that tab's colour.
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    aggregation: sum
    column_name: n_records
    column_type: int64
    secondary_layout: composition
    breakdown_col: caller
    display:
      icon_name: mdi:layers-triple-outline
      icon_color: teal
      caption: records over all callsets, by caller
      link: tab:Caller concordance
      decimals: 0
    section: Key figures
    tag: sk-ov-kf-calls
    index: ov-kf-calls
    title: Variant calls
    description: Records the callers wrote, summed over the callsets. The bar splits them by caller.
    layout: {x: 0, y: 0, w: 2, h: 2}
  # The `total` row of the region scope is mosdepth's own roll-up over the
  # intervals: one value per sample.
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: mosdepth_summary
    use: mosdepth/summary
    aggregation: median
    column_name: mean_depth
    column_type: float64
    filter_expr: "(col('scope') == 'region') & (col('chrom') == 'total')"
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:layers-outline
      icon_color: blue
      caption: median per sample, with its spread
      link: tab:Coverage
      decimals: 1
    section: Key figures
    tag: sk-ov-kf-depth
    index: ov-kf-depth
    title: Depth on target
    description: Median depth over the intervals, one value per sample. The box shows how it spreads.
    layout: {x: 2, y: 0, w: 2, h: 2}
  # Callsets with no record (a caller that found nothing) have no share to give.
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: callset_qc
    aggregation: median
    column_name: pass_pct
    column_type: float64
    filter_expr: "col('n_records') > 0"
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:check-decagram
      icon_color: cyan
      caption: median per callset, with its spread
      link: tab:Call quality
      decimals: 1
    section: Key figures
    tag: sk-ov-kf-pass
    index: ov-kf-pass
    title: PASS share (%)
    description: Median share of a callset's calls the caller kept (FILTER PASS or unset). The box shows how it spreads.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_tstv
    use: bcftools/stats_tstv
    aggregation: median
    column_name: ts_tv
    column_type: float64
    filter_expr: "col('ts_tv') > 0"
    secondary_layout: threshold
    threshold_value: 1.8
    threshold_direction: min
    threshold_warn: 1.5
    display:
      icon_name: mdi:scale-balance
      icon_color: violet
      caption: median of the SNP callsets, floor 1.8
      link: tab:Variant yield
      decimals: 2
    section: Key figures
    tag: sk-ov-kf-tstv
    index: ov-kf-tstv
    title: Ts/Tv
    description: Median transition to transversion ratio of the callsets with SNPs. Below 1.8 reads as noise.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the caller (it narrows every collection with a
  # caller column), then the sample.
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: indigo
      strip_label: Caller
    section: Findings
    tag: sk-ov-findings-caller
    index: ov-findings-caller
    title: Caller
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Sample
    section: Findings
    tag: sk-ov-findings-sample
    index: ov-findings-sample
    title: Sample ID
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data (the SnpEff row on a run without SnpEff).
  - component_type: text
    surface: card
    values:
      depth: {dc: mosdepth_summary, column: mean_depth, aggregation: median, filter_expr: "(col('scope') == 'region') & (col('chrom') == 'total')",
        format: 'decimals:1'}
      tstv: {dc: bcftools_stats_tstv, column: ts_tv, aggregation: median, filter_expr: "col('ts_tv') > 0", format: 'decimals:2'}
      top_caller: {dc: vcf_variants, column: caller, aggregation: top, filter_expr: "col('is_pass') == True"}
      caller_share: {dc: vcf_variants, column: caller, aggregation: top_share, filter_expr: "col('is_pass') == True",
        format: percent}
      n_high: {dc: snpeff_ann_variants, column: variant_key, aggregation: count, filter_expr: "col('impact') == 'HIGH'",
        format: integer}
      n_hgenes: {dc: snpeff_ann_variants, column: gene, aggregation: nunique, filter_expr: "(col('impact') == 'HIGH') & (col('gene') != '')",
        format: integer}
    body: |
      - **{{depth}}x** median depth over the intervals – one value per sample [Coverage](tab:Coverage)
      - **{{tstv}}** median Ts/Tv of the callsets with SNPs – transitions over transversions [Quality](tab:Call quality)
      - **{{caller_share}}** of the PASS calls come from {{top_caller}} – the caller that keeps most [Concordance](tab:Caller concordance)
      - **{{n_high}}** HIGH-impact calls on {{n_hgenes}} genes – SnpEff's most severe class [Consequences](tab:Consequences)
    section: Findings
    tag: sk-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per analysis tab, in the order of the rows above. A legend
  # of callsets or FILTER reasons would fill a narrow tile: the captions say
  # what the colour is instead.
  - component_type: highlight
    section: Findings
    source_tab: Variant yield
    source_component: vy-spectrum-sbs
    hide_legend: true
    caption: One bar per caller, its SNVs over the six substitution classes averaged over the samples; C>T and T>C are the transitions.
    tag: sk-ov-hl-spectrum
    index: ov-hl-spectrum
    layout: {x: 0, y: 2, w: 5, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Call quality
    source_component: cq-filter-partitions
    hide_legend: true
    caption: Calls per caller by FILTER value; the green slice is PASS, the rest is what the caller set aside.
    tag: sk-ov-hl-filter
    index: ov-hl-filter
    layout: {x: 5, y: 2, w: 3, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Caller concordance
    source_component: cc-vaf-density
    caption: Calls binned on depth and allele fraction; a clean diploid callset forms ridges at 0.5 and 1.
    tag: sk-ov-hl-vaf
    index: ov-hl-vaf
    layout: {x: 0, y: 7, w: 3, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Consequences
    source_component: cs-impact-by-caller
    hide_legend: true
    caption: Each caller's coding calls by impact class (red HIGH, orange MODERATE, blue LOW), as shares.
    tag: sk-ov-hl-impact
    index: ov-hl-impact
    layout: {x: 3, y: 7, w: 5, h: 5}
  # Link-only tab tiles: each prints its tab's subtitle. A tab the run does not
  # have is left out, and a heading whose tabs are all missing is hidden.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Coverage](tab:Coverage)

      ### Variant calls
      - [Variant yield](tab:Variant yield)
      - [Call quality](tab:Call quality)
      - [Caller concordance](tab:Caller concordance)

      ### Annotation
      - [Consequences](tab:Consequences)
      - [Genes](tab:Genes)
      - [Locus](tab:Locus)
    section: How to read this dashboard
    tag: sk-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters: the tumour/normal status first, then patient
  # and sample.
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: status_label
    column_type: object
    display:
      icon_name: mdi:account-heart-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: sk-filter-status
    index: sample-filters-status
    title: Status
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: patient
    column_type: object
    display:
      icon_name: mdi:account-group-outline
      custom_color: pink
    section: Sample filters
    group: Sample scope
    tag: sk-filter-patient
    index: sample-filters-patient
    title: Patient
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: sk-filter-sample
    index: sample-filters-sample
    title: Sample ID
    layout: {x: 0, y: 5, w: 1, h: 3}
  - component_type: table
    workflow_tag: sarek
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Sample sheet
    tag: sk-sample-sheet
    index: sample-sheet
    title: Sample sheet
    description: One row per sample, with its patient, sex, status and the callers run on it.
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
# ============================================================================
# Data & QC
# ============================================================================
- title: MultiQC
  subtitle: Did reads, mapping and recalibration work for every sample?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: MultiQC report
    icon: mdi:file-document-outline
    color: orange
    description: Samples as the MultiQC report names them
  grid_sections:
  - name: QC overview
    icon: mdi:chart-box-outline
    color: orange
    description: Reads kept, mapping rate, duplication and coverage, per sample
  - name: Read quality
    icon: mdi:chart-bell-curve
    color: gray
    description: FastQC counts, base quality and GC content of the raw libraries
    collapsed: true
  - name: Alignment details
    icon: mdi:chart-bar
    color: gray
    description: Base-quality recalibration fit and insert sizes
    collapsed: true
  - name: Variant-call panels
    icon: mdi:check-decagram
    color: gray
    description: bcftools and VCFtools summaries, every caller pooled
    collapsed: true
  - name: Annotation panels
    icon: mdi:dna
    color: gray
    description: SnpEff and VEP summaries of the annotated calls
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [MultiQC](https://multiqc.info) gathers the per-sample reports of FastQC, fastp, Samtools,
      GATK, mosdepth, bcftools, VCFtools, SnpEff and VEP. Read whether every sample kept its
      reads, mapped well and reached a usable depth before reading any call. A library carries
      a lane and a read suffix, so a sample can appear once per read.
    tag: sk-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: MultiQC report
    tag: sk-mqc-filter-sample
    index: mqc-sample-filter
    title: Sample ID
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: multiqc
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: QC overview
    tag: sk-mqc-general-stats
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    use: multiqc/fastp
    selected_module: fastp
    selected_plot: Filtered Reads
    section: QC overview
    tag: sk-mqc-fastp-filtered
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Percent mapped
    section: QC overview
    tag: sk-mqc-samtools-mapped
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    use: multiqc/picard
    selected_module: picard
    selected_plot: Mark Duplicates
    section: QC overview
    tag: sk-mqc-picard-dup
    layout: {x: 0, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    use: multiqc/mosdepth
    selected_module: mosdepth
    selected_plot: Cumulative coverage distribution
    section: QC overview
    tag: sk-mqc-mosdepth-cov
    layout: {x: 4, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Counts
    section: Read quality
    tag: sk-mqc-fastqc-counts
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    section: Read quality
    tag: sk-mqc-fastqc-quality
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Per Sequence GC Content
    section: Read quality
    tag: sk-mqc-fastqc-gc
    layout: {x: 0, y: 4, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    use: multiqc/gatk
    selected_module: gatk
    selected_plot: Reported Quality vs. Empirical Quality
    section: Alignment details
    tag: sk-mqc-gatk-bqsr
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Insert size distribution
    section: Alignment details
    tag: sk-mqc-samtools-insert
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    use: multiqc/bcftools
    selected_module: bcftools
    selected_plot: Variant Substitution Types
    section: Variant-call panels
    tag: sk-mqc-bcftools-subs
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    use: multiqc/bcftools
    selected_module: bcftools
    selected_plot: Indel Distribution
    section: Variant-call panels
    tag: sk-mqc-bcftools-indels
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    use: multiqc/bcftools
    selected_module: bcftools
    selected_plot: Variant depths
    section: Variant-call panels
    tag: sk-mqc-bcftools-depths
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    use: multiqc/vcftools
    selected_module: vcftools
    selected_plot: TsTv by Count
    section: Variant-call panels
    tag: sk-mqc-vcftools-count
