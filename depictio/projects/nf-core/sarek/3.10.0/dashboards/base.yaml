# Structural variants: the records of the SV callers (Manta, TIDDIT), which the
# small-variant tabs leave out. Optional with sv_calls: a run without such a
# caller does not get the tab. A click on a table row centres the genome browser
# of the Locus tab (the table carries chrom, pos and end).
- title: Structural variants
  subtitle: Which structural variants did the SV callers find, and how big?
  tab_group: Variant calls
  tab_order: 6
  tab_icon: mdi:vector-polyline
  tab_icon_color: lime
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: SV filters
    icon: mdi:filter-variant
    color: lime
    description: The types, callers and lengths in view; a breakend has no length and leaves a length range
  grid_sections:
  - name: SVs at a glance
    icon: mdi:counter
    color: lime
    description: Events, their types and their lengths over the callsets in view
  - name: Types and lengths
    icon: mdi:chart-bar
    color: lime
    description: The types each sample holds, and how long each type runs on a log axis
  - name: Along the genome
    icon: mdi:chart-donut
    color: lime
    description: Where the events sit on each chromosome, and which loci a breakend joins
  - name: Size classes and evidence
    icon: mdi:check-decagram
    color: lime
    description: How the types spread over size classes, and how well the caller supports them
  - name: SV table
    icon: mdi:table
    color: gray
    description: One row per record as the caller wrote it; a click centres the genome browser on it
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [Manta](https://github.com/Illumina/manta) and [TIDDIT](https://github.com/SciLifeLab/TIDDIT)
      call structural variants from the alignments: deletions, duplications, insertions and
      breakends. A breakend is written as two records, one per side, and counts once in the cards
      and the bars. Click a row of the table to centre the genome browser of the Locus tab on it.
    tag: sk-sv-intro
    index: sv-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: sv_calls
    interactive_component_type: MultiSelect
    column_name: svtype
    column_type: object
