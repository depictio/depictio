# The coding variants on the protein: a scatter of the lollipop's genes picks
# one and the lollipop, the main figure of the tab, narrows to it. A click on a
# stem or a residue selects `gene` and `aa_pos`, which the table follows. The 3D
# structure tile is not on this tab: it needs the server's structure resolver
# (off by default), and a tab that opens on a message for most deployments is
# not a tab to lead with.
