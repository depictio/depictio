      n_cons: {dc: somatic_burden, column: variants, aggregation: sum, filter_expr: "col('basis_kind') == 'consensus'", format: integer}
      n_any: {dc: somatic_burden, column: variants, aggregation: sum, filter_expr: "col('basis_kind') == 'union'", format: integer}
      n_alt: {dc: somatic_burden, column: protein_altering, aggregation: sum, filter_expr: "col('basis_kind') == 'consensus'", format: integer}
