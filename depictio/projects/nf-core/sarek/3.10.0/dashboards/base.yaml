version: 1
# nf-core/sarek 3.10.0 reference dashboard.
#
# Funnel: the native MultiQC 1.35 report -> how deeply the exome was covered ->
# how much each of the five germline callers called -> which of them agree ->
# what the calls do to the transcript -> which genes carry them.
#
# Two samples, one individual: NA12878 sequenced twice, at 75M and at 200M
# reads. Nothing here is a truth comparison against a benchmark callset, so
# "concordance" is read as depth sensitivity: what a caller gains between the
# two depths, and what it keeps that the others drop. Every tab that puts the
# callers side by side says so in its intro.
#
# The MultiQC tab holds MultiQC panels only. The pinned Sample sheet and
# Reference tables sections ride every tab, which is where the run-level glance
# strip lives so it is one collapse away wherever the reader lands.
#
# Manta is a structural-variant caller running alongside four SNP/indel
# callers: its bcftools stats read ts=0 tv=0 and it calls a few dozen events
# rather than tens of thousands. That is Manta doing its job, not missing data.
main_dashboard:
  title: nf-core/sarek
  subtitle: "nf-core/sarek 3.10.0 megatest: NA12878 exome at 75M and 200M reads, five germline callers, down to the variant"
  project_tag: Sarek Germline Variant Calling
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab through the project links
    persistent: true
    pin: top
  - name: QC thresholds
    icon: mdi:tune
    color: cyan
    description: Ts/Tv floor on the per-caller variant-call summary
    collapsed: true
    persistent: true
    pin: bottom
  - name: Glance scope
    icon: mdi:tune
    color: orange
    description: Narrows the pinned glance strip and the reference table to one variant caller
  grid_sections:
  # Pinned to the top and carried by every tab: the four numbers that size the
  # run. Cards are legal on the MultiQC tab only inside a pinned persistent
  # section, which is exactly what this is.
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: The run in four numbers, on every tab
    persistent: true
    pin: top
  - name: MultiQC general statistics
    icon: mdi:view-dashboard-outline
    color: blue
    description: One row per sample, pooling the headline numbers of every module
  - name: Read quality
    icon: mdi:chart-bell-curve
    color: blue
    description: FastQC and fastp as MultiQC reports them
  - name: Alignment and recalibration
    icon: mdi:chart-bar
    color: indigo
    description: Mapping rate, duplication, base-quality recalibration and coverage
  - name: Variant-call QC
    icon: mdi:check-decagram
    color: cyan
    description: bcftools and VCFtools summaries of the variant calls, before any per-caller comparison
  - name: Annotation
    icon: mdi:dna
    color: violet
    description: SnpEff and VEP functional-effect summaries
  # Pinned to the top and carried by every tab: the design the whole dashboard
  # is filtered by should be one collapse away wherever the viewer lands.
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The sample hub every other tab is filtered by
    collapsed: true
    persistent: true
    pin: top
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The per-caller variant-call summary, on every tab
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # ------------------------------------------------------------- at a glance
  - component_type: text
    tag: sk-qc-intro
    section: MultiQC general statistics
    title: A germline run, from reads to annotated calls
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The native MultiQC 1.35 report, module by module: general statistics
      first, then read quality, alignment and recalibration, the variant-call
      QC bcftools and VCFtools compute per caller, and the SnpEff/VEP
      annotation summaries. Everything computed from the pipeline's own output
      files lives on the five tabs after this one.
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: sk-qc-general-stats
    section: MultiQC general statistics
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    title: General statistics
    description: One row per sample and per tool run, pooling the FastQC, fastp, samtools, mosdepth, bcftools, SnpEff and VEP headline numbers.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 5}

  # ------------------------------------------------------------ read quality
  - component_type: text
    tag: sk-qc-reads-intro
    section: Read quality
    title: Raw and filtered reads
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/) on
      the raw libraries, and what
      [fastp](https://github.com/OpenGene/fastp) filtered before alignment.
      Each library carries a lane and a read-pair suffix, so a sample appears
      here once per read.
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: sk-qc-fastqc-counts
    section: Read quality
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Counts
    use: multiqc/fastqc
    title: Sequence counts
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: sk-qc-fastqc-quality
    section: Read quality
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    use: multiqc/fastqc
    title: Per-base sequence quality
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: sk-qc-fastqc-gc
    section: Read quality
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Per Sequence GC Content
    use: multiqc/fastqc
    title: GC content
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: sk-qc-fastp-filtered
    section: Read quality
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    selected_module: fastp
    selected_plot: Filtered Reads
    use: multiqc/fastp
    title: Reads kept after filtering
    title_size: sm
    title_align: left
    layout: {x: 4, y: 7, w: 4, h: 5}

  # ----------------------------------------------- alignment / recalibration
  - component_type: text
    tag: sk-qc-align-intro
    section: Alignment and recalibration
    title: Mapping, duplication and base-quality recalibration
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [Samtools](http://www.htslib.org) reports the mapping rate, GATK4
      MarkDuplicates the duplication level, GATK4 BQSR how well the
      recalibration model fit, and [mosdepth](https://github.com/brentp/mosdepth)
      the coverage distribution over the Agilent exome target. The Cohort QC
      tab reads the same mosdepth output per contig and per window.
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: sk-qc-samtools-mapped
    section: Alignment and recalibration
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    selected_module: samtools
    selected_plot: Percent mapped
    use: multiqc/samtools
    title: Percent mapped
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: sk-qc-picard-dup
    section: Alignment and recalibration
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    selected_module: picard
    selected_plot: Mark Duplicates
    use: multiqc/picard
    title: Duplication
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: sk-qc-gatk-bqsr
    section: Alignment and recalibration
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    selected_module: gatk
    selected_plot: Reported Quality vs. Empirical Quality
    use: multiqc/gatk
    title: BQSR calibration fit
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: sk-qc-mosdepth-cov
    section: Alignment and recalibration
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    selected_module: mosdepth
    selected_plot: Cumulative coverage distribution
    use: multiqc/mosdepth
    title: Cumulative coverage distribution
    title_size: sm
    title_align: left
    layout: {x: 4, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: sk-qc-mosdepth-contig
    section: Alignment and recalibration
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    selected_module: mosdepth
    selected_plot: Average coverage per contig
    use: multiqc/mosdepth
    title: Average coverage per contig
    title_size: sm
    title_align: left
    layout: {x: 0, y: 12, w: 8, h: 5}

  # -------------------------------------------------------- variant-call QC
  - component_type: text
    tag: sk-qc-varqc-intro
    section: Variant-call QC
    title: What bcftools and VCFtools see across every caller pooled together
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [bcftools stats](https://samtools.github.io/bcftools/) and
      [VCFtools](https://vcftools.github.io/) here pool every caller's VCF
      into one MultiQC panel per plot. The per-caller breakdown these panels
      cannot show is the Variant yield tab.
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: sk-qc-bcftools-subs
    section: Variant-call QC
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    selected_module: bcftools
    selected_plot: Variant Substitution Types
    use: multiqc/bcftools
    title: Variant substitution types
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: sk-qc-bcftools-indels
    section: Variant-call QC
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    selected_module: bcftools
    selected_plot: Indel Distribution
    use: multiqc/bcftools
    title: Indel length distribution
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: sk-qc-bcftools-depths
    section: Variant-call QC
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    selected_module: bcftools
    selected_plot: Variant depths
    use: multiqc/bcftools
    title: Variant depths
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: sk-qc-vcftools-count
    section: Variant-call QC
    workflow_tag: sarek
    data_collection_tag: multiqc_data
    selected_module: vcftools
    selected_plot: TsTv by Count
    use: multiqc/vcftools
    title: Ts/Tv by allele count
    title_size: sm
    title_align: left
