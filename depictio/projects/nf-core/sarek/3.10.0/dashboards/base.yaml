    layout: {x: 0, y: 0, w: 8, h: 6}
# ============================================================================
# Annotation
# ============================================================================
# What the calls do to the transcripts: SnpEff's own CSV summary, then the
# same composition recomputed on the annotated calls.
- title: Consequences
  subtitle: What do the calls do to the transcripts?
  tab_group: Annotation
  tab_order: 6
  tab_icon: mdi:chart-donut
  tab_icon_color: red
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # The impact class and consequence pickers sit in the bar of the per-call
  # section, not here: three cards pin an impact class, which a left-panel
  # impact pick would turn into dashes.
  filter_sections:
  - name: Consequence filters
    icon: mdi:filter-variant
    color: red
    description: The callers in view, and the SnpEff summary section to read
  grid_sections:
  - name: Consequences at a glance
    icon: mdi:counter
    color: red
    description: Annotated calls, HIGH-impact calls and the genes they hit
  - name: What kind of variants
    icon: mdi:chart-bar
    color: red
    description: SnpEff's own counts for the section picked in the left panel, per caller
  - name: Impact per call
    icon: mdi:chart-donut
    color: red
    filter_bar: true
    visible_filters: 2
    description: Impact recomputed on the calls; pick a call in the scatter to read it
  - name: Consequence tables
    icon: mdi:table
    color: gray
    description: SnpEff's summary sections and the annotated calls
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [SnpEff](https://pcingola.github.io/SnpEff/) gives each call its most severe effect on a
      transcript, in four impact classes from HIGH to MODIFIER. The first section reads
      SnpEff's own summary; the next recomputes the impact on the calls, with a bar for the
      impact class and consequence, and a call picked in the scatter opens beside it.
    tag: sk-cs-intro
    index: cs-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: indigo
    section: Consequence filters
    tag: sk-cs-filter-caller
    index: cs-caller-filter
    title: Caller
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: snpeff_csv_stats
    interactive_component_type: Select
    column_name: section
    column_type: object
    default_value: impact
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: yellow
    section: Consequence filters
    tag: sk-cs-filter-section
    index: cs-section-filter
    title: SnpEff section
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    use: snpeff/impact_composition
    aggregation: count
    column_name: variant_key
    column_type: object
    secondary_layout: donut
    breakdown_col: impact
    display:
      icon_name: mdi:chart-donut
      icon_color: red
      caption: calls, by impact class
      decimals: 0
    section: Consequences at a glance
    tag: sk-cs-card-impact
    index: cs-card-impact
    title: Annotated calls
    description: Calls SnpEff annotated, split by the impact class of their most severe effect.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    use: snpeff/ann_variants
    aggregation: count
    column_name: variant_key
    column_type: object
    filter_expr: "col('impact') == 'HIGH'"
    secondary_layout: composition
    breakdown_col: variant_type
    display:
      icon_name: mdi:alert-outline
      icon_color: orange
      caption: HIGH-impact calls, by variant type
      decimals: 0
    section: Consequences at a glance
    tag: sk-cs-card-high
    index: cs-card-high
    title: HIGH impact
    description: Calls SnpEff ranks HIGH (stop gained, frameshift, splice site), split by variant type.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    use: snpeff/ann_variants
    aggregation: nunique
    column_name: gene
    column_type: object
    filter_expr: "((col('impact') == 'HIGH') | (col('impact') == 'MODERATE')) & (col('gene') != '')"
    secondary_layout: top_n
    breakdown_col: caller
    top_n_count: 3
    display:
      icon_name: mdi:dna
      icon_color: grape
      caption: genes, the callers that hit most
      decimals: 0
    section: Consequences at a glance
    tag: sk-cs-card-genes
    index: cs-card-genes
    title: Genes with a coding call
    description: Distinct genes carrying a HIGH or MODERATE call, ranked by caller.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    use: snpeff/ann_variants
    aggregation: median
    column_name: dp
    column_type: int64
    filter_expr: "col('impact') == 'HIGH'"
    secondary_layout: histogram
    display:
      icon_name: mdi:layers-outline
      icon_color: cyan
      caption: median per HIGH call, with its distribution
      decimals: 0
    section: Consequences at a glance
    tag: sk-cs-card-highdp
    index: cs-card-high-depth
    title: Depth at HIGH calls
    description: Median read depth at the HIGH-impact calls; a low tail is the calls to distrust.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: snpeff_csv_stats
    use: snpeff/composition_bars
    visu_type: bar
    dict_kwargs:
      x: category
      y: count
      color: caller
      barmode: group
      labels: {category: '', count: Calls, caller: Caller}
    section: What kind of variants
    tag: sk-cs-fig-sections
    index: cs-section-bars
    title: The chosen section, caller by caller
    description: The gap between two callers on one class is where their annotations disagree.
    layout: {x: 0, y: 0, w: 8, h: 4}
  # The section's own bar: impact class and consequence narrow the per-call
  # tiles below, not the cards above.
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    interactive_component_type: MultiSelect
    column_name: impact
    column_type: object
    display:
      icon_name: mdi:alert-outline
      custom_color: red
      strip_label: Impact
    section: Impact per call
    tag: sk-cs-filter-impact
    index: cs-impact-filter
    title: Impact class
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    interactive_component_type: MultiSelect
    column_name: consequence
    column_type: object
    display:
      icon_name: mdi:tag-outline
      custom_color: grape
      strip_label: Consequence
    section: Impact per call
    tag: sk-cs-filter-consequence
    index: cs-consequence-filter
    title: Consequence
    layout: {x: 2, y: 0, w: 2, h: 1}
  # MODIFIER calls (intergenic, intronic) are left out: they would fill every
  # bar. Aggregated before plotting, so the browser gets a few rows per caller.
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    use: snpeff/ann_variants
    visu_type: bar
    mode: code
    code_content: |-
      # Share of each caller's coding calls per impact class, in the family colours.
      order = ['HIGH', 'MODERATE', 'LOW']
      d = df.filter(pl.col('impact').is_in(order)).group_by(['caller', 'impact']).agg(pl.len().alias('calls'))
      d = d.with_columns((pl.col('calls') / pl.col('calls').sum().over('caller') * 100).alias('share')).sort('caller')
      fig = px.bar(d.to_pandas(), x='caller', y='share', color='impact', color_discrete_map=depictio_category_colors.get('impact') or {}, category_orders={'impact': order}, labels={'caller': '', 'share': 'Share of coding calls (%)', 'impact': 'Impact class'})
      fig.update_layout(margin=dict(t=10))
    section: Impact per call
    tag: sk-cs-fig-impact-share
    index: cs-impact-by-caller
    title: Impact classes per caller
    description: HIGH, MODERATE and LOW calls as shares of each caller's coding calls.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    use: snpeff/annotated_vaf_against_depth
    config:
      x_title: read depth at the call
      y_title: variant allele fraction
      log_x: true
      marker_size: 4
      selection_enabled: true
      selection_column: variant_key
      legend_pos: bottom
    section: Impact per call
    tag: sk-cs-av-impact
    index: cs-impact-scatter
    title: Allele fraction against depth, by impact
    description: One point per annotated call. Click or lasso a point to read it beside.
    layout: {x: 0, y: 4, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: sk-cs-av-impact
      id_col: variant_key
      title_col: gene
      selection_source: any
      sections:
        Locus: [chrom, pos, ref, alt, variant_type]
        Call: [sample, caller, filter_status, gt, qual, dp, vaf]
        Consequence: [gene, gene_id, impact, consequence, hgvs_p, aa_pos]
      link_templates:
        gene_id: "https://www.ensembl.org/id/{value}"
    section: Impact per call
    tag: sk-cs-av-record
    index: cs-variant-record
    title: Variant record
    description: The picked call, one card per callset that made it. Empty until a call is picked.
    layout: {x: 5, y: 4, w: 3, h: 6}
  - component_type: table
    workflow_tag: sarek
    data_collection_tag: snpeff_csv_stats
    use: snpeff/csv_stats
    row_selection_enabled: true
    row_selection_column: caller
    section: Consequence tables
    tag: sk-cs-table-sections
    index: cs-table-sections
    title: SnpEff summary sections
    description: One row per sample, caller, section and class, with its count and share.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: sarek
    data_collection_tag: snpeff_ann_variants
    use: snpeff/ann_variants
    row_selection_enabled: true
    row_selection_column: variant_key
    section: Consequence tables
    tag: sk-cs-table-calls
    index: cs-table-calls
    title: Annotated variant calls
    description: Locus, allele, depth, allele fraction, gene, impact, consequence and protein change.
    layout: {x: 0, y: 6, w: 8, h: 6}
# The gene-level view, from SnpEff's per-gene table and from the protein
# coordinates in the annotated VCF.
- title: Genes
  subtitle: Which genes carry the calls, and where on the protein?
  tab_group: Annotation
  tab_order: 7
  tab_icon: mdi:dna
  tab_icon_color: pink
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Gene filters
    icon: mdi:filter-variant
    color: pink
    description: Biotype and caller of the burden table, impact class of the protein view
  grid_sections:
  - name: Genes at a glance
    icon: mdi:counter
    color: pink
    description: Genes hit, HIGH-impact burden and coding variants over the callsets in view
  - name: Burden across callsets
    icon: mdi:relation-many-to-many
    color: pink
    description: The genes with most coding variants, gene against callset, both clustered
  - name: Genes the callers share
    icon: mdi:set-merge
    color: pink
    description: Genes with a HIGH or MODERATE call, set by caller
  - name: Along the protein
    icon: mdi:chart-timeline-variant
    color: pink
    description: Coding variants at their amino-acid position, one lane per gene
  - name: Gene tables
    icon: mdi:table
    color: gray
    description: The per-gene burden and the coding variants with a protein position
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [SnpEff](https://pcingola.github.io/SnpEff/) counts, for each gene and callset, the
      variants of each impact class. A high burden is often a long, repetitive or poorly
      mappable gene before it is a biological signal. The lollipop places the coding variants
      on the protein, one lane per gene.
    tag: sk-gn-intro
    index: gn-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: snpeff_genes
    interactive_component_type: MultiSelect
    column_name: biotype
    column_type: object
    display:
      icon_name: mdi:tag-multiple-outline
      custom_color: grape
    section: Gene filters
    tag: sk-gn-filter-biotype
    index: gn-biotype-filter
    title: Biotype
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: snpeff_genes
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: indigo
    section: Gene filters
    tag: sk-gn-filter-caller
    index: gn-caller-filter
    title: Caller
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: snpeff_protein_lollipop
    interactive_component_type: MultiSelect
    column_name: impact
    column_type: object
    display:
      icon_name: mdi:alert-outline
      custom_color: red
    section: Gene filters
    tag: sk-gn-filter-impact
    index: gn-impact-filter
    title: Impact class
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: snpeff_genes
    use: snpeff/genes
    aggregation: nunique
    column_name: gene_name
    column_type: object
    filter_expr: "col('gene_name') != ''"
    secondary_layout: top_n
    breakdown_col: biotype
    top_n_count: 3
    display:
      icon_name: mdi:dna
      icon_color: pink
      caption: genes, the commonest biotypes
      decimals: 0
    section: Genes at a glance
    tag: sk-gn-card-genes
    index: gn-card-genes
    title: Genes with a call
    description: Distinct genes carrying at least one call, ranked by biotype.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: snpeff_genes
    use: snpeff/genes
    aggregation: sum
    column_name: n_high
    column_type: int64
    secondary_layout: composition
    breakdown_col: caller
    display:
      icon_name: mdi:alert-outline
      icon_color: red
      caption: HIGH-impact variants on genes, by caller
      decimals: 0
    section: Genes at a glance
    tag: sk-gn-card-high
    index: gn-card-high
    title: HIGH impact variants
    description: HIGH-impact variants summed over genes and callsets, split by caller.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: snpeff_genes
    use: snpeff/genes
    aggregation: max
    column_name: n_coding
    column_type: int64
    secondary_layout: top_n
    breakdown_col: caller
    top_n_count: 3
    display:
      icon_name: mdi:chart-histogram
      icon_color: violet
      caption: coding variants on one gene, the callers' maxima
      decimals: 0
    section: Genes at a glance
    tag: sk-gn-card-coding
    index: gn-card-coding
    title: Top gene burden
    description: The most HIGH or MODERATE variants one gene carries in a callset, by caller. A long, repetitive gene tops it before a biological one does.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: snpeff_protein_lollipop
    use: snpeff/protein_lollipop
    aggregation: count
    column_name: variant_key
    column_type: object
    secondary_layout: donut
    breakdown_col: impact
    display:
      icon_name: mdi:chart-timeline-variant
      icon_color: indigo
      caption: variants on a protein, by impact class
      decimals: 0
    section: Genes at a glance
    tag: sk-gn-card-protein
    index: gn-card-protein
    title: Protein changes
    description: Coding variants SnpEff placed on a protein position, split by impact class.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: sarek
    data_collection_tag: snpeff_gene_heatmap
    use: snpeff/burden_matrix
    # One gene's count can be ten times the next: log1p keeps the rest readable.
    config:
      normalize: log1p
      colorscale: Blues
    section: Burden across callsets
    tag: sk-gn-av-heat
    index: gn-burden-heatmap
    title: Variant burden, gene against callset
    description: Colour is log(1 + variants); callsets clustering by caller, not sample, mean the caller shapes the gene list.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: sarek
    data_collection_tag: snpeff_gene_upset
    use: snpeff/caller_gene_overlap
    config:
      sort_by: cardinality
      sort_order: descending
      min_size: 5
    section: Genes the callers share
    tag: sk-gn-av-gene-upset
    index: gn-gene-upset
    title: Genes hit by a coding call, shared between callers
    description: Agreement on a gene survives callers writing one variant differently.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: sarek
    data_collection_tag: snpeff_protein_lollipop
    use: snpeff/coding_variant_needles
    config:
      max_subplot_genes: 4
      point_size: 8
      scale_points_by_effect: true
    section: Along the protein
    tag: sk-gn-av-lolli
    index: gn-protein-lollipop
    title: Coding variants along the protein
    description: Head colour is the impact class, head size the allele fraction; past four genes, a picker.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: sarek
    data_collection_tag: snpeff_genes
    use: snpeff/genes
    row_selection_enabled: true
    row_selection_column: gene_name
    section: Gene tables
    tag: sk-gn-table-genes
    index: gn-table-genes
    title: Per-gene variant burden
    description: Gene, biotype and the HIGH, MODERATE, LOW and MODIFIER counts per gene and callset.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: sarek
    data_collection_tag: snpeff_protein_lollipop
    use: snpeff/protein_lollipop
    row_selection_enabled: true
    row_selection_column: variant_key
    section: Gene tables
    tag: sk-gn-table-lolli
    index: gn-table-protein
    title: Coding variants with a protein position
    description: Gene, amino-acid position, impact, consequence and protein change, one row per call.
    layout: {x: 0, y: 6, w: 8, h: 6}
# One genome_view navigator on mosdepth_windows drives the tracks through the
# region links in template.yaml (per-interval depth, the calls over the
# {GENOME} gene lane) and through follow_region_filter (the annotated VCFs
# read from their files). coverage_track and genome_view never share a
# collection here (test_no_double_track_binding). The cards opt in to the
# region with follow_region_filter, so they recount what the region holds.
- title: Locus
  subtitle: What do depth and calls show at one region?
  tab_group: Annotation
  tab_order: 8
  tab_icon: mdi:map-marker-outline
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Locus filters
    icon: mdi:filter-variant
    color: indigo
    description: The callers and variant types of the call track and cards
  grid_sections:
  - name: Region at a glance
    icon: mdi:counter
    color: indigo
    description: What the region in view holds, recounted on every brush or locus entry
  - name: One region, four tracks
    icon: mdi:dna
    color: indigo
    description: The depth navigator and the tracks that follow its region
  components:
  - component_type: text
    order: 1
    body: >
      The navigator draws the mean depth in 1 Mb windows over the genome; the per-interval
      depth, the calls and the annotated VCFs follow its region. Type a locus or a gene in its
      header, or brush its axis, and the tracks and cards follow.
    tag: sk-loc-intro
    index: loc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: indigo
    section: Locus filters
    tag: sk-loc-filter-caller
    index: loc-caller-filter
    title: Caller
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    interactive_component_type: MultiSelect
    column_name: variant_type
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: green
    section: Locus filters
    tag: sk-loc-filter-type
    index: loc-type-filter
    title: Variant type
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    use: vcf/variants
    aggregation: count
    column_name: variant_key
    column_type: object
    secondary_layout: composition
    breakdown_col: caller
    follow_region_filter: true
    display:
      icon_name: mdi:counter
      icon_color: teal
      caption: calls in the region, by caller
      decimals: 0
    section: Region at a glance
    tag: sk-loc-card-calls
    index: loc-card-calls
    title: Calls
    description: Calls inside the region in view, one per callset that made them.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: mosdepth_targets
    aggregation: median
    column_name: depth
    column_type: float64
    secondary_layout: threshold
    threshold_value: 20
    threshold_direction: min
    threshold_warn: 10
    follow_region_filter: true
    display:
      icon_name: mdi:target
      icon_color: blue
      caption: median per interval, floor 20x
      decimals: 1
    section: Region at a glance
    tag: sk-loc-card-depth
    index: loc-card-depth
    title: Depth per interval
    description: Median mean depth of the intervals inside the region in view.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    use: vcf/variants
    aggregation: median
    column_name: vaf
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    follow_region_filter: true
    display:
      icon_name: mdi:chart-box-outline
      icon_color: cyan
      caption: median per call, with its spread
      decimals: 2
    section: Region at a glance
    tag: sk-loc-card-vaf
    index: loc-card-vaf
    title: Allele fraction
    description: Median allele fraction of the calls inside the region in view.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    use: vcf/variants
    aggregation: median
    column_name: dp
    column_type: int64
    secondary_layout: histogram
    follow_region_filter: true
    display:
      icon_name: mdi:layers-outline
      icon_color: grape
      caption: median per call, with its distribution
      decimals: 0
    section: Region at a glance
    tag: sk-loc-card-dp
    index: loc-card-dp
    title: Depth at the call
    description: Median read depth the callers reported at the calls inside the region.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: sarek
    data_collection_tag: mosdepth_windows
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      chr_col: chrom
      pos_col: pos
      end_col: end
      score_col: depth
      feature_col: sample
      mark: rect
      assembly: '{GENOME}'
      score_title: mean depth
      opacity: 0.8
      default_region: "chr1:1,000,000-2,000,000"
      region_filter_enabled: true
    section: One region, four tracks
    tag: sk-loc-av-genome
    index: loc-depth-navigator
    title: Depth navigator, 1 Mb windows
    description: Mean depth per megabase window. A locus or gene in the header, or a brush, moves every track.
    layout: {x: 0, y: 0, w: 8, h: 3}
  - component_type: advanced_viz
    workflow_tag: sarek
    data_collection_tag: mosdepth_targets
    viz_kind: coverage_track
    config:
      viz_kind: coverage_track
      chromosome_col: chrom
      position_col: pos
      end_col: end
      value_col: depth
      sample_col: sample
      view_mode: facet
      color_by: sample
      mark: rect
      smoothing_window: 0
      show_annotation_lane: false
      view: track
      views: [track]
    section: One region, four tracks
    tag: sk-loc-av-track
    index: loc-interval-depth
    title: Depth per interval
    description: One lane per sample, one bar per interval at its mean depth; gaps lie between intervals.
    layout: {x: 0, y: 3, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    use: vcf/variant_genome_view
    config:
      mark: point
      assembly: '{GENOME}'
      annotation: "{GENOME}"
      score_title: VAF
      point_size: 5
      facet_by_sample: true
      max_facets: 5
      region_filter_enabled: false
      follow_region_filter: true
    section: One region, four tracks
    tag: sk-loc-av-calls
    index: loc-call-track
    title: Calls over the genes, one lane per caller
    description: Every call in the region at its variant allele fraction (VAF), over the gene lane.
    layout: {x: 0, y: 7, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: sarek
    data_collection_tag: snpeff_vcf_files
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      source: file
      chr_col: chrom
      pos_col: pos
      assembly: '{GENOME}'
      point_size: 6
      file_max_lanes: 8
      region_filter_enabled: false
      follow_region_filter: true
    section: One region, four tracks
    tag: sk-loc-av-vcf
    index: loc-vcf-files
    title: The annotated VCFs, read from the files
    description: Each callset's annotated VCF, range-read through its index below 1 Mb, one lane per callset.
    layout: {x: 0, y: 12, w: 8, h: 5}
