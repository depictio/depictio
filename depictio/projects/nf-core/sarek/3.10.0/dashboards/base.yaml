    body: |
      ### How it is counted
      - **{{n_cons}}** variants kept by two callers or more, **{{n_any}}** kept by any caller
      - **{{n_alt}}** of the consensus variants change a protein
      - Target of **{{mb}} Mb**: the intervals of the run, summed over the primary contigs
