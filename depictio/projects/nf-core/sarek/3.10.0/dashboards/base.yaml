# The coverage recipes keep one mosdepth pass per sample (the recalibrated one
# when present): the duplicate-marked and recalibrated passes carry the same
# depth. mosdepth_summary reports each contig twice on a run with intervals:
# over the whole contig (scope genome) and over the intervals on it (scope
# region), with mosdepth's own `total` roll-up row per scope.
- title: Coverage
  subtitle: How deeply were the intervals covered, sample by sample?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:layers-outline
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # A depth range, not a contig or scope picker: the first card pins the
  # `total` row of the region scope, which a contig or scope pick would empty.
  filter_sections:
  - name: Coverage filters
    icon: mdi:filter-variant
    color: blue
    description: Narrows the contigs and samples by their mean depth
  grid_sections:
  - name: Coverage at a glance
    icon: mdi:counter
    color: blue
    description: Depth per sample, per interval and per contig over the samples in view
  - name: Depth per contig
    icon: mdi:chart-bar
    color: blue
    filter_bar: true
    visible_filters: 1
    description: Mean depth per contig and sample. It opens on the intervals, where the callers look for calls; the bar switches to whole contigs.
  - name: Sex check
    icon: mdi:chart-scatter-plot
    color: blue
    description: X against Y depth per sample, with the XX and XY zones shaded
  - name: Coverage tables
    icon: mdi:table
    color: gray
    description: Per-contig depth and the sex check, one row per sample
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [mosdepth](https://github.com/brentp/mosdepth) measures the depth over the intervals (the
      capture targets, or the calling intervals of a whole genome) and over each whole contig.
      A caller cannot report what was not sequenced, so read the depth before any call.
    tag: sk-cov-intro
    index: cov-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: mosdepth_summary
    interactive_component_type: RangeSlider
    column_name: mean_depth
    column_type: float64
    show_histogram: true
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: cyan
    section: Coverage filters
    tag: sk-cov-filter-depth
    index: cov-depth-range
    title: Mean depth
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: mosdepth_summary
    use: mosdepth/summary
    aggregation: median
    column_name: mean_depth
    column_type: float64
    filter_expr: "(col('scope') == 'region') & (col('chrom') == 'total')"
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:layers-outline
      icon_color: blue.4
      caption: median per sample, with its spread
      decimals: 1
    section: Coverage at a glance
    tag: sk-cov-card-depth
    index: cov-card-depth
    title: Depth on target
    description: Median of each sample's mean depth over the intervals.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: mosdepth_targets
    aggregation: median
    column_name: depth
    column_type: float64
    secondary_layout: threshold
    threshold_value: 20
    threshold_direction: min
    threshold_warn: 10
    display:
      icon_name: mdi:target
      icon_color: blue.6
      caption: median per interval, floor 20x
      decimals: 1
    section: Coverage at a glance
    tag: sk-cov-card-target
    index: cov-card-target
    title: Depth per interval
    description: Median mean depth of an interval in a sample. The bar turns amber under the 20x floor, where a heterozygous call gets hard to tell from noise, and red under 10x.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: mosdepth_summary
    use: mosdepth/summary
    aggregation: median
    column_name: mean_depth
    column_type: float64
    filter_expr: "(col('scope') == 'region') & (col('chrom') != 'total')"
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-histogram
      icon_color: blue.8
      caption: median per contig, with its distribution
      decimals: 1
    section: Coverage at a glance
    tag: sk-cov-card-contig
    index: cov-card-contig
    title: Depth across contigs
    description: Median depth over the intervals of one contig in one sample. A low tail is a contig the capture missed.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: mosdepth_targets
    aggregation: count
    column_name: pos
    column_type: int64
    filter_expr: "col('depth') < 20"
    secondary_layout: top_n
    breakdown_col: chrom
    top_n_count: 4
    display:
      icon_name: mdi:alert-outline
      icon_color: blue.9
      caption: intervals under 20x, the contigs with most
      decimals: 0
    section: Coverage at a glance
    tag: sk-cov-card-low
    index: cov-card-low
    title: Intervals under 20x
    description: Intervals whose mean depth in a sample is below 20x, counted once per sample.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # The section's own bar: the scope narrows the per-contig figure only.
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: mosdepth_summary
    interactive_component_type: Select
    column_name: scope
    column_type: object
    default_value: region
    display:
      icon_name: mdi:target
      custom_color: blue
      strip_label: Scope
    section: Depth per contig
    tag: sk-cov-filter-scope
    index: cov-scope-filter
    title: Intervals or whole contig
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: mosdepth_summary
    use: mosdepth/summary
    visu_type: bar
    dict_kwargs:
      x: chrom
      y: mean_depth
      color: sample
      barmode: group
      labels: {chrom: Contig, mean_depth: Mean depth, sample: Sample}
    section: Depth per contig
    tag: sk-cov-fig-contig
    index: cov-contig-bars
    title: Mean depth per contig
    description: One bar per sample and contig. The total is mosdepth's own roll-up over the scope.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: mosdepth_xy_sex_check
    visu_type: scatter
    mode: code
    code_content: |-
      # X against Y depth per library. The wedges are the two karyotypes the X/Y depth ratio separates at 10; a library near the line between them is worth a second look.
      colors = depictio_category_colors.get('inferred_sex') or {}
      d = df.filter(pl.col('x_coverage').is_not_null() & pl.col('y_coverage').is_not_null())
      top_x = max(1.0, float(d.get_column('x_coverage').max() or 0) * 1.15)
      top_y = max(top_x / 10 * 2.0, float(d.get_column('y_coverage').max() or 0) * 1.15)
      d = d.with_columns(pl.when((d.height <= 12) | pl.col('xy_ratio').is_null() | ((pl.col('xy_ratio') > 5) & (pl.col('xy_ratio') < 20))).then(pl.col('sample')).otherwise(pl.lit('')).alias('flag'))
      fig = px.scatter(d.to_pandas(), x='x_coverage', y='y_coverage', color='inferred_sex', color_discrete_map=colors, text='flag', custom_data=['sample'], hover_data={'sample': True, 'xy_ratio': ':.1f', 'flag': False}, category_orders={'inferred_sex': ['XX', 'XY']}, labels={'x_coverage': 'Chromosome X mean depth', 'y_coverage': 'Chromosome Y mean depth', 'inferred_sex': 'Inferred sex'})
      fig.update_traces(marker=dict(size=14, line=dict(width=1, color='white')), textposition='top center')
      fig.add_shape(type='path', path='M 0,0 L ' + str(top_x) + ',0 L ' + str(top_x) + ',' + str(top_x / 10) + ' Z', fillcolor='rgba(194,37,92,0.10)', line_width=0, layer='below')
      fig.add_shape(type='path', path='M 0,0 L ' + str(top_x) + ',' + str(top_x / 10) + ' L ' + str(top_x) + ',' + str(top_y) + ' L 0,' + str(top_y) + ' Z', fillcolor='rgba(28,126,214,0.10)', line_width=0, layer='below')
      fig.add_annotation(x=top_x * 0.97, y=top_x / 10 * 0.35, text='XX zone', showarrow=False, xanchor='right', font=dict(size=11))
      fig.add_annotation(x=top_x * 0.97, y=top_y * 0.9, text='XY zone', showarrow=False, xanchor='right', font=dict(size=11))
      fig.update_xaxes(range=[0, top_x])
      fig.update_yaxes(range=[0, top_y])
      fig.update_layout(margin=dict(t=10), legend_title_text='', legend=dict(orientation='h', y=-0.2))
    selection_enabled: true
    selection_column: sample
    section: Sex check
    tag: sk-cov-fig-sex
    index: cov-sex-scatter
    title: X depth against Y depth
    description: One point per library, coloured by the sex its X/Y depth ratio implies. The pink wedge is
      the XX zone (X depth at least ten times Y depth), the blue one the XY zone. The line between them is a
      cut-off of this template, since a male has one X and one Y so his ratio sits near 1, a female has almost no
      Y reads so hers is far above 10. The label is a heuristic, not a genotype.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: sarek
    data_collection_tag: mosdepth_summary
    use: mosdepth/summary
    row_selection_enabled: true
    row_selection_column: sample
    section: Coverage tables
    tag: sk-cov-table-contig
    index: cov-table-contig
    title: Per-contig coverage summary
    description: Mean, minimum and maximum depth per sample, contig and scope.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: sarek
    data_collection_tag: mosdepth_xy_sex_check
    use: mosdepth/xy_sex_check
    row_selection_enabled: true
    row_selection_column: sample
    section: Coverage tables
    tag: sk-cov-table-sex
    index: cov-table-sex
    title: X and Y coverage per sample
    description: X and Y depth, their ratio and the sex it implies, per sample.
    layout: {x: 0, y: 6, w: 8, h: 6}
# ============================================================================
# Variant calls
# ============================================================================
# The callers' own summary reports, caller against caller: record counts from
# bcftools stats, then the spectra behind each caller's Ts/Tv.
- title: Variant yield
  subtitle: How much did each caller call, and of what kind?
  tab_group: Variant calls
  tab_order: 3
  tab_icon: mdi:chart-bar
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Yield filters
    icon: mdi:filter-variant
    color: violet
    description: The callers in view, and the bcftools block the distribution reads; it opens on read depth, the first check of a call
  grid_sections:
  - name: Yield at a glance
    icon: mdi:counter
    color: violet
    description: Records, SNPs, indels and multiallelic sites over the callsets in view
  - name: Calls per caller
    icon: mdi:chart-bar
    color: violet
    description: SNP and indel counts per caller, one bar per sample
  - name: Mutation spectra
    icon: mdi:chart-bar
    color: violet
    description: Substitution classes and indel lengths, as shares of each callset
  - name: bcftools distributions
    icon: mdi:chart-bell-curve
    color: gray
    description: The blocks of bcftools stats, one at a time; it opens on read depth, the first check of a call, and the left panel picks another
    collapsed: true
  - name: Yield table
    icon: mdi:table
    color: gray
    description: SNPs, indels, MNPs and multiallelic sites per sample and caller
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      What each caller wrote, from its
      [bcftools stats](https://samtools.github.io/bcftools/bcftools.html#stats) report: SNP,
      indel and multiallelic counts, then the substitution and indel spectra as shares of each
      callset. The spectra compare shapes, not yields: a caller whose transversion bars rise
      is the one with the lower Ts/Tv.
    tag: sk-vy-intro
    index: vy-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: indigo
    section: Yield filters
    tag: sk-vy-filter-caller
    index: vy-caller-filter
    title: Caller
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_sections
    interactive_component_type: Select
    column_name: section
    column_type: object
    default_value: depth
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: yellow
    section: Yield filters
    tag: sk-vy-filter-block
    index: vy-block-filter
    title: bcftools block
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    aggregation: median
    column_name: n_records
    column_type: int64
    secondary_layout: top_n
    breakdown_col: caller
    top_n_count: 3
    display:
      icon_name: mdi:chart-bar
      icon_color: violet.4
      caption: median per callset, the callers that call most
      decimals: 0
    section: Yield at a glance
    tag: sk-vy-card-records
    index: vy-card-records
    title: Records per callset
    description: Median number of records a caller wrote for a sample, ranked by caller; an SV caller writes orders of magnitude fewer.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    aggregation: sum
    column_name: n_snps
    column_type: int64
    secondary_layout: composition
    breakdown_col: caller
    display:
      icon_name: mdi:dna
      icon_color: violet.6
      caption: SNPs over all callsets, by caller
      decimals: 0
    section: Yield at a glance
    tag: sk-vy-card-snps
    index: vy-card-snps
    title: SNPs
    description: SNP records summed over the callsets in view. The bar splits them by caller.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    aggregation: sum
    column_name: n_indels
    column_type: int64
    secondary_layout: donut
    breakdown_col: caller
    display:
      icon_name: mdi:arrow-expand-horizontal
      icon_color: violet.8
      caption: indels over all callsets, by caller
      decimals: 0
    section: Yield at a glance
    tag: sk-vy-card-indels
    index: vy-card-indels
    title: Indels
    description: Indel records summed over the callsets in view, split by caller.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    aggregation: sum
    column_name: n_multiallelic_sites
    column_type: int64
    secondary_layout: composition
    breakdown_col: caller
    display:
      icon_name: mdi:call-split
      icon_color: violet.9
      caption: sites over all callsets, by caller
      decimals: 0
    section: Yield at a glance
    tag: sk-vy-card-multi
    index: vy-card-multi
    title: Multiallelic sites
    description: Sites with more than one alternate allele, summed over the callsets in view.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    visu_type: bar
    mode: code
    code_content: |-
      # SNPs and indels per caller, stacked, one panel per sample; the colours are the variant-type colours of every other tab.
      d = df.select('sample', 'caller', pl.col('n_snps').alias('SNP'), pl.col('n_indels').alias('INDEL')).unpivot(index=['sample', 'caller'], on=['SNP', 'INDEL'], variable_name='variant_type', value_name='records')
      fig = px.bar(d.to_pandas(), x='caller', y='records', color='variant_type', facet_col='sample', facet_col_wrap=4, barmode='stack', color_discrete_map=depictio_category_colors.get('variant_type') or {}, labels={'caller': '', 'records': 'Records', 'variant_type': 'Variant type', 'sample': 'Sample'})
      fig.for_each_annotation(lambda a: a.update(text=a.text.split('=')[-1]))
      fig.update_layout(margin=dict(t=30))
    section: Calls per caller
    tag: sk-vy-fig-calls
    index: vy-calls-per-caller
    title: SNPs and indels per caller
    description: One panel per sample, one stacked bar per caller. MNPs are counted apart from indels.
    layout: {x: 0, y: 0, w: 8, h: 4}
  # One bar per caller, its callsets' shares averaged: the legend lists the
  # callers, not every sample and caller pair.
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: bcftools_substitution_spectrum
    visu_type: bar
    mode: code
    code_content: |-
      # Mean share of each caller's SNVs per substitution class, over the samples in view.
      d = df.group_by(['caller', 'substitution_class']).agg(pl.col('fraction').mean()).sort(['substitution_class', 'caller'])
      fig = px.bar(d.to_pandas(), x='substitution_class', y='fraction', color='caller', barmode='group', color_discrete_map=depictio_category_colors.get('caller') or {}, labels={'substitution_class': 'Substitution (pyrimidine reference)', 'fraction': "Share of the caller's SNVs", 'caller': 'Caller'})
      fig.update_layout(margin=dict(t=10))
    section: Mutation spectra
    tag: sk-vy-fig-sbs
    index: vy-spectrum-sbs
    title: Substitution spectrum per caller
    description: Six strand-folded classes, one bar per caller averaged over the samples in view; C>T and T>C are transitions.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: bcftools_indel_spectrum
    visu_type: bar
    mode: code
    code_content: |-
      # Mean share of each caller's indels per length, over the samples in view.
      d = df.group_by(['caller', 'length']).agg(pl.col('fraction').mean()).sort(['length', 'caller'])
      fig = px.bar(d.to_pandas(), x='length', y='fraction', color='caller', barmode='group', color_discrete_map=depictio_category_colors.get('caller') or {}, labels={'length': 'Indel length (bp; deletions negative)', 'fraction': "Share of the caller's indels", 'caller': 'Caller'})
      fig.update_layout(margin=dict(t=10))
    section: Mutation spectra
    tag: sk-vy-fig-indel-length
    index: vy-spectrum-indel
    title: Indel length spectrum per caller
    description: Indels within 20 bp, one bar per caller averaged over the samples in view; deletions left of zero.
    layout: {x: 0, y: 4, w: 8, h: 4}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_sections
    use: bcftools/stats_sections
    visu_type: bar
    mode: code
    code_content: |-
      # The block picked in the left panel, caller by caller. Each caller's records are drawn as a share of its own total, so a caller with more calls does not flatten the others; a numeric block keeps the bins that hold 99% of the records, and a log axis steps in when a few bins dominate the rest.
      sec = (df['section'].unique().to_list() or ['depth'])[0]
      cat = sec in ['substitution', 'singleton_stats']
      key = 'label' if cat else 'bin'
      titles = {'depth': 'Read depth at the site', 'indel_length': 'Indel length (bp; deletions negative)', 'allele_frequency': 'Non-reference allele frequency', 'substitution': 'Substitution', 'singleton_stats': 'Singleton type'}
      d = df.filter(pl.col(key).is_not_null() & (pl.col('count') > 0)).group_by(['caller', key]).agg(pl.col('count').sum()).with_columns((100.0 * pl.col('count') / pl.col('count').sum().over('caller')).alias('share'))
      pooled = d.group_by(key).agg(pl.col('count').sum()).sort(key).with_columns((pl.col('count').cum_sum() / pl.col('count').sum()).alias('cum'))
      lo = pooled.filter(pl.col('cum') >= 0.005)[key].min()
      hi = pooled.filter(pl.col('cum') >= 0.995)[key].min()
      d = d if cat else d.filter((pl.col('bin') >= lo) & (pl.col('bin') <= hi))
      d = d.with_columns(pl.col(key).cast(pl.Utf8).alias('x')) if cat else d.with_columns(pl.col('bin').cast(pl.Utf8).alias('x')).sort(['caller', 'bin'])
      bars = cat or d['bin'].n_unique() <= 12
      log = (not bars) and d['share'].max() > 25 * max(d['share'].median(), 0.001)
      by = d.group_by('x').agg(pl.col('share').sum(), pl.col(key).first().alias('k')).sort('share' if cat else 'k', descending=cat)
      colors = depictio_category_colors.get('caller') or {}
      labels = {'x': titles.get(sec, 'Bin'), 'bin': titles.get(sec, 'Bin'), 'share': "Share of the caller's records (%)" + (' - log scale' if log else ''), 'caller': 'Caller'}
      fig = px.bar(d.to_pandas(), x='x', y='share', color='caller', barmode='group', category_orders={'x': by['x'].to_list()}, color_discrete_map=colors, labels=labels) if bars else px.line(d.to_pandas(), x='bin', y='share', color='caller', markers=d['bin'].n_unique() <= 80, log_y=log, color_discrete_map=colors, labels=labels)
      fig.update_layout(margin=dict(t=10))
    section: bcftools distributions
    tag: sk-vy-fig-dist
    index: vy-dist-bars
    title: The chosen block, caller by caller
    description: Pick the block in the left panel. Each caller is drawn as a share of its own records so the yield does not flatten the rest; depth and indel length keep the bins that hold 99% of the records, and a log axis steps in when a few bins dominate.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_sections
    use: bcftools/stats_sections
    row_selection_enabled: true
    row_selection_column: sample
    section: bcftools distributions
    tag: sk-vy-table-dist
    index: vy-table-dist
    title: bcftools stats distributions
    description: One row per sample, caller, block and bin.
    layout: {x: 0, y: 4, w: 8, h: 6}
  - component_type: table
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    row_selection_enabled: true
    row_selection_column: caller
    section: Yield table
    tag: sk-vy-table-summary
    index: vy-table-summary
    title: Per-caller variant counts
    description: SNPs, indels, MNPs, others and multiallelic sites, one row per sample and caller.
    layout: {x: 0, y: 0, w: 8, h: 6}
# Per-callset QC computed from the VCFs (callset_qc), the callers' own FILTER
# partitions and the quality sweep from VCFtools.
- title: Call quality
  subtitle: Do the callsets look like clean germline calls?
  tab_group: Variant calls
  tab_order: 4
  tab_icon: mdi:check-decagram
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Quality filters
    icon: mdi:filter-variant
    color: cyan
    description: The callers, FILTER values and Ts/Tv range in view
  grid_sections:
  - name: Quality at a glance
    icon: mdi:counter
    color: cyan
    description: Ts/Tv, PASS share, zygosity and allele fraction over the callsets in view
  - name: Callset QC profile
    icon: mdi:chart-timeline-variant
    color: cyan
    description: Five QC numbers per callset on one plot, one line per callset
  - name: FILTER partitions
    icon: mdi:filter-variant
    color: cyan
    description: How each caller's own FILTER column splits its calls
  - name: Quality calibration
    icon: mdi:chart-line
    color: cyan
    description: Ts/Tv of each callset against the 1.8 floor, then of the calls above a rising quality floor
  - name: Quality tables
    icon: mdi:table
    color: gray
    description: The FILTER partitions and the Ts/Tv per callset
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      QC numbers computed from each callset's VCF, the callers' own FILTER partitions and the
      Ts/Tv against a quality floor, both from [VCFtools](https://vcftools.github.io/). A clean
      germline SNP callset has a Ts/Tv near 2 on a genome, higher on an exome, and its
      heterozygous calls sit near an allele fraction of 0.5.
    tag: sk-cq-intro
    index: cq-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: callset_qc
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: indigo
    section: Quality filters
    tag: sk-cq-filter-caller
    index: cq-caller-filter
    title: Caller
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: vcftools_filter_summary
    interactive_component_type: MultiSelect
    column_name: filter_label
    column_type: object
    display:
      icon_name: mdi:filter-outline
      custom_color: lime
    section: Quality filters
    tag: sk-cq-filter-label
    index: cq-filter-label-filter
    title: FILTER value
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: callset_qc
    interactive_component_type: RangeSlider
    column_name: ts_tv
    column_type: float64
    filter_expr: "col('ts_tv') > 0"
    show_histogram: true
    display:
      icon_name: mdi:scale-balance
      custom_color: orange
    section: Quality filters
    tag: sk-cq-filter-tstv
    index: cq-tstv-range
    title: Ts/Tv ratio
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: callset_qc
    aggregation: median
    column_name: ts_tv
    column_type: float64
    filter_expr: "col('ts_tv') > 0"
    secondary_layout: threshold
    threshold_value: 1.8
    threshold_direction: min
    threshold_warn: 1.5
    display:
      icon_name: mdi:scale-balance
      icon_color: cyan.4
      caption: median per callset, floor 1.8
      decimals: 2
    section: Quality at a glance
    tag: sk-cq-card-tstv
    index: cq-card-tstv
    title: Ts/Tv
    description: Median transition to transversion ratio of the callsets with SNPs. A germline SNP callset sits near 2 on a genome and higher on an exome; under 1.8 the callset is mixing in noise calls, under 1.5 it is mostly noise.
    layout: {x: 0, y: 0, w: 2, h: 2}
  # pass_pct is per callset, so the median is of callsets; the filter leaves
  # out a callset with no records.
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: callset_qc
    aggregation: median
    column_name: pass_pct
    column_type: float64
    filter_expr: "col('n_records') > 0"
    secondary_layout: coverage
    coverage_max: 100
    display:
      icon_name: mdi:check-circle-outline
      icon_color: cyan.6
      caption: median share of each callset's calls
      decimals: 1
    section: Quality at a glance
    tag: sk-cq-card-pass
    index: cq-card-pass
    title: PASS calls (%)
    description: Median share of a callset's calls the caller kept (FILTER PASS or unset). A caller that writes no FILTER values reads 100 here, which says nothing about its quality.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: callset_qc
    aggregation: median
    column_name: het_hom_ratio
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:arrow-left-right
      icon_color: cyan.8
      caption: median per callset, with its spread
      decimals: 2
    section: Quality at a glance
    tag: sk-cq-card-hethom
    index: cq-card-hethom
    title: Het to hom ratio
    description: Heterozygous over homozygous-alternate PASS calls of a callset. A human germline callset reads about 1.5 to 2; far above hints at contamination or mapping noise, far below at a loss of heterozygosity or a small, inbred cohort.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: callset_qc
    aggregation: median
    column_name: median_het_vaf
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: cyan.9
      caption: median per callset, with its distribution
      decimals: 3
    section: Quality at a glance
    tag: sk-cq-card-hetvaf
    index: cq-card-hetvaf
    title: Het allele fraction
    description: Median allele fraction of a callset's heterozygous PASS calls; 0.5 is the diploid expectation. A value well under 0.5 means the alternate allele is under-sampled, which reference bias or contamination produce.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: sarek
    data_collection_tag: callset_qc
    viz_kind: parallel_coordinates
    config:
      viz_kind: parallel_coordinates
      sample_col: callset
      group_col: caller
      scale: minmax
      # Five axes every SNP callset fills; the record count lives on Variant yield, and the
      # het allele fraction sits within 0.01 of 0.5 on every callset, so it has its card instead.
      metric_cols: [ts_tv, snp_fraction, pass_pct, het_hom_ratio, median_dp]
    section: Callset QC profile
    tag: sk-cq-av-profile
    index: cq-qc-profile
    title: Callset QC profile
    description: Each axis rescaled to compare, ticks in their units; colour is the caller. Brush an axis to keep a range.
    layout: {x: 0, y: 0, w: 8, h: 6}
  # One bar per caller, its FILTER values stacked (summed over the samples in
  # view). PASS keeps the green of category_colors.filter_label; the controls
  # switch counts and shares, sort the callers and hide values.
  - component_type: advanced_viz
    workflow_tag: sarek
    data_collection_tag: vcftools_filter_summary
    viz_kind: stacked_taxonomy
    config:
      viz_kind: stacked_taxonomy
      sample_id_col: caller
      taxon_col: filter_label
      abundance_col: n_variants
      normalise_to_one: true
      orientation: h
      sample_sort: category
      sort_category: PASS
      top_n: 8
      value_title: ''
      x_title: ''
      hidden_controls: [rank, group]
    section: FILTER partitions
    tag: sk-cq-fig-filter
    index: cq-filter-partitions
    title: Calls per FILTER value
    description: One bar per caller, split by the FILTER value it wrote; PASS is what it stands behind. Switch Normalise for counts, or sort on PASS.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: sarek
    data_collection_tag: vcftools_tstv_qual
    use: vcftools/tstv_quality_sweep
    # Callers write QUAL on scales a thousand-fold apart: a log axis keeps
    # every curve in view. One curve per callset: the legend goes under it.
    config:
      x_title: quality floor (log scale)
      y_title: Ts/Tv above the floor
      log_x: true
      legend_pos: bottom
    section: Quality calibration
    tag: sk-cq-av-qual
    index: cq-quality-sweep
    title: Ts/Tv against the quality floor, per caller
    description: One curve per sample and caller; callers use different quality scales, so read the shape. A curve that climbs toward 2 as the floor rises shows the low-quality calls were the noisy ones.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: callset_qc
    visu_type: bar
    mode: code
    code_content: |-
      # Ts/Tv of every callset with SNPs, in its caller's colour; the dashed line is the 1.8 floor (human genome 2.0 to 2.1, exome 2.8 to 3.0) and the dotted one the 1.5 warning level of the Ts/Tv card.
      d = df.filter(pl.col('ts_tv') > 0).sort('ts_tv', descending=True)
      fig = px.bar(d.to_pandas(), x='ts_tv', y='callset', color='caller', orientation='h', color_discrete_map=depictio_category_colors.get('caller') or {}, category_orders={'callset': d['callset'].to_list()}, labels={'ts_tv': 'Ts/Tv', 'callset': '', 'caller': 'Caller'})
      fig.add_vline(x=1.8, line_dash='dash', line_color='gray', annotation_text='floor 1.8', annotation_position='top')
      fig.add_vline(x=1.5, line_dash='dot', line_color='gray')
      fig.update_layout(margin=dict(t=30), legend=dict(orientation='h', y=-0.15))
    section: Quality calibration
    tag: sk-cq-fig-tstv
    index: cq-tstv-bars
    title: Ts/Tv per callset
    description: One bar per sample and caller, in the caller's colour. The dashed line is the 1.8 Ts/Tv floor
      of a germline callset; a human genome sits near 2.0 to 2.1 and an exome near 2.8 to 3.0, and below about
      1.8 false calls dilute the transitions. The dotted line is the 1.5 warning level of the Ts/Tv card, set by
      this template well under the floor (random errors give about 0.5). A bar left of the dashed line is
      under the floor.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: table
    workflow_tag: sarek
    data_collection_tag: vcftools_filter_summary
    use: vcftools/filter_summary
    row_selection_enabled: true
    row_selection_column: sample
    section: Quality tables
    tag: sk-cq-table-filter
    index: cq-table-filter
    title: FILTER breakdown per caller
    description: Calls, transitions, transversions and their ratio per sample, caller and FILTER value.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: sarek
    data_collection_tag: bcftools_stats_tstv
    use: bcftools/stats_tstv
    row_selection_enabled: true
    row_selection_column: caller
    section: Quality tables
    tag: sk-cq-table-tstv
    index: cq-table-tstv
    title: Ts/Tv per callset
    description: Transitions, transversions and their ratio, one row per sample and caller.
    layout: {x: 0, y: 6, w: 8, h: 6}
# The first tab that reads the VCFs themselves, one row per call: which
# callsets claim the same locus and allele, and how the calls sit on depth.
- title: Caller concordance
  subtitle: Which calls do the callers share, and where do they differ?
  tab_group: Variant calls
  tab_order: 5
  tab_icon: mdi:set-merge
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Call filters
    icon: mdi:filter-variant
    color: teal
    description: The callers, variant types, contigs and depths in view
  grid_sections:
  - name: Concordance at a glance
    icon: mdi:counter
    color: teal
    description: Calls, their types, allele fraction and depth over the calls in view
  - name: Shared calls
    icon: mdi:set-merge
    color: teal
    description: PASS calls matching on locus and allele, caller by caller
  - name: Allele fraction
    icon: mdi:chart-bell-curve
    color: teal
    description: Where each caller's calls sit between 0 and 1
  - name: Call table
    icon: mdi:table
    color: gray
    description: One row per call as the caller wrote it
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      One row per call, read from the VCFs: which callers claim the same locus and allele, and
      where their calls sit on allele fraction. Agreement between callers is not truth;
      for a benchmark against a truth set, run
      [nf-core/variantbenchmarking](https://nf-co.re/variantbenchmarking).
    tag: sk-cc-intro
    index: cc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: indigo
    section: Call filters
    tag: sk-cc-filter-caller
    index: cc-caller-filter
    title: Caller
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    interactive_component_type: MultiSelect
    column_name: variant_type
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: green
    section: Call filters
    tag: sk-cc-filter-type
    index: cc-type-filter
    title: Variant type
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    interactive_component_type: MultiSelect
    column_name: chrom
    column_type: object
    display:
      icon_name: mdi:map-marker-outline
