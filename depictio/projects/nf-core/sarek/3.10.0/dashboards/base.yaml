    title: Allele fraction
    description: Allele fraction of the coding calls. Heterozygous calls sit near 0.5 and homozygous ones near 1.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: sarek
    data_collection_tag: protein_genes
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: variants
      y_col: shared_pct
      label_col: gene
      color_col: worst_impact
      log_x: true
      x_title: Distinct coding variants
      y_title: Calls made by two or more callers (%)
      marker_size: 10
      # The six genes the callers agree on least carry the names.
      top_n_labels: 6
      label_order_col: shared_pct
      legend_pos: bottom
      selection_enabled: true
      selection_column: gene
    section: Genes on the protein view
    tag: sk-pr-av-genes
    index: pr-genes
    title: Genes with coding variants
    description: Each point is a gene with coding variants, placed by its number of distinct coding variants
      (log axis) and the share of its calls made by two or more callers, and coloured by its worst impact class.
      It covers the whole run; the six genes with the lowest share are named. A gene low on the axis carries
      variants one caller sees, often a mapping artefact. A click picks the gene the lollipop draws.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: sarek
    data_collection_tag: snpeff_protein_lollipop
    use: snpeff/coding_variant_needles
    config:
      max_subplot_genes: 4
      point_size: 8
      scale_points_by_effect: true
      selection_enabled: true
    section: Along the protein
    tag: sk-pr-av-lolli
    index: pr-lollipop
    title: Coding variants along the protein
    description: One lane per gene, one stem per variant, head colour by impact class and head size by allele fraction. Narrowed to the gene picked on the scatter; past four genes the tile switches to a picker.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: sarek
    data_collection_tag: snpeff_protein_lollipop
    use: snpeff/protein_lollipop
    row_selection_enabled: true
    row_selection_column: variant_key
    section: Coding variant table
    tag: sk-pr-table-lolli
    index: pr-table-protein
    title: Coding variants with a protein position
    description: Gene, amino-acid position, impact, consequence and protein change, one row per call.
    layout: {x: 0, y: 0, w: 8, h: 6}
# One genome_view navigator on mosdepth_windows, one lane per sample, and the
# genome browser under it that follows its brush: the browser's CRAM coverage
# is the depth at the region, so no second depth track repeats it. The region
# links in template.yaml still carry the region onto the per-target depth card
# and the calls. The cards opt in to the region with
# follow_region_filter, so they recount what the region holds. This is the only
# browser of the template.
- title: Locus
  subtitle: What do depth and calls show at one region?
  tab_group: Annotation
  tab_order: 13
  tab_icon: mdi:map-marker-outline
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Locus filters
    icon: mdi:filter-variant
    color: indigo
    description: The callers and variant types of the call track and cards
  grid_sections:
  - name: Region at a glance
    icon: mdi:counter
    color: indigo
    description: What the region in view holds, recounted on every brush or locus entry
  - name: Depth and reads on one axis
    icon: mdi:dna
    color: indigo
    description: Brush the lanes and the browser follows; its window shows as a band on the lanes
  components:
  - component_type: text
    order: 1
    body: >
      The navigator draws the mean depth of every sample in 1 Mb windows over the genome;
      the genome browser below shows the reads at its region and, when the run called variants,
      every caller's calls in the caller's colour of the other tabs. Pick a patient in the sample
      filters to load a tumour and its normal side by side, with the somatic calls under the
      reads. Type a locus or a gene in its header, or brush its axis, and the browser and cards follow.
    tag: sk-loc-intro
    index: loc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: indigo
    section: Locus filters
    tag: sk-loc-filter-caller
    index: loc-caller-filter
    title: Caller
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    interactive_component_type: MultiSelect
    column_name: variant_type
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: green
    section: Locus filters
    tag: sk-loc-filter-type
    index: loc-type-filter
    title: Variant type
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    use: vcf/variants
    aggregation: count
    column_name: variant_key
    column_type: object
    secondary_layout: composition
    breakdown_col: caller
    follow_region_filter: true
    display:
      icon_name: mdi:counter
      icon_color: indigo.4
      caption: calls in the region, by caller
      decimals: 0
    section: Region at a glance
    tag: sk-loc-card-calls
    index: loc-card-calls
    title: Calls
    description: Calls inside the region in view, one per callset that made them.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: mosdepth_targets
    aggregation: median
    column_name: depth
    column_type: float64
    secondary_layout: threshold
    threshold_value: 20
    threshold_direction: min
    threshold_warn: 10
    follow_region_filter: true
    display:
      icon_name: mdi:target
      icon_color: indigo.6
      caption: median per interval, floor 20x
      decimals: 1
    section: Region at a glance
    tag: sk-loc-card-depth
    index: loc-card-depth
    title: Depth per interval
    description: Median mean depth of the intervals inside the region in view.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    use: vcf/variants
    aggregation: median
    column_name: vaf
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    follow_region_filter: true
    display:
      icon_name: mdi:chart-box-outline
      icon_color: indigo.8
      caption: median per call, with its spread
      decimals: 2
    section: Region at a glance
    tag: sk-loc-card-vaf
    index: loc-card-vaf
    title: Allele fraction
    description: Median allele fraction of the calls inside the region in view.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    use: vcf/variants
    aggregation: median
    column_name: dp
    column_type: int64
    secondary_layout: histogram
    follow_region_filter: true
    display:
      icon_name: mdi:layers-outline
      icon_color: indigo.9
      caption: median per call, with its distribution
      decimals: 0
    section: Region at a glance
    tag: sk-loc-card-dp
    index: loc-card-dp
    title: Depth at the call
    description: Median read depth the callers reported at the calls inside the region.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: sarek
    data_collection_tag: mosdepth_windows
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      chr_col: chrom
      pos_col: pos
      end_col: end
      # depth_capped holds each sample's windows at 3x its median (the recipe says why):
      # the few windows over repeats read ten times the rest and flatten the lane.
      score_col: depth_capped
      feature_col: sample
      # One lane per sample: a dropout in one library shows as a gap in its
      # lane, which a pooled bar hides. The lane is titled with the sample and
      # wears the dashboard's colour for it (sample_id), the one the browser gives
      # that sample's reads; category_col keeps the browser's caller colours off it.
      sample_col: sample_id
      category_col: sample_id
      facet_by_sample: true
      max_facets: 8
      lane_height: 80
      auto_height: true
      facet_y_scale: shared
      mark: bar
      assembly: '{GENOME}'
      score_title: mean depth, capped at 3x the median
      # The 20x floor of the depth card.
      score_threshold: 20
      opacity: 0.9
      # No default_region: a contig-wide region would filter the whole contig, the
      # browser would follow it and every track would ask to be force-loaded. The
      # browser opens on its locus_from top call instead.
      region_filter_enabled: true
    section: Depth and reads on one axis
    tag: sk-loc-av-genome
    index: loc-depth-navigator
    title: Depth per sample, 1 Mb windows
    description: Mean depth per megabase window, one lane per sample, capped at 3 times the sample's median so repeats do not flatten it. The dashed line is the 20x floor of the depth cards, under which a heterozygous call gets hard to tell from noise. A locus or gene in the header, or a brush, moves the browser below.
    layout: {x: 0, y: 0, w: 8, h: 6}
  # The navigator's brush moves the view without filtering. Unpicked, it opens
  # on the span of the 20 best calls by quality when they lie within 2 Mb of each
  # other (else on the best call with 100 kb around it), so the window holds many
  # calls and genes rather than one. The stepper walks the others. The
  # circular view lists the structural variants.
  - component_type: jbrowse
    workflow_tag: sarek
    data_collection_tag: tracks
    section: Depth and reads on one axis
    # Opens on the first sample's small-variant callers, its reads and its
    # structural-variant callers (picked by category, so a run without Manta or
    # without any caller opens on what it has), with dbSNP and ClinVar under them,
    # so a call is read against what it is known as. The browser takes the sample of the
    # first such track: a run with a normal opens on it, and a run with tumours only opens
    # on the tumour and its somatic calls. A pair's tumour reads and somatic calls load
    # when the patient is picked in the sample filters.
    initial_categories: [Small variants, Alignments, Structural variants, Somatic variants]
    max_tracks: 12
    ucsc_tracks: [dbSnp155Common, clinvarMain]
    show_annotation: true
    # A 200 kb window holds a few dozen calls and several genes; the per-track limit
    # lets the alignments of that window load without the force-load prompt.
    fetch_size_limit_mb: 20
    follow_window: true
    color_by: caller
    show_overview: false
    # The lanes above already say where the browser is: its locus bar only
    # costs height here, and the tile's menu brings it back.
    show_header: false
    views: [circular]
    circular_categories: [Structural variants]
    selection_enabled: true
    selection_column: sample_id
    locus_from:
      data_collection_tag: vcf_variants
      chrom_column: chrom
      start_column: pos
      padding: 100000
      max_rows: 60
      sort_by: qual
      descending: true
      span_top: 20
      max_span: 2000000
      label_column: variant_key
    tag: sk-loc-browser
    index: loc-reads-browser
    title: Genome browser
    description: The reads of the samples in scope, tumour and normal alike, each caller's VCF in its colour (the somatic callers' under the reads) when the run called variants, the genes and the dbSNP and ClinVar tracks. It opens on the best calls by quality, else on the data, and follows the navigator above.
    layout: {x: 0, y: 6, w: 8, h: 10}
