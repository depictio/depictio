    section: Shared calls
    tag: sk-cc-av-variant-upset
    index: cc-variant-upset
    title: PASS calls shared between callers
    description: One set per caller; an element is a PASS call in one sample, so a bar is the calls that exact combination of callers made. Pick a sample in the left panel to read one library; the pickers on this tab do not narrow it.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: figure
    workflow_tag: sarek
    data_collection_tag: vcf_variants
    use: vcf/variants
    visu_type: line
    mode: code
    code_content: |-
      # Share of each caller's calls in 40 allele-fraction bins, so callers with different numbers of calls compare. The shaded bands are the two expected peaks: heterozygous near 0.5, homozygous alternate near 1.
      d = df.filter(pl.col('vaf').is_not_null()).with_columns((pl.col('vaf').clip(0, 1) * 40).floor().clip(0, 39).cast(pl.Int64).alias('b'))
      g = d.group_by(['caller', 'b']).len().with_columns((pl.col('len') / pl.col('len').sum().over('caller') * 100).alias('share')).with_columns(((pl.col('b') + 0.5) / 40).alias('vaf_bin')).sort(['caller', 'b'])
      fig = px.line(g.to_pandas(), x='vaf_bin', y='share', color='caller', color_discrete_map=depictio_category_colors.get('caller') or {}, labels={'vaf_bin': 'Variant allele fraction', 'share': "Share of the caller's calls (%)", 'caller': 'Caller'})
      fig.add_vrect(x0=0.35, x1=0.65, fillcolor='gray', opacity=0.12, line_width=0, layer='below', annotation_text='heterozygous', annotation_position='top left')
      fig.add_vrect(x0=0.9, x1=1.0, fillcolor='gray', opacity=0.12, line_width=0, layer='below', annotation_text='homozygous alt', annotation_position='top left')
      fig.update_layout(margin=dict(t=10))
    section: Allele fraction
    tag: sk-cc-fig-vaf
    index: cc-vaf-dist
    title: Allele fraction per caller
    description: Share of each caller's calls per allele-fraction bin. A germline callset peaks near 0.5
      (heterozygous) and near 1 (homozygous alternate). The grey bands mark where those peaks are expected, 0.35
      to 0.65 for heterozygous calls and 0.9 to 1 for homozygous-alternate ones, the spread that read sampling
      gives around 0.5 and 1 at usual depths; a peak outside its band or a shoulder of low fractions flags
      contamination or noise calls.
    layout: {x: 0, y: 0, w: 8, h: 5}
