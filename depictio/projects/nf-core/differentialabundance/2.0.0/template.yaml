# nf-core/differentialabundance Template v2.0.0 - Differential expression
# ============================================================================
# This is a TEMPLATE project configuration. Use with:
#   depictio run --template nf-core/differentialabundance/2.0.0 --data-root /path/to/your/data
#
# Tested against nf-core/differentialabundance AWS megatest results:
#   s3://nf-core-awsmegatests/differentialabundance/results-30ed7741fc392127156c2fb10cfa3d69d216b54b
#   (24 mouse RNA-seq samples, two contrasts: WT vs KO with a batch blocking
#    factor, and Control vs Treated. See megatest.yaml for the fetch manifest.)
# ============================================================================
#
# SCOPE
# This template covers the DESeq2 route (`--differential_method deseq2`, the
# pipeline default). The limma / propd / dream routes write differently named
# tables and are not bound here.
#
# NO MULTIQC. differentialabundance runs no MultiQC: it ships an R/shinyngs
# report instead, which is not parquet-backed. There is therefore no
# `multiqc_data` data collection and no QC tab; the Samples tab plays that role.
#
# LAYOUT NOTE. Data collection scans match on FILE NAME, so both the plain
# layout (`tables/differential/<contrast>.deseq2.results.tsv`) and the megatest's
# extra parameter-set directory
# (`tables/differential/<paramset>/<contrast>.deseq2.results.tsv`) are picked up
# by the same recursive scan. The recipe globs use `**` for the same reason.
template:
  template_id: "nf-core/differentialabundance/2.0.0"
  description: "nf-core/differentialabundance template: DESeq2 differential expression: per-contrast statistics, gene annotation and the variance-stabilised sample space."
  version: "1.0.0"
  variables:
    - name: "DATA_ROOT"
      description: "Root directory containing differentialabundance output (tables/, other/, pipeline_info/)."
      required: true
    - name: "SAMPLESHEET_FILE"
      description: "Path to the pipeline's --input observation sheet. Auto-detected from {DATA_ROOT}/input/ (CSV or TSV) when omitted; download_test_data.sh puts the megatest's sheet there."
      required: false
    - name: "NO_GSEA"
      description: "Set (--var NO_GSEA=true) for a run that did not run GSEA (no --gsea_run, or no gene-set file). Prunes the two enrichment collections, so the Enrichment tab drops out instead of scanning for tables that were never written."
      required: false
  # Variables supplied when materialising the bundled reference/demo dataset.
  # The sheet is the run's own --input file, mirrored under input/ by the
  # megatest fetch (see megatest.yaml post_fetch_help).
  reference:
    vars:
      SAMPLESHEET_FILE: "{DATA_ROOT}/input/samplesheet.tsv"
  # How this run's provenance (parameters, thresholds, tool versions) is
  # collected at ingest, surfaced in the ingestion report and the dashboard
  # Settings drawer. Keys matched by no group rule land in 'Other'.
  provenance:
    sources:
      - name: "params"
        glob: "pipeline_info/params*.json"
        format: "json"
        pick: "latest"
        exclude_keys:
          - "genomes"            # the whole iGenomes catalogue, ~100 KB of noise
          - "*_ref_databases*"
          - "hook_url"           # nf-core runs put a live Slack webhook here
      - name: "software_versions"
        glob: "pipeline_info/*software*versions*.yml"
        format: "yaml"
        pick: "latest"
        group: "Software versions"
    groups:
      - group: "Study"
        key_patterns: ["study_*", "observations_*", "features_*", "matrix", "input", "contrasts", "querygse", "paramset_name", "paramsheet", "gtf", "control_features", "sizefactors_from_controls", "feature_length_matrix"]
      - group: "Abundance filtering"
        key_patterns: ["filtering_*"]
      - group: "Exploratory analysis"
        key_patterns: ["exploratory_*"]
      - group: "Differential testing"
        key_patterns: ["differential_*"]
      - group: "DESeq2"
        key_patterns: ["deseq2_*"]
      - group: "Alternative test engines"
        key_patterns: ["limma_*", "propd_*", "dream_*"]
      - group: "Functional analysis"
        key_patterns: ["functional_method", "gene_sets_files", "gsea_*", "gprofiler2_*", "decoupler_*", "grea_*"]
      - group: "Affy / Proteus input"
        key_patterns: ["affy_*", "proteus_*"]
      - group: "Reporting"
        key_patterns: ["report_*", "shinyngs_*", "skip_reports", "disable_report_modules", "logo_file", "css_file", "citations_file", "plaintext_email", "email*"]
      - group: "Run context"
        key_patterns: ["outdir", "seed", "round_digits", "version", "publish_dir_mode", "monochrome_logs", "validate_params", "help*", "show_hidden", "pipelines_testdata_base_path", "trace_report_suffix", "config_profile_*", "custom_config_*", "genome", "igenomes_*"]
    highlight:
      - "study_type"
      - "differential_method"
      - "differential_min_fold_change"
      - "differential_max_qval"
      - "deseq2_test"
      - "deseq2_shrink_lfc"
      - "deseq2_vs_method"
      - "exploratory_n_features"
      - "contrasts"
  dashboards:
    - "dashboards/base.yaml"
  conditional:
    # GSEA is opt-in: it runs only when the run is given a gene-set file. With
    # no report tables on disk the scan finds nothing, so the two collections
    # are pruned and the components reading them drop with them.
    - if_var_present: "NO_GSEA"
      remove_dc_tags: ["gsea_report_raw", "gsea_report"]
      dashboards: ["dashboards/base.yaml"]

# ============================================================================
# PROJECT CONFIGURATION
# ============================================================================

name: "Differential Abundance Analysis"
project_type: "advanced"
is_public: true
workflows:
  - name: "differentialabundance"
    version: "2.0.0"
    engine:
      name: "nextflow"
    catalog:
      name: "nf-core"
      url: "https://nf-co.re"
    repository_url: "https://github.com/nf-core/differentialabundance"
    data_location:
      structure: "flat"
      locations:
        - "{DATA_ROOT}"
    data_collections:
      # ----------------------------------------------------------------
      # Hub: the observation sheet, normalised, joined to the size factors
      # ----------------------------------------------------------------
      - data_collection_tag: "samples"
        description: "Observation sheet normalised to sample_id / group / size_factor, with every original column kept"
        config:
          type: "Table"
          metatype: "Metadata"
          source: "transformed"
          transform:
            recipe: "nf-core/differentialabundance/samples.py"
            source_overrides:
              samplesheet:
                path: "{SAMPLESHEET_FILE}"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample_id": "Sample identifier, matching the columns of the abundance matrices"
              "group": "The sheet's most factor-like column (fewest levels >= 2), the default grouping"
              "size_factor": "DESeq2 library-size normalisation factor for this sample"
              "factor_2": "The sheet's second most factor-like column, aliased so a shipped filter can bind to it"
              "factor_2_name": "Name of the sheet column factor_2 was aliased from"
              "factor_3": "The sheet's third most factor-like column"
              "factor_3_name": "Name of the sheet column factor_3 was aliased from"
              "factor_4": "The sheet's fourth most factor-like column, usually the batch or block"
              "factor_4_name": "Name of the sheet column factor_4 was aliased from"

      # ----------------------------------------------------------------
      # Raw DESeq2 tables. These two exist so the tidy collections below can
      # read them through `dc_ref`: the contrast id lives only in the FILE
      # NAME, and only a scan carries the path (`include_file_paths`) into the
      # frame, because the recipe glob loader concatenates files without a label.
      # `infer_schema_length: 0` reads every column as text: DESeq2 writes `NA`
      # in numeric columns and `chromosome` mixes 1..19 with MT/X/Y, so
      # per-file inference disagrees between contrasts and the concat fails.
      # The recipes recast.
      # ----------------------------------------------------------------
      - data_collection_tag: "deseq2_results_raw"
        description: "Raw per-contrast DESeq2 results tables (input of deseq2_results)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: ".*\\.deseq2\\.results\\.tsv$"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
              null_values: ["NA", "NaN", ""]
              include_file_paths: "source_path"
              infer_schema_length: 0
            columns_description:
              "gene_id": "Ensembl gene identifier"
              "baseMean": "Mean of normalised counts across samples"
              "log2FoldChange": "Effect size of the contrast"
              "lfcSE": "Standard error of log2FoldChange"
              "pvalue": "Raw Wald p-value"
              "padj": "Benjamini-Hochberg adjusted p-value"
              "source_path": "File the row came from; the contrast id is derived from it"

      - data_collection_tag: "deseq2_results_annotated_raw"
        optional: true  # only written when the run supplied a --gtf annotation
        description: "Raw per-contrast DESeq2 results joined to the GTF annotation (input of deseq2_results_annotated)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: ".*_deseq2\\.annotated\\.tsv$"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
              null_values: ["NA", "NaN", ""]
              include_file_paths: "source_path"
              infer_schema_length: 0
            columns_description:
              "gene_id": "Ensembl gene identifier"
              "gene_name": "Gene symbol from the GTF"
              "chromosome": "Chromosome the feature sits on"
              "gene_biotype": "Ensembl biotype (protein_coding, lncRNA, pseudogene …)"
              "source_path": "File the row came from; the contrast id is derived from it"

      # ----------------------------------------------------------------
      # Catalog-transformed collections (tool `deseq2`)
      # ----------------------------------------------------------------
      - data_collection_tag: "deseq2_results"
        description: "DESeq2 statistics per contrast and feature, with the significance call and the MA abscissa precomputed"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "deseq2/results_long.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "contrast": "Contrast id, derived from the results file name"
              "gene_id": "Feature identifier"
              "base_mean": "Mean of normalised counts across samples"
              "log2fc": "log2 fold change (volcano / MA effect size)"
              "lfc_se": "Standard error of log2fc"
              "pvalue": "Raw Wald p-value (QQ plot)"
              "padj": "Adjusted p-value; null where DESeq2 filtered the feature out"
              "log2_base_mean": "log2(baseMean + 1), the MA abscissa"
              "neg_log10_padj": "-log10(padj), capped at 300 where padj underflowed to 0"
              "significant": "padj < 0.05 and |log2fc| >= 1"
              "direction": "up / down / not significant"

      - data_collection_tag: "deseq2_results_annotated"
        optional: true  # depends on deseq2_results_annotated_raw
        description: "The same statistics joined to the gene annotation: symbol, chromosome, coordinates, biotype"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "deseq2/results_annotated.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "contrast": "Contrast id, derived from the results file name"
              "gene_id": "Feature identifier"
              "gene_name": "Gene symbol (falls back to the id when the GTF has none)"
              "chromosome": "Chromosome"
              "start": "Feature start coordinate"
              "end": "Feature end coordinate"
              "gene_biotype": "Ensembl biotype"
              "log2fc": "log2 fold change"
              "padj": "Adjusted p-value"
              "neg_log10_padj": "-log10(padj), the Manhattan ordinate"
              "significant": "padj < 0.05 and |log2fc| >= 1"
              "direction": "up / down / not significant"

      - data_collection_tag: "deseq2_vst_pca"
        description: "Principal components of the variance-stabilised matrix, one point per sample"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "deseq2/vst_pca.py"
            source_overrides:
              samplesheet:
                path: "{SAMPLESHEET_FILE}"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample_id": "Sample identifier"
              "dim_1": "First principal component"
              "dim_2": "Second principal component"
              "group": "The sheet's most factor-like column, the default colouring"

      - data_collection_tag: "deseq2_vst_heatmap"
        description: "The 500 most variable features of the variance-stabilised matrix, features x samples"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "deseq2/vst_top_variable.py"
            source_overrides:
              samplesheet:
                path: "{SAMPLESHEET_FILE}"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "gene_id": "Feature identifier (the heatmap row index)"
              "_col_annotations_json": "Serialised categorical column annotations built from the sample sheet"

      - data_collection_tag: "deseq2_sample_distance"
        description: "Euclidean sample-to-sample distances over the most variable features"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "deseq2/vst_sample_distance.py"
            source_overrides:
              samplesheet:
                path: "{SAMPLESHEET_FILE}"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Sample identifier (the heatmap row index)"
              "_col_annotations_json": "Serialised categorical column annotations built from the sample sheet"

      # ----------------------------------------------------------------
      # The exploratory panel the PCA cannot replace: what each library's
      # expression distribution looks like. Reduced in the recipe to a density
      # curve per sample on one shared grid, so 31000 features by 24 samples
      # become 24 x 60 rows.
      # ----------------------------------------------------------------
      - data_collection_tag: "deseq2_vst_distribution"
        description: "Per-sample density of the variance-stabilised matrix, on a grid shared by every sample"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "deseq2/vst_distribution.py"
            source_overrides:
              samplesheet:
                path: "{SAMPLESHEET_FILE}"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample_id": "Sample identifier"
              "bin_centre": "Expression value at the middle of the bin"
              "density": "Share of the sample's expressed features in this bin"
              "group": "The sheet's most factor-like column, the default colouring"
              "median": "Median expression of this sample, repeated on each of its rows"
              "floor_share": "Share of the sample's features sitting at the matrix floor"

      # ----------------------------------------------------------------
      # GSEA. The pipeline runs it pre-ranked over the DESeq2 statistics and
      # writes one report per POLE of each contrast, so a two-contrast run
      # publishes four tables. Neither the contrast nor the pole is a column of
      # any of them: both live only in the file name, which is why this is a
      # raw scan feeding a recipe by tag rather than a glob source.
      #
      # Optional because GSEA only runs when the run is given a gene-set file
      # (--gsea_run true --gsea_gene_sets ...).
      # ----------------------------------------------------------------
      - data_collection_tag: "gsea_report_raw"
        optional: true
        description: "Raw GSEA report tables, one per contrast and pole (input of gsea_report)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: ".*\\.gsea_report_for_.*\\.tsv$"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
              infer_schema_length: 0
              truncate_ragged_lines: true
              include_file_paths: "source_path"
            columns_description:
              "NAME": "Gene set name, as GSEA writes it"
              "source_path": "File the row came from; the contrast and the pole are derived from it"

      - data_collection_tag: "gsea_report"
        optional: true
        description: "Gene sets enriched at each pole of each contrast, with NES, FDR and leading edge"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "gsea/report.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "contrast": "Contrast the report belongs to, read from the file name"
              "phenotype": "Pole of the contrast this set came up at"
              "term": "Gene set name"
              "size": "Genes of the set found in the ranked list"
              "es": "Enrichment score"
              "nes": "Enrichment score normalised for set size, the value to compare across sets"
              "nom_pvalue": "Nominal p-value"
              "fdr_qvalue": "False discovery rate across the sets of this report"
              "fwer_pvalue": "Family-wise error rate"
              "neg_log10_fdr": "Minus log10 of the FDR q-value, clipped at the run's own floor"
              "rank_at_max": "Position in the ranked list where the enrichment score peaked"
              "leading_edge_percent": "Share of the set sitting in the leading edge"
              "leading_edge": "The leading-edge string GSEA writes, kept as published"

# ============================================================================
# RUNTIME LINKS CONFIGURATION
# ============================================================================
# Two independent join keys. `sample_id` fans the persistent sample filter out
# from the hub sheet to the two sample-space collections, and carries a PCA
# lasso on to the distance matrix. Links are directional and resolution never
# derives a reverse, so a selection source needs its own outgoing link even
# when the hub already reaches both ends. `gene_id` carries a
# gene picked in a figure or a table row over to the annotated table (and back),
# which is what makes the scatter <-> table selection pair work.
links:
  - source_dc_tag: "samples"
    source_column: "sample_id"
    target_dc_tag: "deseq2_vst_pca"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample_id"
    description: "Filter the sample PCA by the samples picked on the hub sheet"
    enabled: true

  - source_dc_tag: "samples"
    source_column: "sample_id"
    target_dc_tag: "deseq2_sample_distance"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the sample-distance matrix by the samples picked on the hub sheet"
    enabled: true

  - source_dc_tag: "deseq2_vst_pca"
    source_column: "sample_id"
    target_dc_tag: "deseq2_sample_distance"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Carry a cluster lassoed on the PCA over to the sample-distance matrix"
    enabled: true

  - source_dc_tag: "deseq2_results"
    source_column: "gene_id"
    target_dc_tag: "deseq2_results_annotated"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "gene_id"
    description: "Carry a gene selected on the differential scatter over to the annotated table"
    enabled: true

  - source_dc_tag: "deseq2_results_annotated"
    source_column: "gene_id"
    target_dc_tag: "deseq2_results"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "gene_id"
    description: "Carry a gene selected in the annotated table back to the differential panels"
    enabled: true

  # The variance-stabilised heatmap is a WIDE matrix: the samples are its column
  # names, not values in a column. `_narrow_wide_matrix_columns` mirrors the
  # filter onto the column set by value, and `target_field` therefore has to
  # name a column the matrix does NOT have. `gene_id` and
  # `_col_annotations_json` are its real columns; a nominal field leaves the row
  # filter to be skipped, which is what lets the column mirror do the work.
  - source_dc_tag: "samples"
    source_column: "sample_id"
    target_dc_tag: "deseq2_vst_heatmap"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample_id"
    description: "Narrow the variance-stabilised heatmap to the samples picked on the hub sheet"
    enabled: true

  - source_dc_tag: "deseq2_vst_pca"
    source_column: "sample_id"
    target_dc_tag: "deseq2_vst_heatmap"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample_id"
    description: "Carry a cluster lassoed on the PCA over to the variance-stabilised heatmap"
    enabled: true

  - source_dc_tag: "samples"
    source_column: "sample_id"
    target_dc_tag: "deseq2_vst_distribution"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample_id"
    description: "Filter the per-sample distributions by the samples picked on the hub sheet"
    enabled: true

  - source_dc_tag: "deseq2_vst_pca"
    source_column: "sample_id"
    target_dc_tag: "deseq2_vst_distribution"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample_id"
    description: "Carry a cluster lassoed on the PCA over to the per-sample distributions"
    enabled: true

  # The GSEA reports carry the contrast the pipeline named the directory after,
  # which is the same string the DESeq2 tables carry, so picking a contrast on
  # the differential tab narrows the enrichment panels to the same comparison.
  # The pinned Contrast scope is sourced on `deseq2_results.contrast`; this
  # link is what carries it onto the annotated table the Expression and Genome
  # view tabs read (the gene_id links above carry selections, not contrasts).
  - source_dc_tag: "deseq2_results"
    source_column: "contrast"
    target_dc_tag: "deseq2_results_annotated"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "contrast"
    description: "Narrow the annotated statistics to the contrasts picked in the left panel"
    enabled: true

  - source_dc_tag: "deseq2_results"
    source_column: "contrast"
    target_dc_tag: "gsea_report"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "contrast"
    description: "Filter the enrichment panels to the contrast picked on the differential tab"
    enabled: true
