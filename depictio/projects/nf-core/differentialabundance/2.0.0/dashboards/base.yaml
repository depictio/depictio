  - component_type: advanced_viz
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    use: deseq2/volcano
    config:
      label_col: gene_id
      category_col: direction
      significance_threshold: 0.05
      effect_threshold: 1.0
      fold_change_threshold: 1.0
      # The results carry Ensembl ids only (the symbol is in the annotated
      # table), so labels would pile ids over the top calls: hover names them.
      top_n_labels: 15
      show_labels: false
      # MA view bindings: mean expression on x, the same fold change on y.
      avg_log_intensity_col: log2_base_mean
      log2_fold_change_col: log2fc
      view: volcano
      views: [volcano, ma, qq]
      p_value_col: pvalue
      show_ci: true
      show_identity: true
    section: Volcano, MA and QQ
    tag: da-de-volcano
    index: de-volcano
    title: Volcano, MA and QQ
    description: -log10(padj) against log2 fold change; the View switch puts the fold change against mean expression (MA) or the raw p-values against the null (QQ). The dashed lines are the pipeline's cut-offs, padj 0.05 and a two-fold change.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    use: deseq2/results
    visu_type: histogram
    dict_kwargs: {x: pvalue, facet_col: contrast, facet_col_wrap: 1, nbins: 40}
    section: Test diagnostics
    tag: da-de-pvalue-histogram
    index: de-pvalue-histogram
    title: Raw p-value distribution
    description: One histogram per contrast, 40 bins over 0 to 1. Flat with a spike at zero is a sound test; a hump or a rise towards one is not.
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: figure
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    use: deseq2/results
    mode: code
    code_content: |
      # One point per gene: its effect size in the first contrast against the
      # second. Needs a per-contrast reshape, so this tile is code mode. The
      # direction colours come from the family map; `neither` takes its grey.
      colors = depictio_category_colors.get('direction') or {}
      contrasts = sorted(df['contrast'].unique().to_list())
      if len(contrasts) >= 2:
          a, b = contrasts[0], contrasts[1]
          left = df.filter(pl.col('contrast') == a).select(
              'gene_id', pl.col('log2fc').alias('x'), pl.col('significant').alias('sig_x')
          )
          right = df.filter(pl.col('contrast') == b).select(
              'gene_id', pl.col('log2fc').alias('y'), pl.col('significant').alias('sig_y')
          )
          paired = left.join(right, on='gene_id', how='inner').with_columns(
              pl.when(pl.col('sig_x') & pl.col('sig_y')).then(pl.lit('both'))
              .when(pl.col('sig_x')).then(pl.lit(a))
              .when(pl.col('sig_y')).then(pl.lit(b))
              .otherwise(pl.lit('neither'))
              .alias('called_in')
          )
          grey = colors.get('not significant')
          # A contrast id is long: break each axis title over two lines.
          def two_lines(name):
              words = name.split('_')
              half = len(words) // 2
              return ' '.join(words[:half]) + '<br>' + ' '.join(words[half:])
          fig = px.scatter(
              paired.to_pandas(), x='x', y='y', color='called_in',
              color_discrete_map={'neither': grey} if grey else {},
              custom_data=['gene_id'], opacity=0.55,
              labels={'x': two_lines(a), 'y': two_lines(b), 'called_in': 'Called in'},
          )
          fig.add_hline(y=0, line_dash='dot')
          fig.add_vline(x=0, line_dash='dot')
      else:
          # A single-contrast run has nothing to pair: fall back to the MA view.
          fig = px.scatter(
              df.to_pandas(), x='log2_base_mean', y='log2fc', color='direction',
              color_discrete_map=colors, custom_data=['gene_id'], opacity=0.55,
              labels={'log2_base_mean': 'log2 mean expression', 'log2fc': 'log2 fold change'},
          )
      fig.update_traces(marker={'size': 6})
      fig.update_layout(margin={'t': 24, 'l': 56, 'r': 16, 'b': 48})
      fig.update_xaxes(automargin=True)
      fig.update_yaxes(automargin=True)
    selection_enabled: true
    selection_column: gene_id
    section: Test diagnostics
    tag: da-de-contrast-pair
    index: de-contrast-pair
    title: Contrast against contrast
    description: Effect sizes of the first two contrasts (by id) against each other, gene by gene; a single-contrast run shows its MA view instead. Select points to follow the genes into the annotated table.
    layout: {x: 4, y: 0, w: 4, h: 5}
  - component_type: advanced_viz
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results_annotated
    use: deseq2/annotated_da_barplot
    config:
      significance_col: padj
      significance_threshold: 0.05
      top_n: 10
    section: Effect by biotype
    tag: da-de-bars
    index: de-strongest-bars
    title: Strongest calls per contrast
    description: The 10 largest effect sizes in each contrast; an empty panel means the contrast called nothing.
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: figure
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results_annotated
    use: deseq2/results_annotated
    visu_type: box
    dict_kwargs: {x: gene_biotype, y: log2fc, color: direction}
    section: Effect by biotype
    tag: da-de-biotype-box
    index: de-biotype-box
    title: Effect size by biotype
    description: log2 fold change within each biotype, split by call direction; a class that shifts as a whole stands apart from one with a few loud genes.
    layout: {x: 4, y: 0, w: 4, h: 5}
  - component_type: table
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results_annotated
    use: deseq2/results_annotated
    row_selection_enabled: true
    row_selection_column: gene_id
    section: Gene detail
    tag: da-de-table-annotated
    index: de-table-annotated
    title: Annotated DESeq2 results
    description: Statistics joined to the GTF; features the annotation did not cover are dropped, so this table is shorter than the full one.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results_annotated
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: gene_id
      title_col: gene_name
      selection_source: any
      linked_component: da-de-table-annotated
      sections:
        Gene: [gene_name, gene_id, gene_biotype]
        Location: [chromosome, start, end]
        Test: [contrast, direction, log2fc, padj]
      link_templates:
        gene_id: "https://www.ensembl.org/id/{value}"
    section: Gene detail
    tag: da-de-record
    index: de-record
    title: Gene record
    description: The gene picked in the table or a figure, one card per contrast it was tested in. Ensembl resolves the stable identifier for any species.
    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: table
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    use: deseq2/results
    row_selection_enabled: true
    row_selection_column: gene_id
    section: All results
    tag: da-de-table-results
    index: de-table-results
    title: DESeq2 results
    description: Every gene in every contrast, with the significance call; a run without a GTF has only this table.
    layout: {x: 0, y: 0, w: 8, h: 6}
