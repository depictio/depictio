    data_collection_tag: deseq2_results_annotated
    use: deseq2/manhattan
    config:
      feature_col: gene_name
      score_kind: "-log10(padj)"
      score_threshold: 1.301
      highlight: above
      color_by_columns: [direction, gene_biotype]
      default_color_by: direction
      top_n_labels: 12
      selection_enabled: true
      selection_column: gene_id
    title: Significance along the genome
    description: Height is -log10(padj); the threshold line sits at padj 0.05. Features whose padj underflowed to zero are drawn at 300.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 6}

  # --------------------------------------------------- per-chromosome detail
  - component_type: text
    tag: da-gv-detail-intro
    section: Per-chromosome detail
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results_annotated
    title: Gene by gene
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One lane per contrast, one head per gene at its start coordinate,
      coloured by direction and sized by significance. Pick a chromosome in
      Region scope before turning the stems on: coordinates from different
      contigs otherwise share one axis.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: da-av-lollipop
    index: da-av-lollipop
    section: Per-chromosome detail
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results_annotated
    use: deseq2/chromosome_lollipop
    config:
      # Keyed on the contrast, not the chromosome. `feature_id_col` is the
      # subplot LANE, and the catalog render binds it to `chromosome`: a mouse
      # GTF carries thirty-odd contigs, past `max_subplot_genes`, so the panel
      # collapsed into a single-contig dropdown and no stem said which gene it
      # was. Two contrasts give two lanes that both draw, and `label_col` puts
      # the gene symbol on the hover and on the top-N labels, which is what
      # reading the panel gene by gene needs.
      feature_id_col: contrast
      position_col: start
      category_col: direction
      label_col: gene_name
      effect_col: neg_log10_padj
      scale_points_by_effect: true
      max_subplot_genes: 6
      gene_sort: name
      # A stem is one layout shape per call, and both lanes now draw every row
      # the endpoint returns (it hash-samples ~55 k calls down to 10 k). Off
      # until the chromosome picker has narrowed the set; the switch is in the
      # panel's own controls.
      show_stems: false
      point_size: 6
      top_n_labels: 8
    title: Calls per gene
    description: One lane per contrast, one head per gene at its start coordinate, coloured by direction and sized by significance; the eight strongest calls in each lane carry their gene symbol. Pick a chromosome in Region scope first, since coordinates from different contigs otherwise stack on the same axis.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}

  # --------------------------------------------------------------- left panel
  - component_type: interactive
    tag: da-gv-filter-chromosome
    index: da-gv-chromosome-filter
    section: Region scope
    group: Region scope
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results_annotated
    interactive_component_type: MultiSelect
