    index: da-gv-signal-range
    section: Signal scope
    group: Thresholds
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results_annotated
    interactive_component_type: RangeSlider
    column_name: neg_log10_padj
    column_type: float64
    show_histogram: true
    display: {title_size: md, custom_color: '#D6336C', icon_name: 'mdi:star-outline'}
    placement: left
    title: Significance
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: da-gv-filter-lfc
    index: da-gv-lfc-range
    section: Signal scope
    group: Thresholds
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results_annotated
    interactive_component_type: RangeSlider
    column_name: log2fc
    column_type: float64
    show_histogram: true
    display: {title_size: md, custom_color: '#D6336C', icon_name: 'mdi:chart-bell-curve'}
    placement: left
    title: log2 fold change
    layout: {x: 0, y: 3, w: 1, h: 3}

# ============================================================================
# Enrichment. The pipeline runs GSEA pre-ranked over the DESeq2 statistics and
# publishes one report per POLE of each contrast, which is why every panel here
# splits on `phenotype` as well as on `contrast`: a set enriched "for KO" and a
# set enriched "for WT" are the two ends of one comparison, not two findings.
# ============================================================================
- title: Enrichment
  subtitle: The gene sets GSEA found at each pole of each contrast, and how strong the evidence is
  tab_order: 5
  tab_icon: mdi:set-merge
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Set scope
    icon: mdi:set-merge
    color: orange
    description: Which pole of the pinned contrast the enrichment panels are about
  - name: Evidence scope
    icon: mdi:star-outline
    color: orange
    description: How strong a result has to be to stay on the page
  grid_sections:
  - name: Enrichment at a glance
    icon: mdi:counter
    color: orange
    description: How many sets came up, how strong they are and how much of each set carries the signal
  - name: Enriched sets
    icon: mdi:chart-scatter-plot
    color: orange
    description: Every set on its normalised enrichment score, sized by the genes found and coloured by significance
  - name: Scores side by side
    icon: mdi:chart-bar
    color: orange
    description: The same scores as ranked bars, which is the view that compares one contrast against another
  - name: Set table
    icon: mdi:table
    color: gray
    description: One row per set and pole, selectable
    collapsed: true
  components:
  - component_type: text
    tag: da-gsea-intro
    section: Enrichment at a glance
    workflow_tag: differentialabundance
    data_collection_tag: gsea_report
    title: What came up, and at which pole
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      GSEA asks, set by set, whether a set's genes bunch at one end of the
      contrast's ranking, and publishes one report per pole. Read the
      normalised enrichment score (NES) and the pole together; the method is
      in the template docs.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: da-gsea-card-sets
    section: Enrichment at a glance
    workflow_tag: differentialabundance
    data_collection_tag: gsea_report
    use: gsea/report
    column_name: term
    aggregation: nunique
    column_type: object
    secondary_layout: top_n
    breakdown_col: phenotype
    top_n_count: 4
    display: {icon_name: 'mdi:set-merge', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title: Sets reported
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: da-gsea-card-nes
    section: Enrichment at a glance
    workflow_tag: differentialabundance
    data_collection_tag: gsea_report
    use: gsea/report
    column_name: abs_nes
    aggregation: max
    aggregations: [box_plot_stats]
    column_type: float64
    secondary_layout: box_plot
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title: Strongest NES (absolute)
    description: The largest normalised enrichment score in magnitude, whichever pole it came up at.
    title_size: sm
    title_align: left
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: da-gsea-card-fdr
    section: Enrichment at a glance
    workflow_tag: differentialabundance
    data_collection_tag: gsea_report
    use: gsea/report
    column_name: fdr_qvalue
    aggregation: median
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.05
    threshold_direction: max
    threshold_warn: 0.25
    display: {icon_name: 'mdi:star-outline', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title: Median FDR
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: da-gsea-card-leading
    section: Enrichment at a glance
    workflow_tag: differentialabundance
    data_collection_tag: gsea_report
    use: gsea/report
    column_name: leading_edge_percent
    aggregation: median
    aggregations: [box_plot_stats]
    column_type: float64
    secondary_layout: box_plot
    display: {icon_name: 'mdi:ruler', icon_color: '#7B1FA2', title_color: '#7B1FA2', title_font_size: xl, value_font_size: xl}
    title: Leading edge (% of set)
    description: Share of each set carried by its leading edge; a low share means a handful of genes drive the set.
    title_size: sm
    title_align: left
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: text
    tag: da-gsea-dot-intro
    section: Enriched sets
    workflow_tag: differentialabundance
    data_collection_tag: gsea_report
    title: One dot per set
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each set sits on its NES, sized by how many of its genes were found and
      coloured by significance. A set far from zero with a small dot is
      carried by a handful of genes, which the leading-edge share in the table
      makes explicit.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: da-gsea-dotplot
    index: da-gsea-dotplot
    section: Enriched sets
    workflow_tag: differentialabundance
    data_collection_tag: gsea_report
    use: gsea/gsea_dotplot
    config:
      padj_threshold: 0.25
      top_n: 20
      default_colour_by: neg_log10_padj
      term_sort: nes
      max_dot_size: 26
      min_dot_size: 6
      view: enrichment
      views: [enrichment]
      controls_placement: header
    title: Enriched gene sets
    description: Normalised enrichment score against gene set, sized by the genes found and coloured by significance.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 8}

  - component_type: text
    tag: da-gsea-bars-intro
    section: Scores side by side
    workflow_tag: differentialabundance
    data_collection_tag: gsea_report
    title: The same scores, ranked
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The dot plot answers what came up in one comparison. This one answers
      whether the same set came up in both: the bars are grouped by contrast,
      so a set that moves in one and not the other is visible as a gap rather
      than as two numbers to hold in mind.
