  - name: Gene detail
    icon: mdi:table
    color: gray
    description: The annotated calls, selectable row by row, and the record of the gene picked
    collapsed: true
  - name: All results
    icon: mdi:database-outline
    color: gray
    description: Every gene in every contrast, annotated or not, with its significance call
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [DESeq2](https://bioconductor.org/packages/DESeq2) tests each gene in each contrast; a
      call is significant at an adjusted p under 0.05 and a two-fold change. Pick a contrast
      on the left first: with several in view, the points of all of them are pooled.
    tag: da-de-intro
    index: de-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    interactive_component_type: MultiSelect
    column_name: direction
    column_type: object
    display:
      icon_name: mdi:trending-up
      custom_color: red
    section: Call filters
    group: Calls
    tag: da-de-filter-direction
    index: de-direction-filter
    title: Direction
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    interactive_component_type: RangeSlider
    column_name: log2fc
    column_type: float64
    show_histogram: true
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: indigo
    section: Call filters
    group: Thresholds
    tag: da-de-filter-lfc
    index: de-lfc-filter
    title: log2 fold change
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    interactive_component_type: RangeSlider
    column_name: neg_log10_padj
    column_type: float64
    show_histogram: true
    display:
      icon_name: mdi:star-outline
      custom_color: orange
    section: Call filters
    group: Thresholds
    tag: da-de-filter-signal
    index: de-signal-filter
    title: Significance (-log10 padj)
    layout: {x: 0, y: 5, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    interactive_component_type: RangeSlider
    column_name: log2_base_mean
    column_type: float64
    show_histogram: true
    display:
      icon_name: mdi:ruler
      custom_color: cyan
    section: Call filters
    group: Thresholds
    tag: da-de-filter-basemean
