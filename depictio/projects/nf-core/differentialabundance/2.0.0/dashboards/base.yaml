version: 1
# nf-core/differentialabundance 2.0.0: DESeq2 differential expression. Every
# rule this file follows is written out in depictio/projects/nf-core/RULES.md.
#
# Funnel: Data & QC (do the samples separate by design?), then Differential
# (what changed in each contrast, can the test be trusted, where do the calls
# sit?), then Gene sets (which pathways move, at which pole?).
#
# No MultiQC tab: this pipeline runs no MultiQC (it ships an R/shinyngs report
# instead), so the Samples tab carries the run-level quality read.
#
# Routes: a run without --gtf writes no annotated table (no Genome view, no
# biotype views, no gene record), and NO_GSEA prunes the two GSEA collections
# (no Enrichment tab). The tiles, value rows and highlights bound to them go
# with them, and the import re-packs the Overview.
main_dashboard:
  title: nf-core/differentialabundance
  subtitle: DESeq2 differential expression, from sample space to the gene sets that move
  project_tag: Differential Abundance Analysis
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family: figures, advanced viz
  # and filter chips all colour a value the same way. The sheet's leading
  # factor is aliased as `group` by the samples recipe, so it is coloured auto.
  category_colors:
    group: auto
    contrast: auto
    phenotype: auto
    direction:
      up: '#e34948'
      down: '#2a78d6'
      not significant: '#adb5bd'
  # Persistent: drawn in the filter panel of the tabs they reach, picks kept
  # across tabs. A contrast pools its samples, so the differential tables have
  # no sample column: the sample filters stop at the Samples tab, and the
  # contrast filter takes over on the three analysis tabs, reaching the
  # annotated table and the GSEA report through the deseq2_results links.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to the Samples tab and the sample sheet
    persistent: true
    pin: top
    exclude_tabs:
    - Differential expression
    - Genome view
    - Enrichment
  - name: Contrast
    icon: mdi:scale-balance
    color: indigo
    description: Which comparison the three analysis tabs read
    persistent: true
    pin: top
    exclude_tabs:
    - Samples
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The run's own sample sheet with the DESeq2 size factors, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the group filter leads the Key figures
  # bar, which is what the Guide demos. The contrast filter narrows the two
  # cards that read the differential tables.
  - component_type: interactive
    workflow_tag: differentialabundance
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: group
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: Group
    section: Key figures
    tag: da-ov-kf-group
    index: ov-kf-group
    title: Group
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    interactive_component_type: MultiSelect
    column_name: contrast
    column_type: object
    display:
      icon_name: mdi:compare-horizontal
      custom_color: indigo
      strip_label: Contrast
    section: Key figures
    tag: da-ov-kf-contrast
    index: ov-kf-contrast
    title: Contrast
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: text
    title: nf-core/differentialabundance
    order: 1
    body: >
      Gene counts tested condition against condition with DESeq2: do the samples group by
      design, which genes change in each contrast, where they sit and which gene sets move.
      [Run parameters](params:)
    tag: da-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/differentialabundance tests every gene for a change in abundance between the two sides of each contrast, here with DESeq2, and can run GSEA on the result. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The sample filters in the left panel narrow the Samples tab and the sample sheet; the contrast filter narrows the three analysis tabs. A bar above a section narrows that section only.
    tag: da-ov-about
    index: ov-about
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash. The gene-set line counts the sets GSEA scored instead of
  # printing functional_method, which reads "none" on a run that ran GSEA; it
  # cites gsea_report, so NO_GSEA removes the line.
  - component_type: text
    surface: card
    values:
      samples: {dc: samples, column: sample_id, aggregation: nunique, format: integer}
      contrasts: {dc: deseq2_results, column: contrast, aggregation: nunique, format: integer}
      gene_sets: {dc: gsea_report, column: term, aggregation: nunique, format: integer}
    body: |
      ### The run
      - ![](icon:mdi:flask-outline) **Samples** {{samples}}
      - ![](icon:mdi:compare-horizontal) **Contrasts** {{contrasts}}
      - ![](icon:mdi:scale-balance) **Test** {{param:differential_method}} · {{param:deseq2_test}}
      - ![](icon:mdi:filter-outline) **Cut-offs** q {{param:differential_max_qval}} · fold {{param:differential_min_fold_change}}
      - ![](icon:mdi:set-merge) **Gene sets** {{gene_sets}} scored by GSEA
    tag: da-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  # The marks take the family's colour (the header's), not the theme's blue.
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Five steps from counts to gene sets
      Each step names its settings and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:table-account) **Sheet** Samples, their factors and DESeq2 size factors · [Settings](params:observations) · [Samples](tab:Samples)
      2. ![](icon:mdi:chart-scatter-plot) **Explore** Variance-stabilised counts, PCA and distances · [Settings](params:exploratory) · [Samples](tab:Samples)
      3. ![](icon:mdi:scale-balance) **Test** DESeq2 per contrast · [Settings](params:deseq2) · [Differential expression](tab:Differential expression)
      4. ![](icon:mdi:map-marker-outline) **Place** Calls joined to the GTF · [Settings](params:gtf) · [Genome view](tab:Genome view)
      5. ![](icon:mdi:set-merge) **Enrich** GSEA on each contrast's ranking · [Settings](params:gsea) · [Enrichment](tab:Enrichment)
      :::
    tag: da-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  # Key figures: the sheet, then the test, each card opening the tab that
  # explains it, its icon in that tab's colour. All four read collections every
  # route writes, so the row stays four wide without a GTF or GSEA; the placed
  # calls and the enriched sets are Findings rows and highlights instead.
  - component_type: card
    workflow_tag: differentialabundance
    data_collection_tag: samples
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: composition
    breakdown_col: group
    display:
      icon_name: mdi:flask-outline
      icon_color: teal
      caption: in the sample sheet, by group
      link: tab:Samples
    section: Key figures
    tag: da-ov-kf-samples
    index: ov-kf-samples
    title: Samples
    description: Samples in the sheet. The bar splits them by the sheet's leading factor.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: differentialabundance
    data_collection_tag: samples
    aggregation: median
    column_name: size_factor
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:scale-balance
      icon_color: teal
      caption: median, with its spread
      decimals: 2
      link: tab:Samples
    section: Key figures
    tag: da-ov-kf-sizefactor
    index: ov-kf-sizefactor
    title: Size factor
    description: DESeq2's library-size factor; a sample far from the others was sequenced to a different depth.
    layout: {x: 2, y: 0, w: 2, h: 2}
  # Each test that kept an adjusted p is a row, so the strip splits the tests
  # into those under the 0.05 cut-off and the rest.
  - component_type: card
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: count
    column_name: padj
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.05
    threshold_direction: max
    display:
      icon_name: mdi:dna
      icon_color: indigo
      caption: gene tests with an adjusted p
      link: tab:Differential expression
    section: Key figures
    tag: da-ov-kf-tested
    index: ov-kf-tested
    title: Gene tests
    description: Gene tests that kept an adjusted p-value, one per contrast and gene. The strip shows how many pass 0.05.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: count
    column_name: gene_id
    column_type: object
    filter_expr: col('direction') != 'not significant'
    secondary_layout: composition
    breakdown_col: direction
    display:
      icon_name: mdi:check-decagram
      icon_color: indigo
      caption: calls, up and down
      link: tab:Differential expression
    section: Key figures
    tag: da-ov-kf-calls
    index: ov-kf-calls
    title: Significant calls
    description: Genes called at an adjusted p under 0.05 and a two-fold change, one per contrast. The bar splits them by direction.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the contrast the rows are read on, then the group the
  # PCA highlight follows.
  - component_type: interactive
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    interactive_component_type: MultiSelect
    column_name: contrast
    column_type: object
    display:
      icon_name: mdi:compare-horizontal
      custom_color: indigo
      strip_label: Contrast
    section: Findings
    tag: da-ov-findings-contrast
    index: ov-findings-contrast
    title: Contrast
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: differentialabundance
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: group
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: Group
    section: Findings
    tag: da-ov-findings-group
    index: ov-findings-group
    title: Group
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data (the chromosome row without a GTF, the gene-set
  # row without GSEA).
  - component_type: text
    surface: card
    values:
      n_sig: {dc: deseq2_results, column: gene_id, aggregation: nunique, filter_expr: "col('direction') != 'not significant'",
        format: integer}
      n_tested: {dc: deseq2_results, column: gene_id, aggregation: nunique, filter_expr: "col('padj').is_not_null()",
        format: integer}
      n_up: {dc: deseq2_results, column: gene_id, aggregation: nunique, filter_expr: "col('direction') == 'up'",
        format: integer}
      n_down: {dc: deseq2_results, column: gene_id, aggregation: nunique, filter_expr: "col('direction') == 'down'",
        format: integer}
      chr_top: {dc: deseq2_results_annotated, column: chromosome, aggregation: top, filter_expr: "col('direction') != 'not significant'"}
      chr_share: {dc: deseq2_results_annotated, column: chromosome, aggregation: top_share, filter_expr: "col('direction') != 'not significant'",
        format: percent}
      n_sets: {dc: gsea_report, column: term, aggregation: nunique, filter_expr: "col('fdr_qvalue') < 0.25", format: integer}
    body: |
      - **{{n_sig}}** of {{n_tested}} tested genes are called – adjusted p under 0.05 and a two-fold change [Differential](tab:Differential expression)
      - **{{n_up}}** genes go up and **{{n_down}}** go down – significant calls, contrasts in view [Volcano](tab:Differential expression)
      - **{{chr_share}}** of the placed calls sit on chromosome {{chr_top}} – the busiest one [Genome view](tab:Genome view)
      - **{{n_sets}}** gene sets are enriched at an FDR under 0.25 – GSEA, both poles of each contrast [Enrichment](tab:Enrichment)
    section: Findings
    tag: da-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per tab, the funnel's three analysis tabs and the sample
  # space that comes before them.
  - component_type: highlight
    section: Findings
    source_tab: Differential expression
    source_component: de-volcano
    caption: One point per gene and contrast; the corners past the dashed lines hold the calls.
    tag: da-ov-hl-volcano
    index: ov-hl-volcano
    layout: {x: 0, y: 2, w: 5, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Samples
    source_component: sm-pca
    caption: One point per sample; replicates should sit together, groups apart.
    tag: da-ov-hl-pca
    index: ov-hl-pca
    layout: {x: 5, y: 2, w: 3, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Genome view
    source_component: gv-manhattan
    caption: Every annotated gene at its coordinate; peaks above the line are the calls.
    tag: da-ov-hl-manhattan
    index: ov-hl-manhattan
    layout: {x: 0, y: 6, w: 3, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Enrichment
    source_component: en-dotplot
    caption: One dot per gene set, on its normalised enrichment score, sized by the genes found.
    tag: da-ov-hl-dotplot
    index: ov-hl-dotplot
    layout: {x: 3, y: 6, w: 5, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers. A tab the run does not have is left out, and a heading whose
  # tabs are all missing is hidden.
  - component_type: text
    body: |
      ### Data & QC
      - [Samples](tab:Samples)

      ### Differential
      - [Differential expression](tab:Differential expression)
      - [Genome view](tab:Genome view)

      ### Gene sets
      - [Enrichment](tab:Enrichment)
    section: How to read this dashboard
    tag: da-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the group first. The recipe publishes the
  # sheet's next three factor-like columns under stable names, so these
  # controls bind without the template knowing what a run's sheet calls them;
  # `factor_<n>_name` carries the original name, readable in the sample sheet.
  - component_type: interactive
    workflow_tag: differentialabundance
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: group
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: da-filter-group
    index: sample-filters-group
    title: Group
    description: The sheet's most factor-like column, aliased as `group`; its own name stays in the sample sheet.
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: differentialabundance
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: da-filter-sample
    index: sample-filters-sample
    title: Sample
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: differentialabundance
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: factor_2
    column_type: object
    display:
      icon_name: mdi:layers-triple-outline
      custom_color: grape
    section: Sample filters
    group: Other factors
    tag: da-filter-factor-2
    index: sample-filters-factor-2
    title: Second factor
    description: The sheet's second factor-like column; `factor_2_name` holds its name, empty when the sheet has no such factor.
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: differentialabundance
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: factor_3
    column_type: object
    display:
      icon_name: mdi:clock-outline
      custom_color: orange
    section: Sample filters
    group: Other factors
    tag: da-filter-factor-3
    index: sample-filters-factor-3
    title: Third factor
    description: The sheet's third factor-like column; `factor_3_name` holds its name, empty when the sheet has no such factor.
    layout: {x: 0, y: 9, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: differentialabundance
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: factor_4
    column_type: object
    display:
      icon_name: mdi:tune
      custom_color: cyan
    section: Sample filters
    group: Other factors
    tag: da-filter-factor-4
    index: sample-filters-factor-4
    title: Fourth factor
    description: The sheet's fourth factor-like column; `factor_4_name` holds its name, empty when the sheet has no such factor.
    layout: {x: 0, y: 12, w: 1, h: 3}
  # The contrast pick, kept across the analysis tabs.
  - component_type: interactive
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    interactive_component_type: MultiSelect
    column_name: contrast
    column_type: object
    display:
      icon_name: mdi:compare-horizontal
      custom_color: indigo
    section: Contrast
    tag: da-filter-contrast
    index: contrast-filter
    title: Contrast
    description: Sourced on the DESeq2 results and carried to the annotated table and the GSEA report by the template links.
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: table
    workflow_tag: differentialabundance
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Sample sheet
    tag: da-sample-sheet
    index: sample-sheet
    title: Sample sheet
    description: Every column of the pipeline's input sheet, with the DESeq2 size factor joined on.
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
- title: Samples
  subtitle: Do the samples separate by design, and are they normalised alike?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: mdi:flask-outline
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Library filters
    icon: mdi:filter-variant
    color: teal
    description: Narrows the samples by their DESeq2 size factor
  grid_sections:
  - name: Samples at a glance
    icon: mdi:counter
    color: teal
    description: How many samples, how they were scaled and how their expression is spread
  - name: Sample relationships
    icon: mdi:chart-scatter-plot
    color: teal
    description: Where the samples sit once the counts are variance stabilised
  - name: Normalisation
    icon: mdi:chart-bell-curve
    color: teal
    description: The expression distribution of each sample, on one shared grid
  - name: Top variable features
    icon: mdi:chart-box-outline
    color: teal
    description: The features that move most across the samples, clustered both ways
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [DESeq2](https://bioconductor.org/packages/DESeq2) scales each sample by a size factor
      and variance-stabilises the counts; every panel here reads that matrix. Samples should
      group by design, not by batch: a point off the PCA cloud or a curve away from the
      bundle is a library to check.
    tag: da-sm-intro
    index: sm-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: differentialabundance
    data_collection_tag: samples
    interactive_component_type: RangeSlider
    column_name: size_factor
    column_type: float64
    show_histogram: true
    display:
      icon_name: mdi:scale-balance
      custom_color: teal
    section: Library filters
    tag: da-sm-filter-sizefactor
    index: sm-sizefactor-filter
    title: Size factor
    layout: {x: 0, y: 0, w: 1, h: 3}
  # One row per sample, so a count splits into the groups as parts of a whole.
  - component_type: card
    workflow_tag: differentialabundance
    data_collection_tag: samples
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: donut
    breakdown_col: group
    display:
      icon_name: mdi:flask-outline
      icon_color: violet
      caption: in the sheet, by group
    section: Samples at a glance
    tag: da-sm-card-samples
    index: sm-card-samples
    title: Samples
    description: Samples in the sheet, split by its leading factor.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: differentialabundance
    data_collection_tag: samples
    aggregation: median
    column_name: size_factor
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:scale-balance
      icon_color: teal
      caption: median, with its spread
      decimals: 2
    section: Samples at a glance
    tag: da-sm-card-sizefactor
    index: sm-card-sizefactor
    title: Size factor
    description: DESeq2's library-size factor; a sample far from the others was sequenced to a different depth.
    layout: {x: 2, y: 0, w: 2, h: 2}
  # The distribution table repeats each sample's summary on every one of its
  # rows, and every sample has the same number of rows, so a median over the
  # rows is the median over the samples.
  - component_type: card
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_vst_distribution
    use: deseq2/vst_distribution
    aggregation: median
    column_name: median
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: grape
      caption: median per sample, its distribution
      decimals: 2
    section: Samples at a glance
    tag: da-sm-card-median
    index: sm-card-median
    title: Median expression
    description: Each sample's median variance-stabilised value; one sample apart from the bundle was normalised differently.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_vst_distribution
    use: deseq2/vst_distribution
    aggregation: median
    column_name: floor_share
    column_type: float64
    # A 0-1 share: a gauge would print "0.32 of 1", so the box shows the spread
    # over the samples instead.
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:arrow-collapse-vertical
      icon_color: orange
      caption: median per sample, with its spread
      decimals: 2
    section: Samples at a glance
    tag: da-sm-card-floor
    index: sm-card-floor
    title: Share at the floor
    description: Share of each sample's features, 0 to 1, sitting at the lowest value of the matrix, unexpressed after stabilisation.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_vst_pca
    use: deseq2/pca
    config:
      color_col: group
      default_color_by: group
      axis_prefix: PC
      point_size: 11
      marker_outline: true
