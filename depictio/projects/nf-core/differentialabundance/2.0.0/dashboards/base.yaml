version: 1
# nf-core/differentialabundance 2.0.0: DESeq2 differential expression.
#
# Funnel: Samples (is the experiment sound, and do the samples separate by
# design?) -> Differential expression (what changed in this contrast, can the
# test be trusted, which feature classes move?) -> Genome view (where do the
# calls sit?) -> Enrichment (which pathways move, at which pole?). The glance
# strip and `Sample sheet` are pinned to the top and `Reference tables` to the
# bottom, all persistent, so the run size, the design and the rows behind every
# tile trail the viewer onto every tab.
#
# No MultiQC tab: this pipeline runs no MultiQC (it ships an R/shinyngs report
# instead), so the Samples tab carries the run-level quality read.
main_dashboard:
  title: nf-core/differentialabundance
  subtitle: DESeq2 differential expression - sample space, contrasts and gene annotation
  project_tag: Differential Abundance Analysis
  main_tab_name: Samples
  tab_icon: mdi:test-tube
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # Two persistent scopes. The sample picks render in every tab's filter panel
  # and survive tab switches: `samples` is the hub collection, so template.yaml
  # translates a pick here onto the PCA and the distance matrix. The
  # differential tables have no sample column (a contrast pools its samples),
  # so the sample fan-out stops there by design, and the second scope takes
  # over: `Contrast scope` is sourced on `deseq2_results.contrast` and reaches
  # the annotated table and the GSEA report through the `deseq2_results ->`
  # links, so one pick narrows the four analysis tabs at once.
  filter_sections:
  - name: Sample scope
    icon: mdi:test-tube
    color: teal
    description: Applies to every tab that reads per-sample data
    persistent: true
    pin: top
  - name: Contrast scope
    icon: mdi:scale-balance
    color: indigo
    description: Which comparison the differential, expression, genome and enrichment tabs are about
    persistent: true
    pin: top
  - name: Library scope
    icon: mdi:tune
    color: teal
    description: Narrow the cohort by DESeq2 size factor
  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: The size and design of the run, on every tab
    persistent: true
    pin: top
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The run's own --input sheet, every column of it, on every tab
    collapsed: true
    persistent: true
    pin: top
  - name: Sample space
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Where the samples sit once the counts are variance stabilised
  - name: Top variable features
    icon: mdi:chart-box-outline
    color: grape
    description: The 500 features that move most across the cohort, clustered both ways
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The rows behind every tile, on every tab
    collapsed: true
    persistent: true
    pin: bottom
  components:
  - component_type: card
    tag: da-card-samples
    section: Run at a glance
    workflow_tag: differentialabundance
    data_collection_tag: samples
    aggregation: nunique
    column_name: sample_id
    column_type: object
    secondary_layout: donut
    breakdown_col: group
    display: {icon_name: 'mdi:test-tube', icon_color: '#0E9384', title_color: '#0E9384', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Samples
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: da-card-sizefactor
    section: Run at a glance
    workflow_tag: differentialabundance
    data_collection_tag: samples
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: size_factor
    column_type: float64
    display: {icon_name: 'mdi:scale-balance', icon_color: '#0E9384', title_color: '#0E9384', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Size factor
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: card
    tag: da-card-contrasts
    section: Run at a glance
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: nunique
    column_name: contrast
    column_type: object
    display: {icon_name: 'mdi:scale-balance', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Contrasts
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: da-card-features
    section: Run at a glance
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: nunique
    column_name: gene_id
    column_type: object
    display: {icon_name: 'mdi:dna', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Features tested
    layout: {x: 4, y: 0, w: 2, h: 2}

  # ------------------------------------------------------------ sample space
  - component_type: text
    tag: da-space-intro
    section: Sample space
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_vst_pca
    title: Do the samples separate the way the design says they should?
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Every panel reads the variance-stabilised matrix: the PCA, the distances
      over the 500 most variable features, the per-sample density and the
      clustered top features. Samples should group by design, not by batch;
      lasso a cluster in the PCA to carry those samples across.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: da-av-pca
    index: da-av-pca
    section: Sample space
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_vst_pca
    use: deseq2/pca
    config:
      color_col: group
      default_color_by: group
      point_size: 11
      marker_outline: true
      show_centroids: true
      legend_pos: right
      selection_enabled: true
      selection_column: sample_id
      controls_placement: header
    title: Sample PCA
    description: One point per sample, coloured by the sheet's leading factor. Colour by any other sheet column, a blocking factor included, from the tile header; lasso a cluster to filter the linked panels.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: advanced_viz
    tag: da-av-distance
    index: da-av-distance
    section: Sample space
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_sample_distance
    use: deseq2/distance_matrix
    config:
      index_column: sample
      cluster_rows: true
      cluster_cols: true
      cluster_method: ward
      normalize: none
      colorscale: Blues
    title: Sample-to-sample distance
    description: Euclidean distance over the 500 most variable features; the dendrograms group replicates that behave alike.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 7}
  # What a PCA cannot say: whether a library is SHAPED like its neighbours.
  # One density curve per sample on a grid shared by all of them, so a shifted
  # or short-tailed library is visible as a curve out of the bundle rather than
  # as a point off the cloud.
  - component_type: advanced_viz
    tag: da-av-distribution
    index: da-av-distribution
    section: Sample space
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_vst_distribution
    use: deseq2/distribution_profile
    config:
      series_col: sample_id
      x_col: bin_centre
      y_col: density
      line_width: 1.5
      x_title: Variance-stabilised expression
      y_title: Share of expressed features
      legend_pos: right
    title: Expression distribution per sample
    description: Density of the variance-stabilised values, binned on one grid shared by every sample. A curve away from the bundle is a library normalised differently from the rest.
    title_size: h3
    layout: {x: 0, y: 16, w: 8, h: 7}

  # ---------------------------------------------------- top variable features
  - component_type: text
    tag: da-expr-heatmap-intro
    section: Top variable features
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_vst_heatmap
    title: The 500 features that move most
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Rows are features, columns are samples, values are variance-stabilised
      counts z-scored per row, clustered on both axes. The matrix has no
      contrast column, so the contrast filter does not reach it.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: da-av-vst-heatmap
    index: da-av-vst-heatmap
    section: Top variable features
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_vst_heatmap
    use: deseq2/top_variable_heatmap
    config:
      index_column: gene_id
      cluster_rows: true
      cluster_cols: true
      cluster_method: ward
      normalize: row_z
      colorscale: RdBu
    title: Top variable features
    description: Row z-scored variance-stabilised expression for the 500 most variable features, clustered on both axes.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 9}

  # ------------------------------------------------------------ sample sheet
  # Pinned to the top of every tab: this sheet is the only place the run's own
  # annotation columns are readable. The recipe normalises sample_id / group /
  # size_factor and keeps every other column the sheet carried, so whatever the
  # experiment recorded beside the design (batch, sex, timepoint, replicate)
  # arrives here even though no tile is bound to it by name.
  - component_type: text
    tag: da-sheet-intro
    section: Sample sheet
    workflow_tag: differentialabundance
    data_collection_tag: samples
    title: What the run was told about each sample
    title_size: sm
    title_align: left
    order: 0
    alignment: left
    body: >
      Every column of the pipeline's --input sheet, with the DESeq2 size
      factor joined on. Covariates the design was blocked on are here even
      when no tile names them.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: da-table-samples
    section: Sample sheet
    workflow_tag: differentialabundance
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample_id
    title: Sample sheet
    description: The pipeline's --input sheet, normalised, with the DESeq2 size factor joined on.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 5}
  - component_type: text
    tag: da-tables-intro
    section: Reference tables
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    title: The rows behind every tile
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The full DESeq2 result set, on every tab. Selecting a gene row here
      carries it onto the annotated table on the Differential expression tab,
      and filters picked in the left panel narrow this table too.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: da-table-results
    section: Reference tables
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    use: deseq2/results
    row_selection_enabled: true
    row_selection_column: gene_id
    title: DESeq2 results
    description: Every feature in every contrast, with the significance call. Select a row to follow that gene into the annotated table.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 5}

  # --------------------------------------------------------------- left panel
  - component_type: interactive
    tag: da-filter-sample
    index: da-sample-filter
    section: Sample scope
    group: Samples
    workflow_tag: differentialabundance
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display: {title_size: md, custom_color: '#0E9384', icon_name: 'mdi:test-tube'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: da-filter-group
    index: da-group-filter
    section: Sample scope
    group: Samples
    workflow_tag: differentialabundance
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: group
    column_type: object
    display: {title_size: md, custom_color: '#0E9384', icon_name: 'mdi:account-group-outline'}
    placement: left
    title: Condition
    # Says which sheet column this actually is. The recipe aliases rather than
    # renames, so the source column is also still there under its own name, and
    # nothing in the panel said so.
    description: The sheet's most factor-like column, aliased as `group`; its own name stays in the Sample sheet.
    layout: {x: 0, y: 3, w: 1, h: 3}
  # A study is rarely one factor, and until now only the leading one had a
  # control: the rest were visible in the sheet and unfilterable. The recipe
  # publishes the next three factor-like columns under stable names, so these
  # controls bind without the template having to know what a run's sheet calls
  # them. `factor_<n>_name` carries the original name for the reader.
  - component_type: interactive
    tag: da-filter-factor-2
    index: da-factor-2-filter
    section: Sample scope
    group: Samples
    workflow_tag: differentialabundance
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: factor_2
    column_type: object
    display: {title_size: md, custom_color: '#0E9384', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Second factor
    description: The sheet's second factor-like column, aliased; `factor_2_name` holds its name, none when the sheet has no such factor.
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: da-filter-factor-3
    index: da-factor-3-filter
    section: Sample scope
    group: Samples
    workflow_tag: differentialabundance
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: factor_3
    column_type: object
    display: {title_size: md, custom_color: '#0E9384', icon_name: 'mdi:clock-outline'}
    placement: left
    title: Third factor
    description: The sheet's third factor-like column, aliased; `factor_3_name` holds its name, none when the sheet has no such factor.
    layout: {x: 0, y: 9, w: 1, h: 3}
  - component_type: interactive
    tag: da-filter-factor-4
    index: da-factor-4-filter
    section: Sample scope
    group: Samples
    workflow_tag: differentialabundance
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: factor_4
    column_type: object
    display: {title_size: md, custom_color: '#0E9384', icon_name: 'mdi:layers-outline'}
    placement: left
    title: Fourth factor
    description: The sheet's fourth factor-like column, aliased; `factor_4_name` holds its name, none when the sheet has no such factor.
    layout: {x: 0, y: 12, w: 1, h: 3}
  - component_type: interactive
    tag: da-filter-sizefactor
    index: da-sizefactor-range
    section: Library scope
    group: Normalisation
    workflow_tag: differentialabundance
    data_collection_tag: samples
    interactive_component_type: RangeSlider
    column_name: size_factor
    column_type: float64
    show_histogram: true
    display: {title_size: md, custom_color: '#0E9384', icon_name: 'mdi:scale-balance'}
    placement: left
    title: Size factor
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: da-filter-contrast
    index: da-contrast-filter
    section: Contrast scope
    group: Comparison
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    interactive_component_type: MultiSelect
    column_name: contrast
    column_type: object
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:scale-balance'}
    placement: left
    title: Contrast
    description: Sourced on the DESeq2 results and carried to the annotated table and the GSEA report by the template links.
    layout: {x: 0, y: 0, w: 1, h: 3}

tabs:
- title: Differential expression
  subtitle: Per-contrast DESeq2 statistics - volcano, MA, QQ, the test's diagnostics and the effect by biotype
  tab_order: 2
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Call scope
    icon: mdi:tune
    color: indigo
    description: Which calls stay on the tab, by direction, effect size, significance, expression level and biotype
  grid_sections:
  - name: Calls at a glance
    icon: mdi:counter
    color: indigo
    description: How the calls of the pinned contrast split, how large and how strong they are
  - name: Volcano, MA and QQ
    icon: mdi:chart-scatter-plot
    color: indigo
    description: One tile, three readings of the same calls, switched from the tile header
  - name: Test diagnostics
    icon: mdi:chart-bell-curve
    color: orange
    description: Is the p-value distribution well behaved, and do the contrasts agree
  - name: Effect by biotype
    icon: mdi:shape-outline
    color: violet
    description: Whether the calls concentrate in one class of feature
  - name: Gene detail
    icon: mdi:table
    color: blue
    description: The annotated calls, selectable row by row, and the record of the gene picked
  components:
  # ------------------------------------------------------- calls at a glance
  - component_type: text
    tag: da-de-intro
    section: Calls at a glance
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    title: Calls, contrast by contrast
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A call is significant when the adjusted p-value is below 0.05 and the
      fold change is at least 2. Pick one contrast in the pinned Contrast
      scope to read every panel below; a contrast that calls nothing stays, so
      a null result reads as one.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: da-de-card-lfc
    section: Calls at a glance
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: log2fc
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: log2 fold change
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: da-de-card-direction
    section: Calls at a glance
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: count
    column_name: direction
    column_type: object
    secondary_layout: composition
    breakdown_col: direction
    display: {icon_name: 'mdi:chart-donut', icon_color: '#7048E8', title_color: '#7048E8', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Call composition
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: da-de-card-signal
    section: Calls at a glance
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: neg_log10_padj
    column_type: float64
    display: {icon_name: 'mdi:star-outline', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Significance
    description: -log10 of the adjusted p-value; the box shows the spread, the whiskers the strongest calls. A padj that underflowed to zero is drawn at 300.
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: da-de-card-padj
    section: Calls at a glance
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: min
    column_name: padj
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.05
    threshold_direction: max
    threshold_warn: 0.1
    display: {icon_name: 'mdi:check-decagram', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Best adjusted p-value
    layout: {x: 6, y: 2, w: 2, h: 2}

  # ----------------------------------------------------------- volcano and MA
  - component_type: text
    tag: da-de-volcano-intro
    section: Volcano, MA and QQ
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    title: Effect size read two ways
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The volcano puts significance against effect size, the MA view effect
      size against expression level, the QQ view the raw p-values against the
      uniform null. Read them one contrast at a time: with several contrasts
      in scope the points of all of them are pooled.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: da-av-volcano
    index: da-av-volcano
    section: Volcano, MA and QQ
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    use: deseq2/volcano
    config:
      label_col: gene_id
      category_col: direction
      significance_threshold: 0.05
      effect_threshold: 1.0
      fold_change_threshold: 1.0
      top_n_labels: 15
      show_labels: true
      # MA view bindings: mean expression on x, the same fold change on y.
      avg_log_intensity_col: log2_base_mean
      log2_fold_change_col: log2fc
      view: volcano
      views: [volcano, ma, qq]
      controls_placement: header
      p_value_col: pvalue
      show_ci: true
      show_identity: true
    title: Volcano, MA and QQ
    description: -log10(padj) against log2 fold change; the MA view puts the fold change against mean expression, the QQ view the raw p-values against their expected quantiles with the 95% null band. The dashed lines are the pipeline's cut-offs, padj 0.05 and a two-fold change.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 9}

  # ------------------------------------------------------- test diagnostics
  - component_type: text
    tag: da-de-diag-intro
    section: Test diagnostics
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    title: Does the test behave, and do the contrasts agree
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The raw p-value histogram should be flat with a spike at zero: a hump in
      the middle or a rise towards one says the test is mis-specified. The
      scatter below puts one contrast's effect sizes against the other's, one
      point per gene.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: da-fig-pvalue-histogram
    index: da-pvalue-histogram
    section: Test diagnostics
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    use: deseq2/results
    visu_type: histogram
    dict_kwargs: {x: pvalue, facet_col: contrast, facet_col_wrap: 1, nbins: 40}
    title: Raw p-value distribution
    description: One histogram per contrast, 40 bins over 0 to 1. Features DESeq2 did not test carry no p-value and are left out.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 6}
  - component_type: figure
    tag: da-fig-contrast-vs-contrast
    index: da-contrast-vs-contrast
    section: Test diagnostics
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    use: deseq2/results
    mode: code
    code_content: |
      # One point per gene: its effect size in the first contrast against the
      # second. Needs a per-contrast reshape, so this tile is code mode.
      contrasts = sorted(df['contrast'].unique().to_list())
      if len(contrasts) >= 2:
          a, b = contrasts[0], contrasts[1]
          left = df.filter(pl.col('contrast') == a).select(
              'gene_id', pl.col('log2fc').alias('x'), pl.col('significant').alias('sig_x')
          )
          right = df.filter(pl.col('contrast') == b).select(
              'gene_id', pl.col('log2fc').alias('y'), pl.col('significant').alias('sig_y')
          )
          paired = left.join(right, on='gene_id', how='inner').with_columns(
              pl.when(pl.col('sig_x') & pl.col('sig_y')).then(pl.lit('both'))
              .when(pl.col('sig_x')).then(pl.lit(a))
              .when(pl.col('sig_y')).then(pl.lit(b))
              .otherwise(pl.lit('neither'))
              .alias('called_in')
          )
          fig = px.scatter(
              paired.to_pandas(), x='x', y='y', color='called_in',
              custom_data=['gene_id'], opacity=0.55,
              labels={'x': a, 'y': b, 'called_in': 'Called in'},
          )
          fig.add_hline(y=0, line_dash='dot', line_color='#adb5bd')
          fig.add_vline(x=0, line_dash='dot', line_color='#adb5bd')
      else:
          # A single-contrast run has nothing to pair: fall back to the MA view.
          fig = px.scatter(
              df.to_pandas(), x='log2_base_mean', y='log2fc', color='direction',
              custom_data=['gene_id'], opacity=0.55,
              labels={'log2_base_mean': 'log2 mean expression', 'log2fc': 'log2 fold change'},
          )
      fig.update_traces(marker={'size': 6})
      fig.update_layout(margin={'t': 24, 'l': 56, 'r': 16, 'b': 48})
    selection_enabled: true
    selection_column: gene_id
    title: Contrast against contrast
    description: Effect sizes of the first two contrasts (by id) against each other, gene by gene. Points off the axes moved in both; select one to follow it into the annotated table.
    title_size: h3
    layout: {x: 0, y: 8, w: 8, h: 6}

