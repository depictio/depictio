  - component_type: interactive
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results_annotated
    interactive_component_type: MultiSelect
    column_name: gene_biotype
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: grape
    section: Call filters
    group: Features
    tag: da-de-filter-biotype
    index: de-biotype-filter
    title: Biotype
    layout: {x: 0, y: 11, w: 1, h: 3}
  - component_type: card
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: count
    column_name: padj
    column_type: float64
    secondary_layout: completeness
    display:
      icon_name: mdi:dna
      icon_color: cyan
      caption: with an adjusted p, after filtering
    section: Calls at a glance
    tag: da-de-card-tested
    index: de-card-tested
    title: Genes tested
    description: Gene tests that kept an adjusted p-value; DESeq2's independent filtering leaves the rest out.
    layout: {x: 0, y: 0, w: 2, h: 2}
  # Calls are rows (one per contrast and gene), so a count over them splits
  # into the two directions as parts of a whole.
  - component_type: card
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: count
    column_name: gene_id
    column_type: object
    filter_expr: col('direction') != 'not significant'
    secondary_layout: composition
    breakdown_col: direction
    display:
      icon_name: mdi:trending-up
      icon_color: red
      caption: calls, up and down
    section: Calls at a glance
    tag: da-de-card-calls
    index: de-card-calls
    title: Significant calls
    description: Genes called at an adjusted p under 0.05 and a two-fold change, one per contrast.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: median
    column_name: log2fc
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: indigo
      caption: median over genes, near 0 when normalised well
      decimals: 2
    section: Calls at a glance
    tag: da-de-card-lfc
    index: de-card-lfc
    title: log2 fold change
    description: Median effect size over every gene tested; a median far from zero points at a normalisation problem.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    use: deseq2/results
    # The median, not the minimum: the best padj underflows to 0 in any run
    # with a strong call, and the strip already counts the genes that pass.
    aggregation: median
    column_name: padj
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.05
    threshold_direction: max
    display:
      icon_name: mdi:check-decagram
      icon_color: orange
      caption: median over the tests; 0.05 passes
      decimals: 2
    section: Calls at a glance
    tag: da-de-card-padj
    index: de-card-padj
    title: Adjusted p
    description: Median adjusted p-value over the tests in view; the strip counts the tests at or under 0.05.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    use: deseq2/volcano
    config:
      label_col: gene_id
      category_col: direction
      significance_threshold: 0.05
      effect_threshold: 1.0
      fold_change_threshold: 1.0
      # The results carry Ensembl ids only (the symbol is in the annotated
      # table), so labels would pile ids over the top calls: hover names them.
      top_n_labels: 15
      show_labels: false
      # MA view bindings: mean expression on x, the same fold change on y.
      avg_log_intensity_col: log2_base_mean
      log2_fold_change_col: log2fc
      view: volcano
      views: [volcano, ma, qq]
      p_value_col: pvalue
      show_ci: true
      show_identity: true
    section: Volcano, MA and QQ
    tag: da-de-volcano
    index: de-volcano
    title: Volcano, MA and QQ
    description: >-
      Which genes change, and by how much? Each point is one gene in one contrast: its log2 fold change on
      x and -log10 of its adjusted p-value (padj) on y; hits are coloured by direction. The View switch
      shows the same calls as an MA plot (fold change against mean expression) or a QQ plot (observed
      against expected raw p-values).

      How to read: hits sit in the top left (down) and top right (up) outside the dotted lines; the
      farther up and out, the stronger the call. In the MA view a hit-rich band at low mean expression is
      a noisy estimate, and in the QQ view points that leave the diagonal early show an effect, while a
      curve above the band over the whole range signals inflation, so check the design.

      Lines and annotations: the dotted horizontal line is padj 0.05 and the two dotted vertical lines are
      log2 fold change -1 and +1 (a two-fold change); in the MA view the dotted lines are at log2 fold
      change -1 and +1. A hit is a gene with padj under 0.05 and an absolute log2 fold change of at least
      1, the nf-core differential_max_qval and differential_min_fold_change defaults (two-fold); the
      template fixes them and does not read them from the run. In the QQ view the diagonal is the null
      (observed equals expected), the grey band is its 95% envelope and the label gives the genomic
      inflation factor lambda, the median-based ratio where 1 means no inflation.

      Source: nf-core/differentialabundance parameters,
      https://nf-co.re/differentialabundance/2.0.0/parameters

      Note: a gene DESeq2 filters out as too lowly expressed has no padj and is not drawn on the volcano.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    use: deseq2/results
    visu_type: histogram
    dict_kwargs: {x: pvalue, facet_col: contrast, facet_col_wrap: 1, nbins: 40}
    section: Test diagnostics
    tag: da-de-pvalue-histogram
    index: de-pvalue-histogram
    title: Raw p-value distribution
    description: >-
      Do the p-values of the test behave? One histogram per contrast of the raw p-values of every gene, in
      40 bins from 0 to 1.

      How to read: a flat histogram with a spike in the first bin is a sound test, with a flat floor from
      genes with no effect and a peak from the ones with one. A hump in the middle or a rise towards 1
      points at a violated assumption, a wrong design or an outlier sample, so check the PCA before
      trusting the calls.

      Lines and annotations: the plot draws no line, only the bars. The shapes are read as described in
      the cited paper, and no p-value cut-off applies here.

      Source: Breheny, Stromberg and Lambert, p-value histograms: inference and diagnostics,
      High-Throughput 2018, https://doi.org/10.3390/ht7030023
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: figure
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    use: deseq2/results
    mode: code
    code_content: |
      # One point per gene: its effect size in the first contrast against the
      # second. Needs a per-contrast reshape, so this tile is code mode. The
      # direction colours come from the family map; `neither` takes its grey.
      colors = depictio_category_colors.get('direction') or {}
      contrasts = sorted(df['contrast'].unique().to_list())
      if len(contrasts) >= 2:
          a, b = contrasts[0], contrasts[1]
          left = df.filter(pl.col('contrast') == a).select(
              'gene_id', pl.col('log2fc').alias('x'), pl.col('significant').alias('sig_x')
          )
          right = df.filter(pl.col('contrast') == b).select(
              'gene_id', pl.col('log2fc').alias('y'), pl.col('significant').alias('sig_y')
          )
          paired = left.join(right, on='gene_id', how='inner').with_columns(
              pl.when(pl.col('sig_x') & pl.col('sig_y')).then(pl.lit('both'))
              .when(pl.col('sig_x')).then(pl.lit(a))
              .when(pl.col('sig_y')).then(pl.lit(b))
              .otherwise(pl.lit('neither'))
              .alias('called_in')
          )
          grey = colors.get('not significant')
          # A contrast id is long: break each axis title over two lines.
          def two_lines(name):
              words = name.split('_')
              half = len(words) // 2
              return ' '.join(words[:half]) + '<br>' + ' '.join(words[half:])
          fig = px.scatter(
              paired.to_pandas(), x='x', y='y', color='called_in',
              color_discrete_map={'neither': grey} if grey else {},
              custom_data=['gene_id'], opacity=0.55,
              labels={'x': two_lines(a), 'y': two_lines(b), 'called_in': 'Called in'},
          )
          fig.add_hline(y=0, line_dash='dot')
          fig.add_vline(x=0, line_dash='dot')
      else:
          # A single-contrast run has nothing to pair: fall back to the MA view.
          fig = px.scatter(
              df.to_pandas(), x='log2_base_mean', y='log2fc', color='direction',
              color_discrete_map=colors, custom_data=['gene_id'], opacity=0.55,
              labels={'log2_base_mean': 'log2 mean expression', 'log2fc': 'log2 fold change'},
          )
      fig.update_traces(marker={'size': 6})
      fig.update_layout(margin={'t': 24, 'l': 56, 'r': 16, 'b': 48})
      fig.update_xaxes(automargin=True)
      fig.update_yaxes(automargin=True)
    selection_enabled: true
    selection_column: gene_id
    section: Test diagnostics
    tag: da-de-contrast-pair
    index: de-contrast-pair
    title: Contrast against contrast
    description: >-
      Do two contrasts agree gene by gene? Each point is one gene, with its log2 fold change in the first
      contrast on x and in the second on y, coloured by the contrast or contrasts in which it is called. A
      run with a single contrast shows its MA view instead (fold change against mean expression).

      How to read: points along the rising diagonal change the same way in both contrasts, points along
      the falling diagonal change oppositely, and points on one axis change in one contrast only. Select
      points to follow those genes into the annotated table.

      Lines and annotations: the two dotted lines are the axes at log2 fold change 0; no cut-off is drawn.
      A gene is coloured as called when it passes padj under 0.05 and an absolute log2 fold change of at
      least 1, the nf-core defaults, which the template fixes and does not read from the run.

      Source: nf-core/differentialabundance parameters,
      https://nf-co.re/differentialabundance/2.0.0/parameters

      Note: only the first two contrasts, by id, are paired.
    layout: {x: 4, y: 0, w: 4, h: 5}
  - component_type: advanced_viz
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results_annotated
    use: deseq2/annotated_da_barplot
    config:
      significance_col: padj
      significance_threshold: 0.05
      top_n: 10
    section: Effect by biotype
    tag: da-de-bars
    index: de-strongest-bars
    title: Strongest calls per contrast
    description: >-
      Which genes change most in each contrast? The ten genes with the largest absolute log2 fold change
      per contrast, one bar each, ordered by effect; colour is the direction of change.

      How to read: solid bars are significant calls and hatched bars are not, so a tall hatched bar is a
      large but uncertain effect. An empty panel means the contrast called nothing. Click a gene on the
      tables below for its record.

      Lines and annotations: a bar is solid when its padj is at most 0.05, the nf-core
      differential_max_qval default, which the tile fixes as a display setting rather than reading from
      the run. There is no fold-change cut-off line; bars are simply ranked by absolute effect.

      Source: nf-core/differentialabundance parameters,
      https://nf-co.re/differentialabundance/2.0.0/parameters
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: figure
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results_annotated
    use: deseq2/results_annotated
    visu_type: box
    dict_kwargs: {x: gene_biotype, y: log2fc, color: direction}
    section: Effect by biotype
    tag: da-de-biotype-box
    index: de-biotype-box
    title: Effect size by biotype
    description: >-
      Does a class of feature shift as a whole? The log2 fold change of the genes in each biotype, split
      by call direction, as boxes.

      How to read: a box whose median is away from 0 means the class moves together; a box that straddles
      0 with a few far dots is a class with a few loud genes. Compare the calls with the not-significant
      genes to see whether a biotype is over-represented.

      Lines and annotations: the box spans the first to the third quartile with the median as the inner
      line, the whiskers reach the furthest value within 1.5 times the interquartile range and dots beyond
      are outliers. No cut-off line is drawn.
    layout: {x: 4, y: 0, w: 4, h: 5}
  - component_type: table
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results_annotated
    use: deseq2/results_annotated
    row_selection_enabled: true
    row_selection_column: gene_id
    section: Gene detail
    tag: da-de-table-annotated
    index: de-table-annotated
    title: Annotated DESeq2 results
    description: >-
      Which genes are called, and what are they? DESeq2 statistics joined to the GTF: symbol, chromosome,
      coordinates, biotype, log2 fold change, adjusted p-value and the call.

      How to read: sort by padj or by log2 fold change to list the strongest calls, then click a row to
      open its gene record. Features the annotation did not cover are dropped, so this table is shorter
      than the full results.

      Note: a gene without a padj was left out of the test by DESeq2's independent filtering. See the
      DESeq2 vignette at
      https://bioconductor.org/packages/release/bioc/vignettes/DESeq2/inst/doc/DESeq2.html
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results_annotated
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: gene_id
      title_col: gene_name
      selection_source: any
      linked_component: da-de-table-annotated
      sections:
        Gene: [gene_name, gene_id, gene_biotype]
        Location: [chromosome, start, end]
        Test: [contrast, direction, log2fc, padj]
      link_templates:
        gene_id: "https://www.ensembl.org/id/{value}"
    section: Gene detail
    tag: da-de-record
    index: de-record
    title: Gene record
    description: >-
      What do we know about one gene? The gene picked in the table or on a figure, with its identifiers,
      location and, for each contrast it was tested in, its direction, log2 fold change and adjusted
      p-value.

      How to read: pick a gene on the volcano, the contrast pair or the table. The Ensembl link resolves
      the stable identifier for any species.
    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: table
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results
    use: deseq2/results
    row_selection_enabled: true
    row_selection_column: gene_id
    section: All results
    tag: da-de-table-results
    index: de-table-results
    title: DESeq2 results
    description: >-
      How was every gene scored in every contrast? One row per gene and contrast with its base mean, log2
      fold change, p-value, adjusted p-value and the call, including genes that were not annotated.

      How to read: filter on direction or sort by padj to list the calls, then click a row to select the
      gene. A run without a GTF has only this table.

      Note: an empty padj means DESeq2's independent filtering left the gene out of the test, and one that
      underflowed to zero is capped for display at -log10 300.
    layout: {x: 0, y: 0, w: 8, h: 6}
# Needs the GTF the run was given: without it the annotated table is not
# written and the tab goes with it.
- title: Genome view
  subtitle: Where on the genome do the calls sit?
  tab_group: Differential
  tab_order: 3
  tab_icon: mdi:dna
  tab_icon_color: red
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Genome filters
    icon: mdi:filter-variant
    color: red
    description: Narrows the placed calls by chromosome, significance and effect size
  grid_sections:
  - name: Genome at a glance
    icon: mdi:counter
    color: red
    description: How many tests the annotation placed, and where the calls concentrate
  - name: Signal along the genome
    icon: mdi:chart-scatter-plot
    color: red
    description: Every annotated gene at its coordinate, its height the significance
  - name: Per-chromosome detail
    icon: mdi:map-marker-outline
    color: red
    description: The same calls gene by gene, narrowed by the chromosome filter
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      Coordinates come from the [GTF](https://www.ensembl.org/info/website/upload/gff.html)
      the run was given, so this tab covers the annotated genes only. Read the Manhattan
      plot for where the signal concentrates, then pick a chromosome on the left before
      reading the lollipop gene by gene.
    tag: da-gv-intro
    index: gv-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results_annotated
    interactive_component_type: MultiSelect
    column_name: chromosome
    column_type: object
    display:
      icon_name: mdi:map-marker-outline
      custom_color: red
    section: Genome filters
    group: Region
    tag: da-gv-filter-chromosome
    index: gv-chromosome-filter
    title: Chromosome
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results_annotated
    interactive_component_type: RangeSlider
    column_name: neg_log10_padj
    column_type: float64
    show_histogram: true
    display:
      icon_name: mdi:star-outline
      custom_color: orange
    section: Genome filters
    group: Thresholds
    tag: da-gv-filter-signal
    index: gv-signal-filter
    title: Significance (-log10 padj)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results_annotated
    interactive_component_type: RangeSlider
    column_name: log2fc
    column_type: float64
    show_histogram: true
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: indigo
    section: Genome filters
    group: Thresholds
    tag: da-gv-filter-lfc
    index: gv-lfc-filter
    title: log2 fold change
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results_annotated
    use: deseq2/results_annotated
    aggregation: count
    column_name: chromosome
    column_type: object
    # The annotated table holds placed genes only, so a completeness bar always
    # reads 100%: the bar splits the tests by biotype instead.
    filter_expr: col('gene_biotype') != ''
    secondary_layout: composition
    breakdown_col: gene_biotype
    display:
      icon_name: mdi:map-marker-outline
      icon_color: cyan
      caption: gene tests placed, by biotype
    section: Genome at a glance
    tag: da-gv-card-placed
    index: gv-card-placed
    title: Tests placed
    description: Gene tests the annotation gives a chromosome, one per contrast and gene. The bar splits them by gene biotype.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results_annotated
    use: deseq2/results_annotated
    aggregation: count
    column_name: gene_id
    column_type: object
    filter_expr: col('direction') != 'not significant'
    secondary_layout: top_n
    breakdown_col: chromosome
    top_n_count: 3
    display:
      icon_name: mdi:dna
      icon_color: red
      caption: calls, the busiest chromosomes
    section: Genome at a glance
    tag: da-gv-card-calls
    index: gv-card-calls
    title: Calls placed
    description: Significant calls with a coordinate, and the three chromosomes that carry the most.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results_annotated
    use: deseq2/results_annotated
    aggregation: median
    column_name: neg_log10_padj
    column_type: float64
    filter_expr: col('direction') != 'not significant'
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: orange
      caption: median over the calls, with its spread
      decimals: 1
    section: Genome at a glance
    tag: da-gv-card-strength
    index: gv-card-strength
    title: Call strength (-log10 padj)
    description: How far the significant calls clear the threshold; a padj that underflowed to zero is drawn at 300.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # Distinct biotypes ranked by direction: how many classes of feature the up
  # and the down calls each reach.
  - component_type: card
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results_annotated
    use: deseq2/results_annotated
    aggregation: nunique
    column_name: gene_biotype
    column_type: object
    filter_expr: (col('direction') != 'not significant') & (col('gene_biotype') != '')
    secondary_layout: top_n
    breakdown_col: direction
    top_n_count: 2
    display:
      icon_name: mdi:shape-outline
      icon_color: violet
      caption: biotypes with a call, up and down
    section: Genome at a glance
    tag: da-gv-card-biotypes
    index: gv-card-biotypes
    title: Biotypes hit
    description: Distinct gene biotypes among the significant calls, counted for each direction.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results_annotated
    use: deseq2/manhattan
    config:
      feature_col: gene_name
      score_kind: "-log10(padj)"
      score_threshold: 1.301
      highlight: above
      color_by_columns: [direction, gene_biotype]
      default_color_by: direction
      # Six: the Overview highlight draws this tile at a third of the width.
      top_n_labels: 6
      selection_enabled: true
      selection_column: gene_id
    section: Signal along the genome
    tag: da-gv-manhattan
    index: gv-manhattan
    title: Significance along the genome
    description: >-
      Where on the genome do the calls concentrate? Each point is one annotated gene at its start
      coordinate on x and -log10 of its adjusted p-value on y, with alternating bands for the chromosomes.

      How to read: a tight cluster of points above the line on one chromosome is a region that changes
      together. Isolated peaks are single genes. Select genes to carry them onto the [Differential
      expression](tab:Differential expression) tables.

      Lines and annotations: the solid line is padj 0.05 (-log10 of 1.301); points below it are dimmed.
      The line uses the nf-core differential_max_qval default and ignores the fold-change cut-off, so a
      point above it is significant but not necessarily a call; the template fixes the value and does not
      read it from the run.

      Source: https://nf-co.re/differentialabundance/2.0.0/parameters
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: differentialabundance
    data_collection_tag: deseq2_results_annotated
    use: deseq2/chromosome_lollipop
    config:
      # Keyed on the contrast, not the chromosome: `feature_id_col` is the
      # subplot lane, and a GTF with dozens of contigs would pass
      # `max_subplot_genes`. One lane per contrast, the gene symbol on hover.
      feature_id_col: contrast
      position_col: start
      category_col: direction
      label_col: gene_name
      effect_col: neg_log10_padj
      scale_points_by_effect: true
      max_subplot_genes: 6
      gene_sort: name
      # A stem is one layout shape per call: off until the chromosome filter
      # has narrowed the set; the switch is in the tile's own controls.
      show_stems: false
      point_size: 6
      top_n_labels: 8
    section: Per-chromosome detail
    tag: da-gv-lollipop
    index: gv-lollipop
    title: Calls per gene
    description: >-
      Which genes are called along a chromosome? One lane per contrast, one head per gene at its start
      coordinate, coloured by direction and sized by -log10 of its adjusted p-value.

      How to read: large heads are the strongest calls, and heads of one colour that cluster are a region
      moving together. Pick a chromosome on the left first, since coordinates from different contigs would
      otherwise share one axis.

      Lines and annotations: there are no stems and no cut-off line. A gene is up or down only when it
      passes padj under 0.05 and an absolute log2 fold change of at least 1, the nf-core defaults, which
      the template fixes and does not read from the run.

      Source: https://nf-co.re/differentialabundance/2.0.0/parameters
    layout: {x: 0, y: 0, w: 8, h: 6}
# GSEA runs pre-ranked over the DESeq2 statistics and publishes one report per
# pole of each contrast, which is why the panels split on `phenotype` as well
# as on `contrast`. NO_GSEA prunes both collections and the tab.
- title: Enrichment
  subtitle: Which gene sets move in each contrast, and at which pole?
  tab_group: Gene sets
  tab_order: 4
  tab_icon: mdi:set-merge
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Enrichment filters
    icon: mdi:filter-variant
    color: orange
    description: Narrows the sets by pole, significance and size
  grid_sections:
  - name: Enrichment at a glance
    icon: mdi:counter
    color: orange
    description: How many sets came up, how strong they are and how much of each carries the signal
  - name: Enriched sets
    icon: mdi:chart-scatter-plot
    color: orange
    description: Every set on its normalised enrichment score, sized by the genes found
  - name: Scores side by side
    icon: mdi:chart-bar
    color: orange
    description: The same scores as ranked bars, grouped by contrast
  - name: Set table
    icon: mdi:table
    color: gray
    description: One row per set and pole, selectable
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [GSEA](https://www.gsea-msigdb.org) ranks the genes of each contrast and asks whether a
      set's genes bunch at one end; it reports each pole of the contrast apart. Read the
      normalised enrichment score (NES) with its pole, and an FDR under 0.25 as GSEA's own
      cut-off.
    tag: da-en-intro
    index: en-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: differentialabundance
    data_collection_tag: gsea_report
    interactive_component_type: MultiSelect
    column_name: phenotype
    column_type: object
    display:
      icon_name: mdi:compare-horizontal
      custom_color: orange
    section: Enrichment filters
    group: Sets
    tag: da-en-filter-pole
    index: en-pole-filter
    title: Pole
    description: Which end of the contrast the set came up at, read from the report file name.
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: differentialabundance
    data_collection_tag: gsea_report
    interactive_component_type: RangeSlider
    column_name: neg_log10_fdr
    column_type: float64
    show_histogram: true
    display:
      icon_name: mdi:star-outline
      custom_color: yellow
    section: Enrichment filters
    group: Sets
    tag: da-en-filter-fdr
    index: en-fdr-filter
    title: Significance (-log10 FDR)
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: differentialabundance
    data_collection_tag: gsea_report
    interactive_component_type: RangeSlider
    column_name: size
    column_type: int64
    show_histogram: true
    display:
      icon_name: mdi:ruler
      custom_color: grape
    section: Enrichment filters
    group: Sets
    tag: da-en-filter-size
    index: en-size-filter
    title: Set size
    layout: {x: 0, y: 5, w: 1, h: 3}
  # One row per set, pole and contrast, so a count splits into the poles as
  # parts of a whole.
  - component_type: card
    workflow_tag: differentialabundance
    data_collection_tag: gsea_report
    use: gsea/report
    aggregation: count
    column_name: term
    column_type: object
    secondary_layout: donut
    breakdown_col: phenotype
    # Two contrasts give four poles: show all four rather than three and other.
    top_n_count: 4
    display:
      icon_name: mdi:set-merge
      icon_color: orange
      caption: set reports, by pole
    section: Enrichment at a glance
    tag: da-en-card-sets
    index: en-card-sets
    title: Sets reported
    description: Gene-set results GSEA published, one per set, contrast and pole.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: differentialabundance
    data_collection_tag: gsea_report
    use: gsea/report
    aggregation: max
    column_name: abs_nes
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:trending-up
      icon_color: indigo
      caption: the largest, with the spread over sets
      decimals: 2
    section: Enrichment at a glance
    tag: da-en-card-nes
    index: en-card-nes
    title: Strongest NES
    description: The largest normalised enrichment score in magnitude, whichever pole it came up at.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: differentialabundance
    data_collection_tag: gsea_report
    use: gsea/report
    aggregation: median
    column_name: fdr_qvalue
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.05
    threshold_direction: max
    threshold_warn: 0.25
    display:
      icon_name: mdi:check-decagram
      icon_color: teal
      caption: median over sets; 0.05 passes, 0.25 warns
      decimals: 3
    section: Enrichment at a glance
    tag: da-en-card-fdr
    index: en-card-fdr
    title: Median FDR
    description: Median false discovery rate over the sets in view; most sets near 1 is a contrast with little pathway signal.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: differentialabundance
    data_collection_tag: gsea_report
    use: gsea/report
    aggregation: median
    column_name: leading_edge_percent
    column_type: float64
    filter_expr: col('size') > 0
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:percent
      icon_color: grape
      caption: median share of each set, 0 to 100
      decimals: 0
    section: Enrichment at a glance
    tag: da-en-card-leading
    index: en-card-leading
    title: Leading edge (%)
    description: Share of each set carried by its leading edge; a low share means a handful of genes drive the set.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: differentialabundance
    data_collection_tag: gsea_report
    use: gsea/gsea_dotplot
    config:
      padj_threshold: 0.25
      top_n: 20
      default_colour_by: neg_log10_padj
      term_sort: nes
      max_dot_size: 26
      min_dot_size: 6
      view: enrichment
      views: [enrichment]
    section: Enriched sets
    tag: da-en-dotplot
    index: en-dotplot
    title: Enriched gene sets
    description: >-
      Which gene sets move, and at which end of the contrast? Each dot is one gene set placed on its
      normalised enrichment score (NES), sized by the number of its genes found and coloured by -log10 of
      its FDR.

      How to read: sets far from 0 are strongly enriched at one pole (positive at one end of the contrast,
      negative at the other), and a dark dot is a significant one. A far dot that is small is carried by a
      handful of genes, so check it in the GSEA report table.

      Lines and annotations: the vertical line is NES 0. Only sets with an FDR of at most 0.25 are drawn,
      the 20 most significant first, which is the cut-off GSEA recommends for phenotype permutation, the
      nf-core default.

      Source: GSEA team on the FDR cut-off, https://groups.google.com/g/gsea-help/c/0RIVtr7aESQ ; nf-core
      gsea_permute default, https://nf-co.re/differentialabundance/2.0.0/parameters

      Note: with gene-set permutation the GSEA team advises a stricter 0.05, so read the 0.25 as an
      exploratory display filter and not a verdict.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: differentialabundance
    data_collection_tag: gsea_report
    use: gsea/gsea_nes_bars
    config:
      # The catalog labels each bar with its pole, which stacks every set of a
      # pole on one row: label by the set instead.
      label_col: term
      significance_threshold: 0.25
      top_n: 15
    section: Scores side by side
    tag: da-en-nes-bars
    index: en-nes-bars
    title: Enrichment score by contrast
    description: >-
      Do two contrasts move the same gene sets? The strongest 15 sets of each contrast as bars on their
      normalised enrichment score, one panel per contrast.

      How to read: a set that moves in one contrast and not the other shows as a gap. Solid bars are sets
      within the FDR cut-off and hatched bars are not, so a long hatched bar is a large but unsupported
      score.

      Lines and annotations: a bar is solid when its FDR is at most 0.25, GSEA's cut-off for phenotype
      permutation (the nf-core default); there is no other line. Bars are ranked by absolute score.

      Source: GSEA team on the FDR cut-off, https://groups.google.com/g/gsea-help/c/0RIVtr7aESQ

      Note: with gene-set permutation the GSEA team advises 0.05 instead.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: differentialabundance
    data_collection_tag: gsea_report
    use: gsea/report
    row_selection_enabled: true
    row_selection_column: term
    section: Set table
    tag: da-en-table
    index: en-table
    title: GSEA report
    description: >-
      Which sets are reported, and how strong is the evidence? One row per gene set and pole with its
      size, NES, nominal p-value, FDR q-value, family-wise error rate and the leading edge as GSEA wrote
      it, with its share of the set.

      How to read: sort by FDR to list the supported sets and by NES to rank the strongest. A low
      leading-edge share means a handful of genes drive the set.
    layout: {x: 0, y: 0, w: 8, h: 6}
