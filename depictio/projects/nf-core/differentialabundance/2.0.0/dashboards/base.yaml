    data_collection_tag: deseq2_results_annotated
    title: Every annotated feature at its coordinate
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One dot per gene, laid out along the chromosomes, height is -log10 of the
      adjusted p-value. Points above the line cleared padj 0.05. Select one to
      carry that gene onto the [DESeq2](https://bioconductor.org/packages/DESeq2)
      results table pinned below.
