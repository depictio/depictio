version: 1
main_dashboard:
  title: nf-core/rnaseq
  subtitle: "nf-core/rnaseq 3.26.0, STAR + Salmon route: MultiQC funnel, Salmon expression overview, gene explorer"
  project_tag: RNA-seq Expression Analysis
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  workflow_system: nf-core
  # Left panel. The sample scope is persistent and pinned to the top: it reads
  # the samplesheet, which links to every other data collection, so the same
  # three controls narrow the MultiQC panels, the expression matrices and the
  # gene explorer on every tab.
  filter_sections:
  - name: Sample scope
    icon: mdi:filter-variant
    color: orange
    description: Which samples, conditions and replicates every tab is about
    persistent: true
    pin: top
  # Persistent, like the table it narrows: the merged count matrix sits in the
  # pinned Reference tables section on every tab, so its gene control has to
  # follow it rather than work from the MultiQC tab only.
  - name: Reference scope
    icon: mdi:database-outline
    color: gray
    description: Narrow the merged count matrix in Reference tables to named genes
    persistent: true
  # Right panel, in reading order: the general statistics, then the QC funnel in
  # the order the pipeline runs it (reads, alignment, quantification, transcript QC). This tab is named
  # MultiQC and carries MultiQC panels only, which is why the four run-design
  # cards sit in a PINNED PERSISTENT section: `Run at a glance` is open, rides
  # every tab and is the strip each tab opens with, and pinned persistent
  # sections are the documented exception to the MultiQC-only rule.
  # `Reference tables` is pinned to the bottom and holds the rows every tile is
  # computed from, the samplesheet included. Both are declared here, on the tab
  # no route conditional can remove.
  grid_sections:
  - name: General statistics
    icon: mdi:table
    color: blue
    description: One row per library, the headline numbers of every QC module
  - name: Read quality
    icon: mdi:chart-bell-curve
    color: blue
    description: Raw reads, adapter trimming, and the same reads after trimming
  - name: Alignment
    icon: mdi:dna
    color: indigo
    description: How much of each library STAR placed on the genome, and what survived duplicate marking
  - name: Quantification and strandedness
    icon: mdi:chart-box-outline
    color: teal
    description: What Salmon quantified, and whether the library strandedness matched the samplesheet
  - name: Transcript QC
    icon: mdi:microscope
    color: grape
    description: Where the reads landed on the transcriptome and whether duplication tracks expression
    collapsed: true
  - name: Run at a glance
    icon: mdi:table-account
    color: teal
    description: The size and design of the run, on every tab
    persistent: true
    pin: top
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The samples of the run as the samplesheet declares them
    collapsed: true
    persistent: true
    pin: top
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The raw merged count matrix behind every expression tile, on every tab
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # --------------------------------------------------------------- read quality
  - component_type: text
    tag: rna-qc-reads-intro
    section: Read quality
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    title: Before and after trimming
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/) ran
      twice, on the raw reads and again after
      [Trim Galore](https://www.bioinformatics.babraham.ac.uk/projects/trim_galore/)
      . Reading the two side by side is what tells you whether a quality or
      adapter problem was actually removed or only hidden. The sections after
      it follow the pipeline: [STAR](https://github.com/alexdobin/STAR)
      alignment, [Salmon](https://combine-lab.github.io/salmon/)
      quantification and transcript QC.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: rna-qc-general-stats
    section: General statistics
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    title: General statistics
    description: One row per library, pooling the FastQC, Trim Galore, STAR, Salmon, samtools, Picard, RSeQC, Qualimap and dupRadar headline numbers. The per-read rows are named after the read rather than the sample, so a sample filter drops them instead of narrowing them.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: multiqc
    tag: rna-qc-fastqc-raw-counts
    section: Read quality
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: fastqc_raw
    selected_plot: Sequence Counts
    use: multiqc/fastqc
    title: Raw sequence counts
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: rna-qc-fastqc-raw-quality
    section: Read quality
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: fastqc_raw
    selected_plot: Sequence Quality Histograms
    use: multiqc/fastqc
    title: Raw per-base quality
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: rna-qc-cutadapt-filtered
    section: Read quality
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: cutadapt
    selected_plot: Filtered Reads
    use: multiqc/cutadapt
    title: Reads kept by Trim Galore
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: rna-qc-fastqc-trimmed-quality
    section: Read quality
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: fastqc_trimmed
    selected_plot: Sequence Quality Histograms
    use: multiqc/fastqc
    title: Trimmed per-base quality
    title_size: sm
    title_align: left
    layout: {x: 4, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: rna-qc-fastqc-trimmed-status
    section: Read quality
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: fastqc_trimmed
    selected_plot: Status Checks
    use: multiqc/fastqc
    title: FastQC status after trimming
    title_size: sm
    title_align: left
    layout: {x: 0, y: 12, w: 8, h: 5}

  # ----------------------------------------------------------------- alignment
  - component_type: text
    tag: rna-qc-align-intro
    section: Alignment
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    title: What STAR placed, and what survived
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A low uniquely-mapped share points at contamination or the wrong
      reference; a high multimapping share points at repeats or rRNA. The
      [Picard](https://broadinstitute.github.io/picard/) panel shows how much
      of what was mapped was then marked duplicate.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: rna-qc-star-summary
    section: Alignment
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: star
    selected_plot: Summary Statistics
    use: multiqc/star
    title: STAR alignment summary
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: rna-qc-samtools-mapped
    section: Alignment
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: samtools
    selected_plot: Percent mapped
    use: multiqc/samtools
    title: Percent mapped
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: rna-qc-picard-dedup
    section: Alignment
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: picard
    selected_plot: Mark Duplicates
    use: multiqc/picard
    title: Duplicate marking
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 8, h: 5}

  # ------------------------------------------- quantification and strandedness
  - component_type: text
    tag: rna-qc-quant-intro
    section: Quantification and strandedness
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    title: Quantification, and whether the library matched the sheet
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Salmon reports the fragment-length distribution it inferred. The
      strandedness panels compare what the samplesheet declared against what
      Salmon and RSeQC measured.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: rna-qc-salmon-fld
    section: Quantification and strandedness
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: salmon
    selected_plot: salmon-section-1
    use: multiqc/salmon
    title: Salmon fragment length distribution
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: rna-qc-strand-summary
    section: Quantification and strandedness
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: strandedness
    selected_plot: 'Strandedness: inference summary'
    title: Declared versus inferred strandedness
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: rna-qc-strand-composition
    section: Quantification and strandedness
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: strandedness
    selected_plot: 'Strandedness: read composition'
    title: Read strand composition
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 4, h: 5}

  # -------------------------------------------------------------- transcript QC
  - component_type: text
    tag: rna-qc-transcript-intro
    section: Transcript QC
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    title: Where the reads landed
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A library heavy at the 3' end of the gene body points at degraded RNA,
      not at the sequencing. dupRadar separates natural high-expression
      duplicates from library-preparation ones; where each library's reads
      landed on the annotation is on the Expression overview tab.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: rna-qc-qualimap-coverage
    section: Transcript QC
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: qualimap
    selected_plot: Gene Coverage Profile
    use: multiqc/qualimap
    title: Gene body coverage profile
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: rna-qc-dupradar
    section: Transcript QC
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: dupradar
    selected_plot: dupradar-section
    use: multiqc/dupradar
    title: Duplication against expression
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: rna-qc-rseqc-inner-distance
    section: Transcript QC
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: rseqc
    selected_plot: Inner Distance
    use: multiqc/rseqc
    title: Inner distance between mates
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 8, h: 5}

  # --------------------------------------------------------- run at a glance
  # One full row of four `w: 2` cards, in a section that is persistent, pinned
  # to the top and open, so it is the first thing on every tab. Three read the
  # samplesheet (how big the run is and how it is laid out) and the fourth the
  # merged count matrix (how much of the annotation it actually covers).
  # The samplesheet itself moved down to `Reference tables`, with the other raw
  # rows: it is 8 lines of provenance, not a glance metric.
  - component_type: card
    tag: rna-qc-card-samples
    section: Run at a glance
    workflow_tag: rnaseq
    data_collection_tag: samplesheet
    aggregation: nunique
    column_name: sample
    column_type: object
    secondary_layout: top_n
    breakdown_col: condition
    top_n_count: 4
    display: {icon_name: 'mdi:flask', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title: Samples
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: rna-qc-card-conditions
    section: Run at a glance
    workflow_tag: rnaseq
    data_collection_tag: samplesheet
    aggregation: nunique
    column_name: condition
    column_type: object
    secondary_layout: donut
    breakdown_col: condition
    display: {icon_name: 'mdi:shape-outline', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title: Conditions
    title_size: sm
    title_align: left
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: rna-qc-card-replicates
    section: Run at a glance
    workflow_tag: rnaseq
    data_collection_tag: samplesheet
    aggregation: max
    column_name: replicate
    column_type: int64
    secondary_layout: top_n
    display: {icon_name: 'mdi:counter', icon_color: '#7B1FA2', title_color: '#7B1FA2', title_font_size: xl, value_font_size: xl}
    title: Replicates per condition
    title_size: sm
    title_align: left
    breakdown_col: condition
    top_n_count: 4
    layout: {x: 4, y: 0, w: 2, h: 2}
  # Replaces a `strandedness` composition card: the samplesheet declares one
  # value for the whole run (`reverse` here), so the ring had a single segment
  # and the hero number was 1 whatever the filters said. The annotation
  # coverage of the count matrix is the run-level number that does move: how
  # many of the quantified genes carry a symbol, and how many are an Ensembl
  # identifier with nothing attached.
  - component_type: card
    tag: rna-qc-card-annotated
    section: Run at a glance
    workflow_tag: rnaseq
    data_collection_tag: gene_counts
    aggregation: count
    column_name: gene_name
    column_type: object
    secondary_layout: completeness
    display: {icon_name: 'mdi:tag-text-outline', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title: Genes with a symbol
    title_size: sm
    title_align: left
    layout: {x: 6, y: 0, w: 2, h: 2}

  # ----------------------------------------------------------- sample sheet
  - component_type: text
    tag: rna-sheet-intro
    section: Sample sheet
    workflow_tag: rnaseq
    data_collection_tag: samplesheet
    title: What was sequenced
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per sample, as the run's input sheet declared it, with the
      condition and replicate the Sample scope filters read. Check it first
      when a condition looks wrong on a later tab.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: rna-table-samplesheet
    section: Sample sheet
    workflow_tag: rnaseq
    data_collection_tag: samplesheet
    row_selection_enabled: true
    row_selection_column: sample
    title: Samplesheet
    description: One row per sample, with the condition and replicate the recipe reads from the nf-core sample name convention.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 4}

  # ----------------------------------------------------------- reference tables
  - component_type: text
    tag: rna-tables-intro
    section: Reference tables
    workflow_tag: rnaseq
    data_collection_tag: gene_counts
    title: The rows behind every tile
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The raw merged count matrix tximport wrote, before any normalisation,
      the matrix a differential-expression tool is handed. Name genes in
      `Reference scope` to cut it down to the ones you care about.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: rna-table-gene-counts
    section: Reference tables
    workflow_tag: rnaseq
    data_collection_tag: gene_counts
    use: salmon/merged_gene_counts
    row_selection_enabled: false
    page_size: 25
    title: Merged gene counts
    description: Estimated counts per gene and sample, the matrix a differential-expression tool is handed.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 5}

  # -------------------------------------------------------------- left panel
  - component_type: interactive
    tag: rna-filter-sample
    index: rna-sample-filter
    section: Sample scope
    group: Samples
    workflow_tag: rnaseq
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display: {title_size: md, custom_color: '#FB8C00', icon_name: 'mdi:flask'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: rna-filter-condition
    index: rna-condition-filter
    section: Sample scope
    group: Samples
    workflow_tag: rnaseq
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: condition
    column_type: object
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Condition
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: rna-filter-replicate
    index: rna-replicate-filter
    section: Sample scope
    group: Samples
    workflow_tag: rnaseq
    data_collection_tag: samplesheet
    interactive_component_type: RangeSlider
    column_name: replicate
    column_type: int64
    display: {title_size: md, custom_color: '#7B1FA2', icon_name: 'mdi:counter'}
    placement: left
    title: Replicate
    layout: {x: 0, y: 6, w: 1, h: 3}
  # Persistent with its section: it narrows the merged count matrix pinned in
  # Reference tables, which rides every tab.
  - component_type: interactive
    tag: rna-filter-reference-gene
    index: rna-reference-gene-filter
    section: Reference scope
    group: Reference
    workflow_tag: rnaseq
    data_collection_tag: gene_counts
    interactive_component_type: MultiSelect
    column_name: gene_name
    column_type: object
    display: {title_size: md, custom_color: '#607D8B', icon_name: 'mdi:magnify'}
    placement: left
    title: Gene symbol
    layout: {x: 0, y: 9, w: 1, h: 3}

tabs:
- title: Expression overview
  subtitle: Where the libraries sit relative to each other, computed from the merged Salmon TPMs
  tab_order: 1
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  workflow_system: nf-core
  filter_sections:
  - name: Library scope
    icon: mdi:tune
    color: cyan
    description: Narrow to the libraries inside a depth, expression or mapping band
  grid_sections:
  - name: Libraries at a glance
    icon: mdi:counter
    color: cyan
    description: How deep each library sequenced the transcriptome
  - name: Sample relationships
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Which libraries look alike, on the pipeline's own DESeq2 QC PCA and distances
  - name: Library composition
    icon: mdi:chart-donut
    color: teal
    description: What kind of RNA each library is made of, and how many genes it reaches
  - name: Library QC profile
    icon: mdi:chart-timeline-variant
    color: orange
    description: Every MultiQC headline metric of a library on one line, so the odd library out shows as a line that bends away
  components:
  - component_type: text
    tag: rna-ovw-intro
    section: Libraries at a glance
    workflow_tag: rnaseq
    data_collection_tag: sample_overview
    title: One row per library
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each card is one number per library, summarised across the run. A
      library that detects far fewer genes than its peers, or whose median TPM
      is far higher, concentrated its reads on too little of the
      transcriptome.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: rna-ovw-card-unique
    section: Libraries at a glance
    workflow_tag: rnaseq
    data_collection_tag: general_stats
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: pct_uniquely_mapped
    column_type: float64
    display: {icon_name: 'mdi:target', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title: Uniquely mapped (%)
    description: Share of each library's reads STAR placed at a single locus; the box shows the spread across libraries.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: rna-ovw-card-median-tpm
    section: Libraries at a glance
    workflow_tag: rnaseq
    data_collection_tag: sample_overview
    use: salmon/sample_pca
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: median_tpm
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title: Median TPM
    title_size: sm
    title_align: left
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: rna-ovw-card-expressed
    section: Libraries at a glance
    workflow_tag: rnaseq
    data_collection_tag: sample_overview
    use: salmon/sample_pca
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: genes_expressed
    column_type: int64
    display: {icon_name: 'mdi:shield-check-outline', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title: Genes expressed
    description: Genes at 1 TPM or more per library. What counts as low depends on the organism and the annotation, so read a library against its peers.
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: rna-ovw-card-detected
    section: Libraries at a glance
    workflow_tag: rnaseq
    data_collection_tag: sample_overview
    use: salmon/sample_pca
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: genes_detected
    column_type: int64
    display: {icon_name: 'mdi:gauge', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title: Genes detected
    description: Genes with any signal at all per library, against the spread across libraries.
    title_size: sm
    title_align: left
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: text
    tag: rna-ovw-pca-intro
    section: Sample relationships
    workflow_tag: rnaseq
    data_collection_tag: sample_overview
    title: Replicates should sit together
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The pipeline's own DESeq2 QC PCA and sample distances, read from the
      files MultiQC draws. Replicates should sit together in both; select
      points or table rows to narrow the other tiles to those libraries.
    layout: {x: 0, y: 0, w: 8, h: 2}
  # The pipeline publishes its DESeq2 QC PCA as a text file next to the plot
  # MultiQC embeds. Reading the file instead of the picture is what makes the
  # points selectable and the axes filterable, and the percentages in the
  # subtitle come from the file's own header.
  - component_type: advanced_viz
    tag: rna-ovw-qc-pca
    index: rna-ovw-qc-pca-embedding
    section: Sample relationships
    workflow_tag: rnaseq
    data_collection_tag: deseq2_qc_pca
    use: deseq2/qc_pca_embedding
    config:
      point_size: 12
