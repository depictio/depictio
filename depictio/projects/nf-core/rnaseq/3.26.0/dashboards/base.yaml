  - name: Count matrix
    icon: mdi:database-outline
    color: gray
    description: The raw merged count matrix, the input of a differential test
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      Every gene expressed at 1 TPM or more in at least one library, placed by its mean
      log2(TPM + 1) against its spread across the libraries and coloured by the condition it
      peaks in. Genes that set the conditions apart sit high on the plane; click one to
      open its record and narrow the rows below to it, its id linked to
      [Ensembl](https://www.ensembl.org).
    tag: rna-gene-intro
    index: gene-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One row per gene, so the list is short. It narrows the gene rows through
  # the gene_id link and the count matrix by the shared gene_name column.
  - component_type: interactive
    workflow_tag: rnaseq
    data_collection_tag: gene_summary
    interactive_component_type: MultiSelect
    column_name: gene_name
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: green
    section: Gene filters
    tag: rna-gene-filter-gene
    index: gene-gene-filter
    title: Gene
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: rnaseq
    data_collection_tag: gene_summary
    interactive_component_type: RangeSlider
    column_name: mean_log2_tpm
    column_type: float64
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: cyan
    section: Gene filters
    tag: rna-gene-filter-mean
    index: gene-mean-range
    title: Mean log2(TPM + 1)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: rnaseq
    data_collection_tag: gene_summary
    aggregation: count
    column_name: gene_id
    column_type: object
    secondary_layout: donut
    breakdown_col: top_condition
    display:
      icon_name: mdi:dna
      icon_color: green
      caption: by the condition each peaks in
    section: Expression at a glance
    tag: rna-gene-card-genes
    index: gene-card-genes
    title: Expressed genes
    description: Genes at 1 TPM or more in at least one library, one point each on the plane.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnaseq
    data_collection_tag: gene_summary
    aggregation: median
    column_name: mean_log2_tpm
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-histogram
      icon_color: cyan
      caption: median per gene, with its distribution
      decimals: 2
    section: Expression at a glance
    tag: rna-gene-card-mean
    index: gene-card-mean
    title: Mean log2(TPM + 1)
    description: Median of each gene's mean expression over the libraries, the plane's x axis.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnaseq
    data_collection_tag: gene_summary
    aggregation: median
    column_name: sd_log2_tpm
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: grape
      caption: median per gene, with its spread
      decimals: 2
    section: Expression at a glance
    tag: rna-gene-card-sd
    index: gene-card-sd
    title: Spread across libraries
    description: Median standard deviation of a gene's log2(TPM + 1) over the libraries, the plane's y axis.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # The lead of each gene's top condition over the others, split at two-fold.
  # It replaced a ranking of peak libraries whose names a card cuts short.
  - component_type: card
    workflow_tag: rnaseq
    data_collection_tag: gene_summary
    aggregation: median
    column_name: log2fc_top_vs_rest
    column_type: float64
    secondary_layout: threshold
    threshold_value: 1
    threshold_direction: min
    display:
      icon_name: mdi:arrow-up-bold-outline
      icon_color: orange
      caption: median; at or above 1, two-fold over the rest
      decimals: 2
    section: Expression at a glance
    tag: rna-gene-card-lead
    index: gene-card-lead
    title: Lead of the top condition
    description: Median lead of a gene's top condition over the others, in log2(TPM + 1). The bar counts the genes two-fold or more ahead.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: rnaseq
    data_collection_tag: gene_summary
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: mean_log2_tpm
      y_col: sd_log2_tpm
      label_col: gene_name
      color_col: top_condition
      x_title: Mean log2(TPM + 1)
      y_title: Standard deviation of log2(TPM + 1)
      marker_size: 4
      opacity: 0.6
      marker_outline: false
      # No point labels: the most variable genes sit within a few pixels of
      # each other at the top, so their names pile up. The hover, the record
      # and the Variable Genes box plot name them.
      top_n_labels: 0
      # Tens of thousands of expressed genes: keep the points (a click needs a
      # point) rather than the binned view the renderer switches to above 3,000
      # rows. The reader can still turn density on in the controls.
      density_threshold: 40000
      selection_enabled: true
      selection_column: gene_id
      legend_pos: bottom
    section: Mean-variance plane
    tag: rna-gene-plane
    index: rna-gene-plane
    title: Mean-variance plane
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: rnaseq
    data_collection_tag: gene_summary
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: gene_id
      title_col: gene_name
      selection_source: any
      linked_component: rna-gene-plane
      sections:
        Gene: [gene_name, gene_id]
        Expression: [mean_log2_tpm, sd_log2_tpm, max_tpm, libraries_detected]
        Where it peaks: [top_condition, top_sample, log2fc_top_vs_rest]
      link_templates:
        gene_id: https://www.ensembl.org/id/{value}
    section: Mean-variance plane
    tag: rna-gene-record
    index: rna-gene-record
    title: Gene record
    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: table
    workflow_tag: rnaseq
    data_collection_tag: gene_expression
    use: salmon/gene_expression
    row_selection_enabled: true
    row_selection_column: gene_name
    page_size: 25
    section: Gene rows
    tag: rna-gene-table
    index: gene-table-expression
    title: Gene expression
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: rnaseq
    data_collection_tag: gene_counts
    use: salmon/merged_gene_counts
    page_size: 25
    section: Count matrix
    tag: rna-gene-table-counts
    index: gene-table-counts
    title: Merged gene counts
    layout: {x: 0, y: 0, w: 8, h: 6}
