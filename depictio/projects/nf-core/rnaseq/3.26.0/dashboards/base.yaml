- title: Gene explorer
  subtitle: Pick genes and compare their expression across conditions, one row per gene and sample
  tab_order: 3
  tab_icon: mdi:dna
  tab_icon_color: green
  icon: /assets/images/workflows/nf-core.png
  workflow_system: nf-core
  filter_sections:
  - name: Gene scope
    icon: mdi:dna
    color: green
    description: Which genes and which expression range the panels cover
  grid_sections:
  - name: Picked genes
    icon: mdi:counter
    color: green
    description: What the current gene and sample selection covers
  - name: Expression by condition
    icon: mdi:chart-bell-curve
    color: green
    description: The distribution of the picked genes in each condition
  - name: Gene rows
    icon: mdi:table
    color: lime
    description: One row per gene and sample, selectable
  components:
  - component_type: text
    tag: rna-gene-intro
    section: Picked genes
    workflow_tag: rnaseq
    data_collection_tag: gene_expression
    title: Start from the gene filter
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The table holds every gene expressed at 1 TPM or more in at least one
      library. Pick genes in the left panel, or select rows in the table, and the
      box plot follows.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: rna-gene-card-genes
    section: Picked genes
    workflow_tag: rnaseq
    data_collection_tag: gene_expression
    aggregation: nunique
    column_name: gene_name
    column_type: object
    secondary_layout: donut
    breakdown_col: group
    display: {icon_name: 'mdi:dna', icon_color: '#2E7D32', title_color: '#2E7D32', title_font_size: xl, value_font_size: xl}
    title: Genes in view
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 2, h: 2}
  - component_type: card
    tag: rna-gene-card-tpm
    section: Picked genes
    workflow_tag: rnaseq
    data_collection_tag: gene_expression
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: tpm
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title: TPM
    title_size: sm
    title_align: left
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: rna-gene-card-samples
    section: Picked genes
    workflow_tag: rnaseq
    data_collection_tag: gene_expression
    aggregation: nunique
    column_name: sample
    column_type: object
    secondary_layout: top_n
    breakdown_col: group
    top_n_count: 4
    display: {icon_name: 'mdi:flask', icon_color: '#558B2F', title_color: '#558B2F', title_font_size: xl, value_font_size: xl}
    title: Libraries in view
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 2, h: 2}
  - component_type: card
    tag: rna-gene-card-log2
    section: Picked genes
    workflow_tag: rnaseq
    data_collection_tag: gene_expression
    aggregation: average
    column_name: log2_tpm
    column_type: float64
    secondary_layout: histogram
    display: {icon_name: 'mdi:chart-histogram', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title: log2(TPM + 1)
    title_size: sm
    title_align: left
    layout: {x: 6, y: 1, w: 2, h: 2}

  - component_type: text
    tag: rna-gene-box-intro
    section: Expression by condition
    workflow_tag: rnaseq
    data_collection_tag: gene_expression
    title: One box per gene and condition
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each box is one gene in one condition, with the individual libraries drawn
      beside it, so a difference backed by two consistent replicates is
      distinguishable from one driven by a single outlier. Selecting points
      filters the table below to those genes.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: rna-gene-fig-box
    index: rna-gene-condition-box
    section: Expression by condition
    workflow_tag: rnaseq
    data_collection_tag: gene_expression
    mode: code
    code_content: |
      # Cap the genes drawn: the box plot is a comparison of a handful of genes,
      # and an unfiltered frame would put thousands of boxes on one axis.
      top_genes = (
          df.group_by('gene_name')
          .agg(pl.col('tpm').max().alias('_max_tpm'))
          .sort('_max_tpm', descending=True)
          .head(12)['gene_name']
          .to_list()
      )
      df_modified = df.filter(pl.col('gene_name').is_in(top_genes)).sort(['gene_name', 'group'])
      fig = px.box(
          df_modified.to_pandas(), x='gene_name', y='log2_tpm', color='group',
          points='all', hover_name='sample', custom_data=['gene_name'],
      )
      fig.update_layout(
          xaxis_title='Gene', yaxis_title='log2(TPM + 1)',
          legend_title_text='Condition', boxmode='group',
          margin={'t': 24, 'l': 64, 'r': 16, 'b': 88},
      )
      fig.update_xaxes(tickangle=-40)
    selection_enabled: true
    selection_column: gene_name
    title: Expression by condition
    description: The 12 highest-expressed genes in view, one box per condition. Select points to filter the table.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}

  - component_type: text
    tag: rna-gene-table-intro
    section: Gene rows
    workflow_tag: rnaseq
    data_collection_tag: gene_expression
    title: Every gene and library
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Selecting rows here narrows the box plot and the cards above to those
      genes, the same key the plot selects on.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: table
    tag: rna-gene-table
    section: Gene rows
    workflow_tag: rnaseq
    data_collection_tag: gene_expression
    use: salmon/gene_expression
    row_selection_enabled: true
    row_selection_column: gene_name
    page_size: 25
    title: Gene expression
    description: TPM and log2(TPM + 1) per gene, library and condition.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 6}

  - component_type: interactive
    tag: rna-gene-filter-gene
    index: rna-gene-gene-filter
    section: Gene scope
    group: Genes
    workflow_tag: rnaseq
    data_collection_tag: gene_expression
    interactive_component_type: MultiSelect
    column_name: gene_name
    column_type: object
    display: {title_size: md, custom_color: '#2E7D32', icon_name: 'mdi:dna'}
    placement: left
    title: Gene
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
