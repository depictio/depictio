  - component_type: advanced_viz
    tag: rna-heat-heatmap
    index: rna-heat-complex-heatmap
    section: Top variable genes
    workflow_tag: rnaseq
    data_collection_tag: expression_heatmap
    use: salmon/top_variable_heatmap
    config:
      cluster_rows: true
      cluster_cols: true
      normalize: row_z
      colorscale: RdBu
      # Pulled from the samplesheet DC through the declared link, which is the
      # only one into this matrix whose source is metatype Metadata. The other
      # link in (sample_overview) is a derived stats table and stays ineligible.
      # These are the four the sheet can describe a library by; a run where one
      # of them is constant (the megatest is paired-end and reverse throughout)
      # simply does not get that strip.
      col_annotation_cols: [condition, replicate, read_type, strandedness]
    title: Top 500 variable genes
    description: Row-normalised log2(TPM + 1). Rows and columns are clustered, so replicates of one condition should form a block.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 9}

  - component_type: text
    tag: rna-gene-box-intro
    section: Expression by condition
    workflow_tag: rnaseq
    data_collection_tag: gene_expression
    title: One box per gene and condition
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each box is one gene in one condition, with the libraries drawn beside
      it, so a difference backed by consistent replicates stands apart from
      one driven by a single outlier. Selecting points filters the rows below
      to those genes.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: rna-gene-fig-box
    index: rna-gene-condition-box
    section: Expression by condition
    workflow_tag: rnaseq
    data_collection_tag: gene_expression
    use: salmon/gene_expression
    mode: code
    code_content: |
      # The axis this figure compares on: the dashboard's analysis groups when
      # the viewer has made some, else the samplesheet's own condition. One
      # grouping axis, not two stacked on each other.
      grp_col = depictio_group_by[0] if depictio_group_by else 'group'
      if grp_col not in df.columns:
          grp_col = 'group'
      colors = depictio_group_kwargs.get('color_discrete_map') or {}
      # Cap the genes drawn: the box plot is a comparison of a handful of genes,
      # and an unfiltered frame would put thousands of boxes on one axis.
      # Rank by spread across libraries, not by level: the highest-TPM genes
      # are housekeeping and mitochondrial transcripts that never separate
      # conditions.
      top_genes = (
          df.group_by('gene_name')
          .agg(pl.col('log2_tpm').std().fill_null(0).alias('_sd'))
          .sort('_sd', descending=True)
          .head(12)['gene_name']
          .to_list()
      )
      df_modified = df.filter(pl.col('gene_name').is_in(top_genes)).sort(['gene_name', grp_col])
      fig = px.box(
          df_modified.to_pandas(), x='gene_name', y='log2_tpm', color=grp_col,
          color_discrete_map=colors,
          points='all', hover_name='sample', custom_data=['gene_name'],
      )
      fig.update_layout(
          xaxis_title='Gene', yaxis_title='log2(TPM + 1)',
          legend_title_text='Group' if depictio_group_by else 'Condition',
          boxmode='group',
          margin={'t': 24, 'l': 64, 'r': 16, 'b': 88},
      )
      fig.update_xaxes(tickangle=-40)
    selection_enabled: true
    selection_column: gene_name
    title: Expression by condition
    description: The 12 most variable genes in view, one box per condition. Pick genes to replace them; select points to filter the table.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}

