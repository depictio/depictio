  filter_sections:
  - name: Heatmap scope
    icon: mdi:filter-variant
    color: grape
    description: Which sample columns the matrix keeps
    collapsed: true
  grid_sections:
  - name: Top variable genes
    icon: mdi:chart-box-outline
    color: grape
    description: The genes that separate the conditions, on the log2(TPM + 1) scale
  - name: Matrix rows
    icon: mdi:database-outline
    color: gray
    description: The same matrix as rows, one gene per row
    collapsed: true
  components:
  - component_type: text
    tag: rna-heat-intro
    section: Top variable genes
    workflow_tag: rnaseq
    data_collection_tag: expression_heatmap
    title: Variance picks the genes
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Genes are ranked by variance across the libraries on the log2(TPM + 1)
      scale and the top 500 are kept, so the block structure you see is the
      structure the conditions actually impose. The strip above the columns is
      the condition each library belongs to.
    layout: {x: 0, y: 0, w: 8, h: 2}
