    section: Library scope
    group: Depth
    workflow_tag: rnaseq
    data_collection_tag: sample_overview
    interactive_component_type: RangeSlider
    column_name: median_tpm
    column_type: float64
    show_histogram: true
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:chart-bell-curve'}
    placement: left
    title: Median TPM
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: rna-ovw-filter-unique-mapping
    index: rna-ovw-unique-mapping-range
    section: Library scope
    group: QC profile
    workflow_tag: rnaseq
    data_collection_tag: general_stats
    interactive_component_type: RangeSlider
    column_name: pct_uniquely_mapped
    column_type: float64
    show_histogram: true
    display: {title_size: md, custom_color: '#F2A93B', icon_name: 'mdi:target'}
    placement: left
    title: Uniquely mapped (%)
    layout: {x: 0, y: 9, w: 1, h: 3}

- title: Expression heatmap
  subtitle: The 500 most variable genes, clustered, with the samplesheet design on top
  tab_order: 2
  tab_icon: mdi:grid
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  workflow_system: nf-core
  # Tab-local: the one column this matrix owns that the pinned Sample scope
  # does not already cover is the gene, so that is what the local filter binds.
  # The sample columns are narrowed by the pinned scope through the links.
  filter_sections:
  - name: Heatmap scope
    icon: mdi:filter-variant
    color: grape
    description: Which genes the matrix keeps; the sample columns follow the pinned Sample scope
    collapsed: true
  grid_sections:
  - name: Top variable genes
    icon: mdi:chart-box-outline
    color: grape
    description: The libraries behind the columns, then the genes that separate the conditions on the log2(TPM + 1) scale
  - name: Matrix rows
    icon: mdi:database-outline
    color: gray
    description: The same matrix as rows, one gene per row
    collapsed: true
  components:
  # The glance strip this tab opens with: the libraries behind the heatmap
  # columns, read from the per-sample overview the pinned scope reaches.
  - component_type: card
    tag: rna-heat-card-libraries
    index: rna-heat-card-libraries
    section: Top variable genes
    workflow_tag: rnaseq
    data_collection_tag: sample_overview
    use: salmon/sample_pca
    aggregation: nunique
    column_name: sample_id
    column_type: object
    secondary_layout: donut
    breakdown_col: group
    display: {icon_name: 'mdi:flask', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Libraries by condition
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: rna-heat-card-median-tpm
    index: rna-heat-card-median-tpm
    section: Top variable genes
    workflow_tag: rnaseq
    data_collection_tag: sample_overview
    use: salmon/sample_pca
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: median_tpm
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Median TPM
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: rna-heat-card-expressed
    index: rna-heat-card-expressed
    section: Top variable genes
    workflow_tag: rnaseq
    data_collection_tag: sample_overview
    use: salmon/sample_pca
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: genes_expressed
    column_type: int64
    display: {icon_name: 'mdi:shield-check-outline', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Genes expressed
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: rna-heat-card-detected
    index: rna-heat-card-detected
    section: Top variable genes
    workflow_tag: rnaseq
    data_collection_tag: sample_overview
    use: salmon/sample_pca
    aggregation: average
    column_name: genes_detected
    column_type: int64
    secondary_layout: gauge
    coverage_max: 30000
    display: {icon_name: 'mdi:gauge', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Genes detected
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: text
    tag: rna-heat-intro
    section: Top variable genes
    workflow_tag: rnaseq
    data_collection_tag: expression_heatmap
    title: Variance picks the genes
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Genes are ranked by variance across the libraries on the log2(TPM + 1)
      scale and the top 500 are kept, so the block structure you see is the
      structure the conditions actually impose. The strips above the columns
      are what the samplesheet declared each library to be, and only the
      fields that actually vary across this run get one.
    layout: {x: 0, y: 2, w: 8, h: 2}
  - component_type: advanced_viz
    tag: rna-heat-heatmap
    index: rna-heat-complex-heatmap
    section: Top variable genes
    workflow_tag: rnaseq
    data_collection_tag: expression_heatmap
    use: salmon/top_variable_heatmap
    config:
      cluster_rows: true
      cluster_cols: true
      normalize: row_z
      colorscale: RdBu
      # Pulled from the samplesheet DC through the declared link, which is the
      # only one into this matrix whose source is metatype Metadata. The other
      # link in (sample_overview) is a derived stats table and stays ineligible.
      # These are the four the sheet can describe a library by; a run where one
      # of them is constant (the megatest is paired-end and reverse throughout)
      # simply does not get that strip.
      col_annotation_cols: [condition, replicate, read_type, strandedness]
    title: Top 500 variable genes
    description: Row-normalised log2(TPM + 1). Rows and columns are clustered, so replicates of one condition should form a block.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 9}

  - component_type: text
    tag: rna-heat-rows-intro
    section: Matrix rows
    workflow_tag: rnaseq
    data_collection_tag: expression_heatmap
    title: The matrix as rows
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The same 500 genes, one per row, sorted by decreasing variance. Sorting on
      a sample column is the quickest way to the genes that library is highest
      in.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: rna-heat-table
    section: Matrix rows
    workflow_tag: rnaseq
    data_collection_tag: expression_heatmap
    use: salmon/expression_heatmap
    row_selection_enabled: false
    page_size: 25
    title: Top variable gene matrix
    description: log2(TPM + 1) per gene and sample.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 5}

  - component_type: interactive
    tag: rna-heat-filter-gene
    index: rna-heat-gene-filter
    section: Heatmap scope
    group: Rows
    workflow_tag: rnaseq
    data_collection_tag: expression_heatmap
    interactive_component_type: MultiSelect
    column_name: gene_name
    column_type: object
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:dna'}
    placement: left
    title: Gene
    description: Keep only the named genes among the 500 most variable. The sample columns are narrowed by the pinned Sample scope.
    layout: {x: 0, y: 0, w: 1, h: 3}

- title: Gene explorer
  subtitle: Pick genes and compare their expression across conditions, one row per gene and sample
  tab_order: 3
  tab_icon: mdi:dna
  tab_icon_color: green
  icon: /assets/images/workflows/nf-core.png
  workflow_system: nf-core
  filter_sections:
  - name: Gene scope
    icon: mdi:dna
    color: green
    description: Which genes and which expression range the panels cover
  grid_sections:
  - name: Picked genes
    icon: mdi:counter
    color: green
    description: What the current gene and sample selection covers
  - name: Gene record
    icon: mdi:dna
    color: teal
    description: Pick a gene on the mean-variance plane and read its record beside it
  - name: Expression by condition
    icon: mdi:chart-bell-curve
    color: green
    description: The distribution of the picked genes in each condition
  - name: Gene rows
    icon: mdi:table
    color: lime
    description: One row per gene and sample, selectable
  components:
  - component_type: text
    tag: rna-gene-intro
    section: Picked genes
    workflow_tag: rnaseq
    data_collection_tag: gene_expression
    title: Start from the gene filter
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The table holds every gene expressed at 1 TPM or more in at least one
      library. Pick genes in the left panel, or select rows in the table, and the
      box plot follows.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: rna-gene-card-genes
    section: Picked genes
    workflow_tag: rnaseq
    data_collection_tag: gene_expression
    use: salmon/gene_expression
    aggregation: nunique
    column_name: gene_name
    column_type: object
    secondary_layout: donut
    breakdown_col: group
    display: {icon_name: 'mdi:dna', icon_color: '#2E7D32', title_color: '#2E7D32', title_font_size: xl, value_font_size: xl}
    title: Genes in view
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: rna-gene-card-tpm
    section: Picked genes
    workflow_tag: rnaseq
    data_collection_tag: gene_expression
    use: salmon/gene_expression
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: tpm
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title: TPM
    title_size: sm
    title_align: left
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: rna-gene-card-samples
    section: Picked genes
    workflow_tag: rnaseq
    data_collection_tag: gene_expression
    use: salmon/gene_expression
    aggregation: nunique
    column_name: sample
    column_type: object
    secondary_layout: top_n
    breakdown_col: group
    top_n_count: 4
    display: {icon_name: 'mdi:flask', icon_color: '#558B2F', title_color: '#558B2F', title_font_size: xl, value_font_size: xl}
    title: Libraries in view
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: rna-gene-card-log2
    section: Picked genes
    workflow_tag: rnaseq
    data_collection_tag: gene_expression
    use: salmon/gene_expression
    aggregation: average
    column_name: log2_tpm
    column_type: float64
    secondary_layout: histogram
    display: {icon_name: 'mdi:chart-histogram', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title: log2(TPM + 1)
    title_size: sm
    title_align: left
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: text
    tag: rna-gene-record-intro
    section: Gene record
    workflow_tag: rnaseq
    data_collection_tag: gene_summary
    title: Genes that separate the conditions sit high on this plane
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One point per expressed gene: mean log2(TPM + 1) across the libraries
      against its spread, coloured by the condition it peaks in. The card opens
      on HBG2, the fetal globin that K562 expresses and the other lines do not.
      Click a point to swap the card to that gene and narrow the box plot and
      the gene rows below to it; the Ensembl identifier links out.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: rna-gene-record-plane
    index: rna-gene-record-plane
    section: Gene record
    workflow_tag: rnaseq
    data_collection_tag: gene_summary
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: mean_log2_tpm
      y_col: sd_log2_tpm
      label_col: gene_name
      color_col: top_condition
      x_title: Mean log2(TPM + 1)
      y_title: Standard deviation of log2(TPM + 1)
      marker_size: 4
      opacity: 0.6
      marker_outline: false
      top_n_labels: 10
      # About 19,000 expressed genes: keep the points (a click needs a point)
      # rather than the binned view the renderer switches to above 3,000 rows.
      # The reader can still turn density on from the header.
      density_threshold: 40000
      selection_enabled: true
      selection_column: gene_id
      legend_pos: bottom
      controls_placement: header
    title: Mean-variance plane
    description: Every gene expressed at 1 TPM or more in at least one library. Selection is on the Ensembl gene id, which the card beside it and the gene explorer read.
    title_size: h3
    layout: {x: 0, y: 2, w: 5, h: 9}
  - component_type: advanced_viz
    tag: rna-gene-record-card
    index: rna-gene-record-card
    section: Gene record
    workflow_tag: rnaseq
    data_collection_tag: gene_summary
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: gene_id
      title_col: gene_name
      selection_source: any
      default_record: ENSG00000196565
      sections:
        Gene: [gene_name, gene_id]
        Expression: [mean_log2_tpm, sd_log2_tpm, max_tpm, libraries_detected]
        Where it peaks: [top_condition, top_sample, log2fc_top_vs_rest]
      link_templates:
        gene_id: "https://www.ensembl.org/id/{value}"
    title: Gene record
    description: The picked gene as a fact panel. Ensembl resolves the stable identifier for any species, so the link holds on a mouse run too.
    title_size: h3
    layout: {x: 5, y: 2, w: 3, h: 9}

  - component_type: text
    tag: rna-gene-box-intro
    section: Expression by condition
    workflow_tag: rnaseq
    data_collection_tag: gene_expression
    title: One box per gene and condition
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each box is one gene in one condition, with the individual libraries drawn
      beside it, so a difference backed by two consistent replicates is
      distinguishable from one driven by a single outlier. Selecting points
      filters the table below to those genes.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: rna-gene-fig-box
    index: rna-gene-condition-box
    section: Expression by condition
    workflow_tag: rnaseq
    data_collection_tag: gene_expression
    use: salmon/gene_expression
    mode: code
    code_content: |
      # The axis this figure compares on: the dashboard's analysis groups when
      # the viewer has made some, else the samplesheet's own condition. One
      # grouping axis, not two stacked on each other.
      grp_col = depictio_group_by[0] if depictio_group_by else 'group'
      if grp_col not in df.columns:
          grp_col = 'group'
      colors = depictio_group_kwargs.get('color_discrete_map') or {}
      # Cap the genes drawn: the box plot is a comparison of a handful of genes,
      # and an unfiltered frame would put thousands of boxes on one axis.
      top_genes = (
          df.group_by('gene_name')
          .agg(pl.col('tpm').max().alias('_max_tpm'))
          .sort('_max_tpm', descending=True)
          .head(12)['gene_name']
          .to_list()
      )
      df_modified = df.filter(pl.col('gene_name').is_in(top_genes)).sort(['gene_name', grp_col])
      fig = px.box(
          df_modified.to_pandas(), x='gene_name', y='log2_tpm', color=grp_col,
          color_discrete_map=colors,
          points='all', hover_name='sample', custom_data=['gene_name'],
      )
      fig.update_layout(
          xaxis_title='Gene', yaxis_title='log2(TPM + 1)',
          legend_title_text='Group' if depictio_group_by else 'Condition',
          boxmode='group',
          margin={'t': 24, 'l': 64, 'r': 16, 'b': 88},
      )
      fig.update_xaxes(tickangle=-40)
    selection_enabled: true
    selection_column: gene_name
    title: Expression by condition
    description: The 12 highest-expressed genes in view, one box per condition. Select points to filter the table.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}

