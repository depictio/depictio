version: 1
main_dashboard:
  title: nf-core/rnaseq
  subtitle: "nf-core/rnaseq 3.26.0, STAR + Salmon route: MultiQC funnel, Salmon expression overview, gene explorer"
  project_tag: RNA-seq Expression Analysis
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  workflow_system: nf-core
  # Left panel. The sample scope is persistent and pinned to the top: it reads
  # the samplesheet, which links to every other data collection, so the same
  # three controls narrow the MultiQC panels, the expression matrices and the
  # gene explorer on every tab.
  filter_sections:
  - name: Sample scope
    icon: mdi:filter-variant
    color: orange
    description: Which samples, conditions and replicates every tab is about
    persistent: true
    pin: top
  # Tab-local, so it stays on this tab: the only rows this tab owns that are
  # not MultiQC's own are the merged count matrix and the samplesheet, both in
  # the pinned Reference tables section at the foot of the page.
  - name: Reference scope
    icon: mdi:database-outline
    color: gray
    description: Narrow the reference tables at the foot of this tab to named genes
  # Right panel, in reading order: the QC funnel in the order the pipeline runs
  # it (reads, alignment, quantification, transcript QC). This tab is named
  # MultiQC and carries MultiQC panels only, which is why the four run-design
  # cards sit in a PINNED PERSISTENT section: `Run at a glance` is open, rides
  # every tab and is the strip each tab opens with, and pinned persistent
  # sections are the documented exception to the MultiQC-only rule.
  # `Reference tables` is pinned to the bottom and holds the rows every tile is
  # computed from, the samplesheet included. Both are declared here, on the tab
  # no route conditional can remove.
  grid_sections:
  - name: Read quality
    icon: mdi:chart-bell-curve
    color: blue
    description: Raw reads, adapter trimming, and the same reads after trimming
  - name: Alignment
    icon: mdi:dna
    color: indigo
    description: How much of each library STAR placed on the genome, and what survived duplicate marking
  - name: Quantification and strandedness
    icon: mdi:chart-box-outline
    color: teal
    description: What Salmon quantified, whether the library strandedness matched the samplesheet, and how the pipeline's own DESeq2 QC ordered the samples
  - name: Transcript QC
    icon: mdi:microscope
    color: grape
    description: Where the reads landed on the transcriptome and whether duplication tracks expression
    collapsed: true
  - name: Run at a glance
    icon: mdi:table-account
    color: teal
    description: The size and design of the run, on every tab
    persistent: true
    pin: top
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The samplesheet and the raw merged count matrix behind every tile, on every tab
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # --------------------------------------------------------------- read quality
  - component_type: text
    tag: rna-qc-reads-intro
    section: Read quality
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    title: Before and after trimming
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/) ran
      twice, on the raw reads and again after
      [Trim Galore](https://www.bioinformatics.babraham.ac.uk/projects/trim_galore/)
      . Reading the two side by side is what tells you whether a quality or
      adapter problem was actually removed or only hidden. The sections after
      it follow the pipeline: [STAR](https://github.com/alexdobin/STAR)
      alignment, [Salmon](https://combine-lab.github.io/salmon/)
      quantification and transcript QC.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: rna-qc-general-stats
    section: Read quality
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    title: General statistics
    description: One row per library, pooling the FastQC, Trim Galore, STAR, Salmon, samtools, Picard, RSeQC, Qualimap and dupRadar headline numbers. The per-read rows are named after the read rather than the sample, so a sample filter drops them instead of narrowing them.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 5}
  - component_type: multiqc
    tag: rna-qc-fastqc-raw-counts
    section: Read quality
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: fastqc_raw
    selected_plot: Sequence Counts
    use: multiqc/fastqc
    title: Raw sequence counts
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: rna-qc-fastqc-raw-quality
    section: Read quality
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: fastqc_raw
    selected_plot: Sequence Quality Histograms
    use: multiqc/fastqc
    title: Raw per-base quality
    title_size: sm
    title_align: left
    layout: {x: 4, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: rna-qc-cutadapt-filtered
    section: Read quality
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: cutadapt
    selected_plot: Filtered Reads
    use: multiqc/cutadapt
    title: Reads kept by Trim Galore
    title_size: sm
    title_align: left
    layout: {x: 0, y: 12, w: 4, h: 5}
  - component_type: multiqc
    tag: rna-qc-fastqc-trimmed-quality
    section: Read quality
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: fastqc_trimmed
    selected_plot: Sequence Quality Histograms
    use: multiqc/fastqc
    title: Trimmed per-base quality
    title_size: sm
    title_align: left
    layout: {x: 4, y: 12, w: 4, h: 5}
  - component_type: multiqc
    tag: rna-qc-fastqc-trimmed-status
    section: Read quality
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: fastqc_trimmed
    selected_plot: Status Checks
    use: multiqc/fastqc
    title: FastQC status after trimming
    title_size: sm
    title_align: left
    layout: {x: 0, y: 17, w: 8, h: 5}

  # ----------------------------------------------------------------- alignment
  - component_type: text
    tag: rna-qc-align-intro
    section: Alignment
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    title: What STAR placed, and what survived
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A low uniquely-mapped share points at contamination or the wrong
      reference; a high multimapping share points at repeats or rRNA. The
      [Picard](https://broadinstitute.github.io/picard/) panel shows how much
      of what was mapped was then marked duplicate.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: rna-qc-star-summary
    section: Alignment
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: star
    selected_plot: Summary Statistics
    use: multiqc/star
    title: STAR alignment summary
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: rna-qc-samtools-mapped
    section: Alignment
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: samtools
    selected_plot: Percent mapped
    use: multiqc/samtools
    title: Percent mapped
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: rna-qc-picard-dedup
    section: Alignment
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: picard
    selected_plot: Mark Duplicates
    use: multiqc/picard
    title: Duplicate marking
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 8, h: 5}

  # ------------------------------------------- quantification and strandedness
  - component_type: text
    tag: rna-qc-quant-intro
    section: Quantification and strandedness
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    title: Quantification, and whether the library matched the sheet
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Salmon reports the fragment-length distribution it inferred. The
      strandedness panels compare what the samplesheet declared against what
      Salmon and RSeQC measured, and the
      [DESeq2](https://bioconductor.org/packages/DESeq2) PCA is the pipeline's
      own view of how the libraries group.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: rna-qc-salmon-fld
    section: Quantification and strandedness
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: salmon
    selected_plot: salmon-section-1
    use: multiqc/salmon
    title: Salmon fragment length distribution
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: rna-qc-strand-summary
    section: Quantification and strandedness
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: strandedness
    selected_plot: 'Strandedness: inference summary'
    title: Declared versus inferred strandedness
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: rna-qc-strand-composition
    section: Quantification and strandedness
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: strandedness
    selected_plot: 'Strandedness: read composition'
    title: Read strand composition
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: rna-qc-deseq2-pca
    section: Quantification and strandedness
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: sample-relationships
    selected_plot: STAR_SALMON DESeq2 PCA plot
    title: DESeq2 PCA (pipeline QC)
    description: The pipeline's own PCA, computed on the regularised-log counts. The Expression overview tab plots the interactive TPM equivalent.
    title_size: sm
    title_align: left
    layout: {x: 4, y: 7, w: 4, h: 5}

  # -------------------------------------------------------------- transcript QC
  - component_type: text
    tag: rna-qc-transcript-intro
    section: Transcript QC
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    title: Where the reads landed
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      RSeQC and [Qualimap](http://qualimap.conesalab.org/) split the
      alignments by transcript feature: a library heavy in introns or
      intergenic space is one where the RNA, not the sequencing, went wrong.
      dupRadar separates natural high-expression duplicates from
      library-preparation ones.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: rna-qc-rseqc-distribution
    section: Transcript QC
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: rseqc
    selected_plot: Read Distribution
    use: multiqc/rseqc
    title: Read distribution over features
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: rna-qc-qualimap-origin
    section: Transcript QC
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: qualimap
    selected_plot: Genomic origin of reads
    use: multiqc/qualimap
    title: Genomic origin of reads
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: rna-qc-qualimap-coverage
    section: Transcript QC
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: qualimap
    selected_plot: Gene Coverage Profile
    use: multiqc/qualimap
    title: Gene body coverage profile
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: rna-qc-dupradar
    section: Transcript QC
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: dupradar
    selected_plot: dupradar-section
    use: multiqc/dupradar
    title: Duplication against expression
    title_size: sm
    title_align: left
    layout: {x: 4, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: rna-qc-rseqc-inner-distance
    section: Transcript QC
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: rseqc
    selected_plot: Inner Distance
    use: multiqc/rseqc
    title: Inner distance between mates
    title_size: sm
    title_align: left
    layout: {x: 0, y: 12, w: 8, h: 5}

  # --------------------------------------------------------- run at a glance
  # One full row of four `w: 2` cards, in a section that is persistent, pinned
  # to the top and open, so it is the first thing on every tab. Three read the
  # samplesheet (how big the run is and how it is laid out) and the fourth the
  # merged count matrix (how much of the annotation it actually covers).
  # The samplesheet itself moved down to `Reference tables`, with the other raw
  # rows: it is 8 lines of provenance, not a glance metric.
  - component_type: card
    tag: rna-qc-card-samples
    section: Run at a glance
    workflow_tag: rnaseq
    data_collection_tag: samplesheet
    aggregation: nunique
    column_name: sample
    column_type: object
    secondary_layout: top_n
    breakdown_col: condition
    top_n_count: 4
    display: {icon_name: 'mdi:flask', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title: Samples
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: rna-qc-card-conditions
    section: Run at a glance
    workflow_tag: rnaseq
    data_collection_tag: samplesheet
    aggregation: nunique
    column_name: condition
    column_type: object
    secondary_layout: donut
    breakdown_col: condition
    display: {icon_name: 'mdi:shape-outline', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title: Conditions
    title_size: sm
    title_align: left
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: rna-qc-card-replicates
    section: Run at a glance
    workflow_tag: rnaseq
    data_collection_tag: samplesheet
    aggregation: max
    column_name: replicate
    column_type: int64
    secondary_layout: histogram
    display: {icon_name: 'mdi:counter', icon_color: '#7B1FA2', title_color: '#7B1FA2', title_font_size: xl, value_font_size: xl}
    title: Replicates per condition
    title_size: sm
    title_align: left
    layout: {x: 4, y: 0, w: 2, h: 2}
  # Replaces a `strandedness` composition card: the samplesheet declares one
  # value for the whole run (`reverse` here), so the ring had a single segment
  # and the hero number was 1 whatever the filters said. The annotation
  # coverage of the count matrix is the run-level number that does move: how
  # many of the quantified genes carry a symbol, and how many are an Ensembl
  # identifier with nothing attached.
  - component_type: card
    tag: rna-qc-card-annotated
    section: Run at a glance
    workflow_tag: rnaseq
    data_collection_tag: gene_counts
    aggregation: count
    column_name: gene_name
    column_type: object
    secondary_layout: completeness
    display: {icon_name: 'mdi:tag-text-outline', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title: Genes with a symbol
    title_size: sm
    title_align: left
    layout: {x: 6, y: 0, w: 2, h: 2}

  # ----------------------------------------------------------- reference tables
  - component_type: text
    tag: rna-tables-intro
    section: Reference tables
    workflow_tag: rnaseq
    data_collection_tag: gene_counts
    title: The rows behind every tile
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The rows every tile above is computed from: the raw merged count matrix
      tximport wrote, before any normalisation, and under it the samplesheet
      the left panel filters read. Filters narrow both. Name genes in
      `Reference scope` to cut the matrix down to the ones you care about.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: rna-table-gene-counts
    section: Reference tables
    workflow_tag: rnaseq
    data_collection_tag: gene_counts
    use: salmon/merged_gene_counts
    row_selection_enabled: false
    page_size: 25
    title: Merged gene counts
    description: Estimated counts per gene and sample, the matrix a differential-expression tool is handed.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 5}
  - component_type: table
    tag: rna-table-samplesheet
    section: Reference tables
    workflow_tag: rnaseq
    data_collection_tag: samplesheet
    row_selection_enabled: false
    title: Samplesheet
    description: One row per sample, with the condition and replicate parsed from its name.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 7, w: 8, h: 4}

  # -------------------------------------------------------------- left panel
  - component_type: interactive
    tag: rna-filter-sample
    index: rna-sample-filter
    section: Sample scope
    group: Samples
    workflow_tag: rnaseq
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display: {title_size: md, custom_color: '#FB8C00', icon_name: 'mdi:flask'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: rna-filter-condition
    index: rna-condition-filter
    section: Sample scope
    group: Samples
    workflow_tag: rnaseq
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: condition
    column_type: object
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Condition
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: rna-filter-replicate
    index: rna-replicate-filter
    section: Sample scope
    group: Samples
    workflow_tag: rnaseq
    data_collection_tag: samplesheet
    interactive_component_type: RangeSlider
    column_name: replicate
    column_type: int64
    display: {title_size: md, custom_color: '#7B1FA2', icon_name: 'mdi:counter'}
    placement: left
    title: Replicate
    layout: {x: 0, y: 6, w: 1, h: 3}
  # Tab-local: the only non-MultiQC rows this tab owns are the two reference
  # tables at its foot, and this is what narrows them. Not persistent, so it
  # does not follow the reader onto the expression tabs, which have their own
  # gene control.
  - component_type: interactive
    tag: rna-filter-reference-gene
    index: rna-reference-gene-filter
    section: Reference scope
    group: Reference
    workflow_tag: rnaseq
    data_collection_tag: gene_counts
    interactive_component_type: MultiSelect
    column_name: gene_name
    column_type: object
    display: {title_size: md, custom_color: '#607D8B', icon_name: 'mdi:magnify'}
    placement: left
    title: Gene symbol
    layout: {x: 0, y: 9, w: 1, h: 3}

tabs:
- title: Expression overview
  subtitle: Where the libraries sit relative to each other, computed from the merged Salmon TPMs
  tab_order: 1
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  workflow_system: nf-core
  filter_sections:
  - name: Library scope
    icon: mdi:tune
    color: cyan
    description: Narrow to the libraries inside a depth or expression band
    collapsed: true
  grid_sections:
  - name: Libraries at a glance
    icon: mdi:counter
    color: cyan
    description: How deep each library sequenced the transcriptome
  - name: Sample relationships
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Which libraries look alike, on the TPM matrix and on the pipeline's own DESeq2 distances
  - name: Library composition
    icon: mdi:chart-donut
    color: teal
    description: What kind of RNA each library is made of, and how many genes it reaches
  - name: Library QC profile
    icon: mdi:chart-timeline-variant
    color: orange
    description: Every MultiQC headline metric of a library on one line, so the odd library out shows as a line that bends away
  components:
  - component_type: text
    tag: rna-ovw-intro
    section: Libraries at a glance
    workflow_tag: rnaseq
    data_collection_tag: sample_overview
    title: One row per library
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Every tile on this tab is computed from the merged gene-level TPM matrix.
      A library that detects far fewer genes than its peers, or whose median TPM
      is far higher, is one whose reads concentrated on too little of the
      transcriptome.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: rna-ovw-card-libraries
    section: Libraries at a glance
    workflow_tag: rnaseq
    data_collection_tag: sample_overview
    use: salmon/sample_pca
    aggregation: nunique
    column_name: sample_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: group
    top_n_count: 4
    display: {icon_name: 'mdi:flask', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title: Libraries
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: rna-ovw-card-median-tpm
    section: Libraries at a glance
    workflow_tag: rnaseq
    data_collection_tag: sample_overview
    use: salmon/sample_pca
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: median_tpm
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title: Median TPM
    title_size: sm
    title_align: left
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: rna-ovw-card-expressed
    section: Libraries at a glance
    workflow_tag: rnaseq
    data_collection_tag: sample_overview
    use: salmon/sample_pca
    aggregation: average
    column_name: genes_expressed
    column_type: int64
    secondary_layout: threshold
    threshold_value: 10000
    threshold_direction: min
    threshold_warn: 8000
    display: {icon_name: 'mdi:shield-check-outline', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title: Genes expressed
    description: Genes at 1 TPM or more. A bulk human library below 10000 is usually under-sequenced or degraded.
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: rna-ovw-card-detected
    section: Libraries at a glance
    workflow_tag: rnaseq
    data_collection_tag: sample_overview
    use: salmon/sample_pca
    aggregation: average
    column_name: genes_detected
    column_type: int64
    secondary_layout: gauge
    coverage_max: 30000
    display: {icon_name: 'mdi:gauge', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title: Genes detected
    description: Genes with any signal at all, against a 30000 reference for a protein-coding-heavy annotation.
    title_size: sm
    title_align: left
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: text
    tag: rna-ovw-pca-intro
    section: Sample relationships
    workflow_tag: rnaseq
    data_collection_tag: sample_overview
    title: Replicates should sit together
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Two PCAs of the same eight libraries, side by side. The left one is
      computed here from the log2(TPM + 1) matrix over its most variable
      genes and is coloured by condition; the right one is the pipeline's
      own DESeq2 QC PCA, read from the file
      [deseq2_qc.r](https://github.com/nf-core/rnaseq) writes, so it carries
      the same points the MultiQC report draws. Replicates that sit together
      in one and apart in the other are worth a look. Selecting points, or
      rows in the table at the foot, narrows the heatmap and the gene
      explorer to those libraries.
    layout: {x: 0, y: 0, w: 8, h: 3}
  - component_type: advanced_viz
    tag: rna-ovw-pca
    index: rna-ovw-pca-embedding
    section: Sample relationships
    workflow_tag: rnaseq
    data_collection_tag: sample_overview
    use: salmon/pca
    config:
      color_col: group
      point_size: 12
      show_density: false
      selection_enabled: true
      controls_placement: header
    title: Sample PCA on Salmon TPMs
    description: One point per library. Points far from their replicate are the ones to check on the QC tab.
    title_size: h3
    layout: {x: 0, y: 3, w: 4, h: 7}
  # The pipeline publishes its DESeq2 QC PCA as a text file next to the plot
  # MultiQC embeds. Reading the file instead of the picture is what makes the
  # points selectable and the axes filterable, and the percentages in the
  # subtitle come from the file's own header.
  - component_type: advanced_viz
    tag: rna-ovw-qc-pca
    index: rna-ovw-qc-pca-embedding
    section: Sample relationships
    workflow_tag: rnaseq
    data_collection_tag: deseq2_qc_pca
    use: deseq2/qc_pca_embedding
    config:
      point_size: 12
      show_density: false
      selection_enabled: true
      selection_column: sample_id
      hover_cols: [dim_1_percent, dim_2_percent]
      controls_placement: header
    title: DESeq2 QC PCA (pipeline)
    description: The pipeline's own PCA on the regularised-log counts, read from deseq2.pca.vals.txt rather than recomputed.
    title_size: h3
    layout: {x: 4, y: 3, w: 4, h: 7}
  # Replaces the static MultiQC sample-similarity image: the same square
  # Euclidean distance matrix, clustered in the browser, and narrowed to the
  # selected samples on BOTH axes because `sample` is a real column here.
  - component_type: advanced_viz
    tag: rna-ovw-qc-dists
    index: rna-ovw-qc-dists-heatmap
    section: Sample relationships
    workflow_tag: rnaseq
    data_collection_tag: deseq2_qc_dists
    use: deseq2/qc_distance_heatmap
    config:
      cluster_rows: true
      cluster_cols: true
      cluster_method: average
      cluster_metric: euclidean
      normalize: none
    title: Sample distance matrix
    description: Pairwise Euclidean distances on the regularised-log counts, the matrix the pipeline clusters its QC dendrogram on.
    title_size: h3
    layout: {x: 0, y: 10, w: 8, h: 7}
  - component_type: table
    tag: rna-ovw-table-samples
    section: Sample relationships
    workflow_tag: rnaseq
    data_collection_tag: sample_overview
    use: salmon/sample_pca
    row_selection_enabled: true
    row_selection_column: sample_id
    title: Library summary
    description: Select rows to narrow the heatmap and the gene explorer to those libraries.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 17, w: 8, h: 4}

  - component_type: text
    tag: rna-ovw-composition-intro
    section: Library composition
    workflow_tag: rnaseq
    data_collection_tag: sample_overview
    title: What the reads were spent on
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Three views of the same spend. The biotype panel is featureCounts as
      MultiQC renders it: a library with a large rRNA or non-coding share has
      fewer reads left for the genes anyone wants to measure, which is what
      the bar beside it counts. The strip below reads the RSeQC reports
      directly and splits every library over the annotation, so an intronic
      or intergenic library shows up as a short exonic bar rather than as a
      number to look up.
    layout: {x: 0, y: 0, w: 8, h: 3}
  - component_type: multiqc
    tag: rna-ovw-biotype
    section: Library composition
    workflow_tag: rnaseq
    data_collection_tag: multiqc_data
    selected_module: biotype_counts
    selected_plot: featurecounts_biotype
    title: Biotype composition
    description: Reads overlapping each gene biotype, counted by featureCounts.
    title_size: h3
    layout: {x: 0, y: 3, w: 4, h: 6}
  - component_type: figure
    tag: rna-ovw-fig-expressed
    index: rna-ovw-expressed-bar
    section: Library composition
    workflow_tag: rnaseq
    data_collection_tag: sample_overview
    use: salmon/sample_pca
    visu_type: bar
    dict_kwargs: {x: sample_id, y: genes_expressed, color: group}
    title: Genes expressed per library
    description: Genes at 1 TPM or more, coloured by condition.
    title_size: h3
    layout: {x: 4, y: 3, w: 4, h: 6}
  # RSeQC publishes its upstream and downstream bands nested inside each
  # other; the recipe differences them into disjoint rings and adds the
  # unassigned tags, so this composition sums to one. The rank switch moves
  # between the five region classes and the individual RSeQC features.
  - component_type: advanced_viz
    tag: rna-ovw-rseqc-composition
    index: rna-ovw-rseqc-distribution
    section: Library composition
    workflow_tag: rnaseq
    data_collection_tag: rseqc_read_distribution
    use: rseqc/distribution_composition
    config:
      default_rank: Region class
      normalise_to_one: true
      sample_sort: input
      sort_by: abundance
      top_n: 12
      controls_placement: header
    title: Where the reads landed on the annotation
    description: Share of each library's tags per annotation feature, from the RSeQC read_distribution reports.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 6}

  - component_type: text
    tag: rna-ovw-qcprofile-intro
    section: Library QC profile
    workflow_tag: rnaseq
    data_collection_tag: general_stats
    title: The odd library out, across every metric at once
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One line per library across eleven MultiQC general statistics, from
      read depth through trimming, mapping, duplication and coverage bias,
      coloured by condition. A library that is unremarkable on every single
      metric can still bend away from its replicates on several at once. Drag
      along an axis to keep the libraries inside that range; the unique
      mapping slider on the left shows the distribution you are cutting.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: rna-ovw-qcprofile
    index: rna-ovw-qcprofile-parcoords
    section: Library QC profile
    workflow_tag: rnaseq
    data_collection_tag: general_stats
    viz_kind: parallel_coordinates
    config:
      viz_kind: parallel_coordinates
      sample_col: sample
      group_col: condition
      scale: minmax
      metric_cols:
        - total_reads_m
        - pct_trimmed
        - pct_gc
        - pct_uniquely_mapped
        - pct_salmon_mapped
        - pct_duplication
        - dupradar_intercept
        - pct_exonic
        - bias_5_3
        - error_rate
        - insert_size
      controls_placement: header
    title: Per-library QC profile
    description: Eleven MultiQC general statistics per library, each axis rescaled to its own range while the ticks keep the original units. Brushing an axis filters the libraries.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 8}

  - component_type: interactive
    tag: rna-ovw-filter-group
    index: rna-ovw-group-filter
    section: Library scope
    group: Depth
    workflow_tag: rnaseq
    data_collection_tag: sample_overview
    interactive_component_type: MultiSelect
    column_name: group
    column_type: object
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Condition
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: rna-ovw-filter-expressed
    index: rna-ovw-expressed-range
    section: Library scope
    group: Depth
    workflow_tag: rnaseq
    data_collection_tag: sample_overview
    interactive_component_type: RangeSlider
    column_name: genes_expressed
