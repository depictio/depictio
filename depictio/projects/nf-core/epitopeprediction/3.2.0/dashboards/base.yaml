      icon_name: mdi:check-decagram-outline
      icon_color: green
      caption: binder calls, by tool
    section: Tools at a glance
    tag: ep-prd-card-binders
    index: prd-card-binders
    title: Binders per tool
    description: Peptides each tool calls a binder of at least one allele, summed over samples; wild types left out.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: epitopeprediction
    data_collection_tag: epitopeprediction_predictor_summary
    aggregation: median
    column_name: binder_rate
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:percent-outline
      icon_color: blue
      caption: median per sample and tool, with its spread
      format: percent
    section: Tools at a glance
    tag: ep-prd-card-rate
    index: prd-card-rate
    title: Binder share
    description: Share of a sample's scored peptides that a tool calls binders, per sample and tool.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: epitopeprediction
    data_collection_tag: epitopeprediction_predictor_summary
    use: epitopeprediction/tool_unsupported
    aggregation: sum
    column_name: unsupported
    column_type: int64
    secondary_layout: composition
    breakdown_col: predictor
    display:
      icon_name: mdi:help-circle-outline
      icon_color: orange
      caption: peptides a tool could not score, by tool
    section: Tools at a glance
    tag: ep-prd-card-unsupported
    index: prd-card-unsupported
    title: Unscored peptides
    description: Peptides a tool could not score for any allele, its length or alleles unsupported.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: epitopeprediction
    data_collection_tag: epitopeprediction_predictor_summary
    aggregation: max
    column_name: alleles
    column_type: int64
    secondary_layout: top_n
    breakdown_col: predictor
    top_n_count: 3
    display:
      icon_name: mdi:shield-account-outline
      icon_color: cyan
      caption: most alleles in one sample, by tool
      format: si
    section: Tools at a glance
    tag: ep-prd-card-alleles
    index: prd-card-alleles
    title: Alleles per tool
    description: The most alleles a tool scored in one sample; tools support different allele sets.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: epitopeprediction
    data_collection_tag: epitopeprediction_predictor_summary
    mode: code
    code_content: |-
      # Share of each sample's scored peptides that a tool calls a binder, one bar per sample and tool.
      colors = depictio_category_colors.get('predictor') or {}
      d = df.with_columns((pl.col('binder_rate') * 100).alias('pct'), pl.format('{} of {}', pl.col('binders'), pl.col('scored')).alias('counts'))
      order = d.group_by('sample').agg(pl.col('pct').max().alias('top')).sort(['top', 'sample'], descending=[True, False])['sample'].to_list()
      fig = px.bar(d.sort(['sample', 'predictor']).to_pandas(), x='pct', y='sample', color='predictor', orientation='h', barmode='group', text='counts', color_discrete_map=colors, category_orders={'sample': order}, labels={'pct': 'Scored peptides called binders (%)', 'sample': '', 'predictor': 'Tool'})
      fig.update_traces(textposition='outside', cliponaxis=False, textfont_size=12)
      fig.add_vline(x=2, line_dash='dash', line_width=1)
      fig.add_annotation(xref='x', yref='paper', x=2, y=1.01, text='2 %: expected by chance at the MHCflurry rank cut-off', showarrow=False, xanchor='left', yanchor='bottom', font=dict(size=11))
      fig.update_xaxes(range=[0, min(max((d['pct'].max() or 0) * 1.22, 6), 118)], ticksuffix='%')
      fig.update_layout(margin=dict(t=40, r=30), legend=dict(orientation='h', x=0, y=-0.12, title_text=''), bargap=0.25, bargroupgap=0.05)
    section: Calls by tool
    tag: ep-prd-fig-rate
    index: prd-rate-bars
    title: Binder share per sample and tool
    description: >-
      How many of a sample's scored peptides does each tool call a binder, and do the tools agree on
      which samples have more? One bar per sample and tool, horizontal so the sample names stay
      readable, with the count of binders out of scored peptides printed at the end. Samples are
      sorted by their highest bar.

      How to read: compare a tool across samples before comparing tools, because the tools use
      different thresholds and can differ several-fold. A bar below the dashed line is no more than
      chance; a bar above it is enrichment only for a sample with few alleles, since every extra
      allele gives a peptide another chance to bind. Open [Predictions](tab:Predictions) to see
      which alleles the binders fall on.

      Lines and annotations: the dashed line is 2 %, the share a percentile rank of 2 or less lets
      through on random peptides for one allele, which is the binder call of MHCflurry, NetMHCpan
      and MixMHCpred. A bar counts a peptide as a binder when it binds any allele of its sample, so
      the share expected by chance rises with the number of alleles. NetMHCIIpan calls binders at a
      rank of 5 or less and MHCnuggets at 500 nM, so the line is not their chance level.

      Source: binder definitions of the pipeline at
      https://nf-co.re/epitopeprediction/3.2.0/docs/output.

      Note: a bar from a handful of peptides jumps to 0 or 100 %, so read the printed count.
    layout: {x: 0, y: 0, w: 8, h: 8}
  - component_type: advanced_viz
    workflow_tag: epitopeprediction
    data_collection_tag: epitopeprediction_predictions
    use: epitopeprediction/affinity_rank_scatter
    config:
      x_title: Predicted IC50 (nM, log scale)
      y_title: Percentile rank (log scale, lower is stronger)
      log_x: true
      log_y: true
      quadrants:
        x: 500
        y: 2
        labels: [Strong IC50 but weak rank, Neither cut-off met, Both cut-offs met, Binder by rank only]
      label_col: sequence
      label_order_col: ic50_nm
      top_n_labels: 8
      density_threshold: 20000
      opacity: 0.85
      marker_size: 12
      marker_outline: true
      legend_pos: bottom
      selection_enabled: true
      selection_column: sequence
    section: Affinity and rank
    tag: ep-prd-av-affinity-rank
    index: prd-affinity-rank
    title: IC50 against percentile rank
    description: >-
      Do a tool's IC50 and its rank tell the same story, and which cut-off makes its binder calls?
      One point per prediction, IC50 across and percentile rank up, both on log axes, coloured by
      tool. A scatter, because both scores are continuous.

      How to read: a well-behaved tool draws a band that rises from bottom-left to top-right,
      because a stronger IC50 gets a lower rank. Points in the bottom-right quadrant are called
      binders by rank although their IC50 is weak, which is how MHCflurry reaches binders above 500
      nM; points in the top-left have a strong IC50 but a weak rank. Select points to narrow the
      other tiles to their peptides.

      Lines and annotations: the vertical dashed line is 500 nM, the IC50 cut-off MHCnuggets applies
      in this pipeline (an affinity score of 0.425 or more). The horizontal one is a rank of 2, the
      cut-off of MHCflurry, NetMHCpan and MixMHCpred; NetMHCIIpan uses 5, which is not drawn. The
      corner texts name the four outcomes, and the eight labelled peptides have the strongest IC50.

      Source: binder definitions of the pipeline at
      https://nf-co.re/epitopeprediction/3.2.0/docs/output.

      Note: MHCnuggets writes its rank as a fraction of the proteome (0 to 1) and not as a
      percentage, so its points sit low on this axis and it is called by IC50 only. A tool that
      gives no IC50 (MixMHCpred) is not drawn. A big cloud switches to a density view, and the
      sparse points in its halo stay drawn.
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: advanced_viz
    workflow_tag: epitopeprediction
    data_collection_tag: epitopeprediction_predictor_agreement
    use: epitopeprediction/agreement_scatter
    config:
      x_title: IC50, first tool of the pair (nM, log scale)
      y_title: IC50, second tool of the pair (nM, log scale)
      log_x: true
      log_y: true
      reference_line: diagonal
      reference_label: both tools agree
      quadrants:
        x: 500
        y: 500
        labels: [Only the first tool binds, Neither binds, Both bind, Only the second tool binds]
      label_col: sequence
      label_order_col: ic50_a_nm
      top_n_labels: 8
      density_threshold: 20000
      opacity: 0.85
      marker_size: 12
      marker_outline: true
      legend_pos: bottom
      selection_enabled: true
      selection_column: sequence
    section: Agreement between tools
    tag: ep-prd-av-agreement
    index: prd-agreement
    title: One tool's IC50 against the other's
    description: >-
      Do two tools agree on which peptides bind? One point per peptide and allele that both tools of
      a pair scored, the first tool's IC50 across (tools are paired in alphabetical order) and the
      second's up, on log axes. The colour is who calls a binder, by each tool's own threshold.

      How to read: points near the diagonal get the same IC50 from both tools, and a cloud off the
      diagonal is a tool that is systematically stronger or weaker than the other. The bottom-left
      corner is both tools binding and the other two corners hold the disputed peptides, the ones to
      check first. Pick a value in the Agreement filter to isolate them, or select points to narrow
      the paired table.

      Lines and annotations: the dashed diagonal is an equal IC50 from both tools. The dashed lines
      at 500 nM are the IC50 cut-off MHCnuggets applies in this pipeline; the other tools call
      binders by rank, so a point's colour can disagree with the side of a line it sits on. The
      eight labelled peptides have the strongest IC50 from the first tool.

      Source: binder definitions of the pipeline at
      https://nf-co.re/epitopeprediction/3.2.0/docs/output.

      Note: a tool that gives no IC50 (MixMHCpred) has no point, and a run with one tool per MHC
