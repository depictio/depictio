    config:
      x_title: IC50, first tool of the pair (nM)
      y_title: IC50, second tool of the pair (nM)
      log_x: true
      log_y: true
      reference_line: diagonal
      density_threshold: 20000
      opacity: 0.6
      marker_size: 5
      legend_pos: bottom
      selection_enabled: true
      selection_column: sequence
    section: Agreement between tools
    tag: ep-prd-av-agreement
    index: prd-agreement
    title: One tool's IC50 against the other's
    description: One point per peptide and allele both tools scored; colour is who calls a binder. On the diagonal, they agree.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: epitopeprediction
    data_collection_tag: epitopeprediction_predictor_summary
