- title: Predictors
  subtitle: How far do the prediction tools agree on the binders?
  tab_group: Neoepitopes
  tab_order: 4
  tab_icon: mdi:compare-horizontal
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Tool filters
    icon: mdi:filter-variant
    color: grape
    description: The agreement pick narrows the paired tiles only; the tool pick does not reach the paired table, which names two tools per row
  grid_sections:
  - name: Tools at a glance
    icon: mdi:counter
    color: grape
    description: Binders, binder share, unscored peptides and IC50, by tool
  - name: Calls by tool
    icon: mdi:chart-bar
    color: grape
    description: Each tool's binder share, sample by sample
  - name: Affinity and rank
    icon: mdi:chart-scatter-plot
    color: grape
    description: The two scores of every prediction, one colour per tool
  - name: Agreement between tools
    icon: mdi:scale-balance
    color: grape
    description: One tool's IC50 against the other's, for peptides both scored
  - name: Tool tables
    icon: mdi:table
    color: gray
    description: Calls per sample and tool, and the paired predictions
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      The tools differ in training data, allele coverage and binder threshold: MHCflurry calls
      by rank, MHCnuggets by an IC50 of 500 nM. Two tools that agree on a peptide make a
      sturdier call than either alone, and a peptide only one calls a binder is worth checking.
