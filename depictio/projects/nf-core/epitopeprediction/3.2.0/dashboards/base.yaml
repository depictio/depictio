    use: epitopeprediction/binder_rate_bar
    visu_type: bar
    dict_kwargs:
      x: sample
      y: binder_rate
      color: predictor
      barmode: group
      labels: {sample: '', binder_rate: Share of scored peptides called binders, predictor: ''}
    section: Calls by tool
    tag: ep-prd-fig-rate
    index: prd-rate-bars
    title: Binder share per sample and tool
    description: One bar per sample and tool. Tools with different thresholds can differ several-fold.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: epitopeprediction
    data_collection_tag: epitopeprediction_predictions
    use: epitopeprediction/affinity_rank_scatter
    config:
      x_title: Predicted IC50 (nM)
      y_title: Percentile rank
      log_x: true
      log_y: true
      reference_line: vertical
      reference_value: 500
      density_threshold: 20000
      opacity: 0.5
      marker_size: 5
      legend_pos: bottom
      selection_enabled: true
      selection_column: sequence
    section: Affinity and rank
    tag: ep-prd-av-affinity-rank
    index: prd-affinity-rank
    title: IC50 against percentile rank
    description: One point per prediction; the line marks 500 nM. MHCnuggets writes its rank as a fraction.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: epitopeprediction
    data_collection_tag: epitopeprediction_predictor_agreement
