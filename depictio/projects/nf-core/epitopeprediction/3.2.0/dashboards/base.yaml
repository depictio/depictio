    body: >
      Each tool scores every peptide against every allele of its sample: an IC50 in nM, lower
      is stronger, and a percentile rank. A peptide is a binder when a tool's own threshold
      calls it one ([binder definition](https://nf-co.re/epitopeprediction/3.2.0/docs/output)).
      Pick an allele or a locus on the left; the dot plot opens on thirty alleles, those whose
      affinity differs most between samples, and draws every allele on demand.
    tag: ep-pred-intro
    index: pred-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Takes the HLA-A*02:01 spelling of the hlatyping template's allele grid; no
