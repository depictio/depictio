    row_selection_column: summary_key
    section: Tool tables
    tag: ep-prd-table-summary
    index: prd-table-summary
    title: Calls per sample and tool
    description: Peptides scored, unsupported and binders, binder share, alleles and median IC50.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: epitopeprediction
    data_collection_tag: epitopeprediction_predictor_agreement
