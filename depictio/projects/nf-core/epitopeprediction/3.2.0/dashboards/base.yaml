  # Code mode: a heat map, not a dot grid. Colour AND the printed figure are the binder share,
  # so a cell reads at a glance; a blank cell is an allele the sample was not scored on.
  - component_type: figure
    workflow_tag: epitopeprediction
    data_collection_tag: epitopeprediction_allele_summary
    mode: code
    code_content: |-
      # Binder share per allele (rows) and sample (columns). A blank cell is an allele the sample was not scored on.
      cap = 30
      d = df.select(['sample', 'allele', 'peptides', 'binders', 'binder_rate'])
      n_alleles = d['allele'].n_unique()
      rank = d.group_by('allele').agg(pl.col('sample').n_unique().alias('n_samples'), pl.col('binder_rate').max().alias('top'))
      # Every sample gets its three most-scored alleles first, so no column is blank; the rest of the rows go to the alleles scored in most samples.
      own = d.sort(['peptides', 'allele'], descending=[True, False]).group_by('sample', maintain_order=True).head(3)['allele'].unique(maintain_order=True).to_list()
      rest = [a for a in rank.sort(['n_samples', 'top', 'allele'], descending=[True, True, False])['allele'].to_list() if a not in own]
      keep = (own + rest)[:cap]
      d = d.filter(pl.col('allele').is_in(keep))
      alleles = sorted(keep)
      mean_rate = d.group_by('sample').agg(pl.col('binder_rate').mean().alias('m')).sort(['m', 'sample'], descending=[True, False])
      samples = mean_rate['sample'].to_list()
      cell = {(r['allele'], r['sample']): r for r in d.to_dicts()}
      z = [[(cell[(a, s)]['binder_rate'] * 100 if (a, s) in cell else None) for s in samples] for a in alleles]
      text = [[('' if (a, s) not in cell else str(round(cell[(a, s)]['binder_rate'] * 100)) + '%') for s in samples] for a in alleles]
      n = [[(cell[(a, s)]['peptides'] if (a, s) in cell else None) for s in samples] for a in alleles]
      b = [[(cell[(a, s)]['binders'] if (a, s) in cell else None) for s in samples] for a in alleles]
      top = max([v for row in z for v in row if v is not None] or [1])
      fig = go.Figure(go.Heatmap(
          z=z, x=samples, y=alleles, text=text, texttemplate='%{text}', textfont=dict(size=10),
          customdata=[[[n[i][j], b[i][j]] for j in range(len(samples))] for i in range(len(alleles))],
          hovertemplate='%{y} in %{x}<br>%{customdata[1]} of %{customdata[0]} peptides bind (%{z:.1f}%)<extra></extra>',
          colorscale='Blues', zmin=0, zmax=max(top, 5), xgap=3, ygap=3, hoverongaps=False,
          colorbar=dict(title=dict(text='Peptides that bind (%)', side='right'), thickness=14),
      ))
      note = '' if n_alleles <= cap else ' (' + str(cap) + ' of ' + str(n_alleles) + ' alleles, each sample\'s best-scored first)'
      fig.update_xaxes(title_text='Sample' + note, side='bottom', type='category')
      fig.update_yaxes(title_text='Allele', autorange='reversed', type='category', tickmode='array', tickvals=alleles, tickfont=dict(size=10))
      fig.update_layout(margin=dict(l=120, t=20, r=20))
    section: Binding by allele
    tag: ep-pred-av-allele-dots
    index: pred-allele-dots
    title: Binder share per allele and sample
    description: >-
      Which alleles does each sample's peptide set bind? Each cell is one allele in one sample: the
      darker it is, the larger the share of that sample's scored peptides that at least one tool
      calls a binder of that allele, printed in the cell (hover for the peptide counts). Samples run
      left to right from the highest mean share.

      How to read: a dark row across many samples is an allele that binds a lot of what is
      presented, and a dark cell in one column is an allele that sample's peptides favour. A column
      that is pale everywhere means few of that sample's peptides bind any of the listed alleles.
      Open [Peptides](tab:Peptides) to see which peptides they are, or pick an allele in the filter
      to narrow the prediction tables.

      Annotations: the colour scale runs from 0 to the highest share drawn (at least 5 %), so it is
      relative to this chart and is not a binder threshold. A blank cell is an allele the sample was
      not scored on. The grid opens on thirty alleles, each sample's three best-scored first and
      then those scored in most samples; the sample axis title says how many alleles are shown, and
      the allele filter draws any other.

      Source: a peptide is a binder by each tool's own threshold, listed at
      https://nf-co.re/epitopeprediction/3.2.0/docs/output.

      Note: a share from very few peptides is noisy, so check the count in the hover.
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: figure
    workflow_tag: epitopeprediction
    data_collection_tag: epitopeprediction_predictions
    mode: code
    code_content: |-
      # Distribution of the predicted IC50 per tool, as a share of each tool's own predictions.
      colors = depictio_category_colors.get('predictor') or {}
      cut = 2.699
      fig = px.histogram(df.to_pandas(), x='log10_ic50', color='predictor', barmode='overlay', opacity=0.65, nbins=60, histnorm='percent', color_discrete_map=colors, labels={'log10_ic50': 'Predicted IC50 (nM)', 'predictor': 'Tool'})
      fig.update_traces(marker_line_width=0)
      fig.add_vrect(x0=0, x1=cut, fillcolor=(depictio_category_colors.get('call') or {}).get('Binder', '#2f9e44'), opacity=0.08, layer='below', line_width=0)
      fig.add_vline(x=cut, line_dash='dash', line_width=1)
      fig.add_annotation(xref='x', yref='paper', x=cut, y=1.01, text='500 nM: the usual binder line', showarrow=False, xanchor='left', yanchor='bottom', font=dict(size=11))
      fig.update_xaxes(tickvals=[0, 1, 2, 3, 4, 5], ticktext=['1', '10', '100', '1 000', '10 000', '100 000'], title_text='Predicted IC50 (nM, log scale; stronger to the left)')
      fig.update_yaxes(title_text="Share of the tool's predictions (%)", ticksuffix='%')
      # A tool that returns almost one value for most peptides makes a tall spike; say where it is and how much it holds.
      pk = df.with_columns(pl.col('log10_ic50').round(1).alias('b')).group_by(['predictor', 'b']).agg(pl.len().alias('n')).sort('n', descending=True).group_by('predictor', maintain_order=True).first()
      tp = df.group_by('predictor').agg(pl.len().alias('t'))
      k = 0
      for r in pk.join(tp, on='predictor').to_dicts():
          sh = 100 * r['n'] / r['t']
          if sh >= 30:
              fig.add_annotation(xref='paper', yref='paper', x=1, y=0.98 - 0.09 * k, text=str(r['predictor']) + ': ' + str(round(sh)) + '% of its predictions sit at about ' + f"{10 ** r['b']:,.0f}" + ' nM', showarrow=False, xanchor='right', yanchor='top', font=dict(size=11))
              k += 1
      fig.update_layout(margin=dict(t=40), legend=dict(orientation='h', x=0, y=-0.25, title_text=''))
    section: Affinity distribution
    tag: ep-pred-fig-ic50
    index: pred-ic50-histogram
    title: Predicted IC50 by tool
    description: >-
      IC50 is the concentration of peptide (in nM) needed to displace half of a reference peptide
      from the MHC molecule: the lower it is, the tighter the predicted binding. Where does each
      tool put its predictions relative to the 500 nM binder line? Each tool is a histogram of its
      own predictions, as a share so a tool with few peptides stays comparable, on a log IC50 axis
      because affinities span several orders of magnitude.

      How to read: most peptides do not bind, so most of a tool's mass is expected right of the
      line, and a tool with most of its mass left of it calls a lot of peptides binders, which is
      worth checking against its threshold. A spike in one bin means the tool returns almost the
      same IC50 for many peptides, so its ranking carries little information there: MHCnuggets
      returns about 5 000 nM for most non-binders, a floor value and not a measurement. Compare the
      tools' calls on [Predictors](tab:Predictors).

      Lines and annotations: the dashed line and the shading to its left mark 500 nM, the binder
      side. It is the IC50 cut-off MHCnuggets applies in this pipeline (an affinity score of 0.425
      or more) and IEDB's guideline for an intermediate-affinity binder. MHCflurry, NetMHCpan and
      MixMHCpred call binders by a percentile rank of 2 or less and NetMHCIIpan by 5 or less, so
      some of their binders sit right of the line; the text at the top right names a tool that holds
      30 % or more of its predictions in one 0.1 log10 bin, a display trigger and not a quality
      threshold.

      Source: binder definitions of the pipeline at
      https://nf-co.re/epitopeprediction/3.2.0/docs/output; IEDB IC50 guideline at
      http://tools.iedb.org/mhci/help/.

      Note: the IC50 is derived from the pipeline's 0 to 1 affinity score, and MixMHCpred gives
      none, so it is absent here.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: figure
    workflow_tag: epitopeprediction
    data_collection_tag: epitopeprediction_predictions
    mode: code
    code_content: |-
      # The predictions at 500 nM or stronger, per sample, on their own 0-based axis (the rest of each sample is non-binding).
      colors = depictio_category_colors.get('affinity_class') or {}
      bands = ['Strong (50 nM or less)', 'Binder (50 to 500 nM)']
      tot = df.group_by('sample').agg(pl.len().cast(pl.Int64).alias('total'))
      hit = df.filter(pl.col('affinity_class').is_in(bands)).group_by(['sample', 'affinity_class']).agg(pl.len().cast(pl.Int64).alias('n'))
      d = tot.join(pl.DataFrame({'affinity_class': bands}), how='cross').join(hit, on=['sample', 'affinity_class'], how='left').with_columns(pl.col('n').fill_null(0).cast(pl.Int64)).with_columns((pl.col('n') / pl.col('total') * 100).alias('pct'))
      sums = d.group_by('sample').agg(pl.col('n').sum().alias('n'), pl.col('pct').sum().alias('pct'), pl.col('total').first().alias('total')).sort(['pct', 'sample'], descending=[True, False])
      order = sums['sample'].to_list()
      fig = px.bar(d.to_pandas(), x='pct', y='sample', color='affinity_class', orientation='h', barmode='stack', color_discrete_map=colors, category_orders={'sample': order, 'affinity_class': bands}, labels={'pct': 'Predictions at 500 nM or stronger (%)', 'sample': '', 'affinity_class': 'IC50 band'})
      for r in sums.to_dicts():
          fig.add_annotation(x=r['pct'], y=r['sample'], text=' ' + str(r['n']) + ' of ' + str(r['total']), showarrow=False, xanchor='left', font=dict(size=11))
      fig.update_xaxes(range=[0, max((sums['pct'].max() or 0) * 1.3, 2)], ticksuffix='%')
      fig.update_layout(margin=dict(t=30, r=30), legend=dict(orientation='h', x=0, y=-0.2, title_text=''))
    section: Affinity distribution
    tag: ep-pred-fig-affinity-class
    index: pred-affinity-class-bars
    title: Predictions at 500 nM or stronger per sample
    description: >-
      Which samples carry the strong predictions? Bars show the share of each sample's predictions
      with an IC50 of 500 nM or less, split into strong (50 nM or less) and binder (50 to 500 nM),
      with the count printed at the end of the bar. The weak and non-binding bands, which hold most
      predictions, are left out so that the minority has its own axis from zero instead of being
      squeezed into the top of a full-height stack.

      How to read: a longer bar means more candidates for follow-up, and a bar made mostly of the
      strong colour holds the tightest predicted binders. An empty bar is a sample with no
      prediction at 500 nM or stronger. Open [Peptides](tab:Peptides) and filter by sample to see
      which peptides they are.

      Annotations: the two bands are IC50 classes, 50 nM and 500 nM, the thresholds IEDB gives for
      high and intermediate affinity (500 nM is also MHCnuggets' binder cut-off in the pipeline).
      The text at the end of each bar is the predictions at 500 nM or stronger out of all
      predictions of the sample.

      Source: IEDB IC50 guideline at http://tools.iedb.org/mhci/help/; binder definitions of the
      pipeline at https://nf-co.re/epitopeprediction/3.2.0/docs/output.

      Note: a prediction is one peptide, allele and tool, so a sample scored on many alleles or by
      several tools has more predictions, and those without an IC50 (MixMHCpred) count in the total
      but never in a bar. Samples with very few predictions give coarse shares, so read the count
      too.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: table
    workflow_tag: epitopeprediction
    data_collection_tag: epitopeprediction_allele_summary
    use: epitopeprediction/allele_summary
    row_selection_enabled: true
    row_selection_column: allele_key
    section: Allele table
    tag: ep-pred-table-alleles
    index: pred-table-alleles
    title: Binding per sample and allele
    description: Peptides scored, binders, binder share and IC50, one row per sample and allele.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: epitopeprediction
    data_collection_tag: epitopeprediction_predictions
    use: epitopeprediction/predictions
    row_selection_enabled: true
    row_selection_column: row_id
    section: Prediction table
    tag: ep-pred-table-predictions
    index: pred-table-predictions
    title: Every prediction
    description: Affinity, IC50, rank and binder call, one row per sample, peptide, allele and tool.
    layout: {x: 0, y: 0, w: 8, h: 6}
