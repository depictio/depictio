      icon_name: mdi:shield-account-outline
      icon_color: blue
      caption: median per binder, with its distribution
      decimals: 0
    section: Peptides at a glance
    tag: ep-pep-card-binding-alleles
    index: pep-card-binding-alleles
    title: Alleles per binder
    description: How many alleles each binder binds; a promiscuous binder is presented more widely.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: epitopeprediction
    data_collection_tag: epitopeprediction_peptides
    aggregation: median
    column_name: best_ic50_nm
    column_type: float64
    secondary_layout: threshold
    threshold_value: 500
    threshold_direction: max
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: orange
      caption: median nM, against the 500 nM binder line
      format: si
    section: Peptides at a glance
    tag: ep-pep-card-best-ic50
    index: pep-card-best-ic50
    title: Best IC50
    description: Median of each peptide's lowest IC50 over its alleles and tools.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Code mode: the bars are counted here on a numeric length axis (a length nobody has is an
  # empty slot, not a gap that closes), each MHC class gets its own panel and count axis (class I
  # outnumbers class II by far), and the usual class windows are shaded. The tool's length window
  # is the run's min/max_peptide_length_classI / _classII, on the Overview (The run).
  - component_type: figure
    workflow_tag: epitopeprediction
    data_collection_tag: epitopeprediction_peptides
    mode: code
    code_content: |-
      # Peptides per length, one panel per MHC class on its own count axis, stacked by call.
      # The figure over each bar is the share of that length's peptides that bind.
      colors = depictio_category_colors.get('call') or {}
      class_colors = depictio_category_colors.get('mhc_class') or {}
      # The shaded window is the textbook groove length of each class (closed groove 8 to 11, open groove 12 to 25), a fixed reference and not read from the run; the panel title says so.
      windows = {'Class I': (8, 11, 'Class I (8 to 11 usual)'), 'Class II': (12, 25, 'Class II (12 to 25 usual)')}
      d = df.with_columns(pl.col('length').cast(pl.Int64)).group_by(['mhc_class', 'length', 'call']).agg(pl.len().cast(pl.Int64).alias('peptides')).sort(['mhc_class', 'length'])
      tot = df.with_columns(pl.col('length').cast(pl.Int64)).group_by(['mhc_class', 'length']).agg(pl.len().cast(pl.Int64).alias('total'), (pl.col('call') == 'Binder').sum().cast(pl.Int64).alias('binders'))
      classes = [c for c in ['Class I', 'Class II'] if c in d['mhc_class'].to_list()]
      orders = {'mhc_class': classes, 'call': ['Binder', 'Non-binder', 'Unsupported']}
      fig = px.bar(d.to_pandas(), x='length', y='peptides', color='call', facet_col='mhc_class', color_discrete_map=colors, category_orders=orders, labels={'length': 'Peptide length (residues)', 'peptides': 'Peptides', 'call': 'Call', 'mhc_class': ''}, facet_col_spacing=0.09)
      fig.update_xaxes(type='linear', dtick=1, tickmode='linear', matches=None, showticklabels=True)
      fig.update_yaxes(matches=None, showticklabels=True)
      for a in fig.layout.annotations:
          a.text = windows.get(a.text.split('=')[-1], (0, 0, a.text))[2]
      for i, c in enumerate(classes):
          lo, hi, title = windows[c]
          rows = tot.filter(pl.col('mhc_class') == c)
          xs = rows['length'].to_list()
          top = max(rows['total'].to_list() or [1])
          fig.add_vrect(x0=lo - 0.5, x1=hi + 0.5, row=1, col=i + 1, fillcolor=class_colors.get(c, '#868e96'), opacity=0.09, layer='below', line_width=0)
          fig.update_xaxes(range=[min(xs) - 0.6, max(xs) + 0.6], row=1, col=i + 1)
          fig.update_yaxes(range=[0, top * 1.18], row=1, col=i + 1)
          for r in rows.to_dicts():
              fig.add_annotation(x=r['length'], y=r['total'], text=('<1%' if 0 < r['binders'] and round(100 * r['binders'] / r['total']) == 0 else str(round(100 * r['binders'] / r['total'])) + '%'), showarrow=False, yshift=9, font=dict(size=11), row=1, col=i + 1)
      fig.add_annotation(xref='paper', yref='paper', x=1, y=-0.27, text='Figure over a bar: share of that length that binds', showarrow=False, xanchor='right', font=dict(size=11))
      fig.update_layout(margin=dict(t=56, b=90), legend=dict(orientation='h', x=0, y=-0.27, title_text=''), bargap=0.15)
    section: Length
    tag: ep-pep-fig-length
    index: pep-length-bars
    title: Peptides by length and call
    description: >-
      Does each MHC class get peptides of the length its groove takes, and which lengths bind? One
      panel per class, each on its own count axis because class I peptides are far more numerous,
      stacked by call (binder, non-binder, unsupported). The lengths shown are the ones in the run:
      peptides cut from variants or proteins take the run's class I and class II length settings
      (Overview, The run), and peptides from a table keep the length they came with, so one outside
      what a tool supports is Unsupported.

      How to read: a good result has class I peptides mostly 8 to 11 residues long and class II
      peptides in the longer window, with the binder share highest at the lengths the groove prefers
      (9 or 10 for class I). Bars outside the shaded window mean the run asked for lengths the class
      does not usually present, and a large Unsupported part means the tools could not score that
      length. Filter by length above to see which peptides sit in a bar.

      Lines and annotations: the shaded band in each panel is the usual groove length of the class,
      8 to 11 residues for class I (closed groove) and 12 to 25 for class II (open groove). It is a
      fixed textbook reference, not read from the run and not a tool limit, and the panel titles
      repeat it. The figure over each bar is the percentage of that length's peptides called binders
      ('<1%' when some bind but fewer than 0.5 %).

      Source: the groove lengths are textbook values (for example Janeway's Immunobiology, antigen
      presentation); the lengths a tool supports are in its own manual.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: epitopeprediction
    data_collection_tag: epitopeprediction_wildtype_pairs
    use: epitopeprediction/wildtype_scatter
    config:
      x_title: Wild-type IC50 (nM, log scale)
      y_title: Mutant IC50 (nM, log scale)
      log_x: true
      log_y: true
      reference_line: diagonal
      reference_label: mutation changes nothing
      quadrants:
        x: 500
        y: 500
        labels: ['Wild type binds, mutant does not', Neither binds, Both bind, 'Mutant binds, wild type does not']
      label_col: sequence
      label_order_col: agretopicity
      top_n_labels: 8
      opacity: 0.85
      marker_size: 12
      marker_outline: true
      legend_pos: bottom
      selection_enabled: true
      selection_column: sequence
    section: Mutant against wild type
    tag: ep-pep-av-wildtype
    index: pep-wildtype-scatter
    title: Mutant against wild-type affinity
    description: >-
      Does the mutation make the peptide bind better than its wild type? One point per mutant
      peptide, allele and tool, wild-type IC50 across and mutant IC50 up, both on log axes, coloured
      by outcome. A scatter, because each pair is one peptide and the question is the change from
      one axis to the other.

      How to read: look at the bottom-right quadrant, where a mutant binds and its wild type does
      not: the classic neoepitope candidate. Points below the diagonal bind better after the
      mutation and points above it worse, and the eight labelled peptides are the ones whose IC50
      drops most (lowest mutant over wild-type IC50). Most pairs are expected top right, since most
      peptides bind neither form; click a point to select its peptide in the other tiles.

      Lines and annotations: the dashed diagonal is an equal IC50 for the mutant and its wild type,
      labelled 'mutation changes nothing'. The dashed lines at 500 nM on each axis cut the plane
      into four outcomes named in the corners; 500 nM is MHCnuggets' binder cut-off in this pipeline
      and IEDB's guideline for an intermediate-affinity binder. The colour is each tool's own call
      on the mutant and on the wild type, which is rank-based for MHCflurry, NetMHCpan and
      MixMHCpred, so it can disagree with the side of a 500 nM line a point sits on.

      Source: binder definitions of the pipeline at
      https://nf-co.re/epitopeprediction/3.2.0/docs/output; IEDB IC50 guideline at
      http://tools.iedb.org/mhci/help/.

      Note: predicted affinity is one step toward a neoepitope, and antigen processing, presentation
      and T-cell recognition are not shown. Indels and frameshifts have no wild type and are not
      drawn.
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: figure
    workflow_tag: epitopeprediction
    data_collection_tag: epitopeprediction_variant_peptides
    use: epitopeprediction/consequence_bar
    visu_type: bar
    dict_kwargs:
      x: consequence
      color: length_class
      barmode: stack
      category_orders:
        length_class: [8-mer, 9-mer, 10-mer, 11-mer, 12-mer, 13-mer, 14-mer, 15-mer, 16-mer, 17-mer, 18-mer, 19-mer, 20-mer, 21-mer, 22-mer, 23-mer, 24-mer, 25-mer]
      labels: {consequence: '', length_class: '', count: Candidate peptides}
    section: Variant peptides
    tag: ep-pep-fig-consequence
    index: pep-consequence-bars
    title: Candidate peptides by consequence
    description: >-
      Which kinds of variant feed the candidate pool, and at what lengths? Each bar counts the
      peptides pVACseq cut from one consequence, stacked by length from the shortest up. Bars,
      because the consequences are a few unordered categories.

      How to read: a bar that dominates means the prediction mostly tests that kind of change. The
      colours show the lengths the run asked for, and a missing length is one the run did not
      request (Overview, The run). Frameshifts and indels get no wild-type pair; the table below
      names each candidate's gene and protein change.

      Note: these are candidates before prediction, so a peptide that no tool could score is still
      counted here.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: epitopeprediction
    data_collection_tag: epitopeprediction_variant_peptides
    use: epitopeprediction/variant_peptides
    row_selection_enabled: true
    row_selection_column: peptide_key
    section: Variant peptides
    tag: ep-pep-table-variant
    index: pep-table-variant
    title: Candidate peptides per variant
    description: Gene, transcript, consequence, protein change and genomic anchor of every candidate peptide.
    layout: {x: 0, y: 4, w: 8, h: 6}
  - component_type: table
    workflow_tag: epitopeprediction
    data_collection_tag: epitopeprediction_peptides
    use: epitopeprediction/peptides
    row_selection_enabled: true
    row_selection_column: peptide_key
    section: Peptide detail
    tag: ep-pep-table-peptides
    index: pep-table-peptides
    title: Predicted peptides
    description: Every peptide with its call, best allele and IC50 and its source. Select a row to open its record.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: epitopeprediction
    data_collection_tag: epitopeprediction_peptides
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: ep-pep-table-peptides
      id_col: peptide_key
      title_col: sequence
      selection_source: table_selection
      sections:
        Peptide: [sequence, sample, peptide_id, length_class, origin, call]
        Binding: [best_allele, best_predictor, best_ic50_nm, best_affinity_class, alleles_scored, binding_alleles, binding_allele_list, predictors]
        Source: [gene, transcript, consequence, HGVSp, genomic_anchor, uniprot, protein_ids, source_records]
        Wild type: [wildtype, wt_best_ic50_nm, agretopicity]
      link_templates:
        uniprot: https://www.uniprot.org/uniprotkb/{value}
    section: Peptide detail
    tag: ep-pep-av-peptide-record
    index: pep-peptide-record
    title: Peptide record
    description: >-
      The record of the peptide selected in the Predicted peptides table: its best prediction, its
      source (gene, transcript, consequence, protein change and a UniProt link) and its wild type.

      How to read: pick a row in the table to fill the card. Binding holds the best allele, tool,
      IC50 and IC50 band of the peptide and how many alleles it binds; a low best IC50 and several
      binding alleles make a stronger candidate. Wild type gives the wild-type peptide's best IC50
      and the agretopicity, the mutant IC50 over the wild-type IC50: below 1, the mutation
      strengthens binding.

      Note: a peptide cut from a protein or taken from a peptide list has no variant, so its gene,
      consequence and wild-type fields stay empty.
    layout: {x: 5, y: 0, w: 3, h: 6}
- title: Predictors
  subtitle: How far do the prediction tools agree on the binders?
  tab_group: Neoepitopes
  tab_order: 4
  tab_icon: mdi:compare-horizontal
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Tool filters
    icon: mdi:filter-variant
    color: grape
    description: The agreement pick narrows the paired tiles only; the tool pick does not reach the paired table, which names two tools per row
  grid_sections:
  - name: Tools at a glance
    icon: mdi:counter
    color: grape
    description: Binders, binder share, unscored peptides and IC50, by tool
  - name: Calls by tool
