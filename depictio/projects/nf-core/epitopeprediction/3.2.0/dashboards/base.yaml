version: 1
# nf-core/epitopeprediction 3.2.0, on the family rules of depictio/projects/nf-core/RULES.md
# (ampliseq/2.18.0 is the reference implementation).
#
# Funnel: the MultiQC report (Data & QC) -> which alleles the peptides bind,
# sample by sample (Predictions) -> the peptides that bind, with their length,
# their source and, for mutants, their wild type (Peptides) -> how far the tools
# behind the calls agree (Predictors). The samplesheet (`samples`) is what every
# filter starts from: its links carry a pick to every collection by sample.
#
# Alleles are normalised to HLA-A*02:01 in every collection, the spelling the
# nf-core/hlatyping template gives its OptiType calls (both go through
# depictio.recipes.lib.epitope_predictions.normalize_allele). The two runs are
# separate projects and a link joins collections of one project only, so the
# hlatyping allele grid cannot drive these filters live; an allele copied from
# it selects the same rows here, and its genotype table writes each sample's
# alleles as this samplesheet's `alleles` column takes them (docs/dashboards.md).
#
# Routes: NO_VARIANT_INPUT (no VCF in the sheet) prunes the variant peptides and
# the mutant / wild-type pairs, NO_WILD_TYPE the pairs only, SINGLE_PREDICTOR
# (one tool per class) the tool agreement. Their tiles go with them: the
# Mutant against wild type and Variant peptides sections of Peptides, the
# Agreement section of Predictors, two findings rows and one highlight.
main_dashboard:
  title: nf-core/epitopeprediction
  subtitle: MHC binding prediction, from variants, proteins or peptides to the binders
  project_tag: epitopeprediction MHC Binding
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family.
  category_colors:
    '{GROUP_COL}': auto
    call:
      Binder: '#2f9e44'
      Non-binder: '#adb5bd'
      Unsupported: '#e8590c'
    affinity_class:
      Strong (50 nM or less): '#2b8a3e'
      Binder (50 to 500 nM): '#74b816'
      Weak (500 to 5000 nM): '#fab005'
      Non-binding (over 5000 nM): '#adb5bd'
      No IC50: '#868e96'
    origin:
      Mutant: '#e8590c'
      Wild type: '#1c7ed6'
      Mutant and wild type: '#ae3ec9'
      Input sequence: '#868e96'
    mhc_class:
      Class I: '#1c7ed6'
      Class II: '#ae3ec9'
    agreement:
      Both binder: '#2f9e44'
      Neither: '#adb5bd'
      '*': auto
    pair_call:
      Mutant binds, wild type does not: '#e8590c'
      Both bind: '#2f9e44'
      Wild type binds, mutant does not: '#1c7ed6'
      Neither binds: '#adb5bd'
    consequence:
      Missense: '#1c7ed6'
      Frameshift: '#e8590c'
      In-frame deletion: '#ae3ec9'
      In-frame insertion: '#0ca678'
    predictor: auto
    hla_locus: auto
    length_class: auto
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. All
  # three are bound to the samplesheet, the source of every sample link.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab, which no route removes.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The samplesheet behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Samples, below).
  - component_type: interactive
    workflow_tag: epitopeprediction
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Key figures
    tag: ep-ov-kf-group
    index: ov-kf-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: epitopeprediction
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: ep-ov-kf-sample
    index: ov-kf-sample
    title: Sample
    layout: {x: 2, y: 0, w: 2, h: 1}
  # The pipeline's wordmark, read from its repository; where it cannot load (no
  # internet), the title is drawn as text.
  - component_type: text
    title: nf-core/epitopeprediction
    logo: https://raw.githubusercontent.com/nf-core/epitopeprediction/master/docs/images/nf-core-epitopeprediction_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/epitopeprediction/master/docs/images/nf-core-epitopeprediction_logo_dark.png
    order: 1
    body: >
      Peptides from variants, proteins or peptide lists scored for binding to each
      sample's MHC alleles: which alleles they bind, which peptides bind and where
      they come from, and how far the prediction tools agree. [Run parameters](params:)
    tag: ep-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  # The study: what was scored and against which alleles, from the samplesheet.
  # Each line cites one collection, so a line goes with its data.
  - component_type: text
    surface: card
    values:
      samples: {dc: samples, column: sample, aggregation: nunique, format: integer}
      top_input: {dc: samples, column: input_type, aggregation: top}
      n_types: {dc: samples, column: input_type, aggregation: nunique, format: integer}
      n_class1: {dc: samples, column: sample, aggregation: nunique, filter_expr: "col('mhc_class') == 'Class I'", format: integer}
      n_class2: {dc: samples, column: sample, aggregation: nunique, filter_expr: "col('mhc_class') == 'Class II'", format: integer}
      alleles: {dc: epitopeprediction_allele_summary, column: allele, aggregation: nunique, format: integer}
      n_tumour: {dc: samples, column: sample, aggregation: nunique, filter_expr: "col('tumor_sample').is_not_null()", format: integer}
    body: |
      ### The study
      - ![](icon:mdi:flask-outline) **Samples** {{samples}}, each one input file and one allele set
      - ![](icon:mdi:file-document-outline) **Inputs** {{n_types}} input types, mostly {{top_input}}
      - ![](icon:mdi:molecule) **MHC class** {{n_class1}} samples on class I, {{n_class2}} on class II
      - ![](icon:mdi:dna) **Alleles** {{alleles}} distinct alleles scored
      - ![](icon:mdi:flask-empty-outline) **Matched tumour** {{n_tumour}} variant samples name their tumour sample
      - ![](icon:mdi:file-table-outline) **Samplesheet** [one row per sample](section:Sample sheet), its path in [the run parameters](params:input)
    tag: ep-ov-study
    index: ov-study
    layout: {x: 0, y: 1, w: 5, h: 4}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash.
  - component_type: text
    surface: card
    body: |
      ### The run
      - ![](icon:mdi:source-branch) **Pipeline** nf-core/epitopeprediction 3.2.0 on Nextflow {{param:Workflow.Nextflow}}
      - ![](icon:mdi:tools) **Tools** {{param:tools}}
      - ![](icon:mdi:ruler) **Class I lengths** {{param:min_peptide_length_classI}} to {{param:max_peptide_length_classI}}
      - ![](icon:mdi:ruler) **Class II lengths** {{param:min_peptide_length_classII}} to {{param:max_peptide_length_classII}}
    tag: ep-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 4}
  # The marks take the family's colour (the header's), not the theme's blue.
  # The Compare step cites the agreement collection, so a single-tool run
  # (SINGLE_PREDICTOR) drops it with its data.
  - component_type: text
    surface: card
    accent: green
    values:
      n_pairs: {dc: epitopeprediction_predictor_agreement, column: pair_key, aggregation: count, format: si}
    body: |
      ### Five steps from inputs to binders
      Each step names its settings and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:dna) **Peptides** Cut from variants with VEP and pVACseq, or from proteins · [Settings](params:vep) · [Peptides](tab:Peptides)
      2. ![](icon:mdi:ruler) **Lengths** Peptides split by the class lengths · [Settings](params:peptide_length) · [Peptides](tab:Peptides)
      3. ![](icon:mdi:target) **Predict** {{param:tools}} score each allele · [Settings](params:tools) · [Predictions](tab:Predictions)
      4. ![](icon:mdi:check-decagram-outline) **Call** Binders by each tool's threshold · [Settings](params:use_ba_rank) · [Predictions](tab:Predictions)
      5. ![](icon:mdi:compare-horizontal) **Compare** {{n_pairs}} peptides scored by two tools · [Settings](params:tools) · [Predictors](tab:Predictors)
      :::
    tag: ep-ov-steps
    index: ov-steps
    layout: {x: 0, y: 5, w: 8, h: 3}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/epitopeprediction cuts peptides from somatic variants, proteins or a peptide list and scores each one against the sample's MHC alleles with one or more prediction tools. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The sample filters in the left panel apply to every tab: narrow the samples once and the whole dashboard follows. A bar above a section narrows that section only.

      Provenance: every setting and tool version on this page is read from the run's own `params.json` and software-versions report, and every number from the files the run wrote.
    tag: ep-ov-about
    index: ov-about
    layout: {x: 0, y: 8, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. All four read collections every route writes.
  - component_type: card
    workflow_tag: epitopeprediction
    data_collection_tag: samples
    aggregation: nunique
    column_name: sample
    column_type: object
    secondary_layout: composition
    breakdown_col: '{GROUP_COL}'
    display:
      icon_name: mdi:flask-outline
      icon_color: orange
      caption: in the samplesheet, by {GROUP_COL_DISPLAY}
      link: tab:MultiQC
    section: Key figures
    tag: ep-ov-kf-samples
    index: ov-kf-samples
    title: Samples
    description: Samples in the samplesheet, each one input file and one allele set. The bar splits them by {GROUP_COL_DISPLAY}.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: epitopeprediction
    data_collection_tag: epitopeprediction_peptides
    use: epitopeprediction/peptide_count
    aggregation: count
    column_name: peptide_key
    column_type: object
    secondary_layout: composition
    breakdown_col: call
    display:
      icon_name: mdi:dna
      icon_color: violet
      caption: per sample, by binder call
      link: tab:Peptides
      format: si
    section: Key figures
    tag: ep-ov-kf-peptides
    index: ov-kf-peptides
    title: Peptides
    description: Peptides scored over the samples in view, one per sample and sequence. The bar splits binders, non-binders and unsupported.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: epitopeprediction
    data_collection_tag: epitopeprediction_predictions
    use: epitopeprediction/allele_count
    aggregation: nunique
    column_name: allele
    column_type: object
    secondary_layout: top_n
    breakdown_col: hla_locus
    top_n_count: 4
    display:
      icon_name: mdi:shield-account-outline
      icon_color: blue
      caption: alleles, ranked by locus
      link: tab:Predictions
    section: Key figures
    tag: ep-ov-kf-alleles
    index: ov-kf-alleles
    title: Alleles
    description: Distinct MHC alleles the peptides were scored against. The bars rank the loci by how many alleles they hold.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: epitopeprediction
    data_collection_tag: epitopeprediction_peptides
    use: epitopeprediction/binder_count
    aggregation: count
    column_name: peptide_key
    column_type: object
    filter_expr: col('binder') == 1
    secondary_layout: composition
    breakdown_col: length_class
    display:
      icon_name: mdi:check-decagram-outline
      icon_color: green
      caption: peptides binding an allele, by length
      link: tab:Peptides
    section: Key figures
    tag: ep-ov-kf-binders
    index: ov-kf-binders
    title: Predicted binders
    description: Peptides at least one tool calls a binder of at least one allele, by the tool's own threshold.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the group, then the allele.
  - component_type: interactive
    workflow_tag: epitopeprediction
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Findings
    tag: ep-ov-findings-group
    index: ov-findings-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: epitopeprediction
    data_collection_tag: epitopeprediction_predictions
    interactive_component_type: MultiSelect
    column_name: allele
    column_type: object
    display:
      icon_name: mdi:shield-account-outline
      custom_color: blue
      strip_label: Allele
    section: Findings
    tag: ep-ov-findings-allele
    index: ov-findings-allele
    title: Allele
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data.
  - component_type: text
    surface: card
    values:
      top_allele: {dc: epitopeprediction_allele_summary, column: allele, aggregation: top, weight: binders}
      top_share: {dc: epitopeprediction_allele_summary, column: allele, aggregation: top_share,
        weight: binders, format: percent}
      bind_share: {dc: epitopeprediction_peptides, column: binder, aggregation: average, format: percent}
      n_bind: {dc: epitopeprediction_peptides, column: peptide_key, aggregation: count, filter_expr: col('binder') == 1, format: integer}
      mt_only: {dc: epitopeprediction_wildtype_pairs, column: sequence, aggregation: nunique, filter_expr: "col('pair_call') == 'Mutant binds, wild type does not'", format: integer}
      agree: {dc: epitopeprediction_predictor_agreement, column: concordant, aggregation: average, format: percent}
    body: |
      - **{{top_allele}}** is called the binder of the most peptides – {{top_share}} of the binder calls [Predictions](tab:Predictions)
      - **{{bind_share}}** of the peptides bind at least one allele – {{n_bind}} predicted binders [Peptides](tab:Peptides)
      - **{{mt_only}}** mutant peptides bind where their wild type does not – the classic neoepitope candidates [Peptides](tab:Peptides)
      - **{{agree}}** of the peptides two tools scored get the same call from both [Predictors](tab:Predictors)
    section: Findings
    tag: ep-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per analysis tab, the Predictors tab twice (the agreement
  # needs two tools, SINGLE_PREDICTOR drops it). The tiles of a row share a
  # stored height.
  - component_type: highlight
    section: Findings
    source_tab: Predictions
    source_component: pred-allele-dots
    caption: One dot per allele and sample; size is the share of the peptides that bind, colour their median affinity.
    tag: ep-ov-hl-alleles
    index: ov-hl-alleles
    layout: {x: 0, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Peptides
    source_component: pep-length-histogram
    caption: Peptides by length, stacked by call; the binders are the green part of each bar.
    hide_legend: true
    tag: ep-ov-hl-length
    index: ov-hl-length
    layout: {x: 4, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Predictors
    source_component: prd-affinity-rank
    caption: One point per prediction, IC50 against percentile rank; colour is the tool.
    hide_legend: true
    tag: ep-ov-hl-affinity
    index: ov-hl-affinity
    layout: {x: 0, y: 6, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Predictors
    source_component: prd-agreement
    caption: One point per peptide and allele two tools scored, one IC50 against the other; colour is who calls a binder.
    hide_legend: true
    tag: ep-ov-hl-agreement
    index: ov-hl-agreement
    layout: {x: 4, y: 6, w: 4, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)

      ### Neoepitopes
      - [Predictions](tab:Predictions)
      - [Peptides](tab:Peptides)
      - [Predictors](tab:Predictors)
    section: How to read this dashboard
    tag: ep-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the group first.
  - component_type: interactive
    workflow_tag: epitopeprediction
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: ep-filter-group
    index: sample-filters-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: epitopeprediction
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: ep-filter-sample
    index: sample-filters-sample
    title: Sample
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: epitopeprediction
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: mhc_class
    column_type: object
    display:
      icon_name: mdi:shield-half-full
      custom_color: indigo
    section: Sample filters
    group: Sample scope
    tag: ep-filter-mhc-class
    index: sample-filters-mhc-class
    title: MHC class
    layout: {x: 0, y: 5, w: 1, h: 2}
  # Row selection feeds the Analysis panel.
  - component_type: table
    workflow_tag: epitopeprediction
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample
    section: Sample sheet
    tag: ep-sample-sheet
    index: sample-sheet
    title: Samplesheet
    description: One row per sample, with its input type, MHC class, alleles and input file.
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
# ============================================================================
# Data & QC
# ============================================================================
- title: MultiQC
  subtitle: How many peptides does each tool call a binder?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  grid_sections:
  - name: Binding predictions
    icon: mdi:chart-box-outline
    color: orange
    description: The general statistics, then binders per sample and tool, and the rank, affinity and length of the binders
  - name: Input variants
    icon: mdi:file-document-outline
    color: gray
    description: bcftools statistics of the VCF inputs, after normalisation
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      epitopeprediction writes its own [MultiQC](https://multiqc.info) sections: binders,
      non-binders and unsupported peptides per sample and tool, then the rank, affinity and
      length of the predictions. Read the counts first, then check the distributions of a
      sample with few binders; the bcftools panels describe the VCF inputs.
    tag: ep-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    workflow_tag: epitopeprediction
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: Binding predictions
    tag: ep-mqc-general-stats
    title: General statistics
    description: One row per VCF input, with its records, SNPs, indels and Ts/Tv.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: epitopeprediction
    data_collection_tag: multiqc_data
    selected_module: peptide_binding_prediction_stats
    selected_plot: peptide_binding_prediction_stats-section
    section: Binding predictions
    tag: ep-mqc-stats
    title: Binding prediction statistics
    description: Binders, non-binders and unsupported peptides per sample and tool, wild types left out.
    layout: {x: 0, y: 4, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: epitopeprediction
    data_collection_tag: multiqc_data
    selected_module: binder_rank_distribution
    selected_plot: binder_rank_distribution-section
    section: Binding predictions
    tag: ep-mqc-rank
    title: Rank distribution
    description: Percentile rank of the predictions per sample; a binder sits at the low end.
    layout: {x: 0, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: epitopeprediction
    data_collection_tag: multiqc_data
    selected_module: binding_affinity_distribution
    selected_plot: binding_affinity_distribution-section
    section: Binding predictions
    tag: ep-mqc-affinity
    title: Binding affinity distribution
    description: Affinity score of the predictions per sample, higher is stronger.
    layout: {x: 4, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: epitopeprediction
    data_collection_tag: multiqc_data
    selected_module: binder_length_distribution
    selected_plot: binder_length_distribution-section
    section: Binding predictions
    tag: ep-mqc-length
    title: Binder length distribution
    description: Lengths of the predicted binders per sample.
    layout: {x: 0, y: 12, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: epitopeprediction
    data_collection_tag: multiqc_data
    use: multiqc/bcftools
    selected_module: bcftools
    selected_plot: Variant Substitution Types
    section: Input variants
    tag: ep-mqc-subtypes
    title: Substitution types
    description: Single-base substitutions of the input variants, by type.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: epitopeprediction
    data_collection_tag: multiqc_data
    use: multiqc/bcftools
    selected_module: bcftools
    selected_plot: Indel Distribution
    section: Input variants
    tag: ep-mqc-indels
    title: Indel length distribution
    description: Lengths of the input insertions and deletions, which make the frameshift peptides.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: epitopeprediction
    data_collection_tag: multiqc_data
    use: multiqc/bcftools
    selected_module: bcftools
    selected_plot: Variant Quality
    section: Input variants
    tag: ep-mqc-quality
    title: Variant quality
    description: Quality of the input variants, by variant class.
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: epitopeprediction
    data_collection_tag: multiqc_data
    use: multiqc/bcftools
    selected_module: bcftools
    selected_plot: Variant depths
    section: Input variants
    tag: ep-mqc-depths
    title: Variant depths
    description: Read depth at the input variants.
    layout: {x: 4, y: 4, w: 4, h: 4}
# ============================================================================
