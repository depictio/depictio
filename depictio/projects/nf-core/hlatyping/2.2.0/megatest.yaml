# Megatest manifest for nf-core/hlatyping 2.2.0 (read by scripts/nfcore_megatest.py).
#
# Which AWS megatest run this template was validated against and the tables-only
# subset of it that the template recipes and MultiQC need. Fetch it with:
#
#   python scripts/nfcore_megatest.py fetch --pipeline hlatyping --version 2.2.0 [--dest DIR]
#   bash download_test_data.sh [DIR]      # same thing, plus the vendored samplesheet
#
# Keys are fnmatch globs relative to run_root (here the prefix root) and are
# mirrored 1:1 below the destination, which becomes the template DATA_ROOT.
#
# ONE RUN, THREE LAUNCHES
# -----------------------
# The prefix holds three launches of the release (pipeline_info/params_*.json,
# execution_trace_*.txt): 2026-02-02 07:08 and 2026-02-16 10:30 both stopped at
# YARA_MAPPER (exit 134 on every sample, then aborted), 2026-02-16 10:48 ran to
# the end (FastQC, yara, OptiType and MultiQC for all five samples). All three
# read the same sheet, so every published output (optitype/, yara/, the FastQC
# files at the root and multiqc/) comes from the last launch:
# `pipeline_info/params_*.json` is taken as the latest, as it should be.
#
# THE SAMPLESHEET MISMATCH
# ------------------------
# params.json names
#   https://raw.githubusercontent.com/nf-core/test-datasets/hlatyping/samplesheets/samplesheet_full.csv
# by URL, not by revision. In February 2026 that file was test-datasets
# 2adcc84 (2025-01-25): seven rows, five samples (SAMPLE_FASTQ, SAMPLE_FASTQ_CAT
# in two parts, SAMPLE_FASTQ_RNA, SAMPLE_FASTQ_RNA_CAT in two parts,
# SAMPLE_BAM), which is exactly what optitype/, yara/ and MultiQC hold. It was
# replaced on 2026-07-10 (710446f) by a three-row sheet (a WES, an RNA and a
# peptide row with a `tsv` column) that 2.2.0's input schema does not even
# accept. The template vendors the 2adcc84 sheet, unchanged, under input/.
#
# The five samples are two individuals typed several ways: a DNA exome
# (FASTQ, the same FASTQ in two parts, and a BAM) and an RNA sample (FASTQ and
# the same FASTQ in two parts). They are a pipeline-function test, not a
# cohort: the genotypes repeat by design.
pipeline: hlatyping
version: "2.2.0"
# s3://nf-core-awsmegatests/hlatyping/results-<results_sha>/ == the 2.2.0 release tag_sha.
results_sha: "3237d20e7e611d8bbf8c37e637202dfe8a23e996"
run_root: ""
multiqc:
  version: "1.32"
  parquet: multiqc/multiqc_data/multiqc.parquet
  reprocess: false
keys:
  - pipeline_info/params_*.json
  - pipeline_info/*software*versions*.yml
  # MultiQC parquet (FastQC and OptiType sections) and the per-read-file FastQC
  # table it was built from, which the Reads tab reads.
  - multiqc/multiqc_data/multiqc.parquet
  - multiqc/multiqc_data/multiqc_fastqc.txt
  # OptiType's call, one row per sample (two per sample with --enumerations 2).
  - optitype/*/*_result.tsv
  #
  # Deliberately NOT fetched:
  #   optitype/*/*_coverage_plot.pdf: OptiType's per-allele coverage figure.
  #   yara/: the reads mapped to the HLA reference (BAM and index); the run
  #     publishes no mapping statistics beside them.
  #   *.fq.gz, *_fastqc.zip, *_fastqc.html, hla_reference_*.fasta.* and
  #     example_pe.bam at the root: reads, FastQC reports and the yara index,
  #     published to the outdir root by this release (the table above holds the
  #     FastQC numbers).
  #   multiqc_report.html, multiqc_plots/: the rendered report.
prefix_keys: []
renames: {}
# Megatest-specific terms that must never appear in the dashboard texts
# (checked by the template lint test).
forbidden_terms:
  - SAMPLE_BAM
  - SAMPLE_FASTQ
  - SAMPLE_FASTQ_CAT
  - SAMPLE_FASTQ_RNA
  - NA11995
  - CRC_81
  - example_pe
  - A*01:01
  - A*31:01
  - A*68:01
  - B*08:01
  - B*57:01
  - B*40:01
  - B*51:01
  - C*06:02
  - C*07:01
  - C*03:04
  - C*15:02
post_fetch_help: |
  === Quick test commands ===

  # The samplesheet is not published by the pipeline: the template reads
  # {dest}/input/samplesheet.csv (download_test_data.sh copies the vendored one
  # there). Pass --var METADATA_FILE=... for another run.

  # 1. Dry run (validates the template against the data, no ingestion)
  depictio-cli ingest --template nf-core/hlatyping/2.2.0 --data-root {dest} --dry-run

  # 2. Full run (needs a reachable server and ~/.depictio/CLI.yaml)
  depictio-cli ingest --template nf-core/hlatyping/2.2.0 --data-root {dest}
