version: 1
# nf-core/hlatyping 2.2.0, on the family rules of depictio/projects/nf-core/RULES.md
# (ampliseq/2.18.0 is the reference implementation).
#
# Funnel: the MultiQC report and the reads behind the typing (Data & QC) ->
# each sample's HLA class I genotype, both haplotypes per locus (Genotypes) ->
# how often each allele occurs across the samples (Alleles) -> how well the
# reads support each genotype (Typing quality). The samplesheet (`samples`) is
# what every filter starts from: its links carry a pick to every collection by
# sample.
#
# Alleles are normalised to HLA-A*02:01, the spelling of the epitopeprediction
# template, so an allele read here is the string its allele filters take. The
# two templates are separate projects, so no link crosses between them; the
# per-sample table gives each genotype as the ;-separated list an
# epitopeprediction samplesheet takes (docs/dashboards.md, "Cross-selection").
#
# No conditional route: every collection is written by every hlatyping 2.2.0
# run that reaches MultiQC.
main_dashboard:
  title: nf-core/hlatyping
  subtitle: HLA class I typing with OptiType, from the reads to the genotypes
  project_tag: hlatyping HLA Typing
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family.
  category_colors:
    '{GROUP_COL}': auto
    zygosity:
      Homozygous: '#e8590c'
      Heterozygous: '#1c7ed6'
      One allele typed: '#adb5bd'
    fastqc_status:
      Pass: '#2f9e44'
      Warn: '#f59f00'
      Fail: '#e03131'
    hla_class:
      Class I: '#1c7ed6'
      Class II: '#ae3ec9'
    locus: auto
    # One colour per allele group (HLA-A*02 and so on), ranked by the reads behind
    # each group's calls. The allele grid draws a group in this colour and shades
    # the alleles inside it lighter or darker; the group bars and the carrier
    # matrix use it as it is. `allele` itself is not declared on purpose: `auto`
    # gives each allele its own unrelated palette slot (eight at most, then none),
    # which would flatten the grid's one-family-per-group reading, and an allele
    # list is only known from the data, so it cannot be pinned by hand.
    allele_group: auto:reads
    read: auto
    input_format: auto
    homozygous_class: auto
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. All
  # three are bound to the samplesheet, the source of every sample link.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab, which no route removes.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The samplesheet behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Samples, below).
  - component_type: interactive
    workflow_tag: hlatyping
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Key figures
    tag: ht-ov-kf-group
    index: ov-kf-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: hlatyping
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: ht-ov-kf-sample
    index: ov-kf-sample
    title: Sample
    layout: {x: 2, y: 0, w: 2, h: 1}
  # The pipeline's wordmark, read from its repository; where it cannot load (no
  # internet), the title is drawn as text.
  - component_type: text
    title: nf-core/hlatyping
    logo: https://raw.githubusercontent.com/nf-core/hlatyping/master/docs/images/nf-core-hlatyping_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/hlatyping/master/docs/images/nf-core-hlatyping_logo_dark.png
    order: 1
    body: >
      Exome, genome or RNA reads typed at the HLA class I loci by OptiType: each sample's
      genotype with both haplotypes, how often each allele occurs, and how well the reads
      support each call. [Run parameters](params:)
    tag: ht-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  # The study: what was typed, from the samplesheet. Each line cites the sample hub,
  # so a line goes with its data.
  - component_type: text
    surface: card
    values:
      samples: {dc: samples, column: sample, aggregation: nunique, format: integer}
      n_dna: {dc: samples, column: sample, aggregation: nunique, filter_expr: "col('seq_type') == 'DNA'", format: integer}
      n_rna: {dc: samples, column: sample, aggregation: nunique, filter_expr: "col('seq_type') == 'RNA'", format: integer}
      n_fastq: {dc: samples, column: sample, aggregation: nunique, filter_expr: "col('input_format') == 'FASTQ'", format: integer}
      n_bam: {dc: samples, column: sample, aggregation: nunique, filter_expr: "col('input_format') == 'BAM'", format: integer}
      n_paired: {dc: samples, column: sample, aggregation: nunique, filter_expr: "col('read_layout') == 'Paired-end'", format: integer}
      n_runs: {dc: samples, column: runs, aggregation: sum, format: integer}
    body: |
      ### The study
      - ![](icon:mdi:flask-outline) **Samples** {{samples}}, each typed at HLA-A, -B and -C
      - ![](icon:mdi:dna) **Sequencing** {{n_dna}} DNA and {{n_rna}} RNA samples
      - ![](icon:mdi:file-document-multiple-outline) **Input** {{n_fastq}} FASTQ and {{n_bam}} BAM samples, {{n_paired}} paired-end
      - ![](icon:mdi:merge) **Runs** {{n_runs}} sheet rows, the runs of a sample merged before typing
      - ![](icon:mdi:file-table-outline) **Samplesheet** [one row per sample](section:Sample sheet), its path in [the run parameters](params:input)
      - ![](icon:mdi:palette-outline) **Zygosity** {{legend:zygosity}}
    tag: ht-ov-study
    index: ov-study
    layout: {x: 0, y: 1, w: 5, h: 4}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash.
  - component_type: text
    surface: card
    values:
      alleles: {dc: optitype_genotypes, column: allele, aggregation: nunique, format: integer}
    body: |
      ### The run
      - ![](icon:mdi:source-branch) **Pipeline** nf-core/hlatyping 2.2.0
      - ![](icon:mdi:dna) **Alleles** {{alleles}} distinct
      - ![](icon:mdi:tools) **Tools** {{param:tools}}
      - ![](icon:mdi:calculator-variant-outline) **Solver** {{param:solver}}
      - ![](icon:mdi:format-list-numbered) **Solutions** {{param:enumerations}} per sample
    tag: ht-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 4}
  # The marks take the family's colour (the header's), not the theme's blue.
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Five steps from reads to genotypes
      Each step names its settings and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:file-document-multiple-outline) **Reads** FASTQ runs merged, a BAM turned back into reads · [Settings](params:input) · [Reads](tab:Reads)
      2. ![](icon:mdi:check-decagram-outline) **QC** FastQC on every read file · [Settings](params:multiqc) · [MultiQC](tab:MultiQC)
      3. ![](icon:mdi:map-marker-path) **Map** yara aligns the reads to the DNA or RNA HLA reference · [Settings](params:genome) · [Reads](tab:Reads)
      4. ![](icon:mdi:dna) **Type** OptiType solves for the alleles that explain the reads · [Settings](params:solver) · [Genotypes](tab:Genotypes)
      5. ![](icon:mdi:scale-balance) **Score** Reads and objective behind each genotype · [Settings](params:enumerations) · [Typing quality](tab:Typing quality)
      :::
    tag: ht-ov-steps
    index: ov-steps
    layout: {x: 0, y: 5, w: 8, h: 3}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/hlatyping maps each sample's reads to the HLA reference with yara and lets OptiType pick the HLA-A, -B and -C alleles that explain them best. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The sample filters in the left panel apply to every tab: narrow the samples once and the whole dashboard follows. A bar above a section narrows that section only.

      Provenance: every setting and tool version on this page is read from the run's own `params.json` and software-versions report, and every number from the files the run wrote.
    tag: ht-ov-about
    index: ov-about
    layout: {x: 0, y: 8, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it.
  - component_type: card
    workflow_tag: hlatyping
    data_collection_tag: samples
    aggregation: nunique
    column_name: sample
    column_type: object
    secondary_layout: composition
    breakdown_col: '{GROUP_COL}'
    display:
      icon_name: mdi:flask-outline
      icon_color: orange
      caption: in the samplesheet, by {GROUP_COL_DISPLAY}
      link: tab:Reads
    section: Key figures
    tag: ht-ov-kf-samples
    index: ov-kf-samples
    title: Samples
    description: Samples in the samplesheet, each typed once. The bar splits them by {GROUP_COL_DISPLAY}.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hlatyping
    data_collection_tag: optitype_genotypes
    use: optitype/allele_count
    aggregation: nunique
    column_name: allele
    column_type: object
    secondary_layout: top_n
    breakdown_col: locus
    top_n_count: 3
    display:
      icon_name: mdi:dna
      icon_color: blue
      caption: alleles, ranked by locus
      link: tab:Alleles
    section: Key figures
    tag: ht-ov-kf-alleles
    index: ov-kf-alleles
    title: Distinct alleles
    description: Distinct two-field alleles over the samples in view. The bars rank the loci by how many they hold.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hlatyping
    data_collection_tag: optitype_genotypes
    use: optitype/homozygous_loci
    aggregation: count
    column_name: call_id
    column_type: object
    filter_expr: (col('zygosity') == 'Homozygous') & (col('haplotype') == 1)
    secondary_layout: composition
    breakdown_col: locus
    display:
      icon_name: mdi:equal-box
      icon_color: grape
      caption: one allele on both haplotypes, by locus
      link: tab:Genotypes
    section: Key figures
    tag: ht-ov-kf-homozygous
    index: ov-kf-homozygous
    title: Homozygous loci
    description: Loci where OptiType calls the same allele on both haplotypes, summed over the samples.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hlatyping
    data_collection_tag: optitype_summary
    use: optitype/typing_reads
    aggregation: median
    column_name: reads
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:counter
      icon_color: teal
      caption: median per sample, with its spread
      link: tab:Typing quality
      format: integer
    section: Key figures
    tag: ht-ov-kf-reads
    index: ov-kf-reads
    title: Median reads
    description: Reads the genotype of a sample explains, the median over the samples in view.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the group, then the allele.
  - component_type: interactive
    workflow_tag: hlatyping
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Findings
    tag: ht-ov-findings-group
    index: ov-findings-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: hlatyping
    data_collection_tag: optitype_genotypes
    interactive_component_type: MultiSelect
    column_name: allele
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: blue
      strip_label: Allele
    section: Findings
    tag: ht-ov-findings-allele
    index: ov-findings-allele
    title: Allele
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection.
  - component_type: text
    surface: card
    values:
      top_allele: {dc: optitype_genotypes, column: allele, aggregation: top}
      top_share: {dc: optitype_genotypes, column: allele, aggregation: top_share, format: percent}
      n_hom: {dc: optitype_genotypes, column: call_id, aggregation: count, filter_expr: "(col('zygosity') == 'Homozygous') & (col('haplotype') == 1)", format: integer}
      reads: {dc: optitype_summary, column: reads, aggregation: median, format: integer}
      hla_share: {dc: read_qc, column: typing_share, aggregation: median, filter_expr: "col('read') != 'Read 2'", format: percent}
    body: |
      - **{{top_allele}}** is the commonest allele – {{top_share}} of all class I allele calls [Alleles](tab:Alleles)
      - **{{n_hom}}** loci are homozygous – one allele on both haplotypes [Genotypes](tab:Genotypes)
      - **{{reads}}** reads support the median genotype – the reads OptiType's solution explains [Typing quality](tab:Typing quality)
      - **{{hla_share}}** of a sample's read pairs are explained by its genotype – the rest map elsewhere or fit no single allele [Reads](tab:Reads)
    section: Findings
    tag: ht-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per tab with a figure. The tiles of a row share a stored
  # height.
  - component_type: highlight
    section: Findings
    source_tab: Genotypes
    source_component: gt-grid
    caption: One row per sample, one column per locus, each cell split into its two haplotypes.
    tag: ht-ov-hl-grid
    index: ov-hl-grid
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Alleles
    source_component: al-frequency
    caption: Each allele's share of the calls at its locus; colour is the locus.
    hide_legend: true
    tag: ht-ov-hl-frequency
    index: ov-hl-frequency
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Typing quality
    source_component: tq-support
    caption: The reads each genotype explains against the reads it needs, the weakest sample first.
    hide_legend: true
    tag: ht-ov-hl-quality
    index: ov-hl-quality
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Reads
    source_component: rd-depth
    caption: Reads per sample and read file, as FastQC counts them.
    hide_legend: true
    tag: ht-ov-hl-reads
    index: ov-hl-reads
    layout: {x: 4, y: 7, w: 4, h: 5}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Reads](tab:Reads)

      ### HLA
      - [Genotypes](tab:Genotypes)
      - [Alleles](tab:Alleles)
      - [Typing quality](tab:Typing quality)
    section: How to read this dashboard
    tag: ht-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the group first.
  - component_type: interactive
    workflow_tag: hlatyping
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: ht-filter-group
    index: sample-filters-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: hlatyping
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: ht-filter-sample
    index: sample-filters-sample
    title: Sample
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: hlatyping
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: input_format
    column_type: object
    display:
      icon_name: mdi:file-document-outline
      custom_color: indigo
    section: Sample filters
    group: Sample scope
    tag: ht-filter-input-format
    index: sample-filters-input-format
    title: Input format
    layout: {x: 0, y: 5, w: 1, h: 2}
  # Row selection feeds the Analysis panel.
  - component_type: table
    workflow_tag: hlatyping
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample
    section: Sample sheet
    tag: ht-sample-sheet
    index: sample-sheet
    title: Samplesheet
    description: One row per sample, with its sequencing type, input format, read layout, runs and files.
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
# ============================================================================
# Data & QC
# ============================================================================
- title: MultiQC
  subtitle: Are the reads clean enough to type?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  grid_sections:
  - name: Read quality
    icon: mdi:chart-box-outline
    color: orange
    description: FastQC per read file, a BAM input read back as FASTQ first
  - name: HLA typing
    icon: mdi:dna
    color: orange
    description: OptiType's allele calls, counted by locus and haplotype
  - name: More FastQC
    icon: mdi:file-document-outline
    color: gray
    description: Per-base N content, overrepresented sequences, adapters and module status
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [MultiQC](https://multiqc.info) gathers FastQC on every read file and OptiType's allele
      calls. FastQC judges GC content against a whole-genome model, so exome, RNA or HLA-enriched
      reads often fail that module without harm; read the counts and the quality first.
    tag: ht-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    workflow_tag: hlatyping
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: Read quality
    tag: ht-mqc-general-stats
    title: General statistics
    description: >-
      Are all samples here, and are the two files of a pair alike? One row per read file and per typed sample, FastQC and OptiType columns side by side: every sample should appear in both, and the two files of a pair should hold similar read counts. A table keeps every number in one place for exact comparison.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: hlatyping
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Counts
    section: Read quality
    tag: ht-mqc-counts
    title: Sequence counts
    description: >-
      Do the files hold enough reads? Unique and duplicate reads per file: the two files of a pair should match, and a small duplicate part is good. Stacked bars show the total and the duplicate share at once.
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: hlatyping
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    section: Read quality
    tag: ht-mqc-quality
    title: Mean quality along the read
    description: >-
      Is base quality high along the whole read? The mean should stay in FastQC's green zone, above about 28, and fall only slowly towards the 3' end; a sharp drop marks a poor tail. One line per file shows each file's shape.
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: hlatyping
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Per Sequence GC Content
    section: Read quality
    tag: ht-mqc-gc
    title: GC content
    description: >-
      Do the reads look like the genome? FastQC compares their GC content with a whole-genome model, so HLA-enriched, exome or RNA reads usually deviate without harm, while a second peak points to contamination. A distribution shows the shape that one number cannot.
    layout: {x: 0, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: hlatyping
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Duplication Levels
    section: Read quality
    tag: ht-mqc-duplication
    title: Duplication levels
    description: >-
      How many reads are copies? Most reads should occur once; a high share at many repeats means few distinct reads, although enriched reads repeat by design. The curve by repeat level shows whether the repeats are a few reads or many.
    layout: {x: 4, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: hlatyping
    data_collection_tag: multiqc_data
    selected_module: optitype
    selected_plot: Summary of alleles
    section: HLA typing
    tag: ht-mqc-optitype
    title: Allele calls by locus
    description: >-
      How many samples carry each allele? Each cell counts the samples at one locus and haplotype, so an allele shared by several samples stands out. Counts rather than frequencies keep every call readable on a handful of samples.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: hlatyping
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Status Checks
    section: More FastQC
    tag: ht-mqc-status
    title: FastQC status checks
    description: >-
      Which FastQC module fails, and for which file? Green is a pass, amber a warning and red a failure; HLA-enriched reads often fail GC content without harm, so weigh the other modules first. A grid of colours finds the odd file at a glance.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: hlatyping
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Adapter Content
    section: More FastQC
    tag: ht-mqc-adapters
    title: Adapter content
    description: >-
      Is adapter sequence left in the reads? The curve should stay near zero along the read, and a rise towards the 3' end means untrimmed adapters. Plotting by position shows where it starts.
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: hlatyping
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Overrepresented sequences by sample
    section: More FastQC
