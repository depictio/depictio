- title: Alleles
  subtitle: How often does each allele occur across the samples?
  tab_group: HLA
  tab_order: 4
  tab_icon: mdi:chart-bar
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Allele filters
    icon: mdi:filter-variant
    color: violet
    description: Narrow by locus or allele group
  grid_sections:
  - name: Alleles at a glance
    icon: mdi:counter
    color: violet
    description: Distinct alleles, the commonest one, the calls and the allele groups
  - name: Allele frequency
    icon: mdi:chart-bar
    color: violet
    description: Each allele's share of the calls at its locus
  - name: Calls per allele
    icon: mdi:chart-bar
    color: violet
    description: How many calls each allele takes, homozygous ones apart
  components:
  - component_type: text
    order: 1
    body: >
      Each sample adds two calls per locus, one per haplotype, so a homozygous locus counts its
      allele twice. An allele's frequency is its share of the calls at its locus, comparable to
      the population tables of the [Allele Frequency Net Database](http://www.allelefrequencies.net).
      On a handful of samples the frequencies are counts in disguise: read them as a census.
    tag: ht-al-intro
    index: al-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: hlatyping
    data_collection_tag: optitype_genotypes
    interactive_component_type: MultiSelect
    column_name: locus
    column_type: object
    display:
      icon_name: mdi:map-marker-outline
      custom_color: cyan
    section: Allele filters
    group: Alleles
    tag: ht-al-filter-locus
    index: al-filter-locus
    title: Locus
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: hlatyping
    data_collection_tag: optitype_genotypes
    interactive_component_type: MultiSelect
    column_name: allele_group
    column_type: object
    display:
      icon_name: mdi:shape-plus-outline
      custom_color: orange
    section: Allele filters
    group: Alleles
    tag: ht-al-filter-group
    index: al-filter-group
    title: Allele group
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: card
    workflow_tag: hlatyping
    data_collection_tag: optitype_genotypes
    use: optitype/allele_count
    aggregation: nunique
    column_name: allele
    column_type: object
    secondary_layout: top_n
    breakdown_col: locus
    top_n_count: 3
    display:
      icon_name: mdi:dna
      icon_color: blue
      caption: alleles, ranked by locus
    section: Alleles at a glance
    tag: ht-al-card-alleles
    index: al-card-alleles
    title: Distinct alleles
    description: Distinct two-field alleles; the bars rank the loci by how many they hold.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hlatyping
    data_collection_tag: optitype_genotypes
    aggregation: mode
    column_name: allele
    column_type: object
    secondary_layout: uniqueness
    display:
      icon_name: mdi:star-outline
      icon_color: yellow
      caption: the commonest; the bar, distinct alleles against repeats
    section: Alleles at a glance
    tag: ht-al-card-top
    index: al-card-top
    title: Commonest allele
    description: The allele called most often over the samples in view, either haplotype.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hlatyping
    data_collection_tag: optitype_genotypes
    use: optitype/allele_calls
    aggregation: count
    column_name: call_id
    column_type: object
    secondary_layout: donut
    breakdown_col: zygosity
    display:
      icon_name: mdi:format-list-numbered
      icon_color: cyan
      caption: calls, by the zygosity of their locus
    section: Alleles at a glance
    tag: ht-al-card-calls
    index: al-card-calls
    title: Allele calls
    description: Two calls per sample and locus; the ring splits those on homozygous loci from the rest.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hlatyping
    data_collection_tag: optitype_genotypes
    aggregation: count
    column_name: call_id
    column_type: object
    secondary_layout: concentration
    breakdown_col: allele_group
    top_n_count: 3
    display:
      icon_name: mdi:shape-plus-outline
      icon_color: orange
      caption: calls; the share of the three largest allele groups
    section: Alleles at a glance
    tag: ht-al-card-groups
    index: al-card-groups
    title: Calls in the top groups
    description: How much of the calls the three commonest allele groups take; high on a population of shared ancestry.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: hlatyping
    data_collection_tag: optitype_genotypes
    mode: code
    code_content: |-
      # Allele frequency within each locus: an allele's calls over the locus's calls.
      colors = depictio_category_colors.get('locus') or {}
      d = df.group_by(['locus', 'allele']).agg(pl.len().alias('calls'))
      d = d.with_columns((100 * pl.col('calls') / pl.col('calls').sum().over('locus')).alias('freq'))
      d = d.sort(['locus', 'freq', 'allele'], descending=[False, True, False])
      fig = px.bar(d.to_pandas(), x='allele', y='freq', color='locus', color_discrete_map=colors, hover_data=['calls'], labels={'allele': '', 'freq': 'Frequency in its locus (%)', 'locus': 'Locus', 'calls': 'Calls'})
      fig.update_layout(margin=dict(t=10), legend_title_text='')
      fig.update_xaxes(categoryorder='array', categoryarray=d['allele'].to_list(), automargin=True)
    section: Allele frequency
    tag: ht-al-fig-frequency
    index: al-frequency
    title: Allele frequency by locus
    description: Each allele's share of the calls at its locus, alleles ordered from commonest within each locus.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: figure
    workflow_tag: hlatyping
    data_collection_tag: optitype_genotypes
    visu_type: histogram
    dict_kwargs:
      x: allele_group
      color: zygosity
      barmode: stack
      labels: {allele_group: '', zygosity: ''}
    section: Calls per allele
    tag: ht-al-fig-groups
    index: al-group-calls
    title: Calls per allele group, by zygosity
    description: Calls of each first-field group, stacked by the zygosity of the locus they sit on.
    layout: {x: 0, y: 0, w: 8, h: 4}
- title: Typing quality
  subtitle: How many reads does each genotype rest on?
  tab_group: HLA
  tab_order: 5
  tab_icon: mdi:scale-balance
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Quality filters
    icon: mdi:filter-variant
    color: grape
    description: Narrow by the reads behind a genotype or its heterozygous loci
  grid_sections:
  - name: Quality at a glance
    icon: mdi:counter
    color: grape
    description: The reads behind the genotypes and the objective per read
  - name: Read support
    icon: mdi:chart-scatter-plot
    color: grape
    description: The reads each genotype explains against the solver's objective
  - name: Per sample
    icon: mdi:chart-bar
    color: grape
    description: The reads each sample's genotype explains
  components:
  - component_type: text
    order: 1
    body: >
      OptiType maximises the reads its alleles explain, less `beta` times the reads for each
      heterozygous locus, so the objective sits under the reads by the zygosity, not by the fit.
      The support of a genotype is its reads: a genotype, or a homozygous call, on few reads is
      the one to confirm, for instance by asking for more solutions (`enumerations`).
    tag: ht-tq-intro
    index: tq-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: hlatyping
    data_collection_tag: optitype_summary
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: reads
    column_type: int64
    display:
      icon_name: mdi:counter
      custom_color: teal
    section: Quality filters
    group: Quality
    tag: ht-tq-filter-reads
    index: tq-filter-reads
    title: Reads explained
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: hlatyping
    data_collection_tag: optitype_summary
    interactive_component_type: RangeSlider
    column_name: heterozygous_loci
    column_type: int64
    display:
      icon_name: mdi:call-split
      custom_color: blue
    section: Quality filters
    group: Quality
    tag: ht-tq-filter-heterozygous
    index: tq-filter-heterozygous
    title: Heterozygous loci
    layout: {x: 0, y: 3, w: 1, h: 2}
  - component_type: card
    workflow_tag: hlatyping
    data_collection_tag: optitype_summary
    use: optitype/typing_reads
    aggregation: median
    column_name: reads
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:counter
      icon_color: teal
      caption: median per sample, with its spread
      format: integer
    section: Quality at a glance
    tag: ht-tq-card-reads
    index: tq-card-reads
    title: Reads explained
    description: Reads the genotype of a sample explains, the median over the samples in view.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hlatyping
    data_collection_tag: optitype_summary
    aggregation: min
    column_name: reads
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:arrow-collapse-down
      icon_color: red
      caption: the least supported sample, then all of them
      format: integer
    section: Quality at a glance
    tag: ht-tq-card-fewest
    index: tq-card-fewest
    title: Fewest reads
    description: The smallest read support of a genotype in view; the histogram spreads every sample's.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hlatyping
    data_collection_tag: optitype_summary
    use: optitype/heterozygous_loci
    aggregation: median
    column_name: heterozygous_loci
    column_type: int64
    secondary_layout: gauge
    coverage_max: 3
    display:
      icon_name: mdi:call-split
      icon_color: blue
      caption: median per sample, of three loci
    section: Quality at a glance
    tag: ht-tq-card-heterozygous
    index: tq-card-heterozygous
    title: Heterozygous loci
    description: Loci with two different alleles; each costs the objective beta times the reads.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hlatyping
    data_collection_tag: optitype_summary
    use: optitype/objective_per_read
    aggregation: median
    column_name: objective_per_read
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:scale-balance
      icon_color: grape
      caption: median, about 1 minus beta per heterozygous locus
      decimals: 4
    section: Quality at a glance
    tag: ht-tq-card-ratio
    index: tq-card-ratio
