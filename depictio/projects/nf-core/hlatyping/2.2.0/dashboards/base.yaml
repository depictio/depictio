  - component_type: table
    workflow_tag: hlatyping
    data_collection_tag: optitype_genotypes
    use: optitype/genotypes
    row_selection_enabled: true
    row_selection_column: call_id
    section: Allele calls
    tag: ht-gt-table-calls
    index: gt-table-calls
    title: Allele calls
    description: One row per sample, locus and haplotype, with the allele group and zygosity.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Alleles
  subtitle: How often does each allele occur across the samples?
  tab_group: HLA
  tab_order: 4
  tab_icon: mdi:chart-bar
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Allele filters
    icon: mdi:filter-variant
    color: violet
    description: Narrow by locus or allele group
  grid_sections:
  - name: Alleles at a glance
    icon: mdi:counter
    color: violet
    description: Distinct alleles, the commonest one, the calls and the allele groups
  - name: Allele frequency
    icon: mdi:chart-bar
    color: violet
    description: Each allele's share of the calls at its locus
  - name: Alleles by sample
    icon: mdi:account-group-outline
    color: violet
    description: Which alleles each sample carries, and how many copies
  - name: Calls per allele
    icon: mdi:chart-bar
    color: violet
    description: How many calls each allele group takes, homozygous ones apart
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      Each sample adds two calls per locus, one per haplotype, so a homozygous locus counts its
      allele twice. An allele's frequency is its share of the calls at its locus, comparable to
      the population tables of the [Allele Frequency Net Database](http://www.allelefrequencies.net).
      On a handful of samples the frequencies are counts in disguise: read them as a census, and
      use the carrier matrix, which follows the sample filters, for the alleles of one sample.
    tag: ht-al-intro
    index: al-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: hlatyping
    data_collection_tag: optitype_genotypes
    interactive_component_type: MultiSelect
    column_name: locus
    column_type: object
    display:
      icon_name: mdi:map-marker-outline
      custom_color: cyan
    section: Allele filters
    group: Alleles
    tag: ht-al-filter-locus
    index: al-filter-locus
    title: Locus
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: hlatyping
    data_collection_tag: optitype_genotypes
    interactive_component_type: MultiSelect
    column_name: allele_group
    column_type: object
    display:
      icon_name: mdi:shape-plus-outline
      custom_color: orange
    section: Allele filters
    group: Alleles
    tag: ht-al-filter-group
    index: al-filter-group
    title: Allele group
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: card
    workflow_tag: hlatyping
    data_collection_tag: optitype_genotypes
    use: optitype/allele_count
    aggregation: nunique
    column_name: allele
    column_type: object
    secondary_layout: top_n
    breakdown_col: locus
    top_n_count: 3
    display:
      icon_name: mdi:dna
      icon_color: blue
      caption: alleles, ranked by locus
    section: Alleles at a glance
    tag: ht-al-card-alleles
    index: al-card-alleles
    title: Distinct alleles
    description: Distinct two-field alleles; the bars rank the loci by how many they hold.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hlatyping
    data_collection_tag: optitype_genotypes
    aggregation: mode
    column_name: allele
    column_type: object
    secondary_layout: uniqueness
    display:
      icon_name: mdi:star-outline
      icon_color: yellow
      caption: the commonest; the bar, distinct alleles against repeats
    section: Alleles at a glance
    tag: ht-al-card-top
    index: al-card-top
    title: Commonest allele
    description: The allele called most often over the samples in view, either haplotype.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hlatyping
    data_collection_tag: optitype_genotypes
    use: optitype/allele_calls
    aggregation: count
    column_name: call_id
    column_type: object
    secondary_layout: donut
    breakdown_col: zygosity
    display:
      icon_name: mdi:format-list-numbered
      icon_color: cyan
      caption: calls, by the zygosity of their locus
    section: Alleles at a glance
    tag: ht-al-card-calls
    index: al-card-calls
    title: Allele calls
    description: Two calls per sample and locus; the ring splits those on homozygous loci from the rest.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hlatyping
    data_collection_tag: optitype_genotypes
    aggregation: count
    column_name: call_id
    column_type: object
    secondary_layout: concentration
    breakdown_col: allele_group
    top_n_count: 3
    display:
      icon_name: mdi:shape-plus-outline
      icon_color: orange
      caption: calls; the share of the three largest allele groups
    section: Alleles at a glance
    tag: ht-al-card-groups
    index: al-card-groups
    title: Calls in the top groups
    description: How much of the calls the three commonest allele groups take; high on a population of shared ancestry.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: hlatyping
    data_collection_tag: optitype_genotypes
    mode: code
    code_content: |-
      # Allele frequency within each locus: an allele's calls over the locus's calls.
      # Coloured by allele group, the colour the genotype grid gives the group.
      colors = depictio_category_colors.get('allele_group') or {}
      d = df.group_by(['locus', 'allele', 'allele_group']).agg(pl.len().alias('calls'))
      d = d.with_columns((100 * pl.col('calls') / pl.col('calls').sum().over('locus')).alias('freq'))
      d = d.sort(['locus', 'freq', 'allele'], descending=[False, True, False])
      d = d.with_columns(pl.format('{}%', pl.col('freq').round(0).cast(pl.Int64)).alias('share'))
      fig = px.bar(d.to_pandas(), x='allele', y='freq', color='allele_group', color_discrete_map=colors, text='share', hover_data=['calls', 'locus'], labels={'allele': '', 'freq': 'Frequency in its locus (%)', 'allele_group': 'Allele group', 'calls': 'Calls', 'locus': 'Locus'})
      fig.update_traces(textposition='outside', cliponaxis=False)
      fig.update_layout(margin=dict(t=10), legend_title_text='')
      fig.update_xaxes(categoryorder='array', categoryarray=d['allele'].to_list(), automargin=True)
    section: Allele frequency
    tag: ht-al-fig-frequency
    index: al-frequency
    title: Allele frequency by locus
    description: >-
      Which alleles are common here? Each bar is an allele's share of the calls at its locus, commonest first within each locus, with its share printed on it (the call count is in the hover) and the colour of its allele group, as in the genotype grid. Bars sorted within a locus make the ranking readable, which the share of a pie would not.

      How to read: a tall bar is an allele that most samples share, and many short bars mean the samples differ at that locus. The shares of one locus add up to 100%, with two calls per sample, so a homozygous locus counts its allele twice. See [Alleles by sample](section:Alleles by sample) for which samples carry an allele.

      Annotations: no reference line is drawn, since there is no cut-off for an allele frequency. The share on each bar is rounded to a whole percent, and the population tables of the Allele Frequency Net Database are the outside reference to compare with.

      Source: http://www.allelefrequencies.net (Gonzalez-Galarza et al. 2020, doi:10.1093/nar/gkz1029).

      Note: on a few samples the shares are counts in disguise, so read them as a census and not as a population frequency.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: hlatyping
    data_collection_tag: optitype_genotypes
    mode: code
    code_content: |-
      # One marker per sample and allele; the marker grows with the copies carried (2 = homozygous).
      colors = depictio_category_colors.get('allele_group') or {}
      d = df.group_by(['sample_id', 'locus', 'allele', 'allele_group']).agg(pl.len().alias('copies'))
      d = d.sort(['locus', 'allele', 'sample_id'])
      samples = sorted(d['sample_id'].unique().to_list())
      fig = px.scatter(d.to_pandas(), x='allele', y='sample_id', facet_col='locus', color='allele_group', color_discrete_map=colors, size='copies', size_max=26, category_orders={'sample_id': samples}, hover_data={'copies': True, 'locus': False}, labels={'allele': '', 'sample_id': '', 'allele_group': 'Allele group', 'copies': 'Copies'})
      fig.update_xaxes(matches=None, categoryorder='category ascending', automargin=True)
      fig.update_yaxes(autorange='reversed')
      fig.update_traces(marker=dict(opacity=0.9, line=dict(width=1, color='#343a40')))
      fig.for_each_annotation(lambda a: a.update(text=a.text.split('=')[-1]))
      fig.update_layout(margin=dict(t=30), legend_title_text='')
    section: Alleles by sample
    tag: ht-al-fig-carriers
    index: al-carriers
    title: Alleles carried by each sample
    description: >-
      Which alleles does each sample carry, and which samples share one? A marker per sample and allele, one panel per locus, coloured by allele group; a large marker is two copies (a homozygous locus). It follows the sample filters, and a grid of markers keeps every sample on its own row, so none overlap.

      How to read: a column with several markers is an allele the samples share, and a column with one marker is carried by that sample alone. A row with a large marker is homozygous at that locus. Narrow the sample filters to compare a few samples, or open [Genotypes](tab:Genotypes) to see both haplotypes of each.

      Annotations: marker size is the number of copies, one or two, also shown in the hover. No reference line is drawn.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: hlatyping
    data_collection_tag: optitype_genotypes
    visu_type: histogram
    dict_kwargs:
      x: allele_group
      color: zygosity
      barmode: stack
      labels: {allele_group: '', zygosity: ''}
    section: Calls per allele
    tag: ht-al-fig-groups
    index: al-group-calls
    title: Calls per allele group, by zygosity
    description: >-
      Are the allele groups mostly homozygous? Calls of each first-field group, stacked by the zygosity of the locus they sit on, in the zygosity colours of the dashboard (orange homozygous, blue heterozygous, grey one allele typed). Bars per group show the size and the split at once.

      How to read: a group with much orange is often homozygous in these samples, and a mostly blue group sits on heterozygous loci. Calls are two per sample and locus, so a homozygous locus adds two calls to its group; the height is calls, not samples. Open [Genotypes](tab:Genotypes) and filter by zygosity to see which loci they are.

      Annotations: no reference line is drawn, since no cut-off applies to a zygosity split.
    layout: {x: 0, y: 0, w: 8, h: 5}
- title: Typing quality
  subtitle: How many reads does each genotype rest on?
  tab_group: HLA
  tab_order: 5
  tab_icon: mdi:scale-balance
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Quality filters
    icon: mdi:filter-variant
    color: grape
    description: Narrow by the reads behind a genotype or its heterozygous loci
  grid_sections:
  - name: Quality at a glance
    icon: mdi:counter
    color: grape
    description: The reads behind the genotypes and the objective per read
  - name: Read support
    icon: mdi:chart-bar
    color: grape
    description: The reads behind each genotype, per distinct allele, the weakest sample first
  - name: Objective
    icon: mdi:scale-balance
    color: grape
    description: What the solver's objective says beyond the zygosity
  components:
  - component_type: text
    order: 1
    body: >
      This tab asks which samples you can trust: the support of a genotype is the reads it
      explains, and a call on few reads is the one to confirm, for instance by asking for more
      solutions (`enumerations`). The objective is those reads less `beta` times the reads for each
      heterozygous locus, so it reads the zygosity, not the fit. OptiType publishes no minimum
      number of reads, so the first chart ranks the samples by reads per distinct allele against the
      cohort median, and only OptiType's own tie between solutions is flagged.
    tag: ht-tq-intro
    index: tq-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: hlatyping
    data_collection_tag: optitype_summary
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: reads
    column_type: int64
    display:
      icon_name: mdi:counter
      custom_color: teal
    section: Quality filters
    group: Quality
    tag: ht-tq-filter-reads
    index: tq-filter-reads
    title: Reads explained
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: hlatyping
    data_collection_tag: optitype_summary
    interactive_component_type: RangeSlider
    column_name: heterozygous_loci
    column_type: int64
    display:
      icon_name: mdi:call-split
      custom_color: blue
    section: Quality filters
    group: Quality
    tag: ht-tq-filter-heterozygous
    index: tq-filter-heterozygous
    title: Heterozygous loci
    layout: {x: 0, y: 3, w: 1, h: 2}
  - component_type: card
    workflow_tag: hlatyping
    data_collection_tag: optitype_summary
    use: optitype/typing_reads
    aggregation: median
    column_name: reads
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:counter
      icon_color: teal
      caption: median per sample, with its spread
      format: integer
    section: Quality at a glance
    tag: ht-tq-card-reads
    index: tq-card-reads
    title: Reads explained
    description: Reads the genotype of a sample explains, the median over the samples in view.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hlatyping
    data_collection_tag: optitype_summary
    aggregation: min
    column_name: reads
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:arrow-collapse-down
      icon_color: red
      caption: the least supported sample, then all of them
      format: integer
    section: Quality at a glance
    tag: ht-tq-card-fewest
    index: tq-card-fewest
    title: Fewest reads
    description: The smallest read support of a genotype in view; the histogram spreads every sample's.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hlatyping
    data_collection_tag: optitype_summary
    use: optitype/heterozygous_loci
    aggregation: median
    column_name: heterozygous_loci
    column_type: int64
    secondary_layout: gauge
    coverage_max: 3
    display:
      icon_name: mdi:call-split
      icon_color: blue
      caption: median per sample, of three loci
    section: Quality at a glance
    tag: ht-tq-card-heterozygous
    index: tq-card-heterozygous
    title: Heterozygous loci
    description: Loci with two different alleles; each costs the objective beta times the reads.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hlatyping
    data_collection_tag: optitype_summary
    use: optitype/objective_per_read
    aggregation: median
    column_name: objective_per_read
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:scale-balance
      icon_color: grape
      caption: median, about 1 minus beta per heterozygous locus
      decimals: 4
    section: Quality at a glance
    tag: ht-tq-card-ratio
    index: tq-card-ratio
    title: Objective per read
    description: The objective over the reads explained; it falls by beta for each heterozygous locus.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: hlatyping
    data_collection_tag: optitype_summary
    mode: code
    visu_type: bar
    selection_enabled: true
    selection_column: sample_id
    code_content: |-
      # Reads the genotype explains per distinct allele, one bar per sample. OptiType publishes no minimum, so no pass mark is drawn: the reference is the cohort's own median, and the one hard flag is OptiType's own tie (a runner-up solution with the same objective), available when --enumerations is above 1. The weakest sample comes first.
      d = df.with_columns((pl.col('reads') / pl.col('distinct_alleles')).alias('per_allele')).sort(['per_allele', 'sample_id'])
      med = d['per_allele'].median() or 0
      d = d.with_columns(pl.struct(['reads', 'distinct_alleles', 'per_allele', 'solutions', 'runner_up_gap']).map_elements(lambda r: f"{r['per_allele']:.0f} per allele ({r['reads']:,} reads / {r['distinct_alleles']} alleles)" + ('' if (r['solutions'] or 1) < 2 else (', TIED with the runner-up' if (r['runner_up_gap'] or 0) == 0 else f", runner-up {r['runner_up_gap']:.1f} behind")), return_dtype=pl.Utf8).alias('note'))
      fig = px.bar(d.to_pandas(), y='sample_id', x='per_allele', orientation='h', text='note', custom_data=['sample_id'], labels={'sample_id': '', 'per_allele': 'Reads the genotype explains, per distinct allele'}, **depictio_group_kwargs)
      if not depictio_group_kwargs:
          fig.update_traces(marker_color='#be4bdb')
      fig.update_traces(textposition='outside', cliponaxis=False)
      fig.add_vline(x=med, line_dash='dot', line_color='#343a40', line_width=2, annotation_text=f'cohort median: {med:.0f} per allele', annotation_position='top', annotation_font_size=11)
      fig.update_yaxes(autorange='reversed', categoryorder='array', categoryarray=d['sample_id'].to_list(), automargin=True)
      fig.update_xaxes(range=[0, 1.7 * max(d['per_allele'].max(), 1)], tickformat=',')
      fig.update_layout(margin=dict(t=30, r=20), legend_title_text='', legend=dict(orientation='h', y=-0.15))
    section: Read support
    tag: ht-tq-fig-support
    index: tq-support
    title: Can each genotype be trusted?
    description: >-
      Which samples rest on the least evidence per allele?

      Each bar is the reads the genotype explains divided by its distinct alleles (a sample
      heterozygous at the three loci has six, one with a homozygous locus five), so a heterozygous and
      a homozygous sample compare fairly. Sorted so the weakest sample comes first.

      How to read: the dotted line is the **median of this cohort**. The **lowest bars** are the ones to look at
      first. A call is flagged as uncertain only when OptiType itself says so, that is a runner-up
      solution with the same objective (a tie), which needs the run to have used --enumerations above 1.

      Note: **OptiType publishes no minimum number of reads**, so no pass mark is drawn here. The reads each genotype explains are listed on [Reads](tab:Reads), and the objective on this tab's second chart.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: hlatyping
    data_collection_tag: optitype_summary
    mode: code
    visu_type: scatter
    selection_enabled: true
    selection_column: sample_id
    code_content: |-
      # Objective per read of each sample against the value its zygosity predicts. OptiType takes beta (0.009 by default) of the reads off for each heterozygous locus, so a dot belongs on the guide for its count of heterozygous loci.
      beta = 0.009
      d = df.with_columns((pl.col('heterozygous_loci').cast(pl.Utf8) + ' heterozygous, ' + pl.col('homozygous_loci').cast(pl.Utf8) + ' homozygous').alias('loci')).sort(['objective_per_read', 'sample_id'], descending=[False, False])
      colors = depictio_category_colors.get('homozygous_class') or {}
      fig = px.scatter(d.to_pandas(), x='objective_per_read', y='sample_id', color='homozygous_class', color_discrete_map=colors, text='loci', custom_data=['sample_id'], category_orders={'sample_id': d['sample_id'].to_list()}, labels={'objective_per_read': 'Objective per read', 'sample_id': '', 'homozygous_class': ''})
      fig.update_traces(marker=dict(size=18, opacity=0.9, line=dict(width=1.5, color='#343a40')), textposition='middle right', cliponaxis=False)
      for k in range(4):
          fig.add_vline(x=1 - beta * k, line_dash='dot', line_color='gray', annotation_text=f'{k} heterozygous', annotation_position='top', annotation_font_size=11)
      fig.update_yaxes(autorange='reversed', categoryorder='array', categoryarray=d['sample_id'].to_list(), automargin=True)
      fig.update_xaxes(range=[1 - beta * 3.8, 1 + beta * 0.4], tickformat='.3f')
      fig.update_layout(margin=dict(t=30, r=30), legend_title_text='', legend=dict(orientation='h', y=-0.15))
    section: Objective
    tag: ht-tq-fig-objective
    index: tq-objective
    title: Objective per read against zygosity
    description: >-
      Does the objective say anything beyond the zygosity? Each dot is a sample, on its own row, placed by its objective per read and coloured by its homozygous loci, with the loci counts printed beside it. OptiType takes beta (0.009 by default) of the reads off for each heterozygous locus, so each dot belongs on the guide for its number of heterozygous loci.

      How to read: a dot on its guide is the normal case, and the objective then follows from the reads and the zygosity alone, which is why the reads are not plotted against it. A dot off its guide means the run used another beta. Click a dot to keep that sample; the reads behind its genotype are on [Reads](tab:Reads) and in the Reads explained card.

      Lines and annotations: the dotted lines are at 1, 0.991, 0.982 and 0.973, the objective per read expected with 0, 1, 2 and 3 heterozygous loci, that is 1 minus 0.009 per heterozygous locus. The 0.009 is OptiType's default beta, a fixed reference in this chart and not read from the run.

      Sources: https://github.com/FRED-2/OptiType (the --beta option); Szolek et al. 2014, doi:10.1093/bioinformatics/btu548.

      Note: the objective reads the zygosity, not the fit, so no pass mark is drawn.
    layout: {x: 0, y: 0, w: 8, h: 6}
