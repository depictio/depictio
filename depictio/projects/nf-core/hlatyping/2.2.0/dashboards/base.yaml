      reads_label: Reads
      resolution: 2
      sample_order: alphabetical
      show_labels: true
      side_bars: [value, reads]
      # Colours: a group wears its category_colors entry, alleles are shades of it;
      # zygosity wears the zygosity entry. Samples can be grouped by the samplesheet
      # column the dashboard groups by (the genotypes carry the sheet's columns).
      color_by: allele_group
      allele_group_col: allele_group
      zygosity_col: zygosity
      group_cols: ['{GROUP_COL}']
      selection_enabled: true
      selection_column: allele
    section: Genotype grid
    tag: ht-gt-av-grid
    index: gt-grid
    title: HLA class I genotypes
    description: >-
      Which alleles does each sample carry? A row per sample, a column per locus, a cell per genotype: the left half is haplotype 1, the
      right half haplotype 2, and a merged cell with a dot is homozygous at the chosen resolution.
      Hue is the allele group, shade the allele inside it (switch to zygosity under Colour by); the
      bars give the OptiType objective and the reads behind each genotype.

      How to read: a good row has all three loci typed and a long reads bar, and under zygosity a grey cell is a locus where only one allele was typed. Samples sharing an allele share its shade in that column. Click an allele to keep the samples that carry it, or a sample name to keep that sample, then open [Typing quality](tab:Typing quality) for the genotypes with the fewest reads.

      Annotations: each cell prints its allele (switch off under Cells), the key lists the alleles of each locus, with their copies and carriers on hover, and the fade option dims cells with few reads. Samples can be ordered by name, objective or the allele at a locus, and grouped by {GROUP_COL_DISPLAY}.

      Note: OptiType publishes no minimum number of reads or objective, so the bars carry no pass mark. The objective reflects the zygosity more than the fit, as explained on [Typing quality](tab:Typing quality).
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: hlatyping
    data_collection_tag: optitype_genotypes
    mode: code
    code_content: |-
      # Calls of each allele group at each locus, in the colour the grid gives the group, the count printed in each segment.
      colors = depictio_category_colors.get('allele_group') or {}
      d = df.group_by(['locus', 'allele_group']).agg(pl.len().alias('calls'))
      d = d.sort(['locus', 'calls', 'allele_group'], descending=[False, True, False])
      fig = px.bar(d.to_pandas(), x='locus', y='calls', color='allele_group', color_discrete_map=colors, text='calls', labels={'locus': '', 'calls': 'Calls (two per sample)', 'allele_group': 'Allele group'})
      fig.update_traces(textposition='inside')
      fig.update_layout(margin=dict(t=10), legend_title_text='', barmode='stack')
      fig.update_xaxes(automargin=True)
    section: Genotype grid
    tag: ht-gt-fig-groups
    index: gt-groups
    title: Allele groups by locus
    description: >-
      Which allele groups does each locus hold? Each bar is a locus and each segment an allele group, in the group colours of the grid, with its calls printed on it. It follows the same filters and picks as the grid, and a stacked bar shows the share of each group and the total at once.

      How to read: a group that fills most of a bar dominates the locus, and many thin segments mean the samples are spread over many groups. Calls are two per sample and locus, so a homozygous locus counts its group twice. Open [Alleles](tab:Alleles) for the frequency of each allele inside its group.

      Note: on a handful of samples the totals are counts in disguise, so read them as a census and not as a population frequency.
    layout: {x: 0, y: 6, w: 8, h: 6}
