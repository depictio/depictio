    collapsed: true
  - name: Read file table
    icon: mdi:table
    color: gray
    description: FastQC numbers and the typing reads, one row per read file
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/) counts the reads of
      every file before yara maps them to the HLA reference; the mapping itself publishes no
      statistics, so the reads behind a typing are OptiType's own count. Look for samples with few
      reads, and for read pairs whose two files differ in size. The share of read pairs a genotype
      uses is usually small, because most reads are not HLA; whether the count is enough is judged
      on the Typing quality tab.
    tag: ht-rd-intro
    index: rd-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: hlatyping
    data_collection_tag: read_qc
