    column_name: read
    column_type: object
    display:
      icon_name: mdi:swap-horizontal
      custom_color: cyan
    section: Read filters
    group: Read files
    tag: ht-rd-filter-read
    index: rd-filter-read
    title: Read
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: hlatyping
    data_collection_tag: read_qc
    interactive_component_type: MultiSelect
    column_name: fastqc_status
    column_type: object
    display:
      icon_name: mdi:check-decagram-outline
      custom_color: orange
    section: Read filters
    group: Read files
    tag: ht-rd-filter-status
    index: rd-filter-status
    title: FastQC status
    layout: {x: 0, y: 2, w: 1, h: 2}
  - component_type: card
    workflow_tag: hlatyping
    data_collection_tag: read_qc
    aggregation: count
    column_name: read_key
    column_type: object
    secondary_layout: donut
    breakdown_col: fastqc_status
    display:
      icon_name: mdi:file-multiple-outline
      icon_color: teal
      caption: read files, by their worst FastQC module
    section: Reads at a glance
    tag: ht-rd-card-files
    index: rd-card-files
    title: Read files
    description: FastQC reports, one per read file; the ring splits them by the worst module's status.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hlatyping
    data_collection_tag: read_qc
    aggregation: median
    column_name: total_sequences
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:counter
      icon_color: blue
      caption: median per read file, with its spread
      format: si
    section: Reads at a glance
    tag: ht-rd-card-reads
    index: rd-card-reads
    title: Reads per file
    description: Reads FastQC counts in a file, the median over the files in view.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hlatyping
    data_collection_tag: read_qc
    aggregation: median
    column_name: typing_share
    column_type: float64
    filter_expr: col('read') != 'Read 2'
    secondary_layout: histogram
    display:
      icon_name: mdi:target
      icon_color: grape
      caption: per sample, its distribution
      format: percent
    section: Reads at a glance
    tag: ht-rd-card-typing-share
    index: rd-card-typing-share
    title: Reads used for typing
    description: Reads OptiType's genotype explains over the sample's read pairs, the median over the samples.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hlatyping
    data_collection_tag: read_qc
    aggregation: max
    column_name: pct_duplicates
    column_type: float64
    secondary_layout: threshold
    threshold_value: 20
    threshold_direction: max
    threshold_warn: 50
    display:
      icon_name: mdi:content-duplicate
      icon_color: orange
      caption: highest, files against FastQC's 20% and 50% lines
      decimals: 1
    section: Reads at a glance
    tag: ht-rd-card-duplicates
    index: rd-card-duplicates
    title: Duplicate reads
    description: The highest duplicate share of a read file, in percent; FastQC warns past 20% and fails past 50%.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: hlatyping
    data_collection_tag: read_qc
    mode: code
    visu_type: bar
    selection_enabled: true
    selection_column: sample
    code_content: |-
      # Reads in each read file as FastQC counts them, one bar per file, the two reads of a pair side by side; the file with the fewest reads comes last.
      colors = depictio_category_colors.get('read') or {}
      d = df.with_columns(pl.col('total_sequences').max().over('sample').alias('largest'))
      d = d.sort(['largest', 'sample', 'read'], descending=[True, False, False])
      fig = px.bar(d.to_pandas(), y='sample', x='total_sequences', color='read', orientation='h', barmode='group', color_discrete_map=colors, text='total_sequences', custom_data=['sample'], labels={'sample': '', 'total_sequences': 'Reads in the file (FastQC)', 'read': 'Read'})
      fig.update_traces(texttemplate='%{x:,}', textposition='outside', cliponaxis=False)
      fig.update_yaxes(autorange='reversed', categoryorder='array', categoryarray=d['sample'].unique(maintain_order=True).to_list(), automargin=True)
      fig.update_xaxes(tickformat=',', rangemode='tozero')
      fig.update_layout(margin=dict(t=10, r=40), legend_title_text='', legend=dict(orientation='h', y=-0.15))
    section: Read depth
    tag: ht-rd-fig-depth
    index: rd-depth
    title: Reads per read file
    description: >-
      How deep is each sample? One bar per read file, the two reads of a pair side by side, the sample with the largest file first and the count printed on each bar. A bar is the plainest way to read a handful of counts.

      How to read: the two files of a pair should be about the same size, and a short bar is a sample with few reads to type from. Click a bar to keep that sample, then open [Typing quality](tab:Typing quality) to see whether its genotype rests on enough reads.

      Note: neither FastQC nor OptiType sets a minimum number of reads, so no pass mark is drawn. The counts are FastQC's, taken before the reads are mapped to the HLA reference.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: hlatyping
    data_collection_tag: read_qc
    mode: code
    visu_type: bar
    selection_enabled: true
    selection_column: sample
    code_content: |-
      # Share of each sample's read pairs that its genotype explains, with the reads behind it printed on the bar; the smallest share comes last.
      grp = depictio_group_by[0] if depictio_group_by else '{GROUP_COL}'
      keys = ['sample', grp] if grp in df.columns else ['sample']
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get('{GROUP_COL}') or {}
      d = df.group_by(keys).agg(pl.col('total_sequences').max().alias('pairs'), pl.col('typing_reads').first().alias('used'))
      d = d.with_columns((100 * pl.col('used') / pl.col('pairs')).alias('share'))
      d = d.with_columns((pl.col('used').map_elements(lambda v: f'{v:,}', return_dtype=pl.Utf8) + ' of ' + pl.col('pairs').map_elements(lambda v: f'{v:,}', return_dtype=pl.Utf8) + ' read pairs').alias('note')).sort('share', descending=True)
      color = grp if grp in d.columns else None
      fig = px.bar(d.to_pandas(), y='sample', x='share', color=color, orientation='h', color_discrete_map=colors, text='note', custom_data=['sample'], labels={'sample': '', 'share': 'Read pairs the genotype explains (%)', grp: ''})
      fig.update_traces(textposition='outside', cliponaxis=False)
      fig.update_yaxes(autorange='reversed', categoryorder='array', categoryarray=d['sample'].to_list(), automargin=True)
      fig.update_xaxes(range=[0, 1.45 * d['share'].max()], ticksuffix='%')
      fig.update_layout(margin=dict(t=10, r=20), legend_title_text='', legend=dict(orientation='h', y=-0.15))
    section: Read depth
    tag: ht-rd-fig-typing-share
    index: rd-typing-share
    title: Share of read pairs used for typing
    description: >-
      How much of each sample's data did the typing use? One bar per sample: the reads its genotype explains over its read pairs, both counts printed on the bar, coloured by {GROUP_COL_DISPLAY}. The sample with the largest share comes first.

      How to read: a small share is usual, because exome and RNA reads are mostly not HLA, so a short bar is not a fault in itself. A bar far shorter than the rest points to a sample with few usable reads, so check its file sizes under [Read depth](section:Read depth). Click a bar to keep that sample, and judge whether its count is enough on [Typing quality](tab:Typing quality).

      Note: no cut-off is drawn, because neither FastQC nor OptiType publishes one for this share. The read pairs are the larger of the sample's two FastQC read counts.
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: figure
    workflow_tag: hlatyping
    data_collection_tag: read_qc
    mode: code
    code_content: |-
      # GC content and duplicate reads of each read file side by side. Dashed guide on the left: the human genome's GC; dotted guides on the right: where FastQC warns (20%) and fails (50%) on duplicates.
      colors = depictio_category_colors.get('read') or {}
      d = df.sort(['sample', 'read'])
      titles = ('GC content (%), dashed line at the human genome average', 'Duplicate reads (%), dotted at FastQC warn, dashed at fail')
      fig = go.Figure().set_subplots(rows=1, cols=2, shared_yaxes=True, horizontal_spacing=0.04, subplot_titles=titles)
      for r in sorted(d['read'].unique().to_list()):
          s = d.filter(pl.col('read') == r)
          c = colors.get(r)
          fig.add_trace(go.Bar(y=s['read_key'].to_list(), x=s['pct_gc'].to_list(), orientation='h', name=r, legendgroup=r, marker_color=c, text=[f'{v:.0f}' for v in s['pct_gc'].to_list()], textposition='outside', cliponaxis=False), row=1, col=1)
          fig.add_trace(go.Bar(y=s['read_key'].to_list(), x=s['pct_duplicates'].to_list(), orientation='h', name=r, legendgroup=r, showlegend=False, marker_color=c, text=[f'{v:.0f}' for v in s['pct_duplicates'].to_list()], textposition='outside', cliponaxis=False), row=1, col=2)
      fig.add_vline(x=41, line_dash='dash', line_color='gray', row=1, col=1)
      fig.add_vline(x=20, line_dash='dot', line_color='gray', row=1, col=2)
      fig.add_vline(x=50, line_dash='dash', line_color='gray', row=1, col=2)
      fig.update_yaxes(autorange='reversed', categoryorder='array', categoryarray=d['read_key'].to_list(), automargin=True)
      fig.update_xaxes(range=[0, 75], row=1, col=1)
      fig.update_xaxes(range=[0, 60], row=1, col=2)
      fig.update_annotations(font_size=12)
      fig.update_layout(margin=dict(t=40, r=20), barmode='group', legend_title_text='', legend=dict(orientation='h', y=-0.12))
    section: Read composition
    tag: ht-rd-fig-composition
    index: rd-composition
    title: GC content and duplicates per read file
    description: >-
      Are the reads typical of an HLA-enriched run? Each read file has one bar in each panel, GC content on the left and duplicate reads on the right, in the same file order and coloured by read of the pair. Two panels let one file be read across both.

      How to read: GC content has no pass mark, because HLA-enriched, exome or RNA reads often differ from the genome average without harm; look for a file that departs from the other file of its pair or from the other samples. For duplicates, a bar short of the dotted line is fine, a bar past it warns and a bar past the dashed line fails, because few distinct reads are left. Enriched reads repeat by design, so a warning alone is not a defect; open [MultiQC](tab:MultiQC) for FastQC's duplication curve.

      Lines and annotations: the dashed line on the left is at 41%, the average GC content of the human genome, a fixed reference and not read from the run. On the right the dotted line is at 20% and the dashed line at 50%, the duplicate shares at which FastQC warns and fails. The number at the end of each bar is its value in percent.

      Sources: Lander et al. 2001, doi:10.1038/35057062 (GC content); https://www.bioinformatics.babraham.ac.uk/projects/fastqc/Help/3%20Analysis%20Modules/8%20Duplicate%20Sequences.html (duplication thresholds).
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: hlatyping
    data_collection_tag: read_qc
    row_selection_enabled: true
    row_selection_column: read_key
    section: Read file table
    tag: ht-rd-table
    index: rd-table
    title: Read files
    description: Reads, GC, duplicates, FastQC status and the typing reads, one row per read file.
    layout: {x: 0, y: 0, w: 8, h: 6}
