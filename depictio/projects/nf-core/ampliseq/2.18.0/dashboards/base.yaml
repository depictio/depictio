    tag: text-multiqc-details-header-a6c1bb
    index: multiqc-details-header
    layout:
      x: 0
      y: 0
      w: 8
      h: 2
    title: The rest of the QC report
    body: 'Ten more MultiQC panels, one per FastQC or Cutadapt module: GC content, adapter contamination, duplication, length distribution, N content and overrepresented sequences. They start collapsed because each only becomes interesting once a panel above has flagged something. A tile inside a collapsed section is also never fetched, so opening this section is what triggers the requests.'
  # No `Per Sequence GC Content` tile. FastQC forces the x domain to 0-100 %GC
  # and emits 101 points per sample, but amplicon reads occupy a narrow GC band,
  # so ~60 of those points sit at y=0 and the panel reads as a flat line running
  # the full width. This run also carries a spike of 0 %GC reads at x=0. Neither
  # the Percentages nor the Counts dataset changes that domain, so the tile is
  # noise at any size. The other ten FastQC panels are all present below.
