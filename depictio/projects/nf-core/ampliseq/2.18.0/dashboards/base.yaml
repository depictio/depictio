      w: 8
      h: 1
    title: Reconstructed composition
    body: Relative composition of the reconstructed table per sample, and the genus-level breakdown of the same features.
  - component_type: figure
    workflow_tag: ampliseq
    data_collection_tag: sidle_reconstructed
    use: sidle/reconstructed
    visu_type: bar
    figure_params:
      color: Phylum
      labels:
        sample: Sample
      title: Relative composition by phylum (per sample)
      x: sample
      y: rel
    mode: code
    code_content: |-
      # Spread into the keys so the annotation survives the aggregation, and read
      # back below as a facet: the colour here is already spoken for by Phylum.
      # Deduplicated: the handed-over column may be one the figure already
      # groups by, and polars refuses a repeated key.
      df_g = df.group_by(list(dict.fromkeys([*depictio_group_by, 'sample', 'Phylum']))).agg(pl.col('count').sum().alias('count'))
      df_g = df_g.with_columns((pl.col('count') / pl.col('count').sum().over('sample') * 100).alias('rel'))
      fig = px.bar(
          df_g.sort(['sample', 'Phylum']).to_pandas(),
          x='sample', y='rel', color='Phylum',
          facet_col=depictio_group_by[0] if depictio_group_by else None,
          title='Relative composition by phylum (per sample)',
          labels={'sample': 'Sample', 'rel': 'Relative abundance (%)', 'Phylum': 'Phylum'},
      )
      fig.update_layout(barmode='stack', yaxis_range=[0, 100])
      fig.update_xaxes(tickangle=-45)
    selection_enabled: false
    title_size: sm
    title_align: left
    section: Composition
    tag: figure-bar_sidle_rel_composition-9a1c45
    description: Per-sample phylum makeup normalised to 100%, to compare community structure across samples.
    layout:
      x: 0
      y: 1
      w: 4
      h: 6
  - component_type: figure
    workflow_tag: ampliseq
    data_collection_tag: sidle_reconstructed
    use: sidle/reconstructed
    visu_type: bar
    figure_params:
      color: Genus
      labels:
        sample: Sample
      title: Genus-level composition (per sample)
      x: sample
      y: count
    mode: code
    code_content: |-
      # Top 15 genera by total reconstructed count, the rest folded into Other:
      # a real run carries hundreds, which no legend can hold.
      top = df.group_by('Genus').agg(pl.col('count').sum().alias('n')).sort('n', descending=True).head(15)['Genus'].to_list()
      df = df.with_columns(pl.when(pl.col('Genus').is_in(top)).then(pl.col('Genus')).otherwise(pl.lit('Other')).alias('Genus'))
      df_g = df.group_by(list(dict.fromkeys([*depictio_group_by, 'sample', 'Genus']))).agg(pl.col('count').sum().alias('count')).sort(['sample', 'Genus'])
      fig = px.bar(
          df_g.to_pandas(),
          x='sample', y='count', color='Genus',
          facet_col=depictio_group_by[0] if depictio_group_by else None,
          title='Genus-level composition (per sample)',
          labels={'sample': 'Sample', 'count': 'Reconstructed count', 'Genus': 'Genus'},
      )
      fig.update_layout(barmode='stack')
      fig.update_xaxes(tickangle=-45)
    selection_enabled: false
    title_size: sm
    title_align: left
    section: Composition
    tag: figure-bar_sidle_genus-9a1c55
    description: Genus-level counts per sample for the 15 most abundant genera, the rest grouped as Other (Unclassified where the lineage stops short).
    layout:
      x: 4
      y: 1
      w: 4
      h: 6
