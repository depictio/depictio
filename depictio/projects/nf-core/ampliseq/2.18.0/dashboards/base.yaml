      w: 8
      h: 1
    title: Reconstruction quality
    body: 'How much evidence the reconstruction rests on: per-feature confidence, and the number of k-mers that mapped. A feature built from few k-mers across few regions is the one to treat with caution.'
  - component_type: figure
    workflow_tag: ampliseq
    data_collection_tag: sidle_reconstruction_qc
    use: sidle/reconstruction_qc
    visu_type: bar
    figure_params:
      labels:
        num_regions: '# regions mapped'
      title: Cross-region support (features by regions mapped)
      x: num_regions
      y: features
    mode: code
    code_content: |-
      df_g = df.group_by(list(dict.fromkeys([*depictio_group_by, 'num_regions']))).agg(pl.len().alias('features')).sort('num_regions')
      fig = px.bar(
          df_g.to_pandas(),
          x='num_regions', y='features', text='features',
          facet_col=depictio_group_by[0] if depictio_group_by else None,
          title='Cross-region support (features by regions mapped)',
          labels={'num_regions': '# regions mapped', 'features': 'Reconstructed features'},
      )
      fig.update_xaxes(dtick=1)
      fig.update_traces(textposition='outside')
    selection_enabled: false
    title_size: sm
    title_align: left
    section: Reconstruction QC
    tag: figure-bar_sidle_confidence-9a1c54
    description: How many of the amplified regions each feature was reconstructed from, the core SIDLE confidence signal.
    layout:
      x: 0
      y: 1
      w: 4
      h: 6
  - component_type: figure
    workflow_tag: ampliseq
    data_collection_tag: sidle_reconstruction_qc
