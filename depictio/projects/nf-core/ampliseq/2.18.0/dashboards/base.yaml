# Multiregion runs only: template.yaml prunes the sidle_* DCs elsewhere, and the
# tab goes with them.
- title: SIDLE
  subtitle: What does the community rebuilt across amplicon regions contain?
  tab_group: Taxa
  tab_order: 7
  tab_icon: mdi:graph-outline
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 646b0f3c1e4a2d7f8e5b8cc5
  filter_sections:
  - name: SIDLE filters
    icon: mdi:filter-variant
    color: indigo
    description: One phylum slice of the reconstructed community
  grid_sections:
  - name: Reconstruction at a glance
    icon: mdi:counter
    color: indigo
    card_variant: compact
    description: What SIDLE rebuilt from the per-region tables
  - name: Composition
    icon: mdi:chart-bar
    color: indigo
    description: The reconstructed community of each sample
  - name: Reconstruction QC
    icon: mdi:check-decagram
    color: indigo
    description: How much evidence each reconstructed feature rests on
  - name: Tables
    icon: mdi:table
    color: gray
    description: The reconstructed table and its per-feature metrics
    collapsed: true
  components:
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: sidle_reconstructed
    interactive_component_type: MultiSelect
    column_name: Phylum
    column_type: object
    display:
      icon_name: mdi:bacteria-outline
    section: SIDLE filters
    tag: am-sidle-filter-phylum
    index: sidle-phylum-filter
    title: Phylum
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: sidle_reconstructed
    use: sidle/reconstructed
    aggregation: nunique
    column_name: feature_id
    column_type: object
    display:
      icon_name: mdi:dna
    section: Reconstruction at a glance
    tag: am-sidle-card-features
    index: sidle-card-features
    title: Features
    description: Features SIDLE reconstructed from the regions.
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: sidle_reconstructed
    use: sidle/reconstructed
    aggregation: nunique
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
    section: Reconstruction at a glance
    tag: am-sidle-card-samples
    index: sidle-card-samples
    title: Samples
    description: Samples carrying at least one reconstructed feature.
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: sidle_reconstructed
    use: sidle/reconstructed
    aggregation: nunique
    column_name: Phylum
    column_type: object
    secondary_layout: composition
    breakdown_col: Kingdom
    display:
      icon_name: mdi:bacteria-outline
    section: Reconstruction at a glance
    tag: am-sidle-card-phyla
    index: sidle-card-phyla
    title: Phyla
    description: Distinct phyla the reconstructed features resolve to, split by kingdom.
    layout: {x: 4, y: 0, w: 2, h: 1}
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: sidle_reconstruction_qc
    use: sidle/reconstruction_qc
    aggregation: average
    column_name: num_regions
    column_type: int64
    display:
      icon_name: mdi:vector-link
      decimals: 1
    section: Reconstruction at a glance
    tag: am-sidle-card-regions
    index: sidle-card-mean-regions
    title: Regions per feature
    description: Mean number of amplicon regions a feature was rebuilt from.
    layout: {x: 6, y: 0, w: 2, h: 1}
  # The SIDLE figures colour by phylum or genus, so they spread no group
  # kwargs: they keep the group column through the aggregation and facet by it.
  - component_type: figure
    workflow_tag: ampliseq
    data_collection_tag: sidle_reconstructed
    use: sidle/reconstructed
    visu_type: bar
    mode: code
    code_content: |-
      # Each sample's reconstructed community by phylum, as shares of its reads.
      # Grouped by Analysis mode's groups too, so they can facet the bars.
      d = df.group_by([*depictio_group_by, 'sample', 'Phylum']).agg(pl.col('count').sum().alias('count'))
      d = d.with_columns((pl.col('count') / pl.col('count').sum().over('sample') * 100).alias('share')).sort(['sample', 'Phylum'])
      fig = px.bar(d.to_pandas(), x='sample', y='share', color='Phylum', facet_col=depictio_group_by[0] if depictio_group_by else None, color_discrete_map=depictio_category_colors.get('Phylum') or {}, labels={'sample': '', 'share': 'Share of reads (%)'})
      fig.update_layout(barmode='stack', yaxis_range=[0, 100])
      fig.update_xaxes(tickangle=-45)
    section: Composition
    tag: am-sidle-composition
    index: sidle-composition
    title: Phylum composition per sample
    description: Each sample's reconstructed community by phylum, as shares of its reads.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: ampliseq
    data_collection_tag: sidle_reconstructed
    use: sidle/reconstructed
    visu_type: bar
    mode: code
    code_content: |-
      # The 15 most abundant genera by reconstructed count, the rest folded into
      # Other: a real run carries hundreds, which no legend can hold.
      top = df.group_by('Genus').agg(pl.col('count').sum().alias('n')).sort('n', descending=True).head(15)['Genus'].to_list()
      d = df.with_columns(pl.when(pl.col('Genus').is_in(top)).then(pl.col('Genus')).otherwise(pl.lit('Other')).alias('Genus'))
      d = d.group_by([*depictio_group_by, 'sample', 'Genus']).agg(pl.col('count').sum().alias('count')).sort(['sample', 'Genus'])
      fig = px.bar(d.to_pandas(), x='sample', y='count', color='Genus', facet_col=depictio_group_by[0] if depictio_group_by else None, labels={'sample': '', 'count': 'Reconstructed count'})
      fig.update_layout(barmode='stack')
      fig.update_xaxes(tickangle=-45)
    section: Composition
    tag: am-sidle-genus
    index: sidle-genus
    title: Genus composition per sample
    description: The 15 most abundant genera, the rest folded into Other.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: ampliseq
    data_collection_tag: sidle_reconstruction_qc
    use: sidle/reconstruction_qc
    visu_type: bar
    mode: code
    code_content: |-
      # Features by the number of amplicon regions they were rebuilt from.
      d = df.group_by([*depictio_group_by, 'num_regions']).agg(pl.len().alias('features')).sort('num_regions')
      fig = px.bar(d.to_pandas(), x='num_regions', y='features', text='features', facet_col=depictio_group_by[0] if depictio_group_by else None, labels={'num_regions': 'Regions mapped', 'features': 'Reconstructed features'})
      fig.update_xaxes(dtick=1)
      fig.update_traces(textposition='outside')
    section: Reconstruction QC
    tag: am-sidle-regions
    index: sidle-regions
    title: Features by regions mapped
    description: How many amplicon regions each feature was rebuilt from, the core SIDLE confidence signal.
    layout: {x: 0, y: 0, w: 4, h: 4}
  # Colours by nothing of its own, so it spreads the group kwargs whole.
  - component_type: figure
    workflow_tag: ampliseq
    data_collection_tag: sidle_reconstruction_qc
    use: sidle/reconstruction_qc
    visu_type: scatter
    mode: code
    code_content: |-
      fig = px.scatter(df.to_pandas(), x='num_regions', y='total_kmers_mapped', size='mean_kmer_per_region', custom_data=['feature_id'], hover_data=['feature_id', 'mean_kmer_per_region', 'stdv_kmer_per_region'], labels={'num_regions': 'Regions mapped', 'total_kmers_mapped': 'Total k-mers mapped'}, **depictio_group_kwargs)
      fig.update_xaxes(dtick=1)
    selection_enabled: true
    selection_column: feature_id
    section: Reconstruction QC
    tag: am-sidle-kmers
    index: sidle-kmers
    title: K-mer support against regions mapped
    description: Each feature's k-mer evidence against its regions. Outliers flag weakly supported features.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: table
    workflow_tag: ampliseq
    data_collection_tag: sidle_reconstructed
    use: sidle/reconstructed
    row_selection_enabled: true
    row_selection_column: feature_id
    section: Tables
    tag: am-sidle-table-reconstructed
    index: sidle-reconstructed-table
    title: Reconstructed features per sample
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: ampliseq
    data_collection_tag: sidle_reconstruction_qc
    use: sidle/reconstruction_qc
    row_selection_enabled: true
    row_selection_column: feature_id
    section: Tables
    tag: am-sidle-table-qc
    index: sidle-reconstruction-qc-table
    title: Reconstruction support per feature
    layout: {x: 0, y: 6, w: 8, h: 6}
