  - component_type: text
    workflow_tag: ampliseq
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    section: Diversity at a glance
    body: 'Alpha-diversity indices computed by [QIIME 2](https://qiime2.org) on the rarefied feature table, one value per sample: richness, phylogenetic spread (Faith''s PD) and evenness, each summarised by its median and distribution. The last card is the deepest depth the rarefaction curves below were drawn to.'
    tag: text-alpha-section-header-78cb12
    index: alpha-section-header
    layout:
      x: 0
      y: 0
      w: 8
      h: 2
    title: Within-sample diversity
  - component_type: card
