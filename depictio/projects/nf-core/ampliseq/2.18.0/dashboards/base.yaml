tabs:
- title: Alpha Diversity
  subtitle: Within-sample richness, evenness, phylogenetic spread — rarefaction + per-group boxplots
  tab_order: 1
  tab_icon: mdi:chart-bell-curve
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 646b0f3c1e4a2d7f8e5b8cbe
  filter_sections:
  - name: Alpha filters
    icon: mdi:filter-variant
    color: orange
    description: Narrows every diversity tile on this tab
  grid_sections:
  - name: Diversity at a glance
    icon: mdi:counter
    color: orange
    description: Four per-sample indices, each summarised the way its shape asks for
  - name: Rarefaction
    icon: mdi:chart-line
    color: grape
    description: Whether sequencing depth reached saturation
  - name: Per-{GROUP_COL_DISPLAY} comparison
    icon: mdi:scale-balance
    color: teal
    description: The same indices, contrasted between groups
  - name: Per-sample table
    icon: mdi:table
    color: gray
    description: The numbers behind the cards, one row per sample
    collapsed: true
  components:
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: alpha_diversity_multi_canonical
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      title_size: md
      custom_color: '#45B8AC'
      icon_name: mdi:flask
    title_align: left
    placement: left
    section: Alpha filters
    group: Alpha scope
    tag: interactive-alpha-sample-filter-235a5d
    index: alpha-sample-filter
    layout:
      x: 0
      y: 0
      w: 1
      h: 3
    title: Sample ID
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: alpha_diversity_multi_canonical
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      title_size: md
      custom_color: '#984EA3'
      icon_name: mdi:earth
    title_align: left
    placement: left
    section: Alpha filters
    group: Alpha scope
    tag: interactive-alpha-habitat-filter-f2247a
    index: alpha-habitat-filter
    layout:
      x: 0
      y: 3
      w: 1
      h: 2
    title: '{GROUP_COL_DISPLAY}'
  - component_type: text
    workflow_tag: ampliseq
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    section: Diversity at a glance
    body: 'Four alpha-diversity indices computed by QIIME 2 on the rarefied feature table, one row per sample. Shannon weights richness by evenness, Faith''s PD weights it by branch length on the phylogeny, and evenness isolates the balance between taxa. Each card carries the distribution behind its median rather than the median alone.'
    tag: text-alpha-section-header-78cb12
    index: alpha-section-header
    layout:
      x: 0
      y: 0
      w: 8
      h: 2
    title: Within-sample diversity
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: alpha_diversity_multi_canonical
