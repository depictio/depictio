    title: Projection and distance
    body: 'Beta diversity: the PCoA embeds each sample in two dimensions so that the closer two points sit, the more similar their communities. The Bray-Curtis matrix beside it is the pairwise distance the projection was computed from, where a sample unlike every other shows up as a bright row.'
