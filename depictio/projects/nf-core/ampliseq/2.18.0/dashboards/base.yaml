    data_collection_tag: sunburst_canonical
    aggregation: nunique
    column_name: Family
    column_type: object
    filter_expr: (col('abundance') > 0) & col('Family').is_not_null() & (col('Family') != '') & (col('Family') != 'Unclassified')
    secondary_layout: top_n
    breakdown_col: Phylum
    display:
      icon_name: mdi:graph-outline
      icon_color: indigo
      caption: the richest phyla
    section: Community at a glance
    tag: am-comm-card-families
    index: community-families
    title: Families
    description: Distinct families present in the samples in view.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # One 100% bar per group. Colour is the phylum, so the figure takes the group
  # column and its order from the kwargs and never spreads them.
  - component_type: figure
    workflow_tag: ampliseq
    data_collection_tag: taxonomy_rel_abundance
    use: qiime2/rel_abundance
    visu_type: bar
    mode: code
    code_content: |-
      # One 100% bar per group: the eight most abundant phyla of the samples in view,
      # the rest folded into Other. The groups are Analysis mode's when it has some.
      grp = depictio_group_by[0] if depictio_group_by else '{GROUP_COL}'
      d = df if grp in df.columns else df.with_columns(pl.lit('All samples').alias(grp))
      top = d.group_by('Phylum').agg(pl.col('rel_abundance').sum().alias('n')).sort('n', descending=True).head(8)['Phylum'].to_list()
      d = d.filter(pl.col(grp).is_not_null()).with_columns(pl.when(pl.col('Phylum').is_in(top)).then(pl.col('Phylum')).otherwise(pl.lit('Other')).alias('Phylum'))
      shares = d.group_by([grp, 'Phylum']).agg(pl.col('rel_abundance').sum().alias('n')).with_columns((pl.col('n') / pl.col('n').sum().over(grp) * 100).alias('share')).sort(grp)
      orders = dict(depictio_group_kwargs.get('category_orders') or {}, Phylum=top + ['Other'])
      fig = px.bar(shares.to_pandas(), x='share', y=grp, color='Phylum', orientation='h', category_orders=orders, color_discrete_map=depictio_category_colors.get('Phylum') or {}, labels={grp: '', 'share': 'Share of the community (%)'})
      fig.update_layout(barmode='stack', xaxis_range=[0, 100], margin=dict(t=10))
      fig.update_yaxes(automargin=True)
    section: Composition
    tag: am-comm-composition-by-group
    index: comm-composition-by-group
    title: Phylum composition per group
    description: The eight most abundant phyla of each group, the rest folded into Other.
    layout: {x: 0, y: 0, w: 8, h: 4, fit: auto}
  - component_type: figure
    workflow_tag: ampliseq
    data_collection_tag: sintax_rel_abundance
    use: vsearch/sintax_abundance
    visu_type: bar
    mode: code
    code_content: |-
      # One 100% bar per group: the eight most abundant phyla of the samples in view,
      # the rest folded into Other. The groups are Analysis mode's when it has some.
      grp = depictio_group_by[0] if depictio_group_by else '{GROUP_COL}'
      d = df if grp in df.columns else df.with_columns(pl.lit('All samples').alias(grp))
      top = d.group_by('Phylum').agg(pl.col('rel_abundance').sum().alias('n')).sort('n', descending=True).head(8)['Phylum'].to_list()
      d = d.filter(pl.col(grp).is_not_null()).with_columns(pl.when(pl.col('Phylum').is_in(top)).then(pl.col('Phylum')).otherwise(pl.lit('Other')).alias('Phylum'))
      shares = d.group_by([grp, 'Phylum']).agg(pl.col('rel_abundance').sum().alias('n')).with_columns((pl.col('n') / pl.col('n').sum().over(grp) * 100).alias('share')).sort(grp)
      orders = dict(depictio_group_kwargs.get('category_orders') or {}, Phylum=top + ['Other'])
      fig = px.bar(shares.to_pandas(), x='share', y=grp, color='Phylum', orientation='h', category_orders=orders, color_discrete_map=depictio_category_colors.get('Phylum') or {}, labels={grp: '', 'share': 'Share of the community (%)'})
      fig.update_layout(barmode='stack', xaxis_range=[0, 100], margin=dict(t=10))
      fig.update_yaxes(automargin=True)
    section: Composition
    tag: am-comm-sintax-composition
    index: comm-sintax-composition
    title: Phylum composition per group (SINTAX)
    description: The eight most abundant SINTAX phyla of each group, the rest folded into Other.
    layout: {x: 0, y: 0, w: 8, h: 4, fit: auto}
  - component_type: advanced_viz
    workflow_tag: ampliseq
    use: qiime2/stacked_taxonomy
    data_collection_tag: stacked_taxonomy_canonical
    config:
      default_rank: Phylum
      # Ten and Other, as in the per-group bars above: the same key twice.
      top_n: 8
      sort_by: abundance
      normalise_to_one: true
      annotation_strips:
      - column: '{GROUP_COL}'
        label: '{GROUP_COL_DISPLAY}'
        position: top
    section: Composition
    tag: am-comm-stacked-taxonomy
    index: adv-stacked-taxonomy
    title: Composition per sample
    layout: {x: 0, y: 4, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: ampliseq
    use: qiime2/sunburst_taxonomy
    data_collection_tag: sunburst_canonical
    config:
      rank_cols:
      - Kingdom
      - Phylum
      - Class
      # tab10 over the tab20 default: three ranks deep, the wide palette pairs a
      # light and a dark shade of one hue for neighbouring phyla.
      palette: tab10
      # Every arc: the 0.5% default drops the rare taxa, and the long tail of an
      # amplicon run is a result, not noise.
      min_percent: 0
    section: Taxonomic structure
    tag: am-comm-sunburst
    index: adv-sunburst
    title: Taxonomic hierarchy
    layout: {x: 0, y: 0, w: 8, h: 6}
  # No Sankey: it restates the sunburst (same hierarchy, same weights).
  # sankey_canonical stays ingested for authors who want the flow view.
  - component_type: advanced_viz
    workflow_tag: ampliseq
    viz_kind: upset_plot
    data_collection_tag: upset_canonical
    config:
      viz_kind: upset_plot
      matrix_wf_id: 646b0f3c1e4a2d7f8e5b8ca3
      matrix_dc_id: 646b0f3c1e4a2d7f8e5b8cd6
      sort_by: cardinality
      sort_order: descending
      min_size: 1
      show_set_sizes: true
      # The sets are the group values, coloured as on every other tile through
      # the main tab's category_colors.
      color_intersections_by: set
      set_category_column: '{GROUP_COL}'
      # Phylum, not the full lineage: one legend entry per phylum.
      default_annotation_cols:
      - Phylum
    section: Set overlap
    tag: am-comm-upset
    index: adv-upset
    title: Taxa shared between groups
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: ampliseq
    data_collection_tag: taxonomy_rel_abundance
    use: qiime2/rel_abundance
    row_selection_enabled: true
    row_selection_column: taxonomy
    section: Tables
    tag: am-comm-table
    index: comm-table-rel-abundance
    title: Relative abundance per sample and phylum
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: ampliseq
    data_collection_tag: sintax_rel_abundance
    use: vsearch/sintax_abundance
    row_selection_enabled: true
    row_selection_column: taxonomy
    section: Tables
    tag: am-comm-table-sintax
    index: sintax-taxonomy-table
    title: Relative abundance per sample and phylum (SINTAX)
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Differential Abundance
  subtitle: Which taxa differ in abundance between groups?
  tab_group: Taxa
  tab_order: 5
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: red
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 646b0f3c1e4a2d7f8e5b8cb4
  filter_sections:
  - name: Differential filters
    icon: mdi:filter-variant
    color: red
    description: Pick a contrast first, then narrow the taxa
  grid_sections:
  - name: Calls at a glance
    icon: mdi:counter
    color: red
    description: Taxa tested, and the calls passing 5% FDR by direction
  - name: Volcano and ranked effects
    icon: mdi:chart-scatter-plot
    color: red
    description: Effect size against significance, then the largest effects ranked
  - name: Taxon detail
    icon: mdi:table
    color: gray
    description: Every tested taxon, and the full record of the one picked
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [ANCOM-BC](https://bioconductor.org/packages/ANCOMBC) tests each taxon for a
      difference in abundance between two groups, correcting for compositional bias and for
      the number of tests. Pick a contrast on the left first: every number on this tab
      depends on it.
    tag: am-diff-intro
    index: diff-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: ancombc_results
    interactive_component_type: MultiSelect
    column_name: contrast
    column_type: object
    display:
      icon_name: mdi:compare-horizontal
      custom_color: red
    section: Differential filters
    group: Call scope
    tag: am-diff-filter-contrast
    index: diff-contrast-filter
    title: Contrast
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: ancombc_results
    interactive_component_type: MultiSelect
    column_name: Phylum
    column_type: object
    display:
      icon_name: mdi:bacteria-outline
      custom_color: grape
    section: Differential filters
    group: Call scope
    tag: am-diff-filter-phylum
    index: diff-filter-phylum
    title: Phylum
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: ancombc_results
    interactive_component_type: MultiSelect
    column_name: Kingdom
    column_type: object
    display:
      icon_name: mdi:bacteria
      custom_color: grape
    section: Differential filters
    group: Call scope
    tag: am-diff-filter-kingdom
    index: diff-kingdom-filter
    title: Kingdom
    layout: {x: 0, y: 5, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: ancombc_results
    interactive_component_type: RangeSlider
    column_name: lfc
    column_type: float64
    display:
      icon_name: mdi:arrow-expand-horizontal
      custom_color: red
    section: Differential filters
    tag: am-diff-filter-lfc
    index: diff-lfc-slider
    title: Log-fold change
    layout: {x: 0, y: 7, w: 1, h: 3}
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: ancombc_results
    use: qiime2/ancombc
    aggregation: nunique
    column_name: id
    column_type: object
    secondary_layout: donut
    breakdown_col: Kingdom
    display:
      icon_name: mdi:bacteria-outline
      icon_color: cyan
      caption: split by kingdom
    section: Calls at a glance
    tag: am-diff-card-tested
    index: diff-card-total-taxa
    title: Tested
    description: Taxa ANCOM-BC tested in at least one contrast, split by kingdom.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: ancombc_results
    use: qiime2/ancombc
    aggregation: nunique
    column_name: id
    column_type: object
    filter_expr: col('q_val') < 0.05
    secondary_layout: top_n
    breakdown_col: contrast
    display:
      icon_name: mdi:check-decagram
      icon_color: red
      caption: q < 0.05, by contrast
    section: Calls at a glance
    tag: am-diff-card-significant
    index: diff-card-significant
    title: Significant
    description: Taxa passing 5% FDR in at least one contrast, split by kingdom.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: ancombc_results
    use: qiime2/ancombc
    aggregation: count
    column_name: id
    column_type: object
    filter_expr: (col('q_val') < 0.05) & (col('lfc') > 0)
    secondary_layout: composition
    breakdown_col: contrast
    display:
      icon_name: mdi:arrow-up-bold-outline
      icon_color: pink
      caption: calls, by contrast
    section: Calls at a glance
    tag: am-diff-card-enriched
    index: diff-card-enriched
    title: Enriched
    description: Significant calls, one per taxon and contrast, more abundant in the contrast's group than in its reference.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: ancombc_results
    use: qiime2/ancombc
    aggregation: count
    column_name: id
    column_type: object
    filter_expr: (col('q_val') < 0.05) & (col('lfc') < 0)
    secondary_layout: composition
    breakdown_col: contrast
    display:
      icon_name: mdi:arrow-down-bold-outline
      icon_color: blue
      caption: calls, by contrast
    section: Calls at a glance
    tag: am-diff-card-depleted
    index: diff-card-depleted
    title: Depleted
    description: Significant calls, one per taxon and contrast, less abundant in the contrast's group than in its reference.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: ampliseq
    use: qiime2/volcano
    data_collection_tag: ancombc_results
    config:
      label_col: Phylum
      category_col: contrast
      significance_is_neg_log10: false
      significance_threshold: 0.05
      effect_threshold: 1.0
      top_n_labels: 6
      effect_label: Log fold change
      significance_label: -log10 q-value
      # The View switch: QQ reads the raw p-values; MA reads ma_canonical, the
      # same calls with their mean abundance, which ancombc_results lacks. Its
      # contrast column is narrowed by the same contrast filter.
      p_value_col: p_val
      ma_dc_tag: ma_canonical
    section: Volcano and ranked effects
    tag: am-diff-volcano
    index: adv-volcano
    title: Effect size against significance
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: ampliseq
    use: qiime2/da_barplot
    data_collection_tag: ancombc_results
    config:
      significance_col: q_val
      label_col: Phylum
      significance_threshold: 0.05
      top_n: 15
      contrast_view: all
    section: Volcano and ranked effects
    tag: am-diff-da-barplot
    index: adv-da-barplot
    title: Largest effects per contrast
    layout: {x: 0, y: 6, w: 8, h: 5}
  # Master and detail: a picked row is the selection the record card follows.
  - component_type: table
    workflow_tag: ampliseq
    data_collection_tag: ancombc_results
    use: qiime2/ancombc
    row_selection_enabled: true
    row_selection_column: id
    section: Taxon detail
    tag: am-diff-table-results
    index: diff-table-results
    title: ANCOM-BC results
    layout: {x: 0, y: 0, w: 5, h: 6}
  # No default_record: the card waits for a pick rather than opening on a taxon
  # of one run.
  - component_type: advanced_viz
    workflow_tag: ampliseq
    data_collection_tag: ancombc_results
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: id
      title_col: Phylum
      selection_source: any
      sections:
        Test: [contrast, lfc, se, w, p_val, q_val]
        Lineage: [Kingdom, Phylum, id]
      labels:
        lfc: Log-fold change
        se: Standard error
        w: W statistic
        p_val: p-value
        q_val: Adjusted p-value (FDR)
        id: Full lineage
      linked_component: am-diff-table-results
    section: Taxon detail
    tag: am-diff-taxon-record
    index: diff-taxon-record
    title: Taxon record
    layout: {x: 5, y: 0, w: 3, h: 5}
