    data_collection_tag: sintax_rel_abundance
    interactive_component_type: MultiSelect
    column_name: Kingdom
    column_type: object
    display:
      icon_name: mdi:bacteria
      custom_color: grape
    section: Community filters
    group: Taxonomy
    tag: am-comm-filter-kingdom-sintax
    index: sintax-kingdom-filter
    title: Kingdom
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: sintax_rel_abundance
    interactive_component_type: MultiSelect
    column_name: Phylum
    column_type: object
    display:
      icon_name: mdi:bacteria-outline
      custom_color: grape
    section: Community filters
    group: Taxonomy
    tag: am-comm-filter-phylum-sintax
    index: sintax-phylum-filter
    title: Phylum
