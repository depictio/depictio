    column_type: object
    display:
      icon_name: mdi:bacteria-outline
    section: Community filters
    group: Taxonomy
    tag: am-comm-filter-phylum-sintax
    index: sintax-phylum-filter
    title: Phylum
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: taxonomy_rel_abundance
    use: qiime2/rel_abundance
    aggregation: nunique
    column_name: Phylum
    column_type: object
    secondary_layout: composition
    breakdown_col: Kingdom
    display:
      icon_name: mdi:bacteria-outline
    section: Community at a glance
    tag: am-comm-card-phyla
