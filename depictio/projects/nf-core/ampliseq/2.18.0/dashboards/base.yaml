    workflow_tag: ampliseq
    data_collection_tag: stacked_taxonomy_canonical
    aggregation: nunique
    column_name: taxon
    column_type: object
    filter_expr: (col('rank') == 'Class') & (col('abundance') > 0) & col('taxon').is_not_null() & (col('taxon') != '')
    secondary_layout: top_n
    breakdown_col: sample_id
    display:
