# nf-core/ampliseq 2.18.0: the reference template of the nf-core family.
# Every rule it follows is written out in depictio/projects/nf-core/RULES.md.
#
# Route alternates: a run takes one taxonomy route (QIIME 2, SINTAX with
# --skip_qiime, or SIDLE with multiregion), and template.yaml prunes the data
# collections of the others. Components bound to the alternatives share one
# grid slot, so whichever survives the import takes the slot.
main_dashboard:
  title: nf-core/ampliseq
  subtitle: Amplicon communities, from reads to the taxa that differ between groups
  project_tag: Ampliseq Microbial Community Analysis
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 646b0f3c1e4a2d7f8e5b8ca2
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family: figures, advanced viz
  # and filter chips all colour a value the same way.
  category_colors:
    '{GROUP_COL}': auto
    Kingdom:
      '*': auto
      Bacteria: '#1098ad'
      Archaea: '#7048e8'
      Eukaryota: '#c2255c'
      Unclassified: '#adb5bd'
    # Only the catch-all buckets: phyla are too many for a palette, but the
    # composition bars fold the long tail into Other and keep it grey.
    Phylum:
      Other: '#adb5bd'
      Unclassified: '#868e96'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. Bound
  # to the metadata DC, the source of every sample link in template.yaml. A run
  # without --metadata prunes it, and each tab keeps its own filters.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    description: The run in four numbers. The filter here narrows these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab rather than on an analysis tab: a run that prunes
  # that tab would take a persistent section declared there with it.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The sample sheet behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Samples, below).
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: metadata
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Key figures
    tag: am-ov-kf-group
    index: ov-kf-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: text
    title: nf-core/ampliseq
    order: 1
    body: >
      Amplicon reads turned into a census of each sample's community: who is there, how diverse
      it is and what differs between groups. [Run parameters](params:)
    tag: am-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    body: |
      ::: steps
      1. ![](icon:mdi:content-cut) **Trim** Primers cut by Cutadapt · [Settings](params:primer) · [MultiQC](tab:MultiQC)
      2. ![](icon:mdi:dna) **Denoise** DADA2 infers the ASVs · [Settings](params:trunc) · [Phylogeny](tab:Phylogeny)
      3. ![](icon:mdi:tag-outline) **Classify** Against {{param:dada_ref_taxonomy}} · [Settings](params:taxonomy) · [Community](tab:Community & Diversity)
      4. ![](icon:mdi:chart-bell-curve) **Alpha** Diversity within samples · [Settings](params:rarefaction) · [Alpha](tab:Alpha Diversity)
      5. ![](icon:mdi:chart-scatter-plot) **Beta** Distances between samples · [Settings](params:adonis) · [Ordination](tab:Ordination & Clustering)
      6. ![](icon:mdi:scale-balance) **Test** ANCOM-BC between groups · [Settings](params:ancombc) · [Differential](tab:Differential Abundance)
      :::
    tag: am-ov-steps
    index: ov-steps
    layout: {x: 0, y: 1, w: 8, h: 2}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. The icon colour is that tab's colour.
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: metadata
    aggregation: nunique
    column_name: '{METADATA_ID_COL}'
    column_type: object
    secondary_layout: composition
    breakdown_col: '{GROUP_COL}'
    display:
      icon_name: mdi:flask-outline
      icon_color: orange
      caption: in the sample sheet, by {GROUP_COL_DISPLAY}
      link: tab:MultiQC
    section: Key figures
    tag: am-ov-kf-samples
    index: ov-kf-samples
    title: Samples
    description: Samples in the sample sheet. The bar splits them by {GROUP_COL_DISPLAY}.
    layout: {x: 0, y: 0, w: 2, h: 2}
  # Phyla: three alternates for one slot, one per taxonomy route.
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: taxonomy_rel_abundance
    use: qiime2/rel_abundance
    aggregation: nunique
    column_name: Phylum
    column_type: object
    secondary_layout: composition
    breakdown_col: Kingdom
    display:
      icon_name: mdi:bacteria-outline
      icon_color: teal
      caption: distinct phyla, by kingdom
      link: tab:Community & Diversity
    section: Key figures
    tag: am-ov-kf-phyla
    index: ov-kf-phyla
    title: Phyla
    description: Distinct phyla the classifier assigned. The bar splits them by kingdom.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: sintax_rel_abundance
    use: vsearch/sintax_abundance
    aggregation: nunique
    column_name: Phylum
    column_type: object
    secondary_layout: composition
    breakdown_col: Kingdom
    display:
      icon_name: mdi:bacteria-outline
      icon_color: teal
      caption: distinct phyla, by kingdom
      link: tab:Community & Diversity
    section: Key figures
    tag: am-ov-kf-phyla-sintax
    index: ov-kf-phyla-sintax
    title: Phyla
    description: Distinct phyla SINTAX assigned. The bar splits them by kingdom.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: sidle_reconstructed
    use: sidle/reconstructed
    aggregation: nunique
    column_name: Phylum
    column_type: object
    secondary_layout: composition
    breakdown_col: Kingdom
    display:
      icon_name: mdi:bacteria-outline
      icon_color: indigo
      caption: distinct phyla, by kingdom
      link: tab:SIDLE
    section: Key figures
    tag: am-ov-kf-phyla-sidle
    index: ov-kf-phyla-sidle
    title: Phyla
    description: Distinct phyla in the community SIDLE reconstructed across regions.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: alpha_diversity_multi_canonical
    use: qiime2/alpha_diversity
    aggregation: median
    column_name: shannon
    column_type: float64
    aggregations:
    - box_plot_stats
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: grape
      caption: median per sample
      link: tab:Alpha Diversity
      decimals: 2
    section: Key figures
    tag: am-ov-kf-shannon
    index: ov-kf-shannon
    title: Shannon diversity
    description: Median Shannon diversity of the samples in view. The box shows how it spreads.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # kept_percent is per sample, so the median is of samples, not of reads; the
  # filter leaves out a sample no read entered.
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: read_tracking
    aggregation: median
    column_name: kept_percent
    column_type: float64
    filter_expr: col('input_reads') > 0
    secondary_layout: coverage
    coverage_max: 100
    display:
      icon_name: mdi:filter-outline
      icon_color: orange
      caption: median share of input reads
      link: tab:MultiQC
      decimals: 1
    section: Key figures
    tag: am-ov-kf-reads-kept
    index: ov-kf-reads-kept
    title: Reads kept (%)
    description: Median share of each sample's reads left after trimming, denoising and filtering.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the group, then the kingdom on whichever taxonomy
  # route the run took (the alternates are pruned with their data).
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: metadata
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Findings
    tag: am-ov-findings-group
    index: ov-findings-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: taxonomy_rel_abundance
    interactive_component_type: MultiSelect
    column_name: Kingdom
    column_type: object
    display:
      icon_name: mdi:bacteria
      strip_label: Kingdom
    section: Findings
    tag: am-ov-findings-kingdom
    index: ov-findings-kingdom
    title: Kingdom
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: sintax_rel_abundance
    interactive_component_type: MultiSelect
    column_name: Kingdom
    column_type: object
    display:
      icon_name: mdi:bacteria
      strip_label: Kingdom
    section: Findings
    tag: am-ov-findings-kingdom-sintax
    index: ov-findings-kingdom-sintax
    title: Kingdom
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: sidle_reconstructed
    interactive_component_type: MultiSelect
    column_name: Kingdom
    column_type: object
    display:
      icon_name: mdi:bacteria
      strip_label: Kingdom
    section: Findings
    tag: am-ov-findings-kingdom-sidle
    index: ov-findings-kingdom-sidle
    title: Kingdom
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data. The three dominant-phylum rows are the route
  # alternates: one survives. PERMANOVA is the pipeline's own test, run once on
  # every sample, so no filter changes it and its row says so.
  - component_type: text
    surface: card
    values:
      top: {dc: taxonomy_rel_abundance, column: Phylum, aggregation: top, weight: rel_abundance}
      top_share: {dc: taxonomy_rel_abundance, column: Phylum, aggregation: top_share, weight: rel_abundance,
        format: percent}
      sx_top: {dc: sintax_rel_abundance, column: Phylum, aggregation: top, weight: rel_abundance}
      sx_share: {dc: sintax_rel_abundance, column: Phylum, aggregation: top_share, weight: rel_abundance,
        format: percent}
      sd_top: {dc: sidle_reconstructed, column: Phylum, aggregation: top, weight: count}
      sd_share: {dc: sidle_reconstructed, column: Phylum, aggregation: top_share, weight: count, format: percent}
      shannon: {dc: alpha_diversity_multi_canonical, column: shannon, aggregation: median, format: 'decimals:2'}
      r2: {dc: beta_adonis, column: r2, aggregation: max, filter_expr: "(col('metric') == 'bray_curtis') & (col('term') == '{GROUP_COL}')",
        format: percent}
      n_sig: {dc: ancombc_results, column: id, aggregation: nunique, filter_expr: "col('q_val') < 0.05",
        format: integer}
      n_tested: {dc: ancombc_results, column: id, aggregation: nunique, format: integer}
    body: |
      - **{{top_share}}** of the community is {{top}} – the most abundant phylum [Community](tab:Community & Diversity)
      - **{{sx_share}}** of the community is {{sx_top}} – the most abundant phylum [Community](tab:Community & Diversity)
      - **{{sd_share}}** of the rebuilt community is {{sd_top}} – the most abundant phylum [SIDLE](tab:SIDLE)
      - **{{shannon}}** median Shannon diversity – one value per sample [Alpha](tab:Alpha Diversity)
      - **{{r2}}** of the variation is explained by {GROUP_COL_DISPLAY} – PERMANOVA, all samples [Ordination](tab:Ordination & Clustering)
      - **{{n_sig}}** of {{n_tested}} phyla differ between groups – ANCOM-BC, 5% FDR [Differential](tab:Differential Abundance)
    section: Findings
    tag: am-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per analysis tab, in the order of the rows above. The
  # composition slot has an alternate per taxonomy route; the import drops a
  # highlight whose source is gone and re-packs the grid.
  - component_type: highlight
    section: Findings
    source_tab: Community & Diversity
    source_component: comm-composition-by-group
    tag: am-ov-hl-composition
    index: ov-hl-composition
    layout: {x: 0, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Community & Diversity
    source_component: comm-sintax-composition
    tag: am-ov-hl-composition-sintax
    index: ov-hl-composition-sintax
    layout: {x: 0, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: SIDLE
    source_component: sidle-composition
    tag: am-ov-hl-composition-sidle
    index: ov-hl-composition-sidle
    layout: {x: 0, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Alpha Diversity
    source_component: alpha-boxplot-by-group
    tag: am-ov-hl-alpha
    index: ov-hl-alpha
    layout: {x: 4, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Ordination & Clustering
    source_component: ord-embedding
    tag: am-ov-hl-ordination
    index: ov-hl-ordination
    layout: {x: 0, y: 6, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Differential Abundance
    source_component: adv-volcano
    tag: am-ov-hl-volcano
    index: ov-hl-volcano
    layout: {x: 4, y: 6, w: 4, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers. A tab the run does not have is left out, and a heading whose
  # tabs are all missing is hidden.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)

      ### Diversity
      - [Alpha Diversity](tab:Alpha Diversity)
      - [Ordination & Clustering](tab:Ordination & Clustering)

      ### Taxa
      - [Community & Diversity](tab:Community & Diversity)
      - [Differential Abundance](tab:Differential Abundance)
      - [Phylogeny](tab:Phylogeny)
      - [SIDLE](tab:SIDLE)
    section: How to read this dashboard
    tag: am-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the group first.
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: metadata
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
    section: Sample filters
    group: Sample scope
    tag: am-filter-group
    index: sample-filters-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: metadata
    interactive_component_type: MultiSelect
    column_name: '{METADATA_ID_COL}'
    column_type: object
    display:
      icon_name: mdi:flask-outline
    section: Sample filters
    group: Sample scope
    tag: am-filter-sample
    index: sample-filters-sample
    title: Sample ID
    layout: {x: 0, y: 2, w: 1, h: 3}
  # Row selection feeds the Analysis panel: the one component of the family
  # that is both persistent and row-addressable.
  - component_type: table
    workflow_tag: ampliseq
    data_collection_tag: metadata
    row_selection_enabled: true
    row_selection_column: '{METADATA_ID_COL}'
    section: Sample sheet
    tag: am-sample-sheet
    index: sample-sheet
    title: Sample sheet
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
- title: MultiQC
  subtitle: Did sequencing and primer trimming work for every sample?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 646b0f3c1e4a2d7f8e5b8cc6
  # Bound to multiqc_data, not metadata, so the tab keeps a sample filter on a
  # run without --metadata, which prunes the persistent Sample filters.
  filter_sections:
  - name: MultiQC report
    icon: mdi:file-document-outline
    color: orange
    description: Samples as the MultiQC report names them
  grid_sections:
  - name: QC overview
    icon: mdi:chart-box-outline
    color: orange
    description: Read counts kept through trimming, and base quality along the read
  - name: QC details
    icon: mdi:file-document-outline
    color: gray
    description: The remaining FastQC and Cutadapt panels
    collapsed: true
  components:
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: multiqc_data
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
    section: MultiQC report
    tag: am-mqc-filter-sample
    index: mqc-sample-filter
    title: Sample ID
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: multiqc
    workflow_tag: ampliseq
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: QC overview
    tag: am-mqc-general-stats
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: ampliseq
    data_collection_tag: multiqc_data
    use: multiqc/cutadapt
    selected_module: cutadapt
    selected_plot: Filtered Reads
    section: QC overview
    tag: am-mqc-cutadapt-filtered-reads
    layout: {x: 0, y: 4, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: ampliseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Counts
    section: QC overview
    tag: am-mqc-fastqc-sequence-counts
    layout: {x: 0, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: ampliseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    section: QC overview
    tag: am-mqc-fastqc-quality-histograms
    layout: {x: 4, y: 8, w: 4, h: 4}
  # No `Per Sequence GC Content` panel. FastQC forces its x domain to 0-100 %GC
  # with 101 points per sample, but amplicon reads sit in a narrow GC band, so
  # most points lie at y=0 and the panel reads as a flat line at any size.
  - component_type: multiqc
    workflow_tag: ampliseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Adapter Content
    section: QC details
    tag: am-mqc-fastqc-adapter-content
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: ampliseq
    data_collection_tag: multiqc_data
    use: multiqc/cutadapt
    selected_module: cutadapt
    selected_plot: Trimmed Sequence Lengths (5')
    section: QC details
    tag: am-mqc-cutadapt-trimmed-lengths
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: ampliseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Per Sequence Quality Scores
    section: QC details
    tag: am-mqc-fastqc-sequence-quality
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: ampliseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Duplication Levels
    section: QC details
    tag: am-mqc-fastqc-duplication
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: ampliseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Length Distribution
    section: QC details
    tag: am-mqc-fastqc-length-distribution
    layout: {x: 0, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: ampliseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Per Base N Content
    section: QC details
    tag: am-mqc-fastqc-n-content
    layout: {x: 4, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: ampliseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Top overrepresented sequences
    section: QC details
    tag: am-mqc-fastqc-top-overrepresented
    layout: {x: 0, y: 12, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: ampliseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Overrepresented sequences by sample
    section: QC details
    tag: am-mqc-fastqc-overrepresented-by-sample
    layout: {x: 4, y: 12, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: ampliseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Status Checks
    section: QC details
    tag: am-mqc-fastqc-status-checks
    layout: {x: 0, y: 16, w: 8, h: 4}
- title: Alpha Diversity
  subtitle: How diverse is each sample, and was it sequenced deeply enough?
  tab_group: Diversity
  tab_order: 2
  tab_icon: mdi:chart-bell-curve
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 646b0f3c1e4a2d7f8e5b8cbe
  filter_sections:
  - name: Alpha filters
    icon: mdi:filter-variant
    color: grape
    description: Narrows the samples by their diversity, curves included
  grid_sections:
  - name: Diversity at a glance
    icon: mdi:counter
    color: grape
    card_variant: compact
    description: The median of each index over the samples in view
  - name: Rarefaction
    icon: mdi:chart-line
    color: grape
    description: Whether each index levels off as sequencing depth grows
  - name: Group comparison
    icon: mdi:scale-balance
    color: grape
    description: Shannon diversity per sample, one box per group
  - name: Per-sample table
    icon: mdi:table
    color: gray
    description: Every index for every sample
    collapsed: true
  components:
  # A value slice, not a sample list: the alpha_diversity_multi_canonical ->
  # rarefaction_canonical link carries the surviving samples to the curves.
  - component_type: interactive
    workflow_tag: ampliseq
