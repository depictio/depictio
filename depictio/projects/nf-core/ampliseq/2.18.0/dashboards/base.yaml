- title: Alpha Diversity
  subtitle: How diverse is each sample, and was it sequenced deeply enough?
  tab_group: Diversity
  tab_order: 2
  tab_icon: mdi:chart-bell-curve
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 646b0f3c1e4a2d7f8e5b8cbe
  filter_sections:
  - name: Alpha filters
    icon: mdi:filter-variant
    color: grape
    description: Narrows the samples by their diversity, curves included
  grid_sections:
  - name: Diversity at a glance
    icon: mdi:counter
    color: grape
    description: The median of each index over the samples in view
  - name: Rarefaction
    icon: mdi:chart-line
    color: grape
    description: Whether each index levels off as sequencing depth grows
  - name: Group comparison
    icon: mdi:scale-balance
    color: grape
    description: Shannon diversity per sample, one box per group
  - name: Per-sample table
    icon: mdi:table
    color: gray
    description: Every index for every sample
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      Diversity within each sample, computed by [QIIME 2](https://qiime2.org) on the
      rarefied feature table: richness (observed ASVs), Shannon, phylogenetic spread
      (Faith's PD) and evenness. The cards give each index's median and spread across the
      samples in view. The rarefaction curves show whether a sample was sequenced deeply
      enough for an index to level off.
    tag: am-alpha-intro
    index: alpha-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  # A value slice, not a sample list: the alpha_diversity_multi_canonical ->
  # rarefaction_canonical link carries the surviving samples to the curves.
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: alpha_diversity_multi_canonical
    interactive_component_type: RangeSlider
    column_name: shannon
    column_type: float64
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: pink
    section: Alpha filters
    tag: am-alpha-filter-shannon
    index: alpha-shannon-range
    title: Shannon diversity
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: alpha_diversity_multi_canonical
    use: qiime2/alpha_diversity
    aggregation: median
    column_name: shannon
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: grape
      caption: median, with its spread
      decimals: 2
    section: Diversity at a glance
    tag: am-alpha-card-shannon
    index: alpha-card-shannon
    title: Shannon
    description: Median Shannon entropy, richness and evenness in one number.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: alpha_diversity_multi_canonical
    use: qiime2/alpha_diversity
    aggregation: median
    column_name: observed_features
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:counter
      icon_color: violet
      caption: median, with its distribution
      decimals: 0
    section: Diversity at a glance
    tag: am-alpha-card-observed
    index: alpha-card-observed-features
    title: Observed ASVs
    description: Median number of ASVs seen in a sample, at the rarefaction depth.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: alpha_diversity_multi_canonical
    use: qiime2/alpha_diversity
    aggregation: median
    column_name: faith_pd
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:source-branch
      icon_color: indigo
      caption: median, with its spread
      decimals: 2
    section: Diversity at a glance
    tag: am-alpha-card-faith-pd
    index: alpha-card-faith-pd
    title: Faith PD
    description: Median phylogenetic diversity, the tree length a sample's ASVs span.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: alpha_diversity_multi_canonical
    use: qiime2/alpha_diversity
    aggregation: median
    column_name: evenness
    column_type: float64
    secondary_layout: gauge
    coverage_max: 1
    display:
      icon_name: mdi:scale-balance
      icon_color: pink
      caption: median, 0 to 1
      decimals: 2
    section: Diversity at a glance
    tag: am-alpha-card-evenness
    index: alpha-card-evenness
    title: Evenness
    description: Median Pielou evenness, from 0 (one ASV dominates) to 1 (all equal).
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: ampliseq
    use: qiime2/rarefaction
    data_collection_tag: rarefaction_canonical
    config:
      iter_col: iter
      group_col: '{GROUP_COL}'
      metric_options:
      - shannon
      - observed_features
      - faith_pd
      show_ci: true
    section: Rarefaction
    tag: am-alpha-rarefaction
    index: alpha-rarefaction-multi
    title: Rarefaction curves
    layout: {x: 0, y: 0, w: 8, h: 6}
  # Takes the pieces of the group kwargs rather than spreading them: the box
  # colours by its own x axis, which the spread would name a second time.
  - component_type: figure
    workflow_tag: ampliseq
    data_collection_tag: alpha_diversity_multi_canonical
    use: qiime2/alpha_diversity
    visu_type: box
    mode: code
    code_content: |-
      # Shannon per sample, one box per group: Analysis mode's groups when it has
      # some, else the pipeline's group column, in that column's colours.
      grp = depictio_group_by[0] if depictio_group_by else '{GROUP_COL}'
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get('{GROUP_COL}') or {}
      d = df if grp in df.columns else df.with_columns(pl.lit('All samples').alias(grp))
      d = d.filter(pl.col('shannon').is_not_null() & pl.col(grp).is_not_null()).sort(grp)
      fig = px.box(d.to_pandas(), x=grp, y='shannon', color=grp, color_discrete_map=colors, category_orders=depictio_group_kwargs.get('category_orders') or {}, points='all', hover_data=['sample_id'], labels={grp: '', 'shannon': 'Shannon'})
      fig.update_layout(showlegend=False)
    section: Group comparison
    tag: am-alpha-boxplot-by-group
    index: alpha-boxplot-by-group
    title: Shannon diversity per group
    description: One point per sample. Compare medians and spread, all the more when a group is small.
    layout: {x: 0, y: 0, w: 8, h: 4, fit: auto}
  - component_type: table
    workflow_tag: ampliseq
    data_collection_tag: alpha_diversity_multi_canonical
    use: qiime2/alpha_diversity
    page_size: 12
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Per-sample table
    tag: am-alpha-table
    index: alpha-table-summary
    title: Alpha diversity per sample
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Ordination & Clustering
  subtitle: Which samples have similar communities?
  tab_group: Diversity
  tab_order: 3
  tab_icon: mdi:chart-scatter-plot-hexbin
  tab_icon_color: pink
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 646b0f3c1e4a2d7f8e5b8cc2
  # Bound to the heatmap DC, which every route of this tab keeps (the
  # no-metadata one included), so the tab never loses its own filter.
  filter_sections:
  - name: Ordination filters
    icon: mdi:filter-variant
    color: pink
    description: Phylum narrows the rows of the abundance heatmap
  grid_sections:
  - name: Ordination at a glance
    icon: mdi:counter
    color: pink
    description: How many samples were placed, and how much the groups explain
  - name: Sample relationships
    icon: mdi:chart-scatter-plot
    color: pink
    description: The PCoA projection beside the distances it was computed from
  - name: Clustered abundance
    icon: mdi:chart-box-outline
    color: pink
    description: Phyla against samples, both axes clustered
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      Beta diversity: how different the communities of two samples are. The PCoA places each
      sample so that the closer two points sit, the more alike their communities, and the
      Bray-Curtis matrix beside it holds the distances it was drawn from. When the run
      tested it, PERMANOVA says how much of that variation the grouping explains.
    tag: am-ord-intro
    index: ord-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: complex_heatmap_canonical
    interactive_component_type: MultiSelect
    column_name: Phylum
    column_type: object
    display:
      icon_name: mdi:bacteria-outline
      custom_color: grape
    section: Ordination filters
    tag: am-ord-filter-phylum
    index: ord-phylum-filter
    title: Phylum
    layout: {x: 0, y: 0, w: 1, h: 3}
  # Two cards: the R² one exists only when the run tested a PERMANOVA formula,
  # and the import widens the samples card to the full row without it.
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: embedding_pcoa
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: donut
    breakdown_col: '{GROUP_COL}'
    display:
      icon_name: mdi:flask-outline
      icon_color: violet
      caption: one point each, by {GROUP_COL_DISPLAY}
    section: Ordination at a glance
    tag: am-ord-card-samples
    index: ord-card-samples
    title: Samples in the PCoA
    description: Samples below the rarefaction depth are left out of the ordination.
    layout: {x: 0, y: 0, w: 4, h: 2}
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: beta_adonis
    aggregation: max
    column_name: r2
    column_type: float64
    filter_expr: (col('metric') == 'bray_curtis') & (col('term') == '{GROUP_COL}')
    secondary_layout: gauge
    coverage_max: 1
    display:
      icon_name: mdi:sigma
      icon_color: pink
      caption: share of the Bray-Curtis variation
      decimals: 2
    section: Ordination at a glance
    tag: am-ord-card-permanova
    index: ord-card-permanova
    title: PERMANOVA R² of {GROUP_COL_DISPLAY}
    description: Share of the Bray-Curtis variation that {GROUP_COL_DISPLAY} explains, over all samples.
    layout: {x: 4, y: 0, w: 4, h: 2}
  - component_type: advanced_viz
    workflow_tag: ampliseq
    viz_kind: embedding
    data_collection_tag: embedding_pcoa
    use: qiime2/embedding
    config:
      viz_kind: embedding
      sample_id_col: sample_id
      dim_1_col: dim_1
      dim_2_col: dim_2
      color_col: '{GROUP_COL}'
      point_size: 10
      show_density: false
      axis_prefix: PCo
      # A lasso here becomes an analysis group. Points carry sample_id_col in
      # their customdata, so no selection_column is needed.
      selection_enabled: true
    section: Sample relationships
    tag: am-ord-embedding
    index: ord-embedding
    title: Sample ordination (PCoA, Bray-Curtis)
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: ampliseq
    use: qiime2/distance_heatmap
    data_collection_tag: bray_curtis_canonical
    config:
      viz_kind: complex_heatmap
      matrix_wf_id: 646b0f3c1e4a2d7f8e5b8ca3
      matrix_dc_id: 646b0f3c1e4a2d7f8e5b8cd9
      index_column: sample
      row_annotation_cols: []
      cluster_rows: true
      cluster_cols: true
      cluster_method: ward
      cluster_metric: euclidean
      normalize: none
      # Blues: the family convention for distance heatmaps.
      colorscale: Blues
    section: Sample relationships
    tag: am-ord-bray-curtis
    index: ord-bray-curtis
    title: Sample distances (Bray-Curtis)
    layout: {x: 4, y: 0, w: 4, h: 5}
  - component_type: advanced_viz
    workflow_tag: ampliseq
    use: qiime2/abundance_heatmap
    data_collection_tag: complex_heatmap_canonical
    config:
      viz_kind: complex_heatmap
      matrix_wf_id: 646b0f3c1e4a2d7f8e5b8ca3
      matrix_dc_id: 646b0f3c1e4a2d7f8e5b8cd2
      index_column: Phylum
      row_annotation_cols:
      - Kingdom
      cluster_rows: true
      cluster_cols: true
      cluster_method: ward
      cluster_metric: euclidean
      normalize: row_z
    section: Clustered abundance
    tag: am-ord-abundance-heatmap
    index: ord-complex-heatmap
    title: Phylum abundance across samples (clustered)
    layout: {x: 0, y: 0, w: 8, h: 5}
- title: Community & Diversity
  subtitle: Which taxa make up the samples, and which do groups share?
  tab_group: Taxa
  tab_order: 4
  tab_icon: mdi:bacteria-outline
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 646b0f3c1e4a2d7f8e5b8cb3
  # The SINTAX pair is the --skip_qiime alternate of the pair above it: one
  # route keeps one pair, so the section always holds two filters.
  filter_sections:
  - name: Community filters
    icon: mdi:filter-variant
    color: teal
    description: The taxonomic slice of every tile on this tab
  grid_sections:
  - name: Community at a glance
    icon: mdi:counter
    color: teal
    description: Distinct taxa at each rank over the samples in view
  - name: Composition
    icon: mdi:chart-bar
    color: teal
    description: What each group, then each sample, is made of
  - name: Taxonomic structure
    icon: mdi:chart-donut
    color: teal
    description: The same abundances read as a hierarchy, kingdom to class
  - name: Set overlap
    icon: mdi:set-merge
    color: teal
    description: Which taxa the groups share, and which only one group holds
  - name: Tables
    icon: mdi:table
    color: gray
    description: The relative abundance table behind the tiles above
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      What the samples are made of, from the taxonomic classification of each ASV. The bars
      give each group's composition, then each sample's, so a phylum that dominates one
      group reads as a block rather than an average. The sunburst reads the same abundances
      as a hierarchy, and the UpSet shows which taxa the groups share.
    tag: am-comm-intro
    index: comm-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: taxonomy_rel_abundance
    interactive_component_type: MultiSelect
    column_name: Kingdom
    column_type: object
    display:
      icon_name: mdi:bacteria
      custom_color: grape
    section: Community filters
    group: Taxonomy
    tag: am-comm-filter-kingdom
    index: comm-kingdom-filter
    title: Kingdom
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: taxonomy_rel_abundance
    interactive_component_type: MultiSelect
    column_name: Phylum
    column_type: object
    display:
      icon_name: mdi:bacteria-outline
      custom_color: grape
    section: Community filters
    group: Taxonomy
    tag: am-comm-filter-phylum
    index: comm-phylum-filter
    title: Phylum
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: interactive
