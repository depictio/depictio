tabs:
- title: Alpha Diversity
  subtitle: 'Within-sample richness, evenness and phylogenetic spread: rarefaction and per-group box plots'
  tab_order: 1
  tab_icon: mdi:chart-bell-curve
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 646b0f3c1e4a2d7f8e5b8cbe
  advanced_viz_controls: header
  # Sample and group scope come from the persistent `Sample filters` on the
  # main tab; this section only slices by the diversity values themselves.
  filter_sections:
  - name: Alpha filters
    icon: mdi:filter-variant
    color: orange
    description: Narrows the diversity tiles and the rarefaction curves by index value
  grid_sections:
  - name: Diversity at a glance
    icon: mdi:counter
    color: orange
    description: Four per-sample indices, each summarised the way its shape asks for
  - name: Rarefaction
    icon: mdi:chart-line
    color: grape
    description: Whether sequencing depth reached saturation
  - name: Per-{GROUP_COL_DISPLAY} comparison
    icon: mdi:scale-balance
    color: teal
    description: The same indices, contrasted between groups
  - name: Per-sample table
    icon: mdi:table
    color: gray
    description: The numbers behind the cards, one row per sample
    collapsed: true
  components:
  # A value slice, not a sample list: the link alpha_diversity_multi_canonical
  # -> rarefaction_canonical carries the surviving samples to the curves.
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: alpha_diversity_multi_canonical
    interactive_component_type: RangeSlider
    column_name: shannon
    column_type: float64
    display:
      title_size: md
      custom_color: '#F68B33'
      icon_name: mdi:chart-bell-curve
    title_align: left
    placement: left
    section: Alpha filters
    group: Alpha scope
    tag: interactive-alpha-shannon-range-4e7b19
    index: alpha-shannon-range
    layout:
      x: 0
      y: 0
      w: 1
      h: 3
