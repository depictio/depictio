main_dashboard:
  title: nf-core/ampliseq
  subtitle: MultiQC Analysis - Cutadapt & FastQC
  project_tag: Ampliseq Microbial Community Analysis
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc.png
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 646b0f3c1e4a2d7f8e5b8ca2
  # Encoding controls (metric, rank, colour-by) sit in each advanced-viz tile's
  # header instead of behind the settings icon. Repeated on every tab because
  # each tab is its own dashboard document.
  advanced_viz_controls: header
  # Persistent: these sample filters render in every tab's filter panel and the
  # values picked in them survive tab switches (cross-tab fan-out; see
  # FilterSectionSpec.persistent). `pin: top` keeps them above each tab's own
  # filters wherever the viewer lands. Both are bound to the metadata DC, the
  # source of every sample link in template.yaml, so one pick reaches every tab;
  # the tabs therefore carry no sample or group filter of their own.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  # Deliberately NOT persistent, and bound to multiqc_data rather than metadata:
  # a run without --metadata prunes the metadata DC and the persistent section
  # above goes with it. This one keeps the MultiQC tab filterable on that route.
  - name: MultiQC report
    icon: mdi:file-document-outline
    color: orange
    description: Fallback sample list, read from the MultiQC report itself
    collapsed: true
  # `Run at a glance` and `Sample sheet` are persistent and pinned to the top,
  # so the four run-size cards and the sample sheet open every tab of the
  # family. They are declared on the main tab rather than on an analysis tab on
  # purpose: a run with --skip_taxonomy prunes the taxonomic DCs,
  # _tab_meets_minimum then drops the Community tab, and a persistent section
  # declared there would disappear from the whole family with it.
  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: What the run is, in four numbers, on every tab
    persistent: true
    pin: top
  - name: QC overview
    icon: mdi:chart-box-outline
    color: teal
    description: Read yield and base quality for the whole run
  - name: QC details
    icon: mdi:file-document-outline
    color: gray
    description: The remaining FastQC and Cutadapt panels
    collapsed: true
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The sample sheet every other tab is filtered by
    collapsed: true
    persistent: true
    pin: top
  components:
  # Bound to metadata.{METADATA_ID_COL}, the source column of every sample link
  # in template.yaml, so the pick reaches every tab (MultiQC included, through
  # the metadata -> multiqc_data link). Pruned with the metadata DC on a run
  # without --metadata; the `MultiQC report` fallback below covers that route.
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: metadata
    interactive_component_type: MultiSelect
    column_name: '{METADATA_ID_COL}'
    column_type: object
    display:
      title_size: md
      custom_color: '#45B8AC'
      icon_name: mdi:flask
    title_align: left
    placement: left
    section: Sample filters
    group: Sample scope
    tag: interactive-multiqc-sample-filter-78c9c2
    index: multiqc-sample-filter
    layout:
      x: 0
      y: 0
      w: 1
      h: 3
    title: Sample ID
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: metadata
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      title_size: md
      custom_color: '#984EA3'
      icon_name: mdi:earth
    title_align: left
    placement: left
    section: Sample filters
    group: Sample scope
    tag: interactive-multiqc-habitat-filter-d8ca83
    index: multiqc-habitat-filter
    layout:
      x: 0
      y: 3
      w: 1
      h: 2
    title: '{GROUP_COL_DISPLAY}'
  # Bound to the always-present multiqc_data DC (sample options come from the
  # ingested sample list) so the MultiQC tab keeps a working sample filter on a
  # run without --metadata. _resolve_multiqc_sample_filter expands the picked
  # sample to its per-report variants when filtering the plots.
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: multiqc_data
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      title_size: md
      custom_color: '#45B8AC'
      icon_name: mdi:flask
    title_align: left
    placement: left
    section: MultiQC report
    tag: interactive-mqc-sample-filter-5c1e07
    index: mqc-sample-filter
    layout:
      x: 0
      y: 5
      w: 1
      h: 3
    title: Sample ID (MultiQC)
  # Run at a glance: run size and design, no text. Samples and groups read the
  # metadata DC; phyla and Shannon read the taxonomy and alpha-diversity DCs,
  # which the persistent sample filter reaches through the project links.
