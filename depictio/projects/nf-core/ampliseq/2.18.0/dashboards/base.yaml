    title: What the samples are made of
    body: The bar chart ranks the 15 most abundant phyla by mean relative abundance in each group. The stacked view below breaks the same numbers down sample by sample, so a phylum that dominates one group but is absent elsewhere reads as a block rather than as an average.
  - component_type: figure
    workflow_tag: ampliseq
    data_collection_tag: taxonomy_rel_abundance
    use: qiime2/rel_abundance
    visu_type: bar
    figure_params:
      color: Phylum
      facet_row: '{GROUP_COL}'
      labels:
        Phylum: Phylum
        mean_rel_abundance: Mean Relative Abundance
      title: Mean Relative Abundance by {GROUP_COL_DISPLAY}
      x: Phylum
      y: mean_rel_abundance
    mode: code
    code_content: |-
      # The axis this figure groups on: the dashboard's analysis groups when the
      # viewer has made some, else the pipeline's own {GROUP_COL_DISPLAY}. One
      # grouping axis, not two stacked on each other.
      grp_col = depictio_group_by[0] if depictio_group_by else '{GROUP_COL}'
      df_grp = df.with_columns(pl.col(grp_col).alias('_facet')) if grp_col in df.columns else df.with_columns(pl.lit('All samples').alias('_facet'))
      # Sorted so the panels come out in a stable order: px lays facets out in
      # order of first appearance, which otherwise follows the row order.
      # Top 15 phyla by run-wide mean abundance: a real run carries dozens, and
      # the long tail is what the stacked view and the sunburst are for.
      top = df_grp.group_by('Phylum').agg(pl.col('rel_abundance').mean().alias('m')).sort('m', descending=True).head(15)['Phylum']
      df_modified = (
          df_grp.filter(pl.col('Phylum').is_in(top.to_list()))
          .group_by(['_facet', 'Phylum'])
          .agg((pl.col('rel_abundance').mean() * 100).alias('mean_rel_abundance'))
          .sort('_facet')
      )
      # Bars run horizontally and the groups are columns, not rows: a phylum name
      # is long, so it belongs on the shared y axis where it is written once and
      # read level, rather than rotated under every band.
      colors = depictio_group_kwargs.get('color_discrete_map') or {}
      fig = px.bar(
          df_modified.to_pandas(),
          x='mean_rel_abundance', y='Phylum', color='_facet',
          color_discrete_map=colors,
          orientation='h',
          facet_col='_facet',
          title='Mean Relative Abundance by {GROUP_COL_DISPLAY}',
          labels={'Phylum': 'Phylum', 'mean_rel_abundance': 'Mean relative abundance (%)'},
      )
      # Most abundant at the top, so the tile opens on what carries the community.
      fig.update_yaxes(categoryorder='total ascending', tickfont={'size': 9})
      fig.for_each_annotation(lambda a: a.update(text=a.text.split('=')[-1]))
      fig.update_layout(showlegend=False)
