main_dashboard:
  title: nf-core/ampliseq
  subtitle: MultiQC Analysis - Cutadapt & FastQC
  project_tag: Ampliseq Microbial Community Analysis
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc.png
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 646b0f3c1e4a2d7f8e5b8ca2
  # Persistent: these sample filters render in every tab's filter panel and the
  # values picked in them survive tab switches (cross-tab fan-out; see
  # FilterSectionSpec.persistent). `pin: top` keeps them above each tab's own
  # filters wherever the viewer lands.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  # `Sample metadata` is persistent and pinned to the bottom, so the sample
  # sheet and its four summary cards trail every tab of the family. It is
  # declared on the main tab rather than on an analysis tab on purpose: a run
  # with --skip_taxonomy prunes the taxonomic DCs, _tab_meets_minimum then drops
  # the Community tab, and a persistent section declared there would disappear
  # from the whole family with it.
  grid_sections:
  - name: QC overview
    icon: mdi:chart-box-outline
    color: teal
    description: Read yield and base quality for the whole run
  - name: QC details
    icon: mdi:file-document-outline
    color: gray
    description: The remaining FastQC and Cutadapt panels
    collapsed: true
  - name: Sample metadata
    icon: mdi:table-account
    color: teal
    description: The sample sheet every other tab is filtered by
    collapsed: true
    persistent: true
    pin: top
  components:
  # Bound to the always-present multiqc_data DC (sample options come from the
  # ingested sample list) so the MultiQC tab keeps a working sample filter on
  # every route — the metadata DC that would otherwise back it is pruned on
  # no-metadata runs. _resolve_multiqc_sample_filter expands the picked sample
  # to its per-report variants when filtering the plots.
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: multiqc_data
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      title_size: md
      custom_color: '#45B8AC'
      icon_name: mdi:flask
    title_align: left
    placement: left
    section: Sample filters
    group: Sample scope
    tag: interactive-multiqc-sample-filter-78c9c2
    index: multiqc-sample-filter
    layout:
      x: 0
      y: 0
      w: 1
      h: 3
    title: Sample ID
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: metadata
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      title_size: md
      custom_color: '#984EA3'
      icon_name: mdi:earth
    title_align: left
    placement: left
    section: Sample filters
    group: Sample scope
    tag: interactive-multiqc-habitat-filter-d8ca83
    index: multiqc-habitat-filter
    layout:
      x: 0
      y: 3
      w: 1
      h: 2
    title: '{GROUP_COL_DISPLAY}'
  - component_type: text
    workflow_tag: ampliseq
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    section: QC overview
    body: 'MultiQC aggregates the per-sample FastQC and Cutadapt reports for this run. The four panels here answer the questions asked first: how many reads survived trimming, how evenly they are spread across samples, and whether base quality holds to the end of the read. The remaining ten panels are folded into *QC details* below. Pick a sample on the left to narrow every panel at once.'
    tag: text-multiqc-section-header-47c567
    index: multiqc-section-header
    layout:
      x: 0
      y: 0
      w: 8
      h: 2
    title: Run quality at a glance
  - component_type: multiqc
    workflow_tag: ampliseq
    data_collection_tag: multiqc_data
    selected_module: general_stats
    selected_plot: general_stats
    title_size: sm
    title_align: left
    section: QC overview
    tag: multiqc-general_stats_general_stats-7998d9
    layout:
      x: 0
      y: 2
      w: 8
      h: 5
  - component_type: multiqc
    workflow_tag: ampliseq
    data_collection_tag: multiqc_data
    selected_module: cutadapt
    selected_plot: Filtered Reads
    # Catalog provenance: this plot is a known MultiQC output, so say which one.
    # `_lite_to_stored` derives `catalog_source` from the handle, which is what
    # puts the catalog badge and the origin block on the tile.
    use: multiqc/cutadapt
    title_size: sm
    title_align: left
    section: QC overview
    tag: multiqc-cutadapt_filtered-reads-d421ae
    layout:
      x: 0
      y: 7
