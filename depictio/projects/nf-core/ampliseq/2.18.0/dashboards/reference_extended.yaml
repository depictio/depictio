      How to read: a block that is long in one bar and short in another is a phylum that differs between groups. Read the lengths and not the colours when two groups look alike. Open [Differential Abundance](tab:Differential Abundance) to test which differences hold.

      Note: pooling the samples of a group hides how much they vary, and the per-sample bars below show it. The phylum colours are the same as on the per-sample bars and the tree.'
