      How to read: solid bars clear the significance cut-off and hatched bars do not, so only solid bars are calls. Long solid bars at either end are the taxa to check first. A panel of hatched bars means large changes without statistical support.

      Lines and annotations: a line at zero separates higher from lower abundance. Solid against hatched applies the q-value cut-off of 0.05, the level ampliseq passes to ANCOM-BC, and no other cut-off line is drawn. Bar labels are the taxon names, cut at 24 characters (hover for the whole name).

      Sources: ANCOM-BC, Lin and Peddada 2020, https://doi.org/10.1038/s41467-020-17041-7; ampliseq ANCOM-BC settings, https://github.com/nf-core/ampliseq/blob/2.18.0/conf/modules.config

