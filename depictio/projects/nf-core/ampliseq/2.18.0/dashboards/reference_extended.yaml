    visu_type: bar
    figure_params:
      color: Phylum
      labels:
        sample: Sample
      title: Relative composition by phylum (per sample)
      x: sample
      y: rel
    mode: code
    code_content: "# Spread into the keys so the annotation survives the aggregation, and read\n# back below as a facet. Deduplicated: the handed-over column may be one\n# the figure already groups by, and polars refuses a repeated key.\n# back below as a facet: the colour here is already spoken for by Phylum.\ndf_g = df.group_by(list(dict.fromkeys([*depictio_group_by, 'sample', 'Phylum']))).agg(pl.col('count').sum().alias('count'))\ndf_g = df_g.with_columns((pl.col('count') / pl.col('count').sum().over('sample') * 100).alias('rel'))\nfig = px.bar(\n    df_g.sort(['sample', 'Phylum']).to_pandas(),\n    x='sample', y='rel', color='Phylum',\n    facet_col=depictio_group_by[0] if depictio_group_by else None,\n    title='Relative composition by phylum (per sample)',\n    labels={'sample': 'Sample', 'rel': 'Relative abundance (%)', 'Phylum': 'Phylum'},\n)\nfig.update_layout(barmode='stack', yaxis_range=[0, 100])\nfig.update_xaxes(tickangle=-45)"
