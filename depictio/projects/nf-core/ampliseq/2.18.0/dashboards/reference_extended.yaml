      x: sample
      y: count
    mode: code
    code_content: "df_g = df.group_by(list(dict.fromkeys([*depictio_group_by, 'sample', 'Genus']))).agg(pl.col('count').sum().alias('count')).sort(['sample', 'Genus'])\nfig = px.bar(\n    df_g.to_pandas(),\n    x='sample', y='count', color='Genus',\n    facet_col=depictio_group_by[0] if depictio_group_by else None,\n    title='Genus-level composition (per sample)',\n    labels={'sample': 'Sample', 'count': 'Reconstructed count', 'Genus': 'Genus'},\n)\nfig.update_layout(barmode='stack')\nfig.update_xaxes(tickangle=-45)"
    selection_enabled: false
    title_size: sm
    title_align: left
    section: Composition
    tag: figure-bar_sidle_genus-9a1c55
    description: Deeper taxonomic resolution than phylum — genus-level counts per sample (Unclassified where the lineage stops short).
