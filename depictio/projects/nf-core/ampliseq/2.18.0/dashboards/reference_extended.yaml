      How to read: a wide arc is a dominant taxon, and many thin arcs under one phylum mean a diverse phylum. Hover an arc for its share of the whole and of its parent. Each sample weighs the same, since its abundances are relative.

      Note: no minimum arc share hides the rare taxa here, so the long tail of thin arcs can be hard to read; hover to read them.'
