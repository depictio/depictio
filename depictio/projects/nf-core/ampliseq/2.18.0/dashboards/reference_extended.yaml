  - component_type: figure
    workflow_tag: ampliseq
    data_collection_tag: sidle_reconstructed
    use: sidle/reconstructed
    visu_type: bar
    mode: code
    code_content: '# Each sample''s reconstructed community by phylum, as shares of its reads.

      # Grouped by Analysis mode''s groups too, so they can facet the bars.

      d = df.group_by([*depictio_group_by, ''sample'', ''Phylum'']).agg(pl.col(''count'').sum().alias(''count''))

      d = d.with_columns((pl.col(''count'') / pl.col(''count'').sum().over(''sample'') * 100).alias(''share'')).sort([''sample'', ''Phylum''])

      fig = px.bar(d.to_pandas(), x=''sample'', y=''share'', color=''Phylum'', facet_col=depictio_group_by[0] if depictio_group_by else None, color_discrete_map=depictio_category_colors.get(''Phylum'') or {}, labels={''sample'': '''', ''share'': ''Share of reads (%)''})

      fig.update_layout(barmode=''stack'', yaxis_range=[0, 100])

      fig.update_xaxes(tickangle=-45)'
    section: Composition
    tag: am-sidle-composition
    index: sidle-composition
    title: Phylum composition per sample
    description: 'What does the community rebuilt across regions contain? One bar per sample, split into the shares of its reconstructed reads that SIDLE assigns to each phylum. Every bar is scaled to 100%, and the bars are split by group when Analysis mode defines one.

      How to read: samples with a similar stack share a community, and a sample whose stack differs from its neighbours stands out. A large Unclassified block means the regions could not be resolved to a phylum for that share of reads. Open the genus bars to go one rank deeper.

      Source: SIDLE documentation, https://q2-sidle.readthedocs.io; Fuks et al. 2018, https://doi.org/10.1186/s40168-017-0396-x'
    layout:
      x: 0
      y: 0
      w: 4
      h: 4
  - component_type: figure
    workflow_tag: ampliseq
    data_collection_tag: sidle_reconstructed
    use: sidle/reconstructed
    visu_type: bar
    mode: code
    code_content: '# The 15 most abundant genera by reconstructed count, the rest folded into

      # Other: a real run carries hundreds, which no legend can hold.

      top = df.group_by(''Genus'').agg(pl.col(''count'').sum().alias(''n'')).sort(''n'', descending=True).head(15)[''Genus''].to_list()

      d = df.with_columns(pl.when(pl.col(''Genus'').is_in(top)).then(pl.col(''Genus'')).otherwise(pl.lit(''Other'')).alias(''Genus''))

      d = d.group_by([*depictio_group_by, ''sample'', ''Genus'']).agg(pl.col(''count'').sum().alias(''count'')).sort([''sample'', ''Genus''])

      fig = px.bar(d.to_pandas(), x=''sample'', y=''count'', color=''Genus'', facet_col=depictio_group_by[0] if depictio_group_by else None, labels={''sample'': '''', ''count'': ''Reconstructed count''})

      fig.update_layout(barmode=''stack'')

      fig.update_xaxes(tickangle=-45)'
    section: Composition
    tag: am-sidle-genus
    index: sidle-genus
    title: Genus composition per sample
    description: 'Which genera dominate each sample? One bar per sample, stacked by the 15 most abundant genera of the samples in view (by reconstructed count), with all other genera folded into Other. The bars are split by group when Analysis mode defines one.

      How to read: the height of a bar is the sample''s total reconstructed count, so a taller bar is a deeper sample and not a more diverse one. Compare the colours within a bar for the composition. Use the phylum bars to compare shares between samples of different depth.

      Note: a real run carries hundreds of genera, so the 15 shown are a display limit and not a statistical one.'
    layout:
      x: 4
      y: 0
      w: 4
      h: 4
  - component_type: figure
    workflow_tag: ampliseq
    data_collection_tag: sidle_reconstruction_qc
    use: sidle/reconstruction_qc
    visu_type: bar
    mode: code
    code_content: '# Features by the number of amplicon regions they were rebuilt from.

      d = df.group_by([*depictio_group_by, ''num_regions'']).agg(pl.len().alias(''features'')).sort(''num_regions'')

      fig = px.bar(d.to_pandas(), x=''num_regions'', y=''features'', text=''features'', facet_col=depictio_group_by[0] if depictio_group_by else None, labels={''num_regions'': ''Regions mapped'', ''features'': ''Reconstructed features''})

      fig.update_xaxes(dtick=1)

      fig.update_traces(textposition=''outside'')'
    section: Reconstruction QC
    tag: am-sidle-regions
    index: sidle-regions
    title: Features by regions mapped
    description: 'How many amplicon regions support each reconstructed feature? Each bar counts the features that SIDLE rebuilt from that number of regions, and the count is printed above the bar. The bars are split by group when Analysis mode defines one.

      How to read: most features rebuilt from several regions means the regions agree. A pile at one region is the weakest kind of support, since such a feature could be an artefact of that region. Open the support table below to list the features behind a bar.

      Lines and annotations: no reference line is drawn, and no minimum number of regions is applied here.

      Source: SIDLE documentation, https://q2-sidle.readthedocs.io; Fuks et al. 2018, https://doi.org/10.1186/s40168-017-0396-x'
    layout:
      x: 0
      y: 0
      w: 4
      h: 4
  - component_type: figure
    workflow_tag: ampliseq
    data_collection_tag: sidle_reconstruction_qc
    use: sidle/reconstruction_qc
    visu_type: scatter
    mode: code
    code_content: 'fig = px.scatter(df.to_pandas(), x=''num_regions'', y=''total_kmers_mapped'', size=''mean_kmer_per_region'', custom_data=[''feature_id''], hover_data=[''feature_id'', ''mean_kmer_per_region'', ''stdv_kmer_per_region''], labels={''num_regions'': ''Regions mapped'', ''total_kmers_mapped'': ''Total k-mers mapped''}, **depictio_group_kwargs)

      fig.update_xaxes(dtick=1)'
    selection_enabled: true
    selection_column: feature_id
    section: Reconstruction QC
    tag: am-sidle-kmers
    index: sidle-kmers
    title: K-mer support against regions mapped
    description: 'Is the k-mer evidence for a feature spread over several regions? Each point is one reconstructed feature, with the number of regions mapped on the x axis, the total k-mers mapped on y and the point size set by the mean k-mers per region. Points are coloured by group when Analysis mode defines one.

      How to read: features high on the plot and to the right have the most support, and points low at one region are the weakest. Select points to follow those features in the tables below. Compare features with the same x value, since the total sums the support over the regions.

      Lines and annotations: no reference line, zone or outlier flag is drawn, and no minimum support is applied. Weakly supported features are only visible as low points.

      Source: SIDLE documentation, https://q2-sidle.readthedocs.io; Fuks et al. 2018, https://doi.org/10.1186/s40168-017-0396-x'
    layout:
      x: 4
      y: 0
      w: 4
      h: 4
  - component_type: table
    workflow_tag: ampliseq
    data_collection_tag: sidle_reconstructed
    use: sidle/reconstructed
    row_selection_enabled: true
    row_selection_column: feature_id
    section: Tables
    tag: am-sidle-table-reconstructed
    index: sidle-reconstructed-table
    title: Reconstructed features per sample
    description: 'What did SIDLE reconstruct in each sample? One row per feature and sample with the reconstructed count and the lineage of the feature.

      How to read: filter on a phylum and sort on the count to find the dominant features of a sample. The support table gives the evidence behind each feature.'
    layout:
      x: 0
      y: 0
      w: 8
      h: 6
  - component_type: table
    workflow_tag: ampliseq
    data_collection_tag: sidle_reconstruction_qc
    use: sidle/reconstruction_qc
    row_selection_enabled: true
    row_selection_column: feature_id
    section: Tables
    tag: am-sidle-table-qc
    index: sidle-reconstruction-qc-table
    title: Reconstruction support per feature
    description: 'How well supported is each reconstructed feature? One row per feature with the regions mapped, the total k-mers mapped, the mean and spread of the k-mers per region and the per-region ASVs behind it.

      How to read: sort on regions mapped to bring the single-region features to the top, then check their k-mer support. A feature with few regions and few k-mers is the weakest kind of reconstruction.'
    layout:
      x: 0
      y: 6
      w: 8
      h: 6
