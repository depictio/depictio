      How to read: a tall bar for all groups together is the shared core, and tall single-group bars are phyla specific to one group. Few shared phyla means very different communities. An annotation track under the bars breaks each combination down by phylum.

      Lines and annotations: no reference line is drawn. Bars are sorted by size, largest first, and every combination of at least one phylum is shown.

      Source: Lex et al. 2014 (UpSet), https://doi.org/10.1109/TVCG.2014.2346248

