    body: The bar chart ranks phyla by mean relative abundance across the current selection. The stacked view below breaks the same numbers down sample by sample, so a phylum that dominates one group but is absent elsewhere reads as a block rather than as an average.
  - component_type: figure
    workflow_tag: ampliseq
    data_collection_tag: taxonomy_rel_abundance
    use: qiime2/rel_abundance
    visu_type: bar
    figure_params:
      color: Phylum
      facet_row: habitat
      labels:
        Phylum: Phylum
        mean_rel_abundance: Mean Relative Abundance
      title: Mean Relative Abundance by Habitat
      x: Phylum
      y: mean_rel_abundance
    mode: code
    code_content: "# The axis this figure groups on: the dashboard's analysis groups when the\n# viewer has made some, else the pipeline's own Habitat. One\n# grouping axis, not two stacked on each other.\ngrp_col = depictio_group_by[0] if depictio_group_by else 'habitat'\ndf_grp = df.with_columns(pl.col(grp_col).alias('_facet')) if grp_col in df.columns else df.with_columns(pl.lit('All samples').alias('_facet'))\n# Sorted so the panels come out in a stable order: px lays facets out in\n# order of first appearance, which otherwise follows the row order.\ndf_modified = df_grp.group_by(['_facet', 'Phylum']).agg(pl.col('rel_abundance').mean().alias('mean_rel_abundance')).sort('_facet')\n# Bars run horizontally and the groups are columns, not rows: a phylum name\n# is long, so it belongs on the shared y axis where it is written once and\n# read level, rather than rotated under every band.\ncolors = depictio_group_kwargs.get('color_discrete_map') or {}\nfig = px.bar(\n    df_modified.to_pandas(),\n\
      \    x='mean_rel_abundance', y='Phylum', color='_facet',\n    color_discrete_map=colors,\n    orientation='h',\n    facet_col='_facet',\n    title='Mean Relative Abundance by Habitat',\n    labels={'Phylum': 'Phylum', 'mean_rel_abundance': 'Mean Relative Abundance'},\n)\n# Most abundant at the top, so the tile opens on what carries the community.\nfig.update_yaxes(categoryorder='total ascending', tickfont={'size': 9})\nfig.for_each_annotation(lambda a: a.update(text=a.text.split('=')[-1]))\nfig.update_layout(showlegend=False)"
    selection_enabled: false
    title_size: sm
    title_align: left
