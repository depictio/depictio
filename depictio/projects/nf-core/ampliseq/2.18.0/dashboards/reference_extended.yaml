    description: 'How does the community of each sample break down? One bar per sample, split into the shares of the eight most abundant taxa at the chosen rank (phylum at first), with the rest folded into Other (grey). A strip above the bars marks the Habitat of each sample.

      How to read: samples with a similar stack share a community, and a sample whose stack differs from the rest of its group stands out. Sort the samples by one taxon to see its share change across them. A large Unclassified or Other block means the reference database named little at that rank.

      Lines and annotations: Other (grey) is the sum of all taxa below the top eight. When the Zoom switch crops the value axis, it starts above 0, the cut is marked `//` on the axis and a caption names where the axis starts. No reference line is drawn.

      Note: switch Zoom off to see the full bars.'
