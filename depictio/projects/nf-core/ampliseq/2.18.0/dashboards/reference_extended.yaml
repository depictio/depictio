    title: Tree of life
    description: 'Which lineages make up the community, and do the groups carry them in different shares? Each tip is one of the eight largest phyla, coloured by kingdom, with a dot whose area is its mean share of a sample''s reads. The strip of dots beside it gives the same share inside each Habitat group.

      How to read: a large dot is a dominant phylum, and dots of similar size across the strip mean the groups carry that phylum alike. A dot that shrinks or vanishes in one group means the phylum is found mostly elsewhere. Open [Phylogeny](tab:Phylogeny) for the tree of every ASV and [Differential Abundance](tab:Differential Abundance) to test the differences.

