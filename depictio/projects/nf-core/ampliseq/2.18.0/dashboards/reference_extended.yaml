    tag: am-diff-volcano
    index: adv-volcano
    title: Effect size against significance
    description: 'Which taxa differ between groups, by how much and how surely? Each point is one taxon in one contrast, with the log fold change on the x axis (right means more abundant than in the reference group) and the significance, as -log10 of the ANCOM-BC q-value, on y. Pink points are up and blue points down when they count as a hit, and the View switch adds an MA and a QQ plot.

      How to read: pink or blue points in the upper corners are the calls to follow up, and grey points are not significant or change too little. A point high on the plot but near zero on x is significant yet a small change, so read both axes. Pick a contrast in the filter first, then open the results table below for the exact values.

      Lines and annotations: the volcano draws dotted vertical lines at log fold change -1 and +1 and a dotted horizontal line at q = 0.05 on the -log10 scale; a point must clear both to be a hit, and the six strongest are labelled. The MA view draws dotted horizontal lines at -1 and +1, and the QQ view a dashed diagonal (the expected spread under no differences), a grey 95% envelope around it and the inflation factor lambda in the corner. The 0.05 is the significance level ampliseq passes to ANCOM-BC, and the effect cut-off of 1 is this tile''s own default.

      Sources: ANCOM-BC, Lin and Peddada 2020, https://doi.org/10.1038/s41467-020-17041-7; ampliseq ANCOM-BC settings, https://github.com/nf-core/ampliseq/blob/2.18.0/conf/modules.config

      Warning: the effect cut-off of 1 has no published source, it is a display default and not a validated cut-off.

      Note: the q-values use QIIME 2''s documented default adjustment, Holm, which ampliseq leaves unchanged. ANCOM-BC drops taxa seen in fewer than 10% of the samples and samples under 500 reads before testing, and assumes that fewer than about 25% of the taxa differ between groups.'
