- title: Alpha Diversity
  subtitle: How diverse is each sample, and was it sequenced deeply enough?
  tab_group: Diversity
  tab_order: 4
  tab_icon: mdi:chart-bell-curve
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 646b0f3c1e4a2d7f8e5b8cbe
  filter_sections:
  - name: Alpha filters
    icon: mdi:filter-variant
    color: grape
    description: Narrows the samples by their diversity, curves included
  grid_sections:
  - name: Diversity at a glance
    icon: mdi:counter
    color: grape
    description: The median of each index over the samples in view
  - name: Rarefaction
    icon: mdi:chart-line
    color: grape
    description: Whether each index levels off as sequencing depth grows
  - name: Group comparison
    icon: mdi:scale-balance
    color: grape
    description: Shannon diversity per sample, one box per group
  - name: Per-sample table
    icon: mdi:table
    color: gray
    description: Every index for every sample
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: 'Diversity within each sample, computed by [QIIME 2](https://qiime2.org) on the rarefied feature table: richness (observed ASVs), Shannon, phylogenetic spread (Faith''s PD) and evenness. The cards give each index''s median and spread across the samples in view. The rarefaction curves show whether a sample was sequenced deeply enough for an index to level off.

      '
    tag: am-alpha-intro
    index: alpha-intro
    layout:
      x: 0
      y: 0
      w: 8
      h: 2
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: alpha_diversity_multi_canonical
    interactive_component_type: RangeSlider
    column_name: shannon
    column_type: float64
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: pink
    section: Alpha filters
    tag: am-alpha-filter-shannon
    index: alpha-shannon-range
    title: Shannon diversity
    layout:
      x: 0
      y: 0
      w: 1
      h: 3
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: alpha_diversity_multi_canonical
    use: qiime2/alpha_diversity
    aggregation: median
    column_name: shannon
    column_type: float64
    aggregations:
    - box_plot_stats
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: grape
      caption: median, with its spread
      decimals: 2
    section: Diversity at a glance
    tag: am-alpha-card-shannon
    index: alpha-card-shannon
    title: Shannon
    description: Median Shannon entropy, richness and evenness in one number.
    layout:
      x: 0
      y: 0
      w: 2
      h: 2
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: alpha_diversity_multi_canonical
    use: qiime2/alpha_diversity
    aggregation: median
    column_name: observed_features
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:counter
      icon_color: violet
      caption: median, with its distribution
      decimals: 0
    section: Diversity at a glance
    tag: am-alpha-card-observed
    index: alpha-card-observed-features
    title: Observed ASVs
    description: Median number of ASVs seen in a sample, at the rarefaction depth.
    layout:
      x: 2
      y: 0
      w: 2
      h: 2
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: alpha_diversity_multi_canonical
    use: qiime2/alpha_diversity
    aggregation: median
    column_name: faith_pd
    column_type: float64
    aggregations:
    - box_plot_stats
    secondary_layout: box_plot
    display:
      icon_name: mdi:source-branch
      icon_color: indigo
      caption: median, with its spread
      decimals: 2
    section: Diversity at a glance
    tag: am-alpha-card-faith-pd
    index: alpha-card-faith-pd
    title: Faith PD
    description: Median phylogenetic diversity, the tree length a sample's ASVs span.
    layout:
      x: 4
      y: 0
      w: 2
      h: 2
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: alpha_diversity_multi_canonical
    use: qiime2/alpha_diversity
    aggregation: median
    column_name: evenness
    column_type: float64
    secondary_layout: gauge
    coverage_max: 1
    display:
      icon_name: mdi:scale-balance
      icon_color: pink
      caption: median, 0 to 1
      decimals: 2
    section: Diversity at a glance
    tag: am-alpha-card-evenness
    index: alpha-card-evenness
    title: Evenness
    description: Median Pielou evenness, from 0 (one ASV dominates) to 1 (all equal).
    layout:
      x: 6
      y: 0
      w: 2
      h: 2
  - component_type: advanced_viz
    workflow_tag: ampliseq
    use: qiime2/rarefaction
    data_collection_tag: rarefaction_canonical
    config:
      iter_col: iter
      group_col: habitat
      metric_options:
      - shannon
      - observed_features
      - faith_pd
      show_ci: true
    section: Rarefaction
    tag: am-alpha-rarefaction
    index: alpha-rarefaction-multi
    title: Rarefaction curves
    description: 'Has each sample been sequenced deeply enough to see its diversity? Each curve is one sample: the chosen index (Shannon, observed ASVs or Faith''s PD, switched in the controls) at each subsampling depth, coloured by Habitat. The whiskers show the spread between the random subsamples drawn at that depth.

      How to read: a curve that flattens means more reads would add little, while one still climbing at its last depth was cut short. Curves that level off at different heights differ in diversity, not in sequencing effort. Compare the groups in the box plot below once the curves have levelled.

      Lines and annotations: each curve joins the mean of the subsamples at every depth. The whiskers are plus or minus one standard error across those subsamples and can be switched off. The tile shows at most 60 samples by default (Top-N samples), and no cut-off is drawn.

      Source: nf-core/ampliseq output documentation, alpha rarefaction, which sets no numeric cut-off and reads a curve that does not become horizontal as too little sequencing depth, https://nf-co.re/ampliseq/2.18.0/docs/output

      Note: diversity is computed on data rarefied to the lowest read count of the samples, or to the depth set with --diversity_rarefaction_depth, which excludes samples below it.'
    layout:
      x: 0
      y: 0
      w: 8
      h: 6
  - component_type: figure
    workflow_tag: ampliseq
    data_collection_tag: alpha_diversity_multi_canonical
    use: qiime2/alpha_diversity
    visu_type: box
    mode: code
    code_content: '# Shannon per sample, one box per group: Analysis mode''s groups when it has

      # some, else the pipeline''s group column, in that column''s colours.

      grp = depictio_group_by[0] if depictio_group_by else ''habitat''

      colors = depictio_group_kwargs.get(''color_discrete_map'') or depictio_category_colors.get(''habitat'') or {}

      d = df if grp in df.columns else df.with_columns(pl.lit(''All samples'').alias(grp))

      d = d.filter(pl.col(''shannon'').is_not_null() & pl.col(grp).is_not_null()).sort(grp)

      fig = px.box(d.to_pandas(), x=grp, y=''shannon'', color=grp, color_discrete_map=colors, category_orders=depictio_group_kwargs.get(''category_orders'') or {}, points=''all'', hover_data=[''sample_id''], labels={grp: '''', ''shannon'': ''Shannon''})

      fig.update_layout(showlegend=False)'
    section: Group comparison
    tag: am-alpha-boxplot-by-group
    index: alpha-boxplot-by-group
    title: Shannon diversity per group
    description: 'Does Shannon diversity differ between groups? One box per Habitat group, with every sample drawn as a point over it. The groups follow Analysis mode when it defines some.

      How to read: boxes that sit apart with little overlap between their points suggest a difference, and overlapping boxes do not. With a handful of samples per group, trust the points over the box, since the quartiles of a few values move a lot. Open the rarefaction curves above to check that no group is simply undersequenced.

      Lines and annotations: the box runs from the first to the third quartile (linear method), with the median as the line inside it. The whiskers reach the furthest point within 1.5 times the interquartile range of the box. No reference line is drawn.

      Source: Plotly box trace reference, https://plotly.com/python/reference/box/

      Note: the boxes describe the samples, they do not test the difference between groups.'
    layout:
      x: 0
      y: 0
      w: 8
      h: 4
      fit: auto
  - component_type: table
    workflow_tag: ampliseq
    data_collection_tag: alpha_diversity_multi_canonical
    use: qiime2/alpha_diversity
    page_size: 12
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Per-sample table
    tag: am-alpha-table
    index: alpha-table-summary
    title: Alpha diversity per sample
    description: 'What are the diversity values behind the tiles above? One row per sample with its Shannon, observed ASVs, Faith''s PD and evenness, computed on the rarefied table.

      How to read: sort a column to find the extremes. A sample far from the others on every index is the first to check in the rarefaction curves.'
    layout:
      x: 0
      y: 0
      w: 8
      h: 6
- title: Ordination & Clustering
  subtitle: Which samples have similar communities?
  tab_group: Diversity
  tab_order: 5
  tab_icon: mdi:chart-scatter-plot-hexbin
  tab_icon_color: pink
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 646b0f3c1e4a2d7f8e5b8cc2
  filter_sections:
  - name: Ordination filters
    icon: mdi:filter-variant
    color: pink
    description: Kingdom and Phylum narrow the rows of the abundance heatmap
  grid_sections:
  - name: Ordination at a glance
    icon: mdi:counter
    color: pink
    description: How many samples were placed, and how much the groups explain
  - name: Sample relationships
    icon: mdi:chart-scatter-plot
    color: pink
    description: The PCoA projection beside the distances it was computed from
  - name: Clustered abundance
    icon: mdi:chart-box-outline
    color: pink
    description: Phyla against samples, both axes clustered
  components:
  - component_type: text
    order: 1
    body: 'Beta diversity: how different the communities of two samples are. The PCoA places each sample so that the closer two points sit, the more alike their communities, and the Bray-Curtis matrix beside it holds the distances it was drawn from. When the run tested it, PERMANOVA says how much of that variation the grouping explains.

      '
    tag: am-ord-intro
    index: ord-intro
    layout:
      x: 0
      y: 0
      w: 8
      h: 2
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: complex_heatmap_canonical
    interactive_component_type: MultiSelect
    column_name: Kingdom
    column_type: object
    display:
      icon_name: mdi:bacteria
      custom_color: grape
    section: Ordination filters
    tag: am-ord-filter-kingdom
    index: ord-kingdom-filter
    title: Kingdom
    layout:
      x: 0
      y: 0
      w: 1
      h: 3
  - component_type: interactive
    workflow_tag: ampliseq
    data_collection_tag: complex_heatmap_canonical
    interactive_component_type: MultiSelect
    column_name: Phylum
    column_type: object
    display:
      icon_name: mdi:bacteria-outline
      custom_color: grape
    section: Ordination filters
    tag: am-ord-filter-phylum
    index: ord-phylum-filter
    title: Phylum
    layout:
      x: 0
      y: 3
      w: 1
      h: 3
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: embedding_pcoa
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: donut
    breakdown_col: habitat
    display:
      icon_name: mdi:flask-outline
      icon_color: violet
      caption: one point each, by Habitat
    section: Ordination at a glance
    tag: am-ord-card-samples
    index: ord-card-samples
    title: Samples in the PCoA
    description: Samples below the rarefaction depth are left out of the ordination.
    layout:
      x: 0
      y: 0
      w: 4
      h: 2
  - component_type: card
    workflow_tag: ampliseq
    data_collection_tag: beta_adonis
    aggregation: max
    column_name: r2
    column_type: float64
    filter_expr: col('metric') == 'bray_curtis'
    secondary_layout: gauge
    coverage_max: 1
    display:
      icon_name: mdi:sigma
      icon_color: pink
      caption: share of the Bray-Curtis variation
      format: percent
    section: Ordination at a glance
    tag: am-ord-card-permanova
    index: ord-card-permanova
    title: PERMANOVA R² of Habitat
    description: Share of the Bray-Curtis variation that Habitat explains, over all samples.
    layout:
      x: 4
      y: 0
      w: 4
      h: 2
  - component_type: advanced_viz
    workflow_tag: ampliseq
    viz_kind: embedding
    data_collection_tag: embedding_pcoa
    use: qiime2/embedding
    config:
      viz_kind: embedding
      sample_id_col: sample_id
      dim_1_col: dim_1
      dim_2_col: dim_2
      color_col: habitat
      show_density: false
      axis_prefix: PCo
      selection_enabled: true
    section: Sample relationships
    tag: am-ord-embedding
    index: ord-embedding
    title: Sample ordination (PCoA, Bray-Curtis)
    description: 'Which samples have similar communities, and do the groups separate? Each point is one sample, placed so that the closer two points sit, the more alike their Bray-Curtis profiles, and coloured by Habitat. The axes are the first two principal coordinates, PCo1 and PCo2.

      How to read: points of one colour that sit together and apart from the others mean the grouping shapes the community, while mixed colours mean it does not. An isolated point is a sample unlike the rest, worth checking in the sample sheet. Draw a lasso around points to turn them into an analysis group for the other tiles.

      Lines and annotations: no reference line is drawn. The axes carry no units and the share of variation each holds is not printed. Filled density contours and a centroid per group can be switched on in the controls and are off at first.

      Source: Bray and Curtis 1957, https://doi.org/10.2307/1942268

      Note: the distances are computed by this dashboard from the phylum-level relative abundance table, not read from the QIIME 2 beta-diversity output, so they can differ from the pipeline''s own matrices.'
    layout:
      x: 0
      y: 0
      w: 4
      h: 6
  - component_type: advanced_viz
    workflow_tag: ampliseq
    use: qiime2/distance_heatmap
    data_collection_tag: bray_curtis_canonical
    config:
      viz_kind: complex_heatmap
      matrix_wf_id: 646b0f3c1e4a2d7f8e5b8ca3
      matrix_dc_id: 646b0f3c1e4a2d7f8e5b8cd9
      index_column: sample
      row_annotation_cols: []
      cluster_rows: true
      cluster_cols: true
      cluster_method: ward
      cluster_metric: euclidean
      normalize: none
      colorscale: Blues
      col_annotation_cols:
      - habitat
    section: Sample relationships
    tag: am-ord-bray-curtis
    index: ord-bray-curtis
    title: Sample distances (Bray-Curtis)
    description: 'How different is every pair of samples? Each cell is the Bray-Curtis dissimilarity between the sample of its row and the sample of its column, from 0 for identical profiles to 1 for none shared. Rows and columns are reordered by hierarchical clustering so that similar samples sit together.

      How to read: pale blocks along the diagonal are groups of similar samples, and dark cells mark the pairs that differ most. The dendrograms show how the clusters nest. Compare the clusters with the groups in the PCoA beside it.

      Lines and annotations: the dendrograms above and to the left join the most similar samples first, using Ward linkage on the Euclidean distance between matrix rows. The colour runs from pale (small distance) to dark blue (large distance). No cut-off is drawn.

      Sources: Bray and Curtis 1957, https://doi.org/10.2307/1942268; Ward 1963, https://doi.org/10.1080/01621459.1963.10500845

      Note: the distances are computed by this dashboard from the phylum-level relative abundance table, so they can differ from the QIIME 2 matrices of the pipeline.'
    layout:
      x: 4
      y: 0
      w: 4
      h: 5
  - component_type: advanced_viz
    workflow_tag: ampliseq
    use: qiime2/abundance_heatmap
    data_collection_tag: complex_heatmap_canonical
    config:
      viz_kind: complex_heatmap
      matrix_wf_id: 646b0f3c1e4a2d7f8e5b8ca3
      matrix_dc_id: 646b0f3c1e4a2d7f8e5b8cd2
      index_column: Phylum
      row_annotation_cols:
      - Kingdom
      cluster_rows: true
      cluster_cols: true
      cluster_method: ward
      cluster_metric: euclidean
      normalize: row_z
      col_annotation_cols:
      - habitat
    section: Clustered abundance
    tag: am-ord-abundance-heatmap
    index: ord-complex-heatmap
    title: Phylum abundance across samples (clustered)
    description: 'Which phyla rise and fall together across the samples? Each row is a phylum and each column a sample, and the colour is the relative abundance of the phylum in that sample, standardised within its row. A coloured strip marks the kingdom of each phylum.

      How to read: red cells mean the phylum is more abundant in that sample than in the others, blue cells less. Columns that cluster together share a community profile, and rows that cluster together vary together. Open [Community & Diversity](tab:Community & Diversity) for the absolute shares.

      Lines and annotations: each row is a z-score (its mean subtracted, divided by its standard deviation), so colour compares samples within one phylum and not phyla with each other. The dendrograms use Ward linkage on the Euclidean distance. The scale is diverging, from blue (low) through white to red (high), and no cut-off is drawn.

      Source: Ward 1963, https://doi.org/10.1080/01621459.1963.10500845'
    layout:
      x: 0
      y: 0
      w: 8
      h: 5
