    body: '[MultiQC](https://multiqc.info) gathers the per-sample [FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/) and [Cutadapt](https://cutadapt.readthedocs.io) reports. Read how many reads survived primer trimming, how evenly they spread across samples, and whether base quality holds to the end of the read.

