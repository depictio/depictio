      x: num_regions
      y: features
    mode: code
    code_content: "df_g = df.group_by(list(dict.fromkeys([*depictio_group_by, 'num_regions']))).agg(pl.len().alias('features')).sort('num_regions')\nfig = px.bar(\n    df_g.to_pandas(),\n    x='num_regions', y='features', text='features',\n    facet_col=depictio_group_by[0] if depictio_group_by else None,\n    title='Cross-region support (features by regions mapped)',\n    labels={'num_regions': '# regions mapped', 'features': 'Reconstructed features'},\n)\nfig.update_xaxes(dtick=1)\nfig.update_traces(textposition='outside')"
    selection_enabled: false
    title_size: sm
    title_align: left
    section: Reconstruction QC
    tag: figure-bar_sidle_confidence-9a1c54
    description: How many of the amplified 16S regions each feature was reconstructed from — the core SIDLE confidence signal.
