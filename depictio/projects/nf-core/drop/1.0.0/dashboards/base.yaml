    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: drop
    data_collection_tag: splicing_outliers
    visu_type: bar
    mode: code
    code_content: |-
      hits = df.filter(pl.col('nominal'))
      per = hits.group_by('sample', 'status').agg(pl.col('gene_name').n_unique().alias('genes'))
      order = per.group_by('sample').agg(pl.col('genes').sum().alias('total')).sort(['total', 'sample'], descending=[True, False]).head(15)['sample'].to_list()
      per = per.filter(pl.col('sample').is_in(order))
      fig = px.bar(per.to_pandas(), y='sample', x='genes', color='status', orientation='h', color_discrete_map=depictio_category_colors.get('status') or {}, category_orders={'sample': order, 'status': ['called (adjusted p)', 'nominal p only']}, labels={'sample': 'Sample', 'genes': 'Genes at the raw p-value', 'status': 'Status'})
