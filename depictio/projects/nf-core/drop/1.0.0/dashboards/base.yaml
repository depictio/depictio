    data_collection_tag: splicing_outliers
    viz_kind: volcano
    config:
      viz_kind: volcano
      feature_id_col: call_id
      label_col: gene_name
      hover_col: sample
      category_col: status
      effect_size_col: delta_psi
      significance_col: p_value
      p_value_col: p_value
      avg_log_intensity_col: avg_log_reads
      significance_threshold: 0.05
      effect_threshold: 0.1
      top_n_labels: 8
      show_labels: true
      effect_label: Change in junction usage (delta PSI)
      significance_label: -log10 p-value (raw)
      view: volcano
      views: [volcano, ma]
    section: Volcano
    tag: dr-as-volcano
    index: dr-as-volcano
    title: 'FRASER: p-value against delta PSI'
    description: The raw p-value of each junction, since a small run has no adjusted one under the cut-off. The horizontal dashed line is p = 0.05, the default raw p-value at or below which a row counts as a nominal hit. The two vertical dotted lines are at delta PSI of -0.1 and 0.1, a shift of 10 percentage points in the usage of the junction, a reading guide of this dashboard and below the {AS_MIN_DPSI} that a FRASER call here requires (together with a gene-level adjusted p of {AS_PADJ} or less). A red point is a call (adjusted p), an orange one a nominal hit that corrected testing does not support. Each point is a gene in a sample, at its most significant junction.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: drop
    data_collection_tag: splicing_outliers
    visu_type: bar
    mode: code
    code_content: |-
      # Hits per sample, split by the direction of the change; the number at the end of a bar is its total, with the calls that also pass the adjusted p-value.
      hits = df.filter(pl.col('nominal'))
      per = hits.group_by('sample', 'direction').agg(pl.col('gene_name').n_unique().alias('hits'))
      tot = per.group_by('sample').agg(pl.col('hits').sum().alias('total')).sort(['total', 'sample'], descending=[True, False]).head(15)
      order = tot['sample'].to_list()
      per = per.filter(pl.col('sample').is_in(order))
      calls = hits.filter(pl.col('significant')).group_by('sample').agg(pl.col('gene_name').n_unique().alias('n'))
      called = dict(zip(calls['sample'].to_list(), calls['n'].to_list()))
      fig = px.bar(per.to_pandas(), y='sample', x='hits', color='direction', orientation='h', color_discrete_map=depictio_category_colors.get('direction') or {}, category_orders={'sample': order, 'direction': ['more usage', 'less usage']}, labels={'sample': 'Sample', 'hits': 'Genes at the raw p-value', 'direction': ''})
      for s, n in zip(order, tot['total'].to_list()):
          fig.add_annotation(x=n, y=s, text=str(n) + (' (%d called)' % called[s] if s in called else ''), xanchor='left', xshift=4, showarrow=False)
      fig.update_yaxes(automargin=True)
      fig.update_xaxes(dtick=1 if tot['total'].max() <= 8 else None, range=[0, float(tot['total'].max()) * 1.3])
      fig.update_layout(margin=dict(t=10), legend_title_text='', legend=dict(orientation='h', y=-0.2))
    section: Samples and effects
    tag: dr-as-per-sample
    index: as-per-sample
    title: Samples with the most hits
    description: 'Genes at a raw p-value of {NOMINAL_P} or less per sample, split by the direction of the change; the number at the end of a bar is its total, with the calls that pass the adjusted p-value.'
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: drop
    data_collection_tag: splicing_outliers
    visu_type: histogram
    mode: code
    code_content: |-
      calls = df.filter(pl.col('nominal') & pl.col('potential_impact').is_not_null())
      calls = calls.with_columns(pl.col('potential_impact').replace({'annotatedIntron_reducedUsage': 'intron used less', 'annotatedIntron_increasedUsage': 'intron used more', 'exonElongation': 'exon extended', 'exonTruncation': 'exon shortened'}).str.replace_all(r'([a-z])([A-Z])', '$1 $2').str.replace_all('_', ' ').str.to_lowercase().alias('effect'))
      cols = ['effect', 'status', 'genes', 'basis']
      nominal = calls.group_by('effect', 'status').len().rename({'len': 'genes'}).with_columns(pl.col('genes').cast(pl.Int64), pl.lit('Raw p-value (calls included)').alias('basis')).select(cols)
      called = calls.filter(pl.col('significant')).group_by('effect', 'status').len().rename({'len': 'genes'}).with_columns(pl.col('genes').cast(pl.Int64), pl.lit('Called (adjusted p)').alias('basis')).select(cols)
      none_called = called.height == 0
      if none_called:
          called = pl.DataFrame({'effect': [nominal['effect'][0] if nominal.height else 'none'], 'status': ['called (adjusted p)'], 'genes': [0], 'basis': ['Called (adjusted p)']})
      both = pl.concat([called, nominal.with_columns(pl.col('genes').cast(pl.Int64))])
      fig = px.bar(both.to_pandas(), y='effect', x='genes', color='status', facet_col='basis', orientation='h', barmode='stack', color_discrete_map=depictio_category_colors.get('status') or {}, category_orders={'basis': ['Called (adjusted p)', 'Raw p-value (calls included)'], 'status': ['called (adjusted p)', 'nominal p only']}, labels={'effect': 'Effect', 'genes': 'Genes', 'status': 'Status', 'basis': ''})
      fig.for_each_annotation(lambda a: a.update(text=a.text.split('=')[-1]))
      fig.update_yaxes(categoryorder='total ascending', automargin=True, title_text='')
      top = both.group_by('basis', 'effect').agg(pl.col('genes').sum().alias('n'))['n'].max() or 0
      fig.update_xaxes(title_text='Genes', dtick=1 if top <= 8 else None)
      if none_called:
          fig.add_annotation(text='No gene passes the adjusted cut-off', xref='x domain', yref='y domain', x=0.5, y=0.5, showarrow=False)
      fig.update_layout(margin=dict(t=30), legend_title_text='')
    section: Samples and effects
    tag: dr-as-impact
    index: as-impact
    title: What the hit junctions do
    description: 'FRASER''s reading of each hit junction against the transcript annotation: an annotated intron used less or more than in the cohort, or an exon extended or shortened. Two panels on one scale: the left counts only the calls, genes whose gene-level adjusted p is {AS_PADJ} or less with a delta PSI of {AS_MIN_DPSI} or more; the right counts every hit at the raw p-value of {NOMINAL_P} or less, the calls included, split into called and nominal only. A small run has no call, so the left panel is empty and the right one is the only reading; a nominal hit is a lead, since a share {NOMINAL_P} of the tests passes by chance.'
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: table
    workflow_tag: drop
    data_collection_tag: splicing_outliers
    row_selection_enabled: true
    row_selection_column: call_id
    section: Junction detail
    tag: dr-as-table
    index: as-table-calls
    title: FRASER results, strongest first
    description: One row per sample and gene at its most significant junction, sorted by raw p-value.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: drop
    data_collection_tag: splicing_outliers
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: call_id
      title_col: gene_name
      selection_source: any
      linked_component: dr-as-table
      sections:
        Call: [gene_name, sample, direction, '{GROUP_COL}']
        Junction: [locus, strand, psi_type, annotated_junction]
        Usage: [psi_value, delta_psi, split_reads, total_reads]
        Test: [p_value, padj, padj_gene]
        Effect: [potential_impact, causes_frameshift, hpo_match]
      link_templates:
        gene_name: https://www.genecards.org/cgi-bin/carddisp.pl?gene={value}
        locus: https://genome.ucsc.edu/cgi-bin/hgTracks?db={GENOME}&position={value}
    section: Junction detail
    tag: dr-as-record
    index: dr-as-record
    title: Junction record
    layout: {x: 5, y: 0, w: 3, h: 6}
- title: Mono-allelic
  subtitle: Which variants are read from one allele only?
  tab_group: Analyses
  tab_order: 4
  tab_icon: mdi:set-split
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Mono-allelic filters
    icon: mdi:filter-variant
    color: teal
    description: The call, and how unbalanced the reads are
  grid_sections:
  - name: Calls at a glance
    icon: mdi:counter
    color: teal
    description: Heterozygous variants tested, called mono-allelic, and how deep their reads are
  - name: Allelic imbalance
    icon: mdi:chart-scatter-plot
    color: teal
    description: Each variant's allelic ratio against the significance of the test for balanced expression
  - name: Variant detail
    icon: mdi:information-outline
    color: gray
    description: One row per sample and variant; pick one to read its counts and its test
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      A heterozygous variant should be read from both alleles about equally. DROP counts the RNA reads
      that carry each allele and tests the split against balanced expression, so a variant with nearly
      all its reads on one allele may mark a silenced or imprinted copy. Only samples with a DNA genotype
      take part, and a call needs an adjusted p-value of {MAE_PADJ} or less with at least {MAE_MIN_RATIO}
      of the reads on one allele.
    tag: dr-mae-intro
    index: mae-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: drop
    data_collection_tag: mae_variants
    interactive_component_type: MultiSelect
    column_name: call
    column_type: object
    display:
      icon_name: mdi:set-split
      custom_color: teal
    section: Mono-allelic filters
    tag: dr-mae-filter-call
    index: mae-call-filter
    title: Call
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: drop
    data_collection_tag: mae_variants
    interactive_component_type: RangeSlider
    column_name: alt_ratio
    column_type: float64
    display:
      icon_name: mdi:ruler
      custom_color: teal
    section: Mono-allelic filters
    tag: dr-mae-filter-ratio
    index: mae-ratio-filter
    title: Alternative allele share
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: drop
    data_collection_tag: mae_variants
    aggregation: count
    column_name: call_id
    column_type: object
    secondary_layout: donut
    breakdown_col: call
    display:
      icon_name: mdi:dna
      icon_color: teal.4
      caption: variants, by call
      decimals: 0
    section: Calls at a glance
    tag: dr-mae-card-tested
    index: mae-card-tested
    title: Variants tested
    description: Heterozygous SNVs with enough reads to test, one per sample and variant. The ring splits them by call.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: drop
    data_collection_tag: mae_variants
    aggregation: count
    column_name: call_id
    column_type: object
    filter_expr: col('mono_allelic')
    secondary_layout: composition
    breakdown_col: call
    display:
      icon_name: mdi:target
      icon_color: teal.6
      caption: calls, by the allele that is read
      decimals: 0
    section: Calls at a glance
    tag: dr-mae-card-calls
    index: mae-card-calls
    title: Mono-allelic calls
    description: Variants with an adjusted p-value of {MAE_PADJ} or less and one allele carrying {MAE_MIN_RATIO} or more of the reads.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: drop
    data_collection_tag: mae_variants
    aggregation: count
    column_name: call_id
    column_type: object
    filter_expr: col('mono_allelic') & col('rare')
    secondary_layout: composition
    breakdown_col: call
    display:
      icon_name: mdi:diamond-stone
      icon_color: teal.8
      caption: rare calls, by the allele that is read
      decimals: 0
    section: Calls at a glance
    tag: dr-mae-card-rare
    index: mae-card-rare
    title: Rare calls
    description: Mono-allelic variants that pass the run's population-frequency cut-offs, the ones worth reading first.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: drop
    data_collection_tag: mae_variants
    aggregation: median
    column_name: total_count
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:layers-outline
      icon_color: teal.9
      caption: median per variant, with its spread
      decimals: 0
    section: Calls at a glance
    tag: dr-mae-card-depth
    index: mae-card-depth
    title: Read depth
    description: RNA reads covering each variant. Thin coverage makes a call weak whatever its ratio.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: drop
    data_collection_tag: mae_variants
    viz_kind: volcano
    config:
      viz_kind: volcano
      feature_id_col: call_id
      label_col: gene_name
      hover_col: sample
      category_col: call
      effect_size_col: log2fc
      significance_col: p_value
      p_value_col: p_value
      avg_log_intensity_col: avg_log_count
      significance_threshold: 0.05
      effect_threshold: 2.0
      point_size: 12
      top_n_labels: 6
      show_labels: true
      effect_label: Log2 alternative over reference reads
      significance_label: -log10 p-value (raw)
      view: volcano
      views: [volcano, ma, qq]
    section: Allelic imbalance
    tag: dr-mae-volcano
    index: dr-mae-volcano
    title: 'MAE: p-value against allelic ratio'
    description: The raw p-value of each heterozygous variant, since a small run shares one adjusted p-value among most of them. The horizontal dashed line is p = 0.05, the usual raw significance level. The vertical dotted lines are at log2 of -2 and 2, where one allele is read four times as often as the other, an 80% share of the reads, the default for a call (this run requires {MAE_MIN_RATIO}, together with an adjusted p of {MAE_PADJ} or less). A red point leans to the alternative allele, a blue one to the reference.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: drop
    data_collection_tag: mae_variants
    row_selection_enabled: true
    row_selection_column: call_id
    section: Variant detail
    tag: dr-mae-table
    index: mae-table-variants
    title: Heterozygous variants
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: drop
    data_collection_tag: mae_variants
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: call_id
      title_col: gene_name
      selection_source: any
      linked_component: dr-mae-table
      sections:
        Variant: [gene_name, sample, locus, variant_id, ref_allele, alt_allele]
        Reads: [ref_count, alt_count, total_count, alt_ratio]
        Test: [p_value, padj, log2fc, call]
        Frequency: [rare, allele_frequency, max_population_af, cohort_frequency]
      link_templates:
        gene_name: https://www.genecards.org/cgi-bin/carddisp.pl?gene={value}
        locus: https://genome.ucsc.edu/cgi-bin/hgTracks?db={GENOME}&position={value}
    section: Variant detail
    tag: dr-mae-record
    index: dr-mae-record
    title: Variant record
    layout: {x: 5, y: 0, w: 3, h: 6}
# The navigator and the browser it drives share one screen. The axis carries the genes
# of every sample's triage list on one axis, the browser shows the alignments and
# genotypes of the samples in view on the locus the axis frames. It is the only
# browser of the template; the volcanoes reach it through the Open in genome browser
# action.
- title: Locus
  subtitle: Where on the genome do the called genes sit, and what do the reads show?
  tab_group: Analyses
  tab_order: 5
  tab_icon: mdi:map-search-outline
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Locus filters
    icon: mdi:filter-variant
    color: indigo
    description: How many analyses call the gene, and how strong the evidence is
  grid_sections:
  - name: Region at a glance
    icon: mdi:counter
    color: indigo
    description: What the region in view holds, recounted on every brush or locus entry
  - name: Genes on one axis
    icon: mdi:dna
    color: indigo
    description: The gene dots drive the browser below. A brush, a pan or a locus on the axis moves it, and its view comes back on the axis as a dashed band.
    # One screen: the axis and the browser it drives, compact headers with each
    # tile's kind, as the protein templates' linked views.
    display: linked
  components:
  - component_type: text
    order: 1
    body: >
      The genes of every sample's triage list as dots on one genome axis, coloured by the sample's
      analysis group like the tracks under it, with the reads and the genotypes of the samples in
      a genome browser. The tab opens on the best-supported gene and on the reads of its sample; type
      a locus in the axis header or brush the axis, and the browser and the cards follow. The
      number of analyses that call a gene is the filter on the left and the badge in the Candidates
      tab.
    tag: dr-loc-intro
    index: loc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: drop
    data_collection_tag: outlier_genes
    interactive_component_type: MultiSelect
    column_name: support
    column_type: object
    display:
      icon_name: mdi:layers-triple-outline
      custom_color: indigo
    section: Locus filters
    group: Region
    tag: dr-loc-filter-support
    index: loc-support-filter
    title: Called by
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: drop
    data_collection_tag: outlier_genes
    interactive_component_type: MultiSelect
    column_name: phenotype
    column_type: object
    display:
      icon_name: mdi:stethoscope
      custom_color: teal
    section: Locus filters
    group: Region
    tag: dr-loc-filter-phenotype
    index: loc-phenotype-filter
    title: Phenotype
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: drop
    data_collection_tag: outlier_genes
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: significance
    column_type: float64
    display:
      icon_name: mdi:check-decagram
      custom_color: red
    section: Locus filters
    group: Region
    tag: dr-loc-filter-score
    index: loc-score-range
    title: Evidence
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: drop
    data_collection_tag: outlier_genes
    aggregation: count
    column_name: call_id
    column_type: object
    secondary_layout: composition
    breakdown_col: support
    follow_region_filter: true
    display:
      icon_name: mdi:target
      icon_color: indigo.4
      caption: genes in a sample, by analyses that call them
      decimals: 0
    section: Region at a glance
    tag: dr-loc-card-genes-listed
    index: loc-card-listed
    title: Genes in the region
    description: Genes of the triage lists on the region in view, one per sample and gene.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: drop
    data_collection_tag: outlier_genes
    aggregation: nunique
    column_name: sample
    column_type: object
    secondary_layout: composition
    breakdown_col: '{GROUP_COL}'
    follow_region_filter: true
    display:
      icon_name: mdi:flask-outline
      icon_color: indigo.6
      caption: samples, by group
    section: Region at a glance
    tag: dr-loc-card-samples
    index: loc-card-samples
    title: Samples
    description: Samples with a listed gene on the region.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: drop
    data_collection_tag: outlier_genes
    aggregation: count
    column_name: call_id
    column_type: object
    filter_expr: col('n_analyses') >= 1
    secondary_layout: composition
    breakdown_col: called_in
    follow_region_filter: true
    display:
      icon_name: mdi:set-merge
      icon_color: indigo.8
      caption: called genes, by analyses
      decimals: 0
    section: Region at a glance
    tag: dr-loc-card-called
    index: loc-card-called
    title: Called genes
    description: Genes on the region that at least one analysis calls.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: drop
    data_collection_tag: outlier_genes
    aggregation: max
    column_name: significance
    column_type: float64
    secondary_layout: histogram
    follow_region_filter: true
    display:
      icon_name: mdi:check-decagram
      icon_color: indigo.9
      caption: strongest evidence, with the spread
      decimals: 1
    section: Region at a glance
    tag: dr-loc-card-score
    index: loc-card-score
    title: Strongest evidence
    description: Highest summed -log10 p-value of a gene on the region.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: drop
    data_collection_tag: outlier_genes
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      chr_col: chrom
      pos_col: start
      end_col: end
      score_col: significance
      feature_col: gene_name
      sample_col: sample
      category_col: '{GROUP_COL}'
      # One dot per gene at its start: a gene is a fraction of a pixel wide on a
      # chromosome, so an interval mark would vanish at the zoom the tab opens on.
      mark: point
      point_size: 11
      score_title: Summed -log10 p-value of the analyses
      opacity: 0.9
      assembly: '{GENOME}'
      # No default_region: `first` filters the whole first contig on load, the browser
      # follows it and every track shows "Force load". The browser opens on its locus_from
      # (the best-supported gene), and the axis opens on that window, then keeps it in view.
      region_filter_enabled: true
      open_on_view_window: true
      default_view: region
      follow_view_window: true
      # 5 Mb of context around the browser's window: framed at three times a gene's
      # width, the axis showed a single dot.
      follow_context_bp: 5000000
    section: Genes on one axis
    tag: dr-loc-navigator
    index: loc-navigator
    title: Genes on the genome
    description: Each dot is a gene of a sample's triage list, at its start. Its height is the summed -log10 p-value of the analyses that test it (higher is stronger evidence) and its colour the sample's analysis group, as in the browser below. The axis opens on the window around the best-supported gene; look for tall dots, and for dots of one group that sit together on a locus, which a technical effect makes more likely than a diagnosis. Zoom out to see the chromosome (Cmd or Ctrl and the wheel, or the pan mode in the header); the locus field and a brush move the browser.
    layout: {x: 0, y: 0, w: 8, h: 6}
  # No fixed location: the browser opens on the best-supported gene, and a brush on
  # the navigator moves it without filtering. No selection write-back here: a picked
  # track would narrow the genes to one sample and reframe the view.
  - component_type: jbrowse
    workflow_tag: drop
    data_collection_tag: tracks
    section: Genes on one axis
    # The reads and the genotypes of the strongest call's sample, then the reads of
    # one sample of each other group (the order of tracks.py).
    initial_tracks: 4
    max_tracks: 12
    show_overview: false
    # Follows the navigator's brush and its pan and zoom.
    follow_window: true
    # Splice arcs over the coverage of the BAMs.
    show_junctions: true
    # The samples of a group share a hue, as in the navigator's lanes.
    color_by: '{GROUP_COL}'
    # Common dbSNP sites and ClinVar under the genotypes, from UCSC.
    ucsc_tracks: [dbSnp155Common, clinvarMain]
    locus_from:
      data_collection_tag: outlier_genes
      chrom_column: chrom
      start_column: start
      end_column: end
      padding: 2000
      max_rows: 2000
      sort_by: significance
      descending: true
      label_column: gene_name
      sample_column: sample
      columns: [called_in, significance]
      search_columns: [gene_name]
