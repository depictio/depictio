- title: Expression
  subtitle: Which genes are expressed far from what the cohort predicts?
  tab_group: Analyses
  tab_order: 2
  tab_icon: mdi:chart-bell-curve
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Expression filters
    icon: mdi:filter-variant
    color: blue
    description: Direction and size of the departure from the expected count
  grid_sections:
  - name: Calls at a glance
    icon: mdi:counter
    color: blue
    description: Outlier calls, the samples that carry them, and how far they sit from the fit
  - name: Volcano
    icon: mdi:chart-scatter-plot
    color: blue
    description: Fold change against significance, one point per sample and gene
  - name: Samples and genes
    icon: mdi:chart-bar
    color: blue
    description: Which samples carry the hits, and the strongest genes with the samples that share them
  - name: Gene detail
    icon: mdi:information-outline
    color: gray
    description: One row per sample and gene; pick one to read its counts and its phenotype match
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [OUTRIDER](https://github.com/gagneurlab/OUTRIDER) fits an autoencoder to the gene counts of a
      group and calls a gene an outlier in a sample when its count sits far from the one the fit
      expects, in either direction: an adjusted p-value of {AE_PADJ} or less and an absolute z-score
      of {AE_MIN_Z} or more. The fit learns what is normal from the cohort, so it needs tens of
      samples (the Overview's cohort-size card checks it); a small run has too little power for any
      adjusted p-value to pass, so the tab also counts the nominal hits (raw p-value of {NOMINAL_P}
      or less), leads to check and not calls, since a share {NOMINAL_P} of tests passes by chance.
      Read the volcano first, then the samples with the most hits and the genes hit in several
      samples, and pick a gene to follow it through the other analyses.
    tag: dr-ae-intro
    index: ae-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: drop
    data_collection_tag: expression_outliers
    interactive_component_type: MultiSelect
    column_name: direction
    column_type: object
    display:
      icon_name: mdi:swap-vertical
      custom_color: blue
    section: Expression filters
    tag: dr-ae-filter-direction
    index: ae-direction-filter
    title: Call
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: drop
    data_collection_tag: expression_outliers
    interactive_component_type: RangeSlider
    column_name: abs_z_score
    column_type: float64
    display:
      icon_name: mdi:ruler
      custom_color: blue
    section: Expression filters
    tag: dr-ae-filter-z
    index: ae-z-filter
    title: Absolute z-score
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: drop
    data_collection_tag: expression_outliers
    aggregation: count
    column_name: call_id
    column_type: object
    filter_expr: col('significant')
    secondary_layout: composition
    breakdown_col: direction
    display:
      icon_name: mdi:target
      icon_color: blue.4
      caption: calls (adjusted p), by direction
      decimals: 0
    section: Calls at a glance
    tag: dr-ae-card-calls
    index: ae-card-calls
    title: Outlier calls
    description: Genes with an adjusted p-value of {AE_PADJ} or less and an absolute z-score of {AE_MIN_Z} or more in a sample (0 keeps every gene the run reported), one per sample and gene. A small run calls none, so read the nominal hits beside it.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: drop
    data_collection_tag: expression_outliers
    aggregation: count
    column_name: call_id
    column_type: object
    filter_expr: col('nominal')
    secondary_layout: composition
    breakdown_col: direction
    display:
      icon_name: mdi:magnify-scan
      icon_color: blue.6
      caption: hits at the raw p-value, by direction
      decimals: 0
    section: Calls at a glance
    tag: dr-ae-card-nominal
    index: ae-card-nominal
    title: Nominal hits
    description: Genes whose raw p-value is {NOMINAL_P} or less in a sample, the calls included. Not corrected for the number of genes tested, since a share {NOMINAL_P} of the tests passes by chance alone, so a count near that share of the genes tested is what chance gives. A lead to check, not a finding.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: drop
    data_collection_tag: expression_outliers
    aggregation: nunique
    column_name: sample
    column_type: object
    filter_expr: col('nominal')
    secondary_layout: composition
    breakdown_col: '{GROUP_COL}'
    display:
      icon_name: mdi:flask-outline
      icon_color: blue.8
      caption: samples with a hit, by group
    section: Calls at a glance
    tag: dr-ae-card-samples
    index: ae-card-samples
    title: Samples with a nominal hit
    description: Samples that carry at least one expression hit at the raw p-value.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: drop
    data_collection_tag: expression_outliers
    aggregation: max
    column_name: neg_log10_p
    column_type: float64
    filter_expr: col('nominal')
    secondary_layout: histogram
    display:
      icon_name: mdi:trending-up
      icon_color: blue.9
      caption: highest -log10 p, with the spread
      decimals: 1
    section: Calls at a glance
    tag: dr-ae-card-signal
    index: ae-card-signal
    title: Strongest signal
    description: The most extreme raw p-value of the genes in view, as -log10 p (2 is p = 0.01, 3 is p = 0.001).
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Gene symbols label the strongest points. The MA view needs the average
  # abundance. No QQ view: the recipe keeps the called rows and the most significant
  # rows of each sample, so the p-values are not a full sample of the tests.
  - component_type: advanced_viz
    workflow_tag: drop
    data_collection_tag: expression_outliers
    viz_kind: volcano
    config:
      viz_kind: volcano
      feature_id_col: call_id
      label_col: gene_name
      hover_col: sample
      category_col: status
      effect_size_col: l2fc
      significance_col: p_value
      p_value_col: p_value
      avg_log_intensity_col: avg_log_count
      significance_threshold: 0.05
      effect_threshold: 0.5
      top_n_labels: 8
      show_labels: true
      effect_label: Log2 fold change vs expected count
      significance_label: -log10 p-value (raw)
      view: volcano
      views: [volcano, ma]
    section: Volcano
    tag: dr-ae-volcano
    index: dr-ae-volcano
    title: 'OUTRIDER: p-value against fold change'
    description: The raw p-value, since a small run has no adjusted one under the cut-off. The horizontal dashed line is p = 0.05, the default raw p-value at or below which a row counts as a nominal hit. The two vertical dotted lines are at log2 fold changes of -0.5 and 0.5 (a 1.4-fold change either way), a reading guide of this dashboard and not a cut-off of OUTRIDER, whose calls rest on the adjusted p-value and the z-score ({AE_MIN_Z} or more here). A red point is a call (adjusted p), an orange one a nominal hit that corrected testing does not support. Each point is a gene in a sample.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: drop
    data_collection_tag: expression_outliers
    visu_type: bar
    mode: code
    code_content: |-
      # Hits per sample, split by the direction of the change; the number at the end of a bar is its total, with the calls that also pass the adjusted p-value.
      hits = df.filter(pl.col('nominal'))
      per = hits.group_by('sample', 'direction').agg(pl.col('gene_name').n_unique().alias('hits'))
      tot = per.group_by('sample').agg(pl.col('hits').sum().alias('total')).sort(['total', 'sample'], descending=[True, False]).head(15)
      order = tot['sample'].to_list()
      per = per.filter(pl.col('sample').is_in(order))
      calls = hits.filter(pl.col('significant')).group_by('sample').agg(pl.col('gene_name').n_unique().alias('n'))
      called = dict(zip(calls['sample'].to_list(), calls['n'].to_list()))
      fig = px.bar(per.to_pandas(), y='sample', x='hits', color='direction', orientation='h', color_discrete_map=depictio_category_colors.get('direction') or {}, category_orders={'sample': order, 'direction': ['over-expressed', 'under-expressed']}, labels={'sample': 'Sample', 'hits': 'Genes at the raw p-value', 'direction': ''})
      for s, n in zip(order, tot['total'].to_list()):
          fig.add_annotation(x=n, y=s, text=str(n) + (' (%d called)' % called[s] if s in called else ''), xanchor='left', xshift=4, showarrow=False)
      fig.update_yaxes(automargin=True)
      fig.update_xaxes(dtick=1 if tot['total'].max() <= 8 else None, range=[0, float(tot['total'].max()) * 1.3])
      fig.update_layout(margin=dict(t=10), legend_title_text='', legend=dict(orientation='h', y=-0.2))
    section: Samples and genes
    tag: dr-ae-per-sample
    index: ae-per-sample
    title: Samples with the most hits
    description: 'Genes at a raw p-value of {NOMINAL_P} or less per sample, split by the direction of the change; the number at the end of a bar is its total, with the calls that pass the adjusted p-value.'
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: drop
    data_collection_tag: expression_outliers
    visu_type: bar
    mode: code
    code_content: |-
      # The genes with the strongest hits in the samples in view: the bar is the best -log10 p-value of the gene, coloured by the direction of that hit, and the label says how many samples share it. Ranked by that count first, so a gene hit again and again leads. The genes are whatever the OUTRIDER table holds for the samples in view; none is named here.
      hits = df.filter(pl.col('nominal')).sort(['p_value', 'abs_z_score'], descending=[False, True], nulls_last=True)
      per = hits.group_by('gene_name', maintain_order=True).agg(pl.col('sample').n_unique().alias('samples'), pl.col('neg_log10_p').first().alias('strength'), pl.col('direction').first().alias('direction'))
      per = per.sort(['samples', 'strength', 'gene_name'], descending=[True, True, False]).head(15)
      order = per['gene_name'].to_list()
      notes = [str(n) + (' sample' if n == 1 else ' samples') for n in per['samples'].to_list()]
      fig = px.bar(per.to_pandas().assign(note=notes), y='gene_name', x='strength', color='direction', text='note', orientation='h', color_discrete_map=depictio_category_colors.get('direction') or {}, category_orders={'gene_name': order, 'direction': ['over-expressed', 'under-expressed']}, labels={'gene_name': 'Gene', 'strength': 'Strongest evidence (-log10 p-value)', 'direction': ''})
      fig.update_traces(textposition='outside', cliponaxis=False)
      fig.update_yaxes(automargin=True)
      fig.update_xaxes(range=[0, float(per['strength'].max()) * 1.3])
      fig.update_layout(margin=dict(t=10), legend_title_text='', legend=dict(orientation='h', y=-0.2))
    section: Samples and genes
    tag: dr-ae-recurrent
    index: ae-recurrent-genes
    title: Strongest genes, and how many samples share them
    description: 'The genes with the best raw p-value, coloured by direction and labelled with the samples that hit them; a gene hit in many samples is more often a technical artefact than a diagnosis.'
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: table
    workflow_tag: drop
    data_collection_tag: expression_outliers
    row_selection_enabled: true
    row_selection_column: call_id
    section: Gene detail
    tag: dr-ae-table
    index: ae-table-calls
    title: OUTRIDER results, strongest first
    description: One row per sample and gene, the calls and the nominal hits first, sorted by raw p-value.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: drop
    data_collection_tag: expression_outliers
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: call_id
      title_col: gene_name
      selection_source: any
      linked_component: dr-ae-table
      sections:
        Call: [gene_name, sample, direction, '{GROUP_COL}']
        Evidence: [z_score, l2fc, padj, p_value]
        Counts: [raw_count, expected_count, mean_count]
        Phenotype: [hpo_match, hpo_label_overlap]
        Position: [locus]
      link_templates:
        gene_name: https://www.genecards.org/cgi-bin/carddisp.pl?gene={value}
        locus: https://genome.ucsc.edu/cgi-bin/hgTracks?db={GENOME}&position={value}
    section: Gene detail
    tag: dr-ae-record
    index: dr-ae-record
    title: Call record
    layout: {x: 5, y: 0, w: 3, h: 6}
