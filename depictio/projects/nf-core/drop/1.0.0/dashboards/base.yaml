    index: as-dpsi-filter
    title: Absolute delta PSI
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: drop
    data_collection_tag: splicing_outliers
    interactive_component_type: MultiSelect
    column_name: psi_type
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: grape
    section: Splicing filters
    tag: dr-as-filter-type
    index: as-type-filter
    title: Splicing metric
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
