    index: cand-ranked-genes
    title: Genes ranked per sample
    description: The best-supported genes first, with the analyses that call each one. The -log10 p bar adds up the raw p-values of the analyses that tested the gene (2 is p = 0.01 for one analysis), so a longer bar is more or stronger evidence. Hover a row for its statistics; the record beside it opens on the first row (the highest bar of the genes in view) and follows a click on another.
