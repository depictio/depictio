    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mag
    data_collection_tag: bin_summary
    use: mag/bin_summary
    aggregation: max
    column_name: quality_score
    column_type: float64
    secondary_layout: top_n
    breakdown_col: assembler
    display:
