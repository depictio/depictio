version: 1
# nf-core/mag 5.5.0 reference dashboard.
#
# A funnel over the unit that matters here, which is the bin and not the
# sample: MultiQC -> Assembly -> Contigs -> Bins -> Taxonomy -> Annotation ->
# Bin detail. Three samples give four assemblers over five binners over three
# samples, so 479 metagenome-assembled genomes, 74 000 contigs and 222 000
# contig-by-sample coverage rows. Every filter that matters is therefore an
# assembler, a binner, a phylum or a quality threshold; the sample filter is
# the least selective one on the dashboard.
#
# Two filter sections and three grid sections are persistent and pinned, so
# they ride every tab: the sample scope, the assembler and binner scope, the
# run's headline numbers, the samplesheet and the per-assembly reference table.
# Each tab then adds its own non-persistent filter section on its own columns.
#
# Read QC has no tab of its own. This run publishes fastp as JSON and NanoPlot
# as a free-text NanoStats.txt, neither of which is a table format a DC can
# read, so the read-level numbers live in the MultiQC panels on the landing tab
# and nowhere else. See VALIDATION_REPORT.md.
main_dashboard:
  title: nf-core/mag
  subtitle: "nf-core/mag 5.5.0 megatest: 3 CaPES samples, hybrid short and long read assembly, 479 bins over 4 assemblers and 5 binners"
  project_tag: Metagenome Assembly and Binning
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Sample scope
    icon: mdi:test-tube
    color: teal
    description: The three samples, carried to every tab through the project links
    persistent: true
    pin: top
  - name: Binning scope
    icon: mdi:tune
    color: indigo
    description: Assembler and binner, carried to every per-bin and per-assembly tile
    persistent: true
    pin: top
  - name: Glance scope
    icon: mdi:tune
    color: orange
    description: Narrows the pinned bin strip to one MIMAG tier, on this tab only
  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: What the run recovered, before any tab narrows it
    persistent: true
    pin: top
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The sample hub the sample filter is sourced on
    collapsed: true
    persistent: true
    pin: top
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: One row per assembly, on every tab
    collapsed: true
    persistent: true
    pin: bottom
  - name: MultiQC report
    icon: mdi:view-dashboard-outline
    color: orange
    description: The report re-generated with MultiQC 1.35 from the run's own raw tool outputs
  components:
  # ------------------------------------------------------- run at a glance
  - component_type: card
    tag: mg-glance-card-bins
    index: mg-glance-card-bins
    section: Run at a glance
    workflow_tag: mag
    data_collection_tag: bin_summary
    use: mag/mimag_donut
    aggregation: nunique
    column_name: bin_id
    column_type: object
    secondary_layout: donut
    breakdown_col: mimag_tier
    display: {icon_name: 'mdi:bacteria-outline', icon_color: '#3949AB', title_color: '#3949AB', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Bins recovered
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: mg-glance-card-completeness
    index: mg-glance-card-completeness
    section: Run at a glance
    workflow_tag: mag
    data_collection_tag: bin_summary
    use: mag/bin_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: completeness
    column_type: float64
    display: {icon_name: 'mdi:check-decagram', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Completeness
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: mg-glance-card-contamination
    index: mg-glance-card-contamination
    section: Run at a glance
    workflow_tag: mag
    data_collection_tag: bin_summary
    use: mag/bin_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: contamination
    column_type: float64
    display: {icon_name: 'mdi:alert-outline', icon_color: '#D81B60', title_color: '#D81B60', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Contamination
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: mg-glance-card-bases
    index: mg-glance-card-bases
    section: Run at a glance
    workflow_tag: mag
    data_collection_tag: bin_summary
    use: mag/bin_summary
    aggregation: sum
    column_name: total_length
    column_type: int64
    secondary_layout: composition
    breakdown_col: assembler
    display: {icon_name: 'mdi:ruler', icon_color: '#FB8C00', title_color: '#FB8C00', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Binned bases
    layout: {x: 6, y: 0, w: 2, h: 2}

  # ---------------------------------------------------------- sample sheet
  - component_type: text
    tag: mg-samples-intro
    index: mg-samples-intro
    section: Sample sheet
    title: The design behind every panel
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per sample, with its co-assembly group and whether it also has a
      long-read run. Every sample here was sequenced on both platforms, so the
      platform columns are constant and carry no filter. The assembler and the
      binner are what separate the rows of every other collection.
    workflow_tag: mag
    data_collection_tag: samples
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: mg-samples-table
    index: mg-samples-table
    section: Sample sheet
    workflow_tag: mag
    data_collection_tag: samples
    row_selection_enabled: false
    title: Sample hub
    description: One row per sample, with its co-assembly group and read platforms.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 3}

  # ------------------------------------------------------ reference tables
  - component_type: text
    tag: mg-ref-intro
    index: mg-ref-intro
    section: Reference tables
    title: The assemblies everything else is built on
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per assembler and sample: assembled length, contig count, N50 and
      the fraction held in contigs a binner can use. The Assembly tab reads the
      same rows with the contig-length ladder underneath them.
    workflow_tag: mag
    data_collection_tag: assembly_report
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: mg-ref-table-assemblies
    index: mg-ref-table-assemblies
    section: Reference tables
    workflow_tag: mag
    data_collection_tag: assembly_report
    use: quast/assembly_report
    row_selection_enabled: false
    title: Assembly statistics
    description: Ten assemblies, one per assembler and sample that finished.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 4}

  # -------------------------------------------------------- MultiQC report
  - component_type: text
    tag: mg-qc-intro
    index: mg-qc-intro
    section: MultiQC report
    title: A report the run never wrote
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      This megatest publishes no multiqc directory at all, so the report below
      was re-generated with MultiQC 1.35 over the run's own raw outputs. Eight
      modules parsed: fastp and NanoStat for the reads, Bowtie2 for host and
      phiX removal, QUAST for the assemblies, CheckM2, GTDB-Tk and Prokka for
      the bins. Read QC lives here because no read-level table is published
      anywhere else in this run.
    workflow_tag: mag
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: mg-qc-general-stats
    index: mg-qc-general-stats
    section: MultiQC report
    workflow_tag: mag
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    title: General statistics
    description: One row per sample and per bin, pooling every module that parsed. The column picker narrows it to one module at a time.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 5}
  - component_type: multiqc
    tag: mg-qc-fastp-filtered
    index: mg-qc-fastp-filtered
    section: MultiQC report
    workflow_tag: mag
    data_collection_tag: multiqc_data
    use: multiqc/fastp
    selected_module: fastp
    selected_plot: Filtered Reads
    title: Short reads kept and discarded
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: mg-qc-fastp-quality
    index: mg-qc-fastp-quality
    section: MultiQC report
    workflow_tag: mag
    data_collection_tag: multiqc_data
    use: multiqc/fastp
    selected_module: fastp
    selected_plot: Sequence Quality
    title: Short-read base quality
    title_size: sm
    title_align: left
    layout: {x: 4, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: mg-qc-nanostat-summary
    index: mg-qc-nanostat-summary
    section: MultiQC report
    workflow_tag: mag
    data_collection_tag: multiqc_data
    use: multiqc/nanostat
    selected_module: nanostat
    selected_plot: Summary Statistics (FASTQ)
    title: Long-read yield
    title_size: sm
    title_align: left
    layout: {x: 0, y: 12, w: 4, h: 5}
  - component_type: multiqc
    tag: mg-qc-nanostat-quality
    index: mg-qc-nanostat-quality
    section: MultiQC report
    workflow_tag: mag
    data_collection_tag: multiqc_data
    use: multiqc/nanostat
    selected_module: nanostat
    selected_plot: Reads by quality
    title: Long reads by quality
    title_size: sm
    title_align: left
    layout: {x: 4, y: 12, w: 4, h: 5}
  - component_type: multiqc
    tag: mg-qc-bowtie2
    index: mg-qc-bowtie2
    section: MultiQC report
    workflow_tag: mag
    data_collection_tag: multiqc_data
    use: multiqc/bowtie2
    selected_module: bowtie2
    selected_plot: Paired-end alignments
    title: Host and phiX removal
    title_size: sm
    title_align: left
    layout: {x: 0, y: 17, w: 4, h: 5}
  - component_type: multiqc
    tag: mg-qc-quast
    index: mg-qc-quast
    section: MultiQC report
    workflow_tag: mag
    data_collection_tag: multiqc_data
    use: multiqc/quast
    selected_module: quast
    selected_plot: Assembly Statistics
    title: Assembly statistics
    title_size: sm
    title_align: left
    layout: {x: 4, y: 17, w: 4, h: 5}
  - component_type: multiqc
    tag: mg-qc-checkm2
    index: mg-qc-checkm2
    section: MultiQC report
    workflow_tag: mag
    data_collection_tag: multiqc_data
    use: multiqc/checkm2
    selected_module: checkm2
    selected_plot: Bin quality
    title: Bin quality
    title_size: sm
    title_align: left
    layout: {x: 0, y: 22, w: 4, h: 5}
  - component_type: multiqc
    tag: mg-qc-gtdbtk
    index: mg-qc-gtdbtk
    section: MultiQC report
    workflow_tag: mag
    data_collection_tag: multiqc_data
    use: multiqc/gtdbtk
    selected_module: gtdbtk
    selected_plot: MAG taxonomy
    title: Bin taxonomy
    title_size: sm
    title_align: left
    layout: {x: 4, y: 22, w: 4, h: 5}

  # --------------------------------------------------------------- filters
  - component_type: interactive
    tag: mg-filter-sample
    index: mg-sample-filter
    section: Sample scope
    group: Sample scope
    workflow_tag: mag
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:test-tube'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: mg-filter-assembler
    index: mg-assembler-filter
    section: Binning scope
    group: Binning scope
    workflow_tag: mag
    data_collection_tag: bin_summary
    interactive_component_type: MultiSelect
    column_name: assembler
    column_type: object
    display: {title_size: md, custom_color: '#3949AB', icon_name: 'mdi:dna'}
    placement: left
    title: Assembler
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: mg-filter-binner
    index: mg-binner-filter
    section: Binning scope
    group: Binning scope
    workflow_tag: mag
    data_collection_tag: bin_summary
    interactive_component_type: MultiSelect
    column_name: binner
    column_type: object
    display: {title_size: md, custom_color: '#3949AB', icon_name: 'mdi:bacteria-outline'}
    placement: left
    title: Binner
    layout: {x: 0, y: 3, w: 1, h: 3}

  # Tab-local, not persistent: this tab's own control beside the pinned ones.
  # It narrows the pinned glance strip that rides this tab.
  - component_type: interactive
    tag: mg-mq-filter-tier
    index: mg-mq-tier-filter
    section: Glance scope
    group: Bin quality
    workflow_tag: mag
    data_collection_tag: bin_summary
    interactive_component_type: MultiSelect
    column_name: mimag_tier
    column_type: object
    display: {title_size: md, custom_color: '#FB8C00', icon_name: 'mdi:check-decagram'}
    placement: left
    title: MIMAG tier
    layout: {x: 0, y: 0, w: 1, h: 3}

tabs:
# ============================================================================
# Assembly
# ============================================================================
- title: Assembly
  subtitle: What four assemblers made of the same three samples, and how much of each assembly survives a minimum contig length
  tab_order: 2
  tab_icon: mdi:dna
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Assembly scope
    icon: mdi:tune
    color: blue
    description: Narrow the assemblies by contiguity and the ladder by its rung
  grid_sections:
  - name: Assemblies at a glance
    icon: mdi:counter
    color: blue
    description: The ten assemblies this run produced
  - name: Size against contiguity
    icon: mdi:chart-scatter-plot
    color: blue
    description: Assembled length against N50, the two numbers that decide whether an assembly is binnable
  - name: Contig length ladder
    icon: mdi:chart-line
    color: cyan
    description: How much of each assembly survives each minimum contig length
  - name: Nx curve
    icon: mdi:ruler
    color: indigo
    description: N50 and N75 as two points of one curve, read across every percent of the assembly
  components:
  - component_type: card
    tag: mg-asm-card-length
    index: mg-asm-card-length
    section: Assemblies at a glance
    workflow_tag: mag
    data_collection_tag: assembly_report
    use: quast/assembly_report
    aggregation: sum
    column_name: total_length
    column_type: int64
    secondary_layout: composition
    breakdown_col: assembler
    display: {icon_name: 'mdi:ruler', icon_color: '#1E88E5', title_color: '#1E88E5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Assembled bases
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: mg-asm-card-n50
    index: mg-asm-card-n50
    section: Assemblies at a glance
    workflow_tag: mag
    data_collection_tag: assembly_report
    use: quast/assembly_report
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: n50
    column_type: int64
    display: {icon_name: 'mdi:scale-balance', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Contig N50
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: mg-asm-card-contigs
    index: mg-asm-card-contigs
    section: Assemblies at a glance
    workflow_tag: mag
    data_collection_tag: assembly_report
    use: quast/assembly_report
    aggregation: sum
    column_name: n_contigs
    column_type: int64
    secondary_layout: top_n
    breakdown_col: assembly_id
    top_n_count: 5
    display: {icon_name: 'mdi:chart-bar', icon_color: '#3949AB', title_color: '#3949AB', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Contigs
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: mg-asm-card-largest
    index: mg-asm-card-largest
    section: Assemblies at a glance
    workflow_tag: mag
    data_collection_tag: assembly_report
    use: quast/assembly_report
    aggregation: max
    column_name: largest_contig
    column_type: int64
    secondary_layout: top_n
    breakdown_col: assembler
    top_n_count: 4
    display: {icon_name: 'mdi:chart-timeline-variant', icon_color: '#FB8C00', title_color: '#FB8C00', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Longest contig
    layout: {x: 6, y: 0, w: 2, h: 2}

  - component_type: text
    tag: mg-asm-intro
    index: mg-asm-intro
    section: Size against contiguity
    title: Long reads buy contiguity, short reads buy length
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      SPAdes and MEGAHIT assemble the most bases and scatter them over tens of
      thousands of contigs; FLYE and METAMDBG assemble fewer bases into far
      longer ones. Bins come out of the second shape much more cleanly, which
      is what the Bins tab shows once the same assemblies have been binned.
    workflow_tag: mag
    data_collection_tag: assembly_report
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: mg-asm-av-n50
    index: mg-asm-av-n50
    section: Size against contiguity
    workflow_tag: mag
    data_collection_tag: assembly_report
    use: quast/n50_vs_length
    config:
      x_title: Assembled bases
      y_title: Contig N50 (bp)
      log_x: true
      log_y: true
      top_n_labels: 4
      selection_enabled: true
      selection_column: assembler
      controls_placement: header
    title: Assembled length against contig N50
    description: One point per assembly, sized by contig count. Up and to the right is a long assembly in long pieces.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: figure
    tag: mg-asm-fig-n50
    index: mg-asm-fig-n50
    section: Size against contiguity
    workflow_tag: mag
    data_collection_tag: assembly_report
    use: quast/assembly_report
    visu_type: bar
    dict_kwargs: {x: assembler, y: n50, color: sample}
    title: Contig N50 by assembler
    description: The same contiguity, read per assembler so the long-read and short-read routes separate.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 7}

  - component_type: text
    tag: mg-ladder-intro
    index: mg-ladder-intro
    section: Contig length ladder
    title: Where an assembly loses its length
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      QUAST reports its contig thresholds twice, as a contig count and as a
      base count. Read across, those pairs are the cumulative length curve: an
      assembly that still holds its bases at 25 kbp is one a binner can work
      with, one that loses most of them between 1 and 5 kbp will bin into
      chimeras whatever the binner.
    workflow_tag: mag
    data_collection_tag: length_ladder
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: mg-ladder-av-fraction
    index: mg-ladder-av-fraction
    section: Contig length ladder
    workflow_tag: mag
    data_collection_tag: length_ladder
    use: quast/retained_fraction
    config:
      x_title: Minimum contig length (bp)
      y_title: Fraction of the assembly retained
      log_x: true
      legend_pos: right
    title: Fraction of each assembly retained per minimum contig length
    description: One curve per assembly, normalised to its own total, so assemblies of very different sizes stay comparable.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: advanced_viz
    tag: mg-ladder-av-cumulative
    index: mg-ladder-av-cumulative
    section: Contig length ladder
    workflow_tag: mag
    data_collection_tag: length_ladder
    use: quast/cumulative_length
    config:
      x_title: Minimum contig length (bp)
      y_title: Bases held by contigs at least that long
      log_x: true
      log_y: true
      legend_pos: right
    title: Bases surviving each minimum contig length
    description: The same curves in absolute bases, which is where the short-read assemblies' extra length shows.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 7}
  - component_type: table
    tag: mg-ladder-table
    index: mg-ladder-table
    section: Contig length ladder
    workflow_tag: mag
    data_collection_tag: length_ladder
    use: quast/length_ladder
    row_selection_enabled: false
    title: Ladder rungs
    description: Six thresholds per assembly, with the contigs and the bases each one keeps.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 16, w: 8, h: 7}

  - component_type: text
    tag: mg-nx-intro
    index: mg-nx-intro
    section: Nx curve
    title: The whole curve N50 is one point of
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Sort an assembly's contigs longest first and walk down them: Nx is the
      length of the contig at which x percent of the bases are reached. The
      curve crosses the line at x = 50 exactly at the QUAST N50, since both keep
      contigs of at least 500 bp. A long-read assembly holds a high plateau far
      to the right; a short-read one falls off early. The lengths come from
      the depth tables, so an assembly without one has no curve.
    workflow_tag: mag
    data_collection_tag: assembly_nx
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: mg-nx-av-curve
    index: mg-nx-av-curve
    section: Nx curve
    workflow_tag: mag
    data_collection_tag: assembly_nx
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: assembly_id
      x_col: nx
      y_col: contig_length
      log_y: true
      reference_x: 50
      reference_label: N50
      x_title: Percent of the assembled bases (x)
      y_title: Nx, contig length (bp)
      legend_pos: right
    title: Nx curve per assembly
    description: One curve per assembly. The higher and the further right a curve holds, the fewer and longer the pieces the assembly is made of.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}

  - component_type: interactive
    tag: mg-filter-ladder-rung
    index: mg-ladder-rung-filter
    section: Assembly scope
    group: Assembly scope
    workflow_tag: mag
    data_collection_tag: length_ladder
    interactive_component_type: Slider
    column_name: min_contig_length
    column_type: int64
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:ruler'}
    placement: left
    title: Ladder rung (bp)
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: mg-filter-asm-n50
    index: mg-asm-n50-filter
    section: Assembly scope
    group: Assembly scope
    workflow_tag: mag
    data_collection_tag: assembly_report
