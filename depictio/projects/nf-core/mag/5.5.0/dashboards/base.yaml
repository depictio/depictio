- title: Annotation
  subtitle: Do the bins carry the genes and RNAs of a genome?
  tab_group: Genomes
  tab_order: 6
  tab_icon: mdi:file-document-outline
  tab_icon_color: yellow
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Annotation filters
    icon: mdi:filter-variant
    color: yellow
    description: Gene density and RNA counts of the annotated bins
  grid_sections:
  - name: Annotation at a glance
    icon: mdi:counter
    color: yellow
    description: What Prokka found across the bins it annotated
  - name: Gene density
    icon: mdi:chart-scatter-plot
    color: yellow
    description: Coding sequences per megabase, the sanity check on a bin's gene content
  - name: The RNA half of MIMAG
    icon: mdi:chart-scatter-plot
    color: yellow
    description: Transfer against ribosomal RNAs, which completeness never counts
  - name: Tables
    icon: mdi:table
    color: gray
    description: Every annotated bin with its feature counts and gene density
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [Prokka](https://github.com/tseemann/prokka) annotates each bin's coding sequences, transfer
      RNAs and ribosomal RNAs. A prokaryotic genome carries about 900 coding sequences per megabase, so
      a bin far from that line holds a second organism or sequence that is not a genome. A high-quality
      draft also needs its ribosomal RNAs and 18 transfer RNAs, which the last plot checks.
    tag: mg-ann-intro
    index: ann-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: mag
    data_collection_tag: prokka_summary
    interactive_component_type: RangeSlider
    column_name: cds_per_mbp
    column_type: float64
    display:
      icon_name: mdi:scale-balance
      custom_color: orange
    section: Annotation filters
    tag: mg-ann-filter-density
    index: ann-density-filter
    title: Genes per Mbp
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: mag
    data_collection_tag: prokka_summary
    interactive_component_type: RangeSlider
    column_name: trna
    column_type: int64
    display:
      icon_name: mdi:dna
      custom_color: teal
    section: Annotation filters
    tag: mg-ann-filter-trna
    index: ann-trna-filter
    title: Transfer RNAs
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: mag
    data_collection_tag: prokka_summary
    interactive_component_type: RangeSlider
    column_name: rrna
    column_type: int64
    display:
      icon_name: mdi:alert-outline
      custom_color: red
    section: Annotation filters
    tag: mg-ann-filter-rrna
    index: ann-rrna-filter
    title: Ribosomal RNAs
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: mag
    data_collection_tag: prokka_summary
    use: prokka/summary
    aggregation: sum
    column_name: cds
    column_type: int64
    secondary_layout: composition
    breakdown_col: assembler
    display:
      icon_name: mdi:file-document-outline
      icon_color: yellow
      caption: summed, by assembler
    section: Annotation at a glance
    tag: mg-ann-card-cds
    index: ann-card-cds
    title: Coding sequences
    description: Coding sequences Prokka called across the bins in view.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mag
    data_collection_tag: prokka_summary
    use: prokka/summary
    aggregation: median
    column_name: cds_per_mbp
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:scale-balance
      icon_color: orange
      caption: median, with its spread
      decimals: 0
    section: Annotation at a glance
    tag: mg-ann-card-density
    index: ann-card-density
    title: Genes per Mbp
    description: Median coding sequences per megabase; a prokaryote sits near 900.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mag
    data_collection_tag: prokka_summary
    use: prokka/summary
    aggregation: median
    column_name: trna
    column_type: int64
    secondary_layout: threshold
    threshold_value: 18
    threshold_direction: min
    display:
      icon_name: mdi:dna
      icon_color: teal
      caption: median; 18 is the MIMAG floor
      decimals: 0
    section: Annotation at a glance
    tag: mg-ann-card-trna
    index: ann-card-trna
    title: Transfer RNAs
    description: Median transfer RNAs per bin. A high-quality draft carries at least 18.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mag
    data_collection_tag: prokka_summary
    use: prokka/summary
    aggregation: count
    column_name: bin_id
    column_type: object
    filter_expr: col('meets_mimag_rna') == True
    secondary_layout: top_n
    breakdown_col: binner
    display:
      icon_name: mdi:check-circle-outline
      icon_color: green
      caption: bins meeting the RNA criteria, by binner
    section: Annotation at a glance
    tag: mg-ann-card-rna
    index: ann-card-rna
    title: Bins with their RNAs
    description: Bins carrying the ribosomal RNAs and the 18 transfer RNAs of a high-quality draft.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: mag
    data_collection_tag: prokka_summary
    use: prokka/density_vs_size
    config:
      x_title: Bin size (bases)
      y_title: Coding sequences per Mbp
      log_x: true
      opacity: 0.75
      legend_pos: right
      reference_line: horizontal
      reference_value: 900
      selection_enabled: true
      selection_column: bin_id
    section: Gene density
    tag: mg-ann-density
    index: ann-density-size
    title: Gene density against bin size
    description: The line is the 900 coding sequences per megabase of a prokaryotic genome.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: mag
    data_collection_tag: prokka_summary
    use: prokka/summary
    visu_type: histogram
    dict_kwargs:
      x: cds_per_mbp
      color: assembler
      labels: {cds_per_mbp: Coding sequences per Mbp, assembler: Assembler}
    section: Gene density
    tag: mg-ann-density-hist
    index: ann-density-hist
    title: Gene density per assembler
    description: Whether the assembler changes how gene-dense its bins look.
    layout: {x: 0, y: 6, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: mag
    data_collection_tag: prokka_summary
    use: prokka/trna_vs_rrna
    config:
      x_title: Transfer RNAs
      y_title: Ribosomal RNAs
      opacity: 0.75
      legend_pos: right
      reference_line: vertical
      reference_value: 18
      selection_enabled: true
      selection_column: bin_id
    section: The RNA half of MIMAG
    tag: mg-ann-rna
    index: ann-rna-plane
    title: Transfer RNAs against ribosomal RNAs
    description: The line marks 18 transfer RNAs. Points on the bottom row carry no ribosomal RNA at all.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: mag
    data_collection_tag: prokka_summary
    use: prokka/summary
    row_selection_enabled: true
    row_selection_column: bin_id
    section: Tables
    tag: mg-ann-table
    index: ann-table
    title: Annotation summary
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Bin detail
  subtitle: What do all four tools say about one bin?
  tab_group: Genomes
  tab_order: 7
  tab_icon: mdi:microscope
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Bin detail filters
    icon: mdi:filter-variant
    color: grape
    description: A MIMAG tier, then a bin, then the feature classes its map draws
  grid_sections:
  - name: Bin detail at a glance
    icon: mdi:counter
    color: grape
    description: The joined table's headline numbers
  - name: Locus map
    icon: mdi:chart-timeline-variant
    color: grape
    description: The genes of the picked bin along its contigs
  - name: Feature lengths
    icon: mdi:chart-bell-curve
    color: grape
    description: How long the features of each class are
  - name: Bin table
    icon: mdi:set-merge
    color: gray
