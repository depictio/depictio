  - component_type: card
    workflow_tag: mag
    data_collection_tag: gtdbtk_summary
    use: gtdbtk/summary
    aggregation: nunique
    column_name: species
    column_type: object
    filter_expr: col('species').is_not_null() & (col('species') != '')
    secondary_layout: top_n
    breakdown_col: phylum
    display:
      icon_name: mdi:tag-outline
      icon_color: teal
      caption: distinct species, the richest phyla
    section: Placements at a glance
    tag: mg-tax-card-species
    index: tax-card-species
    title: Species named
    description: Distinct species GTDB-Tk named among the bins.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mag
    data_collection_tag: gtdbtk_summary
    use: gtdbtk/summary
    aggregation: median
    column_name: closest_ani
    column_type: float64
    secondary_layout: threshold
    threshold_value: 95
    threshold_direction: min
    display:
      icon_name: mdi:target
      icon_color: orange
