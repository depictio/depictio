version: 1
# nf-core/mag 5.5.0. Every rule this file follows is written out in
# depictio/projects/nf-core/RULES.md; ampliseq/2.18.0 is the reference.
#
# Funnel: the Overview, then Data & QC (the MultiQC report, the only home of
# the read QC), then Assemblies (the assemblies, then the contig coverage the
# binners read), then Genomes (bin quality, the bins' names, their genes, and
# one bin in full). The unit is the bin, not the sample: every assembler is
# crossed with every binner over every sample, so the filters that matter are
# an assembler, a binner, a phylum or a quality threshold.
#
# Read QC has no tab of its own. mag publishes fastp as JSON and NanoPlot as a
# free-text NanoStats.txt, neither a table a DC can read, so the read-level
# numbers live in the MultiQC panels and nowhere else. See VALIDATION_REPORT.md.
#
# Routes: every collection but the sample sheet and the MultiQC report is
# optional. A run that skips binning keeps the MultiQC and Assemblies tabs; a
# run that skips GTDB-Tk or Prokka loses that tab and its Overview rows.
main_dashboard:
  title: nf-core/mag
  subtitle: Metagenome assembly and binning, from reads to named, annotated genomes
  project_tag: Metagenome Assembly and Binning
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab: figures, advanced viz and filter
  # chips colour a value the same way. Assemblers and binners are mag's own
  # vocabularies, pinned so a re-run with another subset keeps its colours.
  category_colors:
    assembler:
      '*': auto
      MEGAHIT: '#2a78d6'
      SPAdes: '#eb6834'
      FLYE: '#008300'
      METAMDBG: '#e34948'
    binner:
      '*': auto
      MetaBAT2: '#4a3aa7'
      MaxBin2: '#e87ba4'
      SemiBin2: '#1baf7a'
      COMEBin: '#eda100'
      MetaBinner: '#1098ad'
    mimag_tier:
      High quality draft: '#1baf7a'
      Medium quality draft: '#2a78d6'
      Low quality draft: '#eda100'
      Contaminated: '#e34948'
      Unknown: '#adb5bd'
    quality_tier:
      High quality: '#1baf7a'
      Medium quality: '#2a78d6'
      Low quality: '#eda100'
      Contaminated: '#e34948'
      Unknown: '#adb5bd'
    domain:
      Bacteria: '#1098ad'
      Archaea: '#7048e8'
    # The eight phyla with the most bins take the palette, largest first, so
    # the sunburst, the stacked composition and the sankey agree; the stacked
    # composition shows the same eight and folds the rest into Other.
    phylum:
      '*': 'auto:bin_count'
      Other: '#adb5bd'
      Unclassified: '#868e96'
    ftype:
      CDS: '#2a78d6'
      tRNA: '#1baf7a'
      rRNA: '#eb6834'
      tmRNA: '#eda100'
      repeat_region: '#adb5bd'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. The
  # assembler and binner reach every per-assembly and per-bin collection
  # through the bin_summary links, the sample every collection through the
  # sample sheet's.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab rather than on an analysis tab: a run that prunes
  # that tab would take a persistent section declared there with it.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The sample sheet behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Bins, below).
  - component_type: interactive
    workflow_tag: mag
    data_collection_tag: bin_summary
    interactive_component_type: MultiSelect
    column_name: assembler
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: blue
      strip_label: Assembler
    section: Key figures
    tag: mg-ov-kf-assembler
    index: ov-kf-assembler
    title: Assembler
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: mag
    data_collection_tag: bin_summary
    interactive_component_type: MultiSelect
    column_name: binner
    column_type: object
    display:
      icon_name: mdi:bacteria-outline
      custom_color: indigo
      strip_label: Binner
    section: Key figures
    tag: mg-ov-kf-binner
    index: ov-kf-binner
    title: Binner
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: mag
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: mg-ov-kf-sample
    index: ov-kf-sample
    title: Sample
    layout: {x: 4, y: 0, w: 2, h: 1}
  - component_type: text
    title: nf-core/mag
    logo: https://raw.githubusercontent.com/nf-core/mag/master/docs/images/nf-core-mag_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/mag/master/docs/images/nf-core-mag_logo_dark.png
    order: 1
    body: >
      Metagenome reads assembled, binned into genomes, and each bin scored for completeness,
      named against GTDB and annotated with its genes. [Run parameters](params:)
    tag: mg-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/mag assembles metagenome reads, bins the contigs into genomes, then scores, names and annotates each bin. The unit is the bin, not the sample: every assembler meets every binner on every sample, and the tabs follow the bins from their assemblies to their genes.

      The filters in the left panel apply to every tab: narrow the assembler, the binner or the samples once and the whole dashboard follows. A bar above a section narrows that section only.
    tag: mg-ov-about
    index: ov-about
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash.
  - component_type: text
    surface: card
    values:
      samples: {dc: samples, column: sample_id, aggregation: nunique, format: integer}
      assemblies: {dc: assembly_report, column: assembly_id, aggregation: nunique, format: integer}
      bins: {dc: bin_summary, column: bin_id, aggregation: count, format: integer}
    body: |
      ### The run
      - ![](icon:mdi:flask-outline) **Samples** {{samples}}
      - ![](icon:mdi:dna) **Assemblies** {{assemblies}}
      - ![](icon:mdi:bacteria-outline) **Bins** {{bins}}
      - ![](icon:mdi:ruler) **Shortest binned contig** {{param:min_contig_size}} bp
    tag: mg-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  # The marks take the family's colour (the header's), not the theme's blue.
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Six steps from reads to genomes
      Each step names its settings and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:content-cut) **Clean** fastp trims, Bowtie 2 removes host · [Settings](params:host) · [MultiQC](tab:MultiQC)
      2. ![](icon:mdi:dna) **Assemble** Per sample or per group · [Settings](params:assembl) · [Assembly](tab:Assembly)
      3. ![](icon:mdi:waves) **Map back** Reads give each contig a depth · [Settings](params:binning_map) · [Contigs](tab:Contigs)
      4. ![](icon:mdi:bacteria-outline) **Bin** Contigs grouped, scored by CheckM2 · [Settings](params:bin) · [Bins](tab:Bins)
      5. ![](icon:mdi:family-tree) **Classify** GTDB-Tk names the bins · [Settings](params:gtdbtk) · [Taxonomy](tab:Taxonomy)
      6. ![](icon:mdi:file-document-outline) **Annotate** Prokka finds the genes · [Settings](params:prokka) · [Annotation](tab:Annotation)
      :::
    tag: mg-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. The icon colour is that tab's colour.
  - component_type: card
    workflow_tag: mag
    data_collection_tag: bin_summary
    use: mag/mimag_donut
    aggregation: count
    column_name: bin_id
    column_type: object
    secondary_layout: composition
    breakdown_col: mimag_tier
    display:
      icon_name: mdi:bacteria-outline
      icon_color: grape
      caption: bins, by MIMAG tier
      link: tab:Bin detail
    section: Key figures
    tag: mg-ov-kf-bins
    index: ov-kf-bins
    title: Bins
    description: Bins any of the four tools reported on. The bar splits them by MIMAG tier.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mag
    data_collection_tag: assembly_report
    use: quast/assembly_report
    aggregation: median
    column_name: n50
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:scale-balance
      icon_color: blue
      caption: median per assembly
      link: tab:Assembly
    section: Key figures
    tag: mg-ov-kf-n50
    index: ov-kf-n50
    title: Contig N50 (bp)
    description: Median contig N50 of the assemblies. The box shows how it spreads across them.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mag
    data_collection_tag: bin_summary
    use: mag/bin_summary
    aggregation: count
    column_name: species
    column_type: object
    secondary_layout: completeness
    display:
      icon_name: mdi:tag-outline
      icon_color: green
      caption: bins named down to a species
      link: tab:Taxonomy
    section: Key figures
    tag: mg-ov-kf-species
    index: ov-kf-species
    title: Named to species
    description: Bins GTDB-Tk named down to a species, out of all the bins.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mag
    data_collection_tag: bin_summary
    use: mag/bin_summary
    aggregation: median
    column_name: completeness
    column_type: float64
    secondary_layout: coverage
    coverage_max: 100
    display:
      icon_name: mdi:check-decagram
      icon_color: indigo
      caption: median CheckM2 completeness
      link: tab:Bins
      decimals: 1
    section: Key figures
    tag: mg-ov-kf-completeness
    index: ov-kf-completeness
    title: Completeness (%)
    description: Median share of a genome CheckM2 finds in each bin, from its marker genes.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the assembler, then the binner.
  - component_type: interactive
    workflow_tag: mag
    data_collection_tag: bin_summary
    interactive_component_type: MultiSelect
    column_name: assembler
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: blue
      strip_label: Assembler
    section: Findings
    tag: mg-ov-findings-assembler
    index: ov-findings-assembler
    title: Assembler
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: mag
    data_collection_tag: bin_summary
    interactive_component_type: MultiSelect
    column_name: binner
    column_type: object
    display:
      icon_name: mdi:bacteria-outline
      custom_color: indigo
      strip_label: Binner
    section: Findings
    tag: mg-ov-findings-binner
    index: ov-findings-binner
    title: Binner
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data. Medium quality is the MIMAG floor: at least
  # 50% complete and under 10% contaminated.
  - component_type: text
    surface: card
    values:
      bn_top: {dc: checkm2_quality_report, column: binner, aggregation: top, filter_expr: "(col('completeness') >= 50) & (col('contamination') < 10)"}
      bn_share: {dc: checkm2_quality_report, column: binner, aggregation: top_share, filter_expr: "(col('completeness') >= 50) & (col('contamination') < 10)",
        format: percent}
      asm_top: {dc: assembly_report, column: assembler, aggregation: top, weight: length_over_1kb}
      ph_top: {dc: gtdbtk_summary, column: phylum, aggregation: top, filter_expr: "col('phylum').is_not_null()"}
      ph_share: {dc: gtdbtk_summary, column: phylum, aggregation: top_share, filter_expr: "col('phylum').is_not_null()",
        format: percent}
      rna_ok: {dc: prokka_summary, column: bin_id, aggregation: count, filter_expr: "col('meets_mimag_rna') == True",
        format: integer}
      n_ann: {dc: prokka_summary, column: bin_id, aggregation: count, format: integer}
    body: |
      - **{{bn_top}}** recovered the most bins of at least medium quality – {{bn_share}} of them, by CheckM2 [Bins](tab:Bins)
      - **{{asm_top}}** put the most bases into contigs of 1 kbp or more – QUAST, summed over the samples [Assembly](tab:Assembly)
      - **{{ph_share}}** of the named bins are {{ph_top}} – the phylum with the most bins, by GTDB-Tk [Taxonomy](tab:Taxonomy)
      - **{{rna_ok}}** of {{n_ann}} annotated bins carry the RNAs a high-quality draft needs – Prokka [Annotation](tab:Annotation)
    section: Findings
    tag: mg-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per stage of the genome funnel, in the order of the rows
  # above. The import drops a highlight whose source is gone and re-packs.
  - component_type: highlight
    section: Findings
    source_tab: Bins
    source_component: bin-mimag-plane
    caption: One point per bin, coloured by binner; bottom right, at least 90% complete and under 5% contaminated, are the bins worth naming.
    tag: mg-ov-hl-mimag
    index: ov-hl-mimag
    layout: {x: 0, y: 2, w: 5, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Assembly
    source_component: asm-size-contiguity
    title: Assembly size and N50
    hide_legend: true
    caption: One point per assembly, coloured by assembler; up and to the right is a long assembly in long pieces.
    tag: mg-ov-hl-assembly
    index: ov-hl-assembly
    layout: {x: 5, y: 2, w: 3, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Taxonomy
    source_component: tax-lineage-sunburst
    caption: Every named bin from domain outwards; the wider an arc, the more bins it holds.
    tag: mg-ov-hl-lineage
    index: ov-hl-lineage
    layout: {x: 0, y: 6, w: 3, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Annotation
    source_component: ann-rna-plane
    caption: One point per bin; right of the line, at least the 18 transfer RNAs a high-quality draft needs.
    tag: mg-ov-hl-rna
    index: ov-hl-rna
    layout: {x: 3, y: 6, w: 5, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers. A tab the run does not have is left out, and a heading whose
  # tabs are all missing is hidden.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)

      ### Assemblies
      - [Assembly](tab:Assembly)
      - [Contigs](tab:Contigs)

      ### Genomes
      - [Bins](tab:Bins)
      - [Taxonomy](tab:Taxonomy)
      - [Annotation](tab:Annotation)
      - [Bin detail](tab:Bin detail)
    section: How to read this dashboard
    tag: mg-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent filters: the binning route first, then the sample.
  - component_type: interactive
    workflow_tag: mag
    data_collection_tag: bin_summary
    interactive_component_type: MultiSelect
    column_name: assembler
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: blue
    section: Sample filters
    group: Binning route
    tag: mg-filter-assembler
    index: sample-filters-assembler
    title: Assembler
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: mag
    data_collection_tag: bin_summary
    interactive_component_type: MultiSelect
    column_name: binner
    column_type: object
    display:
      icon_name: mdi:bacteria-outline
      custom_color: indigo
    section: Sample filters
    group: Binning route
    tag: mg-filter-binner
    index: sample-filters-binner
    title: Binner
    layout: {x: 0, y: 2, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: mag
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: mg-filter-sample
    index: sample-filters-sample
    title: Sample
    layout: {x: 0, y: 4, w: 1, h: 3}
  - component_type: table
    workflow_tag: mag
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Sample sheet
    tag: mg-sample-sheet
    index: sample-sheet
    title: Sample sheet
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
- title: MultiQC
  subtitle: Did the reads survive trimming and host removal in every sample?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # Bound to multiqc_data: the report names reads, assemblies and bins its own
  # way, and only its sample column reaches every panel.
  filter_sections:
  - name: MultiQC report
    icon: mdi:file-document-outline
    color: orange
    description: Samples, assemblies and bins as the MultiQC report names them
  grid_sections:
  - name: QC overview
    icon: mdi:chart-box-outline
    color: orange
    description: Reads kept through trimming and host removal, and their base quality
  - name: QC details
    icon: mdi:file-document-outline
    color: gray
    description: Long-read quality and short-read insert sizes
    collapsed: true
  - name: Assembly and bin panels
    icon: mdi:file-document-outline
    color: gray
    description: The QUAST, CheckM2 and GTDB-Tk panels the next tabs draw in full
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [MultiQC](https://multiqc.info) gathers the read QC of the run: [fastp](https://github.com/OpenGene/fastp)
      for short reads, NanoStat for long reads and [Bowtie 2](https://bowtie-bio.sourceforge.net/bowtie2/)
      for host and phiX removal. Check how many reads each sample kept and how many mapped to the host
      before trusting the assemblies. Read QC lives only on this tab, as mag publishes no read-level table.
    tag: mg-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: mag
    data_collection_tag: multiqc_data
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: MultiQC report
    tag: mg-mqc-filter-sample
    index: mqc-sample-filter
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: multiqc
    workflow_tag: mag
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: QC overview
    tag: mg-mqc-general-stats
    title: General statistics
    description: One row per sample, assembly and bin, pooling every module. The column picker narrows it to one.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: mag
    data_collection_tag: multiqc_data
    use: multiqc/fastp
    selected_module: fastp
    selected_plot: Filtered Reads
    section: QC overview
    tag: mg-mqc-fastp-filtered
    title: Short reads kept and discarded
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: mag
    data_collection_tag: multiqc_data
    use: multiqc/fastp
    selected_module: fastp
    selected_plot: Sequence Quality
    section: QC overview
    tag: mg-mqc-fastp-quality
    title: Short-read base quality
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: mag
    data_collection_tag: multiqc_data
    use: multiqc/bowtie2
    selected_module: bowtie2
    selected_plot: Paired-end alignments
    section: QC overview
    tag: mg-mqc-bowtie2
    title: Host and phiX removal
    layout: {x: 0, y: 8, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: mag
    data_collection_tag: multiqc_data
    use: multiqc/nanostat
    selected_module: nanostat
    selected_plot: Summary Statistics (FASTQ)
    section: QC overview
    tag: mg-mqc-nanostat-summary
    title: Long-read yield
    layout: {x: 0, y: 12, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: mag
    data_collection_tag: multiqc_data
    use: multiqc/nanostat
    selected_module: nanostat
    selected_plot: Reads by quality
    section: QC details
    tag: mg-mqc-nanostat-quality
    title: Long reads by quality
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: mag
    data_collection_tag: multiqc_data
    use: multiqc/fastp
    selected_module: fastp
    selected_plot: Insert Sizes
    section: QC details
    tag: mg-mqc-fastp-insert-sizes
    title: Short-read insert sizes
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: mag
    data_collection_tag: multiqc_data
    use: multiqc/quast
    selected_module: quast
    selected_plot: Assembly Statistics
    section: Assembly and bin panels
    tag: mg-mqc-quast
    title: Assembly statistics
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: mag
    data_collection_tag: multiqc_data
    use: multiqc/checkm2
    selected_module: checkm2
    selected_plot: Bin quality
    section: Assembly and bin panels
    tag: mg-mqc-checkm2
    title: Bin quality
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: mag
    data_collection_tag: multiqc_data
    use: multiqc/gtdbtk
    selected_module: gtdbtk
    selected_plot: MAG taxonomy
    section: Assembly and bin panels
    tag: mg-mqc-gtdbtk
    title: Bin taxonomy
    layout: {x: 0, y: 4, w: 8, h: 4}
- title: Assembly
  subtitle: Which assemblies are long and contiguous enough to bin?
  tab_group: Assemblies
  tab_order: 2
  tab_icon: mdi:dna
  tab_icon_color: blue
