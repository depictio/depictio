      decimals: 1
    section: Placements at a glance
    tag: mg-tax-card-ani
    index: tax-card-ani
    title: Identity to reference (%)
    description: Median identity of a bin to its closest GTDB genome, over the bins that have one.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: mag
    data_collection_tag: gtdbtk_summary
    use: gtdbtk/lineage_sunburst
