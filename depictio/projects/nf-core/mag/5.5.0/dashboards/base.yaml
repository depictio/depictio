    column_name: closest_af
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#FB8C00', title_color: '#FB8C00', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Alignment fraction
    layout: {x: 6, y: 0, w: 2, h: 2}

  - component_type: text
    tag: mg-tax-intro
    index: mg-tax-intro
    section: What was recovered
    title: A few phyla, and a long tail that never got a name
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      GTDB-Tk only runs on the bins that pass its completeness and
      contamination thresholds, so a minority of the recovered bins are placed
      here. That is a filter, not a failure: the ones that are missing are the
      ones the Bins tab already shows as low quality or contaminated.
    workflow_tag: mag
    data_collection_tag: gtdbtk_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: mg-tax-av-sunburst
    index: mg-tax-av-sunburst
    section: What was recovered
    workflow_tag: mag
    data_collection_tag: gtdbtk_summary
    use: gtdbtk/lineage_sunburst
    config:
      max_depth: 4
      colour_by_rank: phylum
      palette: tab20
      show_counts: true
      min_percent: 0
    title: The recovered lineage
    description: Every placed bin, from domain outwards. Arc size is the number of bins, so a wide arc is an organism several binners found several times.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: advanced_viz
    tag: mg-tax-av-stacked
    index: mg-tax-av-stacked
    section: What was recovered
    workflow_tag: mag
    data_collection_tag: gtdbtk_rank_composition
    use: gtdbtk/recovered_community
    config:
      default_rank: phylum
      top_n: 12
      normalise_to_one: true
      sample_sort: input
      show_legend: true
      controls_placement: header
    title: The community each binning run recovered
    description: One bar per assembler, binner and sample, composed of the bins it placed. The rank dropdown moves from phylum down to genus.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 7}

  - component_type: text
    tag: mg-tax-flow-intro
    index: mg-tax-flow-intro
    section: How each binner got there
    title: The same organisms, found by different routes
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Assembler to binner to phylum, weighted by bins. A phylum reached through
      only one assembler is a recovery that route alone managed; a binner whose
      band narrows sharply on the right recovered fewer named bins than its
      neighbours from the same contigs.
    workflow_tag: mag
    data_collection_tag: gtdbtk_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: mg-tax-av-sankey
    index: mg-tax-av-sankey
    section: How each binner got there
    workflow_tag: mag
    data_collection_tag: gtdbtk_summary
    use: gtdbtk/assembler_binner_phylum
    config:
      value_col: bin_count
      value_label: bins
      value_format: count
      color_mode: source
      link_opacity: 0.45
      sort_mode: total_flow
    title: Assembler to binner to phylum
    description: Weighted by placed bins. The width of a link is how many bins took that route.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: advanced_viz
    tag: mg-tax-av-ani
    index: mg-tax-av-ani
    section: How each binner got there
    workflow_tag: mag
    data_collection_tag: gtdbtk_summary
