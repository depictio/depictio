      series_col: assembly_id
      x_col: nx
      y_col: contig_length
      log_y: true
      reference_x: 50
      reference_label: N50
      x_title: Percent of the assembled bases (x)
      y_title: Nx, contig length (bp)
      legend_pos: none
    section: Contig length
    tag: mg-asm-nx
