      caption: longest, with each assembly's longest
    section: Assemblies at a glance
    tag: mg-asm-card-largest
    index: asm-card-largest
    title: Longest contig (bp)
    description: The longest contig of any assembly in view.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: mag
    data_collection_tag: assembly_report
    use: quast/n50_vs_length
    config:
      x_title: Assembled bases
      y_title: Contig N50 (bp)
      log_x: true
      log_y: true
      # Assembly ids pile up over the points: no labels, hover says which.
      top_n_labels: 0
      selection_enabled: true
      selection_column: assembler
    section: Size against contiguity
    tag: mg-asm-n50-length
