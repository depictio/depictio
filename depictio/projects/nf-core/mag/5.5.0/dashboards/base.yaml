    data_collection_tag: prokka_gene_track
    interactive_component_type: MultiSelect
    column_name: ftype
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: cyan
    section: Bin detail filters
    tag: mg-det-filter-ftype
    index: det-ftype-filter
    title: Feature class
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: mag
    data_collection_tag: bin_summary
    use: mag/mimag_donut
    aggregation: count
    column_name: bin_id
    column_type: object
    secondary_layout: donut
    breakdown_col: mimag_tier
    display:
      icon_name: mdi:check-decagram
      icon_color: grape
      caption: bins, by MIMAG tier
    section: Bin detail at a glance
    tag: mg-det-card-tiers
    index: det-card-tiers
    title: MIMAG tiers
