      reference_line: vertical
      reference_value: 95
      controls_placement: header
    title: How confidently each bin was named
    description: The line marks 95 percent identity, the GTDB species boundary. Points to its left were named above species level.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 7}
  - component_type: table
    tag: mg-tax-table
    index: mg-tax-table
