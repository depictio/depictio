    title_size: sm
    title_align: left
    title: Bins per phylum
    layout: {x: 6, y: 0, w: 2, h: 2}

  - component_type: text
    tag: mg-det-intro
    index: mg-det-intro
    section: The bin summary
    title: One row per bin, four tools deep
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      nf-core/mag has a process that writes exactly this table and this run did
      not publish it, so Depictio rebuilds the join from the four tool outputs.
      The tools see different bins, so sources_present counts how many of the
      four reported on each row: a bin with a taxon and no CheckM2 score is a
      real state of the run, not a missing value. Click a bin on the scatter to
      read its whole row in the card beside it; the card opens on a
      high-quality Klebsiella pneumoniae draft until you do.
    workflow_tag: mag
    data_collection_tag: bin_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: mg-det-av-mimag
    index: mg-det-av-mimag
    section: The bin summary
    workflow_tag: mag
    data_collection_tag: bin_summary
    use: mag/mimag_scatter
    config:
      x_title: Completeness (%)
      y_title: Contamination (%)
      quadrants:
        x: 90
        y: 5
        labels: [Incomplete and contaminated, Complete but contaminated, Clean but incomplete, Near-complete and clean]
      opacity: 0.8
      legend_pos: bottom
      selection_enabled: true
      selection_column: bin_id
      controls_placement: header
    title: The MIMAG tiers
    description: The same axes as the Bins tab, coloured by the full MIMAG tier rather than by completeness alone. A bin in the bottom right quadrant is a high-quality draft only if it also carries its ribosomal and transfer RNAs. Click a point to open its record.
    title_size: h3
    layout: {x: 0, y: 2, w: 5, h: 9}
  - component_type: advanced_viz
    tag: mg-det-av-record
    index: mg-det-av-record
    section: The bin summary
    workflow_tag: mag
    data_collection_tag: bin_summary
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: bin_id
      title_col: bin_id
      selection_source: any
      default_record: SPAdes-MetaBAT2-CAPES_S7.15
      sections:
        Origin: [sample, assembler, binner]
        Quality: [mimag_tier, quality_tier, completeness, contamination, quality_score, meets_mimag_rna]
        Assembly: [total_length, n_contigs, n50, gc_percent]
        Genes: [cds, cds_per_mbp, trna, rrna]
        Lineage: [domain, phylum, class_name, order, family, genus, species, rank_assigned]
        Coverage: [sources_present]
      link_templates:
        genus: 'https://gtdb.ecogenomic.org/searches?s=al&q={value}'
        species: 'https://gtdb.ecogenomic.org/searches?s=al&q={value}'
    title: Bin record
    description: Everything the four tools say about the picked bin, with its genus and species linked to GTDB. Clearing the selection returns to the default bin.
    title_size: h3
    layout: {x: 5, y: 2, w: 3, h: 9}
  - component_type: advanced_viz
    tag: mg-det-av-sankey
    index: mg-det-av-sankey
    section: The bin summary
    workflow_tag: mag
    data_collection_tag: bin_summary
    use: mag/binner_phylum_flow
    config:
      value_col: total_length
      value_label: binned bases
      value_format: count
      color_mode: source
      link_opacity: 0.45
      sort_mode: total_flow
    title: Assembler to binner to phylum, weighted by binned bases
    description: The same flow as the Taxonomy tab, weighted by bases rather than by bins, so one long-read genome does not count the same as one fragment.
    title_size: h3
    layout: {x: 0, y: 11, w: 8, h: 7}
  - component_type: table
    tag: mg-det-table
    index: mg-det-table
    section: The bin summary
    workflow_tag: mag
    data_collection_tag: bin_summary
    use: mag/bin_summary
    row_selection_enabled: true
    title: Bin summary
    description: Every bin with its quality, assembly statistics, gene content and lineage. Selecting a row carries the bin to the locus map below.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 18, w: 8, h: 7}

  - component_type: text
    tag: mg-det-locus-intro
    index: mg-det-locus-intro
    section: Locus map
    title: One bin, gene by gene
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Prokka renames every contig it annotates, so these coordinates are
      meaningful inside the bin and join to nothing outside it. Pick a bin in
      the left panel: the arrows are its coding sequences, transfer RNAs and
      ribosomal RNAs in the order they sit on the contig. Only the METAMDBG
      bins are covered, because a Prokka GFF carries the bin's whole sequence
      and fetching all of them would be 1.1 GB.
    workflow_tag: mag
    data_collection_tag: prokka_gene_track
    layout: {x: 0, y: 0, w: 8, h: 3}
  - component_type: advanced_viz
    tag: mg-det-av-locus
    index: mg-det-av-locus
    section: Locus map
    workflow_tag: mag
    data_collection_tag: prokka_gene_track
    use: prokka/locus_map
    config:
      show_labels: false
      arrow_height: 0.5
    title: Gene layout along the bin's contigs
    description: Coloured by feature class. A ribosomal RNA operon appears as a short cluster of non-coding arrows among the coding ones.
    title_size: h3
    layout: {x: 0, y: 3, w: 8, h: 7}
  - component_type: figure
