    aggregation: nunique
    column_name: phylum
    column_type: object
    filter_expr: col('phylum').is_not_null() & (col('phylum') != '')
    secondary_layout: top_n
    breakdown_col: assembler
    display:
      icon_name: mdi:bacteria-outline
      icon_color: grape
      caption: distinct phyla, by assembler
    section: Placements at a glance
    tag: mg-tax-card-phyla
    index: tax-card-phyla
