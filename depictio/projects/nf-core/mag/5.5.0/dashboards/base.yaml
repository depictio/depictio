# ============================================================================
# Annotation
# ============================================================================
- title: Annotation
  subtitle: What Prokka found in each bin, and the ribosomal and transfer RNA counts that decide the half of the MIMAG standard completeness cannot answer
  tab_order: 6
  tab_icon: mdi:file-document-outline
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Annotation scope
    icon: mdi:tune
    color: orange
    description: Narrow the bins by gene density and by their RNA counts
  grid_sections:
  - name: Annotation at a glance
    icon: mdi:counter
    color: orange
    description: What was annotated across the bins Prokka ran on
  - name: Gene density
    icon: mdi:chart-scatter-plot
    color: orange
    description: Coding sequences against genome size, the sanity check on a bin's gene content
  - name: The RNA half of MIMAG
    icon: mdi:chart-box-outline
    color: yellow
    description: Ribosomal and transfer RNAs, which a completeness estimate never counts
  components:
  - component_type: card
    tag: mg-ann-card-cds
    index: mg-ann-card-cds
    section: Annotation at a glance
    workflow_tag: mag
    data_collection_tag: prokka_summary
    use: prokka/summary
    aggregation: sum
    column_name: cds
    column_type: int64
    secondary_layout: composition
    breakdown_col: binner
    display: {icon_name: 'mdi:file-document-outline', icon_color: '#FB8C00', title_color: '#FB8C00', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Coding sequences
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: mg-ann-card-density
    index: mg-ann-card-density
    section: Annotation at a glance
    workflow_tag: mag
    data_collection_tag: prokka_summary
    use: prokka/summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: cds_per_mbp
    column_type: float64
    display: {icon_name: 'mdi:scale-balance', icon_color: '#F9A825', title_color: '#F9A825', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Genes per Mbp
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: mg-ann-card-trna
    index: mg-ann-card-trna
    section: Annotation at a glance
    workflow_tag: mag
    data_collection_tag: prokka_summary
    use: prokka/summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: trna
    column_type: int64
    display: {icon_name: 'mdi:dna', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Transfer RNAs
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: mg-ann-card-rrna
    index: mg-ann-card-rrna
    section: Annotation at a glance
    workflow_tag: mag
    data_collection_tag: prokka_summary
    use: prokka/summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: histogram
    column_name: rrna
    column_type: int64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#D81B60', title_color: '#D81B60', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Ribosomal RNAs
    layout: {x: 6, y: 0, w: 2, h: 2}

  - component_type: text
    tag: mg-ann-intro
    index: mg-ann-intro
    section: Gene density
    title: A bin's gene content, as a sanity check
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Bacterial genomes carry roughly 900 coding sequences per megabase, and
      that ratio barely moves between lineages. A bin far above it is carrying
      a duplicated region or a second organism; a bin far below it is carrying
      sequence that is not a genome at all.
    workflow_tag: mag
    data_collection_tag: prokka_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: mg-ann-av-density
    index: mg-ann-av-density
    section: Gene density
    workflow_tag: mag
    data_collection_tag: prokka_summary
    use: prokka/density_vs_size
    config:
      x_title: Bin size (bases)
      y_title: Coding sequences per Mbp
      log_x: true
      opacity: 0.75
      legend_pos: right
      reference_line: horizontal
      reference_value: 900
      controls_placement: header
    title: Gene density against bin size
    description: The line is the roughly 900 coding sequences per megabase a prokaryotic genome carries. Distance from it is how unlike a genome the bin is.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: figure
    tag: mg-ann-fig-density
    index: mg-ann-fig-density
    section: Gene density
    workflow_tag: mag
    data_collection_tag: prokka_summary
    use: prokka/summary
    visu_type: histogram
    dict_kwargs: {x: cds_per_mbp, color: assembler}
    title: Gene density per assembler
    description: Whether the assembler changes how gene-dense the bins it produces look.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 7}

  - component_type: text
    tag: mg-ann-rna-intro
    index: mg-ann-rna-intro
    section: The RNA half of MIMAG
    title: The criterion completeness cannot see
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A high-quality MIMAG draft needs the 5S, 16S and 23S ribosomal RNAs and
      at least 18 transfer RNAs on top of 90 percent completeness and under 5
      percent contamination. Ribosomal RNA operons are repetitive and assemble
      badly, so bins that look finished on the completeness axis routinely fail
      here, and only an annotation step can tell.
    workflow_tag: mag
    data_collection_tag: prokka_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: mg-ann-av-rna
    index: mg-ann-av-rna
    section: The RNA half of MIMAG
    workflow_tag: mag
    data_collection_tag: prokka_summary
    use: prokka/trna_vs_rrna
    config:
      x_title: Transfer RNAs
      y_title: Ribosomal RNAs
      opacity: 0.75
      legend_pos: right
      reference_line: vertical
      reference_value: 18
      controls_placement: header
    title: Transfer RNAs against ribosomal RNAs
    description: The line marks the MIMAG floor of 18 transfer RNAs. Points on the bottom row carry no ribosomal RNA at all and cannot be high-quality drafts.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: table
    tag: mg-ann-table
    index: mg-ann-table
    section: The RNA half of MIMAG
    workflow_tag: mag
    data_collection_tag: prokka_summary
    use: prokka/summary
    row_selection_enabled: false
    title: Annotation summary
    description: Every annotated bin with its feature counts, its gene density and whether it meets the MIMAG RNA criteria.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 9, w: 8, h: 7}

  - component_type: interactive
    tag: mg-filter-ann-density
    index: mg-ann-density-filter
    section: Annotation scope
    group: Annotation scope
    workflow_tag: mag
    data_collection_tag: prokka_summary
    interactive_component_type: RangeSlider
    column_name: cds_per_mbp
    column_type: float64
    display: {title_size: md, custom_color: '#F9A825', icon_name: 'mdi:scale-balance'}
    placement: left
    title: Genes per Mbp
    show_histogram: true
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: mg-filter-ann-trna
    index: mg-ann-trna-filter
    section: Annotation scope
    group: Annotation scope
    workflow_tag: mag
    data_collection_tag: prokka_summary
    interactive_component_type: RangeSlider
    column_name: trna
    column_type: int64
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:dna'}
    placement: left
    title: Transfer RNAs
    show_histogram: true
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: mg-filter-ann-rrna
    index: mg-ann-rrna-filter
    section: Annotation scope
    group: Annotation scope
    workflow_tag: mag
    data_collection_tag: prokka_summary
    interactive_component_type: RangeSlider
    column_name: rrna
    column_type: int64
    display: {title_size: md, custom_color: '#D81B60', icon_name: 'mdi:alert-outline'}
    placement: left
    title: Ribosomal RNAs
    show_histogram: true
    layout: {x: 0, y: 6, w: 1, h: 3}

