    title: Best bin score
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: mg-det-card-phyla
    index: mg-det-card-phyla
    section: Bin detail at a glance
    workflow_tag: mag
    data_collection_tag: bin_summary
    use: mag/bin_summary
    aggregation: nunique
    column_name: bin_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: phylum
