      [MIMAG](https://doi.org/10.1038/nbt.3893) tier all four decide together. Pick a bin on the left,
      or a row of the bin table, to draw its genes along its contigs and open its record. Prokka renames
      the contigs, so the coordinates hold only inside the bin.
    tag: mg-det-intro
    index: det-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: mag
    data_collection_tag: bin_summary
