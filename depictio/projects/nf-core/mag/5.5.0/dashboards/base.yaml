    display:
      icon_name: mdi:check-decagram
      custom_color: grape
    section: Bin detail filters
    tag: mg-det-filter-tier
    index: det-tier-filter
    title: MIMAG tier
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: mag
    data_collection_tag: prokka_gene_track
    interactive_component_type: Select
    column_name: bin_id
    column_type: object
