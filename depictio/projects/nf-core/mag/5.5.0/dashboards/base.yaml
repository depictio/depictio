    tag: mg-tax-ani
    index: tax-ani-alignment
    title: How confidently each bin was named
    description: The line marks 95% identity; points to its left were named above species level.
    layout: {x: 4, y: 0, w: 4, h: 6}
  # Phylum and top 8, the eight the phylum colours were given to, so the bars,
