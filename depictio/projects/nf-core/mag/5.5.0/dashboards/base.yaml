- title: Contigs
  subtitle: How are the contigs covered by each sample's reads?
  tab_group: Assemblies
  tab_order: 3
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Contig filters
    icon: mdi:filter-variant
    color: cyan
    description: The sample whose reads cover the contigs, contig length and depth
  grid_sections:
  - name: Coverage at a glance
    icon: mdi:counter
    color: cyan
    description: The coverage signal every binner is fed
  - name: Length against coverage
    icon: mdi:chart-scatter-plot
    color: cyan
    description: One point per contig and sample, the plot a binner reads
  - name: Depth by sample
    icon: mdi:chart-box-outline
    color: cyan
    description: Each assembly's contig depths in each sample's reads
  - name: Cross-sample recruitment
    icon: mdi:relation-many-to-many
    color: cyan
    description: How much of each sample's reads every assembly recruits
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      Every contig of at least 1 kbp with its depth in each sample's reads mapped back onto the
      assembly, as [MetaBAT 2](https://bitbucket.org/berkeleylab/metabat) summarises them. Contigs of one
      organism sit in a band of constant depth, and a contig deep in one sample but flat in another is
      the signal the binners use. Pick one sample on the left to read its bands alone.
    tag: mg-ctg-intro
    index: ctg-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: mag
    data_collection_tag: contig_depths
    interactive_component_type: MultiSelect
    column_name: read_sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: Contig filters
    tag: mg-ctg-filter-readsample
    index: ctg-readsample-filter
    title: Reads from
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: mag
    data_collection_tag: contig_depths
    interactive_component_type: RangeSlider
    column_name: contig_length
    column_type: int64
    display:
      icon_name: mdi:ruler
      custom_color: cyan
    section: Contig filters
    tag: mg-ctg-filter-length
    index: ctg-length-filter
    title: Contig length (bp)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: mag
    data_collection_tag: contig_depths
    interactive_component_type: RangeSlider
    column_name: depth
    column_type: float64
    display:
      icon_name: mdi:waves
      custom_color: blue
    section: Contig filters
    tag: mg-ctg-filter-depth
    index: ctg-depth-filter
    title: Depth
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: mag
    data_collection_tag: contig_depths
    use: mag/contig_depths
    aggregation: median
    column_name: depth
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:waves
      icon_color: cyan
      caption: median per contig and sample
      decimals: 1
    section: Coverage at a glance
    tag: mg-ctg-card-depth
    index: ctg-card-depth
    title: Depth in a sample
    description: Median depth of a contig in one sample's reads, over every contig and sample.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mag
    data_collection_tag: contig_depths
    use: mag/contig_depths
    aggregation: median
    column_name: mean_depth
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: blue
      caption: median, with its distribution
      decimals: 1
    section: Coverage at a glance
    tag: mg-ctg-card-meandepth
    index: ctg-card-mean-depth
    title: Mean depth
    description: Median of each contig's depth averaged over every sample mapped back.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mag
    data_collection_tag: contig_depths
    use: mag/contig_depths
    aggregation: count
    column_name: contig_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: assembler
    display:
      icon_name: mdi:dna
      icon_color: indigo
      caption: one per contig and sample mapped back, by assembler
    section: Coverage at a glance
    tag: mg-ctg-card-contigs
    index: ctg-card-contigs
    title: Contig-sample pairs
    description: Every depth row, a contig of at least 1 kbp in one sample's reads. Contig names repeat across assemblies, so the rows are counted, not the names.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mag
    data_collection_tag: contig_depths
    use: mag/contig_depths
    aggregation: median
    column_name: contig_length
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: orange
      caption: median, with its spread
    section: Coverage at a glance
    tag: mg-ctg-card-length
    index: ctg-card-length
    title: Contig length (bp)
    description: Median length of the contigs in view.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: mag
    data_collection_tag: contig_depths
    use: mag/length_vs_depth
    config:
      x_title: Contig length (bp)
      y_title: Depth in this sample
      log_x: true
      log_y: true
      # Points, not the density view: histogram2d on log axes crashes the
      # tab in Chromium (wave 2b, reproduced 9 of 9 times). The server sends a
      # hash sample of about 9 500 rows, which scattergl draws without trouble.
      density: false
      density_threshold: 20000
      opacity: 0.45
      marker_size: 4
      legend_pos: right
      selection_enabled: true
      selection_column: read_sample
    section: Length against coverage
    tag: mg-ctg-length-depth
    index: ctg-length-depth
    title: Contig length against depth
    description: A hash sample of the contig and sample pairs. Horizontal bands are organisms; colour is the sample.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: mag
    data_collection_tag: contig_depths
    use: mag/contig_depths
    visu_type: box
    dict_kwargs:
      x: assembly_id
      y: depth
      color: read_sample
      labels: {assembly_id: Assembly, depth: Depth in the sample's reads, read_sample: Reads from}
    section: Depth by sample
    tag: mg-ctg-depth-box
    index: ctg-depth-box
    title: Contig depth by assembly and sample
    description: A sample whose box sits low on an assembly contributed little to it. Whiskers stop at 1.5 IQR.
    layout: {x: 0, y: 0, w: 8, h: 4}
  # Assemblies against samples: sample ids label the columns, so the heatmap
  # takes the full width.
  - component_type: advanced_viz
    workflow_tag: mag
    data_collection_tag: assembly_recruitment
    viz_kind: complex_heatmap
    config:
      viz_kind: complex_heatmap
      index_column: assembly_id
      row_annotation_cols: [assembler]
      cluster_rows: true
      cluster_cols: false
      normalize: log1p
      colorscale: Viridis
    section: Cross-sample recruitment
    tag: mg-ctg-recruitment
    index: ctg-recruitment-heatmap
    title: Assembly by sample recruitment
    description: Rows are assemblies, columns the samples mapped back, colour the log of the mean depth.
    layout: {x: 0, y: 0, w: 8, h: 5}
- title: Bins
  subtitle: How complete and how clean is each recovered bin?
  tab_group: Genomes
  tab_order: 4
  tab_icon: mdi:bacteria-outline
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Bin filters
    icon: mdi:filter-variant
    color: indigo
    description: CheckM2 completeness, contamination and quality band
  grid_sections:
  - name: Bins at a glance
    icon: mdi:counter
    color: indigo
    description: What CheckM2 made of the bins it scored
  - name: Completeness against contamination
    icon: mdi:chart-scatter-plot
    color: indigo
    description: The plane that sorts bins into MIMAG tiers, one point per bin
  - name: Contiguity
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Whether a complete-looking bin is a genome or a pile of fragments
  - name: Completeness by binner
    icon: mdi:chart-bell-curve
    color: indigo
    description: How complete each binner's bins are, side by side
  - name: Tables
    icon: mdi:table
    color: gray
    description: Every bin QUAST measured, with its contigs, length, N50 and GC
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [CheckM2](https://github.com/chklovski/CheckM2) predicts how complete and how contaminated each
      bin is from its marker genes, and [QUAST](https://quast.sourceforge.net) measures its contigs.
      The bottom right of the plane, at least 90% complete and under 5% contaminated, holds the bins
      worth naming. A complete bin with a low N50 is a pile of fragments, not one genome.
    tag: mg-bin-intro
    index: bin-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: mag
    data_collection_tag: checkm2_quality_report
    interactive_component_type: RangeSlider
    column_name: completeness
    column_type: float64
    display:
      icon_name: mdi:check-decagram
      custom_color: green
    section: Bin filters
    tag: mg-bin-filter-completeness
    index: bin-completeness-filter
    title: Completeness (%)
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: mag
    data_collection_tag: checkm2_quality_report
    interactive_component_type: RangeSlider
    column_name: contamination
    column_type: float64
    display:
      icon_name: mdi:alert-outline
      custom_color: red
    section: Bin filters
    tag: mg-bin-filter-contamination
    index: bin-contamination-filter
    title: Contamination (%)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: mag
    data_collection_tag: checkm2_quality_report
    interactive_component_type: MultiSelect
    column_name: quality_tier
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: indigo
    section: Bin filters
    tag: mg-bin-filter-tier
    index: bin-tier-filter
    title: Quality band
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: mag
    data_collection_tag: checkm2_quality_report
    use: checkm2/tier_donut
    aggregation: count
    column_name: bin_id
    column_type: object
    secondary_layout: donut
    breakdown_col: quality_tier
    display:
      icon_name: mdi:bacteria-outline
      icon_color: indigo
      caption: bins, by CheckM2 band
    section: Bins at a glance
    tag: mg-bin-card-count
    index: bin-card-count
    title: Bins scored
    description: Bins CheckM2 scored, split by the band their completeness and contamination fall in.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mag
    data_collection_tag: checkm2_quality_report
    use: checkm2/quality_report
    aggregation: median
    column_name: completeness
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:check-decagram
      icon_color: teal
      caption: median, with its spread
      decimals: 1
    section: Bins at a glance
    tag: mg-bin-card-completeness
    index: bin-card-completeness
    title: Completeness (%)
    description: Median CheckM2 completeness of the bins in view.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mag
    data_collection_tag: checkm2_quality_report
    use: checkm2/quality_report
    aggregation: median
    column_name: contamination
    column_type: float64
    secondary_layout: threshold
    threshold_value: 5
    threshold_direction: max
    threshold_warn: 10
    display:
      icon_name: mdi:alert-outline
      icon_color: red
      caption: median; 5% or less for a high-quality draft
      decimals: 1
    section: Bins at a glance
    tag: mg-bin-card-contamination
    index: bin-card-contamination
    title: Contamination (%)
    description: Median CheckM2 contamination. MIMAG asks under 5% for a high-quality draft, under 10% for a medium one.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mag
    data_collection_tag: checkm2_quality_report
    use: checkm2/quality_report
    aggregation: max
    column_name: quality_score
    column_type: float64
    secondary_layout: top_n
    breakdown_col: binner
    display:
      icon_name: mdi:star-outline
      icon_color: orange
      caption: the best bin, by binner
      decimals: 1
    section: Bins at a glance
    tag: mg-bin-card-score
    index: bin-card-score
    title: Best quality score
    description: The highest completeness minus five times contamination, best binner first.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: mag
    data_collection_tag: checkm2_quality_report
    use: checkm2/completeness_contamination
    config:
      x_title: Completeness (%)
      y_title: Contamination (%)
      quadrants:
        x: 90
        y: 5
        labels: [Incomplete and contaminated, Complete but contaminated, Clean but incomplete, Near-complete and clean]
      opacity: 0.75
      legend_pos: right
      selection_enabled: true
      selection_column: binner
    section: Completeness against contamination
    tag: mg-bin-mimag
    index: bin-mimag-plane
    title: Completeness against contamination
    description: The lines sit at 90% complete and 5% contaminated. Marker size is the bin's length.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: mag
    data_collection_tag: checkm2_quality_report
    use: checkm2/n50_completeness
    config:
      x_title: Contig N50 of the bin (bp)
      y_title: Completeness (%)
      log_x: true
      opacity: 0.75
      legend_pos: bottom
      selection_enabled: true
      selection_column: bin_id
    section: Contiguity
    tag: mg-bin-n50-completeness
    index: bin-n50-completeness
    title: Contiguity against completeness
    description: A complete bin with a low N50 carries the right genes on hundreds of fragments.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: mag
    data_collection_tag: quast_bins_summary
    use: quast/bin_n50_vs_length
    config:
      x_title: Bin length (bp)
      y_title: Contig N50 of the bin (bp)
      log_x: true
      log_y: true
      opacity: 0.75
      legend_pos: bottom
      selection_enabled: true
      selection_column: bin_id
    section: Contiguity
    tag: mg-bin-length-n50
    index: bin-length-n50
    title: Bin length against contig N50
    description: One point per bin, sized by contig count. High on the N50 axis means few long pieces.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: figure
    workflow_tag: mag
    data_collection_tag: checkm2_quality_report
    use: checkm2/quality_report
    visu_type: histogram
    dict_kwargs:
      x: completeness
      color: binner
      labels: {completeness: Completeness (%), binner: Binner}
    section: Completeness by binner
    tag: mg-bin-completeness-hist
    index: bin-completeness-hist
    title: Completeness per binner
    description: Which binner recovers more of each genome, over the same assemblies.
    layout: {x: 0, y: 0, w: 8, h: 4}
