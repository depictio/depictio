  - component_type: advanced_viz
    workflow_tag: mag
    data_collection_tag: gtdbtk_summary
    use: gtdbtk/assembler_binner_phylum
    config:
      value_col: bin_count
      value_label: bins
      value_format: count
      color_mode: source
      link_opacity: 0.45
      sort_mode: total_flow
    section: Binning routes
    tag: mg-tax-sankey
