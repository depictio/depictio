  grid_sections:
  - name: Bin detail at a glance
    icon: mdi:counter
    color: grape
    description: The joined table's headline numbers
  - name: The bin summary
    icon: mdi:set-merge
    color: grape
    description: CheckM2, QUAST, GTDB-Tk and Prokka in one row per bin
  - name: Locus map
    icon: mdi:chart-timeline-variant
    color: violet
