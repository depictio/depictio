# ============================================================================
- title: Contigs
  subtitle: Length against coverage for every contig of at least 1 kbp, once per sample whose reads were mapped back onto the assembly
  tab_order: 3
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Contig scope
    icon: mdi:tune
    color: cyan
    description: Narrow the contigs by the sample whose reads cover them, by length and by depth
  grid_sections:
  - name: Coverage at a glance
    icon: mdi:counter
    color: cyan
    description: The coverage signal every binner is fed
  - name: Length against coverage
    icon: mdi:chart-scatter-plot
    color: cyan
    description: The plot a binner sees before it decides anything
  - name: Depth distribution
    icon: mdi:chart-bell-curve
    color: blue
    description: How the same contigs are covered by each sample's reads
  - name: Cross-sample recruitment
    icon: mdi:relation-many-to-many
    color: indigo
    description: How much of each sample's community every assembly recruits
  components:
  - component_type: card
    tag: mg-ctg-card-contigs
    index: mg-ctg-card-contigs
    section: Coverage at a glance
    workflow_tag: mag
    data_collection_tag: contig_depths
    use: mag/contig_depths
    aggregation: nunique
    column_name: contig_id
    column_type: object
    secondary_layout: composition
    breakdown_col: assembler
    display: {icon_name: 'mdi:chart-scatter-plot', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Contigs over 1 kbp
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: mg-ctg-card-depth
    index: mg-ctg-card-depth
    section: Coverage at a glance
    workflow_tag: mag
    data_collection_tag: contig_depths
    use: mag/contig_depths
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: depth
    column_type: float64
    display: {icon_name: 'mdi:waves', icon_color: '#1E88E5', title_color: '#1E88E5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Depth per sample
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: mg-ctg-card-meandepth
    index: mg-ctg-card-meandepth
    section: Coverage at a glance
    workflow_tag: mag
    data_collection_tag: contig_depths
    use: mag/contig_depths
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: histogram
    column_name: mean_depth
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#3949AB', title_color: '#3949AB', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mean depth
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: mg-ctg-card-longest
    index: mg-ctg-card-longest
    section: Coverage at a glance
    workflow_tag: mag
    data_collection_tag: contig_depths
    use: mag/contig_depths
    aggregation: max
    column_name: contig_length
    column_type: int64
    secondary_layout: top_n
    breakdown_col: assembly_id
    top_n_count: 4
    display: {icon_name: 'mdi:ruler', icon_color: '#FB8C00', title_color: '#FB8C00', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Longest contig
    layout: {x: 6, y: 0, w: 2, h: 2}

  - component_type: text
    tag: mg-ctg-intro
    index: mg-ctg-intro
    section: Length against coverage
    title: The signal the binners actually use
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Every sample's reads were mapped back onto every assembly, so each contig
      carries three depths. Contigs of one organism sit in a band of constant
      depth, and a contig deep in one sample and flat in another belongs to
      something only one of them carries. That difference is the whole reason
      differential-coverage binning works.
    workflow_tag: mag
    data_collection_tag: contig_depths
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: mg-ctg-av-scatter
    index: mg-ctg-av-scatter
    section: Length against coverage
    workflow_tag: mag
    data_collection_tag: contig_depths
    use: mag/length_vs_depth
    config:
      x_title: Contig length (bp)
      y_title: Depth in this sample
      log_x: true
      log_y: true
      # Points, not the density view: histogram2d on log axes crashes the
      # tab in Chromium (wave 2b, reproduced 9 of 9 times). The server sends a
      # hash sample of about 9 500 rows, which scattergl draws without trouble.
      density: false
      density_threshold: 20000
      opacity: 0.45
      marker_size: 4
      legend_pos: right
      selection_enabled: true
      selection_column: read_sample
      controls_placement: header
    title: Contig length against depth
    description: A hash sample of the contig and sample pairs, one point each. Horizontal bands are organisms, and the spread at a given length is how separable they are. Pick one sample in the left panel to read its bands alone.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}

  - component_type: text
    tag: mg-ctg-dist-intro
    index: mg-ctg-dist-intro
    section: Depth distribution
    title: Three samples over the same contigs
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The same contigs, read as distributions rather than as points. A sample
      whose histogram sits far left on another sample's assembly contributed
      little to it, which is what makes a co-assembly worth binning across
      samples in the first place.
    workflow_tag: mag
    data_collection_tag: contig_depths
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: mg-ctg-fig-hist
    index: mg-ctg-fig-hist
    section: Depth distribution
    workflow_tag: mag
    data_collection_tag: contig_depths
    use: mag/contig_depths
    visu_type: histogram
    dict_kwargs: {x: depth, color: read_sample}
    title: Contig depth distribution per sample
    description: How deeply each sample's reads cover the contigs of the selected assemblies.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: figure
    tag: mg-ctg-fig-box
    index: mg-ctg-fig-box
    section: Depth distribution
    workflow_tag: mag
    data_collection_tag: contig_depths
    use: mag/contig_depths
    visu_type: box
    dict_kwargs: {x: assembly_id, y: depth, color: read_sample}
    title: Contig depth by assembly and sample
    description: The cross-mapping matrix read as boxes, each assembly against each sample's reads.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 7}

  - component_type: text
    tag: mg-rec-intro
    index: mg-rec-intro
    section: Cross-sample recruitment
    title: Which sample's organisms each assembly holds
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The canonical figure here is a bin by sample depth heatmap, and its input
      (GenomeBinning/depths/bins/) is not published by this run, nor is the
      contig to bin membership. One level up is honest: each cell is an
      assembly's length-weighted mean depth in one sample's reads. A bright
      diagonal means the samples carry different organisms; a bright row means
      the other samples also carry that assembly's organisms, which is when a
      co-assembly would have paid off.
    workflow_tag: mag
    data_collection_tag: assembly_recruitment
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: mg-rec-av-heatmap
    index: mg-rec-av-heatmap
    section: Cross-sample recruitment
    workflow_tag: mag
    data_collection_tag: assembly_recruitment
    viz_kind: complex_heatmap
    config:
      viz_kind: complex_heatmap
      index_column: assembly_id
      row_annotation_cols: [assembler]
      cluster_rows: true
      cluster_cols: false
      normalize: log1p
      colorscale: Viridis
    title: Assembly by sample recruitment
    description: Rows are assemblies, columns the samples whose reads were mapped back, colour the log of the mean depth. Rows cluster by recruitment profile, so assemblies of one sample by different assemblers sit together.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 6}

  - component_type: interactive
    tag: mg-filter-ctg-readsample
    index: mg-ctg-readsample-filter
    section: Contig scope
    group: Contig scope
    workflow_tag: mag
    data_collection_tag: contig_depths
    interactive_component_type: MultiSelect
    column_name: read_sample
    column_type: object
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:test-tube'}
    placement: left
    title: Reads from
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: mg-filter-ctg-length
    index: mg-ctg-length-filter
    section: Contig scope
    group: Contig scope
    workflow_tag: mag
    data_collection_tag: contig_depths
    interactive_component_type: RangeSlider
    column_name: contig_length
    column_type: int64
    display: {title_size: md, custom_color: '#1E88E5', icon_name: 'mdi:ruler'}
    placement: left
    title: Contig length (bp)
    show_histogram: true
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: mg-filter-ctg-depth
    index: mg-ctg-depth-filter
    section: Contig scope
    group: Contig scope
    workflow_tag: mag
    data_collection_tag: contig_depths
    interactive_component_type: RangeSlider
    column_name: depth
    column_type: float64
    display: {title_size: md, custom_color: '#3949AB', icon_name: 'mdi:waves'}
    placement: left
    title: Depth
    show_histogram: true
    layout: {x: 0, y: 6, w: 1, h: 3}

