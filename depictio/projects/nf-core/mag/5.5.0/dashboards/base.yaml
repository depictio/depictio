    layout: {x: 6, y: 0, w: 2, h: 2}

  - component_type: text
    tag: mg-bin-intro
    index: mg-bin-intro
    section: Completeness against contamination
    title: Where a bin becomes a genome
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Completeness on the x axis, contamination on the y axis, one point per
      bin, sized by the bases it holds. The lines sit at the MIMAG high-quality
      cut, 90 percent complete and under 5 percent contaminated, so the bottom
      right quadrant holds the bins worth naming; anything above 10 percent
      contamination is a chimera whatever its completeness says. Colour is the
      binner, so the spread between five binners on the same assembly is
      readable directly.
    workflow_tag: mag
    data_collection_tag: checkm2_quality_report
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: mg-bin-av-mimag
    index: mg-bin-av-mimag
    section: Completeness against contamination
    workflow_tag: mag
    data_collection_tag: checkm2_quality_report
    use: checkm2/completeness_contamination
    config:
      x_title: Completeness (%)
      y_title: Contamination (%)
      quadrants:
        x: 90
        y: 5
        labels: [Incomplete and contaminated, Complete but contaminated, Clean but incomplete, Near-complete and clean]
      opacity: 0.75
      legend_pos: right
      selection_enabled: true
      selection_column: binner
      controls_placement: header
    title: Completeness against contamination
    description: The quadrant lines sit at 90 percent completeness and 5 percent contamination, the CheckM2 half of the MIMAG high-quality draft. Marker size is the bin's assembled length.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: advanced_viz
    tag: mg-bin-av-n50
    index: mg-bin-av-n50
    section: Completeness against contamination
    workflow_tag: mag
    data_collection_tag: checkm2_quality_report
    use: checkm2/n50_completeness
    config:
      x_title: Contig N50 of the bin (bp)
      y_title: Completeness (%)
      log_x: true
      opacity: 0.75
      legend_pos: right
      controls_placement: header
    title: Contiguity against completeness
    description: A bin with a high completeness and a low N50 carries the right genes on hundreds of fragments, which is not the same object as a closed genome.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 7}
  - component_type: figure
    tag: mg-bin-fig-hist
    index: mg-bin-fig-hist
    section: Completeness against contamination
    workflow_tag: mag
    data_collection_tag: checkm2_quality_report
    use: checkm2/quality_report
    visu_type: histogram
    dict_kwargs: {x: completeness, color: binner}
    title: Completeness distribution per binner
    description: Which binner recovers more of each genome, over the selected assemblies and samples.
    title_size: h3
    layout: {x: 0, y: 16, w: 8, h: 7}

  - component_type: text
    tag: mg-binq-intro
    index: mg-binq-intro
    section: Bin assembly statistics
    title: The same bins, measured rather than predicted
    title_size: sm
    title_align: left
