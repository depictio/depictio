# Megatest manifest for nf-core/mag 5.4.2 (read by scripts/nfcore_megatest.py).
#
# Which AWS megatest run this template was validated against and the tables-only
# subset of it that the template recipes and MultiQC need. Fetch it with:
#
#   python scripts/nfcore_megatest.py fetch --pipeline mag --version 5.4.2 [--dest DIR]
#   bash download_test_data.sh [DIR]      # same thing
#
# Keys are fnmatch globs relative to run_root (here the prefix root) and are
# mirrored 1:1 below the destination, which becomes the template DATA_ROOT.
# fnmatch's `*` crosses `/`, so `GenomeBinning/*.tsv` also matches nested files
# such as `GenomeBinning/contig_to_bin/contig_to_bin_map.tsv`.
#
# 5.4.2 is pinned instead of 5.5.0 on purpose: the 5.5.0 megatest prefix is a
# partial run (63 objects, no multiqc/). Assemblies and bin FASTA files are left
# out; the template reads the binning tables and the MultiQC report.
#
# REVISED against the actual local fetch (previous version below was a guess
# from the pipeline's docs, not the AWS run's real layout):
#   - No `Taxonomy/`, `QC_shortreads/` or `QC_longreads/` directory exists in
#     this run's prefix at all (0 objects under any of those keys), GTDB-Tk,
#     Kraken2/Centrifuge/CAT and the standalone read-QC reports were not
#     published for this megatest. Those keys are dropped.
#   - No `Assembly/` directory either (0 objects), no standalone QUAST report
#     files. Unlike Taxonomy/QC_shortreads this was not independently
#     confirmed against S3 (never listed it, per policy); it may simply not
#     have been produced for this run, or may need a fresh fetch. Flagged as
#     an open question in VALIDATION_REPORT.md rather than silently assumed.
#   - `Annotation/` was NOT fetched into the local DATA_ROOT (0 objects
#     locally) even though the real S3 prefix holds 917 files there (per-bin
#     Prokka .txt/.tsv summaries, one prefix per assembler/binner/sample/bin).
#     The key is kept because the objects are real; the local snapshot this
#     template was built and tested against simply doesn't have them, so no
#     Annotation-based catalog output could be authored or validated. See
#     VALIDATION_REPORT.md.
#   - `GenomeBinning/*` keys were correct as written (matched, via fnmatch
#     crossing `/`) and now mirror everything actually published there: the
#     cross-binner `contig_to_bin_map.tsv` (no per-binner depth/summary/BUSCO/
#     CheckM/GUNC files, MetaBAT2/MaxBin2/CONCOCT depths never materialised
#     either) plus COMEBin's raw per-contig embedding vectors
#     (`COMEBin/stats/<assembler>-COMEBin-<sample>/{embeddings,covembeddings}.tsv`,
#     128-dim, unbounded per-contig, not used by the template; see
#     VALIDATION_REPORT.md for why).
#   - `pipeline_info/params_*.json` never matched (the real file is
#     `pipeline_info/params.json`, no underscore-separated suffix). Fixed to
#     a glob that covers both the plain and a dated/suffixed name.
#   - Bin quality (CheckM2 completeness/contamination), assembly QC (QUAST
#     N50/L50/contig counts) and annotation summaries (Prokka coding density,
#     CDS counts) DO reach the template, just not as standalone files: MultiQC
#     1.31's general-stats table carries all three as extra columns even
#     though this run publishes no standalone CheckM2/QUAST/Prokka report
#     files locally. The dashboard's MultiQC general-stats panel is where
#     those numbers actually show up.
pipeline: mag
version: "5.4.2"
# s3://nf-core-awsmegatests/mag/results-<results_sha>/ == the 5.4.2 release tag_sha.
results_sha: "5dabb0159ac0104885e09f301db22126e8fcb394"
run_root: ""
multiqc:
  version: "1.31"
  parquet: multiqc/multiqc_data/multiqc.parquet
  reprocess: false
keys:
  - pipeline_info/params*.json
  - pipeline_info/*software*versions*.yml
  - multiqc/multiqc_data/multiqc.parquet
  - multiqc/multiqc_data/*.txt
  - multiqc/multiqc_data/*.json
  - multiqc/multiqc_data/*.log
  # Binning: cross-binner contig-to-bin membership (MetaBAT2 / MaxBin2 /
  # MetaBinner / SemiBin2 / COMEBin) and COMEBin's own raw per-contig
  # embeddings. No per-bin quality (CheckM2/BUSCO/GUNC) or depth files
  # publish locally; those numbers surface only through MultiQC.
  - GenomeBinning/*.tsv
  - GenomeBinning/*.txt
  - GenomeBinning/*.csv
  - GenomeBinning/*.summary
  - GenomeBinning/*.json
  # Annotation (Prokka). Real on S3 (917 files) but not part of the local
  # DATA_ROOT this template was built against, kept for a future fetch.
  - Annotation/*.txt
  - Annotation/*.tsv
prefix_keys: []
renames: {}
post_fetch_help: |
  === Quick test commands ===

  # 1. Dry run (validates the template against the data, no ingestion)
  depictio-cli run --template nf-core/mag/5.4.2 --data-root {dest} --dry-run

  # 2. Full run (needs a reachable server and ~/.depictio/CLI.yaml)
  depictio-cli run --template nf-core/mag/5.4.2 --data-root {dest}
