version: 1
# nf-core/mag 5.4.2 reference dashboard.
#
# Two tabs, not the usual funnel of four or five: the megatest run's real
# layout does not publish standalone taxonomy, read-QC, assembly-QC or
# bin-quality report files (see megatest.yaml and VALIDATION_REPORT.md for the
# full discrepancy list against what the pipeline's docs suggest). MultiQC's
# general-stats table is where CheckM2 completeness/contamination, QUAST
# N50/contig counts and Prokka coding-density actually surface for this run,
# so the MultiQC tab carries all of that at once. The only standalone table
# this run publishes beyond MultiQC is the cross-binner contig-to-bin map,
# which the Binning tab turns into a per-bin contig count and a
# binner-comparison summary, contig counts, not completeness: no
# BUSCO/CheckM/GUNC table ships locally to say whether a bin is any good, only
# MultiQC's checkm2 general-stats columns do.
#
# The sample hub is the anchor: the sample filter in the left panel reaches
# the MultiQC panels and both binning tables through the project links.
main_dashboard:
  title: nf-core/mag
  subtitle: "nf-core/mag 5.4.2 megatest: 3 samples (CAPES_S7, CAPES_S11, CAPES_S21), hybrid short+long read metagenome assembly and cross-binner recovery"
  project_tag: Metagenome Assembly and Binning
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab through the project links
    persistent: true
    pin: top
  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: MultiQC's general statistics table, pooling read QC, assembly QC and bin QC/annotation for every sample and bin
  # Pinned to the top and carried by every tab.
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The sample hub every other tab is filtered by
    collapsed: true
    persistent: true
    pin: top
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The binner comparison summary, on every tab
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # ------------------------------------------------------------- at a glance
  - component_type: text
    tag: mg-qc-intro
    section: Run at a glance
    title: A mag run, from reads to bins
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      MultiQC's general statistics table pools read QC, assembly QC (QUAST)
      and bin QC/annotation (CheckM2, Prokka), none publish a standalone
      report here, so this panel is where they surface. Bin recovery is on
      the Binning tab.
    workflow_tag: mag
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: mg-qc-general-stats
    section: Run at a glance
    workflow_tag: mag
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    title: General statistics
    description: One row per sample and per bin, pooling FastQC, fastp, Porechop_ABI, Bowtie2, QUAST, CheckM2 and Prokka. Use the table's column picker to narrow which module's columns show.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 5}

  # -------------------------------------------------------------- sample sheet
  - component_type: text
    tag: mg-samples-intro
    section: Sample sheet
    title: The design behind every panel
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per sample, with its co-assembly group and whether it also has
      a long-read run (hybrid short+long assembly). This is the collection
      the sample filter in the left panel is sourced on, so it is what
      narrows every other tab.
    workflow_tag: mag
    data_collection_tag: samples
    layout: {x: 0, y: 0, w: 6, h: 2}
  - component_type: card
    tag: mg-samples-card-count
    index: mg-samples-card-count
    section: Sample sheet
    workflow_tag: mag
    data_collection_tag: samples
    aggregation: count
    column_name: sample_id
    column_type: object
    display: {icon_name: 'mdi:test-tube', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Samples
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: table
    tag: mg-samples-table
    section: Sample sheet
    workflow_tag: mag
    data_collection_tag: samples
    row_selection_enabled: false
    title: Sample hub
    description: One row per sample, with its co-assembly group and read platforms.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 4}

  # ---------------------------------------------------------- reference tables
  - component_type: text
    tag: mg-ref-intro
    section: Reference tables
    title: How each binner split the assembly
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per sample, assembler and binner: how many bins it recovered
      and the spread of contigs per bin. The per-bin detail behind these rows
      is on the Binning tab.
    workflow_tag: mag
    data_collection_tag: binner_comparison
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: table
    tag: mg-ref-table-binner-comparison
    section: Reference tables
    workflow_tag: mag
    data_collection_tag: binner_comparison
    row_selection_enabled: false
    title: Binner comparison
    description: Bins recovered and the contigs-per-bin spread, per sample, assembler and binner.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 4}

  # ---------------------------------------------------------------- filters
  - component_type: interactive
    tag: mg-filter-sample
    index: mg-sample-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: mag
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:test-tube'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}

tabs:
# ============================================================================
# Binning
# ============================================================================
- title: Binning
  subtitle: Contig counts per bin, per binner and per assembler, from the cross-binner contig-to-bin map. No completeness/contamination table ships locally, see the CheckM2 columns on the MultiQC tab for that.
  tab_order: 2
  tab_icon: mdi:bacteria-outline
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Binning scope
    icon: mdi:tune
    color: indigo
    description: Narrow the binner comparison and the per-bin table by assembler and binner
  grid_sections:
  - name: Binner recovery
    icon: mdi:chart-bar
    color: indigo
    description: How many bins each binner recovered per sample and assembler, and how it split the contigs
  - name: Per-bin detail
    icon: mdi:table
    color: grape
    description: Every recovered bin with its contig count
    collapsed: true
  components:
  # ------------------------------------------------------------- recovery
  - component_type: text
    tag: mg-bin-intro
    section: Binner recovery
    title: Five binners, one contig-to-bin map
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      nf-core/mag runs MetaBAT2, MaxBin2, MetaBinner, SemiBin2 and COMEBin
      over each assembly. This tab counts contigs per bin, a recovery
      yield, not a quality score: no BUSCO/CheckM/GUNC table publishes here
      (see the MultiQC tab's CheckM2 columns for that).
    workflow_tag: mag
    data_collection_tag: binner_comparison
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: mg-bin-card-nbins
    index: mg-bin-card-nbins
    section: Binner recovery
    workflow_tag: mag
    data_collection_tag: binner_comparison
    aggregation: sum
    column_name: n_bins
    column_type: int64
    secondary_layout: top_n
    breakdown_col: binner
    top_n_count: 3
    display: {icon_name: 'mdi:bacteria-outline', icon_color: '#3949AB', title_color: '#3949AB', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Bins recovered
    layout: {x: 0, y: 1, w: 2, h: 2}
  - component_type: card
    tag: mg-bin-card-contigs
    index: mg-bin-card-contigs
    section: Binner recovery
    workflow_tag: mag
    data_collection_tag: binner_comparison
    aggregation: sum
    column_name: total_contigs
    column_type: int64
    display: {icon_name: 'mdi:chart-scatter-plot', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Contigs binned
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: mg-bin-card-meansize
    index: mg-bin-card-meansize
    section: Binner recovery
    workflow_tag: mag
    data_collection_tag: binner_comparison
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: mean_contigs_per_bin
    column_type: float64
    display: {icon_name: 'mdi:scale-balance', icon_color: '#FB8C00', title_color: '#FB8C00', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mean bin size
    layout: {x: 4, y: 1, w: 2, h: 2}
  - component_type: card
    tag: mg-bin-card-maxsize
    index: mg-bin-card-maxsize
    section: Binner recovery
    workflow_tag: mag
    data_collection_tag: binner_comparison
    aggregation: max
    column_name: max_contigs_per_bin
    column_type: int64
    display: {icon_name: 'mdi:chart-bar', icon_color: '#D81B60', title_color: '#D81B60', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Largest bin
    layout: {x: 6, y: 1, w: 2, h: 2}
  - component_type: figure
    tag: mg-bin-fig-nbins
    index: mg-bin-fig-nbins
    section: Binner recovery
    workflow_tag: mag
    data_collection_tag: binner_comparison
    visu_type: bar
    dict_kwargs: {x: binner, y: n_bins, color: assembler}
    title: Bins recovered per binner and assembler
    description: How aggressively each binner split the assembly into bins, summed across the selected samples.
    title_size: h3
    layout: {x: 0, y: 3, w: 8, h: 7}

  # ------------------------------------------------------------ per-bin detail
  - component_type: text
    tag: mg-bindetail-intro
    section: Per-bin detail
    title: Every recovered bin
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per bin, with its contig count. Narrow it with the assembler
      and binner filters in the left panel.
    workflow_tag: mag
    data_collection_tag: bin_summary
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: table
    tag: mg-bindetail-table
    section: Per-bin detail
    workflow_tag: mag
    data_collection_tag: bin_summary
    row_selection_enabled: false
    title: Per-bin contig counts
    description: Every bin recovered across every sample, assembler and binner, with its contig count.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 7}

  # ---------------------------------------------------------------- filters
  - component_type: interactive
    tag: mg-filter-assembler
    index: mg-assembler-filter
    section: Binning scope
    group: Binning scope
    workflow_tag: mag
    data_collection_tag: binner_comparison
    interactive_component_type: Select
    column_name: assembler
    column_type: object
    display: {title_size: md, custom_color: '#3949AB', icon_name: 'mdi:dna'}
    placement: left
    title: Assembler
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: mg-filter-binner
    index: mg-binner-filter
    section: Binning scope
    group: Binning scope
    workflow_tag: mag
    data_collection_tag: binner_comparison
    interactive_component_type: MultiSelect
    column_name: binner
    column_type: object
    display: {title_size: md, custom_color: '#3949AB', icon_name: 'mdi:bacteria-outline'}
    placement: left
    title: Binner
    layout: {x: 0, y: 3, w: 1, h: 3}
