# nf-core/mag Template 5.4.2 - metagenome assembly and binning
# ============================================================================
# This is a TEMPLATE project configuration. Use with:
#   depictio run --template nf-core/mag/5.4.2 --data-root /path/to/your/data
#
# Tested against nf-core/mag AWS megatest results:
#   s3://nf-core-awsmegatests/mag/results-5dabb0159ac0104885e09f301db22126e8fcb394
#   (samplesheet.full.v4.csv: 3 samples, hybrid short+long read assembly. See
#    megatest.yaml.)
# ============================================================================
#
# SCOPE, this template is thinner than most nf-core templates because the
# megatest run's real layout does NOT match what the pipeline's docs suggest
# is published. See megatest.yaml's header for the corrected key list and
# VALIDATION_REPORT.md for the full discrepancy list. In short:
#   - No standalone GTDB-Tk / Kraken2 / Centrifuge / CAT taxonomy files.
#   - No standalone read-QC (FastQC/fastp/Filtlong/NanoPlot) report files.
#   - No standalone QUAST assembly-report files.
#   - No standalone CheckM2/BUSCO/GUNC bin-quality files, no per-binner depth
#     tables, no bin_summary.tsv.
#   - No Prokka annotation files in the local DATA_ROOT (917 real files exist
#     on S3 but were not fetched locally; see megatest.yaml).
# What DOES exist locally: the cross-binner contig-to-bin membership map
# (GenomeBinning/contig_to_bin/contig_to_bin_map.tsv, 5 binners x 4 assemblers
# x 3 samples), COMEBin's raw per-contig 128-dim embeddings (not used, see
# VALIDATION_REPORT.md), and a MultiQC 1.31 parquet whose general-stats table
# DOES carry CheckM2 completeness/contamination, QUAST N50/contig counts and
# Prokka coding-density columns even though the standalone report files those
# numbers would otherwise come from are absent. The dashboard therefore leans
# on MultiQC's general statistics panel for QC/assembly/annotation, and on a
# pipeline-local bin-summary table (contig counts per bin, not completeness)
# for binning.
template:
  template_id: "nf-core/mag/5.4.2"
  description: "nf-core/mag template: cross-binner bin recovery (contig counts per bin, per binner, per assembler) next to the MultiQC report, whose general-stats table is where CheckM2 bin quality, QUAST assembly QC and Prokka annotation summaries actually surface for this run."
  version: "1.0.0"
  variables:
    - name: "DATA_ROOT"
      description: "Root directory containing mag output (GenomeBinning/, Annotation/, pipeline_info/) plus multiqc/multiqc_data/multiqc.parquet."
      required: true
  reference:
    vars: {}
  provenance:
    sources:
      - name: "software_versions"
        glob: "pipeline_info/software_versions.yml"
        format: "yaml"
        pick: "latest"
        group: "Software versions"
      - name: "params"
        glob: "pipeline_info/params*.json"
        format: "json"
        pick: "latest"
        group: "Pipeline parameters"
    groups:
      - group: "Software versions"
        key_patterns: ["*"]
      - group: "Pipeline parameters"
        key_patterns: ["*"]
  dashboards:
    - "dashboards/base.yaml"

# ============================================================================
# PROJECT CONFIGURATION
# ============================================================================

name: "Metagenome Assembly and Binning"
project_type: "advanced"
is_public: true
workflows:
  - name: "mag"
    version: "5.4.2"
    engine:
      name: "nextflow"
      version: "24.10.5"
    catalog:
      name: "nf-core"
      url: "https://nf-co.re"
    repository_url: "https://github.com/nf-core/mag"
    data_location:
      structure: "flat"
      locations:
        - "{DATA_ROOT}"
    data_collections:
      # ----------------------------------------------------------------
      # Hub: one row per mag sample. The samplesheet is already
      # sample-level (unlike cutandrun/hic's library-level sheets), so this
      # recipe only renames `sample` -> `sample_id` and drops the FASTQ URLs.
      # ----------------------------------------------------------------
      - data_collection_tag: "samples"
        description: "Per-sample hub: the sample name every GenomeBinning/Annotation output uses, its co-assembly group and whether it has a long-read run (hybrid assembly)"
        config:
          type: "Table"
          metatype: "Metadata"
          source: "transformed"
          transform:
            recipe: "nf-core/mag/samples.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample_id": "Sample name every GenomeBinning output uses, the key every other collection is linked on"
              "group": "Co-assembly group (mag's `group` samplesheet column)"
              "short_reads_platform": "Sequencing platform of the short-read pair"
              "long_reads_platform": "Sequencing platform of the long-read run, null if short-read only"
              "has_long_reads": "True when the sample also has a long-read run (hybrid short+long assembly)"

      # ----------------------------------------------------------------
      # MultiQC. general-stats carries CheckM2 (Completeness, Contamination),
      # QUAST (Total length, N50, L50, Largest contig, Total_Contigs),
      # Prokka (Coding_Density, Total_Coding_Sequences, Genome_Size) and
      # Bowtie2/fastp/fastqc/Porechop_ABI QC columns side by side, this run
      # publishes no standalone report file for any of those five modules,
      # so this panel is the only place those numbers reach the dashboard.
      # ----------------------------------------------------------------
      - data_collection_tag: "multiqc_data"
        description: "MultiQC 1.31 report: general statistics pooling read QC (FastQC/fastp/Porechop_ABI/Bowtie2), assembly QC (QUAST) and bin QC/annotation (CheckM2, Prokka)"
        config:
          type: "MultiQC"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: "multiqc/multiqc_data/multiqc.parquet"
          dc_specific_properties:
            s3_location: null
            modules:
              - "general_stats"
              - "fastqc"
              - "fastp"
              - "porechop"
              - "bowtie2"
              - "checkm2"
              - "quast"
              - "prokka"
            plots:
              general_stats:
                - "General Statistics"
            # No per-module plots beyond general_stats are bound below: this
            # run's parquet carries checkm2/porechop/prokka/bowtie2/fastp/
            # fastqc as general-stats columns only, and the module-specific
            # plot titles (e.g. QUAST's own table) could not be confirmed
            # from this parquet's stripped plot metadata (pconfig/config are
            # both null on every row), see VALIDATION_REPORT.md.

      # ----------------------------------------------------------------
      # Binning. Raw cross-binner contig-to-bin membership (one row per
      # contig per binner) feeds bin_summary (one row per bin) and
      # binner_comparison (one row per sample/assembler/binner). No
      # per-bin quality (CheckM2/BUSCO/GUNC) or depth table ships locally
      # beside it, `optional: true` because the whole binning chain
      # depends on this one file existing.
      # ----------------------------------------------------------------
      - data_collection_tag: "mag_contig_to_bin_raw"
        description: "Raw cross-binner contig-to-bin membership (input of bin_summary)"
        optional: true
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: "contig_to_bin_map\\.tsv$"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
              has_header: true
            columns_description:
              "assembly_id": "<ASSEMBLER>-<SAMPLE>, e.g. FLYE-CAPES_S11"
              "contig_id": "Contig identifier inside that assembly"
              "binner": "COMEBin, MaxBin2, MetaBAT2, MetaBinner or SemiBin2"
              "bin_id": "Bin identifier as the binner wrote it"

      - data_collection_tag: "bin_summary"
        description: "One row per recovered bin: which sample, assembler and binner it came from, and how many contigs it holds"
        optional: true
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "nf-core/mag/bin_summary.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Sample the assembly was built from"
              "assembler": "FLYE, MEGAHIT, METAMDBG or SPAdes"
              "binner": "COMEBin, MaxBin2, MetaBAT2, MetaBinner or SemiBin2"
              "bin_id": "Bin identifier as the binner wrote it"
              "n_contigs": "Contigs this binner placed in this bin"

      - data_collection_tag: "binner_comparison"
        description: "One row per sample and binner: how many bins it recovered per assembler, and the contigs-per-bin spread"
        optional: true
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "nf-core/mag/binner_comparison.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Sample the assembly was built from"
              "assembler": "FLYE, MEGAHIT, METAMDBG or SPAdes"
              "binner": "COMEBin, MaxBin2, MetaBAT2, MetaBinner or SemiBin2"
              "n_bins": "Bins this binner recovered"
              "total_contigs": "Contigs placed into any bin"
              "mean_contigs_per_bin": "total_contigs / n_bins"
              "median_contigs_per_bin": "Median bin size (contigs)"
              "max_contigs_per_bin": "Largest bin (contigs)"
              "min_contigs_per_bin": "Smallest bin (contigs)"

links:
  # Hub -> MultiQC, resolved through the report's own recorded sample-name
  # variants (bin ids, per-lane read-QC tags never equal sample_id directly).
  - source_dc_tag: "samples"
    source_column: "sample_id"
    target_dc_tag: "multiqc_data"
    target_type: "multiqc"
    link_config:
      resolver: "sample_mapping"
      target_field: "sample_name"
    description: "Filter the MultiQC panels by the samples picked in the left panel"
    enabled: true

  - source_dc_tag: "samples"
    source_column: "sample_id"
    target_dc_tag: "bin_summary"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the per-bin table by the samples picked in the left panel"
    enabled: true

  - source_dc_tag: "samples"
    source_column: "sample_id"
    target_dc_tag: "binner_comparison"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the binner comparison by the samples picked in the left panel"
    enabled: true

  # Reverse link: a bin selected on the per-bin table carries its sample back
  # to the binner comparison row.
  - source_dc_tag: "bin_summary"
    source_column: "sample"
    target_dc_tag: "binner_comparison"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Carry a sample selected on the per-bin table over to the binner comparison"
    enabled: true

  # Binning tab's local assembler/binner filters are sourced on
  # binner_comparison (coarser picklist) and cascade to the per-bin table.
  - source_dc_tag: "binner_comparison"
    source_column: "assembler"
    target_dc_tag: "bin_summary"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "assembler"
    description: "Filter the per-bin table by the assembler picked on the Binning tab"
    enabled: true

  - source_dc_tag: "binner_comparison"
    source_column: "binner"
    target_dc_tag: "bin_summary"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "binner"
    description: "Filter the per-bin table by the binner picked on the Binning tab"
    enabled: true
