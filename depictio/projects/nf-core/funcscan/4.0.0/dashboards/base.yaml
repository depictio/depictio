# nf-core/funcscan 4.0.0 functional screening dashboard
# ============================================================================
# Funnel: Screening overview (what did the four screens find, per sample) ->
# Annotation (which contigs they touched) -> Resistome -> AMPs -> BGCs ->
# CAZymes, each drilling into one screen, then Run report. The `Sample sheet`
# section is persistent and pinned to the top and `Reference tables` to the
# bottom, so the cohort and the rows behind every tile are one click away on
# every tab.
#
# The run's MultiQC report carries software versions only: a single
# run_metadata row, no general-stats and no plot sections at all, which is why
# there is no MultiQC tab. The versions are read out of the same parquet and
# shown as a table on the Run report tab instead.
#
# The funcscan samplesheet is `sample,fasta`, with no experimental factor, so
# the persistent filter section carries the sample plus the hub's own
# per-screen counts rather than a cohort variable, and every tab adds a
# non-persistent section on its own collection's columns.
# ============================================================================
version: 1

main_dashboard:
  title: nf-core/funcscan
  subtitle: Functional screening of assemblies for AMR genes, peptides, clusters and CAZymes
  project_tag: Funcscan Functional Screening
  main_tab_name: Screening overview
  tab_icon: mdi:target-arrow
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core

  filter_sections:
  - name: Sample scope
    icon: mdi:test-tube
    color: teal
    description: Reaches every tab and every screen through the project links
    persistent: true
    pin: top
  - name: Cohort thresholds
    icon: mdi:tune
    color: indigo
    description: Floors on this tab's own hub columns, not carried to the other tabs
    collapsed: true

  grid_sections:
  - name: Screening at a glance
    icon: mdi:counter
    color: indigo
    description: What the four screens found across the whole run
  - name: Screen composition
    icon: mdi:chart-donut
    color: violet
    description: How each sample's findings split across the four screens
  - name: Sample comparison
    icon: mdi:chart-scatter-plot
    color: blue
    description: Pick samples here and every tab follows the selection
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The assemblies the run screened, on every tab
    collapsed: true
    persistent: true
    pin: top
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The rows behind every tile, on every tab
    collapsed: true
    persistent: true
    pin: bottom

  components:
  # --- left rail (persistent) ---------------------------------------------
  - component_type: interactive
    tag: fs-filter-sample
    index: fs-sample
    section: Sample scope
    group: Samples
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display: {title_size: md, custom_color: '#0CA678', icon_name: 'mdi:test-tube'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  # The funcscan samplesheet is `sample,fasta`: no experimental factor to
  # filter on, and every run of all four screens gives every sample all four
  # (`screens` is 4 for all 19 assemblies here, which is why the slider that
  # used to sit on it is gone). The cohort is therefore narrowed on the hub's
  # own per-screen counts, which do vary sample to sample.
  - component_type: interactive
    tag: fs-filter-arg-hits
    index: fs-arg-hits
    section: Sample scope
    group: Samples
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    interactive_component_type: RangeSlider
    column_name: arg_hits
    column_type: int64
    display: {title_size: md, custom_color: '#0CA678', icon_name: 'mdi:bacteria-outline'}
    placement: left
    title: ARG hits per sample
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: fs-filter-amp-candidates
    index: fs-amp-candidates
    section: Sample scope
    group: Samples
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    interactive_component_type: RangeSlider
    column_name: amp_candidates
    column_type: int64
    display: {title_size: md, custom_color: '#0CA678', icon_name: 'mdi:star-outline'}
    placement: left
    title: AMP candidates per sample
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: fs-filter-cazymes
    index: fs-cazymes
    section: Sample scope
    group: Samples
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    interactive_component_type: RangeSlider
    column_name: cazymes
    column_type: int64
    display: {title_size: md, custom_color: '#0CA678', icon_name: 'mdi:shape-outline'}
    placement: left
    title: CAZyme genes per sample
    layout: {x: 0, y: 9, w: 1, h: 3}
  - component_type: interactive
    tag: fs-filter-bgc-regions
    index: fs-bgc-regions
    section: Cohort thresholds
    group: Thresholds
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    interactive_component_type: RangeSlider
    column_name: bgc_regions
    column_type: int64
    display: {title_size: md, custom_color: '#4C6EF5', icon_name: 'mdi:counter'}
    placement: left
    title: BGC regions per sample
    layout: {x: 0, y: 12, w: 1, h: 3}
  - component_type: interactive
    tag: fs-filter-bgc-classes
    index: fs-bgc-classes
    section: Cohort thresholds
    group: Thresholds
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    interactive_component_type: RangeSlider
    column_name: bgc_classes
    column_type: int64
    display: {title_size: md, custom_color: '#4C6EF5', icon_name: 'mdi:shape-outline'}
    placement: left
    title: BGC classes per sample
    layout: {x: 0, y: 15, w: 1, h: 3}
  - component_type: interactive
    tag: fs-filter-cazy-families
    index: fs-cazy-families
    section: Cohort thresholds
    group: Thresholds
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    interactive_component_type: RangeSlider
    column_name: cazyme_families
    column_type: int64
    display: {title_size: md, custom_color: '#4C6EF5', icon_name: 'mdi:chart-donut'}
    placement: left
    title: CAZy families per sample
    layout: {x: 0, y: 18, w: 1, h: 3}

  # --- Screening at a glance ----------------------------------------------
  - component_type: text
    tag: fs-intro
    section: Screening at a glance
    title: Four screens, one assembly set
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      funcscan screens every assembly four times over: for resistance genes,
      antimicrobial peptides, biosynthetic gene clusters and CAZymes. Nothing
      joins the four reports, so this tab derives one row per sample from all
      of them and the sample filter on the left drives every other tab.
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: fs-card-arg-hits
    section: Screening at a glance
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    use: funcscan/screening_summary
    aggregation: sum
    column_name: arg_hits
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 4
    display: {icon_name: 'mdi:bacteria-outline', icon_color: '#E03131', title_color: '#E03131', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: ARG hits
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: fs-card-amp
    section: Screening at a glance
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    use: funcscan/screening_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: amp_candidates
    column_type: int64
    display: {icon_name: 'mdi:atom', icon_color: '#9C36B5', title_color: '#9C36B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: AMP candidates
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: fs-card-bgc
    section: Screening at a glance
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    use: funcscan/screening_summary
    aggregation: sum
    column_name: bgc_regions
    column_type: int64
    secondary_layout: donut
    breakdown_col: sample
    top_n_count: 4
    display: {icon_name: 'mdi:graph-outline', icon_color: '#0C8599', title_color: '#0C8599', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: BGC regions
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: fs-card-cazyme
    section: Screening at a glance
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    use: funcscan/screening_summary
    aggregation: average
    column_name: cazymes
    column_type: int64
    secondary_layout: gauge
    coverage_max: 1500
    display: {icon_name: 'mdi:leaf', icon_color: '#2F9E44', title_color: '#2F9E44', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: CAZymes per sample
    layout: {x: 6, y: 2, w: 2, h: 2}
  # Was a threshold card on `screens`, which is 4 for every one of the 19
  # assemblies in a run with all four arms on: a constant, so the card always
  # read "pass" and told the reader nothing. Distinct resistance genes vary
  # 37 to 68 across the same cohort, which is the number worth a tile.
  - component_type: card
    tag: fs-card-arg-genes
    section: Screening at a glance
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    use: funcscan/screening_summary
    aggregation: sum
    column_name: arg_genes
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 4
    display: {icon_name: 'mdi:dna', icon_color: '#1971C2', title_color: '#1971C2', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Resistance genes
    layout: {x: 0, y: 4, w: 2, h: 2}
  - component_type: card
    tag: fs-card-amp-hc
    section: Screening at a glance
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    use: funcscan/screening_summary
    aggregation: sum
    column_name: amp_high_confidence
    column_type: int64
    secondary_layout: composition
    breakdown_col: sample
    top_n_count: 4
    display: {icon_name: 'mdi:star-outline', icon_color: '#9C36B5', title_color: '#9C36B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: High-confidence AMPs
    layout: {x: 2, y: 4, w: 2, h: 2}
  - component_type: card
    tag: fs-card-cazy-fam
    section: Screening at a glance
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    use: funcscan/screening_summary
    aggregation: average
    column_name: cazyme_families
    column_type: int64
    secondary_layout: histogram
    display: {icon_name: 'mdi:shape-outline', icon_color: '#2F9E44', title_color: '#2F9E44', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: CAZy families per sample
    layout: {x: 4, y: 4, w: 2, h: 2}
  - component_type: card
    tag: fs-card-bgc-classes
    section: Screening at a glance
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    use: funcscan/screening_summary
    aggregation: max
    column_name: bgc_classes
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 4
    display: {icon_name: 'mdi:shape-outline', icon_color: '#0C8599', title_color: '#0C8599', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: BGC classes
    layout: {x: 6, y: 4, w: 2, h: 2}

  # --- Screen composition --------------------------------------------------
  - component_type: text
    tag: fs-comp-intro
    section: Screen composition
    title: What each sample yielded
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The four screens work on very different scales, so the bars are drawn on
      a log axis. A sample missing from one colour means that screen returned
      nothing for it, not that the screen was skipped.
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    tag: fs-fig-composition
    index: fs-composition
    section: Screen composition
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    use: funcscan/screening_summary
    mode: code
    code_content: |
      # The colour channel belongs to the screen here, so the dashboard's
      # analysis groups take the facet axis instead: one band of samples per
      # group. Spread into the reshape below too, or the unpivot would drop the
      # annotation column before the facet could read it.
      index_cols = ["sample"] + [c for c in depictio_group_by if c != "sample"]
      grp_col = depictio_group_by[0] if depictio_group_by else None

      # wide -> long so each screen becomes its own bar colour
      df_modified = df.unpivot(
          index=index_cols,
          on=["arg_hits", "amp_candidates", "bgc_regions", "cazymes"],
          variable_name="screen",
          value_name="findings",
      ).filter(pl.col("findings") > 0)

      labels = {
          "arg_hits": "ARG hits",
          "amp_candidates": "AMP candidates",
          "bgc_regions": "BGC regions",
          "cazymes": "CAZymes",
      }
      df_modified = df_modified.with_columns(
          pl.col("screen").replace_strict(labels, default=pl.col("screen")).alias("screen")
      )

      fig = px.bar(
          df_modified.to_pandas(),
          x="sample",
          y="findings",
          color="screen",
          barmode="group",
          log_y=True,
          facet_col=grp_col,
          category_orders={"screen": list(labels.values())},
      )
      fig.update_layout(
          yaxis_title="Findings (log scale)",
          legend_title_text="Screen",
          margin={"t": 24, "l": 56, "r": 16, "b": 80},
      )
      if grp_col:
          # Each panel keeps only its own samples, and its title is the group
          # name rather than the annotation column's name and an equals sign.
          fig.update_xaxes(matches=None, showticklabels=True, title_text="")
          fig.for_each_annotation(lambda a: a.update(text=a.text.split("=")[-1]))
      else:
          fig.update_layout(xaxis_title="Sample")
    title: Findings per sample and screen
    description: Grouped bars on a log axis, because the four screens differ by two orders of magnitude.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 6}

  # --- Sample comparison ---------------------------------------------------
  - component_type: text
    tag: fs-cmp-intro
    section: Sample comparison
    title: Pick the samples to follow
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Lasso points on the scatter or tick rows in the table: both select on the
      sample, and the project links carry that selection into the Resistome,
      AMP, BGC and CAZyme tabs.
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    tag: fs-fig-arg-vs-cazyme
    index: fs-arg-vs-cazyme
    section: Sample comparison
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    use: funcscan/screening_summary
    mode: code
    code_content: |
      # resistome load against carbohydrate-degradation capacity, one point per sample
      df_modified = df.with_columns(
          (pl.col("bgc_regions") + 1).alias("bgc_size")
      )

      # The dashboard's analysis groups take the colour channel when the viewer
      # has made some, in whichever display the Colour/Split toggle asks for.
      # Without groups the colour stays the AMP candidate count.
      colour_kwargs = dict(depictio_group_kwargs) or {
          "color": "amp_candidates",
          "color_continuous_scale": "Tealgrn",
      }

      fig = px.scatter(
          df_modified.to_pandas(),
          x="arg_hits",
          y="cazymes",
          size="bgc_size",
          size_max=26,
          hover_name="sample",
          custom_data=["sample"],
          **colour_kwargs,
      )
      fig.update_layout(
          xaxis_title="ARG hits",
          yaxis_title="CAZyme genes",
          margin={"t": 24, "l": 64, "r": 16, "b": 48},
      )
      if depictio_group_kwargs:
          # Panel titles read as the group name, not the annotation column and
          # an equals sign. A no-op unless the toggle asked for Split.
          fig.for_each_annotation(lambda a: a.update(text=a.text.split("=")[-1]))
      else:
          fig.update_layout(coloraxis_colorbar_title="AMP candidates")
    selection_enabled: true
    selection_column: sample
    title: Resistome load against CAZyme capacity
    description: One point per sample; size is the BGC region count, colour the AMP candidate count.
    title_size: h3
    layout: {x: 0, y: 1, w: 4, h: 6}
  - component_type: advanced_viz
    tag: fs-av-screen-scatter
    index: fs-screen-scatter
    section: Sample comparison
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    use: funcscan/screen_scatter
    config:
      color_col: amp_candidates
      color_scale: Tealgrn
      x_title: ARG hits
      y_title: CAZyme genes
      top_n_labels: 4
      selection_enabled: true
      selection_column: sample
    title: The same plane, drawn by the kind
    description: The analysis-group version of the scatter beside it. Marker size is the BGC region count and the four samples with the largest are labelled, so an outlier can be read without hovering.
    title_size: h3
    layout: {x: 4, y: 1, w: 4, h: 6}
  - component_type: table
    tag: fs-table-hub
    section: Sample comparison
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    use: funcscan/screening_summary
    row_selection_enabled: true
    row_selection_column: sample
    title: Per-sample screening summary
    description: The hub collection. Selecting rows here filters the same samples as the scatter.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 6}

  # --- Reference tables (persistent, pinned) -------------------------------
  - component_type: text
    tag: fs-ref-intro
    section: Reference tables
    title: The rows behind the tiles
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Every screening report, filtered by whatever the left rail and the tab
      selections currently narrow to. A table whose screen did not run is
      pruned at import instead of rendering empty.
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: table
    tag: fs-ref-arg
    section: Reference tables
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    use: hamronization/report
    title: ARG hits
    description: One row per resistance-gene hit, normalised across the five ARG tools.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 4}
  - component_type: table
    tag: fs-ref-amp
    section: Reference tables
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    use: ampcombi/summary
    title: AMP candidates
    description: One row per antimicrobial-peptide candidate with its physicochemistry.
    title_size: h3
    layout: {x: 0, y: 5, w: 8, h: 4}
  - component_type: table
    tag: fs-ref-bgc
    section: Reference tables
    workflow_tag: funcscan
    data_collection_tag: combgc_summary
    use: combgc/summary
    title: BGC regions
    description: One row per predicted biosynthetic gene cluster region.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 4}
  - component_type: table
    tag: fs-ref-cazyme
    section: Reference tables
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    use: dbcan/overview
    title: CAZyme annotations
    description: One row per CAZyme gene with the family each of the three tools called.
    title_size: h3
    layout: {x: 0, y: 13, w: 8, h: 4}

  # --- Sample sheet (persistent, pinned top) -------------------------------
  - component_type: table
    tag: fs-ref-samplesheet
    section: Sample sheet
    workflow_tag: funcscan
    data_collection_tag: samplesheet
    use: funcscan/samplesheet
    title: Samplesheet
    description: The assemblies the run screened, one row per sample.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 4}

tabs:
# ============================================================================
# Tab 1: Annotation (the locus layer the four screens share)
# ============================================================================
- title: Annotation
  subtitle: The annotated contigs the four screens work on, and how dense they are
  tab_order: 1
  tab_icon: mdi:file-document-outline
  tab_icon_color: yellow
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core

  filter_sections:
  - name: Locus scope
    icon: mdi:filter-variant
    color: yellow
    description: Which contigs the tab is looking at, on the contig collection's own columns
  - name: Locus thresholds
    icon: mdi:ruler
    color: orange
    description: Contig size and feature density floors
    collapsed: true

  grid_sections:
  - name: Annotation at a glance
    icon: mdi:counter
    color: yellow
    description: How much of the assembly the four screens actually touch
  - name: Loci
    icon: mdi:chart-scatter-plot
    color: orange
    description: Contig size against feature count, and the density that follows

  components:
  - component_type: interactive
    tag: ann-filter-screen
    index: ann-screen
    section: Locus scope
    group: Contigs
    workflow_tag: funcscan
    data_collection_tag: contig_annotation
    interactive_component_type: MultiSelect
    column_name: top_screen
    column_type: object
    display: {title_size: md, custom_color: '#F08C00', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Leading screen
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: ann-filter-screens-on-contig
    index: ann-screens-on-contig
    section: Locus scope
    group: Contigs
    workflow_tag: funcscan
    data_collection_tag: contig_annotation
    interactive_component_type: RangeSlider
    column_name: screens_on_contig
    column_type: int64
    display: {title_size: md, custom_color: '#F08C00', icon_name: 'mdi:set-merge'}
    placement: left
    title: Screens on the contig
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: ann-filter-length
    index: ann-length
    section: Locus thresholds
    group: Thresholds
    workflow_tag: funcscan
    data_collection_tag: contig_annotation
    interactive_component_type: RangeSlider
    column_name: contig_length
    column_type: int64
    display: {title_size: md, custom_color: '#E8590C', icon_name: 'mdi:ruler'}
    placement: left
    title: Contig length (bp)
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: ann-filter-density
    index: ann-density
    section: Locus thresholds
    group: Thresholds
    workflow_tag: funcscan
    data_collection_tag: contig_annotation
    interactive_component_type: RangeSlider
    column_name: features_per_kb
    column_type: float64
    display: {title_size: md, custom_color: '#E8590C', icon_name: 'mdi:chart-bell-curve'}
    placement: left
    title: Features per kb
    layout: {x: 0, y: 9, w: 1, h: 3}

  - component_type: text
    tag: ann-intro
    section: Annotation at a glance
    title: The layer under the four screens
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      funcscan annotates each assembly once and then screens the predicted
      proteins four times. The annotation tables are not published with the
      megatest results, but every screen names the contig its feature sits on,
      so the locus layer is rebuilt from the screens themselves. The contig
      length and k-mer coverage come from the assembler's own contig names.
    workflow_tag: funcscan
    data_collection_tag: contig_annotation
