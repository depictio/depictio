    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.8
    threshold_direction: min
    threshold_warn: 0.6
    display: {icon_name: 'mdi:check-decagram', icon_color: '#0C8599', title_color: '#0C8599', title_font_size: xl, value_font_size: xl}
