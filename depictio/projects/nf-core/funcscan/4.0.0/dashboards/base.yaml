    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: advanced_viz
    workflow_tag: funcscan
    data_collection_tag: ampcombi_embedding
    use: ampcombi/amp_embedding
    config:
      color_col: charge_class
      axis_prefix: PC
    section: Property space
    tag: fs-amp-embedding
    index: amp-embedding
    title: Physicochemistry PCA
    description: Weight, pI, hydrophobicity and the three structure fractions, in two components.
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: figure
    workflow_tag: funcscan
    data_collection_tag: ampcombi_clusters
    use: ampcombi/clusters
    visu_type: histogram
    mode: ui
    figure_params:
      x: members
      log_y: true
      labels: {members: Sequences in the cluster}
    section: Clusters
    tag: fs-amp-cluster-sizes
    index: amp-cluster-sizes
    title: Cluster sizes
    description: Sequences per cluster across the run, the count on a log axis so the large clusters show.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    use: ampcombi/summary
    row_selection_enabled: true
    row_selection_column: cds_id
    section: Candidate table
