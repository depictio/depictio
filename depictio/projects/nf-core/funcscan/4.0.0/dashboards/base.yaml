# nf-core/funcscan 4.0.0 functional screening dashboard
# ============================================================================
# Funnel: Screening overview (what did the four screens find, per sample) ->
# Annotation (which contigs they touched) -> Resistome -> AMPs -> BGCs ->
# CAZymes, each drilling into one screen, then Run report. The `Run at a
# glance` strip (4 cards) and the `Sample sheet` section are persistent and
# pinned to the top, so the run size and the cohort are one glance away on
# every tab. Each screen's rows live in a table on its own tab only.
#
# The run's MultiQC report carries software versions only: a single
# run_metadata row, no general-stats and no plot sections at all, which is why
# there is no MultiQC tab. The versions are read out of the same parquet and
# shown as a table on the Run report tab instead.
#
# The funcscan samplesheet is `sample,fasta`, with no experimental factor, so
# the persistent filter section carries the sample only; the per-screen count
# sliders sit in one landing-only section, and every tab adds a non-persistent
# section on its own collection's columns.
# ============================================================================
version: 1

main_dashboard:
  title: nf-core/funcscan
  subtitle: Functional screening of assemblies for AMR genes, peptides, clusters and CAZymes
  project_tag: Funcscan Functional Screening
  main_tab_name: Screening overview
  tab_icon: mdi:target-arrow
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  advanced_viz_controls: header

  filter_sections:
  - name: Sample scope
    icon: mdi:test-tube
    color: teal
    description: Reaches every tab and every screen through the project links
    persistent: true
    pin: top
  - name: Sample thresholds
    icon: mdi:tune
    color: indigo
    description: Per-sample screen counts, on this tab only

  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: indigo
    description: What the four screens found across the run, before any tab narrows it
    persistent: true
    pin: top
  - name: Screen composition
    icon: mdi:chart-donut
    color: violet
    description: How each sample's findings split across the four screens
  - name: Sample comparison
    icon: mdi:chart-scatter-plot
    color: blue
    description: Pick samples here and every tab follows the selection
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The assemblies the run screened, one row per sample. Open it to check which assembly a sample name stands for.
    collapsed: true
    persistent: true
    pin: top

  components:
  # --- left rail -----------------------------------------------------------
  # The funcscan samplesheet is `sample,fasta`: no experimental factor to
  # filter on. The Sample MultiSelect is the only persistent filter; the
  # per-screen count sliders narrow the cohort on the landing tab only.
  - component_type: interactive
    tag: fs-filter-sample
    index: fs-sample
    section: Sample scope
    group: Samples
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display: {title_size: md, custom_color: '#0CA678', icon_name: 'mdi:test-tube'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: fs-filter-arg-hits
    index: fs-arg-hits
    section: Sample thresholds
    group: Thresholds
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: arg_hits
    column_type: int64
    display: {title_size: md, custom_color: '#4C6EF5', icon_name: 'mdi:bacteria-outline'}
    placement: left
    title: ARG hits per sample
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: fs-filter-amp-candidates
    index: fs-amp-candidates
    section: Sample thresholds
    group: Thresholds
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: amp_candidates
    column_type: int64
    display: {title_size: md, custom_color: '#4C6EF5', icon_name: 'mdi:atom'}
    placement: left
    title: AMP candidates per sample
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: fs-filter-bgc-regions
    index: fs-bgc-regions
    section: Sample thresholds
    group: Thresholds
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: bgc_regions
    column_type: int64
    display: {title_size: md, custom_color: '#4C6EF5', icon_name: 'mdi:graph-outline'}
    placement: left
    title: BGC regions per sample
    layout: {x: 0, y: 9, w: 1, h: 3}
  - component_type: interactive
    tag: fs-filter-cazymes
    index: fs-cazymes
    section: Sample thresholds
    group: Thresholds
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: cazymes
    column_type: int64
    display: {title_size: md, custom_color: '#4C6EF5', icon_name: 'mdi:leaf'}
    placement: left
    title: CAZyme genes per sample
    layout: {x: 0, y: 12, w: 1, h: 3}

  # --- Run at a glance (persistent, pinned top) -----------------------------
  # One aggregation for the whole strip: every card is a run total with the
  # samples carrying the most findings underneath.
  - component_type: card
    tag: fs-card-arg-hits
    section: Run at a glance
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    use: funcscan/screening_summary
    aggregation: sum
    column_name: arg_hits
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 4
    display: {icon_name: 'mdi:bacteria-outline', icon_color: '#E03131', title_color: '#E03131', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: ARG hits
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: fs-card-amp
    section: Run at a glance
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    use: funcscan/screening_summary
    aggregation: sum
    column_name: amp_candidates
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 4
    display: {icon_name: 'mdi:atom', icon_color: '#9C36B5', title_color: '#9C36B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: AMP candidates
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: fs-card-bgc
    section: Run at a glance
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    use: funcscan/screening_summary
    aggregation: sum
    column_name: bgc_regions
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 4
    display: {icon_name: 'mdi:graph-outline', icon_color: '#0C8599', title_color: '#0C8599', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: BGC regions
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: fs-card-cazyme
    section: Run at a glance
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    use: funcscan/screening_summary
    aggregation: sum
    column_name: cazymes
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 4
    display: {icon_name: 'mdi:leaf', icon_color: '#2F9E44', title_color: '#2F9E44', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: CAZyme genes
    layout: {x: 6, y: 0, w: 2, h: 2}

  # --- Screen composition --------------------------------------------------
  - component_type: text
    tag: fs-comp-intro
    section: Screen composition
    title: What each sample yielded
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per sample, derived from the resistance, peptide, cluster and
      CAZyme screens, drawn on a log axis because the four work on different
      scales. A sample missing from one colour means that screen returned
      nothing for it; the Run report tab says whether the screen ran.
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    tag: fs-fig-composition
    index: fs-composition
    section: Screen composition
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    use: funcscan/screening_summary
    mode: code
    code_content: |
      # The colour channel belongs to the screen here, so the dashboard's
      # analysis groups take the facet axis instead: one band of samples per
      # group. Spread into the reshape below too, or the unpivot would drop the
      # annotation column before the facet could read it.
      index_cols = ["sample"] + [c for c in depictio_group_by if c != "sample"]
      grp_col = depictio_group_by[0] if depictio_group_by else None

      # wide -> long so each screen becomes its own bar colour
      df_modified = df.unpivot(
          index=index_cols,
          on=["arg_hits", "amp_candidates", "bgc_regions", "cazymes"],
          variable_name="screen",
          value_name="findings",
      ).filter(pl.col("findings") > 0)

      labels = {
          "arg_hits": "ARG hits",
          "amp_candidates": "AMP candidates",
          "bgc_regions": "BGC regions",
          "cazymes": "CAZymes",
      }
      df_modified = df_modified.with_columns(
          pl.col("screen").replace_strict(labels, default=pl.col("screen")).alias("screen")
      )

      fig = px.bar(
          df_modified.to_pandas(),
          x="sample",
          y="findings",
          color="screen",
          barmode="group",
          log_y=True,
          facet_col=grp_col,
          category_orders={"screen": list(labels.values())},
      )
      fig.update_layout(
          yaxis_title="Findings (log scale)",
          legend_title_text="Screen",
          margin={"t": 24, "l": 56, "r": 16, "b": 80},
      )
      if grp_col:
          # Each panel keeps only its own samples, and its title is the group
          # name rather than the annotation column's name and an equals sign.
          fig.update_xaxes(matches=None, showticklabels=True, title_text="")
          fig.for_each_annotation(lambda a: a.update(text=a.text.split("=")[-1]))
      else:
          fig.update_layout(xaxis_title="Sample")
    title: Findings per sample and screen
    description: Grouped bars on a log axis, because the four screens differ by two orders of magnitude.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 6}

  # --- Sample comparison ---------------------------------------------------
  - component_type: text
    tag: fs-cmp-intro
    section: Sample comparison
    title: Pick the samples to follow
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Lasso points on the scatter or tick rows in the table: both select on the
      sample, and the project links carry that selection into the Resistome,
      AMP, BGC and CAZyme tabs.
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: fs-av-screen-scatter
    index: fs-screen-scatter
    section: Sample comparison
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    use: funcscan/screen_scatter
    config:
      controls_placement: header
      color_col: amp_candidates
      color_scale: Tealgrn
      x_title: ARG hits
      y_title: CAZyme genes
      top_n_labels: 4
      selection_enabled: true
      selection_column: sample
    title: Resistome load against CAZyme capacity
    description: One point per sample, coloured by the AMP candidate count and sized by the BGC region count. The four samples with the most regions are labelled, so an outlier can be read without hovering.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 6}
  - component_type: table
    tag: fs-table-hub
    section: Sample comparison
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    use: funcscan/screening_summary
    row_selection_enabled: true
    row_selection_column: sample
    title: Per-sample screening summary
    description: The hub collection. Selecting rows here filters the same samples as the scatter.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 6}

  # --- Sample sheet (persistent, pinned top) -------------------------------
  - component_type: table
    tag: fs-ref-samplesheet
    section: Sample sheet
    workflow_tag: funcscan
    data_collection_tag: samplesheet
    use: funcscan/samplesheet
    title: Samplesheet
    description: The assemblies the run screened, one row per sample.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 4}

tabs:
# ============================================================================
# Tab 1: Annotation (the locus layer the four screens share)
# ============================================================================
- title: Annotation
  subtitle: The annotated contigs the four screens work on, and how dense they are
  tab_order: 1
  tab_icon: mdi:file-document-outline
  tab_icon_color: yellow
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  advanced_viz_controls: header

  filter_sections:
  - name: Locus scope
    icon: mdi:filter-variant
    color: yellow
    description: Which contigs the tab is looking at, on the contig collection's own columns
  - name: Locus thresholds
    icon: mdi:ruler
    color: orange
    description: Contig size and feature density floors

  grid_sections:
  - name: Annotation at a glance
    icon: mdi:counter
    color: yellow
    description: How much of the assembly the four screens actually touch
  - name: Loci
    icon: mdi:chart-scatter-plot
    color: orange
    description: Contig size against feature count, and the density that follows

  components:
  - component_type: interactive
    tag: ann-filter-screen
    index: ann-screen
    section: Locus scope
    group: Contigs
    workflow_tag: funcscan
    data_collection_tag: contig_annotation
    interactive_component_type: MultiSelect
    column_name: top_screen
    column_type: object
    display: {title_size: md, custom_color: '#F08C00', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Leading screen
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: ann-filter-screens-on-contig
    index: ann-screens-on-contig
    section: Locus scope
    group: Contigs
    workflow_tag: funcscan
    data_collection_tag: contig_annotation
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: screens_on_contig
    column_type: int64
    display: {title_size: md, custom_color: '#F08C00', icon_name: 'mdi:set-merge'}
    placement: left
    title: Screens on the contig
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: ann-filter-length
    index: ann-length
    section: Locus thresholds
    group: Thresholds
    workflow_tag: funcscan
    data_collection_tag: contig_annotation
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: contig_length
    column_type: int64
    display: {title_size: md, custom_color: '#E8590C', icon_name: 'mdi:ruler'}
    placement: left
    title: Contig length (bp)
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: ann-filter-density
    index: ann-density
    section: Locus thresholds
    group: Thresholds
    workflow_tag: funcscan
    data_collection_tag: contig_annotation
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: features_per_kb
    column_type: float64
    display: {title_size: md, custom_color: '#E8590C', icon_name: 'mdi:chart-bell-curve'}
    placement: left
    title: Features per kb
    layout: {x: 0, y: 9, w: 1, h: 3}

  - component_type: text
    tag: ann-intro
    section: Annotation at a glance
    title: The layer under the four screens
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Every screen names the contig its feature sits on, so this layer counts,
      per contig, what each of the four screens put there. Contig length is
      read from the contig name when the assembler wrote it there (SPAdes or
      MEGAHIT headers); other names keep the contig in the table but off the
      length axis.
    workflow_tag: funcscan
    data_collection_tag: contig_annotation
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ann-card-features
    section: Annotation at a glance
    workflow_tag: funcscan
    data_collection_tag: contig_annotation
    use: funcscan/contig_annotation
    aggregation: sum
    column_name: features
    column_type: int64
    secondary_layout: top_n
    breakdown_col: top_screen
    top_n_count: 4
    display: {icon_name: 'mdi:counter', icon_color: '#F08C00', title_color: '#F08C00', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Features
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ann-card-contigs
    section: Annotation at a glance
    workflow_tag: funcscan
    data_collection_tag: contig_annotation
    use: funcscan/contig_annotation
    aggregation: nunique
    column_name: contig
    column_type: object
    secondary_layout: donut
    breakdown_col: top_screen
    top_n_count: 4
    display: {icon_name: 'mdi:dna', icon_color: '#E8590C', title_color: '#E8590C', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Annotated contigs
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ann-card-length
    section: Annotation at a glance
    workflow_tag: funcscan
    data_collection_tag: contig_annotation
    use: funcscan/contig_annotation
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: contig_length
    column_type: int64
    display: {icon_name: 'mdi:ruler', icon_color: '#C2255C', title_color: '#C2255C', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Contig length
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ann-card-screens
    section: Annotation at a glance
    workflow_tag: funcscan
    data_collection_tag: contig_annotation
    use: funcscan/contig_annotation
    aggregation: average
    column_name: screens_on_contig
    column_type: int64
    secondary_layout: gauge
    coverage_max: 4
    display: {icon_name: 'mdi:set-merge', icon_color: '#1971C2', title_color: '#1971C2', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Screens per contig
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: text
    tag: ann-loci-intro
    section: Loci
    title: Long contigs or dense ones
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Long contigs carry more of everything, so look for short contigs high on
      the y axis: dense loci rather than large ones. Lasso points or tick rows
      and the contig travels to the screen tabs through the project links.
    workflow_tag: funcscan
    data_collection_tag: contig_annotation
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: ann-av-loci
    index: ann-loci
    section: Loci
    workflow_tag: funcscan
    data_collection_tag: contig_annotation
    use: funcscan/contig_feature_scatter
    config:
      controls_placement: header
      log_x: true
      x_title: Contig length (bp, log scale)
      y_title: Features on the contig
      top_n_labels: 5
      selection_enabled: true
      selection_column: contig
    title: Features against contig length
    description: One point per annotated contig, coloured by the screen contributing the most features and sized by the density. The x axis is logarithmic because contig lengths span orders of magnitude.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: figure
    tag: ann-fig-density
    index: ann-density-hist
    section: Loci
    workflow_tag: funcscan
    data_collection_tag: contig_annotation
    use: funcscan/contig_annotation
    visu_type: histogram
    mode: ui
    figure_params:
      x: features_per_kb
      color: top_screen
      title: Feature density per contig
    title: Feature density
    description: How many features per kilobase each contig carries, split by the screen that leads on it.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 6}
  - component_type: table
    tag: ann-table-contigs
    section: Loci
    workflow_tag: funcscan
    data_collection_tag: contig_annotation
    use: funcscan/contig_annotation
    row_selection_enabled: true
    row_selection_column: contig
    title: Annotated contigs
    description: One row per contig, with what each screen put on it. Selecting rows narrows the scatter to the same loci.
    title_size: h3
    layout: {x: 0, y: 15, w: 8, h: 7}

# ============================================================================
# Tab 2: Resistome (ARG)
# ============================================================================
- title: Resistome
  subtitle: Resistance genes across five ARG screens, harmonised by hAMRonization
  tab_order: 2
  tab_icon: mdi:bacteria-outline
  tab_icon_color: red
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  advanced_viz_controls: header

  filter_sections:
  - name: ARG scope
    icon: mdi:filter-variant
    color: red
    description: Which screening tool and which drug class the tab is looking at
  - name: Hit quality
    icon: mdi:tune
    color: orange
    description: Identity and cross-tool agreement floors

  grid_sections:
  - name: Resistome at a glance
    icon: mdi:counter
    color: red
    description: How much resistance the five ARG tools found together
  - name: Resistance hierarchy
    icon: mdi:chart-donut
    color: orange
    description: Screen to drug class to gene, with the three class vocabularies kept apart
  - name: Tool concordance
    icon: mdi:set-merge
    color: grape
    description: Which contigs the five tools agree on
  - name: Gene detail
    icon: mdi:dna
    color: pink
    description: Pick a gene in the scatter or the table and both follow

  components:
  - component_type: interactive
    tag: arg-filter-tool
    index: arg-tool
    section: ARG scope
    group: Screen
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    interactive_component_type: MultiSelect
    column_name: tool
    column_type: object
    display: {title_size: md, custom_color: '#E03131', icon_name: 'mdi:tune'}
    placement: left
    title: ARG tool
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: arg-filter-class
    index: arg-class
    section: ARG scope
    group: Screen
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    interactive_component_type: MultiSelect
    column_name: drug_class
    column_type: object
    display: {title_size: md, custom_color: '#E03131', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Drug class
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: arg-filter-identity
    index: arg-identity
    section: Hit quality
    group: Thresholds
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: identity_pct
    column_type: float64
    display: {title_size: md, custom_color: '#F76707', icon_name: 'mdi:ruler'}
    placement: left
    title: Sequence identity (%)
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: arg-filter-ntools
    index: arg-ntools
    section: Hit quality
    group: Thresholds
    workflow_tag: funcscan
    data_collection_tag: hamronization_gene_presence
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: n_tools
    column_type: int64
    display: {title_size: md, custom_color: '#F76707', icon_name: 'mdi:scale-balance'}
    placement: left
    title: Tools agreeing
    layout: {x: 0, y: 9, w: 1, h: 3}

  - component_type: text
    tag: arg-intro
    section: Resistome at a glance
    title: Five ARG screens, one vocabulary
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [ABRicate](https://github.com/tseemann/abricate),
      [AMRFinderPlus](https://github.com/ncbi/amr),
      [DeepARG](https://github.com/gaarangoa/deeparg),
      [fARGene](https://github.com/fannyhb/fargene) and
      [RGI](https://github.com/arpcard/rgi) each report resistance genes their
      own way; [hAMRonization](https://github.com/pha4ge/hAMRonization) maps
      them onto shared column names. The drug-class labels themselves are not
      harmonised, so the hierarchy below keeps each tool's vocabulary on its
      own branch.
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: arg-card-classes
    section: Resistome at a glance
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    use: hamronization/report
    aggregation: nunique
    column_name: drug_class
    column_type: object
    secondary_layout: top_n
    breakdown_col: tool
    top_n_count: 5
    display: {icon_name: 'mdi:bacteria-outline', icon_color: '#E03131', title_color: '#E03131', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Drug classes
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: arg-card-genes
    section: Resistome at a glance
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    use: hamronization/report
    aggregation: nunique
    column_name: gene_symbol
    column_type: object
    secondary_layout: donut
    breakdown_col: tool
    top_n_count: 5
    display: {icon_name: 'mdi:dna', icon_color: '#E8590C', title_color: '#E8590C', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Distinct genes
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: arg-card-identity
    section: Resistome at a glance
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    use: hamronization/report
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: identity_pct
    column_type: float64
    # HMM-based tools report no identity: the median is over aligned hits only.
    filter_expr: "col('identity_pct').is_not_null()"
    display: {icon_name: 'mdi:ruler', icon_color: '#C2255C', title_color: '#C2255C', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Identity of aligned hits
    layout: {x: 4, y: 2, w: 2, h: 2}
  # Replaces a mean of reference coverage: the hits that align closely over
  # most of the reference (the common 90 % identity, 80 % coverage cut-off),
  # counted per tool.
  - component_type: card
    tag: arg-card-close
    section: Resistome at a glance
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    use: hamronization/report
    aggregation: sum
    column_name: hits
    column_type: int64
    filter_expr: "(col('identity_pct') >= 90) & (col('coverage_pct') >= 80)"
    secondary_layout: top_n
    breakdown_col: tool
    top_n_count: 4
    display: {icon_name: 'mdi:check-decagram', icon_color: '#9C36B5', title_color: '#9C36B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Close reference matches
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: text
    tag: arg-hier-intro
    section: Resistance hierarchy
    title: Screen to class to gene
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The inner ring is the screening tool, then its own class vocabulary, then
      the gene. fARGene contributes HMM model names rather than drug classes,
      which is why its branch reads differently from the others.
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: arg-av-sunburst
    index: arg-sunburst
    section: Resistance hierarchy
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    use: hamronization/arg_hierarchy
    title: Resistome hierarchy
    description: Arc size is the hit count; the rings are tool, drug class and gene symbol.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 8}
  - component_type: advanced_viz
    tag: arg-av-class-heatmap
    index: arg-class-heatmap
    section: Resistance hierarchy
    workflow_tag: funcscan
    data_collection_tag: hamronization_class_matrix
    use: hamronization/arg_class_heatmap
    title: Drug class by sample hit matrix
    description: Hit counts per drug class and sample, so the rows are phenotypes rather than genes. A class carried by every assembly separates from one that only a few carry; the gene-level view is the dot plot under Tool concordance.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 7}

  - component_type: text
    tag: arg-conc-intro
    section: Tool concordance
    title: Where the five tools agree
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Agreement is counted on the contig, not the gene name: every tool spells
      the same gene differently, while the contig id is shared. A large
      single-tool bar is a tool reporting hits nothing else confirms.
    workflow_tag: funcscan
    data_collection_tag: hamronization_tool_overlap
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: arg-av-upset
    index: arg-upset
    section: Tool concordance
    workflow_tag: funcscan
    data_collection_tag: hamronization_tool_overlap
    use: hamronization/arg_upset
    title: ARG tool concordance
    description: Each bar is a set of tools; its height is the contigs only that set reported.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 6}
  - component_type: advanced_viz
    tag: arg-av-dotplot
    index: arg-dotplot
    section: Tool concordance
    workflow_tag: funcscan
    data_collection_tag: hamronization_gene_presence
    use: hamronization/arg_dot_plot
    config:
      controls_placement: header
    title: Gene support per sample
    description: Dot colour is the mean identity of the hits, dot size the share of tools that called the gene.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 8}

  - component_type: text
    tag: arg-detail-intro
    section: Gene detail
    title: Drill into a gene
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Lasso points or tick rows: both select on the gene symbol, so the scatter
      and the table stay on the same gene. Hits from HMM-based tools carry no
      identity or coverage and sit outside the cloud.
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    tag: arg-fig-identity-coverage
    index: arg-identity-coverage
    section: Gene detail
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    use: hamronization/report
    mode: code
    code_content: |
      # only alignment-based tools report both axes; HMM screens report neither
      df_modified = df.drop_nulls(["identity_pct", "coverage_pct"])

      fig = px.scatter(
          df_modified.to_pandas(),
          x="coverage_pct",
          y="identity_pct",
          color="tool",
          hover_name="gene_symbol",
          opacity=0.8,
          custom_data=["gene_symbol"],
      )
      fig.update_layout(
          xaxis_title="Reference coverage (%)",
          yaxis_title="Sequence identity (%)",
          legend_title_text="ARG tool",
          margin={"t": 24, "l": 56, "r": 16, "b": 48},
      )
    selection_enabled: true
    selection_column: gene_symbol
    title: Hit quality per tool
    description: Coverage against identity for every alignment-based hit, coloured by the reporting tool.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 6}
  - component_type: table
    tag: arg-table-hits
    section: Gene detail
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    use: hamronization/report
    row_selection_enabled: true
    row_selection_column: gene_symbol
    title: ARG hits
    description: Selecting rows narrows the scatter to the same genes.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 6}
  - component_type: advanced_viz
    tag: arg-av-island-track
    index: arg-island-track
    section: Gene detail
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    use: hamronization/arg_island_track
    config:
      class_col: drug_class
      label_col: gene_symbol
      show_labels: true
    title: Resistance genes along their contig
    description: One lane per contig, one arrow per ARG hit pointing the way the gene is read. Genes packed head to tail on a single contig are a resistance island, which an aggregate over drug classes cannot show.
    title_size: h3
    layout: {x: 0, y: 13, w: 8, h: 6}

# ============================================================================
# Tab 3: AMPs
# ============================================================================
- title: AMPs
  subtitle: Antimicrobial peptide candidates, their physicochemistry and their clusters
  tab_order: 3
  tab_icon: mdi:atom
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  advanced_viz_controls: header

  filter_sections:
  - name: Candidate scope
    icon: mdi:filter-variant
    color: grape
    description: Which peptides the tab is looking at
  - name: Peptide properties
    icon: mdi:ruler
    color: violet
    description: Probability and size floors

  grid_sections:
  - name: AMPs at a glance
    icon: mdi:counter
    color: grape
    description: How many candidates AMPcombi kept and how confident they are
  - name: Property space
    icon: mdi:chart-scatter-plot
    color: violet
    description: Charge against hydrophobicity, and the PCA of the same descriptors
  - name: Clusters
    icon: mdi:relation-many-to-many
    color: indigo
    description: Sequence clusters MMseqs2 built across the whole run

  components:
  - component_type: interactive
    tag: amp-filter-charge
    index: amp-charge
    section: Candidate scope
    group: Peptides
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    interactive_component_type: MultiSelect
    column_name: charge_class
    column_type: object
    display: {title_size: md, custom_color: '#9C36B5', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Charge class
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: amp-filter-prob
    index: amp-prob
    section: Peptide properties
    group: Thresholds
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: prob_max
    column_type: float64
    display: {title_size: md, custom_color: '#7048E8', icon_name: 'mdi:check-decagram'}
    placement: left
    title: Best probability
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: amp-filter-length
    index: amp-length
    section: Peptide properties
    group: Thresholds
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: aa_length
    column_type: int64
    display: {title_size: md, custom_color: '#7048E8', icon_name: 'mdi:ruler'}
    placement: left
    title: Peptide length (aa)
    layout: {x: 0, y: 6, w: 1, h: 3}

  - component_type: text
    tag: amp-intro
    section: AMPs at a glance
    title: Candidates AMPcombi kept
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [AMPcombi](https://github.com/Darcy220606/AMPcombi) merges the per-tool
      predictions (ampir, Macrel, AMPlify), keeps the peptides above the
      probability cut-off and annotates each with physicochemistry. Read the
      best probability across tools and how many predictors agree, not one
      tool's score, since any predictor can be switched off.
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: amp-card-contigs
    section: AMPs at a glance
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    use: ampcombi/summary
    aggregation: nunique
    column_name: contig
    column_type: object
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 4
    display: {icon_name: 'mdi:atom', icon_color: '#9C36B5', title_color: '#9C36B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Contigs with a candidate
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: amp-card-prob
    section: AMPs at a glance
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    use: ampcombi/summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: prob_max
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#7048E8', title_color: '#7048E8', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Best probability
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: amp-card-length
    section: AMPs at a glance
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    use: ampcombi/summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: aa_length
    column_type: int64
    display: {icon_name: 'mdi:ruler', icon_color: '#4C6EF5', title_color: '#4C6EF5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Peptide length
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: amp-card-agreement
    section: AMPs at a glance
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    use: ampcombi/summary
    aggregation: count
    column_name: cds_id
    column_type: object
    filter_expr: "col('n_tools') >= 2"
    secondary_layout: donut
    breakdown_col: charge_class
    top_n_count: 3
    display: {icon_name: 'mdi:check-decagram', icon_color: '#0C8599', title_color: '#0C8599', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Called by two predictors or more
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: text
    tag: amp-prop-intro
    section: Property space
    title: The AMP property plane
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Cationic, hydrophobic peptides are the classic membrane-active shape, so
      the upper right of the scatter is where the interesting candidates sit.
      The PCA beside it summarises the same six descriptors at once.
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: amp-av-property
    index: amp-property
    section: Property space
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    use: ampcombi/amp_property_scatter
    config:
      controls_placement: header
      x_title: Hydrophobicity
      y_title: Isoelectric point (pI)
      reference_line: horizontal
      reference_value: 7.0
      opacity: 0.7
      selection_enabled: true
      selection_column: cds_id
    title: Charge against hydrophobicity
    description: One point per candidate, coloured by charge class and sized by peptide length. The line at pI 7 is where a peptide turns cationic at physiological pH; hydrophobic peptides above it are the classic membrane-active shape. AMPcombi reports no net charge, so the isoelectric point is the charge axis.
    title_size: h3
    layout: {x: 0, y: 1, w: 5, h: 7}
  - component_type: advanced_viz
    tag: amp-av-record
    index: amp-record
    section: Property space
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: cds_id
      title_col: cds_id
      selection_source: any
      linked_component: amp-av-property
      sections:
        Origin: [sample, contig, db_hit]
        Prediction: [prob_max, n_tools, prob_ampir, prob_macrel, prob_amplify]
        Physicochemistry: [aa_length, molecular_weight, isoelectric_point, hydrophobicity, charge_class]
      labels:
        prob_max: Best probability
        n_tools: Predictors agreeing
        aa_length: Length (aa)
        molecular_weight: Molecular weight (Da)
        isoelectric_point: Isoelectric point (pI)
        db_hit: Reference AMP hit
    title: Candidate record
    description: The peptide picked in the scatter beside it (or in the candidate table), with what each predictor gave it and its physicochemistry.
    title_size: h3
    layout: {x: 5, y: 1, w: 3, h: 7}
  - component_type: advanced_viz
    tag: amp-av-embedding
    index: amp-embedding
    section: Property space
    workflow_tag: funcscan
    data_collection_tag: ampcombi_embedding
    use: ampcombi/amp_embedding
    config: {color_col: charge_class, controls_placement: header}
    title: Physicochemistry PCA
    description: Two components over weight, pI, hydrophobicity and the three structure fractions.
    title_size: h3
    layout: {x: 0, y: 8, w: 8, h: 6}
  - component_type: table
    tag: amp-table-candidates
    section: Property space
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    use: ampcombi/summary
    row_selection_enabled: true
    row_selection_column: cds_id
    title: AMP candidates
    description: Selecting rows narrows the property scatter to the same peptides.
    title_size: h3
    layout: {x: 0, y: 14, w: 8, h: 5}

  - component_type: text
    tag: amp-cluster-intro
    section: Clusters
    title: Peptides shared across samples
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [MMseqs2](https://github.com/soedinglab/MMseqs2) clusters the candidates
      of the whole run, so a large cluster is a peptide family several
      assemblies carry. The sample shown is the one that contributed the
      representative sequence.
    workflow_tag: funcscan
    data_collection_tag: ampcombi_clusters
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    tag: amp-fig-cluster-sizes
    index: amp-cluster-sizes
    section: Clusters
    workflow_tag: funcscan
    data_collection_tag: ampcombi_clusters
    use: ampcombi/clusters
    visu_type: histogram
    mode: ui
    figure_params:
      x: members
      color: sample
      title: Cluster size distribution
    title: Cluster sizes
    description: How many sequences each cluster holds, split by the sample that contributed the representative.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 6}
  - component_type: table
    tag: amp-table-clusters
    section: Clusters
    workflow_tag: funcscan
    data_collection_tag: ampcombi_clusters
    use: ampcombi/clusters
    row_selection_enabled: true
    row_selection_column: cluster_id
    title: Peptide clusters
    description: One row per cluster, largest first.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 6}

# ============================================================================
# Tab 4: BGCs
