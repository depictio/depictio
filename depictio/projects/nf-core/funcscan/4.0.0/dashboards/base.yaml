    data_collection_tag: dbcan_substrates
    use: dbcan/substrates
    visu_type: bar
    mode: ui
    figure_params:
      x: substrate
      y: clusters
      color: sample
      title: Predicted substrates across the run
    title: Substrates predicted
    description: How many gene clusters target each polysaccharide, split by sample.
