    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: caz-filter-substrate
    index: caz-substrate
    section: CAZyme scope
    group: Annotations
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    interactive_component_type: MultiSelect
    column_name: substrate
    column_type: object
    display: {title_size: md, custom_color: '#2F9E44', icon_name: 'mdi:leaf'}
    placement: left
    title: Substrate
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: caz-filter-ntools
    index: caz-ntools
    section: Call confidence
    group: Thresholds
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    interactive_component_type: RangeSlider
    column_name: n_tools
    column_type: int64
    display: {title_size: md, custom_color: '#66A80F', icon_name: 'mdi:scale-balance'}
    placement: left
    title: Tools agreeing
    layout: {x: 0, y: 6, w: 1, h: 3}

  - component_type: text
    tag: caz-intro
    section: CAZymes at a glance
    title: Three annotators, one family call
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [run_dbCAN](https://github.com/bcb-unl/run_dbcan) annotates every
      predicted protein with [HMMER](https://github.com/EddyRivasLab/hmmer),
      dbCAN-sub and DIAMOND at once and recommends a family only where at
      least two agree. Genes called by a single tool keep that tool's family
      here, so the agreement card is the one to read first.
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: caz-card-genes
    section: CAZymes at a glance
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    use: dbcan/overview
    aggregation: sum
    column_name: genes
    column_type: int64
    secondary_layout: donut
    breakdown_col: cazy_class
    top_n_count: 4
    display: {icon_name: 'mdi:leaf', icon_color: '#2F9E44', title_color: '#2F9E44', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: CAZyme genes
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: caz-card-families
    section: CAZymes at a glance
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    use: dbcan/overview
    aggregation: nunique
    column_name: family
    column_type: object
    secondary_layout: top_n
    breakdown_col: cazy_class
    top_n_count: 4
    display: {icon_name: 'mdi:shape-outline', icon_color: '#66A80F', title_color: '#66A80F', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: CAZy families
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: caz-card-substrates
    section: CAZymes at a glance
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    use: dbcan/overview
    aggregation: count
    column_name: gene_id
    column_type: object
    secondary_layout: composition
    breakdown_col: substrate
    top_n_count: 4
    display: {icon_name: 'mdi:chart-donut', icon_color: '#099268', title_color: '#099268', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Annotated genes
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: caz-card-ntools
    section: CAZymes at a glance
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    use: dbcan/overview
    aggregation: average
    column_name: n_tools
    column_type: int64
    secondary_layout: gauge
    coverage_max: 3
    display: {icon_name: 'mdi:scale-balance', icon_color: '#0C8599', title_color: '#0C8599', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Tools agreeing
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: text
    tag: caz-hier-intro
    section: Family hierarchy
    title: Class to family to substrate
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Glycoside hydrolases and glycosyltransferases carry the bulk of any gut
      metagenome. Most genes have no substrate call, so the outer ring is
      dominated by the unassigned arc unless the substrate filter is set.
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: caz-av-sunburst
    index: caz-sunburst
    section: Family hierarchy
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    use: dbcan/cazyme_hierarchy
    title: CAZyme hierarchy
    description: Rings are CAZy class, family and predicted substrate; arc size is the gene count.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 8}
  - component_type: figure
    tag: caz-fig-classes
    index: caz-classes
    section: Family hierarchy
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    use: dbcan/overview
    visu_type: bar
    mode: ui
    figure_params:
      x: sample
      y: genes
      color: cazy_class
      title: CAZyme genes per sample and class
    title: Class split per sample
    description: Stacked by CAZy class, so the bar height is the sample's total CAZyme count.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 8}

  - component_type: text
    tag: caz-sub-intro
    section: Substrates
    title: What the gene clusters target
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      run_dbCAN groups neighbouring CAZymes, transporters and regulators into
      gene clusters and matches them against dbCAN-PUL. A high bitscore is a
      close match to a characterised utilisation locus.
    workflow_tag: funcscan
    data_collection_tag: dbcan_substrates
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    tag: caz-fig-substrates
