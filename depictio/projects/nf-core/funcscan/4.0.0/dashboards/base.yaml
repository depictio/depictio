  - component_type: text
    tag: caz-hier-intro
    section: Family hierarchy
    title: Class to family to substrate
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Glycoside hydrolases and glycosyltransferases carry the bulk of any gut
      metagenome. Most genes have no substrate call, so the outer ring is
      dominated by the unassigned arc unless the substrate filter is set.
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: caz-av-sunburst
    index: caz-sunburst
    section: Family hierarchy
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    use: dbcan/cazyme_hierarchy
    title: CAZyme hierarchy
    description: Rings are CAZy class, family and predicted substrate; arc size is the gene count.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 8}
