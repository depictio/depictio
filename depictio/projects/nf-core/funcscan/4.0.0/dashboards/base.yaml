    mode: ui
    figure_params:
      x: substrate
      y: clusters
      color: sample
      title: Predicted substrates across the run
    title: Substrates predicted
    description: How many gene clusters target each polysaccharide, split by sample.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 6}
  - component_type: table
    tag: caz-table-substrates
    section: Substrates
    workflow_tag: funcscan
    data_collection_tag: dbcan_substrates
    use: dbcan/substrates
    title: CGC substrate predictions
    description: One row per CAZyme gene cluster with a dbCAN-PUL match.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 6}

  - component_type: text
    tag: caz-conc-intro
    section: Tool concordance
    title: Where the annotators agree
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Genes in the three-tool intersection carry a recommended family; genes in
      a single-tool set are the ones to treat as provisional. dbCAN-sub is the
      most permissive of the three, so its private set is the largest.
    workflow_tag: funcscan
    data_collection_tag: dbcan_tool_overlap
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: caz-av-upset
    index: caz-upset
    section: Tool concordance
    workflow_tag: funcscan
    data_collection_tag: dbcan_tool_overlap
    use: dbcan/cazyme_upset
    title: Annotation concordance
    description: Each bar is a set of annotation tools; its height is the genes only that set called.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 6}
  - component_type: table
    tag: caz-table-genes
    section: Tool concordance
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    use: dbcan/overview
    row_selection_enabled: true
    row_selection_column: family
    title: CAZyme annotations
    description: One row per gene with the family each of the three tools called.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 5}
# ============================================================================
# Tab 6: Run report (what the pipeline actually ran)
# ============================================================================
- title: Run report
  subtitle: The tools and versions the run recorded, read out of the MultiQC report
  tab_order: 6
  tab_icon: mdi:file-document-outline
  tab_icon_color: gray
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core

  filter_sections:
  - name: Version scope
    icon: mdi:filter-variant
    color: gray
    description: Which screen and which tool the tab is looking at
  - name: Process scope
    icon: mdi:tune
    color: blue
    description: Narrow to one Nextflow process
    collapsed: true

  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: gray
    description: How many tools each screen put to work
  - name: Tools and versions
    icon: mdi:file-document-outline
    color: blue
    description: Every process, the software it ran and the version it reported

  components:
  - component_type: interactive
    tag: run-filter-screen
    index: run-screen
    section: Version scope
    group: Versions
    workflow_tag: funcscan
    data_collection_tag: software_versions
    interactive_component_type: MultiSelect
    column_name: screen
    column_type: object
    display: {title_size: md, custom_color: '#868E96', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Screen
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: run-filter-tool
    index: run-tool
    section: Version scope
    group: Versions
    workflow_tag: funcscan
    data_collection_tag: software_versions
    interactive_component_type: MultiSelect
    column_name: tool
    column_type: object
    display: {title_size: md, custom_color: '#868E96', icon_name: 'mdi:tune'}
    placement: left
    title: Tool
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: run-filter-process
    index: run-process
    section: Process scope
    group: Processes
    workflow_tag: funcscan
    data_collection_tag: software_versions
    interactive_component_type: MultiSelect
    column_name: process
    column_type: object
    display: {title_size: md, custom_color: '#4C6EF5', icon_name: 'mdi:folder-outline'}
    placement: left
    title: Nextflow process
    layout: {x: 0, y: 6, w: 1, h: 3}

  - component_type: text
    tag: run-intro
    section: Run at a glance
    title: A MultiQC report with nothing but versions
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      funcscan feeds MultiQC only the software-versions table, so the report
      holds a single run-metadata row and no plot a MultiQC tile could draw.
      The payload is still there, and this tab reads it straight out of the
      same parquet: one row per Nextflow process and tool, labelled with the
      screen the process belongs to.
    workflow_tag: funcscan
    data_collection_tag: software_versions
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: run-card-tools
    section: Run at a glance
    workflow_tag: funcscan
    data_collection_tag: software_versions
    use: funcscan/software_versions
    aggregation: nunique
    column_name: tool
    column_type: object
    secondary_layout: top_n
    breakdown_col: screen
    top_n_count: 4
    display: {icon_name: 'mdi:tune', icon_color: '#495057', title_color: '#495057', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Distinct tools
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: run-card-processes
    section: Run at a glance
    workflow_tag: funcscan
    data_collection_tag: software_versions
    use: funcscan/software_versions
    aggregation: nunique
    column_name: process
    column_type: object
    secondary_layout: donut
    breakdown_col: screen
    top_n_count: 4
    display: {icon_name: 'mdi:folder-outline', icon_color: '#1971C2', title_color: '#1971C2', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Processes
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: run-card-entries
    section: Run at a glance
    workflow_tag: funcscan
    data_collection_tag: software_versions
    use: funcscan/software_versions
    aggregation: sum
    column_name: tools
    column_type: int64
    secondary_layout: composition
    breakdown_col: screen
    top_n_count: 4
    display: {icon_name: 'mdi:counter', icon_color: '#0C8599', title_color: '#0C8599', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Version entries
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: run-card-versions
    section: Run at a glance
    workflow_tag: funcscan
    data_collection_tag: software_versions
    use: funcscan/software_versions
    aggregation: nunique
    column_name: version
    column_type: object
    secondary_layout: top_n
    breakdown_col: tool
    top_n_count: 4
    display: {icon_name: 'mdi:check-decagram', icon_color: '#2F9E44', title_color: '#2F9E44', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Distinct versions
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: text
    tag: run-versions-intro
    section: Tools and versions
    title: Which screen ran what
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A screen that reports no tool here did not run, whatever the parameters
      say, so this is the first place to look when a tab is empty.
    workflow_tag: funcscan
    data_collection_tag: software_versions
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    tag: run-fig-tools
    index: run-tools
    section: Tools and versions
    workflow_tag: funcscan
    data_collection_tag: software_versions
    use: funcscan/software_versions
    visu_type: bar
    mode: ui
    figure_params:
      x: screen
      y: tools
      color: tool
      title: Tools per screen
    title: Tools per screen
    description: How many version entries each screen contributed, stacked by tool.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 6}
  - component_type: table
    tag: run-table-versions
    section: Tools and versions
    workflow_tag: funcscan
    data_collection_tag: software_versions
    use: funcscan/software_versions
    title: Software versions
    description: One row per process and tool, as the run recorded it.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 7}
