      reference_line: horizontal
      reference_value: 7.0
      opacity: 0.7
      selection_enabled: true
      selection_column: cds_id
    title: Charge against hydrophobicity
    description: One point per candidate, coloured by charge class and sized by peptide length. The line at pI 7 is where a peptide turns cationic at physiological pH; hydrophobic peptides above it are the classic membrane-active shape. AMPcombi reports no net charge, so the isoelectric point is the charge axis.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 7}
  - component_type: advanced_viz
    tag: amp-av-embedding
    index: amp-embedding
    section: Property space
    workflow_tag: funcscan
    data_collection_tag: ampcombi_embedding
    use: ampcombi/amp_embedding
    config: {color_col: charge_class}
    title: Physicochemistry PCA
    description: Two components over weight, pI, hydrophobicity and the three structure fractions.
    title_size: h3
    layout: {x: 0, y: 8, w: 8, h: 6}
  - component_type: table
    tag: amp-table-candidates
    section: Property space
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    use: ampcombi/summary
    row_selection_enabled: true
    row_selection_column: cds_id
    title: AMP candidates
    description: Selecting rows narrows the property scatter to the same peptides.
    title_size: h3
    layout: {x: 0, y: 14, w: 8, h: 5}

  - component_type: text
    tag: amp-cluster-intro
    section: Clusters
    title: Peptides shared across samples
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [MMseqs2](https://github.com/soedinglab/MMseqs2) clusters the candidates
      of the whole run, so a large cluster is a peptide family several
      assemblies carry. The sample shown is the one that contributed the
      representative sequence.
    workflow_tag: funcscan
    data_collection_tag: ampcombi_clusters
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    tag: amp-fig-cluster-sizes
    index: amp-cluster-sizes
    section: Clusters
    workflow_tag: funcscan
    data_collection_tag: ampcombi_clusters
    use: ampcombi/clusters
    visu_type: histogram
    mode: ui
    figure_params:
      x: members
      color: sample
      title: Cluster size distribution
    title: Cluster sizes
    description: How many sequences each cluster holds, split by the sample that contributed the representative.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 6}
  - component_type: table
    tag: amp-table-clusters
    section: Clusters
    workflow_tag: funcscan
    data_collection_tag: ampcombi_clusters
    use: ampcombi/clusters
    title: Peptide clusters
    description: One row per cluster, largest first.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 6}

# ============================================================================
# Tab 4: BGCs
# ============================================================================
- title: BGCs
  subtitle: Biosynthetic gene clusters merged from antiSMASH, DeepBGC and GECCO
  tab_order: 4
  tab_icon: mdi:graph-outline
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core

  filter_sections:
  - name: Cluster scope
    icon: mdi:filter-variant
    color: cyan
    description: Which caller and which product class the tab is looking at
  - name: Region size
    icon: mdi:ruler
    color: blue
    description: Region length and coding density floors
    collapsed: true

  grid_sections:
  - name: BGCs at a glance
    icon: mdi:counter
    color: cyan
    description: How many clusters the callers predicted and how complete they are
  - name: Product classes
    icon: mdi:chart-bar
    color: blue
    description: Which chemistry each sample is predicted to make
  - name: Region maps
    icon: mdi:chart-timeline-variant
    color: violet
    description: Where the predicted clusters sit on their contigs
  - name: Caller concordance
    icon: mdi:set-merge
    color: indigo
    description: Where antiSMASH, DeepBGC and GECCO land on the same contig

  components:
  - component_type: interactive
    tag: bgc-filter-tool
    index: bgc-tool
    section: Cluster scope
    group: Callers
    workflow_tag: funcscan
    data_collection_tag: combgc_summary
    interactive_component_type: MultiSelect
    column_name: tool
    column_type: object
    display: {title_size: md, custom_color: '#0C8599', icon_name: 'mdi:tune'}
    placement: left
    title: Prediction tool
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: bgc-filter-class
    index: bgc-class
    section: Cluster scope
    group: Callers
    workflow_tag: funcscan
    data_collection_tag: combgc_summary
    interactive_component_type: MultiSelect
    column_name: product_class
    column_type: object
    display: {title_size: md, custom_color: '#0C8599', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Product class
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: bgc-filter-length
    index: bgc-length
    section: Region size
    group: Thresholds
    workflow_tag: funcscan
    data_collection_tag: combgc_summary
    interactive_component_type: RangeSlider
    column_name: length
    column_type: int64
    display: {title_size: md, custom_color: '#1971C2', icon_name: 'mdi:ruler'}
    placement: left
    title: Region length (bp)
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: bgc-filter-cds
    index: bgc-cds
    section: Region size
    group: Thresholds
    workflow_tag: funcscan
    data_collection_tag: combgc_summary
    interactive_component_type: RangeSlider
    column_name: cds_count
    column_type: int64
    display: {title_size: md, custom_color: '#1971C2', icon_name: 'mdi:counter'}
    placement: left
    title: CDS in the region
    layout: {x: 0, y: 9, w: 1, h: 3}
  # The three track tiles read combgc_region_track, a different collection from
  # the counts above, so the tab-local filters that reach them live here.
  - component_type: interactive
    tag: bgc-filter-track-class
    index: bgc-track-class
    section: Cluster scope
    group: Callers
    workflow_tag: funcscan
    data_collection_tag: combgc_region_track
    interactive_component_type: MultiSelect
    column_name: product_class
    column_type: object
    display: {title_size: md, custom_color: '#0C8599', icon_name: 'mdi:chart-timeline-variant'}
    placement: left
    title: Product class on the map
    layout: {x: 0, y: 12, w: 1, h: 3}
  - component_type: interactive
    tag: bgc-filter-track-length
    index: bgc-track-length
    section: Region size
    group: Thresholds
    workflow_tag: funcscan
    data_collection_tag: combgc_region_track
    interactive_component_type: RangeSlider
    column_name: length_kb
    column_type: float64
    display: {title_size: md, custom_color: '#1971C2', icon_name: 'mdi:ruler'}
    placement: left
    title: Region length on the map (kb)
    layout: {x: 0, y: 15, w: 1, h: 3}

  - component_type: text
    tag: bgc-intro
    section: BGCs at a glance
    title: Clusters on fragmented assemblies
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      comBGC merges the three callers into one table. On metagenome assemblies
      almost every region runs off the end of its contig, so the completeness
      card reads low by construction rather than by failure.
    workflow_tag: funcscan
    data_collection_tag: combgc_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: bgc-card-regions
    section: BGCs at a glance
    workflow_tag: funcscan
    data_collection_tag: combgc_summary
    use: combgc/summary
    aggregation: sum
    column_name: regions
    column_type: int64
    secondary_layout: top_n
    breakdown_col: product_class
    top_n_count: 4
    display: {icon_name: 'mdi:graph-outline', icon_color: '#0C8599', title_color: '#0C8599', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Regions
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: bgc-card-contigs
    section: BGCs at a glance
    workflow_tag: funcscan
    data_collection_tag: combgc_summary
    use: combgc/summary
    aggregation: nunique
    column_name: contig
    column_type: object
    secondary_layout: composition
    breakdown_col: complete
    top_n_count: 3
    display: {icon_name: 'mdi:shape-outline', icon_color: '#1971C2', title_color: '#1971C2', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Contigs with a cluster
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: bgc-card-length
    section: BGCs at a glance
    workflow_tag: funcscan
    data_collection_tag: combgc_summary
    use: combgc/summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: length
    column_type: int64
    display: {icon_name: 'mdi:ruler', icon_color: '#3B5BDB', title_color: '#3B5BDB', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Region length
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: bgc-card-cds
    section: BGCs at a glance
    workflow_tag: funcscan
    data_collection_tag: combgc_summary
    use: combgc/summary
    aggregation: average
    column_name: cds_count
    column_type: int64
    secondary_layout: histogram
    display: {icon_name: 'mdi:counter', icon_color: '#5F3DC4', title_color: '#5F3DC4', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: CDS per region
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: text
    tag: bgc-class-intro
    section: Product classes
    title: Predicted chemistry per sample
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Terpene precursors and arylpolyenes dominate gut-metagenome assemblies.
      A tall single-class bar usually means one contig family repeated across
      the assembly rather than a rich biosynthetic repertoire.
    workflow_tag: funcscan
    data_collection_tag: combgc_summary
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    tag: bgc-fig-classes
    index: bgc-classes
    section: Product classes
    workflow_tag: funcscan
    data_collection_tag: combgc_summary
    use: combgc/summary
    visu_type: bar
    mode: ui
    figure_params:
      x: sample
      y: regions
      color: product_class
      title: BGC regions per sample and product class
    title: Regions per sample
    description: Stacked by predicted product class.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 6}
  - component_type: advanced_viz
    tag: bgc-av-sunburst
    index: bgc-sunburst
    section: Product classes
    workflow_tag: funcscan
    data_collection_tag: combgc_summary
    use: combgc/bgc_hierarchy
    title: Caller to product class
    description: Inner ring is the prediction tool, outer ring the product class it called.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 6}
  - component_type: table
    tag: bgc-table-regions
    section: Product classes
    workflow_tag: funcscan
    data_collection_tag: combgc_summary
    use: combgc/summary
    row_selection_enabled: true
    row_selection_column: contig
    title: BGC regions
    description: One row per predicted region, with its coordinates and PFAM domains.
    title_size: h3
    layout: {x: 0, y: 13, w: 8, h: 5}

  - component_type: text
    tag: bgc-map-intro
    section: Region maps
    title: Where the clusters sit
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The same 155 regions as coordinates rather than counts. Two contigs
      carrying one cluster each is a different finding from one contig carrying
      two head to tail, and only a map shows the difference. comBGC reports no
      orientation for a region, so every arrow is drawn left to right: that is
      a drawing convention, not a strand call.
    workflow_tag: funcscan
    data_collection_tag: combgc_region_track
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: bgc-av-genome-track
    index: bgc-genome-track
    section: Region maps
    workflow_tag: funcscan
    data_collection_tag: combgc_region_track
    use: combgc/bgc_genome_track
    config:
      mark: rect
      score_title: Region length (kb)
      selection_enabled: true
      selection_column: contig
    title: Cluster footprints on the genome axis
    description: One rectangle per region, drawn from its start to its end on a locus axis that zooms. The height is the region length in kilobases and the colour the product class.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: advanced_viz
    tag: bgc-av-region-arrows
    index: bgc-region-arrows
    section: Region maps
    workflow_tag: funcscan
    data_collection_tag: combgc_region_track
    use: combgc/bgc_region_arrows
    config:
      show_labels: true
      arrow_height: 0.5
    title: Clusters along their contig
    description: One lane per contig and one arrow per predicted region, the same pattern the Resistome tab uses for resistance islands. Several arrows packed into one lane is a biosynthetic locus rather than a scattered repertoire.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 6}
  - component_type: advanced_viz
    tag: bgc-av-region-coverage
    index: bgc-region-coverage
    section: Region maps
    workflow_tag: funcscan
    data_collection_tag: combgc_region_track
    use: combgc/bgc_region_coverage
    config:
      mark: rect
      facet_by_sample: false
    title: Region length along the contig
    description: The same intervals as a plain coordinate profile. It needs no genome renderer, so it is the one tile on this section that is certain to draw.
    title_size: h3
    layout: {x: 0, y: 15, w: 8, h: 6}
  - component_type: table
    tag: bgc-table-track
    section: Region maps
    workflow_tag: funcscan
    data_collection_tag: combgc_region_track
    use: combgc/region_track
    row_selection_enabled: true
    row_selection_column: contig
    title: BGC region coordinates
    description: The rows behind the three maps, one per region.
    title_size: h3
    layout: {x: 0, y: 21, w: 8, h: 5}

  - component_type: text
    tag: bgc-conc-intro
    section: Caller concordance
    title: Where the callers agree
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Agreement is counted on the contig: the callers draw region boundaries
      differently, so a coordinate join would report no overlap at all even
      where they mean the same cluster.
    workflow_tag: funcscan
    data_collection_tag: combgc_tool_overlap
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: bgc-av-upset
    index: bgc-upset
    section: Caller concordance
    workflow_tag: funcscan
    data_collection_tag: combgc_tool_overlap
    use: combgc/bgc_upset
    title: Caller concordance
    description: Each bar is a set of callers; its height is the contigs only that set reported.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 6}

# ============================================================================
# Tab 5: CAZymes
# ============================================================================
- title: CAZymes
  subtitle: Carbohydrate-active enzymes and the substrates their gene clusters target
  tab_order: 5
  tab_icon: mdi:leaf
  tab_icon_color: green
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core

  filter_sections:
  - name: CAZyme scope
    icon: mdi:filter-variant
    color: green
    description: Which CAZy class and which substrate the tab is looking at
  - name: Call confidence
    icon: mdi:tune
    color: lime
    description: How many of the three annotation tools have to agree
    collapsed: true

  grid_sections:
  - name: CAZymes at a glance
    icon: mdi:counter
    color: green
    description: How much carbohydrate-degrading capacity run_dbCAN annotated
  - name: Family hierarchy
    icon: mdi:chart-donut
    color: lime
    description: Class to family to substrate, and the class split per sample
  - name: Substrates
    icon: mdi:shape-outline
    color: teal
    description: Which polysaccharides the CAZyme gene clusters target
  - name: Tool concordance
    icon: mdi:set-merge
    color: cyan
    description: HMMER, dbCAN-sub and DIAMOND on the same genes

  components:
  - component_type: interactive
    tag: caz-filter-class
    index: caz-class
    section: CAZyme scope
    group: Annotations
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
