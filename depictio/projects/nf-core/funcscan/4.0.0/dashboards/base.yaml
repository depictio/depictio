    column_type: int64
    display:
      icon_name: mdi:counter
      custom_color: indigo
    section: Cluster filters
    tag: fs-bgc-filter-cds
    index: bgc-cds
    title: CDS in the region
    layout: {x: 0, y: 9, w: 1, h: 3}
  # The map tiles read combgc_region_track, a different collection from the
