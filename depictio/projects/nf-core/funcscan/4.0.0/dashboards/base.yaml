- title: BGCs
  subtitle: Which biosynthetic gene clusters do the assemblies carry, and where?
  tab_group: Metabolism
  tab_order: 1
  tab_icon: mdi:graph-outline
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Cluster filters
    icon: mdi:filter-variant
    color: cyan
    description: Narrows the regions by caller, product class and size
  - name: Map filters
    icon: mdi:chart-timeline-variant
    color: violet
    description: Narrows the region map, which reads its own collection
  grid_sections:
  - name: BGCs at a glance
    icon: mdi:counter
    color: cyan
    description: How many regions the callers predicted, and how complete they are
  - name: Product classes
    icon: mdi:chart-donut
    color: blue
    description: Which chemistry each caller predicts, and per assembly
