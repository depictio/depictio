- title: CAZymes
  subtitle: Which carbohydrate-active enzymes do the assemblies carry, and for which substrates?
  tab_group: Metabolism
  tab_order: 2
  tab_icon: mdi:leaf
  tab_icon_color: green
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: CAZyme filters
    icon: mdi:filter-variant
    color: green
    description: Narrows the genes by CAZy class, substrate and tool agreement
  grid_sections:
  - name: CAZymes at a glance
    icon: mdi:counter
    color: green
    description: How much carbohydrate-active capacity run_dbCAN annotated
  - name: Family hierarchy
    icon: mdi:chart-donut
    color: lime
    description: CAZy class to family to substrate, then the classes per assembly
  - name: Substrates
    icon: mdi:shape-outline
    color: teal
    description: Which polysaccharides the CAZyme gene clusters target
  - name: Tool concordance
    icon: mdi:set-merge
    color: cyan
    description: HMMER, dbCAN-sub and DIAMOND on the same genes, and every gene
    collapsed: true
  - name: Substrate table
    icon: mdi:table
    color: gray
    description: One row per gene cluster with a dbCAN-PUL match
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [run_dbCAN](https://github.com/bcb-unl/run_dbcan) annotates every predicted protein with
      HMMER, dbCAN-sub and DIAMOND and recommends a family where at least two agree; a gene
      called by one tool keeps that tool's family. The rings read class, family and
      substrate; most genes have no substrate call and form the unassigned arc.
    tag: fs-caz-intro
    index: caz-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    interactive_component_type: MultiSelect
    column_name: cazy_class
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: green
    section: CAZyme filters
    tag: fs-caz-filter-class
    index: caz-class
    title: CAZy class
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    interactive_component_type: MultiSelect
    column_name: substrate
    column_type: object
    display:
      icon_name: mdi:leaf
      custom_color: lime
    section: CAZyme filters
    tag: fs-caz-filter-substrate
    index: caz-substrate
    title: Substrate
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    interactive_component_type: RangeSlider
    column_name: n_tools
    column_type: int64
    display:
      icon_name: mdi:scale-balance
      custom_color: yellow
    section: CAZyme filters
    tag: fs-caz-filter-ntools
    index: caz-ntools
    title: Tools agreeing
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    use: dbcan/overview
    aggregation: count
    column_name: gene_id
    column_type: object
    secondary_layout: donut
    breakdown_col: cazy_class
    top_n_count: 4
    display:
      icon_name: mdi:leaf
      icon_color: green
      caption: by CAZy class
    section: CAZymes at a glance
    tag: fs-caz-card-genes
    index: caz-card-genes
    title: CAZyme genes
    description: Genes run_dbCAN annotated as carbohydrate-active. The ring splits them by class.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    use: dbcan/overview
    aggregation: average
    column_name: n_tools
    column_type: int64
    secondary_layout: gauge
    coverage_max: 3
    display:
      icon_name: mdi:scale-balance
      icon_color: lime
      caption: mean per gene, of three tools
      decimals: 1
    section: CAZymes at a glance
    tag: fs-caz-card-ntools
    index: caz-card-ntools
    title: Tools agreeing
    description: How many of HMMER, dbCAN-sub and DIAMOND called a gene, on average.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    use: dbcan/overview
    aggregation: count
    column_name: gene_id
    column_type: object
    filter_expr: "col('substrate') != 'unassigned'"
    secondary_layout: composition
    breakdown_col: substrate
    display:
      icon_name: mdi:chart-donut
      icon_color: teal
      caption: the substrates called most
    section: CAZymes at a glance
    tag: fs-caz-card-substrate
    index: caz-card-substrate
    title: Genes with a substrate
    description: Genes with a predicted substrate. The bar splits them by substrate.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: funcscan
    data_collection_tag: dbcan_substrates
    use: dbcan/substrates
    aggregation: median
    column_name: bitscore
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:check-decagram
      icon_color: cyan
      caption: per gene cluster, median and spread
      decimals: 0
    section: CAZymes at a glance
    tag: fs-caz-card-bitscore
    index: caz-card-bitscore
    title: PUL match bitscore
    description: How closely the gene clusters match a characterised utilisation locus in dbCAN-PUL.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    use: dbcan/cazyme_hierarchy
    section: Family hierarchy
    tag: fs-caz-sunburst
    index: caz-sunburst
    title: CAZyme hierarchy
    description: Rings are CAZy class, family and substrate; arc size is the gene count.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    use: dbcan/overview
    visu_type: bar
    mode: ui
    figure_params:
      x: sample
      y: genes
      color: cazy_class
      labels: {sample: Assembly, genes: CAZyme genes, cazy_class: CAZy class}
    section: Family hierarchy
    tag: fs-caz-classes
    index: caz-classes
    title: CAZy classes per assembly
    description: Stacked by CAZy class, so the bar is the assembly's CAZyme count.
    layout: {x: 0, y: 6, w: 8, h: 4}
  - component_type: figure
    workflow_tag: funcscan
    data_collection_tag: dbcan_substrates
    use: dbcan/substrates
    mode: code
    code_content: |-
      # The 15 substrates with the most gene clusters, as horizontal bars. dbCAN-PUL
      # names run long, so a label is cut at 40 characters (hover keeps the full name
      # and the assemblies carrying it). Analysis mode's groups take the colour.
      keys = list(depictio_group_by) + ['substrate']
      top = (
          df.filter(pl.col('substrate') != 'unassigned')
          .group_by('substrate')
          .agg(pl.col('clusters').sum())
          .sort(['clusters', 'substrate'], descending=[True, False])
          .head(15)['substrate']
          .to_list()
      )
      d = (
          df.filter(pl.col('substrate').is_in(top))
          .group_by(keys)
          .agg(pl.col('clusters').sum(), pl.col('sample').n_unique().alias('assemblies'))
          .with_columns(
              pl.when(pl.col('substrate').str.len_chars() > 40)
              .then(pl.col('substrate').str.slice(0, 38) + '...')
              .otherwise(pl.col('substrate'))
              .alias('label')
          )
      )
      fig = px.bar(d.to_pandas(), x='clusters', y='label', orientation='h', hover_data={'substrate': True, 'assemblies': True, 'label': False}, labels={'clusters': 'Gene clusters', 'label': '', 'assemblies': 'Assemblies', 'substrate': 'Substrate'}, **depictio_group_kwargs)
      fig.update_yaxes(categoryorder='total ascending', automargin=True)
      fig.update_layout(margin=dict(t=10))
