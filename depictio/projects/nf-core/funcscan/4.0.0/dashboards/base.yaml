  - component_type: text
    tag: amp-intro
    section: AMPs at a glance
    title: Candidates AMPcombi kept
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      AMPcombi merges the per-tool predictions, keeps the peptides above the
      run's probability cut-off and annotates each with physicochemistry. In
      this run ampir carried the screen and Macrel agreed on almost nothing,
      so the best-probability column is effectively ampir's.
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
