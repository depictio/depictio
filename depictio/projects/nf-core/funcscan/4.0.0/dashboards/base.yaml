version: 1
# nf-core/funcscan 4.0.0. Every rule this file follows is written out in
# depictio/projects/nf-core/RULES.md; ampliseq/2.18.0 is the reference.
#
# Funnel: the Overview, then Data & QC (what ran, what each assembly yielded,
# the contigs the screens share), then Antimicrobials (Resistome, AMPs) and
# Metabolism (BGCs, CAZymes), one tab per screen.
#
# The run's MultiQC report carries software versions only (no general stats,
# no plot sections), so there is no MultiQC tab: the versions are read out of
# it on the Run report tab. The funcscan samplesheet is `sample,fasta`, with no
# experimental factor, so the template has no GROUP_COL: the sample filters
# hold the sample id only, on screening_summary, the hub every screen links
# from. The route flags (--run_arg_screening, ...) prune each screen's
# collections; screening_summary is written on every route (a screen that did
# not run reads 0), so the Key figures read it.
main_dashboard:
  title: nf-core/funcscan
  subtitle: Assemblies screened for resistance genes, peptides, gene clusters and CAZymes
  project_tag: Funcscan Functional Screening
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab: figures, advanced viz and filter
  # chips all colour a value the same way.
  category_colors:
    # The screens: `screen` on Run report and the Samples composition,
    # `top_screen` (the screen leading on a contig) on Contigs.
    screen:
      '*': auto
      ARG: '#e03131'
      AMP: '#9c36b5'
      BGC: '#1098ad'
      CAZyme: '#37b24d'
      Annotation: '#f08c00'
      Taxonomy: '#1c7ed6'
      Workflow: '#868e96'
    top_screen:
      '*': auto
      ARG: '#e03131'
      AMP: '#9c36b5'
      BGC: '#1098ad'
      CAZyme: '#37b24d'
    # The five ARG tools and the three BGC callers.
    tool:
      '*': auto
      abricate: '#e8590c'
      amrfinderplus: '#c2255c'
      deeparg: '#7048e8'
      fargene: '#1c7ed6'
      rgi: '#2f9e44'
      antiSMASH: '#0c8599'
      DeepBGC: '#f59f00'
      GECCO: '#5c940d'
    charge_class:
      acidic: '#4263eb'
      neutral: '#adb5bd'
      basic: '#e8590c'
    complete:
      'Yes': '#2f9e44'
      'No': '#f08c00'
      unknown: '#adb5bd'
    # More values than the palette's eight: the largest take it, largest first.
    drug_class:
      '*': 'auto:hits'
    product_class:
      '*': 'auto:regions'
      Unknown: '#adb5bd'
    cazy_class:
      '*': 'auto:genes'
    substrate:
      '*': 'auto:genes'
      unassigned: '#adb5bd'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. Bound
  # to screening_summary, the source of every sample link in template.yaml.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The screening hub and the sample sheet, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card. No GROUP_COL in
  # this template, so the sample comes first.
  - component_type: interactive
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: fs-ov-kf-sample
    index: ov-kf-sample
    title: Sample ID
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    interactive_component_type: RangeSlider
    column_name: arg_hits
    column_type: int64
    display:
      icon_name: mdi:bacteria-outline
      custom_color: red
      strip_label: ARG hits
    section: Key figures
    tag: fs-ov-kf-arg-range
    index: ov-kf-arg-range
    title: ARG hits per assembly
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: text
    title: nf-core/funcscan
    logo: https://raw.githubusercontent.com/nf-core/funcscan/master/docs/images/nf-core-funcscan_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/funcscan/master/docs/images/nf-core-funcscan_logo_dark.png
    order: 1
    body: >
      Assembled contigs screened for antimicrobial resistance genes, antimicrobial peptides,
      biosynthetic gene clusters and carbohydrate-active enzymes. [Run parameters](params:)
    tag: fs-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/funcscan calls the genes on every contig, then runs four screens over them: resistance genes, antimicrobial peptides, biosynthetic gene clusters and CAZymes. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The sample filters in the left panel apply to every tab: narrow the assemblies once and the whole dashboard follows. A bar above a section narrows that section only.
    tag: fs-ov-about
    index: ov-about
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash.
  - component_type: text
    surface: card
    values:
      samples: {dc: screening_summary, column: sample, aggregation: nunique, format: integer}
      screens: {dc: screening_summary, column: screens, aggregation: max, format: integer}
    body: |
      ### The run
      - ![](icon:mdi:flask-outline) **Assemblies** {{samples}}
      - ![](icon:mdi:magnify) **Screens** {{screens}} of 4
      - ![](icon:mdi:dna) **Gene caller** {{param:annotation_tool}}
      - ![](icon:mdi:atom) **AMP reference** {{param:amp_ampcombi_db_id}}
    tag: fs-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Five steps from contigs to functions
      Each step names its settings and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:dna) **Annotate** Genes called on every contig · [Settings](params:annotation) · [Contigs](tab:Contigs)
      2. ![](icon:mdi:bacteria-outline) **Resistance** Five ARG tools, harmonised · [Settings](params:arg_) · [Resistome](tab:Resistome)
      3. ![](icon:mdi:atom) **Peptides** Predictors merged by AMPcombi · [Settings](params:amp_) · [AMPs](tab:AMPs)
      4. ![](icon:mdi:graph-outline) **Clusters** antiSMASH, DeepBGC, GECCO · [Settings](params:bgc_) · [BGCs](tab:BGCs)
      5. ![](icon:mdi:leaf) **CAZymes** run_dbCAN on every protein · [Settings](params:cazyme) · [CAZymes](tab:CAZymes)
      :::
    tag: fs-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  # Key figures: one card per screen, each opening the tab that explains it,
  # all on screening_summary so every route keeps four cards (a screen that did
  # not run reads 0). The icon colour is that tab's colour.
  - component_type: card
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    use: funcscan/screening_summary
    aggregation: sum
    column_name: arg_hits
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:bacteria-outline
      icon_color: red
      caption: in total; the box, per assembly
      link: tab:Resistome
    section: Key figures
    tag: fs-ov-kf-arg
    index: ov-kf-arg
    title: ARG hits
    description: Resistance-gene hits all ARG tools reported, summed over the assemblies in view. The box shows how they spread per assembly.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    use: funcscan/screening_summary
    aggregation: sum
    column_name: amp_candidates
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:atom
      icon_color: grape
      caption: in total; the box, per assembly
      link: tab:AMPs
    section: Key figures
    tag: fs-ov-kf-amp
    index: ov-kf-amp
    title: AMP candidates
    description: Peptide candidates AMPcombi kept above its probability cut-off. The box shows how they spread per assembly.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    use: funcscan/screening_summary
    aggregation: sum
    column_name: bgc_regions
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:graph-outline
      icon_color: cyan
      caption: in total; the box, per assembly
      link: tab:BGCs
    section: Key figures
    tag: fs-ov-kf-bgc
    index: ov-kf-bgc
    title: BGC regions
    description: Biosynthetic gene cluster regions the callers predicted. The box shows how they spread per assembly.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    use: funcscan/screening_summary
    aggregation: sum
    column_name: cazymes
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:leaf
      icon_color: green
      caption: in total; the box, per assembly
      link: tab:CAZymes
    section: Key figures
    tag: fs-ov-kf-cazyme
    index: ov-kf-cazyme
    title: CAZyme genes
    description: Genes run_dbCAN annotated as carbohydrate-active enzymes. The box shows how they spread per assembly.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the sample, then the ARG tool (the inner ring of the
  # resistome highlight). A run without the ARG screen prunes the second.
  - component_type: interactive
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Sample
    section: Findings
    tag: fs-ov-findings-sample
    index: ov-findings-sample
    title: Sample ID
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    interactive_component_type: MultiSelect
    column_name: tool
    column_type: object
    display:
      icon_name: mdi:tune
      custom_color: orange
      strip_label: ARG tool
    section: Findings
    tag: fs-ov-findings-tool
    index: ov-findings-tool
    title: ARG tool
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per screen, each citing one data collection, so the import
  # removes a row with its screen.
  - component_type: text
    surface: card
    values:
      arg_genes: {dc: hamronization_report, column: gene_symbol, aggregation: nunique, format: integer}
      arg_tools: {dc: hamronization_report, column: tool, aggregation: nunique, format: integer}
      amp_hi: {dc: ampcombi_summary, column: cds_id, aggregation: count, filter_expr: "col('prob_max') >= 0.8",
        format: integer}
      amp_n: {dc: ampcombi_summary, column: cds_id, aggregation: count, format: integer}
      bgc_top: {dc: combgc_summary, column: product_class, aggregation: top, weight: regions, filter_expr: "col('product_class') != 'Unknown'"}
      bgc_share: {dc: combgc_summary, column: product_class, aggregation: top_share, weight: regions, filter_expr: "col('product_class') != 'Unknown'",
        format: percent}
      caz_top: {dc: dbcan_overview, column: substrate, aggregation: top, weight: genes, filter_expr: "col('substrate') != 'unassigned'"}
      caz_share: {dc: dbcan_overview, column: substrate, aggregation: top_share, weight: genes, filter_expr: "col('substrate') != 'unassigned'",
        format: percent}
    body: |
      - **{{arg_genes}}** distinct resistance gene names, from {{arg_tools}} ARG tools – harmonised by hAMRonization [Resistome](tab:Resistome)
      - **{{amp_hi}}** of {{amp_n}} peptide candidates reach a probability of 0.8 – best of the AMP predictors [AMPs](tab:AMPs)
      - **{{bgc_share}}** of the classified BGC regions are {{bgc_top}} – the leading product class [BGCs](tab:BGCs)
      - **{{caz_share}}** of the CAZyme genes with a substrate call target {{caz_top}} – the leading substrate [CAZymes](tab:CAZymes)
    section: Findings
    tag: fs-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per screen tab, in the order of the rows above. The import
  # drops a highlight whose source is gone and re-packs the grid.
  - component_type: highlight
    section: Findings
    source_tab: Resistome
    source_component: arg-sunburst
    caption: Hits by tool, then drug class, then gene; each tool keeps its own class names. The ARG tool filter redraws it.
    tag: fs-ov-hl-resistome
    index: ov-hl-resistome
    layout: {x: 0, y: 2, w: 5, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: AMPs
    source_component: amp-property
    caption: One point per peptide candidate, coloured by charge; above the line at pI 7, the peptide is cationic.
    tag: fs-ov-hl-amps
    index: ov-hl-amps
    layout: {x: 5, y: 2, w: 3, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: BGCs
    source_component: bgc-sunburst
    caption: BGC regions by caller, then by the product class it predicted.
    tag: fs-ov-hl-bgcs
    index: ov-hl-bgcs
    layout: {x: 0, y: 6, w: 3, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: CAZymes
    source_component: caz-classes
    caption: CAZyme genes per assembly, stacked by CAZy class.
    tag: fs-ov-hl-cazymes
    index: ov-hl-cazymes
    layout: {x: 3, y: 6, w: 5, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers. A tab the run does not have is left out.
  - component_type: text
    body: |
      ### Data & QC
      - [Run report](tab:Run report)
      - [Samples](tab:Samples)
      - [Contigs](tab:Contigs)

      ### Antimicrobials
      - [Resistome](tab:Resistome)
      - [AMPs](tab:AMPs)

      ### Metabolism
      - [BGCs](tab:BGCs)
      - [CAZymes](tab:CAZymes)
    section: How to read this dashboard
    tag: fs-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # The persistent sample filter: the funcscan samplesheet has no design
  # column, so the sample id is the only one.
  - component_type: interactive
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: fs-filter-sample
    index: sample-filters-sample
    title: Sample ID
    layout: {x: 0, y: 0, w: 1, h: 3}
  # The hub first: its row selection carries the picked assemblies to every
  # screen through the project links. The sample sheet names each assembly file.
  - component_type: table
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    use: funcscan/screening_summary
    row_selection_enabled: true
    row_selection_column: sample
    section: Sample sheet
    tag: fs-sample-hub
    index: sample-hub
    title: Screening summary per assembly
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: funcscan
    data_collection_tag: samplesheet
    use: funcscan/samplesheet
    section: Sample sheet
    tag: fs-sample-sheet
    index: sample-sheet
    title: Sample sheet
    layout: {x: 0, y: 6, w: 8, h: 6}
tabs:
- title: Run report
  subtitle: Which screens and tools did the run execute?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: mdi:file-document-outline
  tab_icon_color: gray
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Version filters
    icon: mdi:filter-variant
    color: gray
    description: Narrows the versions by screen and tool
  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: gray
    description: The screens that ran and the tools they used
  - name: Tools per screen
    icon: mdi:chart-bar
    color: blue
    description: How many tool versions each screen recorded
  - name: Software versions
    icon: mdi:table
    color: gray
    description: Every process, the tool it ran and the version it reported
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      The tools and versions the run recorded, read out of the
      [MultiQC](https://seqera.io/multiqc/) versions table. A screen that lists no tool here
      did not run, so this is the first place to look when a tab is empty.
    tag: fs-run-intro
    index: run-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: funcscan
    data_collection_tag: software_versions
    interactive_component_type: MultiSelect
    column_name: screen
    column_type: object
    display:
      icon_name: mdi:magnify
      custom_color: indigo
    section: Version filters
    tag: fs-run-filter-screen
    index: run-screen
    title: Screen
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: funcscan
    data_collection_tag: software_versions
    interactive_component_type: MultiSelect
    column_name: tool
    column_type: object
    display:
      icon_name: mdi:tune
      custom_color: orange
    section: Version filters
    tag: fs-run-filter-tool
    index: run-tool
    title: Tool
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: funcscan
    data_collection_tag: software_versions
    use: funcscan/software_versions
    aggregation: nunique
    column_name: screen
    column_type: object
    filter_expr: "(col('screen') == 'ARG') | (col('screen') == 'AMP') | (col('screen') == 'BGC') | (col('screen') == 'CAZyme')"
    secondary_layout: gauge
    coverage_max: 4
    display:
      icon_name: mdi:magnify
      icon_color: indigo
      caption: of the four screens
    section: Run at a glance
    tag: fs-run-card-screens
    index: run-card-screens
    title: Screens that ran
    description: The four screens (ARG, AMP, BGC, CAZyme) that recorded at least one tool version.
    layout: {x: 0, y: 0, w: 4, h: 2}
  - component_type: card
    workflow_tag: funcscan
    data_collection_tag: software_versions
    use: funcscan/software_versions
    aggregation: nunique
    column_name: tool
    column_type: object
    secondary_layout: top_n
    breakdown_col: screen
    top_n_count: 4
    display:
      icon_name: mdi:tune
      icon_color: orange
      caption: distinct tools, the screens running most
    section: Run at a glance
    tag: fs-run-card-tools
    index: run-card-tools
    title: Tools
    description: Distinct tools the run recorded a version for, ranked by screen.
    layout: {x: 4, y: 0, w: 4, h: 2}
  - component_type: figure
    workflow_tag: funcscan
    data_collection_tag: software_versions
    use: funcscan/software_versions
    visu_type: bar
    mode: ui
    figure_params:
      x: screen
      y: tools
      color: screen
      labels: {screen: Screen, tools: Tool versions}
    section: Tools per screen
    tag: fs-run-tools
    index: run-tools
    title: Tool versions per screen
    description: One bar per screen; a screen missing here did not run.
    layout: {x: 0, y: 0, w: 8, h: 4, fit: auto}
  - component_type: table
    workflow_tag: funcscan
    data_collection_tag: software_versions
    use: funcscan/software_versions
    row_selection_enabled: true
    row_selection_column: tool
    section: Software versions
    tag: fs-run-versions
    index: run-versions
    title: Software versions
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Samples
  subtitle: What did each assembly yield across the four screens?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:flask-outline
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Sample thresholds
    icon: mdi:tune
    color: indigo
    description: Narrows the assemblies by what each screen found in them
  grid_sections:
  - name: Samples at a glance
    icon: mdi:counter
    color: teal
    description: The median assembly, screen by screen
  - name: Screen composition
    icon: mdi:chart-bar
    color: violet
    description: What each assembly yielded, on a log axis, screen by screen
  - name: Sample comparison
    icon: mdi:chart-scatter-plot
    color: blue
    description: Resistance load against CAZyme capacity, one point per assembly
  components:
  - component_type: text
    order: 1
    body: >
      One row per assembly, counting what each screen found in it; a screen that did not
      run reads 0. The cards give the median assembly, the bars split each one by screen on
      a log axis, and a lasso on the scatter carries the picked assemblies to every tab.
    tag: fs-smp-intro
    index: smp-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    interactive_component_type: RangeSlider
    column_name: arg_hits
    column_type: int64
    display:
      icon_name: mdi:bacteria-outline
      custom_color: red
    section: Sample thresholds
    tag: fs-smp-filter-arg
    index: smp-arg-range
    title: ARG hits per assembly
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    interactive_component_type: RangeSlider
    column_name: amp_candidates
    column_type: int64
    display:
      icon_name: mdi:atom
      custom_color: grape
    section: Sample thresholds
    tag: fs-smp-filter-amp
    index: smp-amp-range
    title: AMP candidates per assembly
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    interactive_component_type: RangeSlider
    column_name: bgc_regions
    column_type: int64
    display:
      icon_name: mdi:graph-outline
      custom_color: cyan
    section: Sample thresholds
    tag: fs-smp-filter-bgc
    index: smp-bgc-range
    title: BGC regions per assembly
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: funcscan
    data_collection_tag: screening_summary
    interactive_component_type: RangeSlider
    column_name: cazymes
    column_type: int64
    display:
      icon_name: mdi:leaf
      custom_color: green
    section: Sample thresholds
    tag: fs-smp-filter-cazyme
    index: smp-cazyme-range
