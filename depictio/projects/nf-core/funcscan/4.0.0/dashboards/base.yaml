    data_collection_tag: dbcan_tool_overlap
    use: dbcan/cazyme_upset
    title: Annotation concordance
    description: Each bar is a set of annotation tools; its height is the genes only that set called.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 6}
  - component_type: table
    tag: caz-table-genes
