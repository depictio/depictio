    data_collection_tag: dbcan_overview
    use: dbcan/overview
    visu_type: bar
    mode: ui
    figure_params:
      x: sample
      y: genes
      color: cazy_class
      title: CAZyme genes per sample and class
    title: Class split per sample
    description: Stacked by CAZy class, so the bar height is the sample's total CAZyme count.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 8}

  - component_type: text
    tag: caz-sub-intro
    section: Substrates
    title: What the gene clusters target
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      run_dbCAN groups neighbouring CAZymes, transporters and regulators into
      gene clusters and matches them against dbCAN-PUL. A high bitscore is a
      close match to a characterised utilisation locus.
    workflow_tag: funcscan
    data_collection_tag: dbcan_substrates
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    tag: caz-fig-substrates
    index: caz-substrates
    section: Substrates
