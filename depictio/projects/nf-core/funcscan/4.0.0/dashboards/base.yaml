    description: One row per CAZyme gene cluster with a dbCAN-PUL match.
    title_size: h3
    layout: {x: 4, y: 1, w: 4, h: 6}

  - component_type: text
    tag: caz-conc-intro
    section: Tool concordance
    title: Where the annotators agree
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Genes in the three-tool intersection carry a recommended family; genes in
      a single-tool set are the ones to treat as provisional. dbCAN-sub is the
      most permissive of the three, so its private set is the largest.
    workflow_tag: funcscan
    data_collection_tag: dbcan_tool_overlap
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
