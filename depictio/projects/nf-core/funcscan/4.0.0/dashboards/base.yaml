    title_size: sm
    title_align: left
    title: Candidates
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: amp-card-prob
    section: AMPs at a glance
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    use: ampcombi/summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: prob_ampir
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#7048E8', title_color: '#7048E8', title_font_size: xl, value_font_size: xl}
    title_size: sm
