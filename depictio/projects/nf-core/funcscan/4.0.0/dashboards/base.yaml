    body: >
      [comBGC](https://nf-co.re/funcscan) merges the antiSMASH, DeepBGC and GECCO calls into
      one table of regions. On fragmented assemblies most regions run off the end of their
      contig, so the completeness split reads low by construction rather than by failure.
