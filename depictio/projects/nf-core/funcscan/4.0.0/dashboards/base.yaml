- title: Resistome
  subtitle: Which resistance genes do the assemblies carry, and which tools agree?
  tab_group: Antimicrobials
  tab_order: 1
  tab_icon: mdi:bacteria-outline
  tab_icon_color: red
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Resistance filters
    icon: mdi:filter-variant
    color: red
    description: Narrows the hits by tool, drug class, identity and tool agreement
  grid_sections:
  - name: Resistome at a glance
    icon: mdi:counter
    color: red
    description: How much resistance the ARG tools found together
  - name: Gene support
    icon: mdi:dna
    color: pink
    description: Which genes each assembly carries, and how many tools call them
  - name: Resistance hierarchy
    icon: mdi:chart-donut
    color: orange
    description: Tool to drug class to gene, each tool's class names kept apart
  - name: Tool concordance
    icon: mdi:set-merge
    color: grape
    description: Which contigs the ARG tools agree on
  - name: Drug classes per sample
    icon: mdi:shape-outline
    color: violet
    description: Hits per drug class and assembly, phenotypes rather than genes
    collapsed: true
  - name: Hit detail
    icon: mdi:file-document-outline
    color: gray
    description: Hit quality per tool, genes along their contig, and every hit
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [hAMRonization](https://github.com/pha4ge/hAMRonization) maps the hits of ABRicate,
      AMRFinderPlus, DeepARG, fARGene and RGI onto shared columns, but not their drug-class
      names, so each tool keeps its own branch. Read the gene support first, then where the
      tools agree, counted on the contig.
    tag: fs-arg-intro
    index: arg-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    interactive_component_type: MultiSelect
    column_name: tool
    column_type: object
    display:
      icon_name: mdi:tune
      custom_color: orange
    section: Resistance filters
    tag: fs-arg-filter-tool
    index: arg-tool
    title: ARG tool
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    interactive_component_type: MultiSelect
    column_name: drug_class
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: red
    section: Resistance filters
    tag: fs-arg-filter-class
    index: arg-class
    title: Drug class
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    interactive_component_type: RangeSlider
    column_name: identity_pct
    column_type: float64
    display:
      icon_name: mdi:ruler
      custom_color: pink
    section: Resistance filters
    tag: fs-arg-filter-identity
    index: arg-identity
    title: Sequence identity (%)
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: funcscan
    data_collection_tag: hamronization_gene_presence
    interactive_component_type: RangeSlider
    column_name: n_tools
    column_type: int64
    display:
      icon_name: mdi:scale-balance
      custom_color: yellow
    section: Resistance filters
    tag: fs-arg-filter-ntools
    index: arg-ntools
    title: Tools calling the gene
    layout: {x: 0, y: 9, w: 1, h: 3}
  - component_type: card
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    use: hamronization/report
    aggregation: sum
    column_name: hits
    column_type: int64
    secondary_layout: donut
    breakdown_col: tool
    display:
      icon_name: mdi:bacteria-outline
      icon_color: red
      caption: by ARG tool
    section: Resistome at a glance
    tag: fs-arg-card-hits
    index: arg-card-hits
    title: ARG hits
    description: Resistance-gene hits, all tools together. The ring shows each tool's share.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    use: hamronization/report
    aggregation: nunique
    column_name: gene_symbol
    column_type: object
    secondary_layout: top_n
    breakdown_col: tool
    top_n_count: 5
    display:
      icon_name: mdi:dna
      icon_color: orange
      caption: distinct names, the tools naming most
    section: Resistome at a glance
    tag: fs-arg-card-genes
    index: arg-card-genes
    title: Resistance genes
    description: Distinct gene names across the tools; each tool spells a gene its own way.
    layout: {x: 2, y: 0, w: 2, h: 2}
  # HMM-based tools (fARGene) report no identity or coverage: both cards read
  # the aligned hits only.
  - component_type: card
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    use: hamronization/report
    aggregation: median
    column_name: identity_pct
    column_type: float64
    filter_expr: "col('identity_pct').is_not_null()"
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: pink
      caption: aligned hits, median and spread
      decimals: 1
    section: Resistome at a glance
    tag: fs-arg-card-identity
    index: arg-card-identity
    title: Identity (%)
    description: Median sequence identity to the reference, over the hits an aligner reported.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    use: hamronization/report
    aggregation: median
    column_name: coverage_pct
    column_type: float64
    filter_expr: "col('coverage_pct').is_not_null()"
    secondary_layout: threshold
    threshold_value: 80
    threshold_direction: min
    threshold_warn: 60
    display:
      icon_name: mdi:check-decagram
      icon_color: grape
      caption: aligned hits; ABRicate's floor is 80
      decimals: 1
    section: Resistome at a glance
    tag: fs-arg-card-coverage
    index: arg-card-coverage
    title: Reference coverage (%)
    description: Median share of the reference gene a hit covers, over the aligned hits.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: funcscan
    data_collection_tag: hamronization_gene_presence
    use: hamronization/arg_dot_plot
    config:
      max_genes: 25
      gene_sort: frac
    section: Gene support
    tag: fs-arg-dotplot
    index: arg-dotplot
    title: Gene support per assembly
    description: The 25 genes whose identity differs most between assemblies, ordered by tool share; colour is the mean identity, size the share of tools.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    use: hamronization/arg_hierarchy
    section: Resistance hierarchy
    tag: fs-arg-sunburst
    index: arg-sunburst
    title: Resistome hierarchy
    description: Arc size is the hit count; the rings are tool, drug class and gene.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: funcscan
    data_collection_tag: hamronization_tool_overlap
    use: hamronization/arg_upset
    section: Tool concordance
    tag: fs-arg-upset
    index: arg-upset
    title: ARG tool concordance
    description: Each bar is a set of tools; its height is the contigs only that set reported.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: funcscan
    data_collection_tag: hamronization_class_matrix
    use: hamronization/arg_class_heatmap
    section: Drug classes per sample
    tag: fs-arg-class-heatmap
    index: arg-class-heatmap
    title: Drug class by assembly
    description: Hit counts per drug class and assembly; a class every assembly carries stands apart.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: figure
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    use: hamronization/report
    mode: code
    code_content: |-
      # Coverage against identity for every alignment-based hit: HMM screens
      # (fARGene) report neither. Coloured by the tool, or by Analysis mode's
      # groups when it has some.
      d = df.drop_nulls(['identity_pct', 'coverage_pct'])
      colour = depictio_group_kwargs or {'color': 'tool', 'color_discrete_map': depictio_category_colors.get('tool') or {}}
      fig = px.scatter(d.to_pandas(), x='coverage_pct', y='identity_pct', hover_name='gene_symbol', opacity=0.8, custom_data=['gene_symbol'], labels={'coverage_pct': 'Reference coverage (%)', 'identity_pct': 'Sequence identity (%)', 'tool': 'ARG tool'}, **colour)
      fig.update_layout(margin=dict(t=10))
    selection_enabled: true
    selection_column: gene_symbol
    section: Hit detail
    tag: fs-arg-hit-quality
    index: arg-hit-quality
    title: Hit quality per tool
    description: Coverage against identity for every aligned hit; a lasso picks genes.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    use: hamronization/arg_island_track
    config:
      class_col: drug_class
      label_col: gene_symbol
      show_labels: true
    section: Hit detail
    tag: fs-arg-island-track
    index: arg-island-track
    title: Resistance genes along their contig
    description: One lane per contig, one arrow per hit; genes packed head to tail form an island.
    layout: {x: 0, y: 4, w: 8, h: 6}
  - component_type: table
    workflow_tag: funcscan
    data_collection_tag: hamronization_report
    use: hamronization/report
    row_selection_enabled: true
    row_selection_column: gene_symbol
    section: Hit detail
    tag: fs-arg-table
    index: arg-table
    title: ARG hits
    layout: {x: 0, y: 10, w: 8, h: 6}
- title: AMPs
  subtitle: Which peptide candidates look antimicrobial, and how do they cluster?
  tab_group: Antimicrobials
  tab_order: 2
  tab_icon: mdi:atom
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Peptide filters
    icon: mdi:filter-variant
    color: grape
    description: Narrows the candidates by charge, probability and length
  grid_sections:
  - name: AMPs at a glance
    icon: mdi:counter
    color: grape
    description: How many candidates AMPcombi kept, and how confident they are
  - name: Property space
    icon: mdi:chart-scatter-plot
    color: violet
    description: Charge against hydrophobicity, then all six descriptors at once
  - name: Clusters
    icon: mdi:relation-many-to-many
    color: indigo
    description: Peptide families MMseqs2 built across the whole run
  - name: Candidate table
    icon: mdi:table
    color: gray
    description: One row per candidate, with each predictor's probability
    collapsed: true
  - name: Cluster table
    icon: mdi:table
    color: gray
    description: One row per peptide cluster, largest first
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [AMPcombi](https://github.com/Darcy220606/AMPcombi) merges the ampir, Macrel and AMPlify
      predictions, keeps the peptides above its probability cut-off and computes their
      physicochemistry. Pick a point on the scatter to read the candidate's record; cationic,
      hydrophobic peptides (upper right) are the classic membrane-active shape.
    tag: fs-amp-intro
    index: amp-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    interactive_component_type: MultiSelect
    column_name: charge_class
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: grape
    section: Peptide filters
    tag: fs-amp-filter-charge
    index: amp-charge
    title: Charge class
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    interactive_component_type: RangeSlider
    column_name: prob_max
    column_type: float64
    display:
      icon_name: mdi:check-decagram
      custom_color: violet
    section: Peptide filters
    tag: fs-amp-filter-prob
    index: amp-prob
    title: Best probability
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    interactive_component_type: RangeSlider
    column_name: aa_length
    column_type: int64
    display:
      icon_name: mdi:ruler
      custom_color: indigo
    section: Peptide filters
    tag: fs-amp-filter-length
    index: amp-length
    title: Peptide length (aa)
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    use: ampcombi/summary
    aggregation: count
    column_name: cds_id
    column_type: object
    secondary_layout: donut
    breakdown_col: charge_class
    display:
      icon_name: mdi:atom
      icon_color: grape
      caption: by charge class
    section: AMPs at a glance
    tag: fs-amp-card-candidates
    index: amp-card-candidates
    title: AMP candidates
    description: Peptide candidates AMPcombi kept. The ring splits them by charge at pH 7.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    use: ampcombi/summary
    aggregation: median
    column_name: prob_max
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.8
    threshold_direction: min
    threshold_warn: 0.6
    display:
      icon_name: mdi:check-decagram
      icon_color: violet
      caption: median; 0.8 marks high confidence
      decimals: 2
    section: AMPs at a glance
    tag: fs-amp-card-prob
    index: amp-card-prob
    title: Best probability
    description: Median of each candidate's highest probability across the predictors.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    use: ampcombi/summary
    aggregation: median
    column_name: aa_length
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: indigo
      caption: median, with its spread (aa)
      decimals: 0
    section: AMPs at a glance
    tag: fs-amp-card-length
    index: amp-card-length
    title: Peptide length
    description: Median candidate length in amino acids.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: funcscan
    data_collection_tag: ampcombi_clusters
    use: ampcombi/clusters
    aggregation: max
    column_name: members
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:relation-many-to-many
      icon_color: teal
      caption: sequences; the sizes of all clusters
      decimals: 0
    section: AMPs at a glance
    tag: fs-amp-card-cluster
    index: amp-card-cluster
    title: Largest cluster
    description: Sequences in the largest peptide cluster; the histogram shows every cluster's size.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    use: ampcombi/amp_property_scatter
    config:
      x_title: Hydrophobicity
      y_title: Isoelectric point (pI)
      reference_line: horizontal
      reference_value: 7.0
      opacity: 0.7
      legend_pos: bottom
      selection_enabled: true
      selection_column: cds_id
    section: Property space
    tag: fs-amp-property
    index: amp-property
    title: Charge against hydrophobicity
    description: One point per candidate, sized by length; above pI 7 a peptide is cationic.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: cds_id
      title_col: cds_id
      selection_source: any
      linked_component: fs-amp-property
      sections:
        Origin: [sample, contig, db_hit]
        Prediction: [prob_max, n_tools, prob_ampir, prob_macrel, prob_amplify]
        Physicochemistry: [aa_length, molecular_weight, isoelectric_point, hydrophobicity, charge_class]
      labels:
        prob_max: Best probability
        n_tools: Predictors agreeing
        aa_length: Length (aa)
        molecular_weight: Molecular weight (Da)
        isoelectric_point: Isoelectric point (pI)
        db_hit: Reference AMP hit
    section: Property space
    tag: fs-amp-record
    index: amp-record
