  - component_type: card
    tag: amp-card-length
    section: AMPs at a glance
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    use: ampcombi/summary
    aggregation: average
    column_name: aa_length
    column_type: int64
    secondary_layout: histogram
    display: {icon_name: 'mdi:ruler', icon_color: '#4C6EF5', title_color: '#4C6EF5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Peptide length
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: amp-card-confidence
    section: AMPs at a glance
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    use: ampcombi/summary
    aggregation: average
    column_name: prob_max
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.8
    threshold_direction: min
    threshold_warn: 0.6
    display: {icon_name: 'mdi:check-decagram', icon_color: '#0C8599', title_color: '#0C8599', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Best probability
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: text
    tag: amp-prop-intro
    section: Property space
    title: The AMP property plane
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Cationic, hydrophobic peptides are the classic membrane-active shape, so
      the upper right of the scatter is where the interesting candidates sit.
      The PCA beside it summarises the same six descriptors at once.
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    tag: amp-fig-property
    index: amp-property
    section: Property space
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    use: ampcombi/summary
    mode: code
    code_content: |
      # keep the physicochemistry complete so no point is silently dropped
      df_modified = df.drop_nulls(["hydrophobicity", "isoelectric_point", "prob_max"])

      fig = px.scatter(
          df_modified.to_pandas(),
          x="hydrophobicity",
          y="isoelectric_point",
          color="prob_max",
          size="aa_length",
          size_max=18,
          opacity=0.75,
          color_continuous_scale="Tealgrn",
          hover_name="cds_id",
          custom_data=["cds_id"],
      )
      fig.update_layout(
          xaxis_title="Hydrophobicity",
          yaxis_title="Isoelectric point (pI)",
          coloraxis_colorbar_title="Best probability",
          margin={"t": 24, "l": 56, "r": 16, "b": 48},
      )
    selection_enabled: true
    selection_column: cds_id
    title: Charge against hydrophobicity
    description: One point per candidate; colour is the best tool probability, size the peptide length.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 6}
  - component_type: advanced_viz
    tag: amp-av-embedding
    index: amp-embedding
    section: Property space
    workflow_tag: funcscan
    data_collection_tag: ampcombi_embedding
    use: ampcombi/amp_embedding
    config: {color_col: charge_class}
    title: Physicochemistry PCA
    description: Two components over weight, pI, hydrophobicity and the three structure fractions.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 6}
  - component_type: table
    tag: amp-table-candidates
    section: Property space
    workflow_tag: funcscan
    data_collection_tag: ampcombi_summary
    use: ampcombi/summary
    row_selection_enabled: true
    row_selection_column: cds_id
    title: AMP candidates
    description: Selecting rows narrows the property scatter to the same peptides.
    title_size: h3
    layout: {x: 0, y: 13, w: 8, h: 5}

  - component_type: text
    tag: amp-cluster-intro
    section: Clusters
    title: Peptides shared across samples
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      MMseqs2 clusters the candidates of the whole run, so a large cluster is a
      peptide family several assemblies carry. The sample shown is the one that
      contributed the representative sequence.
    workflow_tag: funcscan
    data_collection_tag: ampcombi_clusters
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    tag: amp-fig-cluster-sizes
    index: amp-cluster-sizes
    section: Clusters
    workflow_tag: funcscan
    data_collection_tag: ampcombi_clusters
    use: ampcombi/clusters
    visu_type: histogram
    mode: ui
    figure_params:
      x: members
      color: sample
      title: Cluster size distribution
    title: Cluster sizes
    description: How many sequences each cluster holds, split by the sample that contributed the representative.
    title_size: h3
    layout: {x: 0, y: 1, w: 4, h: 6}
  - component_type: table
    tag: amp-table-clusters
    section: Clusters
    workflow_tag: funcscan
    data_collection_tag: ampcombi_clusters
    use: ampcombi/clusters
    title: Peptide clusters
    description: One row per cluster, largest first.
    title_size: h3
    layout: {x: 4, y: 1, w: 4, h: 6}

