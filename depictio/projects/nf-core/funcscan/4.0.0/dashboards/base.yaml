      [AMPcombi](https://github.com/Darcy220606/AMPcombi) merges the per-tool
      predictions, keeps the peptides above the run's probability cut-off and
      annotates each with physicochemistry. In this run
      [ampir](https://github.com/Legana/ampir) carried the screen and
      [Macrel](https://github.com/BigDataBiology/macrel) agreed on almost
      nothing, so the best-probability column is effectively ampir's.
    workflow_tag: funcscan
