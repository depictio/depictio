  - component_type: interactive
    tag: bgc-filter-track-length
    index: bgc-track-length
    section: Region size
    group: Thresholds
    workflow_tag: funcscan
    data_collection_tag: combgc_region_track
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: length_kb
    column_type: float64
    display: {title_size: md, custom_color: '#1971C2', icon_name: 'mdi:ruler'}
    placement: left
    title: Region length on the map (kb)
    layout: {x: 0, y: 15, w: 1, h: 3}

  - component_type: text
    tag: bgc-intro
    section: BGCs at a glance
    title: Clusters on fragmented assemblies
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      comBGC merges the three callers into one table. On metagenome assemblies
      almost every region runs off the end of its contig, so the completeness
      card reads low by construction rather than by failure.
    workflow_tag: funcscan
    data_collection_tag: combgc_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: bgc-card-classes
    section: BGCs at a glance
    workflow_tag: funcscan
    data_collection_tag: combgc_summary
    use: combgc/summary
    aggregation: nunique
    column_name: product_class
    column_type: object
    secondary_layout: top_n
    breakdown_col: tool
    top_n_count: 3
    display: {icon_name: 'mdi:graph-outline', icon_color: '#0C8599', title_color: '#0C8599', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Product classes
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: bgc-card-contigs
    section: BGCs at a glance
    workflow_tag: funcscan
    data_collection_tag: combgc_summary
    use: combgc/summary
    aggregation: nunique
    column_name: contig
    column_type: object
    secondary_layout: composition
    breakdown_col: complete
    top_n_count: 3
    display: {icon_name: 'mdi:shape-outline', icon_color: '#1971C2', title_color: '#1971C2', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Contigs with a cluster
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: bgc-card-length
    section: BGCs at a glance
    workflow_tag: funcscan
    data_collection_tag: combgc_summary
    use: combgc/summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: length
    column_type: int64
    display: {icon_name: 'mdi:ruler', icon_color: '#3B5BDB', title_color: '#3B5BDB', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Region length
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: bgc-card-cds
    section: BGCs at a glance
    workflow_tag: funcscan
    data_collection_tag: combgc_summary
    use: combgc/summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: cds_count
    column_type: int64
    display: {icon_name: 'mdi:counter', icon_color: '#5F3DC4', title_color: '#5F3DC4', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: CDS per region
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: text
    tag: bgc-class-intro
    section: Product classes
    title: Predicted chemistry per sample
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each bar is one sample's predicted regions, stacked by product class. A
      tall single-class bar usually means one contig family repeated across
      the assembly rather than a rich biosynthetic repertoire.
    workflow_tag: funcscan
    data_collection_tag: combgc_summary
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    tag: bgc-fig-classes
    index: bgc-classes
    section: Product classes
    workflow_tag: funcscan
    data_collection_tag: combgc_summary
    use: combgc/summary
    visu_type: bar
    mode: ui
    figure_params:
      x: sample
      y: regions
      color: product_class
      title: BGC regions per sample and product class
    title: Regions per sample
    description: Stacked by predicted product class.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 6}
  - component_type: advanced_viz
    tag: bgc-av-sunburst
    index: bgc-sunburst
    section: Product classes
    workflow_tag: funcscan
    data_collection_tag: combgc_summary
    use: combgc/bgc_hierarchy
    title: Caller to product class
    description: Inner ring is the prediction tool, outer ring the product class it called.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 6}

  - component_type: text
    tag: bgc-map-intro
    section: Region maps
    title: Where the clusters sit
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The same regions as coordinates: one contig carrying two clusters head
      to tail is a different finding from two contigs carrying one each. Pick
      a contig or brush the genome axis to narrow the arrow lanes and the table
      (arrows run left to right because comBGC reports no strand).
    workflow_tag: funcscan
    data_collection_tag: combgc_region_track
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: bgc-av-genome-track
    index: bgc-genome-track
    section: Region maps
    workflow_tag: funcscan
    data_collection_tag: combgc_region_track
    use: combgc/bgc_genome_track
    config:
      controls_placement: header
      mark: rect
      score_title: Region length (kb)
      selection_enabled: true
      selection_column: contig
    title: Cluster footprints on the genome axis
    description: One rectangle per region, drawn from its start to its end on a locus axis that zooms. The height is the region length in kilobases and the colour the product class.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: advanced_viz
    tag: bgc-av-region-arrows
    index: bgc-region-arrows
    section: Region maps
    workflow_tag: funcscan
    data_collection_tag: combgc_region_track
    use: combgc/bgc_region_arrows
    config:
      show_labels: true
      arrow_height: 0.5
    title: Clusters along their contig
    description: One lane per contig and one arrow per predicted region, the same pattern the Resistome tab uses for resistance islands. Several arrows packed into one lane is a biosynthetic locus rather than a scattered repertoire.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 6}
  - component_type: table
    tag: bgc-table-track
    section: Region maps
    workflow_tag: funcscan
    data_collection_tag: combgc_region_track
    use: combgc/region_track
    row_selection_enabled: true
    row_selection_column: contig
    title: BGC region coordinates
    description: One row per predicted region with its coordinates; a brush on the genome axis narrows them, and selecting rows narrows the maps to the same contigs.
    title_size: h3
    layout: {x: 0, y: 15, w: 8, h: 5}

  - component_type: text
    tag: bgc-conc-intro
    section: Caller concordance
    title: Where the callers agree
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Agreement is counted on the contig: the callers draw region boundaries
      differently, so a coordinate join would report no overlap at all even
      where they mean the same cluster.
    workflow_tag: funcscan
    data_collection_tag: combgc_tool_overlap
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: bgc-av-upset
    index: bgc-upset
    section: Caller concordance
    workflow_tag: funcscan
    data_collection_tag: combgc_tool_overlap
    use: combgc/bgc_upset
    title: Caller concordance
    description: Each bar is a set of callers; its height is the contigs only that set reported.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 6}

# ============================================================================
# Tab 5: CAZymes
# ============================================================================
- title: CAZymes
  subtitle: Carbohydrate-active enzymes and the substrates their gene clusters target
  tab_order: 5
  tab_icon: mdi:leaf
  tab_icon_color: green
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  advanced_viz_controls: header

  filter_sections:
  - name: CAZyme scope
    icon: mdi:filter-variant
    color: green
    description: Which CAZy class and which substrate the tab is looking at
  - name: Call confidence
    icon: mdi:tune
    color: lime
    description: How many of the three annotation tools have to agree

  grid_sections:
  - name: CAZymes at a glance
    icon: mdi:counter
    color: green
    description: How much carbohydrate-degrading capacity run_dbCAN annotated
  - name: Family hierarchy
    icon: mdi:chart-donut
    color: lime
    description: Class to family to substrate, and the class split per sample
  - name: Substrates
    icon: mdi:shape-outline
    color: teal
    description: Which polysaccharides the CAZyme gene clusters target
  - name: Tool concordance
    icon: mdi:set-merge
    color: cyan
    description: HMMER, dbCAN-sub and DIAMOND on the same genes

  components:
  - component_type: interactive
    tag: caz-filter-class
    index: caz-class
    section: CAZyme scope
    group: Annotations
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    interactive_component_type: MultiSelect
    column_name: cazy_class
    column_type: object
    display: {title_size: md, custom_color: '#2F9E44', icon_name: 'mdi:shape-outline'}
    placement: left
    title: CAZy class
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: caz-filter-substrate
    index: caz-substrate
    section: CAZyme scope
    group: Annotations
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    interactive_component_type: MultiSelect
    column_name: substrate
    column_type: object
    display: {title_size: md, custom_color: '#2F9E44', icon_name: 'mdi:leaf'}
    placement: left
    title: Substrate
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: caz-filter-ntools
    index: caz-ntools
    section: Call confidence
    group: Thresholds
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: n_tools
    column_type: int64
    display: {title_size: md, custom_color: '#66A80F', icon_name: 'mdi:scale-balance'}
    placement: left
    title: Tools agreeing
    layout: {x: 0, y: 6, w: 1, h: 3}

  - component_type: text
    tag: caz-intro
    section: CAZymes at a glance
    title: Three annotators, one family call
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [run_dbCAN](https://github.com/bcb-unl/run_dbcan) annotates every
      predicted protein with [HMMER](https://github.com/EddyRivasLab/hmmer),
      dbCAN-sub and DIAMOND at once and recommends a family only where at
      least two agree. Genes called by a single tool keep that tool's family
      here, so the agreement card is the one to read first.
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: caz-card-contigs
    section: CAZymes at a glance
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    use: dbcan/overview
    aggregation: nunique
    column_name: contig
    column_type: object
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 4
    display: {icon_name: 'mdi:leaf', icon_color: '#2F9E44', title_color: '#2F9E44', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Contigs with a CAZyme
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: caz-card-families
    section: CAZymes at a glance
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    use: dbcan/overview
    aggregation: nunique
    column_name: family
    column_type: object
    secondary_layout: top_n
    breakdown_col: cazy_class
    top_n_count: 4
    display: {icon_name: 'mdi:shape-outline', icon_color: '#66A80F', title_color: '#66A80F', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: CAZy families
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: caz-card-substrates
    section: CAZymes at a glance
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    use: dbcan/overview
    aggregation: count
    column_name: gene_id
    column_type: object
    filter_expr: "col('substrate') != 'unassigned'"
    secondary_layout: top_n
    breakdown_col: substrate
    top_n_count: 4
    display: {icon_name: 'mdi:chart-donut', icon_color: '#099268', title_color: '#099268', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Genes with a substrate call
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: caz-card-ntools
    section: CAZymes at a glance
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    use: dbcan/overview
    aggregation: average
    column_name: n_tools
    column_type: int64
    secondary_layout: gauge
    coverage_max: 3
    display: {icon_name: 'mdi:scale-balance', icon_color: '#0C8599', title_color: '#0C8599', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Tools agreeing
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: text
    tag: caz-hier-intro
    section: Family hierarchy
    title: Class to family to substrate
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The rings read CAZy class, then family, then predicted substrate. Genes
      without a substrate call form the unassigned arc; set the substrate
      filter to read the called ones.
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: caz-av-sunburst
    index: caz-sunburst
    section: Family hierarchy
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    use: dbcan/cazyme_hierarchy
    title: CAZyme hierarchy
    description: Rings are CAZy class, family and predicted substrate; arc size is the gene count.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 8}
  - component_type: figure
    tag: caz-fig-classes
    index: caz-classes
    section: Family hierarchy
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    use: dbcan/overview
    visu_type: bar
    mode: ui
    figure_params:
      x: sample
      y: genes
      color: cazy_class
      title: CAZyme genes per sample and class
    title: Class split per sample
    description: Stacked by CAZy class, so the bar height is the sample's total CAZyme count.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 8}

  - component_type: text
    tag: caz-sub-intro
    section: Substrates
    title: What the gene clusters target
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      run_dbCAN groups neighbouring CAZymes, transporters and regulators into
      gene clusters and matches them against dbCAN-PUL. A high bitscore is a
      close match to a characterised utilisation locus.
    workflow_tag: funcscan
    data_collection_tag: dbcan_substrates
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    tag: caz-fig-substrates
    index: caz-substrates
    section: Substrates
    workflow_tag: funcscan
    data_collection_tag: dbcan_substrates
    use: dbcan/substrates
    visu_type: bar
    mode: ui
    figure_params:
      x: substrate
      y: clusters
      color: sample
      title: Predicted substrates across the run
    title: Substrates predicted
    description: How many gene clusters target each polysaccharide, split by sample.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 6}
  - component_type: table
    tag: caz-table-substrates
    section: Substrates
    workflow_tag: funcscan
    data_collection_tag: dbcan_substrates
    use: dbcan/substrates
    row_selection_enabled: true
    row_selection_column: cgc_id
    title: CGC substrate predictions
    description: One row per CAZyme gene cluster with a dbCAN-PUL match.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 6}

  - component_type: text
    tag: caz-conc-intro
    section: Tool concordance
    title: Where the annotators agree
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Genes in the three-tool intersection carry a recommended family; genes in
      a single-tool set are the ones to treat as provisional.
    workflow_tag: funcscan
    data_collection_tag: dbcan_tool_overlap
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: caz-av-upset
    index: caz-upset
    section: Tool concordance
    workflow_tag: funcscan
    data_collection_tag: dbcan_tool_overlap
    use: dbcan/cazyme_upset
    title: Annotation concordance
    description: Each bar is a set of annotation tools; its height is the genes only that set called.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 6}
  - component_type: table
    tag: caz-table-genes
    section: Tool concordance
    workflow_tag: funcscan
    data_collection_tag: dbcan_overview
    use: dbcan/overview
    row_selection_enabled: true
    row_selection_column: family
    title: CAZyme annotations
    description: One row per gene with the family each of the three tools called.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 5}
# ============================================================================
# Tab 6: Run report (what the pipeline actually ran)
# ============================================================================
- title: Run report
  subtitle: The tools and versions the run recorded, read out of the MultiQC report
  tab_order: 6
  tab_icon: mdi:file-document-outline
  tab_icon_color: gray
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  advanced_viz_controls: header

  filter_sections:
  - name: Version scope
    icon: mdi:filter-variant
    color: gray
    description: Which screen and which tool the tab is looking at

  grid_sections:
  - name: Tools and versions
    icon: mdi:file-document-outline
    color: blue
    description: Every process, the software it ran and the version it reported

  components:
  - component_type: interactive
    tag: run-filter-screen
    index: run-screen
    section: Version scope
    group: Versions
    workflow_tag: funcscan
    data_collection_tag: software_versions
    interactive_component_type: MultiSelect
    column_name: screen
    column_type: object
    display: {title_size: md, custom_color: '#868E96', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Screen
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: run-filter-tool
    index: run-tool
    section: Version scope
    group: Versions
    workflow_tag: funcscan
    data_collection_tag: software_versions
    interactive_component_type: MultiSelect
    column_name: tool
    column_type: object
    display: {title_size: md, custom_color: '#868E96', icon_name: 'mdi:tune'}
    placement: left
    title: Tool
    layout: {x: 0, y: 3, w: 1, h: 3}

  - component_type: text
    tag: run-versions-intro
    section: Tools and versions
    title: Which screen ran what
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per Nextflow process and tool, read from the MultiQC versions
      table. A screen that reports no tool here did not run, so this is the
      first place to look when a tab is empty.
    workflow_tag: funcscan
    data_collection_tag: software_versions
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    tag: run-fig-tools
    index: run-tools
    section: Tools and versions
    workflow_tag: funcscan
    data_collection_tag: software_versions
    use: funcscan/software_versions
    visu_type: bar
    mode: ui
    figure_params:
      x: screen
      y: tools
      color: tool
      title: Tools per screen
    title: Tools per screen
    description: How many version entries each screen contributed, stacked by tool.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 6}
  - component_type: table
    tag: run-table-versions
    section: Tools and versions
    workflow_tag: funcscan
    data_collection_tag: software_versions
    use: funcscan/software_versions
    row_selection_enabled: true
    row_selection_column: tool
    title: Software versions
    description: One row per process and tool, as the run recorded it.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 7}
