version: 1
# nf-core/genomeassembler 2.0.0. Every rule this file follows is written out in
# depictio/projects/nf-core/RULES.md; ampliseq/2.18.0 is the reference.
#
# The pipeline writes no MultiQC report, so there is no MultiQC tab. The unit
# of every tile is an assessed assembly, `<sample>_<stage>`: the raw assembly,
# each polishing step and each scaffolder of a sample. Funnel: the Overview,
# then Data & QC (the samples and the genome the reads describe), Assemblies
# (the best one, then what each stage adds) and Quality (contiguity, k-mer
# accuracy, gene completeness). The design is the samplesheet, read from
# METADATA_FILE; GROUP_COL (default `strategy`) is the column the group
# filters and colours read. Every QC collection is optional: a run that
# skipped a tool loses that tool's tiles, never the import.
main_dashboard:
  title: nf-core/genomeassembler
  subtitle: De novo assemblies scored for contiguity, k-mer accuracy and gene completeness
  project_tag: Genome Assembly QC
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab: figures, advanced viz and filter
  # chips all colour a value the same way.
  category_colors:
    '{GROUP_COL}': auto
    stage_class:
      assembly: '#1c7ed6'
      polish: '#f08c00'
      scaffold: '#2f9e44'
    # The stages the pipeline can assess, in the colour of their class family.
    stage:
      '*': auto
      assembly: '#1c7ed6'
      medaka: '#f59f00'
      dorado: '#e8590c'
      pilon: '#d6336c'
      links: '#37b24d'
      longstitch: '#0ca678'
      ragtag: '#74b816'
      yahs: '#1098ad'
      hic: '#7048e8'
    assembler_used:
      '*': auto
    busco_class:
      Complete single-copy: '#2f9e44'
      Complete duplicated: '#1c7ed6'
      Fragmented: '#f59f00'
      Missing: '#e03131'
    copy_class:
      Absent: '#868e96'
      1 copy: '#2f9e44'
      2 copies: '#1c7ed6'
      3 copies: '#7048e8'
      4 copies: '#ae3ec9'
      More than 4: '#e03131'
    qc_status:
      Assembly QC published: '#2f9e44'
      No assembly QC: '#adb5bd'
    error_free:
      'yes': '#2f9e44'
      'no': '#f08c00'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. Bound
  # to the samplesheet, the source of every sample link in template.yaml.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The samplesheet rows and how far each sample's assembly QC got
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Samples, below).
  - component_type: interactive
    workflow_tag: genomeassembler
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Key figures
    tag: ga-ov-kf-group
    index: ov-kf-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: genomeassembler
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: '{METADATA_ID_COL}'
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: ga-ov-kf-sample
    index: ov-kf-sample
    title: Sample ID
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: text
    title: nf-core/genomeassembler
    logo: https://raw.githubusercontent.com/nf-core/genomeassembler/master/docs/images/nf-core-genomeassembler_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/genomeassembler/master/docs/images/nf-core-genomeassembler_logo_dark.png
    order: 1
    body: >
      Genomes assembled from long reads, then polished and scaffolded, with every stage scored
      for contiguity, k-mer accuracy and gene completeness. [Run parameters](params:)
    tag: ga-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  # The study: who was assembled, from the samplesheet. Each line cites one column, so a
  # line goes with its column when the sheet has none.
  - component_type: text
    surface: card
    values:
      samples: {dc: samplesheet, column: sample, aggregation: nunique, format: integer}
      n_strat: {dc: samplesheet, column: strategy, aggregation: nunique, format: integer}
      top_strat: {dc: samplesheet, column: strategy, aggregation: top}
      n_asm: {dc: samplesheet, column: assembler, aggregation: nunique, format: integer}
      top_asm: {dc: samplesheet, column: assembler, aggregation: top}
    body: |
      ### The study
      - ![](icon:mdi:flask-outline) **Samples** {{samples}}, each assembled on its own row of the sheet
      - ![](icon:mdi:shape-outline) **Strategy** {{n_strat}} kinds (single, hybrid, scaffold), most often {{top_strat}}
      - ![](icon:mdi:family-tree) **Assemblers** {{n_asm}} named in the sheet, most often {{top_asm}}
      - ![](icon:mdi:file-table-outline) **Samplesheet** [one row per sample](section:Sample sheet), its path in [the run parameters](params:input)
      - ![](icon:mdi:palette-outline) **{GROUP_COL_DISPLAY}** {{legend:{GROUP_COL}}}
    tag: ga-ov-study
    index: ov-study
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash.
  - component_type: text
    surface: card
    values:
      asms: {dc: assemblies, column: assembly_id, aggregation: nunique, format: integer}
    body: |
      ### The run
      - ![](icon:mdi:source-branch) **Pipeline** nf-core/genomeassembler 2.0.0
      - ![](icon:mdi:family-tree) **Assemblies assessed** {{asms}}
      - ![](icon:mdi:shield-check-outline) **BUSCO lineage** {{param:busco_lineage}}
      - ![](icon:mdi:dna) **K-mer size** {{param:meryl_k}}
    tag: ga-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  - component_type: text
    surface: card
    accent: indigo
    values:
      n_sets: {dc: genomescope_summary, column: read_set, aggregation: nunique, format: integer}
      n_scored: {dc: merqury_assembly_qv, column: assembly_id, aggregation: nunique, format: integer}
    body: |
      ### Six steps from reads to a scored genome
      Each step names its settings and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:chart-bell-curve) **Profile** K-mer spectrum of {{n_sets}} read sets · [Settings](params:jellyfish) · [Genome profile](tab:Genome profile)
      2. ![](icon:mdi:family-tree) **Assemble** Long reads into contigs · [Settings](params:assembler) · [Best assembly](tab:Best assembly)
      3. ![](icon:mdi:auto-fix) **Polish** Consensus corrected · [Settings](params:polish) · [Stages](tab:Stages)
      4. ![](icon:mdi:vector-link) **Scaffold** Contigs ordered and joined · [Settings](params:scaffold) · [Stages](tab:Stages)
      5. ![](icon:mdi:ruler) **Measure** Lengths, N50 and QUAST · [Settings](params:quast) · [Contiguity](tab:Contiguity)
      6. ![](icon:mdi:check-decagram) **Score** Merqury QV and BUSCO genes of {{n_scored}} assemblies · [Settings](params:busco) · [Accuracy](tab:Accuracy)
      :::
    tag: ga-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/genomeassembler assembles each sample, polishes and scaffolds it, and scores every intermediate it writes: the raw assembly, each polishing step and each scaffolder. This page sums up one run; each tab behind it answers one question, in the order of the steps above.

      The sample filters in the left panel apply to every tab: narrow the samples once and the whole dashboard follows. A bar above a section narrows that section only.
    tag: ga-ov-about
    index: ov-about
    layout: {x: 0, y: 7, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. The design card reads the samplesheet; the other three read
  # `assemblies`, which every route writes (a QC tool the run skipped leaves
  # its column empty and its card prints a dash, the row keeps four cards).
  - component_type: card
    workflow_tag: genomeassembler
    data_collection_tag: samplesheet
    aggregation: nunique
    column_name: '{METADATA_ID_COL}'
    column_type: object
    secondary_layout: composition
    breakdown_col: '{GROUP_COL}'
    display:
      icon_name: mdi:flask-outline
      icon_color: teal
      caption: in the sample sheet, by {GROUP_COL_DISPLAY}
      link: tab:Samples
    section: Key figures
    tag: ga-ov-kf-samples
    index: ov-kf-samples
    title: Samples
    description: Samples in the sample sheet. The bar splits them by {GROUP_COL_DISPLAY}.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeassembler
    data_collection_tag: assemblies
    aggregation: median
    column_name: n50
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: blue
      caption: median per assembly, with its spread
      link: tab:Contiguity
      format: si
    section: Key figures
    tag: ga-ov-kf-n50
    index: ov-kf-n50
    title: N50 (bp)
    description: Median N50 of the assessed assemblies, from their sequence lengths. The box shows how it spreads.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeassembler
    data_collection_tag: assemblies
    aggregation: median
    column_name: qv
    column_type: float64
    secondary_layout: threshold
    threshold_value: 40
    threshold_direction: min
    display:
      icon_name: mdi:check-decagram
      icon_color: cyan
      caption: median; Q40 is the reference-genome floor
      link: tab:Accuracy
      decimals: 1
    section: Key figures
    tag: ga-ov-kf-qv
    index: ov-kf-qv
    title: Consensus QV
    description: >-
      Median Merqury QV of the assessed assemblies.

      Source: QV 40 is one error in 10 kb, the error rate of the Earth BioGenome Project reference standard 6.C.Q40, https://www.earthbiogenome.org/report-on-assembly-standards. It is a fixed reference, not read from the run.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeassembler
    data_collection_tag: assemblies
    aggregation: median
    column_name: busco_single
    column_type: float64
    filter_expr: "col('busco_single').is_not_null()"
    secondary_layout: threshold
    threshold_value: 90
    threshold_direction: min
    display:
      icon_name: mdi:shield-check-outline
      icon_color: violet
      caption: median, against the 90% single-copy target
      link: tab:Gene completeness
      decimals: 1
    section: Key figures
    tag: ga-ov-kf-busco
    index: ov-kf-busco
    title: BUSCO single-copy (%)
    description: >-
      Median share of the lineage's BUSCOs found complete and in a single copy, over the assemblies BUSCO scored. The strip counts the assemblies at 90% or above.

      Source: the 90% line is the Earth BioGenome Project reference-standard target of more than 90% single copy conserved genes (e.g. BUSCO) complete and single copy, https://www.earthbiogenome.org/report-on-assembly-standards. The standard calls it a useful target that needs to be interpreted in context; BUSCO itself sets no pass level. It is a fixed reference, not read from the run.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the group, then the stage class.
  - component_type: interactive
    workflow_tag: genomeassembler
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Findings
    tag: ga-ov-findings-group
    index: ov-findings-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: genomeassembler
    data_collection_tag: assemblies
    interactive_component_type: MultiSelect
    column_name: stage_class
    column_type: object
    display:
      icon_name: mdi:chart-timeline-variant
      custom_color: grape
      strip_label: Stage class
    section: Findings
    tag: ga-ov-findings-stage
    index: ov-findings-stage
    title: Stage class
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data.
  - component_type: text
    surface: card
    values:
      best_qv: {dc: merqury_assembly_qv, column: qv, aggregation: max, format: 'decimals:1'}
      qv_asm: {dc: merqury_assembly_qv, column: assembly_id, aggregation: top, weight: qv}
      n50_fold: {dc: stage_steps, column: n50_fold, aggregation: max, format: 'decimals:2'}
      best_n50: {dc: assemblies, column: n50, aggregation: max, format: si}
      n50_asm: {dc: assemblies, column: assembly_id, aggregation: top, weight: n50}
      busco: {dc: busco_batch_summary, column: complete_pct, aggregation: max, format: 'decimals:1'}
      busco_lin: {dc: busco_batch_summary, column: lineage, aggregation: top}
    body: |
      - **{{best_qv}}** consensus QV, the most accurate assembly ({{qv_asm}}) – Merqury, against the read k-mers [Accuracy](tab:Accuracy)
      - **{{n50_fold}}x** N50 of the best polishing or scaffolding step – over the sample's raw assembly [Stages](tab:Stages)
      - **{{best_n50}}** bp N50, the most contiguous assembly ({{n50_asm}}) – from its sequence lengths [Contiguity](tab:Contiguity)
      - **{{busco}}%** complete BUSCOs, the best assembly – lineage {{busco_lin}} [Gene completeness](tab:Gene completeness)
    section: Findings
    tag: ga-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per analysis question, in the order of the steps. Legends
  # that list routes or assemblies are hidden: the captions say what the
  # colour is.
  - component_type: highlight
    section: Findings
    source_tab: Best assembly
    source_component: ba-n50-qv
    caption: One point per assessed assembly, coloured by assembler; top right is long and accurate.
    tag: ga-ov-hl-n50-qv
    index: ov-hl-n50-qv
    layout: {x: 0, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Stages
    source_component: stg-qv-profile
    caption: Merqury QV along each sample's route, one line per route; polishing should lift it.
    hide_legend: true
    tag: ga-ov-hl-stages
    index: ov-hl-stages
    layout: {x: 4, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Contiguity
    source_component: ctg-nx-curve
    caption: Nx curve per assembly, one line each; a curve that stays high is held in long sequences.
    hide_legend: true
    tag: ga-ov-hl-nx
    index: ov-hl-nx
    layout: {x: 0, y: 6, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Gene completeness
    source_component: gc-busco-classes
    caption: BUSCO classes per assessed assembly, as a share of the lineage's genes.
    tag: ga-ov-hl-busco
    index: ov-hl-busco
    layout: {x: 4, y: 6, w: 4, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers. A tab the run does not have is left out.
  - component_type: text
    body: |
      ### Data & QC
      - [Samples](tab:Samples)
      - [Genome profile](tab:Genome profile)

      ### Assemblies
      - [Best assembly](tab:Best assembly)
      - [Stages](tab:Stages)

      ### Quality
      - [Contiguity](tab:Contiguity)
      - [Accuracy](tab:Accuracy)
      - [Gene completeness](tab:Gene completeness)
    section: How to read this dashboard
    tag: ga-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the group first.
  - component_type: interactive
    workflow_tag: genomeassembler
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: ga-filter-group
    index: sample-filters-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: genomeassembler
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: '{METADATA_ID_COL}'
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: ga-filter-sample
    index: sample-filters-sample
    title: Sample ID
    layout: {x: 0, y: 2, w: 1, h: 3}
  # The samplesheet columns with how far each sample's assembly QC got; row
  # selection on the sample carries the pick to every tab.
  - component_type: table
    workflow_tag: genomeassembler
    data_collection_tag: sample_status
    row_selection_enabled: true
    row_selection_column: sample
    section: Sample sheet
    tag: ga-sample-sheet
    index: sample-sheet
    title: Samples and their assembly QC
    description: >-
      One row per samplesheet sample with its design (assembler and scaffolders), how many of its stages
      were assessed, its best QV, best BUSCO complete share and best N50 over those stages, and whether
      any assembly QC was published for it.

      How to read: a row marked as having no assembly QC never reached the assessment, so it is missing
      from every figure of the other tabs. Compare the best values across samples to see which assemblies
      to open first. Tick rows to narrow every tab to those samples.
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
- title: Samples
  subtitle: Which samples reached assembly QC, and at which stages?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: mdi:flask-outline
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Assembly filters
    icon: mdi:filter-variant
    color: teal
    description: Narrows the samples by QC status and the assemblies by stage and assembler
  grid_sections:
  - name: Samples at a glance
    icon: mdi:counter
    color: teal
    description: How far each sample got, and what the QC tools assessed
  - name: Assessed stages
    icon: mdi:chart-bar
    color: grape
    description: The stages assessed per sample, from raw assembly to scaffold
  components:
  - component_type: text
    order: 1
    body: >
      The QC tools name every output after the assessed assembly, `<sample>_<stage>`, so
      each sample counts its raw assembly, polishing steps and scaffolders. A sample marked
      No assembly QC reached no QC tool and appears on no other tab; the sample sheet below
      lists it.
    tag: ga-smp-intro
    index: smp-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: genomeassembler
    data_collection_tag: sample_status
    interactive_component_type: MultiSelect
    column_name: qc_status
    column_type: object
    display:
      icon_name: mdi:check-decagram
      custom_color: green
    section: Assembly filters
    tag: ga-smp-filter-status
    index: smp-status
    title: QC status
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: genomeassembler
    data_collection_tag: assemblies
    interactive_component_type: MultiSelect
    column_name: stage_class
    column_type: object
    display:
      icon_name: mdi:chart-timeline-variant
      custom_color: grape
    section: Assembly filters
    tag: ga-smp-filter-stage-class
    index: smp-stage-class
    title: Stage class
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: genomeassembler
    data_collection_tag: assemblies
    interactive_component_type: MultiSelect
    column_name: assembler_used
    column_type: object
    display:
      icon_name: mdi:family-tree
      custom_color: orange
    section: Assembly filters
    tag: ga-smp-filter-assembler
    index: smp-assembler
    title: Assembler
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: genomeassembler
    data_collection_tag: sample_status
    aggregation: count
    column_name: sample
    column_type: object
    secondary_layout: donut
    breakdown_col: qc_status
    display:
      icon_name: mdi:flask-outline
      icon_color: teal
      caption: by assembly QC status
    section: Samples at a glance
    tag: ga-smp-card-samples
    index: smp-card-samples
    title: Samples
    description: Samplesheet samples. The ring splits those a QC tool reported on from the rest.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeassembler
    data_collection_tag: assemblies
    aggregation: count
    column_name: assembly_id
    column_type: object
    secondary_layout: composition
    breakdown_col: stage_class
    display:
      icon_name: mdi:family-tree
      icon_color: indigo
      caption: by stage class
    section: Samples at a glance
    tag: ga-smp-card-assemblies
    index: smp-card-assemblies
    title: Assemblies assessed
    description: Assessed assemblies, one per sample and stage. The bar splits them by stage class.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeassembler
    data_collection_tag: assemblies
    aggregation: nunique
    column_name: stage
    column_type: object
    secondary_layout: top_n
    breakdown_col: stage_class
    top_n_count: 3
    display:
      icon_name: mdi:chart-timeline-variant
      icon_color: grape
      caption: distinct stages, by stage class
    section: Samples at a glance
    tag: ga-smp-card-stages
    index: smp-card-stages
    title: Stages assessed
    description: Distinct stages the QC tools reached, ranked by stage class.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeassembler
    data_collection_tag: assemblies
    aggregation: average
    column_name: n_qc_tools
    column_type: int64
    secondary_layout: gauge
    coverage_max: 4
    display:
      icon_name: mdi:check-all
      icon_color: orange
      caption: mean per assembly, of four tools
      decimals: 1
    section: Samples at a glance
    tag: ga-smp-card-tools
    index: smp-card-tools
    title: QC tools per assembly
    description: How many of samtools, Merqury, BUSCO and QUAST reported on an assembly, on average.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: genomeassembler
    data_collection_tag: assemblies
    mode: code
    code_content: |-
      # One block per assessed assembly, stacked by stage; a sample holds a few
      # stages, so the count axis steps by one. The colour belongs to the stage
      # (category_colors), so Analysis mode's groups take the facet axis.
      grp_col = depictio_group_by[0] if depictio_group_by else None
      fig = px.histogram(df.to_pandas(), x='sample', color='stage', facet_col=grp_col, color_discrete_map=depictio_category_colors.get('stage') or {}, labels={'sample': 'Sample', 'stage': 'Stage'})
      fig.update_yaxes(title_text='', dtick=1)
      fig.update_yaxes(title_text='Assessed assemblies', col=1)
      fig.update_layout(margin=dict(t=10))
      if grp_col:
          fig.update_xaxes(matches=None, showticklabels=True, title_text='')
          fig.for_each_annotation(lambda a: a.update(text=a.text.split('=')[-1]))
    section: Assessed stages
    tag: ga-smp-stages
    index: smp-stages
    title: Assessed stages per sample
    description: >-
      Which stages of each sample were assessed? One block per assessed assembly, stacked per sample and
      coloured by stage, so the height of a column is the number of assessed assemblies of that sample.

      How to read: a sample with a single block has only its raw assembly assessed, so it has no polishing
      or scaffolding step to compare in [Stages](tab:Stages). A tall column is a sample assessed after
      each polisher and scaffolder.

      Source: nf-core/genomeassembler output documentation, the QC outputs are named per assembly stage as
      `<sample>_<stage>`, https://nf-co.re/genomeassembler/2.0.0/docs/output
    layout: {x: 0, y: 0, w: 8, h: 4}
- title: Genome profile
  subtitle: What genome do the reads describe, before any assembly?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:chart-bell-curve
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Read set filters
    icon: mdi:filter-variant
    color: orange
    description: Narrows the genome profile and the spectrum to some read sets
  grid_sections:
  - name: Genome profile at a glance
    icon: mdi:counter
    color: orange
    description: GenomeScope's estimates over the read sets in view
  - name: K-mer spectrum
    icon: mdi:chart-line
    color: yellow
    description: The read k-mer histogram GenomeScope fits, one line per read set
  - name: Genome profile table
    icon: mdi:table
    color: gray
    description: Every GenomeScope range per read set
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [GenomeScope](https://github.com/tbenavi1/genomescope2.0) fits the read k-mer spectrum
      before any assembly, and its haploid length is the size an assembly should approach.
      A high heterozygosity warns of duplicated haplotigs; a poor model fit means the other
      estimates are not to be trusted.
    tag: ga-gp-intro
    index: gp-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: genomeassembler
    data_collection_tag: genomescope_summary
    interactive_component_type: MultiSelect
    column_name: read_set
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: yellow
    section: Read set filters
    tag: ga-gp-filter-readset
    index: gp-read-set
    title: Read set
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: card
    workflow_tag: genomeassembler
    data_collection_tag: genomescope_summary
    use: genomescope/summary
    aggregation: median
    column_name: haploid_length_max
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: orange
      caption: haploid, median over read sets
      decimals: 0
    section: Genome profile at a glance
    tag: ga-gp-card-size
    index: gp-card-size
    title: Genome size (bp)
    description: GenomeScope's haploid genome length, upper bound, the size an assembly should approach.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeassembler
    data_collection_tag: genomescope_summary
    use: genomescope/summary
    aggregation: median
    column_name: heterozygosity_max
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:dna
      icon_color: red
      caption: median, with its distribution
      decimals: 2
    section: Genome profile at a glance
    tag: ga-gp-card-het
    index: gp-card-het
    title: Heterozygosity (%)
    description: GenomeScope's heterozygosity, upper bound; a high value warns of duplicated haplotigs.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeassembler
    data_collection_tag: genomescope_summary
    use: genomescope/summary
    aggregation: median
    column_name: repeat_fraction
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:set-merge
      icon_color: yellow
      caption: median, with its spread
      decimals: 1
    section: Genome profile at a glance
    tag: ga-gp-card-repeats
    index: gp-card-repeats
    title: Repeat share (%)
    description: Repeat length over haploid length, the share an assembler has to resolve.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeassembler
    data_collection_tag: genomescope_summary
    use: genomescope/summary
    aggregation: min
    column_name: model_fit_max
    column_type: float64
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:check-decagram
      icon_color: green
      caption: the lowest over read sets, of 100%
      decimals: 1
    section: Genome profile at a glance
    tag: ga-gp-card-fit
    index: gp-card-fit
    title: Model fit (%)
    description: How well GenomeScope's model fits the worst read set; a poor fit discredits the estimates.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: genomeassembler
    data_collection_tag: jellyfish_histogram
    use: jellyfish/kmer_spectrum
    config:
      log_y: true
      x_title: K-mer multiplicity
      y_title: Distinct k-mers
      legend_pos: bottom
    section: K-mer spectrum
    tag: ga-gp-spectrum
    index: gp-spectrum
    title: Read k-mer spectrum
    description: >-
      What does the read k-mer spectrum say about depth, heterozygosity and errors? One line per read set:
      how many distinct k-mers were seen at each multiplicity, on a logarithmic count axis, as counted by
      Jellyfish.

      How to read: the main peak sits at the k-mer depth of the sequencing. A second peak at about half
      that depth is the heterozygous share of the genome, and a long right tail is repeats. A tall spike
      at the far left is sequencing errors, and a curve with no clear peak gives GenomeScope little to
      fit.

      Source: GenomeScope 2.0 fits this spectrum, the heterozygous peak sits at half the homozygous one,
      Ranallo-Benavidez, Jaron and Schatz 2020, Nature Communications 11:1432,
      doi:10.1038/s41467-020-14998-3

      Note: the recipe keeps the curve up to four times the main peak, a display choice and not a QC
      cut-off, so the repeat tail is cut. No reference line is drawn.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: genomeassembler
    data_collection_tag: genomescope_summary
    use: genomescope/summary
    row_selection_enabled: true
    row_selection_column: read_set
    section: Genome profile table
    tag: ga-gp-table
    index: gp-table
    title: GenomeScope estimates
    description: >-
      GenomeScope's fit to the read k-mer spectrum: the haploid genome length, the share of repeats, the
      heterozygosity and the read error rate, each as a minimum to maximum range, with the model fit.

      How to read: the haploid length is the size an assembly should approach. A high heterozygosity warns
      that a collapsed assembly will carry duplicated haplotigs, and a poor model fit means the other
      estimates should not be trusted. Tick a row to narrow the tab to that read set.

      Source: GenomeScope 2.0, Ranallo-Benavidez, Jaron and Schatz 2020, Nature Communications 11:1432,
      doi:10.1038/s41467-020-14998-3

      Note: GenomeScope reports the model fit as a number, and this dashboard sets no pass level for it.
    layout: {x: 0, y: 0, w: 8, h: 6}
