      viz_kind: profile
      series_col: route
      x_col: stage_rank
      y_col: n50_fold
      x_title: 'Stage: 0 raw, 1-2 polish, 3 scaffold'
      y_title: N50 relative to the raw assembly
      legend_pos: bottom
      selection_enabled: true
      selection_column: route
    section: N50 along each route
    tag: ga-stg-n50
    index: stg-n50-profile
    title: N50 gain along each route
    description: >-
      What does each stage do to the contiguity of an assembly? One line per route, a sample followed to
      its final stage, with the N50 of every step divided by the N50 of its raw assembly: 0 for the raw
      assembly, 1 and 2 for polishing, 3 for the scaffold.

      How to read: polishing rewrites bases and should leave the value at one. Scaffolding joins sequences
      and lifts it above one, and the higher the value, the more it joined. A value below one means a step
      split sequences.

      Note: no line marks one, but every route starts at one by construction, since the raw assembly is
      the reference of its own route.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: genomeassembler
    data_collection_tag: assemblies
    viz_kind: group_compare
    config:
      viz_kind: group_compare
      index_col: assembly_id
      group_col: stage_class
      test: wilcoxon
      min_observations: 2
      default_group_a: assembly
      default_group_b: scaffold
    section: Stage comparison
    tag: ga-stg-compare
    index: stg-compare
    title: Raw assemblies against scaffolds
    description: >-
      Which QC metrics differ between two stage classes? Every metric of the assessed assemblies is
      compared between two groups, here the raw assemblies and the scaffolds, with a rank-sum test per
      metric, and shown as a volcano of the effect size against the significance.

      How to read: points beyond the effect-size lines and above the significance line are metrics that
      differ between the two classes, for example N50 rising after scaffolding. With only a few assemblies
      per group no test can reach a small p-value, so read the result as a screen and open the table for
      the values. Pick the two groups with the controls of the tile.

      Lines and annotations: the horizontal line is the significance level of 0.05 on the
      Benjamini-Hochberg adjusted p-value, and the two vertical lines are an absolute log2 fold change of
      1. Both are the tile's defaults for any comparison, not cut-offs validated for assembly QC. The fold
      change is the log2 ratio of the two group means with 1 added to each, on every metric's own scale.

      Source: Benjamini and Hochberg 1995, J R Stat Soc B 57(1):289-300,
      doi:10.1111/j.2517-6161.1995.tb02031.x

      Note: a group needs at least two assemblies for the test to run.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: genomeassembler
    data_collection_tag: stage_steps
    row_selection_enabled: true
    row_selection_column: route
    page_size: 25
    section: Route table
    tag: ga-stg-table
    index: stg-table
    title: Stage routes
    description: >-
      One row per step of every route, with the metrics that change along it (QV, N50, total length, k-mer
      completeness, BUSCO complete) and their change from the raw assembly of the sample.

      How to read: sort on the QV gain or the N50 fold to find the step that changed an assembly most. A
      scaffolder alternative gets its own route, so two scaffolders of one sample are two rows at the last
      step. Tick rows to pick routes.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Contiguity
  subtitle: How long and how fragmented is each assembly?
  tab_group: Quality
  tab_order: 1
  tab_icon: mdi:ruler
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Contiguity filters
    icon: mdi:filter-variant
    color: blue
    description: Narrows the assemblies and their Nx curves by stage and N50
  grid_sections:
  - name: Contiguity at a glance
    icon: mdi:counter
    color: blue
    description: Length, N50, L50 and fragmentation over the assemblies in view
  - name: Nx curves
    icon: mdi:chart-line
    color: blue
    description: Sequence length against the share of the assembly it completes
  - name: QUAST
    icon: mdi:chart-scatter-plot
    color: cyan
    description: QUAST's reference-free view of the assemblies it scored
  - name: QUAST against a reference
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Reference covered against misassemblies, when the run had a reference
    collapsed: true
  - name: QUAST tables
    icon: mdi:table
    color: gray
    description: QUAST's reference-free and reference-based rows
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      Contiguity comes from the sequence lengths samtools lists for every assessed assembly;
      [QUAST](https://github.com/ablab/quast) adds its own view of the assemblies the run sent
      to it. N50 is the point at 50% of the Nx curves: a curve that stays high far to the
      right holds its length in few long sequences.
    tag: ga-ctg-intro
    index: ctg-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: genomeassembler
    data_collection_tag: assemblies
    interactive_component_type: MultiSelect
    column_name: stage
    column_type: object
    display:
      icon_name: mdi:chart-timeline-variant
      custom_color: indigo
    section: Contiguity filters
    tag: ga-ctg-filter-stage
    index: ctg-stage
    title: Stage
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: genomeassembler
    data_collection_tag: assemblies
    interactive_component_type: RangeSlider
    column_name: n50
    column_type: int64
    display:
      icon_name: mdi:ruler
      custom_color: blue
    section: Contiguity filters
    tag: ga-ctg-filter-n50
    index: ctg-n50-range
    title: N50 (bp)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: genomeassembler
    data_collection_tag: assemblies
    aggregation: median
    column_name: total_length
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: blue
      caption: median, with its spread
      decimals: 0
    section: Contiguity at a glance
    tag: ga-ctg-card-length
    index: ctg-card-length
    title: Assembled length (bp)
    description: Median total length of the assessed assemblies.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeassembler
    data_collection_tag: assemblies
    aggregation: median
    column_name: n50
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-bar
      icon_color: cyan
      caption: median, with its distribution
      decimals: 0
    section: Contiguity at a glance
    tag: ga-ctg-card-n50
    index: ctg-card-n50
    title: N50 (bp)
    description: Median N50, the sequence length at which half the assembly is reached.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeassembler
    data_collection_tag: assemblies
    aggregation: median
    column_name: l50
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:counter
      icon_color: indigo
      caption: sequences holding half, median and spread
      decimals: 0
    section: Contiguity at a glance
    tag: ga-ctg-card-l50
    index: ctg-card-l50
    title: L50
    description: Median number of sequences that together hold half the assembly.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeassembler
    data_collection_tag: assemblies
    aggregation: median
    column_name: n_sequences
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:dna
      icon_color: violet
      caption: per assembly, with its distribution
      decimals: 0
    section: Contiguity at a glance
    tag: ga-ctg-card-sequences
    index: ctg-card-sequences
    title: Sequences
    description: Median number of contigs or scaffolds per assessed assembly.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: genomeassembler
    data_collection_tag: nx_curve
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: assembly_id
      x_col: nx
      y_col: sequence_length
      log_y: true
      reference_x: 50
      reference_label: N50
      x_title: Share of the assembly (percent)
      y_title: Sequence length (bp)
      legend_pos: bottom
      selection_enabled: true
      selection_column: assembly_id
    section: Nx curves
    tag: ga-ctg-nx
    index: ctg-nx-curve
    title: Nx curve per assembly
    description: >-
      How is the assembly length spread over its sequences? One line per assembly: for every x from 0 to
      100, the length of the sequence at which the longest sequences together reach x percent of the
      assembly, on a logarithmic length axis.

      How to read: a curve that stays high and runs far right is an assembly held in a few long sequences.
      A curve that drops at once is a drift of short ones. Scaffolding moves the curve right, polishing
      leaves it where it was, and two assemblers are best compared along the whole curve and not at its
      midpoint.

      Lines and annotations: the vertical line at 50 percent, labelled N50, marks where the curve is read
      for the N50, the length of the sequence such that sequences at least that long cover half of the
      assembly. It is the definition of N50, not a cut-off.

      Source: QUAST, definition of N50, https://github.com/ablab/quast
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: genomeassembler
    data_collection_tag: quast_assembly_report
    use: quast/n50_vs_length
    config: {x_title: Assembled length (bp), y_title: N50 (bp), log_y: true, selection_enabled: true,
      selection_column: assembly_id}
    section: QUAST
    tag: ga-ctg-quast-n50
    index: ctg-quast-n50
    title: N50 against assembled length
    description: >-
      How contiguous is each assembly for its size? One point per QUAST report: its assembled length
      against its N50 on a logarithmic axis, sized by the number of contigs.

      How to read: up and to the right is a large assembly held in long contigs. Two points of similar
      length with very different N50 are the same amount of sequence cut in different ways, and a large
      point low on the axis is a fragmented one. Click a point to read it in the table.

      Source: QUAST, definition of N50, https://github.com/ablab/quast
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: genomeassembler
    data_collection_tag: quast_length_ladder
    use: quast/cumulative_length
    config: {x_title: Minimum contig length (bp), y_title: Bases in contigs at least that long, legend_pos: bottom}
    section: QUAST
    tag: ga-ctg-quast-ladder
    index: ctg-quast-ladder
    title: Length kept above each contig length
    description: >-
      How much of each assembly sits in long contigs? One line per assembly: the bases held in contigs at
      least as long as each minimum length.

      How to read: a curve that holds its height out to long minimum lengths is an assembly whose bases
      are in long contigs. A curve that falls early is a drift of short fragments. The gap between two
      assemblies at a given length is the sequence one keeps and the other leaves in short pieces.

      Note: the x positions are the contig-length thresholds QUAST was run with, so the curve joins a few
      measured points and not a continuous Nx curve. No reference line is drawn.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: genomeassembler
    data_collection_tag: quast_reference_report
    use: quast/fraction_vs_misassemblies
    config: {x_title: Reference covered (percent), y_title: Misassemblies, selection_enabled: true,
      selection_column: assembly_id}
    section: QUAST against a reference
    tag: ga-ctg-quast-ref
    index: ctg-quast-ref
    title: Reference coverage against misassemblies
    description: >-
      Does the assembly cover a reference without breaking it? One point per QUAST report against a
      reference: the percent of the reference covered against the number of misassemblies, sized by NGA50.

      How to read: the bottom right covers the reference with few breaks, and a large point there is also
      contiguous after cutting at the breaks. A point high on the axis has joins the reference does not
      support. An NGA50 far below the N50 of the same assembly means the contiguity was bought with such
      joins.

      Source: QUAST, genome fraction and NGA50 are computed against the reference,
      https://github.com/ablab/quast

      Note: the figure exists only when the run gave QUAST a reference, and it is as good as that
      reference is for the sample.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: genomeassembler
    data_collection_tag: quast_assembly_report
    use: quast/assembly_report
    row_selection_enabled: true
    row_selection_column: assembly_id
    section: QUAST tables
    tag: ga-ctg-quast-table
    index: ctg-quast-table
    title: QUAST reference-free statistics
    description: >-
      QUAST's reference-free statistics per assembly: contig counts, N50, assembled length, largest contig
      and GC content.

      How to read: sort on N50 to rank assemblies by contiguity, and compare the assembled length with the
      GenomeScope estimate to see whether the assembly is the size expected. Tick rows to pick assemblies.

      Source: QUAST, definition of N50, https://github.com/ablab/quast
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: genomeassembler
    data_collection_tag: quast_reference_report
    use: quast/reference_report
    row_selection_enabled: true
    row_selection_column: assembly_id
    section: QUAST tables
    tag: ga-ctg-quast-ref-table
    index: ctg-quast-ref-table
    title: QUAST against the reference
    description: >-
      QUAST's figures against a reference per assembly: the share of the reference covered, the
      misassemblies, the mismatch and indel rates and the NGA50.

      How to read: a high genome fraction with few misassemblies and an NGA50 close to the N50 is an
      assembly that agrees with the reference. Tick rows to pick assemblies. The table is filled only when
      the run gave QUAST a reference.

      Source: QUAST, NGA50 is the N50 of the blocks left after cutting at misassemblies,
      https://github.com/ablab/quast
    layout: {x: 0, y: 6, w: 8, h: 6}
- title: Accuracy
  subtitle: How accurate is each assembly against the read k-mers?
  tab_group: Quality
  tab_order: 2
  tab_icon: mdi:check-decagram
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Accuracy filters
    icon: mdi:filter-variant
    color: teal
    description: Narrows the assemblies by QV and the sequences by error k-mers
  grid_sections:
  - name: Accuracy at a glance
    icon: mdi:counter
    color: teal
    description: QV, k-mer completeness and error k-mers over the assemblies in view
  - name: QV and completeness
    icon: mdi:chart-scatter-plot
    color: teal
    description: Consensus QV against k-mer completeness, one point per assembly
  - name: Copy number
    icon: mdi:chart-bar
    color: cyan
    description: How many copies of each solid read k-mer the assembly holds
  - name: Per-sequence errors
    icon: mdi:chart-scatter-plot
    color: blue
    description: Where the error k-mers sit, sequence by sequence
    collapsed: true
  - name: Accuracy table
    icon: mdi:table
    color: gray
    description: QV, error rate and k-mer completeness per assessed assembly
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [Merqury](https://github.com/marbl/merqury) takes the read k-mers as the truth set:
      assembly k-mers missing from the reads are errors (the QV), solid read k-mers missing
      from the assembly are lost sequence. The copy-number bars show lost, collapsed and
      duplicated sequence.
    tag: ga-acc-intro
    index: acc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: genomeassembler
    data_collection_tag: merqury_assembly_qv
    interactive_component_type: RangeSlider
    column_name: qv
    column_type: float64
    display:
      icon_name: mdi:check-decagram
      custom_color: cyan
    section: Accuracy filters
    tag: ga-acc-filter-qv
    index: acc-qv-range
    title: Consensus QV
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: genomeassembler
    data_collection_tag: merqury_sequence_qv
    interactive_component_type: MultiSelect
    column_name: error_free
    column_type: object
    display:
      icon_name: mdi:check-all
      custom_color: green
    section: Accuracy filters
    tag: ga-acc-filter-error-free
    index: acc-error-free
    title: Error-free sequence
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: genomeassembler
    data_collection_tag: merqury_assembly_qv
    use: merqury/assembly_qv
    aggregation: median
    column_name: qv
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:check-decagram
      icon_color: teal
      caption: median, with its spread
      decimals: 1
    section: Accuracy at a glance
    tag: ga-acc-card-qv
    index: acc-card-qv
    title: Consensus QV
    description: Median Merqury QV; QV 40 is one error in 10 kb.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeassembler
    data_collection_tag: merqury_assembly_qv
    use: merqury/assembly_qv
    aggregation: median
    column_name: kmer_completeness
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:check-all
      icon_color: cyan
      caption: median, with its distribution
      decimals: 1
    section: Accuracy at a glance
    tag: ga-acc-card-completeness
    index: acc-card-completeness
    title: K-mer completeness (%)
    description: Median share of the solid read k-mers found in the assembly.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeassembler
    data_collection_tag: merqury_sequence_qv
    use: merqury/sequence_qv
    aggregation: count
    column_name: sequence
    column_type: object
    secondary_layout: donut
    breakdown_col: error_free
    display:
      icon_name: mdi:dna
      icon_color: green
      caption: sequences, error-free or not
    section: Accuracy at a glance
    tag: ga-acc-card-sequences
    index: acc-card-sequences
    title: Sequences assessed
    description: Contigs and scaffolds Merqury scored. The ring splits those with no error k-mer from the rest.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeassembler
    data_collection_tag: merqury_assembly_qv
    use: merqury/assembly_qv
    aggregation: median
    column_name: asm_only_kmers
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:alert-outline
      icon_color: orange
      caption: median per assembly, with its spread
      decimals: 0
    section: Accuracy at a glance
    tag: ga-acc-card-error-kmers
    index: acc-card-error-kmers
    title: Error k-mers
    description: Assembly k-mers absent from the reads, the errors the QV is computed from.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: genomeassembler
    data_collection_tag: merqury_assembly_qv
    use: merqury/qv_vs_completeness
    config: {x_title: K-mer completeness (percent), y_title: Consensus QV, legend_pos: none, reference_line: horizontal,
      reference_value: 40, reference_highlight: above, selection_enabled: true, selection_column: assembly_id}
    section: QV and completeness
    tag: ga-acc-qv
    index: acc-qv-completeness
    title: QV against k-mer completeness
    description: >-
      Are the assemblies accurate and complete? One point per assessed assembly: the percent of solid read
      k-mers it recovers against its Merqury consensus QV, sized by its k-mer count.

      How to read: the top right is accurate and complete. A point far right and low recovered the
      sequence but kept errors and wants polishing, and one high and far left is accurate but has lost
      sequence. Click a point to read its record.

      Lines and annotations: the horizontal line at QV 40 is one error per 10,000 bases. Points on or
      under it are dimmed, and points above it keep their colour. It is the error rate of the Earth
      BioGenome Project's reference standard, not a pass mark set by Merqury or nf-core/genomeassembler,
      and no line is drawn for the k-mer completeness.

      Source: Earth BioGenome Project, Report on Assembly Standards, a reference genome has an error rate
      below 1 in 10,000 (Q40), https://www.earthbiogenome.org/report-on-assembly-standards

      Note: QV is logarithmic, so QV 50 is ten times fewer errors than QV 40. Merqury, Rhie et al. 2020,
      Genome Biology, doi:10.1186/s13059-020-02134-9, https://github.com/marbl/merqury
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: genomeassembler
    data_collection_tag: merqury_copy_number
    use: merqury/copy_number_bars
    config:
      normalise_to_one: false
      sort_by: alphabetical
      sample_sort: input
      top_n: 12
    section: Copy number
    tag: ga-acc-copy
    index: acc-copy-number
    title: Copy number of the read k-mers in each assembly
    description: >-
      Where did the solid read k-mers end up in each assembly? One bar per assembly, split by how many
      times the k-mer occurs in it: absent, once, twice, three times, four times or more.

      How to read: on a haploid or collapsed assembly almost all k-mers should occur once. A large absent
      share is sequence the assembly lost, and a large two-copy share is duplicated sequence such as
      retained haplotigs. On a phased assembly that keeps both haplotypes, two copies is expected.

      Note: read k-mers at or below the error trough of the read spectrum are left out, so sequencing
      errors do not count as absent sequence. The trough is found per file by the recipe. Merqury, Rhie et
      al. 2020, Genome Biology, doi:10.1186/s13059-020-02134-9, https://github.com/marbl/merqury
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: genomeassembler
    data_collection_tag: merqury_sequence_qv
    use: merqury/sequence_qv_scatter
    config: {log_x: true, x_title: Sequence k-mers (about its length), y_title: Per-sequence QV, legend_pos: bottom,
      selection_enabled: true, selection_column: sequence}
    section: Per-sequence errors
    tag: ga-acc-seq-qv
    index: acc-sequence-qv
    title: Per-sequence QV against sequence length
    description: >-
      Which sequences carry the errors? One point per contig or scaffold: its k-mer count, which tracks
      its length, on a logarithmic axis against its Merqury QV, coloured by assembly.

      How to read: errors are rarely spread evenly, and a few short, low-QV sequences often carry most of
      an assembly's error k-mers. A short point low on the axis is a small piece to polish or drop, and a
      long one is worth inspecting. Click a point to read it.

      Note: a sequence with no error k-mer has no finite QV, so it is not plotted here and is counted in
      the error-free card. No reference line is drawn. Merqury, Rhie et al. 2020, Genome Biology,
      doi:10.1186/s13059-020-02134-9, https://github.com/marbl/merqury
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: genomeassembler
    data_collection_tag: merqury_assembly_qv
    use: merqury/assembly_qv
    row_selection_enabled: true
    row_selection_column: assembly_id
    section: Accuracy table
    tag: ga-acc-table
    index: acc-table
    title: Merqury QV and completeness
    description: >-
      One row per assessed assembly with its Merqury consensus QV, the error k-mers behind it and its
      k-mer completeness.

      How to read: QV is logarithmic, with one error per 10,000 bases at QV 40 and one per 100,000 at QV
      50. A completeness below what the read set allows points at lost sequence, and a completeness near
      100 with a low QV at an assembly that kept everything but is not polished. Tick rows to pick
      assemblies.

      Source: Merqury, Rhie et al. 2020, Genome Biology, doi:10.1186/s13059-020-02134-9,
      https://github.com/marbl/merqury
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Gene completeness
  subtitle: How many conserved single-copy genes does each assembly hold?
  tab_group: Quality
  tab_order: 3
  tab_icon: mdi:shield-check-outline
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Gene filters
    icon: mdi:filter-variant
    color: violet
    description: Narrows the BUSCO scores by lineage and complete share
  grid_sections:
  - name: Genes at a glance
    icon: mdi:counter
    color: violet
    description: BUSCO classes over the assemblies BUSCO scored
  - name: BUSCO classes
    icon: mdi:chart-bar
    color: violet
    description: Complete, duplicated, fragmented and missing BUSCOs per assembly
  - name: Complete against duplicated
    icon: mdi:chart-scatter-plot
    color: grape
    description: Retained haplotigs and duplicated contigs show as duplicated BUSCOs
  - name: BUSCO table
    icon: mdi:table
    color: gray
    description: BUSCO class percentages per assessed assembly and lineage
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [BUSCO](https://busco.ezlab.org) searches each assembly for the single-copy genes
      conserved across its lineage: complete ones say the gene space is there, duplicated
      ones point to retained haplotigs, fragmented and missing ones to gaps or errors.
    tag: ga-gc-intro
    index: gc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: genomeassembler
    data_collection_tag: busco_batch_summary
    interactive_component_type: MultiSelect
    column_name: lineage
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: pink
    section: Gene filters
    tag: ga-gc-filter-lineage
    index: gc-lineage
    title: BUSCO lineage
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: genomeassembler
    data_collection_tag: busco_batch_summary
    interactive_component_type: RangeSlider
    column_name: complete_pct
    column_type: float64
    display:
      icon_name: mdi:shield-check-outline
      custom_color: lime
    section: Gene filters
    tag: ga-gc-filter-complete
    index: gc-complete-range
    title: Complete BUSCOs (%)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: genomeassembler
    data_collection_tag: busco_batch_summary
    use: busco/batch_summary
    aggregation: median
    column_name: single_pct
    column_type: float64
    filter_expr: "col('single_pct').is_not_null()"
    secondary_layout: threshold
    threshold_value: 90
    threshold_direction: min
    display:
      icon_name: mdi:shield-check-outline
      icon_color: violet
      caption: median, against the 90% single-copy target
      decimals: 1
    section: Genes at a glance
    tag: ga-gc-card-complete
    index: gc-card-complete
    title: Single-copy (%)
    description: >-
      Median share of the lineage's BUSCOs found complete and in a single copy. The strip counts the assemblies at 90% or above.

      Source: the 90% line is the Earth BioGenome Project reference-standard target of more than 90% single copy conserved genes (e.g. BUSCO) complete and single copy, https://www.earthbiogenome.org/report-on-assembly-standards. The standard calls it a useful target that needs to be interpreted in context; BUSCO itself sets no pass level. It is a fixed reference, not read from the run.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeassembler
    data_collection_tag: busco_batch_summary
    use: busco/batch_summary
    aggregation: max
    column_name: duplicated_pct
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:set-merge
      icon_color: grape
      caption: the highest, with every assembly's spread
      decimals: 1
    section: Genes at a glance
    tag: ga-gc-card-duplicated
    index: gc-card-duplicated
    title: Most duplicated (%)
    description: The highest share of BUSCOs found more than once; high points to retained haplotigs.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeassembler
    data_collection_tag: busco_batch_summary
    use: busco/batch_summary
    aggregation: median
    column_name: fragmented_pct
    column_type: float64
    filter_expr: "col('fragmented_pct').is_not_null()"
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:content-cut
      icon_color: pink
      caption: median, with its spread
      decimals: 1
    section: Genes at a glance
    tag: ga-gc-card-fragmented
    index: gc-card-fragmented
    title: Fragmented (%)
    description: Median share of BUSCOs found only in part.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeassembler
    data_collection_tag: busco_batch_summary
    use: busco/batch_summary
    aggregation: median
    column_name: missing_pct
    column_type: float64
    filter_expr: "col('missing_pct').is_not_null()"
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:alert-outline
      icon_color: red
      caption: median, with its spread
      decimals: 1
    section: Genes at a glance
    tag: ga-gc-card-missing
    index: gc-card-missing
    title: Missing (%)
    description: Median share of BUSCOs not found at all.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: genomeassembler
    data_collection_tag: busco_composition
    use: busco/class_composition
    config:
      normalise_to_one: false
      sort_by: abundance
      sample_sort: input
      top_n: 12
    section: BUSCO classes
    tag: ga-gc-busco-bars
    index: gc-busco-classes
    title: BUSCO classes per assembly
    description: >-
      How many of the conserved genes does each assembly keep? One bar per assembly, split into the four
      BUSCO classes as a share of the lineage set: complete single-copy, complete duplicated, fragmented
      and missing.

      How to read: a bar mostly complete single-copy is a good gene space. A large duplicated share points
      at retained haplotigs or an uncollapsed assembly, a large fragmented share at errors that break gene
      models, and a large missing share at genes the assembly lacks. Compare the bars of one sample across
      stages to see what a polisher or scaffolder changed.

      Source: BUSCO user guide, definitions of the complete, duplicated, fragmented and missing classes,
      https://busco.ezlab.org/busco_userguide.html

      Note: BUSCO recommends no pass level for these shares, so no cut-off is drawn on this chart; the single-copy card above it shows the Earth BioGenome Project 90% single-copy target.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: genomeassembler
    data_collection_tag: busco_batch_summary
    use: busco/completeness_vs_duplication
    config: {x_title: Complete BUSCOs (percent), y_title: Duplicated BUSCOs (percent), legend_pos: bottom,
      selection_enabled: true, selection_column: assembly_id}
    section: Complete against duplicated
    tag: ga-gc-busco-scatter
    index: gc-busco-scatter
    title: Complete against duplicated BUSCOs
    description: >-
      Is a high BUSCO score a real one? One point per assembly and lineage: the percent of complete BUSCOs
      against the percent of duplicated BUSCOs, coloured by lineage and sized by contig N50.

      How to read: the bottom right is complete with few duplicates. A point high on the axis is a
      complete score that partly comes from duplicates, which suggests an assembly that is not collapsed.
      Click a point to read it.

      Note: duplicated BUSCOs are counted in the complete share, so a high duplication inflates the x
      axis. BUSCO recommends no pass level, so no cut-off is drawn. Source: BUSCO user guide,
      https://busco.ezlab.org/busco_userguide.html
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: genomeassembler
    data_collection_tag: busco_batch_summary
    use: busco/batch_summary
    row_selection_enabled: true
    row_selection_column: assembly_id
    section: BUSCO table
    tag: ga-gc-table
    index: gc-table
    title: BUSCO batch summary
    description: >-
      BUSCO's batch summary, one row per assessed assembly and lineage: the complete, single-copy,
      duplicated, fragmented and missing percentages against the lineage dataset, with the contiguity
      BUSCO measures.

      How to read: complete single-copy is the headline. A high duplicated share on a haploid target
      points at retained haplotigs, and a high fragmented share at errors that break gene models. Tick
      rows to pick assemblies.

      Source: BUSCO user guide, https://busco.ezlab.org/busco_userguide.html
    layout: {x: 0, y: 0, w: 8, h: 6}
