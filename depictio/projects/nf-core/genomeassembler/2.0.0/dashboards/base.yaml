  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Assembly filters
    icon: mdi:filter-variant
    color: indigo
    description: Narrows the assemblies by stage class, assembler and QV
  grid_sections:
  - name: Best assembly at a glance
    icon: mdi:counter
    color: indigo
    description: The best value over the assemblies in view, with every assembly's spread
  - name: Every assembly
    icon: mdi:chart-line
    color: blue
    description: One line per assembly across the QC axes; brush an axis to keep a range
  - name: Contiguity against accuracy
    icon: mdi:chart-scatter-plot
