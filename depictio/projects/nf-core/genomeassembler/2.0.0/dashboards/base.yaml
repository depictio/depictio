    data_collection_tag: stage_steps
    aggregation: max
    column_name: n50_fold
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:ruler
      icon_color: blue
      caption: the largest, with every step's distribution
      decimals: 2
    section: Stages at a glance
    tag: ga-stg-card-n50-fold
    index: stg-card-n50-fold
    title: Largest N50 fold change
