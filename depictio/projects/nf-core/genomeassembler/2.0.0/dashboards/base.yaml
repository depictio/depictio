        Accuracy: [qv, error_rate, kmer_completeness]
        Genes: [busco_lineage, busco_complete, busco_single, busco_duplicated, busco_fragmented, busco_missing]
        Reference: [genome_fraction, misassemblies, mismatches_per_100kbp, nga50]
        QC coverage: [qc_tools, n_qc_tools]
      linked_component: ga-ba-n50-qv
    section: Contiguity against accuracy
    tag: ga-ba-record
    index: ba-record
    title: Assembly record
    description: The assembly picked in the scatter or the table, every metric the QC tools reported.
    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: table
