  - component_type: card
    workflow_tag: genomeassembler
    data_collection_tag: stage_steps
    aggregation: min
    column_name: busco_complete
    column_type: float64
    filter_expr: "col('busco_complete').is_not_null()"
    secondary_layout: coverage
    coverage_max: 100
    display:
      icon_name: mdi:shield-check-outline
      icon_color: violet
      caption: the lowest step, of 100%
      decimals: 1
    section: Stages at a glance
    tag: ga-stg-card-busco
    index: stg-card-busco
    title: Lowest BUSCO complete (%)
    description: The lowest share of complete BUSCOs over the steps BUSCO scored; a drop flags lost genes.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: genomeassembler
    data_collection_tag: stage_steps
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: route
      x_col: stage_rank
      y_col: qv
      x_title: Stage (0 assembly, 1 long-read polish, 2 short-read polish, 3 scaffold)
      y_title: Consensus QV (Merqury)
      legend_pos: bottom
      selection_enabled: true
