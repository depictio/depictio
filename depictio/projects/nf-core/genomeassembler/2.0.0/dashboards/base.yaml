  - component_type: advanced_viz
    workflow_tag: genomeassembler
    data_collection_tag: assemblies
    viz_kind: parallel_coordinates
    config:
      viz_kind: parallel_coordinates
      sample_col: assembly_id
      group_col: '{GROUP_COL}'
      scale: minmax
      metric_cols: [n50, n_sequences, total_length, qv, kmer_completeness]
    section: Every assembly
    tag: ga-ba-parallel
    index: ba-parallel
    title: Every assembly across the QC axes
    description: >-
      How does each assembly compare across the QC axes? One line per assembly through five axes: N50,
      number of sequences, total length, Merqury QV and k-mer completeness, coloured by the sample group.

      How to read: a line high on N50 and QV and low on the number of sequences is a contiguous, accurate
      assembly. Lines that cross between two axes trade one quality for another, for example length for
      accuracy. An assembly missing one of the axes drops out, and BUSCO stays on its own tab.

      Lines and annotations: every axis is rescaled between the lowest and highest value in view
      (min-max), while its ticks keep the metric's own units. A position is therefore a rank within this
      set and not a quality level, and no threshold is drawn.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: genomeassembler
    data_collection_tag: assemblies
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: n50
      y_col: qv
      label_col: assembly_id
      color_col: assembler_used
      size_col: total_length
      log_x: true
      x_title: N50 (bp)
      y_title: Consensus QV (Merqury)
      selection_enabled: true
      selection_column: assembly_id
      legend_pos: bottom
    section: Contiguity against accuracy
    tag: ga-ba-n50-qv
    index: ba-n50-qv
    title: Contiguity against accuracy
    description: >-
      Which assemblies are both contiguous and accurate? One point per assessed assembly: its N50 on a
      logarithmic axis against its Merqury consensus QV, coloured by assembler and sized by assembled
      length.

      How to read: the top right is long and accurate. A point far right and low is contiguous but carries
      errors, which polishing can fix, and one at the top left is accurate but fragmented, which
      scaffolding can join. Click a point to read its record.

      Note: no cut-off is drawn on this plot, so the position says how assemblies compare with each other
      and not whether any of them passes.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: genomeassembler
    data_collection_tag: assemblies
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: assembly_id
      title_col: assembly_id
      selection_source: any
      sections:
        Design: [sample, stage, stage_class, assembler_used, scaffolders]
        Contiguity: [n_sequences, total_length, largest_sequence, n50, l50, n90, l90, aun]
        Accuracy: [qv, error_rate, kmer_completeness]
        Genes: [busco_lineage, busco_complete, busco_single, busco_duplicated, busco_fragmented, busco_missing]
        Reference: [genome_fraction, misassemblies, mismatches_per_100kbp, nga50]
        QC coverage: [qc_tools, n_qc_tools]
      linked_component: ga-ba-n50-qv
    section: Contiguity against accuracy
    tag: ga-ba-record
    index: ba-record
    title: Assembly record
    description: >-
      The assembly picked on the scatter or in the table, as a card: its design, its contiguity, its
      accuracy, its gene completeness, its figures against a reference and the QC tools that assessed it.

      How to read: the contiguity block says how the sequence is split, the accuracy block how many errors
      it carries, and the gene block how many conserved genes it keeps. A block left empty means the tool
      that fills it did not run on this assembly, as listed under the QC tools.
    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: table
    workflow_tag: genomeassembler
    data_collection_tag: assemblies
    row_selection_enabled: true
    row_selection_column: assembly_id
    page_size: 25
    section: Assembly table
    tag: ga-ba-table
    index: ba-table
    title: Assessed assemblies
    description: >-
      One row per assessed assembly with every metric the QC tools reported: contiguity, Merqury accuracy,
      BUSCO classes and, when the run had a reference, the QUAST reference figures.

      How to read: sort on N50 or QV to rank assemblies on one axis, or filter on the stage to compare
      only the raw assemblies. Tick rows to pick assemblies and open their records.
    layout: {x: 0, y: 0, w: 8, h: 6}
