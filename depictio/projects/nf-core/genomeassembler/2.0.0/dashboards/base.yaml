    data_collection_tag: assemblies
    row_selection_enabled: true
    row_selection_column: assembly_id
    page_size: 25
    section: Assembly table
    tag: ga-ba-table
    index: ba-table
    title: Assessed assemblies
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Stages
  subtitle: What does each polishing and scaffolding step add?
  tab_group: Assemblies
  tab_order: 2
  tab_icon: mdi:chart-timeline-variant
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Route filters
    icon: mdi:filter-variant
    color: grape
    description: Narrows the routes by the stage they end on, or to some routes
  grid_sections:
  - name: Stages at a glance
    icon: mdi:counter
    color: grape
    description: What the steps gained over each sample's raw assembly
  - name: QV along each route
    icon: mdi:chart-line
    color: teal
    description: Merqury QV at every step; polishing should lift the line
  - name: N50 along each route
    icon: mdi:chart-line
    color: blue
    description: N50 over the raw assembly's; scaffolding should lift the line
