    description: Two stage classes compared metric by metric
    collapsed: true
  - name: Route table
    icon: mdi:table
    color: gray
    description: One row per step of every route, with the change from the raw assembly
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      Each line follows one sample from its raw assembly through polishing to one scaffolder.
      A line that climbs gained at that step; a flat line means the step changed nothing the
      metric can see. Pick a route on either chart to follow it on both.
