    description: Repeat locus calls, one per locus and sample. The bar splits them by status against the
      disease thresholds.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: raredisease
    data_collection_tag: repeat_expansions
    aggregation: count
    column_name: variant_key
    column_type: object
    secondary_layout: composition
    breakdown_col: inheritance
    filter_expr: col('repeat_status') == 'Pathogenic range'
    display:
      icon_name: mdi:alert-circle-outline
      icon_color: red.6
      caption: calls, by inheritance
      format: integer
    section: Repeats at a glance
    tag: rd-rp-card-pathogenic
    index: rp-card-pathogenic
    title: Pathogenic-range calls
    description: Calls at or above the pathogenic threshold of their locus. The bar splits them by inheritance.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: raredisease
    data_collection_tag: mobile_elements
    aggregation: count
    column_name: variant_key
    column_type: object
    secondary_layout: composition
    breakdown_col: me_type
    display:
      icon_name: mdi:content-duplicate
      icon_color: red.8
      caption: insertions, by element family
      format: integer
    section: Repeats at a glance
    tag: rd-rp-card-me
    index: rp-card-me
    title: Mobile element insertions
    description: Insertions of mobile elements, one per sample carrying them. The bar splits them by element
      family.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: raredisease
    data_collection_tag: smn
    aggregation: count
    column_name: sample
    column_type: object
    secondary_layout: composition
    breakdown_col: smn_status
    display:
      icon_name: mdi:dna
      icon_color: red.9
      caption: samples, by SMN call status
      format: integer
    section: Repeats at a glance
    tag: rd-rp-card-smn
    index: rp-card-smn
    title: SMN calls
    description: Samples with an SMN copy number call. The bar splits them by call status.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: raredisease
    data_collection_tag: repeat_expansions
    visu_type: scatter
    mode: code
    code_content: |-
      # Each genotyped repeat call as a share of its locus's pathogenic threshold, one row per locus: left of the first mark is the normal range, between the marks intermediate, from 1 on pathogenic. Markers are coloured by Stranger's verdict and set apart by sample.
      colors = depictio_category_colors.get('repeat_status') or {}
      d = df.filter(pl.col('repeat_count').is_not_null() & (pl.col('pathologic_min') > 0)).with_columns((pl.col('repeat_count') / pl.col('pathologic_min')).alias('ratio'), (pl.col('normal_max') / pl.col('pathologic_min')).clip(0, 1).alias('normal_ratio'), pl.concat_str([pl.col('locus'), pl.lit(' ('), pl.col('disease').fill_null('no disease listed'), pl.lit(')')]).alias('row'))
      order = d.group_by('row').agg(pl.col('ratio').max().alias('top'), pl.col('normal_ratio').first().alias('normal_ratio')).sort(['top', 'row'], descending=[False, False]).tail(25)
      rows = order.get_column('row').to_list()
      pos = {r: i for i, r in enumerate(rows)}
      samples = sorted(d.get_column('sample').unique().to_list())
      shift = {s: (i - (len(samples) - 1) / 2) * 0.22 for i, s in enumerate(samples)}
      d = d.filter(pl.col('row').is_in(rows)).with_columns(pl.col('row').replace_strict(pos, return_dtype=pl.Float64).alias('y')).with_columns((pl.col('y') + pl.col('sample').replace_strict(shift, return_dtype=pl.Float64)).alias('y_shift'))
      right = max(1.5, float(d.get_column('ratio').max()) * 1.1)
      def tint(hex_color, alpha):
          h = hex_color.lstrip('#')
          return 'rgba(' + str(int(h[0:2], 16)) + ',' + str(int(h[2:4], 16)) + ',' + str(int(h[4:6], 16)) + ',' + str(alpha) + ')'
      fig = px.scatter(d.to_pandas(), x='ratio', y='y_shift', color='repeat_status', color_discrete_map=colors, custom_data=['sample', 'repeat_count', 'normal_max', 'pathologic_min', 'spanning_reads'], labels={'ratio': 'Repeat count as a share of the pathogenic threshold (1 = threshold)', 'y_shift': '', 'repeat_status': ''})
      fig.update_traces(marker=dict(size=13, line=dict(width=1.2, color='rgba(128,128,128,0.9)')), hovertemplate='%{customdata[0]}<br>%{customdata[1]} repeats (normal up to %{customdata[2]}, pathogenic from %{customdata[3]})<br>%{customdata[4]} spanning reads<extra>%{fullData.name}</extra>')
      for r, n in zip(order.get_column('row').to_list(), order.get_column('normal_ratio').to_list()):
          i = pos[r]
          for x0, x1, status in ((0, n, 'Normal'), (n, 1, 'Intermediate'), (1, right, 'Pathogenic range')):
              if x1 > x0:
                  fig.add_shape(type='rect', x0=x0, x1=x1, y0=i - 0.45, y1=i + 0.45, fillcolor=tint(colors.get(status, '#adb5bd'), 0.16), line_width=0, layer='below')
      fig.add_vline(x=1, line_dash='dot', line_width=1)
      fig.update_xaxes(range=[0, right])
      fig.update_yaxes(tickmode='array', tickvals=list(range(len(rows))), ticktext=rows, range=[-0.6, len(rows) - 0.4], automargin=True)
      fig.update_layout(margin=dict(t=10), legend_title_text='', legend=dict(orientation='h', y=-0.3))
    section: Repeat counts
    tag: rd-rp-counts
    index: rp-counts
    title: Repeat counts against the thresholds
    description: One row per locus with its disease, one marker per sample, placed by its repeat count as a
      share of the locus's pathogenic threshold. Green is the normal range, amber intermediate and red
      pathogenic; the dotted line at 1 is the pathogenic threshold, and both limits come from the locus
      catalogue Stranger reads. The marker colour is Stranger's verdict. Loci with no call are left out.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: figure
    workflow_tag: raredisease
    data_collection_tag: mobile_elements
    visu_type: bar
    mode: code
    code_content: |-
      # Insertions per sample, by element family.
      colors = depictio_category_colors.get('me_type') or {}
      d = df.group_by(['sample', 'me_type']).agg(pl.len().alias('n')).sort(['sample', 'me_type'])
      fig = px.bar(d.to_pandas(), x='sample', y='n', color='me_type', color_discrete_map=colors, labels={'sample': '', 'n': 'Insertions', 'me_type': ''})
      fig.update_layout(margin=dict(t=10), legend_title_text='')
    section: Mobile elements
    tag: rd-rp-mobile
    index: rp-mobile
    title: Mobile element insertions per sample
