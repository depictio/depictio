- title: Mitochondria
  subtitle: How heteroplasmic are the mitochondrial calls, and how rare?
  tab_group: Variants
  tab_order: 6
  tab_icon: mdi:atom
  tab_icon_color: yellow
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Mitochondria scope
    icon: mdi:filter-variant
    color: yellow
    description: These picks narrow every mitochondrial tile
  grid_sections:
  - name: Mitochondria at a glance
    icon: mdi:counter
    color: yellow
    description: Calls, heteroplasmy, impact and depth of the mitochondrial calls
  - name: Heteroplasmy
    icon: mdi:chart-scatter-plot
    color: yellow
    description: Every call by its position and the share of copies carrying it
  - name: Population frequency
    icon: mdi:chart-bell-curve
    color: yellow
    description: Heteroplasmy against how common the variant is in gnomAD
