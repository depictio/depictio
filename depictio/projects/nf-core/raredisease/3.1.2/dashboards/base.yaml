    code_content: |-
      # Ranked variants each sample carries, by zygosity.
      colors = depictio_category_colors.get('gt_class') or {}
      d = df.group_by(['sample', 'gt_class']).agg(pl.len().alias('n')).sort(['sample', 'gt_class'])
      fig = px.bar(d.to_pandas(), x='sample', y='n', color='gt_class', color_discrete_map=colors, category_orders={'gt_class': ['Het', 'Hom alt', 'Half call']}, labels={'sample': '', 'n': 'Ranked variants carried', 'gt_class': ''})
      fig.update_layout(margin=dict(t=10), legend_title_text='')
    section: Carriers
    tag: rd-rk-carriers
    index: rk-carriers
    title: Ranked variants carried per sample
    description: Heterozygous, homozygous-alternate and half calls among the ranked variants of each sample.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: advanced_viz
