    use: vcf/het_hom
    aggregation: median
    column_name: het_hom_ratio
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:set-merge
      icon_color: teal.8
      caption: median per sample, with the spread
      decimals: 2
    section: Callset at a glance
    tag: rd-cs-card-hethom
    index: cs-card-hethom
    title: Het over hom-alt
    description: Heterozygous over homozygous-alternate PASS calls. A sample with long runs of homozygosity
      reads lower.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: raredisease
    data_collection_tag: vcf_filter_breakdown
    use: vcf/calls_by_filter
    aggregation: sum
    column_name: calls
    column_type: int64
    secondary_layout: top_n
    breakdown_col: filter_label
    top_n_count: 4
    display:
      icon_name: mdi:filter-outline
      icon_color: teal.9
      caption: calls by FILTER value, the largest four
      format: si
    section: Callset at a glance
    tag: rd-cs-card-filters
    index: cs-card-filters
    title: Calls by FILTER
    description: Every call of the samples in scope, PASS and each set of failed filters.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: raredisease
    data_collection_tag: samples
    visu_type: bar
    mode: code
    code_content: |-
      # Ts/Tv of each sample's PASS SNVs, highest first. The bands are what whole genomes (2.0 to 2.1) and exomes (2.8 to 3.0) give.
      grp = depictio_group_by[0] if depictio_group_by else 'role'
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get('role') or {}
      d = df.filter(pl.col('ts_tv').is_not_null())
      top = max(3.3, float(d.get_column('ts_tv').max() or 0) * 1.1)
      fig = px.bar(d.to_pandas(), x='ts_tv', y='sample', color=grp, orientation='h', color_discrete_map=colors, custom_data=['sample'], hover_data={'pass_calls': ':,', 'ts_tv': ':.2f'}, labels={'ts_tv': 'Transitions over transversions', 'sample': '', 'pass_calls': 'PASS calls'})
      fig.add_vrect(x0=2.0, x1=2.1, fillcolor='rgba(47,158,68,0.25)', line_width=0, layer='above', annotation_text='Genome', annotation_position='top left', annotation_font_size=10)
      fig.add_vrect(x0=2.8, x1=3.0, fillcolor='rgba(47,158,68,0.25)', line_width=0, layer='above', annotation_text='Exome', annotation_position='top left', annotation_font_size=10)
      fig.update_xaxes(range=[0, top])
      fig.update_yaxes(categoryorder='total ascending', automargin=True)
      fig.update_layout(margin=dict(t=10), legend_title_text='', legend=dict(orientation='h', y=-0.3))
    selection_enabled: true
    selection_column: sample
    section: Callset quality
    tag: rd-cs-tstv-bar
    index: cs-tstv-bar
    title: Ts/Tv per sample
    description: Transitions over transversions of the PASS SNVs, highest first and coloured by role. A human
      genome sits near 2.0 to 2.1 and an exome near 2.8 to 3.0 (the green bands); a lower value points to false
      positives. A click narrows the dashboard to the sample.
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: figure
    workflow_tag: raredisease
    data_collection_tag: samples
    visu_type: bar
    mode: code
    code_content: |-
      # Het over hom-alt of each sample's PASS calls, highest first. The band is the usual range of an outbred sample (1.5 to 2).
      grp = depictio_group_by[0] if depictio_group_by else 'role'
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get('role') or {}
      d = df.filter(pl.col('het_hom_ratio').is_not_null())
      top = max(2.5, float(d.get_column('het_hom_ratio').max() or 0) * 1.1)
      fig = px.bar(d.to_pandas(), x='het_hom_ratio', y='sample', color=grp, orientation='h', color_discrete_map=colors, custom_data=['sample'], hover_data={'pass_calls': ':,', 'het_hom_ratio': ':.2f'}, labels={'het_hom_ratio': 'Heterozygous over homozygous-alternate calls', 'sample': '', 'pass_calls': 'PASS calls'})
      fig.add_vrect(x0=1.5, x1=2.0, fillcolor='rgba(47,158,68,0.25)', line_width=0, layer='above', annotation_text='Outbred', annotation_position='top left', annotation_font_size=10)
      fig.update_xaxes(range=[0, top])
      fig.update_yaxes(categoryorder='total ascending', automargin=True)
      fig.update_layout(margin=dict(t=10), legend_title_text='', legend=dict(orientation='h', y=-0.3))
    selection_enabled: true
    selection_column: sample
    section: Callset quality
    tag: rd-cs-hethom-bar
    index: cs-hethom-bar
    title: Het over hom-alt per sample
    description: Heterozygous over homozygous-alternate PASS calls, highest first and coloured by role. An
      outbred sample sits near 1.5 to 2 (the green band); a low value fits consanguinity or long runs of
      homozygosity, a high one contamination. A click narrows the dashboard to the sample.
    layout: {x: 4, y: 0, w: 4, h: 5}
  - component_type: figure
    workflow_tag: raredisease
    data_collection_tag: vcf_substitution_spectrum
    use: vcf/spectrum_bars
    visu_type: bar
    mode: code
    code_content: |-
      # Share of each sample's PASS SNVs per folded class, transitions first; one bar per sample, coloured by role.
      grp = depictio_group_by[0] if depictio_group_by else 'role'
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get('role') or {}
      order = ['C to T', 'T to C', 'C to A', 'C to G', 'T to A', 'T to G']
      d = df.with_columns((pl.col('fraction') * 100).alias('share')).sort([grp, 'sample', 'substitution_class'])
      shapes = 'sample' if d.group_by(grp).agg(pl.col('sample').n_unique().alias('n')).get_column('n').max() > 1 else None
      fig = px.bar(d.to_pandas(), x='substitution_class', y='share', color=grp, pattern_shape=shapes, barmode='group', color_discrete_map=colors, category_orders={'substitution_class': order}, hover_data=['sample'], labels={'substitution_class': '', 'share': 'Share of the PASS SNVs (%)', 'sample': 'Sample', 'role': 'Role'})
      fig.update_layout(margin=dict(t=10), legend_title_text='')
    section: Substitution spectrum
    tag: rd-cs-spectrum
    index: cs-spectrum
    title: Substitution spectrum per sample
    description: The six pyrimidine-folded classes as shares of each sample's PASS SNVs, coloured by role. The
      first two classes are transitions; a sample whose bars depart from its relatives' points to a calling or
      contamination problem.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: figure
    workflow_tag: raredisease
    data_collection_tag: vcf_variants
    visu_type: bar
    mode: code
    code_content: |-
      # Each sample's PASS calls read at least 10 times over the allele fraction, as the share of its calls in each 0.05 bin; the green band is where a heterozygous germline call sits (0.3 to 0.7), the blue one where a homozygous-alternate call sits (0.9 to 1).
      colors = depictio_category_colors.get('variant_type') or {}
      d = df.filter(pl.col('is_pass') & (pl.col('dp') >= 10) & pl.col('vaf').is_not_null())
      many = df['caller'].n_unique() > 1
      panel = (pl.col('sample') + pl.lit(' / ') + pl.col('caller')) if many else pl.col('sample')
      d = d.with_columns(panel.alias('panel'), (((pl.col('vaf') * 20).floor().clip(0, 19) + 0.5) / 20).round(3).alias('bin'))
      d = d.group_by(['panel', 'variant_type', 'bin']).agg(pl.len().alias('calls'))
      d = d.with_columns((pl.col('calls') * 100 / pl.col('calls').sum().over('panel')).alias('share')).sort(['panel', 'variant_type', 'bin'])
      order = d.get_column('panel').unique(maintain_order=True).to_list()
      fig = px.bar(d.to_pandas(), x='bin', y='share', color='variant_type', color_discrete_map=colors, facet_col='panel', facet_col_wrap=4, custom_data=['panel', 'calls'], category_orders={'panel': order}, labels={'variant_type': '', 'bin': '', 'share': ''})
      fig.update_traces(width=0.05, hovertemplate='<b>%{customdata[0]}</b><br>allele fraction %{x:.2f}<br>%{y:.1f}% of its calls (%{customdata[1]:,})<extra></extra>')
      fig.update_xaxes(range=[0, 1], tickvals=[0, 0.5, 1], title_text='')
      top = d.group_by(['panel', 'bin']).agg(pl.col('share').sum()).get_column('share').max() * 1.1
      fig.update_yaxes(title_text='', automargin=True, range=[0, top])
      fig.for_each_annotation(lambda a: a.update(text=a.text.split('=')[-1]))
      fig.add_shape(type='rect', x0=0.3, x1=0.7, y0=0, y1=top, fillcolor='rgba(47,158,68,0.15)', line_width=0, layer='below', row='all', col='all')
      fig.add_shape(type='rect', x0=0.9, x1=1, y0=0, y1=top, fillcolor='rgba(28,126,214,0.15)', line_width=0, layer='below', row='all', col='all')
      fig.add_annotation(text='Allele fraction', xref='paper', yref='paper', x=0.5, y=-0.1, showarrow=False)
      fig.add_annotation(text="Share of the sample's calls (%)", xref='paper', yref='paper', x=-0.05, y=0.5, showarrow=False, textangle=-90)
      fig.update_layout(margin=dict(t=30, l=50, b=50), bargap=0, legend_title_text='', legend=dict(orientation='h', y=-0.2))
    section: Allele fraction
    tag: rd-cs-vaf-vs-depth
    index: cs-vaf-vs-depth
    title: Allele fraction per sample
    description: Share of each sample's PASS calls (read at least 10 times) in each 0.05 bin of allele fraction, split by variant type. A germline sample peaks in the green band at 0.5 (heterozygous) and in the blue one near 1 (homozygous-alternate). A heterozygous peak off 0.5, or a broad shoulder of low fractions, flags contamination, mosaicism or artefacts.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: raredisease
    data_collection_tag: vcf_variant_density
    use: vcf/density_karyotype
    config:
      assembly: '{GENOME}'
      mode: density
      orientation: vertical
      facet_by_sample: false
      colour_scale: Viridis
      region_filter_enabled: true
    section: Karyotype
    tag: rd-cs-karyotype
    index: cs-karyotype
    title: PASS variants per 1 Mb on the karyotype
    description: Each chromosome drawn to its length, banded by one sample's distinct PASS variants per
      1 Mb. Only contigs that carry calls are drawn, so a callset on one chromosome shows that one and the
      rest of the genome stays empty. Open a chromosome and use Filter dashboard to narrow the per-call plot to it.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: raredisease
    data_collection_tag: vcf_callset_summary
    use: vcf/callset_summary
    columns: [sample, calls, pass_calls, pass_pct, snvs, indels, multiallelic, ts_tv, het, hom_alt, het_hom_ratio,
      median_qual, median_dp, median_het_vaf]
    row_selection_enabled: true
    row_selection_column: sample
    section: Callset tables
    tag: rd-cs-table-summary
    index: cs-table-summary
    title: Callset summary per sample
    description: Calls, PASS share, SNVs, indels, Ts/Tv, zygosity and the median quality, depth and allele
      fraction.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: raredisease
    data_collection_tag: vcf_filter_breakdown
    use: vcf/filter_breakdown
    columns: [sample, filter_label, failed_filters, calls, calls_pct, snvs, indels]
    row_selection_enabled: true
    row_selection_column: filter_label
    section: Callset tables
    tag: rd-cs-table-filters
    index: cs-table-filters
    title: FILTER breakdown per sample
    description: Each FILTER value with its calls, their share of the sample's callset and the SNVs and
      indels among them.
    layout: {x: 0, y: 6, w: 8, h: 6}
