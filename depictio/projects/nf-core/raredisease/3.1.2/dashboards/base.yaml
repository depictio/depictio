- title: Locus
  subtitle: What do the calls and alignments show at one locus?
  tab_group: Variants
  tab_order: 8
  tab_icon: mdi:map-marker-outline
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Locus filters
    icon: mdi:filter-variant
    color: indigo
    description: These picks narrow the cards, the table and the ranked points of the navigator; the
      browser reads every variant
  grid_sections:
  - name: Region at a glance
    icon: mdi:counter
    color: indigo
    description: What the region in view holds, recounted on every brush or locus entry
  - name: Variants on one axis
    icon: mdi:dna
    color: indigo
    description: Brush the navigator and the browser follows; its window shows as a band on the navigator
    display: linked
  - name: Ranked variants in the region
    icon: mdi:table
    color: indigo
    description: The ranked variants inside the region in view
  components:
  - component_type: text
    order: 1
    body: >
      The navigator draws every ranked variant at its position, higher for a higher rank score, in the colour of its inheritance model. A brush,
      or a locus typed in its header, moves the browser and recounts the cards; the navigator follows the browser's
      window. The browser opens on the span of the 20 best-ranked variants when they lie close together (else on the
      top-ranked one), with the ranked VCF (each variant named by its gene and rank score), the proband's alignment and
      coverage, the parents' alignments, the gene annotation and the ClinVar and common dbSNP sites; the other tracks of
      the family are in its track menu.
    tag: rd-loc-intro
    index: loc-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: raredisease
    data_collection_tag: ranked_variants
    interactive_component_type: MultiSelect
    column_name: variant_set
    column_type: object
    display:
      icon_name: mdi:format-list-bulleted
      custom_color: orange
    section: Locus filters
    group: Locus
    tag: rd-loc-set-filter
    index: loc-set-filter
    title: Variant set
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: raredisease
    data_collection_tag: vcf_variants
    interactive_component_type: MultiSelect
    column_name: variant_type
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: indigo
    section: Locus filters
    group: Locus
    tag: rd-loc-type-filter
    index: loc-type-filter
    title: Variant type
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: raredisease
    data_collection_tag: ranked_variants
    interactive_component_type: RangeSlider
    column_name: rank_score
    column_type: float64
    show_histogram: true
    display:
      icon_name: mdi:podium-gold
      custom_color: grape
    section: Locus filters
    group: Locus
    tag: rd-loc-score-range
    index: loc-score-range
    title: Rank score
    layout: {x: 0, y: 5, w: 1, h: 3}
  - component_type: card
    workflow_tag: raredisease
    data_collection_tag: ranked_variants
    aggregation: count
    column_name: variant_key
    column_type: object
    secondary_layout: composition
    breakdown_col: model_class
    follow_region_filter: true
    display:
      icon_name: mdi:sort-numeric-descending
      icon_color: indigo.4
      caption: variants in the region, by model
      format: si
    section: Region at a glance
    tag: rd-loc-card-ranked
    index: loc-card-ranked
    title: Ranked variants
    description: Ranked variants inside the region in view. The bar splits them by inheritance model.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: raredisease
    data_collection_tag: vcf_variants
    aggregation: count
    column_name: variant_key
    column_type: object
    secondary_layout: composition
    breakdown_col: variant_type
    follow_region_filter: true
    display:
      icon_name: mdi:counter
      icon_color: indigo.6
      caption: calls in the region, by variant type
      format: si
    section: Region at a glance
    tag: rd-loc-card-calls
    index: loc-card-calls
    title: Calls
    description: Calls inside the region in view, one per sample carrying them.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: raredisease
    data_collection_tag: ranked_variants
    aggregation: max
    column_name: rank_score
    column_type: float64
    secondary_layout: histogram
    follow_region_filter: true
    display:
      icon_name: mdi:podium-gold
      icon_color: indigo.8
      caption: best rank score in the region
    section: Region at a glance
    tag: rd-loc-card-variants
    index: loc-card-variants
    title: Top rank score
    description: The highest rank score of the variants inside the region in view.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: raredisease
    data_collection_tag: vcf_variants
    aggregation: median
    column_name: dp
    column_type: int64
    secondary_layout: histogram
    follow_region_filter: true
    display:
      icon_name: mdi:layers-outline
      icon_color: indigo.9
      caption: median per call, with its distribution
      decimals: 0
    section: Region at a glance
    tag: rd-loc-card-dp
    index: loc-card-dp
    title: Depth at the call
    description: Median read depth at the calls inside the region in view.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: raredisease
    data_collection_tag: ranked_variants
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      chr_col: chrom
      pos_col: pos
      score_col: rank_score
      feature_col: gene
      category_col: model_class
      mark: point
      point_size: 9
      # The three best variants as a gold, silver and bronze star, the medals of
      # the browser's stars.
      top_stars: 3
      # What a hover says beyond the position, score, gene and model.
      hover_cols: [ref, alt, consequence, hgvs_p, gnomad_af, cadd, carriers]
      assembly: '{GENOME}'
      score_title: Rank score
      # No default region: a fixed region as the opening filter sends the browser
      # below to it, where every track asks for a force load. The browser opens on
      # the span of the best variants and the navigator frames that window.
      region_filter_enabled: true
      # Opens zoomed on the window the browser shows (the best variants), not on the
      # whole chromosome, then follows the browser: its window stays in the middle.
      open_on_view_window: true
      default_view: region
      follow_view_window: true
      # 7 Mb of context around the browser's window, so the neighbouring ranked
      # variants stay in view while the browser is zoomed on a few kilobases.
      follow_context_bp: 7000000
    section: Variants on one axis
    tag: rd-loc-navigator
    index: loc-navigator
    title: Ranked variants along the genome
    description: Each point is a ranked variant, higher for a higher rank score, so the best candidates sit at
      the top. The colour is the inheritance model it fits, as in the ranked table and the variant track below
      (purple compound heterozygous, orange recessive, blue dominant, green X-linked, grey no model fits). The
      best candidates of a family often share one model, so one colour can fill the top; the height carries the
      ranking. The axis keeps about 7 Mb around the browser's window, the band, so the neighbouring candidates
      stay in view. A locus or gene in the header, or a brush, moves the browser.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: jbrowse
    workflow_tag: raredisease
    data_collection_tag: tracks
    section: Variants on one axis
    initial_tracks: 5
    max_tracks: 12
    show_annotation: true
    follow_window: true
    fetch_size_limit_mb: 20
    show_overview: false
    show_header: false
    selection_enabled: true
    selection_column: sample
    locus_from:
    - data_collection_tag: ranked_variants
      name: Ranked variants
      color: orange
      chrom_column: chrom
      start_column: pos
      end_column: end
      padding: 25000
      max_rows: 20
      sort_by: rank_score
      descending: true
      span_top: 20
      max_span: 1000000
      # A "Top 20" track under the genes names each call by its rank (#1 GENE);
      # the best call, or the row picked in the table, wears the selection colour.
      rank_track: 20
      # Each call in the colour the navigator gives it (its inheritance model).
      rank_color_by: model_class
      label_column: call_label
      columns: [gene, consequence, model_class]
    - data_collection_tag: repeat_expansions
      name: Repeat expansions
      color: red
      chrom_column: chrom
      start_column: start
      end_column: end
      padding: 500
      max_rows: 20
      sort_by: spanning_reads
      descending: true
      label_column: locus
      sample_column: sample
      columns: [disease, repeat_status]
    - data_collection_tag: mobile_elements
      name: Mobile elements
      color: cyan
      chrom_column: chrom
      start_column: pos
      end_column: end
      padding: 500
      max_rows: 20
      sort_by: qual
      descending: true
      label_column: me_type
      sample_column: sample
      columns: [gt, filter_status]
    ucsc_tracks: [clinvarMain, dbSnp155Common]
    # A variant no model fits (the "No model fits" grey of the navigator) wears the fallback.
    variant_color_by:
      column: genetic_model
      info_field: GeneticModels
      fallback_color: '#adb5bd'
      fallback_label: No model fits
    # The gene (VEP CSQ SYMBOL), not the 21_10950631_T_A key, names each variant.
    # The rank score (INFO RankScore, `family:score`) follows the gene in brackets.
    variant_label_by:
      info_field: CSQ
      part: 3
      score_field: RankScore
    tag: rd-loc-browser
    index: loc-browser
    title: Genome browser
    description: The ranked VCFs, the alignments, ClinVar and common dbSNP sites at the region of the navigator. The Top 20 track names each call by its rank; the best call, or the row picked in the table, is drawn in the selection colour on every track and in the table.
    layout: {x: 0, y: 4, w: 8, h: 7}
  - component_type: table
    workflow_tag: raredisease
    data_collection_tag: ranked_variants
    columns: [chrom, pos, ref, alt, gene, consequence, impact, hgvs_p, rank_score, model_class, variant_set,
      n_carriers]
    row_selection_enabled: true
    row_selection_column: variant_key
    # One pick at a time: the browser frames one feature.
    row_selection_mode: single
    section: Ranked variants in the region
    tag: rd-loc-table-ranked
    index: loc-table-ranked
    title: Ranked variants in the region
    description: The ranked variants inside the region in view, with their gene, consequence and rank
      score.
    layout: {x: 0, y: 0, w: 8, h: 6}
