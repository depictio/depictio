    icon: mdi:table
    color: gray
    description: Every mitochondrial call with its annotation
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      The mitochondrial genome is called apart from the nuclear one, so the allele fraction of a call
      is its heteroplasmy: the share of mitochondrial copies carrying the variant. Calls near 1 are homoplasmic
      and the rest are mixtures. A variant that is rare in the gnomAD mitochondrial frequencies and heteroplasmic
      is the one to look at.
    tag: rd-mt-intro
    index: mt-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
