      of its disease. The mobile element caller reports insertions of ALU, L1, SVA and HERV elements,
      and SMNCopyNumberCaller counts the SMN1 and SMN2 copies. A locus with no call had too few reads
      to genotype.
    tag: rd-rp-intro
    index: rp-intro
