    column_name: variant_key
    column_type: object
    secondary_layout: composition
    breakdown_col: impact
    filter_expr: col('impact').is_in(['HIGH', 'MODERATE'])
    display:
      icon_name: mdi:alert-outline
      icon_color: grape.8
      caption: variants, by impact
      format: integer
    section: Ranking at a glance
    tag: rd-rk-card-impact
    index: rk-card-impact
    title: High or moderate impact
    description: Variants VEP predicts to be HIGH (a lost stop, a frameshift) or MODERATE (a missense
      change).
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: raredisease
    data_collection_tag: ranked_variants
    aggregation: max
    column_name: rank_score
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:trophy-outline
      icon_color: grape.9
      caption: rank scores, how they spread
      decimals: 0
    section: Ranking at a glance
    tag: rd-rk-card-top
    index: rk-card-top
    title: Top rank score
    description: The highest rank score among the variants in scope.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: raredisease
    data_collection_tag: ranked_variants
    visu_type: box
    mode: code
    code_content: |-
      # The rank score of every variant, by the inheritance model it fits.
      colors = depictio_category_colors.get('model_class') or {}
      order = ['Compound heterozygous', 'Recessive', 'Dominant', 'X-linked', 'No model fits']
      d = df.filter(pl.col('rank_score').is_not_null())
      fig = px.box(d.to_pandas(), x='model_class', y='rank_score', color='model_class', color_discrete_map=colors, category_orders={'model_class': order}, points=False, labels={'model_class': '', 'rank_score': 'Rank score'})
      fig.update_layout(margin=dict(t=10), showlegend=False)
      fig.update_xaxes(automargin=True)
    section: Rank by model
    tag: rd-rk-rank-by-model
    index: rk-rank-by-model
    title: Rank score by inheritance model
    description: A variant that fits a model scores above the rest; the box spans the middle half of each
      model's variants.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: figure
    workflow_tag: raredisease
    data_collection_tag: ranked_variants
    visu_type: bar
    mode: code
    code_content: |-
      # The ten rank-model components behind the 20 best-scoring variants, one stacked bar each, best at the top; the family's bounds frame the axis.
      names = {'score_allele_frequency': 'Allele frequency', 'score_protein': 'Protein', 'score_gene_intolerance': 'Gene intolerance', 'score_inheritance': 'Inheritance', 'score_consequence': 'Consequence', 'score_conservation': 'Conservation', 'score_call_quality': 'Call quality', 'score_deleteriousness': 'Deleteriousness', 'score_clinical': 'Clinical', 'score_splicing': 'Splicing'}
      top = df.filter(pl.col('rank_score').is_not_null()).sort(['rank_score', 'variant_key'], descending=[True, False]).head(20).with_row_index('rank', offset=1).with_columns(pl.concat_str([pl.col('rank').cast(pl.Utf8), pl.lit('. '), pl.col('call_label')]).alias('label'))
      labels = top.get_column('label').to_list()
      totals = top.get_column('rank_score').to_list()
      bounds = top.get_column('rank_score_max').drop_nulls()
      top_bound = float(bounds.max()) if bounds.len() > 0 else float(max(totals))
      long = top.select(['label', 'variant_key'] + list(names.keys())).unpivot(index=['label', 'variant_key'], variable_name='component', value_name='points').with_columns(pl.col('component').replace(names))
      fig = px.bar(long.to_pandas(), x='points', y='label', color='component', orientation='h', custom_data=['variant_key'], category_orders={'label': labels, 'component': list(names.values())}, labels={'points': 'Rank score points, out of ' + str(int(top_bound)), 'label': '', 'component': ''})
      fig.update_traces(hovertemplate='%{y}<br>%{fullData.name}: %{x}<extra></extra>')
      for lab, tot in zip(labels, totals):
          fig.add_annotation(x=tot, y=lab, text=str(int(tot)), showarrow=False, xanchor='left', xshift=4, font=dict(size=10))
      fig.update_xaxes(range=[min(0, float(long.get_column('points').min() or 0)) - 0.5, top_bound + 0.5])
      fig.update_yaxes(automargin=True)
      fig.update_layout(margin=dict(t=10), barmode='relative', legend_title_text='', legend=dict(orientation='h', y=-0.12, font=dict(size=9)))
    selection_enabled: true
    selection_column: variant_key
    section: Why they rank, and who carries them
    tag: rd-rk-score-parts
    index: rk-score-parts
    title: Rank score parts of the 20 best variants
    description: GENMOD's rank model adds a score for each of ten categories, and the family's pedigree sets
      the bounds of the total (the axis ends at the highest score the family can reach). Each bar is one
      variant, best first, split into its ten parts, with its total at the end. A click narrows the table,
      the record and the genotypes to that variant.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: figure
    workflow_tag: raredisease
    data_collection_tag: ranked_variants
    visu_type: scatter
    mode: code
    code_content: |-
      # The genotype of each sample at the 20 best-scoring variants, in the order of the ranking, coloured by zygosity; grey is homozygous reference.
      colors = depictio_category_colors.get('gt_class') or {}
      classes = ['Hom ref', 'Het', 'Hom alt', 'Half call', 'No call']
      top = df.filter(pl.col('rank_score').is_not_null() & pl.col('genotypes').is_not_null()).sort(['rank_score', 'variant_key'], descending=[True, False]).head(20).with_row_index('rank', offset=1)
      labels = [str(r) + '. ' + str(lab) for r, lab in zip(top.get_column('rank').to_list(), top.get_column('call_label').to_list())]
      cells = [[g.split('|', 1) for g in row.split(';')] for row in top.get_column('genotypes').to_list()]
      samples = list(dict.fromkeys([c[0] for row in cells for c in row]))
      def zygosity(gt):
          alleles = gt.replace('|', '/').split('/')
          known = [a for a in alleles if a not in ('.', '')]
          if not known:
              return 'No call'
          if len(known) < len(alleles):
              return 'Half call'
          if all(a == '0' for a in known):
              return 'Hom ref'
          return 'Hom alt' if len(set(known)) == 1 else 'Het'
      code = {c: i for i, c in enumerate(classes)}
      z = []
      text = []
      for row in cells:
          call = {c[0]: zygosity(c[1]) for c in row}
          z.append([code[call.get(s, 'No call')] for s in samples])
          text.append([call.get(s, 'No call') for s in samples])
      palette = [colors.get(c, 'rgba(128,128,128,0.5)') for c in classes]
      scale = []
      for i, c in enumerate(palette):
          scale.append([i / len(palette), c])
          scale.append([(i + 1) / len(palette), c])
      fig = go.Figure(go.Heatmap(z=z, x=samples, y=labels, text=text, zmin=0, zmax=len(classes) - 1, colorscale=scale, showscale=False, xgap=3, ygap=3, hovertemplate='%{y}<br>%{x}: %{text}<extra></extra>'))
      for c in classes:
          fig.add_trace(go.Scatter(x=[None], y=[None], mode='markers', marker=dict(size=10, symbol='square', color=colors.get(c)), name=c))
      fig.update_yaxes(autorange='reversed', automargin=True)
      fig.update_xaxes(side='top', automargin=True)
      fig.update_layout(margin=dict(t=10), legend_title_text='', legend=dict(orientation='h', y=-0.08))
    section: Why they rank, and who carries them
    tag: rd-rk-genotype-grid
    index: rk-genotype-grid
    title: Genotypes of the 20 best variants
    description: One row per variant in rank order, one column per sample, coloured by zygosity (homozygous
      reference, heterozygous, homozygous alternate, half call, no call).
    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: advanced_viz
    workflow_tag: raredisease
    data_collection_tag: ranked_variants
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: rd-rk-top-candidates
      default_record_by: rank_score
      id_col: variant_key
      title_col: variant_key
      selection_source: table_selection
      sections:
        Variant:
        - gene
        - consequence
        - impact
        - hgvs_c
        - hgvs_p
        - variant_type
        Ranking:
        - rank_score
        - rank_score_norm
        - model_class
        - genetic_models
        - de_novo
        - variant_set
        Frequency and scores:
        - gnomad_af
        - gnomad_af_popmax
        - cadd
        - pli
        - sift
        - polyphen
        Carriers:
        - n_carriers
        - carriers
        - qual
        - filter_status
      link_templates:
        gene: https://www.genecards.org/cgi-bin/carddisp.pl?gene={value}
    section: Top candidates
    tag: rd-rk-variant-record
