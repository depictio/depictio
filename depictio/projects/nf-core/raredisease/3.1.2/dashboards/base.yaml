version: 1
# nf-core/raredisease 3.1.2, on the family rules of depictio/projects/nf-core/RULES.md
# (ampliseq/2.18.0 is the reference implementation).
#
# Funnel: the MultiQC report, the per-sample alignment numbers MultiQC does not join
# (Alignment), whether the samples are the family the pedigree says (Family), all in
# Data & QC -> how many calls each sample yields (Callset) -> which variants the
# ranking puts first and which inheritance model they fit (Ranked) -> the
# mitochondrial calls (Mitochondria) -> repeat expansions, mobile elements and SMN
# copy number (Repeats) -> what the calls and alignments show at one locus (Locus).
# The Overview leads with the ranking: the top candidate, the rank order of the best
# variants and who carries them.
# The sample hub (`samples`, one row per sample) is what every filter starts from: the
# template's links carry a pick on a sample, a role or a family to every per-sample
# collection. The group column of this template is `role` (proband, father, mother),
# read from the pedigree, so no group variable appears below.
#
# Routes: the pedigree is optional (without it the hub keys on the QC and callset
# samples and every role reads Other); the mitochondrial, repeat expansion, mobile
# element and SMN collections are optional, so the Mitochondria and Repeats tabs, their
# pipeline steps and the sections that read them are pruned at import when a run took
# none of those branches; the genome browser reads the files it finds (or TRACKS_URI).
main_dashboard:
  title: nf-core/raredisease
  subtitle: Rare disease analysis of a family, from the alignment to the ranked variants
  project_tag: Rare Disease Family Analysis
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  category_colors:
    role: auto
    status:
      Affected: '#e03131'
      Unaffected: '#1c7ed6'
      Unknown: '#adb5bd'
    sample: auto
    variant_type:
      SNP: '#1c7ed6'
      INDEL: '#7048e8'
      MNP: '#0ca678'
      SV: '#f08c00'
    mutation_class:
      transition: '#1c7ed6'
      transversion: '#e8590c'
    impact:
      HIGH: '#e03131'
      MODERATE: '#f08c00'
      LOW: '#1c7ed6'
      MODIFIER: '#adb5bd'
    model_class:
      Compound heterozygous: '#7048e8'
      Recessive: '#f08c00'
      Dominant: '#1c7ed6'
      X-linked: '#0ca678'
      No model fits: '#adb5bd'
    variant_set:
      Clinical: '#e03131'
      Research only: '#868e96'
    gt_class:
      Hom ref: '#ced4da'
      Het: '#1c7ed6'
      Hom alt: '#e03131'
      Half call: '#f08c00'
      No call: '#868e96'
    genetic_model:
      AR_comp: '#7048e8'
      AR_hom: '#f08c00'
      AD: '#1c7ed6'
      XR: '#0ca678'
      XD: '#0ca678'
    contig_class:
      autosome: '#1c7ed6'
      X: '#7048e8'
      Y: '#0ca678'
      mitochondrion: '#f08c00'
      other: '#adb5bd'
    heteroplasmy_class:
      Homoplasmic: '#1c7ed6'
      Heteroplasmic: '#f08c00'
      Low level: '#adb5bd'
    repeat_status:
      Pathogenic range: '#e03131'
      Intermediate: '#f08c00'
      Normal: '#2f9e44'
      No call: '#adb5bd'
    me_type:
      ALU: '#1c7ed6'
      L1: '#7048e8'
      SVA: '#0ca678'
      HERV: '#f08c00'
      Other: '#adb5bd'
    check_status:
      Consistent: '#2f9e44'
      Check: '#e03131'
      Too few sites: '#f08c00'
      Not checked: '#adb5bd'
    sex_check:
      Match: '#2f9e44'
      Mismatch: '#e03131'
      Not tested: '#adb5bd'
    smn_status:
      No call: '#adb5bd'
      Not a carrier: '#2f9e44'
      Carrier: '#f08c00'
      SMA: '#e03131'
    filter_label:
      '*': auto
      PASS: '#2f9e44'
    filter_status:
      '*': auto
      PASS: '#2f9e44'
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    description: The run in four numbers. The filters here narrow these four only.
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
  - name: Findings
    icon: mdi:star-outline
    color: gray
    description: What the data says, each with the tab that shows it, then the figures behind it.
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    description: The tabs by group, each with the question it answers.
    appearance: plain
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: One row per sample, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
  components:
  - component_type: interactive
    workflow_tag: raredisease
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: role
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: Role
    section: Key figures
    tag: rd-ov-kf-role
    index: ov-kf-role
    title: Role
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: raredisease
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: rd-ov-kf-sample
    index: ov-kf-sample
    title: Sample
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: text
    title: nf-core/raredisease
    logo: https://raw.githubusercontent.com/nf-core/raredisease/master/docs/images/nf-core-raredisease_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/raredisease/master/docs/images/nf-core-raredisease_logo_dark.png
    order: 1
    body: >
      Rare disease analysis of a family: how the reads aligned, whether the samples fit the pedigree,
      and which ranked variants fit an inheritance model. [Run parameters](params:)
    tag: rd-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  # The study: the pedigree the run was started on. Each line cites the sample hub,
  # so a line goes with its data.
  - component_type: text
    surface: card
    values:
      n_fam: {dc: samples, column: family_id, aggregation: nunique, format: integer}
      n_samples: {dc: samples, column: sample, aggregation: nunique, format: integer}
      n_aff: {dc: samples, column: sample, aggregation: nunique, filter_expr: "col('status') == 'Affected'", format: integer}
      n_trios: {dc: samples, column: sample, aggregation: nunique, filter_expr: "(col('role') == 'Proband') & col('father').is_not_null() & col('mother').is_not_null()", format: integer}
      n_female: {dc: samples, column: sample, aggregation: nunique, filter_expr: "col('sex') == 'Female'", format: integer}
      n_male: {dc: samples, column: sample, aggregation: nunique, filter_expr: "col('sex') == 'Male'", format: integer}
    body: |
      ### The study
      - ![](icon:mdi:family-tree) **Families** {{n_fam}}, each analysed against its pedigree
      - ![](icon:mdi:test-tube) **Samples** {{n_samples}} sequenced, {{n_aff}} of them affected
      - ![](icon:mdi:account-multiple-outline) **Trios** {{n_trios}} probands with both parents in the run
      - ![](icon:mdi:gender-male-female) **Sex** {{n_female}} female and {{n_male}} male, as the pedigree declares
      - ![](icon:mdi:file-table-outline) **Samplesheet** [one row per sample](section:Sample sheet), its path in [the run parameters](params:input)
    tag: rd-ov-study
    index: ov-study
    layout: {x: 0, y: 1, w: 5, h: 4}
  - component_type: text
    surface: card
    body: |
      ### The run
      - ![](icon:mdi:source-branch) **Pipeline** nf-core/raredisease 3.1.2
      - ![](icon:mdi:dna) **Reference** {{param:genome}}, {{param:analysis_type}}
      - ![](icon:mdi:align-horizontal-left) **Aligner** {{param:aligner}}
      - ![](icon:mdi:magnify-scan) **Calling** {{param:variant_caller}}
      - ![](icon:mdi:tag-outline) **VEP cache** {{param:vep_cache_version}}
      - ![](icon:mdi:skip-next-outline) **Skipped** {{param:skip_tools}}
    tag: rd-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 4}
  - component_type: text
    surface: card
    accent: teal
    values:
      n_reads: {dc: alignment_qc, column: total_reads, aggregation: sum, format: si}
      n_pass: {dc: vcf_callset_summary, column: pass_calls, aggregation: sum, format: si}
      n_ranked: {dc: ranked_variants, column: variant_key, aggregation: count, format: si}
      n_mt: {dc: mt_variants, column: variant_key, aggregation: count, format: integer}
      n_rep: {dc: repeat_expansions, column: variant_key, aggregation: count, format: integer}
    body: |
      ### Six steps from reads to ranked variants
      Each step names its settings and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:align-horizontal-left) **Align** {{param:aligner}} maps {{n_reads}} reads and Picard marks the duplicates · [Settings](params:aligner) · [Alignment](tab:Alignment)
      2. ![](icon:mdi:magnify-scan) **Call** each sample is called, then the family is genotyped together, {{n_pass}} PASS calls · [Settings](params:variant_caller) · [Callset](tab:Callset)
      3. ![](icon:mdi:sort-numeric-descending) **Rank** VEP annotates and GENMOD ranks {{n_ranked}} variants against the pedigree · [Settings](params:vep_cache_version) · [Ranked](tab:Ranked)
      4. ![](icon:mdi:atom) **Mitochondria** the mitochondrial branch calls {{n_mt}} variants with their heteroplasmy · [Settings](params:mt_aligner) · [Mitochondria](tab:Mitochondria)
      5. ![](icon:mdi:repeat) **Repeats** ExpansionHunter genotypes {{n_rep}} repeat calls against the disease catalogue · [Settings](params:variant_catalog) · [Repeats](tab:Repeats)
      6. ![](icon:mdi:file-document-outline) **Report** MultiQC gathers FastQC, fastp, Picard and mosdepth · [Settings](params:skip_tools) · [MultiQC](tab:MultiQC)
      :::
    tag: rd-ov-steps
    index: ov-steps
    layout: {x: 0, y: 5, w: 8, h: 2}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/raredisease aligns the reads of a family, calls small variants, annotates them with VEP and ranks them with GENMOD against the pedigree. Mitochondrial, repeat expansion and mobile element calls follow their own branches. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The sample filters in the left panel apply to every tab: narrow the samples, the role or the family once and the whole dashboard follows. A bar above a section narrows that section only.

      The pedigree and the family findings below name each individual by its role (the proband is the affected child the family is analysed for), with its sex and whether it is affected.

      Provenance: every setting and tool version on this page is read from the run's own `params.json` and software-versions report, and every number from the files the run wrote.
    tag: rd-ov-about
    index: ov-about
    layout: {x: 0, y: 7, w: 8, h: 3}
  - component_type: card
    workflow_tag: raredisease
    data_collection_tag: samples
    aggregation: nunique
    column_name: sample
    column_type: object
    secondary_layout: composition
    breakdown_col: role
    display:
      icon_name: mdi:account-group
      icon_color: orange
      caption: sequenced, by role
      link: tab:Family
    section: Key figures
    tag: rd-ov-kf-samples
    index: ov-kf-samples
    title: Samples
    description: Samples of the family. The bar splits them by role.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: raredisease
    data_collection_tag: samples
    aggregation: median
    column_name: mean_coverage
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:layers-outline
      icon_color: blue
      caption: median per sample, with the spread (x)
      link: tab:Alignment
      decimals: 1
    section: Key figures
    tag: rd-ov-kf-coverage
    index: ov-kf-coverage
    title: Mean coverage
    description: Mean depth over the reference, per sample. The box shows the spread across samples.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: raredisease
    data_collection_tag: ranked_variants
    aggregation: max
    column_name: rank_score
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:trophy-outline
      icon_color: yellow
      caption: rank scores, how they spread
      link: tab:Ranked
      decimals: 0
    section: Key figures
    tag: rd-ov-kf-top
    index: ov-kf-top
    title: Top rank score
    description: The highest GENMOD rank score among the variants in scope. The histogram shows how the
      other scores spread.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: raredisease
    data_collection_tag: ranked_variants
    aggregation: count
    column_name: variant_key
    column_type: object
    secondary_layout: composition
    breakdown_col: model_class
    filter_expr: col('is_clinical') == True
    display:
      icon_name: mdi:alert-decagram-outline
      icon_color: red
      caption: clinical variants, by inheritance model
      link: tab:Ranked
      format: integer
    section: Key figures
    tag: rd-ov-kf-clinical
    index: ov-kf-clinical
    title: Clinical variants
    description: Ranked variants in the clinical set, the gene list the run was given. The bar splits
      them by inheritance model.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: interactive
    workflow_tag: raredisease
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: role
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: Role
    section: Findings
    tag: rd-ov-findings-role
    index: ov-findings-role
    title: Role
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: raredisease
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Sample
    section: Findings
    tag: rd-ov-findings-sample
    index: ov-findings-sample
    title: Sample
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: text
    surface: card
    values:
      top_label: {dc: ranked_variants, column: call_label, aggregation: top, weight: rank_score}
      top_gene: {dc: ranked_variants, column: gene, aggregation: top, weight: rank_score}
      top_score: {dc: ranked_variants, column: rank_score, aggregation: max, format: 'decimals:0'}
      score_max: {dc: ranked_variants, column: rank_score_max, aggregation: max, format: 'decimals:0'}
      n_fit: {dc: ranked_variants, column: variant_key, aggregation: count, filter_expr: col('model_class')
          != 'No model fits', format: si}
      n_clin: {dc: ranked_variants, column: variant_key, aggregation: count, filter_expr: col('is_clinical')
          == True, format: integer}
      ibs0: {dc: family_checks, column: ibs0_pct, aggregation: median, filter_expr: col('relation') ==
          'Parent-child', format: 'decimals:2'}
      cov: {dc: samples, column: mean_coverage, aggregation: median, format: 'decimals:1'}
      n_pass: {dc: samples, column: pass_calls, aggregation: median, format: si}
      tstv: {dc: samples, column: ts_tv, aggregation: median, format: 'decimals:2'}
    body: |
      - **{{top_label}}** leads the ranking with a rank score of {{top_score}} out of {{score_max}} – the table below lists the next ones [Ranked](tab:Ranked)
      - The best-ranked gene is [{{top_gene}}](locus:{{top_gene}}): its variants and the family's reads in the genome browser
      - **{{n_fit}}** ranked variants fit an inheritance model – the clinical set holds {{n_clin}} [Ranked](tab:Ranked)
      - **{{ibs0}}%** of the shared sites are opposite homozygous between parent and child at the median – a low value fits the pedigree [Family](tab:Family)
      - **{{n_pass}}** PASS calls per sample at the median – Ts/Tv {{tstv}} (about 2.0 to 2.1 is expected for a genome, 2.8 to 3.0 for an exome), {{cov}}x median mean coverage [Callset](tab:Callset)
    section: Findings
    tag: rd-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: highlight
    section: Findings
    source_tab: Ranked
    source_component: rk-genotype-grid
    caption: The genotype each individual has at the 20 best-scoring variants, coloured by zygosity; grey is homozygous reference.
    tag: rd-ov-hl-genotypes
    index: ov-hl-genotypes
    layout: {x: 4, y: 6, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Family
    source_component: fam-pedigree
    caption: The family as the sample sheet states it; squares are males, circles females, filled marks affected.
    tag: rd-ov-hl-family
    index: ov-hl-family
    layout: {x: 0, y: 6, w: 4, h: 4}
  # The ranked variants along the genome, opened on the position they sit at: a
  # click opens the Locus tab's browser on the variant, so the Overview needs no
  # browser of its own.
  - component_type: advanced_viz
    workflow_tag: raredisease
    data_collection_tag: ranked_variants
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      chr_col: chrom
      pos_col: pos
      score_col: rank_score
      feature_col: gene
      category_col: model_class
      mark: point
      point_size: 9
      top_stars: 3
      hover_cols: [ref, alt, consequence, hgvs_p, gnomad_af, cadd, carriers]
      score_title: Rank score
      assembly: '{GENOME}'
      region_filter_enabled: false
      click_opens_browser: true
      open_on_data: true
    section: Findings
    tag: rd-ov-genome
    index: ov-genome
    title: Ranked variants along the genome
    link: tab:Locus
    description: Each dot is a ranked variant, its height the rank score and its colour the inheritance model it fits; stars mark the three best. Click a dot to open the variant in the genome browser.
    layout: {x: 0, y: 10, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: raredisease
    data_collection_tag: ranked_variants
    viz_kind: ranked_table
    config:
      viz_kind: ranked_table
      title_col: gene
      subtitle_col: hgvs_p
      score_col: rank_score
      descending: true
      columns:
      - {column: model_class, label: Model, display: badge}
      - {column: impact, label: Impact, display: badge}
      - {column: rank_score, label: Rank score, display: bar, decimals: 0, max_from: rank_score_max, min_from: rank_score_min}
      labels:
        consequence: Consequence
        hgvs_c: Coding change
        gnomad_af: gnomAD AF
        cadd: CADD
        pli: pLI
        chrom: Chromosome
        pos: Position
        ref: Ref
        alt: Alt
        n_carriers: Carriers
        variant_set: Variant set
      popover_columns: [consequence, hgvs_c, variant_set, gnomad_af, cadd, pli, chrom, pos, ref, alt, n_carriers]
      top_n: 8
      medals: true
      selection_enabled: true
      selection_column: variant_key
      family_dc_tag: samples
      family_individual_col: sample
      family_father_col: father
      family_mother_col: mother
      family_sex_col: sex
      family_status_col: status
      family_proband_col: role
      family_label_col: role
      genotypes_dc_tag: ranked_genotypes
      genotypes_key_col: variant_key
      genotypes_row_col: variant_key
      genotypes_individual_col: sample
      genotypes_genotype_col: gt_class
      genotypes_missing_as: ref
      family_open: false
    link: tab:Ranked
    section: Findings
    tag: rd-ov-top-candidates
    index: ov-top-candidates
    title: Top candidates
    description: The eight best-ranked variants. The rank score bar runs from the lowest to the highest score
      the family's pedigree allows (GENMOD scores are signed, a negative one is evidence against the variant),
      and the number reads score / highest possible. Hover a row for its annotation; the Ranked tab holds the
      full list, why each one ranks and the record of a picked variant.
    layout: {x: 0, y: 2, w: 8, h: 4}
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Alignment](tab:Alignment)
      - [Family](tab:Family)

      ### Variants
      - [Callset](tab:Callset)
      - [Ranked](tab:Ranked)
      - [Mitochondria](tab:Mitochondria)
      - [Repeats](tab:Repeats)
      - [Locus](tab:Locus)
    section: How to read this dashboard
    tag: rd-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: interactive
    workflow_tag: raredisease
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: role
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: rd-sample-filters-role
    index: sample-filters-role
    title: Role
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: raredisease
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: rd-sample-filters-sample
    index: sample-filters-sample
    title: Sample
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: raredisease
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: family_id
    column_type: object
    display:
      icon_name: mdi:family-tree
      custom_color: pink
    section: Sample filters
    group: Sample scope
    tag: rd-sample-filters-family
    index: sample-filters-family
    title: Family
    layout: {x: 0, y: 5, w: 1, h: 2}
  - component_type: table
    workflow_tag: raredisease
    data_collection_tag: samples
    columns: [sample, family_id, role, status, sex, sex_check, aligned_pct, duplication_pct, mean_coverage,
      pass_calls, ts_tv, ranked_carried, clinical_carried, parent_check]
    row_selection_enabled: true
    row_selection_column: sample
    section: Sample sheet
    tag: rd-sample-sheet
    index: sample-sheet
    title: Samples
    description: One row per sample, with its pedigree, alignment, coverage and callset numbers.
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
- title: MultiQC
  subtitle: What does the MultiQC report say about reads and alignments?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Report scope
    icon: mdi:tune
    color: orange
    description: Narrow the MultiQC panels to selected report rows
  grid_sections:
  - name: Library QC
    icon: mdi:file-document-outline
    color: orange
    description: Library statistics, read counts and filtering
  - name: Alignment and coverage
    icon: mdi:chart-box-outline
    color: orange
    description: Alignment, duplicates, insert size and the coverage histogram
  - name: Read quality
    icon: mdi:chart-line
    color: orange
    description: Base quality and adapter content along the reads
    collapsed: true
  - name: Depth per contig
    icon: mdi:chart-bar
    color: orange
