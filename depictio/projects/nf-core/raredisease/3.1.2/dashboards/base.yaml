    column_type: object
    display:
      icon_name: mdi:repeat
      custom_color: red
    section: Repeats scope
    group: Repeats
    tag: rd-rp-status-filter
    index: rp-status-filter
    title: Repeat status
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: raredisease
    data_collection_tag: mobile_elements
    interactive_component_type: MultiSelect
    column_name: me_type
    column_type: object
    display:
      icon_name: mdi:content-duplicate
      custom_color: cyan
    section: Repeats scope
    group: Repeats
    tag: rd-rp-me-filter
    index: rp-me-filter
    title: Element family
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: raredisease
    data_collection_tag: repeat_expansions
