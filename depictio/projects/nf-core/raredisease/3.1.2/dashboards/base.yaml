- title: Family
  subtitle: Are the samples the family the pedigree says they are?
  tab_group: Data & QC
  tab_order: 3
  tab_icon: mdi:family-tree
  tab_icon_color: pink
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Family scope
    icon: mdi:filter-variant
    color: pink
    description: These picks narrow the pair checks; the pedigree draws every
      sample in scope
  grid_sections:
  - name: Family at a glance
    icon: mdi:counter
    color: pink
    description: Samples, the parent-child check, the sex check and the relatedness estimates
  - name: Pedigree and pair checks
    icon: mdi:family-tree
    color: pink
    description: The family as the sample sheet states it, beside how far apart every pair sits
  - name: Family tables
    icon: mdi:table
    color: gray
    description: The pair checks behind the chart
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      The pedigree comes from the sample sheet; the pair checks come from the family callset itself. IBS0
      is the share of shared sites where two samples carry opposite homozygous genotypes: close to zero
      between a parent and child, higher between unrelated people. Read the estimates with care at low
      depth.
    tag: rd-fam-intro
    index: fam-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: raredisease
    data_collection_tag: family_checks
    interactive_component_type: MultiSelect
    column_name: relation
    column_type: object
    display:
      icon_name: mdi:link-variant
      custom_color: lime
    section: Family scope
    group: Family
    tag: rd-fam-relation-filter
    index: fam-relation-filter
    title: Relation
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: raredisease
    data_collection_tag: family_checks
    interactive_component_type: MultiSelect
    column_name: check_status
    column_type: object
    display:
      icon_name: mdi:check-decagram-outline
      custom_color: green
    section: Family scope
    group: Family
    tag: rd-fam-status-filter
    index: fam-status-filter
    title: Pair check
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: raredisease
    data_collection_tag: samples
    aggregation: count
    column_name: sample
    column_type: object
    secondary_layout: composition
    breakdown_col: status
    display:
      icon_name: mdi:account-group
      icon_color: pink.4
      caption: samples, by affected status
      format: integer
    section: Family at a glance
    tag: rd-fam-card-samples
    index: fam-card-samples
    title: Samples
    description: Samples in scope, one row each. The bar splits them by affected status.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: raredisease
    data_collection_tag: family_checks
    aggregation: median
    column_name: ibs0_pct
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    filter_expr: col('relation') == 'Parent-child'
    display:
      icon_name: mdi:swap-horizontal
      icon_color: pink.6
      caption: median per pair, with the spread (%)
      decimals: 2
    section: Family at a glance
    tag: rd-fam-card-ibs0
    index: fam-card-ibs0
    title: Parent-child IBS0
    description: Opposite homozygous sites between a parent and child, in percent of the shared sites.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: raredisease
    data_collection_tag: samples
    aggregation: count
    column_name: sample
    column_type: object
    secondary_layout: composition
    breakdown_col: sex_check
    display:
      icon_name: mdi:gender-male-female
      icon_color: pink.8
      caption: samples, by sex check result
      format: integer
    section: Family at a glance
    tag: rd-fam-card-sex
    index: fam-card-sex
    title: Sex check
    description: Samples whose stated sex was compared with the sex inferred from the X and Y depth.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: raredisease
    data_collection_tag: family_checks
    aggregation: median
    column_name: relatedness
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:vector-link
      icon_color: pink.9
      caption: pair estimates, how they spread
      decimals: 2
    section: Family at a glance
    tag: rd-fam-card-relatedness
    index: fam-card-relatedness
    title: Relatedness
    description: Pairwise relatedness estimated from the callset, one value per pair and direction.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: raredisease
    data_collection_tag: samples
    viz_kind: pedigree
    config:
      viz_kind: pedigree
      individual_col: sample
      father_col: father
      mother_col: mother
      sex_col: sex
      status_col: status
      family_col: family_id
      label_col: role
      selection_enabled: true
      selection_column: sample
    section: Pedigree and pair checks
    tag: rd-fam-pedigree
    index: fam-pedigree
    title: Pedigree
    description: Squares are males, circles females; a filled mark is an affected sample, an open one
      unaffected. A click on a sample narrows the dashboard to it.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: figure
    workflow_tag: raredisease
    data_collection_tag: family_checks
    visu_type: bar
    mode: code
    code_content: |-
      # One bar per pair of samples: the share of shared sites with opposite homozygous genotypes.
      colors = depictio_category_colors.get('check_status') or {}
      d = df.filter(pl.col('sample') < pl.col('partner')).with_columns((pl.col('sample').str.slice(0, 10) + pl.lit(' / ') + pl.col('partner').str.slice(0, 10)).alias('pair'))
      fig = px.bar(d.to_pandas(), x='ibs0_pct', y='pair', color='check_status', orientation='h', color_discrete_map=colors, hover_data=['sample', 'partner', 'relation', 'shared_sites'], labels={'ibs0_pct': 'Opposite homozygous sites (% of shared)', 'pair': '', 'check_status': ''})
      fig.update_layout(margin=dict(t=10), legend_title_text='', legend=dict(orientation='h', y=-0.3))
      fig.update_yaxes(automargin=True)
    section: Pedigree and pair checks
    tag: rd-fam-pair-checks
    index: fam-pair-checks
    title: Opposite homozygous sites per pair
    description: One bar per pair of samples, coloured by the verdict of its parent-child check. A parent
      and child sit near zero.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: table
    workflow_tag: raredisease
    data_collection_tag: family_checks
    columns: [sample, partner, relation, shared_sites, ibs0, ibs0_pct, identical_pct, relatedness, check_status]
    row_selection_enabled: true
    row_selection_column: sample
    section: Family tables
    tag: rd-fam-table-checks
    index: fam-table-checks
    title: Pair checks
    description: Shared sites, opposite homozygous sites and relatedness for every pair, in both directions.
    layout: {x: 0, y: 0, w: 8, h: 6}
