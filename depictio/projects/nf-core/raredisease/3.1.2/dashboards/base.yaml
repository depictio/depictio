  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Repeats scope
    icon: mdi:filter-variant
    color: red
    description: These picks narrow the repeat calls and the mobile elements
  grid_sections:
  - name: Repeats at a glance
    icon: mdi:counter
    color: red
    description: Repeat calls, pathogenic-range calls, mobile element insertions and SMN calls
  - name: Repeat counts
    icon: mdi:chart-scatter-plot
    color: red
