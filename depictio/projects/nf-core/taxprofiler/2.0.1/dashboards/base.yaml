- title: Sequencing depth
  subtitle: Did the sequencing reach enough of each metagenome?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:waves
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Depth filters
    icon: mdi:filter-variant
    color: cyan
    description: The libraries inside a coverage or diversity band
  grid_sections:
  - name: Depth at a glance
    icon: mdi:counter
    color: cyan
    description: The median library, from the Nonpareil model
  - name: Coverage curves
    icon: mdi:chart-line
    color: cyan
    description: Modelled coverage of each library as the sequencing effort grows
  - name: Coverage against diversity
    icon: mdi:chart-scatter-plot
    color: cyan
    description: Which libraries are most short of depth for how diverse they are
  - name: Tables
    icon: mdi:table
    color: gray
    description: Nonpareil's statistics for every library
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [Nonpareil](https://nonpareil.readthedocs.io) turns read redundancy into the share of the
      metagenome each library covers, redrawn here from its fitted model. A curve still climbing at
      the effort sequenced means the classifiers worked from an incomplete view. The scatter shows
      which libraries are most short of depth.
    tag: tp-depth-intro
    index: depth-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: taxprofiler
    data_collection_tag: nonpareil_summary
    interactive_component_type: RangeSlider
    column_name: coverage
    column_type: float64
    display:
      icon_name: mdi:waves
      custom_color: cyan
    section: Depth filters
    tag: tp-depth-filter-coverage
    index: depth-coverage-filter
    title: Metagenome coverage
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: taxprofiler
    data_collection_tag: nonpareil_summary
    interactive_component_type: RangeSlider
    column_name: diversity
    column_type: float64
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: lime
    section: Depth filters
    tag: tp-depth-filter-diversity
    index: depth-diversity-filter
    title: Nonpareil diversity
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: taxprofiler
    data_collection_tag: nonpareil_summary
    use: nonpareil/summary
    aggregation: median
    column_name: coverage
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.95
    threshold_direction: min
    display:
      icon_name: mdi:waves
      icon_color: cyan
      caption: median; 95% is Nonpareil's target
      format: percent
    section: Depth at a glance
    tag: tp-depth-card-coverage
    index: depth-card-coverage
    title: Metagenome coverage
    description: Median share of the metagenome a library reaches.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: taxprofiler
    data_collection_tag: nonpareil_summary
    use: nonpareil/summary
    aggregation: median
    column_name: diversity
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: indigo
      caption: median, with its spread
      decimals: 1
    section: Depth at a glance
    tag: tp-depth-card-diversity
    index: depth-card-diversity
    title: Nonpareil diversity
    description: Median Nonpareil diversity index, on a natural-log scale.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: taxprofiler
    data_collection_tag: nonpareil_summary
    use: nonpareil/summary
    aggregation: median
    column_name: observed_effort
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:ruler
      icon_color: orange
      caption: median base pairs, with their distribution
    section: Depth at a glance
    tag: tp-depth-card-effort
    index: depth-card-effort
    title: Effort sequenced (bp)
    description: Median sequencing effort of a library, in base pairs.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: taxprofiler
    data_collection_tag: nonpareil_summary
    use: nonpareil/summary
    aggregation: median
    column_name: effort_multiple
    column_type: float64
    secondary_layout: threshold
    threshold_value: 1
    threshold_direction: max
    display:
      icon_name: mdi:chart-timeline-variant
      icon_color: red
      caption: median multiple of the effort; 1 or less has reached 95%
      decimals: 1
    section: Depth at a glance
    tag: tp-depth-card-missing
    index: depth-card-missing
    title: Depth still needed
    description: How many times deeper the median library would have to go for 95% coverage.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: taxprofiler
    data_collection_tag: nonpareil_curves
    use: nonpareil/coverage_curve
    config:
      log_x: true
      x_title: Sequencing effort (bp, log scale)
      y_title: Modelled coverage of the metagenome
      legend_pos: right
      line_width: 2.0
    section: Coverage curves
    tag: tp-depth-curve
    index: depth-coverage-curve
    title: Coverage against sequencing effort
    description: One curve per library. A curve still rising at the effort sequenced did not see the whole community.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: taxprofiler
    data_collection_tag: nonpareil_summary
    use: nonpareil/summary
    visu_type: scatter
    dict_kwargs:
      x: diversity
      y: coverage
      color: sample
      size: effort_multiple
      hover_name: library
      labels: {diversity: Nonpareil diversity, coverage: Metagenome coverage, sample: Sample, effort_multiple: Depth still needed}
    selection_enabled: true
    selection_column: library
    section: Coverage against diversity
    tag: tp-depth-scatter
    index: depth-coverage-diversity
    title: Coverage against diversity
    description: Point size is how many times deeper a library would have to go; big points bottom right are most short.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    workflow_tag: taxprofiler
    data_collection_tag: nonpareil_summary
    use: nonpareil/summary
    row_selection_enabled: true
    row_selection_column: library
    section: Tables
    tag: tp-depth-table
    index: depth-table
    title: Nonpareil per library
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Profiles
  subtitle: What does each classifier say the community is made of?
  tab_group: Communities
  tab_order: 3
  tab_icon: mdi:bacteria-outline
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Profile filters
    icon: mdi:filter-variant
    color: grape
    description: The classifiers, databases and lineages the composition tiles show
  grid_sections:
  - name: Profiles at a glance
    icon: mdi:counter
    color: grape
    description: What the classifiers named, and how their reads are spread
  - name: Composition
    icon: mdi:chart-bar
    color: grape
    description: One bar per classifier and database, at the rank picked in its settings
  - name: Lineage rings
    icon: mdi:chart-donut
    color: grape
    description: Krona rings, one wedge per classifier, from the domain outwards
  - name: Containment composition
    icon: mdi:chart-bar
    color: grape
    description: The community as sylph rebuilds it from genome containment
  - name: Genome copies
    icon: mdi:dna
    color: gray
    description: Melon counts genome copies in the long reads from marker genes
    collapsed: true
  - name: Profile tables
    icon: mdi:table
    color: gray
    description: The long cross-classifier table, its lineage copy and the sylph clades
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [taxpasta](https://taxpasta.readthedocs.io) standardises every classifier's profile into one
      table, so each bar below is one classifier and database, its taxa as shares of its assigned
      reads. Narrow the samples to one to read its runs side by side, and pick the rank in the
      composition's settings. sylph measures genome containment rather than classifying reads, so its
      composition is drawn apart.
    tag: tp-prof-intro
    index: prof-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_profiles
    interactive_component_type: MultiSelect
    column_name: profiler
    column_type: object
    display:
      icon_name: mdi:bacteria-outline
      custom_color: violet
    section: Profile filters
    group: Classifier
    tag: tp-prof-filter-profiler
    index: prof-profiler-filter
    title: Classifier
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_profiles
    interactive_component_type: MultiSelect
    column_name: database
    column_type: object
    display:
      icon_name: mdi:database-outline
      custom_color: indigo
    section: Profile filters
    group: Classifier
    tag: tp-prof-filter-database
    index: prof-database-filter
    title: Database
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_profiles
    interactive_component_type: RangeSlider
    column_name: rel_abundance
    column_type: float64
    display:
      icon_name: mdi:chart-donut
      custom_color: pink
    section: Profile filters
    group: Taxonomy
    tag: tp-prof-filter-abundance
    index: prof-abundance-filter
    title: Relative abundance
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_lineage
    interactive_component_type: MultiSelect
    column_name: superkingdom
    column_type: object
    display:
      icon_name: mdi:family-tree
      custom_color: grape
    section: Profile filters
    group: Taxonomy
    tag: tp-prof-filter-domain
    index: prof-domain-filter
    title: Domain
    layout: {x: 0, y: 9, w: 1, h: 3}
  # Melon's pooled table has no sample column, so this is the only filter that
  # reaches the Genome copies section.
  - component_type: interactive
    workflow_tag: taxprofiler
    data_collection_tag: melon_ranks
    interactive_component_type: MultiSelect
    column_name: phylum
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: lime
    section: Profile filters
    group: Taxonomy
    tag: tp-prof-filter-melon-phylum
    index: prof-melon-phylum-filter
    title: Melon phylum
    layout: {x: 0, y: 12, w: 1, h: 3}
  - component_type: card
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_profiles
    use: taxpasta/profiles
    aggregation: nunique
    column_name: name
    column_type: object
    filter_expr: col('rank') == 'species'
    secondary_layout: top_n
    breakdown_col: profiler
    display:
      icon_name: mdi:tag-outline
      icon_color: grape
      caption: distinct species, by classifier
    section: Profiles at a glance
    tag: tp-prof-card-species
    index: prof-card-species
    title: Species named
    description: Distinct species any classifier named, ranked by the classifier that named the most.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_profiles
    use: taxpasta/profiles
    aggregation: median
    column_name: count
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:counter
      icon_color: orange
      caption: median per taxon call, with its spread
      decimals: 0
    section: Profiles at a glance
    tag: tp-prof-card-counts
    index: prof-card-counts
    title: Reads per call
    description: Median reads or genome copies a classifier assigned to one taxon in one sample.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_profiles
    use: taxpasta/profiles
    aggregation: median
    column_name: rel_abundance
    column_type: float64
    filter_expr: col('rank') == 'unclassified'
    secondary_layout: histogram
    display:
      icon_name: mdi:alert-circle-outline
      icon_color: gray
      caption: median share per run, with its distribution
      format: percent
    section: Profiles at a glance
    tag: tp-prof-card-unclassified
    index: prof-card-unclassified
    title: Unclassified share
    description: Median share of a run's reads the classifier could not place, for those that report it.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_profiles
    use: taxpasta/profiles
    aggregation: max
    column_name: rel_abundance
    column_type: float64
    filter_expr: col('rank') != 'unclassified'
    secondary_layout: top_n
    breakdown_col: profiler
    display:
      icon_name: mdi:chart-donut
      icon_color: indigo
      caption: the most dominant taxon, by classifier
      format: percent
    section: Profiles at a glance
    tag: tp-prof-card-dominant
    index: prof-card-dominant
    title: Largest share
    description: The largest share one named taxon holds in a run, by classifier; unclassified reads left out.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Species and top 8, the eight the species colours were given to. Species,
  # not genus: kraken-style profiles hold direct counts, so their genus rows
  # keep only the reads that stopped at a genus (one genus filled the bar), and
  # classifiers that report species only drew no genus bar at all.
  # The bar labels name the classifier, so no annotation strip.
  - component_type: advanced_viz
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_profiles
    use: taxpasta/stacked_taxonomy
    config:
      default_rank: species
      top_n: 8
      sort_by: abundance
      normalise_to_one: true
    section: Composition
    tag: tp-prof-stacked
    index: prof-composition
    title: Community composition per profiling run
    description: Each run's assigned reads at species, the eight largest and the rest as Other; the rank is in the settings.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_lineage
    use: taxpasta/lineage_sunburst
    config:
      # Krona's reading, one wedge per classifier: the profiler becomes the
      # innermost ring and the NCBI ranks fan out from it, so the same phylum
      # keeps one colour in every classifier's wedge.
      rank_cols: [profiler, superkingdom, phylum, class, order, family, genus, species]
      max_depth: 4
      palette: tab20
      colour_by_rank: phylum
      show_counts: true
      min_percent: 0
    section: Lineage rings
    tag: tp-prof-krona
    index: prof-krona
    title: Krona rings per classifier
    description: One wedge per classifier, then its domains, phyla and classes; the ring pickers move deeper.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: taxprofiler
    data_collection_tag: sylph_profile
    use: sylph/stacked_taxonomy
    config:
      default_rank: genus
      top_n: 8
      sort_by: abundance
      normalise_to_one: true
    section: Containment composition
    tag: tp-prof-sylph-stacked
    index: prof-sylph-composition
    title: sylph composition
    description: Relative abundance from genome containment, the eight largest taxa and Other.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: taxprofiler
    data_collection_tag: melon_ranks
    use: melon/sunburst
    config:
      rank_cols: [superkingdom, phylum, class, order, family, genus, species]
      max_depth: 4
      palette: tab20
      colour_by_rank: phylum
      min_percent: 0
    section: Genome copies
    tag: tp-prof-melon-sunburst
    index: prof-melon-sunburst
    title: Melon genome-copy hierarchy
    description: Ring size is the share of estimated genome copies, four ranks from the domain outwards.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: taxprofiler
    data_collection_tag: melon_ranks
    use: melon/ranks
    visu_type: bar
    dict_kwargs:
      x: copy_number
      y: species
      color: phylum
      orientation: h
      labels: {copy_number: Estimated genome copies, species: '', phylum: Phylum}
    section: Genome copies
    tag: tp-prof-melon-copies
    index: prof-melon-copies
    title: Estimated copies per species
    description: The lineages melon estimated the most genome copies for.
    layout: {x: 0, y: 6, w: 8, h: 4}
  - component_type: table
    workflow_tag: taxprofiler
    data_collection_tag: melon_ranks
    use: melon/ranks
    row_selection_enabled: true
    row_selection_column: species
    section: Genome copies
    tag: tp-prof-melon-table
    index: prof-melon-table
    title: Melon lineages
    layout: {x: 0, y: 10, w: 8, h: 6}
  - component_type: table
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_profiles
    use: taxpasta/profiles
    row_selection_enabled: true
    row_selection_column: name
    section: Profile tables
    tag: tp-prof-table-profiles
    index: prof-table-profiles
    title: Cross-classifier abundances
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_lineage
    use: taxpasta/lineage
    row_selection_enabled: true
    row_selection_column: name
    section: Profile tables
    tag: tp-prof-table-lineage
    index: prof-table-lineage
    title: Cross-classifier lineages
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: table
    workflow_tag: taxprofiler
    data_collection_tag: sylph_profile
    use: sylph/profile
    row_selection_enabled: true
    row_selection_column: clade_name
    section: Profile tables
    tag: tp-prof-table-sylph
    index: prof-table-sylph
    title: sylph clade abundances
    layout: {x: 0, y: 12, w: 8, h: 6}
- title: Diversity
  subtitle: How diverse is each profile, by each classifier?
  tab_group: Communities
  tab_order: 4
  tab_icon: mdi:chart-bell-curve
  tab_icon_color: lime
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Diversity filters
    icon: mdi:filter-variant
    color: lime
    description: The classifiers, and the profiles inside a richness or evenness band
  grid_sections:
  - name: Diversity at a glance
    icon: mdi:counter
    color: lime
    description: The median of each index over the profiling runs in view
  - name: Richness and diversity
    icon: mdi:chart-scatter-plot
    color: lime
    description: Taxa observed against Shannon diversity, one point per profiling run
  - name: Diversity by run
    icon: mdi:chart-bell-curve
    color: lime
    description: Each run's diversity and top-taxon share, sample by classifier
  - name: Profile concentration
    icon: mdi:chart-line
    color: lime
    description: How much of each profile its most abundant taxa hold
  - name: Tables
    icon: mdi:table
    color: gray
    description: Richness, diversity, evenness and top-taxon share per profiling run
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      Diversity of each profiling run, computed from its [taxpasta](https://taxpasta.readthedocs.io)
      profile, so one sample gets one value per classifier. Spread between the runs of one sample is
      classifier disagreement, not biology. The curves show how much of each profile its most
      abundant taxa hold.
