    config:
      row_annotation_cols:
      - rank
      cluster_rows: true
      cluster_cols: true
      cluster_method: ward
      cluster_metric: correlation
      normalize: row_z
    section: Taxon by run matrix
    tag: tp-conc-heatmap
    index: conc-heatmap
    title: Taxon by run heatmap
