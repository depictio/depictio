# ============================================================== Concordance
- title: Concordance
  subtitle: Where the classifiers agree, and where each one is on its own
  tab_order: 2
  tab_icon: mdi:graph-outline
  tab_icon_color: indigo
  workflow_system: none
  filter_sections:
  - name: Ordination scope
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Which classifiers and platforms the ordination and the overlap tiles cover
  grid_sections:
  - name: Ordination
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Profiling runs that agree on the community land together
  - name: Shared taxa
    icon: mdi:set-merge
    color: teal
    description: How much of the community every classifier found, and how long its private tail is
  - name: Taxon by run matrix
    icon: mdi:chart-box-outline
    color: orange
    description: The top taxa clustered across every profiling run
    collapsed: true
  components:
  - component_type: text
    tag: tp-ord-intro
    section: Ordination
    title: One point per profiling run
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Bray-Curtis PCoA over the taxpasta profiles. Distance here is classifier
      disagreement, not biology: three mock communities profiled twelve ways
      should cluster by community, and anything that does not is a classifier
      artefact. Lasso a group of points to narrow the rest of the tab.
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_embedding
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: tp-av-pcoa
    section: Ordination
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_embedding
    use: taxpasta/profiler_embedding
    config:
      color_col: profiler
      show_density: false
    title: Bray-Curtis ordination
    description: Colour is the classifier; runs of the same community should sit together whatever profiled them.
    title_size: h3
    layout: {x: 0, y: 1, w: 4, h: 7}
  - component_type: figure
    tag: tp-fig-pcoa-select
    section: Ordination
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_embedding
    visu_type: scatter
    dict_kwargs:
      x: dim_1
      y: dim_2
      color: profiler
      symbol: platform
      custom_data: '["profiler_db"]'
      hover_name: sample_id
    selection_enabled: true
    selection_column: profiler_db
    title: Ordination with selection
    description: Same coordinates, with the point symbol carrying the platform. Box or lasso a set of runs to filter the tab.
    title_size: h3
    layout: {x: 4, y: 1, w: 4, h: 7}

  - component_type: text
    tag: tp-upset-intro
    section: Shared taxa
    title: Which taxa every classifier found
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each column is a set of classifiers and the bar is how many taxa exactly
      that set detected. The tallest bar on the far left is the agreed core;
      single-classifier columns are private tails, and a long one is usually a
      database difference rather than a discovery.
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_presence
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: tp-av-upset
    section: Shared taxa
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_presence
    use: taxpasta/profiler_upset
    config:
      sort_by: cardinality
      sort_order: descending
      # The set columns are the run's classifiers, discovered at ingest, so no
      # explicit list can be written in a generic template: the auto-detection
      # picks exactly the 0/1 columns. `degree`, not `set`, for the same reason
      # plotly-upset needs an explicit set_colors map in `set` mode.
      min_size: 2
      show_set_sizes: true
      color_intersections_by: degree
      default_annotation_cols:
      - taxon
    title: Classifier detection overlap
    description: Taxa shared by each combination of classifiers, for the samples selected in the left panel.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 8}
  - component_type: card
    tag: tp-card-core
    section: Shared taxa
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_presence
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: n_profilers
    column_type: int64
    display: {icon_name: 'mdi:set-merge', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Classifiers per taxon
    layout: {x: 0, y: 9, w: 2, h: 2}
  - component_type: card
    tag: tp-card-detections
    section: Shared taxa
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_presence
    aggregation: nunique
    column_name: taxon
    column_type: object
    secondary_layout: top_n
    breakdown_col: rank
    top_n_count: 4
    display: {icon_name: 'mdi:shape-outline', icon_color: '#8E44AD', title_color: '#8E44AD', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Detected taxa
    layout: {x: 2, y: 9, w: 2, h: 2}
  - component_type: card
    tag: tp-card-runs-ord
    section: Shared taxa
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_embedding
    aggregation: nunique
    column_name: sample_id
    column_type: object
    secondary_layout: donut
    breakdown_col: platform
    display: {icon_name: 'mdi:chart-scatter-plot', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Runs ordinated
    layout: {x: 4, y: 9, w: 2, h: 2}
  - component_type: card
    tag: tp-card-shared-frac
    section: Shared taxa
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_presence
    aggregation: max
    column_name: n_profilers
    column_type: int64
    secondary_layout: gauge
    coverage_max: 12
    display: {icon_name: 'mdi:check-decagram', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Widest agreement
    layout: {x: 6, y: 9, w: 2, h: 2}

  - component_type: text
    tag: tp-heat-intro
    section: Taxon by run matrix
    title: The same taxa, every classifier at once
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Rows are the most abundant taxa, columns are profiling runs, and the value
      is the taxon's share of that run. Row z-scores make the pattern readable
      across taxa whose absolute abundances differ by orders of magnitude.
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_matrix
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: tp-av-heatmap
    section: Taxon by run matrix
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_matrix
    use: taxpasta/concordance_heatmap
    config:
      row_annotation_cols:
      - rank
      cluster_rows: true
      cluster_cols: true
      cluster_method: ward
      cluster_metric: correlation
      normalize: row_z
    title: Taxon by run heatmap
    description: Top taxa clustered across every profiling run, with the rank as a row annotation and the classifier and platform on the column strips.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 10}

  - component_type: interactive
    tag: tp-filter-ord-profiler
    index: tp-ord-profiler-filter
    section: Ordination scope
    group: Ordination
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_embedding
    interactive_component_type: MultiSelect
    column_name: profiler
    column_type: object
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:bacteria-outline'}
    placement: left
    title: Classifier
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: tp-filter-ord-platform
    index: tp-ord-platform-filter
    section: Ordination scope
    group: Ordination
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_embedding
    interactive_component_type: SegmentedControl
    column_name: platform
    column_type: object
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:dna'}
    placement: left
    title: Platform
    layout: {x: 0, y: 3, w: 1, h: 2}
  - component_type: interactive
    tag: tp-filter-overlap
    index: tp-overlap-range
