  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Concordance filters
    icon: mdi:filter-variant
    color: indigo
    description: The classifiers, platforms, agreement levels and lineages in view
  grid_sections:
  - name: Concordance at a glance
    icon: mdi:counter
    color: indigo
    description: How many runs were compared, and how widely each taxon was found
  - name: Ordination
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Profiling runs that agree on the community land together
  - name: Shared taxa
    icon: mdi:set-merge
    color: indigo
    description: The taxa each set of classifiers found, and each one's private tail
  - name: Taxonomic flow
    icon: mdi:relation-many-to-many
