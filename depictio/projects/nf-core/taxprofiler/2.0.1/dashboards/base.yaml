  - component_type: figure
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    use: taxpasta/sample_summary
    visu_type: scatter
    dict_kwargs:
      x: taxa_observed
      y: shannon
      color: profiler
      symbol: platform
      labels: {taxa_observed: Taxa observed, shannon: Shannon diversity, profiler: Classifier, platform: Platform}
    selection_enabled: true
    selection_column: profiler_db
    section: Richness and diversity
    tag: tp-div-scatter
    index: div-richness-shannon
    title: Richness against diversity
    description: >-
      Each point is one profiling run, a classifier with its database on a sample: how many taxa it
      reported (horizontal) against its Shannon diversity (vertical). The point is coloured by classifier
      and its symbol is the sequencing platform.

      How to read: classifiers that report a long tail of rare taxa move right without moving up, and
      classifiers that spread reads evenly over many taxa move up as well. A run far from the others of
      its sample is worth opening. Click a point to select the run.

      Note: Shannon diversity uses the natural logarithm over the taxa with a positive abundance, and the
      taxa counted are every row the classifier reports, at any rank. Classifiers are therefore compared
      by how they report, not by the true richness.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    use: taxpasta/richness_dot_plot
    config:
      colour_scale: Plasma
      max_genes: 20
      gene_sort: mean
      max_dot_size: 26
    section: Diversity by run
    tag: tp-div-dot-plot
    index: div-dot-plot
    title: Diversity by sample and run
    description: >-
      Diversity per sample and profiling run. Each row is a classifier with its database and each column a
      sample; the dot colour is Shannon diversity and its size is the share the run's most abundant taxon
      holds.

      How to read: a small dot at the high end of the colour scale is a diverse profile with no dominant
      taxon, and a large dot at the low end is a profile dominated by one taxon. Compare the rows of one
      column to see classifier disagreement on one sample, and the dots along a row to see sample
      differences. At most 20 rows are drawn.

      Note: Shannon diversity uses the natural logarithm over every taxon the classifier reports, at any
      rank.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_profiles
    use: taxpasta/profiles
    visu_type: line
    mode: code
    code_content: |-
      # Rank the taxa inside each profiling run, then accumulate their shares: a
      # curve that saturates early is a concentrated profile. Needs a window rank
      # and a cumulative sum per run, which the UI builder cannot express.
      # The unclassified row is left out and the rest renormalised, or a run
      # with most reads unplaced would start near the top.
      ranked = (
          df.filter((pl.col('rel_abundance') > 0) & (pl.col('rank') != 'unclassified'))
          .with_columns((pl.col('rel_abundance') / pl.col('rel_abundance').sum().over(['profiler_db', 'sample'])).alias('share'))
          .with_columns(pl.col('share').rank('ordinal', descending=True).over(['profiler_db', 'sample']).alias('taxon_rank'))
          .filter(pl.col('taxon_rank') <= 30)
          .sort(['profiler_db', 'sample', 'taxon_rank'])
          .with_columns(pl.col('share').cum_sum().over(['profiler_db', 'sample']).alias('cumulative_share'))
          .with_columns((pl.col('sample') + pl.lit(' | ') + pl.col('profiler_db')).alias('run'))
      )
      fig = px.line(ranked.to_pandas(), x='taxon_rank', y='cumulative_share', color='profiler', line_group='run', hover_name='run', color_discrete_map=depictio_category_colors.get('profiler') or {}, labels={'taxon_rank': 'Taxa, most abundant first', 'cumulative_share': 'Cumulative share of the classified profile', 'profiler': 'Classifier'})
      fig.update_yaxes(range=[0, 1.02])
      fig.update_layout(hovermode='closest', margin=dict(t=10))
    section: Profile concentration
    tag: tp-div-accumulation
    index: div-accumulation
    title: Rank-abundance accumulation
    description: >-
      How concentrated each profile is. Taxa are ranked from the most abundant, and the line adds up their
      shares, one line per profiling run and sample, coloured by classifier.

      How to read: a curve that saturates early is a concentrated profile, with a few taxa holding the
      classified community. One that keeps climbing has a long tail. Lines of different classifiers on the
      same sample show how differently they spread the same reads.

      Lines and annotations: the figure draws only the curves. The unclassified row is left out and the
      shares are renormalised over the classified rows, and only the 30 most abundant taxa of each run are
      drawn, so a curve does not reach 1 when the tail is longer.

      Note: taxa are counted at every rank a classifier reports, so a profile that mixes ranks accumulates
      differently from one that reports only species.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    use: taxpasta/sample_summary
    row_selection_enabled: true
    row_selection_column: profiler_db
    section: Tables
    tag: tp-div-table
    index: div-table
    title: Per-run profile statistics
    description: >-
      One row per sample and profiling run (classifier and database): the number of taxa reported, the
      reads assigned, the share of the most abundant taxon, its Shannon diversity and its Pielou evenness.

      How to read: sort on taxa observed to list classifiers with long tails, and on the top taxon share
      to list concentrated profiles. Evenness is Shannon diversity divided by the natural logarithm of the
      number of taxa, so 1 is a perfectly even profile. A row picked here selects the run in the plots.

      Note: taxa are counted at every rank a classifier reports, so richness compares how classifiers
      report and not the true richness.
    layout: {x: 0, y: 0, w: 8, h: 6}
