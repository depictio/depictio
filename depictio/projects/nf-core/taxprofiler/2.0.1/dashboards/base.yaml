      disagreement more than as biological distance. Draw a lasso to select its runs in the other tiles.

      Note: the distances use every taxon id of the profile, at any rank, and the axes carry no biological
      unit.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_presence
    use: taxpasta/profiler_upset
    config:
      sort_by: cardinality
      sort_order: descending
      # The set columns are the run's classifiers, discovered at ingest, so no
      # explicit list can be written in a generic template: the auto-detection
      # picks exactly the 0/1 columns. `degree`, not `set`, for the same reason
      # plotly-upset needs an explicit set_colors map in `set` mode.
      min_size: 2
      show_set_sizes: true
      color_intersections_by: degree
    section: Shared taxa
    tag: tp-conc-upset
    index: conc-upset
    title: Classifier detection overlap
    description: >-
      Which taxa each combination of classifiers detects. The matrix at the bottom marks the classifiers
      in a combination, the bar above it counts the taxa detected by exactly that combination, and the
      horizontal bars give the taxa each classifier detects in total.

      How to read: the tallest bar with all classifiers marked is the agreed core, and bars with a single
      classifier are its private tail. Bars are coloured by the number of classifiers in the combination.
      Sample filters narrow it to one community.

      Lines and annotations: a taxon counts as detected by a classifier when its count is above zero, per
      sample and taxonomy id. Combinations with fewer than 2 taxa are hidden.

      Note: sylph and melon are not supported by taxpasta in this release, so they are not part of the
      cross-classifier tiles.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_lineage
    use: taxpasta/lineage_sankey
    config:
      # step_cols must be a prefix of available_step_cols: the depth picker
      # reads the latter. Phylum is the deepest rank whose labels stay apart.
      step_cols: [root, superkingdom, phylum]
      available_step_cols: [root, superkingdom, phylum, class, order, family, genus, species]
      depth: 3
      value_col: rel_abundance
      value_label: share of the profile
      value_format: fraction
      sort_mode: total_flow
      color_mode: source
      link_opacity: 0.5
      min_link_value: 0
      show_node_labels: true
    section: Taxonomic flow
    tag: tp-conc-sankey
    index: conc-lineage-sankey
    title: Root to phylum flow
    description: >-
      Where the reads flow in the taxonomy. The root fans out into domains and phyla, and the width of a
      band is the share of the selected runs that followed that lineage.

      How to read: a band that splits into many phyla is a diverse community, and a thick unplaced band is
      reads the classifiers could not place. Colours follow the source node. The depth picker goes down to
      species.

      Lines and annotations: reads that no classifier placed are their own band, and no band is hidden for
      being thin.

      Note: sylph and melon are not supported by taxpasta in this release, so they are not part of the
      cross-classifier tiles.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_matrix
    use: taxpasta/concordance_heatmap
    config:
      row_annotation_cols:
      - rank
      cluster_rows: true
      cluster_cols: true
      cluster_method: ward
      cluster_metric: correlation
      normalize: row_z
    section: Taxon by run matrix
    tag: tp-conc-heatmap
    index: conc-heatmap
    title: Taxon by run heatmap
    description: >-
      The most abundant taxa across every profiling run. Each row is a taxon, each column a run, and the
      colour is the row z-score of the relative abundance.

      How to read: rows and columns are clustered, so runs that group together agree on the same taxa. A
      taxon that lights up in one block of columns is reported only by those classifiers. The strips above
      the columns name the classifier and the platform, and the strip beside the rows names the rank.

      Lines and annotations: z-scores are computed within each taxon across runs, so colours compare runs
      for one taxon and not taxa with one another. Rows and columns are clustered with Ward linkage on the
      correlation distance. Only the 60 most abundant taxa, summed over all runs, are kept.

      Note: sylph and melon are not supported by taxpasta in this release, so they are not part of the
      cross-classifier tiles.
    layout: {x: 0, y: 0, w: 8, h: 5}
- title: Confidence
  subtitle: How close are the reads to the genomes sylph matched?
  tab_group: Classifiers
  tab_order: 6
  tab_icon: mdi:target
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Confidence filters
    icon: mdi:filter-variant
    color: teal
    description: The containment matches inside an identity or abundance band
  grid_sections:
  - name: Confidence at a glance
    icon: mdi:counter
    color: teal
    description: How close the matches are, and how many genomes they cover
  - name: Identity by genome
    icon: mdi:ruler
    color: teal
    description: Each genome's identity and abundance, sample by sample
  - name: Identity against abundance
    icon: mdi:chart-scatter-plot
    color: teal
    description: Abundant matches at low identity, and the record of the one picked
  - name: Tables
    icon: mdi:table
    color: gray
    description: Every genome sylph detected, with its identity, coverage and abundance
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [sylph](https://github.com/bluenote-1577/sylph) reports how close the reads are to each
      reference genome it detects, as an adjusted ANI. A high abundance at an identity under 95% is a
      divergent relative, not the named species. Pick a point on the scatter to read its genome in the
      card beside it.
    tag: tp-conf-intro
    index: conf-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    interactive_component_type: RangeSlider
    column_name: adjusted_ani
    column_type: float64
    display:
      icon_name: mdi:target
      custom_color: teal
    section: Confidence filters
    tag: tp-conf-filter-ani
    index: conf-ani-filter
    title: Adjusted ANI
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    interactive_component_type: RangeSlider
    column_name: taxonomic_abundance
    column_type: float64
    display:
      icon_name: mdi:chart-donut
      custom_color: pink
    section: Confidence filters
    tag: tp-conf-filter-abundance
    index: conf-abundance-filter
    title: Taxonomic abundance
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    use: sylph/ani
    aggregation: median
    column_name: adjusted_ani
    column_type: float64
    secondary_layout: threshold
    threshold_value: 95
    threshold_direction: min
    display:
      icon_name: mdi:target
      icon_color: teal
      caption: median; 95% marks a species
      decimals: 1
    section: Confidence at a glance
    tag: tp-conf-card-ani
    index: conf-card-ani
    title: Adjusted ANI (%)
    description: Median identity of the reads to the genomes sylph matched.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    use: sylph/ani
    aggregation: nunique
    column_name: genome
    column_type: object
    secondary_layout: uniqueness
    display:
      icon_name: mdi:database-outline
      icon_color: grape
      caption: distinct genomes, out of all detections
    section: Confidence at a glance
    tag: tp-conf-card-genomes
    index: conf-card-genomes
    title: Genomes detected
    description: Distinct reference genomes sylph detected in the samples in view.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    use: sylph/ani
    aggregation: median
    column_name: eff_cov
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:waves
      icon_color: cyan
      caption: median, with its spread
      decimals: 2
    section: Confidence at a glance
    tag: tp-conf-card-coverage
    index: conf-card-coverage
    title: Effective coverage
    description: Median effective coverage of a detected genome in one sample.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    use: sylph/ani
    aggregation: count
    column_name: taxonomic_abundance
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:counter
      icon_color: orange
      caption: genome and sample pairs, by abundance
    section: Confidence at a glance
    tag: tp-conf-card-detections
    index: conf-card-detections
    title: Detections
    description: One detection per genome and sample, with the spread of their abundances.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    use: sylph/ani_dot_plot
    config:
      colour_scale: Viridis
      max_genes: 25
      gene_sort: mean
      max_dot_size: 24
      annotate_top_n: 0
    section: Identity by genome
    tag: tp-conf-dot-plot
    index: conf-ani-dot
    title: ANI by genome and sample
    description: >-
      How close the reads are to the genomes sylph matched. Each row is a reference genome and each column
      a sample; the dot colour is the adjusted ANI of the containment match and its size the genome's
      abundance in the sample.

      How to read: a large dot at the high end of the colour scale is an abundant genome matched at high
      identity, a confident call. A large dot at the low end is an abundant genome matched at low
      identity, a confident-looking call that is really a divergent relative. At most 25 genomes are
      drawn.

      Note: adjusted ANI is coverage-adjusted only when the genome's coverage is below 3x, and otherwise
      falls back to the unadjusted containment ANI.

      Source: sylph output format, https://github.com/bluenote-1577/sylph/wiki/Output-format
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    use: sylph/ani
    visu_type: scatter
    dict_kwargs:
      x: taxonomic_abundance
      y: adjusted_ani
      color: sample
      size: eff_cov
      hover_name: genome
      labels: {taxonomic_abundance: Taxonomic abundance (%), adjusted_ani: Adjusted ANI (%), sample: Sample, eff_cov: Effective coverage}
    selection_enabled: true
    selection_column: genome
    section: Identity against abundance
    tag: tp-fig-ani-scatter
    index: conf-ani-abundance
    title: ANI against abundance
    description: >-
      One point per genome and sample that sylph detected: its taxonomic abundance (horizontal) against
      its adjusted ANI (vertical). The point is sized by the effective coverage and coloured by sample.

      How to read: points at the bottom right are confident-looking abundances that rest on a divergent
      match, a relative of the reference. Points at the top right are abundant and close to their
      reference. Click a point to open its record.

      Note: the figure draws no cut-off line, so read the points relative to each other and not against a
      threshold.

      Source: sylph output format, https://github.com/bluenote-1577/sylph/wiki/Output-format
    layout: {x: 0, y: 0, w: 5, h: 5}
  - component_type: advanced_viz
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: tp-fig-ani-scatter
      id_col: genome
      title_col: contig_name
      selection_source: scatter_selection
      sections:
        Genome: [genome, contig_name, sample]
        Identity: [adjusted_ani, naive_ani, containment_frac, kmers_reassigned]
        Abundance: [taxonomic_abundance, sequence_abundance, abundance_frac]
        Coverage: [eff_cov, median_cov]
      labels:
        genome: Genome
        contig_name: First contig
        sample: Sample
        adjusted_ani: Adjusted ANI (%)
        naive_ani: Naive ANI (%)
        containment_frac: Containment
        kmers_reassigned: K-mers reassigned
        taxonomic_abundance: Taxonomic abundance (%)
        sequence_abundance: Sequence abundance (%)
        abundance_frac: Abundance share
        eff_cov: Effective coverage
        median_cov: Median coverage
    section: Identity against abundance
    tag: tp-conf-record
    index: conf-record
    title: Picked genome
    description: >-
      The record of the genome picked on the scatter: its name and first contig, its identity measures,
      its abundance and its coverage.

      How to read: Identity gives the adjusted and the unadjusted containment ANI, the containment (k-mers
      found in the sample over the genome's total) and the k-mers reassigned. Abundance gives the
      taxonomic abundance (coverage-normalised) and the sequence abundance (read share). The adjusted ANI
      differs from the unadjusted one where sylph corrected for coverage.

      Note: nothing shows until a point is picked on the plot to its left.

      Source: sylph output format, https://github.com/bluenote-1577/sylph/wiki/Output-format
    layout: {x: 5, y: 0, w: 3, h: 5}
  - component_type: table
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    use: sylph/ani
    row_selection_enabled: true
    row_selection_column: genome
    section: Tables
    tag: tp-conf-table
    index: conf-table
    title: sylph containment table
    description: >-
      sylph's containment results, one row per genome and sample: the adjusted and naive ANI, the
      containment, the abundances, the coverage and the k-mers reassigned.

      How to read: sort on adjusted ANI to list the most divergent matches, and on effective coverage to
      list the genomes seen only thinly. A row picked here selects the genome in the plots.

      Source: sylph output format, https://github.com/bluenote-1577/sylph/wiki/Output-format
    layout: {x: 0, y: 0, w: 8, h: 6}
