version: 1
main_dashboard:
  title: nf-core/taxprofiler
  subtitle: "Many classifiers, one community: read QC, sequencing depth, per-profiler composition, cross-profiler concordance and containment confidence"
  project_tag: Taxprofiler Metagenomic Profiling
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: none
  # Left panel. The sample scope is persistent AND pinned: taxprofiler runs every
  # profiler over the same samples, so narrowing to one community has to follow
  # the viewer through the depth, composition, concordance and confidence tabs.
  # Persistent without `pin` would have kept the section on one tab only, which
  # is what it used to do.
  filter_sections:
  - name: Samples
    icon: mdi:test-tube
    color: teal
    description: Which communities, platforms and sequencing runs every tab is showing
    persistent: true
    pin: top
  - name: Read stats
    icon: mdi:tune
    color: orange
    description: Keep only the profiling runs inside a richness or diversity band
    collapsed: true
  # Right panel, in reading order: the run-level numbers, then the pipeline's own
  # MultiQC panels from raw reads through host removal to the per-profiler top
  # taxa. This tab is named MultiQC and carries MultiQC panels only, so the
  # numbers live in `Run at a glance`, a persistent pinned section that opens
  # every tab. `Sample sheet` is pinned to the top and `Reference tables` to the
  # bottom, so the cohort every tab is filtered by and the raw rows every tile is
  # computed from trail each tab. All three are declared here, on the tab no
  # route conditional can remove.
  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: What the run is, in four numbers, on every tab
    persistent: true
    pin: top
  - name: Read quality
    icon: mdi:chart-box-outline
    color: orange
    description: FastQC before and after trimming, and what fastp filtered out
  - name: Host removal and long reads
    icon: mdi:filter-variant
    color: cyan
    description: What the host-genome alignment removed, plus nanopore read stats and coverage redundancy
  - name: Profiler panels
    icon: mdi:bacteria-outline
    color: grape
    description: The top-taxa panels MultiQC already builds for each classifier
    collapsed: true
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The samples the run was given, and the platform each was sequenced on
    collapsed: true
    persistent: true
    pin: top
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The rows behind every tile, on every tab
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # ------------------------------------------------------------ run at a glance
  # Four readings, four different shapes, and none of them repeats another's
  # breakdown: the cohort split by platform, the profiling runs split by
  # classifier, how many distinct taxa were named at all, and the spread of
  # reads assigned per run. The section is persistent and pinned, so this strip
  # opens every tab; each tab then adds its own strip on its own data.
  - component_type: card
    tag: tp-card-samples
    section: Run at a glance
    workflow_tag: taxprofiler
    data_collection_tag: samplesheet
    aggregation: nunique
    column_name: sample
    column_type: object
    secondary_layout: donut
    breakdown_col: instrument_platform
    display: {icon_name: 'mdi:test-tube', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Samples
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: tp-card-runs
    section: Run at a glance
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    use: taxpasta/sample_summary
    aggregation: nunique
    column_name: profiler_db
    column_type: object
    secondary_layout: top_n
    breakdown_col: profiler
    top_n_count: 4
    display: {icon_name: 'mdi:database-outline', icon_color: '#0097A7', title_color: '#0097A7', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Profiling runs
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: tp-card-taxa
    section: Run at a glance
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_profiles
    use: taxpasta/profiles
    aggregation: nunique
    column_name: name
    column_type: object
    secondary_layout: uniqueness
    display: {icon_name: 'mdi:bacteria-outline', icon_color: '#8E44AD', title_color: '#8E44AD', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Distinct taxa
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: tp-card-assigned
    section: Run at a glance
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    use: taxpasta/sample_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: assigned_count
    column_type: float64
    display: {icon_name: 'mdi:counter', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Reads assigned per run
    layout: {x: 6, y: 0, w: 2, h: 2}

  # --------------------------------------------------------------- read quality
  - component_type: text
    tag: tp-qc-intro
    section: Read quality
    title: The reads the classifiers were given
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      taxprofiler ran every classifier in the database sheet over the same
      reads, and this tab is the pipeline's own
      [MultiQC](https://multiqc.info) report on them:
      [FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/)
      before and after trimming, and the [fastp](https://github.com/OpenGene/fastp)
      filtering summary. The tabs after it compare what the classifiers made of
      those reads.
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: tp-qc-general-stats
    section: Read quality
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    title: General statistics
    description: One row per sample, pooling the FastQC, fastp, Bowtie 2, samtools and every classifier's headline numbers. Only one sample is detected as a read pair, so the default mean view shows a single row; switch the read toggle to All reads to see all 70, 50 to a page.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 5}
  - component_type: multiqc
    tag: tp-qc-counts
    section: Read quality
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Counts
    use: multiqc/fastqc
    title: Sequence counts (pre-trimming)
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: tp-qc-quality
    section: Read quality
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    use: multiqc/fastqc
    title: Per-base quality (pre-trimming)
    title_size: sm
    title_align: left
    layout: {x: 4, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: tp-qc-fastp-filtered
    section: Read quality
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    selected_module: fastp
    selected_plot: Filtered Reads
    use: multiqc/fastp
    title: fastp filtered reads
    title_size: sm
    title_align: left
    layout: {x: 0, y: 12, w: 4, h: 5}
  - component_type: multiqc
    tag: tp-qc-post-lengths
    section: Read quality
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc-1
    selected_plot: Sequence Length Distribution
    title: Read lengths (post-trimming)
    title_size: sm
    title_align: left
    layout: {x: 4, y: 12, w: 4, h: 5}

  # ------------------------------------------------- host removal and long reads
  - component_type: text
    tag: tp-host-intro
    section: Host removal and long reads
    title: What was taken out before profiling
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Reads matching the host reference are aligned away before any classifier
      sees them. The [nanoq](https://github.com/esteinig/nanoq) and
      [Nonpareil](https://nonpareil.readthedocs.io) panels cover the long-read
      half of the run and how much of the community the sequencing effort
      reached; the Depth and diversity tab rebuilds the Nonpareil curve those
      redundancy levels are a slice of.
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: tp-host-bowtie2
    section: Host removal and long reads
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    selected_module: bowtie2
    selected_plot: Single-end alignments
    use: multiqc/bowtie2
    title: Host alignment rate
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: tp-host-samtools
    section: Host removal and long reads
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    selected_module: samtools
    selected_plot: Percent mapped
    use: multiqc/samtools
    title: Percent mapped to host
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: tp-host-nanoq
    section: Host removal and long reads
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    selected_module: nanoq
    selected_plot: Nanoq Summary
    use: multiqc/nanoq
    title: Long-read filtering summary
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: tp-host-nonpareil
    section: Host removal and long reads
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    selected_module: nonpareil
    selected_plot: Redundancy levels
    use: multiqc/nonpareil
    title: Coverage redundancy
    title_size: sm
    title_align: left
    layout: {x: 4, y: 7, w: 4, h: 5}

  # ------------------------------------------------------------- profiler panels
  - component_type: text
    tag: tp-panels-intro
    section: Profiler panels
    title: Each classifier's own top taxa
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      MultiQC already summarises what each classifier reported, so these panels
      stay as the pipeline drew them. The comparison across classifiers is on
      the Concordance tab, where MultiQC has no equivalent view.
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: tp-panel-kraken
    section: Profiler panels
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    selected_module: kraken
    selected_plot: Top taxa
    use: multiqc/kraken
    title: Kraken2 top taxa
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: tp-panel-bracken
    section: Profiler panels
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    selected_module: bracken
    selected_plot: Top taxa
    use: multiqc/bracken
    title: Bracken top taxa
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: tp-panel-centrifuge
    section: Profiler panels
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    selected_module: centrifuge
    selected_plot: Top taxa
    use: multiqc/centrifuge
    title: Centrifuge top taxa
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: tp-panel-kaiju
    section: Profiler panels
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    selected_module: kaiju
    selected_plot: Top taxa
    use: multiqc/kaiju
    title: Kaiju top taxa
    title_size: sm
    title_align: left
    layout: {x: 4, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: tp-panel-metaphlan
    section: Profiler panels
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    selected_module: metaphlan
    selected_plot: Top taxa
    use: multiqc/metaphlan
    title: MetaPhlAn top taxa
    title_size: sm
    title_align: left
    layout: {x: 0, y: 12, w: 4, h: 5}
  - component_type: multiqc
    tag: tp-panel-malt
    section: Profiler panels
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    use: multiqc/malt
    selected_module: malt
    selected_plot: Metagenomic Mappability
    title: MALT mappability
    title_size: sm
    title_align: left
    layout: {x: 4, y: 12, w: 4, h: 5}

  # ------------------------------------------------------------------ samplesheet
  - component_type: table
    tag: tp-table-samplesheet
    section: Sample sheet
    workflow_tag: taxprofiler
    data_collection_tag: samplesheet
    row_selection_enabled: false
    title: Samplesheet
    description: The samples, their sequencing runs and their platform.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 3}

  # ---------------------------------------------------------- reference tables
  - component_type: text
    tag: tp-tables-intro
    section: Reference tables
    title: The rows behind every tile
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The long [taxpasta](https://taxpasta.readthedocs.io) frame every
      cross-profiler tile is computed from, the per-run statistics, and the
      database sheet saying which reference each run was classified against.
      Filters narrow these too; the samplesheet has its own section at the top.
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_profiles
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: tp-table-profiles
    section: Reference tables
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_profiles
    use: taxpasta/profiles
    row_selection_enabled: false
    title: Cross-profiler abundances
    description: One row per profiler, database, sample and taxon, with the raw count and the within-run share.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: table
    tag: tp-table-summary
    section: Reference tables
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    use: taxpasta/sample_summary
    row_selection_enabled: true
    row_selection_column: profiler_db
    title: Per-run profile statistics
    description: Pick a row to narrow the ordination and the profile tiles to that profiling run.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 9, w: 8, h: 5}
  - component_type: table
    tag: tp-table-databases
    section: Reference tables
    workflow_tag: taxprofiler
    data_collection_tag: database_sheet
    row_selection_enabled: false
    title: Database sheet
    description: Which database each classifier ran against, and for which read type. Narrowed by the classifier and database filters.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 14, w: 8, h: 5}

  # -------------------------------------------------------------- left panel
  - component_type: interactive
    tag: tp-filter-sample
    index: tp-sample-filter
    section: Samples
    group: Sample scope
    workflow_tag: taxprofiler
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:test-tube'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: tp-filter-platform
    index: tp-platform-filter
    section: Samples
    group: Sample scope
    workflow_tag: taxprofiler
    data_collection_tag: samplesheet
    interactive_component_type: SegmentedControl
    column_name: instrument_platform
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:dna'}
    placement: left
    title: Platform
    layout: {x: 0, y: 3, w: 1, h: 2}
  # The second real samplesheet factor: a sample can be split over several
  # sequencing runs, which is why runs outnumber samples in this cohort. It is
  # an integer column, so a slider rather than a select.
  - component_type: interactive
    tag: tp-filter-run
    index: tp-run-filter
    section: Samples
    group: Sample scope
    workflow_tag: taxprofiler
    data_collection_tag: samplesheet
    interactive_component_type: RangeSlider
    column_name: run_accession
    column_type: int64
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:counter'}
    placement: left
    title: Sequencing run
    layout: {x: 0, y: 5, w: 1, h: 3}
  - component_type: interactive
    tag: tp-filter-richness
    index: tp-richness-range
    section: Read stats
    group: Profile shape
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    interactive_component_type: RangeSlider
    column_name: taxa_observed
    column_type: int64
    display: {title_size: md, custom_color: '#F2A93B', icon_name: 'mdi:counter'}
    placement: left
    title: Taxa observed
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: tp-filter-shannon
    index: tp-shannon-range
    section: Read stats
    group: Profile shape
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    interactive_component_type: RangeSlider
    column_name: shannon
    column_type: float64
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:chart-bell-curve'}
    placement: left
    title: Shannon diversity
    layout: {x: 0, y: 3, w: 1, h: 3}

tabs:
# ====================================================== Depth and diversity
- title: Depth and diversity
  subtitle: Whether the sequencing went deep enough, and how diverse what it found is
  tab_order: 1
  tab_icon: mdi:chart-line
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: none
  filter_sections:
  - name: Depth scope
    icon: mdi:tune
    color: cyan
    description: Keep only the libraries and profiling runs inside a coverage, diversity or richness band
  grid_sections:
  - name: Coverage redundancy
    icon: mdi:chart-line
    color: cyan
    description: How much of each metagenome the reads reach, and how much deeper the run would have to go
  - name: Alpha diversity
    icon: mdi:chart-bell-curve
    color: lime
    description: How diverse and how even each classifier says the community is
  components:
  - component_type: card
    tag: tp-np-card-cov
    section: Coverage redundancy
    workflow_tag: taxprofiler
    data_collection_tag: nonpareil_summary
    use: nonpareil/summary
    aggregation: average
    column_name: coverage
    column_type: float64
    secondary_layout: gauge
    coverage_max: 1
    display: {icon_name: 'mdi:waves', icon_color: '#0097A7', title_color: '#0097A7', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Metagenome coverage
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: tp-np-card-div
    section: Coverage redundancy
    workflow_tag: taxprofiler
    data_collection_tag: nonpareil_summary
    use: nonpareil/summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: diversity
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Nonpareil diversity
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: tp-np-card-effort
    section: Coverage redundancy
    workflow_tag: taxprofiler
    data_collection_tag: nonpareil_summary
    use: nonpareil/summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: effort_multiple
    column_type: float64
    display: {icon_name: 'mdi:ruler', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Depth still missing
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: tp-np-card-libs
    section: Coverage redundancy
    workflow_tag: taxprofiler
    data_collection_tag: nonpareil_summary
    use: nonpareil/summary
    aggregation: nunique
    column_name: library
    column_type: object
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:database-outline', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Libraries measured
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: text
    tag: tp-np-intro
    section: Coverage redundancy
    title: How much of the community the reads reached
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [Nonpareil](https://nonpareil.readthedocs.io) measures how often a read
      repeats one already sequenced, and turns that redundancy into the share of
      the metagenome the library covers. The pipeline publishes only the fitted
      numbers, so the curve below is rebuilt from them: coverage is the model's
      value at each effort, the same model Nonpareil draws. Where a curve is
      still climbing at the effort the run reached, the community has more in it
      than the reads found, and every classifier on the later tabs is working
      from an incomplete view.
    workflow_tag: taxprofiler
    data_collection_tag: nonpareil_curves
    layout: {x: 0, y: 2, w: 8, h: 2}
  - component_type: advanced_viz
    tag: tp-av-np-curve
    section: Coverage redundancy
    workflow_tag: taxprofiler
    data_collection_tag: nonpareil_curves
    use: nonpareil/coverage_curve
    config:
      log_x: true
      x_title: sequencing effort (base pairs, log scale)
      y_title: modelled coverage of the metagenome
      legend_pos: right
      line_width: 2.0
    title: Coverage against sequencing effort
    description: One curve per sequencing library. A curve that has flattened before the effort the run reached is a library that saw the community; one still rising is a library that did not.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 7}
  - component_type: figure
    tag: tp-fig-np-scatter
    section: Coverage redundancy
    workflow_tag: taxprofiler
    data_collection_tag: nonpareil_summary
    use: nonpareil/summary
    visu_type: scatter
    dict_kwargs: {x: diversity, y: coverage, color: sample, size: effort_multiple, hover_name: library}
    title: Coverage against diversity
    description: Point size is how many times deeper the run would have to go for 95 percent coverage, so the big points bottom-right are the libraries most short of depth.
    title_size: h3
    layout: {x: 0, y: 11, w: 8, h: 6}
  - component_type: table
    tag: tp-table-nonpareil
    section: Coverage redundancy
    workflow_tag: taxprofiler
    data_collection_tag: nonpareil_summary
    use: nonpareil/summary
    row_selection_enabled: false
    title: Nonpareil per-library statistics
