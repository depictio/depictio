    column_type: float64
    display: {title_size: md, custom_color: '#0097A7', icon_name: 'mdi:chart-donut'}
    placement: left
    title: Taxonomic abundance
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
