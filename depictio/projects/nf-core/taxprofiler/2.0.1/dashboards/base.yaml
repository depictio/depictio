    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    interactive_component_type: RangeSlider
    column_name: taxa_observed
    column_type: int64
    display:
      icon_name: mdi:counter
      custom_color: orange
    section: Diversity filters
    tag: tp-div-filter-richness
    index: div-richness-filter
    title: Taxa observed
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    interactive_component_type: RangeSlider
    column_name: evenness
    column_type: float64
    display:
      icon_name: mdi:scale-balance
      custom_color: pink
    section: Diversity filters
    tag: tp-div-filter-evenness
    index: div-evenness-filter
    title: Evenness
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    use: taxpasta/sample_summary
    aggregation: median
    column_name: shannon
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: lime
      caption: median, with its spread
      decimals: 2
    section: Diversity at a glance
    tag: tp-div-card-shannon
    index: div-card-shannon
    title: Shannon
    description: Median Shannon diversity of the profiling runs in view.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    use: taxpasta/sample_summary
    aggregation: median
    column_name: taxa_observed
    column_type: int64
    secondary_layout: top_n
    breakdown_col: profiler
    display:
      icon_name: mdi:counter
      icon_color: orange
      caption: median per run, by classifier
      decimals: 0
    section: Diversity at a glance
    tag: tp-div-card-richness
    index: div-card-richness
    title: Taxa observed
    description: Median taxa a profiling run reported, the richest classifiers first.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    use: taxpasta/sample_summary
    aggregation: median
    column_name: evenness
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:scale-balance
      icon_color: pink
      caption: median, with its distribution
      decimals: 2
    section: Diversity at a glance
    tag: tp-div-card-evenness
    index: div-card-evenness
    title: Evenness
    description: Median Pielou evenness, from 0 (one taxon dominates) to 1 (all equal).
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    use: taxpasta/sample_summary
    aggregation: median
    column_name: top_taxon_fraction
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-donut
      icon_color: indigo
      caption: median, with its spread
      format: percent
    section: Diversity at a glance
    tag: tp-div-card-top-share
    index: div-card-top-share
    title: Top-taxon share
    description: Median share of a profile its single most abundant taxon holds.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    use: taxpasta/sample_summary
    visu_type: scatter
    dict_kwargs:
      x: taxa_observed
      y: shannon
      color: profiler
      symbol: platform
      labels: {taxa_observed: Taxa observed, shannon: Shannon diversity, profiler: Classifier, platform: Platform}
    selection_enabled: true
    selection_column: profiler_db
    section: Richness and diversity
    tag: tp-div-scatter
    index: div-richness-shannon
    title: Richness against diversity
    description: One point per profiling run. Classifiers that report a long tail move right without moving up.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    use: taxpasta/richness_dot_plot
    config:
      colour_scale: Plasma
      max_genes: 20
      gene_sort: mean
      max_dot_size: 26
    section: Diversity by run
    tag: tp-div-dot-plot
    index: div-dot-plot
    title: Diversity by sample and run
    description: Dot colour is Shannon diversity, dot size the share the run's top taxon holds.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_profiles
    use: taxpasta/profiles
    visu_type: line
    mode: code
    code_content: |-
      # Rank the taxa inside each profiling run, then accumulate their shares: a
      # curve that saturates early is a concentrated profile. Needs a window rank
      # and a cumulative sum per run, which the UI builder cannot express.
      # The unclassified row is left out and the rest renormalised, or a run
      # with most reads unplaced would start near the top.
      ranked = (
          df.filter((pl.col('rel_abundance') > 0) & (pl.col('rank') != 'unclassified'))
          .with_columns((pl.col('rel_abundance') / pl.col('rel_abundance').sum().over(['profiler_db', 'sample'])).alias('share'))
          .with_columns(pl.col('share').rank('ordinal', descending=True).over(['profiler_db', 'sample']).alias('taxon_rank'))
          .filter(pl.col('taxon_rank') <= 30)
          .sort(['profiler_db', 'sample', 'taxon_rank'])
          .with_columns(pl.col('share').cum_sum().over(['profiler_db', 'sample']).alias('cumulative_share'))
          .with_columns((pl.col('sample') + pl.lit(' | ') + pl.col('profiler_db')).alias('run'))
      )
      fig = px.line(ranked.to_pandas(), x='taxon_rank', y='cumulative_share', color='profiler', line_group='run', hover_name='run', color_discrete_map=depictio_category_colors.get('profiler') or {}, labels={'taxon_rank': 'Taxa, most abundant first', 'cumulative_share': 'Cumulative share of the classified profile', 'profiler': 'Classifier'})
      fig.update_yaxes(range=[0, 1.02])
      fig.update_layout(hovermode='closest', margin=dict(t=10))
    section: Profile concentration
    tag: tp-div-accumulation
    index: div-accumulation
    title: Rank-abundance accumulation
    description: A curve that saturates early is a concentrated profile; one that keeps climbing has a long tail.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    use: taxpasta/sample_summary
    row_selection_enabled: true
    row_selection_column: profiler_db
    section: Tables
    tag: tp-div-table
    index: div-table
    title: Per-run profile statistics
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Concordance
