  - component_type: text
    tag: tp-lin-intro
    section: Lineage rings
    title: The same profiles, as a hierarchy
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      taxprofiler runs taxpasta without a lineage, so the ancestry here is read
      back out of the indented kraken-style reports the run writes anyway and
      joined on the taxonomy id. Pick one classifier in the left panel and the
      rings become that classifier's view of the community; pick several and the
      rings pool them, which is a fast way to see whose tree is deeper. Reads a
      classifier could not place keep an explicit unclassified arc rather than
      quietly leaving the ring, and taxa whose database uses identifiers no
      report named sit under unresolved.
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_lineage
    layout: {x: 0, y: 2, w: 8, h: 2}
