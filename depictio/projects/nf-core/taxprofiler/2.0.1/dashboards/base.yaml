version: 1
main_dashboard:
  title: nf-core/taxprofiler
  subtitle: "Many classifiers, one community: read QC, per-profiler composition, cross-profiler concordance and containment confidence"
  project_tag: Taxprofiler Metagenomic Profiling
  main_tab_name: Read QC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  workflow_system: none
  # Left panel. The sample scope is persistent: taxprofiler runs every profiler
  # over the same samples, so narrowing to one community has to follow the
  # viewer through the composition, concordance and confidence tabs.
  filter_sections:
  - name: Samples
    icon: mdi:test-tube
    color: teal
    description: Which communities and sequencing platforms every tab is showing
    persistent: true
  - name: Read stats
    icon: mdi:tune
    color: orange
    description: Keep only the profiling runs inside a richness or diversity band
    collapsed: true
  # Right panel, in reading order: the run-level cards, then the pipeline's own
  # MultiQC panels from raw reads through host removal to the per-profiler top
  # taxa. `Reference tables` is persistent and pinned to the bottom so the raw
  # rows trail every tab.
  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: orange
    description: How many communities were profiled, by how many classifiers, and how rich the profiles are
  - name: Read quality
    icon: mdi:chart-box-outline
    color: orange
    description: FastQC before and after trimming, and what fastp filtered out
  - name: Host removal and long reads
    icon: mdi:filter-variant
    color: cyan
    description: What the host-genome alignment removed, plus nanopore read stats and coverage redundancy
  - name: Profiler panels
    icon: mdi:bacteria-outline
    color: grape
    description: The top-taxa panels MultiQC already builds for each classifier
    collapsed: true
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The rows behind every tile, on every tab
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # ---------------------------------------------------------------- at a glance
  - component_type: text
    tag: tp-intro
    section: Run at a glance
    title: One community, many classifiers
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      taxprofiler runs every classifier in the database sheet over the same
      reads. This tab is the pipeline's own quality report; the Profiles,
      Concordance and Confidence tabs compare what the classifiers made of it.
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: tp-card-samples
    section: Run at a glance
    workflow_tag: taxprofiler
    data_collection_tag: samplesheet
    aggregation: nunique
    column_name: sample
    column_type: object
    secondary_layout: donut
    breakdown_col: instrument_platform
    display: {icon_name: 'mdi:test-tube', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Samples
    layout: {x: 0, y: 1, w: 2, h: 2}
  - component_type: card
    tag: tp-card-runs
    section: Run at a glance
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    aggregation: nunique
    column_name: profiler_db
    column_type: object
    secondary_layout: top_n
    breakdown_col: profiler
    top_n_count: 4
    display: {icon_name: 'mdi:bacteria-outline', icon_color: '#8E44AD', title_color: '#8E44AD', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Profiling runs
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: tp-card-taxa
    section: Run at a glance
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: taxa_observed
    column_type: int64
    display: {icon_name: 'mdi:counter', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Taxa per run
    layout: {x: 4, y: 1, w: 2, h: 2}
  - component_type: card
    tag: tp-card-evenness
    section: Run at a glance
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    aggregation: average
    column_name: evenness
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.6
    threshold_direction: min
    threshold_warn: 0.4
    display: {icon_name: 'mdi:scale-balance', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Evenness
    layout: {x: 6, y: 1, w: 2, h: 2}

  # --------------------------------------------------------------- read quality
  - component_type: text
    tag: tp-qc-intro
    section: Read quality
    title: The reads the classifiers were given
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      FastQC before and after trimming, and the fastp filtering summary. Every
      panel here is the pipeline's own MultiQC output, not a recomputation.
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: tp-qc-counts
    section: Read quality
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Counts
    use: multiqc/fastqc
    title: Sequence counts (pre-trimming)
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: tp-qc-quality
    section: Read quality
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    use: multiqc/fastqc
    title: Per-base quality (pre-trimming)
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: tp-qc-fastp-filtered
    section: Read quality
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    selected_module: fastp
    selected_plot: Filtered Reads
    use: multiqc/fastp
    title: fastp filtered reads
    title_size: sm
    title_align: left
    layout: {x: 0, y: 6, w: 4, h: 5}
  - component_type: multiqc
    tag: tp-qc-post-lengths
    section: Read quality
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    selected_module: fastqc-1
    selected_plot: Sequence Length Distribution
    title: Read lengths (post-trimming)
    title_size: sm
    title_align: left
    layout: {x: 4, y: 6, w: 4, h: 5}

  # ------------------------------------------------- host removal and long reads
  - component_type: text
    tag: tp-host-intro
    section: Host removal and long reads
    title: What was taken out before profiling
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Reads matching the host reference are aligned away before any classifier
      sees them. The nanoq and Nonpareil panels cover the long-read half of the
      run and how much of the community the sequencing effort reached.
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: tp-host-bowtie2
    section: Host removal and long reads
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    selected_module: bowtie2
    selected_plot: Single-end alignments
    use: multiqc/bowtie2
    title: Host alignment rate
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: tp-host-samtools
    section: Host removal and long reads
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    selected_module: samtools
    selected_plot: Percent mapped
    use: multiqc/samtools
    title: Percent mapped to host
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: tp-host-nanoq
    section: Host removal and long reads
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    selected_module: nanoq
    selected_plot: Nanoq Summary
    use: multiqc/nanoq
    title: Long-read filtering summary
    title_size: sm
    title_align: left
    layout: {x: 0, y: 6, w: 4, h: 5}
  - component_type: multiqc
    tag: tp-host-nonpareil
    section: Host removal and long reads
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    selected_module: nonpareil
    selected_plot: Redundancy levels
    use: multiqc/nonpareil
    title: Coverage redundancy
    title_size: sm
    title_align: left
    layout: {x: 4, y: 6, w: 4, h: 5}

  # ------------------------------------------------------------- profiler panels
  - component_type: text
    tag: tp-panels-intro
    section: Profiler panels
    title: Each classifier's own top taxa
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      MultiQC already summarises what each classifier reported, so these panels
      stay as the pipeline drew them. The comparison across classifiers is on
      the Concordance tab, where MultiQC has no equivalent view.
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: tp-panel-kraken
    section: Profiler panels
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    selected_module: kraken
    selected_plot: Top taxa
    use: multiqc/kraken
    title: Kraken2 top taxa
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: tp-panel-bracken
    section: Profiler panels
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    selected_module: bracken
    selected_plot: Top taxa
    use: multiqc/bracken
    title: Bracken top taxa
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: tp-panel-centrifuge
    section: Profiler panels
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    selected_module: centrifuge
    selected_plot: Top taxa
    use: multiqc/centrifuge
    title: Centrifuge top taxa
    title_size: sm
    title_align: left
    layout: {x: 0, y: 6, w: 4, h: 5}
  - component_type: multiqc
    tag: tp-panel-kaiju
    section: Profiler panels
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    selected_module: kaiju
    selected_plot: Top taxa
    use: multiqc/kaiju
    title: Kaiju top taxa
    title_size: sm
    title_align: left
    layout: {x: 4, y: 6, w: 4, h: 5}
  - component_type: multiqc
    tag: tp-panel-metaphlan
    section: Profiler panels
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    selected_module: metaphlan
    selected_plot: Top taxa
    use: multiqc/metaphlan
    title: MetaPhlAn top taxa
    title_size: sm
    title_align: left
    layout: {x: 0, y: 11, w: 4, h: 5}
  - component_type: multiqc
    tag: tp-panel-malt
    section: Profiler panels
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    selected_module: malt
    selected_plot: Metagenomic Mappability
    title: MALT mappability
    title_size: sm
    title_align: left
    layout: {x: 4, y: 11, w: 4, h: 5}

  # ---------------------------------------------------------- reference tables
  - component_type: text
    tag: tp-tables-intro
    section: Reference tables
    title: The rows behind every tile
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The long taxpasta frame every cross-profiler tile is computed from, the
      per-run statistics, and the two sheets that say which sample and which
      database each profiling run belongs to. Filters picked in the left panel
      narrow these tables too.
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_profiles
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: table
    tag: tp-table-profiles
    section: Reference tables
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_profiles
    row_selection_enabled: false
    title: Cross-profiler abundances
    description: One row per profiler, database, sample and taxon, with the raw count and the within-run share.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 5}
  - component_type: table
    tag: tp-table-summary
    section: Reference tables
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    row_selection_enabled: true
    row_selection_column: profiler_db
    title: Per-run profile statistics
    description: Pick a row to narrow the ordination and the profile tiles to that profiling run.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 6, w: 8, h: 4}
  - component_type: table
    tag: tp-table-samplesheet
    section: Reference tables
    workflow_tag: taxprofiler
    data_collection_tag: samplesheet
    row_selection_enabled: false
    title: Samplesheet
    description: The samples, their sequencing runs and their platform.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 10, w: 4, h: 4}
  - component_type: table
    tag: tp-table-databases
    section: Reference tables
    workflow_tag: taxprofiler
    data_collection_tag: database_sheet
    row_selection_enabled: false
    title: Database sheet
    description: Which database each classifier ran against, and for which read type.
    title_size: h3
    title_align: left
    layout: {x: 4, y: 10, w: 4, h: 4}

  # -------------------------------------------------------------- left panel
  - component_type: interactive
    tag: tp-filter-sample
    index: tp-sample-filter
    section: Samples
    group: Sample scope
    workflow_tag: taxprofiler
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:test-tube'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: tp-filter-platform
    index: tp-platform-filter
    section: Samples
    group: Sample scope
    workflow_tag: taxprofiler
    data_collection_tag: samplesheet
    interactive_component_type: SegmentedControl
    column_name: instrument_platform
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:dna'}
    placement: left
    title: Platform
    layout: {x: 0, y: 3, w: 1, h: 2}
  - component_type: interactive
    tag: tp-filter-richness
    index: tp-richness-range
    section: Read stats
    group: Profile shape
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    interactive_component_type: RangeSlider
    column_name: taxa_observed
    column_type: int64
    display: {title_size: md, custom_color: '#F2A93B', icon_name: 'mdi:counter'}
    placement: left
    title: Taxa observed
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: tp-filter-shannon
    index: tp-shannon-range
    section: Read stats
    group: Profile shape
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    interactive_component_type: RangeSlider
    column_name: shannon
    column_type: float64
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:chart-bell-curve'}
    placement: left
    title: Shannon diversity
    layout: {x: 0, y: 3, w: 1, h: 3}

tabs:
# ============================================================== Profiles
- title: Profiles
  subtitle: What each classifier says the community is made of
  tab_order: 1
  tab_icon: mdi:bacteria-outline
  tab_icon_color: grape
  workflow_system: none
  filter_sections:
  - name: Profile scope
    icon: mdi:filter-variant
    color: grape
    description: Which classifiers and which taxonomic rank the composition tiles show
  grid_sections:
  - name: Composition
    icon: mdi:chart-bar
    color: grape
    description: Per-sample composition, switchable by rank and by classifier
  - name: Containment composition
    icon: mdi:waves
    color: teal
    description: The same community as sylph reconstructs it from genome containment
  - name: Genome copies
    icon: mdi:dna
    color: lime
    description: Melon counts genome copies from marker genes rather than reads
    collapsed: true
  components:
  - component_type: text
    tag: tp-comp-intro
    section: Composition
    title: Composition, one classifier at a time
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Every bar is one profiling run, normalised to its own assigned total. Use
      the classifier filter in the left panel to compare two of them side by
      side; the rank picker moves the whole chart up and down the taxonomy.
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_profiles
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: tp-av-stacked
    section: Composition
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_profiles
    use: taxpasta/stacked_taxonomy
    config:
      default_rank: species
      top_n: 15
      sort_by: abundance
      normalise_to_one: true
      annotation_strips:
      - column: platform
        label: Platform
        position: top
    title: Community composition
    description: Per-sample relative abundance; the strip above the bars marks the sequencing platform.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 8}
  - component_type: card
    tag: tp-comp-card-taxa
    section: Composition
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_profiles
    aggregation: nunique
    column_name: name
    column_type: object
    secondary_layout: uniqueness
    display: {icon_name: 'mdi:bacteria-outline', icon_color: '#8E44AD', title_color: '#8E44AD', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Distinct taxa
    layout: {x: 0, y: 9, w: 2, h: 2}
  - component_type: card
    tag: tp-comp-card-counts
    section: Composition
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_profiles
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: count
    column_type: float64
    display: {icon_name: 'mdi:counter', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Assigned reads
    layout: {x: 2, y: 9, w: 2, h: 2}
  - component_type: card
    tag: tp-comp-card-ranks
    section: Composition
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_profiles
    aggregation: nunique
    column_name: rank
    column_type: object
    secondary_layout: composition
    breakdown_col: rank
    display: {icon_name: 'mdi:shape-outline', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Ranks reported
    layout: {x: 4, y: 9, w: 2, h: 2}
  - component_type: card
    tag: tp-comp-card-dominant
    section: Composition
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_profiles
    aggregation: max
    column_name: rel_abundance
    column_type: float64
    secondary_layout: gauge
    coverage_max: 1
    display: {icon_name: 'mdi:chart-donut', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Most dominant taxon
    layout: {x: 6, y: 9, w: 2, h: 2}

  - component_type: text
    tag: tp-sylph-intro
    section: Containment composition
    title: The community sylph reconstructs
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      sylph does not classify reads. It measures how much of each reference
      genome is contained in the sample, which gives a composition built from
      whole genomes rather than from per-read assignments.
    workflow_tag: taxprofiler
    data_collection_tag: sylph_profile
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: tp-av-sylph-stacked
    section: Containment composition
    workflow_tag: taxprofiler
    data_collection_tag: sylph_profile
    use: sylph/stacked_taxonomy
    config:
      default_rank: genus
      top_n: 12
      sort_by: abundance
      normalise_to_one: true
    title: sylph composition
    description: Relative abundance from genome containment, switchable between domain and strain.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 7}
  - component_type: table
    tag: tp-table-sylph-profile
    section: Containment composition
    workflow_tag: taxprofiler
    data_collection_tag: sylph_profile
    row_selection_enabled: false
    title: sylph clade abundances
    description: One row per sample and clade, with the full lineage.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 8, w: 8, h: 4}

  - component_type: text
    tag: tp-melon-intro
    section: Genome copies
    title: Genome copies, not read counts
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Melon estimates how many genome copies of each lineage the long reads
      carry, using prokaryotic marker genes. Its output names the sample only in
      the file path, so these rings pool the long-read samples.
    workflow_tag: taxprofiler
    data_collection_tag: melon_ranks
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: tp-av-melon-sunburst
    section: Genome copies
    workflow_tag: taxprofiler
    data_collection_tag: melon_ranks
    use: melon/sunburst
    config:
      rank_cols: [superkingdom, phylum, class, order, family, genus, species]
      max_depth: 4
      palette: tab10
      # Draw every arc: on a mock community the rare lineages are the result,
      # and the 0.5% default hides exactly them.
      min_percent: 0
    title: Melon genome-copy hierarchy
    description: Ring size is the share of estimated genome copies; four ranks from the domain outwards.
    title_size: h3
    layout: {x: 0, y: 1, w: 4, h: 8}
  - component_type: figure
    tag: tp-fig-melon-copies
    section: Genome copies
    workflow_tag: taxprofiler
    data_collection_tag: melon_ranks
    visu_type: bar
    dict_kwargs: {x: copy_number, y: species, color: phylum, orientation: h}
    title: Estimated copies per species
    description: The lineages melon estimated the most genome copies for.
    title_size: h3
    layout: {x: 4, y: 1, w: 4, h: 8}
  - component_type: table
    tag: tp-table-melon
    section: Genome copies
    workflow_tag: taxprofiler
    data_collection_tag: melon_ranks
    row_selection_enabled: false
    title: Melon lineages
    description: Seven ranks, the estimated copy number, the pooled share and the mean read identity.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 9, w: 8, h: 4}

  - component_type: interactive
    tag: tp-filter-profiler
    index: tp-profiler-filter
    section: Profile scope
    group: Classifier
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_profiles
    interactive_component_type: MultiSelect
    column_name: profiler
    column_type: object
