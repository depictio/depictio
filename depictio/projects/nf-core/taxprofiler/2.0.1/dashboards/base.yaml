# ============================================================== Confidence
- title: Confidence
  subtitle: How much to trust a call, from containment ANI and profile shape
  tab_order: 3
  tab_icon: mdi:target
  tab_icon_color: cyan
  workflow_system: none
  filter_sections:
  - name: Confidence ranges
    icon: mdi:tune
    color: cyan
    description: Keep only the containment matches inside an identity or abundance band
  grid_sections:
  - name: Containment identity
    icon: mdi:ruler
    color: cyan
    description: How close the reads are to the reference each abundance is attributed to
  - name: Profile shape
    icon: mdi:chart-bell-curve
    color: lime
    description: How concentrated each classifier's profile is, and how long its tail runs
  components:
  - component_type: text
    tag: tp-ani-intro
    section: Containment identity
    title: Abundance is only half the answer
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      sylph reports how much of a reference genome the reads contain and how
      close they are to it. A high abundance at a low adjusted ANI is a call
      against a divergent relative, which a read-count classifier reports as a
      confident species hit.
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: tp-av-ani-dot
    section: Containment identity
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    use: sylph/ani_dot_plot
    config:
      colour_scale: Viridis
      max_genes: 25
      gene_sort: mean
      max_dot_size: 24
      annotate_top_n: 0
    title: ANI by genome and sample
    description: Dot colour is the adjusted ANI, dot size the taxonomic abundance of that genome in the sample.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 8}
  - component_type: figure
    tag: tp-fig-ani-scatter
    section: Containment identity
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    visu_type: scatter
    dict_kwargs: {x: taxonomic_abundance, y: adjusted_ani, color: sample, size: eff_cov, hover_name: genome}
    title: ANI against abundance
    description: The bottom-right corner is where a confident-looking abundance rests on a divergent match.
    title_size: h3
    layout: {x: 0, y: 9, w: 4, h: 6}
  - component_type: table
    tag: tp-table-ani
    section: Containment identity
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    row_selection_enabled: true
    row_selection_column: sample
    title: sylph containment table
    description: One row per genome sylph detected, with ANI, coverage and both abundance estimates.
    title_size: h3
    title_align: left
    layout: {x: 4, y: 9, w: 4, h: 6}
  - component_type: card
    tag: tp-card-ani
    section: Containment identity
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: adjusted_ani
    column_type: float64
    display: {icon_name: 'mdi:ruler', icon_color: '#0097A7', title_color: '#0097A7', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Adjusted ANI
    layout: {x: 0, y: 15, w: 2, h: 2}
  - component_type: card
    tag: tp-card-genomes
    section: Containment identity
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    aggregation: nunique
    column_name: genome
    column_type: object
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:database-outline', icon_color: '#8E44AD', title_color: '#8E44AD', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Genomes detected
    layout: {x: 2, y: 15, w: 2, h: 2}
  - component_type: card
    tag: tp-card-cov
    section: Containment identity
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    aggregation: median
    column_name: eff_cov
    column_type: float64
    secondary_layout: threshold
    threshold_value: 1
    threshold_direction: min
    threshold_warn: 0.5
    display: {icon_name: 'mdi:waves', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Effective coverage
    layout: {x: 4, y: 15, w: 2, h: 2}
  - component_type: card
    tag: tp-card-containment
    section: Containment identity
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    aggregation: average
    column_name: containment_frac
    column_type: float64
    secondary_layout: gauge
    coverage_max: 1
    display: {icon_name: 'mdi:check-decagram', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: K-mer containment
    layout: {x: 6, y: 15, w: 2, h: 2}

  - component_type: text
    tag: tp-shape-intro
    section: Profile shape
    title: A profile is a shape, not just a list
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Classifiers that report a handful of dominant taxa and classifiers that
      report a long low-count tail separate on these two views, even when they
      agree on the community. The accumulation curve is where the tail shows.
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: tp-av-richness-dot
    section: Profile shape
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    use: taxpasta/richness_dot_plot
    config:
      colour_scale: Plasma
      max_genes: 20
      gene_sort: mean
      max_dot_size: 26
    title: Diversity by run
    description: Dot colour is Shannon diversity, dot size the share held by the run's single most abundant taxon.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 8}
  - component_type: figure
    tag: tp-fig-accumulation
    section: Profile shape
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_profiles
    mode: code
    title: Rank-abundance accumulation
    description: How much of each profile its top taxa account for. A curve that saturates early is a concentrated profile; one that keeps climbing has a long tail.
    title_size: h3
    code_content: |
      # Rank the taxa inside each profiling run, then accumulate their shares.
      # Needs a window rank + cumulative sum per run, which the UI builder cannot express.
      TOP_N = 30

      ranked = (
          df.filter(pl.col("rel_abundance") > 0)
          .with_columns(
              pl.col("rel_abundance")
              .rank("ordinal", descending=True)
              .over(["profiler_db", "sample"])
              .alias("taxon_rank")
          )
          .filter(pl.col("taxon_rank") <= TOP_N)
          .sort(["profiler_db", "sample", "taxon_rank"])
          .with_columns(
              pl.col("rel_abundance")
              .cum_sum()
              .over(["profiler_db", "sample"])
              .alias("cumulative_share")
          )
          .with_columns(
              (pl.col("sample") + pl.lit(" | ") + pl.col("profiler_db")).alias("run")
          )
      )

      fig = px.line(
          ranked,
          x="taxon_rank",
          y="cumulative_share",
          color="profiler",
          line_group="run",
          hover_name="run",
          markers=False,
          labels={
              "taxon_rank": "taxa, most abundant first",
              "cumulative_share": "cumulative share of the profile",
              "profiler": "classifier",
          },
      )
      fig.update_yaxes(range=[0, 1.02])
      fig.update_layout(legend_title_text="classifier", hovermode="closest")
    layout: {x: 0, y: 9, w: 8, h: 7}

  - component_type: interactive
    tag: tp-filter-ani
    index: tp-ani-range
    section: Confidence ranges
    group: Containment
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    interactive_component_type: RangeSlider
    column_name: adjusted_ani
    column_type: float64
    display: {title_size: md, custom_color: '#0097A7', icon_name: 'mdi:ruler'}
    placement: left
    title: Adjusted ANI
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
