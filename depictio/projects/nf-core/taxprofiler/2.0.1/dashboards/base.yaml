  - component_type: text
    tag: tp-div-intro
    section: Alpha diversity
    title: Diversity is a property of the classifier as much as of the sample
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Shannon diversity and Pielou evenness are computed per profiling run, so
      the same mock community has as many diversity values as classifiers that
      profiled it. Spread along the vertical axis of the scatter is classifier
      disagreement, not biology; spread along the horizontal axis is how many
      taxa each classifier was willing to report at all. The accumulation curve
      underneath says where that richness sits: a curve that saturates early is
      a concentrated profile, one that keeps climbing has a long low-count tail.
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    layout: {x: 0, y: 2, w: 8, h: 2}
  - component_type: figure
    tag: tp-fig-diversity
    section: Alpha diversity
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    use: taxpasta/sample_summary
    visu_type: scatter
    dict_kwargs: {x: taxa_observed, y: shannon, color: profiler, symbol: platform}
    title: Richness against diversity
    description: One point per profiling run. Classifiers that report a long tail move right without moving up.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 7}
  - component_type: figure
    tag: tp-fig-accumulation
    section: Alpha diversity
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_profiles
    use: taxpasta/profiles
    mode: code
    title: Rank-abundance accumulation
    description: How much of each profile its top taxa account for. A curve that saturates early is a concentrated profile; one that keeps climbing has a long tail.
    title_size: h3
    code_content: |
      # Rank the taxa inside each profiling run, then accumulate their shares.
      # Needs a window rank + cumulative sum per run, which the UI builder cannot express.
      TOP_N = 30

      ranked = (
          df.filter(pl.col("rel_abundance") > 0)
          .with_columns(
              pl.col("rel_abundance")
              .rank("ordinal", descending=True)
              .over(["profiler_db", "sample"])
              .alias("taxon_rank")
          )
          .filter(pl.col("taxon_rank") <= TOP_N)
          .sort(["profiler_db", "sample", "taxon_rank"])
          .with_columns(
              pl.col("rel_abundance")
              .cum_sum()
              .over(["profiler_db", "sample"])
              .alias("cumulative_share")
          )
          .with_columns(
              (pl.col("sample") + pl.lit(" | ") + pl.col("profiler_db")).alias("run")
          )
      )

      fig = px.line(
          ranked,
          x="taxon_rank",
          y="cumulative_share",
          color="profiler",
          line_group="run",
          hover_name="run",
          markers=False,
          labels={
              "taxon_rank": "taxa, most abundant first",
              "cumulative_share": "cumulative share of the profile",
              "profiler": "classifier",
          },
      )
      fig.update_yaxes(range=[0, 1.02])
      fig.update_layout(legend_title_text="classifier", hovermode="closest")
    layout: {x: 0, y: 11, w: 8, h: 7}

