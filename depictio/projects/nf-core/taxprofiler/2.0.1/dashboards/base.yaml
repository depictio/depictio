    config:
      max_depth: 4
      palette: tab20
      colour_by_rank: phylum
      show_counts: true
      # Draw every arc: on a mock community the rare lineages are the result,
      # and the 0.5% default hides exactly them.
      min_percent: 0
    title: Lineage rings
    description: Ring size is the share of the selected profiling runs; four ranks from the domain outwards, and the ring picker in the settings moves that window.
