# ============================================================== Concordance
- title: Concordance
  subtitle: Where the classifiers agree, and where each one is on its own
  tab_order: 3
  tab_icon: mdi:graph-outline
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: none
  filter_sections:
  - name: Ordination scope
    icon: mdi:filter-variant
    color: indigo
    description: Which classifiers, platforms, overlap levels and lineages the concordance tiles cover
  grid_sections:
  - name: Ordination
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Profiling runs that agree on the community land together
  - name: Shared taxa
    icon: mdi:set-merge
    color: teal
    description: How much of the community every classifier found, and how long its private tail is
  - name: Taxonomic flow
    icon: mdi:relation-many-to-many
    color: violet
    description: Where the reads go, from the root down the taxonomy, unclassified branch included
  - name: Taxon by run matrix
    icon: mdi:chart-box-outline
    color: orange
    description: The top taxa clustered across every profiling run
    collapsed: true
  components:
  - component_type: card
    tag: tp-card-runs-ord
    section: Ordination
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_embedding
    use: taxpasta/embedding
    aggregation: nunique
    column_name: sample_id
    column_type: object
    secondary_layout: donut
    breakdown_col: platform
    display: {icon_name: 'mdi:chart-scatter-plot', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Runs ordinated
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: tp-card-core
    section: Ordination
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_presence
    use: taxpasta/presence
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: n_profilers
    column_type: int64
    display: {icon_name: 'mdi:set-merge', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Classifiers per taxon
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: tp-card-detections
    section: Ordination
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_presence
    use: taxpasta/presence
    aggregation: nunique
    column_name: taxon
    column_type: object
    secondary_layout: top_n
    breakdown_col: rank
    top_n_count: 4
    display: {icon_name: 'mdi:shape-outline', icon_color: '#8E44AD', title_color: '#8E44AD', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Detected taxa
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: tp-card-shared-frac
    section: Ordination
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_presence
    use: taxpasta/presence
    aggregation: max
    column_name: n_profilers
    column_type: int64
    secondary_layout: gauge
    coverage_max: 12
    display: {icon_name: 'mdi:check-decagram', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Widest agreement
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: text
    tag: tp-ord-intro
    section: Ordination
    title: One point per profiling run
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Bray-Curtis PCoA over the [taxpasta](https://taxpasta.readthedocs.io)
      profiles. Distance here is classifier disagreement, not biology: three
      mock communities profiled seventeen ways should cluster by community, and
      anything that does not is a classifier artefact. Lasso a group of points
      to narrow the rest of the tab.
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_embedding
    layout: {x: 0, y: 2, w: 8, h: 2}
  - component_type: advanced_viz
    tag: tp-av-pcoa
    section: Ordination
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_embedding
    use: taxpasta/profiler_embedding
    config:
      color_col: profiler
      show_density: false
    title: Bray-Curtis ordination
    description: Colour is the classifier; runs of the same community should sit together whatever profiled them.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 7}
  - component_type: figure
    tag: tp-fig-pcoa-select
    section: Ordination
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_embedding
    use: taxpasta/embedding
    visu_type: scatter
    dict_kwargs:
      x: dim_1
      y: dim_2
      color: profiler
      symbol: platform
      custom_data: '["profiler_db"]'
      hover_name: sample_id
    selection_enabled: true
    selection_column: profiler_db
    title: Ordination with selection
    description: Same coordinates, with the point symbol carrying the platform. Box or lasso a set of runs to filter the tab.
    title_size: h3
    layout: {x: 0, y: 11, w: 8, h: 7}

  - component_type: text
    tag: tp-upset-intro
    section: Shared taxa
    title: Which taxa every classifier found
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each column is a set of classifiers and the bar is how many taxa exactly
      that set detected. The tallest bar on the far left is the agreed core;
      single-classifier columns are private tails, and a long one is usually a
      database difference rather than a discovery.
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_presence
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: tp-av-upset
    section: Shared taxa
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_presence
    use: taxpasta/profiler_upset
    config:
      sort_by: cardinality
      sort_order: descending
      # The set columns are the run's classifiers, discovered at ingest, so no
      # explicit list can be written in a generic template: the auto-detection
      # picks exactly the 0/1 columns. `degree`, not `set`, for the same reason
      # plotly-upset needs an explicit set_colors map in `set` mode.
      min_size: 2
      show_set_sizes: true
      color_intersections_by: degree
      default_annotation_cols:
      - taxon
    title: Classifier detection overlap
    description: Taxa shared by each combination of classifiers, for the samples selected in the left panel.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 8}

  # ------------------------------------------------------------ taxonomic flow
  - component_type: text
    tag: tp-flow-intro
    section: Taxonomic flow
    title: Where the reads go, root to species
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The Pavian view of a profile: every read leaves the root and follows the
      taxonomy down, so the width of a band is the share of the community that
      took that path. The reads a classifier could not place are a band of their
      own off the root, which is the fastest way to see what kraken2 discards
      before its top-taxa panel is drawn. The depth control in the settings adds
      or removes ranks; pick one classifier in the left panel to read a single
      profile rather than the pooled flow.
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_lineage
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: tp-av-lineage-sankey
    section: Taxonomic flow
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_lineage
    use: taxpasta/lineage_sankey
    config:
      step_cols: [root, superkingdom, phylum, genus]
      available_step_cols: [root, superkingdom, phylum, class, order, family, genus, species]
      depth: 4
      value_col: rel_abundance
      value_label: share of the profile
      value_format: fraction
      sort_mode: total_flow
      color_mode: source
      link_opacity: 0.5
      min_link_value: 0
      show_node_labels: true
    title: Root to species flow
    description: Band width is the share of the selected profiling runs that followed that lineage; the unclassified band is the reads no taxon was assigned to.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 8}

  - component_type: text
    tag: tp-heat-intro
    section: Taxon by run matrix
    title: The same taxa, every classifier at once
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Rows are the most abundant taxa, columns are profiling runs, and the value
      is the taxon's share of that run. Row z-scores make the pattern readable
      across taxa whose absolute abundances differ by orders of magnitude.
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_matrix
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: tp-av-heatmap
    section: Taxon by run matrix
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_matrix
    use: taxpasta/concordance_heatmap
    config:
      row_annotation_cols:
      - rank
      cluster_rows: true
      cluster_cols: true
      cluster_method: ward
      cluster_metric: correlation
      normalize: row_z
    title: Taxon by run heatmap
    description: Top taxa clustered across every profiling run, with the rank as a row annotation and the classifier and platform on the column strips.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 10}

  - component_type: interactive
    tag: tp-filter-ord-profiler
    index: tp-ord-profiler-filter
    section: Ordination scope
    group: Ordination
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_embedding
    interactive_component_type: MultiSelect
    column_name: profiler
    column_type: object
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:bacteria-outline'}
    placement: left
    title: Classifier
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: tp-filter-ord-platform
    index: tp-ord-platform-filter
    section: Ordination scope
    group: Ordination
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_embedding
    interactive_component_type: SegmentedControl
    column_name: platform
    column_type: object
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:dna'}
    placement: left
    title: Platform
    layout: {x: 0, y: 3, w: 1, h: 2}
  - component_type: interactive
    tag: tp-filter-overlap
    index: tp-overlap-range
    section: Ordination scope
    group: Overlap
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_presence
    interactive_component_type: RangeSlider
    column_name: n_profilers
    column_type: int64
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:set-merge'}
    placement: left
    title: Classifiers per taxon
    layout: {x: 0, y: 5, w: 1, h: 3}
  - component_type: interactive
    tag: tp-filter-flow-domain
    index: tp-flow-domain-filter
    section: Ordination scope
    group: Flow
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_lineage
    interactive_component_type: MultiSelect
    column_name: superkingdom
    column_type: object
    display: {title_size: md, custom_color: '#7E57C2', icon_name: 'mdi:family-tree'}
    placement: left
    title: Domain
    layout: {x: 0, y: 8, w: 1, h: 3}
  - component_type: interactive
    tag: tp-filter-flow-profiler
    index: tp-flow-profiler-filter
    section: Ordination scope
    group: Flow
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_lineage
    interactive_component_type: MultiSelect
    column_name: profiler
    column_type: object
    display: {title_size: md, custom_color: '#7E57C2', icon_name: 'mdi:bacteria-outline'}
    placement: left
    title: Flow classifier
    layout: {x: 0, y: 11, w: 1, h: 3}

# ============================================================== Confidence
- title: Confidence
  subtitle: How much to trust a call, from containment ANI and profile shape
  tab_order: 4
  tab_icon: mdi:target
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: none
  filter_sections:
  - name: Confidence ranges
    icon: mdi:tune
    color: cyan
    description: Keep only the containment matches inside an identity or abundance band
  grid_sections:
  - name: Containment identity
    icon: mdi:ruler
    color: cyan
    description: How close the reads are to the reference each abundance is attributed to
  - name: Profile shape
    icon: mdi:chart-bell-curve
    color: lime
    description: How concentrated each classifier's profile is, and how long its tail runs
  components:
  - component_type: card
    tag: tp-card-ani
    section: Containment identity
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    use: sylph/ani
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: adjusted_ani
    column_type: float64
    display: {icon_name: 'mdi:ruler', icon_color: '#0097A7', title_color: '#0097A7', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Adjusted ANI
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: tp-card-genomes
    section: Containment identity
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    use: sylph/ani
    aggregation: nunique
    column_name: genome
    column_type: object
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:database-outline', icon_color: '#8E44AD', title_color: '#8E44AD', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Genomes detected
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: tp-card-cov
    section: Containment identity
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    use: sylph/ani
    aggregation: median
    column_name: eff_cov
    column_type: float64
    secondary_layout: threshold
    threshold_value: 1
    threshold_direction: min
    threshold_warn: 0.5
    display: {icon_name: 'mdi:waves', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Effective coverage
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: tp-card-containment
    section: Containment identity
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    use: sylph/ani
    aggregation: average
    column_name: containment_frac
    column_type: float64
    secondary_layout: gauge
    coverage_max: 1
    display: {icon_name: 'mdi:check-decagram', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: K-mer containment
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: text
    tag: tp-ani-intro
    section: Containment identity
    title: Abundance is only half the answer
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [sylph](https://github.com/bluenote-1577/sylph) reports how much of a
      reference genome the reads contain and how close they are to it. A high
      abundance at a low adjusted ANI is a call against a divergent relative,
      which a read-count classifier reports as a confident species hit.
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    layout: {x: 0, y: 2, w: 8, h: 2}
  - component_type: advanced_viz
    tag: tp-av-ani-dot
    section: Containment identity
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    use: sylph/ani_dot_plot
    config:
      colour_scale: Viridis
      max_genes: 25
      gene_sort: mean
      max_dot_size: 24
      annotate_top_n: 0
    title: ANI by genome and sample
    description: Dot colour is the adjusted ANI, dot size the taxonomic abundance of that genome in the sample.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 8}
  - component_type: figure
    tag: tp-fig-ani-scatter
    section: Containment identity
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    use: sylph/ani
    visu_type: scatter
    dict_kwargs: {x: taxonomic_abundance, y: adjusted_ani, color: sample, size: eff_cov, hover_name: genome}
    title: ANI against abundance
    description: The bottom-right corner is where a confident-looking abundance rests on a divergent match.
    title_size: h3
    layout: {x: 0, y: 12, w: 8, h: 6}
  - component_type: table
    tag: tp-table-ani
    section: Containment identity
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    use: sylph/ani
    row_selection_enabled: true
    row_selection_column: sample
    title: sylph containment table
    description: One row per genome sylph detected, with ANI, coverage and both abundance estimates.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 18, w: 8, h: 7}

  - component_type: text
    tag: tp-shape-intro
    section: Profile shape
    title: A profile is a shape, not just a list
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Classifiers that report a handful of dominant taxa and classifiers that
      report a long low-count tail separate on these two views, even when they
      agree on the community. The bar chart is the blunt version of it: the
      share held by each run's single most abundant taxon, which is also the
      threshold the top-taxon slider in the left panel moves.
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: tp-av-richness-dot
    section: Profile shape
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    use: taxpasta/richness_dot_plot
    config:
      colour_scale: Plasma
      max_genes: 20
      gene_sort: mean
      max_dot_size: 26
    title: Diversity by run
    description: Dot colour is Shannon diversity, dot size the share held by the run's single most abundant taxon.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 8}
  - component_type: figure
    tag: tp-fig-top-share
    section: Profile shape
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    use: taxpasta/sample_summary
    visu_type: bar
    dict_kwargs: {x: profiler_db, y: top_taxon_fraction, color: profiler}
    title: Top-taxon share per run
    description: How much of each profile its single most abundant taxon holds. A tall bar is a concentrated call, a short one a community spread thin.
    title_size: h3
    layout: {x: 0, y: 10, w: 8, h: 6}

  - component_type: interactive
    tag: tp-filter-ani
    index: tp-ani-range
    section: Confidence ranges
    group: Containment
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    interactive_component_type: RangeSlider
    column_name: adjusted_ani
    column_type: float64
    display: {title_size: md, custom_color: '#0097A7', icon_name: 'mdi:ruler'}
    placement: left
    title: Adjusted ANI
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: tp-filter-sylph-abundance
    index: tp-sylph-abundance-range
    section: Confidence ranges
    group: Containment
    workflow_tag: taxprofiler
    data_collection_tag: sylph_ani
    interactive_component_type: RangeSlider
    column_name: taxonomic_abundance
    column_type: float64
    display: {title_size: md, custom_color: '#0097A7', icon_name: 'mdi:chart-donut'}
    placement: left
    title: Taxonomic abundance
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: tp-filter-top-share
    index: tp-top-share-range
    section: Confidence ranges
    group: Profile shape
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    interactive_component_type: RangeSlider
    column_name: top_taxon_fraction
    column_type: float64
    display: {title_size: md, custom_color: '#7CB342', icon_name: 'mdi:chart-bell-curve'}
    placement: left
    title: Top-taxon share
    layout: {x: 0, y: 6, w: 1, h: 3}
