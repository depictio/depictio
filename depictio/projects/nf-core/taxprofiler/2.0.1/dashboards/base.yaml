version: 1
# nf-core/taxprofiler 2.0.1. Every rule this file follows is written out in
# depictio/projects/nf-core/RULES.md; ampliseq/2.18.0 is the reference.
#
# Funnel: the Overview, then Data & QC (the MultiQC report, then the depth
# Nonpareil says the reads reached), then Communities (what each classifier
# says the community is, then how diverse each profile is), then Classifiers
# (where they agree, and how close sylph's genome matches are).
#
# Many classifiers, one community: one sample has one profile per classifier
# and database (a profiling run), so the cards and figures count runs, and the
# spread between the runs of one sample is classifier disagreement.
#
# Routes: taxprofiler runs any subset of its classifiers. The taxpasta
# collections exist whatever the subset; sylph, melon and Nonpareil are
# optional, and the Sequencing depth tab, the Confidence tab and the Overview
# rows that point at them go with their data. The sample sheet is optional too
# (auto-detected under input/); without it the persistent filters go.
main_dashboard:
  title: nf-core/taxprofiler
  subtitle: Many classifiers, one community, from reads to the taxa they agree on
  project_tag: Taxprofiler Metagenomic Profiling
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab: figures, advanced viz and filter
  # chips colour a value the same way. The classifiers are taxprofiler's own
  # vocabulary, pinned so a run with another subset keeps its colours.
  category_colors:
    profiler:
      '*': auto
      kraken2: '#2a78d6'
      bracken: '#4a3aa7'
      krakenuniq: '#1098ad'
      centrifuge: '#eb6834'
      kaiju: '#1baf7a'
      metaphlan: '#e34948'
      motus: '#eda100'
      ganon: '#e87ba4'
      kmcp: '#008300'
      diamond: '#7048e8'
      metacache: '#c2255c'
      megan6: '#5c940d'
      sylph: '#e8590c'
      unknown: '#adb5bd'
    platform:
      ILLUMINA: '#2a78d6'
      OXFORD_NANOPORE: '#eb6834'
    instrument_platform:
      ILLUMINA: '#2a78d6'
      OXFORD_NANOPORE: '#eb6834'
    superkingdom:
      Bacteria: '#1098ad'
      Archaea: '#7048e8'
      Eukaryota: '#c2255c'
      Viruses: '#e8590c'
      unclassified: '#adb5bd'
      unresolved: '#868e96'
    # The eight most abundant phyla, genera and species take the palette,
    # largest first, so the stacked compositions, the rings and the flow agree;
    # the stacked compositions show the same eight and fold the rest into Other.
    phylum:
      '*': 'auto:rel_abundance'
      Other: '#adb5bd'
      unclassified: '#adb5bd'
      unresolved: '#868e96'
    genus:
      '*': 'auto:rel_abundance'
      Other: '#adb5bd'
      unclassified: '#adb5bd'
      unresolved: '#868e96'
    species:
      '*': 'auto:rel_abundance'
      Other: '#adb5bd'
      unclassified: '#adb5bd'
      unresolved: '#868e96'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. Bound
  # to the sample sheet, the source of every sample link in template.yaml.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab rather than on an analysis tab: a run that prunes
  # that tab would take a persistent section declared there with it.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The sample sheet behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
  - name: Database sheet
    icon: mdi:database-outline
    color: gray
    description: The reference database each classifier ran against
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Profiling runs).
  - component_type: interactive
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    interactive_component_type: MultiSelect
    column_name: profiler
    column_type: object
    display:
      icon_name: mdi:bacteria-outline
      custom_color: violet
      strip_label: Classifier
    section: Key figures
    tag: tp-ov-kf-profiler
    index: ov-kf-profiler
    title: Classifier
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: taxprofiler
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: tp-ov-kf-sample
    index: ov-kf-sample
    title: Sample
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: text
    title: nf-core/taxprofiler
    logo: https://raw.githubusercontent.com/nf-core/taxprofiler/master/docs/images/nf-core-taxprofiler_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/taxprofiler/master/docs/images/nf-core-taxprofiler_logo_dark.png
    order: 1
    body: >
      Metagenome reads profiled by many classifiers at once, their profiles standardised by
      taxpasta and compared side by side. [Run parameters](params:)
    tag: tp-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  # The study: the samples profiled and how they were sequenced, from the optional
  # samplesheet. The sample count comes from the taxpasta summary every route writes, so
  # the card keeps a line without a sheet; the sequencing lines go with the sheet.
  - component_type: text
    surface: card
    values:
      samples: {dc: taxpasta_sample_summary, column: sample, aggregation: nunique, format: integer}
      platforms: {dc: samplesheet, column: instrument_platform, aggregation: nunique, format: integer}
      top_platform: {dc: samplesheet, column: instrument_platform, aggregation: top}
      runs: {dc: samplesheet, column: run_accession, aggregation: nunique, format: integer}
    body: |
      ### The study
      - ![](icon:mdi:flask-outline) **Samples** {{samples}} profiled
      - ![](icon:mdi:chip) **Platform** {{platforms}} sequencing platforms, mostly {{top_platform}}
      - ![](icon:mdi:file-table-outline) **Samplesheet** [{{runs}} rows, one per sequencing run](section:Sample sheet), its path in [the run parameters](params:input)
      - ![](icon:mdi:palette-outline) **Instrument platform** {{legend:instrument_platform}}
    tag: tp-ov-study
    index: ov-study
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash.
  - component_type: text
    surface: card
    values:
      classifiers: {dc: taxpasta_sample_summary, column: profiler, aggregation: nunique, format: integer}
      databases: {dc: taxpasta_sample_summary, column: database, aggregation: nunique, format: integer}
    body: |
      ### The run
      - ![](icon:mdi:source-branch) **Pipeline** nf-core/taxprofiler 2.0.1
      - ![](icon:mdi:bacteria-outline) **Classifiers** {{classifiers}}
      - ![](icon:mdi:database-outline) **Databases** {{databases}}
      - ![](icon:mdi:content-cut) **Read QC** {{param:shortread_qc_tool}} · {{param:longread_filter_tool}}
    tag: tp-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  # The marks take the family's colour (the header's), not the theme's blue. The Depth and
  # Confirm steps cite a value from their tab's collections: a run without Nonpareil or
  # sylph drops them with their data.
  - component_type: text
    surface: card
    accent: green
    values:
      n_depth: {dc: nonpareil_summary, column: sample, aggregation: nunique, format: integer}
      n_genomes: {dc: sylph_ani, column: genome, aggregation: nunique, format: si}
    body: |
      ### Six steps from reads to agreed taxa
      Each step names its settings and the tab that shows its result. A step the run skipped drops out.

      ::: steps
      1. ![](icon:mdi:content-cut) **Clean** Trim, filter, remove host · [Settings](params:qc) · [MultiQC](tab:MultiQC)
      2. ![](icon:mdi:waves) **Depth** Nonpareil coverage of {{n_depth}} samples · [Settings](params:redundancy) · [Depth](tab:Sequencing depth)
      3. ![](icon:mdi:tag-outline) **Profile** Every classifier, every database · [Settings](params:run_) · [Profiles](tab:Profiles)
      4. ![](icon:mdi:sigma) **Standardise** taxpasta merges the profiles · [Settings](params:taxpasta) · [Diversity](tab:Diversity)
      5. ![](icon:mdi:set-merge) **Compare** The classifiers side by side · [Settings](params:standardisation) · [Concordance](tab:Concordance)
      6. ![](icon:mdi:target) **Confirm** sylph checks the identity of {{n_genomes}} genomes · [Settings](params:sylph) · [Confidence](tab:Confidence)
      :::
    tag: tp-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/taxprofiler runs many classifiers over the same reads, each against its own databases, and taxpasta standardises their profiles into one table. One sample thus has one profile per classifier and database, and the tabs compare them.

      The sample filters in the left panel apply to every tab: narrow the samples once and the whole dashboard follows. A bar above a section narrows that section only.
    tag: tp-ov-about
    index: ov-about
    layout: {x: 0, y: 7, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it, all on the taxpasta collections every route writes. The icon
  # colour is that tab's colour.
  - component_type: card
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    use: taxpasta/sample_summary
    aggregation: count
    column_name: profiler_db
    column_type: object
    secondary_layout: composition
    breakdown_col: profiler
    display:
      icon_name: mdi:database-outline
      icon_color: grape
      caption: one per sample and database, by classifier
      link: tab:Profiles
    section: Key figures
    tag: tp-ov-kf-runs
    index: ov-kf-runs
    title: Profiling runs
    description: One profile per sample, classifier and database. The bar splits them by classifier.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    use: taxpasta/sample_summary
    aggregation: median
    column_name: assigned_count
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:counter
      icon_color: orange
      caption: median per profiling run
      link: tab:MultiQC
      format: si
    section: Key figures
    tag: tp-ov-kf-assigned
    index: ov-kf-assigned
    title: Reads assigned
    description: Median reads a classifier assigned in one sample. The MultiQC tab shows the reads it was given.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_sample_summary
    use: taxpasta/sample_summary
    aggregation: median
    column_name: shannon
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: lime
      caption: median per profiling run
      link: tab:Diversity
      decimals: 2
    section: Key figures
    tag: tp-ov-kf-shannon
    index: ov-kf-shannon
    title: Shannon diversity
    description: Median Shannon diversity of the profiles. The box shows how it spreads across samples and classifiers.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: taxprofiler
    data_collection_tag: taxpasta_presence
    use: taxpasta/presence
    aggregation: median
    column_name: n_profilers
    column_type: int64
    secondary_layout: threshold
    threshold_value: 2
    threshold_direction: min
    display:
      icon_name: mdi:set-merge
      icon_color: indigo
      caption: median; 2 or more is a shared call
      link: tab:Concordance
      decimals: 0
    section: Key figures
    tag: tp-ov-kf-agreement
    index: ov-kf-agreement
    title: Classifiers per taxon
    description: Median number of classifiers that detected a taxon in a sample.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the platform, then the sample.
  - component_type: interactive
    workflow_tag: taxprofiler
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: instrument_platform
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: cyan
      strip_label: Platform
    section: Findings
    tag: tp-ov-findings-platform
    index: ov-findings-platform
    title: Platform
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: taxprofiler
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Sample
    section: Findings
    tag: tp-ov-findings-sample
    index: ov-findings-sample
    title: Sample
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data. The phylum row reads the species rows only, so
  # no share is counted twice across ranks.
  - component_type: text
    surface: card
    values:
      ph_top: {dc: taxpasta_lineage, column: phylum, aggregation: top, weight: rel_abundance, filter_expr: "(col('rank') == 'species') & (col('phylum') != 'unclassified') & (col('phylum') != 'unresolved')"}
      ph_share: {dc: taxpasta_lineage, column: phylum, aggregation: top_share, weight: rel_abundance, filter_expr: "(col('rank') == 'species') & (col('phylum') != 'unclassified') & (col('phylum') != 'unresolved')",
        format: percent}
      shannon: {dc: taxpasta_sample_summary, column: shannon, aggregation: median, format: 'decimals:2'}
      n_multi: {dc: taxpasta_presence, column: taxon, aggregation: count, filter_expr: "col('n_profilers') >= 2", format: integer}
      n_calls: {dc: taxpasta_presence, column: taxon, aggregation: count, format: integer}
      ani: {dc: sylph_ani, column: adjusted_ani, aggregation: median, format: 'decimals:1'}
    body: |
      - **{{ph_share}}** of the species-level abundance falls in {{ph_top}} – the top phylum, classifiers pooled [Profiles](tab:Profiles)
      - **{{shannon}}** median Shannon diversity – one value per sample and classifier [Diversity](tab:Diversity)
      - **{{n_multi}}** of {{n_calls}} taxon calls come from two classifiers or more – per sample [Concordance](tab:Concordance)
      - **{{ani}}%** median identity to the genomes sylph matched – 95% marks a species [Confidence](tab:Confidence)
    section: Findings
    tag: tp-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per analysis tab, in the order of the rows above. The import
  # drops a highlight whose source is gone and re-packs the grid.
  - component_type: highlight
    section: Findings
    source_tab: Profiles
    source_component: prof-composition
    caption: One bar per classifier and database, the eight most abundant species, the rest folded into Other.
    tag: tp-ov-hl-composition
    index: ov-hl-composition
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Diversity
    source_component: div-richness-shannon
    hide_legend: true
    caption: One point per sample and classifier, coloured by classifier; a long tail moves a run right without moving it up.
    tag: tp-ov-hl-diversity
    index: ov-hl-diversity
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Concordance
    source_component: conc-pcoa
    hide_legend: true
    title: Profile ordination (PCoA)
    caption: One point per sample and classifier, coloured by classifier; runs of one sample land together when they agree.
    tag: tp-ov-hl-pcoa
    index: ov-hl-pcoa
    layout: {x: 0, y: 7, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Confidence
    source_component: conf-ani-abundance
    hide_legend: true
    caption: One point per genome and sample, coloured by sample; bottom right, an abundant genome matched at low identity.
    tag: tp-ov-hl-ani
    index: ov-hl-ani
    layout: {x: 4, y: 7, w: 4, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers. A tab the run does not have is left out, and a heading whose
  # tabs are all missing is hidden.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Sequencing depth](tab:Sequencing depth)

      ### Communities
      - [Profiles](tab:Profiles)
      - [Diversity](tab:Diversity)

      ### Classifiers
      - [Concordance](tab:Concordance)
      - [Confidence](tab:Confidence)
    section: How to read this dashboard
    tag: tp-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the platform first.
  - component_type: interactive
    workflow_tag: taxprofiler
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: instrument_platform
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: cyan
    section: Sample filters
    group: Sample scope
    tag: tp-filter-platform
    index: sample-filters-platform
    title: Platform
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: taxprofiler
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: tp-filter-sample
    index: sample-filters-sample
    title: Sample
    layout: {x: 0, y: 2, w: 1, h: 3}
  # A sample can be split over several sequencing runs. Accessions are
  # identifiers (numeric in some sheets, ERR/SRR strings in others), so the
  # sample sheet is read as text and the filter is a select.
  - component_type: interactive
    workflow_tag: taxprofiler
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: run_accession
    column_type: object
    display:
      icon_name: mdi:counter
      custom_color: gray
    section: Sample filters
    group: Sample scope
    tag: tp-filter-run
    index: sample-filters-run
    title: Sequencing run
    layout: {x: 0, y: 5, w: 1, h: 3}
  - component_type: table
    workflow_tag: taxprofiler
    data_collection_tag: samplesheet
    row_selection_enabled: true
    row_selection_column: sample
    section: Sample sheet
    tag: tp-sample-sheet
    index: sample-sheet
    title: Sample sheet
    description: >-
      The samplesheet the run was started with: one row per sequencing run of a sample, with its platform
      and read files. It is the table every sample filter starts from.

      How to read: a sample with several rows was sequenced more than once, and each run accession is
      unique even within a sample. The platform sets the colour or symbol of a run in the plots. A row
      picked here narrows the sample-level tiles to that sample.

      Note: the sheet is optional; without it the sample filters and this table are absent.

      Source: nf-core/taxprofiler usage, https://nf-co.re/taxprofiler/2.0.1/docs/usage
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: taxprofiler
    data_collection_tag: database_sheet
    section: Database sheet
    tag: tp-database-sheet
    index: database-sheet
    title: Database sheet
    description: >-
      The database sheet of the run: which database each classifier or profiler was run against, with its
      parameters.

      How to read: each row is one profiling setup, a tool and a database name. A classifier listed with
      two databases gives two profiling runs per sample in the plots. Check here which database a run name
      in the plots refers to.

      Note: the sheet is an input of the pipeline and is not copied into the results, so this table is
      read from the sheet given to the template.

      Source: nf-core/taxprofiler usage, https://nf-co.re/taxprofiler/2.0.1/docs/usage
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
- title: MultiQC
  subtitle: Were the reads clean, and how much host was removed?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # Bound to multiqc_data, not the sample sheet, so the tab keeps a sample
  # filter on a run whose sample sheet was not found.
  filter_sections:
  - name: MultiQC report
    icon: mdi:file-document-outline
    color: orange
    description: Samples as the MultiQC report names them
  grid_sections:
  - name: QC overview
    icon: mdi:chart-box-outline
    color: orange
    description: Reads kept through trimming, their quality, and the share aligned to the host
  - name: QC details
    icon: mdi:file-document-outline
    color: gray
    description: Read counts and lengths, long-read filtering and coverage redundancy
    collapsed: true
  - name: Profiler panels
    icon: mdi:bacteria-outline
    color: gray
    description: The top-taxa panels MultiQC builds for each classifier
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [MultiQC](https://multiqc.info) gathers the read QC of the run:
      [FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/) before and after trimming,
      fastp and nanoq filtering, and the alignment that removes host reads. Check that no sample
      stands out here before comparing classifiers on the later tabs. Each classifier's own top-taxa
      panel is collapsed at the end.
    tag: tp-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: MultiQC report
    tag: tp-mqc-filter-sample
    index: mqc-sample-filter
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: multiqc
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: QC overview
    tag: tp-mqc-general-stats
    title: General statistics
    description: One row per sample with the headline numbers of every QC tool and classifier.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    use: multiqc/fastp
    selected_module: fastp
    selected_plot: Filtered Reads
    section: QC overview
    tag: tp-mqc-fastp-filtered
    title: Short reads kept and discarded
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: taxprofiler
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    section: QC overview
    tag: tp-mqc-fastqc-quality
