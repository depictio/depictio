  # Bound to the genome hub, which carries the design group the points take
  # their colour from and every per-genome number the record shows.
  - component_type: advanced_viz
    workflow_tag: genomeqc
    data_collection_tag: genomes
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: n_contigs
      y_col: n50
      label_col: genome
      color_col: genome
      x_title: Sequences in the assembly (log scale)
      y_title: N50 in bp (log scale)
      log_x: true
      log_y: true
      marker_size: 18
      opacity: 0.85
      marker_outline: true
      top_n_labels: 10
      reference_line: horizontal
      reference_value: 1000000
      reference_label: N50 of 1 Mb (EBP minimum)
      legend_pos: bottom
      selection_enabled: true
      selection_column: genome
    section: Contiguity
    tag: gq-asm-av-contiguity
    index: asm-contiguity
    title: Sequences against N50 per assembly
    description: >-
      How contiguous is each assembly? Each point is one assembly, in the colour of its genome (the same
      everywhere in this dashboard), placed by its number of sequences (x) and its N50 (y) on log axes,
      because assemblies differ by orders of magnitude. The highest points carry their genome's name.

      How to read: up and to the left is better, few sequences holding a long N50, as a chromosome-level
      assembly does; down and to the right is a draft in many pieces. Open [Karyotype](tab:Karyotype) to
      see how the conserved genes sit on the sequences of a promising assembly. Click or lasso a point to
      open its record and narrow every tab.

      Reference lines: the dashed horizontal line marks an N50 of 1 Mb, the minimum contig N50 of the
      Earth BioGenome Project assembly standard. It is a fixed reference, not read from the run, and a
      floor rather than a guarantee of quality: the standard also asks for chromosome-scale scaffolds.

      Source: Earth BioGenome Project assembly standards (6.C.Q40),
      https://earthbiogenome.org/report-on-assembly-standards

      Note: the standard names a contig N50, taken after splitting scaffolds at gaps, while QUAST takes
      N50 on the sequences as submitted unless it splits them. A scaffolded assembly can therefore sit
      above the line and still fall below the standard.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: genomeqc
    data_collection_tag: genomes
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: asm-contiguity
      id_col: genome
      title_col: genome
      selection_source: scatter_selection
      sections:
        Assembly: [total_length, n_contigs, largest_contig, n50, n90, l50, l90, gc_percent, ns_per_100_kbp]
        Completeness: [busco_complete_pct, busco_duplicated_pct, busco_missing_pct, protein_complete_pct, sequences_with_busco]
        Annotation: [genes, exons_per_transcript, single_exon_gene_pct, genes_in_orthogroups_pct]
        Screening: [contaminant_pct, gx_flagged_ranges, adaptor_ranges, masked_pct]
    section: Contiguity
    tag: gq-asm-av-record
    index: asm-genome-record
    title: Picked genome
    description: >-
      What does the picked genome hold, from contiguity to repeats? The card lists the numbers of the
      genome picked on the contiguity chart in four groups: Assembly (length, sequences, N50, N90, L50,
      L90, GC and N bases per 100 kb), Completeness (BUSCO shares of the assembly and its proteins),
      Annotation (genes, exons per transcript, single-exon and orthogroup shares) and Screening (foreign,
      flagged, adaptor and masked shares).

      How to read: no value is rated here, so read a weak one against the other groups of the same genome
      and against the other genomes (pick another point). A low complete BUSCO share with many N bases
      points at the assembly; a low share only in the proteins points at the annotation. Open
      [Completeness](tab:Completeness), [Annotation](tab:Annotation) or [Contamination](tab:Contamination)
      for the chart behind each group.

      Note: a group the run did not produce, such as the annotation of a genome-only run or the screening
      without an FCS-GX database, has nothing to show.
    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: advanced_viz
    workflow_tag: genomeqc
    data_collection_tag: quast_length_ladder
    use: quast/retained_fraction
    config:
      x_title: Minimum sequence length (bp)
      y_title: Share of the assembly kept
      legend_pos: bottom
    section: Length ladder
    tag: gq-asm-av-ladder
    index: asm-ladder
    title: Assembly kept above each sequence length
    description: >-
      How much of each assembly sits in long sequences? Each curve is one assembly, named after its FASTA:
      the share of its bases kept (y) when only sequences at least as long as x are counted, at QUAST's
      minimum lengths. The share is taken against the longest rung, which is the whole assembly when the
      run keeps QUAST's default 0 bp threshold.

      How to read: a curve that holds near 1 far to the right keeps its length in long sequences, as a
      chromosome-level assembly does; one that falls early spreads its length over many short sequences,
      as a draft does. Compare curves by where they drop. Open [Karyotype](tab:Karyotype) to see how the
      conserved genes sit on the long sequences.

      Note: no reference line is drawn, because no cut-off is applied to this curve; read each assembly
      against the others.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: genomeqc
    data_collection_tag: quast_assembly_report
    use: quast/assembly_report
    columns: [assembly_id, n_contigs, total_length, largest_contig, n50, l50, gc_percent, ns_per_100_kbp, contigs_over_1kb, length_over_1kb]
    row_selection_enabled: true
    row_selection_column: assembly_id
    section: Assembly tables
    tag: gq-asm-table-quast
    index: asm-table-quast
    title: QUAST statistics per assembly
    description: Sequences, length, longest sequence, N50, L50, GC and N bases of every assembly, named after its FASTA.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: genomeqc
    data_collection_tag: quast_length_ladder
    use: quast/length_ladder
    section: Assembly tables
    tag: gq-asm-table-ladder
    index: asm-table-ladder
    title: Length ladder per assembly
    description: Sequences and bases at or above each of QUAST's minimum lengths.
    layout: {x: 0, y: 6, w: 8, h: 6}
- title: Contamination
  subtitle: Does any assembly carry foreign or adaptor sequence?
  tab_group: Data & QC
  tab_order: 3
  tab_icon: mdi:shield-search
  tab_icon_color: red
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Screening scope
    icon: mdi:filter-variant
    color: red
    description: The Tiara classes and the FCS-GX actions the tiles keep
  grid_sections:
  - name: Screening at a glance
    icon: mdi:counter
    color: red
    description: Foreign share, flagged ranges, adaptors and prokaryotic sequences
  - name: Foreign sequence per genome
    icon: mdi:chart-bar
    color: red
    description: The share FCS-GX calls foreign, and the class Tiara gives each sequence
  - name: Flagged ranges
    icon: mdi:table
    color: gray
    description: Every range FCS-GX and FCS-adaptor flag, and Tiara's class per sequence
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [FCS-GX](https://github.com/ncbi/fcs) aligns every sequence to a database of genomes and
      flags what belongs to another organism; FCS-adaptor looks for adaptors and vectors, and
      [Tiara](https://ibe-uw.github.io/tiara/) classes each sequence of 3 kb or more by domain. A
      Tiara call alone is a lead, not a verdict: short repetitive scaffolds often read as
      prokaryotic or unknown. Each bar is one genome, named on its axis: the first chart reads the
      FCS-GX share against genomeqc's cut-offs, in the second colour is the Tiara class.
    tag: gq-con-intro
    index: con-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: genomeqc
    data_collection_tag: tiara_classifications
    interactive_component_type: MultiSelect
    column_name: tiara_class
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: red
    section: Screening scope
    group: Screening
    tag: gq-con-filter-class
    index: con-class-filter
    title: Tiara class
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: genomeqc
    data_collection_tag: fcsgx_actions
    interactive_component_type: MultiSelect
    column_name: action
    column_type: object
    display:
      icon_name: mdi:content-cut
      custom_color: orange
    section: Screening scope
    group: Screening
    tag: gq-con-filter-action
    index: con-action-filter
    title: FCS-GX action
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: fcsgx_contamination
    aggregation: max
    column_name: contaminant_pct
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.5
    threshold_direction: max
    threshold_warn: 2
    display:
      icon_name: mdi:biohazard
      icon_color: red
      caption: assemblies at 0.5% or less, above 2% failing
      decimals: 2
    section: Screening at a glance
    tag: gq-con-card-foreign
    index: con-card-foreign
    title: Foreign share
    description: Share of an assembly FCS-GX calls foreign, at its highest. genomeqc rates 0.5% or less good and more than 2% poor.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: fcsgx_actions
    aggregation: sum
    column_name: flagged_bp
    column_type: int64
    secondary_layout: composition
    breakdown_col: action
    display:
      icon_name: mdi:content-cut
      icon_color: orange
      caption: bases to remove, by action
      format: si
    section: Screening at a glance
    tag: gq-con-card-gx
    index: con-card-gx
    title: Bases flagged
    description: Bases in the ranges FCS-GX would exclude, trim or fix. An assembly with nothing flagged counts 0.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: fcsadaptor_actions
    aggregation: sum
    column_name: flagged_bp
    column_type: int64
    secondary_layout: composition
    breakdown_col: action
    display:
      icon_name: mdi:link-variant
      icon_color: grape
      caption: adaptor bases, by action
      format: si
    section: Screening at a glance
    tag: gq-con-card-adaptor
    index: con-card-adaptor
    title: Adaptor bases
    description: Bases FCS-adaptor matches to an adaptor or vector, to trim or exclude.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: tiara_classifications
    aggregation: count
    column_name: sequence
    column_type: object
    secondary_layout: composition
    breakdown_col: tiara_class
    display:
      icon_name: mdi:shape-outline
      icon_color: teal
      caption: classified sequences, by Tiara class
      format: si
    section: Screening at a glance
    tag: gq-con-card-tiara
    index: con-card-tiara
    title: Sequences classified
    description: Sequences of 3 kb or more Tiara classified. The bar splits them by class.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: genomeqc
    data_collection_tag: fcsgx_contamination
    visu_type: bar
    mode: code
    code_content: |-
      # Share of each assembly FCS-GX calls foreign, largest first, against genomeqc's cut-offs: 0.5% or less is good, more than 2% is poor. The axis starts at 0, so the bar is the share.
      d = df.filter(pl.col('contaminant_pct').is_not_null()).sort('contaminant_pct', descending=True).with_columns((pl.lit(' ') + pl.col('contaminant_pct').round(2).cast(pl.Utf8) + pl.lit('%')).alias('lab'))
      names = d['species'].to_list()
      top = max(2.6, max(d['contaminant_pct'].to_list()) * 1.3)
      colors = depictio_category_colors.get('genome') or {}
      fig = px.bar(d.to_pandas(), x='contaminant_pct', y='species', orientation='h', text='lab', color='species', color_discrete_map=colors, category_orders={'species': names}, labels={'contaminant_pct': 'Bases called foreign (% of the assembly)', 'species': 'Genome'})
      fig.update_layout(showlegend=False)
      fig.update_traces(marker_line_width=1, marker_line_color='rgba(70,70,70,0.55)', textposition='outside', cliponaxis=False, hovertemplate='%{y}: %{x:.3f}% of the assembly called foreign<extra></extra>')
      fig.add_vrect(x0=0, x1=0.5, fillcolor='rgba(47, 158, 68, 0.10)', line_width=0, layer='below')
      fig.add_vrect(x0=2, x1=top, fillcolor='rgba(224, 49, 49, 0.10)', line_width=0, layer='below')
      fig.add_vline(x=0.5, line_dash='dash', line_width=1, opacity=0.6, annotation_text='good: 0.5% or less', annotation_position='top right', annotation_font_size=10)
      fig.add_vline(x=2, line_dash='dash', line_width=1, opacity=0.6, annotation_text='poor: over 2%', annotation_position='top right', annotation_font_size=10)
      fig.update_xaxes(range=[0, top], ticksuffix='%')
      fig.update_yaxes(automargin=True)
      fig.update_layout(margin=dict(t=30, r=30), showlegend=False)
    section: Foreign sequence per genome
    tag: gq-con-fig-foreign
    index: con-foreign
    title: Share called foreign per genome
    description: >-
      Is any assembly carrying DNA from another organism? One bar per genome: the share of its bases
      FCS-GX assigns to another organism, sorted by that share, on an axis that starts at 0. Each bar wears
      its genome's colour, and the number at its end prints the share.

      How to read: a bar in the red zone is contamination to remove before the assembly is used. A bar in
      the white band, or near 0.5%, deserves a look at the flagged ranges in the FCS-GX calls table below;
      a bar in the green zone reads clean at genomeqc's own rating.

      Lines and annotations: the green zone ends at the first dashed line, 0.5% foreign, which genomeqc
      rates good; the red zone starts at the second, over 2%, which it rates poor. The band between is
      genomeqc's warn range. They are genomeqc's fixed FCS-GX cut-offs (the same in every quality preset),
      not read from the run: good is 99.5% or more of the bases not called foreign, poor is below 98%.

      Source: nf-core/genomeqc output documentation, tree summary quality rings,
      https://nf-co.re/genomeqc/1.0.1/docs/output

      Note: the shares are only as good as the FCS-GX database the run used; a small test database screens
      little.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: genomeqc
    data_collection_tag: tiara_class_counts
    viz_kind: stacked_taxonomy
    config:
      viz_kind: stacked_taxonomy
      sample_id_col: genome
      taxon_col: tiara_class
      rank_col: null
      abundance_col: sequences
      normalise_to_one: true
      orientation: h
      sample_sort: name
      top_n: 8
      value_title: Share of the classified sequences
      x_title: Genome
      annotation_strips:
      - {column: genome, label: Genome, position: bottom}
      legend_pos: bottom
      hidden_controls: [rank, top_n, group]
    section: Foreign sequence per genome
    tag: gq-con-fig-tiara
    index: con-tiara
    title: Tiara classes per genome
    description: >-
      Do some sequences look like another domain of life? Each bar is one genome, split into the shares of
      its classified sequences (3 kb or more) that Tiara assigns to each domain or organelle, in the
      colour of the class. Normalise off shows the counts, and Sort samples ranks the genomes by name, by
      total or by one class.

      How to read: mostly eukarya with a few organelle sequences is the healthy picture of a eukaryotic
      genome. A large bacteria, archaea or prokarya share is a lead to check against the foreign share
      above and the FCS-GX calls below, since short repetitive scaffolds often read as unknown. Tiara is a
      classifier, so a class is a lead and not a verdict.

      Note: when the Zoom switch crops the value axis, it starts above 0; the cut is marked `//` on the
      axis and a caption names where the axis starts. Switch Zoom off to see the full bars.
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: table
    workflow_tag: genomeqc
    data_collection_tag: fcsgx_actions
    use: fcsgx/actions
    row_selection_enabled: true
    row_selection_column: genome
    section: Flagged ranges
    tag: gq-con-table-gx
    index: con-table-gx
    title: FCS-GX calls
    description: Each range FCS-GX flags, with its action, division and top taxon; a clean genome reads none.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: genomeqc
    data_collection_tag: fcsadaptor_actions
    use: fcsadaptor/actions
    section: Flagged ranges
    tag: gq-con-table-adaptor
    index: con-table-adaptor
    title: FCS-adaptor calls
    description: Each range matched to an adaptor or vector, with its action; a clean genome reads none.
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: table
    workflow_tag: genomeqc
    data_collection_tag: tiara_classifications
    use: tiara/classifications
    section: Flagged ranges
    tag: gq-con-table-tiara
    index: con-table-tiara
    title: Tiara class per sequence
    description: Every classified sequence with Tiara's first-stage class and its organelle call.
    layout: {x: 0, y: 12, w: 8, h: 6}
