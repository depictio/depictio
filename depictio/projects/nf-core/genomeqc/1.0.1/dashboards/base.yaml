  - component_type: advanced_viz
    workflow_tag: genomeqc
    data_collection_tag: repeatmasker_repeat_classes
    use: repeatmasker/class_composition
    config:
      default_rank: Class
      top_n: 8
      normalise_to_one: false
      sample_sort: total_abundance
      orientation: h
      x_title: Genome
      value_title: Share of the assembly masked (%)
      annotation_strips:
        - {column: genome, label: Genome, position: bottom}
    section: Repeat classes
    tag: gq-rep-av-classes
    index: rep-classes
    title: Repeat classes per genome
    description: >-
      How much of each genome is repeats, and of which kinds? One bar per genome, longest first; its
      length is the percent of the assembly RepeatMasker masks, split into the 8 largest classes (the
      colours) and the rest as Other. Switch the rank to read the families inside the classes.

      How to read: bars compare the genomes by repeat content and the colours say which kinds make it up.
      A large unclassified part means the library could not name those repeats, and it grows with a de
      novo library. The tables below list every class and family line.

      Note: no reference mark is drawn, since the repeat share of a genome has no pass level, and the bars
      stack to the masked share and not to 100%. If Zoom crops the axis, it starts above 0; the cut is
      marked `//` on the axis, with a caption naming where it starts.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: genomeqc
    data_collection_tag: repeatmasker_masking_summary
    use: repeatmasker/masking_summary
    row_selection_enabled: true
    row_selection_column: genome
    section: Repeat tables
    tag: gq-rep-table-summary
    index: rep-table-summary
    title: Masking summary per genome
    description: Sequences, length, GC and masked bases of each assembly, with the share of the main classes.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: genomeqc
    data_collection_tag: repeatmasker_repeat_classes
    use: repeatmasker/repeat_classes
    section: Repeat tables
    tag: gq-rep-table-classes
    index: rep-table-classes
    title: Repeat classes and families
    description: Every class and family line of RepeatMasker's summary, with its elements, bases and share of the assembly.
    layout: {x: 0, y: 6, w: 8, h: 6}
- title: Annotation
  subtitle: How many genes does each annotation hold, and how are they built?
  tab_group: Genomes
  tab_order: 7
  tab_icon: mdi:file-tree-outline
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Annotation scope
    icon: mdi:filter-variant
    color: indigo
    description: Both picks narrow AGAT's statistics table only; the cards, gene models and overlaps count each annotation whole
  grid_sections:
  - name: Gene models at a glance
    icon: mdi:counter
    color: indigo
    description: Protein-coding genes, exons per transcript, single-exon and overlapping genes
  - name: Gene models by type
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Every transcript type of every annotation, by genes and exons per transcript
  - name: Genes and overlaps
    icon: mdi:chart-bar
    color: indigo
    description: Genes per transcript type, and the genes nested in another
  - name: Annotation tables
    icon: mdi:table
    color: gray
    description: Gene models per type and every AGAT statistic
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [AGAT](https://github.com/NBISweden/AGAT) summarises each annotation per transcript type;
      exons per transcript and lengths are read on the longest isoform of each gene, so
      annotations with more isoforms still compare. A fragmented annotation shows as short genes
      with few exons and many single-exon models. Colour is the transcript type (the scatter) or
      the type and overlap kind (the bars); each bar or point belongs to one genome, named on its
      axis or label.
    tag: gq-ann-intro
    index: ann-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: genomeqc
    data_collection_tag: agat_statistics
    interactive_component_type: MultiSelect
    column_name: feature_type
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: indigo
    section: Annotation scope
    group: Annotation
    tag: gq-ann-filter-type
    index: ann-type-filter
    title: Feature type
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: genomeqc
    data_collection_tag: agat_statistics
    interactive_component_type: MultiSelect
    column_name: isoforms
    column_type: object
    display:
      icon_name: mdi:source-branch
      custom_color: cyan
    section: Annotation scope
    group: Annotation
    tag: gq-ann-filter-isoforms
    index: ann-isoform-filter
    title: Isoform view
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: agat_gene_models
    use: agat/gene_count
    aggregation: sum
    column_name: genes
    column_type: int64
    filter_expr: "col('feature_type') == 'mrna'"
    secondary_layout: composition
    breakdown_col: genome
    display:
      icon_name: mdi:file-tree-outline
      icon_color: indigo
      caption: protein-coding genes, by genome
      format: si
    section: Gene models at a glance
    tag: gq-ann-card-genes
    index: ann-card-genes
    title: Protein-coding genes
    description: Genes with an mRNA, over every annotation.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: agat_gene_models
    use: agat/exons_per_transcript
    aggregation: median
    column_name: exons_per_transcript
    column_type: float64
    filter_expr: "col('feature_type') == 'mrna'"
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:view-sequential
      icon_color: blue
      caption: median per annotation, with the spread
      decimals: 1
    section: Gene models at a glance
    tag: gq-ann-card-exons
    index: ann-card-exons
    title: Exons per mRNA
    description: Mean exons of the longest mRNA of each protein-coding gene, at the median over the annotations.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: agat_gene_models
    use: agat/single_exon_share
    aggregation: median
    column_name: single_exon_gene_pct
    column_type: float64
    filter_expr: "col('feature_type') == 'mrna'"
    secondary_layout: histogram
    display:
      icon_name: mdi:minus-box-outline
      icon_color: orange
      caption: per annotation, how it spreads (%)
      decimals: 1
    section: Gene models at a glance
    tag: gq-ann-card-single
    index: ann-card-single
    title: Single-exon genes
    description: Protein-coding genes whose mRNA has one exon, in percent. A surplus points at fragmented gene models.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: gene_overlaps
    aggregation: median
    column_name: overlapping_pct
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:set-center
      icon_color: grape
      caption: median per annotation, with the spread (%)
      decimals: 1
    section: Gene models at a glance
    tag: gq-ann-card-overlaps
    index: ann-card-overlaps
    title: Overlapping genes
    description: Genes overlapping another gene, in percent of all genes. Same-strand nested genes are the suspicious ones.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: genomeqc
    data_collection_tag: agat_gene_models
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: genes
      y_col: exons_per_transcript
      label_col: genome
      color_col: feature_type
      x_title: Genes of the type (log scale)
      y_title: Exons per transcript (mean, longest isoform)
      log_x: true
      marker_size: 14
      opacity: 0.85
      marker_outline: true
      top_n_labels: 8
      reference_line: horizontal
      reference_value: 1
      reference_label: one exon
      legend_pos: bottom
      selection_enabled: true
      selection_column: genome
    section: Gene models by type
    tag: gq-ann-av-gene-models
    index: ann-gene-models
    title: Genes against exons per transcript
    description: >-
      How are the gene models of each annotation built? Each point is one annotation and transcript type,
      coloured by the type, placed by the genes it holds (x, log scale) and the mean exons of its
      transcripts, read on the longest isoform of each gene (y). Hover a point for its genome; the 8
      highest points carry its name.

      How to read: protein-coding genes (mrna) sit to the right with several exons, and small RNAs sit on
      the one-exon line. A protein-coding point that drops toward that line marks a fragmented annotation,
      so compare the same type across annotations of related genomes. Click a point to pick its genome
      across the dashboard.

      Reference lines: the dashed horizontal line sits at one exon per transcript, where a single-exon
      gene lies. It marks a count, not a quality cut-off, and no cut-off is applied to the points.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: genomeqc
    data_collection_tag: agat_gene_models
    viz_kind: stacked_taxonomy
    config:
      viz_kind: stacked_taxonomy
      sample_id_col: genome
      taxon_col: feature_type
      rank_col: null
      abundance_col: genes
      normalise_to_one: true
      orientation: h
      sample_sort: name
      top_n: 8
      value_title: Share of the genes
      x_title: Genome
      annotation_strips:
      - {column: genome, label: Genome, position: bottom}
      legend_pos: bottom
      hidden_controls: [rank, top_n, group]
    section: Genes and overlaps
    tag: gq-ann-fig-types
    index: ann-gene-types
    title: Genes per transcript type
    description: >-
      What kinds of transcripts does each annotation hold? Each bar is one annotation (named under it by
      its genome strip), split into the shares of its genes by the type of their transcripts, the largest
      type at the bottom. Normalise off shows the gene counts, and Sort samples ranks the annotations by
      one type.

      How to read: annotations of related genomes should read alike; a very different mix points at a
      different annotation method more than at biology. A large share of small RNA or other non-coding
      types in one bar is worth a look at the source of that annotation. The scatter above shows how each
      type is built.

      Note: when the Zoom switch crops the value axis, it starts above 0; the cut is marked `//` on the
      axis and a caption names where the axis starts. Switch Zoom off to see the full bars.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: genomeqc
    data_collection_tag: gene_overlaps
    viz_kind: stacked_taxonomy
    config:
      viz_kind: stacked_taxonomy
      sample_id_col: genome
      value_cols: [not_overlapping_genes, overlapping_not_nested, contained_opposite_strand, contained_same_strand]
      value_labels:
        not_overlapping_genes: Overlapping none
        overlapping_not_nested: Overlapping another
        contained_opposite_strand: Nested, opposite strand
        contained_same_strand: Nested, same strand
      taxon_palette: {Overlapping none: '#adb5bd', Overlapping another: '#1c7ed6', 'Nested, opposite strand': '#0ca678', 'Nested, same strand': '#e8590c'}
      normalise_to_one: true
      orientation: h
      sample_sort: category
      sort_category: Nested, same strand
      value_title: Share of the genes
      x_title: Genome
      annotation_strips:
      - {column: genome, label: Genome, position: bottom}
      legend_pos: bottom
      hidden_controls: [rank, top_n, group]
    section: Genes and overlaps
    tag: gq-ann-fig-nested
    index: ann-nested
    title: Genes by overlap with another gene
    description: >-
      Does an annotation pile genes on top of each other? Each bar is one annotation, its genes split four
      ways: overlapping no other gene (grey), overlapping another (blue), nested inside one on the
      opposite strand (green, often a gene in an intron) or on the same strand (orange, often a split or
      duplicated model).

      How to read: most genes should overlap nothing. Same-strand nesting is the suspicious part, so the
      annotation with the largest share there comes first, and a large one marks an annotation to review.
      Open [Completeness](tab:Completeness) to check whether that annotation also lost conserved genes.

      Note: no cut-off is applied here, because none is published for the share of nested genes; read the
      annotations against each other. If Zoom crops the axis, it starts above 0; the cut is marked `//` on
      the axis, with a caption naming where it starts.
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: table
    workflow_tag: genomeqc
    data_collection_tag: agat_gene_models
    use: agat/gene_models
    row_selection_enabled: true
    row_selection_column: genome
    section: Annotation tables
    tag: gq-ann-table-models
    index: ann-table-models
    title: Gene models per type
    description: Genes, transcripts, exons, single-exon and overlapping genes and lengths per annotation and transcript type.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: genomeqc
    data_collection_tag: agat_statistics
    use: agat/statistics
    section: Annotation tables
    tag: gq-ann-table-stats
    index: ann-table-stats
    title: Every AGAT statistic
    description: Each metric of AGAT's report per annotation, feature type and isoform view.
    layout: {x: 0, y: 6, w: 8, h: 6}
- title: Orthology
  subtitle: Which orthogroups do the genomes share?
  tab_group: Genomes
  tab_order: 8
  tab_icon: mdi:family-tree
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Orthogroup scope
    icon: mdi:filter-variant
    color: cyan
    description: The copy class narrows the orthogroup UpSet and its cards; the per-genome stats have no orthogroup rows
  grid_sections:
  - name: Orthology at a glance
    icon: mdi:counter
    color: cyan
    description: Orthogroups, the shared core, genes placed and orthogroups of one genome
  - name: Genes by orthogroup
    icon: mdi:chart-bar
    color: cyan
    description: Each genome's genes in genome-specific orthogroups or in none
  - name: Shared orthogroups
    icon: mdi:set-merge
    color: cyan
    description: Orthogroups by the set of genomes they reach
  - name: Orthology tables
    icon: mdi:table
    color: gray
    description: Orthogroup assignment per genome and the sequences carrying orthologues
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [OrthoFinder](https://github.com/davidemms/OrthoFinder) groups the longest protein of every
      gene of every genome into orthogroups, the genes descended from one ancestral gene. The core
      every genome shares should dominate; a genome with many orthogroups of its own, or many
      genes in none, carries spurious or fragmented gene models. In the UpSet, colour is the
      genome: one colour per genome on its set bar, dots and single-genome bars, with orthogroups
      shared by several genomes in grey; in the stacked bar above it, each bar is one genome and
      colour says where its genes fall.
    tag: gq-orth-intro
    index: orth-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: genomeqc
    data_collection_tag: orthofinder_orthogroup_matrix
    interactive_component_type: MultiSelect
    column_name: copy_class
    column_type: object
    display:
      icon_name: mdi:content-copy
      custom_color: cyan
    section: Orthogroup scope
    group: Orthogroups
    tag: gq-orth-filter-copy
    index: orth-copy-filter
    title: Copy class
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: orthofinder_orthogroup_matrix
    use: orthofinder/orthogroups_total
    aggregation: count
    column_name: orthogroup
    column_type: object
    secondary_layout: composition
    breakdown_col: copy_class
    display:
      icon_name: mdi:family-tree
      icon_color: cyan
      caption: orthogroups, by copy class
      format: si
    section: Orthology at a glance
    tag: gq-orth-card-orthogroups
    index: orth-card-orthogroups
    title: Orthogroups
    description: Groups of genes descended from one ancestral gene, over every genome.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: orthofinder_orthogroup_matrix
    aggregation: count
    column_name: orthogroup
    column_type: object
    filter_expr: "col('sharing') == 'core'"
    secondary_layout: donut
    breakdown_col: copy_class
    display:
      icon_name: mdi:set-all
      icon_color: blue
      caption: the shared core, by copy class
      format: si
    section: Orthology at a glance
    tag: gq-orth-card-core
    index: orth-card-core
    title: Shared by every genome
    description: Orthogroups holding a gene of every genome of the run.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: orthofinder_species_stats
    use: orthofinder/assigned_share
    aggregation: min
    column_name: genes_in_orthogroups_pct
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:check-all
      icon_color: teal
      caption: lowest genome, with the spread (%)
      decimals: 1
    section: Orthology at a glance
    tag: gq-orth-card-assigned
    index: orth-card-assigned
    title: Genes in orthogroups
    description: Share of a genome's genes OrthoFinder placed in an orthogroup, for the genome with the fewest.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: orthofinder_species_stats
    aggregation: sum
    column_name: species_specific_orthogroups
    column_type: int64
    secondary_layout: composition
    breakdown_col: genome
    display:
      icon_name: mdi:account-outline
      icon_color: orange
      caption: orthogroups of one genome, by genome
      format: integer
    section: Orthology at a glance
    tag: gq-orth-card-specific
    index: orth-card-specific
    title: Genome-specific orthogroups
    description: Orthogroups whose genes all come from a single genome.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: genomeqc
    data_collection_tag: orthofinder_species_stats
    viz_kind: stacked_taxonomy
    config:
      viz_kind: stacked_taxonomy
      sample_id_col: genome
      value_cols: [genes_in_species_specific_pct, unassigned_genes_pct]
      value_labels:
        genes_in_species_specific_pct: In genome-specific orthogroups
        unassigned_genes_pct: In no orthogroup
      taxon_palette: {In genome-specific orthogroups: '#ae3ec9', In no orthogroup: '#adb5bd'}
      normalise_to_one: false
      orientation: h
      sample_sort: category
      sort_category: In no orthogroup
      value_title: Share of the genome's genes (%)
      x_title: Genome
      annotation_strips:
      - {column: genome, label: Genome, position: bottom}
      legend_pos: bottom
      hidden_controls: [rank, top_n, group, normalise]
    section: Genes by orthogroup
    tag: gq-orth-av-placement
    index: orth-placement
    title: Genes by the orthogroups they fall in
    description: >-
      How many genes does each genome hold that no other genome shares? One bar per genome, stacking its
      genes in orthogroups of its own (purple) and its genes in no orthogroup (grey), as a percent of its
      genes. The rest, the large majority, sits in orthogroups shared with another genome and is the Genes
      in orthogroups card above.

      How to read: short bars are good, since most genes of a genome then fall in orthogroups it shares;
      the genome with the largest grey part comes first. A long grey or purple part marks spurious or
      fragmented gene models, or a genome far from the others in the set, which has fewer partners to
      share with. The chart below shows which genomes share each orthogroup.

      Note: no cut-off is applied here, because OrthoFinder publishes no acceptable share of unplaced or
      genome-specific genes. If Zoom crops the axis, it starts above 0; the cut is marked `//` on the
      axis, with a caption naming where it starts.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: genomeqc
    data_collection_tag: orthofinder_orthogroup_matrix
    use: orthofinder/orthogroup_upset
    config:
      # The sets are genomes: their bars and dots wear the genome colours of the
      # main tab's category_colors, and so does the bar of an orthogroup that
      # one genome holds alone. A bar shared by several genomes is grey.
      color_intersections_by: set
      set_category_column: genome
      show_set_sizes: true
      show_values: true
      sort_by: cardinality
      sort_order: descending
      min_size: 1
      # The species columns, whatever the run named them; n_genomes is the
      # only other integer column and could read 0/1 on a two-genome run.
      set_columns_pattern: '^(?!n_genomes$|total_genes$)'
      selection_enabled: true
      selection_column: orthogroup
    section: Shared orthogroups
    tag: gq-orth-av-upset
    index: orth-upset
    title: Orthogroups shared between genomes
    description: >-
      Which genomes share each orthogroup? Each bar counts the orthogroups that hold genes of exactly the
      genomes dotted below it, largest first; the bars on the left count each genome's orthogroups in all.
      A genome keeps its own colour here and in the genome filter, and a bar shared by several genomes is
      grey.

      How to read: the bar under the dots of every genome is the core every genome shares, and it should
      dominate. Tall single-dot bars are orthogroups of one genome alone; many of them point at spurious
      or fragmented gene models, or at a genome far from the others. Bars that join a subset of the
      genomes are shared by a clade.

      Annotations: the number above each bar is its orthogroup count. No cut-off is applied, since none is
      published for how many orthogroups a genome should hold alone. Click a bar to keep its orthogroups.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: genomeqc
    data_collection_tag: orthofinder_species_stats
    use: orthofinder/species_stats
    row_selection_enabled: true
    row_selection_column: genome
    section: Orthology tables
    tag: gq-orth-table-species
    index: orth-table-species
    title: Orthogroup assignment per genome
    description: Genes, genes placed and unplaced, orthogroups reached and orthogroups of the genome alone.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: genomeqc
    data_collection_tag: ortho_seq_count
    section: Orthology tables
    tag: gq-orth-table-seqcount
    index: orth-table-seqcount
    title: Sequences carrying orthologues
    description: Sequences of each genome holding orthologues of another genome; close to the chromosome number on a chromosome-level assembly.
    layout: {x: 0, y: 6, w: 8, h: 6}
