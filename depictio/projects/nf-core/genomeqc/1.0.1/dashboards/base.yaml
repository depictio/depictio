      [RepeatMasker](https://www.repeatmasker.org) masks the transposable elements, simple repeats
      and low-complexity sequence of each assembly against its repeat library. The bars open on
      the classes, one bar per genome coloured by repeat class; switch the rank to read the
      families inside them. Unclassified repeats are the ones the library could not name, and they
      grow with a de novo library.
    tag: gq-rep-intro
    index: rep-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
