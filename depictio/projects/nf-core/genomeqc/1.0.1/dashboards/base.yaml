  grid_sections:
  - name: Sequences at a glance
    icon: mdi:counter
    color: grape
    description: Sequences carrying BUSCO genes, their density, and the windows with the repeat
  - name: BUSCO genes per sequence
    icon: mdi:dna
    color: grape
    description: Every sequence holding a complete BUSCO, drawn to its length and shaded by density
  - name: Telomeric repeats
    icon: mdi:chart-timeline-variant
    color: grape
    description: The repeat unit tidk searched, counted per 10 kb window along every sequence
  - name: Karyotype tables
    icon: mdi:table
    color: gray
    description: Complete BUSCOs per sequence
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      Each genome is drawn as a karyotype, picked above the chart: one bar per sequence, the longest
      first, drawn to its length, with colour a density scale rather than a category; the square before each genome's name is the colour it wears in the rest of the dashboard. The first view
      shades each sequence by its complete BUSCOs per megabase; the second counts the repeat unit
      [tidk](https://github.com/tolkit/telomeric-identifier) searched, so a telomere-capped
      chromosome lights up at both ends. Check the unit first: one tidk picks itself can be a simple
      repeat rather than the telomere.
    tag: gq-kar-intro
    index: kar-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: genomeqc
    data_collection_tag: busco_karyotype
