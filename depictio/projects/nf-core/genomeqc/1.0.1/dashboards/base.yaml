- title: Completeness
  subtitle: How much of the conserved gene set does each genome hold?
  tab_group: Genomes
  tab_order: 4
  tab_icon: mdi:check-decagram-outline
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Completeness scope
    icon: mdi:filter-variant
    color: teal
    description: Keep the BUSCO runs inside a completeness band
  grid_sections:
  - name: Completeness at a glance
    icon: mdi:counter
    color: teal
    description: Complete, duplicated and missing BUSCOs of the assemblies and their proteins
  - name: Genome against annotation
    icon: mdi:chart-scatter-plot
    color: teal
    description: Complete BUSCOs of each assembly and of its proteins, against the 95% and 90% levels
  - name: BUSCO classes
    icon: mdi:chart-bar
    color: teal
    description: The fragmented and missing BUSCOs of every run, the genome and its proteins side by side
  - name: BUSCO tables
    icon: mdi:table
    color: gray
    description: BUSCO scores per assembly and mode
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [BUSCO](https://busco.ezlab.org) looks for the genes nearly every genome of the lineage holds
      once, on each assembly and, with an annotation, on its predicted proteins: genes found in the
      assembly but missing from the proteins were not annotated, duplicated ones point at retained
      haplotypes and fragmented ones at broken gene models. In the dot plot each row is one genome,
      blue its assembly and green its proteins; in the bars each bar is one BUSCO run and colour is
      the BUSCO class.
    tag: gq-cmp-intro
    index: cmp-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: genomeqc
    data_collection_tag: busco_batch_summary
    interactive_component_type: RangeSlider
    column_name: complete_pct
    column_type: float64
    display:
      icon_name: mdi:check-decagram-outline
      custom_color: teal
    section: Completeness scope
    group: Completeness
    tag: gq-cmp-filter-complete
    index: cmp-complete-range
    title: Complete BUSCOs (%)
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: busco_batch_summary
    aggregation: median
    column_name: complete_pct
    column_type: float64
    filter_expr: "col('busco_mode') == 'genome'"
    secondary_layout: threshold
    threshold_value: 95
    threshold_direction: min
    threshold_warn: 90
    display:
      icon_name: mdi:check-decagram-outline
      icon_color: teal
      caption: assemblies at 95% or more, below 90% failing
      decimals: 1
    section: Completeness at a glance
    tag: gq-cmp-card-genome
    index: cmp-card-genome
    title: Complete in the assembly
    description: BUSCOs found whole in the assembly, in percent of the lineage set, at the median.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: busco_batch_summary
    aggregation: median
    column_name: complete_pct
    column_type: float64
    filter_expr: "col('busco_mode') == 'proteins'"
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:file-tree-outline
      icon_color: green
      caption: median per annotation, with the spread
      decimals: 1
    section: Completeness at a glance
    tag: gq-cmp-card-proteins
    index: cmp-card-proteins
    title: Complete in the proteins
    description: BUSCOs found whole among the annotated proteins. Below the assembly's score, the annotation missed genes the assembly holds.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: busco_batch_summary
    aggregation: median
    column_name: duplicated_pct
    column_type: float64
    filter_expr: "col('busco_mode') == 'genome'"
    secondary_layout: histogram
    display:
      icon_name: mdi:content-copy
      icon_color: cyan
      caption: per assembly, how they spread
      decimals: 1
    section: Completeness at a glance
    tag: gq-cmp-card-duplicated
    index: cmp-card-duplicated
    title: Duplicated
    description: BUSCOs found twice or more in the assembly, in percent. A high share on a haploid assembly points at retained haplotypes.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: busco_composition
    aggregation: sum
    column_name: percent
    column_type: float64
    filter_expr: "col('busco_mode') == 'genome'"
    secondary_layout: composition
    breakdown_col: busco_class
    display:
      icon_name: mdi:chart-donut
      icon_color: orange
      caption: the four classes, summed over the assemblies
      decimals: 0
    section: Completeness at a glance
    tag: gq-cmp-card-classes
    index: cmp-card-classes
    title: BUSCO classes
    description: The lineage set split into complete single-copy, duplicated, fragmented and missing, over every assembly.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: genomeqc
    data_collection_tag: busco_batch_summary
    visu_type: scatter
    mode: code
    code_content: |-
      # Complete BUSCOs of each assembly and of its annotated proteins, one row per genome, lowest first. Shaded below 95% (warn) and 90% (fail), the levels the Complete BUSCOs card uses. Dots, not bars, so the axis can start near the top of the scale and the gaps show.
      d = df.filter(pl.col('complete_pct').is_not_null()).with_columns(pl.when(pl.col('busco_mode') == 'proteins').then(pl.lit('Annotated proteins')).otherwise(pl.lit('Assembly')).alias('what'), (pl.col('complete_pct').cast(pl.Utf8) + '%').alias('lab'))
      colors = depictio_category_colors.get('busco_mode') or {}
      lo = min(88.0, min(d['complete_pct'].to_list()) - 3.0)
      ends = d.group_by('assembly_id').agg(pl.col('complete_pct').min().alias('a'), pl.col('complete_pct').max().alias('b')).sort('a')
      order = ends['assembly_id'].to_list()
      fig = px.scatter(d.to_pandas(), x='complete_pct', y='assembly_id', color='what', text='lab', color_discrete_map={'Assembly': colors.get('genome'), 'Annotated proteins': colors.get('proteins')}, category_orders={'assembly_id': order, 'what': ['Assembly', 'Annotated proteins']}, labels={'complete_pct': 'Complete BUSCOs (% of the lineage set)', 'assembly_id': 'Genome', 'what': ''})
      fig.update_traces(marker=dict(size=16, line=dict(width=1, color='rgba(70,70,70,0.55)')), textfont=dict(size=11), hovertemplate='%{y}, %{fullData.name}: %{x}% complete<extra></extra>')
      fig.update_traces(textposition='top center', selector=dict(name='Assembly'))
      fig.update_traces(textposition='bottom center', selector=dict(name='Annotated proteins'))
      gcolors = depictio_category_colors.get('genome') or {}
      for i, row in enumerate(ends.iter_rows(named=True)):
          gc = gcolors.get(row['assembly_id'], '#868e96')
          fig.add_shape(type='line', x0=row['a'], x1=row['b'], y0=row['assembly_id'], y1=row['assembly_id'], line=dict(color=gc, width=3), layer='below')
          fig.add_shape(type='rect', xref='paper', yref='y', x0=-0.02, x1=-0.008, y0=i - 0.4, y1=i + 0.4, fillcolor=gc, line_width=0)
      fig.add_vrect(x0=lo, x1=90, fillcolor='rgba(224, 49, 49, 0.10)', line_width=0, layer='below')
      fig.add_vrect(x0=90, x1=95, fillcolor='rgba(240, 140, 0, 0.10)', line_width=0, layer='below')
      fig.add_vrect(x0=95, x1=100.6, fillcolor='rgba(47, 158, 68, 0.10)', line_width=0, layer='below')
      fig.add_vline(x=95, line_dash='dash', line_width=1, opacity=0.6, annotation_text='pass: 95% or more', annotation_position='top right', annotation_font_size=10)
      fig.add_vline(x=90, line_dash='dash', line_width=1, opacity=0.6, annotation_text='fail: below 90%', annotation_position='top left', annotation_font_size=10)
      fig.update_xaxes(range=[lo, 100.6], ticksuffix='%')
      fig.update_yaxes(automargin=True)
      fig.update_layout(margin=dict(t=40, r=30), legend=dict(orientation='h', y=-0.22, x=0, title_text=''))
    section: Genome against annotation
    tag: gq-cmp-fig-complete
    index: cmp-complete
    title: Complete BUSCOs, assembly and proteins
    description: >-
      Does the annotation keep the conserved genes the assembly holds? Each row is one genome: its
      assembly (blue) and its annotated proteins (green) as the percent of the lineage's BUSCO set found
      complete, with a grey line joining the two dots and the percent printed at each dot. The axis starts
      near the top of the scale so the gaps show; dots, not bars, so nothing is cut.

      How to read: both dots in the green zone and close together is the good picture, a complete assembly
      and an annotation that lost nothing. A protein dot far left of its assembly dot lost genes in the
      annotation, one right of it recovered them; an assembly dot in the amber or red zone points at the
      assembly itself. Open [Annotation](tab:Annotation) to see how the gene models are built.

      Lines and annotations: the green zone starts at the dashed 95% line (labelled pass), the amber zone
      runs from 90% to 95% and the red zone lies below the dashed 90% line (labelled fail). They are fixed
      reference levels of this dashboard, the same as the Complete BUSCOs cards, not read from the run.

      Warning: BUSCO publishes no pass level for complete BUSCOs, and genomeqc documents none for its
      rating, so the 95% and 90% levels have no published source here. Read them as a guide to the gaps,
      not as a verdict.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: genomeqc
    data_collection_tag: busco_composition
    visu_type: bar
    mode: code
    code_content: |-
      # What each BUSCO run does not find whole, as a share of the lineage set: fragmented plus missing, largest first. A run is complete at 95% or more when these two stay under 5% together (the dashed line). Duplicated BUSCOs count as complete and are on the Duplicated card.
      d = df.filter(pl.col('busco_class').is_in(['Fragmented', 'Missing']))
      runs = d.group_by('run_id').agg(pl.col('percent').sum().alias('lost')).sort('lost', descending=True)
      order = runs['run_id'].to_list()
      totals = runs['lost'].to_list()
      colors = depictio_category_colors.get('busco_class') or {}
      top = max(6.0, max(totals) * 1.35)
      fig = px.bar(d.to_pandas(), x='percent', y='run_id', color='busco_class', orientation='h', barmode='stack', color_discrete_map=colors, category_orders={'run_id': order, 'busco_class': ['Fragmented', 'Missing']}, labels={'percent': 'Not found whole (% of the lineage set)', 'run_id': 'Genome and mode', 'busco_class': 'BUSCO class'})
      fig.update_traces(marker_line_width=1, marker_line_color='rgba(70,70,70,0.55)', hovertemplate='%{y}: %{x}% %{fullData.name}<extra></extra>')
      fig.add_trace(go.Scatter(x=totals, y=order, mode='text', text=[' ' + str(round(v, 1)) + '%' for v in totals], textposition='middle right', showlegend=False, hoverinfo='skip', textfont=dict(size=12)))
      fig.add_vline(x=5, line_dash='dash', line_width=1, opacity=0.6, annotation_text='95% complete', annotation_position='top right', annotation_font_size=10)
      fig.update_xaxes(range=[0, top], ticksuffix='%')
      fig.update_yaxes(automargin=True)
      fig.update_layout(margin=dict(t=40, r=30), legend=dict(orientation='h', y=1.12, x=0, title_text=''))
    section: BUSCO classes
    tag: gq-cmp-fig-lost
    index: cmp-classes
    title: Fragmented and missing BUSCOs per run
    description: >-
      What does each run fail to find whole? One bar per BUSCO run (each genome's assembly, then its
      proteins), stacking the fragmented BUSCOs (orange, broken gene models) and the missing ones (red) as
      a share of the lineage set, on an axis that starts at 0. The number at the end of a bar is the total
      of the two.

      How to read: a short bar is a nearly complete run, and the longer the bar, the more of the conserved
      set is lost. Compare the two runs of a genome: a loss in the assembly points at the assembly, a loss
      only in the proteins at genes the annotation did not call. Duplicated BUSCOs count as complete and
      are on the Duplicated card, not here.

      Lines and annotations: the dashed line at 5%, labelled 95% complete, is 100% minus the 95% level of
      the Complete BUSCOs cards. A run left of it keeps 95% or more of the set complete, because
      fragmented plus missing then stay under 5%.

      Warning: BUSCO publishes no pass level for complete BUSCOs, and genomeqc documents none for its
      rating, so the 95% level behind this line has no published source here. Read the line as a guide,
      not a verdict.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: genomeqc
    data_collection_tag: busco_batch_summary
    use: busco/batch_summary
    columns: [assembly_id, busco_mode, lineage, complete_pct, single_pct, duplicated_pct, fragmented_pct, missing_pct, n_markers, stop_codon_pct, scaffold_n50, contig_n50]
    row_selection_enabled: true
    row_selection_column: assembly_id
    section: BUSCO tables
    tag: gq-cmp-table-busco
    index: cmp-table-busco
    title: BUSCO scores per run
    description: Complete, single-copy, duplicated, fragmented and missing BUSCOs of every assembly and its proteins.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Karyotype
