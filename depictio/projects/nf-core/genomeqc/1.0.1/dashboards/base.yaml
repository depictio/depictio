- title: Contamination
  subtitle: Does any assembly carry foreign or adaptor sequence?
  tab_group: Data & QC
  tab_order: 3
  tab_icon: mdi:shield-search
  tab_icon_color: red
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Screening scope
    icon: mdi:filter-variant
    color: red
    description: The Tiara classes and the FCS-GX actions the tiles keep
  grid_sections:
  - name: Screening at a glance
    icon: mdi:counter
    color: red
    description: Foreign share, flagged ranges, adaptors and prokaryotic sequences
  - name: Foreign sequence per genome
    icon: mdi:chart-bar
    color: red
    description: The share FCS-GX calls foreign, and the class Tiara gives each sequence
  - name: Flagged ranges
    icon: mdi:table
    color: gray
    description: Every range FCS-GX and FCS-adaptor flag, and Tiara's class per sequence
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [FCS-GX](https://github.com/ncbi/fcs) aligns every sequence to a database of genomes and
      flags what belongs to another organism; FCS-adaptor looks for adaptors and vectors, and
      [Tiara](https://ibe-uw.github.io/tiara/) classes each sequence of 3 kb or more by domain. A
      Tiara call alone is a lead, not a verdict: short repetitive scaffolds often read as
      prokaryotic or unknown.
    tag: gq-con-intro
    index: con-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: genomeqc
    data_collection_tag: tiara_classifications
    interactive_component_type: MultiSelect
    column_name: tiara_class
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: red
    section: Screening scope
    group: Screening
    tag: gq-con-filter-class
    index: con-class-filter
    title: Tiara class
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: genomeqc
    data_collection_tag: fcsgx_actions
    interactive_component_type: MultiSelect
    column_name: action
    column_type: object
    display:
      icon_name: mdi:content-cut
      custom_color: orange
    section: Screening scope
    group: Screening
    tag: gq-con-filter-action
    index: con-action-filter
    title: FCS-GX action
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: fcsgx_contamination
    aggregation: max
    column_name: contaminant_pct
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.5
    threshold_direction: max
    threshold_warn: 2
    display:
      icon_name: mdi:biohazard
      icon_color: red
      caption: assemblies at 0.5% or less, above 2% failing
      decimals: 2
    section: Screening at a glance
    tag: gq-con-card-foreign
    index: con-card-foreign
    title: Foreign share
    description: Share of an assembly FCS-GX calls foreign, at its highest. genomeqc rates 0.5% or less good and more than 2% poor.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: fcsgx_actions
    aggregation: sum
    column_name: flagged_bp
    column_type: int64
    secondary_layout: composition
    breakdown_col: action
    display:
      icon_name: mdi:content-cut
      icon_color: orange
      caption: bases to remove, by action
      format: si
    section: Screening at a glance
    tag: gq-con-card-gx
    index: con-card-gx
    title: Bases flagged
    description: Bases in the ranges FCS-GX would exclude, trim or fix. An assembly with nothing flagged counts 0.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: fcsadaptor_actions
    aggregation: sum
    column_name: flagged_bp
    column_type: int64
    secondary_layout: composition
    breakdown_col: action
    display:
      icon_name: mdi:link-variant
      icon_color: grape
      caption: adaptor bases, by action
      format: si
    section: Screening at a glance
    tag: gq-con-card-adaptor
    index: con-card-adaptor
    title: Adaptor bases
    description: Bases FCS-adaptor matches to an adaptor or vector, to trim or exclude.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: tiara_classifications
    aggregation: count
    column_name: sequence
    column_type: object
    secondary_layout: composition
    breakdown_col: tiara_class
    display:
      icon_name: mdi:shape-outline
      icon_color: teal
      caption: classified sequences, by Tiara class
      format: si
    section: Screening at a glance
    tag: gq-con-card-tiara
    index: con-card-tiara
    title: Sequences classified
    description: Sequences of 3 kb or more Tiara classified. The bar splits them by class.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: genomeqc
    data_collection_tag: fcsgx_contamination
    viz_kind: stacked_taxonomy
    config:
      viz_kind: stacked_taxonomy
      sample_id_col: species
      value_cols: [non_contaminant_pct, contaminant_pct]
      value_labels: {non_contaminant_pct: Not foreign, contaminant_pct: Called foreign}
      taxon_palette: {Not foreign: '#adb5bd', Called foreign: '#e8590c'}
      normalise_to_one: true
      orientation: h
      sample_sort: category
      sort_category: Called foreign
      y_zoom: auto
      value_title: Share of the assembly
      hidden_controls: [rank, top_n, group]
    section: Foreign sequence per genome
    tag: gq-con-fig-foreign
    index: con-foreign
    title: Share called foreign per genome
    description: Bases FCS-GX assigns to another organism, against the rest of the assembly. Every genome is over 99% clean, so the axis starts just below the cleanest share (the // marks the cut); switch Zoom off for the whole bar.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: advanced_viz
    workflow_tag: genomeqc
    data_collection_tag: tiara_class_counts
    viz_kind: stacked_taxonomy
    config:
      viz_kind: stacked_taxonomy
      sample_id_col: genome
      taxon_col: tiara_class
      rank_col: null
      abundance_col: sequences
      normalise_to_one: true
      orientation: h
      sample_sort: name
      y_zoom: auto
      top_n: 8
      value_title: Share of the classified sequences
      hidden_controls: [rank, top_n, group]
    section: Foreign sequence per genome
    tag: gq-con-fig-tiara
    index: con-tiara
    title: Tiara classes per genome
    description: Each genome's sequences of 3 kb or more by the domain or organelle Tiara assigns them, as shares; Normalise off shows the counts. Sort by a class to rank the genomes on it.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: table
    workflow_tag: genomeqc
    data_collection_tag: fcsgx_actions
    use: fcsgx/actions
    row_selection_enabled: true
    row_selection_column: genome
    section: Flagged ranges
    tag: gq-con-table-gx
    index: con-table-gx
    title: FCS-GX calls
    description: Each range FCS-GX flags, with its action, division and top taxon; a clean genome reads none.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: genomeqc
    data_collection_tag: fcsadaptor_actions
    use: fcsadaptor/actions
    section: Flagged ranges
    tag: gq-con-table-adaptor
    index: con-table-adaptor
    title: FCS-adaptor calls
    description: Each range matched to an adaptor or vector, with its action; a clean genome reads none.
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: table
    workflow_tag: genomeqc
    data_collection_tag: tiara_classifications
    use: tiara/classifications
    section: Flagged ranges
    tag: gq-con-table-tiara
    index: con-table-tiara
    title: Tiara class per sequence
    description: Every classified sequence with Tiara's first-stage class and its organelle call.
    layout: {x: 0, y: 12, w: 8, h: 6}
# ============================================================================
# Genomes
# ============================================================================
- title: Completeness
  subtitle: How much of the conserved gene set does each genome hold?
  tab_group: Genomes
  tab_order: 4
  tab_icon: mdi:check-decagram-outline
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Completeness scope
    icon: mdi:filter-variant
    color: teal
    description: Keep the BUSCO runs inside a completeness band
  grid_sections:
  - name: Completeness at a glance
    icon: mdi:counter
    color: teal
    description: Complete, duplicated and missing BUSCOs of the assemblies and their proteins
  - name: BUSCO classes
    icon: mdi:chart-bar
    color: teal
    description: The four BUSCO classes of every run, the genome and its proteins side by side
  - name: Genome against annotation
    icon: mdi:chart-scatter-plot
    color: teal
    description: Complete BUSCOs in the assembly against those its proteins keep
  - name: BUSCO tables
    icon: mdi:table
    color: gray
    description: BUSCO scores per assembly and mode
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [BUSCO](https://busco.ezlab.org) looks for the genes nearly every genome of the lineage holds
      once. It runs on each assembly and, with an annotation, on its predicted proteins: genes
      found in the assembly but missing from the proteins were not annotated. Duplicated BUSCOs
      point at retained haplotypes, fragmented ones at broken gene models.
    tag: gq-cmp-intro
    index: cmp-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: genomeqc
    data_collection_tag: busco_batch_summary
    interactive_component_type: RangeSlider
    column_name: complete_pct
    column_type: float64
    display:
      icon_name: mdi:check-decagram-outline
      custom_color: teal
    section: Completeness scope
    group: Completeness
    tag: gq-cmp-filter-complete
    index: cmp-complete-range
    title: Complete BUSCOs (%)
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: busco_batch_summary
    aggregation: median
    column_name: complete_pct
    column_type: float64
    filter_expr: "col('busco_mode') == 'genome'"
    secondary_layout: threshold
    threshold_value: 95
    threshold_direction: min
    threshold_warn: 90
    display:
      icon_name: mdi:check-decagram-outline
      icon_color: teal
      caption: assemblies at 95% or more, below 90% failing
      decimals: 1
    section: Completeness at a glance
    tag: gq-cmp-card-genome
    index: cmp-card-genome
    title: Complete in the assembly
    description: BUSCOs found whole in the assembly, in percent of the lineage set, at the median.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: busco_batch_summary
    aggregation: median
    column_name: complete_pct
    column_type: float64
    filter_expr: "col('busco_mode') == 'proteins'"
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:file-tree-outline
      icon_color: green
      caption: median per annotation, with the spread
      decimals: 1
    section: Completeness at a glance
    tag: gq-cmp-card-proteins
    index: cmp-card-proteins
    title: Complete in the proteins
    description: BUSCOs found whole among the annotated proteins. Below the assembly's score, the annotation missed genes the assembly holds.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: busco_batch_summary
    aggregation: median
    column_name: duplicated_pct
    column_type: float64
    filter_expr: "col('busco_mode') == 'genome'"
    secondary_layout: histogram
    display:
      icon_name: mdi:content-copy
      icon_color: cyan
      caption: per assembly, how they spread
      decimals: 1
    section: Completeness at a glance
    tag: gq-cmp-card-duplicated
    index: cmp-card-duplicated
    title: Duplicated
    description: BUSCOs found twice or more in the assembly, in percent. A high share on a haploid assembly points at retained haplotypes.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: busco_composition
    aggregation: sum
    column_name: percent
    column_type: float64
    filter_expr: "col('busco_mode') == 'genome'"
    secondary_layout: composition
    breakdown_col: busco_class
    display:
      icon_name: mdi:chart-donut
      icon_color: orange
      caption: the four classes, summed over the assemblies
      decimals: 0
    section: Completeness at a glance
    tag: gq-cmp-card-classes
    index: cmp-card-classes
    title: BUSCO classes
    description: The lineage set split into complete single-copy, duplicated, fragmented and missing, over every assembly.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: genomeqc
    data_collection_tag: busco_composition
    use: busco/class_composition_by_run
    config:
      default_rank: BUSCO class
      top_n: 4
      normalise_to_one: true
      sample_sort: input
      y_zoom: auto
    section: BUSCO classes
    tag: gq-cmp-av-classes
    index: cmp-classes
    title: BUSCO classes per assembly and mode
    description: One bar per BUSCO run, the assembly then its proteins, split into the four classes. Every run holds most of the set as complete, so the axis starts above the shared complete share (the // mark); Zoom off shows the whole bar.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: genomeqc
    data_collection_tag: genomes
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: busco_complete_pct
      y_col: protein_complete_pct
      label_col: genome
      color_col: '{GROUP_COL}'
      size_col: genes
      x_title: Complete BUSCOs in the assembly (%)
      y_title: Complete BUSCOs in the proteins (%)
      legend_pos: bottom
      selection_enabled: true
      selection_column: genome
    section: Genome against annotation
    tag: gq-cmp-av-genome-vs-proteins
    index: cmp-genome-vs-proteins
    title: Assembly against annotation completeness
    description: One point per genome, sized by its protein-coding genes. A point well below its assembly score lost genes in the annotation.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: genomeqc
    data_collection_tag: busco_batch_summary
    use: busco/batch_summary
    columns: [assembly_id, busco_mode, lineage, complete_pct, single_pct, duplicated_pct, fragmented_pct, missing_pct, n_markers, stop_codon_pct, scaffold_n50, contig_n50]
    row_selection_enabled: true
    row_selection_column: assembly_id
    section: BUSCO tables
    tag: gq-cmp-table-busco
    index: cmp-table-busco
    title: BUSCO scores per run
    description: Complete, single-copy, duplicated, fragmented and missing BUSCOs of every assembly and its proteins.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Karyotype
  subtitle: Where do the conserved genes and telomeric repeats sit?
  tab_group: Genomes
  tab_order: 5
  tab_icon: mdi:format-align-left
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Sequence scope
    icon: mdi:filter-variant
    color: grape
    description: Keep the sequences inside a length band
  grid_sections:
  - name: Sequences at a glance
    icon: mdi:counter
    color: grape
    description: Sequences carrying BUSCO genes, their density, and the windows with the repeat
  - name: BUSCO genes per sequence
    icon: mdi:dna
    color: grape
    description: Every sequence holding a complete BUSCO, drawn to its length and shaded by density
  - name: Telomeric repeats
    icon: mdi:chart-timeline-variant
    color: grape
    description: The repeat unit tidk searched, counted per 10 kb window along every sequence
  - name: Karyotype tables
    icon: mdi:table
    color: gray
    description: Complete BUSCOs per sequence
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      Each genome is drawn as a karyotype: one bar per sequence, the longest first, drawn to its
      length. The first view shades each sequence by its complete BUSCOs per megabase; the second
      counts the repeat unit [tidk](https://github.com/tolkit/telomeric-identifier) searched, so a
      telomere-capped chromosome lights up at both ends. Check the unit first: one tidk picks
      itself can be a simple repeat rather than the telomere.
    tag: gq-kar-intro
    index: kar-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: genomeqc
    data_collection_tag: busco_karyotype
    interactive_component_type: RangeSlider
    column_name: sequence_length
    column_type: int64
    display:
      icon_name: mdi:ruler
      custom_color: grape
    section: Sequence scope
    group: Sequences
    tag: gq-kar-filter-length
    index: kar-length-range
    title: Sequence length (bp)
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: busco_karyotype
    aggregation: count
    column_name: sequence
    column_type: object
    secondary_layout: composition
    breakdown_col: genome
    display:
      icon_name: mdi:format-align-left
      icon_color: grape
      caption: sequences holding a BUSCO, by genome
      format: integer
    section: Sequences at a glance
    tag: gq-kar-card-sequences
    index: kar-card-sequences
    title: Sequences with a BUSCO
    description: Sequences carrying at least one complete BUSCO. Close to the chromosome number on a chromosome-level assembly.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: busco_karyotype
    aggregation: sum
    column_name: complete_buscos
    column_type: int64
    secondary_layout: donut
    breakdown_col: genome
    display:
      icon_name: mdi:check-decagram-outline
      icon_color: teal
