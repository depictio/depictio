- title: Repeats
  subtitle: How much of each genome is repeats, and of which kinds?
  tab_group: Genomes
  tab_order: 6
  tab_icon: mdi:repeat
  tab_icon_color: pink
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Repeat scope
    icon: mdi:filter-variant
    color: pink
    description: The repeat class narrows the class chart and table; the masking cards are per-genome totals
  grid_sections:
  - name: Repeats at a glance
    icon: mdi:counter
    color: pink
    description: Masked, interspersed and simple repeats, and the elements found
  - name: Repeat classes
    icon: mdi:chart-bar
    color: pink
    description: The share of each genome every repeat class takes
  - name: Repeat tables
    icon: mdi:table
    color: gray
    description: Repeat classes and families, and the masking summary per genome
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [RepeatMasker](https://www.repeatmasker.org) masks the transposable elements, simple repeats
      and low-complexity sequence of each assembly against its repeat library. The bars open on
      the classes; switch the rank to read the families inside them. Unclassified repeats are the
      ones the library could not name, and they grow with a de novo library.
    tag: gq-rep-intro
    index: rep-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: genomeqc
    data_collection_tag: repeatmasker_repeat_classes
    interactive_component_type: MultiSelect
    column_name: repeat_class
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: pink
    section: Repeat scope
    group: Repeats
    tag: gq-rep-filter-class
    index: rep-class-filter
    title: Repeat class
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: repeatmasker_masking_summary
    aggregation: median
    column_name: masked_pct
    column_type: float64
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:texture-box
      icon_color: pink
      caption: median share of the genome masked (%)
      decimals: 1
    section: Repeats at a glance
    tag: gq-rep-card-masked
    index: rep-card-masked
    title: Masked
    description: Bases RepeatMasker masked, in percent of the assembly, at the median.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: repeatmasker_masking_summary
    aggregation: median
    column_name: interspersed_pct
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:dna
      icon_color: violet
      caption: median per genome, with the spread (%)
      decimals: 1
    section: Repeats at a glance
    tag: gq-rep-card-interspersed
    index: rep-card-interspersed
    title: Interspersed repeats
    description: Transposable elements and unclassified interspersed repeats, in percent of the assembly.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: repeatmasker_masking_summary
    aggregation: median
    column_name: simple_repeats_pct
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:format-list-numbered
      icon_color: orange
      caption: per genome, how it spreads (%)
      decimals: 2
    section: Repeats at a glance
    tag: gq-rep-card-simple
    index: rep-card-simple
    title: Simple repeats
    description: Microsatellites and other short tandem repeats, in percent of the assembly.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: repeatmasker_repeat_classes
    aggregation: sum
    column_name: elements
    column_type: int64
    filter_expr: "col('rank') == 'Class'"
    secondary_layout: composition
    breakdown_col: repeat_class
    display:
      icon_name: mdi:shape-plus
      icon_color: teal
      caption: elements, by repeat class
      format: si
    section: Repeats at a glance
    tag: gq-rep-card-elements
    index: rep-card-elements
    title: Repeat elements
    description: Elements RepeatMasker masked over every genome, split by class.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: genomeqc
    data_collection_tag: repeatmasker_repeat_classes
    use: repeatmasker/class_composition
    config:
      default_rank: Class
      top_n: 8
      normalise_to_one: false
      sample_sort: input
    section: Repeat classes
    tag: gq-rep-av-classes
    index: rep-classes
    title: Repeat classes per genome
    description: Share of each assembly every repeat class takes, the 8 largest and the rest as Other.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: genomeqc
    data_collection_tag: repeatmasker_masking_summary
    use: repeatmasker/masking_summary
    row_selection_enabled: true
    row_selection_column: genome
    section: Repeat tables
    tag: gq-rep-table-summary
    index: rep-table-summary
    title: Masking summary per genome
    description: Sequences, length, GC and masked bases of each assembly, with the share of the main classes.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: genomeqc
    data_collection_tag: repeatmasker_repeat_classes
    use: repeatmasker/repeat_classes
    section: Repeat tables
    tag: gq-rep-table-classes
    index: rep-table-classes
    title: Repeat classes and families
    description: Every class and family line of RepeatMasker's summary, with its elements, bases and share of the assembly.
    layout: {x: 0, y: 6, w: 8, h: 6}
- title: Annotation
  subtitle: How many genes does each annotation hold, and how are they built?
  tab_group: Genomes
  tab_order: 7
  tab_icon: mdi:file-tree-outline
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Annotation scope
    icon: mdi:filter-variant
    color: indigo
    description: Both picks narrow AGAT's statistics table only; the cards, gene models and overlaps count each annotation whole
  grid_sections:
  - name: Gene models at a glance
    icon: mdi:counter
    color: indigo
    description: Protein-coding genes, exons per transcript, single-exon and overlapping genes
  - name: Gene models by type
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Every transcript type of every annotation, by genes and exons per transcript
  - name: Genes and overlaps
    icon: mdi:chart-bar
    color: indigo
    description: Genes per transcript type, and the genes nested in another
  - name: Annotation tables
    icon: mdi:table
    color: gray
    description: Gene models per type and every AGAT statistic
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [AGAT](https://github.com/NBISweden/AGAT) summarises each annotation per transcript type;
      exons per transcript and lengths are read on the longest isoform of each gene, so
      annotations with more isoforms still compare. A fragmented annotation shows as short genes
      with few exons and many single-exon models.
    tag: gq-ann-intro
    index: ann-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: genomeqc
    data_collection_tag: agat_statistics
    interactive_component_type: MultiSelect
    column_name: feature_type
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: indigo
    section: Annotation scope
    group: Annotation
    tag: gq-ann-filter-type
    index: ann-type-filter
    title: Feature type
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: genomeqc
    data_collection_tag: agat_statistics
    interactive_component_type: MultiSelect
    column_name: isoforms
    column_type: object
    display:
      icon_name: mdi:source-branch
      custom_color: cyan
    section: Annotation scope
    group: Annotation
    tag: gq-ann-filter-isoforms
    index: ann-isoform-filter
    title: Isoform view
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: agat_gene_models
    use: agat/gene_count
    aggregation: sum
    column_name: genes
    column_type: int64
    filter_expr: "col('feature_type') == 'mrna'"
    secondary_layout: composition
    breakdown_col: genome
    display:
      icon_name: mdi:file-tree-outline
      icon_color: indigo
      caption: protein-coding genes, by genome
      format: si
    section: Gene models at a glance
    tag: gq-ann-card-genes
    index: ann-card-genes
    title: Protein-coding genes
    description: Genes with an mRNA, over every annotation.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: agat_gene_models
    use: agat/exons_per_transcript
    aggregation: median
    column_name: exons_per_transcript
    column_type: float64
    filter_expr: "col('feature_type') == 'mrna'"
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:view-sequential
      icon_color: blue
      caption: median per annotation, with the spread
      decimals: 1
    section: Gene models at a glance
    tag: gq-ann-card-exons
    index: ann-card-exons
    title: Exons per mRNA
    description: Mean exons of the longest mRNA of each protein-coding gene, at the median over the annotations.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: agat_gene_models
    use: agat/single_exon_share
    aggregation: median
    column_name: single_exon_gene_pct
    column_type: float64
    filter_expr: "col('feature_type') == 'mrna'"
    secondary_layout: histogram
    display:
      icon_name: mdi:minus-box-outline
      icon_color: orange
      caption: per annotation, how it spreads (%)
      decimals: 1
    section: Gene models at a glance
    tag: gq-ann-card-single
    index: ann-card-single
    title: Single-exon genes
    description: Protein-coding genes whose mRNA has one exon, in percent. A surplus points at fragmented gene models.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: gene_overlaps
    aggregation: median
    column_name: overlapping_pct
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:set-center
      icon_color: grape
      caption: median per annotation, with the spread (%)
      decimals: 1
    section: Gene models at a glance
    tag: gq-ann-card-overlaps
    index: ann-card-overlaps
    title: Overlapping genes
    description: Genes overlapping another gene, in percent of all genes. Same-strand nested genes are the suspicious ones.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: genomeqc
    data_collection_tag: agat_gene_models
    use: agat/genes_vs_exons
    config:
      x_title: Genes of the type (log)
      y_title: Exons per transcript
      log_x: true
      legend_pos: bottom
      selection_enabled: true
      selection_column: genome
    section: Gene models by type
    tag: gq-ann-av-gene-models
    index: ann-gene-models
    title: Genes against exons per transcript
    description: One point per annotation and transcript type, sized by mean gene length. Protein-coding genes sit top right; the small RNAs bottom left.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: genomeqc
    data_collection_tag: agat_gene_models
    viz_kind: stacked_taxonomy
    config:
      viz_kind: stacked_taxonomy
      sample_id_col: genome
      taxon_col: feature_type
      rank_col: null
      abundance_col: genes
      normalise_to_one: true
      orientation: h
      sample_sort: name
      y_zoom: auto
      top_n: 8
      value_title: Share of the genes
      hidden_controls: [rank, top_n, group]
    section: Genes and overlaps
    tag: gq-ann-fig-types
    index: ann-gene-types
    title: Genes per transcript type
    description: Each annotation's genes by the type of their transcripts, as shares; Normalise off shows the gene counts. Sort by a type to rank the annotations on it.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: advanced_viz
    workflow_tag: genomeqc
    data_collection_tag: gene_overlaps
    viz_kind: stacked_taxonomy
    config:
      viz_kind: stacked_taxonomy
      sample_id_col: genome
      value_cols: [not_overlapping_genes, overlapping_not_nested, contained_opposite_strand, contained_same_strand]
      value_labels:
        not_overlapping_genes: Overlapping none
        overlapping_not_nested: Overlapping another
        contained_opposite_strand: Nested, opposite strand
        contained_same_strand: Nested, same strand
      taxon_palette: {Overlapping none: '#adb5bd', Overlapping another: '#1c7ed6', 'Nested, opposite strand': '#0ca678', 'Nested, same strand': '#e8590c'}
      normalise_to_one: true
      orientation: h
      sample_sort: category
      sort_category: Nested, same strand
      y_zoom: auto
      value_title: Share of the genes
      hidden_controls: [rank, top_n, group]
    section: Genes and overlaps
    tag: gq-ann-fig-nested
    index: ann-nested
    title: Genes by overlap with another gene
    description: Each annotation's genes split four ways, overlapping no other gene, overlapping one, nested inside one on the opposite strand (often a gene in an intron) or on the same strand (often a split or duplicated model).
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: table
    workflow_tag: genomeqc
    data_collection_tag: agat_gene_models
    use: agat/gene_models
    row_selection_enabled: true
    row_selection_column: genome
    section: Annotation tables
    tag: gq-ann-table-models
    index: ann-table-models
    title: Gene models per type
    description: Genes, transcripts, exons, single-exon and overlapping genes and lengths per annotation and transcript type.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: genomeqc
    data_collection_tag: agat_statistics
    use: agat/statistics
    section: Annotation tables
    tag: gq-ann-table-stats
    index: ann-table-stats
    title: Every AGAT statistic
    description: Each metric of AGAT's report per annotation, feature type and isoform view.
    layout: {x: 0, y: 6, w: 8, h: 6}
- title: Orthology
  subtitle: Which orthogroups do the genomes share?
  tab_group: Genomes
  tab_order: 8
  tab_icon: mdi:family-tree
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Orthogroup scope
    icon: mdi:filter-variant
    color: cyan
    description: The copy class narrows the orthogroup UpSet and its cards; the per-genome stats have no orthogroup rows
  grid_sections:
  - name: Orthology at a glance
    icon: mdi:counter
    color: cyan
    description: Orthogroups, the shared core, genes placed and orthogroups of one genome
  - name: Genes by orthogroup
    icon: mdi:chart-bar
    color: cyan
    description: Each genome's genes in shared, genome-specific or no orthogroups
  - name: Shared orthogroups
    icon: mdi:set-merge
    color: cyan
    description: Orthogroups by the set of genomes they reach
  - name: One-to-one orthologues
    icon: mdi:relation-many-to-many
    color: cyan
    description: Orthologues found once in each of two genomes, for every pair
  - name: Orthology tables
    icon: mdi:table
    color: gray
    description: Orthogroup assignment per genome and the sequences carrying orthologues
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [OrthoFinder](https://github.com/davidemms/OrthoFinder) groups the longest protein of every
      gene of every genome into orthogroups, the genes descended from one ancestral gene. The core
      every genome shares should dominate; a genome with many orthogroups of its own, or many
      genes in none, carries spurious or fragmented gene models.
    tag: gq-orth-intro
    index: orth-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: genomeqc
    data_collection_tag: orthofinder_orthogroup_matrix
    interactive_component_type: MultiSelect
    column_name: copy_class
    column_type: object
    display:
      icon_name: mdi:content-copy
      custom_color: cyan
    section: Orthogroup scope
    group: Orthogroups
    tag: gq-orth-filter-copy
    index: orth-copy-filter
    title: Copy class
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: orthofinder_orthogroup_matrix
    use: orthofinder/orthogroups_total
    aggregation: count
    column_name: orthogroup
    column_type: object
    secondary_layout: composition
    breakdown_col: copy_class
    display:
      icon_name: mdi:family-tree
      icon_color: cyan
      caption: orthogroups, by copy class
      format: si
    section: Orthology at a glance
    tag: gq-orth-card-orthogroups
    index: orth-card-orthogroups
    title: Orthogroups
    description: Groups of genes descended from one ancestral gene, over every genome.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: orthofinder_orthogroup_matrix
    aggregation: count
    column_name: orthogroup
    column_type: object
    filter_expr: "col('sharing') == 'core'"
    secondary_layout: donut
    breakdown_col: copy_class
    display:
      icon_name: mdi:set-all
      icon_color: blue
      caption: the shared core, by copy class
      format: si
    section: Orthology at a glance
    tag: gq-orth-card-core
    index: orth-card-core
    title: Shared by every genome
    description: Orthogroups holding a gene of every genome of the run.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: orthofinder_species_stats
    use: orthofinder/assigned_share
    aggregation: min
    column_name: genes_in_orthogroups_pct
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:check-all
      icon_color: teal
      caption: lowest genome, with the spread (%)
      decimals: 1
    section: Orthology at a glance
    tag: gq-orth-card-assigned
    index: orth-card-assigned
    title: Genes in orthogroups
    description: Share of a genome's genes OrthoFinder placed in an orthogroup, for the genome with the fewest.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: orthofinder_species_stats
    aggregation: sum
    column_name: species_specific_orthogroups
    column_type: int64
    secondary_layout: composition
    breakdown_col: genome
    display:
      icon_name: mdi:account-outline
      icon_color: orange
      caption: orthogroups of one genome, by genome
      format: integer
    section: Orthology at a glance
    tag: gq-orth-card-specific
    index: orth-card-specific
    title: Genome-specific orthogroups
    description: Orthogroups whose genes all come from a single genome.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: genomeqc
    data_collection_tag: orthofinder_species_stats
    viz_kind: stacked_taxonomy
    config:
      viz_kind: stacked_taxonomy
      sample_id_col: genome
      value_cols: [genes_in_shared_orthogroups, genes_in_species_specific, unassigned_genes]
      value_labels:
        genes_in_shared_orthogroups: In shared orthogroups
        genes_in_species_specific: In genome-specific orthogroups
        unassigned_genes: In no orthogroup
      taxon_palette: {In shared orthogroups: '#2f9e44', In genome-specific orthogroups: '#ae3ec9', In no orthogroup: '#adb5bd'}
      normalise_to_one: true
      orientation: h
      sample_sort: category
      sort_category: In no orthogroup
      y_zoom: auto
      value_title: Share of the genes
      hidden_controls: [rank, top_n, group]
    section: Genes by orthogroup
    tag: gq-orth-av-placement
    index: orth-placement
    title: Genes by the orthogroups they fall in
    description: Each genome's genes in orthogroups it shares with another genome, in orthogroups of its own, or in none. Shared genes fill most of every bar, so the axis starts near the smallest shared share (the // marks the cut).
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: genomeqc
    data_collection_tag: orthofinder_orthogroup_matrix
    use: orthofinder/orthogroup_upset
    config:
      color_intersections_by: degree
      show_set_sizes: true
      show_values: true
      sort_by: cardinality
      sort_order: descending
      min_size: 1
      # The species columns, whatever the run named them; n_genomes is the
      # only other integer column and could read 0/1 on a two-genome run.
      set_columns_pattern: '^(?!n_genomes$|total_genes$)'
      selection_enabled: true
      selection_column: orthogroup
    section: Shared orthogroups
    tag: gq-orth-av-upset
    index: orth-upset
    title: Orthogroups shared between genomes
    description: Intersections of the genomes each orthogroup reaches, largest first. Click a bar to keep its orthogroups.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: genomeqc
    data_collection_tag: orthofinder_orthologue_matrix
    use: orthofinder/one_to_one_heatmap
    config:
      cluster_rows: false
      cluster_cols: false
      colorscale: Blues
    section: One-to-one orthologues
    tag: gq-orth-av-pairs
    index: orth-pairs
    title: One-to-one orthologues between genomes
    description: Orthologues present once in each of two genomes, for every pair; the closest, best-annotated pairs share the most.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: genomeqc
    data_collection_tag: orthofinder_species_stats
    use: orthofinder/species_stats
    row_selection_enabled: true
    row_selection_column: genome
    section: Orthology tables
    tag: gq-orth-table-species
    index: orth-table-species
    title: Orthogroup assignment per genome
    description: Genes, genes placed and unplaced, orthogroups reached and orthogroups of the genome alone.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: genomeqc
    data_collection_tag: ortho_seq_count
    section: Orthology tables
    tag: gq-orth-table-seqcount
    index: orth-table-seqcount
    title: Sequences carrying orthologues
    description: Sequences of each genome holding orthologues of another genome; close to the chromosome number on a chromosome-level assembly.
    layout: {x: 0, y: 6, w: 8, h: 6}
