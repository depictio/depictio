  - component_type: advanced_viz
    workflow_tag: genomeqc
    data_collection_tag: busco_karyotype
    viz_kind: ideogram
    config:
      viz_kind: ideogram
      chrom_col: sequence
      start_col: start
      end_col: end
      value_col: buscos_per_mb
      sample_col: genome
      chrom_length_col: sequence_length
      mode: density
      orientation: horizontal
      facet_by_sample: true
      max_facets: 6
      max_chromosomes: 24
      colour_scale: Viridis
      lock_mode: true
    section: BUSCO genes per sequence
    tag: gq-kar-av-busco
    index: kar-busco
    title: BUSCO density on each genome's sequences
    description: >-
      Where do the conserved genes sit on each genome? One karyotype per genome (pick one above the
      chart): its 24 longest sequences that hold a complete BUSCO, longest first, drawn to their length
      and shaded by complete BUSCOs per Mb on the Viridis scale of the legend. Click a bar to zoom along
      it, with Ctrl+wheel to go further.

      How to read: on a chromosome-level assembly a few long bars carry the genes with similar shades,
      while a draft shows many short bars. A pale bar holds few conserved genes for its length and a dark
      one many, so an uneven shade among long sequences is worth a look. Filter the tab to a sequence from
      the zoomed view, and open [Assembly](tab:Assembly) for the contiguity behind it.

      Note: genomeqc gives BUSCOs per sequence and not gene positions, so each bar is shaded evenly along
      its length. No reference mark is drawn, and the shade is read against the other bars of the same
      genome.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: genomeqc
    data_collection_tag: tidk_search_windows
    use: tidk/telomere_karyotype
    config:
      mode: density
      orientation: horizontal
      facet_by_sample: true
      max_facets: 6
      max_chromosomes: 24
      colour_scale: Viridis
      lock_mode: true
    section: Telomeric repeats
    tag: gq-kar-av-telomeres
    index: kar-telomeres
    title: Repeat units per 10 kb window
    description: >-
      Do the sequences end in telomeric repeats? One karyotype per genome (pick one above the chart): its
      24 longest sequences drawn to their length and shaded by the copies of the repeat unit tidk searched
      in each 10 kb window, on the Viridis scale of the legend. Click a bar or use Ctrl+wheel to zoom
      along it.

      How to read: a sequence capped by telomeres lights up at both ends, as most long sequences of a
      chromosome-level assembly do. One lit at a single end was broken there, and repeats in the middle of
      a sequence are an interstitial array or a unit that is not the telomere at all. The BUSCO density
      chart above shows where the genes sit on the same sequences.

      Warning: check the unit first. A unit tidk picks itself can be a simple repeat and not the telomere
      of the clade, in which case the lit ends mean nothing. No cut-off is drawn: tidk publishes none for
      the number of copies.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: genomeqc
    data_collection_tag: busco_karyotype
    row_selection_enabled: true
    row_selection_column: sequence
    section: Karyotype tables
    tag: gq-kar-table-busco
    index: kar-table-busco
    title: Complete BUSCOs per sequence
    description: Every sequence holding a complete BUSCO, with its length, its BUSCOs, their density and their share of the genome's.
    layout: {x: 0, y: 0, w: 8, h: 6}
