version: 1
# nf-core/genomeqc 1.0.1, on the family rules of depictio/projects/nf-core/RULES.md
# (ampliseq/2.18.0 is the reference implementation).
#
# Funnel: the MultiQC report, how contiguous each assembly is (Assembly) and
# whether any of it is foreign (Contamination), all in Data & QC -> how much of
# the conserved gene set each assembly and its annotation hold (Completeness),
# where those genes and the telomeric repeats sit on the sequences (Karyotype),
# how much of each genome is repeats (Repeats), how the gene models are built
# (Annotation) and which orthogroups the genomes share (Orthology). The genome
# hub (`genomes`, one row per assembly) is what every filter starts from: the
# template's links carry a pick on a genome to every per-genome collection.
#
# Routes: the design table is optional (METADATA_FILE; without it the group
# filter, group colours and group splits fall away). Every tool collection but
# QUAST is optional, so a genome-only run loses the Annotation and Orthology
# tabs, --skip_tidk the Karyotype tab, a run without an FCS-GX database the
# Contamination tab and a run without --te repeatmasker the Repeats tab; each
# takes its pipeline step, its findings row and its highlight with it.
main_dashboard:
  title: nf-core/genomeqc
  subtitle: Genome assembly and annotation quality, from contiguity to the orthogroups the genomes share
  project_tag: Genome Assembly and Annotation QC
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family.
  category_colors:
    '{GROUP_COL}': auto
    # One colour per genome, read from the genome hub: the orthogroup UpSet draws
    # its sets in it (set_category_column) and the genome filter chips wear it.
    # Same palette as the group, so every tab intro says which one it draws.
    genome: auto
    busco_class:
      Complete single-copy: '#1c7ed6'
      Complete duplicated: '#74c0fc'
      Fragmented: '#f08c00'
      Missing: '#e03131'
    busco_mode:
      genome: '#1c7ed6'
      proteins: '#0ca678'
    copy_class:
      single-copy: '#1c7ed6'
      multi-copy: '#f08c00'
    tiara_class:
      eukarya: '#2f9e44'
      mitochondrion: '#1098ad'
      plastid: '#66a80f'
      organelle: '#3bc9db'
      bacteria: '#e03131'
      archaea: '#ae3ec9'
      prokarya: '#f08c00'
      unknown: '#adb5bd'
    action:
      '*': auto
      none: '#adb5bd'
    # RepeatMasker's classes take the palette, largest share first.
    repeat_class:
      '*': 'auto:genome_pct'
      Unclassified: '#adb5bd'
    feature_type:
      '*': auto
      mrna: '#1c7ed6'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. Both
  # are bound to the genome hub, the source of every genome link.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab, which no route removes.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: One row per assembly, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Genomes, below).
  - component_type: interactive
    workflow_tag: genomeqc
    data_collection_tag: genomes
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Key figures
    tag: gq-ov-kf-group
    index: ov-kf-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: genomeqc
    data_collection_tag: genomes
    interactive_component_type: MultiSelect
    column_name: genome
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: teal
      strip_label: Genome
    section: Key figures
    tag: gq-ov-kf-genome
    index: ov-kf-genome
    title: Genome
    layout: {x: 2, y: 0, w: 2, h: 1}
  # The pipeline's wordmark, read from its repository; where it cannot load (no
  # internet), the title is drawn as text.
  - component_type: text
    title: nf-core/genomeqc
    logo: https://raw.githubusercontent.com/nf-core/genomeqc/master/docs/images/nf-core-genomeqc_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/genomeqc/master/docs/images/nf-core-genomeqc_logo_dark.png
    order: 1
    body: >
      Genome assembly and annotation quality: how contiguous and complete each assembly is,
      where its genes sit and which orthogroups the genomes share. [Run parameters](params:)
    tag: gq-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  # The study: the assemblies compared, from the genome hub (one row per assembly, written
  # by every route). The design table is optional, so no line reads its columns.
  - component_type: text
    surface: card
    values:
      n_genomes: {dc: genomes, column: genome, aggregation: nunique, format: integer}
      n_bp: {dc: genomes, column: total_length, aggregation: sum, format: si}
      n_seq: {dc: genomes, column: n_contigs, aggregation: sum, format: si}
      n_annot: {dc: genomes, column: genome, aggregation: count, filter_expr: "col('genes') > 0", format: integer}
    body: |
      ### The study
      - ![](icon:mdi:dna) **Assemblies** {{n_genomes}} compared, one row each
      - ![](icon:mdi:ruler) **Size** {{n_bp}} bases in {{n_seq}} sequences
      - ![](icon:mdi:file-tree-outline) **Annotated** {{n_annot}} assemblies with gene models
      - ![](icon:mdi:file-table-outline) **Samplesheet** [one row per assembly](section:Sample sheet), its path in [the run parameters](params:input)
      - ![](icon:mdi:palette-outline) **Genome** {{legend:genome}}
      - ![](icon:mdi:palette-outline) **BUSCO class** {{legend:busco_class}}
    tag: gq-ov-study
    index: ov-study
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash.
  - component_type: text
    surface: card
    body: |
      ### The run
      - ![](icon:mdi:source-branch) **Pipeline** nf-core/genomeqc 1.0.1
      - ![](icon:mdi:check-decagram-outline) **BUSCO** lineage {{param:busco_lineage}}
      - ![](icon:mdi:file-tree-outline) **Annotation** validated with {{param:val_tool}}
      - ![](icon:mdi:family-tree) **OrthoFinder** version {{param:ortho_version}}
      - ![](icon:mdi:repeat) **Repeats** {{param:te}}
    tag: gq-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  # The marks take the accent colour, not the theme's blue. The steps that lead
  # to an optional route's tab cite a value from that route's collection: the
  # import removes the line with its data, so a run shows only the steps it took.
  - component_type: text
    surface: card
    accent: teal
    values:
      n_seq: {dc: quast_assembly_report, column: n_contigs, aggregation: sum, format: si}
      n_screen: {dc: tiara_classifications, column: sequence, aggregation: count, format: si}
      n_masked: {dc: repeatmasker_masking_summary, column: masked_bp, aggregation: sum, format: si}
      n_busco: {dc: busco_batch_summary, column: assembly_id, aggregation: count, format: integer}
      n_genes: {dc: agat_gene_models, column: genes, aggregation: sum, filter_expr: "col('feature_type') == 'mrna'", format: si}
      n_og: {dc: orthofinder_orthogroup_matrix, column: orthogroup, aggregation: count, format: si}
    body: |
      ### Six steps from assemblies to shared genes
      Each step names its settings and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:ruler) **Measure** QUAST counts {{n_seq}} sequences and their contiguity · [Settings](params:input) · [Assembly](tab:Assembly)
      2. ![](icon:mdi:shield-search) **Screen** FCS-GX, FCS-adaptor and Tiara check {{n_screen}} sequences for foreign DNA · [Settings](params:gxdb_manifest) · [Contamination](tab:Contamination)
      3. ![](icon:mdi:repeat) **Mask** RepeatMasker masks {{n_masked}} repeat bases · [Settings](params:te) · [Repeats](tab:Repeats)
      4. ![](icon:mdi:check-decagram-outline) **Complete** BUSCO scores {{n_busco}} gene sets, each assembly and its proteins · [Settings](params:busco_lineage) · [Completeness](tab:Completeness)
      5. ![](icon:mdi:file-tree-outline) **Annotate** AGAT describes {{n_genes}} protein-coding genes · [Settings](params:val_tool) · [Annotation](tab:Annotation)
      6. ![](icon:mdi:family-tree) **Compare** OrthoFinder groups the genes into {{n_og}} orthogroups · [Settings](params:ortho_version) · [Orthology](tab:Orthology)
      :::
    tag: gq-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/genomeqc compares several genome assemblies, and their annotations when it has them: contiguity with QUAST, foreign sequence with FCS-GX and Tiara, repeats with RepeatMasker, conserved genes with BUSCO, gene models with AGAT and shared genes with OrthoFinder. Each assembly is one row of every table, so the genomes compare side by side. This page sums up one run; each tab behind it answers one question, in the order of the steps above.

      The sample filters in the left panel apply to every tab: narrow the genomes once and the whole dashboard follows. A bar above a section narrows that section only.

      A genome keeps one colour across the dashboard: the contiguity scatter, the orthogroup UpSet, the genome strips beside the bar charts and the genome filter all wear it. The bar charts colour a class (BUSCO, Tiara, repeat, transcript type), and each bar or row is one genome, named on its axis; the BUSCO dot plot colours the assembly and its proteins.
    tag: gq-ov-about
    index: ov-about
    layout: {x: 0, y: 7, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. All four read the genome hub, which every route writes.
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: genomes
    aggregation: nunique
    column_name: genome
    column_type: object
    secondary_layout: composition
    breakdown_col: '{GROUP_COL}'
    display:
      icon_name: mdi:dna
      icon_color: orange
      caption: compared, by {GROUP_COL_DISPLAY}
      link: tab:Assembly
    section: Key figures
    tag: gq-ov-kf-genomes
    index: ov-kf-genomes
    title: Genomes
    description: Assemblies the run compared. The bar splits them by {GROUP_COL_DISPLAY}.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: genomes
    aggregation: median
    column_name: n50
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:ruler
      icon_color: blue
      caption: per assembly, how they spread
      link: tab:Assembly
      format: si
    section: Key figures
    tag: gq-ov-kf-n50
    index: ov-kf-n50
    title: N50
    description: Length of the sequence at which half of an assembly is reached, longest first. The histogram shows how the assemblies spread.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: genomes
    aggregation: median
    column_name: busco_complete_pct
    column_type: float64
    secondary_layout: threshold
    threshold_value: 95
    threshold_direction: min
    threshold_warn: 90
    display:
      icon_name: mdi:check-decagram-outline
      icon_color: teal
      caption: assemblies at 95% or more, below 90% failing
      link: tab:Completeness
      decimals: 1
    section: Key figures
    tag: gq-ov-kf-busco
    index: ov-kf-busco
    title: Complete BUSCOs
    description: Conserved single-copy genes of the lineage found whole in an assembly, in percent, at the median.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: genomeqc
    data_collection_tag: genomes
    aggregation: median
    column_name: ns_per_100_kbp
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:texture-box
      icon_color: grape
      caption: per assembly, with the spread
      link: tab:Assembly
      decimals: 0
    section: Key figures
    tag: gq-ov-kf-gaps
    index: ov-kf-gaps
    title: N bases per 100 kb
    description: Gap bases left by scaffolding, per 100 kb of assembly. The box shows how much the assemblies differ.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the group, then the genome.
  - component_type: interactive
    workflow_tag: genomeqc
    data_collection_tag: genomes
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Findings
    tag: gq-ov-findings-group
    index: ov-findings-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: genomeqc
    data_collection_tag: genomes
    interactive_component_type: MultiSelect
    column_name: genome
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: teal
      strip_label: Genome
    section: Findings
    tag: gq-ov-findings-genome
    index: ov-findings-genome
    title: Genome
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one collection, so a route that
  # lacks it loses that row alone.
  - component_type: text
    surface: card
    values:
      n50: {dc: quast_assembly_report, column: n50, aggregation: median, format: si}
      l50: {dc: quast_assembly_report, column: l50, aggregation: median, format: integer}
      busco: {dc: busco_batch_summary, column: complete_pct, aggregation: median, filter_expr: "col('busco_mode') == 'genome'", format: 'decimals:1'}
      prot: {dc: busco_batch_summary, column: complete_pct, aggregation: median, filter_expr: "col('busco_mode') == 'proteins'", format: 'decimals:1'}
      seqs: {dc: busco_karyotype, column: sequence, aggregation: count, format: integer}
      share: {dc: busco_karyotype, column: busco_share_pct, aggregation: max, format: 'decimals:1'}
      og_all: {dc: orthofinder_orthogroup_matrix, column: orthogroup, aggregation: count, filter_expr: "col('sharing') == 'core'", format: si}
      og_one: {dc: orthofinder_species_stats, column: species_specific_orthogroups, aggregation: sum, format: integer}
    body: |
      - **{{n50}}** median N50 of the assemblies – half of an assembly sits in {{l50}} sequences at the median [Assembly](tab:Assembly)
      - **{{busco}}%** complete BUSCOs in the assemblies at the median – their annotated proteins keep {{prot}}% [Completeness](tab:Completeness)
      - **{{seqs}}** sequences carry the complete BUSCOs – the busiest holds {{share}}% of its genome's [Karyotype](tab:Karyotype)
      - **{{og_all}}** orthogroups every genome shares – {{og_one}} belong to a single genome [Orthology](tab:Orthology)
    section: Findings
    tag: gq-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per analysis tab, in the order of the tabs. The tiles of a row
  # share a stored height.
  - component_type: highlight
    section: Findings
    source_tab: Assembly
    source_component: asm-contiguity
    caption: One named point per assembly, by its sequences and N50 on log axes; chromosome-level assemblies sit top left, and the dashed line is the 1 Mb N50 that the Earth BioGenome Project sets as the minimum.
    hide_legend: true
    tag: gq-ov-hl-assembly
    index: ov-hl-assembly
    layout: {x: 0, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Completeness
    source_component: cmp-classes
    caption: What each BUSCO run does not find whole, the assembly and its proteins side by side; orange is fragmented, red is missing, and the dashed line is the 5% a 95% pass allows.
    hide_legend: true
    tag: gq-ov-hl-completeness
    index: ov-hl-completeness
    layout: {x: 4, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Annotation
    source_component: ann-gene-models
    caption: One point per annotation and transcript type, by genes and exons per transcript; protein-coding genes sit to the right with several exons, small RNAs on the one-exon line.
    hide_legend: true
    tag: gq-ov-hl-annotation
    index: ov-hl-annotation
    layout: {x: 0, y: 6, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Orthology
    source_component: orth-placement
    caption: Each genome's genes that sit in an orthogroup of its own or in none, in percent of its genes; short bars are good, the rest sit in shared orthogroups.
    tag: gq-ov-hl-orthology
    index: ov-hl-orthology
    layout: {x: 4, y: 6, w: 4, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers. A tile whose tab a route pruned draws nothing.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Assembly](tab:Assembly)
      - [Contamination](tab:Contamination)

      ### Genomes
      - [Completeness](tab:Completeness)
      - [Karyotype](tab:Karyotype)
      - [Repeats](tab:Repeats)
      - [Annotation](tab:Annotation)
      - [Orthology](tab:Orthology)
    section: How to read this dashboard
    tag: gq-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the group first.
  - component_type: interactive
    workflow_tag: genomeqc
    data_collection_tag: genomes
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Genome scope
    tag: gq-filter-group
    index: sample-filters-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: genomeqc
    data_collection_tag: genomes
    interactive_component_type: MultiSelect
    column_name: genome
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: teal
    section: Sample filters
    group: Genome scope
    tag: gq-filter-genome
    index: sample-filters-genome
    title: Genome
    layout: {x: 0, y: 2, w: 1, h: 3}
  # Row selection feeds the Analysis panel.
  - component_type: table
    workflow_tag: genomeqc
    data_collection_tag: genomes
    row_selection_enabled: true
    row_selection_column: genome
    section: Sample sheet
    tag: gq-sample-sheet
    index: sample-sheet
    title: Genomes
    description: One row per assembly, with its design columns, contiguity, completeness, gene models, orthology, contamination and repeats.
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
# ============================================================================
# Data & QC
# ============================================================================
- title: MultiQC
  subtitle: What does the MultiQC report say about the assemblies?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Report scope
    icon: mdi:tune
    color: orange
    description: Narrow the MultiQC panels to selected report rows
  grid_sections:
  - name: Assembly sections
    icon: mdi:chart-box-outline
    color: orange
    description: The general statistics, then QUAST's assembly statistics and contig counts
  components:
  - component_type: text
    order: 1
    body: >
      The [MultiQC](https://multiqc.info) report of the run carries QUAST's statistics for every
      assembly, each row named after the assembly's FASTA file. The other tools of the run write
      their own tables, read on the tabs behind this one. MultiQC draws these panels with its own
      colours, which follow neither the {GROUP_COL_DISPLAY} nor the genome colours of the other tabs.
    tag: gq-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    workflow_tag: genomeqc
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: Assembly sections
    tag: gq-mqc-general-stats
    title: General statistics
    description: The headline QUAST numbers of every assembly in one table.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: genomeqc
    data_collection_tag: multiqc_data
    selected_module: quast
    selected_plot: Assembly Statistics
    section: Assembly sections
    tag: gq-mqc-quast-stats
    title: QUAST assembly statistics
    description: Length, N50, N90, L50, GC and sequences per assembly, as QUAST reports them.
    layout: {x: 0, y: 4, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: genomeqc
    data_collection_tag: multiqc_data
    selected_module: quast
    selected_plot: Number of Contigs
    section: Assembly sections
    tag: gq-mqc-quast-contigs
    title: Sequences by length
    description: Sequences of each assembly in QUAST's length bins.
    layout: {x: 0, y: 8, w: 8, h: 4}
  - component_type: interactive
    workflow_tag: genomeqc
    data_collection_tag: multiqc_data
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:file-document-outline
      custom_color: orange
    section: Report scope
    group: Report scope
    tag: gq-mqc-filter-report-row
    index: gq-mqc-report-row-filter
    title: Report row
    layout: {x: 0, y: 0, w: 1, h: 3}
- title: Assembly
  subtitle: How contiguous is each assembly?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:puzzle-outline
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Assembly scope
    icon: mdi:filter-variant
    color: blue
    description: Keep assemblies inside an N50 or sequence-count band
  grid_sections:
  - name: Assemblies at a glance
    icon: mdi:counter
    color: blue
    description: Contiguity, size and composition across the assemblies
  - name: Contiguity
    icon: mdi:chart-scatter-plot
    color: blue
    description: Sequences against N50 of each assembly, with the record of the picked one
  - name: Length ladder
    icon: mdi:chart-line
    color: blue
    description: How much of each assembly sits in sequences above each length
  - name: Assembly tables
    icon: mdi:table
    color: gray
    description: QUAST statistics and the length ladder per assembly
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [QUAST](https://github.com/ablab/quast) measures each assembly without a reference: how many
      sequences, how long, and how much of it sits in long ones, so a chromosome-level assembly holds
      half its length in a few sequences and a draft spreads it over hundreds. Click a point to open
      the record of its genome. On the scatter, each point wears its genome's colour and the label
      names it; each ladder curve has a colour of its own.
    tag: gq-asm-intro
    index: asm-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: genomeqc
