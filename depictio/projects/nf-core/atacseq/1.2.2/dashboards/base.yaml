# ============================================================================
# Peaks
# ============================================================================
- title: Peaks
  subtitle: MACS2 broad peaks per merged library, their significance along the genome and where they land relative to genes
  tab_order: 3
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Peak filters
    icon: mdi:filter-variant
    color: indigo
    description: How significant and how wide a call has to be, and which feature class it sits in
  grid_sections:
  - name: Peaks at a glance
    icon: mdi:counter
    color: indigo
    description: How many calls the run made, how wide and how enriched they are
  - name: Significance along the genome
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Where the strongest calls sit, and how enrichment relates to significance
  - name: Where the peaks land
    icon: mdi:dna
    color: blue
    description: The genomic feature class of every call and its distance to the nearest start site
  - name: Peak tables
    icon: mdi:table
    color: violet
    description: The peak rows behind the panels
    collapsed: true
  components:
  - component_type: text
    tag: at-pk-intro
    section: Peaks at a glance
    title: What MACS2 called
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      This run used broad peak calling, so a call is a region rather than a
      summit. The cards below count them and summarise how wide, how enriched
      and how significant they are across the six libraries.
    workflow_tag: atacseq
    data_collection_tag: macs2_broad_peaks
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: at-pk-card-count
    index: at-pk-card-count
    section: Peaks at a glance
    workflow_tag: atacseq
    data_collection_tag: macs2_broad_peaks
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Peaks in view
    layout: {x: 0, y: 1, w: 2, h: 2}
  - component_type: card
    tag: at-pk-card-width
    index: at-pk-card-width
    section: Peaks at a glance
    workflow_tag: atacseq
    data_collection_tag: macs2_broad_peaks
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: width
    column_type: int64
    display: {icon_name: 'mdi:ruler', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Peak width
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: at-pk-card-fold
    index: at-pk-card-fold
    section: Peaks at a glance
    workflow_tag: atacseq
    data_collection_tag: macs2_broad_peaks
    aggregation: average
    column_name: fold_enrichment
    column_type: float64
    secondary_layout: histogram
    display: {icon_name: 'mdi:magnet', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Fold enrichment
    layout: {x: 4, y: 1, w: 2, h: 2}
  - component_type: card
    tag: at-pk-card-qvalue
    index: at-pk-card-qvalue
    section: Peaks at a glance
    workflow_tag: atacseq
    data_collection_tag: macs2_broad_peaks
    aggregation: max
    column_name: neg_log10_qvalue
    column_type: float64
    secondary_layout: threshold
    threshold_value: 10
    threshold_direction: min
    threshold_warn: 5
    display: {icon_name: 'mdi:check-decagram', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Strongest significance
    layout: {x: 6, y: 1, w: 2, h: 2}

  # ----------------------------------------------------- significance / genome
  - component_type: text
    tag: at-pk-manhattan-intro
    section: Significance along the genome
    title: Significance along the genome
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each point is a broad call at the centre of its region, height is the
      MACS2 q-value. Lasso a region on the scatter: the selection carries the
      peak id into the HOMER annotation table through the project links.
    workflow_tag: atacseq
    data_collection_tag: macs2_broad_peaks
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: at-pk-av-manhattan
    index: at-pk-av-manhattan
    section: Significance along the genome
    workflow_tag: atacseq
    data_collection_tag: macs2_broad_peaks
    viz_kind: manhattan
    config:
      viz_kind: manhattan
      chr_col: chr
      pos_col: midpoint
      score_col: neg_log10_qvalue
      feature_col: peak_id
      score_kind: "-log10(q)"
      color_by_columns: [sample]
      default_color_by: sample
      selection_enabled: true
      selection_column: peak_id
      top_n_labels: 10
    title: Peak significance along the genome
    description: Every broad call at its region centre; height is -log10 of the MACS2 q-value, colour is the library.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 7}
  - component_type: figure
    tag: at-pk-fig-scatter
    index: at-pk-fig-scatter
    section: Significance along the genome
    workflow_tag: atacseq
    data_collection_tag: macs2_broad_peaks
    mode: code
    visu_type: scatter
    code_content: |
      # enrichment against significance for the strongest calls in view; the
      # full frame is ~224k peaks, far more than a scatter can show
      df_modified = (
          df.sort("neg_log10_qvalue", descending=True)
          .head(2000)
          .with_columns(pl.col("width").clip(50, 5000).alias("peak_width"))
      )

      fig = px.scatter(
          df_modified.to_pandas(),
          x="fold_enrichment",
          y="neg_log10_qvalue",
          color="sample",
          size="peak_width",
          size_max=18,
          hover_name="peak_id",
          custom_data=["peak_id"],
          opacity=0.7,
      )
      fig.update_layout(
          xaxis_title="Fold enrichment over background",
          yaxis_title="-log10(q-value)",
          legend_title_text="Library",
          margin={"t": 24, "l": 64, "r": 16, "b": 48},
      )
    selection_enabled: true
    selection_column: peak_id
    title: Enrichment against significance
    description: The 2000 most significant calls in view; point size is the peak width. Lasso to select peaks.
    title_size: h3
    layout: {x: 0, y: 8, w: 4, h: 6}
  - component_type: figure
    tag: at-pk-fig-width
    section: Significance along the genome
    workflow_tag: atacseq
    data_collection_tag: macs2_broad_peaks
    visu_type: histogram
    dict_kwargs: {x: width, color: sample, nbins: 60}
    title: Peak width distribution
    description: How wide the calls are, per library. Broad calling gives wider regions than a narrow-peak run would.
    title_size: h3
    layout: {x: 4, y: 8, w: 4, h: 6}

  # -------------------------------------------------------------- annotation
  - component_type: text
    tag: at-pk-anno-intro
    section: Where the peaks land
    title: Peaks against gene structure
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      HOMER assigns every call to a genomic feature and to the nearest start
      site. Accessible chromatin is promoter-heavy, so a TSS-centred distance
      histogram is what a working ATAC library should look like.
    workflow_tag: atacseq
    data_collection_tag: homer_annotated_peaks
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: at-pk-card-anno
    index: at-pk-card-anno
    section: Where the peaks land
    workflow_tag: atacseq
    data_collection_tag: homer_annotated_peaks
    use: homer/annotated_peaks
    aggregation: count
    column_name: annotation_class
    column_type: object
    secondary_layout: donut
    breakdown_col: annotation_class
    display: {icon_name: 'mdi:chart-donut', icon_color: '#1E88E5', title_color: '#1E88E5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Feature classes
    layout: {x: 0, y: 1, w: 2, h: 2}
  - component_type: card
    tag: at-pk-card-genes
    index: at-pk-card-genes
    section: Where the peaks land
    workflow_tag: atacseq
    data_collection_tag: homer_annotated_peaks
    use: homer/annotated_peaks
    aggregation: nunique
    column_name: gene_name
    column_type: object
    secondary_layout: composition
    breakdown_col: annotation_class
    display: {icon_name: 'mdi:dna', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Genes reached
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: at-pk-card-tssdist
    index: at-pk-card-tssdist
    section: Where the peaks land
    workflow_tag: atacseq
    data_collection_tag: homer_annotated_peaks
    use: homer/annotated_peaks
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: distance_to_tss
    column_type: int64
    display: {icon_name: 'mdi:ruler', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Distance to TSS
    layout: {x: 4, y: 1, w: 2, h: 2}
  - component_type: card
    tag: at-pk-card-annopeaks
    index: at-pk-card-annopeaks
    section: Where the peaks land
    workflow_tag: atacseq
    data_collection_tag: homer_annotated_peaks
    use: homer/annotated_peaks
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: annotation_class
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Annotated peaks
    layout: {x: 6, y: 1, w: 2, h: 2}
  - component_type: figure
    tag: at-pk-fig-anno
    section: Where the peaks land
    workflow_tag: atacseq
    data_collection_tag: homer_annotated_peaks
    use: homer/annotated_peaks
    visu_type: bar
    dict_kwargs: {x: sample, color: annotation_class}
    title: Peak annotation per library
    description: How the calls of each library split across promoter-TSS, exon, intron, TTS and intergenic.
    title_size: h3
    layout: {x: 0, y: 3, w: 4, h: 6}
  - component_type: figure
    tag: at-pk-fig-tss
    index: at-pk-fig-tss
    section: Where the peaks land
    workflow_tag: atacseq
    data_collection_tag: homer_annotated_peaks
    mode: code
    visu_type: histogram
    code_content: |
      # distance to the nearest TSS, clipped to a 10 kb window: the raw column
      # runs to several hundred kb and would flatten the peak at zero
      window = 10_000
      df_modified = df.filter(
          pl.col("distance_to_tss").is_not_null()
          & (pl.col("distance_to_tss").abs() <= window)
      )

      fig = px.histogram(
          df_modified.to_pandas(),
          x="distance_to_tss",
          color="annotation_class",
          nbins=80,
          opacity=0.8,
      )
      fig.update_layout(
          barmode="overlay",
          xaxis_title="Distance to nearest TSS (bp)",
          yaxis_title="Peaks",
          legend_title_text="Feature class",
          margin={"t": 24, "l": 64, "r": 16, "b": 48},
      )
      fig.add_vline(x=0, line_dash="dot", line_color="grey")
    title: Distance to the nearest TSS
    description: Peaks within 10 kb of a start site, split by feature class. A spike at zero is promoter accessibility.
    title_size: h3
    layout: {x: 4, y: 3, w: 4, h: 6}

  # ------------------------------------------------------------- peak tables
  - component_type: text
    tag: at-pk-tables-intro
    section: Peak tables
    title: The peak rows
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The MACS2 calls and their HOMER annotation, keyed on the same peak id.
      Ticking a row in either table carries that peak into the other through the
      project links.
    workflow_tag: atacseq
    data_collection_tag: macs2_broad_peaks
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: table
    tag: at-pk-table-peaks
    section: Peak tables
    workflow_tag: atacseq
    data_collection_tag: macs2_broad_peaks
    row_selection_enabled: true
    row_selection_column: peak_id
    title: MACS2 broad peaks
    description: Coordinates, width, fold enrichment and significance of every call.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 5}
  - component_type: table
    tag: at-pk-table-anno
    section: Peak tables
    workflow_tag: atacseq
    data_collection_tag: homer_annotated_peaks
    use: homer/annotated_peaks
    row_selection_enabled: true
    row_selection_column: peak_id
    title: HOMER peak annotation
    description: Feature class, distance to the nearest start site and the gene each call belongs to.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 6, w: 8, h: 5}

  - component_type: interactive
    tag: at-pk-filter-qvalue
    index: at-pk-qvalue-range
    section: Peak filters
    group: Peak strength
    workflow_tag: atacseq
    data_collection_tag: macs2_broad_peaks
    interactive_component_type: RangeSlider
