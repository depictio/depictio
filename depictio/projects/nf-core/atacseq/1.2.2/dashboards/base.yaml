# ============================================================================
# Comparison
# ============================================================================
- title: Consensus
  subtitle: Which peaks do the libraries agree on?
  tab_group: Comparison
  tab_order: 7
  tab_icon: mdi:set-merge
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Consensus filters
    icon: mdi:filter-variant
    color: violet
    description: How well supported an interval has to be before it counts
  grid_sections:
  - name: Consensus at a glance
    icon: mdi:counter
    color: violet
    description: How many intervals the merged set holds, and how many libraries back them
  - name: Replicate agreement
    icon: mdi:set-merge
    color: violet
    description: Which combinations of libraries call the same interval
  - name: Signal at the strongest intervals
    icon: mdi:chart-box-outline
    color: violet
    description: Fold enrichment of the most strongly accessible intervals, clustered
    collapsed: true
  - name: Consensus tables
    icon: mdi:table
    color: gray
    description: The merged intervals, and the fold enrichment behind the heatmap
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      The per-library calls merged into one set of intervals. An interval every library
      calls is reproducible; one a single library calls is noise or specific to its group.
      The UpSet shows which libraries agree; the heatmap below it, folded, the signal
      at the strongest.
    tag: at-cons-intro
    index: cons-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: num_samples
    column_type: int64
    display:
      icon_name: mdi:account-group-outline
      custom_color: green
    section: Consensus filters
    group: Consensus
    tag: at-cons-filter-support
    index: cons-support-range
    title: Libraries per interval
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: num_peaks
    column_type: int64
    display:
      icon_name: mdi:layers-outline
      custom_color: orange
    section: Consensus filters
    group: Consensus
    tag: at-cons-filter-peaks
    index: cons-peaks-range
    title: Peaks merged
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_fc
    interactive_component_type: MultiSelect
    column_name: support
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: green
    section: Consensus filters
    group: Strongest intervals
    tag: at-cons-filter-fcsupport
    index: cons-fcsupport-filter
    title: Support
    layout: {x: 0, y: 6, w: 1, h: 3}
  # The breakdown is the chromosome: atacseq binds one consensus set (the
  # merged-library level), so `consensus_set` holds a single value.
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: chr
    display:
      icon_name: mdi:counter
      icon_color: violet
      caption: intervals, by chromosome
    section: Consensus at a glance
    tag: at-cons-card-intervals
    index: cons-card-intervals
    title: Consensus intervals
    description: Intervals of the merged peak set in view.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    aggregation: median
    column_name: num_samples
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:account-group-outline
      icon_color: indigo
      caption: median, with its spread
      decimals: 0
    section: Consensus at a glance
    tag: at-cons-card-support
    index: cons-card-support
    title: Libraries per interval
    description: How many libraries call a peak on each consensus interval.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    aggregation: sum
    column_name: num_peaks
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:layers-outline
      icon_color: teal
      caption: total; the bars, peaks per interval
    section: Consensus at a glance
    tag: at-cons-card-peaks
    index: cons-card-peaks
    title: Peaks merged
    description: Per-library peaks merged into the consensus intervals in view.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_fc
    use: macs2/consensus_fc
    aggregation: count
    column_name: support
    column_type: object
    secondary_layout: donut
    breakdown_col: support
    display:
      icon_name: mdi:chart-donut
      icon_color: orange
      caption: by libraries calling them
    section: Consensus at a glance
    tag: at-cons-card-strongest
    index: cons-card-strongest
    title: Strongest intervals
    description: The most strongly accessible intervals, split by how many libraries call them.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_upset
    config:
      # Library columns of the run, whatever the samples; the replicate-level
      # `.mRp.clN` set is left out.
      set_columns_pattern: '\.mLb\.clN$'
      color_intersections_by: degree
      show_set_sizes: true
      show_values: true
      sort_by: cardinality
      sort_order: descending
      min_size: 1
    section: Replicate agreement
    tag: at-cons-upset
    index: cons-upset
    title: Consensus peak overlap
    description: Intersections of the libraries calling each consensus interval, largest first.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_fc
    use: macs2/consensus_signal_heatmap
    config:
      value_columns_pattern: '\.mLb\.clN$'
      row_annotation_cols: [support]
      cluster_rows: true
      cluster_cols: true
      normalize: log1p
      colorscale: Viridis
    section: Signal at the strongest intervals
    tag: at-cons-heatmap
    index: cons-heatmap
    title: Consensus signal heatmap
    description: Log-scaled fold enrichment per library at the strongest intervals; a zero cell is a library that called no peak there.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    row_selection_enabled: true
    row_selection_column: peak_id
    section: Consensus tables
    tag: at-cons-table-boolean
    index: cons-table-boolean
    title: Consensus intervals
    description: Coordinates, how many peaks merged into the interval and which libraries called it.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_fc
    use: macs2/consensus_fc
    row_selection_enabled: true
    row_selection_column: peak_id
    section: Consensus tables
    tag: at-cons-table-fc
    index: cons-table-fc
    title: Consensus fold enrichment
    description: Per-library fold enrichment at the strongest intervals of the merged set.
    layout: {x: 0, y: 6, w: 8, h: 6}
- title: Differential accessibility
  subtitle: Which regions change accessibility between groups?
  tab_group: Comparison
  tab_order: 8
  tab_icon: mdi:scale-balance
  tab_icon_color: red
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Differential filters
    icon: mdi:filter-variant
    color: red
    description: Pick a contrast first, then how strong a change has to be
  grid_sections:
  - name: Calls at a glance
    icon: mdi:counter
    color: red
    description: Intervals tested, and the calls passing padj 0.05 and a two-fold change
  - name: Volcano and ranked effects
    icon: mdi:chart-scatter-plot
    color: red
    description: Effect size against significance, then the largest effects and the calls per contrast
  - name: Sample space
    icon: mdi:chart-box-outline
    color: red
    description: Where the libraries sit in the count matrix DESeq2 tested, before any interval
  - name: Differential tables
    icon: mdi:table
    color: gray
    description: The DESeq2 rows, the principal components and the distance matrix
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [DESeq2](https://bioconductor.org/packages/DESeq2) counts reads over the consensus
      intervals and tests each one between two groups of the design. Pick a single
      contrast on the left first: every number on this tab depends on it.
    tag: at-diff-intro
    index: diff-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    interactive_component_type: Select
    column_name: contrast
    column_type: object
    display:
      icon_name: mdi:compare-horizontal
      custom_color: grape
    section: Differential filters
    group: Comparison
    tag: at-diff-filter-contrast
    index: diff-contrast-filter
    title: Contrast
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    interactive_component_type: MultiSelect
    column_name: direction
    column_type: object
    display:
      icon_name: mdi:swap-vertical
      custom_color: pink
    section: Differential filters
    group: Comparison
    tag: at-diff-filter-direction
    index: diff-direction-filter
    title: Direction
    layout: {x: 0, y: 2, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: log2fc
    column_type: float64
    display:
      icon_name: mdi:arrow-expand-horizontal
      custom_color: orange
    section: Differential filters
    group: Effect
    tag: at-diff-filter-lfc
    index: diff-lfc-range
    title: log2 fold change
    layout: {x: 0, y: 4, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: neg_log10_padj
    column_type: float64
    display:
      icon_name: mdi:check-decagram
      custom_color: red
    section: Differential filters
    group: Effect
    tag: at-diff-filter-padj
    index: diff-padj-range
    title: Significance
    layout: {x: 0, y: 7, w: 1, h: 3}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: count
    column_name: gene_id
    column_type: object
    secondary_layout: composition
    breakdown_col: direction
    display:
      icon_name: mdi:counter
      icon_color: grape
      caption: tests, by outcome
    section: Calls at a glance
    tag: at-diff-card-tested
    index: diff-card-tested
    title: Intervals tested
    description: Consensus intervals DESeq2 tested, one test per interval and contrast.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: count
    column_name: gene_id
    column_type: object
    filter_expr: col('significant') == True
    secondary_layout: donut
    breakdown_col: direction
    display:
      icon_name: mdi:check-decagram
      icon_color: red
      caption: calls, by direction
    section: Calls at a glance
    tag: at-diff-card-significant
    index: diff-card-significant
    title: Significant calls
    description: Calls passing padj 0.05 and a two-fold change, one per interval and contrast.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: median
    column_name: log2fc
    column_type: float64
    filter_expr: col('significant') == True
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:arrow-expand-horizontal
      icon_color: orange
      caption: median log2 fold change of the calls
      decimals: 2
    section: Calls at a glance
    tag: at-diff-card-effect
    index: diff-card-effect
    title: Effect size
    description: The signed log2 fold change of the significant calls; the box shows both directions.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: max
    column_name: neg_log10_padj
    column_type: float64
    secondary_layout: threshold
    threshold_value: 1.3
    threshold_direction: min
    threshold_warn: 1
    display:
      icon_name: mdi:sigma
      icon_color: blue
      caption: strongest call; at or above 1.3, padj below 0.05
      decimals: 1
    section: Calls at a glance
    tag: at-diff-card-padj
    index: diff-card-padj
    title: Strongest significance
    description: The highest -log10 adjusted p-value among the intervals in view.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # One tile, three views of the same rows: the MA view reads log2_base_mean,
  # the QQ view the raw p-values.
  - component_type: advanced_viz
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    use: deseq2/volcano
    config:
      label_col: gene_id
      category_col: direction
      significance_threshold: 0.05
      effect_threshold: 1.0
      # gene_id holds interval ids here, which say nothing as point labels.
      show_labels: false
      avg_log_intensity_col: log2_base_mean
      log2_fold_change_col: log2fc
      fold_change_threshold: 1.0
      p_value_col: pvalue
      view: volcano
      views: [volcano, ma, qq]
    section: Volcano and ranked effects
    tag: at-diff-volcano
    index: diff-volcano
    title: Effect size against significance
    description: -log10(padj) against log2 fold change; the View switch reads the same rows as an MA or a QQ plot.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    use: deseq2/da_barplot
    config:
      significance_col: padj
      significance_threshold: 0.05
      top_n: 10
    section: Volcano and ranked effects
    tag: at-diff-dabar
    index: diff-dabar
    title: Largest effects
    description: The 10 intervals with the largest significant effect per contrast, signed by direction.
    layout: {x: 0, y: 6, w: 5, h: 5}
  - component_type: figure
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    visu_type: bar
    mode: code
    code_content: |-
      # Significant intervals per contrast and direction. The contrast ids carry
      # the merge-level suffix the pipeline stamps on every consensus file; the
      # rest breaks before 'vs' so the label fits a third of the row.
      d = df.filter(pl.col('significant')).with_columns(pl.col('contrast').str.replace(r'\.m(Lb|Rp)\.clN$', '').str.replace('vs', '<br>vs ', literal=True).alias('comparison'))
      d = d.group_by(['comparison', 'direction']).agg(pl.len().cast(pl.Int64).alias('intervals')).sort(['comparison', 'direction'])
      fig = px.bar(d.to_pandas(), x='intervals', y='comparison', color='direction', orientation='h', barmode='group', text='intervals', color_discrete_map=depictio_category_colors.get('direction') or {}, labels={'comparison': '', 'intervals': 'Significant intervals', 'direction': 'Direction'})
      fig.update_layout(margin=dict(t=10))
      fig.update_yaxes(automargin=True)
    section: Volcano and ranked effects
    tag: at-diff-counts
    index: diff-counts
    title: Calls per contrast
    description: Intervals passing padj 0.05 and a two-fold change in each contrast, by direction.
    layout: {x: 5, y: 6, w: 3, h: 5}
  - component_type: advanced_viz
    workflow_tag: atacseq
    data_collection_tag: deseq2_qc_pca
    use: deseq2/qc_pca_embedding
    config:
      point_size: 14
      marker_outline: true
      axis_prefix: PC
      legend_pos: right
      plot_style: grid
      selection_enabled: true
      selection_column: sample_id
    section: Sample space
    tag: at-diff-pca
    index: diff-pca
    title: Consensus count PCA
    description: The principal components the pipeline computed on the consensus counts, one point per library.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: atacseq
    data_collection_tag: deseq2_qc_sample_dists
    use: deseq2/qc_distance_heatmap
    config:
      cluster_rows: true
      cluster_cols: true
      cluster_method: ward
      normalize: none
      colorscale: Blues
    section: Sample space
    tag: at-diff-dists
    index: diff-dists
    title: Library distances
    description: Euclidean distance between every pair of libraries on the consensus counts, Ward-clustered.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: table
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    row_selection_enabled: true
    row_selection_column: gene_id
    section: Differential tables
    tag: at-diff-table-results
    index: diff-table-results
    title: DESeq2 differential accessibility
    description: One row per contrast and consensus interval, with the significance call and the MA abscissa.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: atacseq
    data_collection_tag: deseq2_qc_pca
    use: deseq2/qc_pca
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Differential tables
    tag: at-diff-table-pca
    index: diff-table-pca
    title: Principal components
    description: The two principal components of every library and the variance each one explains.
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: table
    workflow_tag: atacseq
    data_collection_tag: deseq2_qc_sample_dists
    use: deseq2/qc_sample_dists
    row_selection_enabled: true
    row_selection_column: sample
    section: Differential tables
    tag: at-diff-table-dists
    index: diff-table-dists
    title: Library distance matrix
    description: The square distance table behind the heatmap, one column per library of the run.
    layout: {x: 0, y: 12, w: 8, h: 6}
