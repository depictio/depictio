version: 1
# nf-core/atacseq 1.2.2 reference dashboard.
#
# Funnel: library QC (the reprocessed MultiQC report) -> the ATAC-specific
# quality ataqv measures -> the peaks each library yielded -> the consensus peak
# set across libraries -> differential accessibility between protocols. The
# sample design sheet is the hub: the filters in the left panel reach the
# MultiQC panels, the ataqv collections, the peak table, the peak QC summary and
# the HOMER annotation through the project links.
#
# The MultiQC report bound here was re-generated with MultiQC 1.35 from the
# run's raw tool outputs; the run itself published MultiQC 1.9, which writes no
# parquet. Anchors and section names are therefore the 1.35 ones, which is also
# why an ataqv section exists at all: the 1.9 report had no ataqv module.
main_dashboard:
  title: ATAC-seq Chromatin Accessibility
  subtitle: "nf-core/atacseq 1.2.2 megatest: six GM12878 libraries across three transposition protocols (FAST, OMNI, STD)"
  project_tag: ATAC-seq Chromatin Accessibility
  main_tab_name: Library QC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab through the project links
    persistent: true
    pin: top
  - name: QC thresholds
    icon: mdi:tune
    color: cyan
    description: Signal and yield floors on the per-library QC collections
    collapsed: true
    persistent: true
    pin: bottom
  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: What the six libraries yielded, and how clean they are
  - name: Read quality
    icon: mdi:chart-bell-curve
    color: blue
    description: FastQC and Trim Galore as MultiQC reports them
  - name: Alignment and library complexity
    icon: mdi:chart-bar
    color: indigo
    description: What survived alignment and filtering, insert sizes, duplication and library complexity
  - name: Accessibility signal
    icon: mdi:chart-line
    color: cyan
    description: How concentrated the reads are in the accessible fraction of the genome
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The sample design and the per-library QC rows, on every tab
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # ------------------------------------------------------------- at a glance
  - component_type: text
    tag: at-qc-intro
    section: Run at a glance
    title: An ATAC-seq run, from reads to accessible regions
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Four cards for the yield and the signal-to-noise of the run, then the
      MultiQC panels behind them: read quality, insert sizes and duplication,
      and how concentrated the reads are in accessible chromatin.
    workflow_tag: atacseq
    data_collection_tag: macs2_peak_summary
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: at-qc-card-peaks
    index: at-qc-card-peaks
    section: Run at a glance
    workflow_tag: atacseq
    data_collection_tag: macs2_peak_summary
    use: macs2/peak_summary
    aggregation: sum
    column_name: num_peaks
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Peaks called
    layout: {x: 0, y: 1, w: 2, h: 2}
  - component_type: card
    tag: at-qc-card-tss
    index: at-qc-card-tss
    section: Run at a glance
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    use: ataqv/metrics
    aggregation: average
    column_name: tss_enrichment
    column_type: float64
    secondary_layout: gauge
    coverage_max: 10
    display: {icon_name: 'mdi:target', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: TSS enrichment
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: at-qc-card-mito
    index: at-qc-card-mito
    section: Run at a glance
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    use: ataqv/metrics
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: mitochondrial_fraction
    column_type: float64
    display: {icon_name: 'mdi:bacteria-outline', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mitochondrial fraction
    layout: {x: 4, y: 1, w: 2, h: 2}
  - component_type: card
    tag: at-qc-card-inpeaks
    index: at-qc-card-inpeaks
    section: Run at a glance
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    use: ataqv/metrics
    aggregation: average
    column_name: hqaa_overlapping_peaks_percent
    column_type: float64
    secondary_layout: threshold
    threshold_value: 20
    threshold_direction: min
    threshold_warn: 10
    display: {icon_name: 'mdi:magnet', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Reads inside peaks
    layout: {x: 6, y: 1, w: 2, h: 2}

  # ------------------------------------------------------------ read quality
  - component_type: text
    tag: at-qc-reads-intro
    section: Read quality
    title: Raw and trimmed reads
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      FastQC on the raw and the trimmed libraries, plus what Trim Galore
      removed. Every library carries a technical-replicate suffix, so a sample
      appears here once per library and read.
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: at-qc-fastqc-counts
    section: Read quality
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Counts
    use: multiqc/fastqc
    title: Sequence counts
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: at-qc-fastqc-quality
    section: Read quality
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    use: multiqc/fastqc
    title: Per-base sequence quality
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: at-qc-cutadapt
    section: Read quality
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    selected_module: cutadapt
    selected_plot: Filtered Reads
    use: multiqc/cutadapt
    title: Reads kept after trimming
    title_size: sm
    title_align: left
    layout: {x: 0, y: 6, w: 8, h: 4}

  # ------------------------------------------- alignment and library complexity
  - component_type: text
    tag: at-qc-align-intro
    section: Alignment and library complexity
    title: Insert sizes, duplication and complexity
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      samtools reports every merged library twice, before filtering (mLb.mkD) and
      after it (mLb.clN), so the gap between the two series is what ATAC filtering
      removed. The Picard histogram is the nucleosome ladder, and duplication and
      the preseq curve say how much of the library was distinct.
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: at-qc-picard-insert
    section: Alignment and library complexity
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    selected_module: picard
    selected_plot: Insert Size
    use: multiqc/picard
    title: Insert size distribution
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: at-qc-picard-dups
    section: Alignment and library complexity
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    selected_module: picard
    selected_plot: Mark Duplicates
    use: multiqc/picard
    title: Duplicate reads
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: at-qc-samtools-mapped
    section: Alignment and library complexity
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    selected_module: samtools
    selected_plot: Percent mapped
    use: multiqc/samtools
    title: Reads mapped, before and after filtering
    title_size: sm
    title_align: left
    layout: {x: 0, y: 6, w: 4, h: 5}
  - component_type: multiqc
    tag: at-qc-samtools-contig
    section: Alignment and library complexity
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    selected_module: samtools
    selected_plot: Mapped reads per contig
    use: multiqc/samtools
    title: Mapped reads per contig
    title_size: sm
    title_align: left
    layout: {x: 4, y: 6, w: 4, h: 5}
  - component_type: multiqc
    tag: at-qc-preseq
    section: Alignment and library complexity
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    selected_module: preseq
    selected_plot: Complexity curve (molecule count)
    use: multiqc/preseq
    title: Library complexity curve
    title_size: sm
    title_align: left
    layout: {x: 0, y: 11, w: 8, h: 5}

  # ------------------------------------------------------ accessibility signal
  - component_type: text
    tag: at-qc-signal-intro
    section: Accessibility signal
    title: Is the signal where it should be?
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The deepTools fingerprint says how concentrated the reads are; the FRiP
      score and peak count say how much of that concentration MACS2 turned into
      calls, and featureCounts how many reads the consensus set carries.
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: at-qc-fingerprint
    section: Accessibility signal
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    selected_module: deepTools
    selected_plot: Fingerprint plot
    use: multiqc/deeptools
    title: deepTools fingerprint
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: at-qc-frip
    section: Accessibility signal
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    selected_module: mlib_frip_score
    selected_plot: mlib_frip_score-section
    title: FRiP score
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: at-qc-peakcount
    section: Accessibility signal
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    selected_module: mlib_peak_count
    selected_plot: mlib_peak_count-section
    title: Peaks per library
    title_size: sm
    title_align: left
    layout: {x: 0, y: 6, w: 4, h: 5}
  - component_type: multiqc
    tag: at-qc-featurecounts
    section: Accessibility signal
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    selected_module: featurecounts
    selected_plot: Assignments
    use: multiqc/featurecounts
    title: Reads assigned to consensus peaks
    title_size: sm
    title_align: left
    layout: {x: 4, y: 6, w: 4, h: 5}

  # -------------------------------------------------------- reference tables
  - component_type: text
    tag: at-ref-intro
    section: Reference tables
    title: The rows behind every tab
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Which protocol and replicate each library belongs to, and the peak count,
      FRiP score and peak-metric spreads per library. Filters picked in the left
      panel narrow both tables.
    workflow_tag: atacseq
    data_collection_tag: sample_design
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: table
    tag: at-ref-table-design
    section: Reference tables
    workflow_tag: atacseq
    data_collection_tag: sample_design
    row_selection_enabled: false
    title: Sample design
    description: One row per ATAC sample, with its protocol group, replicate and merged-library name.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 1, w: 4, h: 4}
  - component_type: table
    tag: at-ref-table-summary
    section: Reference tables
    workflow_tag: atacseq
    data_collection_tag: macs2_peak_summary
    use: macs2/peak_summary
    row_selection_enabled: false
    title: Peak QC summary
    description: Peak count, FRiP score and the width, enrichment and significance spreads per library.
    title_size: h3
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 4}

  # -------------------------------------------------------------- left panel
  - component_type: interactive
    tag: at-filter-sample
    index: at-sample-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: atacseq
    data_collection_tag: sample_design
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:test-tube'}
    placement: left
    title: ATAC sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: at-filter-group
    index: at-group-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: atacseq
    data_collection_tag: sample_design
    interactive_component_type: MultiSelect
    column_name: group
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:dna'}
    placement: left
    title: Transposition protocol
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: at-filter-tss
    index: at-tss-range
    section: QC thresholds
    group: Library quality
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    interactive_component_type: RangeSlider
    column_name: tss_enrichment
    column_type: float64
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:target'}
    placement: left
    title: TSS enrichment
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: at-filter-frip
    index: at-frip-range
    section: QC thresholds
    group: Library quality
    workflow_tag: atacseq
    data_collection_tag: macs2_peak_summary
    interactive_component_type: RangeSlider
    column_name: frip_score
    column_type: float64
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:magnet'}
    placement: left
    title: FRiP score
    layout: {x: 0, y: 3, w: 1, h: 3}

tabs:
# ============================================================================
# ATAC signal
# ============================================================================
- title: ATAC signal
  subtitle: The ATAC-specific quality ataqv measures, which MultiQC 1.9 never reported and 1.35 only partly renders
  tab_order: 2
  tab_icon: mdi:waves
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Fragment windows
    icon: mdi:ruler
    color: cyan
    description: Which part of the fragment ladder and which reference sequences to read
  grid_sections:
  - name: Library quality at a glance
    icon: mdi:counter
    color: cyan
    description: The four ataqv numbers a library is accepted or rejected on
  - name: Signal at transcription start sites
    icon: mdi:chart-line
    color: teal
    description: The canonical ATAC enrichment curve, and where each library sits on it
  - name: Fragment length ladder
    icon: mdi:ruler
    color: blue
    description: Whether transposition produced a nucleosome ladder at all
  - name: Read distribution
    icon: mdi:chart-bar
    color: indigo
    description: How each library's reads are spread over the reference sequences
  - name: ATAC quality tables
    icon: mdi:table
    color: violet
    description: The ataqv rows behind the panels
    collapsed: true
  components:
  - component_type: text
    tag: at-sig-intro
    section: Library quality at a glance
    title: What ataqv measures
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      ataqv reads the filtered alignment against the peak calls and a TSS
      annotation. Its numbers are the ones an ATAC library is judged by, and
      none of them reach a dashboard through the general MultiQC tables.
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: at-sig-card-peaks
    index: at-sig-card-peaks
    section: Library quality at a glance
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    use: ataqv/metrics
    aggregation: sum
    column_name: total_peaks
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Peaks ataqv scored
    layout: {x: 0, y: 1, w: 2, h: 2}
  - component_type: card
    tag: at-sig-card-dups
    index: at-sig-card-dups
    section: Library quality at a glance
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    use: ataqv/metrics
    aggregation: average
    column_name: duplicate_fraction
    column_type: float64
    secondary_layout: histogram
    display: {icon_name: 'mdi:relation-many-to-many', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Duplicate fraction
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: at-sig-card-fraglen
    index: at-sig-card-fraglen
    section: Library quality at a glance
    workflow_tag: atacseq
    data_collection_tag: ataqv_fragment_length
    use: ataqv/fragment_length
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: fragment_length
    column_type: int64
    display: {icon_name: 'mdi:ruler', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Fragment length
    layout: {x: 4, y: 1, w: 2, h: 2}
  - component_type: card
    tag: at-sig-card-class
    index: at-sig-card-class
    section: Library quality at a glance
    workflow_tag: atacseq
    data_collection_tag: ataqv_fragment_length
    use: ataqv/fragment_length
    aggregation: count
    column_name: fragment_class
    column_type: object
    secondary_layout: donut
    breakdown_col: fragment_class
    display: {icon_name: 'mdi:chart-donut', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Fragment windows
    layout: {x: 6, y: 1, w: 2, h: 2}

  # ------------------------------------------------------------ TSS profile
  - component_type: text
    tag: at-sig-tss-intro
    section: Signal at transcription start sites
    title: The curve behind the TSS enrichment score
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Aggregate coverage in a 2 kb window centred on every start site. The
      height of the central spike over the flanks is the enrichment score; the
      scatter places each library on signal against specificity.
    workflow_tag: atacseq
    data_collection_tag: ataqv_tss_coverage
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    tag: at-sig-fig-tss
    index: at-sig-fig-tss
    section: Signal at transcription start sites
    workflow_tag: atacseq
    data_collection_tag: ataqv_tss_coverage
    mode: code
    visu_type: line
    code_content: |
      # the profile is symmetric about the start site; 0 is the TSS itself
      df_modified = df.sort(["sample", "position"])

      fig = px.line(
          df_modified.to_pandas(),
          x="position",
          y="coverage",
          color="sample",
      )
      fig.add_vline(x=0, line_dash="dot", line_color="grey")
      fig.update_layout(
          xaxis_title="Distance from transcription start site (bp)",
          yaxis_title="Aggregate coverage",
          legend_title_text="Library",
          margin={"t": 24, "l": 64, "r": 16, "b": 48},
      )
    title: Coverage around transcription start sites
    description: One curve per library. A sharp central spike is a well transposed library; a flat line is not.
    title_size: h3
    layout: {x: 0, y: 1, w: 4, h: 7}
  - component_type: figure
    tag: at-sig-fig-quality
    index: at-sig-fig-quality
    section: Signal at transcription start sites
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    mode: code
    visu_type: scatter
    code_content: |
      # signal (TSS enrichment) against specificity (HQAA inside peaks); point
      # size is how many peaks the library yielded
      df_modified = df.with_columns(
          pl.col("total_peaks").cast(pl.Float64).alias("peak_count")
      )

      fig = px.scatter(
          df_modified.to_pandas(),
          x="tss_enrichment",
          y="hqaa_overlapping_peaks_percent",
          color="sample",
          size="peak_count",
          size_max=32,
          hover_name="sample",
          custom_data=["sample"],
      )
      fig.update_layout(
          xaxis_title="TSS enrichment",
          yaxis_title="Percent of HQAA inside peaks",
          legend_title_text="Library",
          margin={"t": 24, "l": 64, "r": 16, "b": 48},
      )
    selection_enabled: true
    selection_column: sample
    title: Signal against specificity
    description: Each library at its TSS enrichment and share of reads inside peaks; point size is the peak count. Click to select libraries.
    title_size: h3
    layout: {x: 4, y: 1, w: 4, h: 7}

  # -------------------------------------------------------- fragment ladder
  - component_type: text
    tag: at-sig-frag-intro
    section: Fragment length ladder
    title: Nucleosome ladder
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A good ATAC library shows a sub-nucleosomal peak below 100 bp followed by
      a decaying nucleosome ladder. The shaded bands are the windows ataqv
      counts its sub-nucleosomal and mononucleosomal reads in.
    workflow_tag: atacseq
    data_collection_tag: ataqv_fragment_length
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    tag: at-sig-fig-ladder
    index: at-sig-fig-ladder
    section: Fragment length ladder
    workflow_tag: atacseq
    data_collection_tag: ataqv_fragment_length
    mode: code
    visu_type: line
    code_content: |
      # the informative part of the ladder; the histogram runs to 1000 bp but
      # the tail beyond ~800 bp is empty for every library
      df_modified = (
          df.filter(pl.col("fragment_length") <= 800)
          .sort(["sample", "fragment_length"])
      )

      fig = px.line(
          df_modified.to_pandas(),
          x="fragment_length",
          y="fraction_of_all_reads",
          color="sample",
      )
      for start, end, label in ((0, 100, "sub-nucleosomal"), (150, 324, "mononucleosomal")):
          fig.add_vrect(
              x0=start,
              x1=end,
              fillcolor="grey",
              opacity=0.10,
              line_width=0,
              annotation_text=label,
              annotation_position="top left",
          )
      fig.update_layout(
