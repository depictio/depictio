- title: ATAC quality
  subtitle: Did transposition work, library by library?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:target
  tab_icon_color: lime
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: ATAC quality filters
    icon: mdi:filter-variant
    color: lime
    description: Which part of the fragment ladder and which reference sequences to read
  grid_sections:
  - name: Library quality at a glance
    icon: mdi:counter
    color: lime
    description: The ataqv numbers a library is accepted or rejected on
  - name: Signal at start sites
    icon: mdi:chart-line
    color: lime
    description: The coverage spike at start sites, and each library's signal against specificity
  - name: Fragment ladder
    icon: mdi:ruler
    color: lime
    description: Whether transposition produced a nucleosome ladder, library by library
  - name: Read distribution
    icon: mdi:chart-bar
    color: lime
    description: How each library's reads spread over the reference sequences
  - name: ATAC quality table
    icon: mdi:table
    color: gray
    description: Every ataqv metric for every library
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [ataqv](https://github.com/ParkerLab/ataqv) reads each filtered alignment against
      its peaks and the start sites of the genes; the cards are the numbers a library is
      accepted or rejected on. A good library shows a sharp spike of coverage at start
      sites and a nucleosome ladder in its fragment lengths. The matrix at the bottom
      spots a reference sequence carrying an outsized share of the reads.
    tag: at-aq-intro
    index: aq-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: ataqv_fragment_length
    interactive_component_type: MultiSelect
    column_name: fragment_class
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: grape
    section: ATAC quality filters
    group: Fragments
    tag: at-aq-filter-class
    index: aq-class-filter
    title: Fragment class
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: ataqv_fragment_length
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: fragment_length
    column_type: int64
    display:
      icon_name: mdi:ruler
      custom_color: orange
    section: ATAC quality filters
    group: Fragments
    tag: at-aq-filter-length
    index: aq-length-range
    title: Fragment length
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: ataqv_chromosome_counts
    interactive_component_type: MultiSelect
    column_name: chromosome
    column_type: object
    display:
      icon_name: mdi:chart-timeline-variant
      custom_color: indigo
    section: ATAC quality filters
    group: Reference sequences
    tag: at-aq-filter-chrom
    index: aq-chrom-filter
    title: Reference sequence
    layout: {x: 0, y: 5, w: 1, h: 3}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    use: ataqv/metrics
    aggregation: median
    column_name: tss_enrichment
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:target
      icon_color: lime
      caption: median, with its spread
      decimals: 1
    section: Library quality at a glance
    tag: at-aq-card-tss
    index: aq-card-tss
    title: TSS enrichment
    description: Coverage at start sites over the flanking background, the headline ATAC quality score.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    use: ataqv/metrics
    aggregation: min
    column_name: hqaa_overlapping_peaks_percent
    column_type: float64
    secondary_layout: threshold
    threshold_value: 20
    threshold_direction: min
    threshold_warn: 10
    display:
      icon_name: mdi:magnet
      icon_color: orange
      caption: lowest library; 20% is the usual floor
      decimals: 1
    section: Library quality at a glance
    tag: at-aq-card-inpeaks
    index: aq-card-inpeaks
    title: Reads in peaks (%)
    description: The lowest share of usable reads inside peaks among the libraries in view.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    use: ataqv/metrics
    aggregation: median
    column_name: mitochondrial_fraction
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:bacteria-outline
      icon_color: cyan
      caption: median, with its spread
      format: percent
    section: Library quality at a glance
    tag: at-aq-card-mito
    index: aq-card-mito
    title: Mitochondrial fraction
    description: Median share of reads on the mitochondrial contig, the classic ATAC waste.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    use: ataqv/metrics
    aggregation: median
    column_name: duplicate_fraction
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:content-duplicate
      icon_color: grape
      caption: median, with its distribution
      format: percent
    section: Library quality at a glance
    tag: at-aq-card-dups
    index: aq-card-dups
    title: Duplicate fraction
    description: Median share of duplicate reads per library.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: atacseq
    data_collection_tag: ataqv_tss_coverage
    use: ataqv/tss_coverage
    visu_type: line
    mode: code
    code_content: |-
      # Aggregate coverage around every start site, one curve per library: Analysis
      # mode's groups colour the curves when it has some, line_group keeps one each.
      d = df.sort(['sample', 'position'])
      color_col = depictio_group_by[0] if depictio_group_by and depictio_group_by[0] in d.columns else 'sample'
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get(color_col) or {}
      fig = px.line(d.to_pandas(), x='position', y='coverage', color=color_col, line_group='sample', color_discrete_map=colors, hover_name='sample', labels={'position': 'Distance from the start site (bp)', 'coverage': 'Aggregate coverage', color_col: ''})
      fig.add_vline(x=0, line_dash='dot', line_color='grey')
      fig.update_layout(margin=dict(t=10))
    section: Signal at start sites
    tag: at-aq-tss-coverage
    index: aq-tss-coverage
    title: Coverage around start sites
    description: One curve per library. A sharp central spike is a well transposed library; a flat line is not.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    use: ataqv/metrics
    visu_type: scatter
    mode: code
    code_content: |-
      # Signal (TSS enrichment) against specificity (usable reads inside peaks); point
      # size is the peak count. custom_data stays on the library, what a lasso returns.
      d = df.with_columns(pl.col('total_peaks').cast(pl.Float64).alias('peak_count'))
      color_col = depictio_group_by[0] if depictio_group_by and depictio_group_by[0] in d.columns else 'sample'
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get(color_col) or {}
      fig = px.scatter(d.to_pandas(), x='tss_enrichment', y='hqaa_overlapping_peaks_percent', color=color_col, color_discrete_map=colors, size='peak_count', size_max=32, hover_name='sample', custom_data=['sample'], labels={'tss_enrichment': 'TSS enrichment', 'hqaa_overlapping_peaks_percent': 'Usable reads in peaks (%)', 'peak_count': 'Peaks', color_col: ''})
      fig.update_layout(margin=dict(t=10))
    selection_enabled: true
    selection_column: sample
    section: Signal at start sites
    tag: at-aq-quality-scatter
    index: aq-quality-scatter
    title: Signal against specificity
    description: Each library at its TSS enrichment and share of reads inside peaks; point size is the peak count. Lasso to select libraries.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    use: ataqv/metrics
    aggregation: median
    column_name: median_fragment_length
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: blue
      caption: median bp, with its spread
      decimals: 0
    section: Fragment ladder
    tag: at-aq-card-fraglen
    index: aq-card-fraglen
    title: Fragment length
    description: Median fragment length of the libraries in view.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: ataqv_fragment_length
    use: ataqv/fragment_length
    aggregation: sum
    column_name: read_count
    column_type: int64
    secondary_layout: donut
    breakdown_col: fragment_class
    display:
      icon_name: mdi:chart-donut
      icon_color: violet
      caption: reads, by nucleosome window
    section: Fragment ladder
    tag: at-aq-card-windows
    index: aq-card-windows
    title: Reads by fragment window
    description: Reads in the sub-nucleosomal, transitional, mononucleosomal and multi-nucleosomal windows.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    use: ataqv/metrics
    aggregation: median
    column_name: short_mononucleosomal_ratio
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:scale-balance
      icon_color: pink
      caption: median, with its distribution
      decimals: 2
    section: Fragment ladder
    tag: at-aq-card-shortmono
    index: aq-card-shortmono
    title: Sub- to mononucleosomal
    description: Median ratio of sub-nucleosomal to mononucleosomal usable reads.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    use: ataqv/metrics
    aggregation: median
    column_name: properly_paired_fraction
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:vector-link
      icon_color: teal
      caption: median, with its spread
      format: percent
    section: Fragment ladder
    tag: at-aq-card-paired
    index: aq-card-paired
    title: Properly paired
    description: Median share of reads mapped as proper pairs.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: atacseq
    data_collection_tag: ataqv_fragment_length
    use: ataqv/fragment_length
    visu_type: line
    mode: code
    code_content: |-
      # The informative part of the ladder: the histogram runs to 1000 bp, but the
      # tail past 800 bp is empty. One curve per library, the ataqv windows shaded
      # and labelled short enough to fit inside them.
      d = df.filter(pl.col('fragment_length') <= 800).sort(['sample', 'fragment_length'])
      color_col = depictio_group_by[0] if depictio_group_by and depictio_group_by[0] in d.columns else 'sample'
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get(color_col) or {}
      fig = px.line(d.to_pandas(), x='fragment_length', y='fraction_of_all_reads', color=color_col, line_group='sample', color_discrete_map=colors, hover_name='sample', labels={'fragment_length': 'Fragment length (bp)', 'fraction_of_all_reads': 'Fraction of all reads', color_col: ''})
      for start, end, label in ((0, 100, 'NFR'), (150, 324, 'mono-nucleosome')):
          fig.add_vrect(x0=start, x1=end, fillcolor='grey', opacity=0.10, line_width=0, annotation_text=label, annotation_position='top left')
      fig.update_layout(margin=dict(t=10))
    section: Fragment ladder
    tag: at-aq-ladder
    index: aq-ladder
    title: Fragment length distribution
    description: Fraction of reads at each fragment length, per library, from 0 to 800 bp; shaded, the nucleosome-free (NFR) and mono-nucleosome windows.
    layout: {x: 0, y: 2, w: 5, h: 4}
  - component_type: figure
    workflow_tag: atacseq
    data_collection_tag: ataqv_fragment_length
    use: ataqv/fragment_length
    visu_type: bar
    dict_kwargs:
      x: sample
      y: read_count
      color: fragment_class
      labels: {sample: '', read_count: Reads, fragment_class: Fragment class}
    section: Fragment ladder
    tag: at-aq-class-bar
    index: aq-class-bar
    title: Reads per fragment class
    description: How each library splits across the four nucleosome windows.
    layout: {x: 5, y: 2, w: 3, h: 4}
  - component_type: advanced_viz
    workflow_tag: atacseq
    data_collection_tag: ataqv_chromosome_counts
    use: ataqv/read_distribution
    config:
      colour_scale: Viridis
      max_dot_size: 26
      min_dot_size: 3
      gene_sort: name
      cluster_sort: name
      max_genes: 30
      marker_outline: true
    section: Read distribution
    tag: at-aq-read-distribution
    index: aq-read-distribution
    title: Read distribution matrix
    description: Every library against every reference sequence ataqv counted; colour is log10 read count, size the share of the library.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    use: ataqv/metrics
    row_selection_enabled: true
    row_selection_column: sample
    section: ATAC quality table
    tag: at-aq-table
    index: aq-table-metrics
    title: ATAC quality metrics
    description: One row per library, with TSS enrichment, usable-read and duplicate fractions, mitochondrial share and peak statistics.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Signal
  subtitle: How enriched and how complex is each library?
  tab_group: Data & QC
  tab_order: 3
  tab_icon: mdi:waves
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Signal filters
    icon: mdi:filter-variant
    color: cyan
    description: Narrows the libraries by coverage concentration, and the curves by depth
  grid_sections:
  - name: Signal at a glance
    icon: mdi:counter
    color: cyan
    description: The deepTools numbers a library's signal is judged on
  - name: Coverage concentration
    icon: mdi:chart-scatter-plot
    color: cyan
    description: How far each library's coverage departs from a uniform library of its depth
  - name: Complexity and metagene
    icon: mdi:chart-line
    color: cyan
    description: Distinct fragments left at deeper sequencing, and the mean signal along a gene
  components:
  - component_type: text
    order: 1
    body: >
      The tables [deepTools](https://deeptools.readthedocs.io) and
      [preseq](https://github.com/smithlabcode/preseq) write beside the curves MultiQC
      draws. The fingerprint metrics say how concentrated each library's coverage is
      against a uniform library of the same depth, the complexity curve whether
      sequencing deeper would still find new fragments. The metagene profile shows where
      the signal sits along a gene.
    tag: at-sig-intro
    index: sig-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: deeptools_fingerprint_metrics
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: auc_ratio
    column_type: float64
    display:
      icon_name: mdi:chart-areaspline
      custom_color: cyan
    section: Signal filters
    group: Signal strength
    tag: at-sig-filter-auc
    index: sig-auc-range
    title: Coverage concentration
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: preseq_complexity_curve
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: total_reads
    column_type: float64
    display:
      icon_name: mdi:ruler
      custom_color: blue
    section: Signal filters
    group: Signal strength
    tag: at-sig-filter-depth
    index: sig-depth-range
    title: Extrapolated depth
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: deeptools_fingerprint_metrics
    use: deeptools/fingerprint_metrics
    aggregation: median
    column_name: auc_ratio
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-areaspline
      icon_color: cyan
      caption: median, with its spread
      decimals: 2
    section: Signal at a glance
    tag: at-sig-card-auc
    index: sig-card-auc
    title: Coverage concentration
    description: Area under the fingerprint curve over that of a uniform library; 1 is no concentration at all.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: deeptools_fingerprint_metrics
    use: deeptools/fingerprint_metrics
    aggregation: median
    column_name: synthetic_js_distance
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:magnet
      icon_color: indigo
      caption: median, with its distribution
      decimals: 2
    section: Signal at a glance
    tag: at-sig-card-jsd
    index: sig-card-jsd
    title: Divergence from uniform
    description: Median Jensen-Shannon distance between a library's coverage and a uniform library of its depth.
    layout: {x: 2, y: 0, w: 2, h: 2}
  # preseq's curve ends at a billion reads for every library (the recipe clips
  # there), so that depth compares the libraries like for like.
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: preseq_complexity_curve
    use: preseq/complexity_curve
    aggregation: median
    column_name: expected_distinct
    column_type: float64
    filter_expr: col('total_reads') == 1000000000
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:fingerprint
      icon_color: orange
      caption: median at 1 billion reads, with its spread
      decimals: 0
    section: Signal at a glance
    tag: at-sig-card-distinct
    index: sig-card-distinct
    title: Distinct fragments
    description: Distinct fragments preseq expects a library to yield at a billion reads; a low value is a library that sequencing deeper will not save.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: deeptools_plot_profile
    use: deeptools/plot_profile
    aggregation: median
    column_name: signal
    column_type: float64
    filter_expr: col('bin_label') == 'TSS'
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-line
      icon_color: teal
      caption: median at the start site, with its distribution
      decimals: 2
    section: Signal at a glance
    tag: at-sig-card-signal
    index: sig-card-signal
    title: Signal at the start site
    description: Mean metagene signal of each library in the start-site bin, where an ATAC library peaks.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: atacseq
    data_collection_tag: deeptools_fingerprint_metrics
    use: deeptools/fingerprint_scatter
    config:
      x_title: Area under the observed coverage curve
      y_title: Divergence from a uniform library
      marker_size: 12
      opacity: 0.85
      marker_outline: true
      # The legend names the libraries; point labels piled up on the replicates.
      top_n_labels: 0
      color_col: sample
      legend_pos: right
      selection_enabled: true
      selection_column: sample
    section: Coverage concentration
    tag: at-sig-fingerprint
    index: sig-fingerprint
    title: Coverage concentration per library
    description: plotFingerprint's own metrics, enrichment against divergence from a uniform library. Click a point to select the library.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: atacseq
    data_collection_tag: preseq_complexity_curve
    use: preseq/complexity_ribbon
    config:
      log_x: true
      band_opacity: 0.18
      line_width: 2
      x_title: Sequencing depth (reads)
      y_title: Expected distinct fragments
      legend_pos: right
      selection_enabled: true
      selection_column: sample
    section: Complexity and metagene
    tag: at-sig-complexity
    index: sig-complexity
    title: Library complexity
    description: One curve per library, extrapolated by preseq; the band is the 95% interval on that extrapolation.
