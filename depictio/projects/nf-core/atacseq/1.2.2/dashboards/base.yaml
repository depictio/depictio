    description: Distinct genes named as the nearest gene of a call on the region.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Default region: chr6:26.0-26.3 Mb, a dense histone gene cluster that every
  # library of the reference run calls peaks on, so no track opens empty.
  - component_type: advanced_viz
    workflow_tag: atacseq
    data_collection_tag: macs2_broad_peaks
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      chr_col: chr
      pos_col: start
      end_col: end
      score_col: neg_log10_qvalue
      feature_col: peak_id
      sample_col: sample
      mark: bar
      facet_by_sample: true
      max_facets: 6
      score_title: -log10(q-value)
