# ============================================================================
# Consensus
# ============================================================================
- title: Consensus
  subtitle: The merged peak set across all six libraries, which of them agree on an interval and how strong the signal is there
  tab_order: 4
  tab_icon: mdi:set-merge
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Consensus scope
    icon: mdi:filter-variant
    color: teal
    description: How well supported an interval has to be before it counts
  grid_sections:
  - name: Consensus at a glance
    icon: mdi:counter
    color: teal
    description: How many intervals the merged set holds, and how many libraries back them
  - name: Replicate agreement
    icon: mdi:set-merge
    color: teal
    description: Which combinations of libraries call the same interval
  - name: Signal at the strongest intervals
    icon: mdi:chart-box-outline
    color: blue
    description: Fold enrichment of the most strongly accessible intervals, clustered
  - name: Consensus tables
    icon: mdi:table
    color: violet
    description: The consensus rows behind the panels
    collapsed: true
  components:
  - component_type: text
    tag: at-cons-intro
    section: Consensus at a glance
    title: One peak set for the whole run
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The per-library calls are merged into consensus intervals. An interval
      called by every library is reproducible accessibility; one called by a
      single library is usually noise or protocol-specific.
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: at-cons-card-intervals
    index: at-cons-card-intervals
    section: Consensus at a glance
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: consensus_set
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Consensus intervals
    layout: {x: 0, y: 1, w: 2, h: 2}
  - component_type: card
    tag: at-cons-card-support
    index: at-cons-card-support
    section: Consensus at a glance
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: num_samples
    column_type: int64
    display: {icon_name: 'mdi:account-group-outline', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Libraries per interval
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: at-cons-card-peaks
    index: at-cons-card-peaks
    section: Consensus at a glance
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    aggregation: sum
    column_name: num_peaks
    column_type: int64
    secondary_layout: histogram
    display: {icon_name: 'mdi:chart-bar', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Peaks merged
    layout: {x: 4, y: 1, w: 2, h: 2}
  - component_type: card
    tag: at-cons-card-support-donut
    index: at-cons-card-support-donut
    section: Consensus at a glance
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_fc
    use: macs2/consensus_fc
    aggregation: count
    column_name: support
    column_type: object
    secondary_layout: donut
    breakdown_col: support
    display: {icon_name: 'mdi:chart-donut', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Support of the strongest
    layout: {x: 6, y: 1, w: 2, h: 2}

  # ------------------------------------------------------- replicate agreement
  - component_type: text
    tag: at-cons-upset-intro
    section: Replicate agreement
    title: Which libraries agree
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each bar is one combination of libraries calling the same interval. Bars
      that pair the two replicates of a protocol are reproducibility; bars that
      pair protocols are accessibility every protocol recovers.
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: at-cons-av-upset
    index: at-cons-av-upset
    section: Replicate agreement
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_upset
    config:
      set_columns:
        - GM12878_FAST_R1.mLb.clN
        - GM12878_FAST_R2.mLb.clN
        - GM12878_OMNI_R1.mLb.clN
        - GM12878_OMNI_R2.mLb.clN
        - GM12878_STD_R1.mLb.clN
        - GM12878_STD_R2.mLb.clN
      color_intersections_by: degree
      show_set_sizes: true
      show_values: true
      sort_by: cardinality
      sort_order: descending
      min_size: 1
    title: Consensus peak overlap
    description: Intersections of the libraries calling each consensus interval, largest first.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 7}

  - component_type: text
    tag: at-cons-heatmap-intro
    section: Signal at the strongest intervals
    title: How accessible the strongest intervals are
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Fold enrichment of the most strongly accessible consensus intervals. A
      cell is zero where that library called no peak, so protocol-specific
      accessibility reads as a block rather than as scattered gaps.
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_fc
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: at-cons-av-heatmap
    index: at-cons-av-heatmap
    section: Signal at the strongest intervals
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_fc
    use: macs2/consensus_signal_heatmap
    config:
      value_columns:
        - GM12878_FAST_R1.mLb.clN
        - GM12878_FAST_R2.mLb.clN
        - GM12878_OMNI_R1.mLb.clN
        - GM12878_OMNI_R2.mLb.clN
        - GM12878_STD_R1.mLb.clN
        - GM12878_STD_R2.mLb.clN
      row_annotation_cols: [support]
      cluster_rows: true
      cluster_cols: true
      normalize: log1p
      colorscale: Viridis
    title: Consensus signal heatmap
    description: Log-scaled MACS2 fold enrichment per library at the strongest consensus intervals, rows and columns clustered.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 7}

  - component_type: text
    tag: at-cons-tables-intro
    section: Consensus tables
    title: The consensus rows
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The merged intervals and their per-library presence, and the fold
      enrichment behind the heatmap. Selecting a row in one carries the interval
      to the other and to its DESeq2 statistics.
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: table
    tag: at-cons-table-boolean
    section: Consensus tables
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    row_selection_enabled: true
    row_selection_column: peak_id
    title: Consensus intervals
    description: Coordinates, how many peaks merged into the interval and which libraries called it.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 5}
  - component_type: table
    tag: at-cons-table-fc
    section: Consensus tables
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_fc
    use: macs2/consensus_fc
    row_selection_enabled: true
    row_selection_column: peak_id
    title: Consensus fold enrichment
    description: Per-library fold enrichment at the strongest intervals of the merged set.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 6, w: 8, h: 5}

  - component_type: interactive
    tag: at-cons-filter-support
    index: at-cons-support-range
    section: Consensus scope
    group: Consensus
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    interactive_component_type: RangeSlider
    column_name: num_samples
    column_type: int64
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:account-group-outline'}
    placement: left
    title: Libraries per interval
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: at-cons-filter-peaks
    index: at-cons-peaks-range
    section: Consensus scope
    group: Consensus
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    interactive_component_type: RangeSlider
    column_name: num_peaks
    column_type: int64
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:chart-bar'}
    placement: left
    title: Peaks merged
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: at-cons-filter-fcsupport
    index: at-cons-fcsupport-filter
    section: Consensus scope
    group: Strongest intervals
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_fc
    interactive_component_type: MultiSelect
    column_name: support
    column_type: object
    display: {title_size: md, custom_color: '#F2A93B', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Support
    layout: {x: 0, y: 6, w: 1, h: 3}

# ============================================================================
# Differential accessibility
# ============================================================================
- title: Differential accessibility
  subtitle: "DESeq2 on the consensus interval counts: FAST against OMNI, FAST against STD and OMNI against STD"
  tab_order: 5
  tab_icon: mdi:scale-balance
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Contrast
    icon: mdi:scale-balance
    color: grape
    description: Which comparison to read, and how strong a change has to be
  grid_sections:
  - name: Differential accessibility at a glance
    icon: mdi:counter
    color: grape
    description: How many intervals changed, and by how much
  - name: Volcano and MA
    icon: mdi:chart-scatter-plot
    color: grape
    description: Significance against effect size, and effect size against read depth
  - name: Calibration and direction
    icon: mdi:chart-bell-curve
    color: violet
    description: Whether the p-values behave, and which way the changes go
  - name: Differential tables
    icon: mdi:table
    color: violet
    description: The DESeq2 rows behind the panels
    collapsed: true
  components:
  - component_type: text
    tag: at-da-intro
    section: Differential accessibility at a glance
    title: Accessibility that changes between protocols
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      DESeq2 counts reads over the consensus intervals and tests each interval
      between two transposition protocols. Pick a single contrast in the left
      panel before reading the volcano or the MA plot.
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: at-da-card-intervals
    index: at-da-card-intervals
    section: Differential accessibility at a glance
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: nunique
    column_name: gene_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: direction
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Intervals tested
    layout: {x: 0, y: 1, w: 2, h: 2}
  - component_type: card
    tag: at-da-card-lfc
    index: at-da-card-lfc
    section: Differential accessibility at a glance
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: log2fc
    column_type: float64
    display: {icon_name: 'mdi:scale-balance', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Effect size
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: at-da-card-direction
    index: at-da-card-direction
    section: Differential accessibility at a glance
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: count
    column_name: direction
    column_type: object
    secondary_layout: donut
    breakdown_col: direction
    display: {icon_name: 'mdi:chart-donut', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Direction of change
    layout: {x: 4, y: 1, w: 2, h: 2}
  - component_type: card
    tag: at-da-card-padj
    index: at-da-card-padj
    section: Differential accessibility at a glance
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: max
    column_name: neg_log10_padj
    column_type: float64
    secondary_layout: histogram
    display: {icon_name: 'mdi:check-decagram', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Strongest significance
    layout: {x: 6, y: 1, w: 2, h: 2}

  # ------------------------------------------------------------ volcano / MA
  - component_type: text
    tag: at-da-volcano-intro
    section: Volcano and MA
    title: Significance against effect size
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The volcano puts significance against effect size, the MA plot puts effect
      size against how many reads the interval carries. Together they separate a
      real change from a loud one measured on almost no reads.
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: at-da-av-volcano
    index: at-da-av-volcano
    section: Volcano and MA
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    use: deseq2/volcano
    config:
      label_col: gene_id
      category_col: direction
      significance_threshold: 0.05
      effect_threshold: 1.0
      top_n_labels: 15
      show_labels: true
    title: Volcano
    description: -log10(padj) against log2 fold change. The dashed lines are padj 0.05 and a two-fold change.
    title_size: h3
    layout: {x: 0, y: 1, w: 4, h: 7}
  - component_type: advanced_viz
    tag: at-da-av-ma
    index: at-da-av-ma
    section: Volcano and MA
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    use: deseq2/ma
    config:
      significance_col: padj
      label_col: gene_id
      significance_threshold: 0.05
      fold_change_threshold: 1.0
      top_n_labels: 15
      show_labels: true
    title: MA plot
    description: log2 fold change against log2 mean normalised count. Low-count intervals fan out on the left.
    title_size: h3
    layout: {x: 4, y: 1, w: 4, h: 7}

  # ------------------------------------------------- calibration and direction
  - component_type: text
    tag: at-da-qq-intro
    section: Calibration and direction
    title: Do the p-values behave?
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The QQ plot compares the observed p-values against the uniform null: a
      curve that leaves the diagonal early is real signal. The bars rank the
      strongest changes, and the counts show how the three contrasts compare.
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: at-da-av-qq
    index: at-da-av-qq
    section: Calibration and direction
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    use: deseq2/qq
    config:
      feature_id_col: gene_id
      category_col: direction
    title: QQ plot
    description: Observed against expected p-value quantiles for the contrast in view.
    title_size: h3
    layout: {x: 0, y: 1, w: 4, h: 7}
  - component_type: advanced_viz
    tag: at-da-av-dabar
    index: at-da-av-dabar
    section: Calibration and direction
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    use: deseq2/da_barplot
    config:
      significance_col: padj
      significance_threshold: 0.05
      top_n: 25
    title: Strongest differential intervals
    description: The 25 intervals with the largest significant effect, signed by direction.
    title_size: h3
    layout: {x: 4, y: 1, w: 4, h: 7}
  - component_type: figure
    tag: at-da-fig-counts
    index: at-da-fig-counts
    section: Calibration and direction
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    mode: code
    visu_type: bar
    code_content: |
      # significant intervals per contrast and direction; the contrast ids carry
      # the merge-level suffix the pipeline stamps on every consensus file
      df_modified = (
          df.filter(pl.col("significant"))
          .with_columns(
              pl.col("contrast").str.replace(r"\.m(Lb|Rp)\.clN$", "").alias("comparison")
          )
          .group_by(["comparison", "direction"])
          .len()
          .rename({"len": "intervals"})
          .sort(["comparison", "direction"])
      )

      fig = px.bar(
          df_modified.to_pandas(),
          x="comparison",
          y="intervals",
          color="direction",
          barmode="group",
          text="intervals",
      )
      fig.update_layout(
          xaxis_title="Contrast",
          yaxis_title="Significant intervals",
          legend_title_text="Direction",
          margin={"t": 24, "l": 64, "r": 16, "b": 48},
      )
    title: Significant intervals per contrast
    description: How many intervals cleared padj 0.05 and a two-fold change in each protocol comparison, split by direction.
    title_size: h3
    layout: {x: 0, y: 8, w: 8, h: 6}

  # ----------------------------------------------------- differential tables
  - component_type: text
    tag: at-da-tables-intro
    section: Differential tables
    title: The DESeq2 rows
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Every tested interval with its effect size, standard error and adjusted
      p-value. Tick a row to carry that interval into the panels above and into
      the consensus overlap matrix.
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: table
    tag: at-da-table-results
    section: Differential tables
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    row_selection_enabled: true
    row_selection_column: gene_id
    title: DESeq2 differential accessibility
    description: One row per contrast and consensus interval, with the significance call and the MA abscissa.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 6}

  - component_type: interactive
    tag: at-da-filter-contrast
    index: at-da-contrast-filter
    section: Contrast
    group: Comparison
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    interactive_component_type: Select
    column_name: contrast
    column_type: object
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:scale-balance'}
    placement: left
    title: Contrast
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: at-da-filter-lfc
    index: at-da-lfc-range
    section: Contrast
    group: Effect
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    interactive_component_type: RangeSlider
    column_name: log2fc
    column_type: float64
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:chart-bell-curve'}
    placement: left
    title: log2 fold change
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: at-da-filter-padj
    index: at-da-padj-range
    section: Contrast
    group: Effect
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    interactive_component_type: RangeSlider
    column_name: neg_log10_padj
    column_type: float64
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:check-decagram'}
    placement: left
    title: Significance
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: at-da-filter-direction
    index: at-da-direction-filter
    section: Contrast
    group: Effect
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    interactive_component_type: MultiSelect
    column_name: direction
    column_type: object
    display: {title_size: md, custom_color: '#F2A93B', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Direction
    layout: {x: 0, y: 9, w: 1, h: 3}
