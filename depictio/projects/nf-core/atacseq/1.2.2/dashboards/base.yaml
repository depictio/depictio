  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Peak filters
    icon: mdi:filter-variant
    color: indigo
    description: How significant and how wide a call has to be, and on which chromosomes
  grid_sections:
  - name: Peaks at a glance
    icon: mdi:counter
    color: indigo
    description: How many calls the libraries made, how wide, how enriched and how significant
  - name: Significance along the genome
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Every call at the centre of its region, as high as its q-value
  - name: Peak width
