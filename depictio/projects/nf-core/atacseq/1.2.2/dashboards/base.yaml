      library: a broad call reports a region rather than a summit. The cards count the
      calls and sum up their width, enrichment and significance. A lasso on the
      genome-wide panel narrows the cards, the widths and the table to the peaks picked.
    tag: at-pk-intro
    index: pk-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: atacseq
