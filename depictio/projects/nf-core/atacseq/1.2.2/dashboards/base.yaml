version: 1
# nf-core/atacseq 1.2.2, on the family rules of depictio/projects/nf-core/RULES.md
# (ampliseq/2.18.0 is the reference implementation). chipseq/1.2.0 is its
# sibling: the two share their tab groups, tab names and KPI logic wherever
# their data allow, so a reader moving between them finds the same places.
#
# Funnel: library QC (the reprocessed MultiQC report, the ataqv measures, the
# signal tables) -> the peaks each library yielded, where they land and what
# one region holds -> the consensus set across libraries -> differential
# accessibility between design groups. The design hub (`sample_design`) is
# what every filter starts from: the project links carry a pick to the
# MultiQC panels, the ataqv and deepTools tables, the peak calls, the HOMER
# annotation and, through the group, the DESeq2 contrasts.
#
# The MultiQC report bound here was re-generated with MultiQC 1.35 from the
# run's raw tool outputs; the run itself published MultiQC 1.9, which writes no
# parquet. DSL1 wrote no params.json either: the Run parameters dialog lists
# the software versions, which is what the `params:` links search.
#
# Route: atacseq runs the DESeq2 QC (PCA, sample distances) only when the
# design has replicated groups; the import drops those tiles with their data
# collections and re-packs the Sample space section.
main_dashboard:
  title: nf-core/atacseq
  subtitle: Chromatin accessibility, from library quality to the regions that change between groups
  project_tag: ATAC-seq Chromatin Accessibility
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family. atacseq has no
  # GROUP_COL: the design group is the hub's own `group` column.
  category_colors:
    group: auto
    # HOMER's coarse feature classes, written out so a class keeps its colour
    # on the annotation bars, the donut cards and the gene track.
    annotation_class:
      '*': auto
      promoter-TSS: '#d6336c'
      "5' UTR": '#ae3ec9'
      exon: '#7048e8'
      intron: '#1c7ed6'
      "3' UTR": '#1098ad'
      TTS: '#0ca678'
      non-coding: '#74b816'
      Intergenic: '#f59f00'
    direction:
      up: '#e03131'
      down: '#1971c2'
      not significant: '#adb5bd'
    # ataqv's nucleosome windows, shortest fragments first.
    fragment_class:
      sub-nucleosomal: '#1098ad'
      transitional: '#74b816'
      mononucleosomal: '#7048e8'
      multi-nucleosomal: '#c2255c'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. All
  # three are bound to the design hub, the source of every sample link in
  # template.yaml.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  - name: QC thresholds
    icon: mdi:tune
    color: cyan
    description: Signal and yield floors on the per-library QC tables
    collapsed: true
    persistent: true
    pin: bottom
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab, which no route removes.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The design behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The per-library peak QC rows behind the tiles
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Samples, below).
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: sample_design
    interactive_component_type: MultiSelect
    column_name: group
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: Group
    section: Key figures
    tag: at-ov-kf-group
    index: ov-kf-group
    title: Group
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: sample_design
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: at-ov-kf-sample
    index: ov-kf-sample
    title: Sample
    layout: {x: 2, y: 0, w: 2, h: 1}
  # The pipeline's wordmark, read from its repository; where it cannot load (no
  # internet), the title is drawn as text.
  - component_type: text
    title: nf-core/atacseq
    logo: https://raw.githubusercontent.com/nf-core/atacseq/master/docs/images/nf-core-atacseq_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/atacseq/master/docs/images/nf-core-atacseq_logo_dark.png
    order: 1
    body: >
      Chromatin accessibility from ATAC-seq reads: how well each library worked, the
      peaks it yielded and the regions that open or close between groups.
      [Run parameters](params:)
    tag: at-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/atacseq aligns ATAC-seq reads, filters them, calls the accessible regions of each library with MACS2 and compares them between the groups of the design. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The sample filters in the left panel apply to every tab: narrow the samples once and the whole dashboard follows. A bar above a section narrows that section only.
    tag: at-ov-about
    index: ov-about
    layout: {x: 0, y: 1, w: 5, h: 3}
  # DSL1 wrote no params.json, so the run's facts come from its own tables
  # (`values:`) and the genome from the GENOME template variable.
  - component_type: text
    surface: card
    values:
      samples: {dc: sample_design, column: sample, aggregation: nunique, format: integer}
      groups: {dc: sample_design, column: group, aggregation: nunique, format: integer}
      libraries: {dc: design_reads, column: sample_id, aggregation: nunique, format: integer}
      peaks: {dc: macs2_peak_summary, column: num_peaks, aggregation: sum, format: si}
    body: |
      ### The run
      - ![](icon:mdi:flask-outline) **Samples** {{samples}} in {{groups}} groups
      - ![](icon:mdi:test-tube) **Libraries** {{libraries}} sequenced
      - ![](icon:mdi:dna) **Genome** {GENOME}
      - ![](icon:mdi:chart-scatter-plot) **Peaks** {{peaks}} broad calls
    tag: at-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  # The marks take the family's colour (the header's), not the theme's blue.
  # A `params:` link searches the software versions the run recorded.
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Six steps from reads to differential accessibility
      Each step names the tool version it ran and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:content-cut) **Trim** Adapters cut by Trim Galore · [Version](params:trim) · [MultiQC](tab:MultiQC)
      2. ![](icon:mdi:dna) **Align** BWA, then duplicates and poor alignments filtered · [Version](params:bwa) · [ATAC quality](tab:ATAC quality)
      3. ![](icon:mdi:chart-scatter-plot) **Call** MACS2 broad peaks per library · [Version](params:macs2) · [Peaks](tab:Peaks)
      4. ![](icon:mdi:tag-outline) **Annotate** HOMER, the nearest gene of each peak · [Annotation](tab:Annotation)
      5. ![](icon:mdi:set-merge) **Merge** One consensus set across libraries · [Version](params:bedtools) · [Consensus](tab:Consensus)
      6. ![](icon:mdi:scale-balance) **Test** DESeq2 between groups · [Version](params:featurecounts) · [Differential](tab:Differential accessibility)
      :::
    tag: at-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it.
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: sample_design
    aggregation: count
    column_name: sample
    column_type: object
    secondary_layout: composition
    breakdown_col: group
    display:
      icon_name: mdi:flask-outline
      icon_color: orange
      caption: in the design, by group
      link: tab:MultiQC
    section: Key figures
    tag: at-ov-kf-samples
    index: ov-kf-samples
    title: Samples
    description: Samples in the design, one per merged library. The bar splits them by group.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: macs2_peak_summary
    use: macs2/peak_summary
    aggregation: sum
    column_name: num_peaks
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-scatter-plot
      icon_color: indigo
      caption: peaks per library, with their spread
      link: tab:Peaks
      format: si
    section: Key figures
    tag: at-ov-kf-peaks
    index: ov-kf-peaks
    title: Peaks called
    description: MACS2 broad peaks over the libraries in view. The box shows how many each library yielded.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: count
    column_name: gene_id
    column_type: object
    filter_expr: col('significant') == True
    secondary_layout: composition
    breakdown_col: direction
    display:
      icon_name: mdi:scale-balance
      icon_color: red
      caption: significant calls, by direction
      link: tab:Differential accessibility
    section: Key figures
    tag: at-ov-kf-diff
    index: ov-kf-diff
    title: Differential calls
    description: Intervals passing padj 0.05 and a two-fold change, one call per interval and contrast. The bar splits them into opening and closing.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # frip_score is per library, so the median is of libraries, not of reads.
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: macs2_peak_summary
    use: macs2/peak_summary
    aggregation: median
    column_name: frip_score
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.3
    threshold_direction: min
    threshold_warn: 0.2
    display:
      icon_name: mdi:target
      icon_color: lime
      caption: median; ENCODE wants 30%, accepts 20%
      link: tab:MultiQC
      format: percent
    section: Key figures
    tag: at-ov-kf-frip
    index: ov-kf-frip
    title: FRiP
    description: Median fraction of each library's reads falling inside its called peaks, the ATAC signal-to-noise. The strip counts the libraries at the ENCODE target (30%), in the acceptable band (20%) and below it.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the group, then the chromosome of the peak calls.
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: sample_design
    interactive_component_type: MultiSelect
    column_name: group
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: Group
    section: Findings
    tag: at-ov-findings-group
    index: ov-findings-group
    title: Group
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: macs2_broad_peaks
    interactive_component_type: MultiSelect
    column_name: chr
    column_type: object
    display:
      icon_name: mdi:chart-timeline-variant
      custom_color: indigo
      strip_label: Chromosome
    section: Findings
    tag: at-ov-findings-chr
    index: ov-findings-chr
    title: Chromosome
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data.
  - component_type: text
    surface: card
    values:
      fold: {dc: macs2_broad_peaks, column: fold_enrichment, aggregation: median, format: 'decimals:1'}
      top: {dc: homer_annotated_peaks, column: annotation_class, aggregation: top}
      top_share: {dc: homer_annotated_peaks, column: annotation_class, aggregation: top_share, format: percent}
      n_cons: {dc: macs2_consensus_boolean, column: peak_id, aggregation: count, format: integer}
      n_repro: {dc: macs2_consensus_boolean, column: peak_id, aggregation: count, filter_expr: col('num_samples') > 1,
        format: integer}
      n_sig: {dc: deseq2_results, column: gene_id, aggregation: count, filter_expr: col('significant') == True,
        format: integer}
      n_tested: {dc: deseq2_results, column: gene_id, aggregation: count, format: integer}
    body: |
      - **{{fold}}** median fold enrichment of the peaks over the local background – MACS2 broad calls [Peaks](tab:Peaks)
      - **{{top_share}}** of the peaks sit in the {{top}} class – the most common HOMER feature class [Annotation](tab:Annotation)
      - **{{n_repro}}** of {{n_cons}} consensus intervals are called by more than one library – the reproducible set [Consensus](tab:Consensus)
      - **{{n_sig}}** of {{n_tested}} interval tests call a change – DESeq2, padj below 0.05 and two-fold, per contrast [Differential](tab:Differential accessibility)
    section: Findings
    tag: at-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per analysis tab, in the order of the rows above. The tiles
  # of a row share a stored height.
  - component_type: highlight
    section: Findings
    source_tab: Peaks
    source_component: pk-manhattan
    caption: One point per peak at the centre of its region, as high as its significance; colour is the library.
    hide_legend: true
    tag: at-ov-hl-manhattan
    index: ov-hl-manhattan
    layout: {x: 0, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Annotation
    source_component: anno-tss-distance
    caption: Each library's peaks by distance to the nearest start site, one curve per library; the band is the promoter window.
    hide_legend: true
    tag: at-ov-hl-tss
    index: ov-hl-tss
    layout: {x: 4, y: 2, w: 4, h: 4}
  # The consensus UpSet draws one set per library, too many for a third of the
  # row: this summary counts the intervals by how many libraries call them.
  - component_type: figure
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    visu_type: bar
    mode: code
    code_content: |-
      # Consensus intervals by the number of libraries calling a peak on them.
      d = df.group_by('num_samples').agg(pl.len().cast(pl.Int64).alias('intervals')).sort('num_samples')
      fig = px.bar(d.to_pandas(), x='num_samples', y='intervals', labels={'num_samples': 'Libraries calling the interval', 'intervals': 'Consensus intervals'})
      fig.update_xaxes(dtick=1)
      fig.update_layout(margin=dict(t=10))
    title: Replicate agreement
    link: tab:Consensus
    caption: Consensus intervals by how many libraries call a peak on them; the right-hand bars are the reproducible set.
    section: Findings
    tag: at-ov-consensus-support
    index: ov-consensus-support
    layout: {x: 0, y: 6, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Differential accessibility
    source_component: diff-volcano
    caption: One point per interval and contrast; right of the line, more accessible in the first group.
    tag: at-ov-hl-volcano
    index: ov-hl-volcano
    layout: {x: 4, y: 6, w: 4, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers. A tab the run does not have is left out.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [ATAC quality](tab:ATAC quality)
      - [Signal](tab:Signal)

      ### Peak calls
      - [Peaks](tab:Peaks)
      - [Annotation](tab:Annotation)
      - [Locus](tab:Locus)

      ### Comparison
      - [Consensus](tab:Consensus)
      - [Differential accessibility](tab:Differential accessibility)
    section: How to read this dashboard
    tag: at-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the group first.
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: sample_design
    interactive_component_type: MultiSelect
    column_name: group
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: at-filter-group
    index: sample-filters-group
    title: Group
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: sample_design
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: at-filter-sample
    index: sample-filters-sample
    title: Sample
    layout: {x: 0, y: 2, w: 1, h: 3}
  # The second factor of the design, on the categorical twin of `replicate`.
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: sample_design
    interactive_component_type: MultiSelect
    column_name: replicate_label
    column_type: object
    display:
      icon_name: mdi:content-duplicate
      custom_color: cyan
    section: Sample filters
    group: Sample scope
    tag: at-filter-replicate
    index: sample-filters-replicate
    title: Replicate
    layout: {x: 0, y: 5, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: tss_enrichment
    column_type: float64
    display:
      icon_name: mdi:target
      custom_color: lime
    section: QC thresholds
    group: Library quality
    tag: at-filter-tss
    index: qc-tss-range
    title: TSS enrichment
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: macs2_peak_summary
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: frip_score
    column_type: float64
    display:
      icon_name: mdi:magnet
      custom_color: yellow
    section: QC thresholds
    group: Library quality
    tag: at-filter-frip
    index: qc-frip-range
    title: FRiP score
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: macs2_peak_summary
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: num_peaks
    column_type: int64
    display:
      icon_name: mdi:counter
      custom_color: indigo
    section: QC thresholds
    group: Library quality
    tag: at-filter-peakcount
    index: qc-peakcount-range
    title: Peaks called
    layout: {x: 0, y: 6, w: 1, h: 3}
  # Row selection feeds the Analysis panel.
  - component_type: table
    workflow_tag: atacseq
    data_collection_tag: sample_design
    row_selection_enabled: true
    row_selection_column: sample
    section: Sample sheet
    tag: at-sample-sheet
    index: sample-sheet
    title: Sample sheet
    description: One row per sample, with its group, replicate and merged-library name.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: atacseq
    data_collection_tag: macs2_peak_summary
    use: macs2/peak_summary
    row_selection_enabled: true
    row_selection_column: sample
    section: Reference tables
    tag: at-ref-table-summary
    index: ref-peak-summary
    title: Peak QC summary
    description: Peak count, FRiP score and the width, enrichment and significance spreads per library.
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
# ============================================================================
# Data & QC
# ============================================================================
- title: MultiQC
  subtitle: Did sequencing, alignment and filtering work for every library?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # Tab-local: the read-level panels are keyed on the sequencing library, a
  # finer grain than the sample every other tab works in.
  filter_sections:
  - name: Library scope
    icon: mdi:test-tube
    color: orange
    description: The sequencing libraries behind the FastQC and Trim Galore panels
  grid_sections:
  - name: Run summary
    icon: mdi:view-dashboard-outline
    color: orange
    description: Every module's headline numbers, one row per library
  - name: Reads and alignment
    icon: mdi:chart-bar
    color: orange
    description: Reads sequenced per library, and the share that mapped before and after filtering
  - name: Enrichment
    icon: mdi:chart-line
    color: orange
    description: How concentrated the reads are, and how much of them falls in peaks
  - name: QC details
    icon: mdi:file-document-outline
    color: gray
    description: Read quality, trimming, insert sizes, duplication and mapping quality
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [MultiQC](https://multiqc.info) gathers what every tool of the run reported: FastQC
      and Trim Galore on the reads, samtools and Picard on the alignments, deepTools and
      MACS2 on the signal. Read whether each library yielded enough reads, how many
      mapped, and how much of its signal falls in peaks.
    tag: at-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: design_reads
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: Library scope
    tag: at-mqc-filter-library
    index: mqc-library-filter
    title: Sequencing library
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: multiqc
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: Run summary
    tag: at-mqc-general-stats
    title: General statistics
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Counts
    section: Reads and alignment
    tag: at-mqc-fastqc-counts
    title: Sequence counts
    layout: {x: 0, y: 0, w: 4, h: 4}
  # samtools reports every merged library before filtering (mLb.mkD) and after
  # it (mLb.clN), so the gap between the two series is what filtering removed.
  - component_type: multiqc
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Percent mapped
    section: Reads and alignment
    tag: at-mqc-samtools-mapped
    title: Reads mapped, before and after filtering
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    use: multiqc/deeptools
    selected_module: deepTools
    selected_plot: Fingerprint plot
