    layout: {x: 0, y: 0, w: 8, h: 6}
  # A genome_view rather than a coverage_track: the consensus table holds about
  # a hundred thousand intervals, which GenomeSpy draws on the GPU and zooms to
  # the followed region.
  - component_type: advanced_viz
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      chr_col: chr
      pos_col: start
      end_col: end
      score_col: num_samples
      feature_col: peak_id
      mark: bar
      score_title: Libraries calling it
      opacity: 0.8
      assembly: '{GENOME}'
      region_filter_enabled: false
      follow_region_filter: true
      selection_enabled: true
      selection_column: peak_id
    section: Peaks on one axis
    tag: at-loc-consensus
    index: loc-consensus
    title: Consensus intervals and their support
