    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: at-pk-filter-width
    index: at-pk-width-range
    section: Peak filters
    group: Peak strength
    workflow_tag: atacseq
    data_collection_tag: macs2_broad_peaks
    interactive_component_type: RangeSlider
    column_name: width
    column_type: int64
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:ruler'}
    placement: left
    title: Peak width
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: at-pk-filter-class
    index: at-pk-class-filter
    section: Peak filters
    group: Annotation
    workflow_tag: atacseq
