# nf-core/atacseq Template v2.1.2 - Chromatin accessibility (ATAC-seq)
# ============================================================================
# This is a TEMPLATE project configuration. Use with:
#   depictio ingest --template nf-core/atacseq/2.1.2 --data-root /path/to/your/data
#
# DATA_ROOT is the pipeline's own --outdir.
#
# Validated against EMBL HPC runs of nf-core/atacseq 2.1.2
# (scripts/nfcore_validation_hpc.py, keys atacseq2-*): the `test` profile with
# bwa, bowtie2, chromap and star, the `test_controls` profile and the
# `test_full` megatest profile. No usable S3 megatest exists for 2.x (see
# megatest.yaml and depictio/projects/nf-core/MEGATEST_STATUS.md).
# ============================================================================
#
# LAYOUT. 2.x publishes per aligner and per merge level:
#   <aligner>/merged_library/    one library per sample replicate (`.mLb.clN`)
#   <aligner>/merged_replicate/  replicates merged per group (`.mRp.clN`)
# Both levels carry a full MACS2 / HOMER / consensus / DESeq2 QC tree, and the
# catalog recipes match on file NAME. Every recipe that would also read the
# merged-replicate copy is therefore pinned to the merged-library files with a
# `source_overrides` glob; ataqv and deepTools run on the merged library only
# and need no override. No glob spells out the aligner directory, so bwa,
# bowtie2, chromap and star runs land in the same collections (the four were
# compared file by file and publish the same tables; star adds
# `star/library/log/`, which nothing here reads).
#
# SCOPE: BROAD PEAKS, MERGED LIBRARY. The pipeline default is broad peak calling,
# so the calls are `macs2/broad_peak/*_peaks.broadPeak` (BED6+3, no summit
# column), read by the catalog's `macs2/broad_peaks`. A `--narrow_peak` run
# writes `narrow_peak/` and `*_peaks.narrowPeak` and is not bound here, for the
# reason 1.2.2 records (a narrow route needs its own copy of base.yaml); every
# other glob already takes both routes (`macs2/*/`).
#
# CONTROL ROUTE. `test_controls` adds a `control` / `control_replicate` pair to
# the samplesheet and calls peaks against the input. The controls are
# themselves merged libraries with their own ataqv report, peak file and
# consensus column, so the route needs no collection of its own: the hub marks
# them with `role: control`.
#
# NO DIFFERENTIAL ACCESSIBILITY. 2.0 removed the DESeq2 contrasts
# (`--skip_diff_analysis` became `--skip_deseq2_qc`): no `*.deseq2.results.txt`
# is published. What remains is the DESeq2 QC of the consensus counts, the PCA
# and the sample distances, read here as `deseq2_qc_pca` and
# `deseq2_qc_sample_dists`.
#
# MULTIQC. The release runs MultiQC 1.13, which writes no parquet. The report
# is bound wherever a MultiQC 1.31 or later parquet exists, by the scan pattern
# every template shares:
#   multiqc/broad_peak/multiqc_data/multiqc.parquet  the pipeline's own
#       publishDir, when the run was made with a newer MultiQC swapped in (the
#       Nextflow trigger path, which overwrites the 1.13 report);
#   multiqc/multiqc_data/multiqc.parquet             what
#       `python -m depictio.dev_scripts.multiqc_reprocess --src DATA_ROOT --dest DATA_ROOT`
#       writes next to a REPROCESSED.json for a 1.13 run.
# The CLI ingests EVERY parquet it finds as its own report, so a tree must hold
# exactly one of the two: never reprocess a run that already published one.
#
# The two reports name their modules differently. The pipeline's
# multiqc_config.yml runs a tool once per level and MultiQC numbers the
# repeats; a reprocessed report merges each tool under its plain module id:
#   pipeline-written           reprocessed
#   fastqc, fastqc-1           fastqc            (raw, trimmed)
#   samtools, samtools-1/2/3   samtools          (library, merged lib, merged rep)
#   picard (Mark Duplicates),  picard            (both)
#   picard-1 (the rest)
#   mlib_deeptools             deepTools
#   (none)                     general_stats, featurecounts, ataqv, macs
# `modules` / `plots` below list both. The dashboard binds the tiles both
# reports carry under one id, and gives the fingerprint and the insert sizes a
# same-slot alternate per report; the general statistics, featureCounts and
# ataqv tiles exist on a reprocessed report only and are pruned otherwise.
#
# NO params.json. The run publishes `pipeline_info/samplesheet.valid.csv` and
# `pipeline_info/software_versions.yml` but no params JSON, so provenance is the
# tool versions and no template variable is auto-set from pipeline parameters.
#
# SAMPLE NAMING. The validated samplesheet names a library
# `<group>_REP<replicate>_T<technical replicate>`. Merged, it becomes
# `<group>_REP<replicate>`, which is what ataqv, deepTools, the peak QC summary
# (see macs2_peak_summary), the DESeq2 QC and MultiQC call it, and MACS2 stamps
# `<group>_REP<replicate>.mLb.clN` into every peak name, which is also what the
# HOMER annotation and the consensus matrix use. Picard names its report after
# the duplicate-marked BAM (`<sample>.mLb.mkD.sorted`). The hub carries the two
# main spellings and every link starts from the one its target uses.
template:
  template_id: "nf-core/atacseq/2.1.2"
  description: "nf-core/atacseq template: ataqv library quality, deepTools and Picard signal QC, MACS2 broad peaks, HOMER peak annotation, the consensus peak set and its DESeq2 QC, on top of the pipeline's MultiQC report."
  version: "1.0.0"
  variables:
    - name: "DATA_ROOT"
      description: "The atacseq --outdir: ALIGNER/merged_library/, fastqc/, trimgalore/, multiqc/, pipeline_info/, plus a MultiQC 1.31 or later parquet, either the pipeline's own under multiqc/broad_peak/multiqc_data/ or a reprocessed one under multiqc/multiqc_data/."
      required: true
    - name: "GENOME"
      description: "UCSC assembly the run was aligned to (hg38, hg19, mm10, ...). Sets the genome axis of the Locus tab; pass --var GENOME=<assembly> for a run on another build."
      required: false
      default: "hg38"
  # The bundled reference dataset: the samplesheet is part of the run's own
  # pipeline_info/ output, and the megatest profile (test_full) aligns to hg19.
  reference:
    vars:
      GENOME: "hg19"
  # How this run's provenance is collected at ingest, surfaced in the ingestion
  # report and the dashboard Settings drawer. Keys matched by no group rule land
  # in 'Other'.
  provenance:
    sources:
      - name: "software_versions"
        glob: "pipeline_info/software_versions.yml"
        format: "yaml"
        pick: "latest"
        group: "Software versions"
    groups:
      - group: "Software versions"
        key_patterns: ["*"]
  dashboards:
    - "dashboards/base.yaml"

# ============================================================================
# PROJECT CONFIGURATION
# ============================================================================

name: "ATAC-seq Chromatin Accessibility"
project_type: "advanced"
is_public: true
workflows:
  - name: "atacseq"
    version: "2.1.2"
    engine:
      name: "nextflow"
      version: "24.04.2"
    catalog:
      name: "nf-core"
      url: "https://nf-co.re"
    repository_url: "https://github.com/nf-core/atacseq"
    data_location:
      structure: "flat"
      locations:
        - "{DATA_ROOT}"
    data_collections:
      # ----------------------------------------------------------------
      # Hub: one row per merged library, derived from the samplesheet the
      # pipeline validated. Carries both spellings of the sample name (see
      # SAMPLE NAMING above) so the links can reach every downstream
      # collection.
      # ----------------------------------------------------------------
      - data_collection_tag: "sample_design"
        description: "Per-sample design: group, replicate, read type, control and the merged-library name the peak-level collections use (the hub every filter starts from)"
        config:
          type: "Table"
          metatype: "Metadata"
          source: "transformed"
          transform:
            recipe: "nf-core/atacseq/sample_design.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Canonical sample name (<group>_REP<replicate>); the key the QC collections are linked on"
              "merged_library": "<sample>.mLb.clN, the merged filtered library the peak calls, the HOMER annotation and the consensus columns are named after"
              "group": "Design group; replicates of a group are merged at the merged_replicate level"
              "replicate": "Biological replicate number inside the group"
              "replicate_label": "The replicate as a label (REP1, REP2, ...), what the replicate filter selects on"
              "read_type": "paired-end, single-end, or mixed when the merged libraries disagree"
              "role": "control when another sample was called against this group, sample otherwise"
              "control": "Control library the sample's peaks were called against (<group>_REP<n>), empty without one"
              "n_libraries": "Sequencing libraries merged into the sample"
              "libraries": "Those library ids, comma separated"

      # The library-level samplesheet as the run validated it: one row per
      # sequencing library, keyed on the id the read-level MultiQC panels use.
      # On the control route the validator writes the `control` header twice,
      # which the reader keeps as `control` and `control_duplicated_0`.
      - data_collection_tag: "samplesheet"
        description: "Library-level samplesheet as the pipeline validated it: one row per sequencing library and its FASTQ files"
        config:
          type: "Table"
          metatype: "Metadata"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: "samplesheet\\.valid\\.csv$"
          dc_specific_properties:
            format: "CSV"
            columns_description:
              "sample": "Library identifier (<group>_REP<replicate>_T<technical replicate>)"
              "fastq_1": "Read 1 FASTQ"
              "fastq_2": "Read 2 FASTQ, empty for single-end libraries"
              "replicate": "Biological replicate number inside the group"
              "single_end": "1 for a single-end library, 0 for paired-end"

      # ----------------------------------------------------------------
      # MultiQC. See the MULTIQC note above: the pattern is the shared one,
      # and the lists below are the modules and plots of both report
      # flavours.
      # ----------------------------------------------------------------
      - data_collection_tag: "multiqc_data"
        description: "MultiQC report of the run (a MultiQC 1.31 or later parquet, written by the pipeline or reprocessed from the run's raw tool outputs)"
        config:
          type: "MultiQC"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: "(?:.*/)?multiqc(?:/[^/]+)?/multiqc_data/multiqc\\.parquet$"
          dc_specific_properties:
            s3_location: null
            modules:
              # Both flavours
              - "fastqc"
              - "cutadapt"
              - "samtools"
              - "picard"
              - "mlib_peak_count"
              - "mlib_frip_score"
              - "mlib_peak_annotation"
              - "mlib_deseq2_pca_1"
              - "mlib_deseq2_clustering_1"
              - "mrep_peak_count"
              - "mrep_frip_score"
              - "mrep_peak_annotation"
              - "mrep_deseq2_pca_1"
              - "mrep_deseq2_clustering_1"
              # Pipeline-written report only
              - "fastqc-1"
              - "samtools-1"
              - "samtools-2"
              - "samtools-3"
              - "picard-1"
              - "mrep_picard"
              - "mlib_deeptools"
              - "software_versions"
              - "nf-core-atacseq-summary"
              # Reprocessed report only
              - "general_stats"
              - "deepTools"
              - "ataqv"
              - "macs"
              - "featurecounts"
            plots:
              fastqc:
                - "Sequence Counts"
                - "Sequence Quality Histograms"
                - "Per Sequence Quality Scores"
                - "Per Sequence GC Content":
                    - "Percentages"
                    - "Counts"
                - "Per Base N Content"
                - "Sequence Length Distribution"
                - "Sequence Duplication Levels"
                - "Top overrepresented sequences"
                - "Adapter Content"
                - "Status Checks"
              fastqc-1:
                - "Sequence Counts"
                - "Sequence Quality Histograms"
                - "Per Sequence Quality Scores"
                - "Per Sequence GC Content":
                    - "Percentages"
                    - "Counts"
                - "Per Base N Content"
                - "Sequence Length Distribution"
                - "Sequence Duplication Levels"
                - "Status Checks"
              cutadapt:
                - "Filtered Reads"
                - "Trimmed Sequence Lengths (3')":
                    - "Counts"
                    - "Obs/Exp"
              samtools:
                - "Percent mapped"
                - "Insert size distribution"
                - "Alignment stats"
                - "Flagstat"
                - "Flagstat: Percentage of total"
                - "XY counts"
                - "Mapped reads per contig":
                    - "Normalised Counts"
                    - "Observed over Expected Counts"
                    - "Raw Counts"
              samtools-1:
                - "Percent mapped"
                - "Insert size distribution"
                - "Alignment stats"
                - "Flagstat"
                - "Flagstat: Percentage of total"
                - "Mapped reads per contig":
                    - "Normalised Counts"
                    - "Observed over Expected Counts"
                    - "Raw Counts"
              samtools-2:
                - "Percent mapped"
                - "Insert size distribution"
                - "Alignment stats"
                - "Flagstat"
                - "Flagstat: Percentage of total"
                - "Mapped reads per contig":
                    - "Normalised Counts"
                    - "Observed over Expected Counts"
                    - "Raw Counts"
              samtools-3:
                - "Percent mapped"
                - "Insert size distribution"
                - "Alignment stats"
                - "Flagstat"
                - "Flagstat: Percentage of total"
                - "Mapped reads per contig":
                    - "Normalised Counts"
                    - "Observed over Expected Counts"
                    - "Raw Counts"
              # Reprocessed: every Picard plot. Pipeline-written: Mark Duplicates
              # only, the rest under picard-1.
              picard:
                - "Alignment Summary":
                    - "Aligned Reads"
                    - "Aligned Bases"
                - "Mean read length"
                - "Base Distribution":
                    - "% Adenine"
                    - "% Cytosine"
                    - "% Guanine"
                    - "% Thymine"
                    - "% Undetermined"
                - "Insert Size":
                    - "Counts"
                    - "Percentages"
                - "Mark Duplicates"
                - "Mean Base Quality by Cycle"
                - "Base Quality Distribution"
              picard-1:
                - "Alignment Summary":
                    - "Aligned Reads"
                    - "Aligned Bases"
                - "Mean read length"
                - "Base Distribution":
                    - "% Adenine"
                    - "% Cytosine"
                    - "% Guanine"
                    - "% Thymine"
                    - "% Undetermined"
                - "Insert Size":
                    - "Counts"
                    - "Percentages"
                - "Mean Base Quality by Cycle"
                - "Base Quality Distribution"
              mrep_picard:
                - "Mark Duplicates"
              mlib_deeptools:
                - "Fingerprint plot"
                - "Read Distribution Profile after Annotation"
              deepTools:
                - "Fingerprint plot"
                - "Fingerprint quality metrics"
                - "Read Distribution Profile after Annotation"
              ataqv:
                - "Fragment Length Distribution":
                    - "Read Count"
                    - "Percentage"
                - "Peak percentiles":
                    - "HQAA"
                    - "Territory"
                - "Mapping Quality Distribution"
                - "Chromosome Distribution":
                    - "Reads"
                    - "Percentages"
              featurecounts:
                - "Assignments"
              mlib_peak_count:
                - "mlib_peak_count-section"
              mlib_frip_score:
                - "mlib_frip_score-section"
              mlib_peak_annotation:
                - "mlib_peak_annotation-section"
              mlib_deseq2_pca_1:
                - "mlib_deseq2_pca_1-section"
              mlib_deseq2_clustering_1:
                - "mlib_deseq2_clustering_1-section"
              mrep_peak_count:
                - "mrep_peak_count-section"
              mrep_frip_score:
                - "mrep_frip_score-section"
              mrep_peak_annotation:
                - "mrep_peak_annotation-section"
              mrep_deseq2_pca_1:
                - "mrep_deseq2_pca_1-section"
              mrep_deseq2_clustering_1:
                - "mrep_deseq2_clustering_1-section"

      # ----------------------------------------------------------------
      # ataqv: the ATAC-specific QC the pipeline runs on every merged
      # library (`<aligner>/merged_library/ataqv/broad_peak/*.ataqv.json`).
      # The pipeline does not hand these reports to MultiQC, and MultiQC
      # 1.35's ataqv module only reads them on a reprocessed report, so
      # these recipes are what carries the numbers on every route.
      # ----------------------------------------------------------------
      - data_collection_tag: "ataqv_metrics"
        description: "Per-library ATAC quality metrics: TSS enrichment, reads in peaks, mitochondrial and duplicate fractions, peak statistics"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "ataqv/metrics.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Library ataqv reported on"
              "tss_enrichment": "Coverage at transcription start sites over the flanking background"
              "total_reads": "Reads in the alignment ataqv read"
              "hqaa": "High-quality autosomal alignments (the usable ATAC reads)"
              "hqaa_fraction": "hqaa over total_reads"
              "hqaa_in_peaks": "HQAA falling inside a called peak"
              "hqaa_overlapping_peaks_percent": "Percent of HQAA inside peaks; the ATAC signal-to-noise measure"
              "total_autosomal_reads": "Reads on autosomes"
              "total_mitochondrial_reads": "Reads on the mitochondrial contig"
              "mitochondrial_fraction": "Mitochondrial reads over total_reads; the classic ATAC waste"
              "duplicate_fraction": "Duplicate reads over total_reads"
              "duplicate_fraction_in_peaks": "Duplicate rate inside peaks"
              "duplicate_fraction_not_in_peaks": "Duplicate rate outside peaks"
              "peak_duplicate_ratio": "In-peak over out-of-peak duplicate rate"
              "total_peaks": "Peaks ataqv was given for the library"
              "total_peak_territory": "Bases covered by those peaks"
              "hqaa_tf_count": "HQAA in sub-nucleosomal fragments (up to 100 bp)"
              "hqaa_mononucleosomal_count": "HQAA in mononucleosomal fragments (150-324 bp)"
              "short_mononucleosomal_ratio": "Sub-nucleosomal over mononucleosomal HQAA"
              "max_fraction_reads_from_single_autosome": "Largest share of reads on any one autosome"
              "median_mapq": "Median mapping quality"
              "properly_paired_fraction": "Properly paired and mapped reads over total_reads"
              "maximum_proper_pair_fragment_size": "Longest proper pair observed"
              "median_fragment_length": "Median fragment length of the library, weighted by read count over its fragment-length histogram"
              "ataqv_version": "ataqv version that wrote the report"

      - data_collection_tag: "ataqv_fragment_length"
        description: "Fragment-length histogram of every library, in long form, with the nucleosome window each length belongs to"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "ataqv/fragment_length.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Library ataqv reported on"
              "fragment_length": "Fragment length in bp"
              "read_count": "Reads with that fragment length"
              "fraction_of_all_reads": "read_count over all reads of the library"
              "fragment_class": "sub-nucleosomal / transitional / mononucleosomal / multi-nucleosomal, on ataqv's own cut-offs"

      - data_collection_tag: "ataqv_tss_coverage"
        description: "Aggregate coverage in a 2 kb window centred on every transcription start site, one row per library and offset"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "ataqv/tss_coverage.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Library ataqv reported on"
              "position": "Signed distance from the transcription start site in bp"
              "coverage": "Aggregate normalised coverage at that offset"

      - data_collection_tag: "ataqv_chromosome_counts"
        description: "Reads per reference sequence and library, with each sequence's share of the library"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "ataqv/chromosome_counts.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Library ataqv reported on"
              "chromosome": "Reference sequence name"
              "read_count": "Reads aligned to it"
              "fraction_of_reads": "read_count over the library's counted reads"
              "log10_read_count": "log10(read_count + 1), the colour axis of the read-distribution matrix"

      # ----------------------------------------------------------------
      # Library complexity on every route: Picard MarkDuplicates runs on
      # each merged library and estimates its size, preseq (below) only
      # when the run asked for it. The raw collection reads every report
      # one LINE per row (a separator the report cannot contain) so the
      # recipe can find the DuplicationMetrics block; the regex takes the
      # merged-library reports only (the merged-replicate ones are named
      # `.mRp.clN.sorted`). The recipe names the library after the report
      # (`<sample>.mLb.mkD.sorted`), so the hub reaches it with a pattern
      # link.
      # ----------------------------------------------------------------
      - data_collection_tag: "picard_markduplicates_metrics_raw"
        description: "Raw Picard MarkDuplicates reports of the merged libraries, one line per row (input of picard_markduplicates_metrics)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: ".*\\.mLb\\.mkD\\.sorted\\.MarkDuplicates\\.metrics\\.txt$"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\x1f"
              has_header: false
              new_columns: ["raw"]
              include_file_paths: "source_path"
              infer_schema_length: 0
            columns_description:
              "raw": "One line of the MarkDuplicates report"
              "source_path": "File the line came from; the library id is derived from its name"

      - data_collection_tag: "picard_markduplicates_metrics"
        description: "Reads examined, duplicates flagged, the duplication rate and Picard's library-size estimate, per merged library"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "picard/markduplicates_metrics.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Duplicate-marked library the report is named after (<sample>.mLb.mkD.sorted)"
              "library": "Picard's own LIBRARY field, as written"
              "unpaired_reads_examined": "Single-end reads considered"
              "read_pairs_examined": "Read pairs considered"
              "unmapped_reads": "Reads MarkDuplicates could not place"
              "unpaired_read_duplicates": "Single-end duplicates flagged"
              "read_pair_duplicates": "Paired duplicates flagged"
              "read_pair_optical_duplicates": "Of those, optical duplicates"
              "duplicate_reads": "Unpaired plus twice the paired duplicates"
              "reads_after_dedup": "Examined reads left once duplicates are removed"
              "percent_duplication": "Picard's own PERCENT_DUPLICATION, 0 to 1"
              "estimated_library_size": "Picard's estimate of the distinct molecules in the library"

      # ----------------------------------------------------------------
      # preseq is OFF by default in 2.x (`--skip_preseq` defaults to true),
      # so none of the validated runs publishes it. Both preseq collections
      # are optional: a run made with `--skip_preseq false` writes
      # `<aligner>/merged_library/preseq/<sample>.mLb.mkD.lc_extrap.txt` and
      # fills them, a default run skips them and the import drops their
      # tiles. The raw collection exists so the tidy one can read it through
      # `dc_ref`: the sample id lives only in the FILE NAME, and only a scan
      # carries the path (`include_file_paths`) into the frame. Not validated
      # on 2.x data.
      # ----------------------------------------------------------------
      - data_collection_tag: "preseq_ccurve_raw"
        description: "Raw per-sample preseq lc_extrap complexity curves (input of preseq_complexity_curve); only published with --skip_preseq false"
        optional: true
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: ".*\\.lc_extrap\\.txt$"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
              null_values: ["NA", "NaN", ""]
              include_file_paths: "source_path"
              infer_schema_length: 0
            columns_description:
              "TOTAL_READS": "Sequencing depth the row extrapolates to"
              "EXPECTED_DISTINCT": "Unique molecules expected at that depth"
              "LOWER_0.95CI": "Lower bound of the 95% interval on that extrapolation"
              "UPPER_0.95CI": "Upper bound of the 95% interval"
              "source_path": "File the row came from; the sample id is derived from it"

      - data_collection_tag: "preseq_complexity_curve"
        description: "Library complexity curve of every sample with its 95% confidence ribbon, clipped to a billion reads and thinned for plotting; only filled with --skip_preseq false"
        optional: true
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "preseq/complexity_curve.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Library preseq ran on"
              "total_reads": "Sequencing depth the row extrapolates to"
              "expected_distinct": "Unique molecules expected at that depth"
              "lower_ci": "Lower bound of the 95% interval"
              "upper_ci": "Upper bound of the 95% interval"
              "ci_width": "upper_ci - lower_ci, how wide the extrapolation is"

      # ----------------------------------------------------------------
      # deepTools runs on the merged library only, so the catalog globs need
      # no override.
      # ----------------------------------------------------------------
      - data_collection_tag: "deeptools_fingerprint_metrics"
        description: "Per-sample plotFingerprint quality metrics: how concentrated each library's coverage is against a uniform library of the same depth."
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "deeptools/fingerprint_metrics.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Library plotFingerprint ran on"
              "auc": "Area under the observed cumulative-coverage curve"
              "synthetic_auc": "Same area for a perfectly uniform library of that depth"
              "auc_ratio": "auc / synthetic_auc; 1.0 means coverage indistinguishable from uniform"
              "x_intercept": "Share of genome bins with no reads at all"
              "synthetic_x_intercept": "Same, for the uniform library"
              "elbow_point": "Where the observed coverage curve turns"
              "synthetic_elbow_point": "Same, for the uniform library"
              "synthetic_js_distance": "Jensen-Shannon distance to the uniform library"

      - data_collection_tag: "deeptools_plot_profile"
        description: "Mean signal of every library across the plotted metagene window, one row per sample and bin"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "deeptools/plot_profile.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Library plotProfile ran on"
              "group": "Region group deepTools plotted (nf-core plots one, `genes`)"
              "bin": "1-based bin index along the plotted window; 1 to 300 is the 3 kb upstream flank, 300 to 400 the scaled gene body, 400 to 700 the 3 kb downstream flank"
              "bin_label": "deepTools' own anchor label at that bin (-3.0Kb, TSS, TES, 3.0Kb), empty in between"
              "signal": "Mean signal in that bin"

      # ----------------------------------------------------------------
      # Peak level, merged library only. `source_overrides` pin the catalog
      # recipes to the merged-library files: their own globs match on name
      # alone and would also read the merged-REPLICATE copy (`.mRp.clN`) of
      # the whole peak tree, concatenating two levels of the same analysis
      # into one table.
      #
      # The peak QC summary is read by a version recipe
      # (`recipes/peak_summary.py`), not the catalog's `macs2/peak_summary`:
      # 2.x names the summary rows after the merged library
      # (`<sample>.mLb.clN`) and the FRiP files after the bare sample, so the
      # catalog join on the raw name leaves every FRiP score null. The
      # version recipe strips the merge suffix from both sides and keys the
      # table on the bare sample. Its output schema is the catalog's.
      # ----------------------------------------------------------------
      - data_collection_tag: "macs2_peak_summary"
        description: "Per-sample peak QC: peak count, FRiP score and the spread of peak width, enrichment and significance"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "nf-core/atacseq/peak_summary.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Sample the peaks were called in (<group>_REP<replicate>)"
              "num_peaks": "Peaks MACS2 called for the sample"
              "frip_score": "Fraction of mapped reads falling inside called peaks"
              "width_median": "Median peak width (bp)"
              "width_mean": "Mean peak width (bp)"
              "width_max": "Widest peak (bp)"
              "fold_enrichment_median": "Median fold enrichment over the background"
              "fold_enrichment_mean": "Mean fold enrichment over the background"
              "neg_log10_qvalue_median": "Median -log10 q-value"
              "neg_log10_pvalue_median": "Median -log10 p-value"

      - data_collection_tag: "macs2_broad_peaks"
        description: "Every MACS2 broad peak of every merged library, with width, midpoint and the enrichment and significance MACS2 reported"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "macs2/broad_peaks.py"
            source_overrides:
              broadpeak:
                glob_pattern: "**/*.mLb.clN_peaks.broadPeak"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Merged library the peak was called in (<sample>.mLb.clN)"
              "peak_id": "MACS2 peak name, unique across samples"
              "chr": "Chromosome"
              "start": "Peak start (0-based)"
              "end": "Peak end"
              "width": "Peak width in bp"
              "midpoint": "Centre of the region; a broad call reports no summit"
              "score": "MACS2 integer score"
              "fold_enrichment": "Fold enrichment over the background"
              "neg_log10_pvalue": "-log10 of the region p-value"
              "neg_log10_qvalue": "-log10 of the region q-value (FDR)"

      - data_collection_tag: "homer_annotated_peaks"
        description: "HOMER annotation of every peak: genomic feature class, distance to the nearest TSS and the gene it belongs to"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "homer/annotate_peaks.py"
            source_overrides:
              annotation:
                # Per-sample tables of the merged-library level only: the
                # catalog glob would also take the consensus annotation and the
                # merged-replicate copy. The leading `**/` covers every aligner
                # directory, the `*` after `macs2/` both peak routes.
                glob_pattern: "**/merged_library/macs2/*/*.mLb.clN_peaks.annotatePeaks.txt"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Merged library the peak was called in"
              "peak_id": "Peak identifier, the same one macs2_broad_peaks uses"
              "chr": "Chromosome"
              "start": "Peak start"
              "end": "Peak end"
              "strand": "Peak strand as HOMER reports it (always + for MACS2 peaks)"
              "peak_score": "Score carried over from the peak caller"
              "annotation_class": "Coarse feature class: promoter-TSS, intron, exon, Intergenic, TTS"
              "annotation": "Full HOMER annotation string, with the transcript detail"
              "distance_to_tss": "Signed distance to the nearest transcription start site (bp)"
              "nearest_promoter_id": "Identifier of the nearest promoter"
              "gene_name": "Symbol of the nearest gene"
              "gene_type": "Biotype of the nearest gene; empty when the run annotated against a plain GTF"

      - data_collection_tag: "homer_tss_distance_profile"
        description: "Where each sample's peaks sit relative to the nearest TSS, counted in 250 bp bins across a 20 kb window"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "homer/tss_distance_profile.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Sample the peaks were called in"
              "distance_to_tss": "Centre of the bin, signed bp from the transcription start site"
              "peak_count": "Peaks of that sample falling in the bin"
              "fraction": "peak_count over the sample's peaks inside the window"

      - data_collection_tag: "macs2_consensus_boolean"
        description: "Consensus peak intervals of the merged libraries against the samples that called them, as 0/1 set columns"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "macs2/consensus_boolean.py"
            source_overrides:
              # `consensus_peaks.<level>.boolean.txt`: the catalog glob expects the
              # ChIP-family `<antibody>.consensus_peaks.boolean.txt`.
              boolean:
                glob_pattern: "**/consensus_peaks.mLb.clN.boolean.txt"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "peak_id": "<consensus set>:<interval id>"
              "consensus_set": "Which consensus table the interval came from, named after its samples"
              "interval_id": "Interval id inside that table"
              "chr": "Chromosome"
              "start": "Merged interval start"
              "end": "Merged interval end"
              "num_peaks": "Per-sample peaks merged into the interval"
              "num_samples": "Samples calling a peak on the interval"

      - data_collection_tag: "macs2_consensus_fc"
        description: "Fold enrichment of the most strongly accessible consensus intervals, one numeric column per merged library"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "macs2/consensus_fc.py"
            source_overrides:
              boolean:
                glob_pattern: "**/consensus_peaks.mLb.clN.boolean.txt"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "peak_id": "<consensus set>:<interval id>"
              "consensus_set": "Which consensus table the interval came from"
              "interval_id": "Interval id inside that table"
              "chr": "Chromosome"
              "region": "chr:start-end, the heatmap row label"
              "support": "How many samples call the peak, kept categorical"

      # ----------------------------------------------------------------
      # DESeq2 QC on the consensus count matrix: the only DESeq2 output 2.x
      # still publishes. `deseq2_qc.r` writes the PCA and the sample
      # distances as plain text beside the `_mqc.tsv` copies MultiQC reads;
      # the overrides take the merged-library text files only. Optional:
      # the pipeline skips the step with `--skip_deseq2_qc`, and on a design
      # without replicated groups.
      # ----------------------------------------------------------------
      - data_collection_tag: "deseq2_qc_pca"
        optional: true
        description: "Principal components of the consensus count matrix, one row per library, with the variance each component explains"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            # The catalog recipe plus each sample's design group (the family
            # colour key), read off the <group>_REP<n> sample id.
            recipe: "nf-core/atacseq/deseq2_qc_pca.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample_id": "Library the point belongs to"
              "dim_1": "Coordinate on the first principal component"
              "dim_2": "Coordinate on the second principal component"
              "dim_1_percent": "Percent of the total variance the first component explains"
              "dim_2_percent": "Percent of the total variance the second component explains"
              "pca_set": "Which count matrix the components come from"
              "group": "Design group of the sample"

      - data_collection_tag: "deseq2_qc_sample_dists"
        optional: true  # same route condition as deseq2_qc_pca above
        description: "Euclidean distance between every pair of libraries on the consensus count matrix, as a square symmetric table"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "deseq2/qc_sample_dists.py"
            source_overrides:
              dists:
                glob_pattern: "**/merged_library/macs2/*/consensus/deseq2/*.sample.dists.txt"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              # The remaining columns are one per library of the run, so they
              # are named only at ingest, as in macs2_consensus_fc.
              "sample": "Library the row is centred on; every other column is one library of the run"

links:
  # The library sheet reaches the read-level MultiQC panels on its own key
  # (<sample>_T<n>), which is what the MultiQC tab's Library scope filter picks.
  - source_dc_tag: "samplesheet"
    source_column: "sample"
    target_dc_tag: "multiqc_data"
    target_type: "multiqc"
    link_config:
      resolver: "sample_mapping"
      target_field: "sample_name"
    description: "Filter the read-level MultiQC panels by the sequencing libraries picked in the left panel"
    enabled: true

  # Hub -> the collections that speak the short sample name.
  - source_dc_tag: "sample_design"
    source_column: "sample"
    target_dc_tag: "multiqc_data"
    target_type: "multiqc"
    link_config:
      resolver: "sample_mapping"
      target_field: "sample_name"
    description: "Filter the MultiQC panels by the samples picked in the left rail"
    enabled: true

  - source_dc_tag: "sample_design"
    source_column: "sample"
    target_dc_tag: "macs2_peak_summary"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the peak QC summary by the samples picked in the left rail"
    enabled: true

  - source_dc_tag: "sample_design"
    source_column: "sample"
    target_dc_tag: "ataqv_metrics"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the ataqv metric table by the samples picked in the left rail"
    enabled: true

  - source_dc_tag: "sample_design"
    source_column: "sample"
    target_dc_tag: "ataqv_fragment_length"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the fragment-length ladder by the samples picked in the left rail"
    enabled: true

  - source_dc_tag: "sample_design"
    source_column: "sample"
    target_dc_tag: "ataqv_tss_coverage"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the TSS coverage profiles by the samples picked in the left rail"
    enabled: true

  - source_dc_tag: "sample_design"
    source_column: "sample"
    target_dc_tag: "ataqv_chromosome_counts"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the read-distribution matrix by the samples picked in the left rail"
    enabled: true

  # Picard names the library after the duplicate-marked BAM, so the sample is
  # spelled into that name rather than matched as is.
  - source_dc_tag: "sample_design"
    source_column: "sample"
    target_dc_tag: "picard_markduplicates_metrics"
    target_type: "table"
    link_config:
      resolver: "pattern"
      pattern: "{sample}.mLb.mkD.sorted"
      target_field: "sample"
    description: "Filter the duplication metrics by the samples picked in the left rail"
    enabled: true

  # Signal-level QC, keyed on the canonical sample name like the ataqv collections.
  - source_dc_tag: "sample_design"
    source_column: "sample"
    target_dc_tag: "preseq_complexity_curve"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the complexity curves by the samples picked in the left rail"
    enabled: true

  - source_dc_tag: "sample_design"
    source_column: "sample"
    target_dc_tag: "deeptools_fingerprint_metrics"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the fingerprint metrics by the samples picked in the left rail"
    enabled: true

  - source_dc_tag: "sample_design"
    source_column: "sample"
    target_dc_tag: "deeptools_plot_profile"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the metagene profiles by the samples picked in the left rail"
    enabled: true

  # Hub -> the collections named after the merged library.
  - source_dc_tag: "sample_design"
    source_column: "merged_library"
    target_dc_tag: "macs2_broad_peaks"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the peak table by the samples picked in the left rail"
    enabled: true

  - source_dc_tag: "sample_design"
    source_column: "merged_library"
    target_dc_tag: "homer_annotated_peaks"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the peak annotation by the samples picked in the left rail"
    enabled: true

  - source_dc_tag: "sample_design"
    source_column: "merged_library"
    target_dc_tag: "homer_tss_distance_profile"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the TSS distance profiles by the samples picked in the left rail"
    enabled: true

  # Peak-level selection: pick peaks on the MACS2 panels, read their annotation.
  # Range filters on macs2_broad_peaks travel this link as a span, so the
  # q-value and width sliders and the locus navigator's position range reach
  # HOMER as the peaks they select (AT-D26 in the 1.2.2 report).
  - source_dc_tag: "macs2_broad_peaks"
    source_column: "peak_id"
    target_dc_tag: "homer_annotated_peaks"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "peak_id"
    description: "Carry a peak selected on the MACS2 panels over to its HOMER annotation"
    enabled: true

  - source_dc_tag: "homer_annotated_peaks"
    source_column: "peak_id"
    target_dc_tag: "macs2_broad_peaks"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "peak_id"
    description: "Carry a peak selected in the annotation table back to the MACS2 panels"
    enabled: true

  # Region links: the Locus tab's navigator (a genome_view on
  # macs2_broad_peaks) emits a chromosome and a position filter on its own
  # `chr` / `start` columns. These rename that pair onto the two collections
  # stacked under it, so the consensus intervals and the HOMER track clamp to
  # the same region. No data is read to resolve them (resolver: region).
  - source_dc_tag: "macs2_broad_peaks"
    source_column: "chr"
    target_dc_tag: "macs2_consensus_boolean"
    target_type: "table"
    link_config:
      resolver: "region"
      columns: {chrom: "chr", pos: "start"}
    description: "A region typed or brushed on the peak navigator narrows the consensus intervals"
    enabled: true

  - source_dc_tag: "macs2_broad_peaks"
    source_column: "chr"
    target_dc_tag: "homer_annotated_peaks"
    target_type: "table"
    link_config:
      resolver: "region"
      columns: {chrom: "chr", pos: "start"}
    description: "A region typed or brushed on the peak navigator narrows the HOMER annotation track"
    enabled: true

  # Consensus level: the interval the overlap matrix carries is the interval the
  # signal heatmap ranks.
  - source_dc_tag: "macs2_consensus_boolean"
    source_column: "peak_id"
    target_dc_tag: "macs2_consensus_fc"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "peak_id"
    description: "Carry a consensus interval selected on the overlap panels over to the signal heatmap"
    enabled: true

  - source_dc_tag: "macs2_consensus_fc"
    source_column: "peak_id"
    target_dc_tag: "macs2_consensus_boolean"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "peak_id"
    description: "Carry a consensus interval selected on the signal heatmap back to the overlap panels"
    enabled: true

  # The two DESeq2 QC collections are the only sample-keyed rows on the
  # consensus level, so these two links are what carries the left-rail sample
  # scope onto the Consensus tab's Sample space section.
  - source_dc_tag: "sample_design"
    source_column: "sample"
    target_dc_tag: "deseq2_qc_pca"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample_id"
    description: "Filter the consensus PCA by the samples picked in the left rail"
    enabled: true

  - source_dc_tag: "sample_design"
    source_column: "sample"
    target_dc_tag: "deseq2_qc_sample_dists"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the consensus distance matrix by the samples picked in the left rail"
    enabled: true
