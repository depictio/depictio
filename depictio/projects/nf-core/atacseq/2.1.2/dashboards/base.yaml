version: 1
# nf-core/atacseq 2.1.2, on the family rules of depictio/projects/nf-core/RULES.md
# (ampliseq/2.18.0 is the reference implementation). Rebuilt from the 1.2.2
# dashboard, whose tab groups, tab names, tags and KPI logic it keeps wherever
# the 2.x outputs allow, so a reader moving between the versions finds the same
# places.
#
# Funnel: library QC (the MultiQC report, the ataqv measures, the signal
# tables) -> the peaks each library yielded, where they land and what one
# region holds -> the consensus set across libraries and where the libraries
# sit on its counts. The design hub (`sample_design`) is what every filter
# starts from: the project links carry a pick to the MultiQC panels, the ataqv,
# deepTools and Picard tables, the peak calls, the HOMER annotation and the
# DESeq2 QC of the consensus counts.
#
# What 2.x lost: the DESeq2 contrasts (removed in 2.0), so there is no
# Differential accessibility tab. Its PCA and distance tiles survive in the
# Consensus tab's Sample space section, under their 1.2.2 tags; the Overview's
# fourth figure is the fragment ladder of the ATAC quality tab instead of the
# volcano.
#
# Two MultiQC reports: the pipeline's own (MultiQC 1.31 or later swapped in,
# numbered module ids) or one reprocessed from a 1.13 run (plain module ids).
# The MultiQC tab binds what both carry under one id, gives the fingerprint and
# the insert sizes a same-slot alternate per report, and keeps the general
# statistics, featureCounts and ataqv tiles that only a reprocessed report
# carries; the import prunes the rest. There is no params.json: the Run
# parameters dialog lists the software versions, which is what the `params:`
# links search.
#
# Routes: preseq is off by default in 2.x, so its complexity curve sits in a
# collapsed section of the Signal tab that only a run with preseq keeps; the
# strip's complexity card reads Picard, which every route runs. The DESeq2 QC
# runs only when the design has replicated groups; the import drops the Sample
# space tiles with their data collections.
main_dashboard:
  title: nf-core/atacseq
  subtitle: Chromatin accessibility, from library quality to the peaks the libraries agree on
  project_tag: ATAC-seq Chromatin Accessibility
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family. atacseq has no
  # GROUP_COL: the design group is the hub's own `group` column.
  category_colors:
    group: auto
    # HOMER's coarse feature classes, written out so a class keeps its colour
    # on the annotation bars, the donut cards and the gene track.
    annotation_class:
      '*': auto
      promoter-TSS: '#d6336c'
      "5' UTR": '#ae3ec9'
      exon: '#7048e8'
      intron: '#1c7ed6'
      "3' UTR": '#1098ad'
      TTS: '#0ca678'
      non-coding: '#74b816'
      Intergenic: '#f59f00'
    # The two windows ataqv counts (Metrics.cpp l.907 and l.911), then the rest.
    fragment_class:
      short (50-100 bp): '#1098ad'
      mononucleosomal (150-200 bp): '#7048e8'
      outside ataqv windows: '#adb5bd'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. All
  # three are bound to the design hub, the source of every sample link in
  # template.yaml.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  - name: QC thresholds
    icon: mdi:tune
    color: cyan
    description: Signal and yield floors on the per-library QC tables
    collapsed: true
    persistent: true
    pin: bottom
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab, which no route removes.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The design behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The per-library peak QC rows behind the tiles
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Samples, below).
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: sample_design
    interactive_component_type: MultiSelect
    column_name: group
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: Group
    section: Key figures
    tag: at-ov-kf-group
    index: ov-kf-group
    title: Group
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: sample_design
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: at-ov-kf-sample
    index: ov-kf-sample
    title: Sample
    layout: {x: 2, y: 0, w: 2, h: 1}
  # The pipeline's wordmark, read from its repository; where it cannot load (no
  # internet), the title is drawn as text.
  - component_type: text
    title: nf-core/atacseq
    logo: https://raw.githubusercontent.com/nf-core/atacseq/master/docs/images/nf-core-atacseq_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/atacseq/master/docs/images/nf-core-atacseq_logo_dark.png
    order: 1
    body: >
      Chromatin accessibility from ATAC-seq reads: how well each library worked, the
      peaks it yielded and the regions the libraries agree on.
      [Run parameters](params:)
    tag: at-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    surface: card
    values:
      samples: {dc: sample_design, column: sample, aggregation: nunique, format: integer}
      groups: {dc: sample_design, column: group, aggregation: nunique, format: integer}
      reps: {dc: sample_design, column: replicate, aggregation: max, format: integer}
      libraries: {dc: sample_design, column: n_libraries, aggregation: sum, format: integer}
      reads: {dc: sample_design, column: read_type, aggregation: top}
      controls: {dc: sample_design, column: role, aggregation: count, filter_expr: "col('role') == 'control'", format: integer}
    body: |
      ### The study
      - ![](icon:mdi:flask-outline) **Samples** {{samples}} in {{groups}} groups
      - ![](icon:mdi:content-copy) **Replicates** up to {{reps}} per group
      - ![](icon:mdi:test-tube) **Libraries** {{libraries}} sequenced, merged per sample
      - ![](icon:mdi:swap-horizontal) **Reads** {{reads}}
      - ![](icon:mdi:shield-check-outline) **Controls** {{controls}} samples serve as the input control of another
      - ![](icon:mdi:file-table-outline) **Samplesheet** [one row per sample](section:Sample sheet), its path in [the run parameters](params:input)
      - ![](icon:mdi:palette-outline) **Group** {{legend:group}}
    tag: at-ov-study
    index: ov-study
    layout: {x: 0, y: 1, w: 5, h: 6}
  # The run's own facts: the pipeline and its version, the aligner the run
  # recorded, the genome from the GENOME template variable and the peaks its
  # libraries yielded.
  - component_type: text
    surface: card
    values:
      peaks: {dc: macs2_peak_summary, column: num_peaks, aggregation: sum, format: si}
    body: |
      ### The run
      - ![](icon:mdi:source-branch) **Pipeline** nf-core/atacseq 2.1.2
      - ![](icon:mdi:dna) **Genome** {GENOME}
      - ![](icon:mdi:chart-scatter-plot) **Peaks** {{peaks}} broad calls
      - ![](icon:mdi:tune) [All parameters and tool versions](params:)
    tag: at-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 6}
  # The marks take the family's colour (the header's), not the theme's blue.
  # A `params:` link searches the software versions the run recorded.
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Five steps from reads to the consensus peak set
      Each step names the tool version it ran and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:content-cut) **Trim** Adapters cut by Trim Galore · [Version](params:trimgalore) · [MultiQC](tab:MultiQC)
      2. ![](icon:mdi:dna) **Align** Reads aligned, duplicates marked by Picard, poor alignments filtered · [Version](params:picard) · [ATAC quality](tab:ATAC quality)
      3. ![](icon:mdi:chart-scatter-plot) **Call** MACS2 broad peaks per library · [Version](params:macs2) · [Peaks](tab:Peaks)
      4. ![](icon:mdi:tag-outline) **Annotate** HOMER, the nearest gene of each peak · [Version](params:homer) · [Annotation](tab:Annotation)
      5. ![](icon:mdi:set-merge) **Merge** One consensus set across libraries, then DESeq2 QC of its counts · [Version](params:consensus) · [Consensus](tab:Consensus)
      :::
    tag: at-ov-steps
    index: ov-steps
    layout: {x: 0, y: 7, w: 8, h: 3}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/atacseq aligns ATAC-seq reads, filters them, calls the accessible regions of each library with MACS2 and merges them into one consensus set. This page sums up one run; each tab behind it answers one question, in the order of the steps above.

      The sample filters in the left panel apply to every tab: narrow the samples once and the whole dashboard follows. A bar above a section narrows that section only.
    tag: at-ov-about
    index: ov-about
    layout: {x: 0, y: 10, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it.
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: sample_design
    aggregation: count
    column_name: sample
    column_type: object
    secondary_layout: composition
    breakdown_col: group
    display:
      icon_name: mdi:flask-outline
      icon_color: orange
      caption: in the design, by group
      link: tab:MultiQC
    section: Key figures
    tag: at-ov-kf-samples
    index: ov-kf-samples
    title: Samples
    description: Samples in the design, one per merged library. The bar splits them by group.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: macs2_peak_summary
    use: macs2/peak_summary
    aggregation: sum
    column_name: num_peaks
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-scatter-plot
      icon_color: indigo
      caption: peaks per library, with their spread
      link: tab:Peaks
      format: si
    section: Key figures
    tag: at-ov-kf-peaks
    index: ov-kf-peaks
    title: Peaks called
    description: MACS2 broad peaks over the libraries in view. The box shows how many each library yielded.
    layout: {x: 2, y: 0, w: 2, h: 2}
  # The consensus set stands in for the 1.2.2 differential calls: 2.x
  # publishes no contrast. The strip counts the intervals two libraries or
  # more call, the reproducible set.
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    aggregation: count
    column_name: num_samples
    column_type: int64
    secondary_layout: threshold
    threshold_value: 2
    threshold_direction: min
    display:
      icon_name: mdi:set-merge
      icon_color: violet
      caption: intervals; the strip, called by two libraries or more
      link: tab:Consensus
      format: si
    section: Key figures
    tag: at-ov-kf-consensus
    index: ov-kf-consensus
    title: Consensus intervals
    description: Intervals of the peak set merged across every library of the run. The strip counts those that at least two libraries call, the reproducible set, against the rest.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # frip_score is per library, so the median is of libraries, not of reads.
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: macs2_peak_summary
    use: macs2/peak_summary
    aggregation: median
    column_name: frip_score
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.3
    threshold_direction: min
    threshold_warn: 0.2
    display:
      icon_name: mdi:target
      icon_color: lime
      caption: median; ENCODE wants 30%, accepts 20%
      link: tab:MultiQC
      format: percent
    section: Key figures
    tag: at-ov-kf-frip
    index: ov-kf-frip
    title: FRiP
    description: Median fraction of each library's reads falling inside its called peaks, the ATAC signal-to-noise. The strip counts the libraries at the ENCODE target (30%), in the acceptable band (20%) and below it.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the group, then the chromosome of the peak calls.
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: sample_design
    interactive_component_type: MultiSelect
    column_name: group
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: Group
    section: Findings
    tag: at-ov-findings-group
    index: ov-findings-group
    title: Group
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: macs2_broad_peaks
    interactive_component_type: MultiSelect
    column_name: chr
    column_type: object
    display:
      icon_name: mdi:chart-timeline-variant
      custom_color: indigo
      strip_label: Chromosome
    section: Findings
    tag: at-ov-findings-chr
    index: ov-findings-chr
    title: Chromosome
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data.
  - component_type: text
    surface: card
    values:
      fold: {dc: macs2_broad_peaks, column: fold_enrichment, aggregation: median, format: 'decimals:1'}
      top: {dc: homer_annotated_peaks, column: annotation_class, aggregation: top}
      top_share: {dc: homer_annotated_peaks, column: annotation_class, aggregation: top_share, format: percent}
      n_cons: {dc: macs2_consensus_boolean, column: peak_id, aggregation: count, format: integer}
      n_repro: {dc: macs2_consensus_boolean, column: peak_id, aggregation: count, filter_expr: col('num_samples') > 1,
        format: integer}
      frag_top: {dc: ataqv_fragment_length, column: fragment_class, aggregation: top, weight: read_count,
        filter_expr: col('fragment_class') != 'outside ataqv windows'}
      frag_share: {dc: ataqv_fragment_length, column: fragment_class, aggregation: top_share, weight: read_count,
        filter_expr: col('fragment_class') != 'outside ataqv windows', format: percent}
    body: |
      - **{{frag_share}}** of the reads in ataqv's two fragment windows (50 to 100 bp and 150 to 200 bp) are {{frag_top}} fragments – the larger window of the fragment ladder [ATAC quality](tab:ATAC quality)
      - **{{fold}}** median fold enrichment of the peaks over the local background – MACS2 broad calls [Peaks](tab:Peaks)
      - **{{top_share}}** of the peaks sit in the {{top}} class – the most common HOMER feature class [Annotation](tab:Annotation)
      - **{{n_repro}}** of {{n_cons}} consensus intervals are called by more than one library – the reproducible set [Consensus](tab:Consensus)
    section: Findings
    tag: at-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One figure per result row, in the order of the rows above. The tiles of a
  # row share a stored height. With the contrasts gone, the volcano's place
  # goes to the fragment ladder: the ATAC-specific check a reader looks at
  # first, from the ATAC quality tab.
  - component_type: highlight
    section: Findings
    source_tab: ATAC quality
    source_component: aq-ladder
    caption: Fraction of reads at each fragment length, one curve per library; a working library shows the nucleosome steps.
    hide_legend: true
    tag: at-ov-hl-ladder
    index: ov-hl-ladder
    layout: {x: 0, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Peaks
    source_component: pk-density
    caption: Peak calls per megabase along the genome, one row per library; brighter is more calls.
    tag: at-ov-hl-calls
    index: ov-hl-calls
    layout: {x: 4, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Annotation
    source_component: anno-tss-distance
    caption: Each library's peaks by distance to the nearest start site, one curve per library; the band is the HOMER promoter-TSS region (-1 kb to +100 bp).
    hide_legend: true
    tag: at-ov-hl-tss
    index: ov-hl-tss
    layout: {x: 0, y: 6, w: 4, h: 4}
  # The consensus UpSet draws one set per library, too many for a third of the
  # row: this summary counts the intervals by how many replicates of each group
  # call them, so the bars wear the group colours of the other tabs.
  - component_type: figure
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    visu_type: bar
    mode: code
    code_content: |-
      # Consensus intervals by how many replicates of each group call a peak on them. The per-library 0/1 columns are unpivoted and the group is the library name without its merge suffix and replicate, the design group of the other tabs. Intervals a group does not call are left out.
      libs = [c for c in df.columns if c.endswith('.mLb.clN')]
      long = df.select(['peak_id', *libs]).unpivot(index='peak_id', on=libs, variable_name='library', value_name='called')
      long = long.with_columns(pl.col('library').str.replace(r'\.mLb\.clN$', '').str.replace(r'_R(EP)?\d+$', '').alias('group'), pl.col('called').cast(pl.Int64))
      per = long.group_by(['group', 'peak_id']).agg(pl.col('called').sum().alias('replicates'))
      d = per.filter(pl.col('replicates') > 0).group_by(['group', 'replicates']).agg(pl.len().cast(pl.Int64).alias('intervals')).sort(['group', 'replicates'])
      fig = px.bar(d.to_pandas(), x='replicates', y='intervals', color='group', barmode='group', color_discrete_map=depictio_category_colors.get('group') or {}, labels={'replicates': 'Replicates of the group calling the interval', 'intervals': 'Consensus intervals', 'group': ''})
      fig.update_xaxes(dtick=1)
      fig.update_layout(margin=dict(t=10))
    title: Replicate agreement
    description: >-
      Do the replicates of a group call the same regions? One bar per group and per replicate count: the
      number of consensus intervals on which that many replicates of the group call a peak, in the
      group's colour. Intervals a group does not call at all are left out.

      How to read: a group whose bars sit mostly at its full replicate count has peaks its replicates
      reproduce, and bars piled at 1 are peaks only one replicate calls. Compare groups on their
      right-hand bars, since a group with more replicates reaches further along the axis. Open
      [Consensus](tab:Consensus) to see which libraries agree on an interval.

      Note: the group is the library name with its merge suffix and replicate number removed, and no
      cut-off is applied, so a group of a single replicate can only show a bar at 1.
    link: tab:Consensus
    caption: Consensus intervals by how many replicates of each group call a peak on them; the right-hand bars of a group are the intervals all its replicates agree on.
    section: Findings
    tag: at-ov-consensus-support
    index: ov-consensus-support
    layout: {x: 4, y: 6, w: 4, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers. A tab the run does not have is left out.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [ATAC quality](tab:ATAC quality)
      - [Signal](tab:Signal)

      ### Peak calls
      - [Peaks](tab:Peaks)
      - [Annotation](tab:Annotation)
      - [Locus](tab:Locus)

      ### Comparison
      - [Consensus](tab:Consensus)
    section: How to read this dashboard
    tag: at-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the group first.
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: sample_design
    interactive_component_type: MultiSelect
    column_name: group
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: at-filter-group
    index: sample-filters-group
    title: Group
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: sample_design
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: at-filter-sample
    index: sample-filters-sample
    title: Sample
    layout: {x: 0, y: 2, w: 1, h: 3}
  # The second factor of the design, on the categorical twin of `replicate`.
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: sample_design
    interactive_component_type: MultiSelect
    column_name: replicate_label
    column_type: object
    display:
      icon_name: mdi:content-duplicate
      custom_color: cyan
    section: Sample filters
    group: Sample scope
    tag: at-filter-replicate
    index: sample-filters-replicate
    title: Replicate
    layout: {x: 0, y: 5, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: tss_enrichment
    column_type: float64
    display:
      icon_name: mdi:target
      custom_color: lime
    section: QC thresholds
    group: Library quality
    tag: at-filter-tss
    index: qc-tss-range
    title: TSS enrichment
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: macs2_peak_summary
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: frip_score
    column_type: float64
    display:
      icon_name: mdi:magnet
      custom_color: yellow
    section: QC thresholds
    group: Library quality
    tag: at-filter-frip
    index: qc-frip-range
    title: FRiP score
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: macs2_peak_summary
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: num_peaks
    column_type: int64
    display:
      icon_name: mdi:counter
      custom_color: indigo
    section: QC thresholds
    group: Library quality
    tag: at-filter-peakcount
    index: qc-peakcount-range
    title: Peaks called
    layout: {x: 0, y: 6, w: 1, h: 3}
  # Row selection feeds the Analysis panel.
  - component_type: table
    workflow_tag: atacseq
    data_collection_tag: sample_design
    row_selection_enabled: true
    row_selection_column: sample
    section: Sample sheet
    tag: at-sample-sheet
    index: sample-sheet
    title: Sample sheet
    description: >-
      One row per sample of the design: its group, replicate, read type, role, control and the
      merged-library name the other tabs use.

      How to read: check here that each sample sits in the group you expect and that a control is assigned
      wherever the design has one, before reading a chart. The sample filters of the left panel narrow
      this table like the rest of the dashboard.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: atacseq
    data_collection_tag: macs2_peak_summary
    use: macs2/peak_summary
    row_selection_enabled: true
    row_selection_column: sample
    section: Reference tables
    tag: at-ref-table-summary
    index: ref-peak-summary
    title: Peak QC summary
    description: >-
      One row per library: the number of peaks MACS2 called, the FRiP score, the spread of peak width
      (median, mean, widest) and of fold enrichment (median, mean), and the median -log10 p-value and
      q-value of its calls.

      How to read: sort by FRiP score to find libraries with a weak signal-to-noise, and by peak count to
      find a library that calls far fewer or far more peaks than its replicates. No cut-off is applied
      here, so read each library against the others of its group.

      Source: FRiP, the fraction of all mapped reads that fall into the called peak regions, as the ENCODE
      data standards define it, https://www.encodeproject.org/data-standards/terms/
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
# ============================================================================
# Data & QC
# ============================================================================
- title: MultiQC
  subtitle: Did sequencing, alignment and filtering work for every library?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  grid_sections:
  - name: Run summary
    icon: mdi:view-dashboard-outline
    color: orange
    description: Every module's headline numbers, one row per library
  - name: Reads and alignment
    icon: mdi:chart-bar
    color: orange
    description: Reads sequenced per library, and the share that mapped before and after filtering
  - name: Enrichment
    icon: mdi:chart-line
    color: orange
    description: How concentrated the reads are, and how much of them falls in peaks
  - name: QC details
    icon: mdi:file-document-outline
    color: gray
    description: Read quality, trimming, insert sizes, duplication and mapping quality
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [MultiQC](https://multiqc.info) gathers what every tool of the run reported: FastQC
      and Trim Galore on the reads, samtools and Picard on the alignments, deepTools and
      MACS2 on the signal. Read whether each library yielded enough reads, how many
      mapped, and how much of its signal falls in peaks.
    tag: at-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: Run summary
    tag: at-mqc-general-stats
    title: General statistics
    description: >-
      MultiQC's general statistics table: one row per library and one column for each headline number a
      module contributed to the report, such as read counts, the mapped share, duplication and the median
      insert size.

      How to read: scan a column for the library that departs from the others of its group, then open the
      plot of the module that owns the column to see why. The columns depend on the modules the run
      carried, so a missing column means that tool did not run.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Counts
    section: Reads and alignment
    tag: at-mqc-fastqc-counts
    title: Sequence counts
    description: >-
      How many reads does each library hold? One stacked bar per library of FastQC's sequence count, split
      into unique and duplicate reads when FastQC reports them.

      How to read: libraries sequenced to a similar depth have bars of a similar length, and a much
      shorter bar is a library with little to work with. A large duplicate share in the raw reads is a
      first sign of low complexity, to compare with the duplication measured after alignment.

      Note: the duplicate share is an estimate. FastQC follows only the sequences first seen in the first
      100,000 of each file, and compares reads over 75 bp on their first 50 bp.

      Source: FastQC help, Duplicate Sequences,
      https://www.bioinformatics.babraham.ac.uk/projects/fastqc/Help/3%20Analysis%20Modules/8%20Duplicate%20Sequences.html
    layout: {x: 0, y: 0, w: 4, h: 4}
  # samtools reports the merged libraries before filtering (mLb.mkD) and after
  # it (mLb.clN) on a reprocessed report, so the gap between the two series is
  # what filtering removed; the pipeline's own report keeps them under
  # samtools-1 and samtools-2 and shows the sequencing libraries here.
  - component_type: multiqc
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Percent mapped
    section: Reads and alignment
    tag: at-mqc-samtools-mapped
    title: Reads mapped, before and after filtering
    description: >-
      How well did each library align? One stacked bar per library from samtools stats: reads mapped with a
      mapping quality above 0, reads mapped with quality 0, and unmapped reads. On a report reprocessed
      from an older run each merged library has two bars, before and after filtering, and the gap between
      them is what filtering removed.

      How to read: a bar made mostly of the first class is a library that aligned well. A large unmapped
      share can point to contamination, adapter sequence or poor read quality, and a large quality-0 share
      to reads that map to several places, such as repeats.

      Source: MultiQC samtools stats help text,
      https://github.com/MultiQC/MultiQC/blob/main/multiqc/modules/samtools/stats.py
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    use: multiqc/deeptools
    selected_module: deepTools
    selected_plot: Fingerprint plot
    section: Enrichment
    tag: at-mqc-fingerprint
    title: deepTools fingerprint
    description: >-
      Is the signal concentrated, as accessible chromatin should make it? One curve per library from
      deepTools plotFingerprint: genome bins ranked by read count (x, 0 to 1) against the cumulative read
      count as a fraction of the bin with the highest coverage (y).

      How to read: a library with evenly spread reads, such as an input, follows the diagonal. A library
      with its reads concentrated in few bins stays low and rises steeply at the far right, and the further
      it bends from the diagonal the stronger the enrichment. Compare libraries of one group, and open
      [Signal](tab:Signal) to rank them on the area under this curve.

      Lines and annotations: no reference line is drawn. The diagonal of a perfectly even library runs from
      the bottom left to the top right corner of the plot.

      Note: deepTools gives no numeric cut-off for a good or a bad curve, and notes that the plot is less
      clear the broader the enrichments are expected to be.

      Source: deepTools plotFingerprint documentation,
      https://deeptools.readthedocs.io/en/latest/content/tools/plotFingerprint.html
    layout: {x: 0, y: 0, w: 4, h: 4}
  # Same slot: the pipeline's own report names the module mlib_deeptools, a
  # reprocessed one deepTools. One run carries one of the two.
  - component_type: multiqc
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    use: multiqc/deeptools
    selected_module: mlib_deeptools
    selected_plot: Fingerprint plot
    section: Enrichment
    tag: at-mqc-fingerprint-mlib
    title: deepTools fingerprint
    description: >-
      Is the signal concentrated, as accessible chromatin should make it? One curve per library from
      deepTools plotFingerprint: genome bins ranked by read count (x, 0 to 1) against the cumulative read
      count as a fraction of the bin with the highest coverage (y).

      How to read: a library with evenly spread reads, such as an input, follows the diagonal. A library
      with its reads concentrated in few bins stays low and rises steeply at the far right, and the further
      it bends from the diagonal the stronger the enrichment. Compare libraries of one group, and open
      [Signal](tab:Signal) to rank them on the area under this curve.

      Lines and annotations: no reference line is drawn. The diagonal of a perfectly even library runs from
      the bottom left to the top right corner of the plot.

      Note: deepTools gives no numeric cut-off for a good or a bad curve, and notes that the plot is less
      clear the broader the enrichments are expected to be.

      Source: deepTools plotFingerprint documentation,
      https://deeptools.readthedocs.io/en/latest/content/tools/plotFingerprint.html
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    selected_module: mlib_frip_score
    selected_plot: mlib_frip_score-section
    section: Enrichment
    tag: at-mqc-frip
    title: FRiP score
    description: >-
      What share of each library's reads falls inside its called peaks? One bar per merged library: its
      FRiP score from 0 to 1, the fraction of all mapped reads that fall into the MACS2 called peak
      regions. A read counts when it overlaps a peak by at least 20%.

      How to read: a higher bar is a library with more of its reads in accessible regions, a better
      signal-to-noise. Compare a library with the others of its group, and open [ATAC quality](tab:ATAC quality)
      when one sits far below its replicates.

      Sources: nf-core/atacseq merged-library FRiP score header,
      https://github.com/nf-core/atacseq/blob/2.1.2/assets/multiqc/merged_library_frip_score_header.txt;
      ENCODE data standards terms, https://www.encodeproject.org/data-standards/terms/
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    selected_module: mlib_peak_count
    selected_plot: mlib_peak_count-section
    section: Enrichment
    tag: at-mqc-peakcount
    title: Peaks per library
    description: >-
      How many peaks did MACS2 call in each library? One bar per merged library: the total number of peaks
      called.

      How to read: replicates of a group should call peak numbers of the same order. The count depends on
      sequencing depth and on the caller's settings, so read a low count together with the FRiP score
      before calling a library a failure. On a default run these are broad calls, regions rather than
      summits.

      Source: nf-core/atacseq merged-library peak count header,
      https://github.com/nf-core/atacseq/blob/2.1.2/assets/multiqc/merged_library_peak_count_header.txt
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    use: multiqc/featurecounts
    selected_module: featurecounts
    selected_plot: Assignments
    section: Enrichment
    tag: at-mqc-featurecounts
    title: Reads assigned to consensus peaks
    description: >-
      How many reads fall in the consensus peaks? One stacked bar per library from featureCounts: the
      reads assigned to a consensus interval and the unassigned reads, each reason for not being assigned
      in its own colour.

      How to read: a larger assigned share means more of the library's reads sit inside the merged peak
      set. Compare a library with the others of its group, since one with a much smaller assigned share has
      reads outside the regions its peers share.

      Note: this counts reads against the merged intervals, so it is not the FRiP score, which uses the
      library's own peaks.
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    section: QC details
    tag: at-mqc-fastqc-quality
    title: Per-base sequence quality
    description: >-
      How good is the base calling along the reads? One line per library: the mean Phred quality at each
      position of the read, as FastQC reports it.

      How to read: a line that stays in the green band is high quality, and a dip into the orange band
      towards the end of a read is common on most platforms. A line in the red band marks poor calls. The
      line's own colour is FastQC's verdict for the library: green pass, orange warn, red fail.

      Lines and annotations: the background has three bands on the Phred scale, green from 28 up, orange
      from 20 to 28 and red below 20, drawn by MultiQC behind the FastQC plot. FastQC itself warns when the
      lower quartile of any base is below 10 or its median below 25, and fails below 5 and 20, which the
      mean line alone does not show.

      Sources: FastQC help, Per Base Sequence Quality,
      https://www.bioinformatics.babraham.ac.uk/projects/fastqc/Help/3%20Analysis%20Modules/2%20Per%20Base%20Sequence%20Quality.html;
      MultiQC FastQC module, https://github.com/MultiQC/MultiQC/blob/main/multiqc/modules/fastqc/fastqc.py
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    use: multiqc/cutadapt
    selected_module: cutadapt
    selected_plot: Filtered Reads
    section: QC details
    tag: at-mqc-cutadapt
    title: Reads kept after trimming
    description: >-
      Did trimming keep the reads? One stacked bar per library from Cutadapt, run by Trim Galore: the reads
      (or pairs) passing the filters, and those removed as too short, too long, with too many N or for an
      unexplained reason.

      How to read: nearly the whole bar should be the passing class. A large share removed as too short
      means many reads were left shorter than the minimum length once the adapter was cut, so compare it
      with the others of its group.
    layout: {x: 4, y: 0, w: 4, h: 4}
  # The Picard insert sizes are the nucleosome ladder; the ATAC quality tab
  # draws the same ladder from ataqv, with its windows marked. A reprocessed
  # report keeps them under picard, the pipeline's own under picard-1: two
  # tiles on one slot, of which a run keeps one.
  - component_type: multiqc
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    use: multiqc/picard
    selected_module: picard
    selected_plot: Insert Size
    section: QC details
    tag: at-mqc-picard-insert
    title: Insert size distribution
    description: >-
      What fragment sizes did each library capture? One line per library from Picard's insert size
      metrics: the number of reads at each insert size in bp, with the reads of all orientations summed.

      How to read: an ATAC library shows a sharp peak of short fragments from open chromatin, then smaller
      bumps at one and two nucleosome lengths, the nucleosome ladder. A library without the short peak, or
      whose curve decays smoothly, has lost that pattern. Open [ATAC quality](tab:ATAC quality) to read the same
      ladder with its windows marked.

      Source: MultiQC ataqv help, which lists the nucleosome-free peak near 50-100 bp, the mono-nucleosome
      peak near 180-247 bp and the di-nucleosome peak near 350-430 bp,
      https://github.com/MultiQC/MultiQC/blob/main/multiqc/modules/ataqv/ataqv.py
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    use: multiqc/picard
    selected_module: picard-1
    selected_plot: Insert Size
    section: QC details
    tag: at-mqc-picard-insert-1
    title: Insert size distribution
    description: >-
      What fragment sizes did each library capture? One line per library from Picard's insert size
      metrics: the number of reads at each insert size in bp, with the reads of all orientations summed.

      How to read: an ATAC library shows a sharp peak of short fragments from open chromatin, then smaller
      bumps at one and two nucleosome lengths, the nucleosome ladder. A library without the short peak, or
      whose curve decays smoothly, has lost that pattern. Open [ATAC quality](tab:ATAC quality) to read the same
      ladder with its windows marked.

      Source: MultiQC ataqv help, which lists the nucleosome-free peak near 50-100 bp, the mono-nucleosome
      peak near 180-247 bp and the di-nucleosome peak near 350-430 bp,
      https://github.com/MultiQC/MultiQC/blob/main/multiqc/modules/ataqv/ataqv.py
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    use: multiqc/picard
    selected_module: picard
    selected_plot: Mark Duplicates
    section: QC details
    tag: at-mqc-picard-dups
    title: Duplicate reads
    description: >-
      How many reads are copies of another? One stacked bar per library from Picard MarkDuplicates: unique
      pairs, unique unpaired reads, duplicate pairs split into optical and non-optical, duplicate unpaired
      reads and unmapped reads. Pair counts are doubled so that the bars add up to reads.

      How to read: a bar made mostly of unique reads is a library that holds many distinct fragments. A
      large duplicate share means the same molecules were read again, so deeper sequencing adds little.

      Source: Picard metric definitions, DuplicationMetrics,
      https://broadinstitute.github.io/picard/picard-metric-definitions.html
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Mapped reads per contig
    section: QC details
    tag: at-mqc-samtools-contig
    title: Mapped reads per contig
    description: >-
      Where do the mapped reads land? One line per library across the contigs, as a share of the library's
      mapped reads, from samtools idxstats in MultiQC's default view.

      How to read: libraries of one group should follow the same profile, and a contig that holds a much
      larger share in one library than in its peers stands out. The mitochondrial contig is the usual
      case in ATAC, since reads there do not count towards the usable autosomal alignments ataqv scores.

      Note: MultiQC leaves out contigs that hold less than 0.1% of the aligned reads, its default cutoff
      unless the report changed it.

      Source: MultiQC samtools idxstats module,
      https://github.com/MultiQC/MultiQC/blob/main/multiqc/modules/samtools/idxstats.py
    layout: {x: 0, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: atacseq
    data_collection_tag: multiqc_data
    use: multiqc/ataqv
    selected_module: ataqv
    selected_plot: Mapping Quality Distribution
    section: QC details
    tag: at-mqc-ataqv-mapq
    title: Mapping quality distribution
    description: >-
      How confident are the alignments? One line per library from ataqv: the number of reads at each
      mapping quality (MAPQ) score, on a log count axis by default.

      How to read: most reads should sit at high MAPQ scores, which mark unique, confident alignments. A
      mass of reads at MAPQ 0 means reads that map equally well to several places. Compare libraries of one
      group, which should show the same shape.

      Source: MultiQC ataqv module help,
      https://github.com/MultiQC/MultiQC/blob/main/multiqc/modules/ataqv/ataqv.py
    layout: {x: 4, y: 8, w: 4, h: 4}
- title: ATAC quality
  subtitle: Did transposition work, library by library?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:target
  tab_icon_color: lime
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: ATAC quality filters
    icon: mdi:filter-variant
    color: lime
    description: Which part of the fragment ladder and which reference sequences to read
  grid_sections:
  - name: Library quality at a glance
    icon: mdi:counter
    color: lime
    description: The ataqv numbers a library is accepted or rejected on
  - name: Signal at start sites
    icon: mdi:chart-line
    color: lime
    description: The coverage spike at start sites, and each library's signal against specificity
  - name: Fragment ladder
    icon: mdi:ruler
    color: lime
    description: Whether transposition produced a nucleosome ladder, library by library
  - name: Read distribution
    icon: mdi:chart-bar
    color: lime
    description: How each library's reads spread over the reference sequences
  - name: ATAC quality table
    icon: mdi:table
    color: gray
    description: Every ataqv metric for every library
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [ataqv](https://github.com/ParkerLab/ataqv) reads each filtered alignment against
      its peaks and the start sites of the genes; the cards are the numbers a library is
      accepted or rejected on. A good library shows a sharp spike of coverage at start
      sites and a nucleosome ladder in its fragment lengths. The matrix at the bottom
      spots a reference sequence carrying an outsized share of the reads.
    tag: at-aq-intro
    index: aq-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: ataqv_fragment_length
    interactive_component_type: MultiSelect
    column_name: fragment_class
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: grape
    section: ATAC quality filters
    group: Fragments
    tag: at-aq-filter-class
    index: aq-class-filter
    title: Fragment class
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: ataqv_fragment_length
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: fragment_length
    column_type: int64
    display:
      icon_name: mdi:ruler
      custom_color: orange
    section: ATAC quality filters
    group: Fragments
    tag: at-aq-filter-length
    index: aq-length-range
    title: Fragment length
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: ataqv_chromosome_counts
    interactive_component_type: MultiSelect
    column_name: chromosome
    column_type: object
    display:
      icon_name: mdi:chart-timeline-variant
      custom_color: indigo
    section: ATAC quality filters
    group: Reference sequences
    tag: at-aq-filter-chrom
    index: aq-chrom-filter
    title: Reference sequence
    layout: {x: 0, y: 5, w: 1, h: 3}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    use: ataqv/metrics
    aggregation: median
    column_name: tss_enrichment
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:target
      icon_color: lime
      caption: median, with its spread
      decimals: 1
    section: Library quality at a glance
    tag: at-aq-card-tss
    index: aq-card-tss
    title: TSS enrichment
    description: Coverage at start sites over the flanking background, the headline ATAC quality score.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    use: ataqv/metrics
    aggregation: min
    column_name: hqaa_overlapping_peaks_percent
    column_type: float64
    secondary_layout: threshold
    threshold_value: 20
    threshold_direction: min
    threshold_warn: 10
    display:
      icon_name: mdi:magnet
      icon_color: orange
      caption: lowest library; 20% is the usual floor
      decimals: 1
    section: Library quality at a glance
    tag: at-aq-card-inpeaks
    index: aq-card-inpeaks
    title: Reads in peaks (%)
    description: The lowest share of usable reads inside peaks among the libraries in view.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    use: ataqv/metrics
    aggregation: median
    column_name: mitochondrial_fraction
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:bacteria-outline
      icon_color: cyan
      caption: median, with its spread
      format: percent
    section: Library quality at a glance
    tag: at-aq-card-mito
    index: aq-card-mito
    title: Mitochondrial fraction
    description: Median share of reads on the mitochondrial contig, the classic ATAC waste.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    use: ataqv/metrics
    aggregation: median
    column_name: duplicate_fraction
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:content-duplicate
      icon_color: grape
      caption: median, with its distribution
      format: percent
    section: Library quality at a glance
    tag: at-aq-card-dups
    index: aq-card-dups
    title: Duplicate fraction
    description: Median share of duplicate reads per library.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: atacseq
    data_collection_tag: ataqv_tss_coverage
    use: ataqv/tss_coverage
    visu_type: line
    mode: code
    code_content: |-
      # Aggregate coverage around every start site, one curve per library: Analysis
      # mode's groups colour the curves when it has some, line_group keeps one each.
      d = df.sort(['sample', 'position'])
      color_col = depictio_group_by[0] if depictio_group_by and depictio_group_by[0] in d.columns else 'sample'
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get(color_col) or {}
      fig = px.line(d.to_pandas(), x='position', y='coverage', color=color_col, line_group='sample', color_discrete_map=colors, hover_name='sample', labels={'position': 'Distance from the start site (bp)', 'coverage': 'Aggregate coverage', color_col: ''})
      fig.add_vline(x=0, line_dash='dot', line_color='grey')
      fig.update_layout(margin=dict(t=10))
    section: Signal at start sites
    tag: at-aq-tss-coverage
    index: aq-tss-coverage
    title: Coverage around start sites
    description: >-
      Does transposition concentrate at gene starts? One curve per library: the aggregate read coverage in
      a window around every transcription start site, with the start site at 0 on the x axis. Curves are
      coloured per library, or per group when Analysis mode groups the samples.

      How to read: a sharp central spike over low flanks is a well transposed library, and the TSS
      enrichment score ataqv reports summarises that height over the flanking background. A flat line is a
      library without enrichment at start sites. Replicates of a group should share the shape.

      Lines and annotations: the dotted grey vertical line at 0 marks the start site the profiles are
      centred on. No cut-off is drawn.

      Source: ataqv, which scores TSS enrichment according to the ENCODE data standards,
      https://github.com/ParkerLab/ataqv
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    use: ataqv/metrics
    visu_type: scatter
    mode: code
    code_content: |-
      # Signal (TSS enrichment) against specificity (usable reads inside peaks); point
      # size is the peak count. custom_data stays on the library, what a lasso returns.
      d = df.with_columns(pl.col('total_peaks').cast(pl.Float64).alias('peak_count'))
      color_col = depictio_group_by[0] if depictio_group_by and depictio_group_by[0] in d.columns else 'sample'
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get(color_col) or {}
      fig = px.scatter(d.to_pandas(), x='tss_enrichment', y='hqaa_overlapping_peaks_percent', color=color_col, color_discrete_map=colors, size='peak_count', size_max=32, hover_name='sample', custom_data=['sample'], labels={'tss_enrichment': 'TSS enrichment', 'hqaa_overlapping_peaks_percent': 'Usable reads in peaks (%)', 'peak_count': 'Peaks', color_col: ''})
      fig.update_layout(margin=dict(t=10))
    selection_enabled: true
    selection_column: sample
    section: Signal at start sites
    tag: at-aq-quality-scatter
    index: aq-quality-scatter
    title: Signal against specificity
    description: >-
      Which libraries combine signal and specificity? One point per library: its TSS enrichment on the x
      axis, the share of usable reads that fall inside peaks on the y axis (usable reads are ataqv's
      high-quality autosomal alignments), and the peak count as the point size. Points are coloured per
      library, or per group when Analysis mode groups the samples.

      How to read: up and to the right is better, a library with both enrichment at start sites and a
      large share of its reads inside peaks. A library low on either axis against its group is the one to
      open in the ATAC quality table. Lasso or click points to select libraries.

      Note: no reference line or zone is drawn, so the plot ranks libraries against each other and does
      not pass or fail them.

      Source: ataqv, https://github.com/ParkerLab/ataqv
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    use: ataqv/metrics
    aggregation: median
    column_name: median_fragment_length
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: blue
      caption: median bp, with its spread
      decimals: 0
    section: Fragment ladder
    tag: at-aq-card-fraglen
    index: aq-card-fraglen
    title: Fragment length
    description: Median fragment length of the libraries in view.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: ataqv_fragment_length
    use: ataqv/fragment_length
    aggregation: sum
    column_name: read_count
    column_type: int64
    secondary_layout: donut
    breakdown_col: fragment_class
    display:
      icon_name: mdi:chart-donut
      icon_color: violet
      caption: reads, by ataqv fragment window
    section: Fragment ladder
    tag: at-aq-card-windows
    index: aq-card-windows
    title: Reads by fragment window
    description: >-
      How many reads fall in each of the two fragment windows ataqv counts? A donut of the reads of the
      libraries in view: fragments of 50 to 100 bp, fragments of 150 to 200 bp, and all other lengths.

      Source: ataqv counting windows, 50 to 100 bp and 150 to 200 bp,
      https://github.com/ParkerLab/ataqv/blob/master/src/cpp/Metrics.cpp (lines 907 and 911)
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    use: ataqv/metrics
    aggregation: median
    column_name: short_mononucleosomal_ratio
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:scale-balance
      icon_color: pink
      caption: median, with its distribution
      decimals: 2
    section: Fragment ladder
    tag: at-aq-card-shortmono
    index: aq-card-shortmono
    title: Short to mononucleosomal
    description: Median ratio of usable reads of 50 to 100 bp to usable reads of 150 to 200 bp, ataqv's short_mononucleosomal_ratio (https://github.com/ParkerLab/ataqv/blob/master/src/cpp/Metrics.cpp, lines 907 and 911).
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    use: ataqv/metrics
    aggregation: median
    column_name: properly_paired_fraction
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:vector-link
      icon_color: teal
      caption: median, with its spread
      format: percent
    section: Fragment ladder
    tag: at-aq-card-paired
    index: aq-card-paired
    title: Properly paired
    description: Median share of reads mapped as proper pairs.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: atacseq
    data_collection_tag: ataqv_fragment_length
    use: ataqv/fragment_length
    visu_type: line
    mode: code
    code_content: |-
      # The informative part of the ladder: the histogram runs to 1000 bp, but the
      # tail past 800 bp is empty. One curve per library, the two windows ataqv counts
      # shaded (Metrics.cpp l.907: 50-100 bp, l.911: 150-200 bp, both ends inclusive).
      d = df.filter(pl.col('fragment_length') <= 800).sort(['sample', 'fragment_length'])
      color_col = depictio_group_by[0] if depictio_group_by and depictio_group_by[0] in d.columns else 'sample'
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get(color_col) or {}
      fig = px.line(d.to_pandas(), x='fragment_length', y='fraction_of_all_reads', color=color_col, line_group='sample', color_discrete_map=colors, hover_name='sample', labels={'fragment_length': 'Fragment length (bp)', 'fraction_of_all_reads': 'Fraction of all reads', color_col: ''})
      for start, end, label in ((50, 100, '50-100 bp'), (150, 200, '150-200 bp')):
          fig.add_vrect(x0=start, x1=end, fillcolor='grey', opacity=0.10, line_width=0, annotation_text=label, annotation_position='top left')
      fig.update_layout(margin=dict(t=10))
    section: Fragment ladder
    tag: at-aq-ladder
    index: aq-ladder
    title: Fragment length distribution
    description: >-
      Do the fragments show a nucleosome ladder? One curve per library: the fraction of all reads at each
      fragment length, from 0 to 800 bp. Curves are coloured per library, or per group when Analysis mode
      groups the samples.

      How to read: a working library shows a high peak of short fragments, then smaller bumps near one
      and two nucleosome lengths. A curve without the short peak or without the bumps has lost the
      nucleosome pattern. Replicates of a group should overlay.

      Lines and annotations: two grey bands are shaded and labelled with the two windows ataqv counts
      for its short to mononucleosomal ratio, 50 to 100 bp and 150 to 200 bp. They are fixed references
      taken from ataqv's source, not read from the run. No pass or fail cut-off is drawn: ataqv publishes
      none for the ladder.

      Sources: ataqv counting windows (hqaa_short_count at 50 to 100 bp, hqaa_mononucleosomal_count at
      150 to 200 bp), https://github.com/ParkerLab/ataqv/blob/master/src/cpp/Metrics.cpp (lines 907
      and 911); MultiQC ataqv help for the typical positions of the peaks, which it gives as
      near 50-100 bp, 180-247 bp and 350-430 bp,
      https://github.com/MultiQC/MultiQC/blob/main/multiqc/modules/ataqv/ataqv.py
    layout: {x: 0, y: 2, w: 5, h: 4}
  - component_type: figure
    workflow_tag: atacseq
    data_collection_tag: ataqv_fragment_length
    use: ataqv/fragment_length
    visu_type: bar
    dict_kwargs:
      x: sample
      y: read_count
      color: fragment_class
      labels: {sample: '', read_count: Reads, fragment_class: Fragment class}
    section: Fragment ladder
    tag: at-aq-class-bar
    index: aq-class-bar
    title: Reads per fragment class
    description: >-
      How does each library split across the fragment windows ataqv counts? One stacked bar per library:
      its reads with a fragment of 50 to 100 bp, of 150 to 200 bp, and of any other length, each in its own
      colour.

      How to read: replicates of a group should split alike. A library with a much smaller 50 to 100 bp
      share than its peers lacks the short fragments that open chromatin gives. Bars are in read counts,
      so compare the colour shares and read the bar length as depth.

      Note: only the two windows are ataqv's own; it defines no other fragment class, so everything else
      is grouped as outside them. The windows are fixed references, not read from the run, and no pass or
      fail cut-off is drawn.

      Source: ataqv counting windows, 50 to 100 bp and 150 to 200 bp,
      https://github.com/ParkerLab/ataqv/blob/master/src/cpp/Metrics.cpp (lines 907 and 911)
    layout: {x: 5, y: 2, w: 3, h: 4}
  - component_type: figure
    workflow_tag: atacseq
    data_collection_tag: ataqv_chromosome_counts
    use: ataqv/read_distribution
    visu_type: heatmap
    mode: code
    code_content: |-
      # Each library's share of reads on every sequence against the median share of the libraries in view (log2), sequences in karyotype order. Red is a sequence a library over-reads against its peers, blue one it under-reads; a library alone in view shows its plain share.
      c = pl.col('chromosome').str.replace('^chr', '')
      rk = pl.when(c.str.contains('^[0-9]+$')).then(c.cast(pl.Int64, strict=False)).when(c == 'X').then(1001).when(c == 'Y').then(1002).when(c.is_in(['M', 'MT'])).then(1003).otherwise(2000)
      d = df.with_columns(rk.alias('rk'), (pl.col('fraction_of_reads') * 100).alias('pct'))
      d = d.with_columns(pl.col('pct').median().over('chromosome').alias('expected'))
      d = d.with_columns(((pl.col('pct') + 0.001) / (pl.col('expected') + 0.001)).log(2.0).clip(-1.0, 1.0).alias('lr'))
      chroms = d.select(['rk', 'chromosome']).unique().sort(['rk', 'chromosome']).get_column('chromosome').to_list()
      samples = sorted(d.get_column('sample').unique().to_list())
      grid = pl.DataFrame({'sample': [s for s in samples for k in chroms], 'chromosome': [ch for s in samples for ch in chroms]})
      full = grid.join(d.select(['sample', 'chromosome', 'pct', 'lr']), on=['sample', 'chromosome'], how='left').with_columns(pl.col('pct').fill_null(0.0), pl.col('lr').fill_null(0.0))
      share = full.get_column('pct').to_numpy().reshape(len(samples), len(chroms))
      ratio = full.get_column('lr').to_numpy().reshape(len(samples), len(chroms))
      peers = len(samples) > 1
      labels = [ch.replace('chr', '') for ch in chroms]
      fig = go.Figure(go.Heatmap(z=ratio if peers else share, x=labels, y=samples, customdata=share, xgap=1, ygap=1, colorscale='RdBu_r' if peers else 'Viridis', zmid=0 if peers else None, zmin=-1 if peers else 0, zmax=1 if peers else None, colorbar=dict(title='Against the median library' if peers else 'Share of reads (%)', tickmode='array', tickvals=[-1, -0.5, 0, 0.5, 1], ticktext=['2x fewer', '1.4x fewer', 'median', '1.4x more', '2x more']) if peers else dict(title='Share of reads (%)'), hovertemplate='<b>%{y}</b> on %{x}<br>%{customdata:.2f}% of its reads<extra></extra>'))
      fig.update_xaxes(type='category', tickangle=0, title='Reference sequence')
      fig.update_yaxes(autorange='reversed', automargin=True, title='')
      fig.update_layout(margin=dict(t=10))
    section: Read distribution
    tag: at-aq-read-distribution
    index: aq-read-distribution
    title: Reads per reference sequence
    description: >-
      Does any library over-read a reference sequence? One cell per library and reference sequence: the
      share of the library's reads on that sequence, shown against the median share of the libraries in
      view on a log2 scale. Sequences run in karyotype order: numbered chromosomes, then X, Y and the
      mitochondrial contig, then the others.

      How to read: a red cell is a sequence the library over-reads against its peers, a blue cell one it
      under-reads, and a pale cell is as expected. A library with a red cell where its replicates are pale
      has its reads concentrated on a sequence they are not. Hover a cell for the library's plain share of
      reads on it.

      Lines and annotations: the colour scale is centred on 0, the median library in view, and clipped at
      plus or minus 1, which is 2 times more or fewer reads than the median; the colour bar ticks mark 1.4
      and 2 times. It is a display aid to compare libraries, not a cut-off. With a single library in view
      the scale becomes its plain share of reads, in percent.

      Note: a sequence a library does not report is drawn as a neutral cell.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    use: ataqv/metrics
    row_selection_enabled: true
    row_selection_column: sample
    section: ATAC quality table
    tag: at-aq-table
    index: aq-table-metrics
    title: ATAC quality metrics
    description: >-
      One row per library with the ataqv numbers the dashboard reads: TSS enrichment, the share of usable
      reads inside peaks, the duplicate and mitochondrial fractions, fragment-length and mapping
      statistics, and the peak statistics.

      How to read: sort a column to find the library that departs from its group, then match it with the
      charts above. Usable reads are ataqv's high-quality autosomal alignments. No cut-off is applied to
      the table.

      Source: ataqv, https://github.com/ParkerLab/ataqv
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Signal
