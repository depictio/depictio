      in its own colour.

      How to read: libraries of one group should split alike, and accessible chromatin usually puts a
      large share of its peaks in the promoter-TSS class. A library whose split differs from its replicates
      deserves a look at its QC tiles. Switch to counts, sort the libraries or hide a class from the
      controls.

      Note: no cut-off is applied, and the class colours are the same everywhere in the dashboard.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: atacseq
    data_collection_tag: homer_tss_distance_profile
    use: homer/tss_distance
    config:
      reference_x: 0
      reference_label: TSS
      shaded_bands:
      - [-1000, 100, HOMER promoter-TSS]
      x_title: Distance to the nearest TSS (bp)
      y_title: Share of the library's peaks
      legend_pos: right
    section: Distance to the nearest TSS
    tag: at-anno-tss-distance
    index: anno-tss-distance
    title: Peaks around the nearest TSS
    description: >-
      Do the peaks sit at promoters? One curve per library: the share of its peaks (y) at each signed
      distance from the nearest transcription start site (x, in bp), counted in 250 bp bins across a 20 kb
      window centred on the site. Peaks further out are counted in the outermost bins.

      How to read: a sharp central spike means the peaks are promoter-bound, and a flat curve means they
      are spread over gene bodies and intergenic space. Replicates of a group should overlay, so a curve
      that differs from its group is a library worth checking.

      Lines and annotations: the vertical line at 0 marks the transcription start site. The shaded band
      from -1000 to +100 bp, labelled HOMER promoter-TSS, is the region HOMER annotatePeaks calls TSS by
      default. It is a fixed reference of the tile, not read from the run, and it is not symmetric: it
      reaches 1 kb upstream and 100 bp downstream of the site.

      Source: HOMER annotatePeaks, TSS defined by default from -1kb to +100bp,
      http://homer.ucsd.edu/homer/ngs/annotation.html
    layout: {x: 0, y: 0, w: 8, h: 6}
  # Master and detail: a picked row is the selection the record card follows.
  - component_type: table
    workflow_tag: atacseq
    data_collection_tag: homer_annotated_peaks
    use: homer/annotated_peaks
    row_selection_enabled: true
    row_selection_column: peak_id
    section: Peak annotation
    tag: at-anno-table
    index: anno-table
    title: HOMER peak annotation
    description: >-
      One row per annotated peak and library: its coordinates and the score the caller gave it, the HOMER
      feature class and full annotation, the signed distance to the nearest start site, the nearest
      promoter, and the name and type of the gene.

      How to read: narrow by feature class or distance to the start site in the left panel, and sort by
      score for the strongest peaks. The gene is the nearest one, not a proven target of the peak.

      Note: the gene type is empty when the run annotated against a plain GTF.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: atacseq
    data_collection_tag: homer_annotated_peaks
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: peak_id
      title_col: peak_id
      selection_source: any
      linked_component: at-anno-table
      sections:
        Call: [sample, chr, start, end, strand, peak_score]
        Annotation: [annotation_class, annotation, distance_to_tss, nearest_promoter_id, gene_name, gene_type]
      labels:
        distance_to_tss: Distance to TSS (bp)
        nearest_promoter_id: Nearest promoter
    section: Peak annotation
    tag: at-anno-record
    index: anno-record
    title: Peak record
    description: >-
      What is this one peak? The record of the call picked in the table beside it, in two groups: Call
      (library, chromosome, start, end, strand and score) and Annotation (feature class, full annotation,
      distance to the start site, nearest promoter, gene name and type).

      How to read: read the feature class together with the distance to the start site, and take the gene
      as the nearest one, not a proven target. Pick a row of the table to fill the card.

      Note: the strand is + on every row when the peaks come from MACS2, which calls peaks without a
      strand.
    layout: {x: 5, y: 0, w: 3, h: 5}
# The locus section: the broad calls and the run's own files on one genomic
# region. The navigator (a genome_view on macs2_broad_peaks) opens on the
# chromosome the browser shows and emits the chromosome and position filters; the
# two region links in template.yaml rename them onto the consensus intervals and
# the HOMER annotation, so the cards clamp to the same window, and the genome
# browser under the navigator follows its brush. A tab of its own: a region
# filter narrows every tile of its collection on the tab. The axis comes from
# GENOME. This is the only browser of the template.
- title: Locus
  subtitle: What do the libraries call at one genomic region?
  tab_group: Peak calls
  tab_order: 6
  tab_icon: mdi:map-search-outline
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Locus filters
    icon: mdi:filter-variant
    color: teal
    description: Peak strength, consensus support and feature class of the tracks on the region
  grid_sections:
  - name: Region at a glance
    icon: mdi:counter
    color: teal
    description: What the region in view holds, recounted on every brush or locus entry
  - name: Peaks on one axis
    icon: mdi:dna
    color: teal
    description: The lanes drive the browser below. A brush or a locus on the lanes moves it, and its view comes back on the lanes as a dashed band, in the colour of the two tiles' link tags.
  components:
  - component_type: text
    order: 1
    body: >
      The broad calls of every library on one genome axis, with the signal and reads of the
      libraries in a genome browser under them. The tab opens where the browser does, on
      the strongest call; drag on the navigator's axis or type a locus in its header, and
      the browser and cards follow.
    tag: at-loc-intro
    index: loc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: macs2_broad_peaks
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: neg_log10_qvalue
    column_type: float64
    display:
      icon_name: mdi:check-decagram
      custom_color: red
    section: Locus filters
    group: Region
    tag: at-loc-filter-qvalue
    index: loc-qvalue-range
    title: Peak significance
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: num_samples
    column_type: int64
    display:
      icon_name: mdi:account-group-outline
      custom_color: green
    section: Locus filters
    group: Region
    tag: at-loc-filter-support
    index: loc-support-range
    title: Libraries per interval
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: homer_annotated_peaks
    interactive_component_type: MultiSelect
    column_name: annotation_class
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: blue
    section: Locus filters
    group: Region
    tag: at-loc-filter-class
    index: loc-class-filter
    title: Feature class
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: macs2_broad_peaks
    use: macs2/broad_peaks
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: composition
    breakdown_col: sample
    follow_region_filter: true
    display:
      icon_name: mdi:counter
      icon_color: indigo
      caption: calls, by library
    section: Region at a glance
    tag: at-loc-card-peaks
    index: loc-card-peaks
    title: Calls in the region
    description: Broad calls on the region in view, one per peak and library.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    aggregation: median
    column_name: num_samples
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    follow_region_filter: true
    display:
      icon_name: mdi:set-merge
      icon_color: violet
      caption: median, with its spread
      decimals: 0
    section: Region at a glance
    tag: at-loc-card-support
    index: loc-card-support
    title: Libraries per interval
    description: How many libraries call each consensus interval on the region.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: homer_annotated_peaks
    use: homer/annotated_peaks
    aggregation: count
    column_name: annotation_class
    column_type: object
    secondary_layout: donut
    breakdown_col: annotation_class
    follow_region_filter: true
    display:
      icon_name: mdi:chart-donut
      icon_color: blue
      caption: peaks, by feature class
    section: Region at a glance
    tag: at-loc-card-classes
    index: loc-card-classes
    title: Feature classes
    description: The annotated calls on the region, split by feature class.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: homer_annotated_peaks
    use: homer/annotated_peaks
    aggregation: nunique
    column_name: gene_name
    column_type: object
    filter_expr: col('gene_name').is_not_null() & (col('gene_name') != '')
    secondary_layout: top_n
    breakdown_col: annotation_class
    follow_region_filter: true
    display:
      icon_name: mdi:dna
      icon_color: teal
      caption: distinct genes, by feature class
    section: Region at a glance
    tag: at-loc-card-genes
    index: loc-card-genes
    title: Nearest genes
    description: Distinct genes named as the nearest gene of a call on the region.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # A navigator that drives a browser sets no default_region: the browser opens on
  # its own locus, and the axis opens on the whole chromosome it shows
  # (open_on_view_window), its window drawn as a band. The axis does not follow
  # that window: on a few kilobases it would open on empty lanes, where the
  # chromosome shows where the calls are to zoom and brush. Bars, not level rects:
  # a rect is a 2 px segment at the score and vanishes at chromosome scale, a bar
  # rises from the baseline and keeps a minimum width. A drag brushes a region
  # (interaction_mode: select), which is what the tile is for.
  - component_type: advanced_viz
    workflow_tag: atacseq
    data_collection_tag: macs2_broad_peaks
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      chr_col: chr
      pos_col: start
      end_col: end
      score_col: neg_log10_qvalue
      feature_col: peak_id
      sample_col: sample
      mark: bar
      facet_by_sample: true
      lane_height: 56
      max_facets: 8
      # Per lane: one protocol can reach far higher q-values than the others,
      # which a shared ruler would draw flat.
      facet_y_scale: independent
      score_title: -log10(q-value)
      opacity: 0.8
      assembly: '{GENOME}'
      open_on_view_window: true
      interaction_mode: select
      region_filter_enabled: true
      selection_enabled: true
      selection_column: peak_id
    section: Peaks on one axis
    tag: at-loc-navigator
    index: loc-navigator
    title: Broad calls per library
    description: >-
      Where does each library call peaks along the genome? Each lane is a library and each bar a MACS2
      broad call, spanning its start to its end and as high as its -log10 q-value, on one shared genome
      axis.

      How to read: look for regions called in every replicate of a group and for regions called in one
      group only. Each lane has its own height scale, so compare bar heights within a lane and not between
      lanes. Drag on the axis to pick a region, or type a locus in the header, and the cards and tables of
      the tab follow it.

      Lines and annotations: the dashed band marks the window the genome browser shows, and the axis opens
      on the whole chromosome of that window. No cut-off or reference line is drawn.

      Note: at most 8 libraries get a lane, the first in genome order, and the tile says how many it
      dropped.
    layout: {x: 0, y: 0, w: 8, h: 7}
  # No fixed location: the browser opens on the most significant peak, and a
  # brush on the navigator moves it without filtering. No selection write-back
  # here: a picked track would narrow the peaks to one library and reframe the
  # view.
  - component_type: jbrowse
    workflow_tag: atacseq
    data_collection_tag: tracks
    section: Peaks on one axis
    initial_tracks: 6
    max_tracks: 18
    show_overview: false
    # Two sources: the per-library peaks (one density row per library; next /
    # previous stop once on peaks several libraries share) and the consensus
    # intervals the DESeq2 QC counts. The first frames the view on a filter.
    locus_from:
      - data_collection_tag: macs2_broad_peaks
        name: Peaks
        color: teal
        chrom_column: chr
        start_column: start
        end_column: end
        padding: 500
        max_rows: 2000
        sort_by: neg_log10_qvalue
        descending: true
        label_column: peak_id
        sample_column: sample
        columns: [fold_enrichment, width]
      - data_collection_tag: macs2_consensus_boolean
        name: Consensus
        color: grape
        chrom_column: chr
        start_column: start
        end_column: end
        padding: 500
        sort_by: num_samples
        descending: true
        label_column: peak_id
        columns: [num_samples, consensus_set]
    tag: at-loc-browser
    index: loc-browser
    # The lanes above already say where the browser is: its locus bar only
    # costs height here, and the tile's menu brings it back.
    show_header: false
    title: Genome browser
    description: >-
      What does the run's own data show at one locus? A genome browser with, for each library in view, its
      read signal (bigWig), its MACS2 peak calls (broadPeak, or narrowPeak on a narrow-peak run) and its
      filtered alignments (BAM), each library in the colour of its group. It opens on the strongest call
      with the first six tracks, the signal of replicate 1 of every group first.

      How to read: a real peak shows a pile-up of signal under the call in every replicate of a group,
      with the peak track agreeing. Add tracks from the track selector, which groups them as Signal, Peaks
      (MACS2) and Alignments, up to 18 at once. Alignments are the heaviest files and the slowest to open.

      Note: a library whose file the run did not publish has no track.
    layout: {x: 0, y: 7, w: 8, h: 10}
