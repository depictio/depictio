  # Calls per 1 Mb window, one row per library: where each library calls its peaks and whether
  # replicates agree. The significance of a call is no contrast (every call already passes the
  # caller's cut-off), so it is not drawn.
  - component_type: figure
    workflow_tag: atacseq
    data_collection_tag: macs2_broad_peaks
    use: macs2/broad_peaks
    visu_type: heatmap
    mode: code
    code_content: |-
      # Peak calls per 1 Mb window, one row per library, chromosomes in karyotype order: where each library calls peaks, and whether replicates agree.
      c = pl.col('chr').str.replace('^chr', '')
      rk = pl.when(c.str.contains('^[0-9]+$')).then(c.cast(pl.Int64, strict=False)).when(c == 'X').then(1001).when(c == 'Y').then(1002).when(c.is_in(['M', 'MT'])).then(1003).otherwise(2000)
      d = df.with_columns(rk.alias('rk'), (((pl.col('start') + pl.col('end')) // 2) // 1000000).alias('win'))
      spans = d.group_by(['rk', 'chr']).agg(pl.col('win').max().alias('nwin')).sort('nwin', descending=True).head(60).sort(['rk', 'chr'])
      chroms = spans.get_column('chr').to_list()
      sizes = [n + 1 for n in spans.get_column('nwin').to_list()]
      grid = pl.DataFrame({'chr': [ch for ch, n in zip(chroms, sizes) for k in range(n)], 'win': [w for n in sizes for w in range(n)]}).with_row_index('idx').with_columns((pl.col('chr') + ':' + pl.col('win').cast(pl.Utf8) + ' Mb').alias('lab'))
      samples = sorted(d.get_column('sample').unique().to_list())
      counts = d.group_by(['sample', 'chr', 'win']).agg(pl.len().cast(pl.Int64).alias('n'))
      full = grid.join(pl.DataFrame({'sample': samples}), how='cross').join(counts, on=['sample', 'chr', 'win'], how='left').with_columns(pl.col('n').fill_null(0)).sort(['sample', 'idx'])
      z = full.get_column('n').to_numpy().reshape(len(samples), grid.height)
      labs = grid.get_column('lab').to_list()
      ticks = []
      texts = []
      off = 0
      for i, (ch, n) in enumerate(zip(chroms, sizes)):
          ticks.append(labs[off + n // 2])
          texts.append(('<br>' if i % 2 else '') + ch.replace('chr', ''))
          off += n
      marks = [0, 1, 3, 10, 30, 100, 300]
      fig = go.Figure(go.Heatmap(z=np.log1p(z), x=labs, y=samples, customdata=z, colorscale='Viridis', zmin=0, colorbar=dict(title='Calls per Mb', tickmode='array', tickvals=[float(np.log1p(m)) for m in marks], ticktext=[str(m) for m in marks]), hovertemplate='<b>%{y}</b><br>%{x}<br>%{customdata} calls<extra></extra>'))
      off = 0
      for n in sizes[:-1]:
          off += n
          fig.add_vline(x=off - 0.5, line_width=1, line_color='rgba(255,255,255,0.55)')
      fig.update_xaxes(type='category', tickmode='array', tickvals=ticks, ticktext=texts, showgrid=False, tickangle=0, title='')
      fig.update_yaxes(autorange='reversed', automargin=True, title='')
      fig.update_layout(margin=dict(t=10))
    section: Calls along the genome
    tag: at-pk-density
    index: pk-density
    title: Peak calls along the genome
    description: >-
      Where does each library call its peaks? One row per library and one column per 1 Mb window of the
      genome, chromosomes in karyotype order: the number of broad peak calls whose midpoint falls in the
      window, on a colour scale where brighter is more calls.

      How to read: a vertical band shared by the replicates of a group is a region called reproducibly,
      and a band in one group only is accessibility specific to that group. A row much sparser than its
      replicates belongs to a library that calls fewer peaks.

      Lines and annotations: white vertical lines mark the chromosome boundaries. The colour bar is a log
      scale with ticks at 0, 1, 3, 10, 30, 100 and 300 calls per Mb, a display scale and not a cut-off.

      Note: at most the 60 sequences with the longest span are drawn, and a window is always 1 Mb whatever
      the genome size.
    layout: {x: 0, y: 0, w: 8, h: 5}
  # Log x: peak width is a long tail. On a linear axis the widest call sets the
  # range. One box per library from precomputed quartiles, so a run of 60k calls
  # per library sends 5 numbers, not the calls.
  - component_type: figure
    workflow_tag: atacseq
    data_collection_tag: macs2_broad_peaks
    use: macs2/broad_peaks
    visu_type: box
    mode: code
    code_content: |-
      # Peak width per library, the widest median on top, on a log axis. The box is the middle half of the calls, the line inside it the median, the whiskers 1.5 times the interquartile range. A box wears the colour of its group, the library name without its replicate suffix, as on the other tabs.
      q = df.group_by('sample').agg(pl.col('width').quantile(0.25).alias('q1'), pl.col('width').median().alias('med'), pl.col('width').quantile(0.75).alias('q3'), pl.col('width').min().alias('lo'), pl.col('width').max().alias('hi'), pl.len().alias('n')).sort(['med', 'sample'], descending=[True, True])
      q = q.with_columns((pl.col('q1') - 1.5 * (pl.col('q3') - pl.col('q1'))).clip(lower_bound=pl.col('lo')).alias('wlo'), (pl.col('q3') + 1.5 * (pl.col('q3') - pl.col('q1'))).clip(upper_bound=pl.col('hi')).alias('whi'))
      q = q.with_columns(pl.col('sample').str.replace(r'\.m(Lb|Rp)\.clN$', '').str.replace(r'_R(EP)?\d+$', '').alias('grp'))
      colors = depictio_category_colors.get('group') or {}
      traces = []
      for g in q.get_column('grp').unique(maintain_order=True).to_list():
          s = q.filter(pl.col('grp') == g)
          c = colors.get(g)
          traces.append(go.Box(name=g, y=s.get_column('sample').to_list(), q1=s.get_column('q1').to_list(), median=s.get_column('med').to_list(), q3=s.get_column('q3').to_list(), lowerfence=s.get_column('wlo').to_list(), upperfence=s.get_column('whi').to_list(), orientation='h', marker_color=c, line=dict(color=c, width=1.5), customdata=s.get_column('n').to_list(), hovertemplate='<b>%{y}</b><br>median %{median:,.0f} bp<br>middle half %{q1:,.0f} to %{q3:,.0f} bp<extra></extra>'))
      fig = go.Figure(data=traces)
      lo, hi = q.get_column('wlo').min(), q.get_column('whi').max()
      tv = [v for v in (20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000) if lo / 1.5 <= v <= hi * 1.5]
      fig.update_xaxes(type='log', title='Peak width (bp)', tickmode='array', tickvals=tv, ticktext=[f'{v:,}' for v in tv])
      fig.update_yaxes(autorange='reversed', automargin=True, title='', categoryorder='array', categoryarray=q.get_column('sample').to_list())
      fig.update_layout(margin=dict(t=10), boxmode='overlay', legend=dict(title_text='', orientation='h', y=-0.2))
    section: Peak width
    tag: at-pk-width
    index: pk-width
    title: Peak width per library
    description: >-
      How wide are the broad calls of each library? One box per library on a log axis, the widest median
      on top, coloured by group. The box spans the middle half of the library's calls and the line inside
      it is the median.

      How to read: replicates of a group should show boxes of similar width and position. A box far wider
      or narrower than its group points to a difference in depth or in calling. Broad calls report a
      region rather than a summit, so these widths are not comparable with a narrow-peak run.

      Lines and annotations: the whiskers reach 1.5 times the interquartile range beyond the box, or the
      narrowest and widest call of the library when that is closer. Calls beyond the whiskers are not
      drawn as points, and the axis ticks are fixed values chosen to fit the range.

      Source: the 1.5 interquartile range whisker convention of Tukey box plots,
      https://en.wikipedia.org/wiki/Box_plot

      Note: a Tukey whisker ends at the furthest call inside the fence, whereas this tile ends it at the
      fence itself.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: atacseq
    data_collection_tag: macs2_broad_peaks
    use: macs2/broad_peaks
    row_selection_enabled: true
    row_selection_column: peak_id
    section: Peak table
    tag: at-pk-table
    index: pk-table-peaks
    title: MACS2 broad peaks
    description: >-
      One row per broad peak call: its library, coordinates and width, the fold enrichment over the local
      background, the -log10 p-value and q-value, and MACS2's integer score.

      How to read: sort by -log10 q or by fold enrichment for the strongest calls, and narrow by
      chromosome or width in the left panel. Every call here already passed the caller's cut-off, so
      significance ranks the calls and does not accept or reject them.
    layout: {x: 0, y: 0, w: 8, h: 6}
