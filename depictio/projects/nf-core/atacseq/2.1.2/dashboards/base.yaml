  # The complexity card of every route. 1.2.2 read preseq here, which 2.x
  # skips by default; Picard MarkDuplicates runs on every merged library.
  # Picard estimates no size for single-end reads, so those rows are null and
  # the median is of the paired-end libraries.
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: picard_markduplicates_metrics
    use: picard/markduplicates_metrics
    aggregation: median
    column_name: estimated_library_size
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:fingerprint
      icon_color: orange
      caption: median of the paired-end libraries, with its spread
      format: si
    section: Signal at a glance
    tag: at-sig-card-libsize
    index: sig-card-libsize
    title: Library size
    description: Distinct fragments Picard estimates each library holds, from its duplicate pairs; a small library is one that sequencing deeper will not save.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: deeptools_plot_profile
    use: deeptools/plot_profile
    aggregation: median
    column_name: signal
    column_type: float64
    filter_expr: col('bin_label') == 'TSS'
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-line
      icon_color: teal
      caption: median at the start site, with its distribution
      decimals: 2
    section: Signal at a glance
    tag: at-sig-card-signal
    index: sig-card-signal
    title: Signal at the start site
    description: Mean metagene signal of each library in the start-site bin, where an ATAC library peaks.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: atacseq
    data_collection_tag: deeptools_fingerprint_metrics
    use: deeptools/fingerprint_metrics
    visu_type: bar
    mode: code
    code_content: |-
      # One bar per library, the least concentrated on top. Left, the area under its coverage curve over that of a uniform library: red past 0.95 (no better than uniform), amber from 0.85, cyan below. Right, its Jensen-Shannon distance to a uniform library, coloured the same way.
      names = {'auc_ratio': 'Coverage area over uniform', 'synthetic_js_distance': 'Distance to uniform (JS)'}
      d = df.filter(pl.col('auc_ratio').is_not_null()).with_columns(pl.when(pl.col('auc_ratio') > 0.95).then(pl.lit('Flat')).when(pl.col('auc_ratio') > 0.85).then(pl.lit('Borderline')).otherwise(pl.lit('Concentrated')).alias('verdict')).sort(['auc_ratio', 'sample'], descending=[True, True])
      long = d.select(['sample', 'verdict', 'auc_ratio', 'synthetic_js_distance']).unpivot(index=['sample', 'verdict'], variable_name='metric', value_name='value').with_columns(pl.col('metric').replace(names))
      fig = px.bar(long.to_pandas(), x='value', y='sample', color='verdict', color_discrete_map={'Concentrated': '#15aabf', 'Borderline': '#f59f00', 'Flat': '#e03131'}, facet_col='metric', orientation='h', custom_data=['sample'], category_orders={'sample': d.get_column('sample').to_list(), 'metric': list(names.values()), 'verdict': ['Concentrated', 'Borderline', 'Flat']}, labels={'value': '', 'sample': '', 'verdict': ''})
      fig.update_traces(hovertemplate='<b>%{customdata[0]}</b><br>%{x:.3f}<extra></extra>')
      fig.update_xaxes(matches=None, showticklabels=True)
      fig.update_yaxes(automargin=True)
      fig.update_xaxes(range=[0, 1], col=1)
      fig.for_each_annotation(lambda a: a.update(text=a.text.split('=')[-1]))
      fig.add_vrect(x0=0.85, x1=0.95, fillcolor='rgba(245,159,0,0.15)', line_width=0, layer='below', col=1)
      fig.add_vrect(x0=0.95, x1=1, fillcolor='rgba(224,49,49,0.15)', line_width=0, layer='below', col=1)
      fig.update_layout(margin=dict(t=30), legend=dict(orientation='h', y=-0.12))
    selection_enabled: true
    selection_column: sample
    section: Coverage concentration
    tag: at-sig-fingerprint
    index: sig-fingerprint
    title: Coverage concentration per library
    description: >-
      Which libraries concentrate their reads, as accessible chromatin should? One bar per library, the
      least concentrated on top. Left, the area under the library's fingerprint curve over that of an ideal
      input of the same depth; right, its Jensen-Shannon distance to that ideal input. Both come from
      deepTools plotFingerprint.

      How to read: a short bar on the left is a library whose reads pile into few genome bins, the
      signature of enrichment, and a bar near 1 reads like an input with no enrichment. The right panel
      points the same way, a longer bar being further from an even library. Click a bar to select the
      library.

      Lines and annotations: the left panel is shaded amber from 0.85 to 0.95 and red from 0.95 to 1, and
      each bar takes the colour of its verdict on that left value: cyan Concentrated up to 0.85, amber
      Borderline above 0.85 up to 0.95, red Flat above 0.95. The right panel uses the same bar colours and
      has no band. The cut-offs are fixed in the tile, not read from the run.

      Note: 0.85 and 0.95 are display aids with no published source, since deepTools gives no numeric
      cut-off for these metrics, so read the verdict colours as a ranking and not as a pass or fail.

      Source: deepTools plotFingerprint QC metrics,
      https://deeptools.readthedocs.io/en/latest/content/feature/plotFingerprint_QC_metrics.html
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: atacseq
    data_collection_tag: picard_markduplicates_metrics
    use: picard/duplication_vs_depth
    config:
      x_title: Reads left after duplicate removal
      y_title: Duplication rate
      # The library names carry the BAM suffix; the legend names them.
      top_n_labels: 0
      marker_size: 14
      selection_enabled: true
      selection_column: sample
    section: Complexity and metagene
    tag: at-sig-dup-depth
    index: sig-dup-depth
    title: Duplication against depth
    description: >-
      Did deeper sequencing still add new fragments? One point per library: the reads left after Picard
      removes duplicates (x) against its duplication rate (y), with the point size following the duplicate
      reads and the colour the library.

      How to read: a point high and far to the left is a library with many copies and few reads left,
      where depth was bought with duplicates. A point low and far to the right holds many distinct reads.
      Replicates of a group should sit close together; click a point to select the library.

      Note: no reference line or zone is drawn, so the plot ranks libraries against each other and does
      not pass or fail them.

      Source: Picard DuplicationMetrics, where PERCENT_DUPLICATION is the fraction of mapped sequence
      marked as duplicate, https://broadinstitute.github.io/picard/picard-metric-definitions.html
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: atacseq
    data_collection_tag: deeptools_plot_profile
    use: deeptools/metagene_profile
    config:
      reference_x: 300
      reference_label: TSS
      shaded_bands:
      - [300, 400, Gene body]
      x_title: Bin (TSS at 300, TES at 400)
      y_title: Mean signal
      line_width: 2
      legend_pos: right
      selection_enabled: true
      selection_column: sample
    section: Complexity and metagene
    tag: at-sig-metagene
    index: sig-metagene
    title: Metagene signal profile
    description: >-
      Where along a gene is the signal? One curve per library: the mean signal in the bins of a scaled
      gene, from a 3 kb flank upstream, across the gene body stretched to one length, to a 3 kb flank
      downstream. It reads the table deepTools plotProfile writes for the run.

      How to read: a library with real accessibility rises towards the start site, and replicates of a
      group should overlay. A flat curve has no preference for gene starts, and a curve far above or below
      its group points to a difference in depth or quality. Click a curve to select the library.

      Lines and annotations: the vertical line at bin 300, labelled TSS, is the transcription start site,
      where the upstream flank ends. The shaded bins 300 to 400, labelled Gene body, run from the start to
      the end of the scaled gene, so bin 400 is the end site. The x axis counts bins along the scaled
      window, not base pairs.

      Source: nf-core/atacseq 2.1.2 module configuration, computeMatrix scale-regions with a 1000 bp region
      body and 3000 bp before and after, https://github.com/nf-core/atacseq/blob/2.1.2/conf/modules.config
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: atacseq
    data_collection_tag: preseq_complexity_curve
    use: preseq/complexity_ribbon
    config:
      log_x: true
      band_opacity: 0.18
      line_width: 2
      x_title: Sequencing depth (reads)
      y_title: Expected distinct fragments
      legend_pos: right
      selection_enabled: true
      selection_column: sample
    section: Complexity curve
    tag: at-sig-complexity
    index: sig-complexity
    title: Library complexity
    description: >-
      How many distinct fragments would deeper sequencing give? One curve per library from preseq: the
      distinct fragments expected (y) at each sequencing depth (x, log scale), extrapolated beyond the
      depth sequenced, with a band for the 95% interval of the extrapolation.

      How to read: a curve still climbing at the depth already sequenced means more sequencing would give
      new fragments, and a curve that has flattened means the library is exhausted. A band that fans out
      wide means the extrapolation itself is uncertain. Compare libraries of one group at the same depth.

      Lines and annotations: no reference line is drawn. The shaded band around each curve is the 95%
      interval preseq puts on its extrapolation.

      Note: preseq is off by default in nf-core/atacseq, so this tile exists only for a run that switched
      it on.

      Sources: Daley and Smith, Predicting the molecular complexity of sequencing libraries, Nature
      Methods 2013, doi:10.1038/nmeth.2375; nf-core/atacseq 2.1.2 parameters (skip_preseq),
      https://github.com/nf-core/atacseq/blob/2.1.2/nextflow.config
    layout: {x: 0, y: 0, w: 8, h: 6}
