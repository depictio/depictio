    title: Metagene signal profile
    description: Mean accessibility of every library along a scaled gene with 3 kb flanks, the line at bin 300 is the transcription start site, where the 3 kb upstream flank ends, and the shaded bins 300 to 400 are the gene body, scaled to one length.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
