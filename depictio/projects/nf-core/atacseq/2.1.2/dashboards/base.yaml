# The locus section: the broad calls on one genomic region. The navigator (a
# genome_view on macs2_broad_peaks) opens on its default_region and emits the
# chromosome and position filters; the two region links in template.yaml
# rename them onto the consensus intervals and the HOMER annotation, so the
# cards clamp to the same window. A tab of its own: a region filter narrows
# every tile of its collection on the tab. The axis comes from GENOME; the
# navigator opens on the first chromosome the calls carry, whatever the
# organism.
- title: Locus
  subtitle: What do the libraries call at one genomic region?
  tab_group: Peak calls
  tab_order: 6
  tab_icon: mdi:map-search-outline
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Locus filters
    icon: mdi:filter-variant
    color: teal
    description: Peak strength, consensus support and feature class of the tracks on the region
  grid_sections:
  - name: Region at a glance
    icon: mdi:counter
    color: teal
    description: What the region in view holds, recounted on every brush or locus entry
  - name: Peaks on one axis
    icon: mdi:dna
    color: teal
    description: The broad calls per library, as high as their significance
  components:
  - component_type: text
    order: 1
    body: >
      The broad calls of every library on one genome axis. The tab opens on the first
      chromosome of the calls; type a locus in the navigator's header or brush its axis,
      and the cards follow.
    tag: at-loc-intro
    index: loc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: macs2_broad_peaks
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: neg_log10_qvalue
    column_type: float64
    display:
      icon_name: mdi:check-decagram
      custom_color: red
    section: Locus filters
    group: Region
    tag: at-loc-filter-qvalue
    index: loc-qvalue-range
    title: Peak significance
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: num_samples
    column_type: int64
    display:
      icon_name: mdi:account-group-outline
      custom_color: green
    section: Locus filters
    group: Region
    tag: at-loc-filter-support
    index: loc-support-range
    title: Libraries per interval
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: homer_annotated_peaks
    interactive_component_type: MultiSelect
    column_name: annotation_class
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: blue
    section: Locus filters
    group: Region
    tag: at-loc-filter-class
    index: loc-class-filter
    title: Feature class
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: macs2_broad_peaks
    use: macs2/broad_peaks
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: composition
    breakdown_col: sample
    follow_region_filter: true
    display:
      icon_name: mdi:counter
      icon_color: indigo
      caption: calls, by library
    section: Region at a glance
    tag: at-loc-card-peaks
    index: loc-card-peaks
    title: Calls in the region
    description: Broad calls on the region in view, one per peak and library.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    aggregation: median
    column_name: num_samples
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    follow_region_filter: true
    display:
      icon_name: mdi:set-merge
      icon_color: violet
      caption: median, with its spread
      decimals: 0
    section: Region at a glance
    tag: at-loc-card-support
    index: loc-card-support
    title: Libraries per interval
    description: How many libraries call each consensus interval on the region.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: homer_annotated_peaks
    use: homer/annotated_peaks
    aggregation: count
    column_name: annotation_class
    column_type: object
    secondary_layout: donut
    breakdown_col: annotation_class
    follow_region_filter: true
    display:
      icon_name: mdi:chart-donut
      icon_color: blue
      caption: peaks, by feature class
    section: Region at a glance
    tag: at-loc-card-classes
    index: loc-card-classes
    title: Feature classes
    description: The annotated calls on the region, split by feature class.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: homer_annotated_peaks
    use: homer/annotated_peaks
    aggregation: nunique
    column_name: gene_name
    column_type: object
    filter_expr: col('gene_name').is_not_null() & (col('gene_name') != '')
    secondary_layout: top_n
    breakdown_col: annotation_class
    follow_region_filter: true
    display:
      icon_name: mdi:dna
      icon_color: teal
      caption: distinct genes, by feature class
    section: Region at a glance
    tag: at-loc-card-genes
    index: loc-card-genes
    title: Nearest genes
    description: Distinct genes named as the nearest gene of a call on the region.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Default region: the first contig the calls carry. The test profiles span a
  # human and a yeast genome, so no contig name holds for every run.
  - component_type: advanced_viz
    workflow_tag: atacseq
    data_collection_tag: macs2_broad_peaks
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      chr_col: chr
      pos_col: start
      end_col: end
      score_col: neg_log10_qvalue
      feature_col: peak_id
      sample_col: sample
      mark: bar
      facet_by_sample: true
      lane_height: 56
      max_facets: 8
      # Per lane: one protocol can reach far higher q-values than the others,
      # which a shared ruler would draw flat.
      facet_y_scale: independent
      score_title: -log10(q-value)
      opacity: 0.8
      assembly: '{GENOME}'
      interaction_mode: select
      default_region: first
      region_filter_enabled: true
      selection_enabled: true
      selection_column: peak_id
    section: Peaks on one axis
    tag: at-loc-navigator
    index: loc-navigator
    title: Broad calls per library
    description: Each lane is a library and each bar a MACS2 broad call, spanning its start to its end and as high as its -log10(q). Look for regions called in every replicate of a group, and for regions called in one group only. It opens on the first chromosome of the calls; drag on the axis to pick a region, or type a locus.
    layout: {x: 0, y: 0, w: 8, h: 7}
# ============================================================================
# Comparison
# ============================================================================
- title: Consensus
  subtitle: Which peaks do the libraries agree on?
  tab_group: Comparison
  tab_order: 7
  tab_icon: mdi:set-merge
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Consensus filters
    icon: mdi:filter-variant
    color: violet
    description: How well supported an interval has to be before it counts
  grid_sections:
  - name: Consensus at a glance
    icon: mdi:counter
    color: violet
    description: How many intervals the merged set holds, and how many libraries back them
  - name: Replicate agreement
    icon: mdi:set-merge
    color: violet
    description: Which combinations of libraries call the same interval
  # Moved here from the 1.2.2 Differential tab, which 2.x no longer has.
  - name: Sample space
    icon: mdi:chart-box-outline
    color: violet
    description: Where the libraries sit on the consensus counts, before any interval
  - name: Signal at the strongest intervals
    icon: mdi:chart-box-outline
    color: violet
    description: Fold enrichment of the most strongly accessible intervals, clustered
    collapsed: true
  - name: Consensus tables
    icon: mdi:table
    color: gray
    description: The merged intervals, the fold enrichment, the components and the distances
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      The per-library calls merged into one set of intervals. An interval every library
      calls is reproducible; one a single library calls is noise or specific to its group.
      The UpSet shows which libraries agree, and the [DESeq2](https://bioconductor.org/packages/DESeq2)
      PCA and distances below it where the libraries sit on the consensus counts.
    tag: at-cons-intro
    index: cons-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: num_samples
    column_type: int64
    display:
      icon_name: mdi:account-group-outline
      custom_color: green
    section: Consensus filters
    group: Consensus
    tag: at-cons-filter-support
    index: cons-support-range
    title: Libraries per interval
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: num_peaks
    column_type: int64
    display:
      icon_name: mdi:layers-outline
      custom_color: orange
    section: Consensus filters
    group: Consensus
    tag: at-cons-filter-peaks
    index: cons-peaks-range
    title: Peaks merged
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_fc
    interactive_component_type: MultiSelect
    column_name: support
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: green
    section: Consensus filters
    group: Strongest intervals
    tag: at-cons-filter-fcsupport
    index: cons-fcsupport-filter
    title: Support
    layout: {x: 0, y: 6, w: 1, h: 3}
  # The breakdown is the chromosome: atacseq binds one consensus set (the
  # merged-library level), so `consensus_set` holds a single value.
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: chr
    display:
      icon_name: mdi:counter
      icon_color: violet
      caption: intervals, by chromosome
    section: Consensus at a glance
    tag: at-cons-card-intervals
    index: cons-card-intervals
    title: Consensus intervals
    description: Intervals of the merged peak set in view.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    aggregation: median
    column_name: num_samples
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:account-group-outline
      icon_color: indigo
      caption: median, with its spread
      decimals: 0
    section: Consensus at a glance
    tag: at-cons-card-support
    index: cons-card-support
    title: Libraries per interval
    description: How many libraries call a peak on each consensus interval.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    aggregation: sum
    column_name: num_peaks
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:layers-outline
      icon_color: teal
      caption: total; the bars, peaks per interval
    section: Consensus at a glance
    tag: at-cons-card-peaks
    index: cons-card-peaks
    title: Peaks merged
    description: Per-library peaks merged into the consensus intervals in view.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_fc
    use: macs2/consensus_fc
    aggregation: count
    column_name: support
    column_type: object
    secondary_layout: donut
    breakdown_col: support
    display:
      icon_name: mdi:chart-donut
      icon_color: orange
      caption: by libraries calling them
    section: Consensus at a glance
    tag: at-cons-card-strongest
    index: cons-card-strongest
    title: Strongest intervals
    description: The most strongly accessible intervals, split by how many libraries call them.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_upset
    config:
      # Library columns of the run, whatever the samples; the replicate-level
      # `.mRp.clN` set is left out.
      set_columns_pattern: '\.mLb\.clN$'
      color_intersections_by: degree
      show_set_sizes: true
      show_values: true
      sort_by: cardinality
      sort_order: descending
      min_size: 1
    section: Replicate agreement
    tag: at-cons-upset
    index: cons-upset
    title: Consensus peak overlap
    description: Intersections of the libraries calling each consensus interval, largest first.
    layout: {x: 0, y: 0, w: 8, h: 8}
  - component_type: advanced_viz
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_fc
    use: macs2/consensus_signal_heatmap
    config:
      value_columns_pattern: '\.mLb\.clN$'
      row_annotation_cols: [support]
      cluster_rows: true
      cluster_cols: true
      normalize: log1p
      colorscale: Viridis
    section: Signal at the strongest intervals
    tag: at-cons-heatmap
    index: cons-heatmap
    title: Consensus signal heatmap
    description: Log-scaled fold enrichment per library at the strongest intervals; a zero cell is a library that called no peak there.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    row_selection_enabled: true
    row_selection_column: peak_id
    section: Consensus tables
    tag: at-cons-table-boolean
    index: cons-table-boolean
    title: Consensus intervals
    description: Coordinates, how many peaks merged into the interval and which libraries called it.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_fc
    use: macs2/consensus_fc
    row_selection_enabled: true
    row_selection_column: peak_id
    section: Consensus tables
    tag: at-cons-table-fc
    index: cons-table-fc
    title: Consensus fold enrichment
    description: Per-library fold enrichment at the strongest intervals of the merged set.
    layout: {x: 0, y: 6, w: 8, h: 6}
  # Sample space: the DESeq2 QC the pipeline still runs on the consensus
  # counts. The tags keep their 1.2.2 names (at-diff-*), from the tab they
  # lived on. The distance matrix is labelled with libraries on both axes, so
  # it takes the full width.
  - component_type: advanced_viz
    workflow_tag: atacseq
    data_collection_tag: deseq2_qc_pca
    use: deseq2/qc_pca_embedding
    config:
      color_col: group
      default_color_by: group
      point_size: 14
      marker_outline: true
      axis_prefix: PC
      legend_pos: right
      selection_enabled: true
      selection_column: sample_id
    section: Sample space
    tag: at-diff-pca
    index: diff-pca
    title: Consensus count PCA
    description: The principal components the pipeline computed on the consensus counts, one point per sample, coloured by group.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: atacseq
    data_collection_tag: deseq2_qc_sample_dists
    use: deseq2/qc_distance_heatmap
    config:
      cluster_rows: true
      cluster_cols: true
      cluster_method: ward
      normalize: none
      colorscale: Blues
    section: Sample space
    tag: at-diff-dists
    index: diff-dists
    title: Library distances
    description: Euclidean distance between every pair of libraries on the consensus counts, Ward-clustered.
    layout: {x: 0, y: 6, w: 8, h: 5}
  - component_type: table
    workflow_tag: atacseq
    data_collection_tag: deseq2_qc_pca
    use: deseq2/qc_pca
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Consensus tables
    tag: at-diff-table-pca
    index: diff-table-pca
    title: Principal components
    description: The two principal components of every library and the variance each one explains.
    layout: {x: 0, y: 12, w: 8, h: 6}
  - component_type: table
    workflow_tag: atacseq
    data_collection_tag: deseq2_qc_sample_dists
    use: deseq2/qc_sample_dists
    row_selection_enabled: true
