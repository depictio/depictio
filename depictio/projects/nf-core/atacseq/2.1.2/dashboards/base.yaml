      [Picard](https://broadinstitute.github.io/picard/) write beside the curves MultiQC
      draws: how concentrated each library's coverage is against a uniform library of
      its depth, and how many distinct fragments it holds. The metagene profile shows
      where the signal sits along a gene. A run made with
      [preseq](https://github.com/smithlabcode/preseq) adds its complexity curves in the
      last section.
    tag: at-sig-intro
    index: sig-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
