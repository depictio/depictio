  filter_sections:
  - name: Signal filters
    icon: mdi:filter-variant
    color: cyan
    description: Narrows the libraries by coverage concentration and duplication, and the curves by depth
  grid_sections:
  - name: Signal at a glance
    icon: mdi:counter
    color: cyan
    description: The deepTools and Picard numbers a library's signal is judged on
  - name: Coverage concentration
    icon: mdi:chart-bar
    color: cyan
    description: How far each library's coverage departs from a uniform library of its depth
  - name: Complexity and metagene
    icon: mdi:chart-line
