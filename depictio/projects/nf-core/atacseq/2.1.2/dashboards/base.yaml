version: 1
# nf-core/atacseq 2.1.2, on the family rules of depictio/projects/nf-core/RULES.md
# (ampliseq/2.18.0 is the reference implementation). Rebuilt from the 1.2.2
# dashboard, whose tab groups, tab names, tags and KPI logic it keeps wherever
# the 2.x outputs allow, so a reader moving between the versions finds the same
# places.
#
# Funnel: library QC (the MultiQC report, the ataqv measures, the signal
# tables) -> the peaks each library yielded, where they land and what one
# region holds -> the consensus set across libraries and where the libraries
# sit on its counts. The design hub (`sample_design`) is what every filter
# starts from: the project links carry a pick to the MultiQC panels, the ataqv,
# deepTools and Picard tables, the peak calls, the HOMER annotation and the
# DESeq2 QC of the consensus counts.
#
# What 2.x lost: the DESeq2 contrasts (removed in 2.0), so there is no
# Differential accessibility tab. Its PCA and distance tiles survive in the
# Consensus tab's Sample space section, under their 1.2.2 tags; the Overview's
# fourth figure is the fragment ladder of the ATAC quality tab instead of the
# volcano.
#
# Two MultiQC reports: the pipeline's own (MultiQC 1.31 or later swapped in,
# numbered module ids) or one reprocessed from a 1.13 run (plain module ids).
# The MultiQC tab binds what both carry under one id, gives the fingerprint and
# the insert sizes a same-slot alternate per report, and keeps the general
# statistics, featureCounts and ataqv tiles that only a reprocessed report
# carries; the import prunes the rest. There is no params.json: the Run
# parameters dialog lists the software versions, which is what the `params:`
# links search.
#
# Routes: preseq is off by default in 2.x, so its complexity curve sits in a
# collapsed section of the Signal tab that only a run with preseq keeps; the
# strip's complexity card reads Picard, which every route runs. The DESeq2 QC
# runs only when the design has replicated groups; the import drops the Sample
# space tiles with their data collections.
main_dashboard:
  title: nf-core/atacseq
  subtitle: Chromatin accessibility, from library quality to the peaks the libraries agree on
  project_tag: ATAC-seq Chromatin Accessibility
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family. atacseq has no
  # GROUP_COL: the design group is the hub's own `group` column.
  category_colors:
    group: auto
    # HOMER's coarse feature classes, written out so a class keeps its colour
    # on the annotation bars, the donut cards and the gene track.
    annotation_class:
      '*': auto
      promoter-TSS: '#d6336c'
      "5' UTR": '#ae3ec9'
      exon: '#7048e8'
      intron: '#1c7ed6'
      "3' UTR": '#1098ad'
      TTS: '#0ca678'
      non-coding: '#74b816'
      Intergenic: '#f59f00'
    # ataqv's nucleosome windows, shortest fragments first.
    fragment_class:
      sub-nucleosomal: '#1098ad'
      transitional: '#74b816'
      mononucleosomal: '#7048e8'
      multi-nucleosomal: '#c2255c'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. All
  # three are bound to the design hub, the source of every sample link in
  # template.yaml.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  - name: QC thresholds
    icon: mdi:tune
    color: cyan
    description: Signal and yield floors on the per-library QC tables
    collapsed: true
    persistent: true
    pin: bottom
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab, which no route removes.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The design behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The per-library peak QC rows behind the tiles
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Samples, below).
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: sample_design
    interactive_component_type: MultiSelect
    column_name: group
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: Group
    section: Key figures
    tag: at-ov-kf-group
    index: ov-kf-group
    title: Group
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: sample_design
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: at-ov-kf-sample
    index: ov-kf-sample
    title: Sample
    layout: {x: 2, y: 0, w: 2, h: 1}
  # The pipeline's wordmark, read from its repository; where it cannot load (no
  # internet), the title is drawn as text.
  - component_type: text
    title: nf-core/atacseq
    logo: https://raw.githubusercontent.com/nf-core/atacseq/master/docs/images/nf-core-atacseq_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/atacseq/master/docs/images/nf-core-atacseq_logo_dark.png
    order: 1
    body: >
      Chromatin accessibility from ATAC-seq reads: how well each library worked, the
      peaks it yielded and the regions the libraries agree on.
      [Run parameters](params:)
    tag: at-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    surface: card
    values:
      samples: {dc: sample_design, column: sample, aggregation: nunique, format: integer}
      groups: {dc: sample_design, column: group, aggregation: nunique, format: integer}
      reps: {dc: sample_design, column: replicate, aggregation: max, format: integer}
      libraries: {dc: sample_design, column: n_libraries, aggregation: sum, format: integer}
      reads: {dc: sample_design, column: read_type, aggregation: top}
      controls: {dc: sample_design, column: role, aggregation: count, filter_expr: "col('role') == 'control'", format: integer}
    body: |
      ### The study
      - ![](icon:mdi:flask-outline) **Samples** {{samples}} in {{groups}} groups
      - ![](icon:mdi:content-copy) **Replicates** up to {{reps}} per group
      - ![](icon:mdi:test-tube) **Libraries** {{libraries}} sequenced, merged per sample
      - ![](icon:mdi:swap-horizontal) **Reads** {{reads}}
      - ![](icon:mdi:shield-check-outline) **Controls** {{controls}} samples serve as the input control of another
      - ![](icon:mdi:file-table-outline) **Samplesheet** [one row per sample](section:Sample sheet), its path in [the run parameters](params:input)
    tag: at-ov-study
    index: ov-study
    layout: {x: 0, y: 1, w: 5, h: 6}
  # The run's own facts: the pipeline and its version, the aligner the run
  # recorded, the genome from the GENOME template variable and the peaks its
  # libraries yielded.
  - component_type: text
    surface: card
    values:
      peaks: {dc: macs2_peak_summary, column: num_peaks, aggregation: sum, format: si}
    body: |
      ### The run
      - ![](icon:mdi:source-branch) **Pipeline** nf-core/atacseq 2.1.2
      - ![](icon:mdi:dna) **Genome** {GENOME}
      - ![](icon:mdi:chart-scatter-plot) **Peaks** {{peaks}} broad calls
      - ![](icon:mdi:tune) [All parameters and tool versions](params:)
    tag: at-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 6}
  # The marks take the family's colour (the header's), not the theme's blue.
  # A `params:` link searches the software versions the run recorded.
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Five steps from reads to the consensus peak set
      Each step names the tool version it ran and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:content-cut) **Trim** Adapters cut by Trim Galore · [Version](params:trimgalore) · [MultiQC](tab:MultiQC)
      2. ![](icon:mdi:dna) **Align** Reads aligned, duplicates marked by Picard, poor alignments filtered · [Version](params:picard) · [ATAC quality](tab:ATAC quality)
      3. ![](icon:mdi:chart-scatter-plot) **Call** MACS2 broad peaks per library · [Version](params:macs2) · [Peaks](tab:Peaks)
      4. ![](icon:mdi:tag-outline) **Annotate** HOMER, the nearest gene of each peak · [Version](params:homer) · [Annotation](tab:Annotation)
      5. ![](icon:mdi:set-merge) **Merge** One consensus set across libraries, then DESeq2 QC of its counts · [Version](params:consensus) · [Consensus](tab:Consensus)
      :::
    tag: at-ov-steps
    index: ov-steps
    layout: {x: 0, y: 7, w: 8, h: 3}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/atacseq aligns ATAC-seq reads, filters them, calls the accessible regions of each library with MACS2 and merges them into one consensus set. This page sums up one run; each tab behind it answers one question, in the order of the steps above.

      The sample filters in the left panel apply to every tab: narrow the samples once and the whole dashboard follows. A bar above a section narrows that section only.
    tag: at-ov-about
    index: ov-about
    layout: {x: 0, y: 10, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it.
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: sample_design
    aggregation: count
    column_name: sample
    column_type: object
    secondary_layout: composition
    breakdown_col: group
    display:
      icon_name: mdi:flask-outline
      icon_color: orange
      caption: in the design, by group
      link: tab:MultiQC
    section: Key figures
    tag: at-ov-kf-samples
    index: ov-kf-samples
    title: Samples
    description: Samples in the design, one per merged library. The bar splits them by group.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: macs2_peak_summary
    use: macs2/peak_summary
    aggregation: sum
    column_name: num_peaks
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-scatter-plot
      icon_color: indigo
      caption: peaks per library, with their spread
      link: tab:Peaks
      format: si
    section: Key figures
    tag: at-ov-kf-peaks
    index: ov-kf-peaks
    title: Peaks called
    description: MACS2 broad peaks over the libraries in view. The box shows how many each library yielded.
    layout: {x: 2, y: 0, w: 2, h: 2}
  # The consensus set stands in for the 1.2.2 differential calls: 2.x
  # publishes no contrast. The strip counts the intervals two libraries or
  # more call, the reproducible set.
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    aggregation: count
    column_name: num_samples
    column_type: int64
    secondary_layout: threshold
    threshold_value: 2
    threshold_direction: min
    display:
      icon_name: mdi:set-merge
      icon_color: violet
      caption: intervals; the strip, called by two libraries or more
      link: tab:Consensus
      format: si
    section: Key figures
    tag: at-ov-kf-consensus
    index: ov-kf-consensus
    title: Consensus intervals
    description: Intervals of the peak set merged across every library of the run. The strip counts those that at least two libraries call, the reproducible set, against the rest.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # frip_score is per library, so the median is of libraries, not of reads.
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: macs2_peak_summary
    use: macs2/peak_summary
    aggregation: median
    column_name: frip_score
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.3
    threshold_direction: min
    threshold_warn: 0.2
    display:
      icon_name: mdi:target
      icon_color: lime
      caption: median; ENCODE wants 30%, accepts 20%
      link: tab:MultiQC
      format: percent
    section: Key figures
    tag: at-ov-kf-frip
    index: ov-kf-frip
    title: FRiP
    description: Median fraction of each library's reads falling inside its called peaks, the ATAC signal-to-noise. The strip counts the libraries at the ENCODE target (30%), in the acceptable band (20%) and below it.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the group, then the chromosome of the peak calls.
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: sample_design
    interactive_component_type: MultiSelect
    column_name: group
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: Group
    section: Findings
    tag: at-ov-findings-group
    index: ov-findings-group
    title: Group
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: macs2_broad_peaks
    interactive_component_type: MultiSelect
    column_name: chr
    column_type: object
    display:
      icon_name: mdi:chart-timeline-variant
      custom_color: indigo
      strip_label: Chromosome
    section: Findings
    tag: at-ov-findings-chr
    index: ov-findings-chr
    title: Chromosome
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data.
  - component_type: text
    surface: card
    values:
      fold: {dc: macs2_broad_peaks, column: fold_enrichment, aggregation: median, format: 'decimals:1'}
      top: {dc: homer_annotated_peaks, column: annotation_class, aggregation: top}
      top_share: {dc: homer_annotated_peaks, column: annotation_class, aggregation: top_share, format: percent}
      n_cons: {dc: macs2_consensus_boolean, column: peak_id, aggregation: count, format: integer}
      n_repro: {dc: macs2_consensus_boolean, column: peak_id, aggregation: count, filter_expr: col('num_samples') > 1,
        format: integer}
      frag_top: {dc: ataqv_fragment_length, column: fragment_class, aggregation: top, weight: read_count}
      frag_share: {dc: ataqv_fragment_length, column: fragment_class, aggregation: top_share, weight: read_count,
        format: percent}
    body: |
      - **{{frag_share}}** of the reads come from {{frag_top}} fragments – the largest window of the fragment ladder [ATAC quality](tab:ATAC quality)
      - **{{fold}}** median fold enrichment of the peaks over the local background – MACS2 broad calls [Peaks](tab:Peaks)
      - **{{top_share}}** of the peaks sit in the {{top}} class – the most common HOMER feature class [Annotation](tab:Annotation)
      - **{{n_repro}}** of {{n_cons}} consensus intervals are called by more than one library – the reproducible set [Consensus](tab:Consensus)
    section: Findings
    tag: at-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One figure per result row, in the order of the rows above. The tiles of a
  # row share a stored height. With the contrasts gone, the volcano's place
  # goes to the fragment ladder: the ATAC-specific check a reader looks at
  # first, from the ATAC quality tab.
  - component_type: highlight
    section: Findings
    source_tab: ATAC quality
    source_component: aq-ladder
    caption: Fraction of reads at each fragment length, one curve per library; a working library shows the nucleosome steps.
    hide_legend: true
    tag: at-ov-hl-ladder
    index: ov-hl-ladder
    layout: {x: 0, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Peaks
    source_component: pk-density
    caption: Peak calls per megabase along the genome, one row per library; brighter is more calls.
    tag: at-ov-hl-calls
    index: ov-hl-calls
    layout: {x: 4, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Annotation
    source_component: anno-tss-distance
    caption: Each library's peaks by distance to the nearest start site, one curve per library; the band is the promoter window.
    hide_legend: true
    tag: at-ov-hl-tss
    index: ov-hl-tss
    layout: {x: 0, y: 6, w: 4, h: 4}
  # The consensus UpSet draws one set per library, too many for a third of the
  # row: this summary counts the intervals by how many replicates of each group
  # call them, so the bars wear the group colours of the other tabs.
  - component_type: figure
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    visu_type: bar
    mode: code
    code_content: |-
      # Consensus intervals by how many replicates of each group call a peak on them. The per-library 0/1 columns are unpivoted and the group is the library name without its merge suffix and replicate, the design group of the other tabs. Intervals a group does not call are left out.
      libs = [c for c in df.columns if c.endswith('.mLb.clN')]
      long = df.select(['peak_id', *libs]).unpivot(index='peak_id', on=libs, variable_name='library', value_name='called')
      long = long.with_columns(pl.col('library').str.replace(r'\.mLb\.clN$', '').str.replace(r'_R(EP)?\d+$', '').alias('group'), pl.col('called').cast(pl.Int64))
      per = long.group_by(['group', 'peak_id']).agg(pl.col('called').sum().alias('replicates'))
      d = per.filter(pl.col('replicates') > 0).group_by(['group', 'replicates']).agg(pl.len().cast(pl.Int64).alias('intervals')).sort(['group', 'replicates'])
      fig = px.bar(d.to_pandas(), x='replicates', y='intervals', color='group', barmode='group', color_discrete_map=depictio_category_colors.get('group') or {}, labels={'replicates': 'Replicates of the group calling the interval', 'intervals': 'Consensus intervals', 'group': ''})
      fig.update_xaxes(dtick=1)
      fig.update_layout(margin=dict(t=10))
    title: Replicate agreement
    link: tab:Consensus
    caption: Consensus intervals by how many replicates of each group call a peak on them; the right-hand bars of a group are the intervals all its replicates agree on.
    section: Findings
    tag: at-ov-consensus-support
    index: ov-consensus-support
    layout: {x: 4, y: 6, w: 4, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers. A tab the run does not have is left out.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [ATAC quality](tab:ATAC quality)
      - [Signal](tab:Signal)

      ### Peak calls
      - [Peaks](tab:Peaks)
      - [Annotation](tab:Annotation)
      - [Locus](tab:Locus)

      ### Comparison
      - [Consensus](tab:Consensus)
    section: How to read this dashboard
    tag: at-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the group first.
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: sample_design
    interactive_component_type: MultiSelect
    column_name: group
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: at-filter-group
    index: sample-filters-group
    title: Group
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: sample_design
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: at-filter-sample
    index: sample-filters-sample
    title: Sample
    layout: {x: 0, y: 2, w: 1, h: 3}
  # The second factor of the design, on the categorical twin of `replicate`.
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: sample_design
    interactive_component_type: MultiSelect
    column_name: replicate_label
    column_type: object
    display:
      icon_name: mdi:content-duplicate
      custom_color: cyan
    section: Sample filters
    group: Sample scope
    tag: at-filter-replicate
    index: sample-filters-replicate
    title: Replicate
    layout: {x: 0, y: 5, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: ataqv_metrics
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: tss_enrichment
    column_type: float64
    display:
      icon_name: mdi:target
      custom_color: lime
    section: QC thresholds
    group: Library quality
    tag: at-filter-tss
    index: qc-tss-range
    title: TSS enrichment
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: macs2_peak_summary
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: frip_score
    column_type: float64
    display:
      icon_name: mdi:magnet
      custom_color: yellow
    section: QC thresholds
    group: Library quality
    tag: at-filter-frip
    index: qc-frip-range
    title: FRiP score
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: macs2_peak_summary
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: num_peaks
    column_type: int64
    display:
      icon_name: mdi:counter
      custom_color: indigo
    section: QC thresholds
    group: Library quality
    tag: at-filter-peakcount
    index: qc-peakcount-range
    title: Peaks called
    layout: {x: 0, y: 6, w: 1, h: 3}
  # Row selection feeds the Analysis panel.
  - component_type: table
    workflow_tag: atacseq
    data_collection_tag: sample_design
    row_selection_enabled: true
    row_selection_column: sample
    section: Sample sheet
    tag: at-sample-sheet
    index: sample-sheet
    title: Sample sheet
    description: One row per sample, with its group, replicate, read type, role, control and merged-library name.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: atacseq
    data_collection_tag: macs2_peak_summary
    use: macs2/peak_summary
    row_selection_enabled: true
    row_selection_column: sample
    section: Reference tables
    tag: at-ref-table-summary
    index: ref-peak-summary
    title: Peak QC summary
    description: Peak count, FRiP score and the width, enrichment and significance spreads per library.
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
# ============================================================================
# Data & QC
# ============================================================================
- title: MultiQC
  subtitle: Did sequencing, alignment and filtering work for every library?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  grid_sections:
  - name: Run summary
    icon: mdi:view-dashboard-outline
    color: orange
    description: Every module's headline numbers, one row per library
  - name: Reads and alignment
    icon: mdi:chart-bar
    color: orange
    description: Reads sequenced per library, and the share that mapped before and after filtering
  - name: Enrichment
    icon: mdi:chart-line
    color: orange
    description: How concentrated the reads are, and how much of them falls in peaks
  - name: QC details
    icon: mdi:file-document-outline
    color: gray
