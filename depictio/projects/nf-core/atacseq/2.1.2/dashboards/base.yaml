# Comparison
# ============================================================================
- title: Consensus
  subtitle: Which peaks do the libraries agree on?
  tab_group: Comparison
  tab_order: 7
  tab_icon: mdi:set-merge
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Consensus filters
    icon: mdi:filter-variant
    color: violet
    description: How well supported an interval has to be before it counts
  grid_sections:
  - name: Consensus at a glance
    icon: mdi:counter
    color: violet
    description: How many intervals the merged set holds, and how many libraries back them
  - name: Replicate agreement
    icon: mdi:set-merge
    color: violet
    description: Which combinations of libraries call the same interval
  # Moved here from the 1.2.2 Differential tab, which 2.x no longer has.
  - name: Sample space
    icon: mdi:chart-box-outline
    color: violet
    description: Where the libraries sit on the consensus counts, before any interval
  - name: Signal at the strongest intervals
    icon: mdi:chart-box-outline
    color: violet
    description: Fold enrichment of the most strongly accessible intervals, clustered
    collapsed: true
  - name: Consensus tables
    icon: mdi:table
    color: gray
    description: The merged intervals, the fold enrichment, the components and the distances
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      The per-library calls merged into one set of intervals. An interval every library
      calls is reproducible; one a single library calls is noise or specific to its group.
      The UpSet shows which libraries agree, and the [DESeq2](https://bioconductor.org/packages/DESeq2)
      PCA and distances below it where the libraries sit on the consensus counts.
    tag: at-cons-intro
    index: cons-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: num_samples
    column_type: int64
    display:
      icon_name: mdi:account-group-outline
      custom_color: green
    section: Consensus filters
    group: Consensus
    tag: at-cons-filter-support
    index: cons-support-range
    title: Libraries per interval
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: num_peaks
    column_type: int64
    display:
      icon_name: mdi:layers-outline
      custom_color: orange
    section: Consensus filters
    group: Consensus
    tag: at-cons-filter-peaks
    index: cons-peaks-range
    title: Peaks merged
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_fc
    interactive_component_type: MultiSelect
    column_name: support
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: green
    section: Consensus filters
    group: Strongest intervals
    tag: at-cons-filter-fcsupport
    index: cons-fcsupport-filter
    title: Support
    layout: {x: 0, y: 6, w: 1, h: 3}
  # The breakdown is the chromosome: atacseq binds one consensus set (the
  # merged-library level), so `consensus_set` holds a single value.
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: chr
    display:
      icon_name: mdi:counter
      icon_color: violet
      caption: intervals, by chromosome
    section: Consensus at a glance
    tag: at-cons-card-intervals
    index: cons-card-intervals
    title: Consensus intervals
    description: Intervals of the merged peak set in view.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    aggregation: median
    column_name: num_samples
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:account-group-outline
      icon_color: indigo
      caption: median, with its spread
      decimals: 0
    section: Consensus at a glance
    tag: at-cons-card-support
    index: cons-card-support
    title: Libraries per interval
    description: How many libraries call a peak on each consensus interval.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    aggregation: sum
    column_name: num_peaks
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:layers-outline
      icon_color: teal
      caption: total; the bars, peaks per interval
    section: Consensus at a glance
    tag: at-cons-card-peaks
    index: cons-card-peaks
    title: Peaks merged
    description: Per-library peaks merged into the consensus intervals in view.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_fc
    use: macs2/consensus_fc
    aggregation: count
    column_name: support
    column_type: object
    secondary_layout: donut
    breakdown_col: support
    display:
      icon_name: mdi:chart-donut
      icon_color: orange
      caption: by libraries calling them
    section: Consensus at a glance
    tag: at-cons-card-strongest
    index: cons-card-strongest
    title: Strongest intervals
    description: The most strongly accessible intervals, split by how many libraries call them.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_upset
    config:
      # Library columns of the run, whatever the samples; the replicate-level
      # `.mRp.clN` set is left out.
      set_columns_pattern: '\.mLb\.clN$'
      color_intersections_by: degree
      show_set_sizes: true
      show_values: true
      sort_by: cardinality
      sort_order: descending
      min_size: 1
    section: Replicate agreement
    tag: at-cons-upset
    index: cons-upset
    title: Consensus peak overlap
    description: >-
      Which libraries agree on the same consensus intervals? Each column is one combination of libraries:
      the bar above it counts the consensus intervals called by exactly that combination, the dots below
      show which libraries are in it, and the bars on the left give each library's number of intervals.
      The biggest counts come first and the count is printed above each bar.

      How to read: a tall bar for all libraries, or for all replicates of a group, is a reproducible set,
      and many tall bars with a single dot are intervals only one library calls. Bars are coloured by
      degree, the number of libraries in the combination.

      Source: Lex et al., UpSet: Visualization of Intersecting Sets, IEEE Transactions on Visualization
      and Computer Graphics 2014, doi:10.1109/TVCG.2014.2346248
    layout: {x: 0, y: 0, w: 8, h: 8}
  - component_type: advanced_viz
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_fc
    use: macs2/consensus_signal_heatmap
    config:
      value_columns_pattern: '\.mLb\.clN$'
      row_annotation_cols: [support]
      cluster_rows: true
      cluster_cols: true
      normalize: log1p
      colorscale: Viridis
    section: Signal at the strongest intervals
    tag: at-cons-heatmap
    index: cons-heatmap
    title: Consensus signal heatmap
    description: >-
      Which intervals are strongest, and in which libraries? Each row is one of the strongest consensus
      intervals, the 250 with the largest summed fold enrichment, and each column a library; the colour is
      the MACS2 fold enrichment of that library on the interval, as log(1 + value), on the Viridis scale.

      How to read: blocks of bright cells shared by the replicates of a group are regions specific to that
      group, and a column that differs from its replicates is a library to check. A zero cell, in the
      darkest colour, is a library that called no peak on the interval. Rows and columns are clustered, so
      similar intervals and libraries sit next to each other.

      Lines and annotations: the strip at the right gives the number of libraries that call each interval,
      its support, and the dendrograms show the clustering, Ward linkage on Euclidean distance.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    row_selection_enabled: true
    row_selection_column: peak_id
    section: Consensus tables
    tag: at-cons-table-boolean
    index: cons-table-boolean
    title: Consensus intervals
    description: >-
      One row per consensus interval: its coordinates, how many per-library peaks merged into it, how many
      libraries call it, and a 0/1 column for each library.

      How to read: a 1 in a library's column means that library called a peak on the interval. Narrow by
      libraries per interval in the left panel to keep the intervals several libraries agree on, or sort by
      peaks merged.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: atacseq
    data_collection_tag: macs2_consensus_fc
    use: macs2/consensus_fc
    row_selection_enabled: true
    row_selection_column: peak_id
    section: Consensus tables
    tag: at-cons-table-fc
    index: cons-table-fc
    title: Consensus fold enrichment
    description: >-
      The fold enrichment of the strongest consensus intervals, one column per library, with the number of
      libraries that call each interval. The intervals are the 250 with the largest summed fold
      enrichment, and an interval a library did not call is 0.

      How to read: sort a library's column for its strongest intervals and compare across columns. A
      value of 0 is a library with no peak on the interval, not a measured absence of signal.
    layout: {x: 0, y: 6, w: 8, h: 6}
  # Sample space: the DESeq2 QC the pipeline still runs on the consensus
  # counts. The tags keep their 1.2.2 names (at-diff-*), from the tab they
  # lived on. The distance matrix is labelled with libraries on both axes, so
  # it takes the full width.
  - component_type: advanced_viz
    workflow_tag: atacseq
    data_collection_tag: deseq2_qc_pca
    use: deseq2/qc_pca_embedding
    config:
      color_col: group
      default_color_by: group
      point_size: 14
      marker_outline: true
      axis_prefix: PC
      legend_pos: right
      selection_enabled: true
      selection_column: sample_id
    section: Sample space
    tag: at-diff-pca
    index: diff-pca
    title: Consensus count PCA
    description: >-
      How do the libraries sit on their consensus counts? One point per sample at its first two principal
      components, coloured by group, as the pipeline's DESeq2 QC step computed them on the transformed
      counts of the consensus intervals (a variance stabilising transformation by default).

      How to read: replicates of a group should sit together and groups apart along a component. A sample
      far from its replicates is an outlier or a batch effect to check in the QC tabs. Click or lasso
      points to select samples.

      Note: the pipeline runs this QC only when the design has replicated groups.

      Sources: nf-core/atacseq deseq2_qc.r, prcomp on the centred transformed counts,
      https://github.com/nf-core/atacseq/blob/2.1.2/bin/deseq2_qc.r; Love et al., Genome Biology 2014,
      doi:10.1186/s13059-014-0550-8
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: atacseq
    data_collection_tag: deseq2_qc_sample_dists
    use: deseq2/qc_distance_heatmap
    config:
      cluster_rows: true
      cluster_cols: true
      cluster_method: ward
      normalize: none
      colorscale: Blues
    section: Sample space
    tag: at-diff-dists
    index: diff-dists
    title: Library distances
    description: >-
      How similar are the libraries to each other? A square heatmap with the same libraries on both axes:
      the Euclidean distance between each pair on the transformed consensus counts, which the pipeline's
      DESeq2 QC step computes, clustered here by Ward linkage so that similar libraries sit together.

      How to read: replicates of a group should form a block of small distances, and the groups should
      separate. A library that clusters away from its replicates is an outlier. The diagonal is 0, the
      distance of a library to itself.

      Note: the pipeline runs this QC only when the design has replicated groups.

      Sources: nf-core/atacseq deseq2_qc.r, dist on the transformed counts,
      https://github.com/nf-core/atacseq/blob/2.1.2/bin/deseq2_qc.r; Love et al., Genome Biology 2014,
      doi:10.1186/s13059-014-0550-8
    layout: {x: 0, y: 6, w: 8, h: 5}
  - component_type: table
    workflow_tag: atacseq
    data_collection_tag: deseq2_qc_pca
    use: deseq2/qc_pca
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Consensus tables
    tag: at-diff-table-pca
    index: diff-table-pca
    title: Principal components
    description: >-
      The first two principal components of every library, with the share of variance each explains and,
      when the run made several matrices, the matrix they come from.

      How to read: the percentages say how much of the spread a component carries, and a component with a
      small share says little about the groups. Sort a component to find the libraries at its extremes.

      Source: nf-core/atacseq deseq2_qc.r, https://github.com/nf-core/atacseq/blob/2.1.2/bin/deseq2_qc.r
    layout: {x: 0, y: 12, w: 8, h: 6}
  - component_type: table
    workflow_tag: atacseq
    data_collection_tag: deseq2_qc_sample_dists
    use: deseq2/qc_sample_dists
    row_selection_enabled: true
    row_selection_column: sample
    section: Consensus tables
    tag: at-diff-table-dists
    index: diff-table-dists
    title: Library distance matrix
    description: >-
      The square matrix of Euclidean distances between libraries on the transformed consensus counts, one
      row and one column per library.

      How to read: a small value is a pair of similar libraries, and the diagonal is 0. Sort a column to
      find the libraries nearest to the one it names.

      Source: nf-core/atacseq deseq2_qc.r, https://github.com/nf-core/atacseq/blob/2.1.2/bin/deseq2_qc.r
    layout: {x: 0, y: 18, w: 8, h: 6}
