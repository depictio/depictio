      caption: median over called genes, with its distribution
      decimals: 2
    section: Exon usage at a glance
    tag: rs-exon-card-edger-fc
    index: exon-card-edger-fc
    title: edgeR absolute log2 fold change
    description: Fold change of the most significant exon of each called gene, relative to its gene.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: rnasplice
