    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: rs-ev-card-rmats-called
    section: Events at a glance
    workflow_tag: rnasplice
    data_collection_tag: rmats_events
    aggregation: nunique
    column_name: event_id
    column_type: object
    filter_expr: "col('significant')"
    secondary_layout: donut
    breakdown_col: direction
    display: {icon_name: 'mdi:check-decagram', title_font_size: xl, value_font_size: xl}
    title: rMATS events called, by direction
    title_size: sm
    title_align: left
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: rs-ev-card-suppa
    section: Events at a glance
    workflow_tag: rnasplice
    data_collection_tag: suppa_events
    use: suppa/local_events
    aggregation: nunique
    column_name: event_id
    column_type: object
    secondary_layout: donut
    breakdown_col: event_type
    display: {icon_name: 'mdi:shape-outline', title_font_size: xl, value_font_size: xl}
    title: SUPPA2 events tested, by type
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: rs-ev-card-suppa-called
    section: Events at a glance
    workflow_tag: rnasplice
    data_collection_tag: suppa_events
    aggregation: nunique
    column_name: event_id
    column_type: object
    filter_expr: "col('significant')"
    secondary_layout: donut
    breakdown_col: direction
    display: {icon_name: 'mdi:check-decagram', title_font_size: xl, value_font_size: xl}
    title: SUPPA2 events called, by direction
    title_size: sm
    title_align: left
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: figure
    tag: rs-ev-fig-rmats-types
    index: rs-ev-fig-rmats-types
    section: Event types
    workflow_tag: rnasplice
    data_collection_tag: rmats_events
    mode: code
    code_content: |
      called = df.filter(pl.col('significant'))
      fig = px.histogram(
          called.to_pandas(), x='event_type', color='direction', barmode='stack',
          category_orders={'direction': ['up', 'down']},
      )
      fig.update_xaxes(categoryorder='total descending')
      fig.update_layout(
          xaxis_title='Event type', yaxis_title='Significant events',
          legend_title_text='Inclusion in treatment',
      )
    title: Significant rMATS events per type
    description: Called events per type, split by whether inclusion rises (up) or falls (down) in the treatment.
    title_size: h3
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: figure
    tag: rs-ev-fig-suppa-types
    index: rs-ev-fig-suppa-types
    section: Event types
    workflow_tag: rnasplice
    data_collection_tag: suppa_events
    mode: code
    code_content: |
      called = df.filter(pl.col('significant'))
      fig = px.histogram(
          called.to_pandas(), x='event_type', color='direction', barmode='stack',
          category_orders={'direction': ['up', 'down']},
      )
      fig.update_xaxes(categoryorder='total descending')
      fig.update_layout(
          xaxis_title='Event type', yaxis_title='Significant events',
          legend_title_text='Inclusion in treatment',
      )
    title: Significant SUPPA2 events per type
    description: Called events per type and direction; SUPPA2 adds alternative first and last exons to the rMATS types.
    title_size: h3
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    tag: rs-ev-av-rmats
    index: rs-ev-av-rmats
