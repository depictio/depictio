  - component_type: card
    workflow_tag: rnasplice
    data_collection_tag: edger_genes
    use: edger/diffsplice_genes
    aggregation: count
    column_name: gene_id
    column_type: object
    filter_expr: col('significant')
    secondary_layout: donut
    breakdown_col: direction
    display:
