version: 1
# nf-core/rnasplice 1.0.4: which genes change their splicing between conditions,
# and do the splicing tools agree? Every rule it follows is written out in
# depictio/projects/nf-core/RULES.md; ampliseq 2.18.0 is the reference, and the
# Data & QC group mirrors nf-core/rnaseq 3.26.0 (the same Sample Space strip).
#
# Funnel: MultiQC (are the libraries usable?) -> Sample Space (do the samples
# group by condition?) -> Tool Agreement (which genes does each tool call, and
# where do they agree?) -> Exon Usage (DEXSeq and edgeR on exons) -> Transcript
# Usage (DEXSeq DTU) -> Splicing Events (rMATS and SUPPA2).
#
# Every per-tool splicing collection is optional: a tool the run skipped prunes
# its tiles, its findings row and, when nothing is left, its tab. The cross-tool
# gene table (splicing_genes) is always built, so the persistent splicing
# filters sit on it and on the contrast table, which template.yaml links to
# every splicing collection.
main_dashboard:
  title: nf-core/rnasplice
  subtitle: Bulk RNA-seq, from reads to the genes whose splicing changes between conditions
  project_tag: RNA-seq Alternative Splicing Analysis
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab. The PCA's `group` holds the same
  # values as the group column, so the same values take the same colours. The
  # event types and the call directions are known vocabularies, written out.
  category_colors:
    '{GROUP_COL}': auto
    group: auto
    contrast: auto
    event_type:
      Skipped exon: '#2a78d6'
      Retained intron: '#eb6834'
      Mutually exclusive exons: '#1baf7a'
      Alternative 5' splice site: '#eda100'
      Alternative 3' splice site: '#e87ba4'
      Alternative first exon: '#4a3aa7'
      Alternative last exon: '#008300'
    direction:
      up: '#e34948'
      down: '#2a78d6'
      not significant: '#adb5bd'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. The
  # sample filters read the sample hub; the splicing filters read the contrast
  # table and the cross-tool gene table, whose links reach every splicing
  # collection. MultiQC and Sample Space carry no contrast, so they leave the
  # splicing filters out.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  - name: Splicing filters
    icon: mdi:scale-balance
    color: indigo
    description: Applies to every tab that reads splicing calls
    persistent: true
    pin: top
    exclude_tabs:
    - MultiQC
    - Sample Space
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The samples and the contrasts the run compared
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Samples, below).
  - component_type: interactive
    workflow_tag: rnasplice
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:account-group-outline
      custom_color: violet
      strip_label: Group
    section: Key figures
    tag: rs-ov-kf-group
    index: ov-kf-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: rnasplice
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: rs-ov-kf-sample
    index: ov-kf-sample
    title: Sample ID
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: text
    title: nf-core/rnasplice
    order: 1
    body: >
      Bulk RNA-seq libraries aligned, quantified and tested for differential splicing by four
      tools: which genes change how they are spliced between conditions, and where the tools
      agree. [Run parameters](params:)
    tag: rs-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/rnasplice aligns bulk RNA-seq reads with STAR, quantifies transcripts with Salmon, then tests each contrast for differential exon usage, transcript usage and splicing events. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The sample filters in the left panel apply to every tab, the contrast and gene filters to every splicing tab. A bar above a section narrows that section only.
    tag: rs-ov-about
    index: ov-about
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash.
  - component_type: text
    surface: card
    values:
      samples: {dc: samples, column: sample, aggregation: nunique, format: integer}
      contrasts: {dc: contrasts, column: contrast, aggregation: nunique, format: integer}
    body: |
      ### The run
      - ![](icon:mdi:flask-outline) **Samples** {{samples}}
      - ![](icon:mdi:scale-balance) **Contrasts** {{contrasts}}
      - ![](icon:mdi:dna) **Genome** {{param:genome}}
      - ![](icon:mdi:source-branch) **Aligner** {{param:aligner}}
    tag: rs-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Six steps from reads to splicing calls
      Each step names its settings and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:content-cut) **Trim** Trim Galore on the raw reads · [Settings](params:trim) · [MultiQC](tab:MultiQC)
      2. ![](icon:mdi:dna) **Align** STAR on {{param:genome}}, Salmon on transcripts · [Settings](params:star) · [Sample Space](tab:Sample Space)
      3. ![](icon:mdi:content-cut) **Exons** DEXSeq and edgeR on exon counts · [Settings](params:exon) · [Exon Usage](tab:Exon Usage)
      4. ![](icon:mdi:swap-vertical) **Transcripts** DEXSeq on transcript usage · [Settings](params:dtu) · [Transcript Usage](tab:Transcript Usage)
      5. ![](icon:mdi:shape-outline) **Events** rMATS and SUPPA2 on local events · [Settings](params:rmats) · [Splicing Events](tab:Splicing Events)
      6. ![](icon:mdi:set-merge) **Compare** The calls joined per gene · [Settings](params:contrasts) · [Tool Agreement](tab:Tool Agreement)
      :::
    tag: rs-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. The icon colour is that tab's colour.
  - component_type: card
    workflow_tag: rnasplice
    data_collection_tag: samples
    aggregation: nunique
    column_name: sample
    column_type: object
    secondary_layout: composition
    breakdown_col: '{GROUP_COL}'
    display:
      icon_name: mdi:flask-outline
      icon_color: orange
      caption: in the sample sheet, by group
      link: tab:MultiQC
    section: Key figures
    tag: rs-ov-kf-samples
    index: ov-kf-samples
    title: Samples
    description: Samples in the sheet, sequencing runs merged. The bar splits them by the group the contrasts compare.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnasplice
    data_collection_tag: sample_pca
    use: salmon/sample_pca
    aggregation: median
    column_name: genes_expressed
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:dna
      icon_color: cyan
      caption: median per library, at 1 TPM or more
      link: tab:Sample Space
      decimals: 0
    section: Key figures
    tag: rs-ov-kf-expressed
    index: ov-kf-expressed
    title: Genes expressed
    description: Median number of genes a library expresses at 1 TPM or more. The box shows how it spreads.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnasplice
    data_collection_tag: splicing_genes
    aggregation: count
    column_name: gene_id
    column_type: object
    filter_expr: col('tools_significant') >= 2
    secondary_layout: composition
    breakdown_col: tools_significant
    top_n_count: 4
    display:
      icon_name: mdi:set-merge
      icon_color: violet
      caption: genes, by the number of tools calling them
      link: tab:Tool Agreement
    section: Key figures
    tag: rs-ov-kf-agreed
    index: ov-kf-agreed
    title: Called by two tools or more
    description: Genes that at least two of the five splicing tests call, counted once per contrast. The bar splits them by how many tools call them.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnasplice
    data_collection_tag: rmats_events
    use: rmats/events
    aggregation: count
    column_name: event_id
    column_type: object
    filter_expr: col('significant')
    secondary_layout: composition
    breakdown_col: direction
    display:
      icon_name: mdi:shape-outline
      icon_color: grape
      caption: calls, by direction of inclusion
      link: tab:Splicing Events
    section: Key figures
    tag: rs-ov-kf-events
    index: ov-kf-events
    title: rMATS events called
    description: Local events rMATS calls under SPLICING_FDR with a large enough PSI change, up or down in the treatment.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the contrast, then the rMATS event type.
  - component_type: interactive
    workflow_tag: rnasplice
    data_collection_tag: contrasts
    interactive_component_type: MultiSelect
    column_name: contrast
    column_type: object
    display:
      icon_name: mdi:scale-balance
      custom_color: indigo
      strip_label: Contrast
    section: Findings
    tag: rs-ov-findings-contrast
    index: ov-findings-contrast
    title: Contrast
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: rnasplice
    data_collection_tag: rmats_events
    use: rmats/events
    interactive_component_type: MultiSelect
    column_name: event_type
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: grape
      strip_label: Event type
    section: Findings
    tag: rs-ov-findings-event-type
    index: ov-findings-event-type
    title: Event type
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its tool.
  - component_type: text
    surface: card
    values:
      n_agree: {dc: splicing_genes, column: gene_id, aggregation: nunique, filter_expr: "col('tools_significant') >= 2",
        format: integer}
      n_called: {dc: splicing_genes, column: gene_id, aggregation: nunique, filter_expr: "col('tools_significant') >= 1",
        format: integer}
      dex_n: {dc: dexseq_exon_genes, column: gene_id, aggregation: nunique, filter_expr: "col('significant')", format: integer}
      dtu_n: {dc: dexseq_dtu, column: gene_id, aggregation: nunique, filter_expr: "col('gene_significant')", format: integer}
      top_event: {dc: rmats_events, column: event_type, aggregation: top, filter_expr: "col('significant')"}
      ev_share: {dc: rmats_events, column: event_type, aggregation: top_share, filter_expr: "col('significant')", format: percent}
    body: |
      - **{{n_agree}}** genes are called by two tools or more, of {{n_called}} called by any – over the contrasts in view [Tool Agreement](tab:Tool Agreement)
      - **{{dex_n}}** genes change exon usage – DEXSeq, gene q-value under the cut-off [Exon Usage](tab:Exon Usage)
      - **{{dtu_n}}** genes switch transcript usage – DEXSeq DTU, gene q-value under the cut-off [Transcript Usage](tab:Transcript Usage)
      - **{{ev_share}}** of the rMATS calls are {{top_event}} events – the most frequent type [Splicing Events](tab:Splicing Events)
    section: Findings
    tag: rs-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One figure per analysis tab, in the order of the rows above.
  - component_type: highlight
    section: Findings
    source_tab: Tool Agreement
    source_component: rs-agree-per-tool
    caption: Genes each tool calls, darker where more tools agree; the lightest segment is the calls a tool makes alone.
    tag: rs-ov-hl-tools
    index: ov-hl-tools
    layout: {x: 0, y: 2, w: 5, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Exon Usage
    source_component: rs-exon-dexseq-volcano
    caption: DEXSeq, one point per gene at its most significant exonic bin.
    tag: rs-ov-hl-dexseq
    index: ov-hl-dexseq
    layout: {x: 5, y: 2, w: 3, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Transcript Usage
    source_component: rs-tx-volcano
    caption: DEXSeq DTU, one point per transcript, coloured by the direction of its usage change.
    tag: rs-ov-hl-dtu
    index: ov-hl-dtu
    layout: {x: 0, y: 7, w: 3, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Splicing Events
    source_component: rs-ev-rmats-types
    caption: Called rMATS events per type, split by whether inclusion rises or falls in the treatment.
    tag: rs-ov-hl-event-types
    index: ov-hl-event-types
    layout: {x: 3, y: 7, w: 5, h: 5}
  # Link-only tab tiles: each tile prints its tab's subtitle. A tab the run does
  # not have is left out, and a heading whose tabs are all missing is hidden.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Sample Space](tab:Sample Space)

      ### Splicing
      - [Tool Agreement](tab:Tool Agreement)
      - [Exon Usage](tab:Exon Usage)
      - [Transcript Usage](tab:Transcript Usage)
      - [Splicing Events](tab:Splicing Events)
    section: How to read this dashboard
    tag: rs-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the group first.
  - component_type: interactive
    workflow_tag: rnasplice
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:account-group-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: rs-filter-group
    index: sample-filters-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: rnasplice
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: rs-filter-sample
    index: sample-filters-sample
    title: Sample ID
    layout: {x: 0, y: 2, w: 1, h: 3}
  # One contrast at a time: rnasplice often lists a contrast and its mirror,
  # and a gene called in both counts twice.
  - component_type: interactive
    workflow_tag: rnasplice
    data_collection_tag: contrasts
    interactive_component_type: Select
    column_name: contrast
    column_type: object
    display:
      icon_name: mdi:scale-balance
      custom_color: indigo
    section: Splicing filters
    group: Comparison
    tag: rs-filter-contrast
    index: splicing-filters-contrast
    title: Contrast
    layout: {x: 0, y: 0, w: 1, h: 2}
  # A gene pick reaches every per-tool table through the gene_id links.
  - component_type: interactive
    workflow_tag: rnasplice
    data_collection_tag: splicing_genes
    interactive_component_type: MultiSelect
    column_name: gene_name
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: violet
    section: Splicing filters
    group: Comparison
    tag: rs-filter-gene
    index: splicing-filters-gene
    title: Gene
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: table
    workflow_tag: rnasplice
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample
    section: Sample sheet
    tag: rs-sheet-samples
    index: sheet-samples
    title: Samples
    description: One row per sample, sequencing runs merged, with the design columns.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: rnasplice
    data_collection_tag: contrasts
    row_selection_enabled: true
    row_selection_column: contrast
    section: Sample sheet
    tag: rs-sheet-contrasts
    index: sheet-contrasts
    title: Contrasts
    description: Each contrast sets a treatment against a control; every effect is treatment minus control.
    layout: {x: 0, y: 6, w: 8, h: 6}
tabs:
- title: MultiQC
  subtitle: Did trimming, alignment and quantification work for every library?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # Bound to multiqc_data, not the sample hub: the report names its libraries
  # with read suffixes, and this filter lists them as the panels do.
  filter_sections:
  - name: MultiQC report
    icon: mdi:file-document-outline
    color: orange
    description: Libraries as the MultiQC report names them
  grid_sections:
  - name: QC overview
    icon: mdi:chart-box-outline
    color: orange
    description: Headline numbers, reads kept through trimming, and how STAR mapped them
  - name: Quantification
    icon: mdi:chart-bar
    color: orange
    description: Reads featureCounts put on exons, and Salmon's fragment lengths
  - name: QC details
    icon: mdi:chart-bell-curve
    color: gray
    description: The remaining FastQC, STAR and samtools panels of the report
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [MultiQC](https://multiqc.info) gathers the per-library reports of FastQC, Trim Galore,
      [STAR](https://github.com/alexdobin/STAR), samtools, featureCounts and
      [Salmon](https://combine-lab.github.io/salmon/). Splicing tests need depth on junctions,
      so compare read counts and unique mapping within each condition first. featureCounts
      feeds the exon-level tests and Salmon the transcript-level ones.
    tag: rs-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: MultiQC report
    tag: rs-mqc-filter-sample
    index: mqc-sample-filter
    title: Sample ID
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: multiqc
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: QC overview
    tag: rs-qc-general-stats
    title: General statistics
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Counts
    section: QC overview
    tag: rs-qc-fastqc-counts
    title: Sequence counts, raw and trimmed
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    use: multiqc/cutadapt
    selected_module: cutadapt
    selected_plot: Filtered Reads
    section: QC overview
    tag: rs-qc-cutadapt-filtered
    title: Reads kept by Trim Galore
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    use: multiqc/star
    selected_module: star
    selected_plot: Summary Statistics
    section: QC overview
    tag: rs-qc-star-summary
    title: STAR alignment summary
    layout: {x: 0, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Percent mapped
    section: QC overview
    tag: rs-qc-samtools-mapped
    title: Mapped reads (samtools)
    layout: {x: 4, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    use: multiqc/featurecounts
    selected_module: featurecounts
    selected_plot: Assignments
    section: Quantification
    tag: rs-qc-featurecounts
    title: featureCounts assignments
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    use: multiqc/salmon
    selected_module: salmon
    selected_plot: salmon-section-1
    section: Quantification
    tag: rs-qc-salmon
    title: Salmon fragment length distribution
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Adapter Content
    section: QC details
    tag: rs-qc-fastqc-adapters
    title: Adapter content
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    section: QC details
    tag: rs-qc-fastqc-quality
    title: Per-base sequence quality
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Duplication Levels
    section: QC details
    tag: rs-qc-fastqc-duplication
    title: Sequence duplication levels
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Status Checks
    section: QC details
    tag: rs-qc-fastqc-status
    title: FastQC status checks
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    use: multiqc/star
    selected_module: star
    selected_plot: Alignment Scores
    section: QC details
    tag: rs-qc-star-scores
    title: STAR alignment scores
    layout: {x: 0, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Alignment stats
    section: QC details
    tag: rs-qc-samtools-stats
    title: samtools alignment stats
    layout: {x: 4, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: rnasplice
