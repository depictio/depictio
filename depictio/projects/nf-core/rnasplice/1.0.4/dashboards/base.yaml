version: 1
# nf-core/rnasplice 1.0.4: which genes change their splicing between conditions,
# and do the splicing tools agree?
#
# Funnel: MultiQC (are the libraries usable?) -> Sample space (do the samples
# group by condition?) -> Splicing overview (which genes does each tool call,
# and where do the tools agree?) -> Exon usage (DEXSeq and edgeR on exons) ->
# Transcript usage (DEXSeq DTU) -> Splicing events (rMATS and SUPPA2).
#
# Two sections ride every tab: `Run at a glance` (four run-size cards, pinned
# top) and `Sample sheet` (pinned top, collapsed), plus the persistent `Run
# scope` filters. The contrast filter reads the contrast table, which
# template.yaml links to every splicing collection, so one pick keeps every
# tab on one comparison (rnasplice often lists a contrast and its mirror). A
# gene or tool-agreement filter on the overview reaches the per-tool tabs
# through the gene links. Every splicing collection is optional; a tool the
# run skipped leaves its tiles empty.
main_dashboard:
  title: nf-core/rnasplice
  subtitle: "nf-core/rnasplice 1.0.4: RNA-seq QC, sample space and differential splicing across DEXSeq, edgeR, rMATS and SUPPA2"
  project_tag: RNA-seq Alternative Splicing Analysis
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  advanced_viz_controls: header
  filter_sections:
  - name: Run scope
    icon: mdi:filter-variant
    color: teal
    description: Which samples, groups and contrast every tab is about
    persistent: true
    pin: top
  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: The size and design of the run, on every tab
    persistent: true
    pin: top
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The samples and the contrasts the run compared, on every tab
    collapsed: true
    persistent: true
    pin: top
  - name: Read quality
    icon: mdi:chart-bell-curve
    color: blue
    description: Raw read counts and adapter content, before trimming
  - name: Trimming
    icon: mdi:tune
    color: grape
    description: What Trim Galore removed from each library
  - name: Alignment
    icon: mdi:dna
    color: indigo
    description: How STAR placed the reads on the genome
  - name: Quantification
    icon: mdi:chart-bar
    color: cyan
    description: Reads assigned to exons and to transcripts
  - name: More MultiQC panels
    icon: mdi:chart-box-outline
    color: gray
    description: The remaining FastQC, STAR and samtools panels of the report
    collapsed: true
  components:
  # ------------------------------------------------------------ run at a glance
  - component_type: card
    tag: rs-card-samples
    section: Run at a glance
    workflow_tag: rnasplice
    data_collection_tag: samples
    aggregation: nunique
    column_name: sample
    column_type: object
    secondary_layout: donut
    breakdown_col: '{GROUP_COL}'
    display: {icon_name: 'mdi:test-tube', title_font_size: xl, value_font_size: xl}
    title: Samples by {GROUP_COL_DISPLAY}
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: rs-card-contrasts
    section: Run at a glance
    workflow_tag: rnasplice
    data_collection_tag: contrasts
    aggregation: nunique
    column_name: contrast
    column_type: object
    secondary_layout: donut
    breakdown_col: treatment
    display: {icon_name: 'mdi:scale-balance', title_font_size: xl, value_font_size: xl}
    title: Contrasts by treatment
    title_size: sm
    title_align: left
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: rs-card-genes-detected
    section: Run at a glance
    workflow_tag: rnasplice
    data_collection_tag: sample_pca
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: genes_detected
    column_type: int64
    display: {icon_name: 'mdi:dna', title_font_size: xl, value_font_size: xl}
    title: Genes detected per sample
    title_size: sm
    title_align: left
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: rs-card-genes-tested
    section: Run at a glance
    workflow_tag: rnasplice
    data_collection_tag: splicing_genes
    aggregation: nunique
    column_name: gene_id
    column_type: object
    display: {icon_name: 'mdi:set-merge', title_font_size: xl, value_font_size: xl}
    title: Genes tested for splicing
    title_size: sm
    title_align: left
    layout: {x: 6, y: 0, w: 2, h: 2}

  # --------------------------------------------------------------- sample sheet
  - component_type: text
    tag: rs-sheet-intro
    section: Sample sheet
    workflow_tag: rnasplice
    data_collection_tag: samples
    title: What the run compared
    title_size: sm
    title_align: left
    order: 0
    alignment: left
    body: >
      One row per sample with its condition, plus the design table's factors
      when the run was given one. Each contrast sets a treatment against a
      control, and every effect in the splicing tabs is treatment minus control.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: rs-table-samples
    section: Sample sheet
    workflow_tag: rnasplice
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample
    title: Samples
    description: One row per sample, sequencing runs merged, with the design columns; select rows to narrow the MultiQC panels and the sample space to those samples.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 4}
  - component_type: table
    tag: rs-table-contrasts
    section: Sample sheet
    workflow_tag: rnasplice
    data_collection_tag: contrasts
    row_selection_enabled: true
    row_selection_column: contrast
    title: Contrasts
    description: The comparisons the splicing tools ran, with their treatment and control condition; select a row to keep every splicing tab on that comparison.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 6, w: 8, h: 3}

  # --------------------------------------------------------------- read quality
  - component_type: text
    tag: rs-qc-reads-intro
    section: Read quality
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    title: Raw reads per library
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Splicing tests need depth on junctions, so compare the read counts of
      the libraries within each condition. Adapter content that climbs at the
      read ends is what Trim Galore removes next.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: rs-qc-fastqc-counts
    section: Read quality
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Counts
    title: Sequence counts, raw and trimmed
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: rs-qc-fastqc-adapters
    section: Read quality
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Adapter Content
    title: Adapter content
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}

  # ------------------------------------------------------------------- trimming
  - component_type: text
    tag: rs-qc-trim-intro
    section: Trimming
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    title: What trimming removed
    title_size: sm
    title_align: left
    order: 3
    alignment: left
    body: >
      A library that loses far more reads than its peers deserves a second
      look before its splicing calls are trusted.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: rs-qc-cutadapt-filtered
    section: Trimming
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    use: multiqc/cutadapt
    selected_module: cutadapt
    selected_plot: Filtered Reads
    title: Reads kept by Trim Galore
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 5}

  # ------------------------------------------------------------------ alignment
  - component_type: text
    tag: rs-qc-align-intro
    section: Alignment
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    title: How well the reads mapped
    title_size: sm
    title_align: left
    order: 4
    alignment: left
    body: >
      DEXSeq exon usage, edgeR and rMATS read the STAR alignments, so a low
      unique-mapping share weakens exactly those tools. A high multi-mapped
      share points to repeats or a mismatched annotation.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: rs-qc-star-summary
    section: Alignment
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    use: multiqc/star
    selected_module: star
    selected_plot: Summary Statistics
    title: STAR alignment summary
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: rs-qc-samtools-mapped
    section: Alignment
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Percent mapped
    title: Mapped reads (samtools)
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}

  # ------------------------------------------------------------- quantification
  - component_type: text
    tag: rs-qc-quant-intro
    section: Quantification
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    title: Reads on exons and transcripts
    title_size: sm
    title_align: left
    order: 5
    alignment: left
    body: >
      featureCounts assigns reads to the exons the exon-level tests count on.
      Salmon's fragment lengths come from the transcript quantification that
      DTU and SUPPA2 build on.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: rs-qc-featurecounts
    section: Quantification
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    use: multiqc/featurecounts
    selected_module: featurecounts
    selected_plot: Assignments
    title: featureCounts assignments
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: rs-qc-salmon
    section: Quantification
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    use: multiqc/salmon
    selected_module: salmon
    selected_plot: salmon-section-1
    title: Salmon fragment length distribution
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}

  # -------------------------------------------------------- more MultiQC panels
  - component_type: multiqc
    tag: rs-qc-fastqc-quality
    section: More MultiQC panels
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    title: Per-base sequence quality
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: multiqc
    tag: rs-qc-fastqc-duplication
    section: More MultiQC panels
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Duplication Levels
    title: Sequence duplication levels
    title_size: sm
    title_align: left
    layout: {x: 4, y: 0, w: 4, h: 5}
  - component_type: multiqc
    tag: rs-qc-fastqc-status
    section: More MultiQC panels
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Status Checks
    title: FastQC status checks
    title_size: sm
    title_align: left
    layout: {x: 0, y: 5, w: 4, h: 5}
  - component_type: multiqc
    tag: rs-qc-star-scores
    section: More MultiQC panels
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    use: multiqc/star
    selected_module: star
    selected_plot: Alignment Scores
    title: STAR alignment scores
    title_size: sm
    title_align: left
    layout: {x: 4, y: 5, w: 4, h: 5}
  - component_type: multiqc
    tag: rs-qc-samtools-stats
    section: More MultiQC panels
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Alignment stats
    title: samtools alignment stats
    title_size: sm
    title_align: left
    layout: {x: 0, y: 10, w: 4, h: 5}
  - component_type: multiqc
    tag: rs-qc-samtools-flagstat
    section: More MultiQC panels
    workflow_tag: rnasplice
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Flagstat
    title: samtools flagstat
    title_size: sm
    title_align: left
    layout: {x: 4, y: 10, w: 4, h: 5}

  # ------------------------------------------------------------------ run scope
  - component_type: interactive
    tag: rs-filter-sample
    index: rs-sample-filter
    section: Run scope
    group: Samples
    workflow_tag: rnasplice
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:test-tube'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: rs-filter-group
    index: rs-group-filter
    section: Run scope
    group: Samples
    workflow_tag: rnasplice
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:account-group-outline'}
    placement: left
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: rs-filter-contrast
    index: rs-contrast-filter
    section: Run scope
    group: Comparison
    workflow_tag: rnasplice
    data_collection_tag: contrasts
    interactive_component_type: Select
    column_name: contrast
    column_type: object
    display: {title_size: md, custom_color: '#3949AB', icon_name: 'mdi:scale-balance'}
    placement: left
    title: Contrast
    layout: {x: 0, y: 6, w: 1, h: 3}

tabs:
# ================================================================ Sample space
- title: Sample space
  subtitle: Do the samples group by condition on their gene expression?
  tab_order: 1
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  advanced_viz_controls: header
  filter_sections:
  - name: Library expression
    icon: mdi:tune
    color: cyan
    description: Narrow to samples inside a gene-detection band
  grid_sections:
  - name: Sample space
    icon: mdi:chart-scatter-plot
    color: cyan
    description: Where the samples sit on the leading principal components; lasso a point to read its record
  - name: Top variable genes
    icon: mdi:chart-box-outline
    color: cyan
    description: The genes that vary most across the samples, clustered
  - name: Sample rows
    icon: mdi:table
    color: gray
    description: The per-sample PCA coordinates and expression summary
    collapsed: true
  components:
  - component_type: text
    tag: rs-sp-intro
    section: Sample space
    workflow_tag: rnasplice
    data_collection_tag: sample_pca
    title: Do the samples separate by condition?
    title_size: sm
    title_align: left
    order: 1
    alignment: left
    body: >
      Splicing differences are easiest to trust when the replicates of a
      condition sit together here. A sample far from its group can drive a
      tool's calls on its own.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: rs-sp-av-pca
    index: rs-sp-av-pca
    section: Sample space
    workflow_tag: rnasplice
    data_collection_tag: sample_pca
    use: salmon/pca
    config:
      color_col: group
      point_size: 12
      show_centroids: true
      selection_enabled: true
      selection_column: sample_id
      legend_pos: right
      controls_placement: header
    title: Sample PCA on Salmon TPMs
    description: One point per sample on the most variable genes, coloured by condition; lasso points to read them in the record beside it and filter the linked panels.
    title_size: h3
    layout: {x: 0, y: 2, w: 5, h: 7}
  - component_type: advanced_viz
    tag: rs-sp-av-heatmap
    index: rs-sp-av-heatmap
    section: Top variable genes
    workflow_tag: rnasplice
    data_collection_tag: expression_heatmap
    use: salmon/top_variable_heatmap
    config:
      cluster_rows: true
      cluster_cols: true
      normalize: row_z
      colorscale: RdBu
    title: Most variable genes
    description: Row-normalised log2(TPM + 1) with rows and columns clustered, so the replicates of one condition should form a block.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 9}
  - component_type: advanced_viz
    tag: rs-sp-av-record
    index: rs-sp-av-record
    section: Sample space
    workflow_tag: rnasplice
    data_collection_tag: sample_pca
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: sample_id
      title_col: sample_id
      selection_source: any
      linked_component: rs-sp-av-pca
      sections:
        Sample: [sample_id, group]
        Expression: [genes_detected, genes_expressed, median_tpm]
        Position: [dim_1, dim_2]
    title: Sample record
    description: The sample picked in the PCA (or in the sample rows) as a fact panel, with its position on the first two components.
    title_size: h3
    layout: {x: 5, y: 2, w: 3, h: 7}
  - component_type: table
    tag: rs-sp-table-pca
    section: Sample rows
    workflow_tag: rnasplice
    data_collection_tag: sample_pca
    row_selection_enabled: true
    row_selection_column: sample_id
    title: Sample PCA and expression summary
    description: One row per sample, with the design columns.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: interactive
    tag: rs-sp-filter-expressed
    index: rs-sp-expressed-filter
    section: Library expression
    group: Expression
    workflow_tag: rnasplice
    data_collection_tag: sample_pca
    interactive_component_type: RangeSlider
    column_name: genes_expressed
    column_type: int64
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:dna'}
    placement: left
    title: Genes expressed (TPM 1 or more)
    layout: {x: 0, y: 0, w: 1, h: 3}

# ========================================================== Splicing overview
- title: Splicing overview
  subtitle: Which genes does each splicing tool call, and where do the tools agree?
  tab_order: 2
  tab_icon: mdi:set-merge
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  advanced_viz_controls: header
  filter_sections:
  - name: Gene scope
    icon: mdi:filter-variant
    color: violet
    description: How many tools must agree, and which genes; reaches the per-tool tabs
  grid_sections:
  - name: Agreement at a glance
    icon: mdi:counter
    color: violet
    description: How many genes the tools call, alone and together
  - name: Tool agreement
    icon: mdi:set-merge
    color: violet
    description: The genes each combination of tools calls
  - name: Gene detail
    icon: mdi:information-outline
    color: violet
    description: One row per gene; select a gene to read every tool's evidence in the record beside the table
  components:
  - component_type: text
    tag: rs-ov-intro
    section: Agreement at a glance
    workflow_tag: rnasplice
    data_collection_tag: splicing_genes
    title: Where do the splicing tools agree?
    title_size: sm
    title_align: left
    order: 1
    alignment: left
    body: >
      The tools test different units (exons, transcripts, local events), so a
      gene that several of them call is a stronger candidate than one a single
      tool reports. Pick one contrast first, since a contrast and its mirror
      both count.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: rs-ov-card-called
    section: Agreement at a glance
    workflow_tag: rnasplice
    data_collection_tag: splicing_genes
    aggregation: nunique
    column_name: gene_id
    column_type: object
    filter_expr: "col('tools_significant') >= 1"
    secondary_layout: top_n
    breakdown_col: tools
    top_n_count: 3
    display: {icon_name: 'mdi:check-decagram', title_font_size: xl, value_font_size: xl}
    title: Genes called by any tool
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: rs-ov-card-agreed
    section: Agreement at a glance
    workflow_tag: rnasplice
    data_collection_tag: splicing_genes
    aggregation: nunique
    column_name: gene_id
    column_type: object
    filter_expr: "col('tools_significant') >= 2"
    secondary_layout: top_n
    breakdown_col: tools
    top_n_count: 3
    display: {icon_name: 'mdi:set-merge', title_font_size: xl, value_font_size: xl}
    title: Genes called by two tools or more
    title_size: sm
    title_align: left
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: rs-ov-card-tools
    section: Agreement at a glance
    workflow_tag: rnasplice
    data_collection_tag: splicing_genes
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: tools_significant
    column_type: int64
    filter_expr: "col('tools_significant') >= 1"
    display: {icon_name: 'mdi:relation-many-to-many', title_font_size: xl, value_font_size: xl}
    title: Tools per called gene
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: rs-ov-card-dpsi
    section: Agreement at a glance
    workflow_tag: rnasplice
    data_collection_tag: splicing_genes
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: rmats_max_abs_dpsi
    column_type: float64
    filter_expr: "col('rmats')"
    display: {icon_name: 'mdi:chart-bell-curve', title_font_size: xl, value_font_size: xl}
    title: Largest rMATS PSI shift per called gene
    title_size: sm
    title_align: left
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: rs-ov-av-upset
    index: rs-ov-av-upset
    section: Tool agreement
    workflow_tag: rnasplice
    data_collection_tag: splicing_genes
    viz_kind: upset_plot
    config:
      viz_kind: upset_plot
      set_columns: [dexseq_exon, edger, dexseq_dtu, rmats, suppa]
      sort_by: cardinality
      sort_order: descending
      min_size: 1
      show_set_sizes: true
      color_intersections_by: degree
    title: Genes called per combination of tools
    description: Each bar counts the genes that one combination of tools calls, and the set sizes are each tool's own total. A tool the run skipped shows an empty set.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: table
    tag: rs-ov-table-genes
    section: Gene detail
    workflow_tag: rnasplice
    data_collection_tag: splicing_genes
    row_selection_enabled: true
    row_selection_column: gene_id
    title: Cross-tool calls per gene
    description: One row per contrast and gene; select a row to read it in the record beside the table and carry it to the per-tool tabs.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 5, h: 7}
