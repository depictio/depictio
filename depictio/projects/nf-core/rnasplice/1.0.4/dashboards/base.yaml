    display:
      icon_name: mdi:ruler
      custom_color: indigo
    section: Exon usage filters
    tag: rs-exon-filter-fc
    index: exon-fc-filter
    title: Absolute log2 fold change, both tools
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: rnasplice
    data_collection_tag: dexseq_exon_genes
    use: dexseq/exon_genes
    aggregation: count
    column_name: gene_id
    column_type: object
    filter_expr: col('significant')
    secondary_layout: composition
    breakdown_col: direction
    display:
      icon_name: mdi:swap-vertical
      icon_color: indigo
      caption: genes, by direction of the top bin
    section: Exon usage at a glance
    tag: rs-exon-card-dexseq
    index: exon-card-dexseq
    title: DEXSeq calls
    description: Genes with a DEXSeq gene q-value under SPLICING_FDR, per contrast.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnasplice
    data_collection_tag: dexseq_exon_genes
    use: dexseq/exon_genes
    aggregation: median
    column_name: abs_log2fc
    column_type: float64
    filter_expr: col('significant')
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: cyan
      caption: median over called genes, with its spread
      decimals: 2
    section: Exon usage at a glance
    tag: rs-exon-card-dexseq-fc
    index: exon-card-dexseq-fc
    title: DEXSeq absolute log2 fold change
    description: Fold change of the most significant bin of each called gene, treatment over control.
