  advanced_viz_controls: header
  filter_sections:
  - name: Event scope
    icon: mdi:filter-variant
    color: grape
    description: Event types, direction and size of the inclusion change, per tool
  grid_sections:
  - name: Events at a glance
    icon: mdi:counter
    color: grape
    description: Events each tool tested and called, by type and direction
  - name: Event types
    icon: mdi:chart-bar
    color: grape
    description: Significant events per type and direction, per tool
  - name: rMATS
    icon: mdi:chart-scatter-plot
    color: grape
    description: rMATS FDR against the inclusion difference, per event
  - name: SUPPA2
    icon: mdi:chart-scatter-plot
    color: pink
    description: SUPPA2 p-value against the delta PSI, per event
  - name: Event detail
    icon: mdi:information-outline
    color: grape
    description: One row per rMATS event; select one to read its coverage and inclusion per condition in the record beside the table
  - name: Event rows
    icon: mdi:table
    color: gray
    description: One row per contrast and SUPPA2 local event, selectable
    collapsed: true
  components:
  - component_type: text
    tag: rs-ev-intro
    section: Events at a glance
    workflow_tag: rnasplice
    data_collection_tag: rmats_events
    title: Which kinds of splicing change?
    title_size: sm
    title_align: left
    order: 1
    alignment: left
    body: >
      Both tools score local events such as skipped exons and retained introns
      by the change in percent spliced-in, treatment minus control. rMATS
      counts junction reads, while SUPPA2 derives PSI from transcript abundances.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: rs-ev-card-rmats
    section: Events at a glance
