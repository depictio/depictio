      top_n_labels: 15
      show_labels: true
      p_value_col: pvalue
      view: volcano
      views: [volcano, qq]
    title: rMATS FDR against inclusion difference
    description: One point per event, coloured by type and labelled with its gene. The dashed lines mark FDR 0.05 and a 0.1 PSI change; SPLICING_FDR and MIN_DPSI set the calls.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: advanced_viz
    tag: rs-ev-av-suppa
