- title: Tool Agreement
  subtitle: Which genes does each tool call, and where do the tools agree?
  tab_group: Splicing
  tab_order: 3
  tab_icon: mdi:set-merge
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Agreement filters
    icon: mdi:filter-variant
    color: violet
    description: How many tools must call a gene; reaches the per-tool tabs
  grid_sections:
  - name: Agreement at a glance
    icon: mdi:counter
    color: violet
    description: Genes tested and called, alone and together, over the contrasts in view
  - name: Calls per tool
    icon: mdi:chart-bar
    color: violet
    description: The genes each tool calls, by how many tools agree
  - name: Tool combinations
    icon: mdi:set-merge
    color: violet
    description: The genes each combination of tools calls
  - name: Gene detail
    icon: mdi:information-outline
    color: gray
    description: One row per contrast and gene; pick one to read every tool's evidence
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      The five splicing tests ([DEXSeq](https://bioconductor.org/packages/DEXSeq) on exons and
      transcripts, [edgeR](https://bioconductor.org/packages/edgeR),
      [rMATS](https://rnaseq-mats.sourceforge.io) and
      [SUPPA2](https://github.com/comprehensive-genomics/SUPPA)) joined per gene: a gene that
      several of them call is a stronger candidate than one a single tool reports. Pick one
      contrast first in the left panel, since a contrast and its mirror both count. The bars
      split each tool's calls by how many tools agree, and the UpSet counts the genes each
      combination of tools calls.
    tag: rs-agree-intro
    index: agree-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: rnasplice
    data_collection_tag: splicing_genes
    interactive_component_type: Slider
    column_name: tools_significant
    column_type: int64
    display:
      icon_name: mdi:set-merge
      custom_color: violet
    section: Agreement filters
    tag: rs-agree-filter-tools
    index: agree-tools-filter
    title: Tools calling the gene
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: card
    workflow_tag: rnasplice
    data_collection_tag: splicing_genes
    aggregation: nunique
    column_name: gene_id
    column_type: object
    secondary_layout: composition
    breakdown_col: tools_tested
    top_n_count: 5
    display:
      icon_name: mdi:dna
      icon_color: blue
      caption: genes, by the number of tests covering them
    section: Agreement at a glance
    tag: rs-agree-card-tested
    index: agree-card-tested
    title: Genes tested
    description: Genes at least one splicing test covered. The bar splits them by how many of the five tests covered them.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnasplice
    data_collection_tag: splicing_genes
    aggregation: nunique
    column_name: gene_id
    column_type: object
    filter_expr: col('tools_significant') >= 1
    secondary_layout: composition
    breakdown_col: contrast
    top_n_count: 4
    display:
      icon_name: mdi:check-decagram
      icon_color: teal
      caption: genes, by contrast
    section: Agreement at a glance
    tag: rs-agree-card-called
    index: agree-card-called
    title: Called by any tool
    description: Genes at least one test calls, split by contrast.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnasplice
    data_collection_tag: splicing_genes
    aggregation: count
    column_name: gene_id
    column_type: object
    filter_expr: col('tools_significant') >= 2
    secondary_layout: composition
    breakdown_col: tools_significant
    top_n_count: 4
    display:
      icon_name: mdi:relation-many-to-many
      icon_color: violet
      caption: genes, by the number of tools calling them
    section: Agreement at a glance
    tag: rs-agree-card-agreed
    index: agree-card-agreed
    title: Called by two tools or more
    description: Genes at least two tests call, counted once per contrast. The bar splits them by how many tools call them.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnasplice
    data_collection_tag: splicing_genes
    aggregation: median
    column_name: tools_significant
    column_type: int64
    filter_expr: col('tools_significant') >= 1
    secondary_layout: gauge
    coverage_max: 5
    display:
      icon_name: mdi:gauge
      icon_color: orange
      caption: median per called gene, of five tests
      decimals: 0
    section: Agreement at a glance
    tag: rs-agree-card-tools
    index: agree-card-tools
    title: Tools per called gene
    description: How many of the five tests call a gene, over the genes at least one calls.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Each tool's calls, stacked by how many tools call the gene: the summary the
  # Overview highlights, since a five-set UpSet cannot read at a third of the row.
  # No sample column, so Analysis mode's groups do not apply here.
  - component_type: figure
    workflow_tag: rnasplice
    data_collection_tag: splicing_genes
    visu_type: bar
    mode: code
    code_content: |-
      names = {'dexseq_exon': 'DEXSeq exon', 'edger': 'edgeR', 'dexseq_dtu': 'DEXSeq DTU', 'rmats': 'rMATS', 'suppa': 'SUPPA2'}
      parts = [df.filter(pl.col(c)).select(pl.lit(n).alias('tool'), pl.col('tools_significant')) for c, n in names.items()]
      d = pl.concat(parts).group_by(['tool', 'tools_significant']).agg(pl.len().alias('genes'))
      d = d.with_columns(pl.when(pl.col('tools_significant') == 1).then(pl.lit('this tool alone')).otherwise(pl.col('tools_significant').cast(pl.Utf8) + pl.lit(' tools')).alias('agreement'))
      order = ['this tool alone', '2 tools', '3 tools', '4 tools', '5 tools']
      fig = px.bar(d.to_pandas(), x='genes', y='tool', color='agreement', orientation='h', category_orders={'agreement': order, 'tool': list(names.values())}, color_discrete_sequence=px.colors.sequential.Purples[4:], labels={'genes': 'Called genes, per contrast', 'tool': 'Tool', 'agreement': 'Tools calling the gene'})
      fig.update_layout(barmode='stack', margin=dict(t=10))
    section: Calls per tool
    tag: rs-agree-per-tool
    index: rs-agree-per-tool
    title: Genes each tool calls, by agreement
    description: A gene counts once per contrast; a tool the run skipped draws no bar.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: rnasplice
    data_collection_tag: splicing_genes
    viz_kind: upset_plot
    config:
      viz_kind: upset_plot
      set_columns: [dexseq_exon, edger, dexseq_dtu, rmats, suppa]
      sort_by: cardinality
      sort_order: descending
      min_size: 1
      show_set_sizes: true
      color_intersections_by: degree
    section: Tool combinations
    tag: rs-agree-upset
    index: rs-agree-upset
    title: Genes called per combination of tools
    description: A tool the run skipped shows an empty set.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: rnasplice
    data_collection_tag: splicing_genes
    row_selection_enabled: true
    row_selection_column: gene_id
    section: Gene detail
    tag: rs-agree-table
    index: agree-table-genes
    title: Cross-tool calls per gene
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: rnasplice
    data_collection_tag: splicing_genes
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: gene_id
      title_col: gene_name
      selection_source: any
      linked_component: rs-agree-table
      sections:
        Gene: [gene_name, gene_id, contrast, tools, tools_significant, tools_tested]
        DEXSeq exon usage: [dexseq_exon, dexseq_exon_padj, dexseq_exon_log2fc]
        edgeR diffSpliceDGE: [edger, edger_fdr, edger_log2fc]
        DEXSeq transcript usage: [dexseq_dtu, dexseq_dtu_padj]
        rMATS: [rmats, rmats_events_significant, rmats_max_abs_dpsi, rmats_min_fdr]
        SUPPA2: [suppa, suppa_events_significant, suppa_max_abs_dpsi, suppa_min_pvalue]
      link_templates:
        gene_id: https://www.ensembl.org/id/{value}
    section: Gene detail
    tag: rs-agree-record
    index: rs-agree-record
    title: Gene record
    layout: {x: 5, y: 0, w: 3, h: 6}
- title: Exon Usage
  subtitle: Which genes use their exons differently, per DEXSeq and edgeR?
  tab_group: Splicing
  tab_order: 4
  tab_icon: mdi:content-cut
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Exon usage filters
    icon: mdi:filter-variant
    color: indigo
    description: Direction and size of the exon usage change; each narrows both tools
  grid_sections:
  - name: Exon usage at a glance
    icon: mdi:counter
    color: indigo
    description: Genes each exon-level tool calls, and how large the changes are
  - name: DEXSeq exon usage
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Gene q-value against the most significant bin's fold change
  - name: edgeR diffSpliceDGE
    icon: mdi:chart-scatter-plot
    color: blue
    description: Gene F-test FDR against the most significant exon's fold change
  - name: Exon gene rows
    icon: mdi:table
    color: gray
    description: One row per contrast and gene for each tool, selectable
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [DEXSeq](https://bioconductor.org/packages/DEXSeq) and
      [edgeR](https://bioconductor.org/packages/edgeR) diffSpliceDGE ask whether an exon changes
      its share of the gene's reads, and a positive fold change means more usage in the
      treatment. Each volcano places a gene at its most significant exon; genes far out on
      both are the robust exon-level calls. Pick a contrast first in the left panel.
    tag: rs-exon-intro
    index: exon-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Both tools name these columns alike, and a filter narrows every collection
  # with its column: one filter each, on different tools so a run that skips
  # either keeps one.
