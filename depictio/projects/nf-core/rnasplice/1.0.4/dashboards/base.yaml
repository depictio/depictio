  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Transcript filters
    icon: mdi:filter-variant
    color: teal
    description: Direction and size of the transcript usage change
  grid_sections:
  - name: Transcript usage at a glance
    icon: mdi:counter
    color: teal
    description: Transcripts and genes DEXSeq DTU calls, and how large the shifts are
  - name: Transcript volcano
    icon: mdi:chart-scatter-plot
    color: teal
    description: Transcript adjusted p-value against usage fold change
  - name: Transcript rows
    icon: mdi:table
    color: gray
    description: One row per contrast and transcript, selectable
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [DEXSeq](https://bioconductor.org/packages/DEXSeq) DTU tests each transcript's share of its
      gene's expression, from the [Salmon](https://combine-lab.github.io/salmon/) estimates, so
      a gene can switch isoforms without changing its total. Look for transcripts of one gene
      moving in opposite directions; the QQ view checks the raw p-values.
    tag: rs-tx-intro
    index: tx-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: rnasplice
    data_collection_tag: dexseq_dtu
    use: dexseq/dtu
    interactive_component_type: MultiSelect
    column_name: direction
    column_type: object
    display:
      icon_name: mdi:swap-vertical
      custom_color: teal
    section: Transcript filters
    tag: rs-tx-filter-direction
    index: tx-direction-filter
    title: Transcript call
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: rnasplice
    data_collection_tag: dexseq_dtu
    interactive_component_type: RangeSlider
    column_name: log2fc
    column_type: float64
    display:
      icon_name: mdi:ruler
      custom_color: teal
    section: Transcript filters
    tag: rs-tx-filter-fc
    index: tx-fc-filter
    title: Usage log2 fold change
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: rnasplice
    data_collection_tag: dexseq_dtu
    use: dexseq/dtu
    aggregation: count
    column_name: transcript_id
    column_type: object
    filter_expr: col('significant')
    secondary_layout: composition
    breakdown_col: direction
    display:
      icon_name: mdi:swap-vertical
      icon_color: teal
      caption: transcripts, by direction
    section: Transcript usage at a glance
    tag: rs-tx-card-called
    index: tx-card-called
    title: Called transcripts
    description: Transcripts with an adjusted p-value under SPLICING_FDR, per contrast.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnasplice
    data_collection_tag: dexseq_dtu
    aggregation: nunique
    column_name: gene_id
    column_type: object
    filter_expr: col('gene_significant')
    secondary_layout: composition
    breakdown_col: contrast
    top_n_count: 4
    display:
      icon_name: mdi:dna
      icon_color: grape
      caption: genes, by contrast
    section: Transcript usage at a glance
    tag: rs-tx-card-genes
    index: tx-card-genes
    title: Genes with a switch
    description: Genes whose DEXSeq gene-level q-value is under SPLICING_FDR.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnasplice
    data_collection_tag: dexseq_dtu
    use: dexseq/dtu
    aggregation: median
    column_name: log2fc
    column_type: float64
    # Rising transcripts only: over both directions the median sits at 0.
    filter_expr: col('significant') & (col('log2fc') > 0)
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:arrow-up-down
      icon_color: orange
      caption: median over called transcripts gaining usage, with its spread
      decimals: 2
    section: Transcript usage at a glance
    tag: rs-tx-card-fc
    index: tx-card-fc
    title: Usage gain
    description: Usage log2 fold change of the called transcripts that gain share of their gene, treatment over control.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnasplice
    data_collection_tag: dexseq_dtu
    aggregation: median
    column_name: base_mean
    column_type: float64
    filter_expr: col('significant')
    secondary_layout: histogram
    display:
      icon_name: mdi:waves
      icon_color: cyan
      caption: median over called transcripts, with its distribution
      decimals: 0
    section: Transcript usage at a glance
    tag: rs-tx-card-mean
    index: tx-card-mean
    title: Mean count
    description: Mean normalised count of the called transcripts. Low counts make usage shifts noisy.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: rnasplice
    data_collection_tag: dexseq_dtu
    use: dexseq/dtu_volcano
    config:
      significance_threshold: 0.05
      effect_threshold: 1.0
      # Labelled with gene ids, one per transcript: labels would pile up.
      show_labels: false
      effect_label: Usage log2 fold change
      significance_label: -log10 adjusted p-value
      p_value_col: pvalue
      view: volcano
      views: [volcano, qq]
    section: Transcript volcano
    tag: rs-tx-volcano
    index: rs-tx-volcano
    title: Transcript adjusted p-value against usage fold change
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: rnasplice
    data_collection_tag: dexseq_dtu
    use: dexseq/dtu
    row_selection_enabled: true
    row_selection_column: gene_id
    section: Transcript rows
    tag: rs-tx-table
    index: tx-table
    title: DEXSeq transcript usage
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Splicing Events
  subtitle: Which event types change, and by how much inclusion?
  tab_group: Splicing
  tab_order: 6
  tab_icon: mdi:shape-outline
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Event filters
    icon: mdi:filter-variant
    color: grape
    description: Event type, direction and size of the inclusion change; each narrows both tools
  grid_sections:
  - name: Events at a glance
    icon: mdi:counter
    color: grape
    description: Events rMATS tested and called, and the types SUPPA2 calls
  - name: Event types
    icon: mdi:chart-bar
    color: grape
    description: Called events per type and direction, per tool
  - name: rMATS
    icon: mdi:chart-scatter-plot
    color: grape
    description: rMATS FDR against the inclusion difference, per event
  - name: SUPPA2
    icon: mdi:chart-scatter-plot
    color: pink
    description: SUPPA2 p-value against the delta PSI, per event
  - name: Event detail
    icon: mdi:information-outline
    color: gray
    description: One row per rMATS event; pick one to read its inclusion per condition
    collapsed: true
  - name: SUPPA2 rows
    icon: mdi:table
    color: gray
    description: One row per contrast and SUPPA2 local event, selectable
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [rMATS](https://rnaseq-mats.sourceforge.io) and
      [SUPPA2](https://github.com/comprehensive-genomics/SUPPA) score local events such as
      skipped exons and retained introns by the change in percent spliced-in (PSI), treatment
      minus control. rMATS counts junction reads, while SUPPA2 derives PSI from transcript
      abundances. Read the event types first, then each volcano; an rMATS event picked in the
      table below opens its locus.
    tag: rs-ev-intro
    index: ev-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  # rMATS and SUPPA2 name these columns alike, and a filter narrows every
  # collection with its column: one filter each, split over the two tools so a
  # run that skips either keeps one. SUPPA2 carries all seven event types.
  - component_type: interactive
    workflow_tag: rnasplice
    data_collection_tag: suppa_events
    use: suppa/local_events
    interactive_component_type: MultiSelect
    column_name: event_type
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: grape
    section: Event filters
    tag: rs-ev-filter-type
    index: ev-type-filter
    title: Event type, both tools
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: rnasplice
    data_collection_tag: rmats_events
    use: rmats/events
    interactive_component_type: MultiSelect
    column_name: direction
    column_type: object
    display:
      icon_name: mdi:swap-vertical
      custom_color: grape
    section: Event filters
    tag: rs-ev-filter-direction
    index: ev-direction-filter
    title: Call, both tools
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: rnasplice
    data_collection_tag: suppa_events
    interactive_component_type: RangeSlider
    column_name: abs_dpsi
    column_type: float64
    display:
      icon_name: mdi:ruler
      custom_color: grape
    section: Event filters
    tag: rs-ev-filter-dpsi
    index: ev-dpsi-filter
    title: Absolute PSI change, both tools
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: rnasplice
    data_collection_tag: rmats_events
    use: rmats/events
    aggregation: count
    column_name: event_id
    column_type: object
    secondary_layout: donut
    breakdown_col: event_type
    display:
      icon_name: mdi:shape-outline
      icon_color: grape
      caption: events per contrast, by type
    section: Events at a glance
    tag: rs-ev-card-rmats
    index: ev-card-rmats
    title: rMATS events tested
    description: Events with enough junction reads for rMATS to test, one per contrast and event.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnasplice
    data_collection_tag: rmats_events
    aggregation: count
    column_name: event_id
    column_type: object
    filter_expr: col('significant')
    secondary_layout: composition
    breakdown_col: direction
    display:
      icon_name: mdi:check-decagram
      icon_color: red
      caption: calls, by direction of inclusion
    section: Events at a glance
    tag: rs-ev-card-rmats-called
    index: ev-card-rmats-called
    title: rMATS calls
    description: Events under SPLICING_FDR with an absolute PSI change of at least MIN_DPSI.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnasplice
    data_collection_tag: rmats_events
    aggregation: median
    column_name: abs_dpsi
    column_type: float64
    filter_expr: col('significant')
    secondary_layout: histogram
    display:
      icon_name: mdi:ruler
      icon_color: orange
      caption: median over calls, with its distribution
      decimals: 2
    section: Events at a glance
    tag: rs-ev-card-rmats-dpsi
    index: ev-card-rmats-dpsi
    title: rMATS absolute PSI change
    description: Inclusion change of the called events, from MIN_DPSI up to 1 for an event fully switched between conditions.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnasplice
    data_collection_tag: suppa_events
    use: suppa/local_events
    aggregation: count
    column_name: event_id
    column_type: object
    filter_expr: col('significant')
    secondary_layout: donut
    breakdown_col: event_type
    top_n_count: 4
    display:
      icon_name: mdi:target
      icon_color: pink
      caption: calls, by event type
    section: Events at a glance
    tag: rs-ev-card-suppa
    index: ev-card-suppa
    title: SUPPA2 calls
    description: Local events under SPLICING_FDR with an absolute delta PSI of at least MIN_DPSI.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Called events per type, stacked by direction in the family's direction
  # colours. No sample column, so Analysis mode's groups do not apply here.
  - component_type: figure
    workflow_tag: rnasplice
    data_collection_tag: rmats_events
    visu_type: histogram
    mode: code
    code_content: |-
      called = df.filter(pl.col('significant'))
      fig = px.histogram(called.to_pandas(), x='event_type', color='direction', barmode='stack', category_orders={'direction': ['up', 'down']}, color_discrete_map=depictio_category_colors.get('direction') or {}, labels={'event_type': 'Event type', 'direction': 'Inclusion in treatment'})
      fig.update_xaxes(categoryorder='total descending', automargin=True)
      fig.update_layout(yaxis_title='Called events', margin=dict(t=10))
    section: Event types
    tag: rs-ev-rmats-types
    index: rs-ev-rmats-types
    title: Called rMATS events per type
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: rnasplice
    data_collection_tag: suppa_events
    visu_type: histogram
    mode: code
    code_content: |-
      called = df.filter(pl.col('significant'))
      fig = px.histogram(called.to_pandas(), x='event_type', color='direction', barmode='stack', category_orders={'direction': ['up', 'down']}, color_discrete_map=depictio_category_colors.get('direction') or {}, labels={'event_type': 'Event type', 'direction': 'Inclusion in treatment'})
      fig.update_xaxes(categoryorder='total descending', automargin=True)
      fig.update_layout(yaxis_title='Called events', margin=dict(t=10))
    section: Event types
    tag: rs-ev-suppa-types
    index: rs-ev-suppa-types
    title: Called SUPPA2 events per type
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: advanced_viz
    workflow_tag: rnasplice
    data_collection_tag: rmats_events
    use: rmats/event_volcano
    config:
      significance_threshold: 0.05
      effect_threshold: 0.1
      # Gene symbols; one gene can carry several top events, so keep few labels.
      top_n_labels: 8
      show_labels: true
      effect_label: PSI change, treatment minus control
      significance_label: -log10 FDR
      p_value_col: pvalue
      view: volcano
      views: [volcano, qq]
    section: rMATS
    tag: rs-ev-rmats-volcano
    index: rs-ev-rmats-volcano
    title: rMATS FDR against inclusion difference
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: rnasplice
    data_collection_tag: suppa_events
    use: suppa/local_event_volcano
    config:
      significance_threshold: 0.05
      effect_threshold: 0.1
      # Gene ids, often joined (ENSG1_and_ENSG2): labels would pile up.
      show_labels: false
      effect_label: Delta PSI, treatment minus control
      significance_label: -log10 p-value
      p_value_col: pvalue
      view: volcano
      views: [volcano, qq]
    section: SUPPA2
    tag: rs-ev-suppa-volcano
    index: rs-ev-suppa-volcano
    title: SUPPA2 p-value against delta PSI
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: rnasplice
    data_collection_tag: rmats_events
    use: rmats/events
    row_selection_enabled: true
    row_selection_column: event_id
    section: Event detail
    tag: rs-ev-table-rmats
    index: ev-table-rmats
    title: rMATS events
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: rnasplice
    data_collection_tag: rmats_events
    use: rmats/event_record
    config:
      id_col: event_id
      title_col: gene_name
      selection_source: any
      linked_component: rs-ev-table-rmats
      sections:
        Event: [gene_name, gene_id, event_type, contrast, locus, strand]
        Inclusion: [psi_treatment, psi_control, dpsi]
        Support: [reads_treatment, reads_control]
        Test: [pvalue, fdr, significant, direction]
      link_templates:
        gene_id: https://www.ensembl.org/id/{value}
        locus: https://genome.ucsc.edu/cgi-bin/hgTracks?db={GENOME}&position={value}
    section: Event detail
    tag: rs-ev-record
    index: rs-ev-record
    title: Event record
    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: table
    workflow_tag: rnasplice
    data_collection_tag: suppa_events
    use: suppa/local_events
    row_selection_enabled: true
    row_selection_column: event_id
    section: SUPPA2 rows
    tag: rs-ev-table-suppa
    index: ev-table-suppa
    title: SUPPA2 local events
    layout: {x: 0, y: 0, w: 8, h: 6}
