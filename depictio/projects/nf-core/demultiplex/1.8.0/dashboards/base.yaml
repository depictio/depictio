# ======================================================================
- title: Library QC
  subtitle: How each library looks once demultiplexed, and whether the design groups differ
  tab_order: 4
  tab_icon: mdi:test-tube
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Library QC scope
    icon: mdi:tune
    color: grape
    description: Narrow to libraries inside a duplication or GC band, on this tab only
  grid_sections:
  - name: Library QC at a glance
    icon: mdi:counter
    color: grape
    description: The fastp read QC of every library and lane
  - name: Library QC distributions
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Libraries against each other (lasso a point to read its card beside the scatter), and design groups compared metric by metric
  - name: fastp table
    icon: mdi:table
    color: gray
    description: One row per library and lane
    collapsed: true
  components:
  - component_type: text
    tag: dm-lib-intro
    section: Library QC at a glance
    workflow_tag: demultiplex
    data_collection_tag: fastp_library_qc
    title: A library that looks different from its group
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [fastp](https://github.com/OpenGene/fastp) read each demultiplexed
      library; look for libraries that leave their design group on
      duplication, adapter or GC. Pick a point or a row to open its card.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: dm-lib-card-passed
    index: dm-lib-card-passed
    section: Library QC at a glance
    workflow_tag: demultiplex
    data_collection_tag: fastp_library_qc
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: pct_passed
    column_type: float64
    display: {icon_name: 'mdi:filter-variant', title_font_size: xl, value_font_size: xl}
    title: Reads kept by fastp (%)
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: dm-lib-card-dup
    index: dm-lib-card-dup
    section: Library QC at a glance
    workflow_tag: demultiplex
    data_collection_tag: fastp_library_qc
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: pct_duplication
    column_type: float64
    display: {icon_name: 'mdi:set-merge', title_font_size: xl, value_font_size: xl}
    title: Duplication (%)
    title_size: sm
    title_align: left
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: dm-lib-card-adapter
    index: dm-lib-card-adapter
    section: Library QC at a glance
    workflow_tag: demultiplex
    data_collection_tag: fastp_library_qc
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: pct_adapter_trimmed
    column_type: float64
    display: {icon_name: 'mdi:ruler', title_font_size: xl, value_font_size: xl}
    title: Reads with adapter (%)
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: dm-lib-card-q30
    index: dm-lib-card-q30
    section: Library QC at a glance
    workflow_tag: demultiplex
    data_collection_tag: fastp_library_qc
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: pct_q30_after
    column_type: float64
    display: {icon_name: 'mdi:check-decagram', title_font_size: xl, value_font_size: xl}
    title: Bases at Q30 after fastp (%)
    title_size: sm
    title_align: left
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: dm-lib-scatter
    index: dm-lib-scatter
    section: Library QC distributions
    workflow_tag: demultiplex
    data_collection_tag: libraries
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: pct_duplication
      y_col: pct_q30_after
      label_col: sample
      color_col: '{GROUP_COL}'
      size_col: reads
      x_title: Duplication (%)
      y_title: Bases at Q30 after fastp (%)
      selection_enabled: true
      selection_column: sample
      controls_placement: header
    title: Duplication against base quality
    description: One point per library, sized by reads and coloured by design group; lasso points to read them in the library card beside it and narrow the other tiles.
    title_size: h3
    layout: {x: 0, y: 0, w: 5, h: 7}
  - component_type: advanced_viz
    tag: dm-lib-group-compare
    index: dm-lib-group-compare
    section: Library QC distributions
    workflow_tag: demultiplex
    data_collection_tag: libraries
    viz_kind: group_compare
    config:
      viz_kind: group_compare
      index_col: sample
      group_col: '{GROUP_COL}'
      test: wilcoxon
      log_transform: false
      min_observations: 2
      controls_placement: header
    title: Design groups compared metric by metric
    description: Every numeric library metric compared between two design groups or two saved selections. With a few libraries per group the test is a screen, not a verdict.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 7}
  - component_type: advanced_viz
    tag: dm-lib-record
    index: dm-lib-record
    section: Library QC distributions
    workflow_tag: demultiplex
    data_collection_tag: libraries
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: sample
      title_col: sample
      selection_source: any
      sections:
        Library: [sample, '{GROUP_COL}', flowcell, lanes, index]
        Demultiplexing: [reads, pct_of_run, pct_of_expected, yield_mb, pct_q30, mean_quality, pct_perfect_index]
        Read QC: [reads_after_filter, pct_passed, pct_duplication, pct_adapter_trimmed, gc_pct, pct_q30_after, insert_size_peak]
      linked_component: dm-lib-scatter
    title: Library card
    description: The library lassoed in the scatter beside it (or selected in the fastp table) as a fact panel; it stays empty until a library is picked.
    title_size: h3
    layout: {x: 5, y: 0, w: 3, h: 7}
  - component_type: table
