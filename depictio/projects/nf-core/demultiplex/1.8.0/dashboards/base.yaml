# ======================================================================
- title: Demultiplexing
  subtitle: How evenly the reads of each lane were shared between the libraries
  tab_order: 2
  tab_icon: mdi:chart-donut
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Balance scope
    icon: mdi:tune
    color: indigo
    description: Narrow to libraries inside a lane-share or index-purity band, on this tab only
  grid_sections:
  - name: Balance at a glance
    icon: mdi:counter
    color: indigo
    description: Reads assigned, share of the lane, base quality and index purity per library
  - name: Lane composition
    icon: mdi:chart-donut
    color: teal
    description: What each lane was made of, Undetermined included
  - name: Library balance
    icon: mdi:scale-balance
    color: blue
    description: Share of the lane and index purity per library
  - name: Per-lane library counts
    icon: mdi:table
    color: gray
    description: One row per library and lane, Undetermined rows included
    collapsed: true
  components:
  - component_type: text
    tag: dm-dmx-intro
    section: Balance at a glance
    workflow_tag: demultiplex
    data_collection_tag: demux_stats
    title: An even pool gives even bars
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each library should hold about its planned share of the lane; a library
      far below it was under-pooled or lost its index. The cards count
      libraries only, the composition keeps the Undetermined reads visible.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: dm-dmx-card-reads
    index: dm-dmx-card-reads
    section: Balance at a glance
    workflow_tag: demultiplex
    data_collection_tag: demux_stats
    use: bcl2fastq/demux_stats
    filter_expr: "col('is_undetermined') == False"
    aggregation: sum
    column_name: reads
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:counter', title_font_size: xl, value_font_size: xl}
    title: Reads assigned to libraries
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: dm-dmx-card-share
    index: dm-dmx-card-share
    section: Balance at a glance
    workflow_tag: demultiplex
    data_collection_tag: demux_stats
    use: bcl2fastq/demux_stats
    filter_expr: "col('is_undetermined') == False"
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: pct_of_lane
    column_type: float64
    display: {icon_name: 'mdi:chart-donut', title_font_size: xl, value_font_size: xl}
    title: Share of the lane per library (%)
    title_size: sm
    title_align: left
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: dm-dmx-card-q30
    index: dm-dmx-card-q30
    section: Balance at a glance
    workflow_tag: demultiplex
    data_collection_tag: demux_stats
    use: bcl2fastq/demux_stats
    filter_expr: "col('is_undetermined') == False"
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: pct_q30
    column_type: float64
    display: {icon_name: 'mdi:check-decagram', title_font_size: xl, value_font_size: xl}
    title: Bases at Q30 per library (%)
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: dm-dmx-card-perfect-index
    index: dm-dmx-card-perfect-index
    section: Balance at a glance
    workflow_tag: demultiplex
    data_collection_tag: demux_stats
    use: bcl2fastq/demux_stats
    filter_expr: "col('is_undetermined') == False"
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: pct_perfect_index
    column_type: float64
    display: {icon_name: 'mdi:shield-check-outline', title_font_size: xl, value_font_size: xl}
    title: Perfect index match per library (%)
    title_size: sm
    title_align: left
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: dm-dmx-lane-composition
    index: dm-dmx-lane-composition
    section: Lane composition
    workflow_tag: demultiplex
    data_collection_tag: demux_stats
    use: bcl2fastq/lane_composition
    config:
      top_n: 12
      sort_by: abundance
      controls_placement: header
    title: Libraries per lane
    description: Share of each lane per library, Undetermined included; the twelve largest libraries are named, the rest pooled.
    title_size: h3
    layout: {x: 0, y: 0, w: 4, h: 7}
  - component_type: advanced_viz
    tag: dm-dmx-lane-sunburst
    index: dm-dmx-lane-sunburst
    section: Lane composition
    workflow_tag: demultiplex
    data_collection_tag: demux_stats
    use: bcl2fastq/lane_sunburst
    config:
      controls_placement: header
    title: Run, lane, library
    description: Reads per lane, then per library inside the lane.
    title_size: h3
    layout: {x: 4, y: 0, w: 4, h: 7}
  - component_type: figure
    tag: dm-dmx-share-bar
    index: dm-dmx-share-bar
    section: Library balance
    workflow_tag: demultiplex
    data_collection_tag: demux_stats
    use: bcl2fastq/demux_stats
    visu_type: bar
    dict_kwargs: {x: sample, y: pct_of_lane, color: lane_label}
    title: Share of the lane per library
    description: One bar per library and lane, Undetermined included.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: advanced_viz
    tag: dm-dmx-index-purity
    index: dm-dmx-index-purity
    section: Library balance
    workflow_tag: demultiplex
    data_collection_tag: demux_stats
    use: bcl2fastq/library_index_purity
    config:
      log_x: true
      controls_placement: header
      selection_enabled: true
      selection_column: sample
    title: Reads against index purity
    description: One point per library and lane; a library with few reads and a low perfect-match share lost reads to index errors.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 7}
  - component_type: table
    tag: dm-dmx-table
    section: Per-lane library counts
    workflow_tag: demultiplex
    data_collection_tag: demux_stats
    use: bcl2fastq/demux_stats
    row_selection_enabled: true
    row_selection_column: sample
    page_size: 25
    title: Reads per library and lane
    description: Select rows to narrow the library hub and the other tabs to those libraries.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: interactive
    tag: dm-dmx-filter-share
    index: dm-dmx-filter-share
    section: Balance scope
    group: Balance
    workflow_tag: demultiplex
    data_collection_tag: demux_stats
    interactive_component_type: RangeSlider
    column_name: pct_of_lane
    column_type: float64
    display: {title_size: md, icon_name: 'mdi:chart-donut'}
    placement: left
    title: Share of the lane (%)
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: dm-dmx-filter-purity
    index: dm-dmx-filter-purity
    section: Balance scope
    group: Balance
    workflow_tag: demultiplex
    data_collection_tag: demux_stats
    interactive_component_type: RangeSlider
    column_name: pct_perfect_index
    column_type: float64
    display: {title_size: md, icon_name: 'mdi:shield-check-outline'}
    placement: left
    title: Perfect index match (%)
    layout: {x: 0, y: 3, w: 1, h: 3}

