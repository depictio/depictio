version: 1
# nf-core/demultiplex 1.8.0: sequencing-facility run QC. Every rule it follows
# is written out in depictio/projects/nf-core/RULES.md; ampliseq/2.18.0 is the
# reference.
#
# The funnel: the Overview, then Data & QC (what MultiQC and CheckQC flagged,
# whether the instrument delivered per lane, read and cycle), then
# Demultiplexing (how evenly the reads were shared between the libraries, what
# went to Undetermined and why, how each library reads once demultiplexed).
#
# The library hub `libraries` carries the design columns of METADATA_FILE and is
# the source of every library link in template.yaml; `{GROUP_COL}` /
# `{GROUP_COL_DISPLAY}` below are the factor the dashboards colour and filter
# by. Without a metadata file the hub carries a single `__no_group__` group
# ("All libraries") and every tile still renders.
#
# The run-level tiles `use:` the bcl2fastq renders; on the BCL Convert route
# (IS_BCLCONVERT) the same four collections carry the same columns, so the same
# tiles render unchanged (BCL Convert leaves `pct_pf` and `clusters_raw` empty).
main_dashboard:
  title: nf-core/demultiplex
  subtitle: A sequencing run split into its libraries, from lanes to per-library read QC
  project_tag: Sequencing Run Demultiplexing QC
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family: figures, advanced viz
  # and filter chips all colour a value the same way.
  category_colors:
    '{GROUP_COL}': auto
    # A flowcell has at most eight lanes: the palette covers them all.
    lane_label: auto
    # The eight largest libraries of the run take the palette, largest first, so
    # the lane composition and the sunburst agree; Undetermined and the pooled
    # rest stay grey.
    sample:
      '*': 'auto:reads'
      Undetermined: '#adb5bd'
      Other: '#868e96'
    swap_class:
      Both indexes in use: '#e03131'
      Only i7 in use: '#f76707'
      Only i5 in use: '#fab005'
      Neither index in use: '#7048e8'
      Poly-G or N index: '#868e96'
    severity:
      error: '#e03131'
      warning: '#f59f00'
      pass: '#2f9e44'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. Bound
  # to the `libraries` hub, the source of every library link in template.yaml.
  # Run health reads lanes, which no library link reaches, so the section is
  # kept off that tab.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every library tab
    persistent: true
    pin: top
    exclude_tabs:
    - Run health
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The library hub behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Libraries, below).
  - component_type: interactive
    workflow_tag: demultiplex
    data_collection_tag: libraries
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Key figures
    tag: dm-ov-kf-group
    index: ov-kf-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: demultiplex
    data_collection_tag: libraries
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Library
    section: Key figures
    tag: dm-ov-kf-library
    index: ov-kf-library
    title: Library
    layout: {x: 2, y: 0, w: 2, h: 1}
  # No wordmark is shipped for demultiplex, so the hero draws the title as text.
  - component_type: text
    title: nf-core/demultiplex
    order: 1
    body: >
      One sequencing run split into its libraries: how the lanes delivered, how evenly
      the reads were shared and what no index matched. [Run parameters](params:)
    tag: dm-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/demultiplex turns a run folder into one set of reads per library with bcl2fastq or BCL Convert, reads every library with fastp and Falco, and holds the run to instrument limits with CheckQC. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The sample filters in the left panel apply to every library tab: narrow the libraries once and the dashboard follows. A bar above a section narrows that section only.
    tag: dm-ov-about
    index: ov-about
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's own numbers: the demultiplexer from params.json, the rest read
  # from the library hub and the lane summary.
  - component_type: text
    surface: card
    values:
      libs: {dc: libraries, column: sample, aggregation: nunique, format: integer}
      lanes: {dc: lane_summary, column: lane_label, aggregation: nunique, format: integer}
      yield_gb: {dc: lane_summary, column: yield_gb, aggregation: sum, format: 'decimals:1'}
    body: |
      ### The run
      - ![](icon:mdi:barcode) **Demultiplexer** {{param:demultiplexer}}
      - ![](icon:mdi:test-tube) **Libraries** {{libs}}
      - ![](icon:mdi:view-dashboard-outline) **Lanes** {{lanes}}
      - ![](icon:mdi:database-outline) **Yield** {{yield_gb}} Gb
    tag: dm-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  # The marks take the family's colour (the header's), not the theme's blue.
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Five steps from run folder to libraries
      Each step names the setting or tool behind it and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:dna) **Convert** Base calls become reads, lane by lane · [Demultiplexer](params:demultiplexer) · [Run health](tab:Run health)
      2. ![](icon:mdi:call-split) **Split** Each read goes to the library whose index it carries · [Sample sheet](params:input) · [Balance](tab:Library balance)
      3. ![](icon:mdi:alert-outline) **Leftovers** Reads no index matched stay Undetermined · [Version](params:bcl) · [Undetermined](tab:Undetermined reads)
      4. ![](icon:mdi:filter-variant) **Read QC** fastp and Falco read every library · [Trimming](params:trim_fastq) · [Library QC](tab:Library QC)
      5. ![](icon:mdi:shield-check-outline) **Check** CheckQC holds the run to instrument limits · [Version](params:checkqc) · [MultiQC](tab:MultiQC)
      :::
    tag: dm-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. The icon colour is that tab's colour. Percentages are read on
  # the worst lane or library, never averaged.
  - component_type: card
    workflow_tag: demultiplex
    data_collection_tag: libraries
    aggregation: nunique
    column_name: sample
    column_type: object
    secondary_layout: composition
    breakdown_col: '{GROUP_COL}'
    display:
      icon_name: mdi:test-tube
      icon_color: grape
      caption: in the sample sheet, by {GROUP_COL_DISPLAY}
      link: tab:Library QC
    section: Key figures
    tag: dm-ov-kf-libraries
    index: ov-kf-libraries
    title: Libraries
    description: Libraries demultiplexed from the sample sheet. The bar splits them by {GROUP_COL_DISPLAY}.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: demultiplex
    data_collection_tag: lane_summary
    use: bcl2fastq/lane_summary
    aggregation: min
    column_name: pct_q30
    column_type: float64
    secondary_layout: coverage
    coverage_max: 100
    display:
      icon_name: mdi:check-decagram
      icon_color: teal
      caption: lowest lane, of 100%
      link: tab:Run health
      decimals: 1
    section: Key figures
    tag: dm-ov-kf-q30
    index: ov-kf-q30
    title: Bases at Q30 (%)
    description: Share of the bases at Q30 or above on the weakest lane, every read pooled.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: demultiplex
    data_collection_tag: libraries
    aggregation: min
    column_name: pct_of_expected
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:scale-balance
      icon_color: indigo
      caption: of an even share; box over every library
      link: tab:Library balance
      decimals: 1
    section: Key figures
    tag: dm-ov-kf-balance
    index: ov-kf-balance
    title: Smallest library (%)
    description: Reads of the smallest library over an even share of the run, where 100 is exactly its share.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: demultiplex
    data_collection_tag: lane_summary
    use: bcl2fastq/lane_summary
    aggregation: max
    column_name: pct_undetermined
    column_type: float64
    secondary_layout: coverage
    coverage_max: 100
    display:
      icon_name: mdi:alert-outline
      icon_color: orange
      caption: highest lane, of all its reads
      link: tab:Undetermined reads
      decimals: 1
    section: Key figures
    tag: dm-ov-kf-undetermined
    index: ov-kf-undetermined
    title: Undetermined (%)
    description: Share of the reads no index matched, on the lane that lost the most.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the group, then the library, both on the hub.
  - component_type: interactive
    workflow_tag: demultiplex
    data_collection_tag: libraries
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Findings
    tag: dm-ov-findings-group
    index: ov-findings-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: demultiplex
    data_collection_tag: libraries
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Library
    section: Findings
    tag: dm-ov-findings-library
    index: ov-findings-library
    title: Library
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data: the cycle row goes on a run without fastp, the
  # barcode row on a run whose report lists no unknown barcode.
  - component_type: text
    surface: card
    values:
      low_cycle: {dc: cycle_quality, column: median_quality, aggregation: min, format: 'decimals:1'}
      cv: {dc: lane_summary, column: library_reads_cv, aggregation: max, format: 'decimals:0'}
      cls_share: {dc: unknown_barcodes, column: swap_class, aggregation: top_share, weight: reads, format: percent}
      top_class: {dc: unknown_barcodes, column: swap_class, aggregation: top, weight: reads}
      kept: {dc: fastp_library_qc, column: pct_passed, aggregation: median, format: 'decimals:1'}
    body: |
      - **{{low_cycle}}** lowest median Phred score at any cycle – pooled over the libraries, per lane and read [Run health](tab:Run health)
      - **{{cv}}%** coefficient of variation of the reads per library – the least even lane; 0 is a perfect pool [Balance](tab:Library balance)
      - **{{cls_share}}** of the reads in the top unknown barcodes are {{top_class}} – the largest class [Undetermined](tab:Undetermined reads)
      - **{{kept}}%** of the reads kept by fastp – median library and lane [Library QC](tab:Library QC)
    section: Findings
    tag: dm-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One figure per tab behind the funnel, in two rows that zigzag.
  - component_type: highlight
    section: Findings
    source_tab: Run health
    source_component: run-cycle-profile
    caption: Median quality at each cycle, one curve per lane and read; a curve that sinks early is a chemistry problem.
    tag: dm-ov-hl-cycle
    index: ov-hl-cycle
    layout: {x: 0, y: 2, w: 5, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Library balance
    source_component: bal-index-purity
    caption: One point per library and lane; few reads and a low perfect-match share mean reads lost to index errors.
    tag: dm-ov-hl-purity
    index: ov-hl-purity
    layout: {x: 5, y: 2, w: 3, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Library QC
    source_component: lib-scatter
    caption: One point per library, coloured by group; a library far from its group is worth a look.
    tag: dm-ov-hl-library
    index: ov-hl-library
    layout: {x: 0, y: 6, w: 3, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Undetermined reads
    source_component: und-barcodes
    caption: The most frequent unknown barcodes, coloured by whether their indexes are in use on the lane.
    tag: dm-ov-hl-barcodes
    index: ov-hl-barcodes
    layout: {x: 3, y: 6, w: 5, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle. A tab the run does
  # not have is left out.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Run health](tab:Run health)

      ### Demultiplexing
      - [Library balance](tab:Library balance)
      - [Undetermined reads](tab:Undetermined reads)
      - [Library QC](tab:Library QC)
    section: How to read this dashboard
    tag: dm-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 3}
  # Persistent sample filters, the group first.
  - component_type: interactive
    workflow_tag: demultiplex
    data_collection_tag: libraries
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Library scope
    tag: dm-filter-group
    index: sample-filters-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: demultiplex
    data_collection_tag: libraries
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: Sample filters
    group: Library scope
    tag: dm-filter-library
    index: sample-filters-library
    title: Library
    layout: {x: 0, y: 2, w: 1, h: 3}
  # Row selection narrows every library tile.
  - component_type: table
    workflow_tag: demultiplex
    data_collection_tag: libraries
    row_selection_enabled: true
    row_selection_column: sample
    section: Sample sheet
    tag: dm-sample-sheet
    index: sample-sheet
    title: Sample sheet
    description: One row per library; share of the run, share of an even split, base quality, index purity and fastp read QC.
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
# ============================================================================
# MultiQC
# ============================================================================
- title: MultiQC
  subtitle: What did CheckQC and the read QC tools flag?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # Bound to multiqc_data and the hub, so the tab keeps a filter of its own
  # whatever the sample filters hold.
  filter_sections:
  - name: MultiQC report
    icon: mdi:file-document-outline
    color: orange
    description: Libraries as MultiQC names them, or inside a read-share band
  grid_sections:
  - name: CheckQC verdicts
    icon: mdi:shield-check-outline
    color: orange
    description: The run-level checks CheckQC applied, and the headline numbers per library
  - name: Read QC after demultiplexing
    icon: mdi:chart-box-outline
    color: blue
    description: Falco and fastp on the demultiplexed reads of every library
  - name: More MultiQC panels
    icon: mdi:file-document-outline
    color: gray
    description: The Falco status checks and the remaining Falco and fastp panels
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [CheckQC](https://github.com/Molmed/checkQC) holds the demultiplexing to instrument
      limits, and [MultiQC](https://multiqc.info) gathers it with the
      [Falco](https://github.com/smithlabcode/falco) and
      [fastp](https://github.com/OpenGene/fastp) reports of every library. Start with the
      CheckQC panels: a library far below an even share of reads fails there first. The
      bcl2fastq panels are left out, since the other tabs read the same numbers from its
      report, and the remaining read QC panels are collapsed below.
    tag: dm-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: demultiplex
    data_collection_tag: multiqc_data
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: MultiQC report
    group: Libraries
    tag: dm-mqc-filter-sample
    index: mqc-sample-filter
    title: Library or FASTQ file
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: demultiplex
    data_collection_tag: libraries
    interactive_component_type: RangeSlider
    column_name: pct_of_expected
    column_type: float64
    display:
      icon_name: mdi:scale-balance
      custom_color: pink
    section: MultiQC report
    group: Read share
    tag: dm-mqc-filter-expected
    index: mqc-expected-range
    title: Reads, % of an even share
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: multiqc
    workflow_tag: demultiplex
    data_collection_tag: multiqc_data
    use: multiqc/checkqc
    selected_module: checkqc
    selected_plot: Too few reads per sample
    section: CheckQC verdicts
    tag: dm-mqc-checkqc-reads
    title: Libraries under the read threshold
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: demultiplex
    data_collection_tag: multiqc_data
    use: multiqc/checkqc
    selected_module: checkqc
    selected_plot: '% Undetermined indexes'
    section: CheckQC verdicts
    tag: dm-mqc-checkqc-undetermined
    title: Undetermined share against its limit
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: demultiplex
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: CheckQC verdicts
    tag: dm-mqc-general-stats
    title: General statistics
    description: One row per library and per FASTQ file, pooling the bcl2fastq, fastp and Falco headline numbers.
    layout: {x: 0, y: 4, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: demultiplex
    data_collection_tag: multiqc_data
    use: multiqc/falco
    selected_module: falco
    selected_plot: Sequence Counts
    section: Read QC after demultiplexing
    tag: dm-mqc-falco-counts
    title: Reads per FASTQ file
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: demultiplex
    data_collection_tag: multiqc_data
    use: multiqc/falco
    selected_module: falco
    selected_plot: Per Sequence Quality Scores
    section: Read QC after demultiplexing
    tag: dm-mqc-falco-seq-quality
    title: Per-read mean quality
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: demultiplex
    data_collection_tag: multiqc_data
    use: multiqc/falco
    selected_module: falco
    selected_plot: Adapter Content
    section: Read QC after demultiplexing
    tag: dm-mqc-falco-adapter
    title: Adapter content
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: demultiplex
    data_collection_tag: multiqc_data
    use: multiqc/fastp
    selected_module: fastp
    selected_plot: Insert Sizes
    section: Read QC after demultiplexing
    tag: dm-mqc-fastp-insert
    title: Insert sizes
    layout: {x: 4, y: 4, w: 4, h: 4}
  # The bcl2fastq panels, fastp Filtered Reads and fastp Sequence Quality are
  # not placed: the Library balance, Undetermined reads and Library QC tiles read
  # the same numbers from the reports themselves.
  - component_type: multiqc
    workflow_tag: demultiplex
    data_collection_tag: multiqc_data
    use: multiqc/falco
    selected_module: falco
    selected_plot: Status Checks
    section: More MultiQC panels
    tag: dm-mqc-falco-status
    title: Falco status checks
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: demultiplex
    data_collection_tag: multiqc_data
    use: multiqc/falco
    selected_module: falco
    selected_plot: Sequence Quality Histograms
    section: More MultiQC panels
    tag: dm-mqc-falco-base-quality
    title: Per-base quality (Falco)
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: demultiplex
    data_collection_tag: multiqc_data
    use: multiqc/falco
    selected_module: falco
    selected_plot: Per Sequence GC Content
    section: More MultiQC panels
    tag: dm-mqc-falco-gc
    title: Per-read GC content
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: demultiplex
    data_collection_tag: multiqc_data
    use: multiqc/falco
    selected_module: falco
    selected_plot: Per Base N Content
    section: More MultiQC panels
    tag: dm-mqc-falco-n
    title: Per-base N content
    layout: {x: 0, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: demultiplex
    data_collection_tag: multiqc_data
    use: multiqc/falco
    selected_module: falco
    selected_plot: Sequence Length Distribution
    section: More MultiQC panels
    tag: dm-mqc-falco-length
    title: Read length distribution
    layout: {x: 4, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: demultiplex
    data_collection_tag: multiqc_data
    use: multiqc/falco
    selected_module: falco
    selected_plot: Sequence Duplication Levels
    section: More MultiQC panels
    tag: dm-mqc-falco-dup
    title: Duplication levels
    layout: {x: 0, y: 12, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: demultiplex
    data_collection_tag: multiqc_data
    use: multiqc/falco
    selected_module: falco
    selected_plot: Overrepresented sequences by sample
    section: More MultiQC panels
    tag: dm-mqc-falco-overrep
    title: Overrepresented sequences
    layout: {x: 4, y: 12, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: demultiplex
    data_collection_tag: multiqc_data
    use: multiqc/falco
    selected_module: falco
