# ============================================================================
# Run health
# ============================================================================
# Lane-level: no library link reaches these collections, so the persistent
# sample filters are kept off this tab and the lane picker lives here.
- title: Run health
  subtitle: Did the instrument deliver on every lane, read and cycle?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:stethoscope
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Lane and cycle scope
    icon: mdi:tune
    color: teal
    description: Narrow to some lanes, reads or a stretch of cycles, on this tab only
  grid_sections:
  - name: Run health at a glance
    icon: mdi:counter
    color: teal
    description: Clusters, pass-filter rate, base quality and yield of the run
  - name: Lanes and reads
    icon: mdi:view-dashboard-outline
    color: cyan
    description: Every lane by Undetermined share and Q30, then every lane and read
  - name: Quality along the run
    icon: mdi:chart-line
    color: blue
    description: Base quality at every cycle, one curve per lane and read
  - name: Sequencing Analysis Viewer metrics
    icon: mdi:microscope
    color: grape
    description: Error rate, phasing and density per lane and read, when an InterOp summary is present
    collapsed: true
  - name: Lane detail
    icon: mdi:table
    color: gray
    description: One row per lane, the numbers behind the tiles of this tab
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [bcl2fastq](https://support.illumina.com/sequencing/sequencing_software/bcl2fastq-conversion-software.html)
      or BCL Convert reports clusters, yield and base quality per lane and read, and
      [fastp](https://github.com/OpenGene/fastp) the quality at every cycle. A lane or read
      that drops alone points at the flowcell or the chemistry, not at the libraries. Pick
      a lane on the scatter to narrow the other tiles to it.
    tag: dm-run-intro
    index: run-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: demultiplex
    data_collection_tag: lane_summary
    interactive_component_type: MultiSelect
    column_name: lane_label
    column_type: object
    display:
      icon_name: mdi:view-dashboard-outline
      custom_color: cyan
    section: Lane and cycle scope
    group: Lanes
    tag: dm-run-filter-lane
    index: run-lane-filter
    title: Lane
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: demultiplex
    data_collection_tag: read_quality
    interactive_component_type: MultiSelect
    column_name: read_label
    column_type: object
    display:
      icon_name: mdi:ruler
      custom_color: blue
    section: Lane and cycle scope
    group: Reads
    tag: dm-run-filter-read
    index: run-read-filter
    title: Read
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: demultiplex
    data_collection_tag: cycle_quality
    interactive_component_type: RangeSlider
    column_name: cycle
    column_type: int64
    display:
      icon_name: mdi:chart-line
      custom_color: indigo
    section: Lane and cycle scope
    group: Cycles
    tag: dm-run-filter-cycle
    index: run-cycle-range
    title: Cycle
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: demultiplex
    data_collection_tag: lane_summary
    use: bcl2fastq/lane_summary
    aggregation: sum
    column_name: clusters_pf
    column_type: int64
    secondary_layout: attrition
    attrition_cols: [library_reads]
    display:
      icon_name: mdi:counter
      icon_color: indigo
      caption: then assigned to a library
    section: Run health at a glance
    tag: dm-run-card-clusters
    index: run-card-clusters
    title: Clusters passing filter
    description: Clusters that passed the chastity filter, then those whose index matched a library.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: demultiplex
    data_collection_tag: lane_summary
    use: bcl2fastq/lane_summary
    aggregation: min
    column_name: pct_pf
    column_type: float64
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:filter-variant
      icon_color: cyan
      caption: lowest lane, of 100%
      decimals: 1
    section: Run health at a glance
    tag: dm-run-card-pf
    index: run-card-pf
    title: Pass filter (%)
    description: Clusters passing filter over clusters detected, on the weakest lane. BCL Convert does not report it.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: demultiplex
    data_collection_tag: read_quality
    use: bcl2fastq/read_quality
    aggregation: min
    column_name: pct_q30
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:check-decagram
      icon_color: teal
      caption: weakest read; box over every lane and read
      decimals: 1
    section: Run health at a glance
    tag: dm-run-card-q30
    index: run-card-q30
    title: Bases at Q30 (%)
    description: Share of the bases at Q30 or above in the weakest read of any lane.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: demultiplex
    data_collection_tag: lane_summary
    use: bcl2fastq/lane_summary
    aggregation: sum
    column_name: yield_gb
    column_type: float64
    secondary_layout: top_n
    breakdown_col: lane_label
    top_n_count: 4
    display:
      icon_name: mdi:database-outline
      icon_color: violet
      caption: per lane, the largest first
      decimals: 1
    section: Run health at a glance
    tag: dm-run-card-yield
    index: run-card-yield
    title: Yield (Gb)
    description: Bases passing filter over the whole run, every lane and read.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: demultiplex
    data_collection_tag: lane_summary
    use: bcl2fastq/lane_health
    config:
      selection_enabled: true
      selection_column: lane_label
    section: Lanes and reads
    tag: dm-run-lane-health
    index: run-lane-health
    title: Lanes by Undetermined share and base quality
    description: One point per lane, sized by yield; a lane low and to the right lost reads to both.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: demultiplex
    data_collection_tag: read_quality
    use: bcl2fastq/lane_read_dots
    section: Lanes and reads
    tag: dm-run-lane-read-dots
    index: run-lane-read-dots
    title: Lane by read quality
    description: One dot per lane and read, coloured by mean quality and sized by the share of bases at Q30.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: demultiplex
    data_collection_tag: cycle_quality
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: series
      x_col: cycle
      y_col: median_quality
      lower_col: p10_quality
      upper_col: p90_quality
      x_title: Cycle
      y_title: Mean Phred score
    section: Quality along the run
    tag: dm-run-cycle-profile
    index: run-cycle-profile
    title: Base quality per cycle
    description: Median over libraries of the fastp mean quality at each cycle, with the 10th to 90th percentile band.
    layout: {x: 0, y: 0, w: 8, h: 6}
  # Present only when an `interop_summary --csv=1` table sits under the run, so
  # the section starts collapsed with the other conditional detail.
  - component_type: card
    workflow_tag: demultiplex
    data_collection_tag: interop_summary
    use: interop/summary
    aggregation: max
    column_name: error_rate
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:alert-outline
      icon_color: red
      caption: worst lane and read; box over all of them
      decimals: 2
    section: Sequencing Analysis Viewer metrics
    tag: dm-run-sav-card-error
    index: run-sav-card-error
    title: PhiX error rate (%)
    description: PhiX error rate of the worst lane and read, as the Sequencing Analysis Viewer shows it.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: demultiplex
    data_collection_tag: interop_summary
    use: interop/summary
    aggregation: min
    column_name: pct_cluster_pf
    column_type: float64
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:filter-variant
      icon_color: cyan
      caption: lowest lane and read, of 100%
      decimals: 1
    section: Sequencing Analysis Viewer metrics
    tag: dm-run-sav-card-pf
    index: run-sav-card-pf
    title: Clusters passing filter (%)
    description: Clusters passing filter on the weakest lane and read, from the InterOp summary.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: demultiplex
    data_collection_tag: interop_summary
    use: interop/summary
    aggregation: max
    column_name: density_k_mm2
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:dna
      icon_color: grape
      caption: densest lane; box over every lane and read
      decimals: 0
    section: Sequencing Analysis Viewer metrics
    tag: dm-run-sav-card-density
    index: run-sav-card-density
    title: Cluster density (K/mm2)
    description: Cluster density of the densest lane, in thousands per square millimetre.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: demultiplex
    data_collection_tag: interop_summary
    use: interop/summary
    aggregation: max
    column_name: phasing
    column_type: float64
    secondary_layout: top_n
    breakdown_col: lane_label
    top_n_count: 4
    display:
      icon_name: mdi:waves
      icon_color: blue
      caption: worst read per lane, the highest first
      decimals: 3
    section: Sequencing Analysis Viewer metrics
    tag: dm-run-sav-card-phasing
    index: run-sav-card-phasing
    title: Phasing (%)
    description: Phasing per cycle of the worst lane and read; phasing and error rising together point at the chemistry.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: demultiplex
    data_collection_tag: interop_summary
    use: interop/lane_read_error
    section: Sequencing Analysis Viewer metrics
    tag: dm-run-sav-error-dots
    index: run-sav-error-dots
    title: PhiX error rate per lane and read
    description: One dot per lane and read, coloured by error rate and sized by the share of bases at Q30.
    layout: {x: 0, y: 2, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: demultiplex
    data_collection_tag: interop_summary
    use: interop/phasing_scatter
    config:
      selection_enabled: true
      selection_column: lane_label
    section: Sequencing Analysis Viewer metrics
    tag: dm-run-sav-phasing
