    description: One point per lane and read.
    layout: {x: 4, y: 2, w: 4, h: 6}
  # Re-homed from the former pinned lane table: one pinned table per family.
  - component_type: table
    workflow_tag: demultiplex
    data_collection_tag: lane_summary
    use: bcl2fastq/lane_summary
    row_selection_enabled: true
    row_selection_column: lane_label
    section: Lane detail
    tag: dm-run-lane-table
    index: run-lane-table
