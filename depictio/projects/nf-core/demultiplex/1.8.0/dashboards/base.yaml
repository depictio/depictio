# ============================================================================
# Library balance
# ============================================================================
- title: Library balance
  subtitle: How evenly were each lane's reads shared between the libraries?
  tab_group: Demultiplexing
  tab_order: 3
  tab_icon: mdi:scale-balance
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Balance scope
    icon: mdi:tune
    color: indigo
    description: Narrow to some lanes, or to libraries inside a lane-share or index-purity band
  grid_sections:
  - name: Balance at a glance
    icon: mdi:counter
    color: indigo
    description: Reads assigned, share of the lane, the least even lane and index purity
  - name: Lane composition
    icon: mdi:chart-donut
    color: cyan
    description: What each lane was made of, Undetermined included
  - name: Library balance
    icon: mdi:scale-balance
    color: indigo
    description: Every library's share of its lane, and its reads against index purity
  - name: Per-lane library counts
    icon: mdi:table
    color: gray
    description: One row per library and lane, Undetermined rows included
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [bcl2fastq](https://support.illumina.com/sequencing/sequencing_software/bcl2fastq-conversion-software.html)
      sends each read to the library whose index it carries, so an even pool gives every
      library about its planned share of the lane. A library far below it was under-pooled
      or lost reads to index errors, which the purity scatter tells apart. The cards count
      libraries only; the composition keeps the Undetermined reads in view.
    tag: dm-bal-intro
    index: bal-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: demultiplex
    data_collection_tag: lane_summary
    interactive_component_type: MultiSelect
    column_name: lane_label
    column_type: object
    display:
      icon_name: mdi:view-dashboard-outline
      custom_color: cyan
    section: Balance scope
    group: Lanes
    tag: dm-bal-filter-lane
    index: bal-lane-filter
    title: Lane
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: demultiplex
    data_collection_tag: demux_stats
    interactive_component_type: RangeSlider
    column_name: pct_of_lane
    column_type: float64
    display:
      icon_name: mdi:chart-donut
      custom_color: indigo
    section: Balance scope
    group: Balance
    tag: dm-bal-filter-share
    index: bal-share-range
    title: Share of the lane (%)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: demultiplex
    data_collection_tag: demux_stats
    interactive_component_type: RangeSlider
    column_name: pct_perfect_index
    column_type: float64
    display:
      icon_name: mdi:shield-check-outline
      custom_color: green
    section: Balance scope
    group: Balance
    tag: dm-bal-filter-purity
    index: bal-purity-range
    title: Perfect index match (%)
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: demultiplex
    data_collection_tag: demux_stats
    use: bcl2fastq/demux_stats
    filter_expr: "col('is_undetermined') == False"
    aggregation: sum
    column_name: reads
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display:
      icon_name: mdi:counter
      icon_color: indigo
      caption: the three largest libraries
    section: Balance at a glance
    tag: dm-bal-card-reads
    index: bal-card-reads
    title: Reads assigned to libraries
    description: Read clusters whose index matched a library, a pair counting once; Undetermined left out.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: demultiplex
    data_collection_tag: demux_stats
    use: bcl2fastq/demux_stats
    filter_expr: "col('is_undetermined') == False"
    aggregation: median
    column_name: pct_of_lane
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-donut
      icon_color: cyan
      caption: median library, with its spread
      decimals: 2
    section: Balance at a glance
    tag: dm-bal-card-share
    index: bal-card-share
    title: Share of the lane (%)
    description: Median share of its lane per library and lane; a wide box is an uneven pool.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: demultiplex
    data_collection_tag: lane_summary
    use: bcl2fastq/lane_summary
    aggregation: min
    column_name: lowest_library_pct_of_mean
    column_type: float64
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:scale-balance
      icon_color: violet
      caption: least even lane, of the lane mean
      decimals: 1
    section: Balance at a glance
    tag: dm-bal-card-smallest
    index: bal-card-smallest
    title: Smallest library (% of mean)
    description: Reads of the smallest library over the mean library of its lane, on the least even lane.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: demultiplex
    data_collection_tag: demux_stats
    use: bcl2fastq/demux_stats
    filter_expr: "col('is_undetermined') == False"
    aggregation: min
    column_name: pct_perfect_index
    column_type: float64
    secondary_layout: coverage
    coverage_max: 100
    display:
      icon_name: mdi:shield-check-outline
      icon_color: green
      caption: worst library, of its reads
      decimals: 1
    section: Balance at a glance
    tag: dm-bal-card-purity
    index: bal-card-purity
    title: Perfect index match (%)
    description: Share of the reads whose index matched with no mismatch, on the worst library and lane.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: demultiplex
    data_collection_tag: demux_stats
    use: bcl2fastq/lane_composition
    config:
      top_n: 8
      sort_by: abundance
    section: Lane composition
    tag: dm-bal-lane-composition
    index: bal-lane-composition
    title: Libraries per lane
    description: Share of each lane per library, Undetermined included; the eight largest libraries are named, the rest pooled.
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: advanced_viz
    workflow_tag: demultiplex
    data_collection_tag: demux_stats
    use: bcl2fastq/lane_sunburst
    section: Lane composition
    tag: dm-bal-lane-sunburst
    index: bal-lane-sunburst
    title: Run, lane, library
    description: Reads per lane, then per library inside the lane.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: figure
    workflow_tag: demultiplex
    data_collection_tag: demux_stats
    use: bcl2fastq/demux_stats
    visu_type: bar
    mode: code
    code_content: |-
      # Share of the lane per library, one bar per library and lane, Undetermined included.
      colors = depictio_category_colors.get('lane_label') or {}
      d = df.sort(['lane', 'pct_of_lane'], descending=[False, True]).to_pandas()
      fig = px.bar(d, x='sample', y='pct_of_lane', color='lane_label', barmode='group', color_discrete_map=colors, labels={'sample': '', 'pct_of_lane': 'Share of the lane (%)', 'lane_label': ''})
      fig.update_xaxes(tickangle=-45, automargin=True)
      fig.update_layout(margin=dict(t=10))
    section: Library balance
    tag: dm-bal-share-bar
    index: bal-share-bar
    title: Share of the lane per library
    description: One bar per library and lane, Undetermined included, coloured by lane.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: demultiplex
    data_collection_tag: demux_stats
    use: bcl2fastq/library_index_purity
    config:
      log_x: true
      selection_enabled: true
      selection_column: sample
    section: Library balance
    tag: dm-bal-index-purity
    index: bal-index-purity
    title: Reads against index purity
    description: One point per library and lane; few reads and a low perfect-match share mean reads lost to index errors.
    layout: {x: 0, y: 4, w: 8, h: 6}
  - component_type: table
    workflow_tag: demultiplex
    data_collection_tag: demux_stats
    use: bcl2fastq/demux_stats
    row_selection_enabled: true
    row_selection_column: sample
    section: Per-lane library counts
    tag: dm-bal-table
    index: bal-table
    title: Reads per library and lane
    description: Select rows to narrow the library hub and the other tabs to those libraries.
    layout: {x: 0, y: 0, w: 8, h: 6}
# ============================================================================
# Undetermined reads
# ============================================================================
- title: Undetermined reads
  subtitle: What did no index match, and is it an index swap?
  tab_group: Demultiplexing
  tab_order: 4
  tab_icon: mdi:alert-outline
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # The lane picker reads lane_summary, which every route keeps; the barcode
  # pickers go with unknown_barcodes when the report lists none.
  filter_sections:
  - name: Barcode scope
    icon: mdi:tune
    color: orange
    description: Narrow to some lanes, a class of unknown barcode or the most frequent ones
  grid_sections:
  - name: Undetermined at a glance
    icon: mdi:counter
    color: orange
    description: How many reads went unassigned, and what kind of barcode they carried
  - name: Top unknown barcodes
    icon: mdi:chart-bar
    color: red
    description: The most frequent unassigned index pairs, coloured by class
  - name: Barcode and verdict tables
    icon: mdi:table
    color: gray
    description: The unknown barcodes and the CheckQC findings, row by row
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [bcl2fastq](https://support.illumina.com/sequencing/sequencing_software/bcl2fastq-conversion-software.html)
      keeps the barcodes it saw most often among the reads no index matched, and each is
      classed by whether its i7 and i5 belong to libraries of the lane. Both in use is the
      index-hopping signature, neither points at a library missing from the sample sheet,
      and a poly-G index read no index at all. Pick a class or a barcode to narrow the
      other tiles.
    tag: dm-und-intro
    index: und-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: demultiplex
    data_collection_tag: lane_summary
    interactive_component_type: MultiSelect
    column_name: lane_label
    column_type: object
    display:
      icon_name: mdi:view-dashboard-outline
      custom_color: cyan
    section: Barcode scope
    group: Lanes
    tag: dm-und-filter-lane
    index: und-lane-filter
    title: Lane
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: demultiplex
    data_collection_tag: unknown_barcodes
    interactive_component_type: MultiSelect
    column_name: swap_class
    column_type: object
    display:
      icon_name: mdi:set-merge
      custom_color: red
    section: Barcode scope
    group: Barcodes
    tag: dm-und-filter-class
    index: und-class-filter
    title: Barcode class
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: demultiplex
    data_collection_tag: unknown_barcodes
    interactive_component_type: RangeSlider
    column_name: rank
    column_type: int64
    display:
      icon_name: mdi:chart-bar
      custom_color: grape
    section: Barcode scope
    group: Barcodes
    tag: dm-und-filter-rank
    index: und-rank-range
    title: Rank in its lane
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: demultiplex
    data_collection_tag: lane_summary
    use: bcl2fastq/lane_summary
    aggregation: max
    column_name: pct_undetermined
    column_type: float64
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:alert-outline
      icon_color: orange
      caption: highest lane, of all its reads
      decimals: 1
    section: Undetermined at a glance
    tag: dm-und-card-share
    index: und-card-share
    title: Undetermined (%)
    description: Share of the reads no index matched, on the lane that lost the most.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: demultiplex
    data_collection_tag: lane_summary
    use: bcl2fastq/lane_summary
    aggregation: sum
    column_name: undetermined_reads
    column_type: int64
    secondary_layout: top_n
    breakdown_col: lane_label
    top_n_count: 4
    display:
      icon_name: mdi:counter
      icon_color: yellow
      caption: per lane, the largest first
    section: Undetermined at a glance
    tag: dm-und-card-reads
    index: und-card-reads
    title: Undetermined reads
    description: Read clusters no index matched, over every lane of the run.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: demultiplex
    data_collection_tag: unknown_barcodes
    use: bcl2fastq/unknown_barcodes
    aggregation: sum
    column_name: reads
    column_type: int64
    secondary_layout: donut
    breakdown_col: swap_class
    display:
      icon_name: mdi:set-merge
      icon_color: red
      caption: by barcode class
    section: Undetermined at a glance
    tag: dm-und-card-classes
    index: und-card-classes
    title: Reads in the top barcodes
    description: Reads carrying the most frequent unknown barcodes of each lane, split by class.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: demultiplex
    data_collection_tag: unknown_barcodes
    use: bcl2fastq/unknown_barcodes
    aggregation: max
    column_name: pct_of_undetermined
    column_type: float64
    secondary_layout: top_n
    breakdown_col: barcode
    top_n_count: 3
    display:
      icon_name: mdi:chart-bar
      icon_color: grape
      caption: the three most frequent barcodes
      decimals: 1
    section: Undetermined at a glance
    tag: dm-und-card-top
    index: und-card-top
    title: Top barcode (% of Undetermined)
    description: Share of a lane's Undetermined reads carried by its most frequent unknown barcode.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Summed over the lanes in view, so a barcode seen on several lanes counts
  # once; the fifteen largest keep the bars readable.
  - component_type: figure
    workflow_tag: demultiplex
    data_collection_tag: unknown_barcodes
    use: bcl2fastq/unknown_barcodes
    visu_type: bar
    mode: code
    code_content: |-
      # The fifteen most frequent unknown barcodes over the lanes in view, coloured by class.
      colors = depictio_category_colors.get('swap_class') or {}
      d = df.group_by(['barcode', 'swap_class']).agg(pl.col('reads').sum()).sort('reads', descending=True).head(15).to_pandas()
      fig = px.bar(d, x='reads', y='barcode', color='swap_class', orientation='h', color_discrete_map=colors, labels={'reads': 'Reads', 'barcode': '', 'swap_class': ''})
      fig.update_yaxes(automargin=True, categoryorder='total ascending')
      fig.update_layout(margin=dict(t=10), legend=dict(orientation='h', yanchor='top', y=-0.15, x=0))
    section: Top unknown barcodes
    tag: dm-und-barcodes
    index: und-barcodes
    title: Most frequent unknown barcodes
    description: The fifteen unassigned index pairs with the most reads, coloured by whether their indexes are in use.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: demultiplex
    data_collection_tag: unknown_barcodes
    use: bcl2fastq/unknown_barcodes
    row_selection_enabled: true
    row_selection_column: barcode
    section: Barcode and verdict tables
    tag: dm-und-table
    index: und-table
    title: Unknown barcodes
    description: One row per unassigned index pair and lane, with its class.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: demultiplex
    data_collection_tag: checkqc_verdicts
    row_selection_enabled: false
    section: Barcode and verdict tables
    tag: dm-und-checkqc-table
    index: und-checkqc-table
    title: CheckQC findings
    description: One row per CheckQC finding, and a pass row for every check that reported nothing.
    layout: {x: 0, y: 6, w: 8, h: 6}
# ============================================================================
# Library QC
# ============================================================================
- title: Library QC
  subtitle: Which libraries stand out on read QC within their group?
  tab_group: Demultiplexing
  tab_order: 5
  tab_icon: mdi:test-tube
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Library QC scope
    icon: mdi:tune
    color: grape
    description: Narrow to libraries inside a duplication or GC band, on this tab only
  grid_sections:
  - name: Library QC at a glance
    icon: mdi:counter
    color: grape
    description: The fastp read QC of every library and lane
  - name: Libraries against each other
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Duplication against base quality, with the card of the library picked
  - name: Design groups compared
    icon: mdi:scale-balance
    color: violet
    description: Every library metric compared between two groups or two saved selections
  - name: fastp table
    icon: mdi:table
    color: gray
    description: One row per library and lane, before and after filtering
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [fastp](https://github.com/OpenGene/fastp) read each demultiplexed library; look for
      libraries that leave their design group on duplication, adapter or GC content. Lasso
      a point on the scatter to open its card beside it, or compare two groups metric by
      metric below.
    tag: dm-lib-intro
    index: lib-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: demultiplex
    data_collection_tag: libraries
    interactive_component_type: RangeSlider
    column_name: pct_duplication
    column_type: float64
    display:
      icon_name: mdi:content-duplicate
      custom_color: orange
    section: Library QC scope
    group: Read QC
    tag: dm-lib-filter-dup
    index: lib-dup-range
    title: Duplication (%)
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: demultiplex
    data_collection_tag: libraries
    interactive_component_type: RangeSlider
    column_name: gc_pct
    column_type: float64
    display:
      icon_name: mdi:dna
      custom_color: lime
    section: Library QC scope
    group: Read QC
    tag: dm-lib-filter-gc
    index: lib-gc-range
    title: GC content (%)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: demultiplex
    data_collection_tag: fastp_library_qc
    aggregation: sum
    column_name: reads_before
    column_type: int64
    secondary_layout: attrition
    attrition_cols: [reads_after]
    display:
      icon_name: mdi:filter-variant
      icon_color: teal
      caption: then kept after filtering
    section: Library QC at a glance
    tag: dm-lib-card-reads
    index: lib-card-reads
    title: Reads into fastp
    description: Reads fastp was given over every library and lane, both mates, then those it kept.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: demultiplex
    data_collection_tag: libraries
    aggregation: median
    column_name: pct_duplication
    column_type: float64
    secondary_layout: top_n
    breakdown_col: '{GROUP_COL}'
    display:
      icon_name: mdi:content-duplicate
      icon_color: orange
      caption: median, by {GROUP_COL_DISPLAY}
      decimals: 1
    section: Library QC at a glance
    tag: dm-lib-card-dup
    index: lib-card-dup
    title: Duplication (%)
    description: Median duplication rate per library; the bars rank the groups.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: demultiplex
    data_collection_tag: fastp_library_qc
    aggregation: median
    column_name: pct_adapter_trimmed
    column_type: float64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display:
      icon_name: mdi:content-cut
      icon_color: yellow
      caption: the three most adapter-rich libraries
      decimals: 1
    section: Library QC at a glance
    tag: dm-lib-card-adapter
    index: lib-card-adapter
    title: Reads with adapter (%)
    description: Median share of the reads fastp trimmed an adapter from, per library and lane.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: demultiplex
    data_collection_tag: fastp_library_qc
    aggregation: median
    column_name: pct_q30_after
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:check-decagram
      icon_color: grape
      caption: median library and lane, with its spread
      decimals: 1
    section: Library QC at a glance
    tag: dm-lib-card-q30
    index: lib-card-q30
    title: Bases at Q30 after fastp (%)
    description: Median share of the bases at Q30 or above once fastp filtered the reads.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: demultiplex
    data_collection_tag: libraries
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: pct_duplication
      y_col: pct_q30_after
      label_col: sample
      color_col: '{GROUP_COL}'
      size_col: reads
      x_title: Duplication (%)
      y_title: Bases at Q30 after fastp (%)
      selection_enabled: true
      selection_column: sample
    section: Libraries against each other
    tag: dm-lib-scatter
    index: lib-scatter
    title: Duplication against base quality
    description: One point per library, sized by reads and coloured by group; lasso points to read them in the card beside it.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: demultiplex
    data_collection_tag: libraries
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: sample
      title_col: sample
      selection_source: any
      sections:
        Library: [sample, '{GROUP_COL}', flowcell, lanes, index]
        Demultiplexing: [reads, pct_of_run, pct_of_expected, yield_mb, pct_q30, mean_quality, pct_perfect_index]
        Read QC: [reads_after_filter, pct_passed, pct_duplication, pct_adapter_trimmed, gc_pct, pct_q30_after, insert_size_peak]
      linked_component: dm-lib-scatter
    section: Libraries against each other
    tag: dm-lib-record
    index: lib-record
    title: Library card
    description: The library lassoed in the scatter beside it (or selected in the fastp table) as a fact panel.
    layout: {x: 5, y: 0, w: 3, h: 5}
  - component_type: advanced_viz
    workflow_tag: demultiplex
    data_collection_tag: libraries
    viz_kind: group_compare
    config:
      viz_kind: group_compare
      index_col: sample
      group_col: '{GROUP_COL}'
      test: wilcoxon
      log_transform: false
      min_observations: 2
    section: Design groups compared
    tag: dm-lib-group-compare
    index: lib-group-compare
    title: Design groups compared metric by metric
    description: Every numeric library metric compared between two groups or two saved selections; with a few libraries per group the test is a screen, not a verdict.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: demultiplex
    data_collection_tag: fastp_library_qc
    row_selection_enabled: true
    row_selection_column: sample
    section: fastp table
    tag: dm-lib-fastp-table
    index: lib-fastp-table
    title: fastp read QC
    description: One row per library and lane, before and after filtering.
    layout: {x: 0, y: 0, w: 8, h: 6}
