version: 1
main_dashboard:
  title: nf-core/isoseq
  subtitle: "nf-core/isoseq 3.0.1: CCS and primer QC, the full-length read funnel, and the isoforms TAMA built with their structural category"
  project_tag: Iso-Seq Full-Length Transcriptomes
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # Left panel. `Sample scope` is persistent and pinned: it reads the sample
  # hub (always present) and the design table (present when METADATA_FILE is
  # given; its filter disappears with it), both of which link to every
  # sample-keyed collection, so the same controls narrow every tab.
  filter_sections:
  - name: Sample scope
    icon: mdi:filter-variant
    color: orange
    description: Which samples and design groups every tab is about
    persistent: true
    pin: top
  # Right panel. MultiQC has two PacBio modules here: lima's primer filtering
  # stays on this tab; the ccs panel (one bar per CCS chunk) is folded away
  # because the Reads tab draws the same counts per library.
  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: The size and design of the run, on every tab
    persistent: true
    pin: top
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The per-sample summary every tab filters through
    collapsed: true
    persistent: true
    pin: top
  - name: Primer demultiplexing
    icon: mdi:shield-check-outline
    color: blue
    description: Which CCS reads lima kept as full-length, per CCS chunk
  - name: More QC panels
    icon: mdi:file-document-outline
    color: gray
    description: The ccs panel, per CCS chunk
    collapsed: true
  components:
  # ------------------------------------------------------------ run at a glance
  - component_type: card
    tag: is-glance-samples
    section: Run at a glance
    workflow_tag: isoseq
    data_collection_tag: samples
    aggregation: nunique
    column_name: sample
    column_type: object
    secondary_layout: uniqueness
    display: {icon_name: 'mdi:flask'}
    title: Samples
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 2, h: 2}
  # Bound to the design table, so it is pruned with it on a run without one.
  - component_type: card
    tag: is-glance-groups
    section: Run at a glance
    workflow_tag: isoseq
    data_collection_tag: metadata
    aggregation: nunique
    column_name: '{GROUP_COL}'
    column_type: object
    secondary_layout: donut
    breakdown_col: '{GROUP_COL}'
    top_n_count: 4
    display: {icon_name: 'mdi:account-group-outline'}
    title: '{GROUP_COL_DISPLAY} groups'
    title_size: sm
    title_align: left
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: is-glance-flnc
    section: Run at a glance
    workflow_tag: isoseq
    data_collection_tag: samples
    aggregation: sum
    column_name: flnc_reads
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:chart-bar'}
    title: FLNC reads
    title_size: sm
    title_align: left
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: is-glance-isoforms
    section: Run at a glance
    workflow_tag: isoseq
    data_collection_tag: samples
    aggregation: sum
    column_name: isoforms
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:dna'}
    title: Isoforms
    title_size: sm
    title_align: left
    layout: {x: 6, y: 0, w: 2, h: 2}
  # --------------------------------------------------------------- sample sheet
  - component_type: text
    tag: is-sheet-intro
    section: Sample sheet
    workflow_tag: isoseq
    data_collection_tag: samples
    title: The rows every tab filters through
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per sample, its read funnel and its isoforms, opened by the
      design factors of METADATA_FILE when the run was ingested with one.
      Ticking rows narrows every tab to those samples.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: table
    tag: is-sheet-samples
    section: Sample sheet
    workflow_tag: isoseq
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample
    title: Sample summary
    description: One row per sample, its design factors first, then from the ZMWs read to the isoforms built and their novelty.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 5}
  # ------------------------------------------------------ primer demultiplexing
  - component_type: text
    tag: is-mqc-lima-intro
    section: Primer demultiplexing
    workflow_tag: isoseq
    data_collection_tag: multiqc_data
    title: A full-length read carries both primers
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [lima](https://lima.how) keeps the CCS reads with a 5' and a 3' primer
      in the expected orientation; the rest are truncated or concatemers. One
      MultiQC sample is one CCS chunk, so a chunk that stands out is a compute
      artefact rather than a library problem.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: is-mqc-lima-filtering
    section: Primer demultiplexing
    workflow_tag: isoseq
    data_collection_tag: multiqc_data
    use: multiqc/lima
    selected_module: lima
    selected_plot: ZMW filtering
    title: Reads lima kept and rejected
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 6}
  # ------------------------------------------------------------ more QC panels
  - component_type: multiqc
    tag: is-mqc-ccs
    section: More QC panels
    workflow_tag: isoseq
    data_collection_tag: multiqc_data
    use: multiqc/ccs
    selected_module: ccs
    selected_plot: ZMWs filtered and passed
    title: CCS ZMW filtering per chunk
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 6}
  # ------------------------------------------------------------------- filters
  - component_type: interactive
    tag: is-filter-sample
    index: is-sample-filter
    section: Sample scope
    group: Samples
    workflow_tag: isoseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display: {title_size: md, custom_color: '#FB8C00', icon_name: 'mdi:flask'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: is-filter-group
    index: is-group-filter
    section: Sample scope
    group: Samples
    workflow_tag: isoseq
    data_collection_tag: metadata
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display: {title_size: md, custom_color: '#7B1FA2', icon_name: 'mdi:account-group-outline'}
    placement: left
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: is-filter-flnc
    index: is-flnc-filter
    section: Sample scope
    group: Samples
    workflow_tag: isoseq
    data_collection_tag: samples
    interactive_component_type: RangeSlider
    column_name: flnc_reads
    column_type: int64
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:chart-bar'}
    placement: left
    title: FLNC reads
    layout: {x: 0, y: 6, w: 1, h: 3}

tabs:
# =============================================================================
# Reads: from ZMWs to full-length non-chimeric reads, and what they look like.
# =============================================================================
- title: Reads
  tab_order: 1
  tab_icon: mdi:filter-variant
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Read QC scope
    icon: mdi:tune
    color: teal
    description: Keep the samples inside a yield band
  grid_sections:
  - name: Reads at a glance
    icon: mdi:counter
    color: teal
    description: The read funnel and the per-sample yield, one box per measure
  - name: CCS outcome
    icon: mdi:chart-bar
    color: blue
    description: Where the ZMWs of every library went
  - name: Insert length
    icon: mdi:ruler
    color: cyan
    description: The size selection of every library
  - name: Poly(A) tails
    icon: mdi:chart-bell-curve
    color: indigo
    description: The tails TAMA trimmed before mapping
  - name: Sample detail
    icon: mdi:information-outline
    color: gray
    description: Pick a sample on the plane, read its record beside it
  - name: Read tables
    icon: mdi:table
    color: gray
    description: The per-library CCS and refine counts
    collapsed: true
  components:
  - component_type: card
    tag: is-rd-card-funnel
    section: Reads at a glance
    workflow_tag: isoseq
    data_collection_tag: samples
    aggregation: sum
    secondary_layout: attrition
    attrition_cols: [ccs_reads, fl_reads, flnc_reads, collapsed_reads]
    column_name: zmw_input
    column_type: int64
    display: {icon_name: 'mdi:filter-variant'}
    title: ZMWs to collapsed FLNC reads
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: is-rd-card-ccs
    section: Reads at a glance
    workflow_tag: isoseq
    data_collection_tag: pbccs_zmw_yield
    use: pbccs/zmw_yield
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: pct_passed
    column_type: float64
    display: {icon_name: 'mdi:check-decagram'}
    title: ZMWs giving a CCS read (%)
    title_size: sm
    title_align: left
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: is-rd-card-flnc
    section: Reads at a glance
    workflow_tag: isoseq
    data_collection_tag: isoseq_refine_summary
    use: isoseq/refine_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: pct_flnc
    column_type: float64
    display: {icon_name: 'mdi:shield-check-outline'}
    title: Non-chimeric full-length reads (%)
    title_size: sm
    title_align: left
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: is-rd-card-insert
    section: Reads at a glance
    workflow_tag: isoseq
    data_collection_tag: samples
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: median_insert_bp
    column_type: int64
    display: {icon_name: 'mdi:ruler'}
    title: Median insert length (bp)
    title_size: sm
    title_align: left
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: text
    tag: is-rd-ccs-intro
    section: CCS outcome
    workflow_tag: isoseq
    data_collection_tag: pbccs_zmw_outcomes
    title: Most lost ZMWs lack full passes
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A ZMW needs several full passes of its insert to give a consensus read,
      so long inserts or short movies show as a large "Lacking full passes"
      share. SNR and draft failures point at the chemistry instead.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: is-rd-av-ccs-outcome
    index: is-rd-av-ccs-outcome
    section: CCS outcome
    workflow_tag: isoseq
    data_collection_tag: pbccs_zmw_outcomes
    use: pbccs/ccs_outcome_bars
    # One composition level and a fixed set of CCS filters: the taxonomy
    # controls (rank, sort, top-N) mean nothing here, so the tile hides them.
    config:
      top_n: 12
      sort_by: abundance
      normalise_to_one: true
      sample_sort: first_taxon
      hidden_controls: [rank, sample_sort, top_n]
      x_title: Library
      legend_pos: right
      controls_placement: header
    title: CCS outcome per library
    description: Stacked to 100 % of the ZMWs read per library (samplesheet row), libraries ordered by their passed share.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 7}
  - component_type: text
    tag: is-rd-insert-intro
    section: Insert length
    workflow_tag: isoseq
    data_collection_tag: isoseq_insert_length
    title: The size selection, read by read
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Insert length is the cDNA left once primers and poly(A) are trimmed. A
      peak far below the others, or a missing long tail, points at degraded
      RNA or a size selection that failed.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: is-rd-av-insert
    index: is-rd-av-insert
    section: Insert length
    workflow_tag: isoseq
    data_collection_tag: isoseq_insert_length
    use: isoseq/insert_length_profile
    config:
      x_title: Insert length (bp)
      y_title: FLNC reads (% of sample)
      selection_enabled: true
      selection_column: sample
      legend_pos: bottom
      controls_placement: header
    title: FLNC insert length distribution
    description: One curve per sample in 100 bp bins, as a share of its reads, so samples of different depth overlay.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 7}
  - component_type: text
    tag: is-rd-polya-intro
    section: Poly(A) tails
    workflow_tag: isoseq
    data_collection_tag: tama_polya_tails
    title: What was left of the tails
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      TAMA trims the poly(A) stretch still on each read before mapping. Short
      lengths everywhere mean refine already clipped the tails; a broad hump
      of long ones means they reached mapping untrimmed.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: is-rd-av-polya
    index: is-rd-av-polya
    section: Poly(A) tails
    workflow_tag: isoseq
    data_collection_tag: tama_polya_tails
    use: tama/polya_tail_profile
    config:
      x_title: Poly(A) tail removed (nt)
      y_title: Reads (% of sample)
      selection_enabled: true
      selection_column: sample
      legend_pos: bottom
      controls_placement: header
    title: Poly(A) tail length distribution
    description: One curve per sample; the last point pools tails of 100 nt or more.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 7}
  - component_type: text
    tag: is-rd-detail-intro
    section: Sample detail
    workflow_tag: isoseq
    data_collection_tag: samples
    title: Depth against what survived collapse
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A sample low on both axes gave few full-length reads and mapped few of
      them. Click a point to read its record on the right.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: is-rd-detail-plane
    index: is-rd-detail-plane
    section: Sample detail
    workflow_tag: isoseq
    data_collection_tag: samples
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: flnc_reads
      y_col: collapsed_pct
      label_col: sample
      size_col: isoforms
      x_title: FLNC reads
      y_title: FLNC reads in a final isoform (%)
      log_x: true
      selection_enabled: true
      selection_column: sample
      legend_pos: bottom
      controls_placement: header
    title: FLNC depth and collapse rate per sample
    description: One point per sample, sized by the isoforms it yielded.
    title_size: h3
    layout: {x: 0, y: 1, w: 5, h: 8}
  - component_type: advanced_viz
    tag: is-rd-detail-record
    index: is-rd-detail-record
    section: Sample detail
    workflow_tag: isoseq
    data_collection_tag: samples
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: is-rd-detail-plane
      id_col: sample
      selection_source: scatter_selection
      sections:
        Read funnel: [libraries, zmw_input, ccs_reads, ccs_pass_pct, fl_reads, flnc_reads, flnc_pct, collapsed_reads, collapsed_pct, median_insert_bp]
        Transcriptome: [isoforms, genes, annotated_genes, fsm_pct, novel_isoform_pct, novel_read_pct]
    title: Sample record
    description: The picked sample as a fact panel.
    title_size: h3
    layout: {x: 5, y: 1, w: 3, h: 8}
  - component_type: table
    tag: is-rd-table-ccs
    section: Read tables
    workflow_tag: isoseq
    data_collection_tag: pbccs_zmw_yield
    use: pbccs/zmw_yield
    title: CCS yield per library
    description: ZMWs read, passed and filtered per samplesheet row, summed over the CCS chunks.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    tag: is-rd-table-refine
    section: Read tables
    workflow_tag: isoseq
    data_collection_tag: isoseq_refine_summary
    use: isoseq/refine_summary
    title: Full-length reads per library
    description: FL, FLNC and poly(A) FLNC counts per samplesheet row, from isoseq refine.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 5, w: 8, h: 5}
  - component_type: interactive
    tag: is-rd-filter-ccs
    index: is-rd-ccs-filter
    section: Read QC scope
    group: Yield
    workflow_tag: isoseq
    data_collection_tag: samples
    interactive_component_type: RangeSlider
    column_name: ccs_pass_pct
    column_type: float64
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:check-decagram'}
    placement: left
    title: ZMWs giving a CCS read (%)
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: is-rd-filter-collapsed
    index: is-rd-collapsed-filter
    section: Read QC scope
    group: Yield
    workflow_tag: isoseq
    data_collection_tag: samples
    interactive_component_type: RangeSlider
    column_name: collapsed_pct
    column_type: float64
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:set-merge'}
    placement: left
    title: FLNC reads in a final isoform (%)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: is-rd-filter-insert
    index: is-rd-insert-filter
    section: Read QC scope
    group: Yield
    workflow_tag: isoseq
    data_collection_tag: samples
    interactive_component_type: RangeSlider
    column_name: median_insert_bp
    column_type: int64
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:ruler'}
    placement: left
    title: Median insert length (bp)
    layout: {x: 0, y: 6, w: 1, h: 3}

# =============================================================================
# Isoforms: how much of the transcriptome is known, and how well supported.
# =============================================================================
- title: Isoforms
  tab_order: 2
  tab_icon: mdi:dna
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Isoform scope
    icon: mdi:tune
    color: violet
    description: Keep the isoforms of some categories, structures or support
  grid_sections:
  - name: Isoforms at a glance
    icon: mdi:counter
    color: violet
    description: Support, length and novelty of the isoforms, one box per measure
  - name: Structural categories
    icon: mdi:chart-bar
    color: grape
    description: Known, novel and unassigned isoforms, by count and by read
  - name: Isoform detail
    icon: mdi:information-outline
    color: gray
    description: Pick an isoform on the plane, read its record beside it
  - name: Isoform table
    icon: mdi:table
    color: gray
    description: Every isoform with its category, structure and support
    collapsed: true
  components:
  - component_type: card
    tag: is-iso-card-support
    section: Isoforms at a glance
    workflow_tag: isoseq
    data_collection_tag: tama_transcripts
    use: tama/transcripts
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: read_support
    column_type: int64
    display: {icon_name: 'mdi:chart-bar'}
    title: FLNC reads per isoform
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: is-iso-card-length
    section: Isoforms at a glance
    workflow_tag: isoseq
    data_collection_tag: tama_transcripts
    use: tama/transcripts
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: transcript_length
    column_type: int64
    display: {icon_name: 'mdi:ruler'}
    title: Isoform length (bp)
    title_size: sm
    title_align: left
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: is-iso-card-fsm
    section: Isoforms at a glance
    workflow_tag: isoseq
    data_collection_tag: samples
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: fsm_pct
    column_type: float64
    display: {icon_name: 'mdi:check-decagram'}
    title: Full splice matches per sample (%)
    title_size: sm
    title_align: left
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: is-iso-card-novel
    section: Isoforms at a glance
    workflow_tag: isoseq
    data_collection_tag: samples
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: novel_read_pct
    column_type: float64
    display: {icon_name: 'mdi:star-outline'}
    title: Reads on NIC and NNC isoforms (%)
    title_size: sm
    title_align: left
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: text
    tag: is-iso-cat-intro
    section: Structural categories
    workflow_tag: isoseq
    data_collection_tag: tama_category_composition
    title: How new is the transcriptome?
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      FSM and ISM isoforms repeat an annotated intron chain, NIC and NNC ones
      are new combinations or new splice sites of annotated genes. Switch the
      level to FLNC reads to see how much of the expression the novel
      isoforms carry.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: is-iso-av-categories
    index: is-iso-av-categories
    section: Structural categories
    workflow_tag: isoseq
    data_collection_tag: tama_category_composition
    use: tama/category_bars
    # The rank column is the level (isoforms or FLNC reads), so its picker is
    # labelled so; the categories are a fixed set with one colour each, the
    # same map as the box plot below (Mantine hues).
    config:
      default_rank: Isoforms
      rank_label: Level
      top_n: 12
      sort_by: abundance
      normalise_to_one: true
      sample_sort: first_taxon
      hidden_controls: [sample_sort, top_n]
      x_title: Sample
      legend_pos: right
      category_palette: {FSM: '#228be6', ISM: '#15aabf', NIC: '#40c057', NNC: '#fd7e14', genic: '#be4bdb', antisense: '#7950f2', intergenic: '#fab005', unclassified: '#868e96'}
      controls_placement: header
    title: Structural category composition
    description: Stacked to 100 % per sample, by isoform or by FLNC read.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 7}
  - component_type: figure
    tag: is-iso-fig-length
