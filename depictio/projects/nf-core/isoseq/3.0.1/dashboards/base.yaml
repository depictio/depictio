# =============================================================================
# Genes: which genes carry the isoform diversity, and what their isoforms
# look like against the annotation.
# =============================================================================
- title: Genes
  tab_order: 3
  tab_icon: mdi:family-tree
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Gene scope
    icon: mdi:tune
    color: indigo
    description: Keep the genes by status, isoform count or novelty
  grid_sections:
  - name: Genes at a glance
    icon: mdi:counter
    color: indigo
    description: How many genes, how many isoforms each, and how dominant the first one is
  - name: Isoform diversity
    icon: mdi:chart-scatter-plot
    color: blue
    description: Read support against isoform count, one point per gene
  - name: Gene structures
    icon: mdi:dna
    color: cyan
    description: The isoforms of one gene beside its reference transcripts
  - name: Gene detail
    icon: mdi:information-outline
    color: gray
    description: Pick a gene in the table, read its record beside it and see its lanes above
  components:
  - component_type: card
    tag: is-gene-card-genes
    section: Genes at a glance
    workflow_tag: isoseq
    data_collection_tag: tama_genes
    use: tama/genes
    aggregation: count
    secondary_layout: top_n
    breakdown_col: gene_status
    top_n_count: 2
    column_name: gene_id
    column_type: object
    display: {icon_name: 'mdi:family-tree'}
    title: Genes, annotated and novel
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: is-gene-card-isoforms
    section: Genes at a glance
    workflow_tag: isoseq
    data_collection_tag: tama_genes
    use: tama/genes
    # Most genes carry one isoform, so a median and a box sit flat on 1: the
    # mean and the histogram show the tail of the diverse genes instead.
    aggregation: average
    secondary_layout: histogram
    column_name: isoforms
    column_type: int64
    display: {icon_name: 'mdi:dna'}
    title: Isoforms per gene
    title_size: sm
    title_align: left
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: is-gene-card-dominant
    section: Genes at a glance
    workflow_tag: isoseq
    data_collection_tag: tama_genes
    use: tama/genes
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: dominant_isoform_pct
    column_type: float64
    display: {icon_name: 'mdi:star-outline'}
    title: Reads on the dominant isoform (%)
    title_size: sm
    title_align: left
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: is-gene-card-novel
    section: Genes at a glance
    workflow_tag: isoseq
    data_collection_tag: tama_genes
    use: tama/genes
    aggregation: sum
    secondary_layout: top_n
    breakdown_col: gene_name
    top_n_count: 3
    column_name: novel_isoforms
    column_type: int64
    display: {icon_name: 'mdi:shape-outline'}
    title: NIC and NNC isoforms
    title_size: sm
    title_align: left
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: text
    tag: is-gene-diversity-intro
    section: Isoform diversity
    workflow_tag: isoseq
    data_collection_tag: tama_genes
    title: Deeply read genes collect isoforms
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Isoform count grows with read support, so a gene well above the cloud
      at its depth is genuinely diverse. Lasso genes to narrow the structures
      and the table below to them.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: is-gene-av-plane
    index: is-gene-av-plane
    section: Isoform diversity
    workflow_tag: isoseq
    data_collection_tag: tama_genes
    use: tama/gene_isoform_plane
    config:
      x_title: FLNC reads over the gene
      y_title: Isoforms
      log_x: true
      marker_size: 6
      top_n_labels: 10
      selection_enabled: true
      selection_column: gene_id
      legend_pos: bottom
      category_palette: {FSM: '#228be6', ISM: '#15aabf', NIC: '#40c057', NNC: '#fd7e14', genic: '#be4bdb', antisense: '#7950f2', intergenic: '#fab005', unclassified: '#868e96'}
      controls_placement: header
    title: Isoforms against read support per gene
    description: One point per sample and gene, coloured by the category carrying most of its reads.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 7}
  - component_type: text
    tag: is-gene-structure-intro
    section: Gene structures
    workflow_tag: isoseq
    data_collection_tag: tama_transcript_blocks
    title: Read the new exon against the annotation
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The run's isoforms are drawn by read support, coloured by category, with
      the reference transcripts of the gene in grey below them. Pick the gene
      in the header or in the gene table.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: is-gene-av-structures
    index: is-gene-av-structures
    section: Gene structures
    workflow_tag: isoseq
    data_collection_tag: tama_transcript_blocks
    use: tama/isoform_structures
    config:
      max_transcripts: 30
      colour_by: transcript_class
      controls_placement: header
    title: Isoform structures of one gene
    description: One lane per isoform and per reference transcript, exons on a base-pair axis.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 8}
  - component_type: table
    tag: is-gene-table
    section: Gene detail
    workflow_tag: isoseq
    data_collection_tag: tama_genes
    use: tama/genes
    row_selection_enabled: true
    row_selection_column: gene_id
    title: Genes
    description: One row per sample and gene with its isoform counts by category. Select a row to open its record and draw its lanes.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 5, h: 8}
  - component_type: advanced_viz
    tag: is-gene-av-record
    index: is-gene-av-record
    section: Gene detail
    workflow_tag: isoseq
    data_collection_tag: tama_genes
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: is-gene-table
      id_col: gene_id
      title_col: gene_name
      selection_source: table_selection
      sections:
        Gene: [sample, gene_name, gene_id, gene_status, chrom, start, end, strand]
        Isoforms: [isoforms, fsm_isoforms, ism_isoforms, nic_isoforms, nnc_isoforms, novel_isoforms, top_category]
        Support: [read_support, dominant_isoform_pct]
    title: Gene record
    description: The picked gene as a fact panel, one card per sample.
    title_size: h3
    layout: {x: 5, y: 0, w: 3, h: 8}
  - component_type: interactive
    tag: is-gene-filter-status
    index: is-gene-status-filter
    section: Gene scope
    group: Genes
    workflow_tag: isoseq
    data_collection_tag: tama_genes
    interactive_component_type: MultiSelect
    column_name: gene_status
    column_type: object
    display: {title_size: md, custom_color: '#3949AB', icon_name: 'mdi:family-tree'}
    placement: left
    title: Gene status
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: is-gene-filter-isoforms
    index: is-gene-isoforms-filter
    section: Gene scope
    group: Genes
    workflow_tag: isoseq
    data_collection_tag: tama_genes
    interactive_component_type: RangeSlider
    column_name: isoforms
    column_type: int64
    display: {title_size: md, custom_color: '#3949AB', icon_name: 'mdi:dna'}
    placement: left
    title: Isoforms per gene
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: is-gene-filter-novel
    index: is-gene-novel-filter
    section: Gene scope
    group: Genes
    workflow_tag: isoseq
    data_collection_tag: tama_genes
    interactive_component_type: RangeSlider
    column_name: novel_isoforms
    column_type: int64
    display: {title_size: md, custom_color: '#3949AB', icon_name: 'mdi:shape-outline'}
    placement: left
    title: NIC and NNC isoforms
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: is-gene-filter-support
    index: is-gene-support-filter
    section: Gene scope
    group: Genes
    workflow_tag: isoseq
    data_collection_tag: tama_genes
    interactive_component_type: RangeSlider
    column_name: read_support
    column_type: int64
    display: {title_size: md, custom_color: '#3949AB', icon_name: 'mdi:chart-bar'}
    placement: left
    title: FLNC reads over the gene
    layout: {x: 0, y: 9, w: 1, h: 3}
