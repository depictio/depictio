# =========================================================================
# Tab 3 - Clonal analysis
# =========================================================================
- title: Clonal analysis
  subtitle: Diversity profiles, clone abundance and which clones two samples share
  tab_order: 3
  tab_icon: mdi:chart-bell-curve
  tab_icon_color: teal
  workflow_system: nf-core
  filter_sections:
  - name: Clonal scope
    icon: mdi:tune
    color: indigo
    description: Diversity order and the clone sizes to keep
    collapsed: true
  - name: Sharing scope
    icon: mdi:set-merge
    color: teal
    description: How many samples a clone must appear in
    collapsed: true
  grid_sections:
  - name: Clonal analysis at a glance
    icon: mdi:counter
    color: indigo
    description: Rarefied richness, clone size classes and the distance threshold behind them
  - name: Diversity profiles
    icon: mdi:chart-line
    color: indigo
    description: Hill diversity across every order, with its bootstrap confidence band
  - name: Clone abundance
    icon: mdi:chart-scatter-plot
    color: blue
    description: How steeply each repertoire is dominated by its largest clones
  - name: Sharing between samples
    icon: mdi:set-merge
    color: teal
    description: Clones seen in more than one sample of a subject
  components:
  - component_type: text
    tag: airr-clone-intro
    section: Clonal analysis at a glance
    workflow_tag: airrflow
    data_collection_tag: repertoire_summary
    title: Diversity, expansion and the threshold behind both
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Clones are called by nearest-neighbour distance, and the threshold shazam
      fitted per subject decides where one clone ends and the next begins. Every
      number on this tab rests on it, so it is on the card row.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: airr-clone-card-richness
    section: Clonal analysis at a glance
    workflow_tag: airrflow
    data_collection_tag: repertoire_summary
    use: enchantr/repertoire_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: richness
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title: Rarefied richness
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 2, h: 2}
  - component_type: card
    tag: airr-clone-card-sizeclass
    section: Clonal analysis at a glance
    workflow_tag: airrflow
    data_collection_tag: clone_sizes
    use: enchantr/clone_sizes
    aggregation: nunique
    column_name: clone_id
    column_type: object
    secondary_layout: composition
    breakdown_col: size_class
    display: {icon_name: 'mdi:chart-donut', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title: Clones by size class
    title_size: sm
    title_align: left
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: airr-clone-card-threshold
    section: Clonal analysis at a glance
    workflow_tag: airrflow
    data_collection_tag: threshold_summary
    use: enchantr/threshold_summary
    aggregation: average
    column_name: threshold
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.1
    threshold_direction: max
    threshold_warn: 0.08
    display: {icon_name: 'mdi:ruler', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title: Distance threshold
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 2, h: 2}
  - component_type: card
    tag: airr-clone-card-sensitivity
    section: Clonal analysis at a glance
    workflow_tag: airrflow
    data_collection_tag: threshold_summary
    use: enchantr/threshold_summary
    aggregation: median
    column_name: sensitivity
    column_type: float64
    secondary_layout: gauge
    coverage_max: 1
    display: {icon_name: 'mdi:check-decagram', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title: Threshold sensitivity
    title_size: sm
    title_align: left
    layout: {x: 6, y: 1, w: 2, h: 2}

  - component_type: text
    tag: airr-clone-div-intro
    section: Diversity profiles
    workflow_tag: airrflow
    data_collection_tag: clonal_diversity
    title: One curve per repertoire
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The order q weights clone abundance: at q of 0 every clone counts once, and
      as q rises the large clones dominate. A curve that falls steeply is a
      repertoire carried by a few expanded clones. Pick a q on the left to rank
      the samples at that order with their confidence intervals.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: airr-clone-div-profile
    index: airr-clone-div-profile
    section: Diversity profiles
    workflow_tag: airrflow
    data_collection_tag: clonal_diversity
    use: enchantr/diversity_profile
    config:
      group_col: subject_id
      show_ci: false
      top_n: 40
    title: Hill diversity profile
    description: Diversity against order q, one line per sample, coloured by subject.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 6}
  - component_type: figure
    tag: airr-clone-fig-ribbons
    index: airr-clone-div-ribbons
    section: Diversity profiles
    workflow_tag: airrflow
    data_collection_tag: clonal_diversity
    use: enchantr/clonal_diversity
    mode: code
    code_content: |
      palette = px.colors.qualitative.D3
      df_modified = df.sort(['sample_id', 'q'])
      fig = go.Figure()
      samples = df_modified.get_column('sample_id').unique(maintain_order=True).to_list()
      for i, sample in enumerate(samples):
          s = df_modified.filter(pl.col('sample_id') == sample)
          colour = palette[i % len(palette)]
          r, g, b = px.colors.hex_to_rgb(colour)
          fig.add_trace(go.Scatter(
              x=s.get_column('q').to_list() + s.get_column('q').to_list()[::-1],
              y=s.get_column('d_upper').to_list() + s.get_column('d_lower').to_list()[::-1],
              fill='toself', fillcolor=f'rgba({r},{g},{b},0.15)', line={'width': 0},
              hoverinfo='skip', showlegend=False,
          ))
          fig.add_trace(go.Scatter(
              x=s.get_column('q').to_list(), y=s.get_column('d').to_list(),
              mode='lines', line={'color': colour, 'width': 2}, name=sample,
          ))
      fig.update_layout(
          xaxis_title='Diversity order q', yaxis_title='Hill diversity (clones)',
          legend_title_text='Sample', margin={'t': 24, 'l': 64, 'r': 16, 'b': 48},
      )
    selection_enabled: false
    title: Diversity profile with confidence ribbons
    description: The same curves with the bootstrap band alakazam computed, shaded per sample.
    title_size: h3
    layout: {x: 0, y: 8, w: 8, h: 6}
  - component_type: advanced_viz
    tag: airr-clone-div-cibars
    index: airr-clone-div-cibars
    section: Diversity profiles
    workflow_tag: airrflow
    data_collection_tag: clonal_diversity
    use: enchantr/diversity_ci_bars
    config:
      metric_name: Hill diversity
      sort_desc: true
      colorscale: Tealgrn
    title: Diversity at one order, ranked
    description: Narrow the diversity order on the left to compare one Hill number per sample with its confidence interval.
    title_size: h3
    layout: {x: 0, y: 14, w: 8, h: 5}

  - component_type: text
    tag: airr-clone-abund-intro
    section: Clone abundance
    workflow_tag: airrflow
    data_collection_tag: clone_sizes
    title: How steeply the largest clones dominate
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Rank against frequency on log axes: a flat head means a polyclonal
      repertoire, a steep one means a few clones carry it. The sunburst splits
      the same clones into the standard homeostasis size classes.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    tag: airr-clone-fig-rank
    index: airr-clone-rank-abundance
    section: Clone abundance
    workflow_tag: airrflow
    data_collection_tag: clone_sizes
    use: enchantr/clone_sizes
    mode: code
    code_content: |
      df_modified = df.filter(pl.col('rank') <= 500)
      fig = px.scatter(
          df_modified.to_pandas(), x='rank', y='seq_freq', color='sample_id',
          log_x=True, log_y=True, opacity=0.7, hover_name='clone_id',
          custom_data=['sample_id'],
      )
      fig.update_traces(marker={'size': 5})
      fig.update_layout(
          xaxis_title='Clone rank within sample', yaxis_title='Clone frequency',
          legend_title_text='Sample', margin={'t': 24, 'l': 64, 'r': 16, 'b': 48},
      )
    selection_enabled: true
    selection_column: sample_id
    title: Rank abundance
    description: Top 500 clones per sample. Select points to narrow the rest of the tab to those samples.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 6}
  - component_type: advanced_viz
    tag: airr-clone-sunburst
    index: airr-clone-sunburst
    section: Clone abundance
    workflow_tag: airrflow
    data_collection_tag: clone_sizes
    use: enchantr/clone_composition
    config:
      start_rank: subject_id
      colour_by_rank: size_class
      max_depth: 3
      min_percent: 0.5
      show_counts: true
      palette: tab20
    title: Clonal homeostasis
    description: Sequences per subject, sample and clone size class, from rare to hyperexpanded.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 6}

  - component_type: text
    tag: airr-clone-share-intro
    section: Sharing between samples
    workflow_tag: airrflow
    data_collection_tag: clonal_overlap
    title: Clones seen in more than one sample
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Clones are defined within a subject, so samples of different subjects always
      read zero. The heatmap counts every pair, the UpSet counts the higher-order
      intersections a pairwise view cannot show.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: airr-clone-overlap
    index: airr-clone-overlap
    section: Sharing between samples
    workflow_tag: airrflow
    data_collection_tag: clonal_overlap
    use: enchantr/overlap_heatmap
    config:
      row_annotation_cols: [subject_id]
      cluster_rows: true
      cluster_cols: true
      cluster_method: average
      normalize: none
      colorscale: Tealgrn
    title: Shared clones per sample pair
    description: Diagonal is zeroed so the colour scale spans the real sharing.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 6}
  - component_type: advanced_viz
    tag: airr-clone-upset
    index: airr-clone-upset
    section: Sharing between samples
    workflow_tag: airrflow
    data_collection_tag: clone_sets
    use: enchantr/shared_clones_upset
