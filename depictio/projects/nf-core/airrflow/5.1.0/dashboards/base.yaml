# =========================================================================
# Tab 2 - Repertoire
# =========================================================================
- title: Repertoire
  subtitle: Which V and J genes and which CDR3 lengths build each repertoire
  tab_order: 2
  tab_icon: mdi:dna
  tab_icon_color: pink
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Repertoire scope
    icon: mdi:tune
    color: grape
    description: Narrow to V families or a CDR3 length band
  grid_sections:
  - name: Repertoire at a glance
    icon: mdi:counter
    color: grape
    description: How many V families and genes each repertoire draws on, and how skewed it is
  - name: V gene usage
    icon: mdi:chart-bar
    color: grape
    description: Which V families and genes the sequences were assigned to
  - name: CDR3 spectratype
    icon: mdi:chart-bell-curve
    color: grape
    description: CDR3 loop length distribution per sample, the classic clonality readout
  - name: V-J pairing
    icon: mdi:relation-many-to-many
    color: grape
    description: Which V gene pairs with which J gene, per donor
  components:
  - component_type: text
    tag: airr-rep-intro
    section: Repertoire at a glance
    workflow_tag: airrflow
    data_collection_tag: v_gene_usage
    title: Which genes build each repertoire
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      This tab reads gene usage: V families and genes, V-J pairs and CDR3 lengths
      per sample. How clonal and how diverse each repertoire is sits on the Clonal
      analysis tab.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: airr-rep-card-vfamilies
    section: Repertoire at a glance
    workflow_tag: airrflow
    data_collection_tag: v_gene_usage
    use: enchantr/v_gene_usage
    aggregation: nunique
    column_name: v_family
    column_type: object
    secondary_layout: top_n
    breakdown_col: sample_id
    top_n_count: 3
    display: {icon_name: 'mdi:shape-outline', title_font_size: xl, value_font_size: xl}
    title: V families
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: airr-rep-card-vgenes
    section: Repertoire at a glance
    workflow_tag: airrflow
    data_collection_tag: v_gene_usage
    use: enchantr/v_gene_usage
    aggregation: nunique
    column_name: taxon
    column_type: object
    filter_expr: "col('rank') == 'V gene'"
    secondary_layout: top_n
    breakdown_col: sample_id
    top_n_count: 3
    display: {icon_name: 'mdi:dna', title_font_size: xl, value_font_size: xl}
    title: V genes
    title_size: sm
    title_align: left
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: airr-rep-card-vfamily-max
    section: Repertoire at a glance
    workflow_tag: airrflow
    data_collection_tag: v_gene_usage
    use: enchantr/v_gene_usage
    aggregation: max
    column_name: seq_freq
    column_type: float64
    filter_expr: "col('rank') == 'V family'"
    secondary_layout: top_n
    breakdown_col: sample_id
    top_n_count: 3
    display: {icon_name: 'mdi:chart-pie', title_font_size: xl, value_font_size: xl}
    title: Largest V family share
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: airr-rep-card-productive
    section: Repertoire at a glance
    workflow_tag: airrflow
    data_collection_tag: cdr3_spectratype
    aggregation: sum
    column_name: sequences
    column_type: int64
    secondary_layout: top_n
    breakdown_col: subject_id
    top_n_count: 3
    display: {icon_name: 'mdi:check-decagram', title_font_size: xl, value_font_size: xl}
    title: Productive sequences
    title_size: sm
    title_align: left
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: text
    tag: airr-rep-vgene-intro
    section: V gene usage
    workflow_tag: airrflow
    data_collection_tag: v_gene_usage
    title: Which V genes were used
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The composition bars switch between V family and V gene resolution; the
      heatmap clusters samples on their gene fractions, so repertoires drawn from
      the same subject should land next to each other.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: airr-rep-v-composition
    index: airr-rep-v-composition
    section: V gene usage
    workflow_tag: airrflow
    data_collection_tag: v_gene_usage
    use: enchantr/v_usage_composition
    config:
      controls_placement: header
      default_rank: V family
      top_n: 20
      normalise_to_one: true
      sample_sort: input
      annotation_strips:
      - {column: subject_id, label: Subject, position: bottom}
    title: V gene composition
    description: Share of each sample's sequences per V family, switchable to gene resolution.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: advanced_viz
    tag: airr-rep-v-heatmap
    index: airr-rep-v-heatmap
    section: V gene usage
    workflow_tag: airrflow
    data_collection_tag: v_gene_matrix
    use: enchantr/v_gene_heatmap
    config:
      row_annotation_cols: [subject_id]
      cluster_rows: true
      cluster_cols: true
      cluster_method: ward
      cluster_metric: correlation
      normalize: col_z
    title: V gene usage heatmap
    description: Sample by V gene fractions, column standardised so rare genes stay visible.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 7}

  - component_type: text
    tag: airr-rep-spectra-intro
    section: CDR3 spectratype
    workflow_tag: airrflow
    data_collection_tag: cdr3_spectratype
    title: CDR3 length per sample
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      CDR3 length in amino acids (the IMGT junction without its anchor codons),
      one panel per sample normalised to its own productive in-frame sequences.
      A polyclonal repertoire draws a smooth bell whose centre depends on the
      locus, and one length towering over its neighbours is an expanded clone.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: airr-rep-fig-spectratype
    index: airr-rep-spectratype-bars
    section: CDR3 spectratype
    workflow_tag: airrflow
    data_collection_tag: cdr3_spectratype
    visu_type: bar
    dict_kwargs: {x: cdr3_aa_length, y: fraction, color: subject_id, facet_col: sample_id, facet_col_wrap: 5}
    title: Spectratype per sample
    description: Share of each sample's productive sequences at each CDR3 length in amino acids, one panel per sample, coloured by donor.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 8}
  - component_type: text
    tag: airr-rep-vj-intro
    section: V-J pairing
    workflow_tag: airrflow
    data_collection_tag: vj_usage_matrix
    title: Which V genes pair with which J genes
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per donor and V gene, one column per J gene, each cell the share of
      that donor's productive sequences using the pair, counted per donor because
      clones are defined per donor. A single bright cell away from the dominant J
      gene column is a candidate expanded lineage.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: airr-rep-vj-heatmap
    index: airr-rep-vj-heatmap
    section: V-J pairing
    workflow_tag: airrflow
    data_collection_tag: vj_usage_matrix
    viz_kind: complex_heatmap
    config:
      viz_kind: complex_heatmap
      index_column: row_id
      row_annotation_cols: [subject_id]
      cluster_rows: true
      cluster_cols: false
      cluster_method: ward
      cluster_metric: euclidean
      normalize: none
    title: V by J pairing
    description: Share of each donor's sequences per V and J gene pair; rows cluster by pairing profile, J genes keep their genomic order.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 10}
  - component_type: interactive
    tag: airr-rep-filter-family
    index: airr-rep-family-filter
    section: Repertoire scope
    group: V gene resolution
    workflow_tag: airrflow
    data_collection_tag: v_gene_usage
    interactive_component_type: MultiSelect
    column_name: v_family
    column_type: object
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:shape-outline'}
    placement: left
    title: V family
    layout: {x: 0, y: 5, w: 1, h: 3}
  - component_type: interactive
    tag: airr-rep-filter-cdr3
    index: airr-rep-cdr3-range
    section: Repertoire scope
    group: CDR3 length
    workflow_tag: airrflow
    data_collection_tag: cdr3_spectratype
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: cdr3_aa_length
    column_type: int64
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:ruler'}
    placement: left
    title: CDR3 length (aa)
    layout: {x: 0, y: 8, w: 1, h: 3}

# =========================================================================
# Tab 3 - Clonal analysis
# =========================================================================
- title: Clonal analysis
  subtitle: How clonal and how diverse each repertoire is, and which clones samples share
  tab_order: 3
  tab_icon: mdi:chart-bell-curve
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Clonal scope
    icon: mdi:tune
    color: indigo
    description: Clone-count band, diversity order and the clone sizes to keep
  - name: Sharing scope
    icon: mdi:set-merge
    color: teal
    description: How many samples a clone must appear in
  grid_sections:
  - name: Clonal analysis at a glance
    icon: mdi:counter
    color: indigo
    description: Clone counts, clone size, diversity and the distance threshold behind them
  - name: Clones and depth
    icon: mdi:chart-scatter-plot
    color: violet
    description: Clone count against sequencing depth, and richness against evenness
  - name: Diversity profiles
    icon: mdi:chart-line
    color: indigo
    description: Hill diversity across every order, with its bootstrap confidence band
  - name: Clone abundance
    icon: mdi:chart-scatter-plot
    color: blue
    description: How steeply each repertoire is dominated by its largest clones
  - name: Sharing between samples
    icon: mdi:set-merge
    color: teal
    description: Clones seen in more than one sample of a subject
  - name: Clonal tables
    icon: mdi:table
    color: gray
    description: The fitted distance threshold per subject and the shared-clone matrix
    collapsed: true
  components:
  - component_type: text
    tag: airr-clone-intro
    section: Clonal analysis at a glance
    workflow_tag: airrflow
    data_collection_tag: repertoire_summary
    title: Diversity, expansion and the threshold behind both
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Clones are called within a subject by nearest-neighbour distance, and the
      threshold [shazam](https://shazam.readthedocs.io) fits per subject decides
      where one clone ends and the next begins. Every number on this tab rests on
      it, so it sits on the card row with its sensitivity.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: airr-rep-card-clones
    section: Clonal analysis at a glance
    workflow_tag: airrflow
    data_collection_tag: repertoire_summary
    use: enchantr/repertoire_summary
    aggregation: sum
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: number_of_clones
    column_type: int64
    display: {icon_name: 'mdi:dna', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title: Clones
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: airr-rep-card-clonesize
    section: Clonal analysis at a glance
    workflow_tag: airrflow
    data_collection_tag: repertoire_summary
    use: enchantr/repertoire_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: sequences_per_clone
    column_type: float64
    display: {icon_name: 'mdi:ruler', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title: Median clone size
    title_size: sm
    title_align: left
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: airr-clone-card-richness
    section: Clonal analysis at a glance
    workflow_tag: airrflow
    data_collection_tag: repertoire_summary
    use: enchantr/repertoire_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: richness
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title: Rarefied richness
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: airr-rep-card-evenness
    section: Clonal analysis at a glance
    workflow_tag: airrflow
    data_collection_tag: repertoire_summary
    use: enchantr/repertoire_summary
    aggregation: median
    column_name: evenness
    column_type: float64
    secondary_layout: gauge
    coverage_max: 1
    display: {icon_name: 'mdi:scale-balance', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title: Evenness
    title_size: sm
    title_align: left
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: card
    tag: airr-clone-card-threshold
    section: Clonal analysis at a glance
    workflow_tag: airrflow
    data_collection_tag: threshold_summary
    use: enchantr/threshold_summary
    aggregation: median
    column_name: threshold
    column_type: float64
    secondary_layout: top_n
    breakdown_col: subject_id
    top_n_count: 4
    display: {icon_name: 'mdi:ruler', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title: Distance threshold
    description: The clonal distance shazam fitted, median over subjects with each subject's value beside it. It is fitted, not a quality verdict.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 4, w: 4, h: 2}
  - component_type: card
    tag: airr-clone-card-sensitivity
    section: Clonal analysis at a glance
    workflow_tag: airrflow
    data_collection_tag: threshold_summary
    use: enchantr/threshold_summary
    aggregation: median
    column_name: sensitivity
    column_type: float64
    secondary_layout: top_n
    breakdown_col: subject_id
    top_n_count: 4
    display: {icon_name: 'mdi:check-decagram', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title: Threshold sensitivity
    title_size: sm
    title_align: left
    layout: {x: 4, y: 4, w: 4, h: 2}

  - component_type: text
    tag: airr-rep-depth-intro
    section: Clones and depth
    workflow_tag: airrflow
    data_collection_tag: repertoire_summary
    title: Clones against sequencing depth
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Both axes are log scaled, so a repertoire that is simply deeper sits along
      the diagonal and one that is genuinely more clonal sits below it. Selecting
      points narrows the rest of this tab to those samples.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: airr-rep-fig-depth
    index: airr-rep-depth-scatter
    section: Clones and depth
    workflow_tag: airrflow
    data_collection_tag: repertoire_summary
    use: enchantr/repertoire_summary
    mode: code
    code_content: |
      fig = px.scatter(
          df.to_pandas(), x='sequences', y='number_of_clones', color='subject_id',
          size='sequences_per_clone', size_max=26, log_x=True, log_y=True,
          hover_name='sample_id', custom_data=['sample_id'],
      )
      fig.update_layout(
          xaxis_title='Sequences into clonal assignment', yaxis_title='Clones',
          legend_title_text='Subject', margin={'t': 24, 'l': 64, 'r': 16, 'b': 48},
      )
    selection_enabled: true
    selection_column: sample_id
    title: Clones versus depth
    description: One point per sample; size is the mean clone size. Select points to narrow the rest of this tab.
    title_size: h3
    layout: {x: 0, y: 2, w: 4, h: 6}
  - component_type: advanced_viz
    tag: airr-rep-richness-evenness
    index: airr-rep-richness-evenness
    section: Clones and depth
    workflow_tag: airrflow
    data_collection_tag: repertoire_summary
    use: enchantr/richness_evenness
    config:
      controls_placement: header
      x_title: Rarefied richness (clones)
      y_title: Evenness
      log_x: true
      top_n_labels: 3
      selection_enabled: true
      selection_column: sample_id
    title: Richness against evenness
    description: One point per sample, sized by the sequences behind it. A large but uneven repertoire sits low and right.
    title_size: h3
    layout: {x: 4, y: 2, w: 4, h: 6}

  - component_type: text
    tag: airr-clone-div-intro
    section: Diversity profiles
    workflow_tag: airrflow
    data_collection_tag: clonal_diversity
    title: One curve per repertoire
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The order q weights clone abundance: at q = 0 every clone counts once, and
      as q rises the largest clones dominate, so a steeply falling curve is a
      repertoire carried by a few expanded clones. The ranked bars show one named
      order at a time, picked in the Diversity order filter (Shannon, q = 1, by
      default).
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: airr-clone-div-ribbons
    index: airr-clone-div-ribbons
    section: Diversity profiles
    workflow_tag: airrflow
    data_collection_tag: clonal_diversity
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: sample_id
      x_col: q
      y_col: d
      lower_col: d_lower
      upper_col: d_upper
      x_title: Diversity order q
      y_title: Hill diversity (clones)
      band_opacity: 0.15
      legend_pos: right
    title: Diversity profile with confidence ribbons
    description: Diversity against order q, one curve per sample with the bootstrap band alakazam computed. Two samples whose bands overlap at a given q are not distinguishable at that order.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 6}
  - component_type: advanced_viz
    tag: airr-clone-div-cibars
    index: airr-clone-div-cibars
    section: Diversity profiles
    workflow_tag: airrflow
    data_collection_tag: diversity_orders
    use: enchantr/diversity_order_ci_bars
    config:
      metric_name: Hill diversity
      sort_desc: true
      colorscale: Tealgrn
    title: Diversity at one named order, ranked
    description: One Hill number per sample with its bootstrap interval, at the order picked in the Diversity order filter (q = 1 by default).
    title_size: h3
    layout: {x: 0, y: 8, w: 8, h: 5}

  - component_type: text
    tag: airr-clone-abund-intro
    section: Clone abundance
    workflow_tag: airrflow
    data_collection_tag: clone_sizes
    title: How steeply the largest clones dominate
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Rank against frequency on log axes: a flat head means a polyclonal
      repertoire, a steep one means a few clones carry it. The sunburst splits
      the same clones into the standard homeostasis size classes.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: airr-clone-abundance-ribbon
    index: airr-clone-abundance-ribbon
    section: Clone abundance
    workflow_tag: airrflow
    data_collection_tag: clonal_abundance
    use: enchantr/abundance_ribbon
    config:
      x_title: Clone rank within sample
      y_title: Relative abundance
      log_x: true
      log_y: true
      band_opacity: 0.18
      line_width: 1.6
      legend_pos: right
      selection_enabled: true
      selection_column: sample_id
    title: Rank abundance with bootstrap confidence
    description: The shaded band is alakazam's bootstrap interval. Where two curves overlap inside their bands, the difference in expansion is not supported.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: advanced_viz
    tag: airr-clone-sunburst
    index: airr-clone-sunburst
    section: Clone abundance
    workflow_tag: airrflow
    data_collection_tag: clone_sizes
    use: enchantr/clone_composition
    config:
      start_rank: subject_id
      colour_by_rank: size_class
      max_depth: 3
      min_percent: 0.5
      show_counts: true
      palette: tab20
    title: Clonal homeostasis
    description: Sequences per subject, sample and clone size class, from rare to hyperexpanded.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 6}

  - component_type: text
    tag: airr-clone-share-intro
    section: Sharing between samples
    workflow_tag: airrflow
    data_collection_tag: clonal_overlap
    title: Clones seen in more than one sample
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Clones are defined within a subject, so samples of different subjects always
      read zero. The heatmap counts every pair, the UpSet counts the higher-order
      intersections a pairwise view cannot show.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: airr-clone-overlap
    index: airr-clone-overlap
    section: Sharing between samples
    workflow_tag: airrflow
    data_collection_tag: clonal_overlap
    use: enchantr/overlap_heatmap
    config:
      row_annotation_cols: [subject_id]
      cluster_rows: true
      cluster_cols: true
      cluster_method: average
      normalize: none
      colorscale: Blues
    title: Shared clones per sample pair
    description: Diagonal is zeroed so the colour scale spans the real sharing.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 6}
  - component_type: advanced_viz
    tag: airr-clone-upset
    index: airr-clone-upset
    section: Sharing between samples
    workflow_tag: airrflow
    data_collection_tag: clone_sets
    use: enchantr/shared_clones_upset
    config:
      sort_by: cardinality
      sort_order: descending
      min_size: 5
      color_intersections_by: degree
      show_set_sizes: true
      show_values: false
      default_annotation_cols: [total_sequences]
    title: Clone set intersections
    description: Each bar is a set of samples and how many clones appear in exactly those.
    title_size: h3
    layout: {x: 0, y: 8, w: 8, h: 6}

  - component_type: table
    tag: airr-clone-table-threshold
    section: Clonal tables
    workflow_tag: airrflow
    data_collection_tag: threshold_summary
    use: enchantr/threshold_summary
    row_selection_enabled: true
