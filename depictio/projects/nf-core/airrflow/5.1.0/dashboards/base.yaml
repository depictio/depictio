      row_annotation_cols: [subject_id]
      cluster_rows: true
      cluster_cols: true
      cluster_method: ward
      cluster_metric: correlation
      normalize: col_z
    title: V gene usage heatmap
    description: Sample by V gene fractions, column standardised so rare genes stay visible.
    title_size: h3
    layout: {x: 0, y: 8, w: 8, h: 7}
  - component_type: figure
    tag: airr-rep-fig-family
    index: airr-rep-family-bars
    section: V gene usage
    workflow_tag: airrflow
    data_collection_tag: v_gene_usage
    use: enchantr/v_gene_usage
    mode: code
    code_content: |
      df_modified = df.filter(pl.col('rank') == 'V family').sort(['sample_id', 'v_family'])
      fig = px.bar(
          df_modified.to_pandas(), x='sample_id', y='seq_freq', color='v_family',
          barmode='stack',
      )
      fig.update_layout(
          xaxis_title='Sample', yaxis_title='Share of sequences',
          legend_title_text='V family', margin={'t': 24, 'l': 64, 'r': 16, 'b': 88},
      )
      fig.update_xaxes(tickangle=-40)
    selection_enabled: false
    title: V family composition
    description: The family level on its own, stacked to one per sample.
    title_size: h3
    layout: {x: 0, y: 15, w: 8, h: 6}

  - component_type: text
    tag: airr-rep-depth-intro
    section: Clones and depth
    workflow_tag: airrflow
    data_collection_tag: repertoire_summary
    title: Clones against sequencing depth
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Both axes are log scaled, so a repertoire that is simply deeper sits along
      the diagonal and one that is genuinely more clonal sits below it. Selecting
      points, or rows in the table, filters the clonal tab.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    tag: airr-rep-fig-depth
    index: airr-rep-depth-scatter
    section: Clones and depth
    workflow_tag: airrflow
    data_collection_tag: repertoire_summary
    use: enchantr/repertoire_summary
    mode: code
    code_content: |
      fig = px.scatter(
          df.to_pandas(), x='sequences', y='number_of_clones', color='subject_id',
          size='sequences_per_clone', size_max=26, log_x=True, log_y=True,
          hover_name='sample_id', custom_data=['sample_id'],
      )
      fig.update_layout(
          xaxis_title='Sequences into clonal assignment', yaxis_title='Clones',
