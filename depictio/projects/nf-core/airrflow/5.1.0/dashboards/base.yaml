    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: airr-clone-filter-rank
    index: airr-clone-rank-range
    section: Clonal scope
    group: Clone size
    workflow_tag: airrflow
    data_collection_tag: clone_sizes
    interactive_component_type: RangeSlider
    column_name: rank
    column_type: int64
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:counter'}
    placement: left
    title: Clone rank
