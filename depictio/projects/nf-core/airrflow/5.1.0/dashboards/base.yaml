- title: CDR3 & Pairing
  subtitle: How long are CDR3 loops, and which V and J genes pair?
  tab_group: Repertoire
  tab_order: 4
  tab_icon: mdi:ruler
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: CDR3 filters
    icon: mdi:filter-variant
    color: grape
    description: Narrows the CDR3 lengths and the locus, the cards included
  grid_sections:
  - name: CDR3 at a glance
    icon: mdi:counter
    color: grape
    description: Productive sequences, and how tall the tallest CDR3 length stands
  - name: Spectratype
    icon: mdi:chart-line
    color: grape
    description: Share of each sample's sequences at each CDR3 length
  - name: V-J pairing
    icon: mdi:chart-box-outline
    color: grape
    description: Each subject's V genes against the J genes they joined
  - name: Spectratype per sample
    icon: mdi:chart-bar
    color: gray
    description: One panel per sample, the same shares as bars
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      Both views read the [AIRR rearrangement table](https://docs.airr-community.org/en/stable/datarep/rearrangements.html)
      of the productive sequences. The CDR3 length distribution (spectratype) is a smooth bell
      in a diverse repertoire, and one length towering over the rest points to an expanded
      clone. The heatmap pairs each subject's V genes with the J genes they joined, as shares
      of that subject's sequences.
    tag: airr-cdr3-intro
    index: cdr3-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: airrflow
    data_collection_tag: cdr3_spectratype
    interactive_component_type: RangeSlider
    column_name: cdr3_aa_length
    column_type: int64
    show_histogram: true
    display:
      icon_name: mdi:ruler
      custom_color: grape
    section: CDR3 filters
    tag: airr-cdr3-filter-length
    index: cdr3-length-range
    title: CDR3 length (aa)
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: airrflow
    data_collection_tag: cdr3_spectratype
    interactive_component_type: MultiSelect
    column_name: locus
    column_type: object
    display:
      icon_name: mdi:tag-multiple-outline
      custom_color: cyan
    section: CDR3 filters
    tag: airr-cdr3-filter-locus
    index: cdr3-locus-filter
    title: Locus
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: airrflow
    data_collection_tag: cdr3_spectratype
    aggregation: sum
    column_name: sequences
    column_type: int64
    secondary_layout: concentration
    breakdown_col: sample_id
    top_n_count: 3
    display:
      icon_name: mdi:check-decagram
      icon_color: grape
      caption: share the 3 largest samples hold
    section: CDR3 at a glance
    tag: airr-cdr3-card-sequences
    index: cdr3-card-sequences
    title: Productive sequences
    description: Productive in-frame sequences behind the spectratype, and how evenly the samples share them.
    layout: {x: 0, y: 0, w: 4, h: 2}
  - component_type: card
    workflow_tag: airrflow
    data_collection_tag: cdr3_spectratype
    aggregation: max
    column_name: fraction
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bar
      icon_color: pink
      caption: the tallest length, with every length's spread
      format: percent
    section: CDR3 at a glance
    tag: airr-cdr3-card-peak
    index: cdr3-card-peak
    title: Largest length share
    description: The largest share one CDR3 length takes in a sample. Far above the box, it points to an expanded clone.
    layout: {x: 4, y: 0, w: 4, h: 2}
  - component_type: figure
    workflow_tag: airrflow
    data_collection_tag: cdr3_spectratype
    visu_type: line
    mode: code
    code_content: |-
      # One line per sample: the share of its productive sequences at each CDR3
      # length. Coloured by subject, or by Analysis mode's groups when it has
      # some; a run with several loci draws one dash style per locus.
      kw = depictio_group_kwargs or {'color': 'subject_id', 'color_discrete_map': depictio_category_colors.get('subject_id') or {}}
      d = df.sort(['sample_id', 'cdr3_aa_length'])
      dash = 'locus' if d.get_column('locus').n_unique() > 1 else None
      fig = px.line(d.to_pandas(), x='cdr3_aa_length', y='fraction', line_group='sample_id', line_dash=dash, hover_name='sample_id', labels={'cdr3_aa_length': 'CDR3 length (amino acids)', 'fraction': 'Share of sequences', 'subject_id': 'Subject', 'locus': 'Locus'}, **kw)
      fig.update_yaxes(tickformat='.0%')
      fig.update_layout(margin=dict(t=10))
    section: Spectratype
    tag: airr-cdr3-fig-lines
    index: cdr3-spectratype-lines
    title: CDR3 spectratype
    description: One line per sample. A spike above the bell is an expanded clone.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: airrflow
    data_collection_tag: vj_usage_matrix
    viz_kind: complex_heatmap
    config:
      viz_kind: complex_heatmap
      index_column: row_id
      row_annotation_cols: [subject_id]
      cluster_rows: true
      cluster_cols: false
      cluster_method: ward
      cluster_metric: euclidean
      normalize: none
    section: V-J pairing
    tag: airr-cdr3-vj-heatmap
    index: cdr3-vj-heatmap
    title: V by J pairing
    description: Rows cluster by pairing profile; J genes keep their genomic order.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: figure
    workflow_tag: airrflow
    data_collection_tag: cdr3_spectratype
    visu_type: bar
    mode: code
    code_content: |-
      # The spectratype of each sample in its own panel, coloured by subject or
      # by Analysis mode's groups when it has some.
      kw = depictio_group_kwargs or {'color': 'subject_id', 'color_discrete_map': depictio_category_colors.get('subject_id') or {}}
      d = df.sort(['sample_id', 'cdr3_aa_length'])
      fig = px.bar(d.to_pandas(), x='cdr3_aa_length', y='fraction', facet_col='sample_id', facet_col_wrap=5, labels={'cdr3_aa_length': 'CDR3 (aa)', 'fraction': 'Share', 'subject_id': 'Subject', 'sample_id': 'Sample'}, **kw)
      fig.update_yaxes(tickformat='.0%')
      fig.update_layout(margin=dict(t=30))
    section: Spectratype per sample
    tag: airr-cdr3-fig-facets
    index: cdr3-spectratype-facets
    title: Spectratype per sample
    description: Share of each sample's productive sequences at each CDR3 length, one panel per sample.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Clonal Diversity
  subtitle: How many clones does each repertoire hold, and how diverse is it?
  tab_group: Clonality
  tab_order: 5
  tab_icon: mdi:chart-bell-curve
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Diversity filters
    icon: mdi:filter-variant
    color: teal
    description: Clone count band, and the Hill order the ranked bars show
  grid_sections:
  - name: Diversity at a glance
    icon: mdi:counter
    color: teal
    description: Clones over the samples in view, and the median effective number of clones
  - name: Diversity profile
    icon: mdi:chart-line
    color: teal
    description: Hill diversity against the order q, one curve per sample
  - name: Samples compared
    icon: mdi:chart-scatter-plot
    color: teal
    description: One Hill order ranked, and richness against evenness
  - name: Clones and depth
    icon: mdi:chart-scatter-plot
    color: teal
    description: Clones against the sequences that entered clonal assignment
  - name: Clone definition
    icon: mdi:ruler
    color: gray
    description: The distance threshold that grouped sequences into clones, per subject
    collapsed: true
  - name: Per-sample table
    icon: mdi:table
    color: gray
    description: Clones, clone sizes and Hill numbers for every sample
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [SCOPer](https://scoper.readthedocs.io) groups each subject's sequences into clones at the
      distance [SHazaM](https://shazam.readthedocs.io) fits, and
      [alakazam](https://alakazam.readthedocs.io) computes Hill diversity on rarefied
      repertoires. At q = 0 every clone counts once, and the higher q, the more the largest
      clones weigh. A curve that falls steeply is a repertoire carried by a few expanded clones.
    tag: airr-div-intro
    index: div-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: airrflow
    data_collection_tag: repertoire_summary
    interactive_component_type: RangeSlider
    column_name: number_of_clones
    column_type: int64
    show_histogram: true
    display:
      icon_name: mdi:sitemap
      custom_color: teal
    section: Diversity filters
    tag: airr-div-filter-clones
    index: div-clone-range
    title: Clones
    layout: {x: 0, y: 0, w: 1, h: 3}
  # Single choice on the three named orders of diversity_orders. It reaches the
  # ranked bars only: the profile reads clonal_diversity.
  - component_type: interactive
    workflow_tag: airrflow
    data_collection_tag: diversity_orders
    interactive_component_type: Select
    column_name: order
    column_type: object
    default_value: q = 1, Shannon
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: cyan
    section: Diversity filters
    tag: airr-div-filter-order
    index: div-order-filter
    title: Diversity order
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: airrflow
    data_collection_tag: repertoire_summary
    use: enchantr/repertoire_summary
    aggregation: sum
    column_name: number_of_clones
    column_type: int64
    secondary_layout: concentration
    breakdown_col: sample_id
    top_n_count: 3
    display:
      icon_name: mdi:sitemap
      icon_color: teal
      caption: share the 3 largest samples hold
    section: Diversity at a glance
    tag: airr-div-card-clones
    index: div-card-clones
    title: Clones
    description: Clones over the samples in view, and how much of them the three largest samples hold.
    layout: {x: 0, y: 0, w: 4, h: 2}
  - component_type: card
    workflow_tag: airrflow
    data_collection_tag: repertoire_summary
    use: enchantr/repertoire_summary
    aggregation: median
    column_name: shannon
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: cyan
      caption: Hill diversity at q = 1, the median sample
      decimals: 0
    section: Diversity at a glance
    tag: airr-div-card-shannon
    index: div-card-shannon
    title: Effective clones
    description: Hill diversity at q = 1 (the exponential of Shannon entropy), in clones of equal size, after rarefying every sample to a common depth.
    layout: {x: 4, y: 0, w: 4, h: 2}
  - component_type: advanced_viz
    workflow_tag: airrflow
    data_collection_tag: clonal_diversity
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: sample_id
      x_col: q
      y_col: d
      lower_col: d_lower
      upper_col: d_upper
      x_title: Diversity order q
      y_title: Hill diversity (clones)
      band_opacity: 0.15
      legend_pos: bottom
    section: Diversity profile
    tag: airr-div-profile
    index: div-profile
    title: Diversity profile
    description: Two samples whose bands overlap at an order are not distinguishable at it.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: airrflow
    data_collection_tag: diversity_orders
    use: enchantr/diversity_order_ci_bars
    config:
      metric_name: Hill diversity
      sort_desc: true
      colorscale: Tealgrn
    section: Samples compared
    tag: airr-div-cibars
    index: div-ci-bars
    title: Diversity at one order, ranked
    description: One Hill number per sample with its bootstrap interval, Shannon by default.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: airrflow
    data_collection_tag: repertoire_summary
    use: enchantr/richness_evenness
    config:
      x_title: Rarefied richness (clones)
      y_title: Evenness
      log_x: true
      top_n_labels: 0
      selection_enabled: true
      selection_column: sample_id
    section: Samples compared
    tag: airr-div-richness-evenness
    index: div-richness-evenness
    title: Richness against evenness
    description: One point per sample, sized by its sequences. Large but uneven sits low and right.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: figure
    workflow_tag: airrflow
    data_collection_tag: repertoire_summary
    use: enchantr/repertoire_summary
    visu_type: scatter
    mode: code
    code_content: |-
      # One point per sample: clones against the sequences that entered clonal
      # assignment, on log axes; size is the mean clone size. Coloured by
      # subject, or by Analysis mode's groups when it has some.
      kw = depictio_group_kwargs or {'color': 'subject_id', 'color_discrete_map': depictio_category_colors.get('subject_id') or {}}
      fig = px.scatter(df.to_pandas(), x='sequences', y='number_of_clones', size='sequences_per_clone', size_max=26, log_x=True, log_y=True, hover_name='sample_id', custom_data=['sample_id'], labels={'sequences': 'Sequences into clonal assignment', 'number_of_clones': 'Clones', 'sequences_per_clone': 'Sequences per clone', 'subject_id': 'Subject'}, **kw)
      fig.update_layout(margin=dict(t=10))
    selection_enabled: true
    selection_column: sample_id
    section: Clones and depth
    tag: airr-div-fig-depth
    index: div-depth-scatter
    title: Clones against depth
    description: Select points to narrow the rest of this tab to those samples.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: card
    workflow_tag: airrflow
    data_collection_tag: threshold_summary
    use: enchantr/threshold_summary
    aggregation: median
    column_name: threshold
    column_type: float64
    secondary_layout: top_n
    breakdown_col: subject_id
    top_n_count: 4
    display:
      icon_name: mdi:ruler
      icon_color: orange
      caption: median, and each subject's value
      decimals: 3
    section: Clone definition
    tag: airr-div-card-threshold
    index: div-card-threshold
    title: Distance threshold
    description: The clonal distance SHazaM fitted for each subject. It is fitted, not a quality verdict.
    layout: {x: 0, y: 0, w: 4, h: 2}
  - component_type: card
    workflow_tag: airrflow
    data_collection_tag: threshold_summary
    use: enchantr/threshold_summary
    aggregation: median
    column_name: sensitivity
    column_type: float64
    secondary_layout: top_n
    breakdown_col: subject_id
    top_n_count: 4
    display:
      icon_name: mdi:check-decagram
      icon_color: green
      caption: median, and each subject's value
      format: percent
    section: Clone definition
    tag: airr-div-card-sensitivity
    index: div-card-sensitivity
    title: Threshold sensitivity
    description: How many true clonal relatives the fitted threshold keeps, per subject.
    layout: {x: 4, y: 0, w: 4, h: 2}
  - component_type: table
    workflow_tag: airrflow
    data_collection_tag: threshold_summary
    use: enchantr/threshold_summary
    row_selection_enabled: true
    row_selection_column: subject_id
    section: Clone definition
    tag: airr-div-table-threshold
    index: div-table-threshold
    title: Clonal distance threshold
    layout: {x: 0, y: 2, w: 8, h: 6}
  - component_type: table
    workflow_tag: airrflow
    data_collection_tag: repertoire_summary
    use: enchantr/repertoire_summary
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Per-sample table
    tag: airr-div-table-summary
    index: div-table-summary
    title: Repertoire summary
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Clonal Expansion
  subtitle: How strongly do the largest clones dominate each repertoire?
  tab_group: Clonality
  tab_order: 6
  tab_icon: mdi:trending-up
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Expansion filters
    icon: mdi:filter-variant
    color: blue
    description: Narrows the clones by their size class, the cards included
  grid_sections:
  - name: Expansion at a glance
    icon: mdi:counter
    color: blue
    description: Clones and sequences by size class, and how big the largest clone is
  - name: Rank abundance
    icon: mdi:chart-line
    color: blue
    description: Each clone's share of its sample against its rank, with bootstrap bands
  - name: Clonal homeostasis
    icon: mdi:chart-donut
    color: blue
    description: Sequences by subject, sample and clone size class
  components:
  - component_type: text
    order: 1
    body: >
      [alakazam](https://alakazam.readthedocs.io) ranks the clones of each sample by size,
      with a bootstrap band around each curve. On log axes a flat head is a polyclonal
      repertoire and a steep one a repertoire carried by a few clones. The sunburst bins each
      sample's sequences by clone size, from rare to hyperexpanded.
    tag: airr-exp-intro
    index: exp-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: airrflow
    data_collection_tag: clone_sizes
    interactive_component_type: MultiSelect
    column_name: size_class
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: blue
    section: Expansion filters
    tag: airr-exp-filter-sizeclass
    index: exp-sizeclass-filter
    title: Size class
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: card
    workflow_tag: airrflow
    data_collection_tag: clone_sizes
    use: enchantr/clone_sizes
    aggregation: count
    column_name: clone_id
    column_type: object
    secondary_layout: donut
    breakdown_col: size_class
    top_n_count: 5
    display:
      icon_name: mdi:sitemap
      icon_color: blue
      caption: clones, by size class
    section: Expansion at a glance
    tag: airr-exp-card-clones
    index: exp-card-clones
    title: Clones
    description: Clones of the samples in view, one per sample they appear in, split by size class.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: airrflow
    data_collection_tag: clone_sizes
    use: enchantr/clone_sizes
    aggregation: sum
    column_name: seq_count
    column_type: int64
    secondary_layout: composition
    breakdown_col: size_class
    top_n_count: 5
    display:
      icon_name: mdi:layers-outline
      icon_color: red
      caption: sequences, by clone size class
    section: Expansion at a glance
    tag: airr-exp-card-sequences
    index: exp-card-sequences
    title: Sequences
    description: Sequences in clones. Most clones are rare, yet most sequences can sit in a few large ones.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: airrflow
    data_collection_tag: clone_sizes
    use: enchantr/clone_sizes
    aggregation: median
    column_name: seq_freq
    column_type: float64
    filter_expr: "col('rank') == 1"
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:trending-up
      icon_color: orange
      caption: share of a sample's sequences, the median sample
      format: percent
    section: Expansion at a glance
    tag: airr-exp-card-top-clone
    index: exp-card-top-clone
    title: Top clone share
    description: Share of a sample's sequences its largest clone holds.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # The largest clone, not the median one: most clones hold a single sequence,
  # so a median clone size sits at 1 on every run.
  - component_type: card
    workflow_tag: airrflow
    data_collection_tag: clone_sizes
    use: enchantr/clone_sizes
    aggregation: max
    column_name: seq_count
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:ruler
      icon_color: indigo
      caption: sequences, with every clone's size below
    section: Expansion at a glance
    tag: airr-exp-card-clone-size
    index: exp-card-clone-size
    title: Largest clone
    description: Sequences in the largest clone of the samples in view. The histogram shows every clone's size; the long right tail is the expanded clones.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: airrflow
    data_collection_tag: clonal_abundance
    use: enchantr/abundance_ribbon
    config:
      x_title: Clone rank within sample
      y_title: Relative abundance
      log_x: true
      log_y: true
      band_opacity: 0.08
      line_width: 1.6
      legend_pos: bottom
      selection_enabled: true
      selection_column: sample_id
    section: Rank abundance
    tag: airr-exp-abundance
    index: exp-abundance-ribbon
    title: Rank abundance
    description: Where two curves overlap inside their bands, the difference in expansion is not supported.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: airrflow
    data_collection_tag: clone_sizes
    use: enchantr/clone_composition
    config:
      start_rank: subject_id
      colour_by_rank: size_class
      max_depth: 3
      min_percent: 0.5
      show_counts: true
    section: Clonal homeostasis
    tag: airr-exp-sunburst
    index: exp-homeostasis
    title: Clonal homeostasis
    description: Sequences per subject, sample and clone size class, from rare to hyperexpanded.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Clone Sharing
  subtitle: Which clones do the samples of one subject share?
  tab_group: Clonality
  tab_order: 7
  tab_icon: mdi:set-merge
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Sharing filters
    icon: mdi:filter-variant
    color: cyan
    description: Keeps the clones seen in a given number of samples
  grid_sections:
  - name: Sharing at a glance
    icon: mdi:counter
    color: cyan
    description: Clones by how many samples hold them, and the weight of the shared ones
  - name: Clones by sharing
    icon: mdi:chart-bar
    color: cyan
    description: How many clones one, two or more samples hold
  - name: Pairs and sets
    icon: mdi:set-merge
    color: cyan
    description: Clones each pair of samples shares, then each exact set of samples
  - name: Overlap table
    icon: mdi:table
    color: gray
    description: Shared clone counts for every pair of samples
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      Clones come from the [enchantr](https://github.com/immcantation/enchantr) repertoire
      report and are defined within one subject, so only samples of the same subject can share
      one. The bars count clones by how many samples hold them, the heatmap counts the clones
      each pair of samples shares, and the UpSet those of each exact set of samples.
    tag: airr-share-intro
    index: share-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: airrflow
    data_collection_tag: clone_sets
    interactive_component_type: RangeSlider
    column_name: n_samples
    column_type: int64
    show_histogram: true
    display:
      icon_name: mdi:set-merge
      custom_color: cyan
    section: Sharing filters
    tag: airr-share-filter-nsamples
    index: share-nsamples-range
    title: Samples per clone
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: card
    workflow_tag: airrflow
    data_collection_tag: clone_sets
    use: enchantr/clone_sets
    aggregation: count
    column_name: clone
    column_type: object
    secondary_layout: composition
    breakdown_col: n_samples
    top_n_count: 5
    display:
      icon_name: mdi:sitemap
      icon_color: cyan
      caption: by the number of samples holding them
    section: Sharing at a glance
    tag: airr-share-card-clones
    index: share-card-clones
    title: Clones
    description: Clones of every subject. The bar splits them by how many samples hold each one.
    layout: {x: 0, y: 0, w: 4, h: 2}
  - component_type: card
    workflow_tag: airrflow
    data_collection_tag: clone_sets
    use: enchantr/clone_sets
    aggregation: sum
    column_name: total_sequences
    column_type: int64
    filter_expr: "col('n_samples') > 1"
    secondary_layout: concentration
    breakdown_col: clone
    top_n_count: 3
    display:
      icon_name: mdi:vector-link
      icon_color: grape
      caption: share the 3 largest shared clones carry
    section: Sharing at a glance
    tag: airr-share-card-shared
    index: share-card-shared
    title: Sequences in shared clones
    description: Sequences of the clones seen in more than one sample, and how much the three largest carry.
    layout: {x: 4, y: 0, w: 4, h: 2}
  - component_type: figure
    workflow_tag: airrflow
    data_collection_tag: clone_sets
    use: enchantr/clone_sets
    visu_type: bar
    mode: code
    code_content: |-
      # Clones by the number of samples they were seen in. The first bar is the
      # private clones, every bar right of it the shared ones; log scale, as the
      # first bar dwarfs the rest. A clone spans samples, so no group split.
      d = df.group_by('n_samples').agg(pl.len().alias('clones')).sort('n_samples').with_columns(pl.col('n_samples').cast(pl.Utf8))
      fig = px.bar(d.to_pandas(), x='n_samples', y='clones', text='clones', log_y=True, labels={'n_samples': 'Samples holding the clone', 'clones': 'Clones'})
      fig.update_traces(textposition='outside', cliponaxis=False)
      fig.update_xaxes(type='category')
      fig.update_layout(margin=dict(t=10))
    section: Clones by sharing
    tag: airr-share-fig-bars
    index: share-by-samples
    title: Clones by samples holding them
    description: The first bar is the private clones; log scale.
    layout: {x: 0, y: 0, w: 8, h: 4, fit: auto}
  - component_type: advanced_viz
    workflow_tag: airrflow
    data_collection_tag: clonal_overlap
    use: enchantr/overlap_heatmap
    config:
      row_annotation_cols: [subject_id]
      cluster_rows: true
      cluster_cols: true
      cluster_method: average
      normalize: none
      colorscale: Blues
    section: Pairs and sets
    tag: airr-share-overlap
    index: share-overlap
    title: Shared clones per sample pair
    description: The diagonal is zeroed so the colour scale spans the real sharing.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: airrflow
    data_collection_tag: clone_sets
    use: enchantr/shared_clones_upset
    config:
      sort_by: cardinality
      sort_order: descending
      min_size: 5
      color_intersections_by: degree
      show_set_sizes: true
      show_values: false
      default_annotation_cols: [total_sequences]
    section: Pairs and sets
    tag: airr-share-upset
    index: share-upset
    title: Clone set intersections
    description: Each bar is a set of samples and the clones seen in exactly those.
    layout: {x: 0, y: 5, w: 8, h: 5}
  - component_type: table
    workflow_tag: airrflow
    data_collection_tag: clonal_overlap
    use: enchantr/clonal_overlap
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Overlap table
    tag: airr-share-table-overlap
    index: share-table-overlap
    title: Clonal overlap matrix
    layout: {x: 0, y: 0, w: 8, h: 6}
