    title_size: h3
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 6}

  - component_type: interactive
    tag: airr-rep-filter-clones
    index: airr-rep-clone-range
    section: Repertoire scope
    group: Repertoire size
    workflow_tag: airrflow
    data_collection_tag: repertoire_summary
