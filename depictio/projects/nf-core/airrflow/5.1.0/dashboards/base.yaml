    data_collection_tag: v_gene_usage
    title: Which V genes were used
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The composition bars switch between V family and V gene resolution; the
      heatmap clusters samples on their gene fractions, so repertoires drawn from
      the same subject should land next to each other.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: airr-rep-v-composition
