# nf-core/airrflow 5.1.0, following depictio/projects/nf-core/RULES.md (the
# ampliseq 2.18.0 template is the reference).
#
# Routes: template.yaml prunes data collections per run. --mode assembled drops
# the pRESTO logs (sequence_counts, sequence_fates) and with them the Sequence
# Processing tab; --skip_report drops the V gene tables and the pRESTO logs
# (the log parser runs inside the report); --skip_clonal_analysis drops every
# clonal table, and the clonal tabs go with them. No collection other than the
# sample sheet survives every route, so each Key figure a route loses has an
# alternate on the same grid slot, bound to a `_<route>` collection that exists
# on that route only: the import draws whichever card of a slot survives.
main_dashboard:
  title: nf-core/airrflow
  subtitle: Immune receptor repertoires, from reads to the clones that expand and are shared
  project_tag: Airrflow Immune Repertoire Analysis
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family: figures, advanced viz
  # and filter chips all colour a value the same way.
  category_colors:
    '{GROUP_COL}': auto
    subject_id: auto
    # Clonal-homeostasis bins, the vocabulary enchantr/clone_sizes.py writes:
    # blues from rare to medium, then the expanded classes in warm colours.
    size_class:
      Rare (<0.001%): '#a5d8ff'
      Small (0.001-0.01%): '#4dabf7'
      Medium (0.01-0.1%): '#1c7ed6'
      Large (0.1-1%): '#f76707'
      Hyperexpanded (>1%): '#c92a2a'
    # A locus has up to seven V families (more on TRB): the eight largest by
    # sequences take the palette, so the stacked composition and the cards agree.
    v_family:
      '*': 'auto:seq_count'
      Other: '#adb5bd'
    taxon:
      '*': 'auto:seq_count'
      Other: '#adb5bd'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. Bound
  # to the sample sheet, the source of every sample link in template.yaml.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The sample sheet behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Samples, below).
  - component_type: interactive
    workflow_tag: airrflow
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Key figures
    tag: airr-ov-kf-group
    index: ov-kf-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: airrflow
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: airr-ov-kf-sample
    index: ov-kf-sample
    title: Sample ID
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: text
    title: nf-core/airrflow
    logo: https://raw.githubusercontent.com/nf-core/airrflow/master/docs/images/nf-core-airrflow_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/airrflow/master/docs/images/nf-core-airrflow_logo_dark.png
    order: 1
    body: >
      B and T cell receptor reads turned into repertoires: the V genes each sample uses, the
      clones its sequences form, and how those clones expand and are shared. [Run parameters](params:)
    tag: airr-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/airrflow builds adaptive immune receptor repertoires from B or T cell receptor sequencing: it assembles and annotates the reads, groups the sequences into clones and compares the repertoires. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The sample filters in the left panel apply to every tab: narrow the samples once and the whole dashboard follows. A bar above a section narrows that section only.
    tag: airr-ov-about
    index: ov-about
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash.
  - component_type: text
    surface: card
    values:
      samples: {dc: samplesheet, column: sample_id, aggregation: nunique, format: integer}
      subjects: {dc: samplesheet, column: subject_id, aggregation: nunique, format: integer}
    body: |
      ### The run
      - ![](icon:mdi:flask-outline) **Samples** {{samples}} from {{subjects}} subjects
      - ![](icon:mdi:barcode) **Library** {{param:library_generation_method}}
      - ![](icon:mdi:sitemap) **Clone threshold** {{param:clonal_threshold}}
      - ![](icon:mdi:import) **Input** {{param:mode}}
    tag: airr-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  # The marks take the family's colour (the header's), not the theme's blue.
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Six steps from reads to clones
      Each step names its settings and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:content-cut) **Trim** fastp and FastQC on the reads · [Settings](params:trim) · [MultiQC](tab:MultiQC)
      2. ![](icon:mdi:layers-outline) **Assemble** pRESTO pairs mates into UMI consensus · [Settings](params:umi) · [Processing](tab:Sequence Processing)
      3. ![](icon:mdi:dna) **Annotate** IgBLAST assigns the V, D and J genes · [Settings](params:reference) · [V genes](tab:V Gene Usage)
      4. ![](icon:mdi:ruler) **Translate** CDR3 lengths and V-J pairs · [Settings](params:productive) · [CDR3](tab:CDR3 & Pairing)
      5. ![](icon:mdi:sitemap) **Clone** Sequences grouped into clones · [Settings](params:clonal) · [Diversity](tab:Clonal Diversity)
      6. ![](icon:mdi:set-merge) **Compare** Expansion and sharing · [Settings](params:crossby) · [Expansion](tab:Clonal Expansion) · [Sharing](tab:Clone Sharing)
      :::
    tag: airr-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. The icon colour is that tab's colour; a route alternate keeps
  # the colour of the slot it fills, so no route repeats one.
  #   slot x2: Input reads | Input sequences (--mode assembled)
  #            | Sequences (--skip_report)
  #   slot x4: Clones | Unique sequences (--skip_clonal_analysis)
  #   slot x6: Sequences per clone | V genes (--skip_clonal_analysis)
  - component_type: card
    workflow_tag: airrflow
    data_collection_tag: samplesheet
    aggregation: nunique
    column_name: sample_id
    column_type: object
    secondary_layout: composition
    breakdown_col: '{GROUP_COL}'
    display:
      icon_name: mdi:flask-outline
      icon_color: orange
      caption: in the sample sheet, by {GROUP_COL_DISPLAY}
      link: tab:MultiQC
    section: Key figures
    tag: airr-ov-kf-samples
    index: ov-kf-samples
    title: Samples
    description: Samples in the sample sheet. The bar splits them by {GROUP_COL_DISPLAY}.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: airrflow
    data_collection_tag: sequence_counts
    use: enchantr/sequence_counts
    aggregation: sum
    column_name: sequences
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:import
      icon_color: indigo
      caption: summed, with the spread per sample
      link: tab:Sequence Processing
      format: si
    section: Key figures
    tag: airr-ov-kf-reads
    index: ov-kf-reads
    title: Input reads
    description: Read pairs that entered pRESTO. The box shows how they spread over the samples.
    layout: {x: 2, y: 0, w: 2, h: 2}
  # --mode assembled: pRESTO never runs, so the slot counts the assembled
  # sequences that entered IgBLAST, from the report's Change-O table.
  - component_type: card
    workflow_tag: airrflow
    data_collection_tag: annotation_counts_assembled
    aggregation: sum
    column_name: input
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:import
      icon_color: indigo
      caption: summed, with the spread per sample
      link: tab:V Gene Usage
      format: si
    section: Key figures
    tag: airr-ov-kf-input-assembled
    index: ov-kf-input-assembled
    title: Input sequences
    description: Assembled sequences that entered IgBLAST annotation. The box shows how they spread over the samples.
    layout: {x: 2, y: 0, w: 2, h: 2}
  # --skip_report: the pRESTO log parser runs inside the report, so the slot
  # counts the sequences that entered clonal assignment instead.
  - component_type: card
    workflow_tag: airrflow
    data_collection_tag: repertoire_summary_noreport
    use: enchantr/repertoire_summary
    aggregation: sum
    column_name: sequences
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:layers-outline
      icon_color: indigo
      caption: summed, with the spread per sample
      link: tab:Clonal Diversity
      format: si
    section: Key figures
    tag: airr-ov-kf-sequences-noreport
    index: ov-kf-sequences-noreport
    title: Sequences
    description: Unique annotated sequences that entered clonal assignment. The box shows how they spread over the samples.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: airrflow
    data_collection_tag: repertoire_summary
    use: enchantr/repertoire_summary
    aggregation: sum
    column_name: number_of_clones
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:sitemap
      icon_color: teal
      caption: summed, with the spread per sample
      link: tab:Clonal Diversity
      format: si
    section: Key figures
    tag: airr-ov-kf-clones
    index: ov-kf-clones
    title: Clones
    description: Clones over the samples in view. The box shows how many each sample holds.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # --skip_clonal_analysis: no clones, so the slot counts the unique annotated
  # sequences the clones would have been built from, the repertoire the V Gene
  # Usage tab reads.
  - component_type: card
    workflow_tag: airrflow
    data_collection_tag: annotation_counts_noclonal
    aggregation: sum
    column_name: collapsed
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:layers-outline
      icon_color: teal
      caption: summed, with the spread per sample
      link: tab:V Gene Usage
      format: si
    section: Key figures
    tag: airr-ov-kf-unique-noclonal
    index: ov-kf-unique-noclonal
    title: Unique sequences
    description: Annotated sequences left after duplicate collapse, the repertoire the V gene tables count. The box shows how they spread over the samples.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # sequences_per_clone is each sample's mean clone size, so the median is of
  # samples. The pRESTO retention ratio is not a Key figure: consensus and
  # collapsing merge reads, so it is no share of reads kept.
  - component_type: card
    workflow_tag: airrflow
    data_collection_tag: repertoire_summary
    use: enchantr/repertoire_summary
    aggregation: median
    column_name: sequences_per_clone
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:trending-up
      icon_color: blue
      caption: mean clone size, the median sample
      link: tab:Clonal Expansion
      decimals: 1
    section: Key figures
    tag: airr-ov-kf-clone-size
    index: ov-kf-clone-size
    title: Sequences per clone
    description: Each sample's sequences over its clones, the median over samples. Near 1, most clones hold one sequence.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # --skip_clonal_analysis: the report still counts V genes, so the slot shows
  # how many the repertoires use, ranked by family as in the ampliseq Phyla card.
  - component_type: card
    workflow_tag: airrflow
    data_collection_tag: v_gene_usage_noclonal
    use: enchantr/v_gene_usage
    aggregation: nunique
    column_name: taxon
    column_type: object
    filter_expr: "col('rank') == 'V gene'"
    secondary_layout: composition
    breakdown_col: v_family
    top_n_count: 5
    display:
      icon_name: mdi:dna
      icon_color: blue
      caption: distinct V genes, the richest families
      link: tab:V Gene Usage
    section: Key figures
    tag: airr-ov-kf-vgenes-noclonal
    index: ov-kf-vgenes-noclonal
    title: V genes
    description: Distinct V genes over the samples in view. The bars rank the V families by the genes they hold.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the group, then the subject the clones are defined in.
  - component_type: interactive
    workflow_tag: airrflow
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Findings
    tag: airr-ov-findings-group
    index: ov-findings-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: airrflow
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: subject_id
    column_type: object
    display:
      icon_name: mdi:account-group-outline
      custom_color: indigo
      strip_label: Subject
    section: Findings
    tag: airr-ov-findings-subject
    index: ov-findings-subject
    title: Subject
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data. clone_sets is narrowed by column, not by row,
  # so the sharing row counts every sample and says so.
  - component_type: text
    surface: card
    values:
      vf_top: {dc: v_gene_usage, column: taxon, aggregation: top, weight: seq_count, filter_expr: "col('rank') == 'V family'"}
      vf_share: {dc: v_gene_usage, column: taxon, aggregation: top_share, weight: seq_count, filter_expr: "col('rank') == 'V family'",
        format: percent}
      shannon: {dc: repertoire_summary, column: shannon, aggregation: median, format: 'decimals:0'}
      n_shared: {dc: clone_sets, column: clone, aggregation: count, filter_expr: "col('n_samples') > 1", format: integer}
      n_clones: {dc: clone_sets, column: clone, aggregation: count, format: integer}
      sc_top: {dc: clone_sizes, column: size_class, aggregation: top, weight: seq_count}
      sc_share: {dc: clone_sizes, column: size_class, aggregation: top_share, weight: seq_count, format: percent}
    body: |
      - **{{vf_share}}** of the sequences use {{vf_top}} – the most used V family [V Gene Usage](tab:V Gene Usage)
      - **{{shannon}}** effective clones in the median sample, Hill diversity at q = 1 – after rarefying to a common depth [Clonal Diversity](tab:Clonal Diversity)
      - **{{n_shared}}** of {{n_clones}} clones appear in more than one sample – all samples [Clone Sharing](tab:Clone Sharing)
      - **{{sc_share}}** of the sequences sit in {{sc_top}} clones – the largest size class [Clonal Expansion](tab:Clonal Expansion)
    section: Findings
    tag: airr-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per analysis tab, in the order of the rows above. CDR3 &
  # Pairing has none: its spectratype repeats per sample and its pairing grid is
  # too dense for a third of the row.
  - component_type: highlight
    section: Findings
    source_tab: V Gene Usage
    source_component: vgene-composition
    caption: Each sample's sequences by V family, the eight largest coloured; the strip below names the subject.
    tag: airr-ov-hl-vgene
    index: ov-hl-vgene
    layout: {x: 0, y: 2, w: 5, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Clonal Diversity
    source_component: div-profile
    hide_legend: true
    caption: One curve per sample; diversity falls as the order q weighs the largest clones more.
    tag: airr-ov-hl-profile
    index: ov-hl-profile
    layout: {x: 5, y: 2, w: 3, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Clone Sharing
    source_component: share-by-samples
    caption: Clones by how many samples hold them; the first bar is the private clones. Log scale.
    tag: airr-ov-hl-sharing
    index: ov-hl-sharing
    layout: {x: 0, y: 7, w: 3, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Clonal Expansion
    source_component: exp-homeostasis
    caption: Sequences by subject, sample and clone size class, from rare to hyperexpanded clones.
    tag: airr-ov-hl-homeostasis
    index: ov-hl-homeostasis
    layout: {x: 3, y: 7, w: 5, h: 5}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers. A tab the run does not have is left out, and a heading whose
  # tabs are all missing is hidden.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Sequence Processing](tab:Sequence Processing)

      ### Repertoire
      - [V Gene Usage](tab:V Gene Usage)
      - [CDR3 & Pairing](tab:CDR3 & Pairing)

      ### Clonality
      - [Clonal Diversity](tab:Clonal Diversity)
      - [Clonal Expansion](tab:Clonal Expansion)
      - [Clone Sharing](tab:Clone Sharing)
    section: How to read this dashboard
    tag: airr-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the group first.
  - component_type: interactive
    workflow_tag: airrflow
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: airr-filter-group
    index: sample-filters-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: airrflow
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: airr-filter-sample
    index: sample-filters-sample
    title: Sample ID
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: airrflow
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: subject_id
    column_type: object
    display:
      icon_name: mdi:account-group-outline
      custom_color: indigo
    section: Sample filters
    group: Sample scope
    tag: airr-filter-subject
    index: sample-filters-subject
    title: Subject
    layout: {x: 0, y: 5, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: airrflow
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: sex
    column_type: object
    display:
      icon_name: mdi:account-multiple-outline
      custom_color: pink
    section: Sample filters
    group: Sample scope
    tag: airr-filter-sex
    index: sample-filters-sex
    title: Sex
    layout: {x: 0, y: 8, w: 1, h: 3}
  # Row selection feeds the Analysis panel: the one component of the family
  # that is both persistent and row-addressable.
  - component_type: table
    workflow_tag: airrflow
    data_collection_tag: samplesheet
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Sample sheet
    tag: airr-sample-sheet
    index: sample-sheet
    title: Sample sheet
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
- title: MultiQC
  subtitle: Did trimming and read quality hold for every sample?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # Bound to multiqc_data, so the tab keeps a sample filter of its own whatever
  # the sample sheet holds.
  filter_sections:
  - name: MultiQC report
    icon: mdi:file-document-outline
    color: orange
    description: Samples as the MultiQC report names them
  grid_sections:
  - name: QC overview
    icon: mdi:chart-box-outline
    color: orange
    description: Reads kept through trimming, and how many reached assembly
  - name: Base quality
    icon: mdi:chart-bell-curve
    color: orange
    description: Base quality along the read, before and after trimming
  - name: QC details
    icon: mdi:file-document-outline
    color: gray
    description: The remaining FastQC panels on the assembled reads
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [MultiQC](https://multiqc.info) gathers the [fastp](https://github.com/OpenGene/fastp)
      trimming report and two [FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/)
      runs, one on the raw reads and one after the mates are assembled. Read how many reads
      survived trimming and whether base quality holds along the read. Amplicons of one
      receptor locus show high duplication and a narrow GC band by design.
    tag: airr-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: airrflow
    data_collection_tag: multiqc_data
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: MultiQC report
    tag: airr-mqc-filter-sample
    index: mqc-sample-filter
    title: Sample ID
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: multiqc
    workflow_tag: airrflow
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: QC overview
    tag: airr-mqc-general-stats
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: airrflow
    data_collection_tag: multiqc_data
    use: multiqc/fastp
    selected_module: fastp
    selected_plot: Filtered Reads
    section: QC overview
    tag: airr-mqc-fastp-filtered
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: airrflow
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
