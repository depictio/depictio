    data_collection_tag: repertoire_summary
    title: The shape of each repertoire
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Clone counts scale with how deeply a sample was sequenced, so the Hill
      numbers behind the evenness card are rarefied to a common depth. Evenness
      near one means no clone dominates.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: airr-rep-card-clones
