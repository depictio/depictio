- title: Sequence Processing
  subtitle: How many reads survive each pRESTO and Change-O step?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:chart-sankey
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Processing filters
    icon: mdi:filter-variant
    color: indigo
    description: Keeps the samples inside a depth or retention band
  grid_sections:
  - name: Processing at a glance
    icon: mdi:counter
    color: indigo
    description: Input reads, what each step keeps, and how deep each sample was sequenced
  - name: Where the reads go
    icon: mdi:chart-timeline-variant
    color: indigo
    description: Every read's path through the steps, losses peeling off into the Lost lane
  - name: Per sample
    icon: mdi:chart-line
    color: indigo
    description: Sequences left at each step, and the sequences each sample keeps per 1,000 reads
  - name: Counts table
    icon: mdi:table
    color: gray
    description: Sequences left after every pRESTO and Change-O step, per sample
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [pRESTO](https://presto.readthedocs.io) filters, pairs and assembles the reads into UMI
      consensus sequences, and [Change-O](https://changeo.readthedocs.io) annotates them with
      [IgBLAST](https://ncbi.github.io/igblast/). The Sankey follows the reads step by step,
      losses peeling off into the Lost lane. Consensus and collapsing merge reads, so counts
      fall steeply there by design.
    tag: airr-seq-intro
    index: seq-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: airrflow
    data_collection_tag: sequence_counts
    interactive_component_type: RangeSlider
    column_name: sequences
    column_type: int64
    show_histogram: true
    display:
      icon_name: mdi:import
      custom_color: indigo
    section: Processing filters
    tag: airr-seq-filter-depth
    index: seq-depth-range
    title: Input reads
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: airrflow
    data_collection_tag: sequence_counts
    interactive_component_type: RangeSlider
    column_name: retention
    column_type: float64
    display:
      icon_name: mdi:filter-outline
      custom_color: orange
    section: Processing filters
    tag: airr-seq-filter-retention
    index: seq-retention-range
    title: Sequences per input read
    layout: {x: 0, y: 3, w: 1, h: 3}
  # The pRESTO steps only: the Change-O ones are missing on a --skip_report run.
  - component_type: card
    workflow_tag: airrflow
    data_collection_tag: sequence_counts
    use: enchantr/sequence_counts
    aggregation: sum
    column_name: sequences
    column_type: int64
    secondary_layout: attrition
    attrition_cols: [quality_filtered, paired, consensus, assembled, representative]
    display:
      icon_name: mdi:import
      icon_color: indigo
      caption: kept through each pRESTO step
    section: Processing at a glance
    tag: airr-seq-card-input
    index: seq-card-input
    title: Input reads
    description: Read pairs entering pRESTO, then what is left after quality, pairing, consensus, assembly and duplicates.
    layout: {x: 0, y: 0, w: 4, h: 2}
  # Depth per sample, not the retention ratio: retention is sequences over reads
  # after consensus and collapsing, no share of reads kept, and a card prints it
  # as a bare fraction. The bars below show it per 1,000 reads.
  - component_type: card
    workflow_tag: airrflow
    data_collection_tag: sequence_counts
    use: enchantr/sequence_counts
    aggregation: median
    column_name: sequences
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: orange
      caption: median per sample, with its spread
    section: Processing at a glance
    tag: airr-seq-card-depth
    index: seq-card-depth
    title: Reads per sample
    description: Read pairs entering pRESTO in each sample. A sample far below the box had too little depth.
    layout: {x: 4, y: 0, w: 4, h: 2}
  - component_type: advanced_viz
    workflow_tag: airrflow
    data_collection_tag: sequence_fates
    use: enchantr/attrition_sankey
    config:
      value_col: reads
      value_label: reads
      value_format: count
      available_step_cols: [input, quality, paired, consensus, assembled, representative, productive, collapsed]
      depth: 6
      sort_mode: total_flow
      color_mode: target
      link_opacity: 0.45
    section: Where the reads go
    tag: airr-seq-sankey
    index: seq-sankey
    title: Read fates through the pipeline
    description: Weighted by reads. The depth control adds the Change-O steps after annotation.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: airrflow
    data_collection_tag: sequence_counts
    use: enchantr/sequence_counts
    visu_type: line
    mode: code
    code_content: |-
      # One line per sample through the pRESTO and Change-O steps, log scale:
      # a sample whose line drops away at one step is the one to look at.
      # Coloured by subject, or by Analysis mode's groups when it has some.
      names = {'sequences': 'Input', 'quality_filtered': 'Quality', 'primers_masked': 'Primers', 'paired': 'Paired', 'consensus': 'Consensus', 'assembled': 'Assembled', 'unique': 'Unique', 'representative': 'Representative', 'igblast_assigned': 'IgBLAST', 'annotated': 'Annotated', 'quality_pass': 'Quality pass', 'productive': 'Productive', 'junction_mod3': 'In frame', 'collapsed': 'Collapsed'}
      stages = [c for c in names if c in df.columns]
      keep = ['sample_id', 'subject_id', *[g for g in depictio_group_by if g in df.columns and g not in ('sample_id', 'subject_id')]]
      d = df.select([*keep, *stages]).unpivot(index=keep, on=stages, variable_name='stage', value_name='left')
      d = d.with_columns(pl.col('stage').replace(names))
      base = depictio_group_kwargs or {'color': 'subject_id', 'color_discrete_map': depictio_category_colors.get('subject_id') or {}}
      orders = dict(base.get('category_orders') or {}, stage=[names[c] for c in stages])
      kw = dict(base, category_orders=orders)
      fig = px.line(d.to_pandas(), x='stage', y='left', line_group='sample_id', hover_name='sample_id', markers=True, log_y=True, labels={'stage': '', 'left': 'Sequences left', 'subject_id': 'Subject'}, **kw)
      fig.update_xaxes(tickangle=-40)
      fig.update_layout(margin=dict(t=10))
    section: Per sample
    tag: airr-seq-fig-stages
    index: seq-stage-lines
    title: Sequences left at each step
    description: Log scale, so a constant fold loss reads as a straight segment.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: airrflow
    data_collection_tag: sequence_counts
    use: enchantr/sequence_counts
    visu_type: bar
    mode: code
    code_content: |-
      # Each sample's retention, highest first, as sequences at the last step per
      # 1,000 input reads: consensus and collapsing merge reads, so this is a
      # ratio, not a share of reads kept. Coloured by subject, or by Analysis
      # mode's groups when it has some.
      kw = depictio_group_kwargs or {'color': 'subject_id', 'color_discrete_map': depictio_category_colors.get('subject_id') or {}}
      d = df.with_columns((pl.col('retention') * 1000).alias('per_1000')).sort('per_1000', descending=True)
      fig = px.bar(d.to_pandas(), x='sample_id', y='per_1000', hover_name='sample_id', labels={'sample_id': '', 'per_1000': 'Sequences per 1,000 reads', 'subject_id': 'Subject'}, **kw)
      fig.update_yaxes(tickformat='.1f')
      fig.update_layout(margin=dict(t=10))
    section: Per sample
    tag: airr-seq-fig-retention
    index: seq-retention-bars
    title: Sequences kept per 1,000 reads
    description: Sequences at the last step for every 1,000 input reads. Many reads merge into one sequence, so this sits far below the reads that pass.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: table
    workflow_tag: airrflow
    data_collection_tag: sequence_counts
    use: enchantr/sequence_counts
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Counts table
    tag: airr-seq-table-counts
    index: seq-table-counts
    title: Sequence processing counts
    layout: {x: 0, y: 0, w: 8, h: 6}
