  - component_type: advanced_viz
    workflow_tag: crisprseq
    data_collection_tag: guide_substitutions
    viz_kind: complex_heatmap
    config:
      viz_kind: complex_heatmap
      index_column: guide
      value_columns_pattern: "^[-+]?[0-9]+$"
      cluster_rows: true
      cluster_cols: false
      cluster_method: ward
      cluster_metric: euclidean
      normalize: log1p
      colorscale: Blues
    section: Substitutions per guide
    tag: cs-sub-av-heatmap
    index: cs-sub-av-heatmap
    title: Substitution rate per guide and offset
    description: >-
      Which offsets carry substitutions, guide by guide? Each row is one guide, each column an offset from the cut site, and each cell the mean share of reads with a base other than the dominant one over the guide's libraries.

      How to read: a base editor leaves a hot band a few bases upstream of the cut in the guides it was used with, while a nuclease leaves the matrix flat. Rows are clustered by profile, so guides with the same band sit together; pick a hot row in the Guide picker and read its curve in the profile below.

      Note: cells use a log(1 + rate) colour scale, so a few hot cells do not wash out the rest; read relative differences and not the colour as a linear rate. The dominant base stands in for the reference, which the table does not name, so a position edited in most reads reads the edit as the reference. Only offsets every library of a guide reaches are drawn.
    layout: {x: 0, y: 0, w: 8, h: 10}
  - component_type: advanced_viz
    workflow_tag: crisprseq
    data_collection_tag: guide_substitution_profile
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: profile_guide
      x_col: offset
      y_col: mean_substitution_pct
      lower_col: q1_substitution_pct
      upper_col: q3_substitution_pct
      reference_x: 0
      reference_label: Cut site
      x_title: Offset from the cut site (bp)
      y_title: Reads with a substituted base (%)
      legend_pos: none
    section: Guide profile
    tag: cs-sub-av-guide-subs
    index: cs-sub-av-guide-subs
    title: Substitution rate around the cut site
    description: >-
      Where do bases change around the cut? The curve is the mean share of reads carrying a base other than the dominant one at each offset from the cut site, over the guide's libraries, with a band from the first to the third quartile of the libraries.

      How to read: a flat curve at the background is no substitution signal, and a hump a few bases upstream of the cut is where a base editor works. A curve above its band means a minority of libraries carries the substitution.

      Lines and annotations: the vertical marker at offset 0, labelled Cut site, is the cut site the pipeline reports for each amplicon (the cut_site column of the indel table and the _cutSite.json file). For some guides that convention may be shifted, which moves the curve by a constant and keeps its shape. It is a landmark, not a cut-off.

      Note: only offsets every library of the guide reaches are drawn, because the amplicon ends are alignment edges where the gap rate climbs without any edit.

      Source: nf-core/crisprseq output documentation, https://nf-co.re/crisprseq/2.3.0/docs/output
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: crisprseq
    data_collection_tag: guide_substitution_profile
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: profile_guide
      x_col: offset
      y_col: mean_gap_pct
      lower_col: q1_gap_pct
      upper_col: q3_gap_pct
      reference_x: 0
      reference_label: Cut site
      x_title: Offset from the cut site (bp)
      y_title: Reads with a gap (%)
      legend_pos: none
    section: Guide profile
    tag: cs-sub-av-guide-gaps
    index: cs-sub-av-guide-gaps
    title: Gap rate around the cut site
    description: >-
      Where do reads lose bases? The curve is the mean share of reads with a gap at each offset from the cut site, over the guide's libraries, with a band from the first to the third quartile of the libraries.

      How to read: a nuclease cut is expected to show as a peak near the cut site, from the deletions it leaves. A peak displaced by a constant points at the cut-site convention below rather than at the biology, and a rise at the window ends is an alignment edge.

      Lines and annotations: the vertical marker at offset 0, labelled Cut site, is the cut site the pipeline reports for each amplicon (the cut_site column of the indel table and the _cutSite.json file). For some guides that convention may be shifted, which moves the curve by a constant and keeps its shape. It is a landmark, not a cut-off.



      Source: nf-core/crisprseq output documentation, https://nf-co.re/crisprseq/2.3.0/docs/output
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: table
    workflow_tag: crisprseq
    data_collection_tag: guide_substitution_profile
    columns: [profile_guide, offset, mean_substitution_pct, median_substitution_pct, q1_substitution_pct, q3_substitution_pct, mean_gap_pct, median_gap_pct, q1_gap_pct, q3_gap_pct, libraries]
    section: Substitution tables
    tag: cs-sub-table
    index: cs-sub-table
    title: Substitution and gap rate per offset
    description: >-
      What are the numbers behind the profile? Mean, median and quartiles of the substitution and gap rates at every offset of the picked guide's window.

      How to read: sort by the mean substitution rate to find the offsets that carry the most, and compare the mean with the median: a mean far above its median means a minority of libraries carries the rate. Libraries is the number of libraries behind the offset.
    layout: {x: 0, y: 0, w: 8, h: 6}
