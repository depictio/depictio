- title: Sample space
  subtitle: Which libraries repair alike, judged by their outcome mix?
  tab_group: Editing
  tab_order: 4
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: pink
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Composition scope
    icon: mdi:tune
    color: pink
    description: Outcome classes kept in the bars; shares are renormalised over them
  - name: Space scope
    icon: mdi:chart-scatter-plot
    color: pink
    description: Keep libraries by the quartile of their guide; the bars are unchanged
  grid_sections:
  - name: Libraries at a glance
    icon: mdi:counter
    color: pink
    description: Libraries placed, variance on the first component and two outcome shares
  - name: Sample space
    icon: mdi:chart-scatter-plot
    color: pink
    description: Libraries on the first components of their seven outcome shares
  - name: Outcome composition
    icon: mdi:chart-bar
    color: pink
    description: Share of every library's classified reads per outcome class
  - name: Library rows
    icon: mdi:table
    color: gray
    description: Each library's coordinates, guide and outcome shares
    collapsed: true
  components:
  - component_type: interactive
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_outcomes
    interactive_component_type: MultiSelect
    column_name: outcome
    column_type: object
    display:
      icon_name: mdi:chart-donut
      custom_color: orange
    placement: left
    section: Composition scope
    group: Composition
    tag: cs-sp-filter-outcome
    index: cs-sp-outcome-filter
    title: Outcome class
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: crisprseq
    data_collection_tag: library_outcome_space
    interactive_component_type: MultiSelect
    column_name: edit_quartile
    column_type: object
    display:
      icon_name: mdi:target
      custom_color: indigo
    placement: left
    section: Space scope
    group: Space
    tag: cs-sp-filter-quartile
    index: cs-sp-quartile-filter
    title: Guide editing quartile
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: crisprseq
    data_collection_tag: library_outcome_space
    interactive_component_type: TextInput
    column_name: guide
    column_type: object
    placeholder: 'e.g. ^CCA or GG$'
    display:
      icon_name: mdi:magnify
      custom_color: violet
    placement: left
    section: Space scope
    group: Space
    tag: cs-sp-filter-sequence
    index: cs-sp-sequence-filter
    title: Guide sequence
    layout: {x: 0, y: 3, w: 1, h: 2}
  - component_type: text
    order: 1
    body: >
      Each library is placed by the share of its classified reads in the seven outcome classes, so
      libraries that repair alike sit together. Read the first component against the variance
      cards, and lasso a cluster to narrow the other tiles. Points are coloured by the edit class
      with the most reads in the library; switch to the quartile of the guide in Colour by.
    tag: cs-sp-intro
    index: cs-sp-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: library_outcome_space
    aggregation: count
    column_name: sample
    column_type: object
    secondary_layout: donut
    breakdown_col: edit_quartile
    display:
      icon_name: mdi:flask-outline
      icon_color: pink.4
      caption: libraries, by the editing quartile of their guide
    section: Libraries at a glance
    tag: cs-sp-card-libraries
    index: cs-sp-card-libraries
    title: Libraries placed
    description: Libraries that classified reads, one point each on the plane. The ring splits them by the quartile of their guide among the guides of this run.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: library_outcome_space
    aggregation: median
    column_name: explained_pc1_pct
    column_type: float64
    filter_expr: col('classified_reads') > 0
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: pink.6
      caption: of the variance on the first component
      decimals: 1
    section: Libraries at a glance
    tag: cs-sp-card-pc1
    index: cs-sp-card-pc1
    title: Variance on PC1 (%)
    description: Share of the variance of the seven outcome shares carried by the first principal component, computed over all the libraries of the run.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: library_outcome_space
    aggregation: median
    column_name: wt_pct
    column_type: float64
    filter_expr: col('classified_reads') > 0
    secondary_layout: histogram
    display:
      icon_name: mdi:dna
      icon_color: pink.8
      caption: libraries, by wild-type share
      decimals: 1
    section: Libraries at a glance
    tag: cs-sp-card-wt
    index: cs-sp-card-wt
    title: Wild-type reads (%)
    description: Median share of a library's classified reads that stay wild type, over the libraries in view. The histogram shows whether the libraries form groups.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: library_outcome_space
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: del_frameshift_pct
    column_type: float64
    filter_expr: col('classified_reads') > 0
    display:
      icon_name: mdi:content-cut
      icon_color: pink.9
      caption: median per library, with its spread
      decimals: 1
    section: Libraries at a glance
    tag: cs-sp-card-delfs
    index: cs-sp-card-delfs
    title: Frameshift deletions (%)
    description: Median share of a library's classified reads that carry a frameshift deletion, over the libraries in view.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: crisprseq
    data_collection_tag: library_outcome_space
    viz_kind: embedding
    config:
      viz_kind: embedding
      sample_id_col: sample
      dim_1_col: dim_1
      dim_2_col: dim_2
      dim_3_col: dim_3
      color_col: dominant_outcome
      default_color_by: dominant_outcome
      axis_prefix: PC
      show_centroids: false
      hover_cols: [guide, edit_quartile, classified_reads, edited_pct]
      legend_pos: right
      selection_enabled: true
      selection_column: sample
    section: Sample space
    tag: cs-sp-av-pca
    index: cs-sp-av-pca
    title: Libraries by outcome mix
    description: >-
      Which libraries repair alike? Each point is one library, placed on the leading principal components of its seven outcome shares (wild type, template-based, deletion-insertion, and the in-frame and frameshift insertions and deletions), each standardised, and coloured by the edit class that holds most of its edited reads (wild type when it has no edit read).

      How to read: libraries close together have a similar outcome mix, and a colour region is a repair signature shared by many libraries. The first component is oriented so that editing grows to the right, and the variance cards above say how much of the spread the plane shows. A lone point is a library with an unusual mix; lasso it or a cluster to narrow the other tiles, and open the library in [Edit outcomes](tab:Edit outcomes).

      Annotations: the colours are the outcome classes of the CIGAR parser, the same as in Edit outcomes; Colour by switches to the quartile of the library's guide, a rank among the guides of this run and not a threshold from a tool or a paper. No group centroid or cut-off is drawn.

      Note: libraries that classified no reads are not placed, and a class absent from every library, such as template-based reads without a donor, does not enter the reduction.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_outcomes
    viz_kind: stacked_bar
    config:
      viz_kind: stacked_bar
      sample_id_col: sample
      taxon_col: outcome
      rank_col: level
      abundance_col: pct
      top_n: 7
      sort_by: abundance
      normalise_to_one: true
      sample_sort: first_taxon
      hidden_controls: [rank, top_n]
      x_title: Library
      value_title: Share of the classified reads
      legend_pos: bottom
    section: Outcome composition
    tag: cs-sp-av-composition
    index: cs-sp-av-composition
    title: Outcome mix per library
    description: >-
      What does each library's repair look like? Each bar is one library and each segment an outcome class, as a share of the library's classified reads.

      How to read: libraries are ordered by their largest class, wild type first, so the libraries on the left edit least and the bars grow more edited towards the right. Compare the segment widths of neighbouring bars to see whether the edits are mostly deletions or insertions and in or out of frame. Switch to counts or sort by another class from the controls.

      Note: with thousands of libraries the bars are very thin and their names are hidden, so hover a bar for its library. The outcome filter on the left renormalises the bars over the classes kept.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: crisprseq
    data_collection_tag: library_outcome_space
    columns: [sample, guide, edit_quartile, classified_reads, edited_pct, wt_pct, del_frameshift_pct, dim_1, dim_2]
    row_selection_enabled: true
    row_selection_column: sample
    section: Library rows
    tag: cs-sp-table
    index: cs-sp-table
    title: Library coordinates and outcome shares
    description: >-
      Where does each library sit? One row per library with its guide, the quartile of its guide, its classified reads, a few outcome shares and its coordinates on the first two components.

      How to read: sort by a coordinate to find the libraries at the edge of the plane, and tick rows to narrow the other tiles to them. The quartile is a rank among the guides of this run, not a threshold.
    layout: {x: 0, y: 0, w: 8, h: 6}

