version: 1
# nf-core/crisprseq 2.3.0 (targeted analysis), on the family rules of
# depictio/projects/nf-core/RULES.md (ampliseq/2.18.0 is the reference
# implementation).
#
# Two units carry every tile: the library (one amplicon sequencing library, the
# `sample` of the samplesheet) and the guide (its protospacer, upper-cased in
# `guide`). Funnel: whether each library had the reads and the alignment to
# support a call, and whether the libraries of a guide agree (Data & QC) -> how
# much each library and each guide edits, where the libraries sit by their
# outcomes, and how the edits shift the reading frame (Editing) -> the repair
# signature of one guide, as indel sizes, positions and substitutions around the
# cut site (Repair signature). The pipeline writes no MultiQC report, so the
# family has no MultiQC tab, and the run has no assembly, so no Locus tab.
#
# The samplesheet hub (`samples`) carries the persistent sample filters; its
# links reach the per-library collections by `sample` and the per-guide ones by
# `guide`. Profiles along the amplicon are drawn per guide, as the mean library
# with the band from the first to the third quartile of the guide's libraries,
# because one curve per library does not read at thousands of libraries.
#
# Colours: a run has far more guides than the palette has colours, so a
# guide-level chart colours by `edit_quartile` (four values, a rank among the
# guides of the run, never a threshold) and the group column keeps its automatic
# colours for the filter chips only.
#
# Guide pickers: the Indel spectrum tab picks a guide on the samplesheet, which
# narrows every collection of the tab through the links. The Substitutions tab
# picks it on `profile_guide`, a column only the per-guide profile carries, so the
# pick narrows the profile and its cards and leaves the guide-by-offset heatmap
# whole. Both are plain single-value selects: with no pick the tiles draw every
# guide in scope.
#
# Routes: a run with --skip_clonality prunes the clonality collection, and with
# it the Clonality section of the Edit outcomes tab, its filters and tables, and
# the Classify step of the Overview.
main_dashboard:
  title: nf-core/crisprseq
  subtitle: Targeted gene editing, from amplicon reads to the repair each guide leaves
  project_tag: crisprseq Gene Editing
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family: figures, advanced viz
  # and filter chips all colour a value the same way.
  category_colors:
    '{GROUP_COL}': auto
    # The outcome classes of the CIGAR parser, wherever a column names one.
    outcome:
      Wild type: '#868e96'
      Template-based: '#0ca678'
      Deletion-insertion: '#ae3ec9'
      Insertion, in-frame: '#74c0fc'
      Insertion, frameshift: '#1c7ed6'
      Deletion, in-frame: '#ffc078'
      Deletion, frameshift: '#f76707'
    # The rank of a guide by its median edited share among the guides of the run
    # (quartiles, four steps of the viridis ramp: ordered, and still four distinct
    # colours on thousands of points; no class is good or bad). Libraries take
    # their guide's.
    # The edit class with the most reads in a library (Wild type when it has none):
    # the outcome colours, under the column name of the sample space.
    dominant_outcome:
      Wild type: '#868e96'
      Template-based: '#0ca678'
      Deletion-insertion: '#ae3ec9'
      Insertion, in-frame: '#74c0fc'
      Insertion, frameshift: '#1c7ed6'
      Deletion, in-frame: '#ffc078'
      Deletion, frameshift: '#f76707'
    edit_quartile:
      Highest quartile: '#440154'
      Upper-middle quartile: '#31688e'
      Lower-middle quartile: '#35b779'
      Lowest quartile: '#fde725'
      Not ranked: '#adb5bd'
    indel_type:
      Deletion: '#f76707'
      Insertion: '#1c7ed6'
      Deletion-insertion: '#ae3ec9'
    frame:
      In-frame: '#12b886'
      Frameshift: '#e03131'
    peak:
      Main peak: '#7048e8'
      Outside the main peak: '#adb5bd'
    # The clonality classifier's verdicts.
    classification:
      Hom WT: '#868e96'
      Het NHEJ: '#f59f00'
      Hom NHEJ: '#e03131'
      Ambiguous: '#adb5bd'
    clonality:
      Clonal: '#0ca678'
      Polyclonal: '#f76707'
      Low editing activity: '#868e96'
      Ambiguous: '#adb5bd'
      Insufficient data for analysis: '#ced4da'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. All
  # three are bound to the samplesheet, the source of every sample and guide link.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The samplesheet and the per-library summary every tab filters through
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Libraries, below).
  - component_type: interactive
    workflow_tag: crisprseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Key figures
    tag: cs-ov-kf-group
    index: cs-ov-kf-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: crisprseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{METADATA_ID_COL}'
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Library
    section: Key figures
    tag: cs-ov-kf-sample
    index: cs-ov-kf-sample
    title: Library
    layout: {x: 2, y: 0, w: 2, h: 1}
  # The pipeline's wordmark, read from its repository; where it cannot load (no
  # internet), the title is drawn as text.
  - component_type: text
    title: nf-core/crisprseq
    logo: https://raw.githubusercontent.com/nf-core/crisprseq/master/docs/images/nf-core-crisprseq_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/crisprseq/master/docs/images/nf-core-crisprseq_logo_dark.png
    order: 1
    body: >
      Amplicon libraries of edited loci, classified read by read and pooled per guide: how often
      each guide edits, which repair outcomes it leaves and whether the libraries support the
      call. [Run parameters](params:)
    tag: cs-ov-hero
    index: cs-ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  # The study: who was edited and with what, from the samplesheet. Each line cites
  # the hub, so a line goes with its data.
  - component_type: text
    surface: card
    values:
      libs: {dc: samples, column: sample, aggregation: nunique, format: integer}
      guides: {dc: samples, column: guide, aggregation: nunique, format: integer}
      donors: {dc: samples, column: sample, aggregation: count, filter_expr: "col('template_length') > 0", format: integer}
      amp_len: {dc: samples, column: amplicon_length, aggregation: median, format: integer}
    body: |
      ### The study
      - ![](icon:mdi:test-tube) **Libraries** {{libs}}, one amplicon each
      - ![](icon:mdi:dna) **Guides** {{guides}} protospacers across the libraries
      - ![](icon:mdi:content-copy) **Donor templates** {{donors}} libraries with an HDR donor
      - ![](icon:mdi:ruler) **Amplicon** {{amp_len}} bp reference, median
      - ![](icon:mdi:file-table-outline) **Samplesheet** [one row per library](section:Sample sheet), its path in [the run parameters](params:input)
    tag: cs-ov-study
    index: ov-study
    layout: {x: 0, y: 1, w: 5, h: 4}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash.
  - component_type: text
    surface: card
    body: |
      ### The run
      - ![](icon:mdi:source-branch) **Pipeline** nf-core/crisprseq 2.3.0
      - ![](icon:mdi:target) **Analysis** {{param:analysis}}
      - ![](icon:mdi:sort-variant) **Aligner** {{param:aligner}}
      - ![](icon:mdi:link-variant) **UMI clustering** {{param:umi_clustering}}
    tag: cs-ov-run
    index: cs-ov-run
    layout: {x: 5, y: 1, w: 3, h: 4}
  # The marks take the family's colour (the header's), not the theme's blue. A
  # step citing a value goes with its collection when the run skipped the tool.
  - component_type: text
    surface: card
    accent: green
    values:
      n_reads: {dc: crisprseq_edit_summary, column: raw_reads, aggregation: sum, format: si}
      n_edits: {dc: crisprseq_edit_summary, column: edited_reads, aggregation: sum, format: si}
      n_clon: {dc: crisprseq_clonality, column: sample, aggregation: nunique, format: integer}
      n_guides: {dc: guide_summary, column: guide, aggregation: nunique, format: integer}
    body: |
      ### Six steps from reads to repair signature
      Each step names its settings and the tabs that show its result.

      ::: steps
      1. ![](icon:mdi:filter-variant) **Prepare** Merge, quality-filter and cluster {{n_reads}} reads · [Settings](params:umi) · [Read QC](tab:Read QC) · [Replicates & QC](tab:Replicates & QC)
      2. ![](icon:mdi:sort-variant) **Align** Each library to its amplicon with {{param:aligner}} · [Settings](params:aligner) · [Read QC](tab:Read QC)
      3. ![](icon:mdi:content-cut) **Call** CIGAR parser, {{n_edits}} edited reads · [Edit outcomes](tab:Edit outcomes) · [Sample space](tab:Sample space)
      4. ![](icon:mdi:family-tree) **Classify** Clonality of {{n_clon}} libraries · [Settings](params:skip_clonality) · [Edit outcomes](tab:Edit outcomes)
      5. ![](icon:mdi:scale-balance) **Pool** Libraries per guide, {{n_guides}} guides · [Guides](tab:Guides)
      6. ![](icon:mdi:chart-bell-curve) **Profile** Sizes, positions and substitutions · [Indel spectrum](tab:Indel spectrum) · [Substitutions](tab:Substitutions)
      :::
    tag: cs-ov-steps
    index: cs-ov-steps
    layout: {x: 0, y: 5, w: 8, h: 3}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/crisprseq aligns each amplicon library to its reference and classifies every read as wild type or an edit. This page sums up one run; each of the seven tabs behind it answers one question.

      The sample filters in the left panel apply to every tab. A bar above a section narrows that section only.

      Provenance: every setting and tool version on this page is read from the run's own `params.json` and software-versions report, and every number from the files the run wrote. The guide classes are quartiles of this run, a rank among its guides, not a threshold from a tool or a paper.
    tag: cs-ov-about
    index: cs-ov-about
    layout: {x: 0, y: 8, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. The icon colour is that tab's colour.
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: library_outcome_space
    aggregation: count
    column_name: sample
    column_type: object
    secondary_layout: donut
    breakdown_col: edit_quartile
    display:
      icon_name: mdi:test-tube
      icon_color: teal
      caption: libraries with classified reads, by the editing quartile of their guide
      link: tab:Replicates & QC
    section: Key figures
    tag: cs-ov-kf-libraries
    index: cs-ov-kf-libraries
    title: Libraries
    description: Libraries that classified reads, one per samplesheet row. The ring splits them by the quartile of their guide's median edited share among the guides of this run.
    layout: {x: 0, y: 0, w: 2, h: 2}
  # The funnel reads left to right: raw reads, the reads left after merging,
  # filtering and clustering, then the reads the CIGAR parser classified.
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/edit_summary
    aggregation: sum
    column_name: raw_reads
    column_type: int64
    secondary_layout: attrition
    attrition_cols: [clustered_reads, classified_reads]
    display:
      icon_name: mdi:file-document-outline
      icon_color: blue
      caption: raw, then clustered and classified
      link: tab:Read QC
      format: si
    section: Key figures
    tag: cs-ov-kf-reads
    index: cs-ov-kf-reads
    title: Reads
    description: Reads sequenced, those left after merging, filtering and clustering, and those the CIGAR parser classified.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/edit_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: edited_pct
    column_type: float64
    filter_expr: col('classified_reads') > 0
    display:
      icon_name: mdi:target
      icon_color: grape
      caption: median per library, with its spread
      link: tab:Edit outcomes
      decimals: 1
    section: Key figures
    tag: cs-ov-kf-edited
    index: cs-ov-kf-edited
    title: Edited reads (%)
    description: Share of a library's classified reads that are not wild type, median over the libraries in view.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # One row per guide, so the spread of guides is the box; a ring by quartile
  # would split in four equal parts by construction.
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: guide_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: median_edited_pct
    column_type: float64
    filter_expr: col('libraries') > 0
    display:
      icon_name: mdi:scale-balance
      icon_color: indigo
      caption: median guide, with the spread of guides
      link: tab:Guides
      decimals: 1
    section: Key figures
    tag: cs-ov-kf-guides
    index: cs-ov-kf-guides
    title: Guide editing (%)
    description: Median edited share of a guide's libraries, median over the guides in view. The box shows how the guides spread.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the group, then the library.
  - component_type: interactive
    workflow_tag: crisprseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Findings
    tag: cs-ov-findings-group
    index: cs-ov-findings-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: crisprseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{METADATA_ID_COL}'
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Library
    section: Findings
    tag: cs-ov-findings-sample
    index: cs-ov-findings-sample
    title: Library
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per analysis tab, each citing one data collection, so the
  # import removes a row with its data. Every row states a measure and lets the
  # value fill in.
  - component_type: text
    surface: card
    values:
      med_fs: {dc: crisprseq_edit_summary, column: frameshift_of_indels_pct, aggregation: median,
        filter_expr: "col('classified_reads') > 0", format: 'decimals:0'}
      med_gd: {dc: guide_summary, column: median_edited_pct, aggregation: median,
        filter_expr: "col('libraries') > 0", format: 'decimals:0'}
      top_gd: {dc: guide_summary, column: median_edited_pct, aggregation: max,
        filter_expr: "col('libraries') > 0", format: 'decimals:0'}
      top_size: {dc: guide_summary, column: dominant_indel_size, aggregation: top}
      peak_sub: {dc: guide_substitution_profile, column: mean_substitution_pct, aggregation: max, format: 'decimals:1'}
    body: |
      - **{{med_fs}}%** of the indel reads shift the reading frame – median over the libraries, the edits that knock a gene out [Edit outcomes](tab:Edit outcomes)
      - **{{med_gd}}%** of its reads are edited in the median guide – the best guide reaches {{top_gd}}%, a median over its libraries [Guides](tab:Guides)
      - **{{top_size}} bp** is the indel size most guides repair to – deletions negative, insertions positive [Indel spectrum](tab:Indel spectrum)
      - **{{peak_sub}}%** of the reads carry a substituted base at the most affected offset – the highest mean over a guide's libraries, where a base editor shows as a band [Substitutions](tab:Substitutions)
    section: Findings
    tag: cs-ov-findings
    index: cs-ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One figure per analysis tab, in the order of the rows above. The tiles of a
  # row share a stored height. The first two redraw a figure of their tab; the
  # last two are summaries, because the allele map and the guide by offset
  # heatmap are too dense for a half-width tile.
  - component_type: highlight
    section: Findings
    source_tab: Edit outcomes
    source_component: cs-out-av-frameshift
    caption: One point per library, editing against the frameshift share of its indels; the upper right holds the likely knockouts.
    hide_legend: true
    tag: cs-ov-hl-outcomes
    index: cs-ov-hl-outcomes
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Guides
    source_component: cs-gd-av-comparison
    caption: One point per guide, coloured by the quartile of its median edited share among the guides of this run and sized by its libraries.
    hide_legend: true
    tag: cs-ov-hl-guides
    index: cs-ov-hl-guides
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: figure
    workflow_tag: crisprseq
    data_collection_tag: guide_summary
    visu_type: bar
    mode: code
    code_content: |-
      # Guides per dominant indel size: deletions (negative sizes) and insertions (positive) in the colours of the indel type. A size of 0 is left out.
      colors = depictio_category_colors.get('indel_type') or {}
      d = df.filter(pl.col('dominant_indel_size').is_not_null() & (pl.col('dominant_indel_size') != 0)).group_by('dominant_indel_size').agg(pl.len().alias('guides')).sort('dominant_indel_size')
      d = d.with_columns(pl.when(pl.col('dominant_indel_size') < 0).then(pl.lit('Deletion')).otherwise(pl.lit('Insertion')).alias('indel_type'))
      fig = px.bar(d.to_pandas(), x='dominant_indel_size', y='guides', color='indel_type', color_discrete_map=colors, labels={'dominant_indel_size': 'Dominant indel size (bp)', 'guides': 'Guides', 'indel_type': ''})
      fig.update_xaxes(dtick=5)
      fig.update_layout(margin=dict(t=10), legend_title_text='')
    title: Dominant indel size per guide
    description: >-
      Which indel size do the guides repair to? Each bar counts the guides whose most frequent signed indel size, pooled over their libraries, is that size; deletions are negative and insertions positive.

      How to read: one tall bar means most guides leave the same dominant repair, such as a 1 bp insertion, and a spread over many sizes means the repair depends on the guide. Open [Indel spectrum](tab:Indel spectrum) to pick a guide and read its whole size distribution.

      Note: only the dominant size of each guide is counted, so a guide with two near-equal sizes counts for one of them. No cut-off is drawn.
    link: tab:Indel spectrum
    caption: Guides by the signed indel size most of their indel reads repair to; deletions are negative, insertions positive.
    section: Findings
    tag: cs-ov-fig-sizes
    index: cs-ov-fig-sizes
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: figure
    workflow_tag: crisprseq
    data_collection_tag: guide_substitution_profile
    visu_type: line
    mode: code
    code_content: |-
      # Across the guides in view, at each offset from the cut site: the median guide, the band from the first to the third quartile of the guides, and the guide with the highest mean substitution rate. The colour is the cyan of the Substitutions tab.
      hue = '#1098ad'
      d = df.group_by('offset').agg(pl.col('mean_substitution_pct').median().alias('median'), pl.col('mean_substitution_pct').quantile(0.25).alias('q1'), pl.col('mean_substitution_pct').quantile(0.75).alias('q3'), pl.col('mean_substitution_pct').max().alias('top')).sort('offset')
      long = d.select('offset', pl.col('median').alias('Median guide'), pl.col('top').alias('Highest guide')).unpivot(index=['offset'], variable_name='view', value_name='rate')
      fig = px.line(long.to_pandas(), x='offset', y='rate', color='view', line_dash='view', line_dash_map={'Median guide': 'solid', 'Highest guide': 'dash'}, color_discrete_map={'Median guide': hue, 'Highest guide': hue}, labels={'offset': 'Offset from the cut site (bp)', 'rate': 'Reads with a substituted base (%)', 'view': ''})
      xs = d['offset'].to_list()
      fig.add_trace(go.Scatter(x=xs + xs[::-1], y=d['q3'].to_list() + d['q1'].to_list()[::-1], fill='toself', fillcolor='rgba(16,152,173,0.2)', line=dict(width=0), hoverinfo='skip', name='Middle half of the guides'))
      fig.add_vline(x=0, line_dash='dot', line_width=1, opacity=0.6, annotation_text='Cut site')
      fig.update_layout(margin=dict(t=10), legend_title_text='', legend=dict(orientation='h', y=-0.25))
    title: Substitution rate along the cut
    description: >-
      Where do bases change around the cut? At each offset from the cut site, the mean share of reads with a base other than the dominant one is taken per guide; the solid line is the median guide, the shaded band the middle half of the guides and the dashed line the guide with the highest rate.

      How to read: a flat line near zero is a nuclease run with no substitution signal, and a hump of the dashed line a few bases upstream of the cut is a guide where a base editor works. A band that stays near zero while the dashed line rises means a few guides carry the signal. Open [Substitutions](tab:Substitutions) to read one guide.

      Lines and annotations: the vertical dotted line at offset 0, labelled Cut site, is the position the pipeline reports for the amplicon (the cut_site column of the indel table and the _cutSite.json file). It is derived from the protospacer and its convention may be shifted for some guides, which moves a curve by a constant and keeps its shape. It is a landmark, not a cut-off.

      Source: nf-core/crisprseq output documentation, https://nf-co.re/crisprseq/2.3.0/docs/output
    link: tab:Substitutions
    caption: At each offset from the cut site, the median guide, the middle half of the guides and the guide with the highest rate.
    section: Findings
    tag: cs-ov-fig-subs
    index: cs-ov-fig-subs
    layout: {x: 4, y: 7, w: 4, h: 5}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers.
  - component_type: text
    body: |
      ### Data & QC
      - [Read QC](tab:Read QC)
      - [Replicates & QC](tab:Replicates & QC)

      ### Editing
      - [Edit outcomes](tab:Edit outcomes)
      - [Sample space](tab:Sample space)
      - [Guides](tab:Guides)

      ### Repair signature
      - [Indel spectrum](tab:Indel spectrum)
      - [Substitutions](tab:Substitutions)
    section: How to read this dashboard
    tag: cs-ov-how-to-read
    index: cs-ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the group first.
  - component_type: interactive
    workflow_tag: crisprseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: cs-filter-group
    index: sample-filters-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: crisprseq
    data_collection_tag: samples
    interactive_component_type: TextInput
    column_name: '{GROUP_COL}'
    column_type: object
    placeholder: 'e.g. ^ctrl or _rep1$'
    display:
      icon_name: mdi:magnify
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: cs-filter-group-pattern
    index: sample-filters-group-pattern
    title: '{GROUP_COL_DISPLAY} pattern'
    layout: {x: 0, y: 3, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: crisprseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{METADATA_ID_COL}'
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: cs-filter-sample
    index: sample-filters-sample
    title: Library
    layout: {x: 0, y: 5, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: crisprseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: has_template
    column_type: object
    display:
      icon_name: mdi:file-document-outline
      custom_color: grape
    section: Sample filters
    group: Sample scope
    tag: cs-filter-template
    index: sample-filters-template
    title: Donor template
    layout: {x: 0, y: 8, w: 1, h: 3}
  # Row selection feeds the Analysis panel.
  - component_type: table
    workflow_tag: crisprseq
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample
    section: Sample sheet
    tag: cs-sheet-samples
    index: cs-sheet-samples
    title: Samplesheet
    description: >-
      Which libraries does the run hold? One row per library, with the guide it was edited with, whether it has a donor template and the other columns of the samplesheet.

      How to read: check here that every library carries the guide you expect before reading the other tabs. Ticking rows narrows every tab to those libraries, and the sample filters of the left panel do the same.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/edit_summary
    row_selection_enabled: true
    row_selection_column: sample
    section: Sample sheet
    tag: cs-sheet-summary
    index: cs-sheet-summary
    title: Editing outcome per library
    description: >-
      How was each library read and edited? One row per library with its read accounting, reads per outcome class and the editing rates.

      How to read: look at the classified reads before the rates, since a library with few of them rests its rates on a handful of reads. Tick rows to narrow every tab to those libraries.

      Note: every rate is a share of the classified reads, the reads the CIGAR parser kept after its filters, not of the raw reads.
    layout: {x: 0, y: 6, w: 8, h: 6}

tabs:
# =========================================================================
# Data & QC
# =========================================================================
- title: Read QC
  subtitle: Did each library have enough reads and alignment to call editing?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: mdi:shield-check-outline
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Read scope
    icon: mdi:tune
    color: blue
    description: Keep libraries inside a depth or alignment band
  grid_sections:
  - name: Reads at a glance
    icon: mdi:counter
    color: blue
    description: Depth, read loss and alignment over the libraries
  - name: Depth and alignment
    icon: mdi:chart-scatter-plot
    color: blue
    description: Raw reads against the aligned share, one point per library
  components:
  - component_type: interactive
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    interactive_component_type: RangeSlider
    column_name: raw_reads
    column_type: int64
    display:
      icon_name: mdi:file-document-outline
      custom_color: blue
    placement: left
    section: Read scope
    group: Reads
    tag: cs-qc-filter-raw
    index: cs-qc-raw-range
    title: Raw reads
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    interactive_component_type: RangeSlider
    column_name: aligned_pct
    column_type: float64
    display:
      icon_name: mdi:check-decagram
      custom_color: indigo
    placement: left
    section: Read scope
    group: Reads
    tag: cs-qc-filter-aligned
    index: cs-qc-aligned-range
    title: Aligned reads (%)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: text
    order: 1
    body: >
      [The CIGAR parser](https://nf-co.re/crisprseq/2.3.0/docs/output) follows the reads of each
      library from sequencing to classification, so a library with few reads, or one that aligns
      poorly to its amplicon, rests its editing rate on fewer reads. Read the depth scatter before
      the outcome tabs. Lasso a group of points to narrow the other tiles.
    tag: cs-qc-intro
    index: cs-qc-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/edit_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: raw_reads
    column_type: int64
    display:
      icon_name: mdi:file-document-outline
      icon_color: blue.4
      caption: median reads, with their spread
      format: si
    section: Reads at a glance
    tag: cs-qc-card-raw
    index: cs-qc-card-raw
    title: Raw reads per library
    description: Median reads sequenced per library. The box shows how the depth spreads over the libraries.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/edit_summary
    aggregation: sum
    column_name: clustered_reads
    column_type: int64
    secondary_layout: attrition
    attrition_cols: [classified_reads]
    display:
      icon_name: mdi:filter-variant
      icon_color: blue.6
      caption: clustered, then classified
      format: si
    section: Reads at a glance
    tag: cs-qc-card-funnel
    index: cs-qc-card-funnel
    title: Clustered reads
    description: Reads left after merging, quality filtering and clustering, and the share of them the CIGAR parser classified.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/edit_summary
    aggregation: median
    column_name: aligned_pct
    column_type: float64
    filter_expr: col('raw_reads') > 0
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:check-decagram
      icon_color: blue.8
      caption: median share of reads aligned
      decimals: 1
    section: Reads at a glance
    tag: cs-qc-card-aligned
    index: cs-qc-card-aligned
    title: Aligned reads (%)
    description: Share of a library's reads aligned to its amplicon, median over the libraries in view.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/edit_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: indels_failing_filter
    column_type: int64
    display:
      icon_name: mdi:alert-outline
      icon_color: blue.9
      caption: median reads, with their spread
    section: Reads at a glance
    tag: cs-qc-card-filtered
    index: cs-qc-card-filtered
    title: Indel reads filtered out
    description: Indel reads the error-rate and peak filters dropped, median per library.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/depth_vs_alignment
    config:
      x_title: Raw reads
      y_title: Aligned reads (%)
      log_x: true
      density_threshold: 3000
      legend_pos: bottom
      selection_enabled: true
      selection_column: sample
    section: Depth and alignment
    tag: cs-qc-av-depth-alignment
    index: cs-qc-av-depth-alignment
    title: Depth against alignment per library
    description: >-
      Did each library have the reads and the alignment to call editing? Each point is one library, placed by its raw reads on a log scale and by the share of its reads aligned to its amplicon.

      How to read: most libraries form a cloud. A point far to the left has fewer reads than the rest of the run, and one low on the vertical axis aligned fewer of them, so either rests its editing rate on fewer reads. Lasso such points to narrow the other tiles, then compare their rates in [Edit outcomes](tab:Edit outcomes) before trusting them.

      Note: no cut-off is drawn. This dashboard names no minimum depth or aligned share, so read each library against the others of the run. With thousands of libraries the tile can switch to a density view.
    layout: {x: 0, y: 0, w: 8, h: 6}

- title: Replicates & QC
  subtitle: Do the libraries lose reads alike, and do a guide's libraries agree?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:content-duplicate
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Library scope
    icon: mdi:tune
    color: teal
    description: Keep libraries inside a range of classified reads
  - name: Guide scope
    icon: mdi:dna
    color: teal
    description: Keep guides by the libraries behind them; the library tiles are unchanged
  grid_sections:
  - name: Replicates at a glance
    icon: mdi:counter
    color: teal
    description: Depth, editing, the spread between a guide's libraries and the fewest libraries
  - name: Read attrition
    icon: mdi:filter-variant
    color: teal
    description: Share of the raw reads left at each stage, over the libraries
  - name: Reads kept per library
    icon: mdi:chart-line
    color: teal
    description: Classified reads of every library, ranked
  - name: Library agreement
    icon: mdi:scale-balance
    color: teal
    description: How far the libraries of one guide differ in their edited share
  components:
  - component_type: interactive
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    interactive_component_type: RangeSlider
    column_name: classified_reads
    column_type: int64
    display:
      icon_name: mdi:file-check-outline
      custom_color: teal
    placement: left
    section: Library scope
    group: Libraries
    tag: cs-rep-filter-classified
    index: cs-rep-classified-range
    title: Classified reads
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: crisprseq
    data_collection_tag: guide_summary
    interactive_component_type: RangeSlider
    column_name: libraries
    column_type: int64
    display:
      icon_name: mdi:test-tube
      custom_color: blue
    placement: left
    section: Guide scope
    group: Guides
    tag: cs-rep-filter-libraries
    index: cs-rep-libraries-range
    title: Libraries per guide
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: text
    order: 1
    body: >
      Each library loses reads between sequencing and classification, and [the CIGAR
      parser](https://nf-co.re/crisprseq/2.3.0/docs/output) reports every stage. The attrition
      boxes show whether the libraries lost reads alike, and the ranked curve how unevenly depth
      spreads over them. The last tile shows how far the libraries of one guide agree on their
      editing; they are replicates only where the design makes them so.
    tag: cs-rep-intro
    index: cs-rep-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/edit_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: classified_reads
    column_type: int64
    display:
      icon_name: mdi:file-check-outline
      icon_color: teal.4
      caption: median reads, with their spread
      format: si
    section: Replicates at a glance
    tag: cs-rep-card-classified
    index: cs-rep-card-classified
    title: Classified reads per library
    description: Median reads the CIGAR parser classified per library, the reads every rate rests on. The box shows how the depth spreads.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/edit_summary
    aggregation: median
    column_name: edited_pct
    column_type: float64
    filter_expr: col('classified_reads') > 0
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-histogram
      icon_color: teal.6
      caption: libraries, by edited share
      decimals: 1
    section: Replicates at a glance
    tag: cs-rep-card-edited
    index: cs-rep-card-edited
    title: Edited reads (%)
    description: Median edited share over the libraries in view. The histogram shows whether the libraries edit alike or in groups.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: guide_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: iqr_edited_pct
    column_type: float64
    filter_expr: col('libraries') > 0
    display:
      icon_name: mdi:arrow-expand-horizontal
      icon_color: teal.8
      caption: median guide, with the spread of guides
      decimals: 1
    section: Replicates at a glance
    tag: cs-rep-card-spread
    index: cs-rep-card-spread
    title: Spread between libraries (points)
    description: Width of the middle half of a guide's libraries in edited share, in percentage points, median over the guides in view. A small value means the libraries of a guide edit alike.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: guide_summary
    aggregation: min
    column_name: libraries
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:test-tube
      icon_color: teal.9
      caption: guides, by libraries behind them
      decimals: 0
    section: Replicates at a glance
    tag: cs-rep-card-fewest
    index: cs-rep-card-fewest
    title: Fewest libraries behind a guide
    description: The smallest number of libraries behind any guide in view. A guide with few libraries has a median that rests on few observations.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/edit_summary
    visu_type: box
    mode: code
    code_content: |-
      # Share of the raw reads left at each stage, one box per stage over the libraries in view. Merged, quality filtered and aligned are the percentages the CIGAR parser reports; clustered and classified are read counts over the raw reads. A single-end run has no merged reads, so that stage is drawn only when a library reports some. Each stage has its own colour, and the colours only tell the stages apart.
      stages = {'merged_pct': 'Merged', 'quality_filtered_pct': 'Quality filtered', 'clustered_pct': 'Clustered', 'aligned_pct': 'Aligned', 'classified_pct': 'Classified'}
      d = df.filter(pl.col('raw_reads') > 0).with_columns((pl.col('clustered_reads') * 100.0 / pl.col('raw_reads')).alias('clustered_pct'), (pl.col('classified_reads') * 100.0 / pl.col('raw_reads')).alias('classified_pct'))
      has_merged = d.select((pl.col('merged_pct').fill_null(0) > 0).any()).item()
      keep = [c for c in stages if c != 'merged_pct' or has_merged]
      long = d.select(['sample', *keep]).unpivot(index=['sample'], variable_name='stage', value_name='share').with_columns(pl.col('stage').replace(stages))
      palette = {'Merged': '#4c6ef5', 'Quality filtered': '#15aabf', 'Clustered': '#12b886', 'Aligned': '#fab005', 'Classified': '#f76707'}
      fig = px.box(long.to_pandas(), x='stage', y='share', color='stage', points='outliers', hover_data=['sample'], category_orders={'stage': [stages[c] for c in keep]}, color_discrete_map=palette, labels={'stage': '', 'share': 'Share of the raw reads (%)'})
      fig.update_layout(margin=dict(t=10), showlegend=False)
    title: Read attrition per library
    description: >-
      Do the libraries lose reads alike? Each box is one stage between sequencing and classification, and each library contributes the share of its raw reads left at that stage.

      How to read: boxes near 100 percent with a short spread mean the libraries kept almost all their reads at that stage. A box that drops from one stage to the next shows where reads are lost, and a long whisker or outlier points at libraries that lost more than the rest; open them in the ranked curve below and in [Read QC](tab:Read QC).

      Note: no cut-off is drawn. The quality-filtered and merged shares are the CIGAR parser's own percentages, and which count each is taken against is not stated in its table. Clustered and classified are computed here from the read counts over the raw reads.

      Source: nf-core/crisprseq output documentation, https://nf-co.re/crisprseq/2.3.0/docs/output
    section: Read attrition
    tag: cs-rep-fig-attrition
    index: cs-rep-fig-attrition
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: figure
    workflow_tag: crisprseq
    data_collection_tag: library_outcome_space
    visu_type: scatter
    mode: code
    code_content: |-
      # Classified reads per library, largest first, on log axes: a ranked curve of points, because a bar per library does not read at thousands of libraries. Each point takes the colour of its guide's editing quartile, the colours the other tabs use.
      d = df.filter(pl.col('classified_reads') > 0).sort('classified_reads', descending=True).with_row_index('rank', offset=1)
      order = ['Highest quartile', 'Upper-middle quartile', 'Lower-middle quartile', 'Lowest quartile', 'Not ranked']
      palette = {'Highest quartile': '#440154', 'Upper-middle quartile': '#31688e', 'Lower-middle quartile': '#35b779', 'Lowest quartile': '#fde725', 'Not ranked': '#adb5bd'}
      fig = px.scatter(d.to_pandas(), x='rank', y='classified_reads', color='edit_quartile', log_x=True, log_y=True, hover_data=['sample', 'guide'], category_orders={'edit_quartile': order}, color_discrete_map=palette, labels={'rank': 'Library rank (log scale)', 'classified_reads': 'Classified reads (log scale)', 'edit_quartile': 'Guide editing quartile'})
      fig.update_traces(marker=dict(size=4, opacity=0.8))
      fig.update_layout(margin=dict(t=10), legend=dict(orientation='h', y=-0.25, title=''))
    title: Classified reads per library, ranked
    description: >-
      How unevenly does depth spread over the libraries? Each point on the curve is one library, ranked from the one with the most classified reads (left) to the one with the fewest (right), on log axes.

      How to read: a flat curve means the libraries have similar depth, and a steep fall at the right end is a tail of shallow libraries whose editing rates rest on few reads. Hover the tail to name those libraries, then look them up in [Read QC](tab:Read QC). The colour is the quartile of the library's guide by median edited share: a tail of one colour says the shallow libraries belong to guides of the same editing level.

      Annotations: the quartiles rank the guides of this run against each other, they are not a threshold from a tool or a paper.

      Note: no cut-off is drawn, and the curve shows the libraries in view, so the left panel filters redraw it.
    section: Reads kept per library
    tag: cs-rep-fig-ranked
    index: cs-rep-fig-ranked
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: crisprseq
    data_collection_tag: guide_summary
    viz_kind: ranked_distribution
    config:
      viz_kind: ranked_distribution
      feature_id_col: guide
      score_col: iqr_edited_pct
      q1_col: q1_edited_pct
      median_col: median_edited_pct
      q3_col: q3_edited_pct
      lower_col: min_edited_pct
      upper_col: max_edited_pct
      group_col: edit_quartile
      top_n: 25
      ascending: false
      distribution: box
      orientation: horizontal
      score_label: Width of the middle half (points)
      value_label: Edited reads (%)
    section: Library agreement
    tag: cs-rep-av-agreement
    index: cs-rep-av-agreement
    title: Agreement between the libraries of a guide
    description: >-
      Which guides have libraries that disagree? Each row is one guide, ranked by the width of the middle half of its libraries' edited share, with a box from the first to the third quartile around the median and whiskers to the lowest and highest library, and the width itself on the right.

      How to read: a short box and a small width mean the libraries of the guide edit alike, so its median is a stable number. A long box, or whiskers far from the box, means one or a few libraries differ a lot; open those libraries in [Edit outcomes](tab:Edit outcomes). Colours are the guide's quartile among the guides of this run.

      Annotations: the colour of a row is the quartile of the guide's median edited share among the guides of this run, a rank and not a threshold from a tool or a paper. The tile lists the 25 guides with the widest spread; the control changes how many.

      Note: libraries of a guide are replicates only where the design makes them so, and they may differ in cell line or condition. No cut-off for agreement is drawn.
    layout: {x: 0, y: 0, w: 8, h: 6}

# =========================================================================
# Editing
# =========================================================================
- title: Edit outcomes
  subtitle: Which libraries carry disruptive edits, and how were they called?
  tab_group: Editing
  tab_order: 3
  tab_icon: mdi:target
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Outcome scope
    icon: mdi:tune
    color: grape
    description: Narrow by frameshift share or by the clonality call
  grid_sections:
  - name: Outcomes at a glance
    icon: mdi:counter
    color: grape
    description: Editing, frameshift and in-frame rates, and the outcome mix
  - name: Library detail
    icon: mdi:chart-scatter-plot
    color: grape
    description: Pick a library in the scatter to read its record
  - name: Clonality
    icon: mdi:family-tree
    color: grape
    description: The classifier's zygosity class and clonality label per library
  - name: Outcome tables
    icon: mdi:table
    color: gray
    description: Clonality calls and outcome counts per library
    collapsed: true
  components:
  - component_type: interactive
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    interactive_component_type: RangeSlider
    column_name: frameshift_of_indels_pct
    column_type: float64
    display:
      icon_name: mdi:arrow-expand-horizontal
      custom_color: grape
    placement: left
    section: Outcome scope
    group: Outcomes
    tag: cs-out-filter-frameshift
    index: cs-out-frameshift-range
    title: Frameshift share of indels (%)
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_clonality
    interactive_component_type: MultiSelect
    column_name: classification
    column_type: object
    display:
      icon_name: mdi:chart-donut
      custom_color: pink
    placement: left
    section: Outcome scope
    group: Outcomes
    tag: cs-out-filter-classification
    index: cs-out-classification-filter
    title: Zygosity class
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_clonality
    interactive_component_type: MultiSelect
    column_name: clonality
    column_type: object
    display:
      icon_name: mdi:family-tree
      custom_color: red
    placement: left
    section: Outcome scope
    group: Outcomes
    tag: cs-out-filter-clonality
    index: cs-out-clonality-filter
    title: Clonality
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: text
    order: 1
    body: >
      A knockout needs edits that shift the reading frame, so compare the frameshift share of
      the indels with the editing rate of each library. Click a library in the scatter to open
      its record beside it. [The clonality classifier](https://nf-co.re/crisprseq/2.3.0/docs/output)
      then calls each library homozygous, heterozygous or ambiguous from the same reads.
    tag: cs-out-intro
    index: cs-out-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/edit_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: edited_pct
    column_type: float64
    filter_expr: col('classified_reads') > 0
    display:
      icon_name: mdi:target
      icon_color: grape.4
      caption: median per library, with its spread
      decimals: 1
    section: Outcomes at a glance
    tag: cs-out-card-edited
