      How to read: open the confidence first, since a call with low confidence is the classifier's own doubt. Ambiguous and insufficient-data labels come from the classifier and mean it could not settle the call from that library's reads; check the library's depth in [Read QC](tab:Read QC).

      Note: the classes and labels are the nf-core/crisprseq clonality classifier's, and this dashboard draws no cut-off on them (https://nf-co.re/crisprseq/2.3.0/docs/output).
