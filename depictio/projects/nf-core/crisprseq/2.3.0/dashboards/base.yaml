  - component_type: interactive
    workflow_tag: crisprseq
    data_collection_tag: guide_substitution_profile
    interactive_component_type: RangeSlider
    column_name: offset
    column_type: int64
    display:
      icon_name: mdi:ruler
      custom_color: cyan
    placement: left
    section: Position scope
    group: Positions
    tag: cs-sub-filter-offset
    index: cs-sub-offset-range
    title: Offset from the cut site (bp)
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: text
    order: 1
    body: >
      A base editor leaves a band of substitutions a few bases upstream of the cut, while a
      nuclease leaves the matrix flat and a peak in the gap rate near the cut site. The heatmap
      covers every guide in scope. The Guide picker on the left narrows the cards and the profiles
      below it, not the heatmap.
    tag: cs-sub-intro
    index: cs-sub-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: guide_substitution_profile
    aggregation: max
    column_name: mean_substitution_pct
    column_type: float64
    secondary_layout: top_n
    breakdown_col: offset
    top_n_count: 3
    display:
      icon_name: mdi:swap-horizontal
      icon_color: cyan.4
      caption: highest rates, by offset
      decimals: 1
    section: Substitutions at a glance
    tag: cs-sub-card-peak
    index: cs-sub-card-peak
    title: Peak substitution rate (%)
    description: Highest mean share of reads with a substituted base at any offset. The bars name the offsets that carry the most.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: guide_substitution_profile
    aggregation: max
    column_name: mean_gap_pct
    column_type: float64
    secondary_layout: top_n
    breakdown_col: offset
    top_n_count: 3
    display:
      icon_name: mdi:dots-horizontal
      icon_color: cyan.6
      caption: highest rates, by offset
      decimals: 1
    section: Substitutions at a glance
    tag: cs-sub-card-gap
    index: cs-sub-card-gap
    title: Peak gap rate (%)
    description: Highest mean share of reads with a gap at any offset. A nuclease cut is expected to show as a peak near offset 0.
    layout: {x: 2, y: 0, w: 2, h: 2}
