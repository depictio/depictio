    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: guide_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: dominant_indel_size
    column_type: int64
    display:
      icon_name: mdi:ruler
      icon_color: orange
      caption: median size, with its spread
      decimals: 0
    section: Signature at a glance
    tag: cs-ind-card-size
    index: cs-ind-card-size
    title: Dominant indel size (bp)
    description: The signed indel size carrying the most reads of a guide, deletions negative, median over the guides in view.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: guide_summary
    aggregation: median
    column_name: dominant_indel_share_pct
    column_type: float64
    filter_expr: col('libraries') > 0
    secondary_layout: coverage
    coverage_max: 100
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: blue
      caption: median share of indel reads at that size
      decimals: 1
    section: Signature at a glance
    tag: cs-ind-card-share
    index: cs-ind-card-share
    title: Dominant size share (%)
    description: Share of a guide's indel reads at its dominant size, median over the guides in view.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: guide_summary
    aggregation: median
    column_name: median_frameshift_of_indels_pct
    column_type: float64
    filter_expr: col('libraries') > 0
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:arrow-expand-horizontal
      icon_color: grape
      caption: median share of indels out of frame
      decimals: 1
    section: Signature at a glance
    tag: cs-ind-card-frameshift
    index: cs-ind-card-frameshift
    title: Frameshift share (%)
    description: Share of the indel reads out of frame, median over the guides in view.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_indels
    use: crisprseq/indels
    aggregation: nunique
    column_name: allele
    column_type: object
    secondary_layout: donut
    breakdown_col: indel_type
    display:
      icon_name: mdi:dna
      icon_color: teal
      caption: distinct alleles, by type
    section: Signature at a glance
    tag: cs-ind-card-alleles
    index: cs-ind-card-alleles
    title: Indel alleles
    description: Distinct alleles of the libraries in view, by type, position and length.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: crisprseq
    data_collection_tag: guide_indel_sizes
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: guide
      x_col: size
      y_col: mean_pct_reads
      lower_col: q1_pct_reads
      upper_col: q3_pct_reads
      reference_x: 0
      reference_label: Deletions left, insertions right
      x_title: Indel size (bp)
      y_title: Share of classified reads (%)
      legend_pos: none
    section: Size signature
    tag: cs-ind-av-guide-sizes
    index: cs-ind-av-guide-sizes
    title: Indel size distribution of the guide
    description: Mean share of the classified reads at every signed indel size over the guide's libraries, with the band from the first to the third quartile. A narrow band means the libraries repair the cut the same way.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: crisprseq
    data_collection_tag: guide_cut_site_profile
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: guide
      x_col: offset
      y_col: mean_deletion_pct
      lower_col: q1_deletion_pct
      upper_col: q3_deletion_pct
      reference_x: 0
      reference_label: Cut site
      x_title: Offset from the cut site (bp)
      y_title: Reads with a deletion covering the position (%)
      legend_pos: none
    section: Position around the cut site
    tag: cs-ind-av-guide-deletions
    index: cs-ind-av-guide-deletions
    title: Deletion coverage around the cut site
    description: Mean share of reads whose deletion spans each position, with the band of the guide's libraries. A nuclease cut shows as a peak straddling offset 0.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: crisprseq
    data_collection_tag: guide_cut_site_profile
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: guide
      x_col: offset
      y_col: mean_insertion_pct
      lower_col: q1_insertion_pct
      upper_col: q3_insertion_pct
      reference_x: 0
      reference_label: Cut site
      x_title: Offset from the cut site (bp)
      y_title: Reads with an insertion at the position (%)
      legend_pos: none
    section: Position around the cut site
    tag: cs-ind-av-guide-insertions
    index: cs-ind-av-guide-insertions
    title: Insertion position around the cut site
    description: Mean share of reads with an insertion starting at each position, with the band of the guide's libraries.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: crisprseq
    data_collection_tag: guide_alleles
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: offset
      y_col: size
      label_col: allele
      color_col: indel_type
      size_col: pct_reads
      x_title: Offset from the cut site (bp)
      y_title: Indel size (bp)
      top_n_labels: 0
      density_threshold: 8000
      legend_pos: bottom
    section: Allele map
    tag: cs-ind-av-allele-map
    index: cs-ind-av-allele-map
    title: Indel alleles by position and size
    description: One point per allele, pooled over the libraries of its guide, sized by its share of the guide's classified reads and coloured by type. A trail along one size is a deletion placed at shifting offsets.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: crisprseq
    data_collection_tag: guide_alleles
    columns: [allele, libraries, pct_reads, reads, indel_type, size, offset, frame, peak, median_pct_reads, rank]
    section: Indel tables
    tag: cs-ind-table-guide-alleles
    index: cs-ind-table-guide-alleles
    title: Indel alleles of the guide
    description: The guide's most frequent alleles pooled over its libraries, with how many libraries carry each, its share of the classified reads and its median share where present.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_indels
    use: crisprseq/indels
    row_selection_enabled: true
    row_selection_column: allele
    section: Indel tables
    tag: cs-ind-table-alleles
    index: cs-ind-table-alleles
    title: Indel alleles per library
    description: Every distinct allele of the guide's libraries with type, size, offset, frame, peak membership and read share, ranked within its library.
    layout: {x: 0, y: 6, w: 8, h: 6}

- title: Substitutions
  subtitle: Where around the cut do bases change or drop out?
  tab_group: Repair signature
  tab_order: 5
  tab_icon: mdi:waves
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Guide picker
    icon: mdi:dna
    color: cyan
    description: The guide the cards and profiles show; the heatmap stays whole
  - name: Position scope
    icon: mdi:tune
    color: cyan
    description: Narrow the guide profiles to a band of offsets
  grid_sections:
  - name: Substitutions at a glance
    icon: mdi:counter
    color: cyan
    description: Peak substitution and gap rates, libraries and the spread of rates
  - name: Substitutions per guide
    icon: mdi:chart-box-outline
    color: cyan
    description: Mean substitution rate per guide and offset from the cut site
  - name: Guide profile
    icon: mdi:chart-line
    color: cyan
    description: Substitution and gap rate along the amplicon, mean library with its band
  - name: Substitution tables
    icon: mdi:table
    color: gray
    description: The picked guide's rates per offset
    collapsed: true
  components:
  # The pick sits on `profile_guide`, a column only the per-guide profile
  # carries, so it narrows the profile, its cards and its table and leaves the
  # heatmap and the pinned tables at the scope of the sample filters.
  - component_type: interactive
    workflow_tag: crisprseq
    data_collection_tag: guide_substitution_profile
    interactive_component_type: Select
    column_name: profile_guide
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: violet
    placement: left
    section: Guide picker
    group: Guide
    tag: cs-sub-filter-guide
    index: cs-sub-guide-filter
    title: Guide
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: crisprseq
    data_collection_tag: guide_substitution_profile
    interactive_component_type: RangeSlider
    column_name: offset
    column_type: int64
    display:
      icon_name: mdi:ruler
      custom_color: cyan
    placement: left
    section: Position scope
    group: Positions
    tag: cs-sub-filter-offset
    index: cs-sub-offset-range
    title: Offset from the cut site (bp)
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: text
    order: 1
    body: >
      A base editor leaves a band of substitutions a few bases upstream of the cut, while a
      nuclease leaves the matrix flat and a gap peak at the cut. The heatmap covers every guide
      in scope. The Guide picker on the left narrows the cards and the profiles below it, not the
      heatmap.
    tag: cs-sub-intro
    index: cs-sub-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: guide_substitution_profile
    aggregation: max
    column_name: mean_substitution_pct
    column_type: float64
    secondary_layout: top_n
    breakdown_col: offset
    top_n_count: 3
    display:
      icon_name: mdi:swap-horizontal
      icon_color: orange
      caption: highest rates, by offset
      decimals: 1
    section: Substitutions at a glance
    tag: cs-sub-card-peak
    index: cs-sub-card-peak
    title: Peak substitution rate (%)
    description: Highest mean share of reads with a substituted base at any offset. The bars name the offsets that carry the most.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: guide_substitution_profile
    aggregation: max
    column_name: mean_gap_pct
    column_type: float64
    secondary_layout: top_n
    breakdown_col: offset
    top_n_count: 3
    display:
      icon_name: mdi:dots-horizontal
      icon_color: grape
      caption: highest rates, by offset
      decimals: 1
    section: Substitutions at a glance
    tag: cs-sub-card-gap
    index: cs-sub-card-gap
    title: Peak gap rate (%)
    description: Highest mean share of reads with a gap at any offset. A nuclease cut shows as a peak at offset 0.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: guide_substitution_profile
    aggregation: average
    column_name: mean_substitution_pct
    column_type: float64
    filter_expr: col('libraries') > 0
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-histogram
      icon_color: cyan
      caption: offsets, by mean rate
    section: Substitutions at a glance
    tag: cs-sub-card-typical
    index: cs-sub-card-typical
    title: Background substitution rate (%)
    description: Average of the mean substitution rate over the offsets and guides in view, the background the peak stands out from.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: crisprseq
    data_collection_tag: guide_substitution_profile
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: libraries
    column_type: int64
    display:
      icon_name: mdi:test-tube
      icon_color: teal
      caption: median libraries, with their spread
      decimals: 0
    section: Substitutions at a glance
    tag: cs-sub-card-libraries
    index: cs-sub-card-libraries
    title: Libraries behind an offset
    description: Libraries of a guide whose amplicon reaches an offset, median over the offsets and guides in view.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: crisprseq
    data_collection_tag: guide_substitutions
    viz_kind: complex_heatmap
    config:
      viz_kind: complex_heatmap
      index_column: guide
      value_columns_pattern: "^[-+]?[0-9]+$"
      cluster_rows: true
      cluster_cols: false
      cluster_method: ward
      cluster_metric: euclidean
      normalize: log1p
      colorscale: Blues
    section: Substitutions per guide
    tag: cs-sub-av-heatmap
    index: cs-sub-av-heatmap
    title: Substitution rate per guide and offset
    description: Mean share of reads with a substituted base, one row per guide and one column per offset from the cut site, on a log(1 + rate) colour scale so a few hot positions do not wash out the rest; rows cluster by profile.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: crisprseq
    data_collection_tag: guide_substitution_profile
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: profile_guide
      x_col: offset
      y_col: mean_substitution_pct
      lower_col: q1_substitution_pct
      upper_col: q3_substitution_pct
      reference_x: 0
      reference_label: Cut site
      x_title: Offset from the cut site (bp)
      y_title: Reads with a substituted base (%)
      legend_pos: none
    section: Guide profile
    tag: cs-sub-av-guide-subs
    index: cs-sub-av-guide-subs
    title: Substitution rate around the cut site
    description: Mean share of reads carrying a base other than the dominant one at each offset over the guide's libraries, with their band; a curve above its band means a minority of libraries carries the substitution.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: crisprseq
    data_collection_tag: guide_substitution_profile
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: profile_guide
      x_col: offset
      y_col: mean_gap_pct
      lower_col: q1_gap_pct
      upper_col: q3_gap_pct
      reference_x: 0
      reference_label: Cut site
      x_title: Offset from the cut site (bp)
      y_title: Reads with a gap (%)
      legend_pos: none
    section: Guide profile
    tag: cs-sub-av-guide-gaps
    index: cs-sub-av-guide-gaps
    title: Gap rate around the cut site
    description: Mean share of reads with a gap at each offset over the guide's libraries, with their band; a nuclease cut shows as a peak at offset 0.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: table
    workflow_tag: crisprseq
    data_collection_tag: guide_substitution_profile
    columns: [profile_guide, offset, mean_substitution_pct, median_substitution_pct, q1_substitution_pct, q3_substitution_pct, mean_gap_pct, median_gap_pct, q1_gap_pct, q3_gap_pct, libraries]
    section: Substitution tables
    tag: cs-sub-table
    index: cs-sub-table
    title: Substitution and gap rate per offset
    description: Mean, median and quartiles of the substitution and gap rates at every offset of the profile window.
    layout: {x: 0, y: 0, w: 8, h: 6}
