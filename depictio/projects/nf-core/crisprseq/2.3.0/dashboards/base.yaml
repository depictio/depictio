      selection_enabled: true
      selection_column: sample
    section: Library detail
    tag: cs-out-av-frameshift
    index: cs-out-av-frameshift
    title: Frameshift share against editing
    description: >-
      Which libraries edit often and out of frame? Each point is one library, placed by its edited share of the classified reads and by the share of its indel reads that shift the reading frame, and sized by its classified reads.

      How to read: the upper right holds libraries edited often with disruptive indels, the likely knockouts. A library on the right but low on the vertical axis has edits that are mostly in frame and leave more of the protein intact, and one at the far left has little editing to read a frame share from. Click a library to open its record on the right.

      Note: a frame share needs indel reads, so a library with very few of them can sit anywhere on the vertical axis. No cut-off is drawn. Frameshift is an indel whose length is not a multiple of 3, as the CIGAR parser calls it (https://nf-co.re/crisprseq/2.3.0/docs/output).
