# =========================================================================
# Tab 4 - Indel spectrum: one guide's size and position signature
# =========================================================================
# A run has thousands of libraries, so the tab shows one guide at a time: the
# tab-local Guide picker (always holding one guide) narrows the samplesheet,
# which narrows every collection of the tab through the samplesheet links. The
# curves are the median library with the interquartile band of the guide's
# libraries, summarised in the recipes.
- title: Indel spectrum
  subtitle: The repair signature of one guide, as indel sizes, positions around the cut site and alleles
  tab_order: 4
  tab_icon: mdi:chart-bell-curve
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Guide picker
    icon: mdi:dna
    color: orange
    description: The guide the tab shows; it opens on the first guide of the run
  - name: Indel scope
    icon: mdi:tune
    color: orange
    description: Narrow the alleles by type, frame or peak membership, and the size axis
  grid_sections:
  - name: Size signature
    icon: mdi:chart-bell-curve
    color: orange
    description: Share of reads at every signed indel size, median library of the guide with its interquartile band
  - name: Position around the cut site
    icon: mdi:chart-line
    color: orange
    description: Deletion coverage and insertion rate at every offset from the cut site, median library with its interquartile band
  - name: Allele map
    icon: mdi:chart-scatter-plot
    color: orange
    description: The guide's most frequent indel alleles by position and size
  - name: Indel tables
    icon: mdi:table
    color: gray
    description: The guide's alleles pooled over its libraries, and the alleles of each library
    collapsed: true
  components:
  - component_type: text
    tag: cs-ind-intro
    section: Size signature
    workflow_tag: crisprseq
    data_collection_tag: guide_indel_sizes
    title: How the cut is repaired
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The tab shows one guide, opening on the first guide of the run; pick
      another in the Guide picker on the left. Each curve is the guide's median
      library with a band over its middle half of libraries, and offsets are
      relative to the cut site the pipeline reports.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: cs-ind-av-guide-sizes
    index: cs-ind-av-guide-sizes
    section: Size signature
    workflow_tag: crisprseq
    data_collection_tag: guide_indel_sizes
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: guide
      x_col: size
      y_col: median_pct_reads
      lower_col: q1_pct_reads
      upper_col: q3_pct_reads
      reference_x: 0
      reference_label: Deletions left, insertions right
      x_title: Indel size (bp)
      y_title: Share of classified reads (%)
      legend_pos: none
    title: Indel size distribution of the guide
    description: Median share of the classified reads at every signed indel size over the guide's libraries, with the band from the first to the third quartile. A narrow band means the libraries repair the cut the same way.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: advanced_viz
    tag: cs-ind-av-guide-deletions
    index: cs-ind-av-guide-deletions
    section: Position around the cut site
    workflow_tag: crisprseq
    data_collection_tag: guide_cut_site_profile
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: guide
      x_col: offset
      y_col: median_deletion_pct
      lower_col: q1_deletion_pct
      upper_col: q3_deletion_pct
      reference_x: 0
      reference_label: Cut site
      x_title: Offset from the cut site (bp)
      y_title: Reads with a deletion covering the position (%)
      legend_pos: none
    title: Deletion coverage around the cut site
    description: Median share of reads whose deletion spans each position, with the interquartile band of the guide's libraries. A nuclease cut shows as a peak straddling offset 0.
    title_size: h3
    layout: {x: 0, y: 0, w: 4, h: 7}
  - component_type: advanced_viz
    tag: cs-ind-av-guide-insertions
    index: cs-ind-av-guide-insertions
    section: Position around the cut site
    workflow_tag: crisprseq
    data_collection_tag: guide_cut_site_profile
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: guide
      x_col: offset
      y_col: median_insertion_pct
      lower_col: q1_insertion_pct
      upper_col: q3_insertion_pct
      reference_x: 0
      reference_label: Cut site
      x_title: Offset from the cut site (bp)
      y_title: Reads with an insertion at the position (%)
      legend_pos: none
    title: Insertion position around the cut site
    description: Median share of reads with an insertion starting at each position, with the interquartile band of the guide's libraries.
    title_size: h3
    layout: {x: 4, y: 0, w: 4, h: 7}
  - component_type: advanced_viz
    tag: cs-ind-av-allele-map
    index: cs-ind-av-allele-map
    section: Allele map
    workflow_tag: crisprseq
    data_collection_tag: guide_alleles
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: offset
      y_col: size
      label_col: allele
      color_col: indel_type
      size_col: pct_reads
      x_title: Offset from the cut site (bp)
      y_title: Indel size (bp)
      top_n_labels: 0
      legend_pos: bottom
    title: Indel alleles of the guide by position and size
    description: One point per allele of the guide, pooled over its libraries, sized by its share of the guide's classified reads and coloured by type. Alleles at offset 0 sit at the cut; a trail along one size is a deletion placed at shifting offsets.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: table
    tag: cs-ind-table-guide-alleles
    section: Indel tables
    workflow_tag: crisprseq
    data_collection_tag: guide_alleles
    columns: [allele, libraries, pct_reads, reads, indel_type, size, offset, frame, peak, median_pct_reads, rank]
    title: Indel alleles of the guide
    description: The guide's most frequent alleles pooled over its libraries, with how many libraries carry each, its share of the guide's classified reads and its median share where present.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    tag: cs-ind-table-alleles
    section: Indel tables
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_indels
    use: crisprseq/indels
    row_selection_enabled: true
    row_selection_column: allele
    title: Indel alleles per library
    description: Every distinct allele of the guide's libraries with type, size, offset, frame, peak membership and read share, ranked within its library.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: interactive
    tag: cs-ind-filter-guide
    index: cs-ind-guide-filter
    section: Guide picker
    group: Guide
    workflow_tag: crisprseq
    data_collection_tag: samples
    interactive_component_type: Select
    always_selected: true
    column_name: guide
    column_type: object
    display: {title_size: md, custom_color: '#EF6C00', icon_name: 'mdi:dna'}
    placement: left
    title: Guide
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: cs-ind-filter-type
    index: cs-ind-type-filter
    section: Indel scope
    group: Alleles
    workflow_tag: crisprseq
    data_collection_tag: guide_alleles
    interactive_component_type: MultiSelect
    column_name: indel_type
    column_type: object
    display: {title_size: md, custom_color: '#FB8C00', icon_name: 'mdi:dna'}
    placement: left
    title: Indel type
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: cs-ind-filter-frame
    index: cs-ind-frame-filter
    section: Indel scope
    group: Alleles
    workflow_tag: crisprseq
    data_collection_tag: guide_alleles
    interactive_component_type: MultiSelect
    column_name: frame
    column_type: object
    display: {title_size: md, custom_color: '#F4511E', icon_name: 'mdi:arrow-expand-horizontal'}
    placement: left
    title: Frame
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: cs-ind-filter-peak
    index: cs-ind-peak-filter
    section: Indel scope
    group: Alleles
    workflow_tag: crisprseq
    data_collection_tag: guide_alleles
    interactive_component_type: MultiSelect
    column_name: peak
    column_type: object
    display: {title_size: md, custom_color: '#EF6C00', icon_name: 'mdi:chart-bell-curve'}
    placement: left
    title: Main indel peak
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: cs-ind-filter-size
    index: cs-ind-size-range
    section: Indel scope
    group: Size axis
    workflow_tag: crisprseq
    data_collection_tag: guide_indel_sizes
    interactive_component_type: RangeSlider
    column_name: size
    column_type: int64
    display: {title_size: md, custom_color: '#E65100', icon_name: 'mdi:ruler'}
    placement: left
    title: Indel size (bp)
    layout: {x: 0, y: 9, w: 1, h: 3}

# =========================================================================
# Tab 5 - Substitutions: the guides side by side, then one guide's profile
# =========================================================================
# The heatmap compares every guide; the Guide picker (always holding one guide)
# sits on the per-guide profile collection alone, whose guide column is named
# `profile_guide` so the pick matches no other collection's column: it narrows
# the two curves and their table, while the heatmap, the glance cards and the
# pinned tables stay at the scope of the library filters.
- title: Substitutions
  subtitle: Base substitution and gap rates around the cut site, over the guides and for one guide
  tab_order: 5
  tab_icon: mdi:waves
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Guide picker
    icon: mdi:dna
    color: cyan
    description: The guide the profile section shows; it opens on the first guide of the run and leaves the heatmap and the cards whole
  - name: Position scope
    icon: mdi:tune
    color: cyan
    description: Narrow the guide profiles to a band of offsets
  grid_sections:
  - name: Substitutions per guide
    icon: mdi:chart-box-outline
    color: cyan
    description: Mean substitution rate per guide and offset from the cut site
  - name: Guide profile
    icon: mdi:chart-line
    color: cyan
    description: Substitution and gap rate along the amplicon, mean library of the picked guide with its interquartile band
  - name: Substitution tables
    icon: mdi:table
    color: gray
    description: The picked guide's rates per offset
    collapsed: true
  components:
  - component_type: text
    tag: cs-sub-intro
    section: Substitutions per guide
    workflow_tag: crisprseq
    data_collection_tag: guide_substitutions
    title: Base changes near the cut
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A base editor leaves a band of substitutions a few bases upstream of the
      cut, a nuclease leaves the matrix flat and a gap peak at the cut. The
      heatmap and the cards cover every guide in scope; the Guide picker on the
      left changes only the profile below, which opens on the first guide.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: cs-sub-av-heatmap
    index: cs-sub-av-heatmap
    section: Substitutions per guide
    workflow_tag: crisprseq
    data_collection_tag: guide_substitutions
    viz_kind: complex_heatmap
    config:
      viz_kind: complex_heatmap
      index_column: guide
      value_columns_pattern: "^[-+]?[0-9]+$"
      cluster_rows: true
      cluster_cols: false
      cluster_method: ward
      cluster_metric: euclidean
      normalize: log1p
      colorscale: Blues
    title: Substitution rate per guide and offset
    description: Mean share of reads with a substituted base, one row per guide and one column per offset from the cut site, on a log(1 + rate) colour scale so a few hot positions do not wash out the rest; rows cluster by profile.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 8}
  - component_type: advanced_viz
    tag: cs-sub-av-guide-subs
    index: cs-sub-av-guide-subs
    section: Guide profile
    workflow_tag: crisprseq
    data_collection_tag: guide_substitution_profile
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: profile_guide
      x_col: offset
      y_col: mean_substitution_pct
      lower_col: q1_substitution_pct
      upper_col: q3_substitution_pct
      reference_x: 0
      reference_label: Cut site
      x_title: Offset from the cut site (bp)
      y_title: Reads with a substituted base (%)
      legend_pos: none
    title: Substitution rate around the cut site
    description: Mean share of reads carrying a base other than the dominant one at each offset over the picked guide's libraries, with their interquartile band; a curve above its band means a minority of libraries carries the substitution. Offsets most libraries do not reach are left out.
    title_size: h3
    layout: {x: 0, y: 0, w: 4, h: 7}
  - component_type: advanced_viz
    tag: cs-sub-av-guide-gaps
    index: cs-sub-av-guide-gaps
    section: Guide profile
    workflow_tag: crisprseq
    data_collection_tag: guide_substitution_profile
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: profile_guide
      x_col: offset
      y_col: mean_gap_pct
      lower_col: q1_gap_pct
      upper_col: q3_gap_pct
      reference_x: 0
      reference_label: Cut site
      x_title: Offset from the cut site (bp)
      y_title: Reads with a gap (%)
      legend_pos: none
    title: Gap rate around the cut site
    description: Mean share of reads with a gap at each offset over the picked guide's libraries, with their interquartile band; a nuclease cut shows as a peak at offset 0. Offsets most libraries do not reach, the amplicon ends where the alignment leaves gaps, are left out.
    title_size: h3
    layout: {x: 4, y: 0, w: 4, h: 7}
  - component_type: table
    tag: cs-sub-table
    section: Substitution tables
    workflow_tag: crisprseq
    data_collection_tag: guide_substitution_profile
    columns: [offset, mean_substitution_pct, median_substitution_pct, q1_substitution_pct, q3_substitution_pct, mean_gap_pct, median_gap_pct, q1_gap_pct, q3_gap_pct, libraries]
    title: Substitution and gap rate per offset
    description: Mean, median and quartiles of the substitution and gap rates at every offset of the profile window, for the picked guide.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: interactive
    tag: cs-sub-filter-guide
    index: cs-sub-guide-filter
    section: Guide picker
    group: Guide
    workflow_tag: crisprseq
    data_collection_tag: guide_substitution_profile
    interactive_component_type: Select
    always_selected: true
    column_name: profile_guide
    column_type: object
    display: {title_size: md, custom_color: '#0097A7', icon_name: 'mdi:dna'}
    placement: left
    title: Guide
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: cs-sub-filter-offset
    index: cs-sub-offset-range
    section: Position scope
    group: Positions
    workflow_tag: crisprseq
    data_collection_tag: guide_substitution_profile
    interactive_component_type: RangeSlider
    column_name: offset
    column_type: int64
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:ruler'}
    placement: left
    title: Offset from the cut site (bp)
    layout: {x: 0, y: 0, w: 1, h: 3}

