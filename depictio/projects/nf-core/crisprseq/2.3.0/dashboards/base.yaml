# nf-core/crisprseq 2.3.0 dashboard (targeted analysis).
#
# The pipeline writes no MultiQC report, so the landing tab is an Overview. Two
# units carry every tile: the library (one amplicon sequencing library, the
# `sample` of the samplesheet) and the guide (its protospacer). The tabs are a
# funnel:
#   Overview        how much editing each guide achieved and what kind;
#   Read QC         whether each library had the depth and alignment to call it;
#   Edit outcomes   frameshift against editing and the clonality call, per library;
#   Indel spectrum  the size and position signature of one guide's repair;
#   Substitutions   substitution rates over the guides, then one guide's profile;
#   Guides          the guides side by side, with a record per guide.
# Two pinned persistent sections ride every tab: the four run cards and the
# collapsed sample sheet; the per-library summary table is pinned at the bottom.
# The library filters are persistent; the design column they group on is
# GROUP_COL (default `protospacer`). Guide-level collections follow them through
# the samplesheet's `guide` link. Profiles along the amplicon are drawn per guide
# (median library and interquartile band) behind a tab-local Guide picker that
# always holds one guide: one curve per library does not read at thousands of
# libraries.
version: 1
main_dashboard:
  title: nf-core/crisprseq
  subtitle: "Targeted gene editing: how often each guide edits its amplicon, which repair outcomes it leaves and whether the libraries support the call"
  advanced_viz_controls: header
  project_tag: crisprseq Gene Editing
  main_tab_name: Overview
  tab_icon: mdi:view-dashboard-outline
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Library filters
    icon: mdi:filter-variant
    color: teal
    description: Samplesheet libraries and groups, applied to every tab through the samplesheet links
    persistent: true
    pin: top
  - name: Overview scope
    icon: mdi:tune
    color: teal
    description: Keep libraries inside an editing band
  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: Libraries, guides by editing level, and reads in the current scope with their spread per library
    persistent: true
    pin: top
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The samplesheet every other tab is filtered by
    collapsed: true
    persistent: true
    pin: top
  - name: Editing at a glance
    icon: mdi:chart-box-outline
    color: teal
    description: Editing and frameshift rates over the libraries, and the edited reads behind them
  - name: Outcome composition per guide
    icon: mdi:chart-bar
    color: teal
    description: Share of each guide's reads per repair outcome
  - name: Editing against depth
    icon: mdi:chart-scatter-plot
    color: teal
    description: Editing rate of every library against its classified reads
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The per-library summary behind the tiles, on every tab
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # ----------------------------------------------------------- glance strip
  - component_type: card
    tag: cs-glance-libraries
    section: Run at a glance
    workflow_tag: crisprseq
    data_collection_tag: samples
    aggregation: nunique
    column_name: sample
    column_type: object
    secondary_layout: composition
    breakdown_col: has_template
    display: {icon_name: 'mdi:test-tube', title_font_size: xl, value_font_size: xl}
    title: Libraries
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: cs-glance-guides
    section: Run at a glance
    workflow_tag: crisprseq
    data_collection_tag: guide_summary
    aggregation: nunique
    column_name: guide
    column_type: object
    secondary_layout: donut
    breakdown_col: edit_class
    display: {icon_name: 'mdi:dna', title_font_size: xl, value_font_size: xl}
    title: Guides
    title_size: sm
    title_align: left
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: cs-glance-raw-reads
    section: Run at a glance
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/edit_summary
    aggregation: sum
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: raw_reads
    column_type: int64
    display: {icon_name: 'mdi:file-document-outline', title_font_size: xl, value_font_size: xl}
    title: Raw reads
    title_size: sm
    title_align: left
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: cs-glance-classified
    section: Run at a glance
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/edit_summary
    aggregation: sum
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: classified_reads
    column_type: int64
    display: {icon_name: 'mdi:check-decagram', title_font_size: xl, value_font_size: xl}
    title: Classified reads
    title_size: sm
    title_align: left
    layout: {x: 6, y: 0, w: 2, h: 2}

  # ------------------------------------------------------------ sample sheet
  - component_type: text
    tag: cs-sheet-intro
    section: Sample sheet
    workflow_tag: crisprseq
    data_collection_tag: samples
    title: The samplesheet the run started from
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per library, with the guide it was edited with and whether it had
      a donor template. The filters on the left select rows of this table.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: cs-sheet-table
    section: Sample sheet
    workflow_tag: crisprseq
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample
    title: Samplesheet
    description: Library, guide and donor template of every library, plus the other samplesheet columns.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 4}

  # ------------------------------------------------------- reference tables
  - component_type: table
    tag: cs-ref-summary
    section: Reference tables
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/edit_summary
    row_selection_enabled: true
    row_selection_column: sample
    title: Editing outcome per library
    description: Read accounting, reads per outcome class and the editing rates, one row per library.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 4}

  # ------------------------------------------------------ editing at a glance
  - component_type: text
    tag: cs-ov-intro
    section: Editing at a glance
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    title: How much editing, and of which kind
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Rates are shares of each library's classified reads, and the rate cards
      give their median over the libraries in scope. Frameshift edits are the
      ones that knock a coding gene out; template-based repair from a donor
      shows as its own class in the composition bars.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: cs-ov-card-edited
    section: Editing at a glance
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/edit_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: edited_pct
    column_type: float64
    display: {icon_name: 'mdi:target', title_font_size: xl, value_font_size: xl}
    title: Edited reads (%)
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cs-ov-card-frameshift
    section: Editing at a glance
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/edit_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: frameshift_pct
    column_type: float64
    display: {icon_name: 'mdi:arrow-expand-horizontal', title_font_size: xl, value_font_size: xl}
    title: Frameshift reads (%)
    title_size: sm
    title_align: left
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cs-ov-card-frameshift-of-indels
    section: Editing at a glance
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/edit_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: frameshift_of_indels_pct
    column_type: float64
    display: {icon_name: 'mdi:chart-donut', title_font_size: xl, value_font_size: xl}
    title: Frameshift share of indels (%)
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cs-ov-card-edited-reads
    section: Editing at a glance
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/edit_summary
    aggregation: sum
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: edited_reads
    column_type: int64
    display: {icon_name: 'mdi:content-cut', title_font_size: xl, value_font_size: xl}
    title: Edited reads (count)
    title_size: sm
    title_align: left
    layout: {x: 6, y: 2, w: 2, h: 2}

  # --------------------------------------------- outcome composition per guide
  - component_type: advanced_viz
    tag: cs-ov-av-guide-outcomes
    index: cs-ov-av-guide-outcomes
    section: Outcome composition per guide
    workflow_tag: crisprseq
    data_collection_tag: guide_outcomes
    viz_kind: stacked_taxonomy
    config:
      viz_kind: stacked_taxonomy
      sample_id_col: guide
      taxon_col: outcome
      rank_col: level
      abundance_col: pct
      top_n: 12
      sort_by: abundance
      normalise_to_one: true
      sample_sort: first_taxon
    title: Repair outcomes per guide
    description: Share of each guide's classified reads per outcome, reads pooled over the guide's libraries. Guides are ordered by the share of the run's most common outcome; hover a bar for its guide.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 8}

  # ---------------------------------------------------- editing against depth
  - component_type: advanced_viz
    tag: cs-ov-av-editing-depth
    index: cs-ov-av-editing-depth
    section: Editing against depth
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/editing_vs_depth
    config:
      x_title: Classified reads
      y_title: Edited reads (%)
      log_x: true
      density_threshold: 8000
      legend_pos: bottom
      selection_enabled: true
      selection_column: sample
    title: Editing rate against library depth
    description: One point per library. Extreme rates at low depth rest on few reads; lasso a group to filter the other tiles.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 7}

  # ------------------------------------------------------------- left panel
  - component_type: interactive
    tag: cs-filter-sample
    index: cs-sample-filter
    section: Library filters
    group: Libraries
    workflow_tag: crisprseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display: {title_size: md, custom_color: '#26A69A', icon_name: 'mdi:test-tube'}
    placement: left
    title: Library
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: cs-filter-group
    index: cs-group-filter
    section: Library filters
    group: Libraries
    workflow_tag: crisprseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: "{GROUP_COL}"
    column_type: object
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:account-group-outline'}
    placement: left
    title: "{GROUP_COL_DISPLAY}"
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: cs-filter-template
    index: cs-template-filter
    section: Library filters
    group: Libraries
    workflow_tag: crisprseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: has_template
    column_type: object
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:file-document-outline'}
    placement: left
    title: Donor template
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: cs-ov-filter-edited
    index: cs-ov-edited-range
    section: Overview scope
    group: Editing
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    interactive_component_type: RangeSlider
    column_name: edited_pct
    column_type: float64
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:target'}
    placement: left
    title: Edited reads (%)
    layout: {x: 0, y: 0, w: 1, h: 3}

tabs:
# =========================================================================
# Tab 2 - Read QC: depth and alignment per library
# =========================================================================
- title: Read QC
  subtitle: Whether each library had the reads and the alignment to support an editing call
  tab_order: 2
  tab_icon: mdi:shield-check-outline
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Read scope
    icon: mdi:tune
    color: blue
    description: Keep libraries inside a depth or alignment band
  grid_sections:
  - name: Reads at a glance
    icon: mdi:counter
    color: blue
    description: Depth, alignment and filtering over the libraries
  - name: Depth and alignment
    icon: mdi:chart-scatter-plot
    color: blue
    description: Raw reads against the aligned share, per library
  components:
  - component_type: text
    tag: cs-qc-intro
    section: Reads at a glance
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    title: Can each library be trusted
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The funnel follows the reads from sequencing to classification; a library
      that loses most of them on the way, or aligns poorly to its amplicon, gives
      a noisy editing rate. Read the depth scatter before the outcome tabs.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: cs-qc-card-raw
    section: Reads at a glance
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/edit_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: raw_reads
    column_type: int64
    display: {icon_name: 'mdi:file-document-outline', title_font_size: xl, value_font_size: xl}
    title: Raw reads per library
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cs-qc-card-funnel
    section: Reads at a glance
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/edit_summary
    aggregation: sum
    column_name: raw_reads
    column_type: int64
    secondary_layout: attrition
    attrition_cols: [raw_reads, clustered_reads, classified_reads]
    display: {icon_name: 'mdi:filter-variant', title_font_size: xl, value_font_size: xl}
    title: Read funnel
    title_size: sm
    title_align: left
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cs-qc-card-aligned
    section: Reads at a glance
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/edit_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: aligned_pct
    column_type: float64
    display: {icon_name: 'mdi:check-decagram', title_font_size: xl, value_font_size: xl}
    title: Aligned reads (%)
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cs-qc-card-filtered-indels
    section: Reads at a glance
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/edit_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: indels_failing_filter
    column_type: int64
    display: {icon_name: 'mdi:alert-outline', title_font_size: xl, value_font_size: xl}
    title: Indel reads filtered out
    title_size: sm
    title_align: left
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: cs-qc-av-depth-alignment
    index: cs-qc-av-depth-alignment
    section: Depth and alignment
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/depth_vs_alignment
    config:
      x_title: Raw reads
      y_title: Aligned reads (%)
      log_x: true
      density_threshold: 8000
      legend_pos: bottom
      selection_enabled: true
      selection_column: sample
    title: Depth against alignment per library
    description: One point per library. Libraries low on either axis carry too few amplicon reads to call an editing rate.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: interactive
    tag: cs-qc-filter-raw
    index: cs-qc-raw-range
    section: Read scope
    group: Reads
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    interactive_component_type: RangeSlider
    column_name: raw_reads
    column_type: int64
    display: {title_size: md, custom_color: '#1E88E5', icon_name: 'mdi:file-document-outline'}
    placement: left
    title: Raw reads
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: cs-qc-filter-aligned
    index: cs-qc-aligned-range
    section: Read scope
    group: Reads
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    interactive_component_type: RangeSlider
    column_name: aligned_pct
    column_type: float64
    display: {title_size: md, custom_color: '#3949AB', icon_name: 'mdi:check-decagram'}
    placement: left
    title: Aligned reads (%)
    layout: {x: 0, y: 3, w: 1, h: 3}

# =========================================================================
# Tab 3 - Edit outcomes: frameshift, clonality, one record per library
# =========================================================================
- title: Edit outcomes
  subtitle: Which libraries carry disruptive edits, and how the clonality classifier called them
  tab_order: 3
  tab_icon: mdi:target
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Outcome scope
    icon: mdi:tune
    color: grape
    description: Narrow by clonality call or by the frameshift share of the indels
  grid_sections:
  - name: Outcomes at a glance
    icon: mdi:counter
    color: grape
    description: In-frame edits and the clonality calls over the libraries
  - name: Library detail
    icon: mdi:file-document-outline
    color: grape
    description: Pick a library in the scatter to read its record
  - name: Outcome tables
    icon: mdi:table
    color: gray
    description: Clonality calls and outcome counts per library
    collapsed: true
  components:
  - component_type: text
    tag: cs-out-intro
    section: Outcomes at a glance
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_clonality
    title: Disruptive edits and zygosity
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A knockout needs edits that shift the reading frame, so compare the
      frameshift share of the indels with the editing rate. Click a library in
      the scatter to open its record beside it.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: cs-out-card-inframe
    section: Outcomes at a glance
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/edit_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: inframe_pct
    column_type: float64
    display: {icon_name: 'mdi:ruler', title_font_size: xl, value_font_size: xl}
    title: In-frame reads (%)
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cs-out-card-classification
    section: Outcomes at a glance
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_clonality
    use: crisprseq/clonality
    aggregation: nunique
    column_name: sample
    column_type: object
    secondary_layout: donut
    breakdown_col: classification
    display: {icon_name: 'mdi:chart-donut', title_font_size: xl, value_font_size: xl}
    title: Libraries by zygosity class
    title_size: sm
    title_align: left
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cs-out-card-clonality
    section: Outcomes at a glance
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_clonality
    use: crisprseq/clonality
    aggregation: nunique
    column_name: sample
    column_type: object
    secondary_layout: donut
    breakdown_col: clonality
    display: {icon_name: 'mdi:family-tree', title_font_size: xl, value_font_size: xl}
    title: Libraries by clonality
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cs-out-card-confidence
    section: Outcomes at a glance
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_clonality
    use: crisprseq/clonality
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: class_confidence
    column_type: float64
    display: {icon_name: 'mdi:shield-check-outline', title_font_size: xl, value_font_size: xl}
    title: Classifier confidence
    title_size: sm
    title_align: left
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: cs-out-av-frameshift
    index: cs-out-av-frameshift
    section: Library detail
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    use: crisprseq/frameshift_vs_editing
    config:
      x_title: Edited reads (%)
      y_title: Frameshift share of the indels (%)
      density_threshold: 8000
      legend_pos: bottom
      selection_enabled: true
      selection_column: sample
    title: Frameshift share against editing
    description: One point per library, sized by classified reads. The upper right holds the libraries edited often and disruptively.
    title_size: h3
    layout: {x: 0, y: 0, w: 5, h: 7}
  - component_type: advanced_viz
    tag: cs-out-av-library-record
    index: cs-out-av-library-record
    section: Library detail
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_edit_summary
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: cs-out-av-frameshift
      id_col: sample
      selection_source: scatter_selection
      sections:
        Reads: [raw_reads, clustered_reads, aligned_pct, classified_reads]
        Rates: [edited_pct, frameshift_pct, inframe_pct, template_based_pct, frameshift_of_indels_pct]
        Outcome reads: [wt_reads, template_based_reads, delins_reads, ins_inframe_reads, ins_frameshift_reads, del_inframe_reads, del_frameshift_reads]
        Indel filters: [indels_failing_filter, indels_above_error_in_peak, indels_above_error_outside_peak, indels_below_error_in_peak, indels_below_error_outside_peak]
    title: Library record
    description: Read accounting, outcome rates and indel filter counts of the selected library.
    title_size: h3
    layout: {x: 5, y: 0, w: 3, h: 7}
  - component_type: table
    tag: cs-out-table-clonality
    section: Outcome tables
