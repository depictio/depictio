  - component_type: advanced_viz
    workflow_tag: crisprseq
    data_collection_tag: guide_indel_sizes
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: guide
      x_col: size
      y_col: mean_pct_reads
      lower_col: q1_pct_reads
      upper_col: q3_pct_reads
      reference_x: 0
      reference_label: Deletions left, insertions right
      x_title: Indel size (bp)
      y_title: Share of classified reads (%)
      legend_pos: none
    section: Size signature
    tag: cs-ind-av-guide-sizes
    index: cs-ind-av-guide-sizes
    title: Indel size distribution of the guide
    description: >-
      How big are the indels of the guide? The curve is the mean share of the classified reads at every signed indel size over the guide's libraries, deletions negative and insertions positive, with a band from the first to the third quartile of the libraries.

      How to read: a tall narrow peak at one size is a predictable repair, such as a 1 bp insertion or a deletion with a repeated flank, and a flat curve is a scattered one. A narrow band means the libraries repair the cut alike, and a curve above its band means a minority of libraries carries the signal. Compare with another guide from the picker on the left.

      Lines and annotations: the vertical marker at size 0, labelled Deletions left, insertions right, separates the two signs. It is a landmark on the size axis, not the cut site and not a cut-off. The band is the guide's own first and third quartile, a reference the data defines.

      Note: only sizes within 100 bp are drawn, a fixed window of this template, and a library without an indel of a size counts as zero there.

      Source: nf-core/crisprseq output documentation, https://nf-co.re/crisprseq/2.3.0/docs/output
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: crisprseq
    data_collection_tag: guide_indel_size_matrix
    viz_kind: complex_heatmap
    config:
      viz_kind: complex_heatmap
      index_column: size_guide
      value_columns_pattern: "^[-+]?[0-9]+$"
      cluster_rows: true
      cluster_cols: false
      cluster_method: ward
      cluster_metric: euclidean
      normalize: log1p
      colorscale: Oranges
    section: Guide comparison
    tag: cs-ind-av-size-heatmap
    index: cs-ind-av-size-heatmap
    title: Indel size per guide
    description: >-
      Which guides repair alike? Each row is one guide, each column a signed indel size (deletions negative, insertions positive), and each cell the mean share of the guide's classified reads carrying an indel of that size.

      How to read: a guide with one bright cell has a predictable repair, such as a 1 bp insertion, and a row spread over many cells is a scattered one. Rows are clustered by signature, so guides that repair alike sit together. Pick one of them in the Guide picker on the left to read its curve with the band of its libraries.

      Note: no filter narrows this matrix, so it always shows every guide of the run; the Guide picker only sets the curve and the tables of the tab. Cells use a log(1 + share) colour scale, so a few bright cells do not wash out the rest; read relative differences and not the colour as a linear share. Only sizes within 30 bp are drawn, a fixed window of this template; the curve above draws 100 bp.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: crisprseq
    data_collection_tag: guide_cut_site_profile
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: guide
      x_col: offset
      y_col: mean_deletion_pct
      lower_col: q1_deletion_pct
      upper_col: q3_deletion_pct
      reference_x: 0
      reference_label: Cut site
      x_title: Offset from the cut site (bp)
      y_title: Reads with a deletion covering the position (%)
      legend_pos: none
    section: Position around the cut site
    tag: cs-ind-av-guide-deletions
    index: cs-ind-av-guide-deletions
    title: Deletion coverage around the cut site
    description: >-
      Where do deletions fall? The curve is the mean share of reads whose deletion spans each position, at each offset from the cut site, over the guide's libraries, with a band from the first to the third quartile of the libraries.

      How to read: a nuclease cut is expected to show as a peak near offset 0, and the width of the peak is how far the deletions reach. A peak displaced by a constant points at the cut-site convention below rather than at the biology, and a second peak elsewhere at a second target or an amplicon-end artefact; the allele map shows which alleles make a peak.

      Lines and annotations: the vertical marker at offset 0, labelled Cut site, is the cut site the pipeline reports for each amplicon (the cut_site column of the indel table and the _cutSite.json file). For some guides that convention may be shifted, which moves the curve by a constant and keeps its shape. It is a landmark, not a cut-off.



      Source: nf-core/crisprseq output documentation, https://nf-co.re/crisprseq/2.3.0/docs/output
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: advanced_viz
    workflow_tag: crisprseq
    data_collection_tag: guide_cut_site_profile
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: guide
      x_col: offset
      y_col: mean_insertion_pct
      lower_col: q1_insertion_pct
      upper_col: q3_insertion_pct
      reference_x: 0
      reference_label: Cut site
      x_title: Offset from the cut site (bp)
      y_title: Reads with an insertion at the position (%)
      legend_pos: none
    section: Position around the cut site
    tag: cs-ind-av-guide-insertions
    index: cs-ind-av-guide-insertions
    title: Insertion position around the cut site
    description: >-
      Where do insertions start? The curve is the mean share of reads with an insertion starting at each offset from the cut site, over the guide's libraries, with a band from the first to the third quartile of the libraries.

      How to read: insertions of a nuclease cut cluster at one or two positions next to the cut, so a single sharp peak is the expected shape. A flat curve means few insertions, and a peak far from the cut points at the cut-site convention below or at a second target.

      Lines and annotations: the vertical marker at offset 0, labelled Cut site, is the cut site the pipeline reports for each amplicon (the cut_site column of the indel table and the _cutSite.json file). For some guides that convention may be shifted, which moves the curve by a constant and keeps its shape. It is a landmark, not a cut-off.



      Source: nf-core/crisprseq output documentation, https://nf-co.re/crisprseq/2.3.0/docs/output
    layout: {x: 4, y: 0, w: 4, h: 5}
  - component_type: advanced_viz
    workflow_tag: crisprseq
    data_collection_tag: guide_alleles
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: offset
      y_col: size
      label_col: allele
      color_col: indel_type
      size_col: pct_reads
      x_title: Offset from the cut site (bp)
      y_title: Indel size (bp)
      top_n_labels: 0
      density_threshold: 8000
      legend_pos: bottom
    section: Allele map
    tag: cs-ind-av-allele-map
    index: cs-ind-av-allele-map
    title: Indel alleles by position and size
    description: >-
      Which alleles make the signature? Each point is one allele of the picked guide, pooled over its libraries, placed by its start offset from the cut site and its signed size, sized by its share of the guide's classified reads and coloured by type.

      How to read: large points are the guide's frequent alleles. A horizontal trail is one size placed at shifting positions, and a vertical column is alleles of different sizes starting at the same position. Hover a point for its allele label, then find it in the allele table below.

      Note: the 200 most frequent alleles of each guide are kept, and offset 0 is the cut site the pipeline reports, whose convention may be shifted for some guides. No cut-off is drawn.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: crisprseq
    data_collection_tag: guide_alleles
    columns: [allele, libraries, pct_reads, reads, indel_type, size, offset, frame, peak, median_pct_reads, rank]
    section: Indel tables
    tag: cs-ind-table-guide-alleles
    index: cs-ind-table-guide-alleles
    title: Indel alleles of the guide
    description: >-
      Which alleles does the guide leave? The guide's most frequent alleles pooled over its libraries, with how many libraries carry each, its share of the classified reads and its median share where present.

      How to read: an allele carried by most libraries is a reproducible repair, and one carried by a single library may be noise or a library-specific event. Main peak marks the alleles inside the main indel cluster of at least half the libraries carrying them.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: crisprseq
    data_collection_tag: crisprseq_indels
    use: crisprseq/indels
    row_selection_enabled: true
    row_selection_column: allele
    section: Indel tables
    tag: cs-ind-table-alleles
    index: cs-ind-table-alleles
    title: Indel alleles per library
    description: >-
      Which alleles does each library carry? Every distinct allele of the guide's libraries with its type, size, offset, frame, peak membership and read share, ranked within its library.

      How to read: filter to one library on the left to read its alleles, and sort by rank to see the dominant ones. The read share is a share of the library's classified reads.
    layout: {x: 0, y: 6, w: 8, h: 6}

- title: Substitutions
  subtitle: Where around the cut do bases change or drop out?
  tab_group: Repair signature
  tab_order: 7
  tab_icon: mdi:waves
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Guide picker
    icon: mdi:dna
    color: cyan
    description: The guides the cards and profiles show, the first of the list until others are picked; the heatmap stays whole
  - name: Position scope
    icon: mdi:tune
    color: cyan
    description: Narrow the guide profiles to a band of offsets
  grid_sections:
  - name: Substitutions at a glance
    icon: mdi:counter
    color: cyan
    description: Peak substitution and gap rates, libraries and the spread of rates
  - name: Substitutions per guide
    icon: mdi:chart-box-outline
    color: cyan
    description: Mean substitution rate per guide and offset from the cut site
  - name: Guide profile
    icon: mdi:chart-line
    color: cyan
    description: Substitution and gap rate along the amplicon, mean library with its band
  - name: Substitution tables
    icon: mdi:table
    color: gray
    description: The picked guide's rates per offset
    collapsed: true
  components:
  # The pick sits on `profile_guide`, a column only the per-guide profile
  # carries, so it narrows the profile, its cards and its table and leaves the
  # heatmap and the pinned tables at the scope of the sample filters.
  - component_type: interactive
    workflow_tag: crisprseq
    data_collection_tag: guide_substitution_profile
    interactive_component_type: Select
    always_selected: true
    multiple: true
    column_name: profile_guide
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: violet
    placement: left
    section: Guide picker
    group: Guide
    tag: cs-sub-filter-guide
    index: cs-sub-guide-filter
