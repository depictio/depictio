    description: Share of a guide's indel reads at its most frequent size; high means a predictable repair.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: crisprseq
    data_collection_tag: guide_summary
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: median_edited_pct
      y_col: median_frameshift_of_indels_pct
      label_col: guide
      color_col: edit_quartile
      size_col: libraries
      x_title: Median edited reads (%)
      y_title: Median frameshift share of the indels (%)
      top_n_labels: 0
      legend_pos: bottom
      selection_enabled: true
      selection_column: guide
    section: Guide comparison
    tag: cs-gd-av-comparison
    index: cs-gd-av-comparison
    title: Editing against frameshift share per guide
    description: >-
      Which guides edit well, and do their edits shift the reading frame? Each point is one guide, placed by the median edited share and the median frameshift share of the indels over its libraries, sized by its libraries and coloured by the quartile of its median edited share.

      How to read: the upper right holds guides that edit often and mostly out of frame, the strongest knockout candidates; the lower right edits often but mostly in frame. A small point rests on few libraries, so weigh it less. Click a point to narrow the other tiles of the tab to that guide.

      Annotations: the colours are the quartiles of the median edited share among the guides of this run (highest, upper-middle, lower-middle, lowest). They rank the guides against each other and are not a threshold from a tool or a paper, so the bounds move with the run.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: crisprseq
    data_collection_tag: guide_outcomes
    viz_kind: stacked_bar
    config:
      viz_kind: stacked_bar
      sample_id_col: guide
      taxon_col: outcome
      rank_col: level
      abundance_col: pct
      top_n: 12
      sort_by: abundance
      normalise_to_one: true
      sample_sort: first_taxon
    section: Outcome composition
    tag: cs-gd-av-outcomes
    index: cs-gd-av-outcomes
    title: Repair outcomes per guide
    description: >-
      Which repairs does each guide leave? Each bar is one guide and each segment an outcome class, as a share of the guide's classified reads pooled over its libraries.

      How to read: guides are ordered by their largest class, so wild type heads the order and the guides on the left edit least. Compare the frameshift deletion segment across guides to see which repair dominates, and hover a bar for its guide. A guide whose mix differs from its neighbours has a different repair signature; open it in [Indel spectrum](tab:Indel spectrum).

      Note: shares are pooled over a guide's libraries by reads, so a deep library weighs more than a shallow one.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: crisprseq
    data_collection_tag: guide_summary
    columns: [guide, edit_quartile, libraries, median_edited_pct, iqr_edited_pct, median_frameshift_of_indels_pct]
    row_selection_enabled: true
    row_selection_column: guide
    section: Guide detail
    tag: cs-gd-table
    index: cs-gd-table
    title: Guides
    description: >-
      Which guides does the run hold? One row per guide with its editing quartile, libraries, the median edited share, the width of the middle half of its libraries and the median frameshift share.

      How to read: sort by a column to rank the guides, and select a row to open its full record. The quartile is a rank among the guides of this run and not a threshold, and a guide with few libraries rests its median on few observations.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: crisprseq
    data_collection_tag: guide_summary
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: cs-gd-table
      id_col: guide
      selection_source: table_selection
      sections:
        Guide: [guide, edit_quartile, libraries, classified_reads]
        Editing: [median_edited_pct, q1_edited_pct, q3_edited_pct, min_edited_pct, max_edited_pct, median_frameshift_pct, median_inframe_pct, median_template_based_pct, median_frameshift_of_indels_pct]
        Repair signature: [dominant_indel_size, dominant_indel_share_pct, classification_mix]
    section: Guide detail
    tag: cs-gd-av-guide-record
    index: cs-gd-av-guide-record
    title: Guide record
    description: >-
      What does the picked guide look like? Its libraries, editing rates, repair signature and clonality mix.

      How to read: the first and third quartile, minimum and maximum edited share show how far its libraries disagree, and the dominant indel size with its share says how predictable the repair is. A wide gap between the minimum and maximum means the median rests on libraries that differ; check them in [Replicates & QC](tab:Replicates & QC).
    layout: {x: 5, y: 0, w: 3, h: 6}

