      icon_name: mdi:dna
      icon_color: orange.9
      caption: distinct alleles, by type
    section: Signature at a glance
    tag: cs-ind-card-alleles
    index: cs-ind-card-alleles
    title: Indel alleles
    description: Distinct alleles of the libraries in view, by type, position and length.
