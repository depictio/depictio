- title: Library QC
  subtitle: Is each library a small RNA library, and a clean one?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:test-tube
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Library filters
    icon: mdi:tune
    color: teal
    description: Keeps the libraries inside a depth or composition range
  grid_sections:
  - name: Libraries at a glance
    icon: mdi:counter
    color: teal
    description: How much of each library is miRNA, how deep and how diverse
  - name: Read length and complexity
    icon: mdi:ruler
    color: blue
    description: Where the reads pile up, and how many miRNAs more reads would add
  - name: RNA composition
    icon: mdi:chart-bar
    color: cyan
    description: RNA types, read QC outcomes and organism clades per library
  - name: Library profile
    icon: mdi:chart-timeline-variant
    color: grape
    description: Every per-library measure on one line, to spot the odd library out
  - name: Library detail
    icon: mdi:information-outline
    color: gray
    description: Depth against miRNA share; pick a library to read its record
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [miRTrace](https://github.com/friedlanderlab/mirtrace) sorts each library's reads by
      length, RNA type and organism clade. A clean small RNA library peaks at 20 to 24 nt and is
      mostly miRNA. Click a curve to narrow every tab to that library.
    tag: sr-lib-intro
    index: lib-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: smrnaseq
    data_collection_tag: samples
    interactive_component_type: RangeSlider
    column_name: mirna_reads
    column_type: int64
    display:
      icon_name: mdi:chart-bar
      custom_color: blue
    section: Library filters
    group: Depth
    tag: sr-lib-filter-reads
    index: lib-reads-range
    title: Reads on miRNAs
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: smrnaseq
    data_collection_tag: samples
    interactive_component_type: RangeSlider
    column_name: mirnas_detected
    column_type: int64
    display:
      icon_name: mdi:dna
      custom_color: cyan
    section: Library filters
    group: Depth
    tag: sr-lib-filter-detected
    index: lib-detected-range
    title: miRNAs detected
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: smrnaseq
    data_collection_tag: samples
    interactive_component_type: RangeSlider
    column_name: mirna_pct
    column_type: float64
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: Library filters
    group: Composition
    tag: sr-lib-filter-mirna
    index: lib-mirna-range
    title: miRNA reads (%)
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: smrnaseq
    data_collection_tag: samples
    interactive_component_type: RangeSlider
    column_name: rrna_pct
    column_type: float64
    display:
      icon_name: mdi:alert-outline
      custom_color: red
    section: Library filters
    group: Composition
    tag: sr-lib-filter-rrna
    index: lib-rrna-range
    title: rRNA reads (%)
    layout: {x: 0, y: 9, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: smrnaseq
    data_collection_tag: samples
    interactive_component_type: RangeSlider
    column_name: trna_pct
    column_type: float64
    display:
      icon_name: mdi:alert-circle-outline
      custom_color: orange
    section: Library filters
    group: Composition
    tag: sr-lib-filter-trna
    index: lib-trna-range
    title: tRNA reads (%)
    layout: {x: 0, y: 12, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: smrnaseq
    data_collection_tag: samples
    interactive_component_type: RangeSlider
    column_name: top_clade_pct
    column_type: float64
    display:
      icon_name: mdi:shield-check-outline
      custom_color: grape
    section: Library filters
    group: Composition
    tag: sr-lib-filter-clade
    index: lib-clade-range
    title: miRNAs in the main clade (%)
    layout: {x: 0, y: 15, w: 1, h: 3}
  # The two miRTrace shares read the composition table, one row per library and
  # RNA type, so the cards go with it on a run without a MultiQC report.
  - component_type: card
    workflow_tag: smrnaseq
    data_collection_tag: mirtrace_composition
    use: multiqc/mirtrace_composition
    aggregation: median
    column_name: percent
    column_type: float64
    filter_expr: (col('rank') == 'RNA type') & (col('taxon') == 'miRNA')
    secondary_layout: coverage
    coverage_max: 100
    display:
      icon_name: mdi:test-tube
      icon_color: teal
      caption: median share of a library's reads
      decimals: 1
    section: Libraries at a glance
    tag: sr-lib-card-mirna
    index: lib-card-mirna
    title: miRNA reads (%)
    description: Median share of a library's reads miRTrace calls miRNA.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: smrnaseq
    data_collection_tag: mirtrace_composition
    use: multiqc/mirtrace_composition
    aggregation: median
    column_name: percent
    column_type: float64
    filter_expr: (col('rank') == 'RNA type') & (col('taxon') == 'rRNA')
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:alert-outline
      icon_color: red
      caption: median per library, with its spread
      decimals: 1
    section: Libraries at a glance
    tag: sr-lib-card-rrna
    index: lib-card-rrna
    title: rRNA reads (%)
    description: Median share of a library's reads miRTrace calls rRNA, a sign of degraded RNA.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: smrnaseq
    data_collection_tag: samples
    aggregation: sum
    column_name: mirna_reads
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display:
      icon_name: mdi:chart-bar
      icon_color: blue
      caption: the deepest libraries
    section: Libraries at a glance
    tag: sr-lib-card-reads
    index: lib-card-reads
    title: Reads on miRNAs
    description: Reads mirtop assigned to miRNAs, over every library.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # The complexity curve's last point is the library at full depth, so the max
  # per library is how many miRNAs it reaches.
  - component_type: card
    workflow_tag: smrnaseq
    data_collection_tag: mirtrace_complexity
    use: multiqc/mirtrace_complexity
    aggregation: max
    column_name: distinct_mirnas
    column_type: float64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display:
      icon_name: mdi:chart-line
      icon_color: indigo
      caption: the libraries reaching the most
      decimals: 0
    section: Libraries at a glance
    tag: sr-lib-card-complexity
    index: lib-card-complexity
    title: Most miRNAs in a library
    description: Distinct miRNAs miRTrace finds in a library at its full depth.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: smrnaseq
    data_collection_tag: mirtrace_length
    use: multiqc/length_profile
    config:
      x_title: Read length (nt)
      y_title: Reads (% of library)
      shaded_bands:
      - [18, 26, miRNA]
      selection_enabled: true
      selection_column: sample
      legend_pos: none
    section: Read length and complexity
    tag: sr-lib-length
    index: lib-length
    title: Read length distribution
    description: >-
      Is each library made of miRNA-sized reads? One curve per library: the share of its reads at each
      length.

      How to read: a clean miRNA library has its main peak inside the shaded band. A second peak beyond
      the band, a broad smear towards longer reads, or a pile-up at the short end marks fragments or
      adapter products rather than miRNAs. Click a curve to pick the library.

      Lines and annotations: the shaded band labelled miRNA spans 18 to 26 nt, the miRNA length class that
      the MultiQC miRTrace plot shades. It is a display aid, not a validated cut-off, and nothing is
      filtered by it.

      Sources: MultiQC miRTrace module,
      https://github.com/MultiQC/MultiQC/blob/main/multiqc/modules/mirtrace/mirtrace.py; miRTrace, Kang et
      al. 2018, Genome Biol 19:213, doi:10.1186/s13059-018-1588-9.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: smrnaseq
    data_collection_tag: mirtrace_complexity
    use: multiqc/complexity_curve
    config:
      x_title: Reads sampled
      y_title: Distinct miRNAs detected
      log_x: true
      selection_enabled: true
      selection_column: sample
      legend_pos: none
    section: Read length and complexity
    tag: sr-lib-complexity
    index: lib-complexity
    title: miRNA complexity curves
    description: >-
      Was each library sequenced deep enough to see its miRNAs? One curve per library: the distinct miRNAs
      detected as more reads are sampled, on a log read axis.

      How to read: a curve that has flattened says deeper sequencing would add few new miRNAs. One still
      climbing at full depth was sequenced short of its complexity, and a library that flattens early and
      low is dominated by a few miRNAs. Click a curve to pick the library.

      Source: miRTrace, Kang et al. 2018, Genome Biol 19:213, doi:10.1186/s13059-018-1588-9.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: smrnaseq
    data_collection_tag: mirtrace_composition
    use: multiqc/rna_composition
    config:
      default_rank: RNA type
      top_n: 12
      sort_by: abundance
      normalise_to_one: true
      sample_sort: first_taxon
    section: RNA composition
    tag: sr-lib-composition
    index: lib-composition
    title: Library composition
    description: >-
      What is each library made of? One stacked bar per library, normalised to 100%, which the controls
      switch between the reads by RNA type, the reads by miRTrace QC outcome and the detected miRNAs by
      organism clade.

      How to read: by RNA type, a high miRNA share is the headline of a good library, and a large rRNA or
      tRNA share points at degraded RNA or a size selection that let fragments in. By QC outcome, on reads
      already trimmed upstream the adapter-not-detected class is the normal majority. By clade, nearly all
      detected miRNAs should sit in the clade of the sequenced species, and miRNAs of another clade point
      at contamination.

      Lines and annotations: the grey segment labelled Other lumps the categories beyond the twelve
      largest of the view. No threshold is drawn.

      Source: miRTrace, Kang et al. 2018, Genome Biol 19:213, doi:10.1186/s13059-018-1588-9.

      Note: the clade level counts detected miRNAs, not reads.
    layout: {x: 0, y: 0, w: 8, h: 5}
  # A row with a null axis draws no line, so the axes leave out the miRDeep2
  # counts (null with SKIP_MIRDEEP); the record card below still shows them.
  - component_type: advanced_viz
    workflow_tag: smrnaseq
    data_collection_tag: samples
    viz_kind: parallel_coordinates
    config:
      viz_kind: parallel_coordinates
      sample_col: sample
      scale: minmax
      metric_cols:
      - mirna_reads
      - mirnas_detected
      - mirnas_10cpm
      - mirna_pct
      - rrna_pct
      - trna_pct
      - reference_isoform_pct
    section: Library profile
    tag: sr-lib-parcoords
    index: lib-parcoords
    title: Per-library profile
    description: >-
      How does each library compare across the main QC measures? One line per library across seven axes:
      reads assigned to miRNAs, miRNAs detected, miRNAs at 10 CPM or more, and the miRNA, rRNA, tRNA and
      reference-isoform shares.

      How to read: each axis is rescaled to its own range, so a line is read against its peers, not
      against a target. A library that runs against the others on several axes at once is worth opening in
      the library record. Brush an axis to keep only the libraries inside it.

      Lines and annotations: no reference line or band is drawn. The 10 CPM counting level of the third
      axis is fixed in the dashboard's recipe and is not a published cut-off.

      Note: because every axis is stretched from its lowest to its highest value, a tiny spread can look
      large; read the values in the Library summary table.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: smrnaseq
    data_collection_tag: samples
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: mirna_reads
      y_col: mirna_pct
      label_col: sample
      color_col: top_clade
      x_title: Reads assigned to miRNAs
      y_title: miRNA reads (%)
      log_x: true
      marker_size: 10
      selection_enabled: true
      selection_column: sample
      legend_pos: bottom
    section: Library detail
    tag: sr-lib-plane
    index: lib-plane
    title: miRNA depth and share per library
    description: >-
      Is a library both deep and miRNA-rich? Each point is one library, with the reads assigned to miRNAs
      on x (log scale) and the miRNA share of its reads on y, coloured by the clade holding most of its
      detected miRNAs.

      How to read: the top right is deep and miRNA-rich. Points low on the plot spend their reads on rRNA,
      tRNA or other RNA, and a point whose clade colour differs from its peers may be contaminated; check
      it in the library composition at the clade level. Click a point to open its record.

      Lines and annotations: no reference line or band is drawn, and the sample names are not printed on
      the points.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: smrnaseq
    data_collection_tag: samples
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: sr-lib-plane
      id_col: sample
      selection_source: any
      sections:
        miRNA library: [mirna_reads, mirnas_detected, mirnas_10cpm, reference_isoform_pct]
        miRTrace composition: [mirna_pct, rrna_pct, trna_pct, artifact_pct, unknown_pct, top_clade, top_clade_pct]
        miRDeep2: [novel_candidates, known_recovered]
    section: Library detail
    tag: sr-lib-record
    index: lib-record
    title: Library record
    description: >-
      What are the numbers behind the picked library? A fact panel with its miRNA depth, its miRTrace
      composition and its miRDeep2 counts.

      How to read: read the miRNA, rRNA and tRNA shares together with the miRNAs detected, and compare the
      novel candidates with the known precursors recovered to see how much miRDeep2 proposes beyond
      miRBase.

      Note: the panel stays empty until a library is picked, and the miRDeep2 fields are empty on a run
      that skips miRDeep2.
    layout: {x: 5, y: 0, w: 3, h: 6}

- title: miRNA Expression
  subtitle: Which miRNAs does each library express, and how much?
  tab_group: Expression
  tab_order: 3
  tab_icon: mdi:chart-box-outline
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: miRNA filters
    icon: mdi:dna
    color: cyan
    description: Narrows to the picked miRNAs, or to an expression or detection range
  grid_sections:
  - name: Expression at a glance
    icon: mdi:counter
    color: cyan
    description: How many miRNAs the run measures, which lead, and how widely they are found
  - name: Top variable miRNAs
    icon: mdi:chart-box-outline
    color: grape
    description: The miRNAs that vary most across libraries, rows and columns clustered
  - name: Expression by group
    icon: mdi:chart-bell-curve
    color: teal
    description: The most expressed miRNAs, one box per miRNA and group
  - name: miRNA detail
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Mean against spread for every miRNA; pick one to read its record
  - name: miRNA table
    icon: mdi:table
    color: gray
    description: One row per miRNA, selectable
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [mirtop](https://github.com/miRTop/mirtop) counts the reads of every miRNA and its
      isomiRs in each library; CPM scales them to the library's miRNA reads. Start with the
      heatmap: libraries of one group should form a block. Pick a miRNA on the plane to read
      its record and narrow the boxes to it.
    tag: sr-expr-intro
    index: expr-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_mirna_counts
    interactive_component_type: MultiSelect
    column_name: mirna
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: cyan
    section: miRNA filters
    group: miRNAs
    tag: sr-expr-filter-mirna
    index: expr-mirna-filter
    title: miRNA
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_mirna_summary
    interactive_component_type: RangeSlider
    column_name: mean_log2_cpm
    column_type: float64
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: blue
    section: miRNA filters
    group: miRNAs
    tag: sr-expr-filter-mean
    index: expr-mean-range
    title: Mean log2(CPM + 1)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_mirna_summary
    interactive_component_type: RangeSlider
    column_name: samples_detected
    column_type: int64
    display:
      icon_name: mdi:flask-outline
      custom_color: grape
    section: miRNA filters
    group: miRNAs
    tag: sr-expr-filter-detection
    index: expr-detection-range
    title: Libraries detecting the miRNA
    layout: {x: 0, y: 6, w: 1, h: 3}
  # One row per miRNA, so a count over the summary is a count of miRNAs. The
  # arm is null for a miRNA named without -5p/-3p, so no ring by arm: the
  # strip shows how expression spreads over the miRNAs instead.
  - component_type: card
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_mirna_summary
    use: mirtop/mirna_summary
    aggregation: count
    column_name: mean_log2_cpm
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:dna
      icon_color: cyan
      caption: their mean log2(CPM + 1), low to high
    section: Expression at a glance
    tag: sr-expr-card-mirnas
    index: expr-card-mirnas
    title: miRNAs with reads
    description: miRNAs with at least one read in the run. The bars spread them by mean expression.
    layout: {x: 0, y: 0, w: 2, h: 2}
  # miRNA names are cut at a card's label width, so the reads split by group,
  # the parts of the whole; the top miRNAs are named in the boxes below.
  - component_type: card
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_mirna_counts
    use: mirtop/mirna_counts
    aggregation: sum
    column_name: reads
    column_type: int64
    secondary_layout: composition
    breakdown_col: '{GROUP_COL}'
    display:
      icon_name: mdi:chart-bar
      icon_color: blue
      caption: reads, by {GROUP_COL_DISPLAY}
    section: Expression at a glance
    tag: sr-expr-card-reads
    index: expr-card-reads
    title: miRNA reads
    description: Reads assigned to miRNAs over the libraries in view. The bar splits them by {GROUP_COL_DISPLAY} when a design table was given.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: smrnaseq
    data_collection_tag: samples
    aggregation: median
    column_name: mirnas_10cpm
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:counter
      icon_color: teal
      caption: median per library, with its spread
      decimals: 0
    section: Expression at a glance
    tag: sr-expr-card-10cpm
    index: expr-card-10cpm
    title: miRNAs at 10 CPM or more
    description: Median number of miRNAs a library expresses at 10 CPM or more.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_mirna_summary
    use: mirtop/mirna_summary
    aggregation: median
    column_name: samples_detected
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:flask-outline
      icon_color: grape
      caption: median; the distribution over miRNAs
      decimals: 0
    section: Expression at a glance
    tag: sr-expr-card-detection
    index: expr-card-detection
    title: Libraries detecting a miRNA
    description: Median number of libraries in which a miRNA has reads.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_top_variable_heatmap
    use: mirtop/top_variable_mirna_heatmap
    config:
      cluster_rows: true
      cluster_cols: true
      cluster_method: ward
      normalize: row_z
      colorscale: RdBu
    section: Top variable miRNAs
    tag: sr-expr-heatmap
    index: expr-heatmap
    title: Top variable miRNAs
    description: >-
      Which miRNAs vary most across the libraries, and which libraries cluster? Rows are the most variable
      miRNAs, columns are libraries, and the colour is the log2(CPM + 1) scaled within each row. The
      strips above the columns are the design factors.

      How to read: libraries of the same design group should form blocks of similar colour. A library that
      clusters away from its group is worth checking against its depth in the library PCA, and a miRNA
      that splits the groups is a candidate for the two-group test.

      Lines and annotations: the diverging colour scale is centred on each miRNA's mean across libraries
      (a z-score of 0), so the colour says above or below the miRNA's own average, not how high it is.
      Rows and columns are clustered with Ward linkage, and no cut-off is drawn.

      Note: only miRNAs with a mean CPM of at least 10 enter, and the top 100 by variance are kept; both
      are fixed in the recipe and are not published cut-offs.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: figure
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_mirna_counts
    visu_type: box
    mode: code
    code_content: |-
      # The twelve most expressed miRNAs (or the ones picked), one box per miRNA
      # and group: Analysis mode's groups when it has some, else the design
      # column. A run without a design table gets one box per miRNA.
      grp = depictio_group_by[0] if depictio_group_by else '{GROUP_COL}'
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get('{GROUP_COL}') or {}
      top = (
          df.group_by('mirna').agg(pl.col('cpm').mean().alias('_m'))
          .sort('_m', descending=True).head(12)['mirna'].to_list()
      )
      d = df.filter(pl.col('mirna').is_in(top))
      has_grp = grp in d.columns
      fig = px.box(
          d.to_pandas(),
          x='mirna', y='log2_cpm',
          color=grp if has_grp else None,
          color_discrete_map=colors if has_grp else None,
          points='all',
          category_orders={'mirna': top},
          hover_data=['sample'],
          labels={'mirna': 'miRNA', 'log2_cpm': 'log2(CPM + 1)', grp: '{GROUP_COL_DISPLAY}'},
      )
      # The miRNA names say what the axis is: no title, and room for the
      # slanted names below the boxes.
      fig.update_xaxes(title_text=None, automargin=True)
      fig.update_layout(margin=dict(t=10), legend={'orientation': 'h', 'y': 1.08})
    selection_enabled: false
    section: Expression by group
    tag: sr-expr-box
    index: expr-box-by-group
    title: Expression of the top miRNAs by group
    description: >-
      How do the leading miRNAs differ between groups? One box per miRNA and group, for the twelve miRNAs
      with the highest mean CPM or the ones picked, each dot a library, on log2(CPM + 1).

      How to read: boxes of two groups that do not overlap for a miRNA suggest a difference, and the
      two-group test in [Group Comparison](tab:Group Comparison) puts a p-value on it. A box built from
      very few dots is a weak statement.

      Lines and annotations: each box spans the quartiles with the median inside it, and the whiskers
      follow the Tukey convention. No threshold is drawn.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_mirna_summary
    use: mirtop/mirna_mean_variance
    config:
      x_title: Mean log2(CPM + 1)
      y_title: Standard deviation of log2(CPM + 1)
      marker_size: 6
      opacity: 0.7
      # The best-detected miRNAs are also the most expressed: their labels
      # piled up at the right edge. The boxes above name the top twelve.
      top_n_labels: 0
      selection_enabled: true
      selection_column: mirna
      legend_pos: bottom
    section: miRNA detail
    tag: sr-expr-plane
    index: expr-plane
    title: Mean-variance plane
    description: >-
      Which miRNAs are both well expressed and variable? Each point is one miRNA with at least one read,
      with the mean log2(CPM + 1) across libraries on x and its standard deviation on y, coloured by
      precursor arm (5p or 3p) and sized by the share of libraries that detect it.

      How to read: the top right is well expressed and variable, the candidates for a closer look. Points
      at the bottom right are steadily expressed, and points at the left are lowly expressed. Click a
      point to open the miRNA record.

      Lines and annotations: no reference line is drawn and no point is labelled, since the best-detected
      miRNAs are also the most expressed and their labels would pile up.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_mirna_summary
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: sr-expr-plane
      id_col: mirna
      selection_source: any
      sections:
        miRNA: [mirna, arm, expression_rank]
        Expression: [total_reads, mean_cpm, median_cpm, mean_log2_cpm, sd_log2_cpm]
        Detection: [samples_detected, detection_pct]
        isomiRs: [max_isomirs, reference_pct]
      link_templates:
        mirna: "https://mirbase.org/results/?query={value}"
    section: miRNA detail
    tag: sr-expr-record
    index: expr-record
    title: miRNA record
    description: >-
      What is known about the picked miRNA? A fact panel with its arm and expression rank, its expression,
      how widely it is detected and its isomiR diversity.

      How to read: a high detection with a low spread is a stable miRNA, and a low reference share means
      most of its reads are isomiRs. The name links to its miRBase entry.

      Note: the panel stays empty until a miRNA is picked.
    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: table
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_mirna_summary
    row_selection_enabled: true
    row_selection_column: mirna
    page_size: 25
    section: miRNA table
    tag: sr-expr-table
    index: expr-table
    title: miRNA summary
    description: >-
      What does every miRNA look like in numbers? One row per miRNA: total reads, mean and median CPM, the
      spread of log2(CPM + 1) across libraries, the libraries that detect it, its isomiR diversity and the
      share of reads matching the reference sequence.

      How to read: sort by mean CPM for the leading miRNAs or by spread for the most variable ones. Select
      a row to open its record next to the mean-variance plot.
    layout: {x: 0, y: 0, w: 8, h: 6}

- title: Group Comparison
  subtitle: Which libraries look alike, and which miRNAs separate two groups?
  tab_group: Expression
  tab_order: 4
  tab_icon: mdi:scale-balance
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Comparison filters
    icon: mdi:tune
    color: grape
    description: Drops shallow or outlying libraries before comparing
  grid_sections:
  - name: Comparison at a glance
    icon: mdi:counter
    color: grape
    description: The libraries compared, by group, and how deep each one is
  - name: Sample relationships
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Libraries placed by miRNA expression; lasso a set to save it as a group
  - name: Two-group test
    icon: mdi:scale-balance
    color: grape
    description: Every expressed miRNA tested between two groups of libraries
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      The PCA places each library by log2(CPM + 1) over the most variable miRNAs; lasso a set of
      points to save it as a group. The volcano tests every miRNA between two groups with a
      [Wilcoxon rank-sum test](https://en.wikipedia.org/wiki/Mann%E2%80%93Whitney_U_test),
      corrected for multiple testing. The pipeline publishes no model-based test, so read the
      hits as candidates to confirm with edgeR or DESeq2.
    tag: sr-cmp-intro
    index: cmp-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: smrnaseq
    data_collection_tag: samples
    interactive_component_type: RangeSlider
    column_name: mirnas_10cpm
    column_type: int64
    display:
      icon_name: mdi:counter
      custom_color: cyan
    section: Comparison filters
    group: Libraries
    tag: sr-cmp-filter-10cpm
    index: cmp-10cpm-range
    title: miRNAs at 10 CPM or more
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_sample_pca
    interactive_component_type: RangeSlider
    column_name: dim_1
    column_type: float64
    display:
      icon_name: mdi:chart-scatter-plot
      custom_color: indigo
    section: Comparison filters
    group: Libraries
    tag: sr-cmp-filter-pc1
    index: cmp-pc1-range
    title: First principal component
    layout: {x: 0, y: 3, w: 1, h: 3}
  # Two cards, not four: the PCA table carries the design columns and the
  # depth, the two things a reader checks before trusting a separation.
  - component_type: card
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_sample_pca
    use: mirtop/sample_pca
    aggregation: count
    column_name: sample
    column_type: object
    secondary_layout: composition
    breakdown_col: '{GROUP_COL}'
    display:
      icon_name: mdi:flask-outline
      icon_color: teal
      caption: libraries, by {GROUP_COL_DISPLAY}
    section: Comparison at a glance
    tag: sr-cmp-card-libraries
    index: cmp-card-libraries
    title: Libraries compared
    description: Libraries in the PCA and the test. The bar splits them by {GROUP_COL_DISPLAY} when a design table was given.
    layout: {x: 0, y: 0, w: 4, h: 2}
  - component_type: card
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_sample_pca
    use: mirtop/sample_pca
    aggregation: median
    column_name: mirna_reads
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bar
      icon_color: blue
      caption: median per library; depth can drive a component
      decimals: 0
    section: Comparison at a glance
    tag: sr-cmp-card-depth
    index: cmp-card-depth
    title: miRNA reads per library
    description: Median reads assigned to miRNAs per library. The box shows how it spreads.
    layout: {x: 4, y: 0, w: 4, h: 2}
  - component_type: advanced_viz
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_sample_pca
    use: mirtop/mirna_pca
    config:
      color_col: '{GROUP_COL}'
      axis_prefix: PC
      point_size: 12
      show_density: false
      # The Overview highlight draws this at half width, where the centroid labels
      # pile on the points; the colours already say the group.
      show_centroids: false
      hover_cols: [mirna_reads, mirnas_detected]
      selection_enabled: true
      selection_column: sample
    section: Sample relationships
    tag: sr-cmp-pca
    index: cmp-pca
    title: Library PCA on miRNA expression
    description: >-
      Which libraries look alike? Each point is one library placed by the principal components of log2(CPM
      + 1) over its most variable expressed miRNAs, coloured by the design group.

      How to read: libraries of one group should sit together. One far from its group is worth checking
      against its depth, shown on hover as the reads assigned to miRNAs and the miRNAs detected, before it
      is read as biology. Lasso a set of points to save it as a group.

      Lines and annotations: no centroid, ellipse or density is drawn. The components are computed on
      centred, unscaled values, so a miRNA weighs by how much it varies.

      Note: only miRNAs with a mean CPM of at least 10 are used and the most variable 500 are kept; both
      numbers are fixed in the recipe and are not published cut-offs.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_sample_matrix
    use: mirtop/mirna_group_compare
    config:
      group_col: '{GROUP_COL}'
      test: wilcoxon
      log_transform: true
      min_observations: 3
      fdr_threshold: 0.05
      log2fc_threshold: 1.0
      top_n_labels: 15
      # Opens on the first two groups of the design column and runs the test,
      # so the tile is not blank until a click.
      auto_run: true
    section: Two-group test
    tag: sr-cmp-volcano
    index: cmp-volcano
    title: miRNAs that separate two groups
    description: >-
      Which miRNAs separate two groups of libraries? Each point is one expressed miRNA, with the log2 fold
      change of the group means (CPM + 1), group A over group B, on x and minus log10 of the
      Benjamini-Hochberg adjusted p-value of a Wilcoxon rank-sum test on y.

      How to read: points above the horizontal line and beyond one of the vertical lines are called up in
      A (right) or down in A (left); a positive fold change means higher in A. Confirm a hit in the box
      plots of the top miRNAs, and prefer calls with a clear count gap between the groups.

      Lines and annotations: the two dotted vertical lines sit at log2 fold change -1 and +1 and the
      dotted horizontal line at an adjusted p-value of 0.05. These are the tile's default thresholds,
      adjustable in its controls, not values read from the run or from a tool manual. The 15 strongest
      points are labelled with the miRNA name.

      Source: Benjamini and Hochberg 1995, J R Stat Soc B 57:289, doi:10.1111/j.2517-6161.1995.tb02031.x.

      Note: the Wilcoxon test is coarse with few libraries per group; with three on each side the smallest
      possible p-value is 0.1, so nothing can reach an FDR of 0.05.
    layout: {x: 0, y: 0, w: 8, h: 6}

- title: isomiRs
  subtitle: How far do the reads stray from the reference sequence?
  tab_group: Sequences
  tab_order: 5
  tab_icon: mdi:shape-outline
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: isomiR filters
    icon: mdi:shape-outline
    color: indigo
    description: Narrows to isomiR classes, or to libraries by their reference share
  grid_sections:
  - name: isomiRs at a glance
    icon: mdi:counter
    color: indigo
    description: How much of the miRNA reads match the reference, and how many variants
  - name: isomiR composition
    icon: mdi:chart-bar
    color: indigo
    description: Each library's miRNA reads by 3' end, 5' end, addition and change
  - name: isomiR landscape
    icon: mdi:chart-scatter-plot
    color: violet
    description: Which isomiR classes each of the most expressed miRNAs carries
  - name: isomiR table
    icon: mdi:table
    color: gray
    description: The landscape as rows, one per miRNA and class
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [mirtop](https://github.com/miRTop/mirtop) names every read of a miRNA by how it differs
      from the reference: a trimmed or extended end, an added base, a changed one. Switch the
      level of the composition to see each partition of the same reads. The landscape then
      shows which classes the most expressed miRNAs carry.
    tag: sr-iso-intro
    index: iso-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_isomir_landscape
    interactive_component_type: MultiSelect
    column_name: variant_class
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: indigo
    section: isomiR filters
    group: isomiRs
    tag: sr-iso-filter-class
    index: iso-class-filter
    title: isomiR class
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: smrnaseq
    data_collection_tag: samples
    interactive_component_type: RangeSlider
    column_name: reference_isoform_pct
    column_type: float64
    display:
      icon_name: mdi:check-decagram
      custom_color: green
    section: isomiR filters
    group: isomiRs
    tag: sr-iso-filter-reference
    index: iso-reference-range
    title: Reads on the reference (%)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: smrnaseq
    data_collection_tag: samples
    aggregation: median
    column_name: reference_isoform_pct
    column_type: float64
    filter_expr: col('mirna_reads') > 0
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:check-decagram
      icon_color: green
      caption: median per library, with its spread
      decimals: 1
    section: isomiRs at a glance
    tag: sr-iso-card-reference
    index: iso-card-reference
    title: Reads on the reference (%)
    description: Median share of a library's miRNA reads that match the reference sequence exactly.
    layout: {x: 0, y: 0, w: 2, h: 2}
  # A miRNA with no read in a library has no isomiR there: left out, or the
  # median reads the zeros.
  - component_type: card
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_mirna_counts
    use: mirtop/mirna_counts
    aggregation: median
    column_name: isomirs
    column_type: int64
    filter_expr: col('reads') > 0
    secondary_layout: histogram
    display:
      icon_name: mdi:shape-outline
      icon_color: indigo
      caption: median; the distribution over miRNAs and libraries
      decimals: 0
    section: isomiRs at a glance
    tag: sr-iso-card-isomirs
    index: iso-card-isomirs
    title: isomiRs per miRNA
    description: Median number of distinct isomiRs of an expressed miRNA in a library.
    layout: {x: 2, y: 0, w: 2, h: 2}
  # Each partition sums to the library's miRNA reads, so the 3' end classes
  # are parts of one whole. The rank is matched without the quote in "3' end".
  - component_type: card
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_isomir_composition
    use: mirtop/isomir_composition
    aggregation: sum
    column_name: abundance
    column_type: float64
    filter_expr: col('rank').str.starts_with('3') & col('rank').str.ends_with('end')
    secondary_layout: donut
    breakdown_col: taxon
    top_n_count: 4
    display:
      icon_name: mdi:ray-end
      icon_color: grape
      caption: reads, by 3' end
      decimals: 0
    section: isomiRs at a glance
    tag: sr-iso-card-three-prime
    index: iso-card-three-prime
    title: miRNA reads by 3' end
    description: The miRNA reads of the libraries in view, by how their 3' end compares with the reference.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_isomir_composition
    use: mirtop/isomir_composition
    aggregation: sum
    column_name: abundance
    column_type: float64
    filter_expr: col('rank').str.ends_with('addition') & (col('taxon') != 'No addition')
    secondary_layout: top_n
    breakdown_col: taxon
    top_n_count: 3
    display:
      icon_name: mdi:plus-circle-outline
      icon_color: orange
      caption: the bases added most
      decimals: 0
    section: isomiRs at a glance
    tag: sr-iso-card-additions
    index: iso-card-additions
    title: Reads with a 3' addition
    description: miRNA reads carrying non-templated bases at the 3' end, ranked by the base added.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_isomir_composition
    use: mirtop/isomir_classes
    config:
      default_rank: "3' end"
      top_n: 8
      sort_by: abundance
      normalise_to_one: true
      sample_sort: first_taxon
    section: isomiR composition
    tag: sr-iso-composition
    index: iso-composition
    title: isomiR composition per library
    description: >-
      How far do the reads stray from the reference sequence? One stacked bar per library, normalised to
      100% of its miRNA reads, which the controls split four ways: by 3' end, by 5' end, by the added
      nucleotide and by nucleotide change.

      How to read: most miRNA reads are not an exact copy of the reference, so a share of isomiRs is
      normal. A 5' shift moves the seed and with it the targets, so an unusual share of shifted 5' ends in
      one library deserves a look; compare libraries of the same group.

      Lines and annotations: the grey segment labelled Other lumps the categories beyond the eight largest
      of the view. No threshold is drawn.

      Source: mirtop, Desvignes et al. 2020, Bioinformatics 36:698, doi:10.1093/bioinformatics/btz675.

      Note: mirtop cannot tell an editing event or a SNP from a sequencing error; a change seen in one
      library only is most likely an error.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_isomir_landscape
    use: mirtop/isomir_dot_plot
    config:
      gene_sort: mean
      cluster_sort: name
      max_genes: 40
    section: isomiR landscape
    tag: sr-iso-landscape
    index: iso-landscape
    title: isomiR landscape of the most expressed miRNAs
    description: >-
      Which isomiR classes does each leading miRNA carry? Each row is one of the most expressed miRNAs and
      each column an isomiR class; the colour is the mean share of the miRNA's reads in the class, and the
      size is the share of libraries where the class holds at least 5% of them.

      How to read: a large dark dot is a class that dominates the miRNA in most libraries, such as a miRNA
      that is mostly 3' trimmed everywhere. A small dark dot is a class carried by few libraries, which
      points at a library-specific event.

      Lines and annotations: no line is drawn. The 5% level of the size and the 10-read minimum for a
      library to count are fixed in the dashboard's recipe and are not published cut-offs.

      Source: mirtop, Desvignes et al. 2020, Bioinformatics 36:698, doi:10.1093/bioinformatics/btz675.

      Note: the classes are not exclusive, since a read can be 3' trimmed and also carry an addition.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_isomir_landscape
    row_selection_enabled: true
    row_selection_column: mirna
    page_size: 25
    section: isomiR table
    tag: sr-iso-table
    index: iso-table
    title: isomiR landscape rows
    description: >-
      What are the numbers behind the isomiR landscape? One row per miRNA and isomiR class: the mean share
      of the miRNA's reads in the class, the share of libraries where the class is a real part of them,
      the reads in the class and the miRNA's rank by reads.

      How to read: sort by class reads to find the classes carrying the most reads, or filter on a miRNA
      to see all its classes. Select a row to filter the linked tiles on that miRNA.
    layout: {x: 0, y: 0, w: 8, h: 6}

- title: Novel miRNAs
  subtitle: Which new miRNAs does miRDeep2 propose, and how credible are they?
  tab_group: Sequences
  tab_order: 6
  tab_icon: mdi:star-outline
  tab_icon_color: red
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Precursor filters
    icon: mdi:filter-variant
    color: red
    description: Keeps the novel precursors by recurrence, true-positive estimate and star arm
  grid_sections:
  - name: Discovery at a glance
    icon: mdi:counter
    color: red
    description: How many novel precursors, how recurrent and how well scored
  - name: Score calibration
    icon: mdi:chart-line
    color: pink
    description: miRDeep2's own curves for choosing a score cutoff
  - name: Precursor detail
    icon: mdi:chart-scatter-plot
    color: orange
    description: Recurrence against the true-positive estimate; pick one to read its record
  - name: Precursor tables
    icon: mdi:table
    color: gray
    description: The merged novel precursors and every per-library call
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [miRDeep2](https://github.com/rajewsky-lab/mirdeep2) scores every hairpin the reads
      outline on the genome and estimates its noise from permuted structures. Set a cutoff on
      the calibration curves first: high signal-to-noise while known precursors are still
      recovered. Then pick a precursor on the plane; recurrent, likely real and with star-arm
      reads are the credible ones.
    tag: sr-novel-intro
    index: novel-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: smrnaseq
    data_collection_tag: mirdeep2_novel_precursors
    interactive_component_type: RangeSlider
    column_name: samples_detected
    column_type: int64
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: Precursor filters
    group: Precursors
    tag: sr-novel-filter-recurrence
    index: novel-recurrence-range
    title: Libraries reporting it
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: smrnaseq
    data_collection_tag: mirdeep2_novel_precursors
    interactive_component_type: RangeSlider
    column_name: max_true_positive_pct
    column_type: float64
    display:
      icon_name: mdi:trophy
      custom_color: yellow
    section: Precursor filters
    group: Precursors
    tag: sr-novel-filter-score
    index: novel-score-range
    title: True-positive estimate (%)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: smrnaseq
    data_collection_tag: mirdeep2_novel_precursors
    interactive_component_type: MultiSelect
    column_name: star_support
    column_type: object
    display:
      icon_name: mdi:star-outline
      custom_color: red
    section: Precursor filters
    group: Precursors
    tag: sr-novel-filter-star
    index: novel-star-filter
    title: Star-arm reads
    layout: {x: 0, y: 6, w: 1, h: 2}
  # One row per merged hairpin, so the count is a count of precursors.
  - component_type: card
    workflow_tag: smrnaseq
    data_collection_tag: mirdeep2_novel_precursors
    use: mirdeep2/novel_precursors
    aggregation: count
    column_name: precursor_id
    column_type: object
    secondary_layout: donut
    breakdown_col: star_support
    top_n_count: 2
    display:
      icon_name: mdi:star-outline
      icon_color: red
      caption: hairpins, by reads on the star arm
    section: Discovery at a glance
    tag: sr-novel-card-precursors
    index: novel-card-precursors
    title: Novel precursors
    description: Novel hairpins merged across libraries by overlapping locus.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: smrnaseq
    data_collection_tag: mirdeep2_novel_precursors
    use: mirdeep2/novel_precursors
    aggregation: median
    column_name: samples_detected
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:flask-outline
      icon_color: teal
      caption: median per precursor, with its spread
      decimals: 0
    section: Discovery at a glance
    tag: sr-novel-card-recurrence
    index: novel-card-recurrence
    title: Libraries per precursor
    description: Median number of libraries that report a novel precursor.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: smrnaseq
    data_collection_tag: mirdeep2_novel_precursors
    use: mirdeep2/novel_precursors
    aggregation: median
    column_name: max_true_positive_pct
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:trophy
      icon_color: yellow
      caption: median; the distribution over precursors
      decimals: 0
    section: Discovery at a glance
    tag: sr-novel-card-score
    index: novel-card-score
    title: True-positive estimate (%)
    description: miRDeep2's estimate that a precursor at its best score is real, from the permuted controls.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # One row per call, library and precursor, so the bar splits the calls.
  - component_type: card
    workflow_tag: smrnaseq
    data_collection_tag: mirdeep2_predictions
    use: mirdeep2/predictions
    aggregation: count
    column_name: prediction_id
    column_type: object
    secondary_layout: composition
    breakdown_col: category
    display:
      icon_name: mdi:check-decagram
      icon_color: green
      caption: calls over all libraries, novel or known
    section: Discovery at a glance
    tag: sr-novel-card-calls
    index: novel-card-calls
    title: miRDeep2 calls
    description: Every precursor miRDeep2 reported in a library, before merging; known ones are already in miRBase.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: smrnaseq
    data_collection_tag: mirdeep2_score_summary
    use: mirdeep2/signal_to_noise_curve
    config:
      x_title: miRDeep2 score cutoff
      y_title: Signal-to-noise
      legend_pos: none
    section: Score calibration
    tag: sr-novel-snr
    index: novel-snr
    title: Signal-to-noise by score cutoff
    description: >-
      How well does the miRDeep2 score separate real novel candidates from chance? One curve per library:
      the signal-to-noise ratio, the novel candidates reported on the real reads over those reported on
      permuted structures, at each integer score cutoff.

      How to read: a ratio near 1 means the run reports barely more candidates than permuted structures
      do. Read it with the known-recovery curve beside it, and look for a cutoff where the ratio is high
      while the recovery of known precursors has not yet fallen.

      Sources: miRDeep2, Friedlaender et al. 2012, Nucleic Acids Res, doi:10.1093/nar/gkr688;
      https://github.com/rajewsky-lab/mirdeep2.

      Note: miRDeep2 gives no single cutoff to use; its display cutoff for novel candidates defaults to 0.
      No line is drawn at any cutoff here.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: smrnaseq
    data_collection_tag: mirdeep2_score_summary
    use: mirdeep2/known_recovery_curve
    config:
      x_title: miRDeep2 score cutoff
      y_title: Known precursors recovered (%)
      legend_pos: none
    section: Score calibration
    tag: sr-novel-known
    index: novel-known
    title: Known precursors recovered by score cutoff
    description: >-
      How many known precursors does each score cutoff keep? One curve per library: the share of the
      miRBase precursors that have reads in the library and that miRDeep2 recovers at each integer score
      cutoff.

      How to read: the curve falls as the cutoff rises. A cutoff past the point where it drops steeply
      loses known miRNAs, which the novel candidates would lose too; read it with the signal-to-noise
      curve beside it.

      Sources: miRDeep2, Friedlaender et al. 2012, Nucleic Acids Res, doi:10.1093/nar/gkr688;
      https://github.com/rajewsky-lab/mirdeep2.

      Note: no line is drawn at any cutoff, and miRDeep2 publishes no single value to choose.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: smrnaseq
    data_collection_tag: mirdeep2_novel_precursors
    use: mirdeep2/novel_support
    config:
      # The score is unbounded and one hairpin can sit thousands above the
      # rest, flattening every other point; its true-positive estimate is
      # bounded at 100.
      y_col: max_true_positive_pct
      x_title: Libraries reporting the precursor
      y_title: True-positive estimate (%)
      log_y: false
      marker_outline: true
      top_n_labels: 0
      selection_enabled: true
      selection_column: precursor_id
      legend_pos: bottom
    section: Precursor detail
    tag: sr-novel-plane
    index: novel-plane
    title: Recurrence against the true-positive estimate
    description: >-
      Which novel hairpins are credible? Each point is one novel precursor merged across libraries, with
      the number of libraries reporting it on x and its best estimated true-positive probability on y,
      sized by the reads summed over libraries and coloured by whether any call had star-arm reads.

      How to read: points to the right and high are recurrent and scored as probably real. Single-library
      points at a low probability are the weakest. Click a point to open the record, which shows the
      randfold test, any Rfam hit and the seed match.

      Lines and annotations: no line is drawn, the points carry an outline, and none is labelled.

      Sources: miRDeep2, Friedlaender et al. 2012, Nucleic Acids Res, doi:10.1093/nar/gkr688;
      https://github.com/rajewsky-lab/mirdeep2.

      Note: the true-positive estimate is miRDeep2's own, derived from permuted controls, and is not an
      experimental validation.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: smrnaseq
    data_collection_tag: mirdeep2_novel_precursors
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: sr-novel-plane
      id_col: precursor_id
      selection_source: any
      sections:
        Locus: [precursor_id, genome_position, precursor_length]
        Support: [samples_detected, detection_pct, calls, max_score, median_score, max_true_positive_pct]
        Reads: [total_reads, mature_reads, star_reads, loop_reads, star_support]
        Checks: [randfold_pct, rfam_alert, seed_match]
        Sequences: [best_sample, mature_sequence, star_sequence, precursor_sequence]
      link_templates:
        genome_position: "https://genome.ucsc.edu/cgi-bin/hgTracks?db={GENOME}&position={value}"
    section: Precursor detail
    tag: sr-novel-record
    index: novel-record
    title: Precursor record
    description: >-
      What supports the picked novel precursor? A fact panel with its locus, the libraries and scores
      behind it, its reads on the mature, loop and star arms, its checks and the sequences of its
      strongest call.

      How to read: weigh the recurrence and the estimated true-positive probability against the checks. A
      significant randfold share and reads on the star arm support the hairpin, while an Rfam alert names
      a known small RNA family it matches. The position links to the UCSC genome browser.

      Note: the panel stays empty until a precursor is picked.
    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: table
    workflow_tag: smrnaseq
    data_collection_tag: mirdeep2_novel_precursors
    row_selection_enabled: true
    row_selection_column: precursor_id
    page_size: 25
    section: Precursor tables
    tag: sr-novel-table-precursors
    index: novel-table-precursors
    title: Novel precursors
    description: >-
      Which novel miRNAs does the run propose? One row per hairpin merged across libraries: how many
      libraries report it, its best score and true-positive estimate, the reads on each arm, the share of
      calls with a significant randfold test, any Rfam hit and the sequences of its strongest call.

      How to read: sort by libraries reporting to start from the recurrent hairpins, and discard those
      with an Rfam alert. Select a row to open its record.

      Note: calls are merged when their precursor intervals overlap on the same chromosome and strand, so
      one row can stand for several calls.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: smrnaseq
    data_collection_tag: mirdeep2_predictions
    row_selection_enabled: false
    page_size: 25
    section: Precursor tables
    tag: sr-novel-table-calls
    index: novel-table-calls
    title: Every miRDeep2 call, per library
    description: >-
      What did miRDeep2 report before merging? One row per library and candidate: the novel hairpins it
      proposes and the known miRBase precursors it rediscovered, with the miRDeep2 score, the estimated
      true-positive probability, the read stack on the mature, loop and star arms and the randfold test.

      How to read: use it to follow a merged precursor back to the library calls behind it, or to filter
      on the category to separate novel from known candidates.

      Sources: miRDeep2, Friedlaender et al. 2012, Nucleic Acids Res, doi:10.1093/nar/gkr688;
      https://github.com/rajewsky-lab/mirdeep2.
    layout: {x: 0, y: 6, w: 8, h: 6}
