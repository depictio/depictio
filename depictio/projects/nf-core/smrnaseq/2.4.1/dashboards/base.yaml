      The most variable miRNAs at 10 CPM or more, row-scaled log2(CPM + 1),
      rows and columns clustered. The strips above the columns are the design
      factors, when a design table was given.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: sr-expr-heatmap
    index: sr-expr-heatmap
    section: Top variable miRNAs
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_top_variable_heatmap
    use: mirtop/top_variable_mirna_heatmap
    config:
      cluster_rows: true
      cluster_cols: true
      cluster_method: ward
      normalize: row_z
      colorscale: RdBu
      controls_placement: header
    title: Top variable miRNAs
    description: Row-normalised log2(CPM + 1), CPM over the miRNA-assigned reads of each sample.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 9}
  - component_type: text
    tag: sr-expr-box-intro
    section: Expression by group
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_mirna_counts
    title: One box per miRNA and group
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The twelve most expressed miRNAs, or the ones picked in the miRNA filter
      or on the plane below, with every sample drawn beside its box.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    tag: sr-expr-box
    index: sr-expr-box
    section: Expression by group
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_mirna_counts
    visu_type: box
    mode: code
    code_content: |-
      # Group on the viewer's analysis groups when there are some, else the
      # run's design column; a run without a design table gets one box per miRNA.
      grp_col = depictio_group_by[0] if depictio_group_by else '{GROUP_COL}'
      has_grp = grp_col in df.columns
      top = (
          df.group_by('mirna').agg(pl.col('cpm').mean().alias('_m'))
          .sort('_m', descending=True).head(12)['mirna'].to_list()
      )
      d = df.filter(pl.col('mirna').is_in(top))
      fig = px.box(
          d.to_pandas(),
          x='mirna', y='log2_cpm',
          color=grp_col if has_grp else None,
          points='all',
          category_orders={'mirna': top},
          hover_data=['sample'],
          labels={'mirna': '', 'log2_cpm': 'log2(CPM + 1)', grp_col: '{GROUP_COL_DISPLAY}'},
          color_discrete_map=depictio_group_kwargs.get('color_discrete_map', {}),
      )
      fig.update_layout(title=None, margin={'t': 24, 'l': 56, 'r': 16, 'b': 80}, legend={'orientation': 'h', 'y': 1.08})
    selection_enabled: false
    title: Expression of the top miRNAs by {GROUP_COL_DISPLAY}
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 7}
  - component_type: text
    tag: sr-expr-detail-intro
    section: miRNA detail
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_mirna_summary
    title: Well expressed and variable sits top right
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each point is a miRNA: mean against spread of log2(CPM + 1) across
      samples. Clicking one fills the record on the right and narrows the boxes
      above and the isomiR landscape to it.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: sr-expr-plane
    index: sr-expr-plane
    section: miRNA detail
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_mirna_summary
    use: mirtop/mirna_mean_variance
    config:
      x_title: Mean log2(CPM + 1)
      y_title: Standard deviation of log2(CPM + 1)
      marker_size: 6
      opacity: 0.7
      top_n_labels: 10
      selection_enabled: true
      selection_column: mirna
      legend_pos: bottom
      controls_placement: header
    title: Mean-variance plane
    description: Every miRNA with at least one read, coloured by precursor arm.
    title_size: h3
