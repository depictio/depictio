# =============================================================================
# Group comparison: which miRNAs separate two groups of samples.
# =============================================================================
- title: Group comparison
  tab_order: 3
  tab_icon: mdi:scale-balance
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Comparison scope
    icon: mdi:tune
    color: grape
    description: Drop shallow or off-target libraries before comparing
  grid_sections:
  - name: Sample relationships
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Which samples look alike on miRNA expression, and a lasso to make groups
  - name: Two-group test
    icon: mdi:scale-balance
    color: grape
    description: Every expressed miRNA tested between two groups of samples
  components:
  - component_type: text
    tag: sr-cmp-pca-intro
    section: Sample relationships
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_sample_pca
    title: Samples of one group should sit together
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      PCA of log2(CPM + 1) over the most variable expressed miRNAs, coloured
      by {GROUP_COL_DISPLAY} when a design table was given. Lasso a set of
      points and save it as a group to compare it below.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: sr-cmp-pca
    index: sr-cmp-pca
    section: Sample relationships
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_sample_pca
    use: mirtop/mirna_pca
    config:
      color_col: '{GROUP_COL}'
      point_size: 12
      show_density: false
      show_centroids: true
      hover_cols: [mirna_reads, mirnas_detected]
      selection_enabled: true
      selection_column: sample
      controls_placement: header
    title: Sample PCA on miRNA expression
    description: One point per sample. A point far from its group is worth checking against its depth on the Library QC tab.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 7}
  - component_type: text
    tag: sr-cmp-test-intro
    section: Two-group test
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_sample_matrix
    title: A screen, not a differential expression analysis
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Pick two {GROUP_COL_DISPLAY} levels or two saved groups: each miRNA's CPM
      is tested with a Wilcoxon rank-sum test and corrected with
      Benjamini-Hochberg. The pipeline publishes no model-based test, so read
      the hits as candidates to confirm with edgeR or DESeq2.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: sr-cmp-test
    index: sr-cmp-test
    section: Two-group test
    workflow_tag: smrnaseq
    data_collection_tag: mirtop_sample_matrix
    use: mirtop/mirna_group_compare
    config:
      group_col: '{GROUP_COL}'
      test: wilcoxon
      log_transform: true
      min_observations: 3
      fdr_threshold: 0.05
      log2fc_threshold: 1.0
      top_n_labels: 15
      controls_placement: header
    title: miRNAs that separate two groups
    description: Volcano of log2 fold change of mean CPM against the adjusted p-value, group A relative to group B.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 10}
  - component_type: interactive
    tag: sr-cmp-filter-reads
    index: sr-cmp-reads-filter
    section: Comparison scope
    group: Libraries
    workflow_tag: smrnaseq
    data_collection_tag: samples
