version: 1
# nf-core/smrnaseq 2.4.1, on the family rules of depictio/projects/nf-core/RULES.md
# (ampliseq/2.18.0 is the reference implementation).
#
# The sample hub (`samples`, one row per library) is always present and links
# on `sample` to every sample-keyed collection; the design table (`metadata`)
# is optional (METADATA_FILE) and, when given, sends the same links and lends
# its factors to the hub. The per-miRNA and per-precursor collections
# (mirna_summary, isomir_landscape, novel_precursors) aggregate over samples
# and are not sample-filterable. Routes: SKIP_MULTIQC prunes the MultiQC and
# miRTrace collections, SKIP_MIRDEEP the miRDeep2 ones, with the tiles that
# read them.
main_dashboard:
  title: nf-core/smrnaseq
  subtitle: Small RNA libraries, from the reads to the miRNAs they hold and the new ones they suggest
  project_tag: Small RNA-seq Analysis
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family: figures, advanced viz
  # and filter chips all colour a value the same way.
  category_colors:
    '{GROUP_COL}': auto
    # miRTrace's RNA types are pinned; the read QC outcomes, the clades and the
    # isomiR classes share the `taxon` column and take the palette by abundance.
    taxon:
      '*': 'auto:abundance'
      miRNA: '#1098ad'
      rRNA: '#e8590c'
      tRNA: '#f59f00'
      Artifact: '#868e96'
      Unknown: '#ced4da'
      Other: '#adb5bd'
    top_clade: auto
    arm:
      '*': auto
      5p: '#1c7ed6'
      3p: '#d6336c'
    variant_class:
      '*': auto
      Reference: '#2f9e44'
    star_support:
      'yes': '#2f9e44'
      'no': '#adb5bd'
    category:
      '*': auto
      novel: '#e03131'
      known: '#1c7ed6'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. The
  # group filter reads the design table (pruned with it on a run without one),
  # the sample filter the hub; both link to every sample-keyed collection.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab, which no route can prune.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The design table and the per-library summary, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (the sample
  # filter and the Samples card, both on the hub). The group filter reads the
  # design table and is pruned with it.
  - component_type: interactive
    workflow_tag: smrnaseq
    data_collection_tag: metadata
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Key figures
    tag: sr-ov-kf-group
    index: ov-kf-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: smrnaseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: sr-ov-kf-sample
    index: ov-kf-sample
    title: Sample
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: text
    title: nf-core/smrnaseq
    order: 1
    body: >
      Small RNA reads turned into miRNA counts per library: how clean each library is, which
      miRNAs it holds, how their sequences vary and which new ones miRDeep2 proposes.
      [Run parameters](params:)
    tag: sr-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/smrnaseq trims small RNA reads, profiles each library with miRTrace, counts miRNAs and isomiRs with mirtop and predicts novel miRNAs with miRDeep2. This page sums up one run; each tab answers one question, in the order of the steps below.

      The sample filters in the left panel apply to every tab. A bar above a section narrows that section only.
    tag: sr-ov-about
    index: ov-about
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash.
  - component_type: text
    surface: card
    values:
      samples: {dc: samples, column: sample, aggregation: nunique, format: integer}
      mirnas: {dc: mirtop_mirna_summary, column: mirna, aggregation: count, format: integer}
    body: |
      ### The run
      - ![](icon:mdi:flask-outline) **Samples** {{samples}}
      - ![](icon:mdi:dna) **Genome** {{param:genome}}
      - ![](icon:mdi:tag-outline) **Species** {{param:mirtrace_species}}
      - ![](icon:mdi:ruler) **Reads** {{param:fastp_min_length}}–{{param:fastp_max_length}} nt
      - ![](icon:mdi:counter) **miRNAs** {{mirnas}}
    tag: sr-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  # The marks take the family's colour (the header's), not the theme's blue.
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Six steps from reads to miRNAs
      Each step names its settings and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:content-cut) **Trim** fastp clips the adapter · [Settings](params:fastp) · [MultiQC](tab:MultiQC)
      2. ![](icon:mdi:test-tube) **Profile** miRTrace sorts every read · [Settings](params:mirtrace) · [Library QC](tab:Library QC)
      3. ![](icon:mdi:counter) **Count** mirtop counts each miRNA · [Settings](params:mature) · [Expression](tab:miRNA Expression)
      4. ![](icon:mdi:scale-balance) **Compare** Libraries by expression · [Settings](params:input) · [Comparison](tab:Group Comparison)
      5. ![](icon:mdi:shape-outline) **Annotate** mirtop names the isomiRs · [Settings](params:hairpin) · [isomiRs](tab:isomiRs)
      6. ![](icon:mdi:star-outline) **Discover** miRDeep2 scores new hairpins · [Settings](params:mirdeep) · [Novel](tab:Novel miRNAs)
      :::
    tag: sr-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. The icon colour is that tab's colour.
  - component_type: card
    workflow_tag: smrnaseq
    data_collection_tag: samples
    aggregation: count
    column_name: sample
    column_type: object
    secondary_layout: composition
    breakdown_col: '{GROUP_COL}'
    display:
      icon_name: mdi:flask-outline
      icon_color: teal
      caption: libraries, by {GROUP_COL_DISPLAY}
      link: tab:Library QC
    section: Key figures
    tag: sr-ov-kf-samples
    index: ov-kf-samples
    title: Samples
    description: Libraries in the run. The bar splits them by {GROUP_COL_DISPLAY} when a design table was given.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: smrnaseq
    data_collection_tag: samples
    aggregation: median
    column_name: mirnas_detected
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:dna
      icon_color: cyan
      caption: median per library
      link: tab:miRNA Expression
      decimals: 0
    section: Key figures
    tag: sr-ov-kf-detected
    index: ov-kf-detected
    title: miRNAs detected
    description: Median number of miRNAs with at least one read in a library. The box shows how it spreads.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: smrnaseq
    data_collection_tag: samples
    aggregation: median
    column_name: reference_isoform_pct
    column_type: float64
    filter_expr: col('mirna_reads') > 0
    secondary_layout: coverage
    coverage_max: 100
    display:
      icon_name: mdi:check-decagram
      icon_color: indigo
      caption: median share of miRNA reads
      link: tab:isomiRs
      decimals: 1
    section: Key figures
    tag: sr-ov-kf-reference
    index: ov-kf-reference
    title: Reference reads (%)
    description: Median share of a library's miRNA reads that match the reference sequence exactly; the rest are isomiRs.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: smrnaseq
    data_collection_tag: mirdeep2_novel_precursors
    use: mirdeep2/novel_precursors
    aggregation: count
    column_name: precursor_id
    column_type: object
    secondary_layout: composition
    breakdown_col: star_support
    display:
      icon_name: mdi:star-outline
      icon_color: red
      caption: hairpins, by reads on the star arm
      link: tab:Novel miRNAs
    section: Key figures
    tag: sr-ov-kf-novel
    index: ov-kf-novel
    title: Novel precursors
    description: Novel hairpins miRDeep2 proposes, merged across libraries. The bar splits them by whether the star arm has reads.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the group, then the sample.
  - component_type: interactive
    workflow_tag: smrnaseq
    data_collection_tag: metadata
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Findings
    tag: sr-ov-findings-group
    index: ov-findings-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: smrnaseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Sample
    section: Findings
    tag: sr-ov-findings-sample
    index: ov-findings-sample
    title: Sample
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data (no MultiQC report, no miRDeep2 run).
  - component_type: text
    surface: card
    values:
      mirna_pct: {dc: mirtrace_composition, column: percent, aggregation: median, filter_expr: "(col('rank') == 'RNA type') & (col('taxon') == 'miRNA')",
        format: "decimals:1"}
      top_mirna: {dc: mirtop_mirna_counts, column: mirna, aggregation: top, weight: reads}
      top_share: {dc: mirtop_mirna_counts, column: mirna, aggregation: top_share, weight: reads, format: percent}
      ref_pct: {dc: samples, column: reference_isoform_pct, aggregation: median, filter_expr: "col('mirna_reads') > 0",
        format: "decimals:1"}
      n_novel: {dc: mirdeep2_novel_precursors, column: precursor_id, aggregation: count, format: integer}
      n_star: {dc: mirdeep2_novel_precursors, column: precursor_id, aggregation: count, filter_expr: "col('star_support') == 'yes'",
        format: integer}
    body: |
      - **{{mirna_pct}}%** of the median library is miRNA reads – miRTrace [Library QC](tab:Library QC)
      - **{{top_share}}** of the miRNA reads go to {{top_mirna}} – the leading miRNA [Expression](tab:miRNA Expression)
      - **{{ref_pct}}%** of miRNA reads match the reference in the median library – isomiRs [isomiRs](tab:isomiRs)
      - **{{n_novel}}** novel precursors, {{n_star}} with star-arm reads – miRDeep2 [Novel](tab:Novel miRNAs)
    section: Findings
    tag: sr-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per analysis tab, in the order of the tabs. The import drops
  # a highlight whose source is gone and re-packs the grid.
  - component_type: highlight
    section: Findings
    source_tab: miRNA Expression
    source_component: expr-box-by-group
    caption: The twelve most expressed miRNAs, one box per group when the run has a design; every library is a dot.
    tag: sr-ov-hl-expression
    index: ov-hl-expression
    layout: {x: 0, y: 2, w: 5, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Group Comparison
    source_component: cmp-pca
    caption: One point per library on miRNA expression; libraries of one group should sit together.
    tag: sr-ov-hl-pca
    index: ov-hl-pca
    layout: {x: 5, y: 2, w: 3, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: isomiRs
    source_component: iso-composition
    caption: Each library's miRNA reads by 3' end; a library unlike the others is worth a look.
    tag: sr-ov-hl-isomirs
    index: ov-hl-isomirs
    layout: {x: 0, y: 7, w: 3, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Novel miRNAs
    source_component: novel-plane
    caption: One point per novel hairpin; right, found in more libraries; higher, better scored. Colour marks star-arm reads.
    tag: sr-ov-hl-novel
    index: ov-hl-novel
    layout: {x: 3, y: 7, w: 5, h: 5}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers. A tab the run does not have is left out, and a heading whose
  # tabs are all missing is hidden.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Library QC](tab:Library QC)

      ### Expression
      - [miRNA Expression](tab:miRNA Expression)
      - [Group Comparison](tab:Group Comparison)

      ### Sequences
      - [isomiRs](tab:isomiRs)
      - [Novel miRNAs](tab:Novel miRNAs)
    section: How to read this dashboard
    tag: sr-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters: the design group, then the sample.
  - component_type: interactive
    workflow_tag: smrnaseq
    data_collection_tag: metadata
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: sr-filter-group
    index: sample-filters-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: smrnaseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: sr-filter-sample
    index: sample-filters-sample
    title: Sample
    layout: {x: 0, y: 3, w: 1, h: 3}
  # Row selection on the sample narrows every tab through the sample links.
  - component_type: table
    workflow_tag: smrnaseq
    data_collection_tag: metadata
    row_selection_enabled: true
    row_selection_column: '{METADATA_ID_COL}'
    section: Sample sheet
    tag: sr-sheet-design
    index: sheet-design
    title: Design table
    description: One row per sample as the design file declares it; absent on a run without one.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: smrnaseq
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample
    section: Sample sheet
    tag: sr-sheet-samples
    index: sheet-samples
    title: Library summary
    description: One row per library, with its miRNA depth, miRTrace composition and miRDeep2 calls.
    layout: {x: 0, y: 6, w: 8, h: 6}

tabs:
- title: MultiQC
  subtitle: Did the adapter come off and the reads map?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # Bound to multiqc_data, so the tab keeps a filter of its own.
  filter_sections:
  - name: MultiQC report
    icon: mdi:file-document-outline
    color: orange
    description: Samples as the MultiQC report names them
  grid_sections:
  - name: Read trimming
    icon: mdi:chart-bell-curve
    color: orange
    description: What fastp kept, and how long the reads are after trimming
  - name: Small RNA QC
    icon: mdi:test-tube
    color: orange
    description: miRTrace's verdict on every read, and the isomiR reads mirtop assigned
  - name: Genome mapping
    icon: mdi:dna
    color: orange
    description: How much of each library Bowtie placed on the genome for miRDeep2
  - name: QC details
    icon: mdi:file-document-outline
    color: gray
    description: Distinct isomiRs and the remaining FastQC, fastp and mirtop panels
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [MultiQC](https://multiqc.info) gathers the fastp, FastQC, miRTrace, mirtop and samtools
      reports of every library. Check that the adapter came off and the trimmed reads pile up
      near 22 nt before reading any count. FastQC runs twice, on the raw reads and after
      trimming; the second pass is the fastqc-1 panels.
    tag: sr-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: MultiQC report
    tag: sr-mqc-filter-sample
    index: mqc-sample-filter
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: multiqc
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/fastp
    selected_module: fastp
    selected_plot: Filtered Reads
    section: Read trimming
    tag: sr-mqc-fastp-filtered
    title: Reads kept by fastp
    description: Reads that passed adapter trimming and the length window.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc-1
    selected_plot: Sequence Length Distribution
    section: Read trimming
    tag: sr-mqc-trimmed-length
    title: Read length after trimming
    description: A small RNA library piles up near 22 nt.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/mirtrace
    selected_module: mirtrace
    selected_plot: QC Plot
    section: Small RNA QC
    tag: sr-mqc-mirtrace-qc
    title: miRTrace read QC
    description: Every read by QC outcome, from too short to miRNA.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/mirtop
    selected_module: mirtop
    selected_plot: IsomiR read counts
    section: Small RNA QC
    tag: sr-mqc-mirtop-counts
    title: isomiR read counts by type
    description: The miRNA reads split by isomiR type.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Percent mapped
    section: Genome mapping
    tag: sr-mqc-samtools-mapped
    title: Reads mapped to the genome
    description: Share of each library's reads placed on the genome.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Alignment stats
    section: Genome mapping
    tag: sr-mqc-samtools-stats
    title: Alignment statistics
    description: Mapped, unmapped and filtered reads per library.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/mirtop
    selected_module: mirtop
    selected_plot: IsomiR unique read counts
    section: QC details
    tag: sr-mqc-mirtop-unique
    title: Distinct isomiR sequences by type
    description: Distinct sequences, not reads, in each isomiR type.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Counts
    section: QC details
    tag: sr-mqc-fastqc-raw-counts
    title: Raw sequence counts
    description: Reads per library before trimming.
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Adapter Content
    section: QC details
    tag: sr-mqc-fastqc-raw-adapter
    title: Adapter content before trimming
    description: Short inserts read into the adapter early.
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/fastp
    selected_module: fastp
    selected_plot: Sequence Quality
    section: QC details
    tag: sr-mqc-fastp-quality
    title: Base quality, fastp
    description: Mean quality along the read, before and after trimming.
    layout: {x: 0, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc-1
    selected_plot: Status Checks
    section: QC details
    tag: sr-mqc-fastqc-trimmed-status
    title: FastQC status after trimming
    description: Pass, warn and fail per FastQC module, trimmed reads.
    layout: {x: 4, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/mirtop
    selected_module: mirtop
    selected_plot: Mean isomiR read counts
    section: QC details
    tag: sr-mqc-mirtop-mean
    title: Mean isomiR read counts
    description: Mean reads per isomiR type, per library.
    layout: {x: 0, y: 12, w: 8, h: 4}

- title: Library QC
  subtitle: Is each library a small RNA library, and a clean one?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:test-tube
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Library filters
    icon: mdi:tune
    color: teal
    description: Keeps the libraries inside a depth or composition range
  grid_sections:
  - name: Libraries at a glance
    icon: mdi:counter
    color: teal
    description: How much of each library is miRNA, how deep and how diverse
  - name: Read length and complexity
