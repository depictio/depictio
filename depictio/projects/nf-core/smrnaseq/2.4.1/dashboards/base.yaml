version: 1
main_dashboard:
  title: nf-core/smrnaseq
  subtitle: "nf-core/smrnaseq 2.4.1: library QC, miRNA expression, group comparison, isomiRs and novel miRNAs"
  project_tag: Small RNA-seq Analysis
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # Left panel. `Sample scope` is persistent and pinned: it reads the sample
  # hub (always present) and the design table (present when METADATA_FILE is
  # given; its filter disappears with it), both of which link to every
  # sample-keyed collection, so the same controls narrow every tab.
  filter_sections:
  - name: Sample scope
    icon: mdi:filter-variant
    color: orange
    description: Which samples and design groups every tab is about
    persistent: true
    pin: top
  - name: Read QC scope
    icon: mdi:tune
    color: blue
    description: Keep the libraries inside a miRNA or rRNA share band
  # Right panel, in the order the pipeline runs: trimming, small RNA QC,
  # isomiR annotation, genome mapping. The miRTrace RNA-type, length,
  # contamination and complexity panels are not repeated here: the Library QC
  # tab draws the same numbers as filterable tiles. The two pinned persistent
  # sections ride every tab; they are declared here, on the tab no route
  # conditional can remove.
  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: The size and design of the run, on every tab
    persistent: true
    pin: top
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The design table and the per-sample summary every tab filters through
    collapsed: true
    persistent: true
    pin: top
  - name: Read trimming
    icon: mdi:chart-bell-curve
    color: blue
    description: What fastp removed and how long the reads are after trimming
  - name: Small RNA QC
    icon: mdi:test-tube
    color: cyan
    description: miRTrace's verdict on every read, and the isomiR counts mirtop assigned
  - name: Genome mapping
    icon: mdi:dna
    color: indigo
    description: How much of each library Bowtie placed on the genome for miRDeep2
  - name: More QC panels
    icon: mdi:file-document-outline
    color: gray
    description: The remaining fastp and FastQC panels
    collapsed: true
  components:
  # ------------------------------------------------------------ run at a glance
  - component_type: card
    tag: sr-glance-samples
    section: Run at a glance
    workflow_tag: smrnaseq
    data_collection_tag: samples
    aggregation: nunique
    column_name: sample
    column_type: object
    secondary_layout: uniqueness
    display: {icon_name: 'mdi:flask'}
    title: Samples
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 2, h: 2}
  # Bound to the design table, so it is pruned with it on a run without one.
  - component_type: card
    tag: sr-glance-groups
    section: Run at a glance
    workflow_tag: smrnaseq
    data_collection_tag: metadata
    aggregation: nunique
    column_name: '{GROUP_COL}'
    column_type: object
    secondary_layout: donut
    breakdown_col: '{GROUP_COL}'
    top_n_count: 4
    display: {icon_name: 'mdi:account-group-outline'}
    title: '{GROUP_COL_DISPLAY} groups'
    title_size: sm
    title_align: left
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: sr-glance-mirna-reads
    section: Run at a glance
    workflow_tag: smrnaseq
    data_collection_tag: samples
    aggregation: sum
    column_name: mirna_reads
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:chart-bar'}
    title: Reads assigned to miRNAs
    title_size: sm
    title_align: left
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: sr-glance-mirnas-detected
    section: Run at a glance
    workflow_tag: smrnaseq
    data_collection_tag: samples
    aggregation: median
    aggregations: [box_plot_stats]
    column_name: mirnas_detected
    column_type: int64
    secondary_layout: box_plot
    display: {icon_name: 'mdi:dna'}
    title: miRNAs detected per sample
    title_size: sm
    title_align: left
    layout: {x: 6, y: 0, w: 2, h: 2}
  # --------------------------------------------------------------- sample sheet
  - component_type: text
    tag: sr-sheet-intro
    section: Sample sheet
    workflow_tag: smrnaseq
    data_collection_tag: samples
    title: The rows every tab filters through
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The design table is the one declared with METADATA_FILE and is absent
      when the run was ingested without one. The sample summary below it is
      always there: one row per sample with its miRNA library size, miRTrace
      composition and miRDeep2 call counts.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: table
    tag: sr-sheet-design
    section: Sample sheet
    workflow_tag: smrnaseq
    data_collection_tag: metadata
    row_selection_enabled: true
    row_selection_column: '{METADATA_ID_COL}'
    title: Design table
    description: One row per sample as the design file declares it. Ticking rows narrows the MultiQC panels to those samples.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 4}
  - component_type: table
    tag: sr-sheet-samples
    section: Sample sheet
    workflow_tag: smrnaseq
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample
    title: Sample summary
    description: One row per sample. Ticking rows selects those samples for the record card on the Library QC tab.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 5, w: 8, h: 5}
  # -------------------------------------------------------------- read trimming
  - component_type: text
    tag: sr-qc-trim-intro
    section: Read trimming
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    title: Adapters out, short reads kept
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [fastp](https://github.com/OpenGene/fastp) removes the 3' adapter and
      keeps reads inside the length window the run set, so the trimmed length
      distribution should pile up where mature miRNAs are, around 22 nt. A
      library whose reads mostly fail the length filter was either adapter
      dimer or degraded RNA.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: sr-qc-fastp-filtered
    section: Read trimming
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/fastp
    selected_module: fastp
    selected_plot: Filtered Reads
    title: Reads kept by fastp
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: sr-qc-trimmed-length
    section: Read trimming
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc-1
    selected_plot: Sequence Length Distribution
    title: Read length after trimming
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  # -------------------------------------------------------------- small RNA QC
  - component_type: text
    tag: sr-qc-smallrna-intro
    section: Small RNA QC
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    title: What the reads are
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [miRTrace](https://github.com/friedlanderlab/mirtrace) sorts every read
      by QC outcome, and [mirtop](https://github.com/miRTop/mirtop) splits the
      miRNA reads by isomiR type. Composition, length and contamination views
      of the same miRTrace numbers are on the Library QC tab.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: sr-qc-mirtrace-qc
    section: Small RNA QC
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/mirtrace
    selected_module: mirtrace
    selected_plot: QC Plot
    title: miRTrace read QC
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: sr-qc-mirtop-counts
    section: Small RNA QC
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/mirtop
    selected_module: mirtop
    selected_plot: IsomiR read counts
    title: isomiR read counts by type
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: sr-qc-mirtop-unique
    section: Small RNA QC
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/mirtop
    selected_module: mirtop
    selected_plot: IsomiR unique read counts
    title: Distinct isomiR sequences by type
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 8, h: 5}
  # ------------------------------------------------------------ genome mapping
  - component_type: multiqc
    tag: sr-qc-samtools-mapped
    section: Genome mapping
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Percent mapped
    title: Reads mapped to the genome
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: multiqc
    tag: sr-qc-samtools-stats
    section: Genome mapping
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Alignment stats
    title: Alignment statistics
    title_size: sm
    title_align: left
    layout: {x: 4, y: 0, w: 4, h: 5}
  # ----------------------------------------------------------- more QC panels
  - component_type: multiqc
    tag: sr-qc-fastqc-raw-counts
    section: More QC panels
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Counts
    title: Raw sequence counts
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: multiqc
    tag: sr-qc-fastqc-raw-adapter
    section: More QC panels
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Adapter Content
    title: Adapter content before trimming
    title_size: sm
    title_align: left
    layout: {x: 4, y: 0, w: 4, h: 5}
  - component_type: multiqc
    tag: sr-qc-fastp-quality
    section: More QC panels
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/fastp
    selected_module: fastp
    selected_plot: Sequence Quality
    title: Base quality, fastp
    title_size: sm
    title_align: left
    layout: {x: 0, y: 5, w: 4, h: 5}
  - component_type: multiqc
    tag: sr-qc-fastqc-trimmed-status
    section: More QC panels
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc-1
    selected_plot: Status Checks
    title: FastQC status after trimming
    title_size: sm
    title_align: left
    layout: {x: 4, y: 5, w: 4, h: 5}
  - component_type: multiqc
    tag: sr-qc-mirtop-mean
    section: More QC panels
    workflow_tag: smrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/mirtop
    selected_module: mirtop
    selected_plot: Mean isomiR read counts
    title: Mean isomiR read counts
    title_size: sm
    title_align: left
    layout: {x: 0, y: 10, w: 8, h: 5}
  # ------------------------------------------------------------------- filters
  - component_type: interactive
    tag: sr-filter-sample
    index: sr-sample-filter
    section: Sample scope
    group: Samples
    workflow_tag: smrnaseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display: {title_size: md, custom_color: '#FB8C00', icon_name: 'mdi:flask'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: sr-filter-group
    index: sr-group-filter
    section: Sample scope
    group: Samples
    workflow_tag: smrnaseq
    data_collection_tag: metadata
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display: {title_size: md, custom_color: '#7B1FA2', icon_name: 'mdi:account-group-outline'}
    placement: left
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: sr-filter-mirna-reads
    index: sr-mirna-reads-filter
    section: Sample scope
    group: Samples
    workflow_tag: smrnaseq
    data_collection_tag: samples
    interactive_component_type: RangeSlider
    column_name: mirna_reads
    column_type: int64
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:chart-bar'}
    placement: left
    title: Reads assigned to miRNAs
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: sr-filter-mirna-pct
    index: sr-mirna-pct-filter
    section: Read QC scope
    group: Library composition
    workflow_tag: smrnaseq
    data_collection_tag: samples
    interactive_component_type: RangeSlider
    column_name: mirna_pct
    column_type: float64
    display: {title_size: md, custom_color: '#1E88E5', icon_name: 'mdi:test-tube'}
    placement: left
    title: miRNA reads (%)
    layout: {x: 0, y: 9, w: 1, h: 3}
  - component_type: interactive
    tag: sr-filter-rrna-pct
    index: sr-rrna-pct-filter
    section: Read QC scope
    group: Library composition
    workflow_tag: smrnaseq
    data_collection_tag: samples
    interactive_component_type: RangeSlider
    column_name: rrna_pct
    column_type: float64
    display: {title_size: md, custom_color: '#1E88E5', icon_name: 'mdi:alert-outline'}
    placement: left
    title: rRNA reads (%)
    layout: {x: 0, y: 12, w: 1, h: 3}

tabs:
# =============================================================================
# Library QC: is each library a small RNA library, and a clean one?
# =============================================================================
- title: Library QC
  tab_order: 1
  tab_icon: mdi:test-tube
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Library scope
    icon: mdi:tune
    color: teal
    description: Keep the libraries inside a composition or depth band
  grid_sections:
  - name: Libraries at a glance
    icon: mdi:counter
    color: teal
    description: What each library is made of, one box per measure
  - name: Read length
    icon: mdi:ruler
    color: blue
    description: Where the reads pile up, as a share of each library
  - name: RNA composition
    icon: mdi:chart-bar
    color: cyan
    description: RNA types, QC outcomes and organism clades per library
  - name: Complexity
    icon: mdi:chart-line
    color: indigo
    description: How many distinct miRNAs deeper sequencing still finds
  - name: Library profile
    icon: mdi:chart-timeline-variant
    color: grape
    description: Every per-library measure on one line
  - name: Sample detail
    icon: mdi:information-outline
    color: gray
    description: Pick a library on the plane, read its record beside it
  components:
  - component_type: card
    tag: sr-lib-card-mirna
    section: Libraries at a glance
    workflow_tag: smrnaseq
    data_collection_tag: samples
    aggregation: median
    aggregations: [box_plot_stats]
    column_name: mirna_pct
    column_type: float64
    secondary_layout: box_plot
    display: {icon_name: 'mdi:test-tube'}
    title: miRNA reads (%)
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: sr-lib-card-rrna
    section: Libraries at a glance
    workflow_tag: smrnaseq
    data_collection_tag: samples
    aggregation: median
    aggregations: [box_plot_stats]
    column_name: rrna_pct
    column_type: float64
    secondary_layout: box_plot
    display: {icon_name: 'mdi:alert-outline'}
    title: rRNA reads (%)
    title_size: sm
    title_align: left
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: sr-lib-card-trna
    section: Libraries at a glance
    workflow_tag: smrnaseq
    data_collection_tag: samples
    aggregation: median
    aggregations: [box_plot_stats]
    column_name: trna_pct
    column_type: float64
    secondary_layout: box_plot
    display: {icon_name: 'mdi:alert-outline'}
    title: tRNA reads (%)
    title_size: sm
    title_align: left
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: sr-lib-card-clade
    section: Libraries at a glance
    workflow_tag: smrnaseq
    data_collection_tag: samples
    aggregation: median
    aggregations: [box_plot_stats]
    column_name: top_clade_pct
    column_type: float64
    secondary_layout: box_plot
    display: {icon_name: 'mdi:shield-check-outline'}
    title: miRNAs in the main clade (%)
    title_size: sm
    title_align: left
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: text
    tag: sr-lib-length-intro
    section: Read length
    workflow_tag: smrnaseq
    data_collection_tag: mirtrace_length
    title: A miRNA library peaks at 20 to 24 nt
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The shaded band is miRTrace's miRNA window; a second peak around 30 nt
      is usually tRNA or piRNA fragments, and a smear to longer reads points at
      degraded RNA. Selecting curves narrows every tab to those libraries.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: sr-lib-length-profile
    index: sr-lib-length-profile
    section: Read length
    workflow_tag: smrnaseq
    data_collection_tag: mirtrace_length
    use: multiqc/length_profile
    config:
      x_title: Read length (nt)
      y_title: Reads (% of library)
      shaded_bands:
        - [18, 26, miRNA]
      selection_enabled: true
      selection_column: sample
      legend_pos: bottom
      controls_placement: header
    title: Read length distribution
    description: One curve per library, as a share of its reads, so libraries of different depth overlay.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 7}
  - component_type: text
    tag: sr-lib-composition-intro
    section: RNA composition
    workflow_tag: smrnaseq
    data_collection_tag: mirtrace_composition
    title: Three ways to split a library
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Switch the level between RNA type (the miRNA share is the headline),
      miRTrace's read QC outcome, and the organism clade of the detected
      miRNAs, where anything outside the sequenced species' clade flags
      contamination.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: sr-lib-composition
    index: sr-lib-composition
    section: RNA composition
    workflow_tag: smrnaseq
    data_collection_tag: mirtrace_composition
    use: multiqc/rna_composition
    config:
      default_rank: RNA type
      top_n: 12
      sort_by: abundance
      normalise_to_one: true
      sample_sort: first_taxon
      controls_placement: header
    title: Library composition
    description: Stacked to 100 % per library. The Clade level counts detected miRNAs, not reads.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 7}
  - component_type: text
    tag: sr-lib-complexity-intro
    section: Complexity
    workflow_tag: smrnaseq
    data_collection_tag: mirtrace_complexity
    title: Has the library been sequenced deep enough?
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A curve that has flattened at the library's full depth would find few
      new miRNAs with more reads; one still climbing was sequenced short of
      its complexity.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: sr-lib-complexity
    index: sr-lib-complexity
    section: Complexity
    workflow_tag: smrnaseq
    data_collection_tag: mirtrace_complexity
    use: multiqc/complexity_curve
    config:
      x_title: Reads sampled
      y_title: Distinct miRNAs detected
      log_x: true
      selection_enabled: true
      selection_column: sample
      legend_pos: bottom
      controls_placement: header
    title: miRNA complexity curves
    description: Distinct miRNAs against reads sampled, per library, on a log depth axis.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 7}
  - component_type: text
    tag: sr-lib-profile-intro
    section: Library profile
    workflow_tag: smrnaseq
    data_collection_tag: samples
    title: The odd library out, on every measure at once
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each line is a library across its miRNA depth, detection, composition,
      reference isoform share and miRDeep2 calls. Brush an axis to keep the
      libraries inside that range.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: sr-lib-parcoords
    index: sr-lib-parcoords
    section: Library profile
    workflow_tag: smrnaseq
    data_collection_tag: samples
    viz_kind: parallel_coordinates
    config:
      viz_kind: parallel_coordinates
      sample_col: sample
      scale: minmax
      metric_cols:
        - mirna_reads
        - mirnas_detected
        - mirnas_10cpm
        - mirna_pct
        - rrna_pct
        - trna_pct
        - reference_isoform_pct
        - novel_candidates
      controls_placement: header
    title: Per-library profile
    description: Each axis rescaled to its own range; the ticks keep the original units.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 7}
  - component_type: text
    tag: sr-lib-detail-intro
    section: Sample detail
    workflow_tag: smrnaseq
    data_collection_tag: samples
    title: Depth against miRNA share
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A library low on both axes is the first to question. Click a point to
      read its record on the right.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: sr-lib-detail-plane
    index: sr-lib-detail-plane
    section: Sample detail
    workflow_tag: smrnaseq
    data_collection_tag: samples
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: mirna_reads
      y_col: mirna_pct
      label_col: sample
      color_col: top_clade
      x_title: Reads assigned to miRNAs
      y_title: miRNA reads (%)
      log_x: true
      marker_size: 10
      selection_enabled: true
      selection_column: sample
      legend_pos: bottom
      controls_placement: header
    title: miRNA depth and share per library
    description: One point per library, coloured by the clade holding most of its detected miRNAs.
    title_size: h3
    layout: {x: 0, y: 1, w: 5, h: 8}
  - component_type: advanced_viz
    tag: sr-lib-detail-record
    index: sr-lib-detail-record
    section: Sample detail
    workflow_tag: smrnaseq
    data_collection_tag: samples
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: sr-lib-detail-plane
      id_col: sample
      selection_source: any
      sections:
        miRNA library: [mirna_reads, mirnas_detected, mirnas_10cpm, reference_isoform_pct]
        miRTrace composition: [mirna_pct, rrna_pct, trna_pct, artifact_pct, unknown_pct, top_clade, top_clade_pct]
