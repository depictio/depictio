# nf-core/proteinfamilies Template v2.5.0 - Protein family generation
# ============================================================================
# This is a TEMPLATE project configuration. Use with:
#   depictio run --template nf-core/proteinfamilies/2.5.0 --data-root /path/to/results \
#     [--var METADATA_FILE=/path/to/samplesheet.csv]
#
# Tested against nf-core/proteinfamilies AWS megatest results:
#   s3://nf-core-awsmegatests/proteinfamilies/results-f8c0b183e59df3d87c38d0f7c4acc6918593f4f5
#   (test_full profile, see megatest.yaml for the fetch manifest)
# ============================================================================
#
# DESIGN METADATA. proteinfamilies reads its samplesheet from --input and does
# not publish it, so the sample hub reads the file named by METADATA_FILE
# (default: input/samplesheet.csv under DATA_ROOT, where download_test_data.sh
# puts the vendored megatest sheet). The `samples` recipe derives `mode`
# (create / update) from whether a row names existing HMMs to update; it is
# the default GROUP_COL, and any column a user adds to the sheet can replace it.
#
# KEYS. Per-family files are laid out <step>/<sample>/<family>.<ext>, so every
# family collection carries the sample (the directory) and the family (the
# file name); the families hub fans the family out to the alignment, residue
# and member collections. Families an update run extended live under
# update_families/ and carry origin "updated".
#
# PROFILES. The family HMMs (hmm/) are also drawn as sequence logos. Each state is
# mapped onto the residues of the family representative through the hmmalign
# alignment of the family (full_msa/raw/hmmer_hmmalign/<sample>/<family>.sto.gz),
# so a state picked on the logo selects the same residue in the structure and the
# sequence track. Families an update run extended have no such alignment: their
# logo is drawn, but a pick on it selects no residue. The same alignment gives
# the members' coverage of the model (the hits lane under the logo).
#
# ALIGNER. The alignment scans read FAMSA (.aln, the default) and MAFFT (.fas)
# full alignments alike; runs with --skip_sequence_redundancy_removal write
# HH-suite reformatted .fas.gz under full_msa/filtered/hhsuite_reformat/, which
# the same scan picks up.
template:
  template_id: "nf-core/proteinfamilies/2.5.0"
  description: "nf-core/proteinfamilies protein family template: how the input sequences clustered, the families built or extended with their seed, model and alignment statistics, each family's alignment, residue conservation and predicted structure, and the members with their identity to the representative."
  version: "1.0.0"
  variables:
    - name: "DATA_ROOT"
      description: "proteinfamilies output directory (qc/, mmseqs/, family_reps/, full_msa/, hmm/, update_families/, pipeline_info/)."
      required: true
    - name: "METADATA_FILE"
      description: "The samplesheet the run was started with (--input: sample, fasta, optional existing_hmms_to_update and existing_msas_to_update, plus any design columns). Defaults to input/samplesheet.csv under DATA_ROOT."
      required: false
      default: "{DATA_ROOT}/input/samplesheet.csv"
    - name: "METADATA_ID_COL"
      description: "Samplesheet id column. proteinfamilies fixes it to sample; recorded for the metadata auto-detection."
      required: false
      default: "sample"
    - name: "GROUP_COL"
      description: "Samplesheet column the dashboard groups and filters samples by. Defaults to mode (create or update), derived from the sheet; name any design column added to the sheet instead."
      required: false
      default: "mode"
    - name: "GROUP_COL_DISPLAY"
      description: "Reader-facing label of GROUP_COL, used in filter and card titles."
      required: false
      default: "Mode"
  # Variables used when materialising the bundled reference dataset.
  reference:
    vars:
      METADATA_FILE: "{DATA_ROOT}/input/samplesheet.csv"
      METADATA_ID_COL: "sample"
      GROUP_COL: "mode"
      GROUP_COL_DISPLAY: "Mode"
  provenance:
    sources:
      - name: "params"
        glob: "pipeline_info/params*.json"
        format: "json"
        pick: "latest"
        exclude_keys:
          - "hook_url"
          - "email*"
      - name: "software_versions"
        glob: "pipeline_info/*software*versions*.yml"
        format: "yaml"
        pick: "latest"
        group: "Software versions"
    groups:
      - group: "Preprocessing"
        key_patterns: ["skip_preprocessing", "min_seq_length", "max_seq_length", "remove_duplicates_on_sequence"]
      - group: "Initial clustering"
        key_patterns: ["clustering_tool", "cluster_seq_identity", "cluster_coverage", "cluster_cov_mode", "cluster_size_threshold", "clusters_per_chunk", "save_mmseqs_*"]
      - group: "Family generation"
        key_patterns: ["family_generation_algorithm", "alignment_tool", "skip_msa_trimming", "clipkit_out_format", "trim_ends_only", "gap_threshold", "skip_additional_sequence_recruiting", "hmmsearch_*"]
      - group: "Redundancy removal"
        key_patterns: ["skip_family_redundancy_removal", "skip_family_merging", "skip_sequence_redundancy_removal", "cluster_*_for_redundancy", "save_non_redundant_*"]
      - group: "Downstream outputs"
        key_patterns: ["skip_phylogenetic_inference", "skip_proteinfold_samplesheet", "skip_proteinannotator_samplesheet", "save_update_families_*", "save_iterative_family_metadata"]
      - group: "Run context"
        key_patterns: ["input", "outdir", "version", "publish_dir_mode", "monochrome_logs", "validate_params", "help*", "show_hidden", "pipelines_testdata_base_path", "trace_report_suffix", "config_profile_*", "custom_config_*", "multiqc_*", "max_multiqc_email_size", "plaintext_email"]
    highlight:
      - "clustering_tool"
      - "cluster_seq_identity"
      - "cluster_coverage"
      - "cluster_size_threshold"
      - "family_generation_algorithm"
      - "alignment_tool"
      - "hmmsearch_evalue_cutoff"
      - "hmmsearch_query_length_threshold"
      - "cluster_seq_identity_for_redundancy"
  dashboards:
    - "dashboards/base.yaml"

# ============================================================================
# PROJECT CONFIGURATION
# ============================================================================

name: "proteinfamilies Protein Families"
project_type: "advanced"
is_public: true
workflows:
  - name: "proteinfamilies"
    version: "2.5.0"
    engine:
      name: "nextflow"
    catalog:
      name: "nf-core"
      url: "https://nf-co.re"
    repository_url: "https://github.com/nf-core/proteinfamilies"
    data_location:
      structure: "flat"
      locations:
        - "{DATA_ROOT}"
    data_collections:
      # ----------------------------------------------------------------
      # Hub: the samplesheet, one row per sample
      # ----------------------------------------------------------------
      - data_collection_tag: "samples"
        description: "The run's samplesheet, one row per sample, with the create or update mode derived from it"
        config:
          type: "Table"
          metatype: "Metadata"
          source: "transformed"
          transform:
            recipe: "nf-core/proteinfamilies/samples.py"
            source_overrides:
              samplesheet:
                path: "{METADATA_FILE}"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Sample id, the directory every per-sample output sits in"
              "mode": "update when the row names existing family HMMs to extend, else create"
              "fasta": "Input protein FASTA file name"
              "existing_hmms_to_update": "Archive of existing family HMMs the sample extends (update mode)"
              "existing_msas_to_update": "Archive of the matching family alignments (update mode)"

      # ----------------------------------------------------------------
      # Input sequences and initial clustering
      # ----------------------------------------------------------------
      - data_collection_tag: "seqfu_stats_raw"
        description: "Raw SeqFu statistics of the input sequences before and after preprocessing (input of sequence_stats)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: "(?:.*/)?qc/[^/]+/[^/]+_(?:before|after)\\.tsv$"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
              include_file_paths: "source_path"
              infer_schema_length: 0
            columns_description:
              "File": "Input file SeqFu read"
              "#Seq": "Sequences in the file"
              "Total bp": "Residues summed over the sequences"
              "Avg": "Mean sequence length"
              "N50": "N50 of the sequence lengths"
              "N75": "N75 of the sequence lengths"
              "N90": "N90 of the sequence lengths"
              "auN": "Area under the Nx curve"
              "Min": "Shortest sequence"
              "Max": "Longest sequence"
              "source_path": "File the row came from; the sample and the stage are derived from its name"

      - data_collection_tag: "sequence_stats"
        description: "Input protein sequences per sample before and after preprocessing: count, total and mean length, N50 and extremes"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "seqfu/stats.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Sample id"
              "stage": "before or after preprocessing (length filter, gap removal, deduplication)"
              "file": "Input file SeqFu read"
              "sequences": "Sequences in the file"
              "total_length": "Residues summed over the sequences"
              "mean_length": "Mean sequence length, residues"
              "n50": "N50 of the sequence lengths"
              "n75": "N75 of the sequence lengths"
              "n90": "N90 of the sequence lengths"
              "aun": "Area under the Nx curve"
              "min_length": "Shortest sequence, residues"
              "max_length": "Longest sequence, residues"

      - data_collection_tag: "proteinfamilies_cluster_distribution_raw"
        description: "Raw initial MMseqs2 cluster size distribution per sample (input of cluster_sizes)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: ".*_clustering_distribution_mqc\\.csv$"
          dc_specific_properties:
            format: "CSV"
            polars_kwargs:
              separator: ","
              comment_prefix: "#"
              include_file_paths: "source_path"
              infer_schema_length: 0
            columns_description:
              "Id": "Row id (the cluster size)"
              "Cluster Size": "Members per cluster"
              "Number of Clusters": "Clusters of that size"
              "source_path": "File the row came from; the sample is derived from its name"

      - data_collection_tag: "cluster_sizes"
        description: "Initial MMseqs2 clusters per size and sample, with the sequences they hold"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "proteinfamilies/cluster_size_distribution.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Sample id"
              "cluster_size": "Members per cluster"
              "n_clusters": "Clusters of that size"
              "n_sequences": "Sequences in clusters of that size"
              "sequence_share": "Share of the sample's clustered sequences, 0 to 1"

      # ----------------------------------------------------------------
      # Per-family files, read as text (one line per row)
      # ----------------------------------------------------------------
      - data_collection_tag: "proteinfamilies_family_meta_raw"
        description: "Raw family metadata tables of the families built and extended (input of families)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: "(?:.*/)?family_reps/[^/]+/[^/]+_meta_mqc\\.csv$"
          dc_specific_properties:
            format: "CSV"
            polars_kwargs:
              separator: ","
              comment_prefix: "#"
              include_file_paths: "source_path"
              infer_schema_length: 0
            columns_description:
              "Sample Name": "MultiQC row key, the family id"
              "Family Id": "Family id"
              "Size": "Member sequences"
              "Representative Length": "Residues of the representative"
              "Representative Id": "Id of the representative sequence"
              "Sequence": "Representative sequence"
              "source_path": "File the row came from; the sample and the origin are derived from its path"

      - data_collection_tag: "proteinfamilies_family_members_raw"
        description: "Raw family member rosters (input of family_members)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: "(?:.*/)?family_reps/[^/]+/[^/]+\\.tsv$"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
              include_file_paths: "source_path"
              infer_schema_length: 0
            columns_description:
              "family_id": "Family id"
              "member_id": "Member sequence id"
              "source_path": "File the row came from; the sample and the origin are derived from its path"

      - data_collection_tag: "famsa_alignment_raw"
        description: "Raw full family alignments, one file line per row (input of family_msa, family_residues, families and family_members)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: "(?:.*/)?(?:full_msa/filtered/(?:famsa_align|mafft_align|hhsuite_reformat)|update_families/full_msa/(?:famsa_align|mafft_align))/[^/]+/[^/]+\\.(?:aln|fas)(?:\\.gz)?$"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\x1f"
              quote_char: null
              has_header: false
              new_columns: ["raw"]
              include_file_paths: "source_path"
              infer_schema_length: 0
            columns_description:
              "raw": "One line of an aligned FASTA file"
              "source_path": "File the line came from; the sample and the family are derived from its path"

      - data_collection_tag: "hmmer_hmm_raw"
        optional: true  # the families table fills its model columns with nulls without them; the profile collection needs them
        description: "Raw family HMMs, one file line per row (input of families and hmm_profile)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: "(?:.*/)?(?:hmm/(?:filtered|raw/[^/]+)|update_families/hmm)/[^/]+/[^/]+\\.hmm\\.gz$"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\x1f"
              quote_char: null
              has_header: false
              new_columns: ["raw"]
              include_file_paths: "source_path"
              infer_schema_length: 0
            columns_description:
              "raw": "One line of a HMMER3 profile"
              "source_path": "File the line came from; the family is derived from its name"

      - data_collection_tag: "hmmer_hmmalign_raw"
        optional: true  # hmmalign alignments of the families, published by default under full_msa/raw
        description: "Raw hmmalign family alignments (Stockholm), one file line per row (input of hmm_profile and hmmalign_hits)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: "(?:.*/)?full_msa/raw/hmmer_hmmalign/[^/]+/[^/]+\\.sto(?:\\.gz)?$"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\x1f"
              quote_char: null
              has_header: false
              new_columns: ["raw"]
              include_file_paths: "source_path"
              infer_schema_length: 0
            columns_description:
              "raw": "One line of a Stockholm alignment"
              "source_path": "File the line came from; the sample and the family are derived from its path"

      # ----------------------------------------------------------------
      # Families: the family hub and what hangs off it
      # ----------------------------------------------------------------
      - data_collection_tag: "families"
        description: "One row per family: origin, size, representative, seed and recruited members, HMM length and effective sequences, alignment identity and conservation"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "proteinfamilies/family_metadata.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "family": "Family id"
              "sample": "Sample the family was built from or extended with"
              "origin": "new (built by this run) or updated (an existing family the run extended)"
              "size": "Member sequences"
              "representative_id": "Id of the representative sequence"
              "representative_length": "Residues of the representative"
              "sequence": "Representative sequence"
              "seed_size": "Sequences the family HMM was built from"
              "recruited": "Members beyond the HMM seed (size minus seed size, floored at 0)"
              "effective_sequences": "HMMER effective sequence number of the model"
              "model_length": "Match states of the family HMM"
              "aligned_members": "Rows of the full family alignment"
              "alignment_columns": "Columns of the full family alignment"
              "mean_identity": "Mean identity of the members to the representative, 0 to 1"
              "mean_coverage": "Mean share of the representative the members cover, 0 to 1"
              "mean_conservation": "Mean conservation score along the representative, 0 to 1"
              "conserved_share": "Share of representative residues scored conserved, 0 to 1"

      - data_collection_tag: "family_members"
        description: "One row per family member, with its identity to the representative, coverage and length"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "proteinfamilies/family_members.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "family": "Family id"
              "member_id": "Member sequence id"
              "sample": "Sample the family was built from or extended with"
              "origin": "new or updated (see families)"
              "is_representative": "The family's representative sequence"
              "in_alignment": "The member is a row of the family's full alignment"
              "identity": "Identity to the representative over shared columns, 0 to 1"
              "coverage": "Share of the representative's residues the member covers, 0 to 1"
              "length": "Ungapped member length, residues"

      - data_collection_tag: "family_msa"
        description: "Full family alignments as the MSA table: one row per aligned sequence, the representative first, capped at 500 rows per family"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "famsa/alignment.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "msa_id": "Family id"
              "seq_id": "Aligned sequence id"
              "rank": "Row order, 0 is the family representative"
              "aligned_sequence": "Aligned row, gaps as -"
              "identity": "Identity to the representative over shared columns, 0 to 1"
              "coverage": "Share of the representative's residues the row covers, 0 to 1"
              "sample": "Sample the family was built from or extended with"

      - data_collection_tag: "family_residues"
        description: "One row per residue of every family representative: conservation score and class, column consensus and occupancy"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "famsa/conservation.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "entity": "Family id"
              "sample": "Sample the family was built from or extended with"
              "position": "Residue number along the representative, 1-based"
              "residue": "Representative residue"
              "value": "Conservation score, 0 (as diverse as random sequence) to 1 (invariant, gap-free)"
              "category": "conserved (0.7 and above), intermediate (0.4 to 0.7) or variable"
              "consensus": "Most frequent residue of the alignment column"
              "consensus_share": "Share of the column's residues equal to the consensus"
              "occupancy": "Share of members with a residue in the column"
              "n_members": "Aligned members the column is computed over"
              "sequence": "Ungapped representative sequence"

      - data_collection_tag: "hmm_profile"
        optional: true  # needs the family HMMs (hmm/)
        description: "Profile HMM of every family: one row per match state and letter, mapped onto the residues of the family representative"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "hmmer/hmm_profile.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "entity": "Family id (the HMM name)"
              "position": "Residue of the family representative at the state (1-based, as in family_residues), empty where the representative has a deletion or the family has no hmmalign alignment"
              "hmm_name": "HMM name, the family id"
              "hmm_acc": "HMM accession"
              "hmm_position": "Match state, 1 to the model length"
              "hmm_letter": "Amino acid the row's emission belongs to"
              "emission": "Match emission probability of the letter at the state"
              "height_bits": "Letter height in bits, relative entropy above background"
              "info_bits": "Stack height of the state, bits"
              "insert_prob": "Probability of an insert after the state"
              "insert_length": "Expected length of an insert after the state"
              "occupancy": "Probability that the state is used"
              "delete_prob": "One minus the occupancy"
              "consensus": "Consensus residue of the state"
              "rf": "Reference annotation character of the state"
              "cs": "Consensus structure character of the state"
              "map_column": "Column of the seed alignment the state was built from"
              "sample": "Sample the family was built from or extended with"

      - data_collection_tag: "hmmalign_hits"
        optional: true  # needs the hmmalign alignments (full_msa/raw)
        description: "Where each family member sits on the family HMM: the states it covers, from the hmmalign alignment"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "hmmer/hmmalign_hits.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "entity": "Member sequence id"
              "sample": "Sample the family was built from or extended with"
              "label": "Family id (the HMM name)"
              "protein_length": "Residues of the member"
              "hmm_length": "Match states of the family HMM"
              "hmm_from": "First HMM state the member has a residue at"
              "hmm_to": "Last HMM state the member has a residue at"
              "ali_from": "The member's residue at the first covered state, counted along the member"
              "ali_to": "The member's residue at the last covered state, counted along the member"
              "hmm_coverage": "Share of the model between the first and the last covered state, 0 to 1"
              "i_evalue": "Always empty: an alignment carries no search statistics"
              "dom_score": "Always empty: an alignment carries no search statistics"

links:
  # Samplesheet hub to every sample-level collection.
  - source_dc_tag: "samples"
    source_column: "sample"
    target_dc_tag: "sequence_stats"
    target_type: "table"
    link_config: {resolver: "direct", target_field: "sample"}
    description: "Filter the input sequence statistics by samplesheet samples"
    enabled: true
  - source_dc_tag: "samples"
    source_column: "sample"
    target_dc_tag: "cluster_sizes"
    target_type: "table"
    link_config: {resolver: "direct", target_field: "sample"}
    description: "Filter the cluster size distribution by samplesheet samples"
    enabled: true
  - source_dc_tag: "samples"
    source_column: "sample"
    target_dc_tag: "families"
    target_type: "table"
    link_config: {resolver: "direct", target_field: "sample"}
    description: "Filter the families by samplesheet samples"
    enabled: true
  - source_dc_tag: "samples"
    source_column: "sample"
    target_dc_tag: "family_members"
    target_type: "table"
    link_config: {resolver: "direct", target_field: "sample"}
    description: "Filter the family members by samplesheet samples"
    enabled: true
  - source_dc_tag: "samples"
    source_column: "sample"
    target_dc_tag: "family_msa"
    target_type: "table"
    link_config: {resolver: "direct", target_field: "sample"}
    description: "Filter the family alignments by samplesheet samples"
    enabled: true
  - source_dc_tag: "samples"
    source_column: "sample"
    target_dc_tag: "family_residues"
    target_type: "table"
    link_config: {resolver: "direct", target_field: "sample"}
    description: "Filter the residue conservation by samplesheet samples"
    enabled: true
  - source_dc_tag: "samples"
    source_column: "sample"
    target_dc_tag: "hmm_profile"
    target_type: "table"
    link_config: {resolver: "direct", target_field: "sample"}
    description: "Filter the profile HMMs by samplesheet samples"
    enabled: true
  - source_dc_tag: "samples"
    source_column: "sample"
    target_dc_tag: "hmmalign_hits"
    target_type: "table"
    link_config: {resolver: "direct", target_field: "sample"}
    description: "Filter the members' coverage of the models by samplesheet samples"
    enabled: true
  # Families hub to every family-level collection.
  - source_dc_tag: "families"
    source_column: "family"
    target_dc_tag: "family_members"
    target_type: "table"
    link_config: {resolver: "direct", target_field: "family"}
    description: "Filter the members by family"
    enabled: true
  - source_dc_tag: "families"
    source_column: "family"
    target_dc_tag: "family_msa"
    target_type: "table"
    link_config: {resolver: "direct", target_field: "msa_id"}
    description: "Filter the alignments by family"
    enabled: true
  - source_dc_tag: "families"
    source_column: "family"
    target_dc_tag: "family_residues"
    target_type: "table"
    link_config: {resolver: "direct", target_field: "entity"}
    description: "Filter the residue conservation by family"
    enabled: true
  - source_dc_tag: "families"
    source_column: "family"
    target_dc_tag: "hmm_profile"
    target_type: "table"
    link_config: {resolver: "direct", target_field: "hmm_name"}
    description: "Filter the profile HMMs by family"
    enabled: true
