      color_mode: value
      representations: [cartoon]
      highlight_site: true
      show_variants: false
      layout: structure_text
      selection_enabled: true
      follow_selection: true
    section: Fold, track and alignment
    tag: pf-aln-av-structure
    index: aln-structure
    title: Predicted structure of the representative
    description: >-
      The predicted fold of the picked family's representative, coloured by the conservation score of each
      residue, with the written sequence below it.

      How to read: the legend gives a gradient from the lowest to the highest score in view, so a
      conserved patch reads as one end of the scale and a variable loop as the other. Click residues in
      the written sequence to select them; the track and the alignment follow.

      Lines and annotations: the colours are a continuous gradient of the 0 to 1 conservation score, with
      no class boundaries. A selected residue is highlighted on the fold.

      Note: the fold is predicted from the representative's sequence alone, on demand (ESMFold through the
      structure resolver, when the server enables it), not an experimental structure. By default only
      sequences up to 400 residues are folded.

