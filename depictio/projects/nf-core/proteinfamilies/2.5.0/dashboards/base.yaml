      One point per member: how much of the representative it covers (horizontal) against its identity to
      the representative (vertical). The point is sized by the member's length and coloured by origin.

      How to read: members at the top right are complete and close to the representative. Fragments sit to
      the left, with low coverage, and divergent members sit low, with low identity. Click a point to open
      its record.

