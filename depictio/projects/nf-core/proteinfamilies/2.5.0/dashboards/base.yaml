  - component_type: advanced_viz
    workflow_tag: proteinfamilies
    data_collection_tag: family_msa
    use: famsa/family_msa
    config:
      color_scheme: clustal
      max_rows: 200
      sort_by: rank
      show_consensus: true
      show_conservation: true
      entity_col_for_selection: entity
      position_col_for_selection: position
      selection_enabled: true
      follow_selection: true
    section: Fold, track and alignment
    tag: pf-aln-av-msa
    index: aln-msa
    title: Family alignment
    description: >-
      The full alignment of the picked family: the representative on the first row and the members below
      it, up to 200 rows, with a consensus row and a conservation bar per column above.

      How to read: colours follow the Clustal X residue classes, so a column of one colour is a column of
      similar residues, and uncoloured cells are residues whose class is not held by half of the column.
      The consensus row shows the most frequent residue and fades where few members share it. Brush
      columns to select the same residues on the track and the structure.

      Lines and annotations: the colours are the Clustal X classes of Jalview, which colours a residue
      only where its class passes a share of the column that depends on the class (over 50, 60 or 85
      percent) and always colours glycine and proline. This tile applies one cut to every class, a class
      holding at least half of the column, so it simplifies Jalview's table. The conservation bars are
      the template's entropy score, the same as the track.

      Note: only the first 200 rows are drawn; the Members tab lists every member.

      Source: Jalview colour schemes, https://www.jalview.org/help/html/colourSchemes/clustal.html
    layout: {x: 3, y: 6, w: 5, h: 3}
  - component_type: table
    workflow_tag: proteinfamilies
    data_collection_tag: family_residues
    use: famsa/conservation
    columns: [position, residue, value, category, consensus, consensus_share, occupancy, n_members]
    section: Residue table
