      occupancy and the number of members.

      How to read: sort on the score to list the most conserved residues. A residue whose consensus
      differs from the residue itself sits in a column where the representative is the odd one out. Rows
      follow the family picked on the plot above.

      Lines and annotations: the class column uses the three bands of the template: conserved from 0.7 up,
      intermediate from 0.4 to 0.7 and variable below 0.4.

      Note: the 0.7 and 0.4 class boundaries are a display aid of this template, not a validated or
      published cut-off. Read the score itself for anything that matters.
    layout: {x: 0, y: 0, w: 8, h: 6}
