version: 1
# nf-core/proteinfamilies 2.5.0, on the family rules of depictio/projects/nf-core/RULES.md
# (ampliseq/2.18.0 is the reference implementation).
#
# Funnel: the input sequences with their initial clusters (Data & QC) -> the
# families the run built or extended and their members (Families) -> one
# family's alignment, residue conservation and predicted structure, and its
# profile HMM as a sequence logo with the members that matched it (Alignment).
# The samplesheet (`samples`) is what every filter starts from: its links carry
# a pick to every sample-level table by sample, and the families hub carries a
# family pick to every family-level table.
#
# Routes: a run that did not publish the hmmalign alignments (full_msa/raw) or
# the family HMMs loses the profile and hits collections, and the logo with them.
main_dashboard:
  title: nf-core/proteinfamilies
  subtitle: Protein families, from the input sequences to each family's profile HMM
  project_tag: proteinfamilies Protein Families
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family.
  category_colors:
    '{GROUP_COL}': auto
    # Families the run built from scratch against existing ones it extended.
    origin:
      new: '#1c7ed6'
      updated: '#f59f00'
    # The conservation classes of the residue table, shared by the track, the
    # 3D colouring and the histogram.
    category:
      conserved: '#2f9e44'
      intermediate: '#f59f00'
      variable: '#868e96'
    # A run builds hundreds of families: the eight largest take the palette,
    # largest first, so a family keeps its colour across the figures.
    family:
      '*': 'auto:size'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. Both
  # are bound to the samplesheet, the source of every sample link.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab, which no route removes.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The samplesheet behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The family table behind the tiles, narrowed by the filters
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Samples, below).
  - component_type: interactive
    workflow_tag: proteinfamilies
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Key figures
    tag: pf-ov-kf-group
    index: ov-kf-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: proteinfamilies
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: pf-ov-kf-sample
    index: ov-kf-sample
    title: Sample
    layout: {x: 2, y: 0, w: 2, h: 1}
  # The pipeline's wordmark, read from its repository; where it cannot load (no
  # internet), the title is drawn as text.
  - component_type: text
    title: nf-core/proteinfamilies
    logo: https://raw.githubusercontent.com/nf-core/proteinfamilies/master/docs/images/nf-core-proteinfamilies_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/proteinfamilies/master/docs/images/nf-core-proteinfamilies_logo_dark.png
    order: 1
    body: >
      Protein sequences grouped into families: how they clustered, which families the run built,
      and what each family's alignment and profile model look like. [Run parameters](params:)
    tag: pf-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  # The study: what the run started from, from the samplesheet. Each line cites
  # one collection, so a line goes with its data.
  - component_type: text
    surface: card
    values:
      samples: {dc: samples, column: sample, aggregation: nunique, format: integer}
      n_create: {dc: samples, column: sample, aggregation: nunique, filter_expr: "col('mode') == 'create'", format: integer}
      n_update: {dc: samples, column: sample, aggregation: nunique, filter_expr: "col('mode') == 'update'", format: integer}
      n_seq: {dc: sequence_stats, column: sequences, aggregation: sum, filter_expr: "col('stage') == 'before'", format: si}
    body: |
      ### The study
      - ![](icon:mdi:flask-outline) **Samples** {{samples}}, one protein FASTA each
      - ![](icon:mdi:shape-plus-outline) **Mode** {{n_create}} build new families, {{n_update}} extend existing ones
      - ![](icon:mdi:dna) **Sequences** {{n_seq}} before the length and duplicate filters
      - ![](icon:mdi:file-table-outline) **Samplesheet** [one row per sample](section:Sample sheet), its path in [the run parameters](params:input)
      - ![](icon:mdi:palette-outline) **{GROUP_COL_DISPLAY}** {{legend:{GROUP_COL}}}
    tag: pf-ov-study
    index: ov-study
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash.
  - component_type: text
    surface: card
    body: |
      ### The run
      - ![](icon:mdi:source-branch) **Pipeline** nf-core/proteinfamilies 2.5.0
      - ![](icon:mdi:set-merge) **Clustering** {{param:clustering_tool}} at {{param:cluster_seq_identity}} identity
      - ![](icon:mdi:dna) **Aligner** {{param:alignment_tool}}
      - ![](icon:mdi:filter-outline) **Seed clusters** from {{param:cluster_size_threshold}} sequences
      - ![](icon:mdi:magnify-scan) **Recruiting** E-value {{param:hmmsearch_evalue_cutoff}}
    tag: pf-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  # The marks take the family's colour (the header's), not the theme's blue.
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Five steps from sequences to families
      Each step names its settings and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:set-merge) **Cluster** MMseqs2 groups similar sequences · [Settings](params:cluster) · [Input & Clustering](tab:Input & Clustering)
      2. ![](icon:mdi:dna) **Align** {{param:alignment_tool}} aligns each seed cluster, ClipKIT trims it · [Settings](params:alignment) · [Family alignment](tab:Family alignment)
      3. ![](icon:mdi:chart-bar) **Model** hmmbuild writes a profile HMM per family · [Settings](params:hmm) · [Profile HMM](tab:Profile HMM)
      4. ![](icon:mdi:magnify-scan) **Recruit** hmmsearch gathers the sequences the model matches · [Settings](params:hmmsearch) · [Members](tab:Members)
      5. ![](icon:mdi:filter-outline) **Prune** Redundant sequences and families are dropped · [Settings](params:redundancy) · [Families](tab:Families)
      :::
    tag: pf-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/proteinfamilies clusters protein sequences, aligns each cluster, builds a profile HMM from it and recruits the sequences the model matches. The result is a set of families, each with its members, an alignment and a model. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The sample filters in the left panel apply to every tab: narrow the samples once and the whole dashboard follows. A bar above a section narrows that section only.
    tag: pf-ov-about
    index: ov-about
    layout: {x: 0, y: 7, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. All four read collections every route writes.
  - component_type: card
    workflow_tag: proteinfamilies
    data_collection_tag: samples
    aggregation: nunique
    column_name: sample
    column_type: object
    secondary_layout: composition
    breakdown_col: '{GROUP_COL}'
    display:
      icon_name: mdi:flask-outline
      icon_color: orange
      caption: in the samplesheet, by {GROUP_COL_DISPLAY}
      link: tab:Input & Clustering
    section: Key figures
    tag: pf-ov-kf-samples
    index: ov-kf-samples
    title: Samples
    description: Samples in the samplesheet. The bar splits them by {GROUP_COL_DISPLAY}, create or update.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: proteinfamilies
    data_collection_tag: sequence_stats
    use: seqfu/sequences_total
    aggregation: sum
    column_name: sequences
    column_type: int64
    filter_expr: "col('stage') == 'before'"
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:dna
      icon_color: blue
      caption: per sample, with the spread
      link: tab:Input & Clustering
      format: si
    section: Key figures
    tag: pf-ov-kf-sequences
    index: ov-kf-sequences
    title: Input sequences
    description: Protein sequences the samples started from, before the length and duplicate filters.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: proteinfamilies
    data_collection_tag: families
    use: proteinfamilies/families_total
    aggregation: count
    column_name: family
    column_type: object
    secondary_layout: composition
    breakdown_col: origin
    display:
      icon_name: mdi:shape-outline
      icon_color: violet
      caption: built by the run or extended from existing ones
      link: tab:Families
    section: Key figures
    tag: pf-ov-kf-families
    index: ov-kf-families
    title: Families
    description: Protein families in the result. The bar splits them into new families and existing ones the run extended.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: proteinfamilies
    data_collection_tag: families
    use: proteinfamilies/members_total
    aggregation: sum
    column_name: size
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:account-group-outline
      icon_color: teal
      caption: per family, with the spread
      link: tab:Members
      format: si
    section: Key figures
    tag: pf-ov-kf-members
    index: ov-kf-members
    title: Family members
    description: Sequences that belong to a family. The box shows how many members each family holds.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the group, then the family origin.
  - component_type: interactive
    workflow_tag: proteinfamilies
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Findings
    tag: pf-ov-findings-group
    index: ov-findings-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: proteinfamilies
    data_collection_tag: families
    interactive_component_type: MultiSelect
    column_name: origin
    column_type: object
    display:
      icon_name: mdi:source-branch
      custom_color: orange
      strip_label: Origin
    section: Findings
    tag: pf-ov-findings-origin
    index: ov-findings-origin
    title: Family origin
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing data collections every route writes.
  - component_type: text
    surface: card
    values:
      singles: {dc: cluster_sizes, column: sequence_share, aggregation: median, filter_expr: "col('cluster_size') == 1",
        format: percent}
      n_fam: {dc: families, column: family, aggregation: nunique, format: integer}
      n_mem: {dc: families, column: size, aggregation: sum, format: si}
      max_size: {dc: families, column: size, aggregation: max, format: integer}
      ident: {dc: family_members, column: identity, aggregation: median, format: percent}
      cover: {dc: family_members, column: coverage, aggregation: median, format: percent}
      cons: {dc: family_residues, column: value, aggregation: median, format: 'decimals:2'}
    body: |
      - **{{singles}}** of the input sequences stay alone after clustering – only larger clusters can seed a family [Input & Clustering](tab:Input & Clustering)
      - **{{n_fam}}** families hold **{{n_mem}}** sequences – the largest has {{max_size}} members [Families](tab:Families)
      - **{{ident}}** median identity of a member to its representative – covering {{cover}} of it [Members](tab:Members)
      - **{{cons}}** median conservation score of a representative residue, from 0 to 1 [Family alignment](tab:Family alignment)
    section: Findings
    tag: pf-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per analysis tab, in the order of the rows above. The tiles
  # of a row share a stored height.
  - component_type: highlight
    section: Findings
    source_tab: Input & Clustering
    source_component: inp-cluster-profile
    caption: Clusters of each size, one curve per sample, on log axes; the long tail on the right is what can seed a family.
    hide_legend: true
    tag: pf-ov-hl-clusters
    index: ov-hl-clusters
    layout: {x: 0, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Families
    source_component: fam-landscape
    caption: One point per family, by members and mean conservation; colour is the family origin.
    tag: pf-ov-hl-landscape
    index: ov-hl-landscape
    layout: {x: 4, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Members
    source_component: mem-scatter
    caption: One point per member, by the share of the representative it covers and its identity to it.
    hide_legend: true
    tag: pf-ov-hl-members
    index: ov-hl-members
    layout: {x: 0, y: 6, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Family alignment
    source_component: aln-fig-conservation
    caption: Representative residues by conservation score; colour is the class, conserved at 0.7 and above.
    tag: pf-ov-hl-conservation
    index: ov-hl-conservation
    layout: {x: 4, y: 6, w: 4, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers.
  - component_type: text
    body: |
      ### Data & QC
      - [Input & Clustering](tab:Input & Clustering)

      ### Families
      - [Families](tab:Families)
      - [Members](tab:Members)

      ### Alignment
      - [Family alignment](tab:Family alignment)
      - [Profile HMM](tab:Profile HMM)
    section: How to read this dashboard
    tag: pf-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the group first.
  - component_type: interactive
    workflow_tag: proteinfamilies
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: pf-filter-group
    index: sample-filters-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: proteinfamilies
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: pf-filter-sample
    index: sample-filters-sample
    title: Sample
    layout: {x: 0, y: 2, w: 1, h: 3}
  # Row selection feeds the Analysis panel.
  - component_type: table
    workflow_tag: proteinfamilies
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample
    section: Sample sheet
    tag: pf-sample-sheet
    index: sample-sheet
    title: Samplesheet
    description: >-
      One row per sample of the run: its mode, the input FASTA and the existing family archives an update
      extends. It is the table every sample filter starts from.

      How to read: a sample whose mode is create builds families from its own sequences, and one whose
      mode is update extends the families it names. Check here that each sample has the mode you intended
      before reading the other tabs. A row picked here narrows the sample-level tiles to that sample.

      Note: nf-core/proteinfamilies does not publish its samplesheet, so this table is read from the copy
      given to the template and not from the run's outputs.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: proteinfamilies
    data_collection_tag: families
    use: proteinfamilies/family_metadata
    row_selection_enabled: true
    row_selection_column: family
    section: Reference tables
    tag: pf-ref-families
    index: ref-families
    title: Protein families
    description: >-
      One row per protein family of every sample: its size, representative, seed and recruited members,
      HMM statistics and alignment summary. It is the reference table behind the family plots.

      How to read: sort on the member count to find the large families, on mean conservation to find the
      tight ones, and on mean identity or coverage to find families whose members are distant or
      fragmentary. Members recruited are the members beyond the seed the HMM was built from. A family
      picked here narrows the family-level tables and the alignment tiles to it.

      Note: the alignment columns (identity, coverage, conservation) are blank for a family whose full
      alignment was not published.
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
# ============================================================================
# Data & QC
# ============================================================================
- title: Input & Clustering
  subtitle: How many sequences went in, and how did they cluster?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: mdi:set-merge
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Cluster scope
    icon: mdi:filter-variant
    color: blue
    description: Keep clusters inside a size band
  grid_sections:
  - name: Input at a glance
    icon: mdi:counter
    color: blue
    description: Sequences in, sequences kept, their length and how many stay alone
  - name: Initial clusters
    icon: mdi:chart-line
    color: blue
    description: Clusters of every size, per sample
  - name: Preprocessing
    icon: mdi:chart-bar
    color: blue
    description: Sequences before and after the length and duplicate filters
  - name: Input tables
    icon: mdi:table
    color: gray
    description: Sequence statistics and cluster sizes behind the tiles
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [MMseqs2](https://github.com/soedinglab/MMseqs2) clusters the preprocessed sequences, and only
      clusters above the size threshold seed a family. The curve reads from the right: the long tail
      is what the run can turn into families, while the left stays singletons.
    tag: pf-inp-intro
    index: inp-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: proteinfamilies
    data_collection_tag: cluster_sizes
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: cluster_size
    column_type: int64
    display:
      icon_name: mdi:ruler
      custom_color: pink
    section: Cluster scope
    group: Cluster size
    tag: pf-inp-filter-size
    index: inp-size-range
    title: Members per cluster
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: card
    workflow_tag: proteinfamilies
    data_collection_tag: sequence_stats
    use: seqfu/sequences_total
    aggregation: sum
    column_name: sequences
    column_type: int64
    filter_expr: "col('stage') == 'before'"
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:dna
      icon_color: blue
      caption: per sample, with the spread
      format: si
    section: Input at a glance
    tag: pf-inp-card-input
    index: inp-card-input
    title: Input sequences
    description: Sequences as given, before the length and duplicate filters.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: proteinfamilies
    data_collection_tag: sequence_stats
    use: seqfu/sequences_total
    aggregation: sum
    column_name: sequences
    column_type: int64
    filter_expr: "col('stage') == 'after'"
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display:
      icon_name: mdi:filter-check-outline
      icon_color: teal
      caption: the samples keeping most
      format: si
    section: Input at a glance
    tag: pf-inp-card-kept
    index: inp-card-kept
    title: Sequences kept
    description: Sequences left after the length filter, gap removal and deduplication.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: proteinfamilies
    data_collection_tag: sequence_stats
    use: seqfu/mean_length
    aggregation: median
    column_name: mean_length
    column_type: float64
    filter_expr: "col('stage') == 'after'"
    secondary_layout: histogram
    display:
      icon_name: mdi:ruler
      icon_color: violet
      caption: mean length per sample, residues
      decimals: 0
    section: Input at a glance
    tag: pf-inp-card-length
    index: inp-card-length
    title: Sequence length
    description: Mean length of the kept sequences, residues.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: proteinfamilies
    data_collection_tag: cluster_sizes
    use: proteinfamilies/cluster_size_distribution
    aggregation: median
    column_name: sequence_share
    column_type: float64
    filter_expr: "col('cluster_size') == 1"
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:account-outline
      icon_color: orange
      caption: median per sample, with the spread
      format: percent
    section: Input at a glance
    tag: pf-inp-card-singletons
    index: inp-card-singletons
    title: Sequences left alone
    description: Share of a sample's sequences that form a cluster of one.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: proteinfamilies
    data_collection_tag: cluster_sizes
    use: proteinfamilies/cluster_size_profile
    config:
      x_title: Initial cluster size (members, log)
      y_title: Clusters of that size (log)
      log_x: true
      log_y: true
      legend_pos: bottom
    section: Initial clusters
    tag: pf-inp-av-clusters
    index: inp-cluster-profile
    title: Initial cluster size distribution per sample
    description: >-
      How many MMseqs2 clusters of each size the preprocessed input sequences fell into. One curve per
      sample, with the cluster size on the horizontal axis and the number of clusters of that size on the
      vertical axis, both on log scales.

      How to read: the tail of large clusters is what a run can turn into families, because only clusters
      at or above the minimum cluster size (the run's cluster_size_threshold parameter, 25 by default)
      seed a family. A curve with no tail, or one far below its neighbours, is a sample that will yield
      few families. Open [Families](tab:Families) to see what was built.

      Note: the minimum cluster size is a parameter of the run and is not marked on the plot.

      Source: nf-core/proteinfamilies 2.5.0 parameters, https://nf-co.re/proteinfamilies/2.5.0/parameters
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: proteinfamilies
    data_collection_tag: sequence_stats
    use: seqfu/stats
    visu_type: bar
    dict_kwargs:
      x: sample
      y: sequences
      color: stage
      barmode: group
      labels: {sample: Sample, sequences: Sequences, stage: Stage}
    section: Preprocessing
    tag: pf-inp-fig-sequences
    index: inp-fig-sequences
    title: Input sequences before and after preprocessing
    description: >-
      How many sequences each sample has before and after preprocessing. Bars are grouped per sample, one
      for each stage.

      How to read: preprocessing removes gaps, validates sequences, filters by length and drops
      duplicates. A large drop points at a length range that does not fit the data or at many duplicate
      sequences, so check the length columns of the sequence statistics table below.

      Source: nf-core/proteinfamilies 2.5.0 pipeline summary, https://nf-co.re/proteinfamilies/2.5.0
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    workflow_tag: proteinfamilies
    data_collection_tag: sequence_stats
    use: seqfu/stats
    section: Input tables
    tag: pf-inp-table-sequences
    index: inp-table-sequences
    title: Input sequence statistics
    description: >-
      SeqFu statistics of the input sequences, one row per sample and stage (before and after
      preprocessing): count, total and mean length, N50, N75, N90, auN and the shortest and longest
      sequence.

      How to read: compare the two rows of a sample. After preprocessing the shortest and longest sequence
      should sit inside the length range of the filter, and N50 (the length at which sequences of that
      size or longer hold half of all residues) should stay close to its value before. A sample whose
      count collapses has lost most of its input to the filters.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: proteinfamilies
    data_collection_tag: cluster_sizes
    use: proteinfamilies/cluster_size_distribution
    section: Input tables
    tag: pf-inp-table-clusters
    index: inp-table-clusters
    title: Initial cluster sizes
    description: >-
      The initial MMseqs2 clustering as a table: for every sample and cluster size, how many clusters have
      that size, how many sequences they hold and their share of the sample.

      How to read: the row for cluster size 1 holds the sequences that joined no cluster. A large share
      there means little of the input can seed a family. Sort by cluster size to see how many sequences
      sit in clusters large enough to seed one.
    layout: {x: 0, y: 6, w: 8, h: 6}
