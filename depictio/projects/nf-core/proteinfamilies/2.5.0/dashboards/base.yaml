    tag: pf-mem-av-member-record
    index: mem-member-record
    title: Picked member
    description: >-
      The record of the member picked on the scatter: its family and sample, whether it is the
      representative, and how it aligns to the representative.

      How to read: Alignment gives its identity, coverage and length. A member that is not a row of the
      family's full alignment (In alignment is false) has no identity or coverage.

      Note: nothing shows until a member is picked on the plot to its left.
