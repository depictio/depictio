  # The logo follows the family the picker names, on hmm_name. A brush on
  # its states selects the representative residues they sit on, which the
  # structure, the track and the alignment follow. The hits lane draws every
  # member the family alignment placed on the model. The hits table has no
  # search statistics and numbers a member's residues along the member itself,
  # so the lane binds neither the E-value, the score nor the alignment span (a
  # click on a bar would otherwise pick residues of the member on the
  # representative's tiles).
  - component_type: advanced_viz
    workflow_tag: proteinfamilies
    data_collection_tag: hmm_profile
    use: hmmer/family_logo
    config:
      height_mode: relent_abovebg
      color_scheme: clustal
      show_indel_rows: true
      show_consensus: true
      hits_dc_tag: hmmalign_hits
      hits_model_col: label
      hits_entity_col: entity
      hits_evalue_col: null
      hits_score_col: null
      hits_ali_from_col: null
      hits_ali_to_col: null
      hits_evalue_max: null
      max_hits: 200
      selection_enabled: true
      follow_selection: true
    section: Profile, fold and alignment
    tag: pf-hmm-av-logo
    index: hmm-logo
    title: Profile HMM logo
    description: >-
      The sequence logo of the picked family's profile HMM. Each stack is one match state of the model,
      with a letter's height set by how much more the model expects that residue than the background does,
      and lanes below it for the consensus, insert behaviour, occupancy and the members that matched each
      state.

      How to read: tall stacks are strongly constrained states and flat ones are tolerant. A state with a
      high insert probability or low occupancy is where members often gain or lose residues, and members
      that stop short in the hits lane are fragments. Brush states to select the matching residues on the
      structure, track and alignment.

      Lines and annotations: letter heights are the relative entropy above background, in bits, so only
      letters more likely than background get a height. The hits lane draws every member the alignment
      placed on the model, up to 200, with no E-value filter because an alignment carries no search
      statistics. Letters are coloured with the Clustal X residue classes.

      Note: families an update run extended have no hmmalign alignment, so their logo is drawn but a pick
      on it selects no residue and the hits lane has nothing to draw.

      Sources: Wheeler, Clements and Finn 2014, BMC Bioinformatics,
      https://doi.org/10.1186/1471-2105-15-7; HMMER hmmlogo manual,
      https://dyn.manpages.debian.org/trixie/hmmer/hmmlogo.1
    layout: {x: 3, y: 0, w: 5, h: 4}
  # No family landscape here: the picker holds one family, so it would draw one
  # point. The Families and Family alignment tabs keep it, as a picker.
  - component_type: advanced_viz
    workflow_tag: proteinfamilies
    data_collection_tag: family_residues
    use: famsa/conservation_structure
    config:
      structure_source: resolve
      color_mode: category
      representations: [cartoon]
      highlight_site: true
      show_variants: false
      layout: structure
      selection_enabled: true
      follow_selection: true
    section: Profile, fold and alignment
    tag: pf-hmm-av-structure
    index: hmm-structure
    title: Predicted structure of the representative
    description: >-
      The predicted fold of the picked family's representative, coloured by the conservation class of each
      residue.

      How to read: green patches are conserved residues, amber ones intermediate and grey ones variable.
      States brushed on the logo are highlighted on the fold, so you can see where the strongly
      constrained states sit in 3D.

      Lines and annotations: the colours are the three conservation classes the template assigns to the
      score: conserved from 0.7 up (green), intermediate from 0.4 to 0.7 (amber) and variable below 0.4
      (grey). No line is drawn at these values.

      Note: the 0.7 and 0.4 class boundaries are a display aid of this template, not a published cut-off.
      The fold is predicted from the representative's sequence alone (ESMFold through the structure
      resolver, when the server enables it), not an experimental structure, and by default only sequences
      up to 400 residues are folded.

      Source: Lin et al. 2023, Science, https://doi.org/10.1126/science.ade2574
    layout: {x: 0, y: 0, w: 3, h: 9}
  - component_type: advanced_viz
    workflow_tag: proteinfamilies
    data_collection_tag: family_residues
    use: famsa/conservation_track
    config:
      value_label: Conservation
      selection_enabled: true
      follow_selection: true
    section: Profile, fold and alignment
    tag: pf-hmm-av-track
    index: hmm-track
    title: Representative sequence with conservation
    description: >-
      The representative sequence of the picked family with a conservation lane and a class strip, to put
      the logo's states in sequence order.

      How to read: states brushed on the logo are drawn red on the sequence, so you can see which residues
      they are. Tall bars are conserved residues and short ones variable stretches.

      Lines and annotations: the colours are the three conservation classes the template assigns to the
      score: conserved from 0.7 up (green), intermediate from 0.4 to 0.7 (amber) and variable below 0.4
      (grey). No line is drawn at these values.

      Note: the 0.7 and 0.4 class boundaries are a display aid of this template, not a validated or
      published cut-off. Read the score itself for anything that matters.
    layout: {x: 3, y: 4, w: 5, h: 2}
  - component_type: advanced_viz
    workflow_tag: proteinfamilies
    data_collection_tag: family_msa
    use: famsa/family_msa
    config:
      color_scheme: clustal
      max_rows: 200
      sort_by: rank
      show_consensus: true
      show_conservation: true
      entity_col_for_selection: entity
      position_col_for_selection: position
      selection_enabled: true
      follow_selection: true
    section: Profile, fold and alignment
    tag: pf-hmm-av-msa
    index: hmm-msa
    title: Family alignment
    description: >-
      The full alignment of the picked family: the representative on the first row, the members below it,
      with a consensus row and a conservation bar per column.

      How to read: a brush over columns selects the same residues on the track, the structure and the
      logo's states. Columns of one colour are similar residues, and uncoloured cells are residues whose
      class is not held by half of the column.

      Lines and annotations: the colours are the Clustal X classes of Jalview, whose table asks over 50,
      60 or 85 percent of the column depending on the class and always colours glycine and proline. This
      tile applies one cut to every class, a class holding at least half of the column, so it is a
      simplification of Jalview's table. The conservation bars are the template's entropy score.

      Note: only the first 200 rows are drawn.

      Source: Jalview colour schemes, https://www.jalview.org/help/html/colourSchemes/clustal.html
    layout: {x: 3, y: 6, w: 5, h: 3}
  - component_type: table
    workflow_tag: proteinfamilies
    data_collection_tag: hmmalign_hits
    use: hmmer/hmmalign_hits
    section: Hits table
    tag: pf-hmm-table-hits
    index: hmm-table-hits
    title: Members on the model
    description: >-
      Which stretch of the family HMM each member covers, taken from the hmmalign alignment: the first and
      last match state, the share of the model between them, and the member's residues at those states and
      its length.

      How to read: a member covering most of the model is full length, and a short stretch marks a
      fragment or a partial domain. Sort on the model coverage to list the fragments.

      Note: the table has no search statistics (E-value and score are empty), because it comes from an
      alignment and not a search. Deletions inside the covered stretch are not subtracted from the
      coverage.
    layout: {x: 0, y: 0, w: 8, h: 6}
