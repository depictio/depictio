    title: Families by size and conservation
    description: >-
      One point per family, as on the landscape of the [Families](tab:Families) tab: the member count
      (horizontal, log scale) against the mean conservation of the representative (vertical), sized by the
      representative's length and coloured by origin.

      How to read: use it as a picker. A click on a point loads that family's structure, sequence track
      and alignment in the tiles beside it. The names on the plot are the families with the longest
      representatives.

      Note: conservation is the template's entropy-based score, not a published index.
    layout: {x: 3, y: 0, w: 5, h: 4}
  - component_type: advanced_viz
    workflow_tag: proteinfamilies
    data_collection_tag: family_residues
