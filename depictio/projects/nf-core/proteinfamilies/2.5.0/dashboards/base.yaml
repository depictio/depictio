  - component_type: table
    workflow_tag: proteinfamilies
    data_collection_tag: family_members
    use: proteinfamilies/family_members
    row_selection_enabled: true
    row_selection_column: member_id
    section: Member table
    tag: pf-mem-table-members
    index: mem-table-members
    title: Family members
    description: >-
      Every member of every family, with its sample, the family origin, whether it is the representative
      and, from the full alignment, its identity to the representative, its coverage and its length.

      How to read: sort on identity or coverage to list the most distant members and the fragments of a
      family. Blank identity and coverage mean the member is not a row of the family's full alignment. A
      member picked here opens its record in the tile above.
    layout: {x: 0, y: 0, w: 8, h: 6}
