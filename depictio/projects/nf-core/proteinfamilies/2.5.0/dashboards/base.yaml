  - component_type: advanced_viz
    workflow_tag: proteinfamilies
    data_collection_tag: family_residues
    use: famsa/conservation_track
    config:
      value_label: Conservation
      selection_enabled: true
      follow_selection: true
    section: Fold, track and alignment
    tag: pf-aln-av-track
    index: aln-track
    title: Representative sequence with conservation
    description: >-
      The representative sequence of the picked family, with its residue letters, a conservation lane (a
      bar per residue) and a class strip.

      How to read: tall bars mark conserved residues and short ones variable stretches. Runs of green are
      conserved regions and grey runs are tolerant loops or ends. Brush a range to select the same
      residues on the structure and in the alignment.

      Lines and annotations: the colours are the three conservation classes the template assigns to the
      score: conserved from 0.7 up (green), intermediate from 0.4 to 0.7 (amber) and variable below 0.4
      (grey). No line is drawn at these values.

      Note: the 0.7 and 0.4 class boundaries are a display aid of this template, not a validated or
      published cut-off. Read the score itself for anything that matters.
