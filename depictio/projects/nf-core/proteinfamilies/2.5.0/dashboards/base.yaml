  - component_type: figure
    workflow_tag: proteinfamilies
    data_collection_tag: family_residues
    use: famsa/conservation
    visu_type: histogram
    dict_kwargs:
      x: occupancy
      color: category
      labels: {occupancy: Share of members with a residue, category: Class, count: Residues}
    section: Conservation
    tag: pf-aln-fig-occupancy
    index: aln-fig-occupancy
    title: Residues by column occupancy
    description: >-
      How many members have a residue in each alignment column of the representative, for the families in
      scope. Each bar counts residues in one band of column occupancy, stacked by the conservation class
      of the residue.

      How to read: a mass at 1 is columns every member fills. Low occupancy marks columns that most
      members gap, such as insertions in the representative or ends that fragments lack, and such residues
      score low on conservation by construction.

      Lines and annotations: the colours are the three conservation classes the template assigns to the
      score: conserved from 0.7 up (green), intermediate from 0.4 to 0.7 (amber) and variable below 0.4
      (grey). No line is drawn at these values.

      Note: the class of a residue depends on its conservation score, which includes occupancy, so
      low-occupancy columns fall in the variable class. The 0.7 and 0.4 class boundaries are a display aid
      of this template, not a validated or published cut-off.
    layout: {x: 4, y: 0, w: 4, h: 4}
  # The linked view holds the plot, the 3D tile, the track and the alignment on one
  # screen: a click on a family narrows the residue and alignment tables to it
  # through the family links, and the structure, track and alignment follow.
  - component_type: advanced_viz
    workflow_tag: proteinfamilies
    data_collection_tag: families
    use: proteinfamilies/family_landscape
    config:
      x_title: Members (log)
