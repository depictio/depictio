  - component_type: figure
    workflow_tag: proteinfamilies
    data_collection_tag: family_residues
    use: famsa/conservation
    visu_type: histogram
    dict_kwargs:
      x: value
      color: category
      labels: {value: Conservation score, category: Class, count: Residues}
    section: Conservation
    tag: pf-aln-fig-conservation
    index: aln-fig-conservation
    title: Residues by conservation score
    description: >-
      How conserved the representative's residues are in the families in scope. Each bar counts residues
      in one band of conservation score, from 0 (a column as diverse as random sequence) to 1 (an
      invariant column present in every member), stacked by class. The score is one minus the Shannon
      entropy of the column over the 20 amino acids, scaled by the share of members with a residue there.

      How to read: a mass near 1 is a family of well conserved residues, and a mass near 0 a family with
      little signal. Pick a family in the section below to see where its conserved residues lie.

      Lines and annotations: the colours are the three conservation classes the template assigns to the
      score: conserved from 0.7 up (green), intermediate from 0.4 to 0.7 (amber) and variable below 0.4
      (grey). No line is drawn at these values.

      Note: the 0.7 and 0.4 class boundaries are a display aid of this template, not a validated or
      published cut-off. Read the score itself for anything that matters.
