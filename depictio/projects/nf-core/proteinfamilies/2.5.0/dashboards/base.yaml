    color: indigo
    description: The family whose profile, fold and sequence the tab draws
  grid_sections:
  - name: Profile at a glance
    icon: mdi:counter
    color: indigo
    description: The picked family's conservation, residue by residue, and its members
  - name: Profile, fold and alignment
    icon: mdi:view-dashboard-outline
    color: indigo
    description: The profile logo, the folded representative, its sequence track and the family alignment side by side, linked by residue
    display: linked
  - name: Hits table
    icon: mdi:table
    color: gray
    description: Where each member sits on the family model
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [hmmbuild](http://hmmer.org) turns each family's seed alignment into a profile HMM, drawn here
      as a sequence logo: tall stacks are conserved states. The tab shows one family, the largest one
      until another is picked on the left; brushing states selects the representative residues they
      sit on in the structure, the track and the alignment.
    tag: pf-hmm-intro
    index: hmm-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  # always_selected: the logo, the structure and the track show one family, so
  # the picker always names one, the family with the most members until another
  # is picked (default_by: size; on any run, where a default_value would name one
  # run's family). The list stays alphabetical. The tiles
  # follow it on hmm_name, entity and label through the families links. No size
  # filter beside it: a range that left the picked family out would empty the
  # tab. banner_facts print three figures of the picked family in the scope
  # banner, read from its row of the families collection: its members, the
  # length of its representative (the sequence the structure and the track
  # draw) and how alike its members are to it.
  - component_type: interactive
    workflow_tag: proteinfamilies
    data_collection_tag: families
    interactive_component_type: Select
    always_selected: true
    default_by: size
    banner_facts:
    - {column: size, label: Members, format: integer, icon: 'tabler:users-group'}
    - {column: representative_length, label: Length (aa), format: integer, icon: 'tabler:ruler-measure'}
    - {column: mean_identity, label: Mean identity, format: percent, icon: 'tabler:arrows-join'}
    column_name: family
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: grape
    section: Profile scope
    tag: pf-hmm-filter-family
    index: hmm-family-select
    title: Family
    layout: {x: 0, y: 0, w: 1, h: 3}
  # One family in scope: its own descriptors (match states, seed and effective
  # sequences) are single values, whose spread would say nothing. The strip
  # reads the family residue by residue and member by member instead.
  - component_type: card
    workflow_tag: proteinfamilies
    data_collection_tag: family_residues
    use: famsa/residue_conservation
    aggregation: median
    column_name: value
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:check-decagram
      icon_color: green
      caption: median per residue, with its spread
      decimals: 2
    section: Profile at a glance
    tag: pf-hmm-card-conservation
    index: hmm-card-conservation
    title: Residue conservation
    description: Conservation of each representative residue in the family alignment, from 0 (as diverse as random sequence) to 1 (invariant).
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: proteinfamilies
    data_collection_tag: family_residues
    aggregation: count
    column_name: position
    column_type: int64
    secondary_layout: composition
    breakdown_col: category
    display:
      icon_name: mdi:shape-outline
      icon_color: orange
      caption: residues, by conservation class
    section: Profile at a glance
    tag: pf-hmm-card-residues
    index: hmm-card-residues
    title: Representative residues
    description: Residues of the representative, split into conserved (0.7 and above), intermediate (0.4 to 0.7) and variable.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: proteinfamilies
    data_collection_tag: family_members
    use: proteinfamilies/member_identity
    aggregation: median
    column_name: identity
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:relation-many-to-many
      icon_color: cyan
      caption: median per member, with its spread
      format: percent
    section: Profile at a glance
    tag: pf-hmm-card-identity
    index: hmm-card-identity
    title: Identity to the representative
    description: Identity of each member to the representative over the columns they share.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: proteinfamilies
    data_collection_tag: family_members
    use: proteinfamilies/member_length
    aggregation: median
    column_name: length
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: indigo
      caption: residues per member, with the spread
    section: Profile at a glance
    tag: pf-hmm-card-length
    index: hmm-card-length
    title: Member length
    description: Ungapped length of each member of the family.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # The logo follows the family the picker names, on hmm_name. A brush on
  # its states selects the representative residues they sit on, which the
  # structure, the track and the alignment follow. The hits lane draws every
  # member the family alignment placed on the model. The hits table has no
  # search statistics and numbers a member's residues along the member itself,
  # so the lane binds neither the E-value, the score nor the alignment span (a
  # click on a bar would otherwise pick residues of the member on the
  # representative's tiles).
  - component_type: advanced_viz
    workflow_tag: proteinfamilies
    data_collection_tag: hmm_profile
    use: hmmer/family_logo
    config:
      height_mode: relent_abovebg
      color_scheme: clustal
      show_indel_rows: true
      show_consensus: true
      hits_dc_tag: hmmalign_hits
      hits_model_col: label
      hits_entity_col: entity
      hits_evalue_col: null
      hits_score_col: null
      hits_ali_from_col: null
      hits_ali_to_col: null
      hits_evalue_max: null
      max_hits: 200
      selection_enabled: true
      follow_selection: true
    section: Profile, fold and alignment
    tag: pf-hmm-av-logo
    index: hmm-logo
    title: Profile HMM logo
    description: Letter heights are relative entropy above background; the lanes show insert behaviour, occupancy and the members that matched each state.
    layout: {x: 3, y: 0, w: 5, h: 4}
  # No family landscape here: the picker holds one family, so it would draw one
  # point. The Families and Family alignment tabs keep it, as a picker.
  - component_type: advanced_viz
    workflow_tag: proteinfamilies
    data_collection_tag: family_residues
    use: famsa/conservation_structure
    config:
      structure_source: resolve
      color_mode: category
      representations: [cartoon]
      highlight_site: true
      show_variants: false
      layout: structure
      selection_enabled: true
      follow_selection: true
    section: Profile, fold and alignment
    tag: pf-hmm-av-structure
    index: hmm-structure
    title: Predicted structure of the representative
    description: Folded on demand from the family's representative and coloured by conservation class.
    layout: {x: 0, y: 0, w: 3, h: 9}
  - component_type: advanced_viz
    workflow_tag: proteinfamilies
    data_collection_tag: family_residues
    use: famsa/conservation_track
    config:
      value_label: Conservation
      selection_enabled: true
      follow_selection: true
    section: Profile, fold and alignment
    tag: pf-hmm-av-track
    index: hmm-track
    title: Representative sequence with conservation
    description: States brushed on the logo are drawn red on the sequence.
    layout: {x: 3, y: 4, w: 5, h: 2}
  - component_type: advanced_viz
    workflow_tag: proteinfamilies
    data_collection_tag: family_msa
    use: famsa/family_msa
    config:
      color_scheme: clustal
      max_rows: 200
      sort_by: rank
      show_consensus: true
      show_conservation: true
      entity_col_for_selection: entity
      position_col_for_selection: position
      selection_enabled: true
      follow_selection: true
    section: Profile, fold and alignment
    tag: pf-hmm-av-msa
    index: hmm-msa
    title: Family alignment
    description: The representative on the first row, the members below it.
    layout: {x: 3, y: 6, w: 5, h: 3}
  - component_type: table
    workflow_tag: proteinfamilies
    data_collection_tag: hmmalign_hits
    use: hmmer/hmmalign_hits
    section: Hits table
    tag: pf-hmm-table-hits
    index: hmm-table-hits
    title: Members on the model
    description: The HMM states each member covers, from the hmmalign alignment.
    layout: {x: 0, y: 0, w: 8, h: 6}
