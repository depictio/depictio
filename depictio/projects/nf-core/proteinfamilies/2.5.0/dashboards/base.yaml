      How to read: a box that sits high and narrow is a family of near copies, and a wide box is a family
      whose members range from near copies to distant homologues. Open [Family alignment](tab:Family
      alignment) to see where the members differ.

      Lines and annotations: the box spans the quartiles with the median as the line inside it, and points
      beyond the whiskers are drawn singly.

