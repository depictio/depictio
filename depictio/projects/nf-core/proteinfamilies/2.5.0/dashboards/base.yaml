- title: Families
  subtitle: Which families were built, and how large and conserved?
  tab_group: Families
  tab_order: 2
  tab_icon: mdi:shape-outline
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Family scope
    icon: mdi:filter-variant
    color: violet
    description: Keep families by origin, size or conservation
  grid_sections:
  - name: Families at a glance
    icon: mdi:counter
    color: violet
    description: Family count, size, recruitment and conservation
  - name: Family landscape
    icon: mdi:chart-scatter-plot
    color: violet
    description: Every family by size and conservation, with the record of the picked one
  - name: Family size
    icon: mdi:chart-box-outline
    color: violet
    description: Members per family, by sample and origin
  components:
  - component_type: text
    order: 1
    body: >
      A family is seeded from one initial cluster, modelled as a profile HMM and grown by recruiting
      the sequences the model matches. Members far outnumbering the seed mean the model generalised;
      low conservation marks a family whose members agree on few residues. Click a family on the plot
      to open its record.
    tag: pf-fam-intro
    index: fam-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: proteinfamilies
    data_collection_tag: families
    interactive_component_type: MultiSelect
    column_name: origin
    column_type: object
    display:
      icon_name: mdi:source-branch
      custom_color: orange
    section: Family scope
    group: Families
    tag: pf-fam-filter-origin
    index: fam-origin-filter
    title: Family origin
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: proteinfamilies
    data_collection_tag: families
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: size
    column_type: int64
    display:
      icon_name: mdi:account-group-outline
      custom_color: blue
    section: Family scope
    group: Families
    tag: pf-fam-filter-size
    index: fam-size-range
    title: Members per family
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: proteinfamilies
    data_collection_tag: families
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: mean_conservation
    column_type: float64
    display:
      icon_name: mdi:check-decagram
      custom_color: green
    section: Family scope
    group: Families
    tag: pf-fam-filter-conservation
    index: fam-conservation-range
    title: Mean residue conservation
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: proteinfamilies
    data_collection_tag: families
    use: proteinfamilies/families_total
    aggregation: count
    column_name: family
    column_type: object
    secondary_layout: composition
    breakdown_col: origin
    display:
      icon_name: mdi:shape-outline
      icon_color: violet
      caption: built by the run or extended
    section: Families at a glance
    tag: pf-fam-card-families
    index: fam-card-families
    title: Families
    description: Protein families in scope, new ones apart from existing families the run extended.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: proteinfamilies
    data_collection_tag: families
    use: proteinfamilies/family_size
    aggregation: median
    column_name: size
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:account-group-outline
      icon_color: blue
      caption: median, with its spread
    section: Families at a glance
    tag: pf-fam-card-size
    index: fam-card-size
    title: Members per family
    description: Sequences that belong to a family.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: proteinfamilies
    data_collection_tag: families
    use: proteinfamilies/recruited_total
    aggregation: sum
    column_name: recruited
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display:
      icon_name: mdi:set-merge
      icon_color: teal
      caption: the samples recruiting most
      format: si
    section: Families at a glance
    tag: pf-fam-card-recruited
    index: fam-card-recruited
    title: Members recruited
    description: Members beyond the seed the family HMM was built from, found by hmmsearch.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: proteinfamilies
    data_collection_tag: families
    use: proteinfamilies/family_conservation
    aggregation: median
    column_name: mean_conservation
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:check-decagram
      icon_color: green
      caption: mean score per family, 0 to 1
      decimals: 2
    section: Families at a glance
    tag: pf-fam-card-conservation
    index: fam-card-conservation
    title: Residue conservation
    description: Mean conservation score along the representative, 1 for an invariant column.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: proteinfamilies
    data_collection_tag: families
    use: proteinfamilies/family_landscape
    config:
      x_title: Members (log)
      y_title: Mean residue conservation
      log_x: true
      top_n_labels: 8
      legend_pos: bottom
      selection_enabled: true
      selection_column: family
    section: Family landscape
    tag: pf-fam-av-landscape
    index: fam-landscape
    title: Family size against conservation
    description: >-
      One point per family: how many members it holds (horizontal, log scale) against the mean
      conservation of its representative's residues (vertical). The point is sized by the representative's
      length and coloured by origin, blue for a family the run built and amber for an existing family it
      extended.

      How to read: large families spread to the right, and a point low on the plot is a family whose
      members agree on few residues, a candidate for a second look or a split. The names on the plot are
      the families with the longest representatives, not the most conserved. Click a point to open its
      record.

      Note: conservation is the score described under the residue conservation tiles of the [Family
      alignment](tab:Family alignment) tab, one minus the normalised entropy of each alignment column,
      weighted by the share of members with a residue there. It is not a published index.
    layout: {x: 0, y: 0, w: 5, h: 7}
  - component_type: advanced_viz
    workflow_tag: proteinfamilies
    data_collection_tag: families
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: fam-landscape
      id_col: family
      title_col: family
      selection_source: scatter_selection
      sections:
        Family: [family, sample, origin, size, representative_id, representative_length]
        Model: [seed_size, recruited, effective_sequences, model_length]
        Alignment: [aligned_members, alignment_columns, mean_identity, mean_coverage, mean_conservation, conserved_share]
        Sequence: [sequence]
    section: Family landscape
    tag: pf-fam-av-family-record
    index: fam-family-record
    title: Picked family
    description: >-
      The record of the family picked on the landscape: where it comes from, its model and its alignment
      statistics, with the representative sequence at the end.

      How to read: Family gives the origin and the size, Model gives the seed the HMM was built from, the
      members recruited beyond it and the effective sequence number, and Alignment gives the identity,
      coverage and conservation of the members to the representative. A seed much smaller than the family
      means most members were recruited by the model and not clustered.

      Note: nothing shows until a family is picked on the plot to its left.
    layout: {x: 5, y: 0, w: 3, h: 7}
  # The structure of the picked family as a floating 3D panel: lifted out of the
  # grid (no layout) into a card every tab shares, so the fold stays on screen
  # while the other tabs are browsed. Same binding as the structure on the Profile
  # HMM tab. It reads the filters of the tab on screen: a family picked on the
  # landscape here, or by the Family picker of the Profile HMM tab, is the one
  # drawn. Opens as a compact card; the reader drags, resizes, docks or hides it.
  - component_type: advanced_viz
    workflow_tag: proteinfamilies
    data_collection_tag: family_residues
    use: famsa/conservation_structure
    config:
      structure_source: resolve
      color_mode: category
      representations: [cartoon]
      highlight_site: true
      show_variants: false
      layout: structure
      selection_enabled: true
      follow_selection: true
    placement: floating
    floating_initial_state: compact
    tag: pf-fam-av-structure-panel
    index: fam-structure-panel
    title: Predicted structure of the representative
    description: >-
      The predicted fold of the picked family's representative, coloured by the conservation class of each
      residue. It is a floating panel that stays on screen across the tabs and follows the family picked
      on the landscape.

      How to read: green patches are conserved residues, amber ones intermediate and grey ones variable.
      Conserved residues that cluster on one surface often mark a functional site, and scattered ones
      usually mean a conserved fold. Residue picks are shared with the sequence track and the alignment of
      the tab on screen.

      Lines and annotations: the colours are the three conservation classes the template assigns to the
      score: conserved from 0.7 up (green), intermediate from 0.4 to 0.7 (amber) and variable below 0.4
      (grey). No line is drawn at these values.

      Note: the 0.7 and 0.4 class boundaries are a display aid of this template, not a published cut-off.
      The fold is predicted from the representative's sequence alone (ESMFold through the structure
      resolver, when the server enables it), not an experimental structure, and by default only sequences
      up to 400 residues are folded.

      Source: Lin et al. 2023, Science, https://doi.org/10.1126/science.ade2574
  - component_type: figure
    workflow_tag: proteinfamilies
    data_collection_tag: families
    use: proteinfamilies/family_metadata
    visu_type: box
    dict_kwargs:
      x: sample
      y: size
      color: origin
      labels: {sample: Sample, size: Members per family, origin: Origin}
    section: Family size
    tag: pf-fam-fig-size
    index: fam-fig-size
    title: Family size per sample
    description: >-
      How many members each family has, per sample. One box per sample and origin, coloured blue for
      families the run built and amber for existing families it extended.

      How to read: a tall box means the sample's families differ a lot in size, and a median near the
      bottom means most are small. Compare the two colours inside a sample to see whether extended
      families are larger than new ones.

      Lines and annotations: the box spans the quartiles with the median as the line inside it, and points
      beyond the whiskers are drawn singly.

      Source: Plotly box plots, https://plotly.com/python/box-plots/
    layout: {x: 0, y: 0, w: 8, h: 4}
