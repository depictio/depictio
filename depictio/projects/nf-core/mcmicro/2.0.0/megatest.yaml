# Megatest manifest for nf-core/mcmicro 2.0.0 (read by scripts/nfcore_megatest.py).
#
# Which AWS megatest run this template was validated against and the subset of
# it that the template recipes, MultiQC and the preview helper need. Fetch it with:
#
#   python scripts/nfcore_megatest.py fetch --pipeline mcmicro --version 2.0.0 [--dest DIR]
#   bash download_test_data.sh [DIR]      # same thing, plus the vendored sheets and the PNG previews
#
# Keys are fnmatch globs relative to run_root (here the prefix root) and are
# mirrored 1:1 below the destination, which becomes the template DATA_ROOT.
#
# Full test profile (the release run, 2026-07-02): two samples, each registered
# from two cycles of a CyCIF tonsil test image (four channels per cycle, nine
# 220 x 180 px tiles), BaSiCPy illumination, background subtraction, Mesmer and
# Cellpose segmentation, MCQUANT. The whole run is small (59 objects, 48 MB), so
# everything the template or the preview helper reads is fetched, the images
# included (45 files, 44 MB).
#
# The pipeline publishes neither its samplesheet nor its marker sheet; the
# template ships both under input/ (METADATA_FILE, MARKER_SHEET) and
# download_test_data.sh copies them into {dest}/input/. They are the
# pipeline's own assets the run's params.json names
# (assets/samplesheet-test_full.csv, assets/markers-test_full.csv), unchanged.
pipeline: mcmicro
version: "2.0.0"
# s3://nf-core-awsmegatests/mcmicro/results-<results_sha>/ == the 2.0.0 release tag_sha.
results_sha: "f4400001578642e370a72668966c6602fe172ef6"
run_root: ""
multiqc:
  # The report says 1.32 in its run metadata: custom content only (the
  # prelude's input image check matrix), no module.
  version: "1.32"
  parquet: multiqc/multiqc_data/multiqc.parquet
  reprocess: false
keys:
  - pipeline_info/params_*.json
  - pipeline_info/*software*versions*.yml
  # MultiQC parquet: the prelude's input image check matrix (custom content).
  - multiqc/multiqc_data/multiqc.parquet
  # The single-cell tables, one per sample and segmenter: every cell collection.
  - quantification/mcquant/*/*.csv
  # Images, for the PNG previews only (scripts/make_previews.py): the
  # registered image of each sample and the masks of each segmenter.
  - registration/ashlar/*.ome.tif
  - segmentation/*/*.tif
  # Background-subtracted images and their marker sheet, the BaSiCPy profiles,
  # the OME-XML of every tile and the prelude tables: small, kept for a later
  # bioimage view (TODO(bioimage)), not read by the template.
  - backsub/*
  - illumination_correction/basicpy/*.ome.tif
  - bftools/*.xml
  - prelude/*.tsv
  #
  # Deliberately NOT fetched:
  #   multiqc_report.html, multiqc_plots/, the other multiqc_data/ files: the
  #     rendered report and its text exports, the parquet holds the same.
  #   pipeline_info/execution_*, pipeline_dag_*: Nextflow reports.
prefix_keys: []
renames: {}
# Megatest-specific terms that must never appear in the dashboard texts
# (checked by the template lint test).
forbidden_terms:
  - TEST1
  - TEST2
  - tonsil
  - DNA_6
  - DNA_7
  - ELANE
  - ELANE7
  - CD57
  - CD577
  - CD45
  - CD457
post_fetch_help: |
  === Quick test commands ===

  # The samplesheet and the marker sheet are not published by the pipeline:
  # the template reads {dest}/input/samplesheet.csv and {dest}/input/markers.csv
  # (download_test_data.sh copies the vendored ones there). Pass --var
  # METADATA_FILE=... and --var MARKER_SHEET=... for another run. The PNG
  # previews ({dest}/previews/) are written by download_test_data.sh; without
  # them the Previews tab and the cell-map underlay are left out.

  # 1. Dry run (validates the template against the data, no ingestion)
  depictio-cli ingest --template nf-core/mcmicro/2.0.0 --data-root {dest} --dry-run

  # 2. Full run (needs a reachable server and ~/.depictio/CLI.yaml)
  depictio-cli ingest --template nf-core/mcmicro/2.0.0 --data-root {dest} \
    --var PREVIEW_S3_FOLDER=s3://<server bucket>/<project>/previews/
