- title: Spatial
  subtitle: Where do the cells sit, and what do they express?
  tab_group: Cells
  tab_order: 4
  tab_icon: mdi:map-marker-radius-outline
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Cell filters
    icon: mdi:filter-variant
    color: grape
    description: Narrow by segmentation method or cell area
  grid_sections:
  - name: Cells at a glance
    icon: mdi:counter
    color: grape
    description: The cells drawn and their size
  - name: Cells in the image
    icon: mdi:microscope
    color: grape
    description: Each cell at its centroid in its image, sized by its area
  - name: Selected cells
    icon: mdi:chart-box-outline
    color: grape
    description: Lasso cells on the map to compare their marker intensities
  - name: Cell table
    icon: mdi:table
    color: gray
    description: Every cell with its marker intensities, centroid and morphology
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      One point per cell at its centroid in the registered image, origin top-left as in the
      image, one image at a time. Pick a marker in the tile: its intensity is drawn through
      asinh(x / 150) and clipped to the 1st and 99th percentiles of the image shown. Draw a
      lasso to compare the selected cells below; the nuclear stain sits under the cells when
      the run has previews.
    tag: mm-sp-intro
    index: sp-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: mcmicro
    data_collection_tag: mcquant_cells
    interactive_component_type: MultiSelect
    column_name: segmenter
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: blue
    section: Cell filters
    group: Cells
    tag: mm-sp-filter-segmenter
    index: sp-segmenter-filter
    title: Segmenter
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: mcmicro
    data_collection_tag: mcquant_cells
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: Area
    column_type: float64
    display:
      icon_name: mdi:circle-outline
      custom_color: orange
    section: Cell filters
    group: Cells
    tag: mm-sp-filter-area
    index: sp-area-range
    title: Cell area (pixels)
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: card
    workflow_tag: mcmicro
    data_collection_tag: mcquant_cells
    use: mcquant/cell_count
    aggregation: count
    column_name: cell_key
    column_type: object
    secondary_layout: composition
    breakdown_col: sample
    display:
      icon_name: mdi:hexagon-multiple-outline
      icon_color: grape
      caption: cells in view, by image
      format: si
    section: Cells at a glance
    tag: mm-sp-card-cells
    index: sp-card-cells
    title: Cells
    description: Cells in view, narrowed by the filters and by a lasso on the map.
    layout: {x: 0, y: 0, w: 4, h: 2}
  - component_type: card
    workflow_tag: mcmicro
    data_collection_tag: mcquant_cells
    aggregation: median
    column_name: Area
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:circle-outline
      icon_color: orange
      caption: median pixels, with the distribution
      decimals: 0
    section: Cells at a glance
    tag: mm-sp-card-area
    index: sp-card-area
    title: Cell area
    description: Median area of the cells in view, in pixels of the registered image.
    layout: {x: 4, y: 0, w: 4, h: 2}
  # The marker columns follow the run's panel, so they are named by pattern:
  # every numeric column but MCQUANT's regionprops and the derived ratio (the
  # bound id, centroid, area and sample columns are left out by the tile).
  # TODO(bioimage): replace the PNG previews with an OME-TIFF/zarr pyramid viewer (viv/deck.gl) once bioimage lands
  - component_type: advanced_viz
    workflow_tag: mcmicro
    data_collection_tag: mcquant_cells
    use: mcquant/spatial_cells
    config:
      viz_kind: spatial_cells
      cell_id_col: cell_key
      x_col: X_centroid
      y_col: Y_centroid
      category_col: segmenter
      sample_col: sample
      area_col: Area
      value_columns_pattern: ^(?!(CellID|MajorAxisLength|MinorAxisLength|Eccentricity|Solidity|Extent|Orientation|aspect_ratio)$)
      color_by: value
      transform: asinh
      asinh_cofactor: 150
      clip_low_pct: 1
      clip_high_pct: 99
      sample_display: select
      y_axis: image
      colour_scale: Viridis
      legend_pos: bottom
      hover_cols: [segmenter, CellID, Area, Eccentricity]
      # Underlay: the nuclear stain preview of the image, placed on the
      # full-resolution frame of the centroids whatever the preview's size.
      background_dc_tag: mcmicro_previews
      background_image_col: image_path
      background_sample_col: underlay_sample
      background_width_col: full_width
      background_height_col: full_height
      background_image_scale: 1
      background_opacity: 0.7
      selection_enabled: true
      selection_column: cell_key
    section: Cells in the image
    tag: mm-sp-av-map
    index: sp-cell-map
    title: Cells in the image
    description: Each cell at its centroid, sized by its area, coloured by the marker picked or the segmenter.
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: figure
    workflow_tag: mcmicro
    data_collection_tag: mcquant_cell_markers
    use: mcquant/marker_box
    visu_type: box
    dict_kwargs:
      x: marker
      y: asinh_intensity
      color: segmenter
      labels: {marker: '', asinh_intensity: Intensity (asinh), segmenter: ''}
    section: Selected cells
    tag: mm-sp-fig-selected
    index: sp-selected-markers
    title: Marker intensity of the cells in view
    description: One box per marker over the cells in view or lassoed on the map, asinh scale.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    workflow_tag: mcmicro
    data_collection_tag: mcquant_cells
    row_selection_enabled: true
    row_selection_column: cell_key
    section: Cell table
    tag: mm-sp-table
    index: sp-table
    title: Cells
    description: One row per cell, with its marker intensities, centroid and morphology.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Markers
  subtitle: How bright is each marker, and which markers go together?
  tab_group: Cells
  tab_order: 5
  tab_icon: mdi:palette-outline
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Marker filters
    icon: mdi:filter-variant
    color: violet
    description: Narrow by marker, marker role or segmentation method
  grid_sections:
  - name: Markers at a glance
    icon: mdi:counter
    color: violet
    description: Channels quantified, measurements, the brightest markers and their spread
  - name: Intensity by marker
    icon: mdi:chart-box-outline
    color: violet
    description: Each marker's intensity over the cells, on the asinh scale
  - name: Marker correlation
    icon: mdi:relation-many-to-many
    color: violet
    description: How the markers co-vary over the cells of each method
  - name: Marker table
    icon: mdi:table
    color: gray
    description: Intensity quartiles, asinh median and spread per image, method and marker
    collapsed: true
  - name: Marker panel
    icon: mdi:table
    color: gray
    description: The marker sheet, one row per channel
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      MCQUANT measures each cell's mean intensity in every channel of the panel. Intensities are
      read on the asinh scale, asinh(x / 150), so a dim marker and a bright nuclear stain share
      one axis. The correlation is taken over every cell of a method: markers the same cells
      express correlate, and two nuclear stains of different cycles should too.
    tag: mm-mk-intro
    index: mk-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
