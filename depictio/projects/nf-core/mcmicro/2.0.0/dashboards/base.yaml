version: 1
# nf-core/mcmicro 2.0.0, on the family rules of depictio/projects/nf-core/RULES.md
# (ampliseq/2.18.0 is the reference implementation).
#
# Funnel: the input image checks (MultiQC), the images themselves (Previews)
# and how the segmentation methods cut them into cells (Segmentation), then the
# cells: where they sit (Spatial), what they express (Markers) and their size and
# shape (Morphology). A sample is one tissue image. The samplesheet (`samples`)
# is what every sample filter starts from; the marker sheet (`markers`) is the
# panel.
#
# The marker columns of the cell table follow the run's panel and are only
# known at ingest: the cell map names them by pattern (every numeric column
# that is not an id or a regionprops measure), never by name.
#
# Images: depictio has no OME-TIFF / zarr / pyramid viewer yet, so the
# registered images and the mask outlines reach the dashboard as PNG previews
# written at fetch time (scripts/make_previews.py), the optional
# `mcmicro_previews` Image collection: the Previews gallery, and the underlay of
# the cell map. A run without them loses the Previews tab and the underlay only.
#
# Routes: SINGLE_SEGMENTER (one method in --segmentation, the pipeline's
# default) prunes the segmenter agreement: the Agreement section of
# Segmentation and one findings row.
main_dashboard:
  title: nf-core/mcmicro
  subtitle: Multiplexed tissue imaging, from registered images to the cells and their markers
  project_tag: mcmicro Multiplexed Imaging
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family.
  category_colors:
    '{GROUP_COL}': auto
    segmenter:
      Mesmer: '#1c7ed6'
      Cellpose: '#e8590c'
      MCCellpose: '#2f9e44'
      '*': auto
    marker_role:
      Nuclear stain: '#4263eb'
      Marker: '#ae3ec9'
    status:
      Quantified: '#2f9e44'
      Removed: '#adb5bd'
    stage:
      Registered: '#1c7ed6'
      Segmentation: '#f59f00'
    pair: auto
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. Both
  # are bound to the samplesheet, the source of every sample link.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab, which no route removes.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The samplesheet behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Images, below).
  - component_type: interactive
    workflow_tag: mcmicro
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Key figures
    tag: mm-ov-kf-group
    index: ov-kf-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: mcmicro
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:image-outline
      custom_color: teal
      strip_label: Image
    section: Key figures
    tag: mm-ov-kf-sample
    index: ov-kf-sample
    title: Image
    layout: {x: 2, y: 0, w: 2, h: 1}
  # The pipeline's wordmark, read from its repository; where it cannot load (no
  # internet), the title is drawn as text.
  - component_type: text
    title: nf-core/mcmicro
    logo: https://raw.githubusercontent.com/nf-core/mcmicro/master/docs/images/nf-core-mcmicro_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/mcmicro/master/docs/images/nf-core-mcmicro_logo_dark.png
    order: 1
    body: >
      Multiplexed tissue images registered, segmented into cells and quantified: where the
      cells sit, what they express and how the segmentation methods compare.
      [Run parameters](params:)
    tag: mm-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/mcmicro stitches and registers the cycles of each tissue image, segments the cells and measures every cell in every channel of the marker panel. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The sample filters in the left panel apply to every tab: narrow the images once and the whole dashboard follows. A bar above a section narrows that section only.
    tag: mm-ov-about
    index: ov-about
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash.
  - component_type: text
    surface: card
    values:
      images: {dc: samples, column: sample, aggregation: nunique, format: integer}
      channels: {dc: markers, column: marker_name, aggregation: count, filter_expr: col('quantified') == 1, format: integer}
    body: |
      ### The run
      - ![](icon:mdi:image-multiple-outline) **Images** {{images}}
      - ![](icon:mdi:palette-outline) **Channels** {{channels}} quantified
      - ![](icon:mdi:shape-outline) **Segmentation** {{param:segmentation}}
      - ![](icon:mdi:lightbulb-on-outline) **Illumination** {{param:illumination}}
      - ![](icon:mdi:layers-minus) **Background subtraction** {{param:backsub}}
    tag: mm-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  # The marks take the family's colour (the header's), not the theme's blue.
  - component_type: text
    surface: card
    accent: green
    values:
      n_cells: {dc: mcquant_cells, column: cell_key, aggregation: count, format: si}
    body: |
      ### Five steps from tiles to cells
      Each step names its settings and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:clipboard-check-outline) **Check** Tile metadata checked before any processing · [Settings](params:prelude) · [MultiQC](tab:MultiQC)
      2. ![](icon:mdi:image-multiple-outline) **Register** Tiles flat-fielded, stitched and aligned across cycles · [Settings](params:illumination) · [Spatial](tab:Spatial)
      3. ![](icon:mdi:layers-minus) **Subtract** Autofluorescence removed channel by channel · [Settings](params:backsub) · [Markers](tab:Markers)
      4. ![](icon:mdi:shape-outline) **Segment** {{param:segmentation}} cut the image into cells · [Settings](params:segmentation) · [Segmentation](tab:Segmentation)
      5. ![](icon:mdi:chart-scatter-plot) **Quantify** {{n_cells}} cells measured in every channel · [Settings](params:marker_sheet) · [Markers](tab:Markers)
      :::
    tag: mm-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. All four read collections every route writes.
  - component_type: card
    workflow_tag: mcmicro
    data_collection_tag: samples
    aggregation: nunique
    column_name: sample
    column_type: object
    secondary_layout: composition
    breakdown_col: '{GROUP_COL}'
    display:
      icon_name: mdi:image-multiple-outline
      icon_color: teal
      caption: in the samplesheet, by {GROUP_COL_DISPLAY}
      link: tab:Spatial
    section: Key figures
    tag: mm-ov-kf-images
    index: ov-kf-images
    title: Images
    description: Tissue images in the samplesheet, each registered from its cycles. The bar splits them by {GROUP_COL_DISPLAY}.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mcmicro
    data_collection_tag: mcquant_segmentation_summary
    aggregation: sum
    column_name: n_cells
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:hexagon-multiple-outline
      icon_color: blue
      caption: in all, with the cells per image and method
      link: tab:Segmentation
      format: si
    section: Key figures
    tag: mm-ov-kf-cells
    index: ov-kf-cells
    title: Cells
    description: Cells segmented over the images in view, every method counted. The strip shows the spread of cells per image and method.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mcmicro
    data_collection_tag: markers
    aggregation: count
    column_name: marker_name
    column_type: object
    filter_expr: col('quantified') == 1
    secondary_layout: composition
    breakdown_col: marker_role
    display:
      icon_name: mdi:palette-outline
      icon_color: grape
      caption: quantified, nuclear stains and markers
      link: tab:Markers
    section: Key figures
    tag: mm-ov-kf-markers
    index: ov-kf-markers
    title: Channels
    description: Channels of the marker sheet measured in every cell, removed ones left out. The bar splits nuclear stains from markers.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mcmicro
    data_collection_tag: mcquant_cells
    aggregation: median
    column_name: Area
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:circle-outline
      icon_color: orange
      caption: median pixels, with the distribution
      link: tab:Morphology
      decimals: 0
    section: Key figures
    tag: mm-ov-kf-area
    index: ov-kf-area
    title: Median cell area
    description: Median area of the cells in pixels of the registered image, with the distribution of every cell's area.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the group, then the segmenter.
  - component_type: interactive
    workflow_tag: mcmicro
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Findings
    tag: mm-ov-findings-group
    index: ov-findings-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: mcmicro
    data_collection_tag: mcquant_cells
    interactive_component_type: MultiSelect
    column_name: segmenter
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: blue
      strip_label: Segmenter
    section: Findings
    tag: mm-ov-findings-segmenter
    index: ov-findings-segmenter
    title: Segmenter
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data.
  - component_type: text
    surface: card
    values:
      top_seg: {dc: mcquant_cells, column: segmenter, aggregation: top}
      seg_share: {dc: mcquant_cells, column: segmenter, aggregation: top_share, format: percent}
      bright: {dc: mcquant_marker_summary, column: marker, aggregation: top, weight: median_intensity, filter_expr: "col('marker_role') == 'Marker'"}
      held: {dc: mcquant_segmenter_agreement, column: matched_share, aggregation: max, format: percent}
      ecc: {dc: mcquant_cells, column: Eccentricity, aggregation: median, format: decimals:2}
    body: |
      - **{{top_seg}}** finds the most cells – {{seg_share}} of every cell segmented on these images [Segmentation](tab:Segmentation)
      - **{{bright}}** is the brightest marker by median intensity, nuclear stains left out [Markers](tab:Markers)
      - **{{held}}** of one method's cells hold a cell of the other, in the closer direction [Segmentation](tab:Segmentation)
      - **{{ecc}}** is the median eccentricity of the cells – 0 is a circle, near 1 a line [Morphology](tab:Morphology)
    section: Findings
    tag: mm-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per analysis tab, Segmentation for Data & QC. The tiles of a
  # row share a stored height.
  - component_type: highlight
    section: Findings
    source_tab: Spatial
    source_component: sp-cell-map
    caption: The cells of one image where they sit, coloured by the first channel of the panel.
    hide_legend: true
    tag: mm-ov-hl-map
    index: ov-hl-map
    layout: {x: 0, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Segmentation
    source_component: seg-cells-per-image
    caption: Cells per image, one bar per segmentation method.
    hide_legend: true
    tag: mm-ov-hl-cells
    index: ov-hl-cells
    layout: {x: 4, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Markers
    source_component: mk-intensity-box
    caption: Each marker's intensity over the cells, on the asinh scale; colour is the segmenter.
    hide_legend: true
    tag: mm-ov-hl-markers
    index: ov-hl-markers
    layout: {x: 0, y: 6, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Morphology
    source_component: mo-size-shape
    caption: One point per cell, area against eccentricity; colour is the segmenter.
    hide_legend: true
    tag: mm-ov-hl-shape
    index: ov-hl-shape
    layout: {x: 4, y: 6, w: 4, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Previews](tab:Previews)
      - [Segmentation](tab:Segmentation)

      ### Cells
      - [Spatial](tab:Spatial)
      - [Markers](tab:Markers)
      - [Morphology](tab:Morphology)
    section: How to read this dashboard
    tag: mm-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the group first.
  - component_type: interactive
    workflow_tag: mcmicro
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: mm-filter-group
    index: sample-filters-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: mcmicro
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:image-outline
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: mm-filter-sample
    index: sample-filters-sample
    title: Image
    layout: {x: 0, y: 2, w: 1, h: 3}
  # Row selection feeds the Analysis panel.
  - component_type: table
    workflow_tag: mcmicro
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample
    section: Sample sheet
    tag: mm-sample-sheet
    index: sample-sheet
    title: Samplesheet
    description: One row per sample (one tissue image), with its cycle count and tile files.
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
# ============================================================================
# Data & QC
# ============================================================================
- title: MultiQC
  subtitle: Do the input tiles carry consistent image metadata?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  grid_sections:
  - name: Input image checks
    icon: mdi:shield-check-outline
    color: orange
    description: Tile size, pixel size, channels, data type and exposure, checked per image
  components:
  - component_type: text
    order: 1
    body: >
      Before any processing, the pipeline's prelude reads the metadata of every tile of every
      cycle and writes one [MultiQC](https://multiqc.info) matrix: a row per check, a column
      per image, a pass or a warning in each cell. A warning on exposure is common in test
      data; a failure on tile or pixel size would break the registration.
    tag: mm-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    workflow_tag: mcmicro
    data_collection_tag: multiqc_data
    selected_module: matrix_summary
    selected_plot: matrix_summary-section
    section: Input image checks
    tag: mm-mqc-matrix
    title: Input image checks
    description: One row per check, one column per image, pass or warning.
    layout: {x: 0, y: 0, w: 8, h: 4}
- title: Previews
  subtitle: What do the registered images and their masks look like?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:image-multiple-outline
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Preview filters
    icon: mdi:filter-variant
    color: cyan
    description: Narrow by processing stage or channel
  grid_sections:
  - name: Previews at a glance
    icon: mdi:counter
    color: cyan
    description: Previews by stage, and the channels they show
  - name: Gallery
    icon: mdi:view-dashboard-outline
    color: cyan
    description: Each channel of the registered image, a composite and the mask outlines
  - name: Preview table
    icon: mdi:table
    color: gray
    description: Every preview with its size and its scale to the full-resolution image
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      PNG previews of each registered image, written when the run was fetched: one grey image
      per channel, a composite (nuclear stain in blue, two markers in green and red) and the
      outlines of each segmentation mask over the nuclear stain. They are downscaled to at most
      1024 pixels; pick a stage or a channel on the left.
    tag: mm-prev-intro
    index: prev-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: mcmicro
    data_collection_tag: mcmicro_previews
    interactive_component_type: MultiSelect
    column_name: stage
    column_type: object
    display:
      icon_name: mdi:layers-outline
      custom_color: cyan
    section: Preview filters
    group: Previews
    tag: mm-prev-filter-stage
    index: prev-stage-filter
    title: Stage
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: mcmicro
    data_collection_tag: mcmicro_previews
    interactive_component_type: MultiSelect
    column_name: channel
    column_type: object
    display:
      icon_name: mdi:palette-outline
      custom_color: grape
    section: Preview filters
    group: Previews
    tag: mm-prev-filter-channel
    index: prev-channel-filter
    title: Channel
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: card
    workflow_tag: mcmicro
    data_collection_tag: mcmicro_previews
    aggregation: count
    column_name: preview_id
    column_type: object
    secondary_layout: composition
    breakdown_col: stage
    display:
      icon_name: mdi:image-multiple-outline
      icon_color: cyan
      caption: PNG previews, by stage
    section: Previews at a glance
    tag: mm-prev-card-previews
    index: prev-card-previews
    title: Previews
    description: Previews of the images in view, split into registered channels and mask outlines.
    layout: {x: 0, y: 0, w: 4, h: 2}
  - component_type: card
    workflow_tag: mcmicro
    data_collection_tag: mcmicro_previews
    aggregation: nunique
    column_name: channel
    column_type: object
    secondary_layout: top_n
    breakdown_col: stage
    top_n_count: 2
    display:
      icon_name: mdi:palette-outline
      icon_color: grape
      caption: channels, composites and outlines, by stage
    section: Previews at a glance
    tag: mm-prev-card-channels
    index: prev-card-channels
    title: Channels shown
    description: Distinct channels, composites and outline sets among the previews.
    layout: {x: 4, y: 0, w: 4, h: 2}
  # TODO(bioimage): replace the PNG previews with an OME-TIFF/zarr pyramid viewer (viv/deck.gl) once bioimage lands
  - component_type: image
    workflow_tag: mcmicro
    data_collection_tag: mcmicro_previews
    image_column: image_path
    thumbnail_size: 200
    columns: 4
    max_images: 24
    section: Gallery
    tag: mm-prev-gallery
    index: prev-gallery
    title: Image previews
    description: One tile per preview; open one to see it at full preview size.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: mcmicro
    data_collection_tag: mcmicro_previews
    row_selection_enabled: true
    row_selection_column: preview_id
    section: Preview table
    tag: mm-prev-table
    index: prev-table
    title: Previews
    description: Sample, stage, channel, file, size and scale of every preview.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Segmentation
  subtitle: How many cells does each method find, and do they agree?
  tab_group: Data & QC
  tab_order: 3
  tab_icon: mdi:shape-outline
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Segmentation filters
    icon: mdi:filter-variant
    color: blue
    description: Narrow by segmentation method
  grid_sections:
  - name: Segmentation at a glance
    icon: mdi:counter
    color: blue
    description: Cells, cells per image, their size and their regularity
  - name: Cells and sizes
    icon: mdi:chart-bar
    color: blue
    description: Cells per image and the spread of their areas, by method
  - name: Agreement between methods
    icon: mdi:scale-balance
    color: blue
    description: How often a cell of one method holds a cell of the other
  - name: Segmentation table
    icon: mdi:table
    color: gray
    description: Cells, area quartiles and median shape per image and method
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      Each method of the segmentation parameter cuts the registered image into cells:
      [Mesmer](https://github.com/vanvalenlab/deepcell-tf) on the nuclear stain,
      [Cellpose](https://www.cellpose.org) on the background-subtracted image. Two methods give
      two cell tables of one image; a cell of one holds a cell of the other when the other's
      centroid falls within its area.
    tag: mm-seg-intro
    index: seg-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: mcmicro
    data_collection_tag: mcquant_cells
    interactive_component_type: MultiSelect
    column_name: segmenter
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: blue
    section: Segmentation filters
    group: Segmentation
    tag: mm-seg-filter-segmenter
    index: seg-segmenter-filter
    title: Segmenter
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: card
    workflow_tag: mcmicro
    data_collection_tag: mcquant_cells
    use: mcquant/cell_count
    aggregation: count
    column_name: cell_key
    column_type: object
    secondary_layout: donut
    breakdown_col: sample
    display:
      icon_name: mdi:hexagon-multiple-outline
      icon_color: blue
      caption: cells, by image
      format: si
    section: Segmentation at a glance
    tag: mm-seg-card-cells
    index: seg-card-cells
