version: 1
# nf-core/viralmetagenome 1.2.0, on the family rules of depictio/projects/nf-core/RULES.md
# (ampliseq/2.18.0 is the reference implementation).
#
# Funnel: the MultiQC report and the reads of every sample (Data & QC) -> the
# de novo contigs, their taxonomic call and their clusters (Contigs) -> the
# consensus genomes, how close to a reference and how complete (Consensus) ->
# how deep and how evenly the reads cover them (Mapping) -> the variants each
# genome carries (Variants). Two hubs: the sample hub (`samples`) carries the
# persistent sample filters and the design columns, the genome hub (`genomes`,
# one row per sample and reference) carries a pick on a genome to the variant,
# coverage and refinement collections.
#
# Routes: a run takes the de novo route, the constraint route or both. Every
# collection a route may not write is optional, and the import prunes the
# tiles, the steps and the findings lines that read a missing one: no Contigs
# tab after --skip_assembly, no variant tiles after --skip_variant_calling. The
# design table is optional (METADATA_FILE); without it the group filter, group
# colours and group splits read one constant group.
#
# Genome browser: viralmetagenome publishes its filtered VCFs without the
# matching tabix index (the .tbi it writes belongs to the sorted VCF before
# filtering, which is not published), and its references are viral genomes no
# bundled assembly covers. The Variants tab therefore draws the iVar calls
# from the table collection on a genome_view whose axis comes from the rows,
# and leaves the file-backed track out.
# TODO(jbrowse): swap the table genome_view for a JBrowse2 DC (consensus FASTA
# as the reference, the filtered VCFs and per-base depth as tracks) once
# jbrowse.py is rebuilt and the pipeline publishes an index for its VCFs.
main_dashboard:
  title: nf-core/viralmetagenome
  subtitle: Viral genomes from metagenomic reads, from host removal to consensus and variants
  project_tag: Viral Metagenome Genomes
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family.
  category_colors:
    '{GROUP_COL}': auto
    # The two routes to a consensus genome.
    route:
      de novo: '#7048e8'
      constraint: '#1098ad'
    # What a genome resolves to: the palette by genome count, unnamed grey.
    virus:
      '*': auto
      Unclassified: '#adb5bd'
    # iVar's verdict, and the allele frequency band of a call.
    filter:
      PASS: '#2f9e44'
      Filtered: '#adb5bd'
    frequency_class:
      Fixed: '#c2255c'
      Major: '#f76707'
      Minor: '#74c0fc'
    variant_type:
      SNV: '#1c7ed6'
      Insertion: '#0ca678'
      Deletion: '#f59f00'
    # The merged Kraken2 and Kaiju call of a contig, and its cluster.
    classification:
      Classified: '#0ca678'
      Unclassified: '#f59f00'
      Not classified: '#adb5bd'
    cluster_role:
      Centroid: '#7048e8'
      Member: '#9775fa'
      Not clustered: '#adb5bd'
    status:
      Refined: '#2f9e44'
      Filtered out: '#adb5bd'
    stage:
      Raw: '#adb5bd'
      Trimmed: '#74c0fc'
      Host removed: '#1c7ed6'
    checkv_quality:
      Complete: '#2b8a3e'
      High-quality: '#2f9e44'
      Medium-quality: '#94d82d'
      Low-quality: '#f59f00'
      Not-determined: '#adb5bd'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. Both
  # are bound to the sample hub, the source of every sample link.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab, which no route removes.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: One row per sample, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Samples, below).
  - component_type: interactive
    workflow_tag: viralmetagenome
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Key figures
    tag: vm-ov-kf-group
    index: ov-kf-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: viralmetagenome
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: vm-ov-kf-sample
    index: ov-kf-sample
    title: Sample
    layout: {x: 2, y: 0, w: 2, h: 1}
  # The pipeline's wordmark, read from its repository; where it cannot load (no
  # internet), the title is drawn as text.
  - component_type: text
    title: nf-core/viralmetagenome
    logo: https://raw.githubusercontent.com/nf-core/viralmetagenome/master/docs/images/nf-core-viralmetagenome_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/viralmetagenome/master/docs/images/nf-core-viralmetagenome_logo_dark.png
    order: 1
    body: >
      Viral genomes rebuilt from metagenomic reads, de novo and against known references, with the
      variants each one carries. [Run parameters](params:)
    tag: vm-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  # The study: the samples sequenced, from the sample sheet and the optional design table.
  # The design line cites the group column, so it reads a dash where the run has none.
  - component_type: text
    surface: card
    values:
      n_samples: {dc: samples, column: sample, aggregation: nunique, format: integer}
      n_raw: {dc: samples, column: raw_read_pairs, aggregation: sum, format: si}
      groups: {dc: samples, column: '{GROUP_COL}', aggregation: nunique, format: integer}
      top_group: {dc: samples, column: '{GROUP_COL}', aggregation: top}
    body: |
      ### The study
      - ![](icon:mdi:test-tube) **Samples** {{n_samples}}, {{n_raw}} read pairs before trimming
      - ![](icon:mdi:shape-outline) **{GROUP_COL_DISPLAY}** {{groups}} groups, most often {{top_group}}
      - ![](icon:mdi:file-table-outline) **Samplesheet** [one row per sample](section:Sample sheet), its path in [the run parameters](params:input)
    tag: vm-ov-study
    index: ov-study
    layout: {x: 0, y: 1, w: 5, h: 4}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash.
  - component_type: text
    surface: card
    body: |
      ### The run
      - ![](icon:mdi:source-branch) **Pipeline** nf-core/viralmetagenome 1.2.0
      - ![](icon:mdi:filter-variant) **Host removal** {{param:host_k2_db}}
      - ![](icon:mdi:content-cut) **Trimming** {{param:trim_tool}}
      - ![](icon:mdi:puzzle-outline) **Assemblers** {{param:assemblers}}
      - ![](icon:mdi:set-merge) **Clustering** {{param:cluster_method}} at {{param:identity_threshold}} identity
      - ![](icon:mdi:sync) **Refinement** {{param:iterative_refinement_cycles}} cycles, consensus by {{param:consensus_caller}}
      - ![](icon:mdi:dna) **Variants** {{param:variant_caller}}
    tag: vm-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 4}
  # The marks take the accent colour, not the theme's blue. The steps that lead
  # to a route's tab cite a value from that route's collection: the import
  # removes the line with its data, so a run shows only the steps it took.
  - component_type: text
    surface: card
    accent: violet
    values:
      n_kept: {dc: samples, column: host_filtered_read_pairs, aggregation: sum, format: si}
      n_contigs: {dc: vmg_contigs, column: contig, aggregation: count, format: integer}
      n_denovo: {dc: vmg_contigs_overview, column: genome_id, aggregation: nunique, format: integer}
      n_genomes: {dc: genomes, column: genome_id, aggregation: nunique, format: integer}
      n_maps: {dc: coverage_cumulative, column: genome_id, aggregation: nunique, format: integer}
      n_calls: {dc: ivar_variants, column: variant_key, aggregation: count, format: si}
    body: |
      ### Six steps from reads to viral genomes
      Each step names its settings and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:filter-variant) **Clean** trimming and host removal leave {{n_kept}} read pairs · [Settings](params:trim_tool) · [Samples](tab:Samples)
      2. ![](icon:mdi:puzzle-outline) **Assemble** the assemblers build {{n_contigs}} contigs, classified and clustered · [Settings](params:assemblers) · [Contigs](tab:Contigs)
      3. ![](icon:mdi:sync) **Refine** {{n_denovo}} kept clusters are mapped and called into a consensus · [Settings](params:iterative_refinement_cycles) · [Consensus](tab:Consensus)
      4. ![](icon:mdi:check-decagram) **Assess** {{n_genomes}} consensus genomes are compared with references and scored by CheckV · [Settings](params:skip_checkv) · [Consensus](tab:Consensus)
      5. ![](icon:mdi:chart-line) **Map** {{n_maps}} mappings give the depth and breadth of every genome · [Settings](params:mapping_constraints) · [Mapping](tab:Mapping)
      6. ![](icon:mdi:dna) **Call** iVar reports {{n_calls}} variant calls, minor ones included · [Settings](params:variant_caller) · [Variants](tab:Variants)
      :::
    tag: vm-ov-steps
    index: ov-steps
    layout: {x: 0, y: 5, w: 8, h: 3}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/viralmetagenome cleans the reads of each sample, removes the host, assembles the rest and clusters the contigs into the genomes it can rebuild. Each cluster is refined into a consensus by mapping the reads back, and the reads are also mapped to the references of the constraint sheet. This page sums up one run; each tab behind it answers one question, in the order of the steps above.

      The sample filters in the left panel apply to every tab: narrow the samples once and the whole dashboard follows. A bar above a section narrows that section only.
    tag: vm-ov-about
    index: ov-about
    layout: {x: 0, y: 8, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. All four read collections every route writes.
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: samples
    aggregation: count
    column_name: sample
    column_type: object
    secondary_layout: composition
    breakdown_col: '{GROUP_COL}'
    display:
      icon_name: mdi:test-tube
      icon_color: orange
      caption: sequenced, by {GROUP_COL_DISPLAY}
      link: tab:Samples
    section: Key figures
    tag: vm-ov-kf-samples
    index: ov-kf-samples
    title: Samples
    description: Samples of the run. The bar splits them by {GROUP_COL_DISPLAY}.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: samples
    aggregation: median
    column_name: host_filtered_read_pairs
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:filter-variant
      icon_color: teal
      caption: per sample, with the spread
      link: tab:Samples
      format: si
    section: Key figures
    tag: vm-ov-kf-reads
    index: ov-kf-reads
    title: Clean read pairs
    description: Read pairs left after trimming and host removal, the reads assembly and mapping start from.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: genomes
    aggregation: count
    column_name: genome_id
    column_type: object
    secondary_layout: composition
    breakdown_col: route
    display:
      icon_name: mdi:virus
      icon_color: violet
      caption: de novo or against a constraint reference
      link: tab:Consensus
    section: Key figures
    tag: vm-ov-kf-genomes
    index: ov-kf-genomes
    title: Consensus genomes
    description: Consensus genomes the run built, one per sample and reference. The bar splits them by route.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: genomes
    aggregation: median
    column_name: cov_10x_pct
    column_type: float64
    secondary_layout: threshold
    threshold_value: 90
    threshold_direction: min
    threshold_warn: 50
    display:
      icon_name: mdi:chart-line
      icon_color: blue
      caption: genomes at 90% breadth or more, 50% warns
      link: tab:Mapping
      decimals: 1
    section: Key figures
    tag: vm-ov-kf-breadth
    index: ov-kf-breadth
    title: Breadth at 10X
    description: Share of a genome covered by ten reads or more, in percent; the median genome, and how many pass 90%.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the group, then the sample.
  - component_type: interactive
    workflow_tag: viralmetagenome
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Findings
    tag: vm-ov-findings-group
    index: ov-findings-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: viralmetagenome
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Sample
    section: Findings
    tag: vm-ov-findings-sample
    index: ov-findings-sample
    title: Sample
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one collection, so a route that
  # lacks it loses that row alone.
  - component_type: text
    surface: card
    values:
      ctg_bp: {dc: vmg_contigs, column: length_bp, aggregation: sum, format: si}
      ctg_n: {dc: vmg_contigs, column: contig, aggregation: count, format: integer}
      top_virus: {dc: genomes, column: virus, aggregation: top}
      ident: {dc: genomes, column: annotation_identity_pct, aggregation: median, format: 'decimals:1'}
      breadth: {dc: genomes, column: cov_10x_pct, aggregation: median, format: 'decimals:1'}
      depth: {dc: genomes, column: mean_depth, aggregation: median, format: 'decimals:1'}
      n_pass: {dc: ivar_variants, column: variant_key, aggregation: count, filter_expr: "col('filter') == 'PASS'", format: integer}
      n_minor: {dc: ivar_variants, column: variant_key, aggregation: count, filter_expr: "col('frequency_class') == 'Minor'", format: integer}
    body: |
      - **{{ctg_bp}}** bases assembled in {{ctg_n}} de novo contigs – the clusters keep those a genome is rebuilt from [Contigs](tab:Contigs)
      - **{{top_virus}}** is what most consensus genomes resolve to – at {{ident}}% median identity to the closest reference [Consensus](tab:Consensus)
      - **{{breadth}}%** median breadth at 10X across the consensus genomes – at {{depth}}X median depth [Mapping](tab:Mapping)
      - **{{n_pass}}** variant calls pass iVar's filters – {{n_minor}} calls sit under half frequency, minor variants or noise [Variants](tab:Variants)
    section: Findings
    tag: vm-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per analysis tab, in the order of the tabs. The tiles of a
  # row share a stored height.
  - component_type: highlight
    section: Findings
    source_tab: Contigs
    source_component: ctg-length-reads
    caption: One point per contig, by length and reads mapped back on log axes; colour is its taxonomic call.
    hide_legend: true
    tag: vm-ov-hl-contigs
    index: ov-hl-contigs
    layout: {x: 0, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Consensus
    source_component: cns-identity-ambiguity
    caption: One point per consensus genome, by its ambiguous bases and its identity to the closest reference; colour is the route.
    hide_legend: true
    tag: vm-ov-hl-consensus
    index: ov-hl-consensus
    layout: {x: 4, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Mapping
    source_component: map-cumulative
    caption: One curve per genome, the share of it covered at least at each depth; a curve that falls early is shallow.
    hide_legend: true
    tag: vm-ov-hl-mapping
    index: ov-hl-mapping
    layout: {x: 0, y: 6, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Variants
    source_component: var-af-depth
    caption: One point per variant call, by read depth and allele frequency; colour is the frequency band.
    hide_legend: true
    tag: vm-ov-hl-variants
    index: ov-hl-variants
    layout: {x: 4, y: 6, w: 4, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers. A tile whose tab a route pruned draws nothing.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Samples](tab:Samples)

      ### Assembly
      - [Contigs](tab:Contigs)
      - [Consensus](tab:Consensus)
      - [Mapping](tab:Mapping)

      ### Variants
      - [Variants](tab:Variants)
    section: How to read this dashboard
    tag: vm-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the group first.
  - component_type: interactive
    workflow_tag: viralmetagenome
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: vm-filter-group
    index: sample-filters-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: viralmetagenome
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: vm-filter-sample
    index: sample-filters-sample
    title: Sample
    layout: {x: 0, y: 2, w: 1, h: 3}
  # Row selection feeds the Analysis panel.
  - component_type: table
    workflow_tag: viralmetagenome
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample
    section: Sample sheet
    tag: vm-sample-sheet
    index: sample-sheet
    title: Samples
    description: One row per sample, with its design columns, its reads at each stage, its host share and its de novo assembly.
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
# ============================================================================
# Data & QC
# ============================================================================
- title: MultiQC
  subtitle: What does the MultiQC report say about reads and mappings?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Report scope
    icon: mdi:tune
    color: orange
    description: Narrow the MultiQC panels to selected report rows
  grid_sections:
  - name: Read QC
    icon: mdi:chart-bar
    color: orange
    description: Reads per sample, what fastp kept, base quality and the host share
  - name: Mapping and calls
    icon: mdi:chart-box-outline
    color: orange
    description: Reads mapped, duplicates, cumulative coverage and substitution types
  components:
  - component_type: text
    order: 1
    body: >
      [MultiQC](https://seqera.io/multiqc/) gathers FastQC, fastp, Kraken2 host removal, samtools,
      Picard, mosdepth and bcftools, rebuilt with MultiQC 1.35 from the run's tool outputs. FastQC
      runs three times per sample (raw, trimmed, host removed) and every mapping is a row of its own,
      named after its sample and reference, so the sample filters narrow every panel.
    tag: vm-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    workflow_tag: viralmetagenome
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: Read QC
    tag: vm-mqc-general-stats
    title: General statistics
    description: One row per sample, the headline columns of every tool in the report side by side.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: viralmetagenome
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Counts
    section: Read QC
    tag: vm-mqc-fastqc-counts
    index: mqc-fastqc-counts
    title: Reads per FastQC run
    description: Unique and duplicate reads of every FastQC run, raw, trimmed and host removed.
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: viralmetagenome
    data_collection_tag: multiqc_data
    use: multiqc/fastp
    selected_module: fastp
    selected_plot: Filtered Reads
    section: Read QC
    tag: vm-mqc-fastp-filtered
    index: mqc-fastp-filtered
    title: Reads fastp kept and removed
    description: Reads passing fastp, and the ones removed for low quality, too many N or short length.
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: viralmetagenome
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    section: Read QC
    tag: vm-mqc-fastqc-quality
    index: mqc-fastqc-quality
    title: Base quality along the read
    description: Mean Phred score at each read position, per FastQC run.
    layout: {x: 0, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: viralmetagenome
    data_collection_tag: multiqc_data
    use: multiqc/kraken
    selected_module: kraken
    selected_plot: Top taxa
    section: Read QC
    tag: vm-mqc-kraken
    index: mqc-kraken
    title: Host removal, the taxa Kraken2 found
    description: Reads the host database classified, by taxon; everything unclassified goes on to assembly.
    layout: {x: 4, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: viralmetagenome
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Percent mapped
    section: Mapping and calls
    tag: vm-mqc-samtools
    index: mqc-samtools
    title: Reads mapped per mapping
    description: Share of the reads samtools reports mapped, one row per sample and reference.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: viralmetagenome
    data_collection_tag: multiqc_data
    use: multiqc/picard
    selected_module: picard
    selected_plot: Mark Duplicates
    section: Mapping and calls
    tag: vm-mqc-picard
    index: mqc-picard
    title: Duplicates per mapping
    description: Unique and duplicate read pairs Picard MarkDuplicates counted.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: viralmetagenome
    data_collection_tag: multiqc_data
    use: multiqc/mosdepth
    selected_module: mosdepth
    selected_plot: Cumulative coverage distribution
