- title: Variants
  subtitle: Which variants does each genome carry, and how fixed are they?
  tab_group: Variants
  tab_order: 6
  tab_icon: mdi:dna
  tab_icon_color: red
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Call scope
    icon: mdi:filter-variant
    color: red
    description: Keep calls by variant type or by the route of their genome
  grid_sections:
  - name: Calls at a glance
    icon: mdi:counter
    color: red
    description: Passing calls, minor calls, call depth and the genomes that carry calls
  - name: Along the genome
    icon: mdi:dna
    color: red
    description: Every call at its position and allele frequency, one lane per genome
  - name: Frequency and depth
    icon: mdi:chart-scatter-plot
    color: red
    description: Allele frequency against read depth, one point per call
  - name: Variant table
    icon: mdi:table
    color: gray
    description: Every iVar call with its depths, frequency, p-value and verdict
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [iVar](https://andersen-lab.github.io/ivar/html/) calls variants on the reads of each sample
      against each of its references, and keeps the calls under the consensus threshold too:
      fixed calls make the consensus, minor ones are intra-host diversity or noise. The lanes open on
      every reference at once; brush one to zoom, and filter the call type in the left panel.
    tag: vm-var-intro
    index: var-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: viralmetagenome
    data_collection_tag: ivar_variants
    interactive_component_type: MultiSelect
    column_name: variant_type
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: red
    section: Call scope
    group: Calls
    tag: vm-var-filter-type
