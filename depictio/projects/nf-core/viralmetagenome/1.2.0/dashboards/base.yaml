- title: Samples
  subtitle: How many reads of each sample reach assembly?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:test-tube
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Read scope
    icon: mdi:filter-variant
    color: teal
    description: Keep samples inside a host share or retained read band
  grid_sections:
  - name: Reads at a glance
    icon: mdi:counter
    color: teal
    description: Read pairs kept, host share, base quality and duplication across the samples
  - name: Read funnel
    icon: mdi:chart-bar
    color: teal
    description: Read pairs of each sample before trimming, after trimming and after host removal
  - name: Depth and loss
    icon: mdi:chart-scatter-plot
    color: teal
    description: Raw read pairs against the share left after preprocessing, one point per sample
  - name: Read tables
    icon: mdi:table
    color: gray
    description: Read pairs per sample and preprocessing stage
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [fastp](https://github.com/OpenGene/fastp) trims the reads, prinseq removes low-complexity
      ones and [Kraken2](https://ccb.jhu.edu/software/kraken2/) against a host database removes the
      host, and what is left goes on to assembly and mapping. A sample that loses most of its reads
      here has little left to rebuild a genome from, whatever the later tabs show.
    tag: vm-smp-intro
    index: smp-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: viralmetagenome
    data_collection_tag: samples
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: host_pct
    column_type: float64
    display:
      icon_name: mdi:account-filter-outline
      custom_color: pink
    section: Read scope
    group: Reads
    tag: vm-smp-filter-host
    index: smp-host-range
    title: Host reads (%)
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralmetagenome
    data_collection_tag: samples
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: retained_pct
    column_type: float64
    display:
      icon_name: mdi:filter-variant
      custom_color: teal
    section: Read scope
    group: Reads
    tag: vm-smp-filter-retained
    index: smp-retained-range
    title: Read pairs retained (%)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: samples
    use: viralmetagenome/read_attrition
    aggregation: sum
    column_name: raw_read_pairs
    column_type: int64
    secondary_layout: attrition
    attrition_cols: [trimmed_read_pairs, host_filtered_read_pairs]
    display:
      icon_name: mdi:filter-variant
      icon_color: teal
      caption: kept after trimming, then after host removal
      format: si
    section: Reads at a glance
    tag: vm-smp-card-attrition
    index: smp-card-attrition
    title: Raw read pairs
    description: Read pairs sequenced across the samples, and how many trimming and host removal leave.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: samples
    aggregation: median
    column_name: host_pct
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:account-filter-outline
      icon_color: pink
      caption: host share, per sample (%)
      decimals: 2
    section: Reads at a glance
    tag: vm-smp-card-host
    index: smp-card-host
    title: Host reads
    description: Read pairs Kraken2 classified against the host database, in percent of the trimmed pairs.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: samples
    aggregation: median
    column_name: q30_pct
    column_type: float64
    secondary_layout: threshold
    threshold_value: 80
    threshold_direction: min
    threshold_warn: 70
    display:
      icon_name: mdi:check-decagram
      icon_color: green
      caption: samples at 80% Q30 or more, 70% warns
      decimals: 1
    section: Reads at a glance
    tag: vm-smp-card-q30
    index: smp-card-q30
    title: Q30 bases
    description: Bases at Phred 30 or better after fastp, in percent; Illumina's usual floor is 80%.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: samples
    aggregation: median
    column_name: raw_dup_pct
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:content-copy
      icon_color: orange
      caption: median per sample, with the spread
      decimals: 1
    section: Reads at a glance
    tag: vm-smp-card-dup
    index: smp-card-dup
    title: Duplicate reads
    description: FastQC's duplicate share of the raw reads, in percent; a small viral genome sequenced deep duplicates by chance.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: viralmetagenome
    data_collection_tag: read_funnel
    visu_type: bar
    dict_kwargs:
      x: sample
      y: read_pairs
      color: stage
      barmode: group
      category_orders: {stage: [Raw, Trimmed, Host removed]}
      labels: {sample: Sample, read_pairs: Read pairs, stage: Stage}
    section: Read funnel
    tag: vm-smp-fig-funnel
    index: smp-funnel
    title: Read pairs at each preprocessing stage
    description: >-
      Where does each sample lose its reads? The three stages of a sample sit side by side as bars (raw,
      trimmed, host removed), so a bar that drops between two stages marks where the reads went, and
      three bars of the same height mean nothing was lost.

      How to read: a sample that keeps most of its pairs through both steps has three bars of similar
      height. A drop at **Trimmed** is reads that failed quality, length or complexity filtering, so
      open [MultiQC](tab:MultiQC) for its fastp report. A drop at **Host removed** means the sample was
      mostly host, and a short last bar leaves little to assemble, whatever the later tabs show.

      Note: bars are read-pair counts, so a deeply sequenced sample stands taller than a shallow one
      even when both keep the same share. The share each sample keeps is in the scatter below and in the
      per-stage table.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: viralmetagenome
    data_collection_tag: samples
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: raw_read_pairs
      y_col: retained_pct
      label_col: sample
      label_order_col: retained_pct
      top_n_labels: 6
      color_col: '{GROUP_COL}'
      marker_size: 14
      opacity: 0.85
      marker_outline: true
      log_x: true
      reference_line: horizontal
      reference_value: 90
      reference_label: 90 % kept
      x_title: Raw read pairs (log)
      y_title: Read pairs retained after preprocessing (%)
      legend_pos: bottom
      selection_enabled: true
      selection_column: sample
    section: Depth and loss
    tag: vm-smp-av-depth-loss
    index: smp-depth-loss
    title: Raw read pairs against the share retained
    description: >-
      Do the samples that start small also lose the most reads to trimming and host removal? One point
      per sample, coloured by {GROUP_COL_DISPLAY}, on a log axis because read counts span orders of
      magnitude. A scatter shows both measures at once.

      How to read: points near the top keep nearly all their pairs whatever their depth, and a point low
      on the plot lost a large share of them. If the low points are also the small ones, the loss goes
      with shallow sequencing; if they sit at every depth, the cause is the sample itself, so open
      [MultiQC](tab:MultiQC) for its fastp report. Lasso a group of points to narrow every tab to those
      samples.

      Lines and annotations: the dashed line sits at 90 % of the pairs retained, and the six samples
      that retain the least are named. 90 % is a fixed reading aid, not a pass mark: neither fastp nor
      Kraken2 publishes a share of reads a sample should keep, so no verdict is drawn from it.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: viralmetagenome
    data_collection_tag: read_funnel
    columns: [sample, stage, read_pairs, pct_of_raw]
    row_selection_enabled: true
    row_selection_column: sample
    section: Read tables
    tag: vm-smp-table-funnel
    index: smp-table-funnel
    title: Read pairs per stage
    description: Read pairs of each sample at each preprocessing stage and their share of the raw pairs.
    layout: {x: 0, y: 0, w: 8, h: 6}
# ============================================================================
# Assembly
# ============================================================================
- title: Contigs
  subtitle: Which contigs did the assembly build, and what are they?
  tab_group: Assembly
  tab_order: 3
  tab_icon: mdi:puzzle-outline
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Contig scope
    icon: mdi:filter-variant
    color: violet
    description: Keep contigs by taxonomic call, cluster role or length
  grid_sections:
  - name: Contigs at a glance
    icon: mdi:counter
    color: violet
    description: Contigs, assembled bases, reads on them and the clusters they form
  - name: Length and support
    icon: mdi:chart-scatter-plot
    color: violet
    description: Every contig by its length and the reads that map back to it
  - name: Clusters
    icon: mdi:set-merge
    color: violet
    description: The read depth share of each cluster, refined or filtered out
  - name: Contig tables
    icon: mdi:table
    color: gray
    description: Every contig and every cluster, with their calls and members
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      The assemblers build contigs from the clean reads; Kraken2 and Kaiju classify each one, and
      CD-HIT-EST groups them with the reference pool into clusters, one per genome to rebuild. A
      cluster with too small a share of the reads is filtered out, and the others go on to the
      [Consensus](tab:Consensus) tab.
    tag: vm-ctg-intro
    index: ctg-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: viralmetagenome
    data_collection_tag: vmg_contigs
    interactive_component_type: MultiSelect
    column_name: classification
    column_type: object
    display:
      icon_name: mdi:bacteria-outline
      custom_color: grape
    section: Contig scope
    group: Contigs
    tag: vm-ctg-filter-class
    index: ctg-class-filter
    title: Taxonomic call
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: viralmetagenome
    data_collection_tag: vmg_contigs
    interactive_component_type: MultiSelect
    column_name: cluster_role
    column_type: object
    display:
      icon_name: mdi:set-merge
      custom_color: violet
    section: Contig scope
    group: Contigs
    tag: vm-ctg-filter-role
    index: ctg-role-filter
    title: Cluster role
    layout: {x: 0, y: 2, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: viralmetagenome
    data_collection_tag: vmg_contigs
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: length_bp
    column_type: int64
    display:
      icon_name: mdi:ruler
      custom_color: blue
    section: Contig scope
    group: Contigs
    tag: vm-ctg-filter-length
    index: ctg-length-range
    title: Contig length (bp)
    layout: {x: 0, y: 4, w: 1, h: 3}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: vmg_contigs
    use: viralmetagenome/contigs_by_class
    aggregation: count
    column_name: contig
    column_type: object
    secondary_layout: composition
    breakdown_col: classification
    display:
      icon_name: mdi:puzzle-outline
      icon_color: violet
      caption: contigs, by taxonomic call
    section: Contigs at a glance
    tag: vm-ctg-card-contigs
    index: ctg-card-contigs
    title: Contigs
    description: De novo contigs across the samples and assemblers, split by the merged Kraken2 and Kaiju call.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: vmg_contigs
    use: viralmetagenome/assembled_bp
    aggregation: sum
    column_name: length_bp
    column_type: int64
    secondary_layout: composition
    breakdown_col: length_class
    top_n_count: 5
    display:
      icon_name: mdi:ruler
      icon_color: blue
      caption: bases, by contig length band
      format: si
    section: Contigs at a glance
    tag: vm-ctg-card-bases
    index: ctg-card-bases
    title: Assembled bases
    description: Bases in the de novo contigs; long contigs holding most of them make an easy genome to rebuild.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: vmg_contigs
    use: viralmetagenome/reads_on_contigs
    aggregation: sum
    column_name: mapped_reads
    column_type: int64
    secondary_layout: donut
    breakdown_col: cluster_role
    display:
      icon_name: mdi:relation-many-to-many
      icon_color: teal
      caption: reads, by the contig's cluster role
      format: si
    section: Contigs at a glance
    tag: vm-ctg-card-reads
    index: ctg-card-reads
    title: Reads on contigs
    description: Reads that map back to the contigs; the ring shows how many land on clustered contigs.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: vmg_clusters
    use: viralmetagenome/clusters_by_status
    aggregation: count
    column_name: cluster
    column_type: object
    secondary_layout: composition
    breakdown_col: status
    display:
      icon_name: mdi:set-merge
      icon_color: grape
      caption: clusters, refined or filtered out
    section: Contigs at a glance
    tag: vm-ctg-card-clusters
    index: ctg-card-clusters
    title: Contig clusters
    description: Clusters across the samples; a filtered cluster held too small a share of the reads to refine.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: viralmetagenome
    data_collection_tag: vmg_contigs
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: length_bp
      y_col: mapped_reads
      label_col: contig
      color_col: classification
      size_col: read_share_pct
      min_size: 10
      max_size: 30
      opacity: 0.85
      marker_outline: true
      top_n_labels: 4
      density_threshold: 2000
      log_x: true
      log_y: true
      reference_line: vertical
      reference_value: 1000
      reference_label: 1 kb
      x_title: Contig length in bp (log)
      y_title: Reads mapped back (log)
      legend_pos: bottom
      selection_enabled: true
      selection_column: sample
    section: Length and support
    tag: vm-ctg-av-length-reads
    index: ctg-length-reads
    title: Contig length against the reads it holds
    description: >-
      Are the long contigs the ones the reads support? One point per contig, coloured by its taxonomic
      call (classified, unclassified or not classified) and sized by its share of the sample's reads, on
      log axes because both measures span orders of magnitude. Lasso contigs to narrow every tab to
      their samples.

      How to read: contigs follow a rising band, since a longer contig catches more reads. A long contig
      well under the band has few reads for its length, which suggests a chimera or a contaminant, and a
      short one above it is a fragment of a deep genome. Large, long points are what the assembly
      rebuilt best, so follow them to [Consensus](tab:Consensus) to see which became genomes.

      Lines and annotations: the dashed vertical line marks 1 kb, and the four contigs holding the
      largest share of their sample's reads are named. 1 kb is a fixed reading aid with no published
      source, as no tool sets a length a contig needs to rebuild a genome; the pipeline's own floor is
      `--min_contig_size`, default 500 bp.

      Source: nf-core/viralmetagenome parameters, https://nf-co.re/viralmetagenome/parameters

      Note: past 2000 contigs the tile draws a density map in place of one marker per contig, and the
      tile's view switch flips it back.
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: advanced_viz
    workflow_tag: viralmetagenome
    data_collection_tag: vmg_clusters
    viz_kind: stacked_bar
    config:
      viz_kind: stacked_bar
      sample_id_col: sample
      taxon_col: status
      rank_col: null
      abundance_col: read_depth_pct
      normalise_to_one: true
      sample_sort: category
      sort_category: Filtered out
      top_n: 4
      value_title: Share of the contig read depth
      hidden_controls: [rank, top_n, group]
    section: Clusters
    tag: vm-ctg-fig-clusters
    index: ctg-clusters
    title: Read depth share of the clusters per sample
    description: >-
      Did the refined clusters keep most of each sample's reads? Each bar is one sample, split into the
      share of its contig read depth held by refined clusters (green) and by filtered ones (grey).

      How to read: a bar mostly green is a sample whose genome was rebuilt from most of its reads. A
      large grey part is a genome left behind, because those clusters held too small a share to refine.
      The bars open with the largest grey share first, the sort control changes the order, and the
      cluster table below lists the centroid and read share of each cluster.

      Annotations: green is Refined and grey is Filtered out, each bar is scaled to 100 %, and no
      cut-off line is drawn. The pipeline's own floor for keeping a cluster is `--perc_reads_contig`,
      default 5, which the run's parameters show.

      Source: nf-core/viralmetagenome parameters, https://nf-co.re/viralmetagenome/parameters
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    workflow_tag: viralmetagenome
    data_collection_tag: vmg_contigs
    use: viralmetagenome/contigs
    columns: [sample, assembler, contig, length_bp, mapped_reads, read_share_pct, classification, taxid, cluster, cluster_role]
    row_selection_enabled: true
    row_selection_column: sample
    section: Contig tables
    tag: vm-ctg-table-contigs
    index: ctg-table-contigs
    title: De novo contigs
    description: Every contig with its length, reads, taxonomic call and cluster.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: viralmetagenome
    data_collection_tag: vmg_clusters
    use: viralmetagenome/clusters
    columns: [sample, cluster, status, cluster_type, taxid, centroid, members, member_bp, read_depth_pct]
    row_selection_enabled: true
    row_selection_column: sample
    section: Contig tables
    tag: vm-ctg-table-clusters
    index: ctg-table-clusters
    title: Contig clusters
    description: Every cluster with its centroid, members, read depth share and fate.
    layout: {x: 0, y: 6, w: 8, h: 6}
- title: Consensus
  subtitle: How close to a reference and how complete is each genome?
  tab_group: Assembly
  tab_order: 4
  tab_icon: mdi:virus
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Genome scope
    icon: mdi:filter-variant
    color: grape
    description: Keep consensus genomes by route, by virus or by segment
  grid_sections:
  - name: Genomes at a glance
    icon: mdi:counter
    color: grape
