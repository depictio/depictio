- title: Contigs
  subtitle: Which contigs did the assembly build, and what are they?
  tab_group: Assembly
  tab_order: 3
  tab_icon: mdi:puzzle-outline
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Contig scope
    icon: mdi:filter-variant
    color: violet
    description: Keep contigs by taxonomic call, cluster role or length
  grid_sections:
  - name: Contigs at a glance
    icon: mdi:counter
    color: violet
    description: Contigs, assembled bases, reads on them and the clusters they form
  - name: Length and support
    icon: mdi:chart-scatter-plot
    color: violet
    description: Every contig by its length and the reads that map back to it
  - name: Clusters
    icon: mdi:set-merge
    color: violet
    description: The read depth share of each cluster, refined or filtered out
  - name: Contig tables
    icon: mdi:table
    color: gray
    description: Every contig and every cluster, with their calls and members
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      The assemblers build contigs from the clean reads; Kraken2 and Kaiju classify each one, and
      CD-HIT-EST groups them with the reference pool into clusters, one per genome to rebuild. A
      cluster with too small a share of the reads is filtered out, and the others go on to the
      [Consensus](tab:Consensus) tab.
    tag: vm-ctg-intro
    index: ctg-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: viralmetagenome
    data_collection_tag: vmg_contigs
    interactive_component_type: MultiSelect
    column_name: classification
    column_type: object
    display:
      icon_name: mdi:bacteria-outline
      custom_color: grape
    section: Contig scope
    group: Contigs
    tag: vm-ctg-filter-class
    index: ctg-class-filter
    title: Taxonomic call
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: viralmetagenome
    data_collection_tag: vmg_contigs
    interactive_component_type: MultiSelect
    column_name: cluster_role
    column_type: object
    display:
      icon_name: mdi:set-merge
      custom_color: violet
    section: Contig scope
    group: Contigs
    tag: vm-ctg-filter-role
    index: ctg-role-filter
    title: Cluster role
    layout: {x: 0, y: 2, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: viralmetagenome
    data_collection_tag: vmg_contigs
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: length_bp
    column_type: int64
    display:
      icon_name: mdi:ruler
      custom_color: blue
    section: Contig scope
    group: Contigs
    tag: vm-ctg-filter-length
    index: ctg-length-range
    title: Contig length (bp)
    layout: {x: 0, y: 4, w: 1, h: 3}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: vmg_contigs
    use: viralmetagenome/contigs_by_class
    aggregation: count
    column_name: contig
    column_type: object
    secondary_layout: composition
    breakdown_col: classification
    display:
      icon_name: mdi:puzzle-outline
      icon_color: violet
      caption: contigs, by taxonomic call
    section: Contigs at a glance
    tag: vm-ctg-card-contigs
    index: ctg-card-contigs
    title: Contigs
    description: De novo contigs across the samples and assemblers, split by the merged Kraken2 and Kaiju call.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: vmg_contigs
    use: viralmetagenome/assembled_bp
    aggregation: sum
    column_name: length_bp
    column_type: int64
    secondary_layout: composition
    breakdown_col: length_class
    top_n_count: 5
    display:
      icon_name: mdi:ruler
      icon_color: blue
      caption: bases, by contig length band
      format: si
    section: Contigs at a glance
    tag: vm-ctg-card-bases
    index: ctg-card-bases
    title: Assembled bases
    description: Bases in the de novo contigs; long contigs holding most of them make an easy genome to rebuild.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: vmg_contigs
    use: viralmetagenome/reads_on_contigs
    aggregation: sum
    column_name: mapped_reads
    column_type: int64
    secondary_layout: donut
    breakdown_col: cluster_role
