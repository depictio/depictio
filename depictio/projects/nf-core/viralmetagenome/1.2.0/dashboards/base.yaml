    display:
      icon_name: mdi:check-decagram
      icon_color: teal
      caption: median per genome, with the spread
      decimals: 1
    section: Genomes at a glance
    tag: vm-cns-card-identity
    index: cns-card-identity
    title: Identity to reference
    description: Identity of a consensus to its closest reference in the annotation database, in percent.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: genomes
    aggregation: count
    column_name: genome_id
    column_type: object
    secondary_layout: donut
    breakdown_col: checkv_quality
    display:
      icon_name: mdi:shield-check-outline
      icon_color: green
      caption: genomes, by CheckV quality tier
    section: Genomes at a glance
    tag: vm-cns-card-checkv
    index: cns-card-checkv
    title: CheckV quality
    description: CheckV's tier for each genome; Not-determined means its database holds no close enough genome.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: viralmetagenome
    data_collection_tag: genomes
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: n_pct
      y_col: annotation_identity_pct
      label_col: genome_id
      label_order_col: annotation_identity_pct
      top_n_labels: 3
      color_col: route
      marker_size: 14
      opacity: 0.85
      marker_outline: true
      quadrants:
        x: 5
        y: 95
        labels: ['', 'Many N, close to a reference', 'Few N, far from a reference', 'Many N, far from a reference']
      x_title: Ambiguous bases (% N)
      y_title: Identity to the closest reference (%)
      legend_pos: bottom
      selection_enabled: true
      selection_column: genome_id
    section: Identity and ambiguity
    tag: vm-cns-av-identity-ambiguity
    index: cns-identity-ambiguity
    title: Ambiguous bases against identity per genome
    description: >-
      Which consensus genomes have few gaps and a close reference? One point per genome, coloured by
      route, plotted by its share of ambiguous bases (N) and its identity to the closest reference. Two
      measures describe a genome, which is why they are plotted against each other.

      How to read: the top left corner, with few ambiguous bases and a close reference, holds a genome
      that is complete and known. A point far to the right has gaps where the reads were too shallow
      ([Mapping](tab:Mapping) shows its depth), and a point low on the plot is far from every reference
      of the database, as a new virus would be. Click a point to open its record beside the plot.

      Lines and annotations: the dashed lines sit at 5 % N and 95 % identity, the three genomes furthest
      from a reference are named, and every corner carries a label except the top left one. 95 % is the
      identity MIUViG uses to group genomes into one species-level virus unit, applied here to the
      identity with the closest reference. 5 % N has no published source, as no tool or guideline sets a
      maximum share of ambiguous bases, so it is a fixed reading aid and not a pass mark.

      Source: MIUViG, Roux et al. 2019, https://doi.org/10.1038/nbt.4306
    layout: {x: 0, y: 0, w: 5, h: 8}
  - component_type: advanced_viz
    workflow_tag: viralmetagenome
    data_collection_tag: genomes
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: cns-identity-ambiguity
      id_col: genome_id
      title_col: genome_id
      selection_source: scatter_selection
      sections:
        Genome: [sample, reference, route, step, virus, consensus_length]
        Reference: [annotation_name, annotation_identity_pct, annotation_aligned_pct, blast_hit, blast_identity_pct]
        Quality: [n_pct, checkv_quality, checkv_completeness, checkv_contamination, checkv_genes]
        Reads: [mapped_reads, mean_depth, cov_10x_pct, snps, indels]
    section: Identity and ambiguity
    tag: vm-cns-av-record
    index: cns-genome-record
    title: Picked genome
    description: >-
      The record of the genome picked on the plot beside it, in four sections: the genome itself, its
      closest reference, its quality and its reads.

      How to read: the tile waits for a click on a point. Genome names the sample, reference, route and
      refinement step, Reference gives the closest annotated reference and the BLAST hit with their
      identity, Quality gives the ambiguous bases and the CheckV completeness and contamination, and
      Reads gives the mapped reads, depth, breadth at 10X and the variant counts. A low identity, a high
      N share or a low completeness explains where the genome sits on the plot.

      Note: CheckV reads Not-determined, with no completeness, when its database holds no genome close
      enough to the sequence.
    layout: {x: 5, y: 0, w: 3, h: 8}
  - component_type: figure
    workflow_tag: viralmetagenome
    data_collection_tag: vmg_contig_iterations
    visu_type: line
    mode: code
    code_content: |-
      # Ambiguous bases of each de novo consensus at every refinement step, one line per genome. The axis is
      # logarithmic and floored at 0.1 %, because the share of N can be exactly 0. The dashed line is the 5 % N
      # above which a genome is not ready to use. A genome with a single point has no later step in the table.
      d = df.filter(pl.col('step_order').is_not_null() & pl.col('n_pct').is_not_null()).sort(['genome_id', 'step_order']).with_columns(pl.col('n_pct').clip(lower_bound=0.1).alias('n_shown'))
      steps = d.select('step_order', 'step').unique(subset='step_order').sort('step_order')
      names = ['Scaffold' if s == 'consensus' else ('Variant calling' if s == 'itvariant-calling' else 'Iteration ' + s[2:]) for s in steps['step'].to_list()]
      top = max(d['n_pct'].max() or 5, 5) * 1.6
      fig = px.line(d.to_pandas(), x='step_order', y='n_shown', color='genome_id', markers=True, log_y=True, custom_data=['n_pct', 'step'], color_discrete_map=depictio_category_colors.get('genome_id') or {}, labels={'step_order': 'Refinement step', 'n_shown': 'Ambiguous bases (% N, log)', 'genome_id': 'Genome'})
      fig.update_traces(line=dict(width=2), marker=dict(size=11), hovertemplate='<b>%{fullData.name}</b><br>%{customdata[1]}: %{customdata[0]:.2f} % N<extra></extra>')
      fig.add_shape(type='rect', xref='paper', x0=0, x1=1, yref='y', y0=5, y1=top, fillcolor='rgba(224, 49, 49, 0.08)', line_width=0, layer='below')
      fig.add_shape(type='line', xref='paper', x0=0, x1=1, yref='y', y0=5, y1=5, line=dict(dash='dash', width=1), opacity=0.6)
      fig.add_annotation(xref='paper', x=1, yref='y', y=np.log10(5), text='5 % N', showarrow=False, xanchor='right', yanchor='bottom', font=dict(size=10))
      fig.update_xaxes(tickmode='array', tickvals=steps['step_order'].to_list(), ticktext=names, range=[-0.3, steps['step_order'].max() + 0.5])
      fig.update_yaxes(range=[np.log10(0.07), np.log10(top)], tickmode='array', tickvals=[0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100], ticktext=['0.1 or less', '0.2', '0.5', '1', '2', '5', '10', '20', '50', '100'], automargin=True)
      fig.update_layout(margin=dict(t=10), legend=dict(orientation='h', y=-0.22, title_text=''))
      for row in d.filter(pl.col('step_order') == pl.col('step_order').max().over('genome_id')).iter_rows(named=True):
          if row['step_order'] < d['step_order'].max():
              fig.add_annotation(x=row['step_order'], y=np.log10(row['n_shown']), yref='y', text='no later step recorded', showarrow=False, xanchor='left', xshift=12, font=dict(size=10))
    section: Refinement
    tag: vm-cns-av-refinement
    index: cns-refinement
    title: Ambiguous bases along the refinement
    description: >-
      Does refining a consensus close its gaps? One line per de novo genome, from the scaffold built
      from the contigs through the mapping iterations to the variant-calling round, with a marker on
      every step. The axis is logarithmic, so a nearly gap-free genome and a very gappy one both read.

      How to read: a line that falls from step to step means the mapping iterations filled gaps, and a
      flat line means refinement changed nothing. A rise at the last point is expected, because the
      variant-calling round writes the positions under `--min_consensus_depth` (default 5) as N. A
      genome that stays high at every step needs more reads, so check its depth in
      [Mapping](tab:Mapping).

      Lines and annotations: the dashed line and the red zone above it mark 5 % N, labelled on the
      chart. 5 % N has no published source, as no tool sets a maximum share of ambiguous bases in a
      consensus, so it is a fixed reading aid and not a pass mark. The axis floor is 0.1 %, so a genome
      with no N sits on the tick labelled 0.1 or less.

      Source: nf-core/viralmetagenome parameters, https://nf-co.re/viralmetagenome/parameters

      Note: a line that ends before the others carries the label 'no later step recorded', because the
      pipeline's table holds no mapping iteration or variant-calling round for that genome. Its last
      point is the consensus it kept, with the gaps of that draft.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: viralmetagenome
    data_collection_tag: genomes
    columns: [genome_id, sample, reference, route, step, virus, consensus_length, n_pct, annotation_name, annotation_identity_pct, blast_hit, blast_identity_pct, checkv_quality, checkv_completeness, checkv_contamination]
    row_selection_enabled: true
    row_selection_column: genome_id
    section: Genome tables
    tag: vm-cns-table-genomes
    index: cns-table-genomes
    title: Consensus genomes
    description: Every consensus with its closest reference, ambiguous bases and CheckV call.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: viralmetagenome
    data_collection_tag: checkv_quality
    use: checkv/quality_summary
    columns: [sample, checkv_run, contig_id, contig_length, gene_count, viral_genes, host_genes, checkv_quality, miuvig_quality, completeness, completeness_method, contamination, warnings]
    section: Genome tables
    tag: vm-cns-table-checkv
    index: cns-table-checkv
    title: CheckV calls
    description: CheckV on every consensus sequence, the refinement steps of the de novo ones included.
    layout: {x: 0, y: 6, w: 8, h: 6}
- title: Mapping
  subtitle: How deep and how evenly do the reads cover each genome?
  tab_group: Assembly
  tab_order: 5
  tab_icon: mdi:chart-line
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Mapping scope
    icon: mdi:filter-variant
    color: blue
    description: Keep mappings by genome or route
  grid_sections:
  - name: Mapping at a glance
    icon: mdi:counter
    color: blue
    description: Reads mapped, depth, breadth and duplicates across the genomes
  - name: Depth along the genome
    icon: mdi:chart-line
    color: blue
    description: Mean depth in bins along each genome, from its first base
  - name: Depth and breadth
    icon: mdi:chart-scatter-plot
    color: blue
    description: Depth against breadth per genome, and the cumulative coverage curves
  - name: Mapping tables
    icon: mdi:table
    color: gray
    description: Reads mapped, duplicates, depth and breadth per genome
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      The clean reads of each sample are mapped with bwa-mem2 to each of its consensus genomes and
      constraint references, deduplicated with Picard and measured with
      [mosdepth](https://github.com/brentp/mosdepth). Breadth at 10X is the share of a genome
      deep enough to call; a dip in a depth profile is where the consensus writes N.
    tag: vm-map-intro
    index: map-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: viralmetagenome
    data_collection_tag: genomes
    interactive_component_type: MultiSelect
    column_name: genome_id
    column_type: object
    display:
      icon_name: mdi:virus
      custom_color: cyan
    section: Mapping scope
    group: Mappings
    tag: vm-map-filter-genome
    index: map-genome-filter
    title: Genome
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralmetagenome
    data_collection_tag: genomes
    interactive_component_type: MultiSelect
    column_name: route
    column_type: object
    display:
      icon_name: mdi:source-branch
      custom_color: indigo
    section: Mapping scope
    group: Mappings
    tag: vm-map-filter-route
    index: map-route-filter
    title: Route
    layout: {x: 0, y: 3, w: 1, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: genomes
    aggregation: median
    column_name: mapped_reads
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:relation-many-to-many
      icon_color: teal
      caption: median per genome, with the spread
      format: si
    section: Mapping at a glance
    tag: vm-map-card-mapped
    index: map-card-mapped
    title: Reads mapped
    description: Reads (both mates) mapped to a genome before deduplication.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: genomes
    aggregation: median
    column_name: mean_depth
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:layers-outline
      icon_color: blue
      caption: median per genome, with the spread
      decimals: 1
    section: Mapping at a glance
    tag: vm-map-card-depth
    index: map-card-depth
    title: Mean depth
    description: Mean read depth over a genome, from mosdepth.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: genomes
    aggregation: median
    column_name: cov_10x_pct
    column_type: float64
    secondary_layout: threshold
    threshold_value: 90
    threshold_direction: min
    threshold_warn: 50
    display:
      icon_name: mdi:chart-line
      icon_color: indigo
      caption: genomes at 90% breadth or more, 50% warns
      decimals: 1
    section: Mapping at a glance
    tag: vm-map-card-breadth
    index: map-card-breadth
    title: Breadth at 10X
    description: Share of a genome covered by ten reads or more, in percent.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: genomes
    aggregation: median
    column_name: dup_pct
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:content-copy
      icon_color: orange
      caption: median per genome, with the spread
      decimals: 2
    section: Mapping at a glance
    tag: vm-map-card-dup
    index: map-card-dup
    title: Duplicate pairs
    description: Read pairs Picard marked as duplicates and removed, in percent of the pairs it examined.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: viralmetagenome
    data_collection_tag: coverage_bins
    visu_type: line
    mode: code
    code_content: |-
      # Mean depth of each 50 bp bin along each genome, one line per genome, on a log axis floored at 0.5X so a bin
      # with no reads still draws (it sits on the bottom line). The dashed line is the 10X a position needs to be
      # called; a line under it is a stretch the consensus writes as N.
      d = df.filter(pl.col('mean_depth').is_not_null()).sort(['genome_id', 'chrom', 'position']).with_columns(pl.col('mean_depth').clip(lower_bound=0.5).alias('depth'))
      top = max(d['mean_depth'].max() or 10, 10) * 1.6
      fig = px.line(d.to_pandas(), x='position', y='depth', color='genome_id', line_group='chrom', log_y=True, custom_data=['mean_depth'], color_discrete_map=depictio_category_colors.get('genome_id') or {}, labels={'position': 'Position on the genome (bp)', 'depth': 'Mean depth in the bin (log)', 'genome_id': 'Genome'})
      fig.update_traces(line=dict(width=1.5), opacity=0.85, hovertemplate='<b>%{fullData.name}</b><br>%{x} bp: %{customdata[0]:.1f}X<extra></extra>')
      fig.add_shape(type='rect', xref='paper', x0=0, x1=1, yref='y', y0=0.4, y1=10, fillcolor='rgba(224, 49, 49, 0.08)', line_width=0, layer='below')
      fig.add_shape(type='line', xref='paper', x0=0, x1=1, yref='y', y0=10, y1=10, line=dict(dash='dash', width=1), opacity=0.6)
      fig.add_annotation(xref='paper', x=1, yref='y', y=np.log10(10), text='10X', showarrow=False, xanchor='right', yanchor='bottom', font=dict(size=10))
      fig.update_yaxes(range=[np.log10(0.4), np.log10(top)], tickmode='array', tickvals=[0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500, 1000], ticktext=['0', '1', '2', '5', '10', '20', '50', '100', '200', '500', '1000'], automargin=True)
      fig.update_layout(margin=dict(t=10), legend=dict(orientation='h', y=-0.2, title_text=''))
    section: Depth along the genome
    tag: vm-map-av-depth-profile
    index: map-depth-profile
    title: Depth along each genome
    description: >-
      Where along each genome do the reads run thin? One line per genome, the length-weighted mean depth
      of each bin along it, on a log axis. Bins are 50 bp wide for a genome up to 30 kb and wider, up to
      5 kb, for a longer one, so that no genome draws more than 600.

      How to read: a line that stays above the dashed line is evenly covered. A dip under it, in the
      shaded zone, is a stretch at risk of being written as N in the consensus, and a line on the bottom
      is a genome with almost no reads. Lines suit a position axis, where a dropout reads as a valley;
      open the genome in [Consensus](tab:Consensus) for its share of N.

      Lines and annotations: the dashed line marks 10X, and the zone under it is shaded. 10X is the
      default minimum depth of iVar consensus; this pipeline lowers it to 5 by default
      (`--min_consensus_depth`), so a stretch between 5X and 10X is thin but still called. A bin with no
      reads sits on the bottom line, labelled 0 on the axis.

      Sources: iVar manual, https://andersen-lab.github.io/ivar/html/manualpage.html;
      nf-core/viralmetagenome parameters, https://nf-co.re/viralmetagenome/parameters

      Note: the genomes sit on different references and overlay from their first base, so a position
      means the same place only within one genome.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: viralmetagenome
    data_collection_tag: genomes
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: mean_depth
      y_col: cov_10x_pct
      label_col: genome_id
      label_order_col: cov_10x_pct
      top_n_labels: 3
      color_col: route
      marker_size: 14
      opacity: 0.85
      marker_outline: true
      log_x: true
      quadrants:
        x: 10
        y: 90
        labels: ['Broad but shallow', '', 'Shallow and narrow', 'Deep but narrow']
      x_title: Mean depth (log)
      y_title: Breadth at 10X (%)
      legend_pos: bottom
      selection_enabled: true
      selection_column: genome_id
    section: Depth and breadth
    tag: vm-map-av-depth-breadth
    index: map-depth-breadth
    title: Depth against breadth per genome
    description: >-
      Which genomes are covered deeply and completely enough to call? One point per genome, coloured by
      route, with its mean depth on a log axis against the share of its bases covered at 10X or deeper.
      Two measures describe the coverage, which is why they are plotted against each other.

      How to read: a genome in the unlabelled top right corner is both deep and broad. Broad but shallow
      is covered everywhere but thinly, deep but narrow is a partial genome whose reads pile on part of
      it, and shallow and narrow has too few reads. Click a point to narrow the tab to a genome; the
      line chart above shows where its reads run thin.

      Lines and annotations: the dashed lines sit at 10X mean depth and at 90 % breadth, and the three
      genomes with the lowest breadth are named. 10X is the default minimum depth of iVar consensus,
      which this pipeline lowers to 5 by default (`--min_consensus_depth`). 90 % has no published
      source, as no tool or guideline sets a minimum breadth for a viral consensus, so it is a fixed
      reading aid and not a pass mark.

      Sources: iVar manual, https://andersen-lab.github.io/ivar/html/manualpage.html;
      nf-core/viralmetagenome parameters, https://nf-co.re/viralmetagenome/parameters
    layout: {x: 0, y: 0, w: 4, h: 7}
  - component_type: advanced_viz
    workflow_tag: viralmetagenome
    data_collection_tag: coverage_cumulative
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: genome_id
      x_col: depth
      y_col: bases_pct
      log_x: true
      reference_x: 10
      reference_label: 10X
      x_title: Depth (log)
      y_title: Bases covered at least this deep (%)
      legend_pos: bottom
    section: Depth and breadth
    tag: vm-map-av-cumulative
    index: map-cumulative
    title: Cumulative coverage per genome
    description: >-
      How much of each genome is deep enough to call? One curve per genome, the share of its bases
      covered at least at each depth, on a log depth axis. A curve is the right form because it shows
      every depth threshold at once, not only the one a card reports.

      How to read: where a curve crosses the vertical marker is the breadth of that genome at 10X. A
      curve that stays high past the marker is well covered, and one that falls before it is shallow or
      patchy. A curve that stays flat and then drops sharply is evenly covered around one depth, while a
      slow slope means uneven coverage.

      Lines and annotations: the vertical marker is at 10X, the default minimum depth of iVar consensus.
      This pipeline lowers it to 5 by default (`--min_consensus_depth`), so 10X is the stricter reading
      and a fixed reference, not read from the run.

      Sources: iVar manual, https://andersen-lab.github.io/ivar/html/manualpage.html;
      nf-core/viralmetagenome parameters, https://nf-co.re/viralmetagenome/parameters
    layout: {x: 4, y: 0, w: 4, h: 7}
  - component_type: table
    workflow_tag: viralmetagenome
    data_collection_tag: genomes
    columns: [genome_id, sample, reference, route, mapped_reads, mapped_pct, properly_paired_pct, dup_pct, dedup_mapped_reads, mean_depth, median_depth, cov_1x_pct, cov_10x_pct, cov_50x_pct, cov_100x_pct, mash_reference, mash_identity]
    row_selection_enabled: true
    row_selection_column: genome_id
    section: Mapping tables
    tag: vm-map-table
    index: map-table
    title: Mapping per genome
    description: Reads mapped, duplicates, depth and breadth per genome, with the reference Mash picked from a pool.
    layout: {x: 0, y: 0, w: 8, h: 6}
