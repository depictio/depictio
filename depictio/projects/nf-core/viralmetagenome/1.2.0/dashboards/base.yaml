  tab_icon_color: red
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Call scope
    icon: mdi:filter-variant
    color: red
    description: Keep calls by variant type, by the route of their genome or by segment
  grid_sections:
  - name: Calls at a glance
    icon: mdi:counter
    color: red
    description: Passing calls, minor calls, call depth and the genomes that carry calls
  - name: Along the genome
    icon: mdi:dna
    color: red
