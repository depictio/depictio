      Each consensus is compared with the annotation database and the reference pool by BLAST and
      scored by [CheckV](https://bitbucket.org/berkeleylab/checkv); QUAST counts its ambiguous
      bases, the positions too shallow to call. A genome at 95 % identity or more and 5 % N or less
      is ready to use; click a point to open its record, and read the de novo ones down their refinement.
    tag: vm-cns-intro
