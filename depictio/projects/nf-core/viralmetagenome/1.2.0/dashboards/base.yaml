    description: One line per de novo genome; the variant-calling round masks the positions too shallow to call.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: viralmetagenome
    data_collection_tag: genomes
    columns: [genome_id, sample, reference, route, step, virus, consensus_length, n_pct, annotation_name, annotation_identity_pct, blast_hit, blast_identity_pct, checkv_quality, checkv_completeness, checkv_contamination]
    row_selection_enabled: true
    row_selection_column: genome_id
    section: Genome tables
    tag: vm-cns-table-genomes
    index: cns-table-genomes
    title: Consensus genomes
    description: Every consensus with its closest reference, ambiguous bases and CheckV call.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: viralmetagenome
    data_collection_tag: checkv_quality
    use: checkv/quality_summary
    columns: [sample, checkv_run, contig_id, contig_length, gene_count, viral_genes, host_genes, checkv_quality, miuvig_quality, completeness, completeness_method, contamination, warnings]
    section: Genome tables
    tag: vm-cns-table-checkv
    index: cns-table-checkv
    title: CheckV calls
    description: CheckV on every consensus sequence, the refinement steps of the de novo ones included.
    layout: {x: 0, y: 6, w: 8, h: 6}
- title: Mapping
  subtitle: How deep and how evenly do the reads cover each genome?
  tab_group: Assembly
  tab_order: 5
  tab_icon: mdi:chart-line
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Mapping scope
    icon: mdi:filter-variant
    color: blue
    description: Keep mappings by genome or route
  grid_sections:
  - name: Mapping at a glance
    icon: mdi:counter
    color: blue
    description: Reads mapped, depth, breadth and duplicates across the genomes
  - name: Depth along the genome
    icon: mdi:chart-line
    color: blue
    description: Mean depth in bins along each genome, from its first base
  - name: Depth and breadth
    icon: mdi:chart-scatter-plot
    color: blue
    description: Depth against breadth per genome, and the cumulative coverage curves
  - name: Mapping tables
    icon: mdi:table
    color: gray
    description: Reads mapped, duplicates, depth and breadth per genome
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      The clean reads of each sample are mapped with bwa-mem2 to each of its consensus genomes and
      constraint references, deduplicated with Picard and measured with
      [mosdepth](https://github.com/brentp/mosdepth). Breadth at 10X is the share of a genome
      deep enough to call; a dip in a depth profile is where the consensus writes N.
    tag: vm-map-intro
    index: map-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: viralmetagenome
    data_collection_tag: genomes
    interactive_component_type: MultiSelect
    column_name: genome_id
    column_type: object
    display:
      icon_name: mdi:virus
      custom_color: cyan
    section: Mapping scope
    group: Mappings
    tag: vm-map-filter-genome
    index: map-genome-filter
    title: Genome
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralmetagenome
    data_collection_tag: genomes
    interactive_component_type: MultiSelect
    column_name: route
    column_type: object
    display:
      icon_name: mdi:source-branch
      custom_color: indigo
    section: Mapping scope
    group: Mappings
    tag: vm-map-filter-route
    index: map-route-filter
    title: Route
    layout: {x: 0, y: 3, w: 1, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: genomes
    aggregation: median
    column_name: mapped_reads
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:relation-many-to-many
      icon_color: teal
      caption: median per genome, with the spread
      format: si
    section: Mapping at a glance
    tag: vm-map-card-mapped
    index: map-card-mapped
    title: Reads mapped
    description: Reads (both mates) mapped to a genome before deduplication.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: genomes
    aggregation: median
    column_name: mean_depth
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:layers-outline
      icon_color: blue
      caption: median per genome, with the spread
      decimals: 1
    section: Mapping at a glance
    tag: vm-map-card-depth
    index: map-card-depth
    title: Mean depth
    description: Mean read depth over a genome, from mosdepth.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: genomes
    aggregation: median
    column_name: cov_10x_pct
    column_type: float64
    secondary_layout: threshold
    threshold_value: 90
    threshold_direction: min
    threshold_warn: 50
    display:
      icon_name: mdi:chart-line
      icon_color: indigo
      caption: genomes at 90% breadth or more, 50% warns
      decimals: 1
    section: Mapping at a glance
    tag: vm-map-card-breadth
    index: map-card-breadth
    title: Breadth at 10X
    description: Share of a genome covered by ten reads or more, in percent.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: genomes
    aggregation: median
    column_name: dup_pct
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:content-copy
      icon_color: orange
      caption: median per genome, with the spread
      decimals: 2
    section: Mapping at a glance
    tag: vm-map-card-dup
    index: map-card-dup
    title: Duplicate pairs
    description: Read pairs Picard marked as duplicates and removed, in percent of the pairs it examined.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: viralmetagenome
    data_collection_tag: coverage_bins
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: genome_id
      x_col: position
      y_col: mean_depth
      log_y: true
      line_width: 1.5
      x_title: Position on the genome (bp)
      y_title: Mean depth in the bin (log)
      legend_pos: bottom
    section: Depth along the genome
    tag: vm-map-av-depth-profile
    index: map-depth-profile
    title: Depth along each genome
    description: One line per genome, the mean depth of each bin; a line that drops to the floor is a stretch written as N.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: viralmetagenome
    data_collection_tag: genomes
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: mean_depth
      y_col: cov_10x_pct
      label_col: genome_id
      color_col: route
      size_col: mapped_reads
      log_x: true
      x_title: Mean depth (log)
      y_title: Breadth at 10X (%)
      legend_pos: bottom
      top_n_labels: 0
      selection_enabled: true
      selection_column: genome_id
    section: Depth and breadth
    tag: vm-map-av-depth-breadth
    index: map-depth-breadth
    title: Depth against breadth per genome
    description: One point per genome, sized by its reads mapped. Deep but narrow is a partial genome.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: viralmetagenome
    data_collection_tag: coverage_cumulative
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: genome_id
      x_col: depth
      y_col: bases_pct
      log_x: true
      reference_x: 10
      reference_label: 10X
      x_title: Depth (log)
      y_title: Bases covered at least this deep (%)
      legend_pos: bottom
    section: Depth and breadth
    tag: vm-map-av-cumulative
    index: map-cumulative
    title: Cumulative coverage per genome
    description: One curve per genome; where it crosses the 10X line is its breadth at 10X.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: table
    workflow_tag: viralmetagenome
    data_collection_tag: genomes
    columns: [genome_id, sample, reference, route, mapped_reads, mapped_pct, properly_paired_pct, dup_pct, dedup_mapped_reads, mean_depth, median_depth, cov_1x_pct, cov_10x_pct, cov_50x_pct, cov_100x_pct, mash_reference, mash_identity]
    row_selection_enabled: true
    row_selection_column: genome_id
    section: Mapping tables
    tag: vm-map-table
    index: map-table
    title: Mapping per genome
    description: Reads mapped, duplicates, depth and breadth per genome, with the reference Mash picked from a pool.
    layout: {x: 0, y: 0, w: 8, h: 6}
# ============================================================================
# Variants
# ============================================================================
- title: Variants
  subtitle: Which variants does each genome carry, and how fixed are they?
  tab_group: Variants
  tab_order: 6
  tab_icon: mdi:dna
  tab_icon_color: red
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Call scope
    icon: mdi:filter-variant
    color: red
    description: Keep calls by variant type or by the route of their genome
  grid_sections:
  - name: Calls at a glance
    icon: mdi:counter
    color: red
    description: Passing calls, minor calls, call depth and the genomes that carry calls
  - name: Along the genome
    icon: mdi:dna
    color: red
    description: Every call at its position and allele frequency, one lane per genome
  - name: Frequency and depth
    icon: mdi:chart-scatter-plot
    color: red
    description: Allele frequency against read depth, one point per call
  - name: Variant table
    icon: mdi:table
    color: gray
    description: Every iVar call with its depths, frequency, p-value and verdict
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [iVar](https://andersen-lab.github.io/ivar/html/) calls variants on the reads of each sample
      against each of its references, and keeps the calls under the consensus threshold too:
      fixed calls make the consensus, minor ones are intra-host diversity or noise. The lanes open
      on the first reference; filter the call type in the left panel.
    tag: vm-var-intro
    index: var-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: viralmetagenome
    data_collection_tag: ivar_variants
    interactive_component_type: MultiSelect
    column_name: variant_type
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: red
    section: Call scope
    group: Calls
    tag: vm-var-filter-type
    index: var-type-filter
    title: Variant type
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: viralmetagenome
    data_collection_tag: ivar_variants
    interactive_component_type: MultiSelect
    column_name: route
    column_type: object
    display:
      icon_name: mdi:source-branch
      custom_color: indigo
    section: Call scope
    group: Calls
    tag: vm-var-filter-route
    index: var-route-filter
    title: Route
    layout: {x: 0, y: 2, w: 1, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: ivar_variants
    aggregation: count
    column_name: variant_key
    column_type: object
    filter_expr: "col('filter') == 'PASS'"
    secondary_layout: composition
    breakdown_col: frequency_class
    display:
      icon_name: mdi:check-decagram
      icon_color: green
      caption: passing calls, by allele frequency band
    section: Calls at a glance
    tag: vm-var-card-pass
    index: var-card-pass
    title: Passing calls
    description: Calls iVar kept (PASS) across the genomes, split into fixed, major and minor frequency bands.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: ivar_variants
    aggregation: count
    column_name: variant_key
    column_type: object
    filter_expr: "col('frequency_class') == 'Minor'"
    secondary_layout: donut
    breakdown_col: filter
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: cyan
      caption: minor calls, kept or filtered by iVar
    section: Calls at a glance
    tag: vm-var-card-minor
    index: var-card-minor
    title: Minor calls
    description: Calls under half frequency; the few iVar keeps are intra-host variants, the rest noise.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: ivar_variants
    aggregation: median
    column_name: total_dp
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:layers-outline
      icon_color: blue
      caption: reads at the call, with the spread
    section: Calls at a glance
    tag: vm-var-card-depth
    index: var-card-depth
    title: Call depth
    description: Reads covering the position of a call; a frequency read off few reads means little.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: ivar_variants
    aggregation: nunique
    column_name: genome_id
    column_type: object
    filter_expr: "col('filter') == 'PASS'"
    secondary_layout: top_n
    breakdown_col: route
    top_n_count: 2
    display:
      icon_name: mdi:virus
      icon_color: grape
      caption: genomes with a passing call, ranked by route
    section: Calls at a glance
    tag: vm-var-card-genomes
    index: var-card-genomes
    title: Genomes with calls
    description: Consensus genomes carrying at least one call iVar kept, split by the route that built them.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: viralmetagenome
    data_collection_tag: ivar_variants
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      chr_col: chrom
      pos_col: pos
      score_col: af
      feature_col: variant_key
      sample_col: genome_id
      category_col: frequency_class
      mark: point
      facet_by_sample: true
      max_facets: 6
      score_title: Allele frequency
      point_size: 5
      default_region: first
    section: Along the genome
    tag: vm-var-av-genome
    index: var-genome-view
    title: Calls along the reference, one lane per genome
    description: Every call at its allele frequency, coloured by frequency band; the axis lists the references the calls are on.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: viralmetagenome
    data_collection_tag: ivar_variants
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: total_dp
      y_col: af
      label_col: variant_key
      color_col: frequency_class
      log_x: true
      x_title: Reads at the position (log)
      y_title: Allele frequency
      legend_pos: bottom
      top_n_labels: 0
      selection_enabled: true
      selection_column: genome_id
    section: Frequency and depth
    tag: vm-var-av-af-depth
    index: var-af-depth
    title: Allele frequency against depth per call
    description: One point per call. Lasso calls to narrow every tab to their genomes.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: viralmetagenome
    data_collection_tag: ivar_variants
    use: ivar/variants_tsv
    columns: [genome_id, sample, reference, chrom, pos, ref, alt, variant_type, af, frequency_class, total_dp, alt_dp, pval, filter, gff_feature, aa_change]
    row_selection_enabled: true
    row_selection_column: genome_id
    section: Variant table
    tag: vm-var-table
    index: var-table
    title: iVar calls
    description: Every call with its depths, allele frequency, p-value and iVar's verdict.
    layout: {x: 0, y: 0, w: 8, h: 6}
