  - component_type: advanced_viz
    workflow_tag: viralmetagenome
    data_collection_tag: variants
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      chr_col: chrom
      pos_col: pos
      score_col: af
      feature_col: variant_key
      sample_col: genome_id
      category_col: frequency_class
      mark: point
      facet_by_sample: true
      max_facets: 12
      auto_height: true
      score_title: Allele frequency
      point_size: 8
    section: Along the genome
    tag: vm-var-av-genome
    index: var-genome-view
    title: Calls along the reference, one lane per genome
    description: >-
      Where along each genome do the variants sit, and how fixed are they? Every call is a point at
      its position and allele frequency, coloured by frequency band, one lane per genome (up to 12, more
      in the tile's controls).

      How to read: calls near the top are carried by most of the reads, and those above the run's
      consensus frequency set the base in the consensus. A row of low calls is minor variation or noise,
      and calls that pile up at one position in several lanes are shared by those genomes. Brush a
      reference to zoom on it, and filter the call type or the route in the left panel.

      Annotations: no reference line is drawn, and the colour is the frequency band, Fixed at 0.9 or
      more, Major from 0.5 to 0.9 and Minor under 0.5. These bands are this template's own grouping, not
      a published standard. The consensus takes a base at the run's `--allele_frequency`, default 0.75
      in nf-core/viralmetagenome.

      Source: nf-core/viralmetagenome parameters, https://nf-co.re/viralmetagenome/parameters

      Note: the axis lays the references the calls sit on end to end, so a lane shows its calls on the
      reference it was mapped to. It is drawn from the table, so it works on every run; the Genome
      browser tab, when the run gives it its references, shows the reads under each call.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: viralmetagenome
    data_collection_tag: variants
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: total_dp
      y_col: af
      label_col: variant_key
      color_col: frequency_class
      marker_size: 10
      opacity: 0.6
      marker_outline: true
      density_threshold: 5000
      log_x: true
      quadrants:
        x: 10
        y: 0.5
        labels: ['Major, thin reads', '', 'Noise, thin reads', 'Minor, well supported']
      x_title: Reads at the position (log)
      y_title: Allele frequency
      legend_pos: bottom
      selection_enabled: true
      selection_column: genome_id
    section: Frequency and depth
    tag: vm-var-av-af-depth
    index: var-af-depth
    title: Allele frequency against depth per call
    description: >-
      Which calls can be believed? One point per call, coloured by frequency band, with the reads at its
      position on a log axis against its allele frequency. Lasso calls to narrow every tab to their
      genomes.

      How to read: the unlabelled top right corner holds the calls that are both frequent and well
      supported. Calls in the bottom left are low frequency read off few reads, which is mostly noise.
      The minor calls with many reads behind them, bottom right, are the intra-host variants worth a
      look, and the caller's own verdict is in the variant tables.

      Lines and annotations: the dashed lines sit at 10 reads and at half frequency, and every corner is
      labelled except the top right one. Half frequency is where the Major band starts, the point where
      the alternative allele has as many reads as the reference. 10 reads is the default minimum depth
      of iVar consensus, applied here to variant calls as a fixed reading aid, since neither caller sets
      a minimum depth for a call by default (bcftools here takes calls at 5 reads or more,
      `--min_consensus_depth`).

      Source: iVar manual, https://andersen-lab.github.io/ivar/html/manualpage.html

      Note: points are smaller and fainter than elsewhere because thousands of calls overlap, and past
      5000 calls the tile draws a density map. The call names show on hover.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: intrahost_diversity
    aggregation: count
    column_name: pos
    column_type: int64
    filter_expr: "col('minor_af') >= 0.05"
    secondary_layout: top_n
    breakdown_col: genome_id
    top_n_count: 3
    display:
      icon_name: mdi:chart-bell-curve-cumulative
      icon_color: red
      caption: positions with a second allele at 5% or more, by genome
    section: Intra-host diversity
    tag: vm-var-card-diverse
    index: var-card-diverse
    title: Mixed positions
    description: Positions where a second allele holds 5% of the reads or more, the genomes with the most first.
    layout: {x: 0, y: 0, w: 2, h: 6}
  - component_type: advanced_viz
    workflow_tag: viralmetagenome
    data_collection_tag: intrahost_diversity
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      chr_col: chrom
      pos_col: pos
      score_col: entropy
      sample_col: genome_id
      mark: bar
      facet_by_sample: true
      max_facets: 12
      auto_height: true
      score_title: Shannon entropy
    section: Intra-host diversity
    tag: vm-var-av-entropy
    index: var-entropy-lane
    title: Entropy along the reference, one lane per genome
    description: >-
      Where does a sample carry more than one virus population? One lane per genome, a bar at every
      position where the reads carry an alternative allele, its height the Shannon entropy of the allele
      frequencies there.

      How to read: entropy is 0 where every read agrees and about 0.69 (ln 2) where two alleles hold half
      the reads each. A lane of low bars all along is sequencing noise. A stretch of tall bars is real
      intra-host variation or a mixed infection; shared across lanes at one position, it is a site under
      pressure in several samples. Positions with no bar carry no alternative allele, entropy 0.

      Annotations: no reference line is drawn. The entropy is computed from every call the caller
      reported, minor ones included: iVar's raw table, or bcftools' calls before the
      `--allele_frequency` filter. A call on fewer than 10 reads is left out.

      Source: Shannon 1948, https://doi.org/10.1002/j.1538-7305.1948.tb01338.x
    layout: {x: 2, y: 0, w: 6, h: 6}
  - component_type: table
    workflow_tag: viralmetagenome
    data_collection_tag: variants
    columns: [genome_id, sample, reference, caller, virus_segment, chrom, pos, ref, alt, variant_type, af, frequency_class, total_dp, alt_dp, filter]
    row_selection_enabled: true
    row_selection_column: genome_id
    section: Variant table
    tag: vm-var-table-calls
    index: var-table-calls
