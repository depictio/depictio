  - component_type: figure
    workflow_tag: viralmetagenome
    data_collection_tag: coverage_profile
    visu_type: line
    mode: code
    code_content: |-
      # Mean depth of each bin along each genome, one panel per virus segment and one line per genome, on a log axis
      # floored at 0.5X so a bin with no reads still draws (it sits on the bottom line). The dashed line is the 10X a
      # position needs to be called; a line under it is a stretch the consensus writes as N.
      d = df.filter(pl.col('mean_depth').is_not_null()).sort(['virus_segment', 'genome_id', 'chrom', 'position']).with_columns(pl.col('mean_depth').clip(lower_bound=0.5).alias('depth'))
      panels = d['virus_segment'].unique().sort().to_list()
      wrap = 1 if len(panels) <= 2 else 2
      top = max(d['mean_depth'].max() or 10, 10) * 1.6
      fig = px.line(d.to_pandas(), x='position', y='depth', color='genome_id', line_group='chrom', facet_col='virus_segment', facet_col_wrap=wrap, facet_row_spacing=0.06, category_orders={'virus_segment': panels}, log_y=True, custom_data=['mean_depth'], color_discrete_map=depictio_category_colors.get('genome_id') or {}, labels={'position': 'Position on the genome (bp)', 'depth': 'Mean depth (log)', 'genome_id': 'Genome', 'virus_segment': ''})
      fig.update_traces(line=dict(width=1.5), opacity=0.85, hovertemplate='<b>%{fullData.name}</b><br>%{x} bp: %{customdata[0]:.1f}X<extra></extra>')
      fig.for_each_annotation(lambda a: a.update(text=a.text.split('=')[-1]))
      fig.add_hrect(y0=0.4, y1=10, fillcolor='rgba(224, 49, 49, 0.08)', line_width=0, layer='below', row='all', col='all')
      fig.add_hline(y=10, line=dict(dash='dash', width=1), opacity=0.6, row='all', col='all')
      fig.update_yaxes(range=[np.log10(0.4), np.log10(top)], tickmode='array', tickvals=[0.5, 1, 10, 100, 1000, 10000], ticktext=['0', '1', '10', '100', '1000', '10000'], automargin=True)
      fig.update_xaxes(matches=None, showticklabels=True)
      fig.update_layout(margin=dict(t=30), legend=dict(orientation='h', y=-0.12, title_text=''))
    section: Depth along the genome
    tag: vm-map-av-depth-profile
    index: map-depth-profile
    title: Depth along each genome, by segment
    description: >-
      Where along each genome do the reads run thin? One panel per virus segment, one line per genome
      in it, the length-weighted mean depth of each bin along the genome, on a log axis. Bins are 50 bp
      wide for a genome up to 30 kb and wider, up to 5 kb, for a longer one, so that no genome draws
      more than 600; Genome ends below reads the first and last 200 bp 10 bp wide.

      How to read: a line that stays above the dashed line is evenly covered. A dip under it, in the
      shaded zone, is a stretch at risk of being written as N in the consensus, and a line on the bottom
      is a genome with almost no reads. A segmented virus gets one panel per segment, so a segment
      that failed in one sample stands out against the same segment in the others; each panel keeps
      its own position axis, as the segments differ in length.

      Lines and annotations: the dashed line marks 10X, and the zone under it is shaded. 10X is the
      default minimum depth of iVar consensus; this pipeline lowers it to 5 by default
      (`--min_consensus_depth`), so a stretch between 5X and 10X is thin but still called. A bin with no
      reads sits on the bottom line, labelled 0 on the axis.

      Sources: iVar manual, https://andersen-lab.github.io/ivar/html/manualpage.html;
      nf-core/viralmetagenome parameters, https://nf-co.re/viralmetagenome/parameters

      Note: the genomes of one panel sit on different references and overlay from their first base, so
      a position means the same place only within one genome.
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: figure
    workflow_tag: viralmetagenome
    data_collection_tag: genome_ends
    visu_type: line
    mode: code
    code_content: |-
      # Depth over the first and last 200 bp of each genome, 10 bp bins, side by side: the 5' end read from its first
      # base inwards, the 3' end from its last base inwards, so both panels put the genome's tip on the left.
      d = df.filter(pl.col('mean_depth').is_not_null()).sort(['genome_id', 'end_region', 'end_offset']).with_columns(pl.col('mean_depth').clip(lower_bound=0.5).alias('depth'))
      top = max(d['mean_depth'].max() or 10, 10) * 1.6
      fig = px.line(d.to_pandas(), x='end_offset', y='depth', color='genome_id', facet_col='end_region', category_orders={'end_region': ["5' end", "3' end"]}, log_y=True, markers=True, custom_data=['mean_depth', 'virus_segment'], color_discrete_map=depictio_category_colors.get('genome_id') or {}, labels={'end_offset': 'Distance from the genome end (bp)', 'depth': 'Mean depth (log)', 'genome_id': 'Genome', 'end_region': ''})
      fig.update_traces(line=dict(width=1.5), marker=dict(size=5), hovertemplate='<b>%{fullData.name}</b> (%{customdata[1]})<br>%{x} bp from the end: %{customdata[0]:.1f}X<extra></extra>')
      fig.for_each_annotation(lambda a: a.update(text=a.text.split('=')[-1]))
      fig.add_hrect(y0=0.4, y1=10, fillcolor='rgba(224, 49, 49, 0.08)', line_width=0, layer='below', row='all', col='all')
      fig.add_hline(y=10, line=dict(dash='dash', width=1), opacity=0.6, row='all', col='all')
      fig.update_yaxes(range=[np.log10(0.4), np.log10(top)], tickmode='array', tickvals=[0.5, 1, 10, 100, 1000, 10000], ticktext=['0', '1', '10', '100', '1000', '10000'], automargin=True)
      fig.update_xaxes(range=[0, 205])
      fig.update_layout(margin=dict(t=30), legend=dict(orientation='h', y=-0.22, title_text=''))
    section: Genome ends
    tag: vm-map-av-genome-ends
    index: map-genome-ends
    title: Depth at the two ends of each genome
    description: >-
      Do the reads reach the ends of each genome? One line per genome over its first 200 bp (5' end) and
      its last 200 bp (3' end), in 10 bp bins, both read from the tip of the genome inwards, on a log
      depth axis.

      How to read: a line that climbs from the tip is a genome whose end the reads thin out towards,
      and the first bases under the dashed line are written as N or trimmed off the consensus. A line on
      the bottom at the tip is an end the reads never reached: the consensus there comes from the
      reference, or is missing. The ends of a segmented virus carry conserved termini, which is where a
      de novo genome is often short; compare the route in the record of [Consensus](tab:Consensus).

      Lines and annotations: the dashed line and the shaded zone under it mark 10X, as on the profile
      above.

      Note: the ends are those of the reference the reads were mapped to, so a de novo genome's ends are
      those of its own consensus.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: viralmetagenome
    data_collection_tag: genomes
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: mean_depth
      y_col: cov_10x_pct
      label_col: genome_id
      label_order_col: cov_10x_pct
      top_n_labels: 3
      color_col: route
      marker_size: 14
      opacity: 0.85
      marker_outline: true
      log_x: true
      quadrants:
        x: 10
        y: 90
        labels: ['Broad but shallow', '', 'Shallow and narrow', 'Deep but narrow']
      x_title: Mean depth (log)
      y_title: Breadth at 10X (%)
      legend_pos: bottom
      selection_enabled: true
      selection_column: genome_id
    section: Depth and breadth
    tag: vm-map-av-depth-breadth
    index: map-depth-breadth
    title: Depth against breadth per genome
    description: >-
      Which genomes are covered deeply and completely enough to call? One point per genome, coloured by
      route, with its mean depth on a log axis against the share of its bases covered at 10X or deeper.
      Two measures describe the coverage, which is why they are plotted against each other.

      How to read: a genome in the unlabelled top right corner is both deep and broad. Broad but shallow
      is covered everywhere but thinly, deep but narrow is a partial genome whose reads pile on part of
      it, and shallow and narrow has too few reads. Click a point to narrow the tab to a genome; the
      line chart above shows where its reads run thin.

      Lines and annotations: the dashed lines sit at 10X mean depth and at 90 % breadth, and the three
      genomes with the lowest breadth are named. 10X is the default minimum depth of iVar consensus,
      which this pipeline lowers to 5 by default (`--min_consensus_depth`). 90 % has no published
      source, as no tool or guideline sets a minimum breadth for a viral consensus, so it is a fixed
      reading aid and not a pass mark.

      Sources: iVar manual, https://andersen-lab.github.io/ivar/html/manualpage.html;
      nf-core/viralmetagenome parameters, https://nf-co.re/viralmetagenome/parameters
    layout: {x: 0, y: 0, w: 4, h: 7}
  - component_type: advanced_viz
    workflow_tag: viralmetagenome
    data_collection_tag: coverage_cumulative
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: genome_id
      x_col: depth
      y_col: bases_pct
      log_x: true
      reference_x: 10
      reference_label: 10X
      x_title: Depth (log)
      y_title: Bases covered at least this deep (%)
      legend_pos: bottom
    section: Depth and breadth
    tag: vm-map-av-cumulative
    index: map-cumulative
    title: Cumulative coverage per genome
    description: >-
      How much of each genome is deep enough to call? One curve per genome, the share of its bases
      covered at least at each depth, on a log depth axis. A curve is the right form because it shows
      every depth threshold at once, not only the one a card reports.

      How to read: where a curve crosses the vertical marker is the breadth of that genome at 10X. A
      curve that stays high past the marker is well covered, and one that falls before it is shallow or
      patchy. A curve that stays flat and then drops sharply is evenly covered around one depth, while a
      slow slope means uneven coverage.

      Lines and annotations: the vertical marker is at 10X, the default minimum depth of iVar consensus.
      This pipeline lowers it to 5 by default (`--min_consensus_depth`), so 10X is the stricter reading
      and a fixed reference, not read from the run.

      Sources: iVar manual, https://andersen-lab.github.io/ivar/html/manualpage.html;
      nf-core/viralmetagenome parameters, https://nf-co.re/viralmetagenome/parameters
    layout: {x: 4, y: 0, w: 4, h: 7}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: umi_stats
