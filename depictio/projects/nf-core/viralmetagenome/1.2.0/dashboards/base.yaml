- title: Mapping
  subtitle: How deep and how evenly do the reads cover each genome?
  tab_group: Assembly
  tab_order: 5
  tab_icon: mdi:chart-line
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Mapping scope
    icon: mdi:filter-variant
    color: blue
    description: Keep mappings by genome or route
  grid_sections:
  - name: Mapping at a glance
