    columns: [sample, virus_segment, better_route, constraint_reference, denovo_ref_cover_pct, constraint_ref_cover_pct, cover_gain, denovo_n_pct, constraint_n_pct, n_gain, denovo_consensus_length, constraint_consensus_length, denovo_blast_identity_pct, constraint_blast_identity_pct, denovo_cov_10x_pct, constraint_cov_10x_pct, denovo_genome_id, constraint_genome_id]
