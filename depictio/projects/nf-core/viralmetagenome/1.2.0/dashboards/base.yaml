      genomes: [iVar](https://andersen-lab.github.io/ivar/html/), the default, keeps the calls under
      the consensus threshold too, and [bcftools](https://samtools.github.io/bcftools/) keeps those at
      `--allele_frequency` or above. Fixed calls make the consensus, minor ones are intra-host diversity
      or noise. The lanes open on every reference at once; brush one to zoom, and filter the call type
      or the segment in the left panel.
