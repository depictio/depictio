      opacity: 0.85
      marker_outline: true
      quadrants:
        x: 5
        y: 95
        labels: ['', 'Whole, but gappy', 'Partial, few gaps', 'Partial and gappy']
      x_title: Ambiguous bases (% N)
      y_title: BLAST reference cover (%)
      legend_pos: bottom
      selection_enabled: true
      selection_column: genome_id
    section: Completeness and ambiguity
    tag: vm-cns-av-cover-ambiguity
    index: cns-cover-ambiguity
    title: Ambiguous bases against reference cover per genome
    description: >-
      Which consensus genomes are whole and have few gaps? One point per genome, one segment of a
      segmented virus each, plotted by its share of ambiguous bases (N) and by how much of its best
      BLAST hit's reference it spans. Colour is the completeness the cover reads to.

      How to read: the top left corner, few ambiguous bases and the whole reference covered, holds a
      genome ready to use. A point far to the right has gaps where the reads were too shallow
      ([Mapping](tab:Mapping) shows its depth), and a point low on the plot covers part of its
      reference only. A purple point low on the plot (Shorter than reference) aligns along its whole
      length to a reference much longer than itself. BLAST cannot tell why: the hit may be longer than
      the segment, as an influenza segment 8 against a 2349 nt reference is, or the genome may stop
      short of both ends. Compare its length (record, Completeness) with the segment's before calling
      it truncated. Click a point to open its record beside the plot.

      Lines and annotations: the dashed lines sit at 5 % N and 95 % reference cover, the three genomes
      with the lowest cover are named, and every corner carries a label except the top left one. Neither
      line has a published source, as no tool or guideline sets a maximum share of ambiguous bases or a
      minimum reference cover for a viral consensus, so both are fixed reading aids and not pass marks.
      Identity to the reference is left off the plot: a low identity says the virus is new, not that the
      genome is poor, and it sits in the record instead.

      Note: the cover is read off the best HSP only, so a genome whose alignment BLAST splits in two (a
      large deletion, a run of N) reads lower than it is; its N share and its depth profile tell which.
    layout: {x: 0, y: 0, w: 5, h: 8}
  - component_type: advanced_viz
    workflow_tag: viralmetagenome
    data_collection_tag: genomes
