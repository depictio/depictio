- title: Samples
  subtitle: How many reads of each sample reach assembly?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:test-tube
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Read scope
    icon: mdi:filter-variant
    color: teal
    description: Keep samples inside a host share or retained read band
  grid_sections:
  - name: Reads at a glance
    icon: mdi:counter
    color: teal
    description: Read pairs kept, host share, base quality and duplication across the samples
  - name: Read funnel
    icon: mdi:chart-bar
    color: teal
    description: Read pairs of each sample before trimming, after trimming and after host removal
  - name: Depth and loss
    icon: mdi:chart-scatter-plot
    color: teal
    description: Raw read pairs against the share left after preprocessing, one point per sample
  - name: Read tables
    icon: mdi:table
    color: gray
    description: Read pairs per sample and preprocessing stage
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [fastp](https://github.com/OpenGene/fastp) trims the reads, prinseq removes low-complexity
      ones and [Kraken2](https://ccb.jhu.edu/software/kraken2/) against a host database removes the
      host, and what is left goes on to assembly and mapping. A sample that loses most of its reads
      here has little left to rebuild a genome from, whatever the later tabs show.
    tag: vm-smp-intro
    index: smp-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: viralmetagenome
    data_collection_tag: samples
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: host_pct
    column_type: float64
    display:
      icon_name: mdi:account-filter-outline
      custom_color: pink
    section: Read scope
    group: Reads
    tag: vm-smp-filter-host
    index: smp-host-range
    title: Host reads (%)
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralmetagenome
    data_collection_tag: samples
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: retained_pct
    column_type: float64
    display:
      icon_name: mdi:filter-variant
      custom_color: teal
    section: Read scope
    group: Reads
    tag: vm-smp-filter-retained
    index: smp-retained-range
    title: Read pairs retained (%)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: samples
    use: viralmetagenome/read_attrition
    aggregation: sum
    column_name: raw_read_pairs
    column_type: int64
    secondary_layout: attrition
    attrition_cols: [trimmed_read_pairs, host_filtered_read_pairs]
    display:
      icon_name: mdi:filter-variant
      icon_color: teal
      caption: kept after trimming, then after host removal
      format: si
    section: Reads at a glance
    tag: vm-smp-card-attrition
    index: smp-card-attrition
    title: Raw read pairs
    description: Read pairs sequenced across the samples, and how many trimming and host removal leave.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: samples
    aggregation: median
    column_name: host_pct
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:account-filter-outline
      icon_color: pink
      caption: host share, per sample (%)
      decimals: 2
    section: Reads at a glance
    tag: vm-smp-card-host
    index: smp-card-host
    title: Host reads
    description: Read pairs Kraken2 classified against the host database, in percent of the trimmed pairs.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: samples
    aggregation: median
    column_name: q30_pct
    column_type: float64
    secondary_layout: threshold
    threshold_value: 80
    threshold_direction: min
    threshold_warn: 70
    display:
      icon_name: mdi:check-decagram
      icon_color: green
      caption: samples at 80% Q30 or more, 70% warns
      decimals: 1
    section: Reads at a glance
    tag: vm-smp-card-q30
    index: smp-card-q30
    title: Q30 bases
    description: Bases at Phred 30 or better after fastp, in percent; Illumina's usual floor is 80%.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: samples
    aggregation: median
    column_name: raw_dup_pct
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:content-copy
      icon_color: orange
      caption: median per sample, with the spread
      decimals: 1
    section: Reads at a glance
    tag: vm-smp-card-dup
    index: smp-card-dup
    title: Duplicate reads
    description: FastQC's duplicate share of the raw reads, in percent; a small viral genome sequenced deep duplicates by chance.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: viralmetagenome
    data_collection_tag: read_funnel
    visu_type: bar
    dict_kwargs:
      x: sample
      y: read_pairs
      color: stage
      barmode: group
      category_orders: {stage: [Raw, Trimmed, Host removed]}
      labels: {sample: Sample, read_pairs: Read pairs, stage: Stage}
    section: Read funnel
    tag: vm-smp-fig-funnel
    index: smp-funnel
    title: Read pairs at each preprocessing stage
    description: A bar that drops between two stages is where the sample lost its reads.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: viralmetagenome
    data_collection_tag: samples
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: raw_read_pairs
      y_col: retained_pct
      label_col: sample
      color_col: '{GROUP_COL}'
      size_col: host_filtered_read_pairs
      log_x: true
      x_title: Raw read pairs (log)
      y_title: Read pairs retained after preprocessing (%)
      legend_pos: bottom
      selection_enabled: true
      selection_column: sample
    section: Depth and loss
    tag: vm-smp-av-depth-loss
    index: smp-depth-loss
    title: Raw read pairs against the share retained
    description: One point per sample, sized by its clean read pairs. Lasso a group to narrow every tab.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: viralmetagenome
    data_collection_tag: read_funnel
    columns: [sample, stage, read_pairs, pct_of_raw]
    row_selection_enabled: true
    row_selection_column: sample
    section: Read tables
    tag: vm-smp-table-funnel
    index: smp-table-funnel
    title: Read pairs per stage
    description: Read pairs of each sample at each preprocessing stage and their share of the raw pairs.
    layout: {x: 0, y: 0, w: 8, h: 6}
