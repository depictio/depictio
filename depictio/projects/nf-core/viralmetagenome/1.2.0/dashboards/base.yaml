    description: Share of a mapping's reads umi_tools dedup collapsed as PCR copies of one UMI at one position, in percent.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralmetagenome
    data_collection_tag: umi_stats
    aggregation: median
    column_name: mean_umis_per_position
    column_type: float64
    filter_expr: "col('step') == 'dedup'"
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:counter
