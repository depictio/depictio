  - component_type: advanced_viz
    workflow_tag: viralmetagenome
    data_collection_tag: ivar_variants
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      chr_col: chrom
      pos_col: pos
      score_col: af
      feature_col: variant_key
      sample_col: genome_id
      category_col: frequency_class
      mark: point
      facet_by_sample: true
      max_facets: 12
      auto_height: true
      score_title: Allele frequency
      point_size: 8
    section: Along the genome
    tag: vm-var-av-genome
    index: var-genome-view
    title: Calls along the reference, one lane per genome
    description: >-
      Where along each genome do the variants sit, and how fixed are they? Every iVar call is a point at
      its position and allele frequency, coloured by frequency band, one lane per genome (up to 12, more
      in the tile's controls).

      How to read: calls near the top are carried by most of the reads, and those above the run's
      consensus frequency set the base in the consensus. A row of low calls is minor variation or noise,
      and calls that pile up at one position in several lanes are shared by those genomes. Brush a
      reference to zoom on it, and filter the call type or the route in the left panel.

      Annotations: no reference line is drawn, and the colour is the frequency band, Fixed at 0.9 or
      more, Major from 0.5 to 0.9 and Minor under 0.5. These bands are this template's own grouping, not
      a published standard. The consensus takes a base at the run's `--allele_frequency`, default 0.75
      in nf-core/viralmetagenome.

      Source: nf-core/viralmetagenome parameters, https://nf-co.re/viralmetagenome/parameters

      Note: the axis lays the references the calls sit on end to end, so a lane shows its calls on the
      reference it was mapped to. It is drawn from the table, not from a genome browser, because the
      published VCFs have no index of their own and no viral assembly is bundled.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: viralmetagenome
    data_collection_tag: ivar_variants
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: total_dp
      y_col: af
      label_col: variant_key
      color_col: frequency_class
      marker_size: 10
      opacity: 0.6
      marker_outline: true
      density_threshold: 5000
      log_x: true
      quadrants:
        x: 10
        y: 0.5
        labels: ['Major, thin reads', '', 'Noise, thin reads', 'Minor, well supported']
      x_title: Reads at the position (log)
      y_title: Allele frequency
      legend_pos: bottom
      selection_enabled: true
      selection_column: genome_id
    section: Frequency and depth
    tag: vm-var-av-af-depth
    index: var-af-depth
    title: Allele frequency against depth per call
    description: >-
      Which calls can be believed? One point per call, coloured by frequency band, with the reads at its
      position on a log axis against its allele frequency. Lasso calls to narrow every tab to their
      genomes.

      How to read: the unlabelled top right corner holds the calls that are both frequent and well
      supported. Calls in the bottom left are low frequency read off few reads, which is mostly noise.
      The minor calls with many reads behind them, bottom right, are the intra-host variants worth a
      look, and iVar's own verdict is in the iVar calls table.

      Lines and annotations: the dashed lines sit at 10 reads and at half frequency, and every corner is
      labelled except the top right one. Half frequency is where the Major band starts, the point where
      the alternative allele has as many reads as the reference. 10 reads is the default minimum depth
      of iVar consensus, applied here to variant calls as a fixed reading aid, since iVar variants sets
      no minimum depth by default.

      Source: iVar manual, https://andersen-lab.github.io/ivar/html/manualpage.html

      Note: points are smaller and fainter than elsewhere because thousands of calls overlap, and past
      5000 calls the tile draws a density map. The call names show on hover.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: viralmetagenome
    data_collection_tag: ivar_variants
    use: ivar/variants_tsv
    columns: [genome_id, sample, reference, chrom, pos, ref, alt, variant_type, af, frequency_class, total_dp, alt_dp, pval, filter, gff_feature, aa_change]
    row_selection_enabled: true
    row_selection_column: genome_id
    section: Variant table
    tag: vm-var-table
    index: var-table
    title: iVar calls
    description: Every call with its depths, allele frequency, p-value and iVar's verdict.
    layout: {x: 0, y: 0, w: 8, h: 6}
