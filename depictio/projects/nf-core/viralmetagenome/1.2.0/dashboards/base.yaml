      x_title: Mash identity of the picked reference
      y_title: Breadth at 10X (%)
      legend_pos: bottom
      selection_enabled: true
      selection_column: genome_id
    section: Constraint route
    tag: vm-cns-av-mash-breadth
    index: cns-mash-breadth
    title: Mash identity against breadth per constraint genome
    description: >-
      Did Mash pick a good reference for each constraint genome? One point per constraint genome whose
      reference was chosen from a pool (`selection: true` in the constraint sheet), plotted by the Mash
      screen identity of the picked reference to the reads and by the share of it covered at 10X.

      How to read: the unlabelled top right corner is a close pick the reads cover well. A close pick
      with narrow breadth is a reference the reads match but only in part, a partial genome or a
      segment the sample lost. A distant pick is a reference the pool held nothing closer to. The
      picked reference is named in the record and in the table below.

      Lines and annotations: the dashed lines sit at 0.95 Mash identity and 90 % breadth, fixed reading
      aids with no published source. Genomes of the de novo route and constraint references named in the
      sheet have no Mash screen and are not drawn.
    layout: {x: 0, y: 0, w: 4, h: 7}
