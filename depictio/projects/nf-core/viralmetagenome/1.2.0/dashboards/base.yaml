    description: Every call of the run's caller with its depth, allele frequency and verdict.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: viralmetagenome
    data_collection_tag: ivar_variants
    use: ivar/variants_tsv
    columns: [genome_id, sample, reference, chrom, pos, ref, alt, variant_type, af, frequency_class, total_dp, alt_dp, pval, filter, gff_feature, aa_change]
    row_selection_enabled: true
    row_selection_column: genome_id
    section: Variant table
    tag: vm-var-table
    index: var-table
    title: iVar calls
    description: Every iVar call with its depths, allele frequency, p-value, codon change and iVar's verdict; absent from a bcftools run.
    layout: {x: 0, y: 6, w: 8, h: 6}
# ============================================================================
# Genome browser (opt-in: --var MAPPING_REFERENCES_FASTA)
# ============================================================================
- title: Genome browser
  subtitle: What do the reads look like under each genome, end to end?
  tab_group: Variants
  tab_order: 7
  tab_icon: mdi:magnify-scan
  tab_icon_color: red
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Genome pick
    icon: mdi:filter-variant
    color: red
    description: Pick the genome and the stretch of it to open
  grid_sections:
  - name: Browser
    icon: mdi:dna
    color: red
    description: Reads, depth and variant calls of the picked genome, on the run's mapping references
  - name: Loci
    icon: mdi:table
    color: gray
    description: Every genome with its whole length and its two ends, the loci the browser opens on
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      One genome at a time: pick it in the left panel, then step through its whole length and its two
      ends in the browser's header. The tracks are its deduplicated reads (soft clips shown, where a
      read runs past the genome's end), mosdepth's depth along it and its variant calls, on the run's
      mapping references.
    tag: vm-gb-intro
    index: gb-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: viralmetagenome
    data_collection_tag: genome_loci
    interactive_component_type: Select
    column_name: genome_id
    column_type: object
    display:
      icon_name: mdi:virus
      custom_color: red
    section: Genome pick
    group: Genome
    tag: vm-gb-filter-genome
    index: gb-genome-filter
    title: Genome
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: viralmetagenome
    data_collection_tag: genome_loci
    interactive_component_type: MultiSelect
    column_name: region
    column_type: object
    display:
      icon_name: mdi:arrow-collapse-horizontal
      custom_color: violet
    section: Genome pick
    group: Genome
    tag: vm-gb-filter-region
    index: gb-region-filter
    title: Region
    layout: {x: 0, y: 2, w: 1, h: 2}
  - component_type: jbrowse
    workflow_tag: viralmetagenome
    data_collection_tag: tracks
    section: Browser
    initial_tracks: 3
    max_tracks: 6
    show_overview: false
    # A custom assembly carries no gene annotation of its own.
    show_annotation: false
    selection_enabled: true
    selection_column: genome_id
    call_stepper: true
    # One locus row per genome and region (whole, 5' end, 3' end), in that
    # order: the view opens on the picked genome end to end, and the header
    # steps to its ends.
    locus_from:
      data_collection_tag: genome_loci
      chrom_column: chrom
      start_column: start
      end_column: end
      padding: 0
      max_rows: 60
      sort_by: region_order
      label_column: locus_id
      sample_column: genome_id
      columns: [region, length, virus_segment]
      search_columns: [genome_id, virus_segment]
    tag: vm-gb-browser
    index: gb-browser
    title: Genome browser
    description: >-
      The reads, depth and variant calls of the picked genome, on its own reference. It opens on the
      whole genome; step to its 5' and 3' end (the first and last 200 bp) in the header, where the reads
      thin out and the soft clips show whether they ran past the end of the reference.
    layout: {x: 0, y: 0, w: 8, h: 9}
  - component_type: table
    workflow_tag: viralmetagenome
    data_collection_tag: genome_loci
    columns: [genome_id, virus_segment, chrom, region, start, end, length]
    row_selection_enabled: true
    row_selection_column: genome_id
    section: Loci
    tag: vm-gb-table-loci
    index: gb-table-loci
    title: Genome loci
    description: Each genome's sequence in the run's reference FASTA, its length and its two 200 bp ends.
    layout: {x: 0, y: 0, w: 8, h: 6}
