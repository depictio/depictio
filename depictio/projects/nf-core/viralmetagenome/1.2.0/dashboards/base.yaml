    description: Unique UMIs at a deduplicated position, the mean per mapping; few UMIs over a deep position is a library of few molecules copied many times.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: table
    workflow_tag: viralmetagenome
    data_collection_tag: umi_stats
    columns: [step, sample, genome_id, input_reads, output_reads, removed_pct, positions, mean_umis_per_position, max_umis_per_position]
    section: UMI deduplication
    tag: vm-map-table-umi
    index: map-table-umi
    title: UMI read counts
    description: >-
      Reads in and out of umi_tools extract (per sample, before mapping) and umi_tools dedup (per mapping,
      with `--umi_deduplicate mapping` or `both`). A run deduplicated on the reads with HUMID, the
      default, has extraction rows only.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: table
    workflow_tag: viralmetagenome
    data_collection_tag: genomes
    columns: [genome_id, sample, reference, route, mapped_reads, mapped_pct, properly_paired_pct, dup_pct, dedup_mapped_reads, mean_depth, median_depth, cov_1x_pct, cov_10x_pct, cov_50x_pct, cov_100x_pct, mash_reference, mash_identity]
    row_selection_enabled: true
    row_selection_column: genome_id
