- title: Splice Junctions
  subtitle: Which splice junctions do the reads support, and how strongly?
  tab_group: Follow-up
  tab_order: 7
  tab_icon: mdi:waves
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Junction filters
    icon: mdi:filter-variant
    color: blue
    description: Narrows the junctions by chromosome and unique read support
  grid_sections:
  - name: Junctions at a glance
    icon: mdi:counter
    color: blue
    description: Junctions scored, the reads behind them and how long the introns are
  - name: Junction landscape
    icon: mdi:chart-scatter-plot
    color: blue
    description: Each junction along the genome, raised by its unique read support
  - name: Junction arcs
    icon: mdi:waves
    color: blue
    description: The busiest loci, each junction drawn from donor to acceptor
  - name: Junction table
    icon: mdi:table
    color: gray
    description: Every junction CTAT-splicing scored, with its read support
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [CTAT-splicing](https://github.com/TrinityCTAT/CTAT-SPLICING) reads the splice
      junctions of the STAR alignment and counts the reads crossing each, uniquely and
      multi-mapped. The Manhattan places each junction along the genome by its unique read
      support, and the arcs draw the busiest loci from donor to acceptor. Junctions are keyed
      on the intron, so the fusion filters do not reach this tab; the sample filters do.
    tag: rf-splice-intro
    index: splice-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: rnafusion
    data_collection_tag: splice_junctions
    interactive_component_type: MultiSelect
    column_name: chrom
    column_type: object
    display:
      icon_name: mdi:map-marker-outline
      custom_color: cyan
    section: Junction filters
    group: Junctions
    tag: rf-splice-filter-chrom
    index: splice-chrom-filter
    title: Chromosome
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: rnafusion
    data_collection_tag: splice_junctions
    interactive_component_type: RangeSlider
    column_name: uniq_mapped
    column_type: int64
    display:
      icon_name: mdi:counter
      custom_color: blue
    section: Junction filters
    group: Junctions
    tag: rf-splice-filter-uniq
    index: splice-uniq-range
    title: Unique read support
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: rnafusion
    data_collection_tag: splice_junctions
    use: ctatsplicing/introns
    aggregation: nunique
    column_name: intron
    column_type: object
    secondary_layout: top_n
    breakdown_col: gene
    top_n_count: 3
    display:
      icon_name: mdi:waves
      icon_color: blue
      caption: distinct, the busiest genes
    section: Junctions at a glance
    tag: rf-splice-card-junctions
    index: splice-card-junctions
    title: Junctions scored
    description: Distinct splice junctions CTAT-splicing scored; the bars rank the genes holding most.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnafusion
    data_collection_tag: splice_junctions
    use: ctatsplicing/introns
    aggregation: median
    column_name: uniq_mapped
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:counter
      icon_color: cyan
      caption: median per junction, with its spread
      decimals: 0
    section: Junctions at a glance
    tag: rf-splice-card-uniq
    index: splice-card-uniq
