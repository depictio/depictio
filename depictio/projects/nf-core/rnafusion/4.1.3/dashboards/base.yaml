- title: Evidence
  subtitle: How much read support each caller found for each fusion, and where the callers disagree
  tab_order: 3
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Evidence scope
    icon: mdi:tune
    color: teal
    description: Narrow the evidence rows by caller and read support
  grid_sections:
  - name: Support across callers
    icon: mdi:chart-scatter-plot
    color: teal
    description: The same fusions seen through each caller's read counts
  - name: Per caller detail
    icon: mdi:dna
    color: cyan
    description: Each caller's own evidence, on its own terms
    collapsed: true
  - name: Caller tables
    icon: mdi:table
    color: gray
    description: The raw caller rows, selectable by fusion
    collapsed: true
  components:
  - component_type: text
    tag: rnaf-ev-intro
    section: Support across callers
    workflow_tag: rnafusion
    data_collection_tag: caller_evidence
    title: Comparable read support, one caller at a time
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each caller counts reads its own way, so the evidence strings are summed
      into one supporting-read figure per fusion and caller. Colour is that
      figure on a log scale, size is the caller's share of the fusion's support.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: rnaf-ev-card-rows
    section: Support across callers
    workflow_tag: rnafusion
    data_collection_tag: caller_evidence
    use: fusionreport/caller_evidence
    aggregation: nunique
    column_name: fusion
    column_type: object
    secondary_layout: composition
    breakdown_col: caller
    display: {icon_name: 'mdi:dna', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Fusions with evidence
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: rnaf-ev-card-support
    section: Support across callers
    workflow_tag: rnafusion
    data_collection_tag: caller_evidence
    use: fusionreport/caller_evidence
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: supporting_reads
    column_type: int64
    display: {icon_name: 'mdi:counter', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Supporting reads
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: rnaf-ev-card-total
    section: Support across callers
    workflow_tag: rnafusion
    data_collection_tag: caller_evidence
    use: fusionreport/caller_evidence
    aggregation: sum
    column_name: supporting_reads
    column_type: int64
    secondary_layout: donut
    breakdown_col: caller
    display: {icon_name: 'mdi:chart-donut', icon_color: '#26A69A', title_color: '#26A69A', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Total read support
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: rnaf-ev-card-share
    section: Support across callers
    workflow_tag: rnafusion
    data_collection_tag: caller_evidence
    use: fusionreport/caller_evidence
    aggregation: average
    column_name: evidence_fraction
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.33
    threshold_direction: min
    threshold_warn: 0.2
    display: {icon_name: 'mdi:scale-balance', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mean caller share
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: rnaf-ev-dotplot
    index: rnaf-ev-dotplot
    section: Support across callers
    workflow_tag: rnafusion
    data_collection_tag: caller_evidence
    use: fusionreport/evidence_dot_plot
    config:
      colour_scale: Viridis
      gene_sort: mean
      cluster_sort: name
      max_dot_size: 24
      max_genes: 30
    title: Read support per fusion and caller
    description: One dot per fusion and caller. Colour is log10 read support, size is that caller's share of the fusion's total support. An empty column means the caller never reported the fusion.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 7}
  - component_type: figure
    tag: rnaf-ev-scatter
    index: rnaf-ev-scatter
    section: Support across callers
    workflow_tag: rnafusion
    data_collection_tag: caller_evidence
    use: fusionreport/caller_evidence
    mode: code
    code_content: |
      # Pivot the long evidence table so the two split-read callers face each
      # other on one plane; FusionCatcher rides along as the marker size.
      wide = df.pivot(
          on='caller', index=['sample', 'fusion'], values='supporting_reads',
          aggregate_function='sum',
      ).fill_null(0)
      for caller in ('arriba', 'starfusion', 'fusioncatcher'):
          if caller not in wide.columns:
              wide = wide.with_columns(pl.lit(0).alias(caller))
      wide = wide.join(
          df.group_by(['sample', 'fusion']).agg(pl.col('fii').max().alias('fii')),
          on=['sample', 'fusion'], how='left',
      ).with_columns(pl.col('fii').fill_null(0.0))

      fig = px.scatter(
          wide.to_pandas(), x='arriba', y='starfusion', color='fii',
          size='fusioncatcher', size_max=28, hover_name='fusion',
          hover_data=['sample'], custom_data=['fusion'], color_continuous_scale='Tealgrn',
      )
      fig.update_layout(
          xaxis_title='Arriba supporting reads',
          yaxis_title='STAR-Fusion supporting reads',
          coloraxis_colorbar_title_text='FII',
          margin={'t': 24, 'l': 64, 'r': 16, 'b': 48},
      )
    selection_enabled: true
    selection_column: fusion
    title: Arriba against STAR-Fusion
    description: One point per fusion and sample; size is the FusionCatcher support, colour the Fusion Indication Index. Points off the diagonal are the fusions the two callers weigh differently. Select points to filter the dashboard.
    title_size: h3
    layout: {x: 0, y: 11, w: 8, h: 6}

  - component_type: text
    tag: rnaf-ev-caller-intro
    section: Per caller detail
    workflow_tag: rnafusion
    data_collection_tag: arriba_fusions
    title: Each caller on its own terms
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The consensus flattens very different evidence models. Here each
      caller keeps its own grouping: [Arriba](https://github.com/suhrig/arriba)
      by confidence class,
      [STAR-Fusion](https://github.com/STAR-Fusion/STAR-Fusion) by splice type,
      [FusionCatcher](https://github.com/ndaniel/fusioncatcher) by the effect it
      predicts on the coding sequence.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: rnaf-ev-arriba-type-bar
    section: Per caller detail
    workflow_tag: rnafusion
    data_collection_tag: arriba_fusions
    use: arriba/type_bars
    visu_type: bar
    dict_kwargs: {x: fusion_type, y: supporting_reads, color: confidence}
    title: Arriba event types
    description: Read support summed per structural class, split by the confidence Arriba assigned.
    title_size: h3
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: figure
    tag: rnaf-ev-arriba-site-bar
