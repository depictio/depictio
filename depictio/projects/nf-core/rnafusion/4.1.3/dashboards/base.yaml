- title: Breakpoints
  subtitle: Where on the genome do the two fusion partners sit?
  tab_group: Fusion calls
  tab_order: 4
  tab_icon: mdi:vector-link
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # Bound to arriba_fusions: the flow, the bars and the cards read it. The chord
  # reads arriba_fusion_links, which no tab filter reaches; the sample and
  # fusion filters do.
  filter_sections:
  - name: Breakpoint filters
    icon: mdi:filter-variant
    color: cyan
    description: Narrows Arriba's calls by contig pair, event class and confidence
  grid_sections:
  - name: Breakpoints at a glance
    icon: mdi:counter
    color: cyan
    description: Arriba's calls by event class, across chromosomes, and their read support
  - name: Partner contigs
    icon: mdi:relation-many-to-many
    color: cyan
    description: From the contig of the 5' partner to that of the 3' partner, then on the ring
  - name: Event classes
    icon: mdi:chart-bar
    color: cyan
    description: Read support by event class, and by the feature each breakpoint fell in
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [Arriba](https://github.com/suhrig/arriba) writes each breakpoint as a contig and a
      position, so its calls read as links between loci. The flow runs from the contig of
      the 5' partner to that of the 3' partner and the ring draws each call between its two
      breakpoints: a link that stays on one contig is a local rearrangement, one that
      crosses is a translocation. The bars sum the read support by event class and by the
      transcript feature each breakpoint fell in.
    tag: rf-bp-intro
    index: bp-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: rnafusion
    data_collection_tag: arriba_fusions
    interactive_component_type: MultiSelect
    column_name: chrom_pair
    column_type: object
    display:
      icon_name: mdi:relation-many-to-many
      custom_color: cyan
    section: Breakpoint filters
    group: Loci
    tag: rf-bp-filter-chrompair
    index: bp-chrompair-filter
    title: Partner contigs
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: rnafusion
    data_collection_tag: arriba_fusions
    interactive_component_type: MultiSelect
    column_name: fusion_type
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: red
    section: Breakpoint filters
    group: Calls
    tag: rf-bp-filter-type
    index: bp-type-filter
    title: Event class
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: rnafusion
    data_collection_tag: arriba_fusions
    interactive_component_type: MultiSelect
    column_name: confidence
    column_type: object
    display:
      icon_name: mdi:check-decagram
      custom_color: lime
    section: Breakpoint filters
    group: Calls
    tag: rf-bp-filter-confidence
    index: bp-confidence-filter
    title: Arriba confidence
    layout: {x: 0, y: 6, w: 1, h: 2}
  - component_type: card
    workflow_tag: rnafusion
    data_collection_tag: arriba_fusions
    use: arriba/fusions
    aggregation: count
    column_name: fusion
    column_type: object
    secondary_layout: composition
    breakdown_col: fusion_type
    display:
      icon_name: mdi:vector-link
      icon_color: cyan
      caption: calls, by event class
    section: Breakpoints at a glance
    tag: rf-bp-card-calls
    index: bp-card-calls
    title: Arriba calls
    description: Calls Arriba retained, split by the structural class it assigned.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnafusion
    data_collection_tag: arriba_fusions
    use: arriba/fusions
    aggregation: count
    column_name: fusion
    column_type: object
    filter_expr: col('chrom_5p') != col('chrom_3p')
    # Split by Arriba's confidence: contig pairs rarely repeat, so a ranking
    # of them drew bars of one call each, their labels cut.
    secondary_layout: donut
    breakdown_col: confidence
    display:
      icon_name: mdi:arrow-left-right
      icon_color: red
      caption: calls, by Arriba confidence
    section: Breakpoints at a glance
    tag: rf-bp-card-inter
    index: bp-card-inter
    title: Between chromosomes
    description: Calls whose two breakpoints sit on different contigs, split by Arriba's confidence.
    layout: {x: 2, y: 0, w: 2, h: 2}
  # Split reads plus discordant mates over the local coverage: a share with no
  # published floor, so its distribution rather than a gauge ("0.12 of 1"). A
  # call with no local coverage has none.
  - component_type: card
    workflow_tag: rnafusion
    data_collection_tag: arriba_fusions
    use: arriba/fusions
    aggregation: median
    column_name: support_fraction
    column_type: float64
    filter_expr: col('coverage') > 0
    secondary_layout: histogram
    display:
      icon_name: mdi:percent-outline
      icon_color: green
