- title: FusionInspector and splicing
  subtitle: In-silico validation of the calls, the fusion protein domains and the splice-junction landscape
  tab_order: 4
  tab_icon: mdi:dna
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Validation scope
    icon: mdi:check-decagram
    color: grape
    description: Narrow the validated calls by predicted protein and abundance
    collapsed: true
  - name: Splicing scope
    icon: mdi:waves
    color: blue
    description: Narrow the splice junctions by chromosome and support
    collapsed: true
  grid_sections:
  - name: Validated calls
    icon: mdi:check-decagram
    color: grape
    description: What survives when the reads are re-aligned to a fusion contig reference
  - name: Fusion protein domains
    icon: mdi:shape-outline
    color: violet
    description: Which Pfam domains each partner brings to the fusion protein
  - name: Splice junctions
    icon: mdi:waves
    color: blue
    description: The junction landscape CTAT-splicing scored around the calls
  components:
  - component_type: text
    tag: rnaf-fi-intro
    section: Validated calls
    workflow_tag: rnafusion
    data_collection_tag: fusioninspector_fusions
    title: Re-aligned, then re-counted
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      FusionInspector rebuilds a contig for every candidate and re-aligns the
      reads to it. The fusion allelic ratio is the give-away: it weighs the
      fusion reads against the wild-type reads competing on each side.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: rnaf-fi-card-validated
    section: Validated calls
    workflow_tag: rnafusion
    data_collection_tag: fusioninspector_fusions
    use: fusioninspector/fusions
    aggregation: nunique
    column_name: fusion
    column_type: object
    secondary_layout: top_n
    breakdown_col: prot_fusion_type
    top_n_count: 3
    display: {icon_name: 'mdi:check-decagram', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Validated fusions
    layout: {x: 0, y: 1, w: 2, h: 2}
  - component_type: card
    tag: rnaf-fi-card-ffpm
    section: Validated calls
    workflow_tag: rnafusion
    data_collection_tag: fusioninspector_fusions
    use: fusioninspector/fusions
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: ffpm
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Fragments per million
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: rnaf-fi-card-junction
    section: Validated calls
    workflow_tag: rnafusion
    data_collection_tag: fusioninspector_fusions
    use: fusioninspector/fusions
    aggregation: average
    column_name: junction_fraction
    column_type: float64
    secondary_layout: gauge
    coverage_max: 1
    display: {icon_name: 'mdi:bullseye-arrow', icon_color: '#7E57C2', title_color: '#7E57C2', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Junction-crossing share
    layout: {x: 4, y: 1, w: 2, h: 2}
  - component_type: card
    tag: rnaf-fi-card-domains
    section: Validated calls
    workflow_tag: rnafusion
    data_collection_tag: fusioninspector_fusions
    use: fusioninspector/fusions
    aggregation: sum
    column_name: n_domains_5p
    column_type: int64
    secondary_layout: composition
    breakdown_col: prot_fusion_type
    display: {icon_name: 'mdi:shape-outline', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: 5' domains carried
    layout: {x: 6, y: 1, w: 2, h: 2}
  - component_type: advanced_viz
    tag: rnaf-fi-dotplot
    index: rnaf-fi-dotplot
    section: Validated calls
    workflow_tag: rnafusion
    data_collection_tag: fusioninspector_fusions
    use: fusioninspector/evidence_dot_plot
    config:
      colour_scale: Spectral
      reverse_scale: true
      gene_sort: mean
      max_dot_size: 22
      max_genes: 30
    title: Validated abundance by predicted protein
    description: Colour is log10 fragments per million after re-alignment, size is the share of the support that crosses the junction. A call with no junction reads lands in the unknown row.
    title_size: h3
    layout: {x: 0, y: 3, w: 8, h: 6}
  - component_type: figure
    tag: rnaf-fi-far-scatter
    index: rnaf-fi-far-scatter
    section: Validated calls
    workflow_tag: rnafusion
    data_collection_tag: fusioninspector_fusions
    mode: code
    code_content: |
      # Fusion allelic ratio, 5' against 3'. Both axes are log scaled, so a call
      # supported on one side only falls off the diagonal. FusionInspector
      # reports 0 when a partner has no competing wild-type reads, so the axes
      # are floored before the log.
      floor = 0.01
      data = df.with_columns(
          pl.max_horizontal(pl.col('far_left'), pl.lit(floor)).alias('far_5p'),
          pl.max_horizontal(pl.col('far_right'), pl.lit(floor)).alias('far_3p'),
      )
      fig = px.scatter(
          data.to_pandas(), x='far_5p', y='far_3p', color='prot_fusion_type',
          size='supporting_reads', size_max=26, log_x=True, log_y=True,
          hover_name='fusion', custom_data=['fusion'],
      )
      fig.update_layout(
          xaxis_title="5' fusion allelic ratio",
          yaxis_title="3' fusion allelic ratio",
          legend_title_text='Predicted protein',
          margin={'t': 24, 'l': 64, 'r': 16, 'b': 48},
      )
    selection_enabled: true
    selection_column: fusion
    title: Fusion allelic ratio, both sides
    description: One point per validated call; size is the re-aligned read support. A point high on both axes has little wild-type competition on either side. Select points to filter the domain track below.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 6}

  - component_type: text
    tag: rnaf-fi-domain-intro
    section: Fusion protein domains
    workflow_tag: rnafusion
    data_collection_tag: fusion_protein_domains
    title: What the fusion protein keeps
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Pfam hits on each partner, in amino-acid coordinates. A PARTIAL suffix
      means the breakpoint cuts through the domain. Depictio has no domain-track
      kind yet, so the track below is drawn in code from the same rows.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    tag: rnaf-fi-domain-track
    index: rnaf-fi-domain-track
    section: Fusion protein domains
    workflow_tag: rnafusion
    data_collection_tag: fusion_protein_domains
    mode: code
    code_content: |
      # Interval track: one bar per Pfam domain, placed at its amino-acid start
      # and as wide as the domain. Pfam clans report many overlapping hits, so
      # the bars are drawn translucent and overlaid rather than stacked.
      busiest = (
          df.group_by('fusion').agg(pl.len().alias('n'))
          .sort('n', descending=True).head(6)
      )
      data = df.join(busiest.select('fusion'), on='fusion', how='inner')
      colours = {'5p': '#3F51B5', '3p': '#F2A93B'}
      fig = go.Figure()
      for partner in ('5p', '3p'):
          part = data.filter(pl.col('partner') == partner).sort('domain_start')
          if part.height == 0:
              continue
          fig.add_bar(
              x=part['domain_length'].to_list(),
              y=part['fusion'].to_list(),
              base=part['domain_start'].to_list(),
              orientation='h', name=partner, opacity=0.7,
              marker_color=colours[partner],
              text=part['domain'].to_list(),
              customdata=list(zip(part['domain_start'].to_list(), part['domain_end'].to_list())),
              hovertemplate='%{text}<br>%{customdata[0]} to %{customdata[1]} aa<extra></extra>',
          )
      fig.update_layout(
          barmode='overlay', bargap=0.35,
          xaxis_title='Amino-acid position on the partner protein',
          yaxis_title='', legend_title_text='Partner',
          margin={'t': 24, 'l': 150, 'r': 16, 'b': 48},
      )
    title: Protein-domain track
    description: The six fusions with the most annotated domains. Each bar spans one Pfam hit on the partner protein; overlapping bars are the nested hits of one Pfam clan.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 6}
  - component_type: advanced_viz
    tag: rnaf-fi-domain-lollipop
    index: rnaf-fi-domain-lollipop
    section: Fusion protein domains
    workflow_tag: rnafusion
    data_collection_tag: fusion_protein_domains
    use: fusioninspector/domain_lollipop
    config:
      effect_col: neg_log10_evalue
      scale_points_by_effect: true
      show_stems: true
      gene_sort: count
      top_n_labels: 6
    title: Domain positions per fusion
    description: Each stem is one Pfam hit at its start position, coloured by partner and sized by how strong the hit is. Clustered stems are a Pfam clan reporting the same region several times.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 6}
  - component_type: table
