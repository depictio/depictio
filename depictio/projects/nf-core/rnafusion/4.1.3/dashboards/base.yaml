version: 1
main_dashboard:
  title: nf-core/rnafusion
  subtitle: Read and alignment QC before the fusion calls, from FastQC, fastp, STAR and Picard
  project_tag: RNAfusion Gene Fusion Detection
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # Two persistent filter groups. `Sample scope` is sourced on the samplesheet,
  # which links to the MultiQC panels and to every fusion and splicing table on
  # `sample` (the recipes read it off the file names), so on a cohort run it
  # narrows every tab to the picked libraries. `Fusion scope` fans a fusion
  # selection out through the template links to every caller.
  filter_sections:
  - name: Sample scope
    icon: mdi:filter-variant
    color: teal
    description: Which samples every tab is about, through the samplesheet links
    persistent: true
    pin: top
  - name: Fusion scope
    icon: mdi:tune
    color: indigo
    description: Applies to every tab through the fusion links
    persistent: true
    pin: top
  - name: Reference scope
    icon: mdi:filter-variant
    color: gray
    description: Narrow the pinned consensus table by partner gene and knowledge base
    persistent: true
  # `Run at a glance` and `Sample sheet` are pinned to the top and `Reference
  # tables` to the bottom, so the run size, the samples and the consensus every
  # tab is filtered by trail each tab. They are declared here, on the tab no
  # route conditional can remove. The MultiQC sections follow the family order:
  # general statistics, then reads, alignment and library metrics.
  grid_sections:
  - name: General statistics
    icon: mdi:table
    color: orange
    description: One row per sample, the headline numbers of every QC module
  - name: Read quality
    icon: mdi:chart-bell-curve
    color: orange
    description: Base quality and read yield, raw and after trimming
  - name: Alignment
    icon: mdi:chart-box-outline
    color: orange
    description: Where the reads went, before any fusion is called
  - name: Library metrics
    icon: mdi:ruler
    color: blue
    description: Insert size, duplication and coverage along the transcript
    collapsed: true
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: The size of the run, on every tab
    persistent: true
    pin: top
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The samples the run was given, with their declared strandedness
    collapsed: true
    persistent: true
    pin: top
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The fusion-report consensus every tab is filtered by
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # ------------------------------------------------------ alignment at a glance
  - component_type: text
    tag: rnaf-qc-intro
    section: General statistics
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    title: Read this tab before you trust a fusion
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A fusion call is only as good as the alignment under it.
      [STAR](https://github.com/alexdobin/STAR) has to place reads across the
      breakpoint, and [Picard](https://broadinstitute.github.io/picard/) says
      whether those reads landed on transcripts at all. Everything on the later
      tabs is built from what survives here.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: rnaf-qc-general-stats
    section: General statistics
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    title: General statistics
    description: One row per sample, pooling the FastQC, fastp, STAR and Picard headline numbers.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 4}
  - component_type: multiqc
    tag: rnaf-qc-star-alignment
    section: Alignment
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    selected_module: star
    selected_plot: Alignment Scores
    use: multiqc/star
    title: STAR alignment scores
    description: Uniquely mapped, multi-mapped and unmapped reads per sample.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: multiqc
    tag: rnaf-qc-picard-assignment
    section: Alignment
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    selected_module: picard
    selected_plot: RnaSeqMetrics Assignment
    use: multiqc/picard
    title: Where the bases landed
    description: Coding, UTR, intronic, intergenic and ribosomal share of the aligned bases.
    title_size: sm
    title_align: left
    layout: {x: 4, y: 0, w: 4, h: 5}

  # ---------------------------------------------------------------- read quality
  - component_type: text
    tag: rnaf-qc-reads-intro
    section: Read quality
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    title: Before and after trimming
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      rnafusion runs
      [FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/) twice,
      on the raw reads and again after [fastp](https://github.com/OpenGene/fastp).
      The second pass is anchored as fastqc-1 in the report, so the two panels
      below are the same measurement either side of trimming.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: rnaf-qc-fastqc-quality
    section: Read quality
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    use: multiqc/fastqc
    title: Raw read quality
    description: Mean quality at each base position, before trimming.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: rnaf-qc-fastp-filtered
    section: Read quality
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    selected_module: fastp
    selected_plot: Filtered Reads
    use: multiqc/fastp
    title: Reads kept by fastp
    description: How many read pairs passed trimming and quality filtering.
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: rnaf-qc-fastqc-trimmed
    section: Read quality
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    selected_module: fastqc-1
    selected_plot: Per Sequence Quality Scores
    use: multiqc/fastqc
    title: Trimmed read quality
    description: Distribution of the mean quality per read after trimming.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 8, h: 5}

  # ------------------------------------------------------------- library metrics
  - component_type: text
    tag: rnaf-qc-library-intro
    section: Library metrics
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    title: What the library looks like
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A short insert size limits how far a discordant mate can reach across a
      breakpoint, and heavy duplication inflates the read counts every caller
      reports. Coverage along the gene body shows any degradation bias.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: rnaf-qc-picard-insert
    section: Library metrics
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    selected_module: picard
    selected_plot: Insert Size
    use: multiqc/picard
    title: Insert size distribution
    description: Fragment-length distribution from Picard CollectInsertSizeMetrics.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: rnaf-qc-picard-coverage
    section: Library metrics
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    selected_module: picard
    selected_plot: Gene Coverage
    use: multiqc/picard
    title: Coverage along the gene body
    description: Normalised coverage from the 5' to the 3' end of the transcript.
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: rnaf-qc-star-genecounts
    section: Library metrics
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    selected_module: star
    selected_plot: Gene Counts
    use: multiqc/star
    title: STAR gene-count assignment
    description: How many reads STAR assigned to genes rather than to no feature or several.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 8, h: 5}

  # --------------------------------------------------------------- run at a glance
  # Four run-level numbers that ride every tab. They are deliberately not the
  # same metrics as the per-tab strips below: those answer the tab's question,
  # these answer "what did this run produce". Sitting in a pinned persistent
  # section is also what keeps them legal on a tab named MultiQC.
  - component_type: card
    tag: rnaf-glance-card-partners
    section: Run at a glance
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    use: fusionreport/fusions
    aggregation: nunique
    column_name: gene_5p
    column_type: object
    secondary_layout: top_n
    breakdown_col: databases
    top_n_count: 3
    display: {icon_name: 'mdi:dna', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Distinct 5' partners
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: rnaf-glance-card-callers
    section: Run at a glance
    workflow_tag: rnafusion
    data_collection_tag: caller_evidence
    use: fusionreport/caller_evidence
    aggregation: nunique
    column_name: caller
    column_type: object
    secondary_layout: donut
    breakdown_col: caller
    display: {icon_name: 'mdi:set-merge', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Callers reporting
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: card
    tag: rnaf-glance-card-samples
    section: Run at a glance
    workflow_tag: rnafusion
    data_collection_tag: samplesheet
    aggregation: nunique
    column_name: sample
    column_type: object
    display: {icon_name: 'mdi:test-tube', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Samples
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: rnaf-glance-card-fusions
    section: Run at a glance
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    use: fusionreport/fusions
    aggregation: nunique
    column_name: fusion
    column_type: object
    secondary_layout: donut
    breakdown_col: tool_support
    display: {icon_name: 'mdi:dna', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Fusions called
    layout: {x: 2, y: 0, w: 2, h: 2}

  # --------------------------------------------------------------- sample sheet
  - component_type: text
    tag: rnaf-sheet-intro
    section: Sample sheet
    workflow_tag: rnafusion
    data_collection_tag: samplesheet
    title: What was sequenced
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per sample, as the run's input sheet declared it. Every fusion and
      splicing table carries the same sample names, so a row picked here narrows
      every tab.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: rnaf-table-samplesheet
    section: Sample sheet
    workflow_tag: rnafusion
    data_collection_tag: samplesheet
    row_selection_enabled: true
    row_selection_column: sample
    title: Sample sheet
    description: The samples the run was given, with the declared library strandedness. Select rows to narrow every tab.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 4}

  # -------------------------------------------------------------- reference tables
  - component_type: text
    tag: rnaf-ref-intro
    section: Reference tables
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    title: The rows behind every tile
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The fusion-report consensus every tab is filtered by, one row per fusion
      and sample. Pick a fusion here to narrow the evidence, validation and
      protein-domain tiles on the other tabs.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: rnaf-ref-table-consensus
    section: Reference tables
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    use: fusionreport/fusions
    row_selection_enabled: true
    row_selection_column: fusion
    title: fusion-report consensus
    description: Every fusion the run called, with its knowledge-base hits and caller flags.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 4}

  # ---------------------------------------------------------------- left panel
  - component_type: interactive
    tag: rnaf-filter-sample
    index: rnaf-sample-filter
    section: Sample scope
    group: Sample scope
    workflow_tag: rnafusion
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:test-tube'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: rnaf-filter-strandedness
    index: rnaf-strandedness-filter
    section: Sample scope
    group: Sample scope
    workflow_tag: rnafusion
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: strandedness
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Strandedness
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: rnaf-filter-fusion
    index: rnaf-fusion-filter
    section: Fusion scope
    group: Fusions
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    interactive_component_type: MultiSelect
    column_name: fusion
    column_type: object
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:dna'}
    placement: left
    title: Fusion
    layout: {x: 0, y: 0, w: 1, h: 4}
  - component_type: interactive
    tag: rnaf-filter-support
    index: rnaf-support-filter
    section: Fusion scope
    group: Fusions
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    interactive_component_type: MultiSelect
    column_name: tool_support
    column_type: object
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:set-merge'}
    placement: left
    title: Caller agreement
    layout: {x: 0, y: 4, w: 1, h: 3}
  - component_type: interactive
    tag: rnaf-filter-fii
    index: rnaf-fii-range
    section: Fusion scope
    group: Ranking
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    interactive_component_type: RangeSlider
    column_name: fii
    column_type: float64
    display: {title_size: md, custom_color: '#7E57C2', icon_name: 'mdi:trophy'}
    placement: left
    title: Fusion Indication Index
    layout: {x: 0, y: 7, w: 1, h: 3}
  # Persistent with the consensus table they narrow, which is pinned on every tab.
  - component_type: interactive
    tag: rnaf-filter-gene5p
    index: rnaf-gene5p-filter
    section: Reference scope
    group: Partners
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    interactive_component_type: MultiSelect
    column_name: gene_5p
    column_type: object
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:dna'}
    placement: left
    title: 5' partner gene
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: rnaf-filter-databases
    index: rnaf-databases-filter
    section: Reference scope
    group: Partners
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    interactive_component_type: MultiSelect
    column_name: databases
    column_type: object
    display: {title_size: md, custom_color: '#F2A93B', icon_name: 'mdi:database-outline'}
    placement: left
    title: Knowledge bases hit
    layout: {x: 0, y: 3, w: 1, h: 3}

tabs:
- title: Fusion calls
  subtitle: Which fusions the run called, how many callers agreed and how the knowledge bases rank them
  tab_order: 2
  tab_icon: mdi:set-merge
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Consensus scope
    icon: mdi:counter
    color: indigo
    description: Narrow the calls by rank, knowledge-base support and partner contigs
  grid_sections:
  - name: Calls at a glance
    icon: mdi:counter
    color: indigo
    description: How many fusions the run called and how confident the consensus is
  - name: Caller concordance
    icon: mdi:relation-many-to-many
    color: violet
    description: Which callers agree, and how the agreement drives the ranking
  - name: Partner chromosomes
    icon: mdi:relation-many-to-many
    color: cyan
    description: Which contigs the two halves of each call came from
  components:
  - component_type: text
    tag: rnaf-calls-intro
    section: Calls at a glance
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    title: One row per fusion and sample
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [fusion-report](https://github.com/Clinical-Genomics/fusion-report)
      pools every caller into one table per sample and scores each fusion with
      the Fusion Indication Index, which combines caller agreement with how
      many knowledge bases already list the pair.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: rnaf-calls-card-fii
    section: Calls at a glance
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    use: fusionreport/fusions
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: fii
    column_type: float64
    display: {icon_name: 'mdi:trophy', icon_color: '#7E57C2', title_color: '#7E57C2', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Fusion Indication Index
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: rnaf-calls-card-agreement
    section: Calls at a glance
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    use: fusionreport/fusions
    aggregation: count
    column_name: fusion
    column_type: object
    secondary_layout: composition
    breakdown_col: tool_support
    display: {icon_name: 'mdi:set-merge', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Caller agreement
    description: Calls split by how many of the run's callers reported them.
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: rnaf-calls-card-databases
    section: Calls at a glance
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    use: fusionreport/fusions
    aggregation: average
    column_name: n_databases
    column_type: int64
    secondary_layout: top_n
    breakdown_col: databases
    top_n_count: 3
    display: {icon_name: 'mdi:database-outline', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Knowledge bases
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: rnaf-calls-card-known
    section: Calls at a glance
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    use: fusionreport/fusions
    aggregation: nunique
    column_name: fusion
    column_type: object
    filter_expr: "col('n_databases') > 0"
    display: {icon_name: 'mdi:book-open-variant', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Known fusions
    description: Fusions at least one knowledge base already lists.
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: text
    tag: rnaf-calls-concordance-intro
    section: Caller concordance
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    title: Agreement is the first filter
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The UpSet counts the calls each combination of callers found, one set
      per caller the run executed. The ranked view below puts the same calls
      in fusion-report's own order.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: rnaf-calls-upset
    index: rnaf-calls-upset
    section: Caller concordance
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    use: fusionreport/caller_upset
    config:
      # Every 0/1 caller flag the recipe derived from the run, whatever the
      # callers; the three count columns that can also read 0/1 are excluded.
      set_columns_pattern: "^(?!(n_databases|n_tools|rank)$)"
      sort_by: cardinality
      sort_order: descending
      min_size: 1
      show_set_sizes: true
      color_intersections_by: degree
      show_values: true
    title: Caller concordance
    description: Each bar is a set of fusions found by exactly that combination of callers. Degree colouring separates unanimous calls from single-caller ones.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 6}
  - component_type: advanced_viz
    tag: rnaf-calls-lollipop
    index: rnaf-calls-lollipop
    section: Caller concordance
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    use: fusionreport/fii_lollipop
    config:
      effect_col: fii
      scale_points_by_effect: true
      show_stems: true
      gene_sort: effect
      top_n_labels: 10
    title: Ranked fusions
    description: Every fusion at its position in the fusion-report ranking, coloured by caller agreement and sized by the Fusion Indication Index.
    title_size: h3
    layout: {x: 0, y: 8, w: 8, h: 6}

  - component_type: text
    tag: rnaf-calls-chrom-intro
    section: Partner chromosomes
    workflow_tag: rnafusion
    data_collection_tag: arriba_fusions
    title: Where the two halves came from
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Arriba writes each breakpoint as a contig and a position, so the calls
      also read as a flow from the contig of the 5' partner to the contig of the
      3' partner. A band that starts and ends on the same contig is a local
      rearrangement; a band that crosses is a translocation.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: rnaf-calls-chrom-sankey
    index: rnaf-calls-chrom-sankey
    section: Partner chromosomes
    workflow_tag: rnafusion
    data_collection_tag: arriba_fusions
    use: arriba/partner_chrom_sankey
    config:
      step_cols: [chrom_5p, chrom_3p]
      value_col: supporting_reads
      value_label: supporting reads
      value_format: count
      sort_mode: total_flow
      color_mode: source
      link_opacity: 0.55
    title: Partner contigs, 5' to 3'
    description: One band per call, from the contig carrying the 5' partner to the contig carrying the 3' partner, weighted by the reads supporting the call.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
