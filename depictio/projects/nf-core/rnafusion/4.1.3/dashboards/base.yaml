  - component_type: advanced_viz
    tag: rnaf-splice-manhattan
    index: rnaf-splice-manhattan
    section: Splice junctions
    workflow_tag: rnafusion
    data_collection_tag: splice_junctions
    use: ctatsplicing/intron_manhattan
    config:
      score_kind: uniquely mapped reads
      feature_col: gene
      highlight: none
      marker_size_uniform: 6
      top_n_labels: 10
      selection_enabled: true
      selection_column: gene
    title: Junction support along the genome
    description: One point per splice junction, positioned at its start and raised by the number of uniquely mapping reads crossing it. Selecting points narrows the junction table.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 6}
  - component_type: advanced_viz
