  - component_type: text
    tag: rnaf-fi-domain-intro
    section: Fusion protein domains
    workflow_tag: rnafusion
    data_collection_tag: fusion_protein_domains
    title: What the fusion protein keeps
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [Pfam](https://www.ebi.ac.uk/interpro/entry/pfam/) hits on each partner,
      in amino-acid coordinates. A PARTIAL suffix means the breakpoint cuts
      through the domain, which the structure below draws as a domain that
      stops where the partner does.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: rnaf-fi-domain-track
    index: rnaf-fi-domain-track
    section: Fusion protein domains
    workflow_tag: rnafusion
    data_collection_tag: fusion_protein_domains
    use: fusioninspector/fusion_domains
    config:
      colour_by_col: partner
      top_n: 6
      show_breakpoint: true
    title: Fusion protein structure
    description: The six fusions with the most annotated domains, each drawn as its two partners end to end with a lane per partner. A domain that stops where the partner does is one the breakpoint truncates.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 6}
