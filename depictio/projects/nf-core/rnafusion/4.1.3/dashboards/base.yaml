    data_collection_tag: arriba_fusions
    use: arriba/site_bars
    visu_type: bar
    dict_kwargs: {x: site_5p, y: supporting_reads, color: site_3p}
    title: Arriba breakpoint sites
    description: Read support summed per transcript feature the 5' breakpoint fell in, split by the feature on the 3' side. A call on two splice sites is the clean case.
    title_size: h3
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: advanced_viz
    tag: rnaf-ev-arriba-dot
    index: rnaf-ev-arriba-dot
    section: Per caller detail
    workflow_tag: rnafusion
    data_collection_tag: arriba_fusions
    use: arriba/evidence_dot_plot
    config:
      colour_scale: Plasma
      gene_sort: mean
      max_dot_size: 22
      max_genes: 30
    title: Arriba confidence and support
    description: Colour is log10 supporting reads, size is the share of the local coverage that supports the fusion.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 6}
  - component_type: advanced_viz
