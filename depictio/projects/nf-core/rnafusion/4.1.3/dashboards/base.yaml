    title_align: left
    order: 2
    alignment: left
    body: >
      [CTAT-splicing](https://github.com/TrinityCTAT/CTAT-SPLICING) scores
      every junction in the genes the callers touched. The landscape is keyed
      on the junction, so the fusion filter does not reach it; the sample
      filter does.
    layout: {x: 0, y: 0, w: 8, h: 2}
