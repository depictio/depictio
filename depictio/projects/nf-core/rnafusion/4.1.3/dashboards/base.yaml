      decimals: 2
    section: Breakpoints at a glance
    tag: rf-bp-card-fraction
    index: bp-card-fraction
    title: Support fraction
    description: Median share of the reads at the breakpoints that support the fusion, from 0 to 1.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnafusion
    data_collection_tag: arriba_fusions
    use: arriba/fusions
    aggregation: median
    column_name: split_reads
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:call-split
      icon_color: orange
      caption: median per call, with its spread
      decimals: 0
    section: Breakpoints at a glance
    tag: rf-bp-card-split
    index: bp-card-split
    title: Split reads
    description: Median reads spanning the breakpoint itself.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: rnafusion
    data_collection_tag: arriba_fusions
    use: arriba/partner_chrom_sankey
    config:
      step_cols: [chrom_5p, chrom_3p]
      value_col: supporting_reads
      value_label: supporting reads
      value_format: count
      sort_mode: total_flow
      color_mode: source
      link_opacity: 0.55
    section: Partner contigs
    tag: rf-bp-sankey
    index: bp-sankey
    title: Partner contigs, 5' to 3'
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: rnafusion
    data_collection_tag: arriba_fusion_links
    use: arriba/partner_chords
    config:
      colour_by: category
      show_labels: true
      intra_chromosomal: true
      max_links: 200
    section: Partner contigs
    tag: rf-bp-chord
    index: bp-chord
    title: Breakpoints on the genome
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: figure
    workflow_tag: rnafusion
    data_collection_tag: arriba_fusions
    use: arriba/type_bars
    visu_type: bar
    dict_kwargs:
      x: fusion_type
      y: supporting_reads
      color: confidence
      labels: {fusion_type: Event class, supporting_reads: Supporting reads, confidence: Arriba confidence}
    section: Event classes
    tag: rf-bp-type-bars
    index: bp-type-bars
    title: Read support by event class
    description: Read support summed per structural class, split by Arriba's confidence.
    layout: {x: 0, y: 0, w: 4, h: 4, fit: auto}
  - component_type: figure
    workflow_tag: rnafusion
    data_collection_tag: arriba_fusions
    use: arriba/site_bars
