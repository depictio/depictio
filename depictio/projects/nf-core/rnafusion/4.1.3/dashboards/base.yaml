    section: Event classes
    tag: rf-bp-site-bars
    index: bp-site-bars
    title: Read support by breakpoint site
    description: Per transcript feature of the 5' breakpoint, split by the 3' one; two splice sites is the clean case.
    layout: {x: 4, y: 0, w: 4, h: 4, fit: auto}

- title: Validation
  subtitle: Which calls hold up when the reads are re-aligned?
  tab_group: Follow-up
  tab_order: 5
  tab_icon: mdi:check-decagram
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Validation filters
    icon: mdi:filter-variant
    color: grape
    description: Narrows the validated calls by predicted protein and abundance
  grid_sections:
  - name: Validation at a glance
    icon: mdi:counter
    color: grape
    description: Fusions that survived re-alignment, their abundance and support
  - name: Validated abundance
    icon: mdi:chart-scatter-plot
    color: grape
    description: Abundance after re-alignment, by predicted protein
  - name: Allelic ratio
    icon: mdi:scale-balance
    color: grape
    description: Fusion reads against wild-type reads on each side, and the call picked
  - name: Validated rows
    icon: mdi:table
    color: gray
    description: The FusionInspector rows the tiles above are computed from
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [FusionInspector](https://github.com/FusionInspector/FusionInspector) builds a contig
      for every candidate fusion and re-aligns the reads to it, so a call that survives rests
      on reads re-counted against the fusion itself. The fusion allelic ratio weighs the
      fusion reads against the wild-type reads competing on each side: a call supported on
      one side only falls off the diagonal of the scatter. Pick a point to read the call in
      the record beside it.
    tag: rf-valid-intro
    index: valid-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: rnafusion
    data_collection_tag: fusioninspector_fusions
    interactive_component_type: MultiSelect
    column_name: prot_fusion_type
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: grape
    section: Validation filters
    group: Validated calls
    tag: rf-valid-filter-prot
    index: valid-prot-filter
    title: Predicted protein
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: rnafusion
    data_collection_tag: fusioninspector_fusions
    interactive_component_type: RangeSlider
    column_name: ffpm
    column_type: float64
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: pink
    section: Validation filters
    group: Validated calls
    tag: rf-valid-filter-ffpm
    index: valid-ffpm-range
    title: Fragments per million
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: card
    workflow_tag: rnafusion
    data_collection_tag: fusioninspector_fusions
    use: fusioninspector/fusions
    aggregation: nunique
    column_name: fusion
    column_type: object
    secondary_layout: top_n
    breakdown_col: prot_fusion_type
    top_n_count: 3
    display:
      icon_name: mdi:check-decagram
      icon_color: grape
      caption: fusions, by predicted protein
    section: Validation at a glance
    tag: rf-valid-card-fusions
    index: valid-card-fusions
    title: Validated fusions
    description: Distinct fusions FusionInspector re-quantified.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnafusion
    data_collection_tag: fusioninspector_fusions
    use: fusioninspector/fusions
    aggregation: median
    column_name: ffpm
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.1
    threshold_direction: min
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: pink
      caption: median; at or above 0.1, STAR-Fusion's default floor
      decimals: 1
    section: Validation at a glance
    tag: rf-valid-card-ffpm
    index: valid-card-ffpm
    title: Fragments per million
    description: Median fusion fragments per million reads, after re-alignment.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnafusion
    data_collection_tag: fusioninspector_fusions
    use: fusioninspector/fusions
    aggregation: median
    column_name: junction_fraction
    column_type: float64
    filter_expr: col('supporting_reads') > 0
    # A share with no published floor: its distribution, not a gauge ("0.73 of 1").
    secondary_layout: histogram
    display:
      icon_name: mdi:bullseye-arrow
      icon_color: violet
      caption: median, 0 to 1, with its distribution
      decimals: 2
    section: Validation at a glance
    tag: rf-valid-card-junction
    index: valid-card-junction
    title: Junction-crossing share
    description: Median share of the support that crosses the fusion junction itself.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnafusion
    data_collection_tag: fusioninspector_fusions
    use: fusioninspector/fusions
    aggregation: median
    column_name: supporting_reads
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:counter
      icon_color: orange
      caption: median per breakpoint, with its spread
      decimals: 0
    section: Validation at a glance
    tag: rf-valid-card-support
    index: valid-card-support
    title: Re-aligned support
    description: Median junction reads plus spanning fragments after re-alignment.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: rnafusion
    data_collection_tag: fusioninspector_fusions
    use: fusioninspector/evidence_dot_plot
    config:
      colour_scale: Spectral
      reverse_scale: true
      gene_sort: mean
      max_dot_size: 22
      max_genes: 30
    section: Validated abundance
    tag: rf-valid-dotplot
    index: valid-dotplot
    title: Abundance by predicted protein
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: rnafusion
    data_collection_tag: fusioninspector_fusions
    use: fusioninspector/fusions
    visu_type: scatter
    mode: code
    code_content: |-
      # Fusion allelic ratio, 5' against 3', on log axes: a call supported on one
      # side only falls off the diagonal. A ratio of 0 has no place on a log axis,
      # so both are floored first.
      floor = 0.01
      d = df.with_columns(pl.max_horizontal(pl.col('far_left'), pl.lit(floor)).alias('far_5p'), pl.max_horizontal(pl.col('far_right'), pl.lit(floor)).alias('far_3p'))
      fig = px.scatter(d.to_pandas(), x='far_5p', y='far_3p', color='prot_fusion_type', size='supporting_reads', size_max=26, log_x=True, log_y=True, hover_name='fusion', custom_data=['fusion'], color_discrete_map=depictio_category_colors.get('prot_fusion_type') or {}, labels={'far_5p': "5' fusion allelic ratio", 'far_3p': "3' fusion allelic ratio", 'prot_fusion_type': 'Predicted protein', 'supporting_reads': 'Supporting reads'})
      fig.update_layout(margin=dict(t=10))
    selection_enabled: true
    selection_column: fusion
    section: Allelic ratio
    tag: rf-valid-far-scatter
    index: valid-far-scatter
    title: Fusion allelic ratio, both sides
    description: One point per validated breakpoint, sized by its read support. Pick one to read it beside.
    layout: {x: 0, y: 0, w: 5, h: 5}
  - component_type: advanced_viz
    workflow_tag: rnafusion
    data_collection_tag: fusioninspector_fusions
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: fusion
      title_col: fusion
      selection_source: any
      linked_component: rf-valid-far-scatter
      sections:
        Fusion: [fusion, sample, gene_5p, gene_3p, breakpoint_5p, breakpoint_3p, splice_type]
        Support: [junction_reads, spanning_frags, supporting_reads, ffpm, junction_fraction]
        Allelic ratio: [far_left, far_right, counter_fusion_left, counter_fusion_right, large_anchor_support]
        Protein: [prot_fusion_type, cds_left_id, cds_right_id, n_domains_5p, n_domains_3p]
    section: Allelic ratio
    tag: rf-valid-record
    index: valid-record
    title: Validated call record
    layout: {x: 5, y: 0, w: 3, h: 5}
  - component_type: table
    workflow_tag: rnafusion
    data_collection_tag: fusioninspector_fusions
    use: fusioninspector/fusions
    row_selection_enabled: true
    row_selection_column: fusion
    section: Validated rows
    tag: rf-valid-table
    index: valid-table
    title: FusionInspector validation
    layout: {x: 0, y: 0, w: 8, h: 6}

