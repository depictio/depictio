    config:
      min_count: 2
      top_n: 40
      log_width: true
    title: Junction arcs over the busiest loci
    description: Each arc is one splice junction, drawn from donor to acceptor and thickened by the reads crossing it. The locus picker opens on the busiest cluster; junctions under two reads are hidden.
    title_size: h3
    layout: {x: 0, y: 10, w: 8, h: 7}
