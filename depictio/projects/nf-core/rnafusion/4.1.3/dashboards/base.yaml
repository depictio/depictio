version: 1
# nf-core/rnafusion 4.1.3, on the family rules of depictio/projects/nf-core/RULES.md
# (ampliseq/2.18.0 is the reference implementation).
#
# The fusion is the unit of analysis: every fusion and splicing table carries
# the sample its file was written for, and fusion_consensus is the hub every
# caller table is linked to on `fusion`. Route flags are not read from
# params.json: a run that skipped a step passes the matching SKIP_* variable,
# and template.yaml prunes the data collections (and with them the tabs and
# Overview tiles) of that step.
main_dashboard:
  title: nf-core/rnafusion
  subtitle: Gene fusions, from the reads to the callers that agree and the proteins they would make
  project_tag: RNAfusion Gene Fusion Detection
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family. The run has no design
  # metadata (no GROUP_COL), so the colours are the pipeline's own vocabularies.
  category_colors:
    strandedness: auto
    # More callers agreeing reads darker; a single-caller call stays grey.
    tool_support:
      '*': auto
      3 callers: '#5f3dc4'
      2 callers: '#9775fa'
      1 caller: '#adb5bd'
    caller:
      '*': auto
      arriba: '#1098ad'
      starfusion: '#f76707'
      fusioncatcher: '#37b24d'
    confidence:
      '*': auto
      high: '#2f9e44'
      medium: '#f59f00'
      low: '#e03131'
    prot_fusion_type:
      '*': auto
      INFRAME: '#2f9e44'
      FRAMESHIFT: '#e03131'
      unknown: '#adb5bd'
    partner:
      5p: '#4263eb'
      3p: '#d6336c'
    # Arriba's event classes, under both names the two Arriba collections give
    # them, so the flow, the bars and the chord agree.
    fusion_type:
      '*': auto
      translocation: '#e8590c'
      inversion: '#1c7ed6'
      duplication: '#0ca678'
      deletion: '#ae3ec9'
      deletion/read-through: '#f783ac'
    category:
      '*': auto
      translocation: '#e8590c'
      inversion: '#1c7ed6'
      duplication: '#0ca678'
      deletion: '#ae3ec9'
      deletion/read-through: '#f783ac'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. The
  # sample filters are bound to the samplesheet, linked on `sample` to the
  # MultiQC report and every fusion and splicing table. The fusion filters fan
  # a pick out to every caller table through the `fusion` links; MultiQC and the
  # splice junctions carry no fusion, so those two tabs leave them out.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  - name: Fusion filters
    icon: mdi:dna
    color: indigo
    description: Applies to every tab that reads fusions
    persistent: true
    pin: top
    exclude_tabs:
    - MultiQC
    - Splice Junctions
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab, which no route can prune.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The samples the run was given, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Samples, below).
  - component_type: interactive
    workflow_tag: rnafusion
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: rf-ov-kf-sample
    index: ov-kf-sample
    title: Sample
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    interactive_component_type: MultiSelect
    column_name: tool_support
    column_type: object
    display:
      icon_name: mdi:set-merge
      custom_color: violet
      strip_label: Agreement
    section: Key figures
    tag: rf-ov-kf-agreement
    index: ov-kf-agreement
    title: Caller agreement
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: text
    title: nf-core/rnafusion
    logo: https://raw.githubusercontent.com/nf-core/rnafusion/master/docs/images/nf-core-rnafusion_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/rnafusion/master/docs/images/nf-core-rnafusion_logo_dark.png
    order: 1
    body: >
      RNA-seq reads searched for gene fusions by several callers, then pooled, ranked and
      checked against the fusion transcripts themselves. [Run parameters](params:)
    tag: rf-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/rnafusion searches RNA-seq reads for gene fusions with three callers, pools their calls with fusion-report and re-quantifies the survivors with FusionInspector. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The filters in the left panel apply to every tab they reach: narrow once and the dashboard follows. A bar above a section narrows that section only.
    tag: rf-ov-about
    index: ov-about
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash.
  - component_type: text
    surface: card
    values:
      samples: {dc: samplesheet, column: sample, aggregation: nunique, format: integer}
    body: |
      ### The run
      - ![](icon:mdi:flask-outline) **Samples** {{samples}}
      - ![](icon:mdi:dna) **Genome** {{param:genome}} · GENCODE {{param:genome_gencode_version}}
      - ![](icon:mdi:tools) **Callers** {{param:tools}}
      - ![](icon:mdi:set-merge) **Caller cut-off** {{param:tools_cutoff}}
    tag: rf-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  # The marks take the family's colour (the header's), not the theme's blue.
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Six steps from reads to fusion proteins
      Each step names its settings and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:content-cut) **Align** fastp trims, STAR aligns · [Settings](params:star) · [MultiQC](tab:MultiQC)
      2. ![](icon:mdi:magnify-scan) **Call** Three callers, one alignment · [Settings](params:tools) · [Evidence](tab:Caller Evidence)
      3. ![](icon:mdi:set-merge) **Pool** fusion-report ranks the calls · [Settings](params:tools_cutoff) · [Agreement](tab:Caller Agreement)
      4. ![](icon:mdi:check-decagram) **Validate** FusionInspector re-aligns · [Settings](params:fusioninspector) · [Validation](tab:Validation)
      5. ![](icon:mdi:shape-outline) **Annotate** Pfam domains per partner · [Settings](params:pfam) · [Domains](tab:Protein Domains)
      6. ![](icon:mdi:waves) **Splice** CTAT-splicing scores junctions · [Settings](params:ctatsplicing) · [Splicing](tab:Splice Junctions)
      :::
    tag: rf-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. The icon colour is that tab's colour.
  - component_type: card
    workflow_tag: rnafusion
    data_collection_tag: samplesheet
    aggregation: count
    column_name: sample
    column_type: object
    secondary_layout: composition
    breakdown_col: strandedness
    display:
      icon_name: mdi:flask-outline
      icon_color: orange
      caption: in the sample sheet, by strandedness
      link: tab:MultiQC
    section: Key figures
    tag: rf-ov-kf-samples
    index: ov-kf-samples
    title: Samples
    description: Samples in the sample sheet. The bar splits them by declared library strandedness.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    use: fusionreport/fusions
    aggregation: count
    column_name: fusion
    column_type: object
    secondary_layout: composition
    breakdown_col: tool_support
    display:
      icon_name: mdi:set-merge
      icon_color: violet
      caption: calls, by callers agreeing
      link: tab:Caller Agreement
    section: Key figures
    tag: rf-ov-kf-calls
    index: ov-kf-calls
    title: Fusion calls
    description: Fusions in the fusion-report consensus, one per fusion and sample. The bar splits them by how many callers agree.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnafusion
    data_collection_tag: caller_evidence
    use: fusionreport/caller_evidence
    aggregation: median
    column_name: supporting_reads
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:counter
      icon_color: teal
      caption: median per call and caller
      link: tab:Caller Evidence
      decimals: 0
    section: Key figures
    tag: rf-ov-kf-support
    index: ov-kf-support
    title: Read support
    description: Median reads a caller found for a fusion. The box shows how it spreads.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnafusion
    data_collection_tag: fusioninspector_fusions
    use: fusioninspector/fusions
    aggregation: count
    column_name: fusion
    column_type: object
    secondary_layout: composition
    breakdown_col: prot_fusion_type
    display:
      icon_name: mdi:check-decagram
      icon_color: grape
      caption: breakpoints, by predicted protein
      link: tab:Validation
    section: Key figures
    tag: rf-ov-kf-validated
    index: ov-kf-validated
    title: Validated calls
    description: Fusion breakpoints FusionInspector re-quantified. The bar splits them by the predicted fusion protein.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: interactive
    workflow_tag: rnafusion
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Sample
    section: Findings
    tag: rf-ov-findings-sample
    index: ov-findings-sample
    title: Sample
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    interactive_component_type: MultiSelect
    column_name: tool_support
    column_type: object
    display:
      icon_name: mdi:set-merge
      custom_color: violet
      strip_label: Agreement
    section: Findings
    tag: rf-ov-findings-agreement
    index: ov-findings-agreement
    title: Caller agreement
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data (no FusionInspector run, no Arriba).
  - component_type: text
    surface: card
    values:
      n_fusions: {dc: fusion_consensus, column: fusion, aggregation: nunique, format: integer}
      n_multi: {dc: fusion_consensus, column: fusion, aggregation: nunique, filter_expr: "col('n_tools') >= 2",
        format: integer}
      n_trans: {dc: arriba_fusions, column: fusion, aggregation: nunique, filter_expr: "col('chrom_5p') != col('chrom_3p')",
        format: integer}
      n_inframe: {dc: fusioninspector_fusions, column: fusion, aggregation: nunique, filter_expr: "col('prot_fusion_type') == 'INFRAME'",
        format: integer}
      n_valid: {dc: fusioninspector_fusions, column: fusion, aggregation: nunique, format: integer}
      n_cut: {dc: fusion_protein_domains, column: domain, aggregation: count, filter_expr: "col('domain').str.ends_with('-PARTIAL')",
        format: integer}
      n_dom: {dc: fusion_protein_domains, column: domain, aggregation: count, format: integer}
    body: |
      - **{{n_multi}}** of {{n_fusions}} fusions are found by two callers or more – caller agreement [Agreement](tab:Caller Agreement)
      - **{{n_trans}}** Arriba calls join two chromosomes – translocations [Breakpoints](tab:Breakpoints)
      - **{{n_inframe}}** of {{n_valid}} validated fusions keep the reading frame – FusionInspector [Validation](tab:Validation)
      - **{{n_cut}}** of {{n_dom}} Pfam domain hits are cut by the breakpoint – partner domains [Domains](tab:Protein Domains)
    section: Findings
    tag: rf-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per analysis tab, in the order of the rows above. The import
  # drops a highlight whose source is gone and re-packs the grid.
  - component_type: highlight
    section: Findings
    source_tab: Caller Agreement
    source_component: agree-upset
    caption: Each bar counts the fusions found by exactly that combination of callers; the darker, the more callers agree.
    tag: rf-ov-hl-upset
    index: ov-hl-upset
    layout: {x: 0, y: 2, w: 5, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Breakpoints
    source_component: bp-chord
    caption: Each chord joins the two breakpoints of an Arriba call, coloured by event class.
    tag: rf-ov-hl-chord
    index: ov-hl-chord
    layout: {x: 5, y: 2, w: 3, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Validation
    source_component: valid-far-scatter
    caption: One point per validated breakpoint; high on both axes, little wild-type competition on either side.
    tag: rf-ov-hl-far
    index: ov-hl-far
    layout: {x: 0, y: 7, w: 3, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Protein Domains
    source_component: dom-structure
    caption: The fusions with the most Pfam domains, each drawn as its two partners end to end.
    tag: rf-ov-hl-structure
    index: ov-hl-structure
    layout: {x: 3, y: 7, w: 5, h: 5}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers. A tab the run does not have is left out, and a heading whose
  # tabs are all missing is hidden.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)

      ### Fusion calls
      - [Caller Agreement](tab:Caller Agreement)
      - [Caller Evidence](tab:Caller Evidence)
      - [Breakpoints](tab:Breakpoints)

      ### Follow-up
      - [Validation](tab:Validation)
      - [Protein Domains](tab:Protein Domains)
      - [Splice Junctions](tab:Splice Junctions)
    section: How to read this dashboard
    tag: rf-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters: the sample, then the declared strandedness.
  - component_type: interactive
    workflow_tag: rnafusion
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: rf-filter-sample
    index: sample-filters-sample
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: rnafusion
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: strandedness
    column_type: object
    display:
      icon_name: mdi:swap-vertical
      custom_color: cyan
    section: Sample filters
    group: Sample scope
    tag: rf-filter-strandedness
    index: sample-filters-strandedness
    title: Strandedness
    layout: {x: 0, y: 3, w: 1, h: 2}
  # Persistent fusion filters, on the hub every caller table is linked to.
  - component_type: interactive
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    interactive_component_type: MultiSelect
    column_name: fusion
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: indigo
    section: Fusion filters
    group: Fusions
    tag: rf-filter-fusion
    index: fusion-filters-fusion
    title: Fusion
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    interactive_component_type: MultiSelect
    column_name: tool_support
    column_type: object
    display:
      icon_name: mdi:set-merge
      custom_color: violet
    section: Fusion filters
    group: Fusions
    tag: rf-filter-agreement
    index: fusion-filters-agreement
    title: Caller agreement
    layout: {x: 0, y: 3, w: 1, h: 2}
  # Row selection on the sample narrows every tab through the sample links.
  - component_type: table
    workflow_tag: rnafusion
    data_collection_tag: samplesheet
    row_selection_enabled: true
    row_selection_column: sample
    section: Sample sheet
    tag: rf-sample-sheet
    index: sample-sheet
    title: Sample sheet
    layout: {x: 0, y: 0, w: 8, h: 6}

tabs:
- title: MultiQC
  subtitle: Did the reads survive trimming and align to transcripts?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: MultiQC report
    icon: mdi:file-document-outline
    color: orange
    description: Samples as the MultiQC report names them
  grid_sections:
  - name: QC overview
    icon: mdi:chart-box-outline
    color: orange
    description: One row per sample, the headline numbers of every QC module
  - name: Reads
    icon: mdi:chart-bell-curve
    color: orange
    description: Base quality of the raw reads, and how many fastp kept
  - name: Alignment
    icon: mdi:dna
    color: orange
    description: Where STAR placed the reads, and which transcript regions they landed in
  - name: QC details
    icon: mdi:file-document-outline
    color: gray
    description: Trimmed read quality, insert size, gene body coverage and gene counts
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [MultiQC](https://multiqc.info) gathers the
      [FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/),
      [fastp](https://github.com/OpenGene/fastp), [STAR](https://github.com/alexdobin/STAR)
      and [Picard](https://broadinstitute.github.io/picard/) reports of every sample. A
      fusion call rests on reads that crossed a breakpoint, so check that the reads survived
      trimming and aligned to transcripts before trusting any call. FastQC runs twice, on the
      raw reads and after trimming; the second pass is the fastqc-1 panels.
    tag: rf-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: MultiQC report
    tag: rf-mqc-filter-sample
    index: mqc-sample-filter
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: multiqc
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: QC overview
    tag: rf-mqc-general-stats
    title: General statistics
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    section: Reads
    tag: rf-mqc-fastqc-quality
    title: Raw read quality
    description: Mean quality at each base position, before trimming.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    use: multiqc/fastp
    selected_module: fastp
    selected_plot: Filtered Reads
    section: Reads
    tag: rf-mqc-fastp-filtered
    title: Reads kept by fastp
    description: How many read pairs passed trimming and quality filtering.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    use: multiqc/star
    selected_module: star
    selected_plot: Alignment Scores
    section: Alignment
    tag: rf-mqc-star-alignment
    title: STAR alignment
    description: Uniquely mapped, multi-mapped and unmapped reads per sample.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    use: multiqc/picard
    selected_module: picard
    selected_plot: RnaSeqMetrics Assignment
    section: Alignment
    tag: rf-mqc-picard-assignment
    title: Where the bases landed
    description: Coding, UTR, intronic, intergenic and ribosomal share of the aligned bases.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc-1
    selected_plot: Per Sequence Quality Scores
    section: QC details
    tag: rf-mqc-fastqc-trimmed
    title: Trimmed read quality
    description: Distribution of the mean quality per read, after trimming.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    use: multiqc/picard
    selected_module: picard
    selected_plot: Insert Size
    section: QC details
    tag: rf-mqc-picard-insert
    title: Insert size
    description: A short insert limits how far a discordant mate can reach across a breakpoint.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    use: multiqc/picard
    selected_module: picard
    selected_plot: Gene Coverage
    section: QC details
    tag: rf-mqc-picard-coverage
    title: Coverage along the gene body
    description: Normalised coverage from the 5' to the 3' end of the transcripts.
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    use: multiqc/star
    selected_module: star
    selected_plot: Gene Counts
    section: QC details
    tag: rf-mqc-star-genecounts
    title: STAR gene counts
    description: Reads STAR assigned to a gene rather than to no feature or several.
    layout: {x: 4, y: 4, w: 4, h: 4}

- title: Caller Agreement
  subtitle: Which fusions did the callers agree on, and how are they ranked?
  tab_group: Fusion calls
  tab_order: 2
  tab_icon: mdi:set-merge
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Agreement filters
    icon: mdi:filter-variant
    color: violet
    description: Narrows the consensus by score, rank, knowledge bases and partner
  grid_sections:
  - name: Agreement at a glance
    icon: mdi:counter
    color: violet
    description: Fusions called, how many callers agree and what the knowledge bases know
  - name: Caller concordance
    icon: mdi:set-merge
    color: violet
    description: The fusions each combination of callers found
  - name: Ranked fusions
    icon: mdi:chart-bar
    color: violet
    description: The fusions fusion-report ranks highest, by their index
  - name: Consensus table
    icon: mdi:table
    color: gray
    description: The fusion-report consensus, one row per fusion and sample
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [fusion-report](https://github.com/Clinical-Genomics/fusion-report) pools the calls of
      every caller into one table per sample and ranks them by the Fusion Indication Index,
      which weighs caller agreement against how many knowledge bases already list the pair.
      The UpSet counts the fusions each combination of callers found, and the ranked view
      puts them in fusion-report's order. A fusion several callers agree on is the first to
      trust.
    tag: rf-agree-intro
    index: agree-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    interactive_component_type: RangeSlider
    column_name: fii
    column_type: float64
    display:
      icon_name: mdi:trophy
      custom_color: grape
    section: Agreement filters
    group: Ranking
    tag: rf-agree-filter-fii
    index: agree-fii-range
    title: Fusion Indication Index
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    interactive_component_type: RangeSlider
    column_name: rank
    column_type: int64
    display:
      icon_name: mdi:sort-numeric-ascending
      custom_color: blue
    section: Agreement filters
    group: Ranking
    tag: rf-agree-filter-rank
    index: agree-rank-range
    title: Rank in the sample
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    interactive_component_type: RangeSlider
    column_name: n_databases
    column_type: int64
    display:
      icon_name: mdi:database-outline
      custom_color: orange
    section: Agreement filters
    group: Knowledge bases
    tag: rf-agree-filter-ndatabases
    index: agree-ndatabases-range
    title: Knowledge bases listing it
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    interactive_component_type: MultiSelect
    column_name: databases
    column_type: object
    display:
      icon_name: mdi:book-open-variant
      custom_color: yellow
    section: Agreement filters
    group: Knowledge bases
    tag: rf-agree-filter-databases
    index: agree-databases-filter
    title: Knowledge bases
    layout: {x: 0, y: 9, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    interactive_component_type: MultiSelect
    column_name: gene_5p
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: pink
    section: Agreement filters
    group: Partners
    tag: rf-agree-filter-gene5p
    index: agree-gene5p-filter
    title: 5' partner gene
    layout: {x: 0, y: 12, w: 1, h: 3}
  # Ranked by the 5' partner: a gene in several fusions is a promiscuous
  # partner. A uniqueness strip read 100% distinct on any one-sample run.
  - component_type: card
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    use: fusionreport/fusions
    aggregation: nunique
    column_name: fusion
    column_type: object
    secondary_layout: top_n
    breakdown_col: gene_5p
    top_n_count: 3
    display:
      icon_name: mdi:dna
      icon_color: indigo
      caption: distinct, the 5' partners in most fusions
    section: Agreement at a glance
    tag: rf-agree-card-fusions
    index: agree-card-fusions
    title: Distinct fusions
    description: Distinct fusions in the consensus; the bars rank the 5' partner genes found in most of them.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    use: fusionreport/fusions
    aggregation: count
    column_name: fusion
    column_type: object
    secondary_layout: donut
    breakdown_col: tool_support
    display:
      icon_name: mdi:set-merge
      icon_color: violet
      caption: calls, by callers agreeing
    section: Agreement at a glance
    tag: rf-agree-card-agreement
    index: agree-card-agreement
    title: Caller agreement
    description: Calls, one per fusion and sample, split by how many of the run's callers reported them.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    use: fusionreport/fusions
    aggregation: median
    column_name: fii
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:trophy
      icon_color: grape
      caption: median, with its spread
      decimals: 2
    section: Agreement at a glance
    tag: rf-agree-card-fii
    index: agree-card-fii
    title: Fusion Indication Index
    description: Median score fusion-report ranks by, from 0 to 1.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    use: fusionreport/fusions
    aggregation: count
    column_name: fusion
    column_type: object
    filter_expr: col('n_databases') > 0
    secondary_layout: composition
    breakdown_col: databases
    display:
      icon_name: mdi:book-open-variant
      icon_color: orange
      caption: calls, by the bases listing them
    section: Agreement at a glance
    tag: rf-agree-card-known
    index: agree-card-known
    title: Known fusions
    description: Calls at least one fusion knowledge base already lists.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    use: fusionreport/caller_upset
    config:
      # Every 0/1 caller flag the recipe derived from the run, whatever the
      # callers; the three count columns that can also read 0/1 are excluded.
      set_columns_pattern: "^(?!(n_databases|n_tools|rank)$)"
      sort_by: cardinality
      sort_order: descending
      min_size: 1
      show_set_sizes: true
      color_intersections_by: degree
      show_values: true
    section: Caller concordance
    tag: rf-agree-upset
    index: agree-upset
    title: Fusions per combination of callers
    layout: {x: 0, y: 0, w: 8, h: 5}
  # The ranking as bars, the fusion names on the axis. The lollipop it
  # replaced drew one fusion per lane, so past six fusions it showed a single
  # stem behind a fusion picker.
  - component_type: figure
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    use: fusionreport/fusions
    visu_type: bar
    mode: code
    code_content: |-
      # Each fusion at its highest index over the samples in view, the 30 highest
      # first, coloured by how many callers agree (by the groups in Analysis mode).
      keys = [*depictio_group_by, 'fusion']
      d = df.group_by(keys).agg(pl.col('fii').max().alias('fii'), pl.col('tool_support').sort_by('n_tools').last().alias('tool_support'), pl.col('sample').n_unique().alias('samples'))
      order = d.group_by('fusion').agg(pl.col('fii').max()).sort(['fii', 'fusion'], descending=[True, False]).head(30)['fusion'].to_list()
      d = d.filter(pl.col('fusion').is_in(order))
      colour = depictio_group_kwargs or {'color': 'tool_support', 'color_discrete_map': depictio_category_colors.get('tool_support') or {}, 'category_orders': {'tool_support': ['3 callers', '2 callers', '1 caller']}}
      fig = px.bar(d.to_pandas(), x='fusion', y='fii', hover_data=['samples'], custom_data=['fusion'], labels={'fusion': 'Fusion', 'fii': 'Fusion Indication Index', 'tool_support': 'Callers agreeing', 'samples': 'Samples'}, **colour)
      fig.update_layout(barmode='group', margin=dict(t=10))
      fig.update_xaxes(categoryorder='array', categoryarray=order, tickangle=-40, automargin=True)
    selection_enabled: true
    selection_column: fusion
    section: Ranked fusions
    tag: rf-agree-ranked
    index: agree-ranked
    title: Fusions by the index, highest first
    description: The 30 highest-ranked fusions, coloured by how many callers agree. Select bars to filter the dashboard.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    use: fusionreport/fusions
    row_selection_enabled: true
    row_selection_column: fusion
    section: Consensus table
    tag: rf-agree-table
    index: agree-table
    title: fusion-report consensus
    layout: {x: 0, y: 0, w: 8, h: 6}

- title: Caller Evidence
  subtitle: How much read support did each caller find for each fusion?
  tab_group: Fusion calls
  tab_order: 3
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Evidence filters
    icon: mdi:filter-variant
    color: teal
    description: Narrows the evidence rows by caller and read support
  grid_sections:
  - name: Evidence at a glance
    icon: mdi:counter
    color: teal
    description: Reports per caller, the reads behind them and how the support splits
  - name: Support across callers
    icon: mdi:chart-scatter-plot
    color: teal
    description: Read support per fusion and caller, on one comparable scale
  - name: Arriba against STAR-Fusion
    icon: mdi:chart-scatter-plot
    color: teal
    description: The two split-read callers face to face, one point per fusion
  - name: Per caller detail
    icon: mdi:dna
    color: gray
    description: Each caller's own evidence, on its own terms
    collapsed: true
  - name: Caller tables
    icon: mdi:table
    color: gray
    description: The per-caller evidence rows and each caller's raw calls
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [Arriba](https://github.com/suhrig/arriba),
      [STAR-Fusion](https://github.com/STAR-Fusion/STAR-Fusion) and
      [FusionCatcher](https://github.com/ndaniel/fusioncatcher) count reads their own way,
      so each caller's evidence is summed into one supporting-read figure per fusion. In the
      dot plot, colour is that figure on a log scale and size the caller's share of the
      fusion's support; an empty cell is a fusion the caller never reported. The scatter sets
      Arriba against STAR-Fusion: a point far off the diagonal is a fusion the two weigh
      differently.
    tag: rf-evid-intro
    index: evid-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: rnafusion
    data_collection_tag: caller_evidence
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:tools
      custom_color: green
    section: Evidence filters
    group: Callers
    tag: rf-evid-filter-caller
    index: evid-caller-filter
    title: Caller
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: rnafusion
    data_collection_tag: caller_evidence
    interactive_component_type: RangeSlider
    column_name: supporting_reads
    column_type: int64
    display:
      icon_name: mdi:counter
      custom_color: blue
    section: Evidence filters
    group: Read support
    tag: rf-evid-filter-reads
    index: evid-reads-range
    title: Supporting reads
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: rnafusion
    data_collection_tag: caller_evidence
    interactive_component_type: RangeSlider
    column_name: evidence_fraction
    column_type: float64
    display:
      icon_name: mdi:scale-balance
      custom_color: orange
    section: Evidence filters
    group: Read support
    tag: rf-evid-filter-fraction
    index: evid-fraction-range
    title: Caller share
    layout: {x: 0, y: 5, w: 1, h: 3}
  # One row per fusion, sample and caller: a report. Counted reports are parts
  # of a whole, so they take the ring.
  - component_type: card
    workflow_tag: rnafusion
    data_collection_tag: caller_evidence
    use: fusionreport/caller_evidence
    aggregation: count
    column_name: fusion
    column_type: object
    secondary_layout: donut
    breakdown_col: caller
    display:
      icon_name: mdi:account-group-outline
      icon_color: teal
      caption: reports, by caller
    section: Evidence at a glance
    tag: rf-evid-card-reports
    index: evid-card-reports
    title: Caller reports
    description: Fusions reported by a caller in a sample, one per fusion, sample and caller.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnafusion
    data_collection_tag: caller_evidence
    use: fusionreport/caller_evidence
    aggregation: median
    column_name: supporting_reads
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:counter
      icon_color: blue
      caption: median per report, with its spread
      decimals: 0
    section: Evidence at a glance
    tag: rf-evid-card-support
    index: evid-card-support
    title: Supporting reads
    description: Median reads a caller found for a fusion.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnafusion
    data_collection_tag: caller_evidence
    use: fusionreport/caller_evidence
    aggregation: sum
    column_name: supporting_reads
    column_type: int64
    # Split by caller rather than ranked by fusion: fusion names are cut at a
    # card's width. Beside the reports ring, it shows which caller counts more.
    secondary_layout: composition
    breakdown_col: caller
    display:
      icon_name: mdi:sigma
      icon_color: cyan
      caption: reads, by caller
    section: Evidence at a glance
    tag: rf-evid-card-total
    index: evid-card-total
    title: Total read support
    description: Reads summed over every caller and fusion; the bar splits them by the caller that counted them.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # A share from 0 to 1 with no published floor: its distribution, not a gauge
  # (which prints "0.35 of 1"). A report without counted reads has no share.
  - component_type: card
    workflow_tag: rnafusion
    data_collection_tag: caller_evidence
    use: fusionreport/caller_evidence
    aggregation: median
    column_name: evidence_fraction
    column_type: float64
    filter_expr: col('supporting_reads') > 0
    secondary_layout: histogram
    display:
      icon_name: mdi:scale-balance
      icon_color: orange
      caption: median share of a fusion's reads, with its distribution
      decimals: 2
    section: Evidence at a glance
    tag: rf-evid-card-share
    index: evid-card-share
    title: Caller share
    description: Median share of a fusion's reads that one caller accounts for, from 0 to 1.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: rnafusion
    data_collection_tag: caller_evidence
    use: fusionreport/evidence_dot_plot
    config:
      colour_scale: Viridis
      gene_sort: mean
      cluster_sort: name
      max_dot_size: 24
      max_genes: 30
    section: Support across callers
    tag: rf-evid-dotplot
    index: evid-dotplot
    title: Read support per fusion and caller
    layout: {x: 0, y: 0, w: 8, h: 6}
  # Spreads the group kwargs when Analysis mode has groups (the keys keep the
  # group column through the pivot), else colours by the index.
  - component_type: figure
    workflow_tag: rnafusion
    data_collection_tag: caller_evidence
    use: fusionreport/caller_evidence
    visu_type: scatter
    mode: code
    code_content: |-
      # The two split-read callers face each other on log axes, reads + 1 so a
      # fusion one caller missed sits on the other's edge; FusionCatcher is the
      # marker size, the dotted diagonal equal support.
      keys = [*depictio_group_by, 'sample', 'fusion']
      wide = df.pivot(on='caller', index=keys, values='supporting_reads', aggregate_function='sum').fill_null(0)
      for caller in ('arriba', 'starfusion', 'fusioncatcher'):
          if caller not in wide.columns:
              wide = wide.with_columns(pl.lit(0).alias(caller))
      fii = df.group_by(keys).agg(pl.col('fii').max().alias('fii'))
      wide = wide.join(fii, on=keys, how='left').with_columns(pl.col('fii').fill_null(0.0), (pl.col('arriba') + 1).alias('arriba_1'), (pl.col('starfusion') + 1).alias('starfusion_1'))
      colour = depictio_group_kwargs or {'color': 'fii', 'color_continuous_scale': 'Tealgrn'}
      size = 'fusioncatcher' if wide['fusioncatcher'].sum() > 0 else None
      fig = px.scatter(wide.to_pandas(), x='arriba_1', y='starfusion_1', size=size, size_max=28, log_x=True, log_y=True, hover_name='fusion', hover_data=['sample', 'arriba', 'starfusion'], custom_data=['fusion'], labels={'arriba_1': 'Arriba supporting reads + 1', 'starfusion_1': 'STAR-Fusion supporting reads + 1', 'arriba': 'Arriba reads', 'starfusion': 'STAR-Fusion reads', 'fusioncatcher': 'FusionCatcher reads', 'fii': 'FII'}, **colour)
      top = max(wide['arriba_1'].max(), wide['starfusion_1'].max())
      fig.add_scatter(x=[1, top], y=[1, top], mode='lines', line=dict(dash='dot', width=1), hoverinfo='skip', showlegend=False)
      fig.update_layout(margin=dict(t=10))
    selection_enabled: true
    selection_column: fusion
    section: Arriba against STAR-Fusion
    tag: rf-evid-scatter
    index: evid-scatter
    title: Arriba against STAR-Fusion
    description: One point per fusion and sample on log axes, sized by FusionCatcher's support. Select points to filter the dashboard.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: rnafusion
    data_collection_tag: arriba_fusions
    use: arriba/evidence_dot_plot
    config:
      colour_scale: Plasma
      gene_sort: mean
      max_dot_size: 22
      max_genes: 30
    section: Per caller detail
    tag: rf-evid-arriba-dot
    index: evid-arriba-dot
    title: Arriba, by confidence
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: rnafusion
    data_collection_tag: starfusion_fusions
    use: starfusion/evidence_dot_plot
    config:
      colour_scale: Cividis
      gene_sort: mean
      max_dot_size: 22
      max_genes: 30
    section: Per caller detail
    tag: rf-evid-starfusion-dot
    index: evid-starfusion-dot
    title: STAR-Fusion, by splice type
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: rnafusion
    data_collection_tag: fusioncatcher_fusions
    use: fusioncatcher/evidence_dot_plot
    config:
      colour_scale: Magma
      gene_sort: mean
      max_dot_size: 22
      max_genes: 30
    section: Per caller detail
    tag: rf-evid-fusioncatcher-dot
    index: evid-fusioncatcher-dot
    title: FusionCatcher, by predicted effect
    layout: {x: 0, y: 12, w: 8, h: 6}
  - component_type: table
    workflow_tag: rnafusion
    data_collection_tag: caller_evidence
    use: fusionreport/caller_evidence
    row_selection_enabled: true
    row_selection_column: fusion
    section: Caller tables
    tag: rf-evid-table-evidence
    index: evid-table-evidence
    title: Per-caller evidence
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: rnafusion
    data_collection_tag: arriba_fusions
    use: arriba/fusions
    row_selection_enabled: true
    row_selection_column: fusion
    section: Caller tables
    tag: rf-evid-table-arriba
    index: evid-table-arriba
    title: Arriba calls
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: table
    workflow_tag: rnafusion
    data_collection_tag: starfusion_fusions
    use: starfusion/fusions
    row_selection_enabled: true
    row_selection_column: fusion
    section: Caller tables
    tag: rf-evid-table-starfusion
    index: evid-table-starfusion
    title: STAR-Fusion calls
    layout: {x: 0, y: 12, w: 8, h: 6}
  - component_type: table
    workflow_tag: rnafusion
    data_collection_tag: fusioncatcher_fusions
    use: fusioncatcher/fusion_genes
    row_selection_enabled: true
    row_selection_column: fusion
    section: Caller tables
    tag: rf-evid-table-fusioncatcher
    index: evid-table-fusioncatcher
