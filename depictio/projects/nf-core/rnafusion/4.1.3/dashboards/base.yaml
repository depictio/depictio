    section: Support across callers
    workflow_tag: rnafusion
    data_collection_tag: caller_evidence
    use: fusionreport/evidence_dot_plot
    config:
      colour_scale: Viridis
      gene_sort: mean
      cluster_sort: name
      max_dot_size: 24
      max_genes: 30
    title: Read support per fusion and caller
    description: One dot per fusion and caller. Colour is log10 read support, size is that caller's share of the fusion's total support. An empty column means the caller never reported the fusion.
    title_size: h3
    layout: {x: 0, y: 3, w: 8, h: 7}
  - component_type: figure
    tag: rnaf-ev-scatter
    index: rnaf-ev-scatter
    section: Support across callers
    workflow_tag: rnafusion
    data_collection_tag: caller_evidence
    mode: code
    code_content: |
      # Pivot the long evidence table so the two split-read callers face each
      # other on one plane; FusionCatcher rides along as the marker size.
      wide = df.pivot(
          on='caller', index='fusion', values='supporting_reads',
          aggregate_function='sum',
      ).fill_null(0)
      for caller in ('arriba', 'starfusion', 'fusioncatcher'):
          if caller not in wide.columns:
              wide = wide.with_columns(pl.lit(0).alias(caller))
      wide = wide.join(
          df.group_by('fusion').agg(pl.col('fii').max().alias('fii')),
          on='fusion', how='left',
      ).with_columns(pl.col('fii').fill_null(0.0))

      fig = px.scatter(
          wide.to_pandas(), x='arriba', y='starfusion', color='fii',
          size='fusioncatcher', size_max=28, hover_name='fusion',
          custom_data=['fusion'], color_continuous_scale='Tealgrn',
      )
      fig.update_layout(
          xaxis_title='Arriba supporting reads',
          yaxis_title='STAR-Fusion supporting reads',
          coloraxis_colorbar_title_text='FII',
          margin={'t': 24, 'l': 64, 'r': 16, 'b': 48},
      )
    selection_enabled: true
    selection_column: fusion
    title: Arriba against STAR-Fusion
    description: One point per fusion; size is the FusionCatcher support, colour the Fusion Indication Index. Points off the diagonal are the fusions the two callers weigh differently. Select points to filter the dashboard.
    title_size: h3
    layout: {x: 0, y: 10, w: 8, h: 6}

