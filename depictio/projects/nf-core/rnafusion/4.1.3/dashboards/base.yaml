version: 1
main_dashboard:
  title: nf-core/rnafusion
  subtitle: Read and alignment QC before the fusion calls, from FastQC, fastp, STAR and Picard
  project_tag: RNAfusion Gene Fusion Detection
  main_tab_name: Quality control
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # Two persistent filter groups, because this dashboard has two units. The
  # sample filter drives the MultiQC panels, the only place a sample means
  # anything: rnafusion writes one file per tool per sample and none of those
  # files carries a sample column, so every fusion collection is keyed on the
  # FUSION instead. The fusion filter is what fans out through the template
  # links to every caller, and it survives tab switches.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Narrows the MultiQC panels
    persistent: true
    pin: top
  - name: Fusion scope
    icon: mdi:tune
    color: indigo
    description: Applies to every fusion tab
    persistent: true
    pin: top
  - name: Read QC scope
    icon: mdi:chart-bell-curve
    color: orange
    description: Library properties behind the read panels
    collapsed: true
  # `Sample sheet` is pinned to the top and `Reference tables` to the bottom, so
  # the run metadata and the rows every tile is computed from trail each tab.
  # Both are declared here, on the tab no route conditional can remove.
  grid_sections:
  - name: Alignment at a glance
    icon: mdi:chart-box-outline
    color: orange
    description: Where the reads went, before any fusion is called
  - name: Read quality
    icon: mdi:chart-bell-curve
    color: orange
    description: Base quality and read yield, raw and after trimming
  - name: Library metrics
    icon: mdi:ruler
    color: blue
    description: Insert size, duplication and coverage along the transcript
    collapsed: true
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The samples the run was given
    collapsed: true
    persistent: true
    pin: top
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The rows behind every tile, on every tab
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # ------------------------------------------------------ alignment at a glance
  - component_type: text
    tag: rnaf-qc-intro
    section: Alignment at a glance
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    title: Read this tab before you trust a fusion
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A fusion call is only as good as the alignment under it. STAR has to place
      reads across the breakpoint, and Picard says whether those reads landed on
      transcripts at all. Everything on the later tabs is built from what
      survives here.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: rnaf-qc-general-stats
    section: Alignment at a glance
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    selected_module: general_stats
    selected_plot: general_stats
    title: General statistics
    description: One row per sample, pooling the FastQC, fastp, STAR and Picard headline numbers.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 4}
  - component_type: multiqc
    tag: rnaf-qc-star-alignment
    section: Alignment at a glance
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    selected_module: star
    selected_plot: Alignment Scores
    use: multiqc/star
    title: STAR alignment scores
    description: Uniquely mapped, multi-mapped and unmapped reads per sample.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 5, w: 4, h: 5}
  - component_type: multiqc
    tag: rnaf-qc-picard-assignment
    section: Alignment at a glance
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    selected_module: picard
    selected_plot: RnaSeqMetrics Assignment
    use: multiqc/picard
    title: Where the bases landed
    description: Coding, UTR, intronic, intergenic and ribosomal share of the aligned bases.
    title_size: sm
    title_align: left
    layout: {x: 4, y: 5, w: 4, h: 5}

  # ---------------------------------------------------------------- read quality
  - component_type: text
    tag: rnaf-qc-reads-intro
    section: Read quality
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    title: Before and after trimming
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      rnafusion runs FastQC twice, on the raw reads and again after fastp. The
      second pass is anchored as fastqc-1 in the report, so the two panels below
      are the same measurement either side of trimming.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: rnaf-qc-fastqc-quality
    section: Read quality
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    use: multiqc/fastqc
    title: Raw read quality
    description: Mean quality at each base position, before trimming.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: rnaf-qc-fastp-filtered
    section: Read quality
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    selected_module: fastp
    selected_plot: Filtered Reads
    use: multiqc/fastp
    title: Reads kept by fastp
    description: How many read pairs passed trimming and quality filtering.
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: rnaf-qc-fastqc-trimmed
    section: Read quality
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    selected_module: fastqc-1
    selected_plot: Per Sequence Quality Scores
    use: multiqc/fastqc
    title: Trimmed read quality
    description: Distribution of the mean quality per read after trimming.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 6, w: 8, h: 5}

  # ------------------------------------------------------------- library metrics
  - component_type: text
    tag: rnaf-qc-library-intro
    section: Library metrics
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    title: What the library looks like
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A short insert size limits how far a discordant mate can reach across a
      breakpoint, and heavy duplication inflates the read counts every caller
      reports. Coverage along the gene body shows any degradation bias.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: rnaf-qc-picard-insert
    section: Library metrics
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    selected_module: picard
    selected_plot: Insert Size
    use: multiqc/picard
    title: Insert size distribution
    description: Fragment-length distribution from Picard CollectInsertSizeMetrics.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: rnaf-qc-picard-coverage
    section: Library metrics
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    selected_module: picard
    selected_plot: Gene Coverage
    use: multiqc/picard
    title: Coverage along the gene body
    description: Normalised coverage from the 5' to the 3' end of the transcript.
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: rnaf-qc-star-genecounts
    section: Library metrics
    workflow_tag: rnafusion
    data_collection_tag: multiqc_data
    selected_module: star
    selected_plot: Gene Counts
    use: multiqc/star
    title: STAR gene-count assignment
    description: How many reads STAR assigned to genes rather than to no feature or several.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 6, w: 8, h: 5}

  # ------------------------------------------------------------------ samplesheet
  - component_type: table
    tag: rnaf-table-samplesheet
    section: Sample sheet
    workflow_tag: rnafusion
    data_collection_tag: samplesheet
    row_selection_enabled: true
    row_selection_column: sample
    title: Run samplesheet
    description: The samples the run was given, with the declared library strandedness.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 3}

  # -------------------------------------------------------------- reference tables
  - component_type: text
    tag: rnaf-ref-intro
    section: Reference tables
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    title: The rows behind every tile
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The consensus, evidence, validation and splice-junction rows every panel
      above is computed from. Filters picked in the left panel narrow these
      tables too, and a row selected here narrows the tiles.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: table
    tag: rnaf-ref-table-consensus
    section: Reference tables
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    use: fusionreport/fusions
    row_selection_enabled: true
    row_selection_column: fusion
    title: fusion-report consensus
    description: Every fusion the run called, with its knowledge-base hits and caller flags.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 4}
  - component_type: table
    tag: rnaf-ref-table-evidence
    section: Reference tables
    workflow_tag: rnafusion
    data_collection_tag: caller_evidence
    use: fusionreport/caller_evidence
    row_selection_enabled: true
    row_selection_column: fusion
    title: Per-caller evidence
    description: One row per fusion and caller, with the raw evidence string.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 5, w: 4, h: 4}
  - component_type: table
    tag: rnaf-ref-table-fi
    section: Reference tables
    workflow_tag: rnafusion
    data_collection_tag: fusioninspector_fusions
    use: fusioninspector/fusions
    row_selection_enabled: true
    row_selection_column: fusion
    title: FusionInspector validation
    description: The calls re-quantified against a fusion contig reference.
    title_size: h3
    title_align: left
    layout: {x: 4, y: 5, w: 4, h: 4}
  - component_type: table
    tag: rnaf-ref-table-junctions
    section: Reference tables
    workflow_tag: rnafusion
    data_collection_tag: splice_junctions
    use: ctatsplicing/introns
    row_selection_enabled: false
    title: Splice junctions
    description: Every junction CTAT-splicing scored, with its read support.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 9, w: 8, h: 4}

  # ---------------------------------------------------------------- left panel
  - component_type: interactive
    tag: rnaf-filter-sample
    index: rnaf-sample-filter
    section: Sample filters
    group: Samples
    workflow_tag: rnafusion
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display: {title_size: md, custom_color: '#26A69A', icon_name: 'mdi:test-tube'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: rnaf-filter-fusion
    index: rnaf-fusion-filter
    section: Fusion scope
    group: Fusions
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    interactive_component_type: MultiSelect
    column_name: fusion
    column_type: object
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:dna'}
    placement: left
    title: Fusion
    layout: {x: 0, y: 0, w: 1, h: 4}
  - component_type: interactive
    tag: rnaf-filter-support
    index: rnaf-support-filter
    section: Fusion scope
    group: Fusions
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    interactive_component_type: MultiSelect
    column_name: tool_support
    column_type: object
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:set-merge'}
    placement: left
    title: Caller agreement
    layout: {x: 0, y: 4, w: 1, h: 3}
  - component_type: interactive
    tag: rnaf-filter-fii
    index: rnaf-fii-range
    section: Fusion scope
    group: Ranking
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    interactive_component_type: RangeSlider
    column_name: fii
    column_type: float64
    display: {title_size: md, custom_color: '#7E57C2', icon_name: 'mdi:trophy'}
    placement: left
    title: Fusion Indication Index
    layout: {x: 0, y: 7, w: 1, h: 3}
  - component_type: interactive
    tag: rnaf-filter-strandedness
    index: rnaf-strandedness-filter
    section: Read QC scope
    group: Library
    workflow_tag: rnafusion
    data_collection_tag: samplesheet
    interactive_component_type: MultiSelect
    column_name: strandedness
    column_type: object
    display: {title_size: md, custom_color: '#F2A93B', icon_name: 'mdi:swap-horizontal'}
    placement: left
    title: Strandedness
    layout: {x: 0, y: 0, w: 1, h: 3}

tabs:
- title: Fusion calls
  subtitle: Which fusions the run called, how many callers agreed and how the knowledge bases rank them
  tab_order: 2
  tab_icon: mdi:set-merge
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Consensus scope
    icon: mdi:counter
    color: indigo
    description: Narrow the consensus table by rank and knowledge-base support
    collapsed: true
  grid_sections:
  - name: Calls at a glance
    icon: mdi:counter
    color: indigo
    description: How many fusions the run called and how confident the consensus is
  - name: Caller concordance
    icon: mdi:relation-many-to-many
    color: violet
    description: Which callers agree, and how the agreement drives the ranking
  - name: Ranked calls
    icon: mdi:table
    color: indigo
    description: The consensus table itself, the hub every other tab is filtered by
  components:
  - component_type: text
    tag: rnaf-calls-intro
    section: Calls at a glance
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    title: One row per fusion, not per sample
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      fusion-report pools every caller into one table and scores each fusion
      with the Fusion Indication Index, which combines caller agreement with
      how many knowledge bases already list the pair.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: rnaf-calls-card-fusions
    section: Calls at a glance
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    use: fusionreport/fusions
    aggregation: nunique
    column_name: fusion
    column_type: object
    secondary_layout: donut
    breakdown_col: tool_support
    display: {icon_name: 'mdi:dna', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Fusions called
    layout: {x: 0, y: 1, w: 2, h: 2}
  - component_type: card
    tag: rnaf-calls-card-fii
    section: Calls at a glance
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    use: fusionreport/fusions
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: fii
    column_type: float64
    display: {icon_name: 'mdi:trophy', icon_color: '#7E57C2', title_color: '#7E57C2', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Fusion Indication Index
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: rnaf-calls-card-agreement
    section: Calls at a glance
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    use: fusionreport/fusions
    aggregation: average
    column_name: n_tools
    column_type: int64
    secondary_layout: gauge
    coverage_max: 3
    display: {icon_name: 'mdi:set-merge', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Callers per fusion
    layout: {x: 4, y: 1, w: 2, h: 2}
  - component_type: card
    tag: rnaf-calls-card-databases
    section: Calls at a glance
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    use: fusionreport/fusions
    aggregation: average
    column_name: n_databases
    column_type: int64
    secondary_layout: top_n
    breakdown_col: databases
    top_n_count: 3
    display: {icon_name: 'mdi:database-outline', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Knowledge bases
    layout: {x: 6, y: 1, w: 2, h: 2}

  - component_type: text
    tag: rnaf-calls-concordance-intro
    section: Caller concordance
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    title: Agreement is the first filter
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The UpSet counts the fusions each combination of callers found; the bar on
      the far left is the set every caller agreed on. The ranked view below puts
      the same fusions in fusion-report's own order.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: rnaf-calls-upset
    index: rnaf-calls-upset
    section: Caller concordance
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    use: fusionreport/caller_upset
    config:
      set_columns: [arriba, fusioncatcher, starfusion]
      sort_by: cardinality
      sort_order: descending
      min_size: 1
      show_set_sizes: true
      color_intersections_by: degree
      show_values: true
    title: Caller concordance
    description: Each bar is a set of fusions found by exactly that combination of callers. Degree colouring separates unanimous calls from single-caller ones.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 6}
  - component_type: advanced_viz
    tag: rnaf-calls-lollipop
    index: rnaf-calls-lollipop
    section: Caller concordance
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    use: fusionreport/fii_lollipop
    config:
      effect_col: fii
      scale_points_by_effect: true
      show_stems: true
      gene_sort: effect
      top_n_labels: 10
    title: Ranked fusions
    description: Every fusion at its position in the fusion-report ranking, coloured by caller agreement and sized by the Fusion Indication Index.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 6}

  - component_type: text
    tag: rnaf-calls-table-intro
    section: Ranked calls
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    title: Pick a fusion here to drive the rest
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Selecting rows narrows the evidence, validation and protein-domain tiles on
      the other tabs, because the template links every caller collection to this
      one on the fusion name.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: table
    tag: rnaf-calls-table
    section: Ranked calls
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    use: fusionreport/fusions
    row_selection_enabled: true
    row_selection_column: fusion
    title: fusion-report consensus
    description: Rank, index, knowledge bases and the per-caller flags behind the UpSet.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 6}
  - component_type: interactive
    tag: rnaf-filter-rank
    index: rnaf-rank-range
    section: Consensus scope
    group: Ranking
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    interactive_component_type: RangeSlider
    column_name: rank
    column_type: int64
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:sort-numeric-ascending'}
    placement: left
    title: Rank
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: rnaf-filter-ndatabases
    index: rnaf-ndatabases-range
    section: Consensus scope
    group: Ranking
    workflow_tag: rnafusion
    data_collection_tag: fusion_consensus
    interactive_component_type: RangeSlider
    column_name: n_databases
    column_type: int64
    display: {title_size: md, custom_color: '#F2A93B', icon_name: 'mdi:database-outline'}
    placement: left
    title: Knowledge bases
    layout: {x: 0, y: 3, w: 1, h: 3}

- title: Evidence
  subtitle: How much read support each caller found for each fusion, and where the callers disagree
  tab_order: 3
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Evidence scope
    icon: mdi:tune
    color: teal
    description: Narrow the evidence rows by caller and read support
    collapsed: true
  grid_sections:
  - name: Support across callers
    icon: mdi:chart-scatter-plot
    color: teal
    description: The same fusions seen through each caller's read counts
  - name: Per caller detail
    icon: mdi:dna
    color: cyan
    description: Each caller's own evidence, on its own terms
  - name: Caller tables
    icon: mdi:table
    color: gray
    description: The raw caller rows, selectable by fusion
    collapsed: true
  components:
  - component_type: text
    tag: rnaf-ev-intro
    section: Support across callers
    workflow_tag: rnafusion
    data_collection_tag: caller_evidence
    title: Comparable read support, one caller at a time
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each caller counts reads its own way, so the evidence strings are summed
      into one supporting-read figure per fusion and caller. Colour is that
      figure on a log scale, size is the caller's share of the fusion's support.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: rnaf-ev-card-rows
    section: Support across callers
    workflow_tag: rnafusion
    data_collection_tag: caller_evidence
    use: fusionreport/caller_evidence
    aggregation: nunique
    column_name: fusion
    column_type: object
    secondary_layout: composition
    breakdown_col: caller
    display: {icon_name: 'mdi:dna', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Fusions with evidence
    layout: {x: 0, y: 1, w: 2, h: 2}
  - component_type: card
    tag: rnaf-ev-card-support
    section: Support across callers
    workflow_tag: rnafusion
    data_collection_tag: caller_evidence
    use: fusionreport/caller_evidence
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: supporting_reads
    column_type: int64
    display: {icon_name: 'mdi:counter', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Supporting reads
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: rnaf-ev-card-total
    section: Support across callers
    workflow_tag: rnafusion
    data_collection_tag: caller_evidence
    use: fusionreport/caller_evidence
    aggregation: sum
    column_name: supporting_reads
    column_type: int64
    secondary_layout: donut
    breakdown_col: caller
    display: {icon_name: 'mdi:chart-donut', icon_color: '#26A69A', title_color: '#26A69A', title_font_size: xl, value_font_size: xl}
    title_size: sm
