version: 1
# nf-core/hic 2.0.0 reference dashboard.
#
# Funnel: the reprocessed MultiQC report -> HiC-Pro's valid-pair funnel as
# numbers a card can hold -> the shape of the library (P(s)) -> the contact
# matrix with its 1D tracks stacked underneath -> the A/B compartments read
# off it -> the TAD domains derived from the insulation track -> what a
# multi-sample run would add. The sample hub anchors every tab through the
# project links; the run this template was validated against is a single
# sample (three merged FASTQ pairs), so the sample filter has one value today
# and is ready for a multi-sample run without any change.
#
# HIC-PRO'S NUMBERS APPEAR TWICE, ON PURPOSE. The MultiQC tab keeps HiC-Pro's
# own panels, because that is the report a reader may already know. But a
# MultiQC panel is an image: it cannot be filtered, its numbers cannot go in a
# card and nothing can join to it. So `hicpro/stats/<sample>/*` is also read
# directly into two collections, a wide funnel row per sample (`pair_stats`)
# and a weighted row per read-pair fate (`pair_flow`), which is what puts the
# valid-pair rate and the cis/trans split on the pinned strip every tab
# carries.
#
# The MultiQC report bound here was re-generated with MultiQC 1.35 from the
# run's raw tool outputs; the run itself published MultiQC 1.13, which writes
# no parquet. Module and section names are therefore the 1.35 ones, and are
# the plot's *section* name (e.g. "Read Mapping"), not the bar chart's own
# title string (e.g. "HiC-Pro: Mapping Statistics"), which is a different,
# display-only field MultiQC never persists as a plot id.
main_dashboard:
  title: nf-core/hic
  subtitle: "nf-core/hic 2.0.0 megatest: one mESC Hi-C sample (HIC_ES_4), three FASTQ pairs merged by HiC-Pro"
  project_tag: Hi-C Genome Architecture
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab through the project links
    persistent: true
    pin: top
  - name: Funnel scope
    icon: mdi:tune
    color: orange
    description: Narrows the pinned funnel strip to one mapping or contact fate
  grid_sections:
  # Pinned to the top and carried by every tab: the four numbers that decide
  # whether a Hi-C library is worth reading at all. Cards are legal on the
  # MultiQC tab only inside a pinned persistent section, which is exactly what
  # this is.
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: HiC-Pro's valid-pair funnel, on every tab
    persistent: true
    pin: top
  - name: MultiQC general statistics
    icon: mdi:view-dashboard-outline
    color: blue
    description: One row per sample, pooling the headline FastQC and HiC-Pro numbers
  - name: Read quality
    icon: mdi:chart-bell-curve
    color: blue
    description: FastQC on the merged reads
  - name: HiC-Pro processing
    icon: mdi:chart-bar
    color: indigo
    description: Mapping, pairing, valid-pair filtering and contact statistics
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The sample hub every other tab is filtered by
    collapsed: true
    persistent: true
    pin: top
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: Per-chromosome compartment eigenvalues, on every tab
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # ------------------------------------------------- pinned glance strip (x4)
  - component_type: card
    tag: hc-glance-card-funnel
    index: hc-glance-card-funnel
    section: Run at a glance
    workflow_tag: hic
    data_collection_tag: pair_stats
    use: hicpro/pair_stats
    aggregation: sum
    column_name: total_pairs
    column_type: int64
    secondary_layout: attrition
    attrition_cols: [reported_pairs, valid_pairs, valid_pairs_rmdup, cis_pairs, cis_long_range]
    display: {icon_name: 'mdi:import', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Read pairs sequenced
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: hc-glance-card-validrate
    index: hc-glance-card-validrate
    section: Run at a glance
    workflow_tag: hic
    data_collection_tag: pair_stats
    use: hicpro/pair_stats
    aggregation: average
    column_name: valid_pair_rate
    column_type: float64
    secondary_layout: gauge
    coverage_max: 1.0
    display: {icon_name: 'mdi:check-decagram', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Valid-pair rate
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: hc-glance-card-cis
    index: hc-glance-card-cis
    section: Run at a glance
    workflow_tag: hic
    data_collection_tag: pair_stats
    use: hicpro/pair_stats
    aggregation: average
    column_name: cis_ratio
    column_type: float64
    secondary_layout: gauge
    coverage_max: 1.0
    display: {icon_name: 'mdi:dna', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Cis share of contacts
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: hc-glance-card-contacts
    index: hc-glance-card-contacts
    section: Run at a glance
    workflow_tag: hic
    data_collection_tag: pair_flow
    use: hicpro/pair_flow
    aggregation: sum
    column_name: pairs
    column_type: int64
    secondary_layout: donut
    breakdown_col: contacts
    filter_expr: "col('filtering') == 'Valid pairs'"
    display: {icon_name: 'mdi:chart-donut', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Cis, trans and duplicates
    layout: {x: 6, y: 0, w: 2, h: 2}

  # ------------------------------------------------------ multiqc: overview
  - component_type: text
    tag: hc-qc-intro
    section: MultiQC general statistics
    title: A Hi-C run, from reads to contacts
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The reprocessed [MultiQC](https://multiqc.info) report: the general
      statistics table first, then FastQC on the merged reads, then HiC-Pro's
      own mapping, pairing, filtering and contact-statistics panels. The same
      HiC-Pro numbers are read a second time as a table, which is what the
      pinned strip above and the Run QC tab are built from.
    workflow_tag: hic
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: hc-qc-general-stats
    section: MultiQC general statistics
    workflow_tag: hic
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    title: General statistics
    description: One row per sample, pooling the FastQC and HiC-Pro headline numbers.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 5}

  # ------------------------------------------------------------ read quality
  - component_type: text
    tag: hc-qc-reads-intro
    section: Read quality
    title: The merged reads, before HiC-Pro touches them
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/) on
      the two merged FASTQ files (R1/R2) HiC-Pro maps in two-step mode. There
      is no adapter-trimming module in this run: HiC-Pro's own mapping step
      does the trimming, in the panels below.
    workflow_tag: hic
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: hc-qc-fastqc-counts
    section: Read quality
    workflow_tag: hic
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Counts
    use: multiqc/fastqc
    title: Sequence counts
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: hc-qc-fastqc-quality
    section: Read quality
    workflow_tag: hic
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    use: multiqc/fastqc
    title: Per-base sequence quality
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: hc-qc-fastqc-perseq
    section: Read quality
    workflow_tag: hic
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Per Sequence Quality Scores
    use: multiqc/fastqc
    title: Per sequence quality scores
    title_size: sm
    title_align: left
    layout: {x: 0, y: 6, w: 4, h: 5}
  - component_type: multiqc
    tag: hc-qc-fastqc-gc
    section: Read quality
    workflow_tag: hic
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Per Sequence GC Content
    use: multiqc/fastqc
    title: GC content
    title_size: sm
    title_align: left
    layout: {x: 4, y: 6, w: 4, h: 5}
  - component_type: multiqc
    tag: hc-qc-fastqc-ncontent
    section: Read quality
    workflow_tag: hic
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Per Base N Content
    use: multiqc/fastqc
    title: Per-base N content
    title_size: sm
    title_align: left
    layout: {x: 0, y: 11, w: 4, h: 5}
  - component_type: multiqc
    tag: hc-qc-fastqc-dup
    section: Read quality
    workflow_tag: hic
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Duplication Levels
    use: multiqc/fastqc
    title: Sequence duplication levels
    title_size: sm
    title_align: left
    layout: {x: 4, y: 11, w: 4, h: 5}
  - component_type: multiqc
    tag: hc-qc-fastqc-status
    section: Read quality
    workflow_tag: hic
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Status Checks
    use: multiqc/fastqc
    title: Status checks
    title_size: sm
    title_align: left
    layout: {x: 0, y: 16, w: 8, h: 5}

  # ------------------------------------------------------- hicpro processing
  - component_type: text
    tag: hc-qc-hicpro-intro
    section: HiC-Pro processing
    title: Mapping, pairing, filtering, contacts
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [HiC-Pro](https://github.com/nservant/HiC-Pro) two-step maps each read,
      pairs the mapped mates, filters the pairs down to valid 3C products
      (dropping dangling ends, self-circles and re-ligations) and reports the
      cis/trans split of what survives. Each panel below is one of those four
      stages.
    workflow_tag: hic
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: hc-qc-hicpro-mapping
    section: HiC-Pro processing
    workflow_tag: hic
    data_collection_tag: multiqc_data
    selected_module: hicpro
    selected_plot: Read Mapping
    use: multiqc/hicpro
    title: Read mapping
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: hc-qc-hicpro-pairing
    section: HiC-Pro processing
    workflow_tag: hic
    data_collection_tag: multiqc_data
    selected_module: hicpro
    selected_plot: Read Pairing
    use: multiqc/hicpro
    title: Read pairing
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: hc-qc-hicpro-filtering
    section: HiC-Pro processing
    workflow_tag: hic
    data_collection_tag: multiqc_data
    selected_module: hicpro
    selected_plot: Read Pair Filtering
    use: multiqc/hicpro
    title: Valid-pair filtering
    title_size: sm
    title_align: left
    layout: {x: 0, y: 6, w: 4, h: 5}
  - component_type: multiqc
    tag: hc-qc-hicpro-contacts
    section: HiC-Pro processing
    workflow_tag: hic
    data_collection_tag: multiqc_data
    selected_module: hicpro
    selected_plot: Contact Statistics
    use: multiqc/hicpro
    title: Contact statistics
    title_size: sm
    title_align: left
    layout: {x: 4, y: 6, w: 4, h: 5}

  # ------------------------------------------------------------ sample sheet
  - component_type: text
    tag: hc-sheet-intro
    section: Sample sheet
    title: The design behind every panel
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per Hi-C sample, with how many FASTQ pairs HiC-Pro merged into
      it. This is the collection the sample filter in the left panel is
      sourced on, so it is what narrows every other tab.
    workflow_tag: hic
    data_collection_tag: samples
    layout: {x: 0, y: 0, w: 6, h: 2}
  - component_type: card
    tag: hc-sheet-card-libs
    index: hc-sheet-card-libs
    section: Sample sheet
    workflow_tag: hic
    data_collection_tag: samples
    aggregation: sum
    column_name: n_libraries
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample_id
    top_n_count: 3
    display: {icon_name: 'mdi:file-multiple-outline', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: FASTQ pairs merged
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: table
    tag: hc-ref-table-samples
    section: Sample sheet
    workflow_tag: hic
    data_collection_tag: samples
    row_selection_enabled: false
    title: Sample hub
    description: One row per sample, with the FASTQ pairs HiC-Pro merged into it.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 3}

  # -------------------------------------------------------- reference tables
  - component_type: text
    tag: hc-ref-intro
    section: Reference tables
    title: What the compartment track is built from
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Per-chromosome eigenvalues behind the [cooltools](https://cooltools.readthedocs.io)
      A/B compartment track: how much of each chromosome's intra-chromosomal
      correlation structure the first eigenvector explains. The per-bin track
      itself is on the Compartments tab.
    workflow_tag: hic
    data_collection_tag: compartment_eigenvalues
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: table
    tag: hc-ref-table-eigenvalues
    section: Reference tables
    workflow_tag: hic
    data_collection_tag: compartment_eigenvalues
    use: cooltools/eigenvalues
    row_selection_enabled: false
    title: Compartment eigenvalues
    description: eigval1/2/3 per chromosome, both resolutions the run scanned.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 5}

  # ---------------------------------------------------------------- filters
  - component_type: interactive
    tag: hc-filter-sample
    index: hc-sample-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: hic
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:test-tube'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  # Tab-local: the only categorical column the MultiQC tab's own collections
  # offer. It narrows the pinned funnel strip that rides this tab.
  - component_type: interactive
    tag: hc-mq-filter-mapping
    index: hc-mq-mapping-filter
    section: Funnel scope
    group: Read-pair fate
    workflow_tag: hic
    data_collection_tag: pair_flow
    interactive_component_type: Select
    column_name: mapping
    column_type: object
    display: {title_size: md, custom_color: '#FB8C00', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Mapping fate
    layout: {x: 0, y: 0, w: 1, h: 3}

tabs:
# ============================================================================
# Run QC: the valid-pair funnel
# ============================================================================
- title: Run QC
  subtitle: Where half a billion read pairs go, from the sequencer to the long-range cis contacts a Hi-C experiment is built for
  tab_order: 2
  tab_icon: mdi:filter-variant
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Fate scope
    icon: mdi:tune
    color: teal
    description: Narrow the flow to one mapping or contact fate
  grid_sections:
  - name: Funnel at a glance
    icon: mdi:counter
    color: teal
    description: The rates that decide whether the library is worth reading
  - name: Where the pairs go
    icon: mdi:relation-many-to-many
    color: indigo
    description: Every read pair, followed to the point where it stops
  - name: The funnel in numbers
    icon: mdi:table
    color: gray
    description: The same stages as one row per sample
    collapsed: true
  components:
  - component_type: card
    tag: hc-rq-card-lowqual
    index: hc-rq-card-lowqual
    section: Funnel at a glance
    workflow_tag: hic
    data_collection_tag: pair_stats
    use: hicpro/pair_stats
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: low_qual_rate
    column_type: float64
    display: {icon_name: 'mdi:alert-outline', icon_color: '#F4511E', title_color: '#F4511E', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Low-quality pair rate
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: hc-rq-card-duprate
    index: hc-rq-card-duprate
    section: Funnel at a glance
    workflow_tag: hic
    data_collection_tag: pair_stats
    use: hicpro/pair_stats
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: duplicate_rate
    column_type: float64
    display: {icon_name: 'mdi:content-duplicate', icon_color: '#F4511E', title_color: '#F4511E', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Duplicate rate
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: hc-rq-card-mapping
    index: hc-rq-card-mapping
    section: Funnel at a glance
    workflow_tag: hic
    data_collection_tag: pair_flow
    use: hicpro/pair_flow
    aggregation: sum
    column_name: pairs
    column_type: int64
    secondary_layout: donut
    breakdown_col: mapping
    display: {icon_name: 'mdi:chart-donut', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mapping fates
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: hc-rq-card-valid
    index: hc-rq-card-valid
    section: Funnel at a glance
    workflow_tag: hic
    data_collection_tag: pair_stats
    use: hicpro/pair_stats
    aggregation: sum
    column_name: valid_pairs_rmdup
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:check-decagram', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Unique valid pairs
    layout: {x: 6, y: 0, w: 2, h: 2}

  - component_type: text
    tag: hc-rq-flow-intro
    section: Where the pairs go
    title: Three decisions, one flow
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      HiC-Pro makes three decisions about every read pair. Does it map
      uniquely at both ends? Do the two ends sit on restriction fragments that
      a real ligation could have joined, or is the pair a dangling end, a
      re-ligation or a self circle? And is the surviving contact
      intra-chromosomal (cis) or inter-chromosomal (trans)? Each ribbon below
      is one of those paths, weighted by read pairs, and every loss peels off
      into the Lost lane at the step it stopped at. The three levels reconcile
      exactly with the totals HiC-Pro reports.
    workflow_tag: hic
    data_collection_tag: pair_flow
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: hc-rq-av-sankey
    index: hc-rq-av-sankey
    section: Where the pairs go
    workflow_tag: hic
    data_collection_tag: pair_flow
    use: hicpro/pair_flow_sankey
    config:
      value_col: pairs
      value_label: read pairs
      value_format: count
      available_step_cols: [mapping, filtering, contacts]
      color_mode: source
      link_opacity: 0.45
    title: "Read-pair fates"
    description: "Weighted by read pairs. Mapping, then the restriction-fragment filter, then the contact class."
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 8}
  - component_type: table
    tag: hc-rq-table-flow
    section: Where the pairs go
    workflow_tag: hic
    data_collection_tag: pair_flow
    use: hicpro/pair_flow
    row_selection_enabled: false
    title: Read-pair fates table
    description: One row per path through the three decisions, with the pairs that take it.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 10, w: 8, h: 4}

  - component_type: text
    tag: hc-rq-stats-intro
    section: The funnel in numbers
    title: Every stage as a column
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The same statistics pivoted the other way: one row per sample, one
      column per stage, plus the derived rates the strips above read. This is
      the collection a multi-sample run turns into a cohort comparison.
    workflow_tag: hic
    data_collection_tag: pair_stats
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: table
    tag: hc-rq-table-stats
    section: The funnel in numbers
    workflow_tag: hic
    data_collection_tag: pair_stats
    use: hicpro/pair_stats
    row_selection_enabled: false
    title: Valid-pair funnel
    description: Counts and rates per sample, from pairs processed to the long-range cis contacts.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 3}

  # ---------------------------------------------------------------- filters
  - component_type: interactive
    tag: hc-rq-filter-mapping
    index: hc-rq-mapping-filter
    section: Fate scope
    group: Read-pair fate
    workflow_tag: hic
    data_collection_tag: pair_flow
    interactive_component_type: Select
    column_name: mapping
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Mapping fate
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: hc-rq-filter-contacts
    index: hc-rq-contacts-filter
    section: Fate scope
    group: Read-pair fate
    workflow_tag: hic
    data_collection_tag: pair_flow
    interactive_component_type: Select
    column_name: contacts
