    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: hc-cs-card-long
    index: hc-cs-card-long
    section: Cohort at a glance
    workflow_tag: hic
    data_collection_tag: pair_stats
    use: hicpro/pair_stats
    aggregation: sum
    column_name: cis_long_range
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:ruler', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Long-range cis contacts
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: hc-cs-card-trans
    index: hc-cs-card-trans
    section: Cohort at a glance
    workflow_tag: hic
    data_collection_tag: pair_stats
    use: hicpro/pair_stats
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: trans_ratio
    column_type: float64
    display: {icon_name: 'mdi:alert-outline', icon_color: '#F4511E', title_color: '#F4511E', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Trans share
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: hc-cs-card-rate
    index: hc-cs-card-rate
    section: Cohort at a glance
    workflow_tag: hic
    data_collection_tag: pair_stats
    use: hicpro/pair_stats
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: valid_pair_rate
    column_type: float64
    display: {icon_name: 'mdi:check-decagram', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Valid-pair rate
    layout: {x: 6, y: 0, w: 2, h: 2}

  - component_type: text
    tag: hc-cs-intro
    section: What is missing
    title: One sample is not a cohort
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The run this template was validated against is a single mouse ES-cell
      library, HIC_ES_4, assembled from three sequencing runs that HiC-Pro
      merged before mapping. Every comparison a Hi-C cohort is read for
      therefore has one bar: reproducibility between replicates (the HiCRep
      stratum-adjusted correlation), P(s) curves overlaid across conditions,
      compartment flips between cell types, boundary strength gained or lost
      on treatment. Nothing in this dashboard hard-codes one sample: the hub
      carries the sample filter, every collection carries a sample column, and
      the project links route that filter to all of them, so the same template
      run against a multi-sample experiment fills these cards and the strips
      on every other tab without an edit. The cards above already rank samples
      on the four numbers a cohort is compared on, and the table below is the
      full per-sample funnel.
    workflow_tag: hic
    data_collection_tag: pair_stats
    layout: {x: 0, y: 0, w: 8, h: 3}
  - component_type: text
    tag: hc-cs-next
    section: What is missing
    title: What a second sample would unlock
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Replicate correlation needs two matrices at one resolution, which the
      contact-matrix collection already stores side by side. Multi-sample P(s)
      needs nothing new at all: the curve collection is keyed on sample and
      chromosome, so a second library adds a second set of series to the same
      tile. Compartment and boundary comparisons need the two tracks joined on
      bin coordinates, which the collections carry but no tile joins yet.
    workflow_tag: hic
    data_collection_tag: distance_profile
    layout: {x: 0, y: 3, w: 8, h: 2}

  - component_type: table
    tag: hc-cs-table
    section: Per-sample table
    workflow_tag: hic
    data_collection_tag: pair_stats
    use: hicpro/pair_stats
    row_selection_enabled: false
    title: Valid-pair funnel per sample
    description: One row per sample, every stage and every derived rate.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 3}

  # ---------------------------------------------------------------- filters
  - component_type: interactive
