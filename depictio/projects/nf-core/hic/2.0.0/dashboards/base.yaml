- title: Distance decay
  subtitle: How fast does contact frequency fall off with genomic distance?
  tab_group: Contacts
  tab_order: 3
  tab_icon: mdi:chart-line
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Curve filters
    icon: mdi:tune
    color: cyan
    description: The chromosomes to keep in view
  grid_sections:
  - name: Decay at a glance
    icon: mdi:counter
    color: cyan
    description: The slope, the cis and trans split and the long-range share
  - name: Contact probability
    icon: mdi:chart-line
    color: cyan
    description: P(s) per chromosome and pooled, with its local slope underneath
  - name: Curve tables
    icon: mdi:table
    color: gray
    description: The binned rows behind the curve, and the pooled curve HiCExplorer wrote
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      P(s) is the probability that two loci a distance s apart are in contact, recomputed
      from the balanced [cooler](https://cooler.readthedocs.io) dump over every bin pair that
      could have been observed. A slope near -1 is the usual interphase range and a steeper
      fall a more compact polymer, while a bump or a plateau points to trans contamination
      or a large rearrangement.
    tag: hc-dd-intro
    index: dd-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: hic
    data_collection_tag: distance_profile
