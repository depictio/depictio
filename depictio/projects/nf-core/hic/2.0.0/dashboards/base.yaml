    breakdown_col: contacts
    display:
      icon_name: mdi:chart-donut
      icon_color: grape
      caption: valid pairs, cis against trans and duplicates
    section: Decay at a glance
    tag: hc-dd-card-classes
    index: dd-card-classes
    title: Contact classes
    description: Valid pairs split into cis and trans contacts and the duplicates removed; a large trans share is noise.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hic
    data_collection_tag: pair_stats
    use: hicpro/pair_stats
    aggregation: median
    column_name: long_range_ratio
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:ruler
      icon_color: indigo
      caption: median per sample, with the distribution
      format: percent
    section: Decay at a glance
    tag: hc-dd-card-longrange
    index: dd-card-longrange
    title: Long-range cis share
    description: Median share of each sample's cis contacts that HiC-Pro counts as long-range.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hic
    data_collection_tag: pair_stats
    use: hicpro/pair_stats
    aggregation: sum
    column_name: cis_long_range
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display:
      icon_name: mdi:dna
      icon_color: blue
      caption: the samples with the most
