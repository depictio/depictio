  # ------------------------------------------------------------ locus section
  # The navigator (genome_view on tad_domains) opens on its default_region and
  # emits a chromosome + position pair on chrom / start. The three `region`
  # links in template.yaml rename that pair onto contact_matrix (chrom1 /
  # start1), tad_insulation and compartment_eigenvector (chrom / start), so
  # the triangle and both tracks clamp their x axis to the same region.
  # coverage_track and genome_view never share a collection on this tab
  # (test_no_double_track_binding): each 1D track is one coverage_track tile
  # with views [track, locus].
  - component_type: text
    tag: hc-cm-intro
    section: Genome architecture
    title: One region, four collections
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The section opens on chr2:65-85 Mb, 20 Mb around the HoxD cluster (about
      74.7 Mb), where the mESC domains, the A/B switch and the insulation dips
      all line up. The navigator draws the TAD domains cooltools called at
      each insulation window; type a locus or a gene symbol in its header, or
      brush its axis, and the contact triangle and both tracks move with it.
      The triangle reads every resolution the run dumped (500 kb and 1 Mb) and
      picks the one that fits the span: TADs are the small triangles along
      the diagonal, compartments the larger checkerboard behind them.
    workflow_tag: hic
    data_collection_tag: tad_domains
    layout: {x: 0, y: 0, w: 8, h: 2}
