    data_collection_tag: tad_domains
    use: cooltools/domain_track
    config:
      controls_placement: header
      mark: rect
      category_col: window
      assembly: mm10
      annotation: mm10
      score_title: Domain size (kb)
      opacity: 0.75
      region_filter_enabled: true
      default_region: "chr2:65,000,000-85,000,000"
    title: "TAD domains, the navigator"
    description: "One rectangle per domain, coloured by the insulation window it was called at, over the mm10 genes. The locus field and a brush on this axis move every tile below."
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 3}
