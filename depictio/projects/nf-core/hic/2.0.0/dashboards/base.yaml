    order: 2
    alignment: left
    body: >
      [cooltools eigs-cis](https://cooltools.readthedocs.io) diagonalises the
      intra-chromosomal correlation matrix; E1's sign marks the two
      compartments (conventionally A positive and gene-dense, B negative), and
      its zero-crossings are compartment boundaries. The recipe stores that
      sign as a column of its own, so a reader can filter to one compartment
      and colour by it instead of re-deriving the threshold in every tile.
      Blacklisted bins carry no value and appear in neither compartment.
    workflow_tag: hic
    data_collection_tag: compartment_eigenvector
