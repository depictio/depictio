version: 1
# nf-core/hic 2.0.0. Every rule this file follows is written out in
# depictio/projects/nf-core/RULES.md; ampliseq/2.18.0 is the reference.
#
# Funnel: the Overview, then Data & QC (the reprocessed MultiQC report, then
# HiC-Pro's valid-pair funnel), then Contacts (how contact frequency falls off
# with distance, then the contact matrix at one locus with its tracks), then
# Architecture (TAD domains and A/B compartments, genome-wide).
#
# HIC-PRO'S NUMBERS APPEAR TWICE, ON PURPOSE. The MultiQC tab keeps HiC-Pro's
# own panels, the report a reader may already know. But a MultiQC panel cannot
# be filtered and its numbers cannot go in a card, so `hicpro/stats/<sample>/*`
# is also read into `pair_stats` (one funnel row per sample) and `pair_flow`
# (one weighted row per read-pair fate), which the Valid pairs tab reads.
#
# The MultiQC report bound here was re-generated with MultiQC 1.35 from the
# run's raw tool outputs; the run itself published MultiQC 1.13, which writes no
# parquet. Module and section names are therefore the 1.35 ones. The run ships
# no params.json either, so `params:` links open the software versions, the
# only provenance it has.
#
# The template has no GROUP_COL: the sample hub carries the sample id and the
# FASTQ pairs merged into it, and the project links fan a sample pick out to
# every collection.
main_dashboard:
  title: nf-core/hic
  subtitle: Chromatin conformation, from read pairs to domains and compartments
  project_tag: Hi-C Genome Architecture
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab: figures, advanced viz and filter
  # chips colour a value the same way. Every entry is a vocabulary a recipe
  # writes: HiC-Pro's three decisions on a read pair, and the compartment sign.
  category_colors:
    mapping:
      Uniquely mapped: '#1baf7a'
      Low quality: '#eda100'
      Singleton: '#eb6834'
      Unmapped: '#adb5bd'
    filtering:
      Valid pairs: '#1baf7a'
      Dangling end: '#eda100'
      Religation: '#eb6834'
      Self circle: '#e87ba4'
      Dumped: '#4a3aa7'
      Lost: '#adb5bd'
    contacts:
      Cis: '#2a78d6'
      Trans: '#eb6834'
      Duplicate: '#eda100'
      Lost: '#adb5bd'
    compartment:
      A: '#e34948'
      B: '#2a78d6'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. Bound
  # to the sample hub, the source of every sample link in template.yaml.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The sample hub behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with a card (FASTQ pairs, below). The
  # template has no group column, so the sample comes first.
  - component_type: interactive
    workflow_tag: hic
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: hc-ov-kf-sample
    index: ov-kf-sample
    title: Sample
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: hic
    data_collection_tag: samples
    interactive_component_type: RangeSlider
    column_name: n_libraries
    column_type: int64
    display:
      icon_name: mdi:file-multiple-outline
      custom_color: cyan
      strip_label: FASTQ pairs
    section: Key figures
    tag: hc-ov-kf-libs
    index: ov-kf-libs
    title: FASTQ pairs merged
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: text
    title: nf-core/hic
    logo: https://raw.githubusercontent.com/nf-core/hic/master/docs/images/nf-core-hic_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/hic/master/docs/images/nf-core-hic_logo_dark.png
    order: 1
    body: >
      Hi-C read pairs filtered down to valid ligation products, binned into contact maps and
      read for how contacts decay with distance, where the TAD boundaries fall and which
      compartment each bin sits in. [Run parameters](params:)
    tag: hc-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/hic maps Hi-C read pairs, keeps the valid ligation products and bins them into contact maps, then reads how contacts decay with distance, where the TAD boundaries fall and which compartment each bin sits in. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The sample filters in the left panel apply to every tab: narrow the samples once and the whole dashboard follows. A bar above a section narrows that section only.
    tag: hc-ov-about
    index: ov-about
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's facts, read from its data: it ships no params.json, so no
  # {{param:...}} line would print anything but a dash.
  - component_type: text
    surface: card
    values:
      samples: {dc: samples, column: sample_id, aggregation: nunique, format: integer}
      reads: {dc: pair_stats, column: total_pairs, aggregation: sum, format: si}
      pairs: {dc: pair_stats, column: valid_pairs_rmdup, aggregation: sum, format: si}
      res: {dc: contact_matrix, column: resolution, aggregation: nunique, format: integer}
    body: |
      ### The run
      - ![](icon:mdi:test-tube) **Samples** {{samples}}
      - ![](icon:mdi:import) **Read pairs** {{reads}}
      - ![](icon:mdi:check-decagram) **Unique valid pairs** {{pairs}}
      - ![](icon:mdi:grid) **Map resolutions** {{res}}
    tag: hc-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  # The marks take the family's colour (the header's), not the theme's blue.
  # The run has no params.json, so each step's link searches the software
  # versions for its process.
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Six steps from read pairs to genome architecture
      Each step names its tools and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:dna) **Map** Bowtie 2 aligns each mate in two steps · [Versions](params:bowtie2) · [MultiQC](tab:MultiQC)
      2. ![](icon:mdi:filter-variant) **Pair** HiC-Pro keeps the valid ligation products · [Versions](params:valid_interaction) · [Valid pairs](tab:Valid pairs)
      3. ![](icon:mdi:grid) **Bin** cooler bins and balances the contacts · [Versions](params:cooler) · [Contact maps](tab:Contact maps)
      4. ![](icon:mdi:chart-line) **Decay** Contact frequency against distance · [Versions](params:dist_vs_counts) · [Distance decay](tab:Distance decay)
      5. ![](icon:mdi:border-all-variant) **Domains** Insulation score and TAD boundaries · [Versions](params:insulation) · [Domains](tab:Domains)
      6. ![](icon:mdi:scale-balance) **Compartments** A and B from the first eigenvector · [Versions](params:eigscis) · [Compartments](tab:Compartments)
      :::
    tag: hc-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. The icon colour is that tab's colour.
  - component_type: card
    workflow_tag: hic
    data_collection_tag: samples
    aggregation: sum
    column_name: n_libraries
    column_type: int64
    secondary_layout: composition
    breakdown_col: sample_id
    display:
      icon_name: mdi:file-multiple-outline
      icon_color: orange
      caption: FASTQ pairs, by the sample they merge into
      link: tab:MultiQC
    section: Key figures
    tag: hc-ov-kf-fastq
    index: ov-kf-fastq
    title: FASTQ pairs
    description: FASTQ read pairs in the sample sheet. HiC-Pro merges the pairs of one sample before mapping; the bar splits them by sample.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hic
    data_collection_tag: pair_stats
    use: hicpro/pair_stats
    aggregation: median
    column_name: valid_pair_rate
    column_type: float64
    # A 0-1 fraction: a coverage bar would print "41% of 1", and HiC-Pro
    # publishes no floor to set a threshold at, so the spread over samples.
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:check-decagram
      icon_color: teal
      caption: median share over samples, with its spread
      link: tab:Valid pairs
      format: percent
    section: Key figures
    tag: hc-ov-kf-valid
    index: ov-kf-valid
    title: Valid-pair rate
    description: Median share of each sample's read pairs that survive mapping and HiC-Pro's ligation filter as valid contacts.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hic
    data_collection_tag: distance_profile
    use: cooltools/distance_profile
    aggregation: median
    column_name: log10_slope
    column_type: float64
    # The pooled curve only: the table also holds one curve per chromosome, and
    # a median over both counts the genome twice (the Findings row reads the same).
    filter_expr: "col('chrom') == 'all'"
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-line
      icon_color: cyan
      caption: median over distances, with its spread
      link: tab:Distance decay
      decimals: 2
    section: Key figures
    tag: hc-ov-kf-slope
    index: ov-kf-slope
    title: Decay slope
    description: Median log-log slope of the genome-wide pooled contact probability against genomic distance, over every distance bin.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hic
    data_collection_tag: tad_domains
    use: cooltools/domains
    aggregation: median
    column_name: size_kb
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: pink
      caption: median domain, with its spread
      link: tab:Domains
      decimals: 0
    section: Key figures
    tag: hc-ov-kf-domain
    index: ov-kf-domain
    title: Domain size (kb)
    description: Median size of the TAD domains called between insulation boundaries, every insulation window pooled.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the sample, then the FASTQ pairs, both on the hub.
  - component_type: interactive
    workflow_tag: hic
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Sample
    section: Findings
    tag: hc-ov-findings-sample
    index: ov-findings-sample
    title: Sample
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: hic
    data_collection_tag: samples
    interactive_component_type: RangeSlider
    column_name: n_libraries
    column_type: int64
    display:
      icon_name: mdi:file-multiple-outline
      custom_color: cyan
      strip_label: FASTQ pairs
    section: Findings
    tag: hc-ov-findings-libs
    index: ov-findings-libs
    title: FASTQ pairs merged
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per tab of the funnel, each citing one data collection, so
  # the import removes a row with its data.
  - component_type: text
    surface: card
    values:
      valid: {dc: pair_stats, column: valid_pair_rate, aggregation: median, format: percent}
      cis: {dc: pair_stats, column: cis_ratio, aggregation: median, format: percent}
      slope: {dc: distance_profile, column: log10_slope, aggregation: median,
        filter_expr: "col('chrom') == 'all'", format: 'decimals:2'}
      n_dom: {dc: tad_domains, column: size_kb, aggregation: count, format: integer}
      dom_kb: {dc: tad_domains, column: size_kb, aggregation: median, format: 'decimals:0'}
      ab_top: {dc: compartment_eigenvector, column: compartment, aggregation: top,
        filter_expr: "col('compartment') != ''"}
      ab_share: {dc: compartment_eigenvector, column: compartment, aggregation: top_share,
        filter_expr: "col('compartment') != ''", format: percent}
    body: |
      - **{{valid}}** of read pairs are valid ligation products, and **{{cis}}** of the unique ones are cis – median over samples [Valid pairs](tab:Valid pairs)
      - **{{slope}}** is the median log-log slope of contact probability against distance – the pooled curve; near -1 is the usual interphase range [Distance decay](tab:Distance decay)
      - **{{n_dom}}** TAD domains with a median size of **{{dom_kb}}** kb – every insulation window pooled [Domains](tab:Domains)
      - **{{ab_share}}** of the bins with an E1 sign sit in compartment {{ab_top}} – the larger one, every resolution pooled [Compartments](tab:Compartments)
    section: Findings
    tag: hc-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per tab of the funnel after MultiQC, in the order of the rows
  # above. Contact maps has none: it is a browser on one region, not a summary.
  - component_type: highlight
    section: Findings
    source_tab: Valid pairs
    source_component: pairs-sankey
    caption: Every read pair followed through mapping, the ligation filter and the contact class; losses peel off into the Lost lane.
    tag: hc-ov-hl-pairs
    index: ov-hl-pairs
    layout: {x: 0, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Distance decay
    source_component: decay-ps-curve
    hide_legend: true
    caption: Contact probability against distance on log-log axes; one colour per chromosome, plus the pooled curve.
    tag: hc-ov-hl-decay
    index: ov-hl-decay
    layout: {x: 4, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Domains
    source_component: dom-size-window
    caption: Domain size per insulation window; a wider window calls fewer, larger domains.
    tag: hc-ov-hl-domains
    index: ov-hl-domains
    layout: {x: 0, y: 6, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Compartments
    source_component: cmp-ab-chrom
    caption: Bins called A and B on every chromosome; a chromosome with no bar has no E1 sign.
    tag: hc-ov-hl-compartments
    index: ov-hl-compartments
    layout: {x: 4, y: 6, w: 4, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Valid pairs](tab:Valid pairs)

      ### Contacts
      - [Distance decay](tab:Distance decay)
      - [Contact maps](tab:Contact maps)

      ### Architecture
      - [Domains](tab:Domains)
      - [Compartments](tab:Compartments)
    section: How to read this dashboard
    tag: hc-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filter. The hub is the source of every sample link, so a
  # pick here narrows the MultiQC panels and every collection below them.
  - component_type: interactive
    workflow_tag: hic
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: hc-filter-sample
    index: hc-sample-filter
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: table
    workflow_tag: hic
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Sample sheet
    tag: hc-sample-sheet
    index: sample-sheet
    title: Sample sheet
    description: One row per sample, with the FASTQ pairs HiC-Pro merged into it.
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
# ============================================================================
# Data & QC
# ============================================================================
- title: MultiQC
  subtitle: Did the reads map, pair and filter down to valid contacts?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # Sourced on the sample hub, which links into the MultiQC panels.
  filter_sections:
  - name: Library scope
    icon: mdi:tune
    color: orange
    description: Samples by how many FASTQ pairs were merged into them
  grid_sections:
  - name: QC overview
    icon: mdi:chart-box-outline
    color: orange
    description: The headline numbers of every module, read counts and base quality
  - name: HiC-Pro processing
    icon: mdi:chart-bar
    color: orange
    description: Mapping, pairing, valid-pair filtering and the contact split
  - name: Read details
    icon: mdi:file-document-outline
    color: gray
    description: Sequence quality, GC and N content, duplication and the status checks
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [MultiQC](https://multiqc.info) gathers
      [FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/) on the merged reads
      and the [HiC-Pro](https://github.com/nservant/HiC-Pro) statistics, re-generated with
      MultiQC 1.35 because the run's own report has no parquet. Read the HiC-Pro panels in
      order: mapping, pairing, the valid-pair filter that drops dangling ends, self circles
      and re-ligations, then the cis and trans split of what survives.
    tag: hc-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: hic
    data_collection_tag: samples
    interactive_component_type: RangeSlider
    column_name: n_libraries
    column_type: int64
    display:
      icon_name: mdi:file-multiple-outline
      custom_color: cyan
    section: Library scope
    group: Libraries
    tag: hc-mqc-filter-libs
    index: hc-mqc-libs-range
    title: FASTQ pairs merged
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: multiqc
    workflow_tag: hic
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: QC overview
    tag: hc-mqc-general-stats
    title: General statistics
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: hic
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Counts
    section: QC overview
    tag: hc-mqc-fastqc-counts
    title: Sequence counts
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: hic
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    section: QC overview
    tag: hc-mqc-fastqc-quality
    title: Per-base sequence quality
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: hic
    data_collection_tag: multiqc_data
    use: multiqc/hicpro
    selected_module: hicpro
    selected_plot: Read Mapping
    section: HiC-Pro processing
    tag: hc-mqc-hicpro-mapping
    title: Read mapping
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: hic
    data_collection_tag: multiqc_data
    use: multiqc/hicpro
    selected_module: hicpro
    selected_plot: Read Pairing
    section: HiC-Pro processing
    tag: hc-mqc-hicpro-pairing
    title: Read pairing
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: hic
    data_collection_tag: multiqc_data
    use: multiqc/hicpro
    selected_module: hicpro
    selected_plot: Read Pair Filtering
    section: HiC-Pro processing
    tag: hc-mqc-hicpro-filtering
    title: Valid-pair filtering
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: hic
    data_collection_tag: multiqc_data
    use: multiqc/hicpro
    selected_module: hicpro
    selected_plot: Contact Statistics
    section: HiC-Pro processing
    tag: hc-mqc-hicpro-contacts
    title: Contact statistics
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: hic
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Per Sequence Quality Scores
    section: Read details
    tag: hc-mqc-fastqc-perseq
    title: Per sequence quality scores
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: hic
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Per Sequence GC Content
    section: Read details
    tag: hc-mqc-fastqc-gc
    title: GC content
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: hic
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Per Base N Content
    section: Read details
    tag: hc-mqc-fastqc-ncontent
    title: Per-base N content
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: hic
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Duplication Levels
    section: Read details
    tag: hc-mqc-fastqc-dup
    title: Sequence duplication levels
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: hic
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Status Checks
    section: Read details
    tag: hc-mqc-fastqc-status
    title: Status checks
    layout: {x: 0, y: 8, w: 8, h: 4}
# HiC-Pro's statistics as numbers rather than images: one funnel row per sample
# (pair_stats) and one weighted row per read-pair fate (pair_flow).
- title: Valid pairs
  subtitle: Where do the read pairs go, and how many become valid contacts?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:filter-variant
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Pair filters
    icon: mdi:filter-variant
    color: teal
    description: Narrows the flow to one fate and the funnel to a valid-pair rate band
  grid_sections:
  - name: Pairs at a glance
    icon: mdi:counter
    color: teal
    description: The funnel, the valid-pair rate, duplication and the mapping outcomes
  - name: Where the pairs go
    icon: mdi:relation-many-to-many
    color: teal
    description: Every read pair, followed to the decision where it stops
  - name: Pair tables
    icon: mdi:table
    color: gray
    description: The fates and the funnel as rows, per sample
