# The locus tab. The navigator (genome_view on tad_domains) opens on its
# default_region and emits a chromosome + position pair on chrom / start. The
# three `region` links in template.yaml rename that pair onto contact_matrix
# (chrom1 / start1), tad_insulation and compartment_eigenvector (chrom /
# start), so the triangle and both tracks clamp their x axis to the same
# region. coverage_track and genome_view never share a collection on this tab
# (test_no_double_track_binding): each 1D track is one coverage_track tile
# with views [track, locus].
- title: Contact maps
  subtitle: What do the contacts, domains and compartments look like at one locus?
  tab_group: Contacts
  tab_order: 4
  tab_icon: mdi:grid
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # No chromosome control here: the navigator's locus field is the tab's
  # chromosome and position, and a sidebar chromosome filter would not travel
  # the region links. What stays is the choice of which calls each track draws.
  filter_sections:
  - name: Track filters
    icon: mdi:tune
    color: indigo
    description: Which insulation windows, domain calls and compartment resolutions to draw
  grid_sections:
  - name: Region at a glance
    icon: mdi:counter
    color: indigo
    description: What the region in view holds, recounted on every brush or locus entry
  - name: One region, four tracks
    icon: mdi:dna
    color: indigo
    description: The domain navigator and the triangle and tracks that follow its region
  components:
  - component_type: text
    order: 1
    body: >
      [cooler](https://cooler.readthedocs.io) bins and balances the valid pairs into the
      contact matrix, and [cooltools](https://cooltools.readthedocs.io) reads the insulation
      score and the A/B eigenvector off it. Type a locus or a gene in the navigator's header,
      or brush its axis, and the triangle, both tracks and the cards follow. The triangle
      draws the finest resolution that fits the span, so a domain smaller than one bin shows
      in the tracks only.
    tag: hc-cm-intro
    index: cm-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: hic
    data_collection_tag: tad_domains
    interactive_component_type: RangeSlider
    column_name: window
    column_type: int64
    display:
      icon_name: mdi:ruler
      custom_color: pink
    section: Track filters
    group: Track calls
    tag: hc-cm-filter-domainwindow
    index: hc-cm-domainwindow-filter
    title: Domain window (bp)
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: hic
    data_collection_tag: tad_insulation
    interactive_component_type: RangeSlider
    column_name: window
    column_type: int64
    display:
      icon_name: mdi:ruler
      custom_color: red
    section: Track filters
    group: Track calls
    tag: hc-cm-filter-window
    index: hc-cm-window-filter
    title: Insulation window (bp)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: hic
    data_collection_tag: compartment_eigenvector
    interactive_component_type: RangeSlider
    column_name: resolution
    column_type: int64
    display:
      icon_name: mdi:ruler
      custom_color: violet
    section: Track filters
    group: Track calls
    tag: hc-cm-filter-cpres
    index: hc-cm-cpres-filter
    title: Compartment resolution (bp)
    layout: {x: 0, y: 6, w: 1, h: 3}
  # The four cards follow the navigator's region, as the tracks do.
  - component_type: card
    workflow_tag: hic
    data_collection_tag: contact_matrix
    use: cooler/contact_matrix
    aggregation: median
    column_name: count
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    follow_region_filter: true
    display:
      icon_name: mdi:grid
