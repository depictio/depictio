      `hicPlotDistVsCounts` curve, as the run published it: 13 points, pooled
      across the genome, from the 250 kb matrix. It is kept for comparison
      with the recomputed curve above, which resolves the same decay per
      chromosome and out to the full chromosome length.
    workflow_tag: hic
    data_collection_tag: distance_decay
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
