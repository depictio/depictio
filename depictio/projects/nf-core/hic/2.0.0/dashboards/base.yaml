    description: One curve per chromosome plus the pooled curve on log-log axes, with the local slope d log P / d log s underneath.
    layout: {x: 0, y: 0, w: 8, h: 8}
  - component_type: table
    workflow_tag: hic
    data_collection_tag: distance_profile
    use: cooltools/distance_profile
