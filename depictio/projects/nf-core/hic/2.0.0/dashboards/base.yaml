    index: dd-card-slope
    title: Log-log slope
    description: Median local slope of P(s) over every distance bin of the curves in view, the pooled one included.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hic
    data_collection_tag: pair_flow
    use: hicpro/pair_flow
    aggregation: sum
    column_name: pairs
    column_type: int64
