# ============================================================================
# Compare samples
# ============================================================================
- title: Compare samples
  subtitle: What a multi-sample Hi-C run would add, and what the collections already carry for it
  tab_order: 7
  tab_icon: mdi:account-group-outline
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Cohort scope
    icon: mdi:tune
    color: grape
    description: Contact fate to compare the samples on
  grid_sections:
  - name: Cohort at a glance
    icon: mdi:counter
    color: grape
    description: The per-sample numbers a cohort would be ranked on
  - name: What is missing
    icon: mdi:account-group-outline
    color: grape
    description: Why this tab has one bar today
  - name: Per-sample table
    icon: mdi:table
    color: gray
    description: The funnel, one row per sample
  components:
  - component_type: card
    tag: hc-cs-card-valid
    index: hc-cs-card-valid
    section: Cohort at a glance
    workflow_tag: hic
    data_collection_tag: pair_stats
    use: hicpro/pair_stats
    aggregation: sum
    column_name: valid_pairs_rmdup
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:check-decagram', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
