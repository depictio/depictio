  - component_type: card
    workflow_tag: hic
    data_collection_tag: tad_domains
    use: cooltools/domains
    aggregation: count
    column_name: size_kb
    column_type: float64
    secondary_layout: top_n
    breakdown_col: chrom
    top_n_count: 3
    display:
      icon_name: mdi:shape-outline
      icon_color: red
      caption: the chromosomes with the most
    section: Domains at a glance
    tag: hc-dom-card-count
    index: dom-card-count
    title: Domains called
    description: TAD domains in view, every insulation window counted.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hic
    data_collection_tag: tad_domains
    use: cooltools/domains
    aggregation: median
    column_name: valid_fraction
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:check-decagram
      icon_color: teal
      caption: median per domain, with the distribution
      format: percent
    section: Domains at a glance
    tag: hc-dom-card-valid
    index: dom-card-valid
    title: Mappable share
    description: Median share of each domain's span covered by bins the balancing kept.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hic
    data_collection_tag: tad_insulation
    use: cooltools/insulation
    aggregation: count
    column_name: is_boundary
    column_type: bool
    secondary_layout: donut
    breakdown_col: is_boundary
    display:
      icon_name: mdi:border-all-variant
      icon_color: orange
      caption: bins called a boundary (true) against the rest
    section: Domains at a glance
    tag: hc-dom-card-boundaries
    index: dom-card-boundaries
