  - component_type: text
    tag: hc-ls-ps-intro
    section: Contact probability
    title: The curve that says what kind of genome this is
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      P(s) is the probability that two loci a distance s apart are in contact.
      It is recomputed here from the balanced contact dump rather than read
      from a tool output, because nf-core/hic never runs cooltools expected-cis
      and the curve the pipeline does publish stops at 3 Mb with a single
      pooled series. The denominator is every bin pair that could have been
      observed at that separation, not the non-zero pixels the sparse dump
      wrote, which is what keeps the tail from flattening artificially. The
      panel under the curves is its local log-log slope: a fractal globule
      sits near -1, an equilibrium globule falls to -1.5 and steeper, and a
      bump or a plateau is trans contamination or a large rearrangement.
    workflow_tag: hic
    data_collection_tag: distance_profile
    layout: {x: 0, y: 0, w: 8, h: 3}
