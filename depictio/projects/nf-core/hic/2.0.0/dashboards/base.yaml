    aggregation: count
    column_name: E1
    column_type: float64
    secondary_layout: donut
    breakdown_col: compartment
    display: {icon_name: 'mdi:chart-donut', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: A and B bins in this region
    layout: {x: 6, y: 0, w: 2, h: 2}

  # ------------------------------------------------------------ locus section
  # The navigator (genome_view on tad_domains) opens on its default_region and
  # emits a chromosome + position pair on chrom / start. The three `region`
  # links in template.yaml rename that pair onto contact_matrix (chrom1 /
  # start1), tad_insulation and compartment_eigenvector (chrom / start), so
  # the triangle and both tracks clamp their x axis to the same region.
  # coverage_track and genome_view never share a collection on this tab
  # (test_no_double_track_binding): each 1D track is one coverage_track tile
  # with views [track, locus].
  - component_type: text
    tag: hc-cm-intro
    section: Genome architecture
    title: One region, four collections
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The section opens on a documented default region, chr2:65-85 Mb; type a
      locus or a gene symbol in the navigator header, or brush its axis, and
      the contact triangle and both tracks move with it. The triangle draws the
      finest dumped resolution that fits the span, so domains smaller than that
      bin show in the tracks but not as triangles.
    workflow_tag: hic
    data_collection_tag: tad_domains
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: hc-cm-av-navigator
    index: hc-cm-av-navigator
    section: Genome architecture
    workflow_tag: hic
    data_collection_tag: tad_domains
    use: cooltools/domain_track
    config:
      controls_placement: header
      mark: rect
      category_col: window
      assembly: "{GENOME}"
      annotation: "{GENOME}"
      score_title: Domain size (kb)
      opacity: 0.75
      region_filter_enabled: true
      default_region: "chr2:65,000,000-85,000,000"
    title: "TAD domains, the navigator"
    description: "One rectangle per domain, coloured by the insulation window it was called at, on the {GENOME} axis. The locus field and a brush on this axis move every tile below."
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 3}
  - component_type: advanced_viz
    tag: hc-cm-av-matrix
    index: hc-cm-av-matrix
    section: Genome architecture
    workflow_tag: hic
    data_collection_tag: contact_matrix
    use: cooler/binned_contact_map
    config:
      controls_placement: header
      sample_col: sample
      end1_col: end1
      end2_col: end2
      display: triangle
      colour_scale: Inferno
      log_scale: true
    title: "Contact triangle"
    description: "ICE-balanced intra-chromosomal contacts over the region the navigator shows, on the same x axis as the tracks, at the resolution matching its span. Height is the separation between the two bins; colour is contact frequency on a log scale."
    title_size: h3
    layout: {x: 0, y: 5, w: 8, h: 6}
  - component_type: advanced_viz
    tag: hc-cm-av-insulation
    index: hc-cm-av-insulation
    section: Genome architecture
    workflow_tag: hic
    data_collection_tag: tad_insulation
    use: cooltools/insulation_track
    config:
      controls_placement: header
      end_col: end
      sample_col: window
      view_mode: overlay
      color_by: sample
      y_scale: linear
      view: track
      views: [track, locus]
      locus_annotation: "{GENOME}"
      locus_assembly: "{GENOME}"
    title: "Insulation score"
    description: "log2 insulation per bin, one line per insulation window. Dips are the TAD boundaries the domains above are cut at; masked bins carry no value."
    title_size: h3
    layout: {x: 0, y: 11, w: 8, h: 3}
  - component_type: advanced_viz
    tag: hc-cm-av-compartment
    index: hc-cm-av-compartment
    section: Genome architecture
    workflow_tag: hic
    data_collection_tag: compartment_eigenvector
    use: cooltools/compartment_track
    config:
      controls_placement: header
      end_col: end
      sample_col: resolution
      category_col: compartment
      view_mode: overlay
      color_by: sample
      y_scale: linear
      view: track
      views: [track, locus]
      locus_annotation: "{GENOME}"
      locus_assembly: "{GENOME}"
    title: "A/B compartment track (E1)"
    description: "The first eigenvector per bin, one line per eigs-cis resolution, phased so the better-covered compartment is positive. Above zero is A, below it B; the switches line up with the checkerboard in the triangle."
    title_size: h3
    layout: {x: 0, y: 14, w: 8, h: 3}

  # ---------------------------------------------------------------- filters
  # No chromosome control here: the navigator's locus field is the section's
  # chromosome and position, and a sidebar chromosome filter would not travel
  # the region links (they carry only the genome_selection pair). What stays
  # is the choice of which calls each track draws.
  - component_type: interactive
    tag: hc-cm-filter-domainwindow
