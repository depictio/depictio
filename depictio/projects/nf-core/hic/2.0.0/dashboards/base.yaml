    title: "A/B compartment track (E1)"
    description: "The first eigenvector per bin, one line per eigs-cis resolution. Above zero is the A compartment, below it B; the switches line up with the checkerboard in the triangle."
    title_size: h3
    layout: {x: 0, y: 14, w: 8, h: 3}

