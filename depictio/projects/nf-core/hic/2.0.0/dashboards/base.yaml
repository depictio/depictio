# ============================================================================
# Contact maps
# ============================================================================
- title: Contact maps
  subtitle: The locus tab. TAD domains, the contact triangle, the insulation score and the A/B compartment track on one genomic axis, all following one region
  tab_order: 4
  tab_icon: mdi:grid
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Region scope
    icon: mdi:map-marker-outline
    color: indigo
    description: Which insulation windows, domain calls and compartment resolutions the tracks draw
  grid_sections:
  - name: Matrix at a glance
    icon: mdi:counter
    color: indigo
    description: The signal in the matrix and in the tracks under it, in the region on view
  - name: Genome architecture
    icon: mdi:dna
    color: indigo
    description: One region, four collections. The domain navigator drives the triangle and the two tracks under it
  components:
  - component_type: card
    tag: hc-cm-card-count
    index: hc-cm-card-count
    section: Matrix at a glance
    workflow_tag: hic
    data_collection_tag: contact_matrix
    use: cooler/contact_matrix
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: count
    column_type: float64
    display: {icon_name: 'mdi:grid', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Balanced contacts in this region
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: hc-cm-card-insulation
    index: hc-cm-card-insulation
    section: Matrix at a glance
    workflow_tag: hic
    data_collection_tag: tad_insulation
    use: cooltools/insulation
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: log2_insulation_score
    column_type: float64
    display: {icon_name: 'mdi:chart-line', icon_color: '#D81B60', title_color: '#D81B60', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Insulation in this region
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: hc-cm-card-e1
    index: hc-cm-card-e1
    section: Matrix at a glance
    workflow_tag: hic
    data_collection_tag: compartment_eigenvector
    use: cooltools/eigenvector
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: E1
    column_type: float64
    display: {icon_name: 'mdi:scale-balance', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: E1 in this region
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: hc-cm-card-compartment
    index: hc-cm-card-compartment
    section: Matrix at a glance
    workflow_tag: hic
    data_collection_tag: compartment_eigenvector
