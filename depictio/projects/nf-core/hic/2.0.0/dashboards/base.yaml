    title: The curve that says what kind of genome this is
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      P(s), the probability that two loci a distance s apart are in contact,
      per chromosome and pooled, with its local log-log slope underneath. A
      slope near -1 is the usual interphase range, a fall to -1.5 and steeper
      is a more compact polymer, and a bump or plateau points to trans
      contamination or a large rearrangement.
