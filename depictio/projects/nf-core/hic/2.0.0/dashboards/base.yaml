# ============================================================================
# Architecture
# ============================================================================
# Genome-wide: no tracks, no region and no chromosome filter (the tracks live
# on Contact maps, the locus tab), so every card reads the whole genome.
- title: Domains
  subtitle: How many TAD domains are there, and how large are they?
  tab_group: Architecture
  tab_order: 5
  tab_icon: mdi:border-all-variant
  tab_icon_color: pink
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Domain filters
    icon: mdi:tune
    color: pink
    description: The insulation windows the domains and boundaries were called at
  grid_sections:
  - name: Domains at a glance
    icon: mdi:counter
    color: pink
    description: How many domains, how large, how mappable, and the boundary bins
  - name: Domain sizes
    icon: mdi:chart-box-outline
    color: pink
    description: Domain size per insulation window
  - name: Domain tables
    icon: mdi:table
    color: gray
    description: The domain intervals and the insulation bins behind them
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [cooltools](https://cooltools.readthedocs.io) scores each bin's insulation and flags
      the bins depleted of crossing contacts as boundaries; a domain is everything between
      two boundaries, and one that is mostly unmappable is dropped. Each insulation window
      calls its own set, so pick a window before comparing counts.
    tag: hc-dom-intro
    index: dom-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: hic
    data_collection_tag: tad_domains
    interactive_component_type: RangeSlider
