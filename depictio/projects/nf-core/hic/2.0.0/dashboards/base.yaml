# ============================================================================
# TADs and boundaries
# ============================================================================
- title: TADs and boundaries
  subtitle: The insulation score cooltools scans across the matrix, the boundaries it calls from it, and the domains those boundaries enclose
  tab_order: 6
  tab_icon: mdi:border-all-variant
  tab_icon_color: pink
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Insulation scope
    icon: mdi:tune
    color: pink
    description: Chromosome, window size and resolution to keep in view
  grid_sections:
  - name: Domains at a glance
    icon: mdi:counter
    color: pink
    description: How many domains, how large, and how much of them is mappable
  - name: TAD domains
    icon: mdi:shape-outline
    color: pink
    description: The intervals between consecutive boundary calls
  - name: Insulation score
    icon: mdi:chart-line
    color: grape
    description: Low insulation marks a TAD boundary
  - name: Domain and insulation tables
    icon: mdi:table
    color: gray
    description: The rows behind both tracks
    collapsed: true
  components:
  - component_type: card
    tag: hc-td-card-size
    index: hc-td-card-size
    section: Domains at a glance
    workflow_tag: hic
    data_collection_tag: tad_domains
    use: cooltools/domains
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: size_kb
    column_type: float64
    display: {icon_name: 'mdi:ruler', icon_color: '#D81B60', title_color: '#D81B60', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Domain size (kb)
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: hc-td-card-count
    index: hc-td-card-count
    section: Domains at a glance
    workflow_tag: hic
    data_collection_tag: tad_domains
    use: cooltools/domains
    aggregation: count
    column_name: size_kb
    column_type: float64
    secondary_layout: top_n
    breakdown_col: chrom
    top_n_count: 3
    display: {icon_name: 'mdi:shape-outline', icon_color: '#D81B60', title_color: '#D81B60', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Domains called
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: hc-td-card-valid
    index: hc-td-card-valid
    section: Domains at a glance
    workflow_tag: hic
    data_collection_tag: tad_domains
    use: cooltools/domains
    aggregation: average
    column_name: valid_fraction
    column_type: float64
    secondary_layout: gauge
    coverage_max: 1.0
    display: {icon_name: 'mdi:check-decagram', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mappable share of a domain
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: hc-td-card-boundaries
    index: hc-td-card-boundaries
    section: Domains at a glance
    workflow_tag: hic
    data_collection_tag: tad_insulation
    use: cooltools/insulation
    aggregation: count
    column_name: is_boundary
    column_type: bool
    secondary_layout: donut
    breakdown_col: is_boundary
    display: {icon_name: 'mdi:border-all-variant', icon_color: '#EC407A', title_color: '#EC407A', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Bins called a boundary
    layout: {x: 6, y: 0, w: 2, h: 2}

  - component_type: text
    tag: hc-td-domains-intro
    section: TAD domains
    title: A domain is what lies between two boundaries
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      cooltools calls boundaries, not domains: it flags the individual bins
      whose neighbourhood is depleted of crossing contacts. The interval list
      below is derived from those flags, because no module in nf-core/hic 2.x
      emits one (hicFindTADs never runs, as the execution trace confirms).
      Runs of adjacent flagged bins are merged first, since a boundary at
      20 kb is usually two or three bins wide, and a domain then runs from the
      end of one boundary to the start of the next. Domains are scored on how
      much of their span is mappable, and one that is mostly unmappable is
      dropped rather than reported as an enormous TAD.
    workflow_tag: hic
    data_collection_tag: tad_domains
    layout: {x: 0, y: 0, w: 8, h: 3}
  - component_type: advanced_viz
    tag: hc-td-av-domains
    index: hc-td-av-domains
    section: TAD domains
    workflow_tag: hic
    data_collection_tag: tad_domains
    use: cooltools/domain_track
    config:
      controls_placement: header
      mark: rect
      category_col: window
      assembly: mm10
      annotation: mm10
      score_title: Domain size (kb)
      point_size: 3
      opacity: 0.75
      region_filter_enabled: true
      default_region: "chr2:65,000,000-85,000,000"
    title: "TAD domains along the genome"
    description: "One rectangle per domain, from the left boundary to the right one, coloured by the insulation window it was called at, over the mm10 gene lane. A brush here moves the insulation track below."
    title_size: h3
    layout: {x: 0, y: 3, w: 8, h: 7}
  - component_type: text
    tag: hc-td-intro
    section: Insulation score
    title: Where contacts stop crossing
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [cooltools insulation](https://cooltools.readthedocs.io) slides a window
      along the diagonal and scores how depleted of crossing contacts each bin
      is; a bin whose neighbourhood is depleted is a TAD boundary.
      `is_boundary` is cooltools' own threshold call on the score's local
      minima, at every window size the run scanned. The window matters: a
      wider window calls fewer, larger domains.
    workflow_tag: hic
    data_collection_tag: tad_insulation
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One tile, two readings (test_no_double_track_binding): it used to be a
  # genome_view and a coverage_track on tad_insulation. It opens on the track
  # view because that view clamps its x axis to the region the domain track
  # above emits (tad_domains -> tad_insulation region link); the locus view
  # narrows its rows to the region but does not zoom to it yet (HC-D20).
  - component_type: advanced_viz
    tag: hc-td-av-track
    index: hc-td-av-track
    section: Insulation score
    workflow_tag: hic
    data_collection_tag: tad_insulation
    use: cooltools/insulation_track
    config:
      controls_placement: header
      end_col: end
      sample_col: window
      view_mode: overlay
      color_by: sample
      y_scale: linear
      view: track
      views: [track, locus]
      locus_annotation: none
      locus_assembly: mm10
    title: "Insulation score, on the genome axis"
    description: "log2 insulation per bin, one line per window, clamped to the region brushed or typed on the domains above. Dips mark candidate TAD boundaries; masked bins carry no value. The header switch flips to the GenomeSpy locus view."
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 6}

  - component_type: table
    tag: hc-td-table-domains
    section: Domain and insulation tables
    workflow_tag: hic
    data_collection_tag: tad_domains
    use: cooltools/domains
    row_selection_enabled: false
    title: TAD domains
    description: Every domain, with its span, the bins it covers and the boundary strength at each edge.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: table
    tag: hc-td-table
    section: Domain and insulation tables
    workflow_tag: hic
    data_collection_tag: tad_insulation
    use: cooltools/insulation
    row_selection_enabled: false
    title: Insulation bins
    description: Every bin's insulation score and boundary call, every resolution and window the run scanned.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 7, w: 8, h: 7}

  # ---------------------------------------------------------------- filters
  - component_type: interactive
    tag: hc-td-filter-chrom
    index: hc-td-chrom-filter
    section: Insulation scope
    group: Region
    workflow_tag: hic
    data_collection_tag: tad_domains
    interactive_component_type: Select
    column_name: chrom
    column_type: object
    display: {title_size: md, custom_color: '#D81B60', icon_name: 'mdi:map-marker-outline'}
    placement: left
    title: Chromosome (domains)
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: hc-td-filter-inschrom
    index: hc-td-inschrom-filter
    section: Insulation scope
    group: Region
    workflow_tag: hic
