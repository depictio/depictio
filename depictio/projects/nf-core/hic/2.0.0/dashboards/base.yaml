      log_scale: true
    title: "Contact triangle"
    description: "ICE-balanced intra-chromosomal contacts on the same x axis as the domains above, at the resolution matching the region. Height is the separation between the two bins; colour is contact frequency on a log scale."
    title_size: h3
    layout: {x: 0, y: 5, w: 8, h: 6}
  - component_type: advanced_viz
