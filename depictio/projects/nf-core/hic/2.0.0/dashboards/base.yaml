    use: cooltools/ps_curve
    config:
      x_title: Genomic distance (bp)
      y_title: Contact probability
      log_x: true
      log_y: true
      derivative: true
      derivative_window: 3
      legend_pos: right
    title: "Contact probability P(s) and its slope"
    description: "One curve per chromosome plus the pooled genome-wide curve on log-log axes, with the local slope d log P / d log s in the panel underneath."
    title_size: h3
    layout: {x: 0, y: 3, w: 8, h: 9}

  - component_type: text
    tag: hc-ls-decay-intro
    section: The published curve
    title: What the pipeline itself wrote
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
