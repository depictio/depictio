    section: Domain tables
    tag: hc-dom-table-insulation
    index: dom-table-insulation
    title: Insulation bins
    description: Every bin's insulation score and boundary call, at every resolution and window the run scanned.
    layout: {x: 0, y: 6, w: 8, h: 6}
- title: Compartments
  subtitle: How does the genome split between the A and B compartments?
  tab_group: Architecture
  tab_order: 6
  tab_icon: mdi:scale-balance
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Compartment filters
    icon: mdi:tune
    color: violet
    description: The resolution the eigenvector was computed at, and the compartment
  grid_sections:
  - name: Compartments at a glance
    icon: mdi:counter
    color: violet
    description: The A and B split, the eigenvector and the strength of the first two components
  - name: A and B per chromosome
    icon: mdi:chart-bar
    color: violet
    description: Bins called A and B on every chromosome
  - name: Compartment tables
    icon: mdi:table
    color: gray
    description: The compartment bins and the eigenvalues per chromosome
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [cooltools](https://cooltools.readthedocs.io) takes the first eigenvector (E1) of each
      chromosome's correlation matrix: above zero is compartment A, below it B. The pipeline
      passes no phasing track, so the recipe orients E1 to correlate with bin coverage and the
      better-covered side is A at every resolution; pick one resolution before comparing.
    tag: hc-cmp-intro
    index: cmp-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: hic
    data_collection_tag: compartment_eigenvector
    interactive_component_type: RangeSlider
    column_name: resolution
    column_type: int64
    display:
      icon_name: mdi:ruler
      custom_color: violet
    section: Compartment filters
    group: Calls
    tag: hc-cmp-filter-resolution
    index: hc-cmp-resolution-filter
    title: Compartment resolution (bp)
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: hic
    data_collection_tag: compartment_eigenvector
    interactive_component_type: MultiSelect
    column_name: compartment
    column_type: object
    display:
      icon_name: mdi:scale-balance
      custom_color: grape
    section: Compartment filters
    group: Calls
    tag: hc-cmp-filter-compartment
    index: hc-cmp-compartment-filter
    title: Compartment
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: hic
    data_collection_tag: compartment_eigenvector
    use: cooltools/eigenvector
    aggregation: count
    column_name: E1
    column_type: float64
    filter_expr: col('compartment') != ''
    secondary_layout: donut
    breakdown_col: compartment
    display:
      icon_name: mdi:chart-donut
      icon_color: grape
      caption: bins, A against B
    section: Compartments at a glance
    tag: hc-cmp-card-split
    index: cmp-card-split
    title: A and B bins
    description: Bins with an E1 sign, split by compartment, every resolution in view counted.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hic
    data_collection_tag: compartment_eigenvector
    use: cooltools/eigenvector
    aggregation: median
    column_name: E1
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:scale-balance
      icon_color: violet
      caption: median per bin, with its distribution
      decimals: 2
    section: Compartments at a glance
    tag: hc-cmp-card-e1
    index: cmp-card-e1
    title: E1
    description: Median first eigenvector of the bins in view; strong compartments split its distribution in two.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hic
    data_collection_tag: compartment_eigenvalues
    use: cooltools/eigenvalues
    aggregation: median
    column_name: eigval1
    column_type: float64
    secondary_layout: top_n
    breakdown_col: chrom
    top_n_count: 3
    display:
      icon_name: mdi:chart-box-outline
      icon_color: pink
      caption: the chromosomes with the strongest first component
      decimals: 0
    section: Compartments at a glance
    tag: hc-cmp-card-eig1
    index: cmp-card-eig1
    title: Eigenvalue 1
    description: Median first eigenvalue per chromosome; the larger it is against the second, the clearer the compartments.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: hic
    data_collection_tag: compartment_eigenvalues
    use: cooltools/eigenvalues
    aggregation: median
    column_name: eigval2
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bar
      icon_color: indigo
      caption: median per chromosome, with its spread
      decimals: 0
    section: Compartments at a glance
    tag: hc-cmp-card-eig2
    index: cmp-card-eig2
    title: Eigenvalue 2
    description: Median second eigenvalue per chromosome, the yardstick the first is read against.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: hic
    data_collection_tag: compartment_eigenvector
    use: cooltools/eigenvector
    mode: code
    visu_type: bar
    code_content: |-
      # Bins called A and B per chromosome, coloured by compartment from the family
      # map. The group, when Analysis mode sets one, splits the bars into rows.
      grp = [g for g in depictio_group_by if g in df.columns]
      colors = depictio_category_colors.get('compartment') or {}
      d = df.filter(pl.col('compartment').is_in(['A', 'B'])).group_by([*grp, 'chrom', 'compartment']).agg(pl.len().alias('bins'))
      # Natural chromosome order: chr2 before chr10, then X, Y and the rest.
      order = d.with_columns(pl.col('chrom').str.replace('^chr', '').cast(pl.Int64, strict=False).alias('chrom_num')).sort(['chrom_num', 'chrom'], nulls_last=True)['chrom'].unique(maintain_order=True).to_list()
      fig = px.bar(d.to_pandas(), x='chrom', y='bins', color='compartment', facet_row=grp[0] if grp else None, color_discrete_map=colors, category_orders={'chrom': order, 'compartment': ['A', 'B']}, labels={'chrom': '', 'bins': 'Bins', 'compartment': 'Compartment'})
      fig.update_layout(margin=dict(t=10))
    section: A and B per chromosome
    tag: hc-cmp-fig-chrom
    index: cmp-ab-chrom
    title: A and B bins per chromosome
    description: Bins called A and B on every chromosome, every resolution pooled unless the resolution filter narrows them.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    workflow_tag: hic
    data_collection_tag: compartment_eigenvector
    use: cooltools/eigenvector
    row_selection_enabled: false
    section: Compartment tables
    tag: hc-cmp-table-bins
    index: cmp-table-bins
    title: Compartment bins
    description: Every bin's balancing weight, its compartment call and its three eigenvectors, at every resolution.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: hic
    data_collection_tag: compartment_eigenvalues
    use: cooltools/eigenvalues
    row_selection_enabled: true
    row_selection_column: sample
    section: Compartment tables
    tag: hc-cmp-table-eigenvalues
    index: cmp-table-eigenvalues
    title: Compartment eigenvalues
    description: The first three eigenvalues per chromosome, at every resolution the run scanned.
    layout: {x: 0, y: 6, w: 8, h: 6}
