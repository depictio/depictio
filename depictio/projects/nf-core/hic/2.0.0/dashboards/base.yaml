    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: hic
    data_collection_tag: tad_domains
    use: cooltools/domains
    aggregation: median
    column_name: size_kb
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
