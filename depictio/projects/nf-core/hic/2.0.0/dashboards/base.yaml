    section: Region at a glance
    tag: hc-cm-card-insulation
    index: cm-card-insulation
    title: Insulation score
    description: Median log2 insulation score of the bins inside the region in view; boundaries are its dips.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
