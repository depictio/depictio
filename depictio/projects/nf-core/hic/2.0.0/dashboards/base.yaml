    description: Insulation bins scanned, every window counted, split into the bins called a boundary and the rest.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: hic
    data_collection_tag: tad_domains
    use: cooltools/domains
    mode: code
    visu_type: box
    code_content: |-
      # Domain size per insulation window: a wider window calls fewer, larger
      # domains. Colours by nothing of its own, so it spreads the group kwargs whole.
      d = df.sort('window').with_columns((pl.col('window') // 1000).cast(pl.Utf8).alias('window_kb'))
      fig = px.box(d.to_pandas(), x='window_kb', y='size_kb', points='outliers', labels={'window_kb': 'Insulation window (kb)', 'size_kb': 'Domain size (kb)'}, **depictio_group_kwargs)
      fig.update_xaxes(type='category')
      fig.update_layout(margin=dict(t=10))
    section: Domain sizes
    tag: hc-dom-fig-size
    index: dom-size-window
    title: Domain size by insulation window
    description: One box per insulation window; the median should grow with the window.
    layout: {x: 0, y: 0, w: 8, h: 4, fit: auto}
