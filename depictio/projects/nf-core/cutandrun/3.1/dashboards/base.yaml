    layout: {x: 0, y: 12, w: 1, h: 3}
  # A count over rows that are the peaks, split by sample: parts of a whole.
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/peaks
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: composition
    breakdown_col: sample
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: indigo
      caption: SEACR regions, by sample
    section: Peaks at a glance
    tag: cr-pk-card-count
    index: pk-card-count
    title: Regions
    description: SEACR regions of the samples in view, inside the width and coverage bands.
