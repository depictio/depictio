  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/peaks
    aggregation: median
    column_name: width
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: violet
      caption: median per region, with its spread
      decimals: 0
    section: Peaks at a glance
    tag: cr-pk-card-width
    index: pk-card-width
    title: Region width (bp)
    description: Median SEACR region width; a broad mark gives far wider regions than a sharp one.
