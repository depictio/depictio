version: 1
# nf-core/cutandrun 3.1. Every rule this file follows is written out in
# depictio/projects/nf-core/RULES.md; ampliseq/2.18.0 is the reference.
#
# Funnel: the Overview, then Data & QC (the reprocessed MultiQC report, then
# the libraries: spike-in, duplication, enrichment over the IgG control), then
# Chromatin signal (the fragment ladder, then the peaks it yields), then
# Agreement (the two callers, the replicates of a target, one region).
#
# The IgG controls are samples, not noise: they carry the MultiQC panels, the
# spike-in factors and the fingerprint that says whether a target is enriched
# at all. Only the peak collections omit them, because no caller ran on one.
#
# The MultiQC report bound here was re-generated with MultiQC 1.35 from the
# run's raw tool outputs; the run itself published MultiQC 1.14, which writes no
# parquet. The run ships no params.json either, so `params:` links open the
# software versions, the only provenance it has.
#
# Routes: MACS2 is optional (`--peakcaller seacr`). A run without it loses the
# MACS2 tiles; the caller comparison keeps a row per sample with n_peaks 0. The
# fragment BEDs are optional too, and the pile-up tiles go with them.
main_dashboard:
  title: nf-core/cutandrun
  subtitle: Chromatin profiling, from fragments to the peaks replicates reproduce
  project_tag: CUT&RUN Chromatin Profiling
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab: figures, advanced viz and filter
  # chips colour a value the same way. `target` is the run's grouping (one
  # value per mark, the IgG control included); the others are vocabularies the
  # recipes write.
  category_colors:
    target: auto
    role:
      target: '#2a78d6'
      IgG control: '#868e96'
    caller:
      seacr: '#4a3aa7'
      macs2: '#eb6834'
    fragment_class:
      Sub-nucleosomal: '#2a78d6'
      Mononucleosomal: '#1baf7a'
      Dinucleosomal: '#eda100'
      Multi-nucleosomal: '#e87ba4'
    signal_class:
      In peaks: '#1baf7a'
      Outside peaks: '#adb5bd'
    support: auto
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. Bound
  # to the sample hub, the source of every sample link in template.yaml.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The sample hub behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Samples, below).
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: samples
    use: cutandrun/sample_target_filter
    interactive_component_type: MultiSelect
    column_name: target
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: Target
    section: Key figures
    tag: cr-ov-kf-target
    index: ov-kf-target
    title: Target
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: cr-ov-kf-sample
    index: ov-kf-sample
    title: Sample
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: text
    title: nf-core/cutandrun
    logo: https://raw.githubusercontent.com/nf-core/cutandrun/master/docs/images/nf-core-cutandrun_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/cutandrun/master/docs/images/nf-core-cutandrun_logo_dark.png
    order: 1
    body: >
      CUT&RUN and CUT&Tag libraries turned into fragments, peaks called against the IgG
      control and the intervals each target's replicates reproduce. [Run parameters](params:)
    tag: cr-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/cutandrun turns CUT&RUN and CUT&Tag reads into fragments, calls the regions where each target rises above its IgG control and keeps the peaks a target's replicates reproduce. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The sample filters in the left panel apply to every tab: narrow the samples once and the whole dashboard follows. A bar above a section narrows that section only.
    tag: cr-ov-about
    index: ov-about
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's facts, read from its data: it ships no params.json, so no
  # {{param:...}} line would print anything but a dash.
  - component_type: text
    surface: card
    values:
      samples: {dc: samples, column: sample_id, aggregation: nunique, format: integer}
      targets: {dc: samples, column: target, aggregation: nunique,
        filter_expr: "col('role') != 'IgG control'", format: integer}
      igg: {dc: samples, column: sample_id, aggregation: count,
        filter_expr: "col('role') == 'IgG control'", format: integer}
      callers: {dc: caller_agreement, column: caller, aggregation: nunique, format: integer}
    body: |
      ### The run
      - ![](icon:mdi:test-tube) **Samples** {{samples}}
      - ![](icon:mdi:shape-outline) **Targets** {{targets}}
      - ![](icon:mdi:shield-check-outline) **IgG controls** {{igg}}
      - ![](icon:mdi:chart-bell-curve) **Peak callers** {{callers}}
    tag: cr-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  # The marks take the family's colour (the header's), not the theme's blue.
  # The run has no params.json, so each step's link searches the software
  # versions for its tool.
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Six steps from reads to reproducible peaks
      Each step names its tools and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:content-cut) **Trim** Trim Galore on every library · [Versions](params:trimgalore) · [MultiQC](tab:MultiQC)
      2. ![](icon:mdi:dna) **Align** Bowtie 2 to the target and the spike-in genome · [Versions](params:bowtie2) · [Libraries](tab:Libraries)
      3. ![](icon:mdi:waves) **Fragments** Lengths of the aligned pairs · [Versions](params:frag_len) · [Fragments](tab:Fragments)
      4. ![](icon:mdi:chart-bell-curve) **Call** SEACR and MACS2 against the IgG control · [Versions](params:seacr) · [Peaks](tab:Peaks)
      5. ![](icon:mdi:scale-balance) **Compare** The two callers on each sample · [Versions](params:macs2) · [Agreement](tab:Caller agreement)
      6. ![](icon:mdi:set-merge) **Merge** Replicates into consensus peaks · [Versions](params:consensus) · [Consensus](tab:Consensus)
      :::
    tag: cr-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. The icon colour is that tab's colour.
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: samples
    use: cutandrun/samples
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: composition
    breakdown_col: target
    display:
      icon_name: mdi:test-tube
      icon_color: orange
      caption: in the sample sheet, by target
      link: tab:MultiQC
    section: Key figures
    tag: cr-ov-kf-samples
    index: ov-kf-samples
    title: Samples
    description: Samples in the sample sheet, IgG controls included. The bar splits them by target.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_classes
    use: seacr/fragment_classes
    aggregation: median
    column_name: sample_median_length
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: violet
      caption: median per sample, with its spread
      link: tab:Fragments
      decimals: 0
    section: Key figures
    tag: cr-ov-kf-fraglen
    index: ov-kf-fraglen
    title: Fragment length (bp)
    description: Median fragment length of the samples in view, weighted by fragment count. The box shows how it spreads.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: caller_agreement
    use: cutandrun/caller_agreement
    aggregation: sum
    column_name: n_peaks
    column_type: int64
    filter_expr: col('caller') == 'seacr'
    secondary_layout: composition
    breakdown_col: target
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: indigo
      caption: SEACR peaks, by target
      link: tab:Peaks
      format: si
    section: Key figures
    tag: cr-ov-kf-peaks
    index: ov-kf-peaks
    title: Peaks
    description: Regions SEACR called over the samples in view. The bar splits them by target.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # frip is repeated on the two rows of a sample; the In peaks row keeps one
  # value per sample, so the median and the box are of samples.
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: frip
    use: cutandrun/frip
    aggregation: median
    column_name: frip
    column_type: float64
    filter_expr: col('signal_class') == 'In peaks'
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:target
      icon_color: teal
      caption: median per sample, with its spread
      link: tab:Peaks
      format: percent
    section: Key figures
    tag: cr-ov-kf-frip
    index: ov-kf-frip
    title: FRiP
    description: Median fraction of each sample's fragment coverage that falls inside its own SEACR peaks.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the target, then the sample, both on the hub.
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: samples
    use: cutandrun/sample_target_filter
    interactive_component_type: MultiSelect
    column_name: target
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: Target
    section: Findings
    tag: cr-ov-findings-target
    index: ov-findings-target
    title: Target
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Sample
    section: Findings
    tag: cr-ov-findings-sample
    index: ov-findings-sample
    title: Sample
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per analysis tab, each citing one data collection, so the
  # import removes a row with its data.
  - component_type: text
    surface: card
    values:
      mono: {dc: seacr_fragment_classes, column: mono_to_sub, aggregation: median, format: 'decimals:1'}
      pk_top: {dc: caller_agreement, column: target, aggregation: top, weight: n_peaks,
        filter_expr: "col('caller') == 'seacr'"}
      pk_share: {dc: caller_agreement, column: target, aggregation: top_share, weight: n_peaks,
        filter_expr: "col('caller') == 'seacr'", format: percent}
      shared: {dc: caller_agreement, column: frac_shared, aggregation: median,
        filter_expr: "col('caller') == 'seacr'", format: percent}
      n_rep: {dc: seacr_consensus_peaks, column: peak_id, aggregation: count,
        filter_expr: "col('num_samples') >= 2", format: integer}
      n_cons: {dc: seacr_consensus_peaks, column: peak_id, aggregation: count, format: integer}
    body: |
      - **{{mono}}** mononucleosomal fragments per sub-nucleosomal one – median over samples [Fragments](tab:Fragments)
      - **{{pk_share}}** of SEACR peaks are in {{pk_top}} – the target with the most calls [Peaks](tab:Peaks)
      - **{{shared}}** of a sample's SEACR peaks are also MACS2 peaks – median over samples [Agreement](tab:Caller agreement)
      - **{{n_rep}}** of {{n_cons}} consensus intervals are called by two replicates or more – SEACR, per target [Consensus](tab:Consensus)
    section: Findings
    tag: cr-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per analysis tab of the funnel, in the order of the rows
  # above. The Locus tab has none: it is a browser, not a summary. The import
  # drops a highlight whose source is gone (the pile-up, without fragment BEDs)
  # and re-packs the grid.
  - component_type: highlight
    section: Findings
    source_tab: Fragments
    source_component: frag-length-dist
    caption: One curve per sample, coloured by target; the shaded bands are the sub-nucleosomal (sub) and mononucleosomal (mono) windows.
    tag: cr-ov-hl-fragments
    index: ov-hl-fragments
    layout: {x: 0, y: 2, w: 5, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Peaks
    source_component: pk-pileup-profile
    title: Pile-up at the summits
    caption: Mean fragments per million around the summits of each sample's strongest SEACR peaks; a sharp mark peaks at 0.
    tag: cr-ov-hl-pileup
    index: ov-hl-pileup
    layout: {x: 5, y: 2, w: 3, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Caller agreement
    source_component: ca-caller-scatter
    caption: One point per sample; off the dotted line, the two callers disagree on how many peaks there are.
    tag: cr-ov-hl-callers
    index: ov-hl-callers
    layout: {x: 0, y: 6, w: 3, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Consensus
    source_component: cons-repro-share
    caption: Each target's consensus intervals, split by how many replicates called them; the labels are interval counts.
    tag: cr-ov-hl-consensus
    index: ov-hl-consensus
    layout: {x: 3, y: 6, w: 5, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers. A tab the run does not have is left out.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Libraries](tab:Libraries)

      ### Chromatin signal
      - [Fragments](tab:Fragments)
      - [Peaks](tab:Peaks)

      ### Agreement
      - [Caller agreement](tab:Caller agreement)
      - [Consensus](tab:Consensus)
      - [Locus](tab:Locus)
    section: How to read this dashboard
    tag: cr-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the target first. Replicate filters on the
  # categorical twin of `replicate`: an Int64 column only takes a slider.
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: samples
    use: cutandrun/sample_target_filter
    interactive_component_type: MultiSelect
    column_name: target
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: cr-filter-target
    index: cr-target-filter
    title: Target
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: cr-filter-sample
    index: cr-sample-filter
    title: Sample
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: samples
    use: cutandrun/sample_replicate_filter
    interactive_component_type: MultiSelect
    column_name: replicate_label
    column_type: object
    display:
      icon_name: mdi:relation-many-to-many
      custom_color: cyan
    section: Sample filters
    group: Sample scope
    tag: cr-filter-replicate
    index: cr-replicate-filter
    title: Replicate
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: role
    column_type: object
    display:
      icon_name: mdi:shield-check-outline
      custom_color: orange
    section: Sample filters
    group: Sample scope
    tag: cr-filter-role
    index: cr-role-filter
    title: Role
    layout: {x: 0, y: 9, w: 1, h: 3}
  - component_type: table
    workflow_tag: cutandrun
    data_collection_tag: samples
    use: cutandrun/samples
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Sample sheet
    tag: cr-sample-sheet
    index: sample-sheet
    title: Sample sheet
    description: One row per sample, with its target, replicate, role and control.
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
# ============================================================================
# Data & QC
# ============================================================================
- title: MultiQC
  subtitle: Did reads trim, align and rise above the IgG control?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # Sourced on the spike-in table, which links back into the MultiQC panels,
  # so the two sliders narrow the report to the libraries inside both bands.
  filter_sections:
  - name: Alignment scope
    icon: mdi:tune
    color: orange
    description: Libraries inside an alignment rate and a spike-in factor band
  grid_sections:
  - name: QC overview
    icon: mdi:chart-box-outline
    color: orange
    description: The headline numbers of every module, read counts and reads kept after trimming
  - name: Alignment and spike-in
    icon: mdi:chart-bar
    color: orange
    description: How much of each library aligned, to the target and to the spike-in genome
  - name: Enrichment over the control
    icon: mdi:chart-line
    color: orange
    description: Whether each target's coverage is more concentrated than its IgG control's
  - name: QC details
    icon: mdi:file-document-outline
    color: gray
    description: Base quality, GC content, insert sizes and reads per contig
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [MultiQC](https://multiqc.info) gathers the
      [FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/),
      [Trim Galore](https://github.com/FelixKrueger/TrimGalore),
      [Bowtie 2](https://github.com/BenLangmead/bowtie2), samtools and
      [deepTools](https://deeptools.readthedocs.io) reports, re-generated with MultiQC 1.35
      because the run's own report has no parquet. Read the trimming and alignment rates
      first (spike-in libraries carry a .spikein suffix), then the fingerprint: a target
      that worked bends away from the diagonal its IgG control follows.
    tag: cr-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: target_align_rate
    column_type: float64
    display:
      icon_name: mdi:chart-bar
      custom_color: blue
    section: Alignment scope
    group: Alignment quality
    tag: cr-mqc-filter-alignrate
    index: cr-qc-alignrate-range
    title: Target alignment rate
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: scale_factor
    column_type: float64
    display:
      icon_name: mdi:ruler
      custom_color: indigo
    section: Alignment scope
    group: Alignment quality
    tag: cr-mqc-filter-scale
    index: cr-qc-scale-range
    title: Spike-in scale factor
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: multiqc
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: QC overview
    tag: cr-mqc-general-stats
    title: General statistics
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Counts
    section: QC overview
    tag: cr-mqc-fastqc-counts
    title: Sequence counts
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    use: multiqc/cutadapt
    selected_module: cutadapt
    selected_plot: Filtered Reads
    section: QC overview
    tag: cr-mqc-cutadapt
    title: Reads kept after trimming
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    use: multiqc/bowtie2
    selected_module: bowtie2
    selected_plot: Paired-end alignments
    section: Alignment and spike-in
    tag: cr-mqc-bowtie2
    title: Paired-end alignments
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Percent mapped
    section: Alignment and spike-in
    tag: cr-mqc-samtools-mapped
    title: Percent mapped
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    use: multiqc/deeptools
    selected_module: deepTools
    selected_plot: Fingerprint plot
    section: Enrichment over the control
    tag: cr-mqc-deeptools-fingerprint
    title: Fingerprint plot
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    section: QC details
    tag: cr-mqc-fastqc-quality
    title: Per-base sequence quality
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Per Sequence GC Content
    section: QC details
    tag: cr-mqc-fastqc-gc
    title: GC content
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Insert size distribution
    section: QC details
