- title: Fragments
  subtitle: Did the digestion work, and how nucleosomal are the fragments?
  tab_group: Chromatin signal
  tab_order: 3
  tab_icon: mdi:waves
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Fragment filters
    icon: mdi:filter-variant
    color: violet
    description: Narrows the ladder to a length window and the classes to a few
  grid_sections:
  - name: Fragments at a glance
    icon: mdi:counter
    color: violet
    description: Length, depth and nucleosome classes over the samples in view
  - name: Fragment length
    icon: mdi:chart-bell-curve
    color: violet
    description: The nucleosomal ladder, then the running share of fragments by length
  - name: Nucleosome classes
    icon: mdi:chart-donut
    color: violet
    description: Each library split into its four nucleosome classes
  - name: Fragment tables
    icon: mdi:table
    color: gray
    description: The fragment-class rows behind the tiles above
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      MNase cuts around nucleosomes, so a working experiment shows a sharp sub-nucleosomal
      peak beside a mononucleosomal shoulder, read off the
      [fragment-length histogram](https://nf-co.re/cutandrun/3.1/docs/output) the pipeline
      writes per sample. The classes bin that histogram at 120, 250 and 450 bp; a sharp mark
      carries more sub-nucleosomal material than a broad one. Pick a length window on the
      left to zoom the ladder.
    tag: cr-frag-intro
    index: frag-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_classes
    interactive_component_type: MultiSelect
    column_name: fragment_class
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: grape
    section: Fragment filters
    tag: cr-frag-filter-class
    index: cr-sg-class-filter
    title: Nucleosome class
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_lengths
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: fragment_length
    column_type: int64
    display:
      icon_name: mdi:ruler
      custom_color: lime
    section: Fragment filters
    tag: cr-frag-filter-length
    index: cr-sg-fraglen-range
    title: Fragment length
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_classes
    use: seacr/fragment_classes
    aggregation: median
    column_name: sample_median_length
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: violet
      caption: median per sample, with its spread
      decimals: 0
    section: Fragments at a glance
    tag: cr-frag-card-length
    index: frag-card-length
    title: Fragment length (bp)
    description: Median fragment length of each sample, weighted by fragment count.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_lengths
    use: seacr/fragment_lengths
    aggregation: sum
    column_name: count
    column_type: int64
    secondary_layout: composition
    breakdown_col: target
    display:
      icon_name: mdi:counter
      icon_color: blue
      caption: by target
    section: Fragments at a glance
    tag: cr-frag-card-count
    index: frag-card-count
    title: Fragments
    description: Fragments the length histograms count, summed over the samples in view.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_classes
    use: seacr/fragment_classes
    aggregation: sum
    column_name: n_fragments
    column_type: int64
    secondary_layout: donut
    breakdown_col: fragment_class
    top_n_count: 4
    display:
      icon_name: mdi:chart-donut
      icon_color: grape
      caption: fragments, by nucleosome class
    section: Fragments at a glance
    tag: cr-frag-card-classes
    index: frag-card-classes
    title: Nucleosome classes
    description: The fragments in view split into sub-, mono-, di- and multi-nucleosomal classes.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # mono_to_sub is one value per sample, repeated on its four class rows, so
  # the median per target is a median of samples.
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_classes
    use: seacr/fragment_classes
    aggregation: median
    column_name: mono_to_sub
    column_type: float64
    secondary_layout: top_n
    breakdown_col: target
    top_n_count: 3
    display:
      icon_name: mdi:scale-balance
      icon_color: pink
      caption: median, by target
      decimals: 1
    section: Fragments at a glance
    tag: cr-frag-card-monosub
    index: frag-card-monosub
    title: Mononucleosome ratio
    description: Mononucleosomal over sub-nucleosomal fragments, the sharp-against-broad contrast as one number.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Colours by target, the run's grouping, so it takes the pieces of the group
  # kwargs rather than spreading them: the curves group by sample whatever the
  # colour.
  - component_type: figure
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_lengths
    use: seacr/fragment_lengths
    mode: code
    visu_type: line
    code_content: |-
      # The 25-800 bp window holds the nucleosomal ladder; past it the histogram is
      # a long tail. One curve per sample, coloured by its target or by Analysis
      # mode's groups when it has some.
      grp = depictio_group_by[0] if depictio_group_by else 'target'
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get('target') or {}
      d = df.filter((pl.col('fragment_length') >= 25) & (pl.col('fragment_length') <= 800)).sort(['sample', 'fragment_length'])
      if grp not in d.columns:
          grp = 'sample'
      fig = px.line(d.to_pandas(), x='fragment_length', y='fraction', color=grp, line_group='sample', color_discrete_map=colors, hover_name='sample', labels={'fragment_length': 'Fragment length (bp)', 'fraction': 'Share of fragments', grp: ''})
      # The sub-nucleosomal and mononucleosomal windows of seacr/fragment_classes,
      # labelled short enough to fit inside them.
      for start, end, label in ((0, 120, 'sub'), (120, 250, 'mono')):
          fig.add_vrect(x0=start, x1=end, fillcolor='grey', opacity=0.1, line_width=0, annotation_text=label, annotation_position='top left')
      fig.update_layout(margin=dict(t=10))
    section: Fragment length
    tag: cr-frag-fig-dist
    index: frag-length-dist
    title: Fragment length distribution
    description: The share of each sample's fragments at every length; the bands are the sub-nucleosomal (sub) and mononucleosomal (mono) windows.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_lengths
    use: seacr/seacr_fragment_cumulative
    visu_type: line
    dict_kwargs:
      x: fragment_length
      y: cumulative_fraction
      color: sample
      labels: {fragment_length: Fragment length (bp), cumulative_fraction: Cumulative share of fragments, sample: ''}
    section: Fragment length
    tag: cr-frag-fig-cumulative
    index: frag-length-cumulative
    title: Cumulative fragment length
    description: A curve that rises early is dominated by short, sub-nucleosomal fragments.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_classes
    use: seacr/seacr_fragment_class_stack
    visu_type: bar
    dict_kwargs:
      x: sample
      y: fraction
      color: fragment_class
      barmode: stack
      labels: {sample: '', fraction: Share of the library's fragments, fragment_class: ''}
    section: Nucleosome classes
    tag: cr-frag-fig-classes
    index: frag-class-stack
    title: Nucleosome classes per sample
    description: Each library split into the four classes, as a share of its own fragments.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_classes
    use: seacr/fragment_classes
    row_selection_enabled: true
    row_selection_column: sample
    section: Fragment tables
    tag: cr-frag-table-classes
    index: frag-table-classes
    title: Nucleosome classes
    description: Four rows per sample, with the fragments, the share and the median length of each class.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Peaks
  subtitle: What did each sample call, and how much signal do peaks hold?
  tab_group: Chromatin signal
  tab_order: 4
  tab_icon: mdi:chart-bell-curve
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Peak filters
    icon: mdi:filter-variant
    color: indigo
    description: SEACR regions by width, coverage and contig, then samples by yield
  grid_sections:
  - name: Peaks at a glance
    icon: mdi:counter
    color: indigo
    description: SEACR yield, width, coverage and the weakest FRiP over the samples in view
  - name: Peak shape
    icon: mdi:chart-bell-curve
    color: indigo
    description: How wide the regions are, and how the fragments pile up on their summits
  - name: Pile-up per region
    icon: mdi:chart-box-outline
    color: indigo
    description: The strongest regions of each sample, summit-centred, one row each
  - name: Signal in peaks
    icon: mdi:chart-donut
    color: indigo
    description: How much of each library's fragment coverage its own peaks hold
  - name: Peak tables
    icon: mdi:table
    color: gray
    description: Both callers' rows, the per-sample SEACR summary and the signal budget
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [SEACR](https://github.com/FredHutch/SEACR) thresholds the fragment coverage against
      the IgG control and calls one region per enriched stretch; a sharp mark gives narrow
      regions that pile up on their summit, a broad one wide regions. FRiP is built in base
      pairs of coverage, because SEACR reports no read count. The pile-up rows come from the
      fragment BEDs and are absent when a run did not publish them.
    tag: cr-pk-intro
    index: pk-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: width
    column_type: int64
    display:
      icon_name: mdi:ruler
      custom_color: indigo
    section: Peak filters
    group: SEACR regions
    tag: cr-pk-filter-width
    index: cr-pk-width-range
    title: Region width
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: signal_density
    column_type: float64
    display:
      icon_name: mdi:chart-line
      custom_color: cyan
    section: Peak filters
    group: SEACR regions
    tag: cr-pk-filter-density
    index: cr-pk-density-range
    title: Coverage per base
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    interactive_component_type: MultiSelect
    column_name: chr
