    title: MACS2 peaks in the region
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: cr-loc-card-consensus
    index: cr-loc-card-consensus
    section: Region at a glance
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/consensus_peaks
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: target
    top_n_count: 3
    display: {icon_name: 'mdi:set-merge', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Consensus intervals in the region
    layout: {x: 6, y: 0, w: 2, h: 2}

  # ------------------------------------------------------------ peak locus
  # Navigator + three tracks that follow it. The default region (chr9, a locus
  # where every track of the megatest has data) is documented in the intro.
  - component_type: text
    tag: cr-pk-genome-intro
    section: One region, four tracks
    title: One region, every track
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The tab opens on the navigator's default region, a fixed locus set in
      its config. Type a locus in the navigator header or brush its axis; the
      tracks and the cards above follow.
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: cr-pk-av-track
    index: cr-pk-av-track
    section: One region, four tracks
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/seacr_peak_track
    config:
      assembly: "{GENOME}"
      controls_placement: header
      # `rect` needs an end column, which the role binding supplies: a SEACR
      # call is an interval, not a point at its summit.
      mark: rect
      score_title: log10 total coverage
      opacity: 0.8
      category_col: sample
      # The assembly lets the navigator fetch only the chromosome of its
      # region. SEACR also calls regions on alt and unplaced contigs that a
      # built-in contig table does not know; the windowed fetch keeps them out
      # of the spec unless the reader navigates to one.
      default_region: "chr9:130,850,000-131,350,000"
      region_filter_enabled: true
      selection_enabled: true
      selection_column: peak_id
    title: SEACR regions
    description: Every SEACR region of every sample as the interval it is; height is log10 of the total fragment coverage. The locus field and a brush on this axis move every track below.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 4}
  - component_type: advanced_viz
    tag: cr-pk-av-frags-track
    index: cr-pk-av-frags-track
    section: One region, four tracks
    workflow_tag: cutandrun
    data_collection_tag: seacr_frags_profile
    use: seacr/frags_pileup_track
    config:
      controls_placement: header
      view: track
      views: [track, locus]
      mark: rect
      color_by: sample
      facet_by_sample: true
      smoothing_window: 0
      show_annotation_lane: false
      locus_annotation: "{GENOME}"
      locus_assembly: "{GENOME}"
    title: Fragment pile-up
    description: Fragments per million in 100 bp bins, one lane per sample, drawn on a 6 kb window around each sample's 500 strongest SEACR regions; the gaps between windows are not measured, not empty.
    title_size: h3
    layout: {x: 0, y: 6, w: 8, h: 4}
  - component_type: advanced_viz
    tag: cr-pk-av-macs-locus
    index: cr-pk-av-macs-locus
    section: One region, four tracks
    workflow_tag: cutandrun
    data_collection_tag: macs2_peaks
    use: macs2/peak_genome_view
    config:
      controls_placement: header
      mark: rect
      score_title: -log10 q-value
      category_col: sample
      assembly: "{GENOME}"
      region_filter_enabled: false
      follow_region_filter: true
      selection_enabled: true
      selection_column: peak_id
    title: MACS2 calls on the region
    description: The MACS2 narrow peaks of the same region, coloured by sample; a SEACR region with no MACS2 call under it is one only the coverage threshold saw.
    title_size: h3
    layout: {x: 0, y: 10, w: 8, h: 3}
  - component_type: advanced_viz
    tag: cr-pk-av-consensus-locus
    index: cr-pk-av-consensus-locus
    section: One region, four tracks
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/seacr_consensus_track
    config:
      controls_placement: header
      mark: rect
      score_title: max coverage
      annotation: "{GENOME}"
      assembly: "{GENOME}"
      region_filter_enabled: false
      follow_region_filter: true
      selection_enabled: true
      selection_column: peak_id
    title: Consensus intervals and genes
    description: The merged SEACR intervals per target, coloured by target, over the gene lane; an interval here is one the replicates of that mark agree on.
    title_size: h3
    layout: {x: 0, y: 13, w: 8, h: 4}

  - component_type: interactive
    tag: cr-loc-filter-density
    index: cr-loc-density-range
    section: Locus scope
    group: Region
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: signal_density
    column_type: float64
    display: {title_size: md, icon_name: 'mdi:chart-line'}
    placement: left
    title: SEACR coverage per base
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: cr-loc-filter-qvalue
    index: cr-loc-qvalue-range
    section: Locus scope
    group: Region
    workflow_tag: cutandrun
    data_collection_tag: macs2_peaks
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: neg_log10_qvalue
    column_type: float64
    display: {title_size: md, icon_name: 'mdi:check-decagram'}
    placement: left
    title: MACS2 -log10 q-value
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: cr-loc-filter-support
    index: cr-loc-support-filter
    section: Locus scope
    group: Region
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    interactive_component_type: MultiSelect
    column_name: support
    column_type: object
    display: {title_size: md, icon_name: 'mdi:relation-many-to-many'}
    placement: left
    title: Replicate support
    layout: {x: 0, y: 6, w: 1, h: 3}

# ============================================================================
# Consensus
# ============================================================================
- title: Consensus
  subtitle: The merged peak set of each target and which replicates support every interval
  tab_order: 6
  tab_icon: mdi:set-merge
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Consensus scope
    icon: mdi:tune
    color: grape
    description: Replicate support, interval width and member count to keep in view
  grid_sections:
  - name: Consensus at a glance
    icon: mdi:counter
    color: grape
    description: How large the merged peak set is and how much of it more than one replicate found
  - name: Replicate agreement
    icon: mdi:set-merge
    color: violet
    description: Which combinations of replicates call each interval
  - name: How reproducible
    icon: mdi:chart-bar
    color: pink
    description: The reproducible share per target, and how width tracks support
  - name: Consensus table
    icon: mdi:table
    color: gray
    description: The merged intervals behind the panels
    collapsed: true
  components:
  - component_type: text
    tag: cr-cons-intro
    section: Consensus at a glance
    title: What both replicates agree on
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The pipeline merges the per-replicate calls of one target into consensus
      intervals and records which replicate files contributed to each. An
      interval only one replicate found is the weaker half of the set.
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: cr-cons-card-count
    index: cr-cons-card-count
    section: Consensus at a glance
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/consensus_peaks
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: target
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Consensus intervals
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cr-cons-card-support
    index: cr-cons-card-support
    section: Consensus at a glance
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/consensus_peaks
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: num_samples
    column_type: int64
    display: {icon_name: 'mdi:relation-many-to-many', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Replicates per interval
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cr-cons-card-width
    index: cr-cons-card-width
    section: Consensus at a glance
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/consensus_peaks
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: width
    column_type: int64
    display: {icon_name: 'mdi:ruler', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Interval width
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cr-cons-card-signal
    index: cr-cons-card-signal
    section: Consensus at a glance
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/consensus_peaks
    aggregation: average
    column_name: total_signal
    column_type: float64
    secondary_layout: histogram
    display: {icon_name: 'mdi:waves', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Coverage per interval
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: text
    tag: cr-cons-upset-intro
    section: Replicate agreement
    title: Which replicates call what
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each bar is a combination of replicates that call the same consensus
      interval. Bars spanning several replicates are the reproducible core of
      a target; single-replicate bars are what one replicate saw alone.
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: cr-cons-av-upset
    index: cr-cons-av-upset
    section: Replicate agreement
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/seacr_consensus_upset
    config:
      controls_placement: header
      # Every replicate column of the run: the pipeline names samples <group>_R<replicate>.
      set_columns_pattern: '_R\d+$'
      color_intersections_by: degree
      show_set_sizes: true
      show_values: true
      sort_by: cardinality
      sort_order: descending
      min_size: 1
    title: Consensus interval overlap
    description: Intersections of the replicates calling each consensus interval, largest first.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}

  - component_type: text
    tag: cr-cons-repro-intro
    section: How reproducible
    title: How much of each target is reproducible
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The stacked bars split each target's consensus set by how many
      replicates called each interval. The histogram says whether the
      intervals several replicates found differ in width from the ones only
      one found.
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: cr-cons-fig-repro
    index: cr-cons-fig-repro
    section: How reproducible
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/consensus_peaks
    mode: code
    visu_type: bar
    code_content: |
      # share of each target's consensus set by replicate support
      summary = df.group_by(["target", "support"]).agg(
          pl.len().alias("n_intervals")
      )
      totals = summary.group_by("target").agg(
          pl.col("n_intervals").sum().alias("total")
      )
      summary = (
          summary.join(totals, on="target")
          .with_columns(
              (100 * pl.col("n_intervals") / pl.col("total")).round(1).alias("pct")
          )
          .sort(["target", "support"])
      )

      fig = px.bar(
          summary.to_pandas(),
          x="target",
          y="pct",
          color="support",
          barmode="stack",
          text="n_intervals",
      )
      fig.update_layout(
          xaxis_title="Target",
          yaxis_title="Share of consensus intervals (%)",
          legend_title_text="Replicates",
          margin={"t": 24, "l": 64, "r": 16, "b": 48},
      )
    title: Reproducible share per target
    description: Each target's consensus set split by how many replicates called the interval; the bar labels are interval counts.
    title_size: h3
    layout: {x: 0, y: 2, w: 4, h: 6}
  - component_type: figure
    tag: cr-cons-fig-width
    section: How reproducible
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/seacr_consensus_width_hist
    visu_type: histogram
    dict_kwargs: {x: width, color: support, nbins: 60, log_x: true}
    title: Interval width by replicate support
    description: Width of the consensus intervals on a log axis, coloured by how many replicates called them.
    title_size: h3
    layout: {x: 4, y: 2, w: 4, h: 6}

  - component_type: text
    tag: cr-cons-table-intro
    section: Consensus table
    title: The merged intervals
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Every consensus interval of every target, with the member peaks behind it
      and the replicates that supported them. Ticking a row keeps that interval
      in view across the tab.
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: cr-cons-table
    section: Consensus table
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/consensus_peaks
    row_selection_enabled: true
    row_selection_column: peak_id
    title: Consensus intervals
    description: Coordinates, member peak count, replicate support and coverage for every merged interval.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 7}

  # ---------------------------------------------------------------- filters
  - component_type: interactive
    tag: cr-cons-filter-support
    index: cr-cons-support-filter
    section: Consensus scope
    group: Consensus
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    interactive_component_type: MultiSelect
    column_name: support
    column_type: object
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:relation-many-to-many'}
    placement: left
    title: Replicate support
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: cr-cons-filter-width
    index: cr-cons-width-range
    section: Consensus scope
    group: Consensus
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: width
    column_type: int64
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:ruler'}
    placement: left
    title: Interval width
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: cr-cons-filter-members
    index: cr-cons-members-range
    section: Consensus scope
    group: Consensus
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: num_peaks
    column_type: int64
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:counter'}
    placement: left
    title: Member peaks
    layout: {x: 0, y: 6, w: 1, h: 3}
