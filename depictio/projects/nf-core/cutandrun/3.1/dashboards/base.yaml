# section of Peaks, because those region filters narrow every tile of their
# collections on the tab: on Peaks they would turn the genome-wide cards and
# the MACS2 Manhattan into one locus. The genome axis comes from the `GENOME`
# template variable (default hg38); with a built-in assembly the navigator
# fetches only the chromosome of its region.
