    section: Consensus at a glance
    tag: cr-cons-card-count
    index: cons-card-count
    title: Consensus intervals
    description: Merged intervals of every target in view, split by how many replicates called each.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/consensus_peaks
    aggregation: count
    column_name: peak_id
    column_type: object
    filter_expr: col('num_samples') >= 2
    secondary_layout: top_n
    breakdown_col: target
