    description: Median summed coverage of the member peaks of an interval.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/seacr_consensus_upset
    config:
      # Every replicate column of the run: the pipeline names samples
      # <group>_R<replicate>.
      set_columns_pattern: '_R\d+$'
      color_intersections_by: degree
      show_set_sizes: true
      show_values: true
      sort_by: cardinality
      sort_order: descending
      min_size: 1
    section: Replicate agreement
    tag: cr-cons-av-upset
    index: cons-upset
    title: Consensus interval overlap
    description: Intersections of the replicates calling each consensus interval, largest first.
    layout: {x: 0, y: 0, w: 8, h: 5}
  # Colours by replicate support, a column of its own, so it spreads no group
  # kwargs: the frame is per target, not per sample.
  - component_type: figure
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/consensus_peaks
    mode: code
    visu_type: bar
    code_content: |-
      # Share of each target's consensus set by replicate support; the bar labels
      # are interval counts.
      d = df.group_by(['target', 'support']).agg(pl.len().alias('n_intervals'))
      d = d.with_columns((100 * pl.col('n_intervals') / pl.col('n_intervals').sum().over('target')).round(1).alias('pct')).sort(['target', 'support'])
      fig = px.bar(d.to_pandas(), x='target', y='pct', color='support', text='n_intervals', color_discrete_map=depictio_category_colors.get('support') or {}, labels={'target': '', 'pct': 'Share of consensus intervals (%)', 'support': 'Replicates'})
      fig.update_layout(barmode='stack', margin=dict(t=10))
    section: How reproducible
    tag: cr-cons-fig-repro
    index: cons-repro-share
    title: Reproducible share per target
    description: Each target's consensus set split by how many replicates called the interval.
    layout: {x: 0, y: 0, w: 4, h: 4, fit: auto}
  - component_type: figure
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/seacr_consensus_width_hist
    visu_type: histogram
    dict_kwargs:
      x: width
      color: support
      nbins: 60
      log_x: true
      labels: {width: Interval width (bp), support: Replicates}
    section: How reproducible
    tag: cr-cons-fig-width
    index: cons-width-hist
    title: Interval width by replicate support
    description: Width of the consensus intervals on a log axis, coloured by how many replicates called them.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: table
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/consensus_peaks
    row_selection_enabled: true
    row_selection_column: peak_id
    section: Consensus table
    tag: cr-cons-table
    index: cons-table
    title: Consensus intervals
    description: Coordinates, member peak count, replicate support and coverage for every merged interval.
    layout: {x: 0, y: 0, w: 8, h: 6}
# One region, one x axis. The SEACR navigator drives the tracks under it
# through the region links in template.yaml (seacr_peaks -> macs2_peaks,
# seacr_consensus_peaks, seacr_frags_profile). A tab of its own because those
# region filters narrow every tile of their collections on the tab. The genome
# axis comes from the `GENOME` template variable (default hg38).
- title: Locus
  subtitle: Do the callers and the replicates agree on one region?
  tab_group: Agreement
  tab_order: 7
  tab_icon: mdi:dna
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Locus filters
    icon: mdi:filter-variant
    color: teal
    description: Coverage, significance and replicate support of the tracks on the region
  grid_sections:
  - name: Region at a glance
    icon: mdi:counter
    color: teal
    description: What the region in view holds, recounted on every brush or locus entry
  - name: One region, four tracks
    icon: mdi:dna
    color: teal
    description: The SEACR navigator and the tracks that follow its region
  components:
  - component_type: text
    order: 1
    body: >
      The SEACR regions drive the navigator; the fragment pile-up, the MACS2 calls and the
      consensus intervals follow its region on one genome axis. The tab opens on a default
      region set in the navigator's config: type a locus in its header or brush its axis,
      and the tracks and the cards follow.
    tag: cr-loc-intro
    index: loc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: signal_density
    column_type: float64
    display:
      icon_name: mdi:chart-line
      custom_color: cyan
    section: Locus filters
    group: Region
    tag: cr-loc-filter-density
    index: cr-loc-density-range
    title: SEACR coverage per base
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: macs2_peaks
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: neg_log10_qvalue
    column_type: float64
    display:
      icon_name: mdi:check-decagram
      custom_color: orange
    section: Locus filters
    group: Region
    tag: cr-loc-filter-qvalue
    index: cr-loc-qvalue-range
    title: MACS2 -log10 q-value
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    interactive_component_type: MultiSelect
    column_name: support
    column_type: object
    display:
      icon_name: mdi:relation-many-to-many
      custom_color: grape
    section: Locus filters
    group: Region
    tag: cr-loc-filter-support
    index: cr-loc-support-filter
    title: Replicate support
    layout: {x: 0, y: 6, w: 1, h: 3}
  # The four cards follow the navigator's region, as the tracks do.
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/peaks
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: composition
    breakdown_col: sample
    follow_region_filter: true
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: indigo
      caption: SEACR regions, by sample
    section: Region at a glance
    tag: cr-loc-card-regions
    index: loc-card-regions
    title: SEACR regions
    description: SEACR regions inside the region in view.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/peaks
    aggregation: median
    column_name: signal_density
    column_type: float64
    secondary_layout: histogram
    follow_region_filter: true
    display:
      icon_name: mdi:waves
      icon_color: cyan
      caption: median per region, with its distribution
      decimals: 1
    section: Region at a glance
    tag: cr-loc-card-density
    index: loc-card-density
    title: Coverage per base
    description: Median coverage per base of the SEACR regions inside the region in view.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: macs2_peaks
    use: macs2/peaks
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: composition
    breakdown_col: sample
    follow_region_filter: true
    display:
      icon_name: mdi:counter
      icon_color: orange
      caption: MACS2 peaks, by sample
    section: Region at a glance
    tag: cr-loc-card-macs
    index: loc-card-macs
    title: MACS2 peaks
    description: MACS2 peaks inside the region in view.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/consensus_peaks
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: donut
    breakdown_col: support
    top_n_count: 4
    follow_region_filter: true
    display:
      icon_name: mdi:set-merge
      icon_color: grape
      caption: by the replicates that call them
    section: Region at a glance
    tag: cr-loc-card-consensus
    index: loc-card-consensus
    title: Consensus intervals
    description: Consensus intervals inside the region in view, split by replicate support.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/seacr_peak_track
    config:
      assembly: "{GENOME}"
      # `rect` needs an end column, which the role binding supplies: a SEACR
      # call is an interval, not a point at its summit.
      mark: rect
      score_title: log10 total coverage
      opacity: 0.8
      category_col: sample
      # The assembly lets the navigator fetch only the chromosome of its
      # region, so calls on alt and unplaced contigs stay out until visited.
      default_region: "chr9:130,850,000-131,350,000"
      region_filter_enabled: true
      selection_enabled: true
      selection_column: peak_id
    section: One region, four tracks
    tag: cr-loc-av-track
    index: loc-seacr-track
    title: SEACR regions
    description: Every SEACR region as the interval it is; height is log10 of the total coverage. Brush to move every track.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: cutandrun
    data_collection_tag: seacr_frags_profile
    use: seacr/frags_pileup_track
    config:
      view: track
      views: [track, locus]
      mark: rect
      color_by: sample
      facet_by_sample: true
      smoothing_window: 0
      show_annotation_lane: false
      locus_annotation: "{GENOME}"
      locus_assembly: "{GENOME}"
    section: One region, four tracks
    tag: cr-loc-av-frags-track
    index: loc-frags-track
    title: Fragment pile-up
    description: Fragments per million in 100 bp bins around each sample's strongest regions; gaps are not measured.
    layout: {x: 0, y: 4, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: cutandrun
    data_collection_tag: macs2_peaks
    use: macs2/peak_genome_view
    config:
      mark: rect
      score_title: -log10 q-value
      category_col: sample
      assembly: "{GENOME}"
      region_filter_enabled: false
      follow_region_filter: true
      selection_enabled: true
      selection_column: peak_id
    section: One region, four tracks
    tag: cr-loc-av-macs
    index: loc-macs-track
    title: MACS2 calls on the region
    description: A SEACR region with no MACS2 call under it is one only the coverage threshold saw.
    layout: {x: 0, y: 8, w: 8, h: 3}
  - component_type: advanced_viz
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/seacr_consensus_track
    config:
      mark: rect
      score_title: max coverage
      annotation: "{GENOME}"
      assembly: "{GENOME}"
      region_filter_enabled: false
      follow_region_filter: true
      selection_enabled: true
      selection_column: peak_id
    section: One region, four tracks
    tag: cr-loc-av-consensus
    index: loc-consensus-track
    title: Consensus intervals and genes
    description: The merged SEACR intervals per target over the gene lane; an interval here is one the replicates agree on.
    layout: {x: 0, y: 11, w: 8, h: 4}
