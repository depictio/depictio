# The tables the pipeline published beside the report: the spike-in factors,
# the flagstat counts and the three deepTools tables the MultiQC pictures are
# drawn from.
- title: Libraries
  subtitle: How deep and duplicated is each library, and is it enriched?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:flask-outline
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Library filters
    icon: mdi:filter-variant
    color: cyan
    description: Narrows the libraries by their spike-in factor and coverage concentration
  grid_sections:
  - name: Libraries at a glance
    icon: mdi:counter
    color: cyan
    description: Depth, spike-in scaling, duplication and enrichment over the libraries in view
  - name: Spike-in and duplication
    icon: mdi:ruler
    color: cyan
    description: The factor each library's coverage was scaled by, and its duplicate share
  - name: Enrichment over the control
    icon: mdi:chart-line
    color: cyan
    description: How concentrated each library's coverage is against a uniform library
  - name: Sample similarity
    icon: mdi:relation-many-to-many
    color: cyan
    description: Which libraries look alike over the genome-wide bin counts
  - name: Depth detail
    icon: mdi:chart-scatter-plot
    color: gray
    description: The two alignments and the duplicate share against depth, per library
    collapsed: true
  - name: Library tables
    icon: mdi:table
    color: gray
    description: The spike-in rows behind the tiles above
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [Bowtie 2](https://github.com/BenLangmead/bowtie2) aligns every library to the target
      and to the spike-in genome, and the spike-in depth sets the factor its coverage is
      scaled by; [Picard](https://broadinstitute.github.io/picard/) marks the duplicates.
      [deepTools](https://deeptools.readthedocs.io) then asks whether each target's
      coverage is more concentrated than its IgG control's. Read the fingerprint and the PCA
      first: a target that sits with the controls did not enrich.
    tag: cr-lib-intro
    index: lib-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: scale_factor
    column_type: float64
    display:
      icon_name: mdi:ruler
      custom_color: indigo
    section: Library filters
    tag: cr-lib-filter-scale
    index: cr-lib-scale-range
    title: Spike-in scale factor
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: deeptools_fingerprint_metrics
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: auc_ratio
    column_type: float64
    display:
      icon_name: mdi:chart-line
      custom_color: pink
    section: Library filters
    tag: cr-lib-filter-auc
    index: cr-sg-auc-range
    title: Coverage concentration
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    use: bowtie2/spikein_factors
    aggregation: sum
    column_name: total_pairs
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:dna
      icon_color: blue
      caption: total; the bars, pairs per library
    section: Libraries at a glance
    tag: cr-lib-card-pairs
    index: lib-card-pairs
    title: Read pairs
    description: Read pairs that entered both alignments, summed over the libraries in view.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    use: bowtie2/spikein_factors
    aggregation: median
    column_name: scale_factor
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: indigo
      caption: median per library, with its spread
      decimals: 2
    section: Libraries at a glance
    tag: cr-lib-card-scale
    index: lib-card-scale
    title: Spike-in scale factor
    description: Median factor the pipeline scaled each library's coverage by, from its spike-in depth.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: samtools_flagstat
    use: samtools/flagstat
    aggregation: sum
    column_name: duplicate_reads
    column_type: int64
    secondary_layout: concentration
    breakdown_col: sample
    top_n_count: 3
    display:
      icon_name: mdi:content-copy
      icon_color: orange
      caption: the share held by the three most duplicated libraries
    section: Libraries at a glance
    tag: cr-lib-card-dups
    index: lib-card-dups
    title: Duplicate reads
    description: Reads Picard flagged as duplicates in the marked target BAMs, summed over the libraries in view.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: deeptools_fingerprint_metrics
    use: deeptools/fingerprint_metrics
    aggregation: median
    column_name: synthetic_js_distance
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-line
      icon_color: grape
      caption: median, with its spread
      decimals: 2
    section: Libraries at a glance
    tag: cr-lib-card-jsd
    index: lib-card-jsd
    title: Distance from uniform
    description: Median Jensen-Shannon distance of each library's coverage to a uniform one; enriched libraries sit far from it.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    use: bowtie2/spikein_factor_bar
    visu_type: bar
    dict_kwargs:
      x: sample
      y: scale_factor
      labels: {sample: '', scale_factor: Spike-in scale factor}
    section: Spike-in and duplication
    tag: cr-lib-fig-scale
    index: lib-fig-scale
    title: Spike-in scale factor per library
    description: The factor each library's coverage was scaled by. A library with little carrier DNA gets a large one.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: cutandrun
    data_collection_tag: samtools_flagstat
    use: samtools/flagstat
    mode: code
    visu_type: bar
    code_content: |-
      # Duplicate share per library, from the flagstat counts of the marked BAMs.
      # Colours by nothing of its own, so it spreads the group kwargs whole.
      d = df.with_columns((100 * pl.col('duplicate_reads') / pl.col('total_reads')).alias('duplicate_pct')).sort('sample')
      fig = px.bar(d.to_pandas(), x='sample', y='duplicate_pct', labels={'sample': '', 'duplicate_pct': 'Duplicate reads (%)'}, **depictio_group_kwargs)
      fig.update_layout(margin=dict(t=10))
      # Room for the slanted names, so the first ones are not cut at the edge.
      fig.update_xaxes(tickangle=-45, automargin=True)
    section: Spike-in and duplication
    tag: cr-lib-fig-dup
    index: lib-fig-dup
    title: Duplicate reads per library
    description: Share of each library's reads flagged as duplicates; IgG controls hold the least material and duplicate most.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: advanced_viz
    workflow_tag: cutandrun
    data_collection_tag: deeptools_fingerprint_metrics
    use: deeptools/fingerprint_scatter
    config:
      x_title: Area under the observed coverage curve
      y_title: Divergence from a uniform library
      # Colour names the libraries and the legend carries the names, so the
      # four labels are free to mark the extremes.
      color_col: sample
      # Third quality axis: the share of the genome the library left uncovered.
      # A sharp target covers little of it, an IgG control covers most.
      size_col: x_intercept
      min_size: 8
      max_size: 26
      marker_size: 12
      opacity: 0.85
      marker_outline: true
      top_n_labels: 4
      legend_pos: right
      selection_enabled: true
      selection_column: sample
    section: Enrichment over the control
    tag: cr-lib-av-fingerprint
    index: lib-av-fingerprint
    title: Coverage concentration per library
    description: The targets sit apart from the IgG controls, which look uniform. Point size is the share of the genome with no reads.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: cutandrun
    data_collection_tag: deeptools_sample_pca
    use: deeptools/pca_embedding
    config:
      color_col: sample
      point_size: 16
      marker_outline: true
      axis_prefix: PC
      legend_pos: right
      selection_enabled: true
      selection_column: sample
    section: Sample similarity
    tag: cr-lib-av-pca
    index: lib-av-pca
    title: Libraries on the first two components
    description: Replicates of one target cluster; a library that lands with the controls did not enrich.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: cutandrun
    data_collection_tag: deeptools_correlation_matrix
    use: deeptools/correlation_heatmap
    config:
      index_column: sample
      # Clustered on both axes, so the replicates of one target fall next to
      # each other. Average linkage on a correlation distance: these rows are
      # correlations, not coordinates, so ward/euclidean does not apply.
      cluster_rows: true
      cluster_cols: true
      cluster_method: average
      cluster_metric: correlation
      colorscale: RdBu
    section: Sample similarity
    tag: cr-lib-av-corr
    index: lib-av-corr
    title: Library correlation matrix
    description: Correlation of the genome-wide bin counts; a block that spans two targets is a swap or a contamination.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: figure
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    use: bowtie2/spikein_depth_scatter
    selection_enabled: true
    selection_column: sample
    visu_type: scatter
    dict_kwargs:
      x: spikein_aligned
      y: target_aligned
      color: sample
      labels: {spikein_aligned: Spike-in read pairs aligned, target_aligned: Target read pairs aligned, sample: ''}
    section: Depth detail
    tag: cr-lib-fig-depth
    index: lib-fig-depth
    title: Target depth against spike-in depth
    description: The larger a library's spike-in share, the smaller its scale factor, which is why IgG controls sit low.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: cutandrun
    data_collection_tag: samtools_flagstat
    use: samtools/flagstat
    mode: code
    visu_type: scatter
    code_content: |-
      # Duplication against depth: a library both deep and highly duplicated was
      # sequenced past its complexity. Spreads the group kwargs whole.
      d = df.with_columns((100 * pl.col('duplicate_reads') / pl.col('total_reads')).alias('duplicate_pct'))
      fig = px.scatter(d.to_pandas(), x='total_reads', y='duplicate_pct', hover_name='sample', custom_data=['sample'], labels={'total_reads': 'Reads in the BAM', 'duplicate_pct': 'Duplicate reads (%)'}, **depictio_group_kwargs)
      fig.update_traces(marker={'size': 14})
      fig.update_layout(margin=dict(t=10))
    selection_enabled: true
    selection_column: sample
    section: Depth detail
    tag: cr-lib-fig-dup-depth
    index: lib-fig-dup-depth
    title: Duplication against depth
    description: Each library's duplicate share against its read count; deep and highly duplicated means saturated.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: table
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    use: bowtie2/spikein_factors
    row_selection_enabled: true
    row_selection_column: sample
    section: Library tables
    tag: cr-lib-table-spike
    index: lib-table-spike
    title: Spike-in factors
    description: One row per library, with both alignment depths, both rates and the factor derived from them.
    layout: {x: 0, y: 0, w: 8, h: 6}
