version: 1
# nf-core/cutandrun 3.1 reference dashboard.
#
# Funnel: sequencing and enrichment QC (the reprocessed MultiQC report) -> the
# signal the run actually carries (the fragment ladder and its nucleosome
# classes, the spike-in factors, the deepTools tables) -> the peaks each sample
# yielded and how much of its coverage they hold -> whether the two callers
# agree about them -> the consensus peak set the replicates reproduce.
# The sample hub is the anchor: the sample, target and replicate filters in the
# left panel reach every collection through the project links.
#
# The MultiQC tab holds MultiQC panels only. Everything drawn from a table the
# pipeline published beside the report (the fragment ladder, the spike-in
# factors, the fingerprint metrics, the PCA loadings, the correlation matrix)
# lives on the Signal tab, and the per-sample SEACR yield lives on the Peak
# calls tab next to the rows it summarises. The two pinned sections are the
# deliberate exception: the sample sheet with the glance strip, and the SEACR
# summary, ride along on every tab, MultiQC included, because the whole
# dashboard is filtered by them.
#
# Every tab carries filters on two levels: the pinned persistent Sample filters
# section (sample, target, replicate, role), which reaches every collection
# through the links declared in template.yaml, and a tab-local, non-persistent
# section on that tab's own columns.
#
# The IgG controls are samples here, not noise: they carry the MultiQC panels,
# the spike-in factors and the fingerprint that says whether the targets are
# enriched at all. Only the peak panels omit them, because peak calling never
# ran on a control.
#
# The MultiQC report bound here was re-generated with MultiQC 1.35 from the
# run's raw tool outputs; the run itself published MultiQC 1.14, which writes no
# parquet. Module and plot names are therefore the 1.35 ones.
main_dashboard:
  title: nf-core/cutandrun
  subtitle: "nf-core/cutandrun 3.1 megatest: H3K4me3 and H3K27me3 in two replicates each, against two IgG controls"
  project_tag: CUT&RUN Chromatin Profiling
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab through the project links
    persistent: true
    pin: top
  # Tab-local and non-persistent: the two sliders are sourced on the spike-in
  # table, which links back into the MultiQC panels, so they narrow the report
  # on this tab without following the reader to the peak tabs.
  - name: Alignment scope
    icon: mdi:tune
    color: indigo
    description: Keep only the libraries inside an alignment rate and spike-in factor band
  - name: QC thresholds
    icon: mdi:check-decagram
    color: cyan
    description: Yield and signal floors on the per-sample SEACR summary
    collapsed: true
    persistent: true
    pin: bottom
  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: One row per sample, pooling the headline numbers of every module
  - name: Read quality
    icon: mdi:chart-bell-curve
    color: blue
    description: FastQC and Trim Galore as MultiQC reports them
  - name: Alignment and spike-in
    icon: mdi:chart-bar
    color: indigo
    description: How much of each library aligned to the target genome and to the spike-in
  - name: Enrichment over the control
    icon: mdi:chart-line
    color: cyan
    description: Whether each target is enriched over the IgG control, and how the samples cluster
  # Pinned to the top and carried by every tab: the design the whole dashboard
  # is filtered by, and the four-card glance strip over it, are on screen
  # wherever the reader lands. Not collapsed on purpose: a collapsed pin would
  # hide the glance strip on first paint. A pinned persistent section is the
  # one thing allowed to hold non-MultiQC tiles on the MultiQC tab.
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The run at a glance, and the sample hub every other tab is filtered by
    persistent: true
    pin: top
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The per-sample SEACR rows, on every tab
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # ------------------------------------------------------------- at a glance
  - component_type: text
    tag: cr-qc-intro
    section: Run at a glance
    title: A CUT&RUN run, from reads to enrichment
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The reprocessed [MultiQC](https://multiqc.info) report, module by module:
      the general statistics table first, then read quality, alignment to the
      target and the spike-in genome, and how far each target rises above its
      IgG control. The peaks are on the Peak calls tab, the fragment ladder and
      the spike-in factors on the Signal tab.
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: cr-qc-general-stats
    section: Run at a glance
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    title: General statistics
    description: One row per sample, pooling the FastQC, Trim Galore, Bowtie 2, samtools and MACS2 headline numbers. Use the read toggle to see each read of a pair.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 5}

  # ------------------------------------------------------------ read quality
  - component_type: text
    tag: cr-qc-reads-intro
    section: Read quality
    title: Raw and trimmed reads
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/) on
      the raw and the trimmed libraries, plus what
      [Trim Galore](https://www.bioinformatics.babraham.ac.uk/projects/trim_galore/)
      removed. Every library carries a read-pair suffix, so a sample appears
      here once per read of each library.
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: cr-qc-fastqc-counts
    section: Read quality
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Counts
    use: multiqc/fastqc
    title: Sequence counts
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: cr-qc-fastqc-quality
    section: Read quality
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    use: multiqc/fastqc
    title: Per-base sequence quality
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: cr-qc-fastqc-gc
    section: Read quality
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Per Sequence GC Content
    use: multiqc/fastqc
    title: GC content
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: cr-qc-cutadapt
    section: Read quality
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    selected_module: cutadapt
    selected_plot: Filtered Reads
    use: multiqc/cutadapt
    title: Reads kept after trimming
    title_size: sm
    title_align: left
    layout: {x: 4, y: 7, w: 4, h: 5}

  # -------------------------------------------------- alignment and spike-in
  - component_type: text
    tag: cr-qc-align-intro
    section: Alignment and spike-in
    title: Target genome and spike-in
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [Bowtie2](https://github.com/BenLangmead/bowtie2) aligns every library
      twice, once against the target genome and once against the E. coli
      spike-in used for normalisation. The spike-in samples carry a .spikein
      suffix so both sets read side by side, and the two sliders in the left
      panel narrow these panels to the libraries that pass.
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: cr-qc-bowtie2
    section: Alignment and spike-in
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    selected_module: bowtie2
    selected_plot: Paired-end alignments
    use: multiqc/bowtie2
    title: Paired-end alignments
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: cr-qc-samtools-mapped
    section: Alignment and spike-in
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    selected_module: samtools
    selected_plot: Percent mapped
    use: multiqc/samtools
    title: Percent mapped
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: cr-qc-samtools-insert
    section: Alignment and spike-in
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    selected_module: samtools
    selected_plot: Insert size distribution
    use: multiqc/samtools
    title: Insert size distribution
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: cr-qc-samtools-contig
    section: Alignment and spike-in
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    selected_module: samtools
    selected_plot: Mapped reads per contig
    use: multiqc/samtools
    title: Mapped reads per contig
    title_size: sm
    title_align: left
    layout: {x: 4, y: 7, w: 4, h: 5}

  # ------------------------------------------------ enrichment over control
  - component_type: text
    tag: cr-qc-enrich-intro
    section: Enrichment over the control
    title: Is the target enriched at all?
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [deepTools](https://deeptools.readthedocs.io) reads the aligned
      fragments directly. A target that worked bends its fingerprint curve
      away from the diagonal the IgG control follows, and sits away from the
      controls on the PCA and the heatmap. The tables behind these four panels
      are on the Signal tab.
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: cr-qc-deeptools-fingerprint
    section: Enrichment over the control
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    selected_module: deepTools
    selected_plot: Fingerprint plot
    use: multiqc/deeptools
    title: Fingerprint plot
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: cr-qc-deeptools-metrics
    section: Enrichment over the control
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    selected_module: deepTools
    selected_plot: Fingerprint quality metrics
    use: multiqc/deeptools
    title: Fingerprint quality metrics
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: cr-qc-deeptools-pca
    section: Enrichment over the control
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    selected_module: deepTools
    selected_plot: PCA plot
    use: multiqc/deeptools
    title: Sample PCA
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: cr-qc-deeptools-corr
    section: Enrichment over the control
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    selected_module: deepTools
    selected_plot: Correlation heatmap
    use: multiqc/deeptools
    title: Sample correlation
    title_size: sm
    title_align: left
    layout: {x: 4, y: 7, w: 4, h: 5}

  # ------------------------------------------------------------ sample sheet
  # The glance strip of the whole dashboard. It sits in the pinned persistent
  # section on purpose: that section rides every tab, so every tab opens with
  # the same four numbers about the design as its first row, and the MultiQC
  # tab keeps holding MultiQC panels in its own sections.
  - component_type: text
    tag: cr-sheet-intro
    section: Sample sheet
    title: The design behind every panel
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per sample, with the target it profiles, its replicate number and
      the IgG control it was called against. This is the collection the four
      sample filters in the left panel are sourced on, so it is what narrows
      every other tab. The four cards count the same rows by role, by target,
      by sequencing library and by replicate depth.
    workflow_tag: cutandrun
    data_collection_tag: samples
    layout: {x: 0, y: 2, w: 8, h: 2}
  - component_type: card
    tag: cr-gl-card-role
    index: cr-gl-card-role
    section: Sample sheet
    workflow_tag: cutandrun
    data_collection_tag: samples
    use: cutandrun/samples
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: donut
    breakdown_col: role
    display: {icon_name: 'mdi:test-tube', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Samples by role
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: cr-gl-card-target
    index: cr-gl-card-target
    section: Sample sheet
    workflow_tag: cutandrun
    data_collection_tag: samples
    use: cutandrun/samples
    aggregation: count
    column_name: target
    column_type: object
    secondary_layout: top_n
    breakdown_col: target
    top_n_count: 3
    display: {icon_name: 'mdi:dna', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Samples by target
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: cr-gl-card-libraries
    index: cr-gl-card-libraries
    section: Sample sheet
    workflow_tag: cutandrun
    data_collection_tag: samples
    use: cutandrun/samples
    aggregation: sum
    column_name: n_libraries
    column_type: int64
    secondary_layout: composition
    breakdown_col: target
    display: {icon_name: 'mdi:shape-outline', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Libraries sequenced
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: cr-gl-card-replicate
    index: cr-gl-card-replicate
    section: Sample sheet
    workflow_tag: cutandrun
    data_collection_tag: samples
    use: cutandrun/samples
    aggregation: max
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: replicate
    column_type: int64
    display: {icon_name: 'mdi:relation-many-to-many', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Replicate depth
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: table
    tag: cr-ref-table-samples
    section: Sample sheet
    workflow_tag: cutandrun
    data_collection_tag: samples
    use: cutandrun/samples
    row_selection_enabled: false
    title: Sample hub
    description: One row per sample, with its target, replicate, role and control.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 4, w: 8, h: 3}

  # -------------------------------------------------------- reference tables
  - component_type: text
    tag: cr-ref-intro
    section: Reference tables
    title: The rows behind every panel
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The per-sample [SEACR](https://github.com/FredHutch/SEACR) summary the two
      left-panel sliders read, one row per target. The design each sample
      belongs to is in the Sample sheet section, pinned to the top of every tab;
      the regions themselves are on the Peak calls tab.
    workflow_tag: cutandrun
    data_collection_tag: seacr_peak_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Four rows in this run, one per target that had peaks called: h 3, not the
  # h 7 a table of hundreds needs.
  - component_type: table
    tag: cr-ref-table-summary
    section: Reference tables
    workflow_tag: cutandrun
    data_collection_tag: seacr_peak_summary
    use: seacr/peak_summary
    row_selection_enabled: false
    title: SEACR QC summary
    description: Region count, bases covered and the width and coverage spreads per sample.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 3}

  # ---------------------------------------------------------------- filters
  - component_type: interactive
    tag: cr-filter-sample
    index: cr-sample-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: cutandrun
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:test-tube'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: cr-filter-target
    index: cr-target-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: cutandrun
    data_collection_tag: samples
    use: cutandrun/sample_target_filter
    interactive_component_type: MultiSelect
    column_name: target
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:dna'}
    placement: left
    title: Target
    layout: {x: 0, y: 3, w: 1, h: 3}
  # The second real samplesheet factor, two values in this run. It filters on
  # the categorical twin of `replicate`, because an Int64 column only takes a
  # slider and a factor wants a MultiSelect.
  - component_type: interactive
    tag: cr-filter-replicate
    index: cr-replicate-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: cutandrun
    data_collection_tag: samples
    use: cutandrun/sample_replicate_filter
    interactive_component_type: MultiSelect
    column_name: replicate_label
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:relation-many-to-many'}
    placement: left
    title: Replicate
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: cr-filter-role
    index: cr-role-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: cutandrun
    data_collection_tag: samples
    interactive_component_type: Select
    column_name: role
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:shield-check-outline'}
    placement: left
    title: Role
    layout: {x: 0, y: 9, w: 1, h: 3}
  - component_type: interactive
    tag: cr-qc-filter-alignrate
    index: cr-qc-alignrate-range
    section: Alignment scope
    group: Alignment quality
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: target_align_rate
    column_type: float64
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:chart-bar'}
    placement: left
    title: Target alignment rate
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: cr-qc-filter-scale
    index: cr-qc-scale-range
    section: Alignment scope
    group: Alignment quality
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: scale_factor
    column_type: float64
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:ruler'}
    placement: left
    title: Spike-in scale factor
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: cr-filter-peakcount
    index: cr-peakcount-range
    section: QC thresholds
    group: Signal quality
    workflow_tag: cutandrun
    data_collection_tag: seacr_peak_summary
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: num_peaks
    column_type: int64
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:counter'}
    placement: left
    title: Regions called
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: cr-filter-density
    index: cr-density-range
    section: QC thresholds
    group: Signal quality
    workflow_tag: cutandrun
    data_collection_tag: seacr_peak_summary
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: signal_density_median
    column_type: float64
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:chart-line'}
    placement: left
    title: Coverage per base
    layout: {x: 0, y: 3, w: 1, h: 3}

tabs:
# ============================================================================
# Signal
# ============================================================================
# Everything the pipeline published as a table beside the MultiQC report: the
# fragment ladder and the nucleosome classes it bins into, the spike-in factors
# the coverage is scaled by, and the three deepTools tables the MultiQC
# pictures are drawn from.
- title: Signal
  subtitle: The nucleosomal ladder, the spike-in factors and the deepTools tables behind the fingerprint, the PCA and the correlation heatmap
  tab_order: 2
  tab_icon: mdi:waves
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  # Tab-local and non-persistent: three columns that only exist on this tab's
  # own collections.
  - name: Signal scope
    icon: mdi:tune
    color: violet
    description: Narrow the ladder, the nucleosome classes and the fingerprint metrics
  grid_sections:
  - name: Signal at a glance
    icon: mdi:counter
    color: violet
    description: Fragment length, spike-in factor and alignment rate, per library
  - name: Fragment length structure
    icon: mdi:waves
    color: violet
    description: The nucleosomal ladder that says whether the digestion worked
  - name: Nucleosome classes
    icon: mdi:chart-donut
    color: grape
    description: How much of each library is nucleosome-free, mono, di or multi-nucleosomal
  - name: Fragment pile-up around the peaks
    icon: mdi:chart-bell-curve
    color: blue
    description: The fragments SEACR called from, piled up around the summits of the strongest regions
  - name: Spike-in normalisation
    icon: mdi:ruler
    color: indigo
    description: The carrier depth behind every scale factor the coverage was divided by
  - name: Library duplication
    icon: mdi:set-merge
    color: orange
    description: How much of each library Picard flagged as duplicate reads
  - name: Coverage concentration and sample similarity
    icon: mdi:chart-line
    color: cyan
    description: How concentrated each library's coverage is, and which libraries look alike
  components:
  # -------------------------------------------------------- signal at a glance
  - component_type: text
    tag: cr-sg-intro
    section: Signal at a glance
    title: What the libraries carry
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Four numbers about the material itself, before any peak is called: how
      long the fragments are, how many were measured, how much carrier DNA each
      library held (which is what the coverage is divided by) and how much of
      it reached the target genome.
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_lengths
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: cr-sg-card-fraglen
    index: cr-sg-card-fraglen
    section: Signal at a glance
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_lengths
    use: seacr/fragment_lengths
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: fragment_length
    column_type: int64
    display: {icon_name: 'mdi:ruler', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Fragment length
    layout: {x: 0, y: 2, w: 2, h: 2}
