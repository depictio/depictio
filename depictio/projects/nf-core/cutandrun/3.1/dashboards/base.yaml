    section: Peak tables
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/peaks
    row_selection_enabled: true
    row_selection_column: peak_id
    title: SEACR regions
    description: Coordinates, width and the two coverage measures for every SEACR call.
    title_size: h3
