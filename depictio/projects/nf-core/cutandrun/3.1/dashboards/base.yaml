  # ------------------------------------------------- pile-up around the peaks
  - component_type: text
    tag: cr-pk-pileup-intro
    section: Fragment pile-up around the peaks
    title: The fragments behind the calls
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The deepTools heatmap of a CUT&RUN run, rebuilt from the fragment BEDs
      the pipeline publishes rather than from a bigWig: one row per SEACR
      region, 3 kb either side of its summit, strongest regions on top, the
      mean profile above each sample. A sharp mark such as H3K4me3 collapses
      onto the summit; a broad one such as H3K27me3 stays spread over the
      whole window. Only the 500 strongest regions per sample whose windows
      do not overlap are drawn; the Peak calls tab shows the same bins along
      the genome, under its locus navigator.
    workflow_tag: cutandrun
    data_collection_tag: seacr_frags_profile
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: cr-pk-av-pileup-matrix
    index: cr-pk-av-pileup-matrix
    section: Fragment pile-up around the peaks
    workflow_tag: cutandrun
    data_collection_tag: seacr_frags_profile
    use: seacr/frags_pileup_matrix
    config:
      reference_position: 0
      reference_label: summit
      sort_by: signal
      max_rows: 500
      show_profile: true
    title: Fragment pile-up around the SEACR summits
    description: Regions down, offset from the summit across, fragments per million as colour, one panel per sample, mean profile on top.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 9}
  - component_type: figure
    tag: cr-pk-fig-pileup-profile
    index: cr-pk-fig-pileup-profile
    section: Fragment pile-up around the peaks
    workflow_tag: cutandrun
    data_collection_tag: seacr_frags_profile
    use: seacr/frags_profile
    mode: code
    visu_type: line
    code_content: |
      # mean fragments per million at each offset, one curve per sample, so the
      # samples compare on one axis (the matrix above draws one panel each)
      df_modified = (
          df.group_by("sample", "offset_bp")
          .agg(pl.col("cpm").mean().alias("mean_cpm"))
          .sort("sample", "offset_bp")
      )

      fig = px.line(
          df_modified.to_pandas(),
          x="offset_bp",
          y="mean_cpm",
          color="sample",
      )
      fig.add_vline(x=0, line_dash="dot")
      fig.update_layout(
          xaxis_title="Offset from the summit (bp)",
          yaxis_title="Mean fragments per million",
          legend_title_text="Sample",
          margin={"t": 24, "l": 64, "r": 16, "b": 48},
      )
    title: Mean pile-up per sample
    description: The profile above each matrix panel, all samples on one axis. Replicates of one mark should overlap; the height gap between marks is the enrichment gap.
    title_size: h3
    layout: {x: 0, y: 11, w: 8, h: 6}

  # ------------------------------------------------------ spike-in normalisation
  - component_type: text
    tag: cr-sg-spike-intro
    section: Spike-in normalisation
    title: What the coverage was divided by
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Every library is aligned twice, and the carrier depth of the second
      alignment is what says how much material it really held. The pipeline
      turns that into one multiplier per sample and applies it to the bedGraph
      every caller reads. The run publishes no scale-factor table, so these
      rows are recomputed from the two Bowtie 2 logs as normalisation_c over
      the spike-in aligned pairs.
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: cr-sg-fig-scale
    section: Spike-in normalisation
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    use: bowtie2/spikein_factor_bar
    visu_type: bar
    dict_kwargs: {x: sample, y: scale_factor, color: sample}
    title: Spike-in scale factor per sample
    description: The multiplier each library's coverage was divided by. A library with little carrier DNA gets a large factor.
    title_size: h3
    layout: {x: 0, y: 2, w: 4, h: 6}
  - component_type: figure
    tag: cr-sg-fig-depth
    section: Spike-in normalisation
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    use: bowtie2/spikein_depth_scatter
    visu_type: scatter
    dict_kwargs: {x: spikein_aligned, y: target_aligned, color: sample}
    title: Target depth against spike-in depth
    description: The two alignments side by side. The larger a library's spike-in share, the smaller its scale factor, which is why the IgG controls tend to sit low.
    title_size: h3
    layout: {x: 4, y: 2, w: 4, h: 6}
  - component_type: table
    tag: cr-sg-table-spike
    section: Spike-in normalisation
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    use: bowtie2/spikein_factors
    row_selection_enabled: false
    title: Spike-in factors
    description: One row per sample, with both alignment depths, both rates and the factor derived from them.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 8, w: 8, h: 3}

  # ---------------------------------------------------------- duplication
  - component_type: text
    tag: cr-sg-dup-intro
    section: Library duplication
    title: How much of each library is duplicated
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      CUT&RUN libraries start from little material, so they saturate early and
      duplication climbs fast. The pipeline marks duplicates with Picard and
      keeps them in the target BAMs (only the IgG controls are deduplicated),
      so a high share here inflates every coverage number downstream. The IgG
      controls hold the least material and duplicate the most, which is
      expected; a target library climbing towards them is not. Read from
      samtools flagstat on the marked BAMs.
    workflow_tag: cutandrun
    data_collection_tag: samtools_flagstat
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: cr-sg-fig-dup
    index: cr-sg-fig-dup
    section: Library duplication
    workflow_tag: cutandrun
    data_collection_tag: samtools_flagstat
    use: samtools/flagstat
    mode: code
    visu_type: bar
    code_content: |
      # duplicate share per library, from the flagstat counts
      df_modified = df.with_columns(
          (100 * pl.col("duplicate_reads") / pl.col("total_reads")).alias("duplicate_pct")
      ).sort("sample")

      fig = px.bar(
          df_modified.to_pandas(),
          x="sample",
          y="duplicate_pct",
          color="sample",
      )
      fig.update_layout(
          xaxis_title="Sample",
          yaxis_title="Duplicate reads (%)",
          showlegend=False,
          margin={"t": 24, "l": 64, "r": 16, "b": 48},
      )
    title: Duplicate reads per library
    description: Share of each library's reads flagged as duplicates.
    title_size: h3
    layout: {x: 0, y: 2, w: 4, h: 6}
  - component_type: figure
    tag: cr-sg-fig-dup-depth
    index: cr-sg-fig-dup-depth
    section: Library duplication
    workflow_tag: cutandrun
    data_collection_tag: samtools_flagstat
    use: samtools/flagstat
    mode: code
    visu_type: scatter
    code_content: |
      # duplication against depth: a library that is both deep and highly
      # duplicated was sequenced past its complexity
      df_modified = df.with_columns(
          (100 * pl.col("duplicate_reads") / pl.col("total_reads")).alias("duplicate_pct")
      )

      fig = px.scatter(
          df_modified.to_pandas(),
          x="total_reads",
          y="duplicate_pct",
          color="sample",
          hover_name="sample",
          custom_data=["sample"],
      )
      fig.update_traces(marker={"size": 14})
      fig.update_layout(
          xaxis_title="Reads in the BAM",
          yaxis_title="Duplicate reads (%)",
          legend_title_text="Sample",
          margin={"t": 24, "l": 64, "r": 16, "b": 48},
      )
    selection_enabled: true
    selection_column: sample
    title: Duplication against depth
    description: Each library's duplicate share against its read count; deep and highly duplicated means sequenced past its complexity.
    title_size: h3
    layout: {x: 4, y: 2, w: 4, h: 6}

  # --------------------------------------- coverage concentration / similarity
  - component_type: text
    tag: cr-qc-deeptools-intro
    section: Coverage concentration and sample similarity
    title: "The tables under the deepTools panels"
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The [deepTools](https://deeptools.readthedocs.io) panels on the
      [MultiQC](https://multiqc.info) tab are pictures MultiQC redraws from
      its own parquet. nf-core also publishes the three tables behind them,
      and those are what the tiles below read: the fingerprint metrics, the
      PCA loadings and the correlation matrix.
    workflow_tag: cutandrun
    data_collection_tag: deeptools_fingerprint_metrics
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: cr-qc-av-fingerprint
    index: cr-qc-av-fingerprint
    section: Coverage concentration and sample similarity
    workflow_tag: cutandrun
    data_collection_tag: deeptools_fingerprint_metrics
    use: deeptools/fingerprint_scatter
    config:
      controls_placement: header
      x_title: Area under the observed coverage curve
      y_title: Divergence from a uniform library
      # Six libraries: colour names them and the legend carries the names, so
      # the four labels are free to mark the extremes rather than the legend.
      color_col: sample
      # Third quality axis: the share of the genome the library left uncovered.
      # A sharp target covers little of it, an IgG control covers most.
      size_col: x_intercept
      min_size: 8
      max_size: 26
      marker_size: 12
      opacity: 0.85
      marker_outline: true
      top_n_labels: 4
      legend_pos: right
      selection_enabled: true
      selection_column: sample
    title: "Coverage concentration per library"
    description: "plotFingerprint's own quality metrics: the targets sit apart from the IgG controls, which look uniform. Point size is how much of the genome carries no reads at all."
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: advanced_viz
    tag: cr-qc-av-pca
    index: cr-qc-av-pca
    section: Coverage concentration and sample similarity
    workflow_tag: cutandrun
    data_collection_tag: deeptools_sample_pca
    use: deeptools/pca_embedding
    config:
      controls_placement: header
      color_col: sample
      point_size: 16
      marker_outline: true
      legend_pos: right
      selection_enabled: true
      selection_column: sample
    title: "Samples on the first two components"
    description: "The PCA deepTools ran over the genome-wide bin counts; replicates of one target cluster, a library that lands with the controls did not enrich."
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 7}
  - component_type: advanced_viz
    tag: cr-qc-av-corr
    index: cr-qc-av-corr
    section: Coverage concentration and sample similarity
    workflow_tag: cutandrun
    data_collection_tag: deeptools_correlation_matrix
    use: deeptools/correlation_heatmap
    config:
      index_column: sample
      # Clustered on both axes, which is what turns the matrix into blocks: the
      # replicate pairs of one target should fall next to each other without
      # anyone reading the sample names. Average linkage on a correlation
      # distance, not the ward/euclidean default: ward is only defined for
      # euclidean, and these rows are already correlations.
      cluster_rows: true
      cluster_cols: true
      cluster_method: average
      cluster_metric: correlation
      colorscale: RdBu
    title: "Sample correlation matrix"
    description: "Pairwise correlation of the genome-wide bin counts, clustered on both axes; a block that spans two targets is a swap or a contamination."
    title_size: h3
    layout: {x: 0, y: 16, w: 8, h: 8}

