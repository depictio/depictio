# ============================================================================
# Caller agreement
# ============================================================================
- title: Caller agreement
  subtitle: What MACS2 and SEACR each called on the same fragments, and how much of it they share
  tab_order: 4
  tab_icon: mdi:scale-balance
  tab_icon_color: red
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Caller scope
    icon: mdi:tune
    color: red
    description: Which caller and how much agreement to keep in view
  grid_sections:
  - name: Agreement at a glance
    icon: mdi:scale-balance
    color: red
    description: Yield and overlap of the two callers, per sample
  - name: Caller against caller
    icon: mdi:chart-scatter-plot
    color: orange
    description: Every sample as a point, both callers as rows
  - name: Where they diverge
    icon: mdi:chart-bar
    color: pink
    description: The calls only one of the two made
  - name: Comparison table
    icon: mdi:table
    color: grape
    description: The per-sample, per-caller rows behind the panels on this tab
  components:
  - component_type: text
    tag: cr-ca-intro
    section: Agreement at a glance
    title: Two callers, one set of fragments
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      SEACR thresholds the coverage landscape against the IgG control; MACS2
      fits a background model. Neither is a subset of the other, and where they
      disagree is where the biology of the mark shows.
    workflow_tag: cutandrun
    data_collection_tag: caller_agreement
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: cr-ca-card-peaks
    index: cr-ca-card-peaks
    section: Agreement at a glance
    workflow_tag: cutandrun
    data_collection_tag: caller_agreement
    use: cutandrun/caller_agreement
    aggregation: sum
    column_name: n_peaks
    column_type: int64
    secondary_layout: top_n
    breakdown_col: caller
    top_n_count: 2
    display: {icon_name: 'mdi:counter', icon_color: '#E53935', title_color: '#E53935', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Peaks called
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cr-ca-card-shared
    index: cr-ca-card-shared
    section: Agreement at a glance
    workflow_tag: cutandrun
    data_collection_tag: caller_agreement
    use: cutandrun/caller_agreement
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: frac_shared
    column_type: float64
    display: {icon_name: 'mdi:set-merge', icon_color: '#FB8C00', title_color: '#FB8C00', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Share reproduced
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cr-ca-card-gauge
    index: cr-ca-card-gauge
    section: Agreement at a glance
    workflow_tag: cutandrun
    data_collection_tag: caller_agreement
    use: cutandrun/caller_agreement
    aggregation: min
    column_name: frac_shared
    column_type: float64
    secondary_layout: gauge
    coverage_max: 1
    display: {icon_name: 'mdi:alert-outline', icon_color: '#D81B60', title_color: '#D81B60', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Worst agreement
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cr-ca-card-unique
    index: cr-ca-card-unique
    section: Agreement at a glance
    workflow_tag: cutandrun
    data_collection_tag: caller_agreement
    use: cutandrun/caller_agreement
    aggregation: sum
    column_name: n_unique
    column_type: int64
    secondary_layout: composition
    breakdown_col: caller
    display: {icon_name: 'mdi:shape-outline', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Calls only one made
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: text
    tag: cr-ca-dot-intro
    section: Caller against caller
    title: Yield against agreement
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      In the dot plot, colour is how many peaks the caller made and size is how
      much of them the other caller reproduced. A large pale dot is a caller
      that called little but agreed; a small dark one called a lot alone. The
      scatter below puts the two callers on the two axes, one point per sample.
    workflow_tag: cutandrun
    data_collection_tag: caller_agreement
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: cr-ca-av-dotplot
    index: cr-ca-av-dotplot
    section: Caller against caller
    workflow_tag: cutandrun
    data_collection_tag: caller_agreement
    use: cutandrun/caller_yield_dots
    config:
      controls_placement: header
      colour_scale: Viridis
      gene_sort: name
      cluster_sort: name
      max_dot_size: 30
      annotate_top_n: 0
    title: Yield and agreement per sample and caller
    description: One dot per sample and caller. Colour is log10 of the peaks called, size the share of them the other caller also called.
    title_size: h3
    # Four rows, not seven: the y axis holds exactly two callers, and the
    # renderer fills whatever tile it is given, so the extra height is spent
    # spreading two rows of dots over half a screen.
    layout: {x: 0, y: 2, w: 8, h: 4}
  - component_type: figure
    tag: cr-ca-fig-scatter
    index: cr-ca-fig-scatter
    section: Caller against caller
    workflow_tag: cutandrun
    data_collection_tag: caller_agreement
    use: cutandrun/caller_peak_scatter
    mode: code
    visu_type: scatter
    code_content: |
      # put the two callers on the two axes: one point per sample, the y=x line
      # marks where they would have called the same number of peaks
      #
      # Naming depictio_group_by is what opts this figure into analysis-mode
      # grouping. The label has to survive the pivot, so it joins the index
      # rather than being applied after; `caller` cannot, because that is the
      # column the pivot consumes.
      colour_col = depictio_group_by[0] if depictio_group_by else None
      if colour_col in (None, "caller") or colour_col not in df.columns:
          colour_col = "target"
      index_cols = ["sample", "target"]
      if colour_col != "target":
          index_cols.append(colour_col)

      wide = df.pivot(on="caller", index=index_cols, values="n_peaks")
      for caller in ("macs2", "seacr"):
          if caller not in wide.columns:
              wide = wide.with_columns(pl.lit(0).alias(caller))
      shared = df.group_by("sample").agg(
          (100 * pl.col("frac_shared").mean()).round(1).alias("agreement_pct")
      )
      wide = wide.join(shared, on="sample", how="left").fill_null(0)

      fig = px.scatter(
          wide.to_pandas(),
          x="macs2",
          y="seacr",
          color=colour_col,
          color_discrete_map=depictio_group_kwargs.get("color_discrete_map", {}),
          size="agreement_pct",
          size_max=26,
          text="sample",
          hover_name="sample",
          custom_data=["sample"],
      )
      limit = max(
          1,
          int(max(wide["macs2"].max() or 0, wide["seacr"].max() or 0)),
      )
      fig.add_shape(
          type="line", x0=0, y0=0, x1=limit, y1=limit,
          line={"color": "#94A3B8", "dash": "dot", "width": 1},
      )
      fig.update_traces(textposition="top center")
      fig.update_layout(
          xaxis_title="MACS2 peaks",
          yaxis_title="SEACR regions",
          legend_title_text="Target" if colour_col == "target" else "Group",
          margin={"t": 24, "l": 64, "r": 16, "b": 48},
      )
    selection_enabled: true
    selection_column: sample
    title: MACS2 against SEACR, per sample
    description: One point per sample; size is the mean share of calls the two callers share. Points far off the dotted line are samples the callers see very differently.
    title_size: h3
    layout: {x: 0, y: 6, w: 8, h: 6}

  - component_type: text
    tag: cr-ca-diverge-intro
    section: Where they diverge
    title: What only one caller saw
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The left bars count the calls the other caller never made; the right ones
      are the same thing as a share of what the caller called. A caller with a
      tall left bar and a low right one is calling a peak set the other model
      does not recognise at all.
    workflow_tag: cutandrun
    data_collection_tag: caller_agreement
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: cr-ca-fig-unique
    section: Where they diverge
    workflow_tag: cutandrun
    data_collection_tag: caller_agreement
    use: cutandrun/caller_unique_bar
    visu_type: bar
    dict_kwargs: {x: sample, y: n_unique, color: caller, barmode: group}
    title: Calls the other caller did not make
    description: How many of each caller's peaks the other one never called, per sample.
    title_size: h3
    layout: {x: 0, y: 2, w: 4, h: 6}
  - component_type: figure
    tag: cr-ca-fig-frac
    section: Where they diverge
    workflow_tag: cutandrun
    data_collection_tag: caller_agreement
    use: cutandrun/caller_shared_bar
    visu_type: bar
    dict_kwargs: {x: sample, y: frac_shared, color: caller, barmode: group}
    title: Share of calls the other caller reproduced
    description: The fraction of each caller's peaks that overlap at least one peak of the other caller.
    title_size: h3
    layout: {x: 4, y: 2, w: 4, h: 6}

  - component_type: text
    tag: cr-ca-table-intro
    section: Comparison table
    title: The rows behind this tab
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per sample and caller, including the samples a caller returned
      nothing for. Ticking a row keeps that sample in the peak panels of the
      other tabs.
    workflow_tag: cutandrun
    data_collection_tag: caller_agreement
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: cr-ca-table
    section: Comparison table
    workflow_tag: cutandrun
    data_collection_tag: caller_agreement
    use: cutandrun/caller_agreement
    row_selection_enabled: true
    row_selection_column: sample
    title: Caller comparison
    description: One row per sample and caller, with the peaks called, the overlap and the widths behind them.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 3}

  # ---------------------------------------------------------------- filters
  - component_type: interactive
    tag: cr-ca-filter-caller
    index: cr-ca-caller-filter
    section: Caller scope
    group: Callers
    workflow_tag: cutandrun
    data_collection_tag: caller_agreement
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display: {title_size: md, custom_color: '#E53935', icon_name: 'mdi:scale-balance'}
    placement: left
    title: Caller
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: cr-ca-filter-shared
    index: cr-ca-shared-range
    section: Caller scope
    group: Callers
    workflow_tag: cutandrun
    data_collection_tag: caller_agreement
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: frac_shared
    column_type: float64
    display: {title_size: md, custom_color: '#E53935', icon_name: 'mdi:set-merge'}
    placement: left
    title: Share reproduced
    layout: {x: 0, y: 3, w: 1, h: 3}

# ============================================================================
# Consensus and reproducibility
# ============================================================================
- title: Consensus and reproducibility
  subtitle: The merged peak set of each target and which replicates support every interval
  tab_order: 5
  tab_icon: mdi:set-merge
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Consensus scope
    icon: mdi:tune
    color: grape
    description: Replicate support, interval width and member count to keep in view
  grid_sections:
  - name: Consensus at a glance
    icon: mdi:counter
    color: grape
    description: How large the merged peak set is and how much of it more than one replicate found
  - name: Replicate agreement
    icon: mdi:set-merge
    color: violet
    description: Which combinations of replicates call each interval
  - name: How reproducible
    icon: mdi:chart-bar
    color: pink
    description: The reproducible share per target, and how width tracks support
  - name: Consensus table
    icon: mdi:table
    color: gray
    description: The merged intervals behind the panels
    collapsed: true
  components:
  - component_type: text
    tag: cr-cons-intro
    section: Consensus at a glance
    title: What both replicates agree on
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The pipeline merges the per-replicate calls of one target into consensus
      intervals and records which replicate files contributed to each. An
      interval only one replicate found is the weaker half of the set.
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: cr-cons-card-count
    index: cr-cons-card-count
    section: Consensus at a glance
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/consensus_peaks
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: target
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Consensus intervals
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cr-cons-card-support
    index: cr-cons-card-support
    section: Consensus at a glance
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/consensus_peaks
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: num_samples
    column_type: int64
    display: {icon_name: 'mdi:relation-many-to-many', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Replicates per interval
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cr-cons-card-donut
    index: cr-cons-card-donut
    section: Consensus at a glance
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/consensus_peaks
    aggregation: count
    column_name: support
    column_type: object
    secondary_layout: donut
    breakdown_col: support
    display: {icon_name: 'mdi:chart-donut', icon_color: '#D81B60', title_color: '#D81B60', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Intervals by support
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cr-cons-card-signal
    index: cr-cons-card-signal
    section: Consensus at a glance
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/consensus_peaks
    aggregation: average
    column_name: total_signal
    column_type: float64
    secondary_layout: histogram
    display: {icon_name: 'mdi:waves', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Coverage per interval
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: text
    tag: cr-cons-upset-intro
    section: Replicate agreement
    title: Which replicates call what
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each bar is a combination of replicates that call the same consensus
      interval. The two-replicate bars are the reproducible core of a target;
      the single-replicate bars are what one replicate saw alone.
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: cr-cons-av-upset
    index: cr-cons-av-upset
    section: Replicate agreement
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/seacr_consensus_upset
    config:
      # Every replicate column of the run: the pipeline names samples <group>_R<replicate>.
      set_columns_pattern: '_R\d+$'
      color_intersections_by: degree
      show_set_sizes: true
      show_values: true
      sort_by: cardinality
      sort_order: descending
      min_size: 1
    title: Consensus interval overlap
    description: Intersections of the replicates calling each consensus interval, largest first.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}

  - component_type: text
    tag: cr-cons-repro-intro
    section: How reproducible
    title: How much of each target is reproducible
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The stacked bars split each target's consensus set by how many replicates
      called each interval; the histogram next to them shows that intervals
      both replicates found are the wider ones.
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: cr-cons-fig-repro
    index: cr-cons-fig-repro
    section: How reproducible
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/consensus_peaks
    mode: code
    visu_type: bar
    code_content: |
      # share of each target's consensus set by replicate support
      summary = df.group_by(["target", "support"]).agg(
          pl.len().alias("n_intervals")
      )
      totals = summary.group_by("target").agg(
          pl.col("n_intervals").sum().alias("total")
      )
      summary = (
          summary.join(totals, on="target")
          .with_columns(
              (100 * pl.col("n_intervals") / pl.col("total")).round(1).alias("pct")
          )
          .sort(["target", "support"])
      )

      fig = px.bar(
          summary.to_pandas(),
          x="target",
          y="pct",
          color="support",
          barmode="stack",
          text="n_intervals",
      )
      fig.update_layout(
          xaxis_title="Target",
          yaxis_title="Share of consensus intervals (%)",
          legend_title_text="Replicates",
          margin={"t": 24, "l": 64, "r": 16, "b": 48},
      )
    title: Reproducible share per target
    description: Each target's consensus set split by how many replicates called the interval; the bar labels are interval counts.
    title_size: h3
    layout: {x: 0, y: 2, w: 4, h: 6}
  - component_type: figure
    tag: cr-cons-fig-width
    section: How reproducible
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/seacr_consensus_width_hist
    visu_type: histogram
    dict_kwargs: {x: width, color: support, nbins: 60}
    title: Interval width by replicate support
    description: Intervals both replicates called are wider than the ones only one of them found.
    title_size: h3
    layout: {x: 4, y: 2, w: 4, h: 6}

  - component_type: text
    tag: cr-cons-table-intro
    section: Consensus table
    title: The merged intervals
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Every consensus interval of every target, with the member peaks behind it
      and the replicates that supported them. Ticking a row keeps that interval
      in view across the tab.
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: cr-cons-table
    section: Consensus table
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/consensus_peaks
    row_selection_enabled: true
    row_selection_column: peak_id
    title: Consensus intervals
    description: Coordinates, member peak count, replicate support and coverage for every merged interval.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 7}

  # ---------------------------------------------------------------- filters
  - component_type: interactive
    tag: cr-cons-filter-support
    index: cr-cons-support-filter
    section: Consensus scope
    group: Consensus
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    interactive_component_type: MultiSelect
    column_name: support
    column_type: object
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:relation-many-to-many'}
    placement: left
    title: Replicate support
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: cr-cons-filter-width
    index: cr-cons-width-range
    section: Consensus scope
    group: Consensus
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: width
    column_type: int64
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:ruler'}
    placement: left
    title: Interval width
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: cr-cons-filter-members
    index: cr-cons-members-range
    section: Consensus scope
    group: Consensus
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: num_peaks
    column_type: int64
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:counter'}
    placement: left
    title: Member peaks
    layout: {x: 0, y: 6, w: 1, h: 3}
