  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/consensus_peaks
    aggregation: median
    column_name: width
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: violet
      caption: median per interval, with its spread
      decimals: 0
    section: Consensus at a glance
    tag: cr-cons-card-width
    index: cons-card-width
    title: Interval width (bp)
    description: Median width of the merged intervals.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/consensus_peaks
    aggregation: median
    column_name: total_signal
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:waves
      icon_color: cyan
      caption: median per interval, with its distribution
      decimals: 0
    section: Consensus at a glance
    tag: cr-cons-card-signal
