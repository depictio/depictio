version: 1
# nf-core/cutandrun 3.1 reference dashboard.
#
# Funnel: sequencing and enrichment QC (the reprocessed MultiQC report) -> the
# signal the run actually carries (the fragment ladder and its nucleosome
# classes, the spike-in factors, the deepTools tables) -> the peaks each sample
# yielded and how much of its coverage they hold -> whether the two callers
# agree about them -> one region with every track -> the consensus peak set
# the replicates reproduce.
# The sample hub is the anchor: the sample, target and replicate filters in the
# left panel reach every collection through the project links.
#
# The MultiQC tab holds MultiQC panels only. Everything drawn from a table the
# pipeline published beside the report (the fragment ladder, the spike-in
# factors, the fingerprint metrics, the PCA loadings, the correlation matrix)
# lives on the Signal tab, and the per-sample SEACR yield lives on the Peaks
# tab next to the rows it summarises. The pinned sections are the deliberate
# exception: the glance strip, the sample sheet and the SEACR summary ride
# along on every tab, MultiQC included.
#
# Every tab carries filters on two levels: the pinned persistent Sample filters
# section (sample, target, replicate, role), which reaches every collection
# through the links declared in template.yaml, and a tab-local, non-persistent
# section on that tab's own columns.
#
# The IgG controls are samples here, not noise: they carry the MultiQC panels,
# the spike-in factors and the fingerprint that says whether the targets are
# enriched at all. Only the peak panels omit them, because peak calling never
# ran on a control.
#
# The MultiQC report bound here was re-generated with MultiQC 1.35 from the
# run's raw tool outputs; the run itself published MultiQC 1.14, which writes no
# parquet. Module and plot names are therefore the 1.35 ones.
main_dashboard:
  title: nf-core/cutandrun
  subtitle: "SEACR and MACS2 peaks, caller agreement and the replicate consensus, on top of the MultiQC report"
  project_tag: CUT&RUN Chromatin Profiling
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab through the project links
    persistent: true
    pin: top
  # Tab-local and non-persistent: the two sliders are sourced on the spike-in
  # table, which links back into the MultiQC panels, so they narrow the report
  # on this tab without following the reader to the peak tabs.
  - name: Alignment scope
    icon: mdi:tune
    color: indigo
    description: Keep only the libraries inside an alignment rate and spike-in factor band
  - name: QC thresholds
    icon: mdi:check-decagram
    color: cyan
    description: Yield and signal floors on the per-sample SEACR summary
    collapsed: true
    persistent: true
    pin: bottom
  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: One row per sample, pooling the headline numbers of every module
  - name: Read quality
    icon: mdi:chart-bell-curve
    color: blue
    description: FastQC and Trim Galore as MultiQC reports them
  - name: Alignment and spike-in
    icon: mdi:chart-bar
    color: indigo
    description: How much of each library aligned to the target genome and to the spike-in
  - name: Enrichment over the control
    icon: mdi:chart-line
    color: cyan
    description: Whether each target is enriched over the IgG control, and how the samples cluster
  # Pinned to the top and carried by every tab: the four-card glance strip
  # (open) and the sample hub every filter starts from (collapsed). A pinned
  # persistent section is the one thing allowed to hold non-MultiQC tiles on
  # the MultiQC tab.
  - name: Cohort at a glance
    icon: mdi:account-group-outline
    color: teal
    description: What the run contains and what it yielded, on every tab
    persistent: true
    pin: top
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The sample hub every other tab is filtered by
    collapsed: true
    persistent: true
    pin: top
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The per-sample SEACR rows, on every tab
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # ------------------------------------------------------------- at a glance
  - component_type: text
    tag: cr-qc-intro
    section: Run at a glance
    title: A CUT&RUN run, from reads to enrichment
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The reprocessed [MultiQC](https://multiqc.info) report, module by
      module: the general statistics table first, then read quality, alignment
      to the target and the spike-in genome, and whether each target rises
      above its IgG control. The peaks are on the Peaks tab, the fragment
      ladder and the spike-in factors on the Signal tab.
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: cr-qc-general-stats
    section: Run at a glance
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    title: General statistics
    description: One row per sample, pooling the FastQC, Trim Galore, Bowtie 2, samtools and MACS2 headline numbers. Use the read toggle to see each read of a pair.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 5}

  # ------------------------------------------------------------ read quality
  - component_type: text
    tag: cr-qc-reads-intro
    section: Read quality
    title: Raw and trimmed reads
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/) on
      the raw and the trimmed libraries, plus what
      [Trim Galore](https://www.bioinformatics.babraham.ac.uk/projects/trim_galore/)
      removed. Every library carries a read-pair suffix, so a sample appears
      here once per read of each library.
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: cr-qc-fastqc-counts
    section: Read quality
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Counts
    use: multiqc/fastqc
    title: Sequence counts
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: cr-qc-fastqc-quality
    section: Read quality
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    use: multiqc/fastqc
    title: Per-base sequence quality
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: cr-qc-fastqc-gc
    section: Read quality
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Per Sequence GC Content
    use: multiqc/fastqc
    title: GC content
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: cr-qc-cutadapt
    section: Read quality
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    selected_module: cutadapt
    selected_plot: Filtered Reads
    use: multiqc/cutadapt
    title: Reads kept after trimming
    title_size: sm
    title_align: left
    layout: {x: 4, y: 7, w: 4, h: 5}

  # -------------------------------------------------- alignment and spike-in
  - component_type: text
    tag: cr-qc-align-intro
    section: Alignment and spike-in
    title: Target genome and spike-in
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [Bowtie2](https://github.com/BenLangmead/bowtie2) aligns every library
      twice, once against the target genome and once against the spike-in
      genome used for normalisation; the spike-in samples carry a .spikein
      suffix. The two sliders in the left panel narrow these panels to the
      libraries that pass.
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: cr-qc-bowtie2
    section: Alignment and spike-in
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    selected_module: bowtie2
    selected_plot: Paired-end alignments
    use: multiqc/bowtie2
    title: Paired-end alignments
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: cr-qc-samtools-mapped
    section: Alignment and spike-in
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    selected_module: samtools
    selected_plot: Percent mapped
    use: multiqc/samtools
    title: Percent mapped
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: cr-qc-samtools-insert
    section: Alignment and spike-in
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    selected_module: samtools
    selected_plot: Insert size distribution
    use: multiqc/samtools
    title: Insert size distribution
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: cr-qc-samtools-contig
    section: Alignment and spike-in
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    selected_module: samtools
    selected_plot: Mapped reads per contig
    use: multiqc/samtools
    title: Mapped reads per contig
    title_size: sm
    title_align: left
    layout: {x: 4, y: 7, w: 4, h: 5}

  # ------------------------------------------------ enrichment over control
  - component_type: text
    tag: cr-qc-enrich-intro
    section: Enrichment over the control
    title: Is the target enriched at all?
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [deepTools](https://deeptools.readthedocs.io) reads the aligned
      fragments directly: a target that worked bends its fingerprint curve
      away from the diagonal the IgG control follows. The fingerprint metrics,
      the PCA and the correlation matrix are on the Signal tab.
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: cr-qc-deeptools-fingerprint
    section: Enrichment over the control
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    selected_module: deepTools
    selected_plot: Fingerprint plot
    use: multiqc/deeptools
    title: Fingerprint plot
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 5}

  # ------------------------------------------------------- cohort at a glance
  # The glance strip of the whole dashboard: two design cards (role, target)
  # and two yield cards (peaks called, FRiP), in a pinned persistent section so
  # every tab opens on them.
  - component_type: text
    tag: cr-sheet-intro
    section: Sample sheet
    title: The design behind every panel
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per sample, with the target it profiles, its replicate and the
      IgG control it was called against. Every sample filter starts from this
      table, so it is what narrows every other tab.
    workflow_tag: cutandrun
    data_collection_tag: samples
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: cr-gl-card-role
    index: cr-gl-card-role
    section: Cohort at a glance
    workflow_tag: cutandrun
    data_collection_tag: samples
    use: cutandrun/samples
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: donut
    breakdown_col: role
    display: {icon_name: 'mdi:test-tube', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Samples by role
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: cr-gl-card-target
    index: cr-gl-card-target
    section: Cohort at a glance
    workflow_tag: cutandrun
    data_collection_tag: samples
    use: cutandrun/samples
    aggregation: count
    column_name: target
    column_type: object
    secondary_layout: top_n
    breakdown_col: target
    top_n_count: 3
    display: {icon_name: 'mdi:dna', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Samples by target
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: cr-gl-card-peaks
    index: cr-gl-card-peaks
    section: Cohort at a glance
    workflow_tag: cutandrun
    data_collection_tag: seacr_peak_summary
    use: seacr/peak_summary
    aggregation: sum
    column_name: num_peaks
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:counter', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Peaks called
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: cr-gl-card-frip
    index: cr-gl-card-frip
    section: Cohort at a glance
    workflow_tag: cutandrun
    data_collection_tag: frip
    use: cutandrun/frip
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: frip
    column_type: float64
    display: {icon_name: 'mdi:target', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: FRiP
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: table
    tag: cr-ref-table-samples
    section: Sample sheet
    workflow_tag: cutandrun
    data_collection_tag: samples
    use: cutandrun/samples
    row_selection_enabled: true
    title: Sample sheet
    description: One row per sample, with its target, replicate, role and control.
    title_size: h3
    title_align: left
    row_selection_column: sample_id
    layout: {x: 0, y: 2, w: 8, h: 3}

  # -------------------------------------------------------- reference tables
  - component_type: text
    tag: cr-ref-intro
    section: Reference tables
    title: The rows behind every panel
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The per-sample [SEACR](https://github.com/FredHutch/SEACR) summary the
      QC threshold sliders read, one row per sample with peaks called. The
      regions themselves are on the Peaks tab.
    workflow_tag: cutandrun
    data_collection_tag: seacr_peak_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One row per sample with peaks called: h 3, not the h 7 a table of hundreds
  # needs.
  - component_type: table
    tag: cr-ref-table-summary
    section: Reference tables
    workflow_tag: cutandrun
    data_collection_tag: seacr_peak_summary
    use: seacr/peak_summary
    row_selection_enabled: true
    row_selection_column: sample
    title: SEACR QC summary
    description: Region count, bases covered and the width and coverage spreads per sample.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 3}

  # ---------------------------------------------------------------- filters
  - component_type: interactive
    tag: cr-filter-sample
    index: cr-sample-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: cutandrun
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:test-tube'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: cr-filter-target
    index: cr-target-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: cutandrun
    data_collection_tag: samples
    use: cutandrun/sample_target_filter
    interactive_component_type: MultiSelect
    column_name: target
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:dna'}
    placement: left
    title: Target
    layout: {x: 0, y: 3, w: 1, h: 3}
  # The second samplesheet factor. It filters on the categorical twin of
  # `replicate`, because an Int64 column only takes a slider and a factor wants
  # a MultiSelect.
  - component_type: interactive
    tag: cr-filter-replicate
    index: cr-replicate-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: cutandrun
    data_collection_tag: samples
    use: cutandrun/sample_replicate_filter
    interactive_component_type: MultiSelect
    column_name: replicate_label
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:relation-many-to-many'}
    placement: left
    title: Replicate
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: cr-filter-role
    index: cr-role-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: cutandrun
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: role
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:shield-check-outline'}
    placement: left
    title: Role
    layout: {x: 0, y: 9, w: 1, h: 3}
  - component_type: interactive
    tag: cr-qc-filter-alignrate
    index: cr-qc-alignrate-range
    section: Alignment scope
    group: Alignment quality
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: target_align_rate
    column_type: float64
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:chart-bar'}
    placement: left
    title: Target alignment rate
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: cr-qc-filter-scale
    index: cr-qc-scale-range
    section: Alignment scope
    group: Alignment quality
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: scale_factor
    column_type: float64
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:ruler'}
    placement: left
    title: Spike-in scale factor
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: cr-filter-peakcount
    index: cr-peakcount-range
    section: QC thresholds
    group: Signal quality
    workflow_tag: cutandrun
    data_collection_tag: seacr_peak_summary
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: num_peaks
    column_type: int64
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:counter'}
    placement: left
    title: Regions called
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: cr-filter-density
    index: cr-density-range
    section: QC thresholds
    group: Signal quality
    workflow_tag: cutandrun
    data_collection_tag: seacr_peak_summary
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: signal_density_median
    column_type: float64
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:chart-line'}
    placement: left
    title: Coverage per base
    layout: {x: 0, y: 3, w: 1, h: 3}

tabs:
# ============================================================================
# Signal
# ============================================================================
# Everything the pipeline published as a table beside the MultiQC report: the
# fragment ladder and the nucleosome classes it bins into, the spike-in factors
# the coverage is scaled by, and the three deepTools tables the MultiQC
# pictures are drawn from.
- title: Signal
  subtitle: Digestion, spike-in normalisation, duplication and sample similarity, before any peak is called
  tab_order: 2
  tab_icon: mdi:waves
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  # Tab-local and non-persistent: three columns that only exist on this tab's
  # own collections.
  - name: Signal scope
    icon: mdi:tune
    color: violet
    description: Narrow the ladder, the nucleosome classes and the fingerprint metrics
  grid_sections:
  - name: Signal at a glance
    icon: mdi:counter
    color: violet
    description: Fragment length, spike-in factor and alignment rate, per library
  - name: Fragment length structure
    icon: mdi:waves
    color: violet
    description: The nucleosomal ladder that says whether the digestion worked
  - name: Nucleosome classes
    icon: mdi:chart-donut
    color: grape
    description: How much of each library is nucleosome-free, mono, di or multi-nucleosomal
  - name: Spike-in normalisation
    icon: mdi:ruler
    color: indigo
    description: The carrier depth behind every scale factor the coverage was divided by
  - name: Library duplication
    icon: mdi:set-merge
    color: orange
    description: How much of each library Picard flagged as duplicate reads
  - name: Coverage concentration and sample similarity
    icon: mdi:chart-line
    color: cyan
    description: How concentrated each library's coverage is, and which libraries look alike
  - name: Signal tables
    icon: mdi:table
    color: violet
    description: The fragment-class and spike-in rows behind the panels
    collapsed: true
  components:
  # -------------------------------------------------------- signal at a glance
  - component_type: text
    tag: cr-sg-intro
    section: Signal at a glance
    title: What the libraries carry
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Four numbers about the material itself, before any peak is called: how
      long the fragments are, how many were measured, how much carrier DNA each
      library held (which is what the coverage is divided by) and how much of
      it reached the target genome.
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_lengths
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: cr-sg-card-fraglen
    index: cr-sg-card-fraglen
    section: Signal at a glance
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_classes
    use: seacr/fragment_classes
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: sample_median_length
    column_type: float64
    display: {icon_name: 'mdi:ruler', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Median fragment length
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cr-sg-card-frags
    index: cr-sg-card-frags
    section: Signal at a glance
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_lengths
    use: seacr/fragment_lengths
    aggregation: sum
    column_name: count
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Fragments measured
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cr-sg-card-scale
    index: cr-sg-card-scale
    section: Signal at a glance
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    use: bowtie2/spikein_factors
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: scale_factor
    column_type: float64
    display: {icon_name: 'mdi:shape-outline', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Spike-in scale factor
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cr-sg-card-alignrate
    index: cr-sg-card-alignrate
    section: Signal at a glance
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    use: bowtie2/spikein_factors
    aggregation: average
    column_name: target_align_rate
    column_type: float64
    secondary_layout: gauge
    coverage_max: 100
    display: {icon_name: 'mdi:check-decagram', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Target alignment rate
    layout: {x: 6, y: 2, w: 2, h: 2}

  # ------------------------------------------------------- fragment structure
  - component_type: text
    tag: cr-qc-frag-intro
    section: Fragment length structure
    title: The nucleosomal ladder
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      MNase cuts around nucleosomes, so a working experiment shows a sharp
      sub-nucleosomal peak next to a mononucleosomal shoulder. The shaded
      bands are the sub-nucleosomal (below 120 bp) and mononucleosomal (120 to
      250 bp) windows of the nucleosome classes below.
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_lengths
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: cr-qc-fig-fragments
    index: cr-qc-fig-fragments
    section: Fragment length structure
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_lengths
    use: seacr/fragment_lengths
    mode: code
    visu_type: line
    code_content: |
      # the 25-800 bp window is where the nucleosomal structure lives; outside it
      # the histogram is a long tail of a few hundred fragments
      df_modified = df.filter(
          (pl.col("fragment_length") >= 25) & (pl.col("fragment_length") <= 800)
      ).sort(["sample", "fragment_length"])

      # One curve per sample either way; naming depictio_group_by is what opts
      # this figure into analysis-mode grouping, and what the colour then means
      # is the viewer's groups rather than the sample.
      colour_col = depictio_group_by[0] if depictio_group_by else "sample"
      if colour_col not in df_modified.columns:
          colour_col = "sample"

      fig = px.line(
          df_modified.to_pandas(),
          x="fragment_length",
          y="fraction",
          color=colour_col,
          line_group="sample",
          color_discrete_map=depictio_group_kwargs.get("color_discrete_map", {}),
      )
      # the sub-nucleosomal and mononucleosomal windows of seacr/fragment_classes
      for start, end, label in ((0, 120, "sub-nucleosomal"), (120, 250, "mononucleosomal")):
          fig.add_vrect(
              x0=start,
              x1=end,
              fillcolor="grey",
              opacity=0.10,
              line_width=0,
              annotation_text=label,
              annotation_position="top left",
          )
      fig.update_layout(
          xaxis_title="Fragment length (bp)",
          yaxis_title="Share of fragments",
          legend_title_text="Sample" if colour_col == "sample" else "Group",
          margin={"t": 24, "l": 64, "r": 16, "b": 48},
      )
    title: Fragment length distribution
    description: The share of each sample's fragments at every length. The shaded bands are the sub-nucleosomal and mononucleosomal class windows.
    title_size: h3
    layout: {x: 0, y: 2, w: 4, h: 6}
  - component_type: figure
    tag: cr-qc-fig-fragments-cum
    section: Fragment length structure
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_lengths
    use: seacr/seacr_fragment_cumulative
    visu_type: line
    dict_kwargs: {x: fragment_length, y: cumulative_fraction, color: sample}
    title: Cumulative fragment length
    description: The share of a sample's fragments at most this long. A curve that rises early is dominated by short, sub-nucleosomal fragments.
    title_size: h3
    layout: {x: 4, y: 2, w: 4, h: 6}

  # --------------------------------------------------------- nucleosome classes
  - component_type: text
    tag: cr-sg-class-intro
    section: Nucleosome classes
    title: How much of the library is nucleosome-free
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The same histogram binned at the conventional MNase boundaries: sub-
      nucleosomal below 120 bp, mononucleosomal to 250 bp, dinucleosomal to
      450 bp and multi-nucleosomal above. A sharp mark carries more sub-
      nucleosomal material than a broad one, and the mononucleosome ratio is
      that contrast as one number per sample.
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_classes
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: cr-sg-card-classcomp
    index: cr-sg-card-classcomp
    section: Nucleosome classes
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_classes
    use: seacr/fragment_classes
    aggregation: sum
    column_name: n_fragments
    column_type: int64
    secondary_layout: donut
    breakdown_col: fragment_class
    display: {icon_name: 'mdi:chart-donut', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Fragments by class
    layout: {x: 0, y: 2, w: 4, h: 2}
  - component_type: card
    tag: cr-sg-card-classlen
    index: cr-sg-card-classlen
    section: Nucleosome classes
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_classes
    use: seacr/fragment_classes
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: median_length
    column_type: float64
    display: {icon_name: 'mdi:ruler', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Class median length
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cr-sg-card-monosub
    index: cr-sg-card-monosub
    section: Nucleosome classes
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_classes
    use: seacr/fragment_classes
    aggregation: median
    column_name: mono_to_sub
    column_type: float64
    secondary_layout: box_plot
    display: {icon_name: 'mdi:scale-balance', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mononucleosome ratio
    aggregations: [box_plot_stats]
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: figure
    tag: cr-sg-fig-classstack
    section: Nucleosome classes
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_classes
    use: seacr/seacr_fragment_class_stack
    visu_type: bar
    dict_kwargs: {x: sample, y: fraction, color: fragment_class, barmode: stack}
    title: Fragment classes per sample
    description: Each library split into the four nucleosome classes, as a share of its own fragments.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 6}

  # ------------------------------------------------------ spike-in normalisation
  - component_type: text
    tag: cr-sg-spike-intro
    section: Spike-in normalisation
    title: What the coverage was divided by
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Every library is aligned twice, and the spike-in depth of the second
      alignment becomes one multiplier per sample that the pipeline applies to
      the bedGraph every caller reads. The run publishes no scale-factor
      table, so these rows are recomputed from the two Bowtie 2 logs.
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: cr-sg-fig-scale
    section: Spike-in normalisation
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    use: bowtie2/spikein_factor_bar
    visu_type: bar
    dict_kwargs: {x: sample, y: scale_factor, color: sample}
    title: Spike-in scale factor per sample
    description: The multiplier each library's coverage was divided by. A library with little carrier DNA gets a large factor.
    title_size: h3
    layout: {x: 0, y: 2, w: 4, h: 6}
  - component_type: figure
    tag: cr-sg-fig-depth
    section: Spike-in normalisation
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    use: bowtie2/spikein_depth_scatter
    selection_enabled: true
    selection_column: sample
    visu_type: scatter
    dict_kwargs: {x: spikein_aligned, y: target_aligned, color: sample}
    title: Target depth against spike-in depth
    description: The two alignments side by side. The larger a library's spike-in share, the smaller its scale factor, which is why the IgG controls tend to sit low.
    title_size: h3
    layout: {x: 4, y: 2, w: 4, h: 6}

  # ---------------------------------------------------------- duplication
  - component_type: text
    tag: cr-sg-dup-intro
    section: Library duplication
    title: How much of each library is duplicated
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      CUT&RUN libraries start from little material, so they saturate early and
      duplication climbs fast; the pipeline marks duplicates and keeps them in
      the target BAMs. IgG controls hold the least material and duplicate the
      most, while a target library climbing towards them inflates every
      coverage number downstream.
    workflow_tag: cutandrun
    data_collection_tag: samtools_flagstat
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: cr-sg-fig-dup
    index: cr-sg-fig-dup
    section: Library duplication
    workflow_tag: cutandrun
    data_collection_tag: samtools_flagstat
    use: samtools/flagstat
    mode: code
    visu_type: bar
    code_content: |
      # duplicate share per library, from the flagstat counts
      df_modified = df.with_columns(
          (100 * pl.col("duplicate_reads") / pl.col("total_reads")).alias("duplicate_pct")
      ).sort("sample")

      fig = px.bar(
          df_modified.to_pandas(),
          x="sample",
          y="duplicate_pct",
          color="sample",
      )
      fig.update_layout(
          xaxis_title="Sample",
          yaxis_title="Duplicate reads (%)",
          showlegend=False,
          margin={"t": 24, "l": 64, "r": 16, "b": 48},
      )
    title: Duplicate reads per library
    description: Share of each library's reads flagged as duplicates.
    title_size: h3
    layout: {x: 0, y: 2, w: 4, h: 6}
  - component_type: figure
    tag: cr-sg-fig-dup-depth
    index: cr-sg-fig-dup-depth
    section: Library duplication
    workflow_tag: cutandrun
    data_collection_tag: samtools_flagstat
    use: samtools/flagstat
    mode: code
    visu_type: scatter
    code_content: |
      # duplication against depth: a library that is both deep and highly
      # duplicated was sequenced past its complexity
      df_modified = df.with_columns(
          (100 * pl.col("duplicate_reads") / pl.col("total_reads")).alias("duplicate_pct")
      )

      fig = px.scatter(
          df_modified.to_pandas(),
          x="total_reads",
          y="duplicate_pct",
          color="sample",
          hover_name="sample",
          custom_data=["sample"],
      )
      fig.update_traces(marker={"size": 14})
      fig.update_layout(
          xaxis_title="Reads in the BAM",
          yaxis_title="Duplicate reads (%)",
          legend_title_text="Sample",
          margin={"t": 24, "l": 64, "r": 16, "b": 48},
      )
    selection_enabled: true
    selection_column: sample
    title: Duplication against depth
    description: Each library's duplicate share against its read count; deep and highly duplicated means sequenced past its complexity.
    title_size: h3
    layout: {x: 4, y: 2, w: 4, h: 6}

  # --------------------------------------- coverage concentration / similarity
  - component_type: text
    tag: cr-qc-deeptools-intro
    section: Coverage concentration and sample similarity
    title: Coverage concentration and sample similarity
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The tables nf-core publishes behind the deepTools QC: the fingerprint
      metrics, the PCA and the correlation matrix of the genome-wide bin
      counts. Targets should sit apart from their IgG controls on all three,
      and replicates of one target together.
    workflow_tag: cutandrun
    data_collection_tag: deeptools_fingerprint_metrics
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: cr-qc-av-fingerprint
    index: cr-qc-av-fingerprint
    section: Coverage concentration and sample similarity
    workflow_tag: cutandrun
    data_collection_tag: deeptools_fingerprint_metrics
    use: deeptools/fingerprint_scatter
    config:
      controls_placement: header
      x_title: Area under the observed coverage curve
      y_title: Divergence from a uniform library
      # Six libraries: colour names them and the legend carries the names, so
      # the four labels are free to mark the extremes rather than the legend.
      color_col: sample
      # Third quality axis: the share of the genome the library left uncovered.
      # A sharp target covers little of it, an IgG control covers most.
      size_col: x_intercept
      min_size: 8
      max_size: 26
      marker_size: 12
      opacity: 0.85
      marker_outline: true
      top_n_labels: 4
      legend_pos: right
      selection_enabled: true
      selection_column: sample
    title: "Coverage concentration per library"
    description: "plotFingerprint's own quality metrics: the targets sit apart from the IgG controls, which look uniform. Point size is how much of the genome carries no reads at all."
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: advanced_viz
    tag: cr-qc-av-pca
    index: cr-qc-av-pca
    section: Coverage concentration and sample similarity
    workflow_tag: cutandrun
    data_collection_tag: deeptools_sample_pca
    use: deeptools/pca_embedding
    config:
      controls_placement: header
      color_col: sample
      point_size: 16
      marker_outline: true
      legend_pos: right
      selection_enabled: true
      selection_column: sample
    title: "Samples on the first two components"
    description: "The PCA deepTools ran over the genome-wide bin counts; replicates of one target cluster, a library that lands with the controls did not enrich."
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 7}
  - component_type: advanced_viz
    tag: cr-qc-av-corr
    index: cr-qc-av-corr
    section: Coverage concentration and sample similarity
    workflow_tag: cutandrun
    data_collection_tag: deeptools_correlation_matrix
    use: deeptools/correlation_heatmap
    config:
      controls_placement: header
      index_column: sample
      # Clustered on both axes, which is what turns the matrix into blocks: the
      # replicate pairs of one target should fall next to each other without
      # anyone reading the sample names. Average linkage on a correlation
      # distance, not the ward/euclidean default: ward is only defined for
      # euclidean, and these rows are already correlations.
      cluster_rows: true
      cluster_cols: true
      cluster_method: average
      cluster_metric: correlation
      colorscale: RdBu
    title: "Sample correlation matrix"
    description: "Pairwise correlation of the genome-wide bin counts, clustered on both axes; a block that spans two targets is a swap or a contamination."
    title_size: h3
    layout: {x: 0, y: 16, w: 8, h: 8}
  - component_type: table
    tag: cr-sg-table-classes
    section: Signal tables
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_classes
    use: seacr/fragment_classes
    row_selection_enabled: true
    row_selection_column: sample
    title: Fragment classes
    description: Four rows per sample, with the fragments, the share and the median length of each class.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    tag: cr-sg-table-spike
    section: Signal tables
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    use: bowtie2/spikein_factors
    row_selection_enabled: true
    row_selection_column: sample
    title: Spike-in factors
    description: One row per sample, with both alignment depths, both rates and the factor derived from them.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 4, w: 8, h: 3}

  # ---------------------------------------------------------------- filters
  - component_type: interactive
    tag: cr-sg-filter-class
    index: cr-sg-class-filter
    section: Signal scope
    group: Signal columns
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_classes
    interactive_component_type: MultiSelect
    column_name: fragment_class
    column_type: object
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Nucleosome class
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: cr-sg-filter-fraglen
    index: cr-sg-fraglen-range
    section: Signal scope
    group: Signal columns
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_lengths
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: fragment_length
    column_type: int64
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:ruler'}
    placement: left
    title: Fragment length
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: cr-sg-filter-auc
    index: cr-sg-auc-range
    section: Signal scope
    group: Signal columns
    workflow_tag: cutandrun
    data_collection_tag: deeptools_fingerprint_metrics
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: auc_ratio
    column_type: float64
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:chart-line'}
    placement: left
    title: Coverage concentration
    layout: {x: 0, y: 6, w: 1, h: 3}

# ============================================================================
# Peaks
# ============================================================================
- title: Peaks
  subtitle: What SEACR and MACS2 each called on every sample, the fragments piled up around the calls and how much of the library's coverage they hold
  tab_order: 3
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Peak scope
    icon: mdi:tune
    color: indigo
    description: Keep only the SEACR regions inside a width and coverage band, on chosen contigs
  grid_sections:
  - name: SEACR peak yield
    icon: mdi:counter
    color: indigo
    description: How many regions each sample contributed, and how strong they are
  - name: Fragment pile-up around the peaks
    icon: mdi:chart-bell-curve
    color: blue
    description: The fragments SEACR called from, piled up around the summits of the strongest regions
  - name: Signal budget
    icon: mdi:chart-donut
    color: teal
    description: How much of a library's fragment coverage its own peaks hold
  - name: MACS2 alongside
    icon: mdi:chart-bar
    color: violet
    description: The same fragments through a background-model caller, for comparison
  - name: Peak tables
    icon: mdi:table
    color: grape
    description: The rows behind the panels, for both callers
    collapsed: true
  components:
  # ---------------------------------------------------------------- yield
  - component_type: text
    tag: cr-pk-intro
    section: SEACR peak yield
    title: What SEACR called
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per region per sample. The cards count the regions and summarise
      their width and coverage; the sliders in the left panel narrow every
      panel on this tab to a band of each.
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: cr-pk-card-count
    index: cr-pk-card-count
    section: SEACR peak yield
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/peaks
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Regions in view
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cr-pk-card-width
    index: cr-pk-card-width
    section: SEACR peak yield
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/peaks
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: width
    column_type: int64
    display: {icon_name: 'mdi:ruler', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Region width
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cr-pk-card-signal
    index: cr-pk-card-signal
    section: SEACR peak yield
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/peaks
    aggregation: sum
    column_name: total_signal
    column_type: float64
    secondary_layout: histogram
    display: {icon_name: 'mdi:waves', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Total coverage in regions
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cr-pk-card-density
    index: cr-pk-card-density
    section: SEACR peak yield
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/peaks
    aggregation: average
    column_name: signal_density
    column_type: float64
    secondary_layout: histogram
    display: {icon_name: 'mdi:chart-line', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Coverage per base
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: figure
    tag: cr-pk-fig-width
    section: SEACR peak yield
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/seacr_width_hist
    visu_type: histogram
    dict_kwargs: {x: width, color: sample, nbins: 60, log_x: true}
    title: SEACR region width
    description: How wide the calls are, per sample, on a log axis. A broad mark gives far wider regions than a sharp one.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 6}

  # ------------------------------------------------- pile-up around the peaks
  - component_type: text
    tag: cr-pk-pileup-intro
    section: Fragment pile-up around the peaks
    title: The fragments behind the calls
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per SEACR region, 3 kb either side of its summit, strongest
      regions on top and the mean profile above each sample, rebuilt from the
      fragment BEDs. A sharp mark collapses onto the summit while a broad one
      stays spread over the window; the Locus tab shows the same bins along
      the genome.
    workflow_tag: cutandrun
    data_collection_tag: seacr_frags_profile
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: cr-pk-av-pileup-matrix
    index: cr-pk-av-pileup-matrix
    section: Fragment pile-up around the peaks
    workflow_tag: cutandrun
    data_collection_tag: seacr_frags_profile
    use: seacr/frags_pileup_matrix
    config:
      controls_placement: header
      reference_position: 0
      reference_label: summit
      sort_by: signal
      max_rows: 500
      show_profile: true
    title: Fragment pile-up around the SEACR summits
    description: Regions down, offset from the summit across, fragments per million as colour, one panel per sample, mean profile on top.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 9}
  - component_type: figure
    tag: cr-pk-fig-pileup-profile
    index: cr-pk-fig-pileup-profile
    section: Fragment pile-up around the peaks
    workflow_tag: cutandrun
    data_collection_tag: seacr_frags_profile
    use: seacr/frags_profile
    mode: code
    visu_type: line
    code_content: |
      # mean fragments per million at each offset, one curve per sample, so the
      # samples compare on one axis (the matrix above draws one panel each)
      df_modified = (
          df.group_by("sample", "offset_bp")
          .agg(pl.col("cpm").mean().alias("mean_cpm"))
          .sort("sample", "offset_bp")
      )

      fig = px.line(
          df_modified.to_pandas(),
          x="offset_bp",
          y="mean_cpm",
          color="sample",
      )
      fig.add_vline(x=0, line_dash="dot")
      fig.update_layout(
          xaxis_title="Offset from the summit (bp)",
          yaxis_title="Mean fragments per million",
          legend_title_text="Sample",
          margin={"t": 24, "l": 64, "r": 16, "b": 48},
      )
    title: Mean pile-up per sample
    description: The profile above each matrix panel, all samples on one axis. Replicates of one mark should overlap; the height gap between marks is the enrichment gap.
    title_size: h3
    layout: {x: 0, y: 11, w: 8, h: 6}

