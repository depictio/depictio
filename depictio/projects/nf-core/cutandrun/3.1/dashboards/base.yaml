# ============================================================================
# Peak calls
# ============================================================================
- title: Peak calls
  subtitle: What SEACR and MACS2 each called on every sample, how much of the library's coverage the calls hold and where along the genome they sit
  tab_order: 3
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Peak scope
    icon: mdi:tune
    color: indigo
    description: Keep only the SEACR regions inside a width and coverage band, on chosen contigs
  grid_sections:
  - name: SEACR peak yield
    icon: mdi:counter
    color: indigo
    description: How many regions each sample contributed, and how strong they are
  - name: Signal budget
    icon: mdi:chart-donut
    color: teal
    description: How much of a library's fragment coverage its own peaks hold
  # The locus section: one region, one x axis. The SEACR navigator on top
  # drives the tracks under it through the region links in template.yaml.
  - name: Peak calls locus
    icon: mdi:dna
    color: cyan
    description: SEACR calls, fragment pile-up, MACS2 calls and consensus intervals on one region
  - name: MACS2 alongside
    icon: mdi:chart-bar
    color: violet
    description: The same fragments through a background-model caller, for comparison
  - name: Peak tables
    icon: mdi:table
    color: grape
    description: The rows behind the panels, for both callers
    collapsed: true
  components:
  # ---------------------------------------------------------------- yield
  - component_type: text
    tag: cr-pk-intro
    section: SEACR peak yield
    title: What SEACR called
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per region per sample. The cards count the regions and summarise
      their width and coverage; the sliders in the left panel narrow every
      panel on this tab to a band of each, and the sample filters above them
      narrow it to a subset of the design.
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: cr-pk-card-count
    index: cr-pk-card-count
    section: SEACR peak yield
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/peaks
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Regions in view
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cr-pk-card-width
    index: cr-pk-card-width
    section: SEACR peak yield
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/peaks
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: width
    column_type: int64
    display: {icon_name: 'mdi:ruler', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Region width
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cr-pk-card-signal
    index: cr-pk-card-signal
    section: SEACR peak yield
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/peaks
    aggregation: sum
    column_name: total_signal
    column_type: float64
    secondary_layout: histogram
    display: {icon_name: 'mdi:waves', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Total coverage in regions
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cr-pk-card-density
    index: cr-pk-card-density
    section: SEACR peak yield
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/peaks
    aggregation: average
    column_name: signal_density
    column_type: float64
    secondary_layout: threshold
    threshold_value: 50
    threshold_direction: min
    threshold_warn: 25
    display: {icon_name: 'mdi:chart-line', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Coverage per base
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: figure
    tag: cr-pk-fig-signal
    index: cr-pk-fig-signal
    section: SEACR peak yield
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/peaks
    mode: code
    visu_type: scatter
    code_content: |
      # total against maximum coverage for the strongest regions in view; the
      # full frame is ~430k regions, far more than a scatter can show
      df_modified = (
          df.sort("total_signal", descending=True)
          .head(2000)
          .with_columns(pl.col("width").clip(100, 5000).alias("region_width"))
      )

      fig = px.scatter(
          df_modified.to_pandas(),
          x="total_signal",
          y="max_signal",
          color="sample",
          size="region_width",
          size_max=18,
          hover_name="peak_id",
          custom_data=["peak_id"],
          log_x=True,
          log_y=True,
          opacity=0.7,
      )
      fig.update_layout(
          xaxis_title="Total fragment coverage (log)",
          yaxis_title="Maximum coverage (log)",
          legend_title_text="Sample",
          margin={"t": 24, "l": 64, "r": 16, "b": 48},
      )
    selection_enabled: true
    selection_column: peak_id
    title: Total against maximum coverage
    description: The 2000 strongest regions in view; point size is the region width. Lasso to select regions.
    title_size: h3
    layout: {x: 0, y: 4, w: 4, h: 6}
  - component_type: figure
    tag: cr-pk-fig-width
    section: SEACR peak yield
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/seacr_width_hist
    visu_type: histogram
    dict_kwargs: {x: width, color: sample, nbins: 60}
    title: SEACR region width
    description: How wide the calls are, per sample. A broad mark gives far wider regions than a sharp one.
    title_size: h3
    layout: {x: 4, y: 4, w: 4, h: 6}

  # ------------------------------------------------------------ signal budget
  - component_type: text
    tag: cr-pk-frip-intro
    section: Signal budget
    title: How much of the library the peaks hold
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The fraction of reads in peaks is the signal-to-noise number of a
      chromatin experiment. SEACR reports no read count, so it is built in base
      pairs of fragment coverage: the summed region signal, de-scaled by the
      spike-in factor the pipeline applied to the bedGraph, over the total the
      fragment-length histogram accounts for. The donut is that split for the
      libraries in view.
    workflow_tag: cutandrun
    data_collection_tag: frip
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: cr-pk-card-frip-comp
    index: cr-pk-card-frip-comp
    section: Signal budget
    workflow_tag: cutandrun
    data_collection_tag: frip
    use: cutandrun/frip
    aggregation: sum
    column_name: coverage_bp
    column_type: float64
    secondary_layout: donut
    breakdown_col: signal_class
    display: {icon_name: 'mdi:chart-donut', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Coverage in peaks
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cr-pk-card-frip-spread
    index: cr-pk-card-frip-spread
    section: Signal budget
    workflow_tag: cutandrun
    data_collection_tag: frip
    use: cutandrun/frip
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: frip
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: FRiP across samples
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cr-pk-card-frip-worst
    index: cr-pk-card-frip-worst
    section: Signal budget
    workflow_tag: cutandrun
    data_collection_tag: frip
    use: cutandrun/frip
    aggregation: min
    column_name: fraction
    column_type: float64
    secondary_layout: gauge
    coverage_max: 1
    display: {icon_name: 'mdi:alert-outline', icon_color: '#D81B60', title_color: '#D81B60', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Weakest split
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cr-pk-card-frip-peaks
    index: cr-pk-card-frip-peaks
    section: Signal budget
    workflow_tag: cutandrun
    data_collection_tag: frip
    use: cutandrun/frip
    aggregation: max
    column_name: n_peaks
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 4
    display: {icon_name: 'mdi:counter', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Regions per sample
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: figure
    tag: cr-pk-fig-frip
    section: Signal budget
    workflow_tag: cutandrun
    data_collection_tag: frip
    use: cutandrun/frip_composition_bar
    visu_type: bar
    dict_kwargs: {x: sample, y: fraction, color: signal_class, barmode: stack}
    title: Fragment coverage inside and outside peaks
    description: Each library's coverage split in two. A library whose peaks hold little of it either failed or was called too strictly.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 6}
  - component_type: table
    tag: cr-pk-table-frip
    section: Signal budget
    workflow_tag: cutandrun
    data_collection_tag: frip
    use: cutandrun/frip
    row_selection_enabled: false
    title: Signal budget
    description: Two rows per sample, with the coverage in base pairs, the fraction and the spike-in factor divided out of it.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 10, w: 8, h: 3}

  # ------------------------------------------------------------ peak locus
  # Navigator + three tracks that follow it. Default region: chr9 from the 3'
  # end of ABL1 to PLPP7, where every track of the megatest has data (both
  # marks called there by both callers, and the fragment windows of the
  # strongest regions of all four samples sit inside it).
  - component_type: text
    tag: cr-pk-genome-intro
    section: Peak calls locus
    title: One region, four tracks
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The tab opens on chr9:130,850,000-131,350,000, from the end of ABL1 to
      PLPP7. H3K4me3 sits as two sharp calls on the NUP214 and FAM78A
      promoters while H3K27me3 blankets LAMC3 and FIBCD1; the fragment
      pile-up under the navigator shows the fragments behind both, and the
      MACS2 and consensus tracks say which calls the second caller and the
      replicates reproduce, over the hg38 genes. Type a locus in the
      navigator header, or brush its axis, and every track moves with it.
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: cr-pk-av-track
    index: cr-pk-av-track
    section: Peak calls locus
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/seacr_peak_track
    config:
      controls_placement: header
      # `rect` needs an end column, which the role binding supplies: a SEACR
      # call is an interval, not a point at its summit.
      mark: rect
      score_title: log10 total coverage
      opacity: 0.8
      category_col: sample
      # No `assembly` here, on purpose: SEACR also calls regions on the alt
      # and unplaced contigs (chr17_GL000205v2_random, chrUn_...), which the
      # hg38 contig table does not know, and GenomeSpy refuses the whole spec
      # on the first unknown contig. The axis is derived from the rows; the
      # gene lane rides the consensus track below, whose rows reach it
      # already narrowed to the region.
      default_region: "chr9:130,850,000-131,350,000"
      region_filter_enabled: true
      selection_enabled: true
      selection_column: peak_id
    title: SEACR regions
    description: Every SEACR region of every sample as the interval it is; height is log10 of the total fragment coverage. The locus field and a brush on this axis move every track below.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 4}
  - component_type: advanced_viz
    tag: cr-pk-av-frags-track
    index: cr-pk-av-frags-track
    section: Peak calls locus
    workflow_tag: cutandrun
    data_collection_tag: seacr_frags_profile
    use: seacr/frags_pileup_track
    config:
      controls_placement: header
      view: track
      views: [track, locus]
      mark: rect
      color_by: sample
      facet_by_sample: true
      smoothing_window: 0
      show_annotation_lane: false
      locus_annotation: hg38
      locus_assembly: hg38
    title: Fragment pile-up
    description: Fragments per million in 100 bp bins, one lane per sample, drawn on a 6 kb window around each sample's 500 strongest SEACR regions; the gaps between windows are not measured, not empty.
    title_size: h3
    layout: {x: 0, y: 6, w: 8, h: 4}
  - component_type: advanced_viz
    tag: cr-pk-av-macs-locus
    index: cr-pk-av-macs-locus
    section: Peak calls locus
    workflow_tag: cutandrun
    data_collection_tag: macs2_peaks
    use: macs2/peak_genome_view
    config:
      mark: rect
      score_title: -log10 q-value
      category_col: sample
      assembly: hg38
      region_filter_enabled: false
      follow_region_filter: true
    title: MACS2 calls on the region
    description: The MACS2 narrow peaks of the same region, coloured by sample; a SEACR region with no MACS2 call under it is one only the coverage threshold saw.
    title_size: h3
    layout: {x: 0, y: 10, w: 8, h: 3}
  - component_type: advanced_viz
    tag: cr-pk-av-consensus-locus
    index: cr-pk-av-consensus-locus
    section: Peak calls locus
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/seacr_consensus_track
    config:
      mark: rect
      score_title: max coverage
      annotation: hg38
      assembly: hg38
      region_filter_enabled: false
      follow_region_filter: true
    title: Consensus intervals and genes
    description: The merged SEACR intervals per target, coloured by target, over the hg38 gene lane; an interval here is one the replicates of that mark agree on.
    title_size: h3
    layout: {x: 0, y: 13, w: 8, h: 4}

  # -------------------------------------------------------- macs2 alongside
  - component_type: text
    tag: cr-pk-macs-intro
    section: MACS2 alongside
    title: The same fragments, a different model
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [MACS2](https://github.com/macs3-project/MACS) fits a background model
      against the IgG control and reports a fold enrichment and a q-value,
      which SEACR does not. One sample here has zero MACS2 peaks, and that is
      a result rather than a gap.
    workflow_tag: cutandrun
    data_collection_tag: macs2_peaks
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: cr-pk-macs-card-count
    index: cr-pk-macs-card-count
    section: MACS2 alongside
    workflow_tag: cutandrun
    data_collection_tag: macs2_peaks
    use: macs2/peaks
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: MACS2 peaks
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cr-pk-macs-card-width
    index: cr-pk-macs-card-width
    section: MACS2 alongside
    workflow_tag: cutandrun
    data_collection_tag: macs2_peaks
    use: macs2/peaks
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: width
    column_type: int64
    display: {icon_name: 'mdi:ruler', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: MACS2 peak width
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cr-pk-macs-card-fold
    index: cr-pk-macs-card-fold
    section: MACS2 alongside
    workflow_tag: cutandrun
    data_collection_tag: macs2_peaks
    use: macs2/peaks
    aggregation: average
    column_name: fold_enrichment
    column_type: float64
    secondary_layout: histogram
    display: {icon_name: 'mdi:chart-bar', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Fold enrichment
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cr-pk-macs-card-q
    index: cr-pk-macs-card-q
    section: MACS2 alongside
    workflow_tag: cutandrun
    data_collection_tag: macs2_peaks
    use: macs2/peaks
    aggregation: max
    column_name: neg_log10_qvalue
    column_type: float64
    secondary_layout: threshold
    threshold_value: 10
    threshold_direction: min
    threshold_warn: 5
    display: {icon_name: 'mdi:check-decagram', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Best q-value
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: cr-pk-av-macs-manhattan
    index: cr-pk-av-macs-manhattan
    section: MACS2 alongside
    workflow_tag: cutandrun
    data_collection_tag: macs2_peaks
    use: macs2/peak_significance
    config:
      feature_col: peak_id
      score_kind: "-log10(q)"
      color_by_columns: [sample]
      default_color_by: sample
      selection_enabled: true
      selection_column: peak_id
      top_n_labels: 10
    title: MACS2 significance along the genome
    description: Every MACS2 peak at its summit; height is -log10 of the q-value. A sample with no peaks contributes nothing here.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 7}

  # ------------------------------------------------------------ peak tables
  - component_type: text
    tag: cr-pk-tables-intro
    section: Peak tables
    title: The peak rows
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Both callers' rows, filtered by everything above. Ticking a row selects
