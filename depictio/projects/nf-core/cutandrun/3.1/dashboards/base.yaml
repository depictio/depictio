  # ------------------------------------------------------ signal on genome
  - component_type: text
    tag: cr-pk-genome-intro
    section: Signal along the genome
    title: Where the signal is
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [SEACR](https://github.com/FredHutch/SEACR) reports no p-value, so the
      track height is the coverage the region carries. Lasso points on the
      scatter below to keep only those regions in the tables at the bottom of
      this tab.
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: cr-pk-av-manhattan
    index: cr-pk-av-manhattan
    section: Signal along the genome
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/seacr_peak_signal
    config:
      feature_col: peak_id
      score_kind: "log10(signal)"
      color_by_columns: [sample]
      default_color_by: sample
      selection_enabled: true
      selection_column: peak_id
      top_n_labels: 10
    title: SEACR signal along the genome
    description: Every region at its maximum-signal position; height is log10 of the total fragment coverage, colour is the sample.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 7}
  - component_type: figure
    tag: cr-pk-fig-signal
    index: cr-pk-fig-signal
    section: Signal along the genome
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/peaks
    mode: code
    visu_type: scatter
    code_content: |
      # total against maximum coverage for the strongest regions in view; the
      # full frame is ~430k regions, far more than a scatter can show
      df_modified = (
          df.sort("total_signal", descending=True)
          .head(2000)
          .with_columns(pl.col("width").clip(100, 5000).alias("region_width"))
      )

      fig = px.scatter(
          df_modified.to_pandas(),
          x="total_signal",
          y="max_signal",
          color="sample",
          size="region_width",
          size_max=18,
          hover_name="peak_id",
          custom_data=["peak_id"],
          log_x=True,
          log_y=True,
          opacity=0.7,
      )
      fig.update_layout(
          xaxis_title="Total fragment coverage (log)",
          yaxis_title="Maximum coverage (log)",
          legend_title_text="Sample",
          margin={"t": 24, "l": 64, "r": 16, "b": 48},
      )
    selection_enabled: true
    selection_column: peak_id
    title: Total against maximum coverage
    description: The 2000 strongest regions in view; point size is the region width. Lasso to select regions.
    title_size: h3
    layout: {x: 0, y: 8, w: 4, h: 6}
  - component_type: figure
    tag: cr-pk-fig-width
    section: Signal along the genome
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/seacr_width_hist
    visu_type: histogram
    dict_kwargs: {x: width, color: sample, nbins: 60}
    title: SEACR region width
    description: How wide the calls are, per sample. A broad mark gives far wider regions than a sharp one.
    title_size: h3
    layout: {x: 4, y: 8, w: 4, h: 6}

  # -------------------------------------------------------- macs2 alongside
  - component_type: text
    tag: cr-pk-macs-intro
