- title: Caller agreement
  subtitle: Do SEACR and MACS2 call the same peaks on each sample?
  tab_group: Agreement
  tab_order: 5
  tab_icon: mdi:scale-balance
  tab_icon_color: red
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Caller filters
    icon: mdi:filter-variant
    color: red
    description: Which caller, and how much agreement, to keep in view
  grid_sections:
  - name: Agreement at a glance
    icon: mdi:counter
    color: red
    description: Yield, width and overlap of the two callers over the samples in view
  - name: Caller against caller
    icon: mdi:chart-scatter-plot
    color: red
    description: Every sample as a point, then the calls only one caller made
  - name: MACS2 along the genome
    icon: mdi:chart-bar
    color: red
    description: Every MACS2 peak at its summit, its height the significance
  - name: Comparison table
    icon: mdi:table
    color: gray
    description: The per-sample, per-caller rows behind the tiles above
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      SEACR thresholds the coverage landscape against the IgG control;
      [MACS2](https://github.com/macs3-project/MACS) fits a background model and reports a
      fold enrichment and a q-value. Neither is a subset of the other: a point far off the
      dotted line is a sample the callers see differently, and a sample with no MACS2 peaks
      is a result rather than a gap.
    tag: cr-ca-intro
    index: ca-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: caller_agreement
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:scale-balance
      custom_color: red
    section: Caller filters
    group: Callers
    tag: cr-ca-filter-caller
    index: cr-ca-caller-filter
    title: Caller
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: caller_agreement
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: frac_shared
    column_type: float64
    display:
      icon_name: mdi:set-merge
      custom_color: pink
    section: Caller filters
    group: Callers
    tag: cr-ca-filter-shared
    index: cr-ca-shared-range
    title: Share reproduced
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: caller_agreement
    use: cutandrun/caller_agreement
    aggregation: sum
    column_name: n_peaks
    column_type: int64
    secondary_layout: donut
    breakdown_col: caller
    top_n_count: 2
    display:
      icon_name: mdi:counter
      icon_color: red
      caption: peaks, by caller
    section: Agreement at a glance
    tag: cr-ca-card-peaks
    index: ca-card-peaks
    title: Peaks called
    description: Peaks both callers called over the samples in view, split by caller.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: caller_agreement
    use: cutandrun/caller_agreement
    aggregation: median
    column_name: median_width
    column_type: float64
    secondary_layout: top_n
    breakdown_col: caller
    top_n_count: 2
    display:
      icon_name: mdi:ruler
      icon_color: violet
      caption: median width, by caller
      decimals: 0
    section: Agreement at a glance
    tag: cr-ca-card-width
    index: ca-card-width
    title: Peak width (bp)
    description: Median of the samples' median peak widths; SEACR regions run wider than MACS2 peaks.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: caller_agreement
    use: cutandrun/caller_agreement
    aggregation: median
    column_name: frac_shared
    column_type: float64
    filter_expr: (col('n_peaks') > 0) & (col('n_peaks_other') > 0)
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:alert-outline
      icon_color: pink
      caption: median, with its spread
      format: percent
    section: Agreement at a glance
    tag: cr-ca-card-shared
    index: ca-card-shared
    title: Share reproduced
    description: The share of one caller's peaks the other caller also called, per sample and caller, where both called something; the low whisker is the worst agreement.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: caller_agreement
    use: cutandrun/caller_agreement
    aggregation: sum
    column_name: n_unique
    column_type: int64
    secondary_layout: composition
    breakdown_col: target
    display:
      icon_name: mdi:shape-outline
      icon_color: grape
      caption: calls, by target
    section: Agreement at a glance
    tag: cr-ca-card-unique
    index: ca-card-unique
    title: Calls only one made
    description: Peaks one caller called and the other did not reproduce, summed over samples and callers.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Colours by target, the run's grouping: the pieces of the group kwargs, not
  # the spread, because the pivot consumes the caller and rebuilds the frame.
  - component_type: figure
    workflow_tag: cutandrun
    data_collection_tag: caller_agreement
    use: cutandrun/caller_peak_scatter
    mode: code
    visu_type: scatter
    code_content: |-
      # The two callers on the two axes, one point per sample, sized by the share
      # of calls they share; the dotted line marks equal yields. Coloured by target,
      # or by Analysis mode's groups when it has some (not `caller`: the pivot
      # consumes it).
      grp = depictio_group_by[0] if depictio_group_by else 'target'
      if grp == 'caller' or grp not in df.columns:
          grp = 'target'
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get('target') or {}
      index_cols = ['sample', 'target'] if grp == 'target' else ['sample', 'target', grp]
      wide = df.pivot(on='caller', index=index_cols, values='n_peaks')
      for caller in ('macs2', 'seacr'):
          if caller not in wide.columns:
              wide = wide.with_columns(pl.lit(0).alias(caller))
      shared = df.group_by('sample').agg((100 * pl.col('frac_shared').mean()).round(1).alias('agreement_pct'))
      wide = wide.join(shared, on='sample', how='left').fill_null(0)
      fig = px.scatter(wide.to_pandas(), x='macs2', y='seacr', color=grp, color_discrete_map=colors, size='agreement_pct', size_max=26, hover_name='sample', custom_data=['sample'], labels={'macs2': 'MACS2 peaks', 'seacr': 'SEACR regions', grp: ''})
      limit = max(1, int(max(wide['macs2'].max() or 0, wide['seacr'].max() or 0)))
      fig.add_shape(type='line', x0=0, y0=0, x1=limit, y1=limit, line={'dash': 'dot', 'width': 1})
      fig.update_layout(margin=dict(t=10))
    selection_enabled: true
    selection_column: sample
    section: Caller against caller
    tag: cr-ca-fig-scatter
    index: ca-caller-scatter
    title: MACS2 against SEACR, per sample
    description: >-
      Do the two callers find as many peaks? Each point is one sample, in the colour of its target: the
      peaks MACS2 called (x) against the regions SEACR called (y), with the marker size set by the mean
      share of calls the two callers have in common.

      How to read: a point on the dotted line means equal yields, and one far above it is a sample SEACR
      sees as richer than MACS2. A point on the y axis is a sample with no MACS2 peaks, which is a
      result rather than a gap. A large marker means the callers agree on where the calls are, a small
      one that they call different places.

      Lines and annotations: the dotted line is the diagonal x = y, from 0 to the larger of the two
      largest counts. It is a display aid for equal yields, not a cut-off.

      Note: a caller that called nothing counts as an agreement of 0, which lowers the mean share of the
      sample. A call is shared when it overlaps at least one call of the other caller on the same
      chromosome, so overlap is counted and not measured in bases.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: cutandrun
    data_collection_tag: caller_agreement
    use: cutandrun/caller_unique_bar
    visu_type: bar
    dict_kwargs:
      x: sample
      y: n_unique
      color: caller
      barmode: group
      labels: {sample: '', n_unique: Calls the other caller missed, caller: Caller}
    section: Caller against caller
    tag: cr-ca-fig-unique
    index: ca-unique-bar
    title: Calls the other caller did not make
    description: >-
      What does each caller find that the other misses? Two bars per sample, one per caller, in the
      caller's colour: the number of its peaks that overlap no peak of the other caller on the same
      chromosome.

      How to read: two similar bars mean the callers disagree equally often, and a tall bar for one
      caller means it calls places the other never sees. When a caller called nothing for a sample, every
      call of the other caller counts as unique.

      Annotations: no reference line or cut-off is drawn.

      Note: neither caller is a subset of the other, so a count of unique calls is a difference between
      methods and not an error rate. SEACR thresholds the coverage against the IgG control, while MACS2
      fits a background model.

      Source: SEACR documentation, https://github.com/FredHutch/SEACR
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: advanced_viz
    workflow_tag: cutandrun
    data_collection_tag: macs2_peaks
    use: macs2/peak_significance
    config:
      feature_col: peak_id
      score_kind: "-log10(q)"
      color_by_columns: [sample]
      default_color_by: sample
      selection_enabled: true
      selection_column: peak_id
      # Peak ids say nothing as point labels; they piled up over the tallest calls.
      top_n_labels: 0
    section: MACS2 along the genome
    tag: cr-ca-av-macs-manhattan
    index: ca-macs-manhattan
    title: MACS2 significance along the genome
    description: >-
      Where along the genome are the MACS2 peaks, and how significant? Each point is one MACS2 peak at
      its summit, placed by chromosome and position (x) and by its -log10 q-value (y), in the colour of
      its sample.

      How to read: a tall point is a peak MACS2 is more confident about, and a stretch of a chromosome
      with no point has no call. A sample with no MACS2 peaks contributes nothing here.

      Annotations: no threshold line is drawn and no peak is labelled.

      Note: MACS2 reports only peaks below its q-value cut-off, 0.01 by default in the pipeline, which is
      -log10 q of 2, so no point sits under that height.

      Source: nf-core/cutandrun parameters (macs2_qvalue), https://nf-co.re/cutandrun/3.2.2/parameters
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: cutandrun
    data_collection_tag: caller_agreement
    use: cutandrun/caller_agreement
    row_selection_enabled: true
    row_selection_column: sample
    section: Comparison table
    tag: cr-ca-table
    index: ca-table
    title: Caller comparison
    description: >-
      The numbers behind the caller tiles. One row per sample and caller, with the peaks called, the
      bases they cover, the median and maximum width, the peaks shared with the other caller and the
      peaks unique to it.

      How to read: a caller that called nothing for a sample keeps a row with 0 peaks, so a null result
      stays visible. Compare the shared fraction of the two callers on the same sample to see which one
      the other reproduces.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Consensus
  subtitle: Which peaks do a target's replicates reproduce?
  tab_group: Agreement
  tab_order: 6
  tab_icon: mdi:set-merge
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Consensus filters
    icon: mdi:filter-variant
    color: grape
    description: Replicate support, interval width and member count to keep in view
  grid_sections:
  - name: Consensus at a glance
    icon: mdi:counter
    color: grape
    description: How large each target's merged set is, and how much of it replicates
  - name: Replicate agreement
    icon: mdi:set-merge
    color: grape
    description: Which combinations of replicates call each consensus interval
  - name: How reproducible
    icon: mdi:chart-bar
    color: grape
    description: The reproducible share per target, and how width tracks support
  - name: Consensus table
    icon: mdi:table
    color: gray
    description: The merged intervals behind the tiles above
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      The pipeline merges the SEACR calls of one target's replicates with
      [bedtools merge](https://bedtools.readthedocs.io) and records which replicates
      contributed to each interval. An interval only one replicate found is the weaker half
      of the set; the Replicate support filter keeps every value until you narrow it.
    tag: cr-cons-intro
    index: cons-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    interactive_component_type: MultiSelect
    column_name: support
    column_type: object
    display:
      icon_name: mdi:relation-many-to-many
      custom_color: grape
    section: Consensus filters
    group: Consensus
    tag: cr-cons-filter-support
    index: cr-cons-support-filter
    title: Replicate support
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: width
    column_type: int64
    display:
      icon_name: mdi:ruler
      custom_color: violet
    section: Consensus filters
    group: Consensus
    tag: cr-cons-filter-width
    index: cr-cons-width-range
    title: Interval width
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: num_peaks
    column_type: int64
    display:
      icon_name: mdi:counter
      custom_color: indigo
    section: Consensus filters
    group: Consensus
    tag: cr-cons-filter-members
    index: cr-cons-members-range
    title: Member peaks
    layout: {x: 0, y: 6, w: 1, h: 3}
  # A count over rows that are the intervals, split by their replicate support.
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/consensus_peaks
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: donut
    breakdown_col: support
    top_n_count: 4
    display:
      icon_name: mdi:set-merge
      icon_color: grape
      caption: by the replicates that call them
    section: Consensus at a glance
    tag: cr-cons-card-count
    index: cons-card-count
    title: Consensus intervals
    description: Merged intervals of every target in view, split by how many replicates called each.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/consensus_peaks
    aggregation: count
    column_name: peak_id
    column_type: object
    filter_expr: col('num_samples') >= 2
    secondary_layout: top_n
    breakdown_col: target
    top_n_count: 3
    display:
      icon_name: mdi:check-decagram
      icon_color: teal
      caption: two replicates or more, by target
    section: Consensus at a glance
    tag: cr-cons-card-reproducible
    index: cons-card-reproducible
    title: Reproducible intervals
    description: Consensus intervals at least two replicates called, ranked by target.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/consensus_peaks
    aggregation: median
    column_name: width
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: violet
      caption: median per interval, with its spread
      decimals: 0
    section: Consensus at a glance
    tag: cr-cons-card-width
    index: cons-card-width
    title: Interval width (bp)
    description: Median width of the merged intervals.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/consensus_peaks
    aggregation: median
    column_name: total_signal
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:waves
      icon_color: cyan
      caption: median per interval, with its distribution
      decimals: 0
    section: Consensus at a glance
    tag: cr-cons-card-signal
    index: cons-card-signal
    title: Coverage per interval
    description: Median summed coverage of the member peaks of an interval.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/seacr_consensus_upset
    config:
      # Every replicate column of the run: the pipeline names samples
      # <group>_R<replicate>.
      set_columns_pattern: '_R\d+$'
      color_intersections_by: degree
      show_set_sizes: true
      show_values: true
      sort_by: cardinality
      sort_order: descending
      min_size: 1
    section: Replicate agreement
    tag: cr-cons-av-upset
    index: cons-upset
    title: Consensus interval overlap
    description: >-
      Which replicates call the same intervals? An UpSet plot: each column of dots is one combination of
      replicates, its bar is the number of consensus intervals called by exactly that combination, and
      the combinations are sorted from the largest down. The bars are coloured by the number of
      replicates in the combination, and the set sizes at the side give the intervals each replicate
      called.

      How to read: a tall bar for the combination of all replicates of a target means the replicates
      agree. Tall bars for single replicates mean the intervals are not reproduced, and a replicate
      whose single bar dwarfs its overlaps is the one that disagrees.

      Lines and annotations: the number at the top of each bar is its interval count. No cut-off is
      drawn, and combinations with no interval are left out.

      Source: nf-core/cutandrun output documentation, which merges the peaks of the replicates of a
      group with bedtools merge to build the consensus set, https://nf-co.re/cutandrun/3.2.2/docs/output
    layout: {x: 0, y: 0, w: 8, h: 5}
  # Colours by replicate support, a column of its own, so it spreads no group
  # kwargs: the frame is per target, not per sample.
  - component_type: figure
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/consensus_peaks
    mode: code
    visu_type: bar
    code_content: |-
      # Share of each target's consensus set by replicate support; the bar labels
      # are interval counts.
      d = df.group_by(['target', 'support']).agg(pl.len().alias('n_intervals'))
      d = d.with_columns((100 * pl.col('n_intervals') / pl.col('n_intervals').sum().over('target')).round(1).alias('pct')).sort(['target', 'support'])
      fig = px.bar(d.to_pandas(), x='target', y='pct', color='support', text='n_intervals', color_discrete_map=depictio_category_colors.get('support') or {}, labels={'target': '', 'pct': 'Share of consensus intervals (%)', 'support': 'Replicates'})
      fig.update_layout(barmode='stack', margin=dict(t=10))
    section: How reproducible
    tag: cr-cons-fig-repro
    index: cons-repro-share
    title: Reproducible share per target
    description: >-
      How reproducible is each target? One stacked bar per target: the share of its consensus intervals
      called by one, two or more replicates, each support level in its own colour, with the interval
      count printed on the segment.

      How to read: the larger the segments for two or more replicates, the more of the target's peaks its
      replicates reproduce. A bar made mostly of intervals called by a single replicate is a target whose
      replicates disagree, or one with a single replicate.

      Annotations: no reference line or cut-off is drawn.

      Note: the pipeline keeps every merged interval by default, because its minimum replicate support is
      1, so a single-replicate interval is not an error.

      Sources: nf-core/cutandrun parameters (replicate_threshold),
      https://nf-co.re/cutandrun/3.2.2/parameters; bedtools merge,
      https://bedtools.readthedocs.io/en/latest/content/tools/merge.html
    layout: {x: 0, y: 0, w: 4, h: 4, fit: auto}
  - component_type: figure
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/seacr_consensus_width_hist
    visu_type: histogram
    dict_kwargs:
      x: width
      color: support
      nbins: 60
      log_x: true
      labels: {width: Interval width (bp), support: Replicates}
    section: How reproducible
    tag: cr-cons-fig-width
    index: cons-width-hist
    title: Interval width by replicate support
    description: >-
      Do widely supported intervals differ in width? A histogram of the consensus interval widths in bp
      on a log x axis, in 60 bins, coloured by the number of replicates that called each interval.

      How to read: a merged interval widens as the peaks of more replicates join it, so an interval
      called by several replicates can be wider than a single-replicate one. A very wide interval can be
      several neighbouring peaks merged into one.

      Annotations: no reference line or cut-off is drawn.

      Source: bedtools merge, which combines overlapping or book-ended features into one,
      https://bedtools.readthedocs.io/en/latest/content/tools/merge.html
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: table
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/consensus_peaks
    row_selection_enabled: true
    row_selection_column: peak_id
    section: Consensus table
    tag: cr-cons-table
    index: cons-table
    title: Consensus intervals
    description: >-
      Every merged interval. One row per consensus interval, with its target, coordinates, width, the
      number of member peaks merged into it, the replicates that called it (its support), and the
      summed and maximum signal of its members.

      How to read: sort by support to list the intervals every replicate found, or filter to a support
      of 1 to see the ones a single replicate called. The member peak count can exceed the support when
      one replicate contributed several peaks.

      Source: bedtools merge, https://bedtools.readthedocs.io/en/latest/content/tools/merge.html
    layout: {x: 0, y: 0, w: 8, h: 6}
# One region, one x axis. The SEACR navigator drives the cards through the
# region links in template.yaml (seacr_peaks -> macs2_peaks,
# seacr_consensus_peaks), and the genome browser under it follows its brush:
# the browser's bigWigs carry the signal at the region, so no fragment pile-up
# track repeats it here (the Fragments tab keeps the pile-up). A tab of its own
# because those region filters narrow every tile of their collections on the
# tab. The genome axis comes from the `GENOME` template variable (default
# hg38). This is the only browser of the template.
- title: Locus
  subtitle: Do the callers and the replicates agree on one region?
  tab_group: Agreement
  tab_order: 7
  tab_icon: mdi:dna
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Locus filters
    icon: mdi:filter-variant
    color: teal
    description: Coverage, significance and replicate support of the tracks on the region
  grid_sections:
  - name: Region at a glance
    icon: mdi:counter
    color: teal
    description: What the region in view holds, recounted on every brush or locus entry
  - name: Regions on one axis
    icon: mdi:dna
    color: teal
    description: The lanes drive the browser below. A brush or a locus on the lanes moves it, and its view comes back on the lanes as a dashed band, in the colour of the two tiles' link tags.
    # One screen: the lanes and the browser they drive.
    display: linked
  components:
  - component_type: text
    order: 1
    body: >
      The SEACR regions of every sample on one genome axis, with the run's own signal and
      calls in a genome browser under them. The axis opens on the chromosome the browser
      shows, its window as a band: zoom on the regions, brush one, and the browser and
      cards follow.
    tag: cr-loc-intro
    index: loc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: signal_density
    column_type: float64
    display:
      icon_name: mdi:chart-line
      custom_color: cyan
    section: Locus filters
    group: Region
    tag: cr-loc-filter-density
    index: cr-loc-density-range
    title: SEACR coverage per base
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: macs2_peaks
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: neg_log10_qvalue
    column_type: float64
    display:
      icon_name: mdi:check-decagram
      custom_color: orange
    section: Locus filters
    group: Region
    tag: cr-loc-filter-qvalue
    index: cr-loc-qvalue-range
    title: MACS2 -log10 q-value
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    interactive_component_type: MultiSelect
    column_name: support
    column_type: object
    display:
      icon_name: mdi:relation-many-to-many
      custom_color: grape
    section: Locus filters
    group: Region
    tag: cr-loc-filter-support
    index: cr-loc-support-filter
    title: Replicate support
    layout: {x: 0, y: 6, w: 1, h: 3}
  # The four cards follow the navigator's region, as the tracks do.
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/peaks
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: composition
    breakdown_col: sample
    follow_region_filter: true
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: indigo
      caption: SEACR regions, by sample
    section: Region at a glance
    tag: cr-loc-card-regions
    index: loc-card-regions
    title: SEACR regions
    description: SEACR regions inside the region in view.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/peaks
    aggregation: median
    column_name: signal_density
    column_type: float64
    secondary_layout: histogram
    follow_region_filter: true
    display:
      icon_name: mdi:waves
      icon_color: cyan
      caption: median per region, with its distribution
      decimals: 1
    section: Region at a glance
    tag: cr-loc-card-density
    index: loc-card-density
    title: Coverage per base
    description: Median coverage per base of the SEACR regions inside the region in view.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: macs2_peaks
    use: macs2/peaks
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: composition
    breakdown_col: sample
    follow_region_filter: true
    display:
      icon_name: mdi:counter
      icon_color: orange
      caption: MACS2 peaks, by sample
    section: Region at a glance
    tag: cr-loc-card-macs
    index: loc-card-macs
    title: MACS2 peaks
    description: MACS2 peaks inside the region in view.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_consensus_peaks
    use: seacr/consensus_peaks
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: donut
    breakdown_col: support
    top_n_count: 4
    follow_region_filter: true
    display:
      icon_name: mdi:set-merge
      icon_color: grape
      caption: by the replicates that call them
    section: Region at a glance
    tag: cr-loc-card-consensus
    index: loc-card-consensus
    title: Consensus intervals
    description: Consensus intervals inside the region in view, split by replicate support.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/seacr_peak_track
    config:
      assembly: "{GENOME}"
      # Bars, not level rects: a rect is a 2 px segment at the score and
      # vanishes at chromosome scale, a bar rises from the baseline and keeps
      # a minimum width.
      mark: bar
      lane_height: 56
      score_title: log10 total coverage
      opacity: 0.8
      # One lane per sample, each on its own ruler, as the other peak
      # templates: the targets differ by orders of magnitude in coverage.
      sample_col: sample
      facet_by_sample: true
      max_facets: 6
      facet_y_scale: independent
      # No default_region: the browser opens on its own locus, and the axis on
      # the whole chromosome it shows, its window drawn as a band, so the
      # reader sees where the regions are before brushing one.
      open_on_view_window: true
      interaction_mode: select
      region_filter_enabled: true
      selection_enabled: true
      selection_column: peak_id
    section: Regions on one axis
    tag: cr-loc-av-track
    index: loc-seacr-track
    title: SEACR regions per sample
    description: >-
      Where are the SEACR regions along the genome? Every region of a sample is drawn as a bar over the
      interval it covers, in one lane per sample (at most six), each lane on its own height scale. The
      height is the log10 of the region's total coverage.

      How to read: the axis opens on the whole chromosome the genome browser shows. Zoom, or brush a
      stretch to select its region, to see which samples have regions there. Regions shared by the
      replicates of a target line up across lanes.

      Annotations: the window of the genome browser is drawn as a band on the axis. No reference line
      or cut-off is drawn, and the heights are not comparable between lanes because each lane has its
      own scale.

      Note: the coverage SEACR reads is already scaled by the pipeline's spike-in factor, so the heights
      rank the regions within a lane.

      Source: SEACR documentation, https://github.com/FredHutch/SEACR
    layout: {x: 0, y: 0, w: 8, h: 6}
  # The run's own files in a genome browser: bigWig signal per sample, the SEACR
  # and MACS2 calls of the targets and the BAMs. The sample filter of the left
  # panel (persistent across tabs) picks which tracks are open; clicking a
  # signal track picks its sample back for every other tab.
  - component_type: jbrowse
    tag: cr-loc-browser
    index: loc-browser
    section: Regions on one axis
    workflow_tag: cutandrun
    data_collection_tag: tracks
    title: Genome browser
    description: >-
      What does the run's own signal look like at a locus? A JBrowse 2 view of the files the run
      published: the bigWig signal of each sample, the SEACR and MACS2 peak calls of the targets, and
      the marked-duplicate alignments, in the colour of each target. An ENCODE candidate cis-regulatory
      elements track from UCSC sits beside them.

      How to read: at a region called by SEACR the signal track of a target should rise over the
      control's, with the peak tracks under it marking the calls. Pick the samples in the left panel to
      choose which tracks open (at most 16, with 6 open at first), and brush a region on the lanes
      above to move the view to it.

      Note: the genome is the assembly set by the GENOME variable of the template, and a track the run
      did not publish, such as the alignments, is missing from the list.
    max_tracks: 16
    initial_tracks: 6
    show_overview: false
    # The lanes above already say where the browser is: its locus bar only
    # costs height here, and the tile's menu brings it back.
    show_header: false
    # ENCODE candidate cis-regulatory elements from UCSC, next to the marks.
    ucsc_tracks: [encodeCcreCombined]
    # No selection write-back: a picked track would narrow the regions to one
    # sample and reframe the view. Two sources: the per-sample SEACR regions
    # (one density row per sample) and the consensus intervals per target. A
    # region picked elsewhere narrows seacr_peaks to a handful of rows and the
    # view moves onto it; a brush on the navigator moves it without filtering.
    locus_from:
      - data_collection_tag: seacr_peaks
        name: SEACR
        color: teal
        chrom_column: chr
        start_column: start
        end_column: end
        padding: 2000
        max_rows: 5
        sort_by: max_signal
        descending: true
        label_column: peak_id
        sample_column: sample
        columns: [total_signal, width]
      - data_collection_tag: seacr_consensus_peaks
        name: Consensus
        color: grape
        chrom_column: chr
        start_column: start
        end_column: end
        padding: 2000
        sort_by: num_samples
        descending: true
        label_column: peak_id
        columns: [num_samples, target]
    layout: {x: 0, y: 6, w: 8, h: 7}
