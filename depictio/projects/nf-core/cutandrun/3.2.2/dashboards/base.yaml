  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/peaks
    aggregation: median
    column_name: width
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: violet
      caption: median per region, with its spread
      decimals: 0
    section: Peaks at a glance
    tag: cr-pk-card-width
    index: pk-card-width
    title: Region width (bp)
    description: Median SEACR region width; a broad mark gives far wider regions than a sharp one.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/peaks
    aggregation: median
    column_name: signal_density
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:waves
      icon_color: cyan
      caption: median per region, with its distribution
      decimals: 1
    section: Peaks at a glance
    tag: cr-pk-card-density
    index: pk-card-density
    title: Coverage per base
    description: Median fragment coverage per base inside a SEACR region.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: frip
    use: cutandrun/frip
    aggregation: min
    column_name: frip
    column_type: float64
    filter_expr: col('signal_class') == 'In peaks'
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:target
      icon_color: teal
      caption: the weakest library; the box, every library
      format: percent
    section: Peaks at a glance
    tag: cr-pk-card-frip-min
    index: pk-card-frip-min
    title: Lowest FRiP
    description: The smallest share of a library's fragment coverage inside its own SEACR peaks.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/seacr_width_hist
    visu_type: histogram
    dict_kwargs:
      x: width
      color: sample
      nbins: 60
      log_x: true
      labels: {width: Region width (bp), sample: ''}
    section: Peak shape
    tag: cr-pk-fig-width
    index: pk-width-hist
    title: SEACR region width
    description: >-
      How wide are the regions SEACR called? A histogram of the region widths in bp on a log x axis, in
      60 bins and one colour per sample, with the number of regions on the y axis.

      How to read: a sharp mark gives narrow regions and a broad mark far wider ones, and replicates of
      one target should draw the same shape. A sample whose widths sit apart from its replicates was
      called differently, which its depth or its control can explain.

      Annotations: no reference line or cut-off is drawn.

      Note: the regions come from the SEACR mode the run used, stringent by default in the pipeline,
      which sets how many and how wide they are.

      Sources: SEACR documentation, https://github.com/FredHutch/SEACR; nf-core/cutandrun parameters,
      https://nf-co.re/cutandrun/3.2.2/parameters
    layout: {x: 0, y: 0, w: 4, h: 4}
  # Colours by target, as the fragment ladder does: the pieces of the group
  # kwargs, never the spread, since the curves group by sample.
  - component_type: figure
    workflow_tag: cutandrun
    data_collection_tag: seacr_frags_profile
    use: seacr/frags_profile
    mode: code
    visu_type: line
    code_content: |-
      # Mean fragments per million at each offset from the summit, one curve per
      # sample, coloured by its target or by Analysis mode's groups when it has some.
      grp = depictio_group_by[0] if depictio_group_by else 'target'
      if grp not in df.columns:
          grp = 'sample'
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get('target') or {}
      keys = ['sample'] if grp == 'sample' else ['sample', grp]
      d = df.group_by([*keys, 'offset_bp']).agg(pl.col('cpm').mean().alias('mean_cpm')).sort(['sample', 'offset_bp'])
      fig = px.line(d.to_pandas(), x='offset_bp', y='mean_cpm', color=grp, line_group='sample', color_discrete_map=colors, hover_name='sample', labels={'offset_bp': 'Offset from the summit (bp)', 'mean_cpm': 'Mean fragments per million', grp: ''})
      fig.add_vline(x=0, line_dash='dot')
      fig.update_layout(margin=dict(t=10))
    section: Peak shape
    tag: cr-pk-fig-profile
    index: pk-pileup-profile
    title: Mean pile-up per sample
    description: >-
      How do fragments pile up on a typical peak? One curve per sample, in the colour of its target: the
      mean fragments per million at each offset from the region summit, over the strongest SEACR
      regions of the sample, in 100 bp bins across a 6 kb window.

      How to read: a sample that worked rises to a peak at the summit and falls back to the flanks. The
      replicates of one target should overlap, and the height gap between targets is the gap in
      enrichment; a flat curve means the regions have no pile-up.

      Lines and annotations: the dotted vertical line at offset 0 is the summit, the midpoint of the
      sub-interval where SEACR's coverage reached its maximum in the region.

      Note: only each sample's 500 strongest SEACR regions enter, keeping those more than a window apart,
      so the curve describes the best calls and not all of them.

      Source: SEACR documentation, https://github.com/FredHutch/SEACR
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: advanced_viz
    workflow_tag: cutandrun
    data_collection_tag: seacr_frags_profile
    use: seacr/frags_pileup_matrix
    config:
      reference_position: 0
      reference_label: summit
      sort_by: signal
      max_rows: 500
      show_profile: true
    section: Pile-up per region
    tag: cr-pk-av-pileup-matrix
    index: pk-pileup-matrix
    title: Fragment pile-up around the SEACR summits
    description: >-
      Do the regions pile up the same way, one by one? One panel per sample: each row is one SEACR
      region ordered by its signal, each column an offset from the summit, and the colour is the
      fragments per million in that bin. A curve of the mean over the rows sits above each panel.

      How to read: a vertical band of colour at the summit, across the rows, means the regions pile up
      consistently. A panel with no band is a sample without a pile-up, and a band that thins along the
      rows means the weaker regions pile up less.

      Lines and annotations: the vertical line labelled summit marks offset 0, the midpoint of the
      sub-interval where SEACR's coverage reached its maximum. The colour bar gives the fragments per
      million.

      Note: each panel holds at most the 500 strongest SEACR regions of its sample, so weaker calls do
      not appear.

      Source: SEACR documentation, https://github.com/FredHutch/SEACR
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: cutandrun
    data_collection_tag: frip
    use: cutandrun/frip_composition_bar
    visu_type: bar
    dict_kwargs:
      x: sample
      y: fraction
      color: signal_class
      barmode: stack
      labels: {sample: '', fraction: Share of fragment coverage, signal_class: ''}
    section: Signal in peaks
    tag: cr-pk-fig-frip
    index: pk-frip-bar
    title: Fragment coverage inside and outside peaks
    description: >-
      How much of each library's signal is in its peaks? One stacked bar per library: the share of its
      fragment coverage that falls inside its own SEACR regions (In peaks) and outside them (Outside
      peaks), each in a colour kept across the dashboard.

      How to read: a library whose peaks hold little of its coverage either failed or was called too
      strictly, and the replicates of one target should split alike. Open [Fragments](tab:Fragments) and
      the fingerprint to tell a weak library from a strict call.

      Annotations: no reference line or cut-off is drawn.

      Note: SEACR reports no read count, so the share is built in base pairs of coverage, with the peak
      signal divided by the spike-in factor, and is not a read-based FRiP value.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    workflow_tag: cutandrun
    data_collection_tag: seacr_peaks
    use: seacr/peaks
    row_selection_enabled: true
    row_selection_column: peak_id
    section: Peak tables
    tag: cr-pk-table-seacr
    index: pk-table-seacr
    title: SEACR regions
    description: >-
      Every region SEACR called. One row per region, with its coordinates, width, the SEACR mode it
      came from, the total and maximum fragment coverage inside it, and the coverage per base.

      How to read: sort by total signal to find the strongest regions, or by width to find the broadest.
      Total signal is the summed fragment coverage over the region and max signal the highest coverage
      reached inside it.

      Source: SEACR documentation, https://github.com/FredHutch/SEACR
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: cutandrun
    data_collection_tag: macs2_peaks
    use: macs2/peaks
    row_selection_enabled: true
    row_selection_column: peak_id
    section: Peak tables
    tag: cr-pk-table-macs
    index: pk-table-macs
    title: MACS2 peaks
    description: >-
      Every peak MACS2 called. One row per peak, with its coordinates, summit, width, the fold
      enrichment at the summit over the control, and the p-value and q-value MACS2 reported, as
      -log10 values.

      How to read: sort by -log10 q-value or by fold enrichment to rank the peaks. The run keeps only
      the peaks that pass its q-value cut-off, 0.01 by default in the pipeline, so no peak sits below
      it.

      Source: nf-core/cutandrun parameters (macs2_qvalue), https://nf-co.re/cutandrun/3.2.2/parameters
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: table
    workflow_tag: cutandrun
    data_collection_tag: seacr_peak_summary
    use: seacr/peak_summary
    row_selection_enabled: true
    row_selection_column: sample
    section: Peak tables
    tag: cr-pk-table-summary
    index: pk-table-summary
    title: SEACR summary per sample
    description: >-
      One row per sample, summarising its SEACR calls: the number of regions, the bases they cover, and
      the median width, total signal, maximum signal and coverage per base across them.

      How to read: compare the replicates of a target on the same column, and the targets with their IgG
      control. A target that worked has far more coverage in its regions than a control taken through
      the same thresholding.
    layout: {x: 0, y: 12, w: 8, h: 6}
  - component_type: table
    workflow_tag: cutandrun
    data_collection_tag: frip
    use: cutandrun/frip
    row_selection_enabled: true
    row_selection_column: sample
    section: Peak tables
    tag: cr-pk-table-frip
    index: pk-table-frip
    title: Signal budget
    description: >-
      How each library's fragment coverage splits into peaks and background. Two rows per sample, In
      peaks and Outside peaks, with the coverage in base pairs, its fraction of the library, the
      sample's fraction in peaks, and the spike-in factor divided out of the peak signal.

      How to read: the fraction in peaks is repeated on both rows of a sample. A factor of exactly 1 is
      the fallback used when no spike-in factor was available.

      Note: SEACR reports no read count, so the fraction is built in base pairs of coverage and is not a
      read-based FRiP value.
    layout: {x: 0, y: 18, w: 8, h: 6}
