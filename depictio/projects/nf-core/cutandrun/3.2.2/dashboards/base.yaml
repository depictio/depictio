version: 1
# nf-core/cutandrun 3.2.2. Every rule this file follows is written out in
# depictio/projects/nf-core/RULES.md; ampliseq/2.18.0 is the reference.
#
# Funnel: the Overview, then Data & QC (the MultiQC report, then the
# libraries: spike-in, duplication, enrichment over the IgG control), then
# Chromatin signal (the fragment ladder, then the peaks it yields), then
# Agreement (the two callers, the replicates of a target, one region).
#
# The IgG controls are samples, not noise: they carry the MultiQC panels, the
# spike-in factors and the fingerprint that says whether a target is enriched
# at all. Only the peak collections omit them, because no caller ran on one.
#
# The MultiQC report bound here is a MultiQC 1.35 parquet: the pipeline's own
# when the run used MultiQC 1.31 or later, otherwise the one re-generated from
# the run's raw tool outputs (the release pins 1.19, which writes no parquet;
# template.yaml binds one or the other, never both). The tiles bind sections
# both reports carry, except the spike-in Bowtie 2 tile (bowtie2-1), which only
# the pipeline's report has: the import drops it on a re-generated report,
# whose target tile shows both genomes. No Key figure or highlight reads the
# report, so either binding leaves the Overview whole. The run ships no
# params.json either, so `params:` links open the software versions, the only
# provenance it has.
#
# Routes: MACS2 is optional (`--peakcaller seacr`). A run without it loses the
# MACS2 tiles; the caller comparison keeps a row per sample with n_peaks 0. The
# fragment BEDs are optional too, and the pile-up tiles go with them.
main_dashboard:
  title: nf-core/cutandrun
  subtitle: Chromatin profiling, from fragments to the peaks replicates reproduce
  project_tag: CUT&RUN Chromatin Profiling
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab: figures, advanced viz and filter
  # chips colour a value the same way. `target` is the run's grouping (one
  # value per mark, the IgG control included); the others are vocabularies the
  # recipes write.
  category_colors:
    target: auto
    role:
      target: '#2a78d6'
      IgG control: '#868e96'
    caller:
      seacr: '#4a3aa7'
      macs2: '#eb6834'
    fragment_class:
      Sub-nucleosomal: '#2a78d6'
      Mononucleosomal: '#1baf7a'
      Dinucleosomal: '#eda100'
      Multi-nucleosomal: '#e87ba4'
    signal_class:
      In peaks: '#1baf7a'
      Outside peaks: '#adb5bd'
    support: auto
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. Bound
  # to the sample hub, the source of every sample link in template.yaml.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The sample hub behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Samples, below).
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: samples
    use: cutandrun/sample_target_filter
    interactive_component_type: MultiSelect
    column_name: target
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: Target
    section: Key figures
    tag: cr-ov-kf-target
    index: ov-kf-target
    title: Target
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: cr-ov-kf-sample
    index: ov-kf-sample
    title: Sample
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: text
    title: nf-core/cutandrun
    logo: https://raw.githubusercontent.com/nf-core/cutandrun/master/docs/images/nf-core-cutandrun_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/cutandrun/master/docs/images/nf-core-cutandrun_logo_dark.png
    order: 1
    body: >
      CUT&RUN and CUT&Tag libraries turned into fragments, peaks called against the IgG
      control and the intervals each target's replicates reproduce. [Run parameters](params:)
    tag: cr-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  # Who was sequenced, from the sample hub: each line cites it, so a line goes with
  # its data.
  - component_type: text
    surface: card
    values:
      samples: {dc: samples, column: sample_id, aggregation: nunique, format: integer}
      targets: {dc: samples, column: target, aggregation: nunique,
        filter_expr: "col('role') != 'IgG control'", format: integer}
      igg: {dc: samples, column: sample_id, aggregation: count,
        filter_expr: "col('role') == 'IgG control'", format: integer}
      reps: {dc: samples, column: replicate, aggregation: max, format: integer}
      libraries: {dc: samples, column: n_libraries, aggregation: sum, format: integer}
    body: |
      ### The study
      - ![](icon:mdi:test-tube) **Samples** {{samples}} from {{libraries}} libraries
      - ![](icon:mdi:shape-outline) **Targets** {{targets}}, histone marks or factors
      - ![](icon:mdi:content-copy) **Replicates** up to {{reps}} per target
      - ![](icon:mdi:shield-check-outline) **IgG controls** {{igg}}, each target replicate called against its own
      - ![](icon:mdi:file-table-outline) **Samplesheet** [one row per sample](section:Sample sheet), its path in [the run parameters](params:input)
      - ![](icon:mdi:palette-outline) **Target** {{legend:target}}
    tag: cr-ov-study
    index: ov-study
    layout: {x: 0, y: 1, w: 5, h: 6}
  # The pipeline, its version and the callers the run compared. Parameters come
  # from the run's params.json where it writes one; the tool versions from the
  # software versions report.
  - component_type: text
    surface: card
    values:
      callers: {dc: caller_agreement, column: caller, aggregation: nunique, format: integer}
    body: |
      ### The run
      - ![](icon:mdi:source-branch) **Pipeline** nf-core/cutandrun 3.2.2
      - ![](icon:mdi:chart-bell-curve) **Peak callers** {{callers}} against the IgG control
      - ![](icon:mdi:tune) [All parameters and tool versions](params:)
    tag: cr-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 6}
  # The marks take the family's colour (the header's), not the theme's blue.
  # The run has no params.json, so each step's link searches the software
  # versions for its tool.
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Six steps from reads to reproducible peaks
      Each step names its tools and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:content-cut) **Trim** Trim Galore on every library · [Versions](params:trimgalore) · [MultiQC](tab:MultiQC)
      2. ![](icon:mdi:dna) **Align** Bowtie 2 to the target and the spike-in genome · [Versions](params:bowtie2) · [Libraries](tab:Libraries)
      3. ![](icon:mdi:waves) **Fragments** Lengths of the aligned pairs · [Versions](params:frag_len) · [Fragments](tab:Fragments)
      4. ![](icon:mdi:chart-bell-curve) **Call** SEACR and MACS2 against the IgG control · [Versions](params:seacr) · [Peaks](tab:Peaks)
      5. ![](icon:mdi:scale-balance) **Compare** The two callers on each sample · [Versions](params:macs2) · [Agreement](tab:Caller agreement)
      6. ![](icon:mdi:set-merge) **Merge** Replicates into consensus peaks · [Versions](params:consensus) · [Consensus](tab:Consensus)
      :::
    tag: cr-ov-steps
    index: ov-steps
    layout: {x: 0, y: 7, w: 8, h: 3}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/cutandrun turns CUT&RUN and CUT&Tag reads into fragments, calls the regions where each target rises above its IgG control and keeps the peaks a target's replicates reproduce. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The sample filters in the left panel apply to every tab: narrow the samples once and the whole dashboard follows. A bar above a section narrows that section only.
    tag: cr-ov-about
    index: ov-about
    layout: {x: 0, y: 10, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. The icon colour is that tab's colour.
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: samples
    use: cutandrun/samples
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: composition
    breakdown_col: target
    display:
      icon_name: mdi:test-tube
      icon_color: orange
      caption: in the sample sheet, by target
      link: tab:MultiQC
    section: Key figures
    tag: cr-ov-kf-samples
    index: ov-kf-samples
    title: Samples
    description: Samples in the sample sheet, IgG controls included. The bar splits them by target.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_classes
    use: seacr/fragment_classes
    aggregation: median
    column_name: sample_median_length
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: violet
      caption: median per sample, with its spread
      link: tab:Fragments
      decimals: 0
    section: Key figures
    tag: cr-ov-kf-fraglen
    index: ov-kf-fraglen
    title: Fragment length (bp)
    description: Median fragment length of the samples in view, weighted by fragment count. The box shows how it spreads.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: caller_agreement
    use: cutandrun/caller_agreement
    aggregation: sum
    column_name: n_peaks
    column_type: int64
    filter_expr: col('caller') == 'seacr'
    secondary_layout: composition
    breakdown_col: target
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: indigo
      caption: SEACR peaks, by target
      link: tab:Peaks
      format: si
    section: Key figures
    tag: cr-ov-kf-peaks
    index: ov-kf-peaks
    title: Peaks
    description: Regions SEACR called over the samples in view. The bar splits them by target.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # frip is repeated on the two rows of a sample; the In peaks row keeps one
  # value per sample, so the median and the box are of samples.
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: frip
    use: cutandrun/frip
    aggregation: median
    column_name: frip
    column_type: float64
    filter_expr: col('signal_class') == 'In peaks'
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:target
      icon_color: teal
      caption: median per sample, with its spread
      link: tab:Peaks
      format: percent
    section: Key figures
    tag: cr-ov-kf-frip
    index: ov-kf-frip
    title: FRiP
    description: Median fraction of each sample's fragment coverage that falls inside its own SEACR peaks.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the target, then the sample, both on the hub.
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: samples
    use: cutandrun/sample_target_filter
    interactive_component_type: MultiSelect
    column_name: target
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: Target
    section: Findings
    tag: cr-ov-findings-target
    index: ov-findings-target
    title: Target
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Sample
    section: Findings
    tag: cr-ov-findings-sample
    index: ov-findings-sample
    title: Sample
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per analysis tab, each citing one data collection, so the
  # import removes a row with its data.
  - component_type: text
    surface: card
    values:
      mono: {dc: seacr_fragment_classes, column: mono_to_sub, aggregation: median, format: 'decimals:1'}
      pk_top: {dc: caller_agreement, column: target, aggregation: top, weight: n_peaks,
        filter_expr: "col('caller') == 'seacr'"}
      pk_share: {dc: caller_agreement, column: target, aggregation: top_share, weight: n_peaks,
        filter_expr: "col('caller') == 'seacr'", format: percent}
      shared: {dc: caller_agreement, column: frac_shared, aggregation: median,
        filter_expr: "col('caller') == 'seacr'", format: percent}
      n_rep: {dc: seacr_consensus_peaks, column: peak_id, aggregation: count,
        filter_expr: "col('num_samples') >= 2", format: integer}
      n_cons: {dc: seacr_consensus_peaks, column: peak_id, aggregation: count, format: integer}
    body: |
      - **{{mono}}** mononucleosomal fragments per sub-nucleosomal one – median over samples [Fragments](tab:Fragments)
      - **{{pk_share}}** of SEACR peaks are in {{pk_top}} – the target with the most calls [Peaks](tab:Peaks)
      - **{{shared}}** of a sample's SEACR peaks are also MACS2 peaks – median over samples [Agreement](tab:Caller agreement)
      - **{{n_rep}}** of {{n_cons}} consensus intervals are called by two replicates or more – SEACR, per target [Consensus](tab:Consensus)
    section: Findings
    tag: cr-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per analysis tab of the funnel, in the order of the rows
  # above. The Locus tab has none: it is a browser, not a summary. The import
  # drops a highlight whose source is gone (the pile-up, without fragment BEDs)
  # and re-packs the grid.
  - component_type: highlight
    section: Findings
    source_tab: Fragments
    source_component: frag-length-dist
    caption: One curve per sample, coloured by target; the shaded bands are the sub-nucleosomal (sub) and mononucleosomal (mono) windows.
    tag: cr-ov-hl-fragments
    index: ov-hl-fragments
    layout: {x: 0, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Peaks
    source_component: pk-pileup-profile
    title: Pile-up at the summits
    caption: Mean fragments per million around the summits of each sample's strongest SEACR peaks; a sharp mark peaks at 0.
    tag: cr-ov-hl-pileup
    index: ov-hl-pileup
    layout: {x: 4, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Caller agreement
    source_component: ca-caller-scatter
    caption: One point per sample; off the dotted line, the two callers disagree on how many peaks there are.
    tag: cr-ov-hl-callers
    index: ov-hl-callers
    layout: {x: 0, y: 6, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Consensus
    source_component: cons-repro-share
    caption: Each target's consensus intervals, split by how many replicates called them; the labels are interval counts.
    tag: cr-ov-hl-consensus
    index: ov-hl-consensus
    layout: {x: 4, y: 6, w: 4, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers. A tab the run does not have is left out.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Libraries](tab:Libraries)

      ### Chromatin signal
      - [Fragments](tab:Fragments)
      - [Peaks](tab:Peaks)

      ### Agreement
      - [Caller agreement](tab:Caller agreement)
      - [Consensus](tab:Consensus)
      - [Locus](tab:Locus)
    section: How to read this dashboard
    tag: cr-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the target first. Replicate filters on the
  # categorical twin of `replicate`: an Int64 column only takes a slider.
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: samples
    use: cutandrun/sample_target_filter
    interactive_component_type: MultiSelect
    column_name: target
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: cr-filter-target
    index: cr-target-filter
    title: Target
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: cr-filter-sample
    index: cr-sample-filter
    title: Sample
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: samples
    use: cutandrun/sample_replicate_filter
    interactive_component_type: MultiSelect
    column_name: replicate_label
    column_type: object
    display:
      icon_name: mdi:relation-many-to-many
      custom_color: cyan
    section: Sample filters
    group: Sample scope
    tag: cr-filter-replicate
    index: cr-replicate-filter
    title: Replicate
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: role
    column_type: object
    display:
      icon_name: mdi:shield-check-outline
      custom_color: orange
    section: Sample filters
    group: Sample scope
    tag: cr-filter-role
    index: cr-role-filter
    title: Role
    layout: {x: 0, y: 9, w: 1, h: 3}
  - component_type: table
    workflow_tag: cutandrun
    data_collection_tag: samples
    use: cutandrun/samples
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Sample sheet
    tag: cr-sample-sheet
    index: sample-sheet
    title: Sample sheet
    description: >-
      Which samples does the run hold? One row per sample, with its target, replicate, role (target or
      IgG control) and the control it is called against.

      How to read: check that every target has the replicates and the control you expect before reading
      any other tab. The sample name (group, _R and the replicate number) is the key every other table
      of the dashboard is linked on.
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
# ============================================================================
# Data & QC
# ============================================================================
- title: MultiQC
  subtitle: Did reads trim, align and rise above the IgG control?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # Sourced on the spike-in table, which links back into the MultiQC panels,
  # so the two sliders narrow the report to the libraries inside both bands.
  filter_sections:
  - name: Alignment scope
    icon: mdi:tune
    color: orange
    description: Libraries inside an alignment rate and a spike-in factor band
  grid_sections:
  - name: QC overview
    icon: mdi:chart-box-outline
    color: orange
    description: The headline numbers of every module, read counts and reads kept after trimming
  - name: Alignment and spike-in
    icon: mdi:chart-bar
    color: orange
    description: How much of each library aligned, to the target and to the spike-in genome
  - name: Enrichment over the control
    icon: mdi:chart-line
    color: orange
    description: Whether each target's coverage is more concentrated than its IgG control's
  - name: QC details
    icon: mdi:file-document-outline
    color: gray
    description: Mapping rate, base quality, GC content, insert sizes and reads per contig
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [MultiQC](https://multiqc.info) gathers the
      [FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/),
      [Trim Galore](https://github.com/FelixKrueger/TrimGalore),
      [Bowtie 2](https://github.com/BenLangmead/bowtie2), samtools and
      [deepTools](https://deeptools.readthedocs.io) reports: the pipeline's own, or one
      re-generated with MultiQC 1.35 for a run on the release's MultiQC 1.19. Read the
      trimming and the two alignment rates first (a re-generated report draws the spike-in
      libraries in the target panel, with a .spikein suffix), then the fingerprint: a target
      that worked bends away from the diagonal its IgG control follows.
    tag: cr-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: target_align_rate
    column_type: float64
    display:
      icon_name: mdi:chart-bar
      custom_color: blue
    section: Alignment scope
    group: Alignment quality
    tag: cr-mqc-filter-alignrate
    index: cr-qc-alignrate-range
    title: Target alignment rate
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: scale_factor
    column_type: float64
    display:
      icon_name: mdi:ruler
      custom_color: indigo
    section: Alignment scope
    group: Alignment quality
    tag: cr-mqc-filter-scale
    index: cr-qc-scale-range
    title: Spike-in scale factor
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: multiqc
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: QC overview
    tag: cr-mqc-general-stats
    title: General statistics
    description: >-
      Where does a sample depart from the others? The per-sample summary MultiQC assembles from every
      module of the report: one row per sample, one column per headline metric a module contributed.

      How to read: scan a column for the sample that sits apart from its replicates, then open the
      module's own plot below to see why.

      Note: the columns depend on the modules the report holds, and a sample a module did not see has an
      empty cell.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Counts
    section: QC overview
    tag: cr-mqc-fastqc-counts
    title: Sequence counts
    description: >-
      How many reads did each FASTQ file hold? One stacked bar per file analysed by FastQC, split into
      unique and duplicate reads.

      How to read: a bar far shorter than its siblings is a library with few reads. A large duplicate
      part says the library was sequenced past its diversity or started from little material; compare it
      with the duplicate share counted on the aligned reads in [Libraries](tab:Libraries).

      Note: FastQC follows duplication only for the sequences that first appear in the first 100,000 of
      each file, and matches the first 50 bp of reads longer than 75 bp, so the split is an estimate.

      Source: FastQC help, Duplicate Sequences,
      https://www.bioinformatics.babraham.ac.uk/projects/fastqc/Help/3%20Analysis%20Modules/8%20Duplicate%20Sequences.html
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    use: multiqc/cutadapt
    selected_module: cutadapt
    selected_plot: Filtered Reads
    section: QC overview
    tag: cr-mqc-cutadapt
    title: Reads kept after trimming
    description: >-
      Did trimming keep the reads? One stacked bar per sample: the read pairs (reads, for single-end
      data) passing the filters, and the ones Cutadapt removed as too short, too long, carrying too many
      N, or for another reason.

      How to read: nearly the whole bar should be the passing segment. A large removed part, mostly too
      short, means many reads were left too short once trimmed, so check the sequence counts and the
      alignment rates of that sample next.
    layout: {x: 4, y: 4, w: 4, h: 4}
  # The pipeline's report keeps the two Bowtie 2 runs apart: bowtie2 is the
  # target genome, bowtie2-1 the spike-in. A re-generated report pools both
  # into bowtie2 (the spike-in libraries suffixed .spikein) and has no
  # bowtie2-1, so the import drops the spike-in tile and re-packs the target
  # one to the full width.
  - component_type: multiqc
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    use: multiqc/bowtie2
    selected_module: bowtie2
    selected_plot: Paired-end alignments
    section: Alignment and spike-in
    tag: cr-mqc-bowtie2
    title: Target genome alignments
    description: >-
      How did each library's read pairs align to the target genome? One stacked bar per library, split
      into pairs mapped uniquely, mapped discordantly, with one mate mapped, multimapped, and pairs where
      neither mate aligned. A re-generated report draws the spike-in libraries here too, suffixed
      .spikein.

      How to read: a bar made mostly of uniquely mapped pairs is a clean alignment. A large multimapped
      part points to repeats, and a large unaligned part to contamination, adapter sequence or low
      sequencing quality, so compare it with the spike-in alignment and the trimming plot.

      Note: MultiQC halves the single-mate counts so that they add up to pair counts.

      Source: MultiQC Bowtie 2 module, https://github.com/MultiQC/MultiQC/blob/main/multiqc/modules/bowtie2/bowtie2.py
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    use: multiqc/bowtie2
    selected_module: bowtie2-1
    selected_plot: Paired-end alignments
    section: Alignment and spike-in
    tag: cr-mqc-bowtie2-spikein
    title: Spike-in alignments
    description: >-
      How much carrier DNA did each library hold? The same Bowtie 2 split of the read pairs as the target
      alignment, now against the spike-in genome. The pairs that aligned here set each library's scale
      factor.

      How to read: the share of pairs aligning to the spike-in genome is the carrier fraction of the
      library, and it should be small and alike between replicates. The nf-core documentation puts the
      usual share for target samples under 1%; a library far from its replicates will be scaled
      differently from them.

      Source: nf-core/cutandrun output documentation, https://nf-co.re/cutandrun/3.2.2/docs/output
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    use: multiqc/deeptools
    selected_module: deepTools
    selected_plot: Fingerprint plot
    section: Enrichment over the control
    tag: cr-mqc-deeptools-fingerprint
    title: Fingerprint plot
    description: >-
      Is the signal concentrated in a few places? One curve per library: the genome bins sorted by their
      coverage along the x axis (rank, 0 to 1), against the cumulative coverage up to that rank, as a
      fraction of the highest value, on the y axis.

      How to read: a library that spreads its reads evenly follows the diagonal from corner to corner,
      as an IgG control should. A target that worked stays low and then rises steeply at the highest
      ranks, because its reads pile into few bins, and the further it bends from the diagonal the
      stronger the enrichment. Broad marks bend less clearly than sharp ones.

      Lines and annotations: MultiQC draws no reference line, so the diagonal of an evenly covered
      library has to be read from corner to corner.

      Source: deepTools plotFingerprint documentation,
      https://deeptools.readthedocs.io/en/latest/content/tools/plotFingerprint.html
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    section: QC details
    tag: cr-mqc-fastqc-quality
    title: Per-base sequence quality
    description: >-
      How good are the base calls along the read? The mean Phred quality score at each position, one
      line per FASTQ file.

      How to read: calls usually degrade toward the read end. Lines that stay in the green band along
      the whole read are good calls, while a line that falls into the orange or red band early or
      sharply marks a file to look at before trusting its alignment.

      Lines and annotations: three background bands, drawn by MultiQC at fixed scores: green from a
      Phred score of 28 upward, orange from 20 to 28, and red below 20.

      Note: FastQC's own pass, warn and fail verdicts rest on the lower quartile and the median of each
      position, which this chart does not plot; it shows the mean only.

      Sources: MultiQC FastQC module, https://github.com/MultiQC/MultiQC/blob/main/multiqc/modules/fastqc/fastqc.py;
      FastQC help, Per Base Sequence Quality,
      https://www.bioinformatics.babraham.ac.uk/projects/fastqc/Help/3%20Analysis%20Modules/2%20Per%20Base%20Sequence%20Quality.html
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Per Sequence GC Content
    section: QC details
    tag: cr-mqc-fastqc-gc
    title: GC content
    description: >-
      Do the reads have the expected base composition? The share of reads (or their count) at each
      percent GC, one line per FASTQ file.

      How to read: a normal library gives one smooth peak at the GC content of its genome. An unusually
      shaped distribution can mean a contaminated or biased library, and a shifted peak a systematic
      bias, although FastQC cannot tell whether the shift matches the genome.

      Lines and annotations: a dashed black line, Theoretical GC Content, is drawn only when the report
      was built with a theoretical GC file; without one no reference line is drawn.

      Note: FastQC compares each file with a normal distribution built from the file's own modal GC
      content. It warns when the deviations cover more than 15% of the reads and fails above 30%.

      Sources: FastQC help, Per Sequence GC Content,
      https://www.bioinformatics.babraham.ac.uk/projects/fastqc/Help/3%20Analysis%20Modules/5%20Per%20Sequence%20GC%20Content.html;
      MultiQC FastQC module, https://github.com/MultiQC/MultiQC/blob/main/multiqc/modules/fastqc/fastqc.py
    layout: {x: 4, y: 0, w: 4, h: 4}
  # Percent mapped left the open alignment row for the spike-in tile, which
  # keeps the tab inside its 20 open rows.
  - component_type: multiqc
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Percent mapped
    section: QC details
    tag: cr-mqc-samtools-mapped
    title: Percent mapped
    description: >-
      How many reads of each library are mapped? One stacked bar per library from samtools stats,
      split into reads mapped with a mapping quality above 0, reads mapped with quality 0 (MQ0) and
      unmapped reads.

      How to read: a bar made mostly of the mapped segment is a library that aligned. A large unmapped
      part can mean contamination, adapter sequence or low sequencing quality, and MQ0 reads are
      ambiguously placed, often in repeats, and are often filtered out downstream.

      Source: MultiQC samtools module,
      https://github.com/MultiQC/MultiQC/blob/main/multiqc/modules/samtools/stats.py
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Insert size distribution
    section: QC details
    tag: cr-mqc-samtools-insert
    title: Insert size distribution
    description: >-
      How long are the fragments the read pairs span? The number of read pairs at each insert size in
      bp, from samtools stats, one line per library.

      How to read: in a CUT&RUN library the insert is the sequenced fragment, so the peaks of a curve
      are its fragment-size classes; the same ladder is read from the pipeline's own histogram in
      [Fragments](tab:Fragments). Libraries of one target should draw curves of the same shape.
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: cutandrun
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Mapped reads per contig
    section: QC details
    tag: cr-mqc-samtools-contig
    title: Mapped reads per contig
    description: >-
      Where on the genome did the reads map? One line per library across the chromosomes and contigs of
      the reference, from samtools idxstats, as the fraction of the library's mapped reads on each.
      MultiQC also offers the observed over expected counts, which weigh each contig by its length, and
      the raw counts.

      How to read: libraries of one target should draw the same profile. A contig that takes far more
      reads in one library than in its replicates, or a mitochondrial contig that dominates a library,
      is the place to look next.

      Note: MultiQC leaves out contigs that hold less than 0.1% of all mapped reads, its default
      cut-off for this plot.

      Source: MultiQC samtools module documentation, https://docs.seqera.io/multiqc/modules/samtools
    layout: {x: 0, y: 8, w: 8, h: 4}
# The tables the pipeline published beside the report: the spike-in factors,
# the flagstat counts and the three deepTools tables the MultiQC pictures are
# drawn from.
