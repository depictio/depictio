- title: Fragments
  subtitle: Did the digestion work, and how nucleosomal are the fragments?
  tab_group: Chromatin signal
  tab_order: 3
  tab_icon: mdi:waves
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Fragment filters
    icon: mdi:filter-variant
    color: violet
    description: Narrows the ladder to a length window and the classes to a few
  grid_sections:
  - name: Fragments at a glance
    icon: mdi:counter
    color: violet
    description: Length, depth and nucleosome classes over the samples in view
  - name: Fragment length
    icon: mdi:chart-bell-curve
    color: violet
    description: The nucleosomal ladder, then the running share of fragments by length
  - name: Nucleosome classes
    icon: mdi:chart-donut
    color: violet
    description: Each library split into its four nucleosome classes
  - name: Fragment tables
    icon: mdi:table
    color: gray
    description: The fragment-class rows behind the tiles above
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      MNase cuts around nucleosomes, so a working experiment shows a sharp sub-nucleosomal
      peak beside a mononucleosomal shoulder, read off the
      [fragment-length histogram](https://nf-co.re/cutandrun/3.2.2/docs/output) the pipeline
      writes per sample. The classes bin that histogram at 120, 250 and 450 bp; a sharp mark
      carries more sub-nucleosomal material than a broad one. Pick a length window on the
      left to zoom the ladder.
    tag: cr-frag-intro
    index: frag-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_classes
    interactive_component_type: MultiSelect
    column_name: fragment_class
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: grape
    section: Fragment filters
    tag: cr-frag-filter-class
    index: cr-sg-class-filter
    title: Nucleosome class
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_lengths
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: fragment_length
    column_type: int64
    display:
      icon_name: mdi:ruler
      custom_color: lime
    section: Fragment filters
    tag: cr-frag-filter-length
    index: cr-sg-fraglen-range
    title: Fragment length
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_classes
    use: seacr/fragment_classes
    aggregation: median
    column_name: sample_median_length
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: violet
      caption: median per sample, with its spread
      decimals: 0
    section: Fragments at a glance
    tag: cr-frag-card-length
    index: frag-card-length
    title: Fragment length (bp)
    description: Median fragment length of each sample, weighted by fragment count.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_lengths
    use: seacr/fragment_lengths
    aggregation: sum
    column_name: count
    column_type: int64
    secondary_layout: composition
    breakdown_col: target
    display:
      icon_name: mdi:counter
      icon_color: blue
      caption: by target
    section: Fragments at a glance
    tag: cr-frag-card-count
    index: frag-card-count
    title: Fragments
    description: Fragments the length histograms count, summed over the samples in view.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_classes
    use: seacr/fragment_classes
    aggregation: sum
    column_name: n_fragments
    column_type: int64
    secondary_layout: donut
    breakdown_col: fragment_class
    top_n_count: 4
    display:
      icon_name: mdi:chart-donut
      icon_color: grape
      caption: fragments, by nucleosome class
    section: Fragments at a glance
    tag: cr-frag-card-classes
    index: frag-card-classes
    title: Nucleosome classes
    description: The fragments in view split into sub-, mono-, di- and multi-nucleosomal classes.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # mono_to_sub is one value per sample, repeated on its four class rows, so
  # the median per target is a median of samples.
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_classes
    use: seacr/fragment_classes
    aggregation: median
    column_name: mono_to_sub
    column_type: float64
    secondary_layout: top_n
    breakdown_col: target
    top_n_count: 3
    display:
      icon_name: mdi:scale-balance
      icon_color: pink
      caption: median, by target
      decimals: 1
    section: Fragments at a glance
    tag: cr-frag-card-monosub
    index: frag-card-monosub
    title: Mononucleosome ratio
    description: Mononucleosomal over sub-nucleosomal fragments, the sharp-against-broad contrast as one number.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Colours by target, the run's grouping, so it takes the pieces of the group
  # kwargs rather than spreading them: the curves group by sample whatever the
  # colour.
  - component_type: figure
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_lengths
    use: seacr/fragment_lengths
    mode: code
    visu_type: line
    code_content: |-
      # The 25-800 bp window holds the nucleosomal ladder; past it the histogram is
      # a long tail. One curve per sample, coloured by its target or by Analysis
      # mode's groups when it has some.
      grp = depictio_group_by[0] if depictio_group_by else 'target'
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get('target') or {}
      d = df.filter((pl.col('fragment_length') >= 25) & (pl.col('fragment_length') <= 800)).sort(['sample', 'fragment_length'])
      if grp not in d.columns:
          grp = 'sample'
      fig = px.line(d.to_pandas(), x='fragment_length', y='fraction', color=grp, line_group='sample', color_discrete_map=colors, hover_name='sample', labels={'fragment_length': 'Fragment length (bp)', 'fraction': 'Share of fragments', grp: ''})
      # The sub-nucleosomal and mononucleosomal windows of seacr/fragment_classes,
      # labelled short enough to fit inside them.
      for start, end, label in ((0, 120, 'sub'), (120, 250, 'mono')):
          fig.add_vrect(x0=start, x1=end, fillcolor='grey', opacity=0.1, line_width=0, annotation_text=label, annotation_position='top left')
      fig.update_layout(margin=dict(t=10))
    section: Fragment length
    tag: cr-frag-fig-dist
    index: frag-length-dist
    title: Fragment length distribution
    description: >-
      Did the digestion cut around nucleosomes? One curve per sample: the share of its fragments at
      every length from 25 to 800 bp, in the colour of its target.

      How to read: a working experiment shows a sharp peak of short, sub-nucleosomal fragments beside a
      mononucleosomal shoulder, and a sharp mark carries more of the short material than a broad one. A
      flat curve with no ladder suggests a poor digestion; open [Peaks](tab:Peaks) to see whether the
      library still produced regions.

      Lines and annotations: two grey bands, labelled sub (below 120 bp) and mono (120 to 250 bp), mark
      the first two nucleosome classes. The 120 bp edge is the size at or below which Skene and Henikoff
      map transcription-factor-sized fragments separately from nucleosome-sized ones; the 250 bp edge is
      a fixed class boundary of this template, not a published cut-off.

      Source: Skene and Henikoff 2017, https://elifesciences.org/articles/21856
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_lengths
    use: seacr/seacr_fragment_cumulative
    visu_type: line
    dict_kwargs:
      x: fragment_length
      y: cumulative_fraction
      color: sample
      labels: {fragment_length: Fragment length (bp), cumulative_fraction: Cumulative share of fragments, sample: ''}
    section: Fragment length
    tag: cr-frag-fig-cumulative
    index: frag-length-cumulative
    title: Cumulative fragment length
    description: >-
      How are the fragment lengths spread, cumulatively? One curve per sample, in its own colour: the
      share of its fragments that are at most as long as the length on the x axis.

      How to read: a curve that rises early is dominated by short, sub-nucleosomal fragments, and one
      that rises late by long ones. Two samples are easy to compare here because their curves share the
      same 0 to 1 scale whatever their depth, and a steep rise marks a frequent fragment length.

      Annotations: no reference line or cut-off is drawn.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_classes
    use: seacr/seacr_fragment_class_stack
    visu_type: bar
    dict_kwargs:
      x: sample
      y: fraction
      color: fragment_class
      barmode: stack
      labels: {sample: '', fraction: Share of the library's fragments, fragment_class: ''}
    section: Nucleosome classes
    tag: cr-frag-fig-classes
    index: frag-class-stack
    title: Nucleosome classes per sample
    description: >-
      How nucleosomal is each library? One stacked bar per library: the share of its own fragments in
      each of four length classes, sub-, mono-, di- and multi-nucleosomal, each in a colour kept across
      the dashboard.

      How to read: a sharp mark is expected to carry more sub-nucleosomal material than a broad one,
      which is mononucleosome heavy. Replicates of one target should split alike; a bar that departs
      from its replicates suggests a digestion that differed.

      Lines and annotations: the class edges are below 120 bp (sub), 120 to 250 bp (mono), 251 to 450 bp
      (di) and above 450 bp (multi), fixed class boundaries of this template and not read from the run.
      Only the 120 bp edge has a published basis, the split of transcription-factor-sized from
      nucleosome-sized fragments by Skene and Henikoff.

      Source: Skene and Henikoff 2017, https://elifesciences.org/articles/21856
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    workflow_tag: cutandrun
    data_collection_tag: seacr_fragment_classes
    use: seacr/fragment_classes
    row_selection_enabled: true
    row_selection_column: sample
    section: Fragment tables
    tag: cr-frag-table-classes
    index: frag-table-classes
    title: Nucleosome classes
    description: >-
      The numbers behind the class bars. Four rows per sample, one per nucleosome class, with the
      fragments in it, their share of the library, the median length inside the class and the sample's
      mononucleosomal to sub-nucleosomal ratio.

      How to read: sort by the ratio to rank the libraries from sharp to broad, and compare the
      replicates of a target on the same column.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Peaks
