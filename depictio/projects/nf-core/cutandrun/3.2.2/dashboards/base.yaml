  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    use: bowtie2/spikein_factors
    aggregation: sum
    column_name: total_pairs
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:dna
      icon_color: blue
      caption: total; the bars, pairs per library
    section: Libraries at a glance
    tag: cr-lib-card-pairs
    index: lib-card-pairs
    title: Read pairs
    description: Read pairs that entered both alignments, summed over the libraries in view.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    use: bowtie2/spikein_factors
    aggregation: median
    column_name: scale_factor
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: indigo
      caption: median per library, with its spread
      decimals: 2
    section: Libraries at a glance
    tag: cr-lib-card-scale
    index: lib-card-scale
    title: Spike-in scale factor
    description: Median factor the pipeline scaled each library's coverage by, from its spike-in depth.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: samtools_flagstat
    use: samtools/flagstat
    aggregation: sum
    column_name: duplicate_reads
    column_type: int64
    secondary_layout: concentration
    breakdown_col: sample
    top_n_count: 3
    display:
      icon_name: mdi:content-copy
      icon_color: orange
      caption: the share held by the three most duplicated libraries
    section: Libraries at a glance
    tag: cr-lib-card-dups
    index: lib-card-dups
    title: Duplicate reads
    description: Reads Picard flagged as duplicates in the marked target BAMs, summed over the libraries in view.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: cutandrun
    data_collection_tag: deeptools_fingerprint_metrics
    use: deeptools/fingerprint_metrics
    aggregation: median
    column_name: synthetic_js_distance
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-line
      icon_color: grape
      caption: median, with its spread
      decimals: 2
    section: Libraries at a glance
    tag: cr-lib-card-jsd
    index: lib-card-jsd
    title: Distance from uniform
    description: Median Jensen-Shannon distance of each library's coverage to a uniform one; enriched libraries sit far from it.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    use: bowtie2/spikein_factor_bar
    visu_type: bar
    dict_kwargs:
      x: sample
      y: scale_factor
      labels: {sample: '', scale_factor: Spike-in scale factor}
    section: Spike-in and duplication
    tag: cr-lib-fig-scale
    index: lib-fig-scale
    title: Spike-in scale factor per library
    description: >-
      How much was each library's coverage scaled? One bar per library: its spike-in scale factor, the
      normalisation constant divided by the number of read pairs that aligned to the spike-in genome. A
      library with few spike-in pairs, that is with little carrier DNA, gets a large factor.

      How to read: replicates of one target should carry factors of the same size. A factor far from its
      replicates means the library held a different amount of carrier per sequenced pair, and the
      coverage compared between samples is scaled by it; a very large factor rests on few spike-in
      pairs and is the least certain.

      Note: the pipeline does not publish the factor, so it is recomputed from the Bowtie 2 logs with
      the pipeline's default constant of 10000 (normalisation_c), not read from the run. A run that set
      another constant has the same ordering with other absolute values.

      Sources: nf-core/cutandrun parameters, https://nf-co.re/cutandrun/3.2.2/parameters; Meers et al.
      2019, carry-over bacterial DNA calibrates CUT&RUN samples, https://elifesciences.org/articles/46314
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: cutandrun
    data_collection_tag: samtools_flagstat
    use: samtools/flagstat
    mode: code
    visu_type: bar
    code_content: |-
      # Duplicate share per library, from the flagstat counts of the marked BAMs.
      # Colours by nothing of its own, so it spreads the group kwargs whole.
      d = df.with_columns((100 * pl.col('duplicate_reads') / pl.col('total_reads')).alias('duplicate_pct')).sort('sample')
      fig = px.bar(d.to_pandas(), x='sample', y='duplicate_pct', labels={'sample': '', 'duplicate_pct': 'Duplicate reads (%)'}, **depictio_group_kwargs)
      fig.update_layout(margin=dict(t=10))
      # Room for the slanted names, so the first ones are not cut at the edge.
      fig.update_xaxes(tickangle=-45, automargin=True)
    section: Spike-in and duplication
    tag: cr-lib-fig-dup
    index: lib-fig-dup
    title: Duplicate reads per library
    description: >-
      How much of each library is duplicated? One bar per library: the share of its reads that Picard
      flagged as duplicates in the marked-duplicate BAM, from samtools flagstat.

      How to read: a high bar is a library whose fragments repeat, because it started from little
      material or was sequenced deeper than its complexity; read it against the read count of the same
      library. No cut-off is applied, so the bars rank the libraries and give no verdict.

      Note: the pipeline marks duplicates but, by default, removes them from the IgG controls only, so
      this share describes the target libraries as sequenced (--dedup_target_reads changes that).

      Source: nf-core/cutandrun output documentation, https://nf-co.re/cutandrun/3.2.2/docs/output
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: advanced_viz
    workflow_tag: cutandrun
    data_collection_tag: deeptools_fingerprint_metrics
    use: deeptools/fingerprint_scatter
    config:
      x_title: Area under the observed coverage curve
      y_title: Divergence from a uniform library
      # Colour names the libraries and the legend carries the names, so the
      # four labels are free to mark the extremes.
      color_col: sample
      # Third quality axis: the share of the genome the library left uncovered.
      # A sharp target covers little of it, an IgG control covers most.
      size_col: x_intercept
      min_size: 8
      max_size: 26
      marker_size: 12
      opacity: 0.85
      marker_outline: true
      top_n_labels: 4
      legend_pos: right
      selection_enabled: true
      selection_column: sample
    section: Enrichment over the control
    tag: cr-lib-av-fingerprint
    index: lib-av-fingerprint
    title: Coverage concentration per library
    description: >-
      Is each target more concentrated than its control? Each point is one library, in its own colour,
      placed by the area under its observed coverage curve (x) and its Jensen-Shannon distance to a
      perfect input of the same depth (y); the marker size is the share of the genome bins with no
      reads.

      How to read: a lower area means more focal enrichment and a larger distance means a coverage
      profile further from an evenly covered library. An enriched target therefore sits to the upper
      left, while an IgG control sits near an evenly covered library, and a target that lands with the
      controls did not enrich. The enrichment of broad marks is less marked on both axes.

      Annotations: the four most extreme libraries carry their name. No cut-off line is drawn.

      Note: at low sequencing depth a normal-looking library can appear stronger or weaker than it is,
      which is why deepTools reports synthetic values for a perfect input of the same depth.

      Sources: deepTools plotFingerprint quality metrics,
      https://deeptools.readthedocs.io/en/latest/content/feature/plotFingerprint_QC_metrics.html;
      plotFingerprint, https://deeptools.readthedocs.io/en/latest/content/tools/plotFingerprint.html
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: cutandrun
    data_collection_tag: deeptools_sample_pca
    use: deeptools/pca_embedding
    config:
      color_col: sample
      point_size: 16
      marker_outline: true
      axis_prefix: PC
      legend_pos: right
      selection_enabled: true
      selection_column: sample
    section: Sample similarity
    tag: cr-lib-av-pca
    index: lib-av-pca
    title: Libraries on the first two components
    description: >-
      Which libraries look alike? Each point is one library, in its own colour, placed on the first two
      principal components of the genome-wide bin counts that deepTools plotPCA computed.

      How to read: replicates of one target should sit close together, and the IgG controls should
      group apart from the targets. A library that lands with the controls did not enrich, and one far
      from its own replicates is an outlier or a possible swap; check it in the correlation matrix.

      Annotations: no reference line or cut-off is drawn, and the axes are the two components with no
      fixed scale.

      Source: nf-core/cutandrun output documentation, which describes the PCA as a way to find batch
      effects and outliers, https://nf-co.re/cutandrun/3.2.2/docs/output
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: cutandrun
    data_collection_tag: deeptools_correlation_matrix
    use: deeptools/correlation_heatmap
    config:
      index_column: sample
      # Clustered on both axes, so the replicates of one target fall next to
      # each other. Average linkage on a correlation distance: these rows are
      # correlations, not coordinates, so ward/euclidean does not apply.
      cluster_rows: true
      cluster_cols: true
      cluster_method: average
      cluster_metric: correlation
      colorscale: RdBu
    section: Sample similarity
    tag: cr-lib-av-corr
    index: lib-av-corr
    title: Library correlation matrix
    description: >-
      Which libraries agree over the genome? Each cell is the correlation of the genome-wide bin counts
      of two libraries, from deepTools plotCorrelation, with the rows and columns ordered by clustering.

      How to read: replicates of one target should form a block of high correlation, and the IgG
      controls another. A block that spans two targets, or a library that clusters away from its own
      replicates, can be a sample swap or cross-contamination worth checking against the sample sheet.

      Lines and annotations: the dendrograms on both axes show the clustering, average linkage on a
      correlation distance; the colour bar gives the correlation of each cell. No cut-off is drawn.

      Source: nf-core/cutandrun output documentation, which describes the matrix as the overall
      similarity between samples from read coverage in genomic regions,
      https://nf-co.re/cutandrun/3.2.2/docs/output
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: figure
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    use: bowtie2/spikein_depth_scatter
    selection_enabled: true
    selection_column: sample
    visu_type: scatter
    dict_kwargs:
      x: spikein_aligned
      y: target_aligned
      color: sample
      labels: {spikein_aligned: Spike-in read pairs aligned, target_aligned: Target read pairs aligned, sample: ''}
    section: Depth detail
    tag: cr-lib-fig-depth
    index: lib-fig-depth
    title: Target depth against spike-in depth
    description: >-
      How do the two alignments compare? Each point is one library, in its own colour: the read pairs
      that aligned to the spike-in genome (x) against the read pairs that aligned to the target genome
      (y).

      How to read: a library that sits high for its spike-in depth carries more target signal per unit
      of carrier DNA, and one that sits low carries less. The more spike-in pairs a library has, the
      smaller its scale factor, so points to the right are scaled down more.

      Annotations: no reference line or cut-off is drawn.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: cutandrun
    data_collection_tag: samtools_flagstat
    use: samtools/flagstat
    mode: code
    visu_type: scatter
    code_content: |-
      # Duplication against depth: a library both deep and highly duplicated was
      # sequenced past its complexity. Spreads the group kwargs whole.
      d = df.with_columns((100 * pl.col('duplicate_reads') / pl.col('total_reads')).alias('duplicate_pct'))
      fig = px.scatter(d.to_pandas(), x='total_reads', y='duplicate_pct', hover_name='sample', custom_data=['sample'], labels={'total_reads': 'Reads in the BAM', 'duplicate_pct': 'Duplicate reads (%)'}, **depictio_group_kwargs)
      fig.update_traces(marker={'size': 14})
      fig.update_layout(margin=dict(t=10))
    selection_enabled: true
    selection_column: sample
    section: Depth detail
    tag: cr-lib-fig-dup-depth
    index: lib-fig-dup-depth
    title: Duplication against depth
    description: >-
      Was a library sequenced past its complexity? Each point is one library: the reads in its
      marked-duplicate BAM (x) against the share of them flagged as duplicates (y).

      How to read: a library that is both deep and highly duplicated gains few new fragments from more
      sequencing, while a shallow library with many duplicates started from little material. Compare a
      library with the others of its target to see which departs.

      Annotations: no reference line or cut-off is drawn.

      Note: the read count is that of the aligned BAM, so it is below the sequenced depth.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: table
    workflow_tag: cutandrun
    data_collection_tag: bowtie2_spikein_factors
    use: bowtie2/spikein_factors
    row_selection_enabled: true
    row_selection_column: sample
    section: Library tables
    tag: cr-lib-table-spike
    index: lib-table-spike
    title: Spike-in factors
    description: >-
      The numbers behind the spike-in tiles. One row per library, with the read pairs that entered both
      alignments, the pairs and the rate aligned to the target genome and to the spike-in genome, and
      the scale factor derived from them.

      How to read: sort by the scale factor or the spike-in rate to find the library that departs from
      its replicates, then open its alignment in [MultiQC](tab:MultiQC).
    layout: {x: 0, y: 0, w: 8, h: 6}
