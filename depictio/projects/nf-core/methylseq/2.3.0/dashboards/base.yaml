version: 1
# nf-core/methylseq 2.3.0 reference dashboard (Bismark route).
#
# The funnel, tab by tab: the reprocessed MultiQC report (every module, as
# MultiQC draws it) -> the run's own numbers, read to methylome -> how much of
# each library aligned and survived deduplication -> how deep and how even the
# coverage is -> whether the calls themselves are trustworthy (context levels,
# conversion, read-position bias) -> the methylome as a whole (density, track,
# library structure) -> the comparison the cohort was sequenced for -> what a
# bundled genome annotation would add on top.
#
# The sample hub is the anchor: the sample filter and the two design filters in
# the left panel reach the MultiQC panels and every per-library collection
# through the project links. Each tab adds its own non-persistent filters on its
# own columns (contig, context, read, effect size, CpG-density class).
#
# The MultiQC tab holds MultiQC panels only. Everything the Bismark and Qualimap
# recipes parse straight from the reports (the exact counts a bar plot only
# shows relative) lives on the seven other tabs instead. The two pinned sections
# are the deliberate exception: the sample sheet and the alignment /
# deduplication summaries ride along on every tab, MultiQC included, because the
# whole dashboard is filtered and thresholded by them.
#
# Genome coverage is Qualimap's, not Bismark's: the Coverage tab binds
# `depictio/catalog/qualimap/`, owned by nf-core/eager, and does not recreate it.
#
# The MultiQC report bound here was re-generated with MultiQC 1.35 from the
# run's raw tool outputs; the run itself published MultiQC 1.13, which writes
# no parquet. Module and plot names are therefore the 1.35 ones.
main_dashboard:
  title: nf-core/methylseq
  subtitle: "nf-core/methylseq 2.3.0 megatest (Bismark route): two hESC lines, MShef11 under low-oxygen replicates and MShef4 across passage conditions"
  project_tag: Bisulfite Methylation Profiling
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab through the project links
    persistent: true
    pin: top
  - name: QC thresholds
    icon: mdi:tune
    color: cyan
    description: Mapping efficiency, duplication and conversion floors on the per-library summaries
    collapsed: true
    persistent: true
    pin: bottom
  - name: Glance scope
    icon: mdi:tune
    color: orange
    description: CpG methylation window on the per-library summary the pinned glance strip reads
  grid_sections:
  # Pinned to the top and carried by every tab: the four numbers that size the
  # run. Cards are legal on the MultiQC tab only inside a pinned persistent
  # section, which is exactly what this is.
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: The run in four numbers, on every tab
    persistent: true
    pin: top
  - name: MultiQC general statistics
    icon: mdi:view-dashboard-outline
    color: blue
    description: One row per sample, pooling the headline numbers of every module
  - name: Read quality
    icon: mdi:chart-bell-curve
    color: blue
    description: Every FastQC panel on the raw libraries
  - name: Trimming
    icon: mdi:ruler
    color: indigo
    description: What Trim Galore (Cutadapt underneath) removed before Bismark saw the reads
  - name: Bisulfite alignment
    icon: mdi:dna
    color: indigo
    description: Bismark's own alignment, strand, deduplication, methylation and M-bias plots
  - name: Coverage
    icon: mdi:chart-line
    color: cyan
    description: Qualimap BamQC coverage, insert size and GC content, the panel nf-core/eager also binds
  # Pinned to the top and carried by every tab: the design the whole
  # dashboard is filtered by should be one collapse away wherever the viewer
  # lands.
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The sample hub every other tab is filtered by
    collapsed: true
    persistent: true
    pin: top
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The per-sample alignment and deduplication summaries, on every tab
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # ------------------------------------------------------------- at a glance
  - component_type: card
    tag: ms-glance-card-mapeff
    index: ms-glance-card-mapeff
    section: Run at a glance
    workflow_tag: methylseq
    data_collection_tag: bismark_alignment_summary
    use: bismark/alignment_summary
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: mapping_efficiency_pct
    column_type: float64
    display: {icon_name: 'mdi:chart-line', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mapping efficiency
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: ms-glance-card-cpg
    index: ms-glance-card-cpg
    section: Run at a glance
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    use: bismark/summary_report
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: pct_cpg_methylation
    column_type: float64
    display: {icon_name: 'mdi:dna', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
