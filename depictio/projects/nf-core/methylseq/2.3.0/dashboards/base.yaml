# ============================================================================
# Group comparison
# ============================================================================
# The comparison the cohort was sequenced for, run on the windows: nf-core/
# methylseq ships no differential-methylation caller at any version, so this is
# the screen the published files support, labelled as one.
- title: Group comparison
  subtitle: Every 10 kb window tested between the cohort's two arms, arcsine-transformed and BH-corrected
  tab_order: 7
  tab_icon: mdi:scale-balance
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Comparison scope
    icon: mdi:tune
    color: grape
    description: Narrow the tested windows by contig, call and effect size
  grid_sections:
  - name: Window comparison
    icon: mdi:scale-balance
    color: grape
    description: Effect size against significance, and the same windows along the genome
  - name: Effect size distribution
    icon: mdi:chart-bar
    color: violet
    description: How the differences are spread, and the windows behind them
  components:
  # -------------------------------------------------------- the comparison
  - component_type: text
    tag: ms-gc-intro
    section: Window comparison
    title: What this comparison is, and is not
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Every 10 kb window, tested between the cohort's two arms with a pooled
      t-test on the arcsine square-root transform of its methylation proportion,
      then Benjamini-Hochberg corrected. The unit is a window, not a CpG and not
      a called DMR: a significant window is a region worth looking at, not one a
      caller has delimited. With three libraries against four the screen is
      low-powered by construction, and on this megatest a single window clears
      both cut-offs, which is the honest answer rather than a missing panel.
      Per-CpG coverage counts would allow a beta-binomial model instead, and
      this 2.3.0 run does not publish them.
    workflow_tag: methylseq
    data_collection_tag: bismark_window_group_compare
    layout: {x: 0, y: 0, w: 8, h: 3}
  - component_type: card
    tag: ms-gc-card-delta
    index: ms-gc-card-delta
    section: Window comparison
    workflow_tag: methylseq
    data_collection_tag: bismark_window_group_compare
    use: bismark/window_group_compare
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: delta_methylation
    column_type: float64
    display: {icon_name: 'mdi:scale-balance', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Methylation difference
    layout: {x: 0, y: 3, w: 2, h: 2}
  - component_type: card
    tag: ms-gc-card-direction
    index: ms-gc-card-direction
    section: Window comparison
    workflow_tag: methylseq
    data_collection_tag: bismark_window_group_compare
    use: bismark/window_group_compare
    aggregation: count
    column_name: direction
    column_type: object
    secondary_layout: donut
    breakdown_col: direction
    display: {icon_name: 'mdi:chart-donut', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Windows by call
    layout: {x: 2, y: 3, w: 2, h: 2}
  - component_type: card
    tag: ms-gc-card-contig
    index: ms-gc-card-contig
    section: Window comparison
    workflow_tag: methylseq
    data_collection_tag: bismark_window_group_compare
    use: bismark/window_group_compare
    aggregation: nunique
    column_name: window_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: chromosome
    top_n_count: 3
    display: {icon_name: 'mdi:dna', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Windows tested
    layout: {x: 4, y: 3, w: 2, h: 2}
  - component_type: card
    tag: ms-gc-card-padj
    index: ms-gc-card-padj
    section: Window comparison
    workflow_tag: methylseq
    data_collection_tag: bismark_window_group_compare
    use: bismark/window_group_compare
    aggregation: max
    aggregations: [box_plot_stats]
    secondary_layout: histogram
    column_name: neg_log10_padj
    column_type: float64
    display: {icon_name: 'mdi:chart-bar', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Strongest call
    layout: {x: 6, y: 3, w: 2, h: 2}
  - component_type: advanced_viz
    tag: ms-gc-av-volcano
    index: ms-gc-av-volcano
    section: Window comparison
    workflow_tag: methylseq
    data_collection_tag: bismark_window_group_compare
    use: bismark/window_volcano
    config:
      controls_placement: header
      view: volcano
      views: [volcano, qq]
      p_value_col: p_value
      significance_threshold: 0.05
      effect_threshold: 10.0
      top_n_labels: 10
      show_labels: true
    title: Window methylation difference against significance
    description: Difference in percentage points on x, adjusted significance on y; the cut-offs drawn are 0.05 and ten points.
    title_size: h3
    layout: {x: 0, y: 5, w: 8, h: 7}
  - component_type: advanced_viz
    tag: ms-gc-av-manhattan
    index: ms-gc-av-manhattan
    section: Window comparison
    workflow_tag: methylseq
    data_collection_tag: bismark_window_group_compare
    use: bismark/window_manhattan
    config:
      score_kind: "-log10(padj)"
      score_threshold: 1.3
      selection_enabled: true
      selection_column: chromosome
      top_n_labels: 10
    title: The same windows along the genome
    description: Every tested window on its contig; the line is padj 0.05. A cluster of near-threshold windows on one contig is worth more than a lone hit.
    title_size: h3
    layout: {x: 0, y: 12, w: 8, h: 7}

  # ------------------------------------------------------ effect size spread
  - component_type: text
    tag: ms-gc-spread-intro
    section: Effect size distribution
    title: How far apart the arms actually are
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The distribution of the per-window difference, split by the call. A screen
      whose histogram is a single mode centred on zero has found no systematic
      shift, whatever its most significant window says; a shoulder on one side
      is what a real difference looks like before any test.
    workflow_tag: methylseq
    data_collection_tag: bismark_window_group_compare
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: ms-gc-fig-histogram
    section: Effect size distribution
    workflow_tag: methylseq
    data_collection_tag: bismark_window_group_compare
    use: bismark/window_group_compare
    visu_type: histogram
    dict_kwargs: {x: delta_methylation, color: direction}
    title: Distribution of the per-window difference
    description: Difference in percentage points between the two arms, coloured by the call the window received.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: table
    tag: ms-gc-table
    section: Effect size distribution
    workflow_tag: methylseq
    data_collection_tag: bismark_window_group_compare
    use: bismark/window_group_compare
    row_selection_enabled: true
    row_selection_column: window_id
    title: Tested windows
    description: Every window with its two group means, the difference, the statistic and the adjusted p, sorted by significance.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 9, w: 8, h: 7}

  # ----------------------------------------------------------- tab filters
  - component_type: interactive
    tag: ms-gc-filter-contig
    index: ms-gc-contig-filter
    section: Comparison scope
    group: Comparison scope
    workflow_tag: methylseq
    data_collection_tag: bismark_window_group_compare
    interactive_component_type: MultiSelect
    column_name: chromosome
    column_type: object
    display: {title_size: md, custom_color: '#AB47BC', icon_name: 'mdi:dna'}
    placement: left
    title: Contig
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: ms-gc-filter-direction
    index: ms-gc-direction-filter
    section: Comparison scope
    group: Comparison scope
    workflow_tag: methylseq
    data_collection_tag: bismark_window_group_compare
    interactive_component_type: Select
    column_name: direction
    column_type: object
    display: {title_size: md, custom_color: '#AB47BC', icon_name: 'mdi:scale-balance'}
    placement: left
    title: Call
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: ms-gc-filter-delta
    index: ms-gc-delta-range
    section: Comparison scope
    group: Comparison scope
    workflow_tag: methylseq
    data_collection_tag: bismark_window_group_compare
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: delta_methylation
    column_type: float64
    display: {title_size: md, custom_color: '#AB47BC', icon_name: 'mdi:ruler'}
    placement: left
    title: Methylation difference
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: ms-gc-filter-padj
    index: ms-gc-padj-range
    section: Comparison scope
    group: Comparison scope
    workflow_tag: methylseq
    data_collection_tag: bismark_window_group_compare
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: padj
    column_type: float64
    display: {title_size: md, custom_color: '#AB47BC', icon_name: 'mdi:filter-variant'}
    placement: left
    title: Adjusted p
    layout: {x: 0, y: 9, w: 1, h: 3}

# ============================================================================
# Features and metagenes
# ============================================================================
# Gated on an annotation asset the template does not bundle. What can be said
# without one is said here, with the proxy named plainly.
- title: Features and metagenes
  subtitle: Methylation by CpG-density class, the annotation-free stand-in for a CpG-island panel
  tab_order: 8
  tab_icon: mdi:map-marker-outline
  tab_icon_color: lime
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Feature scope
    icon: mdi:filter-variant
    color: lime
    description: Pick the CpG-density class and the contigs the feature panels read
  grid_sections:
  - name: CpG density classes
    icon: mdi:shape-outline
    color: lime
    description: Windows split into CpG-poor, intermediate and CpG-dense tertiles
  - name: What an annotation would add
    icon: mdi:information-outline
    color: gray
    description: The panels this tab is waiting on, and the asset they need
  components:
  # ------------------------------------------------------- density classes
  - component_type: text
    tag: ms-feat-intro
    section: CpG density classes
    title: A CpG-island panel without a CpG-island annotation
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      nf-core/methylseq bundles no CpG-island or TSS annotation at any version,
      so the question a reader asks next, is this window an island or the bulk
      genome, has no annotated answer here. CpG density is the property an
      island is defined by, so the tertiles of the CpG count per 10 kb window
      are the annotation-free stratification of the same axis. It is a proxy and
      it is named as one: a CpG-dense window is island-like, not an island.
    workflow_tag: methylseq
    data_collection_tag: bismark_binned_methylation
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ms-feat-card-donut
    index: ms-feat-card-donut
    section: CpG density classes
    workflow_tag: methylseq
    data_collection_tag: bismark_binned_methylation
    use: bismark/binned_methylation
    aggregation: count
    column_name: methylation_pct
    column_type: float64
    secondary_layout: donut
    breakdown_col: cpg_density_class
    display: {icon_name: 'mdi:chart-donut', icon_color: '#7CB342', title_color: '#7CB342', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Windows by density class
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ms-feat-card-level
    index: ms-feat-card-level
    section: CpG density classes
    workflow_tag: methylseq
    data_collection_tag: bismark_binned_methylation
    use: bismark/binned_methylation
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: methylation_pct
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Methylation in the picked class
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ms-feat-card-cpgs
    index: ms-feat-card-cpgs
    section: CpG density classes
    workflow_tag: methylseq
    data_collection_tag: bismark_binned_methylation
    use: bismark/binned_methylation
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: n_cpg
    column_type: int64
    display: {icon_name: 'mdi:counter', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: CpGs per window
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ms-feat-card-topn
    index: ms-feat-card-topn
    section: CpG density classes
    workflow_tag: methylseq
    data_collection_tag: bismark_binned_methylation
    use: bismark/binned_methylation
    aggregation: sum
    column_name: n_cpg
    column_type: int64
    secondary_layout: top_n
    breakdown_col: cpg_density_class
    top_n_count: 3
    display: {icon_name: 'mdi:shape-outline', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: CpGs by class
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: figure
    tag: ms-feat-fig-box
    section: CpG density classes
    workflow_tag: methylseq
    data_collection_tag: bismark_binned_methylation
    use: bismark/binned_methylation
    visu_type: box
    dict_kwargs: {x: cpg_density_class, y: methylation_pct, color: cpg_density_class, title: Methylation by CpG-density class}
    title: Methylation by CpG-density class
    description: The island-like end of the axis should sit well below the CpG-poor bulk; that gap is the signal a real annotation would sharpen.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 7}
  - component_type: table
    tag: ms-feat-table
    section: CpG density classes
    workflow_tag: methylseq
    data_collection_tag: bismark_binned_methylation
    use: bismark/binned_methylation
    row_selection_enabled: false
    title: Binned windows
    description: Every kept window with its contig, coordinates, methylation, CpG count and density class.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 11, w: 8, h: 7}

  # ------------------------------------------------------------ what is next
  - component_type: text
    tag: ms-feat-gate
    section: What an annotation would add
    title: The asset this tab is waiting on
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      With a bundled GRCh38 CpG-island and TSS annotation, three panels become
      possible and none of them needs a new pipeline run: methylation by feature
      class (island, shore, shelf, open sea), a TSS metagene as a profile over
      the signed distance to the transcription start site, and the same metagene
      as a signal matrix, one row per promoter. All three read the per-CpG
      bedGraph this tab's windows already come from, so the work is the asset
      and the interval join, not the data.
    workflow_tag: methylseq
    data_collection_tag: bismark_binned_methylation
    layout: {x: 0, y: 0, w: 8, h: 2}

