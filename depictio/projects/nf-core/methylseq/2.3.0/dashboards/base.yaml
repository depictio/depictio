# ============================================================================
# Coverage
# ============================================================================
# Qualimap BamQC read at full resolution rather than as a MultiQC picture: the
# per-library depth summary, the depth along the reference, and the two curves
# that say whether a shallow library is spread or piled.
- title: Coverage
  subtitle: How deep and how evenly the deduplicated alignments cover the reference
  tab_order: 4
  tab_icon: mdi:chart-line
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Coverage scope
    icon: mdi:tune
    color: cyan
    description: Pick the contigs and the depth range the coverage panels read
  grid_sections:
  - name: Depth summary
    icon: mdi:counter
    color: cyan
    description: Qualimap's per-library depth, mapping quality, error rate and duplication
  - name: Depth along the reference
    icon: mdi:chart-line
    color: blue
    description: Windowed depth mapped back onto its contig, one lane per library
  - name: Depth distribution
    icon: mdi:chart-bell-curve
    color: teal
    description: How many bases sit at each depth, and how much of the reference clears a threshold
  components:
  # ---------------------------------------------------------- depth summary
  - component_type: text
    tag: ms-cov-intro
    section: Depth summary
    title: What Qualimap measured on the deduplicated BAMs
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [Qualimap](http://qualimap.conesalab.org/) BamQC, one row per library.
      Mean depth here is over the whole reference including the bases at zero,
      so a whole-genome bisulfite run at these read counts is under 1X on
      average and the interesting number is the genome fraction further down,
      not the mean. GC content near 20 % is the bisulfite conversion showing up
      in the mapped bases, not a contamination.
    workflow_tag: methylseq
    data_collection_tag: qualimap_bamqc_genome_results
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ms-cov-card-mean
    index: ms-cov-card-mean
    section: Depth summary
    workflow_tag: methylseq
    data_collection_tag: qualimap_bamqc_genome_results
    use: qualimap/bamqc_genome_results
    aggregation: average
    column_name: mean_coverage
    column_type: float64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:chart-line', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mean depth
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ms-cov-card-dup
    index: ms-cov-card-dup
    section: Depth summary
    workflow_tag: methylseq
    data_collection_tag: qualimap_bamqc_genome_results
    use: qualimap/bamqc_genome_results
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: duplication_rate
    column_type: float64
    display: {icon_name: 'mdi:chart-donut', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Duplication rate
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ms-cov-card-mapq
    index: ms-cov-card-mapq
    section: Depth summary
    workflow_tag: methylseq
    data_collection_tag: qualimap_bamqc_genome_results
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: mean_mapping_quality
    column_type: float64
    display: {icon_name: 'mdi:check-decagram', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mean MAPQ
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ms-cov-card-gc
    index: ms-cov-card-gc
    section: Depth summary
    workflow_tag: methylseq
    data_collection_tag: qualimap_bamqc_genome_results
    use: qualimap/bamqc_genome_results
    aggregation: average
    column_name: gc_percentage
    column_type: float64
    secondary_layout: donut
    breakdown_col: sample
    display: {icon_name: 'mdi:chart-donut', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: GC of mapped bases
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: table
    tag: ms-cov-table-bamqc
    section: Depth summary
    workflow_tag: methylseq
    data_collection_tag: qualimap_bamqc_genome_results
    use: qualimap/bamqc_genome_results
    row_selection_enabled: false
    title: Qualimap BamQC summary
    description: Depth, mapping quality, error rate, GC and duplication, one row per library.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 4, w: 8, h: 3}

  # ------------------------------------------------- depth along the genome
  - component_type: text
    tag: ms-cov-track-intro
    section: Depth along the reference
    title: Where the reads landed
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Qualimap reports depth in windows along the concatenated reference; the
      recipe maps each window back onto its contig using the per-contig lengths
      in the same run's genome_results.txt, so the track below reads as a
      genome. Use the contig filter on the left to drop the unplaced scaffolds.
    workflow_tag: methylseq
    data_collection_tag: qualimap_coverage_across_reference
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: ms-cov-av-track
    index: ms-cov-av-track
    section: Depth along the reference
    workflow_tag: methylseq
    data_collection_tag: qualimap_coverage_across_reference
    use: qualimap/reference_coverage_track
    config:
      facet_by_sample: true
      view_mode: facet
      smoothing_window: 0
      color_by: sample
    title: Read depth along the reference
    description: One lane per library; a lane that is flat at zero over a whole contig is a reference the library never reached.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 9}
  - component_type: figure
    tag: ms-cov-fig-global
    section: Depth along the reference
    workflow_tag: methylseq
    data_collection_tag: qualimap_coverage_across_reference
    use: qualimap/coverage_across_reference
    visu_type: line
    dict_kwargs: {x: global_position, y: coverage, color: sample, title: Depth along the concatenated reference}
    title: Depth along the concatenated reference
    description: The same windows on Qualimap's own coordinate, which lines two libraries up regardless of the contig map.
    title_size: h3
    layout: {x: 0, y: 10, w: 8, h: 7}

  # ----------------------------------------------------- depth distribution
  - component_type: text
    tag: ms-cov-dist-intro
    section: Depth distribution
    title: Spread or piled
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The two curves a shallow whole-genome library is actually judged on. The
      histogram says how many bases sit at each depth; the genome-fraction curve
      says how much of the reference clears a given threshold, which is the
      number that separates a library spread thinly over the genome from one
      piled on a tenth of it.
    workflow_tag: methylseq
    data_collection_tag: qualimap_coverage_histogram
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: ms-cov-av-histogram
    index: ms-cov-av-histogram
    section: Depth distribution
    workflow_tag: methylseq
    data_collection_tag: qualimap_coverage_histogram
    use: qualimap/depth_histogram_profile
    config:
      x_title: Depth (X)
      y_title: Share of the reference
      log_y: true
      legend_pos: right
      selection_enabled: true
      selection_column: sample
    title: Bases of the reference at each depth
    description: One curve per library, on a log y axis because the zero-depth bucket is most of the genome.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: advanced_viz
    tag: ms-cov-av-fraction
    index: ms-cov-av-fraction
    section: Depth distribution
    workflow_tag: methylseq
    data_collection_tag: qualimap_genome_fraction_coverage
    use: qualimap/genome_fraction_profile
    config:
      x_title: Minimum depth (X)
      y_title: "% of the reference covered"
      legend_pos: right
      selection_enabled: true
      selection_column: sample
    title: Share of the reference covered at least X deep
    description: Where the curves separate is where the libraries stop being comparable for a per-site call.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 7}

  # ----------------------------------------------------------- tab filters
  - component_type: interactive
    tag: ms-cov-filter-contig
    index: ms-cov-contig-filter
    section: Coverage scope
    group: Genomic scope
    workflow_tag: methylseq
    data_collection_tag: qualimap_coverage_across_reference
    interactive_component_type: MultiSelect
    column_name: chromosome
    column_type: object
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:dna'}
    placement: left
    title: Contig
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: ms-cov-filter-depth
    index: ms-cov-depth-range
    section: Coverage scope
    group: Genomic scope
    workflow_tag: methylseq
    data_collection_tag: qualimap_genome_fraction_coverage
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: min_coverage
    column_type: int64
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:chart-line'}
    placement: left
    title: Depth threshold
    layout: {x: 0, y: 3, w: 1, h: 3}

# ============================================================================
# Bias and context
# ============================================================================
# Whether the calls themselves can be trusted: the methylation level in each
# cytosine context, and the read-position bias that decides whether the
# extraction window needs an --ignore trim.
- title: Bias and context
  subtitle: Methylation level per cytosine context, and the read-position bias behind the extraction call
  tab_order: 5
  tab_icon: mdi:chart-bell-curve
  tab_icon_color: pink
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Context and read
    icon: mdi:filter-variant
    color: pink
    description: Pick the cytosine context, the read and the read positions the M-bias explorer draws
  grid_sections:
  - name: Methylation by context
    icon: mdi:chart-donut
    color: grape
    description: CpG, CHG and CHH methylation levels after deduplication and extraction
  - name: CpG M-bias
    icon: mdi:chart-bell-curve
    color: pink
    description: Whether the extraction window needs an --ignore or --ignore_r2 trim
  - name: M-bias in every context
    icon: mdi:chart-timeline-variant
    color: red
    description: The same curve in all three contexts and both reads, driven by the filters on the left
  components:
  # ----------------------------------------------------- methylation context
  - component_type: text
    tag: ms-meth-intro
    section: Methylation by context
    title: Methylation level by cytosine context
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The extractor's "Final Cytosine Methylation Report", one row per library
      per context. CpG is where mammalian methylation concentrates; CHG and
      CHH sitting near zero is the usual bisulfite-conversion sanity check,
      not signal.
    workflow_tag: methylseq
    data_collection_tag: bismark_methylation_context_summary
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: ms-meth-card-donut
    index: ms-meth-card-donut
    section: Methylation by context
    workflow_tag: methylseq
    data_collection_tag: bismark_methylation_context_summary
    use: bismark/methylation_context_summary
    aggregation: average
    column_name: pct_methylated
    column_type: float64
    secondary_layout: donut
    breakdown_col: context
    display: {icon_name: 'mdi:chart-donut', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Methylation by context
    layout: {x: 0, y: 1, w: 2, h: 2}
  - component_type: card
    tag: ms-meth-card-box
    index: ms-meth-card-box
    section: Methylation by context
    workflow_tag: methylseq
    data_collection_tag: bismark_methylation_context_summary
    use: bismark/methylation_context_summary
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: pct_methylated
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: "% methylated (spread)"
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: ms-meth-card-topn
    index: ms-meth-card-topn
    section: Methylation by context
    workflow_tag: methylseq
    data_collection_tag: bismark_methylation_context_summary
    use: bismark/methylation_context_summary
    aggregation: sum
    column_name: methylated_c
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Methylated cytosines
    layout: {x: 4, y: 1, w: 2, h: 2}
  - component_type: card
    tag: ms-meth-card-hist
    index: ms-meth-card-hist
    section: Methylation by context
    workflow_tag: methylseq
    data_collection_tag: bismark_methylation_context_summary
    use: bismark/methylation_context_summary
    aggregation: sum
    column_name: unmethylated_c
    column_type: int64
    secondary_layout: histogram
    display: {icon_name: 'mdi:database-outline', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Unmethylated cytosines
    layout: {x: 6, y: 1, w: 2, h: 2}
  - component_type: figure
    tag: ms-meth-fig-context
    section: Methylation by context
    workflow_tag: methylseq
    data_collection_tag: bismark_methylation_context_summary
    use: bismark/methylation_context_summary
    visu_type: bar
    dict_kwargs: {x: sample, y: pct_methylated, color: context, title: "% methylated cytosines by context"}
    title: "% methylated cytosines by context"
    description: CpG, CHG and CHH side by side for every library.
    title_size: h3
    layout: {x: 0, y: 3, w: 8, h: 7}
  - component_type: table
    tag: ms-meth-table
    section: Methylation by context
    workflow_tag: methylseq
    data_collection_tag: bismark_methylation_context_summary
    use: bismark/methylation_context_summary
    row_selection_enabled: true
    title: Methylation by context
    description: Methylated and unmethylated cytosine counts and the percentage, one row per library per context.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 10, w: 8, h: 5}

  # ------------------------------------------------------------ CpG M-bias
  - component_type: text
    tag: ms-mbias-intro
    section: CpG M-bias
    title: Read-position methylation bias, CpG context
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      % methylation at each read position. A curve that has not flattened out
      by the end of the read is Bismark's own advice to add an `--ignore` or
      `--ignore_r2` trim and re-extract; a flat curve needs none. This tile is
      CpG only and deliberately unfiltered by the context selector, because it
      is the curve the extraction decision turns on.
    workflow_tag: methylseq
    data_collection_tag: bismark_mbias_curve
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: ms-mbias-av-curve
    index: ms-mbias-av-curve
    section: CpG M-bias
    workflow_tag: methylseq
    data_collection_tag: bismark_mbias_curve
    use: bismark/mbias_cpg_profile
    config:
      x_title: Position in read (bp)
      y_title: "% methylation (CpG)"
      selection_enabled: true
      selection_column: sample
      legend_pos: right
    title: CpG M-bias, read 1 and read 2
    description: One line per library per read; a curve that has not flattened by the read's end argues for an --ignore trim.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: table
    tag: ms-mbias-table
    section: CpG M-bias
    workflow_tag: methylseq
    data_collection_tag: bismark_mbias_curve
    use: bismark/mbias_curve
    row_selection_enabled: false
    title: CpG M-bias, raw positions
    description: "% methylation and coverage at every read position, CpG context."
    title_size: h3
    title_align: left
    layout: {x: 0, y: 9, w: 8, h: 7}

  # ------------------------------------------------- M-bias, every context
  - component_type: text
    tag: ms-mbias-all-intro
    section: M-bias in every context
    title: The same curve in every context
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      All six tables Bismark writes into the M-bias file, with the context and
      the read as filters on the left rather than as six separate tiles. The CHH
      panel is the read-position view of bisulfite conversion: a CHH curve that
      climbs at the 5' end says the first bases of the read are not converting,
      which the run-level conversion percentage averages away.
    workflow_tag: methylseq
    data_collection_tag: bismark_mbias_all_contexts
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ms-mbias-all-card-box
    index: ms-mbias-all-card-box
    section: M-bias in every context
    workflow_tag: methylseq
    data_collection_tag: bismark_mbias_all_contexts
    use: bismark/mbias_all_contexts
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: pct_methylation
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: "% methylation (spread)"
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ms-mbias-all-card-coverage
    index: ms-mbias-all-card-coverage
    section: M-bias in every context
    workflow_tag: methylseq
    data_collection_tag: bismark_mbias_all_contexts
    use: bismark/mbias_all_contexts
    aggregation: sum
    column_name: coverage
    column_type: int64
    secondary_layout: top_n
    breakdown_col: context
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Calls behind the curves
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ms-mbias-all-card-donut
    index: ms-mbias-all-card-donut
    section: M-bias in every context
    workflow_tag: methylseq
    data_collection_tag: bismark_mbias_all_contexts
    aggregation: average
    column_name: pct_methylation
    column_type: float64
    secondary_layout: donut
    breakdown_col: context
    display: {icon_name: 'mdi:chart-donut', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Level by context
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ms-mbias-all-card-read
    index: ms-mbias-all-card-read
    section: M-bias in every context
    workflow_tag: methylseq
    data_collection_tag: bismark_mbias_all_contexts
    aggregation: average
    column_name: pct_methylation
    column_type: float64
    secondary_layout: composition
    breakdown_col: read
    display: {icon_name: 'mdi:scale-balance', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Read 1 against read 2
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: ms-mbias-all-av-curve
    index: ms-mbias-all-av-curve
    section: M-bias in every context
    workflow_tag: methylseq
    data_collection_tag: bismark_mbias_all_contexts
    use: bismark/mbias_context_profile
    config:
      x_title: Position in read (bp)
      y_title: "% methylation"
      selection_enabled: true
      selection_column: sample
      legend_pos: right
    title: M-bias by context and read
    description: One curve per library, context and read; narrow with the context and read filters on the left to read a single panel.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 7}
  - component_type: figure
    tag: ms-mbias-all-fig-facets
    section: M-bias in every context
    workflow_tag: methylseq
    data_collection_tag: bismark_mbias_all_contexts
    visu_type: line
    dict_kwargs: {x: position, y: pct_methylation, color: sample, facet_col: context, facet_row: read, title: M-bias per context and read}
    title: M-bias per context, one panel per context and read
    description: Bismark's own M-bias layout, CpG, CHG and CHH side by side with read 1 above read 2; on one shared 0 to 100 scale, so CpG near 85 % and CHG and CHH near zero read at a glance.
    title_size: h3
    layout: {x: 0, y: 11, w: 8, h: 9}
  - component_type: table
    tag: ms-mbias-all-table
    section: M-bias in every context
    workflow_tag: methylseq
    data_collection_tag: bismark_mbias_all_contexts
    use: bismark/mbias_all_contexts
    row_selection_enabled: false
    title: M-bias, every context and read
    description: "% methylation and coverage at every read position, in all three contexts."
    title_size: h3
    title_align: left
    layout: {x: 0, y: 20, w: 8, h: 7}

  # ----------------------------------------------------------- tab filters
  - component_type: interactive
    tag: ms-mbias-filter-context
    index: ms-mbias-context-filter
    section: Context and read
    group: M-bias panel
    workflow_tag: methylseq
