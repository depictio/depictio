# ============================================================================
# Alignment and duplication
# ============================================================================
# The exact per-sample counts behind the MultiQC Bismark bar plots: pairs
# analysed and mapping efficiency, then alignments examined and the
# duplication rate.
- title: Alignment and duplication
  subtitle: The exact per-library counts behind Bismark's alignment and deduplication plots
  tab_order: 3
  tab_icon: mdi:dna
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Alignment scope
    icon: mdi:tune
    color: indigo
    description: Narrow to the libraries in a given size or duplication band
  grid_sections:
  - name: Alignment summary
    icon: mdi:chart-bar
    color: indigo
    description: Pairs analysed and the mapping efficiency Bismark itself reports
  - name: Deduplication summary
    icon: mdi:chart-donut
    color: violet
    description: Alignments examined, duplicates removed and what carries into methylation extraction
  components:
  # ----------------------------------------------------------- alignment
  - component_type: text
    tag: ms-aln-intro
    section: Alignment summary
    title: How much of each library aligned
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Bismark's "Final Alignment report", one row per library: sequence pairs
      analysed, the unique-best-hit count, mapping efficiency, and how many
      pairs never aligned or mapped to more than one place. Bisulfite alignment
      searches four converted genomes instead of one, so an efficiency in the
      seventies or eighties is the expected ceiling, not a failure.
    workflow_tag: methylseq
    data_collection_tag: bismark_alignment_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ms-aln-card-eff
    index: ms-aln-card-eff
    section: Alignment summary
    workflow_tag: methylseq
    data_collection_tag: bismark_alignment_summary
    use: bismark/alignment_summary
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: mapping_efficiency_pct
    column_type: float64
    display: {icon_name: 'mdi:chart-line', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mapping efficiency
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ms-aln-card-eff-threshold
    index: ms-aln-card-eff-threshold
    section: Alignment summary
    workflow_tag: methylseq
    data_collection_tag: bismark_alignment_summary
    use: bismark/alignment_summary
    aggregation: average
    column_name: mapping_efficiency_pct
    column_type: float64
    secondary_layout: threshold
    threshold_value: 60.0
    threshold_direction: min
    threshold_warn: 70.0
    display: {icon_name: 'mdi:shield-check-outline', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mapping efficiency floor
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ms-aln-card-pairs
    index: ms-aln-card-pairs
    section: Alignment summary
    workflow_tag: methylseq
    data_collection_tag: bismark_alignment_summary
    use: bismark/alignment_summary
    aggregation: sum
    column_name: pairs_analysed
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Pairs analysed
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ms-aln-card-noalign
    index: ms-aln-card-noalign
    section: Alignment summary
    workflow_tag: methylseq
    data_collection_tag: bismark_alignment_summary
    use: bismark/alignment_summary
    aggregation: sum
    column_name: no_alignment
    column_type: int64
    secondary_layout: histogram
    display: {icon_name: 'mdi:alert-outline', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Pairs with no alignment
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: figure
    tag: ms-aln-fig-eff
    section: Alignment summary
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    use: bismark/summary_report
    visu_type: bar
    dict_kwargs: {x: sample, y: pct_aligned, color: cell_line, title: Alignment yield per library}
    title: Alignment yield per library
    description: The share of reads with a unique best alignment, coloured by the factor the cohort compares rather than by the library's own name.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 7}
  - component_type: table
    tag: ms-aln-table
    section: Alignment summary
    workflow_tag: methylseq
    data_collection_tag: bismark_alignment_summary
    use: bismark/alignment_summary
    row_selection_enabled: true
    title: Alignment summary
    description: Every field of Bismark's alignment report, one row per library.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 11, w: 8, h: 3}

  # --------------------------------------------------------- deduplication
  - component_type: text
    tag: ms-dedup-intro
    section: Deduplication summary
    title: PCR duplicates removed before methylation extraction
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      `deduplicate_bismark`'s report, one row per library: alignments examined,
      duplicates removed and the leftover count that methylation extraction
      actually runs on. A duplication rate far above the run's median is the
      usual sign of a library sequenced past its complexity, and the bulk sample
      of this megatest is exactly that.
    workflow_tag: methylseq
    data_collection_tag: bismark_deduplication_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
