version: 1
# nf-core/methylseq 2.3.0 reference dashboard (Bismark route).
#
# The funnel, tab by tab: the reprocessed MultiQC report (every module, as
# MultiQC draws it) -> the run's own numbers, read to methylome, with the
# alignment, duplication and conversion floors -> how deep and how even the
# coverage is -> whether the extraction needs a read-position trim -> the
# methylome as a whole (per-CpG shape, CpG-density classes, library structure)
# -> the comparison the cohort was sequenced for, then one locus of it.
#
# The design is a variable, never parsed from sample names: METADATA_FILE's
# factors reach the `samples` hub, and `{GROUP_COL}` / `{GROUP_COL_DISPLAY}`
# below are the factor the dashboards colour and filter by. The sample and
# design filters in the left panel reach the MultiQC panels and every
# per-library collection through the project links. Each tab adds its own
# non-persistent filters on its own columns.
#
# The MultiQC tab holds MultiQC panels only, plus the two pinned sections
# (the glance strip and the sample sheet) every tab carries.
#
# Genome coverage is Qualimap's, not Bismark's: the Coverage tab binds
# `depictio/catalog/qualimap/`, owned by nf-core/eager, and does not recreate it.
#
# The MultiQC report bound here was re-generated with MultiQC 1.35 from the
# run's raw tool outputs; the run itself published MultiQC 1.13, which writes
# no parquet. Module and plot names are therefore the 1.35 ones.
main_dashboard:
  title: nf-core/methylseq
  subtitle: Bisulfite sequencing with Bismark, from read QC to the methylome and a window-level group comparison
  project_tag: Bisulfite Methylation Profiling
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab through the project links
    persistent: true
    pin: top
  - name: QC thresholds
    icon: mdi:tune
    color: cyan
    description: Mapping efficiency, duplication and conversion floors on the per-library summaries
    collapsed: true
    persistent: true
    pin: bottom
  - name: Glance scope
    icon: mdi:tune
    color: orange
    description: CpG methylation window on the per-library summary the pinned glance strip reads
  grid_sections:
  # Pinned to the top and carried by every tab: the four numbers that size the
  # run and its design. Cards are legal on the MultiQC tab only inside a pinned
  # persistent section, which is exactly what this is.
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: The run and its design in four numbers, on every tab
    persistent: true
    pin: top
  # Pinned to the top and carried by every tab: the design the whole
  # dashboard is filtered by should be one collapse away wherever the viewer
  # lands.
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The sample hub every other tab is filtered by
    collapsed: true
    persistent: true
    pin: top
  - name: MultiQC general statistics
    icon: mdi:view-dashboard-outline
    color: blue
    description: One row per sample, pooling the headline numbers of every module
  - name: Read quality
    icon: mdi:chart-bell-curve
    color: blue
    description: Every FastQC panel on the raw libraries
  - name: Trimming
    icon: mdi:ruler
    color: indigo
    description: What Trim Galore (Cutadapt underneath) removed before Bismark saw the reads
  - name: Bisulfite alignment
    icon: mdi:dna
    color: indigo
    description: Bismark's own alignment, strand, deduplication, methylation and M-bias plots
  - name: Coverage
    icon: mdi:chart-line
    color: cyan
    description: Qualimap BamQC coverage, insert size and GC content, the panel nf-core/eager also binds
  components:
  # ------------------------------------------------------------- at a glance
  - component_type: card
    tag: ms-glance-card-design
    index: ms-glance-card-design
    section: Run at a glance
    workflow_tag: methylseq
    data_collection_tag: samples
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: donut
    breakdown_col: '{GROUP_COL}'
    display: {icon_name: 'mdi:test-tube', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Samples by {GROUP_COL_DISPLAY}
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: ms-glance-card-funnel
    index: ms-glance-card-funnel
    section: Run at a glance
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    use: bismark/summary_report
    aggregation: sum
    column_name: total_reads
    column_type: int64
    secondary_layout: attrition
    attrition_cols: [aligned_reads, unique_reads, cpgs_called]
    display: {icon_name: 'mdi:counter', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Reads to CpG calls
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: ms-glance-card-cpg
    index: ms-glance-card-cpg
    section: Run at a glance
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    use: bismark/summary_report
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: pct_cpg_methylation
    column_type: float64
    display: {icon_name: 'mdi:dna', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: CpG methylation
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: ms-glance-card-conversion
    index: ms-glance-card-conversion
    section: Run at a glance
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    use: bismark/summary_report
    aggregation: min
    secondary_layout: gauge
    coverage_max: 100
    column_name: conversion_efficiency_pct
    column_type: float64
    display: {icon_name: 'mdi:shield-check-outline', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Lowest conversion efficiency
    layout: {x: 6, y: 0, w: 2, h: 2}

  # ------------------------------------------------------------ sample sheet
  - component_type: text
    tag: ms-sheet-intro
    section: Sample sheet
    title: The design behind every panel
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per sample: its FASTQ pair and the design factors of the table
      the run was ingested with. The sample and {GROUP_COL_DISPLAY} filters in
      the left panel are sourced on it, so it is what narrows every other tab.
    workflow_tag: methylseq
    data_collection_tag: samples
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: ms-sheet-table-samples
    section: Sample sheet
    workflow_tag: methylseq
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample_id
    title: Sample hub
    description: One row per sample, with its FASTQ paths and its design factors.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 3}

  # ------------------------------------------------------ general statistics
  - component_type: text
    tag: ms-qc-intro
    section: MultiQC general statistics
    title: A methylseq run, from reads to methylation
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The reprocessed [MultiQC](https://multiqc.info) report: general
      statistics, every read-quality panel, Bismark's own plots and Qualimap
      coverage. Exact per-library counts, the methylome itself and the group
      comparison are on the five tabs beside this one.
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: ms-qc-general-stats
    section: MultiQC general statistics
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    title: General statistics
    description: One row per sample, pooling the FastQC, Cutadapt, Bismark and Qualimap headline numbers.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 5}

  # ------------------------------------------------------------ read quality
  - component_type: text
    tag: ms-qc-reads-intro
    section: Read quality
    title: Raw reads, every FastQC panel
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/) on
      the raw libraries. A bisulfite library legitimately fails the per-base
      sequence content and GC checks, because converting unmethylated cytosines
      to thymines is the point; read the quality, length and adapter panels
      instead.
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: ms-qc-fastqc-counts
    section: Read quality
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Counts
    use: multiqc/fastqc
    title: Sequence counts
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: ms-qc-fastqc-quality
    section: Read quality
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    use: multiqc/fastqc
    title: Per-base sequence quality
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: ms-qc-fastqc-perseq-quality
    section: Read quality
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Per Sequence Quality Scores
    use: multiqc/fastqc
    title: Per-sequence quality scores
    title_size: sm
    title_align: left
    layout: {x: 0, y: 6, w: 4, h: 5}
  - component_type: multiqc
    tag: ms-qc-fastqc-gc
    section: Read quality
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Per Sequence GC Content
    use: multiqc/fastqc
    title: GC content
    title_size: sm
    title_align: left
    layout: {x: 4, y: 6, w: 4, h: 5}
  - component_type: multiqc
    tag: ms-qc-fastqc-ncontent
    section: Read quality
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Per Base N Content
    use: multiqc/fastqc
    title: Per-base N content
    title_size: sm
    title_align: left
    layout: {x: 0, y: 11, w: 4, h: 5}
  - component_type: multiqc
    tag: ms-qc-fastqc-length
    section: Read quality
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Length Distribution
    use: multiqc/fastqc
    title: Sequence length distribution
    title_size: sm
    title_align: left
    layout: {x: 4, y: 11, w: 4, h: 5}
  - component_type: multiqc
    tag: ms-qc-fastqc-duplication
    section: Read quality
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Duplication Levels
    use: multiqc/fastqc
    title: Sequence duplication levels
    title_size: sm
    title_align: left
    layout: {x: 0, y: 16, w: 4, h: 5}
  - component_type: multiqc
    tag: ms-qc-fastqc-overrepresented
    section: Read quality
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Top overrepresented sequences
    use: multiqc/fastqc
    title: Top overrepresented sequences
    title_size: sm
    title_align: left
    layout: {x: 4, y: 16, w: 4, h: 5}
  - component_type: multiqc
    tag: ms-qc-fastqc-adapter
    section: Read quality
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Adapter Content
    use: multiqc/fastqc
    title: Adapter content
    title_size: sm
    title_align: left
    layout: {x: 0, y: 21, w: 4, h: 5}
  - component_type: multiqc
    tag: ms-qc-fastqc-status
    section: Read quality
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Status Checks
    use: multiqc/fastqc
    title: Status checks
    title_size: sm
    title_align: left
    layout: {x: 4, y: 21, w: 4, h: 5}

  # ---------------------------------------------------------------- trimming
  - component_type: text
    tag: ms-qc-trim-intro
    section: Trimming
    title: What Trim Galore removed
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [Trim Galore](https://www.bioinformatics.babraham.ac.uk/projects/trim_galore/)
      with Cutadapt underneath, run before Bismark ever saw the reads. The
      trimmed-length distribution is where an over-aggressive adapter setting
      shows up as a library that lost its long fragments.
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: ms-qc-cutadapt
    section: Trimming
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    selected_module: cutadapt
    selected_plot: Filtered Reads
    use: multiqc/cutadapt
    title: Reads kept after trimming
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: ms-qc-cutadapt-lengths
    section: Trimming
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    selected_module: cutadapt
