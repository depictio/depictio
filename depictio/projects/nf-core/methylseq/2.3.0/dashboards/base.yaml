    layout: {x: 0, y: 6, w: 1, h: 3}

# ============================================================================
# Global methylome
# ============================================================================
# The methylome itself, out of the 750 MB of per-CpG bedGraph: the per-site
# distribution, the binned track along the genome, and where the libraries sit
# relative to one another.
- title: Global methylome
  subtitle: The per-CpG distribution, the binned track along the genome, and the structure of the cohort
  tab_order: 6
  tab_icon: mdi:dna
  tab_icon_color: violet
