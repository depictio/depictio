    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ms-dedup-card-total
    index: ms-dedup-card-total
    section: Deduplication summary
    workflow_tag: methylseq
    data_collection_tag: bismark_deduplication_summary
    use: bismark/deduplication_summary
    aggregation: sum
    column_name: total_alignments
    column_type: int64
    secondary_layout: histogram
    display: {icon_name: 'mdi:database-outline', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Alignments examined
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: figure
    tag: ms-dedup-fig-rate
    section: Deduplication summary
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    use: bismark/summary_report
    visu_type: bar
    dict_kwargs: {x: sample, y: pct_duplicate, color: cell_line, title: PCR duplication rate per library}
    title: PCR duplication rate per library
    description: Share of alignments dropped as duplicates, coloured by cell line; one library of this cohort is an order of magnitude above the rest.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 7}
  - component_type: table
    tag: ms-dedup-table
