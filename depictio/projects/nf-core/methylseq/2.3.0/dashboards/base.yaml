version: 1
# nf-core/methylseq 2.3.0 (Bismark route). Every rule it follows is written out
# in depictio/projects/nf-core/RULES.md; ampliseq/2.18.0 is the reference.
#
# The funnel: the Overview, then Data & QC (the reprocessed MultiQC report, the
# per-library QC floors, the coverage the calls rest on), then Methylome
# (whether the extraction needs a read-position trim, the methylation levels,
# how the libraries relate, and the window comparison between two groups).
#
# The design is a variable, never parsed from sample names: METADATA_FILE's
# factors reach the `samples` hub, the source of every sample link in
# template.yaml, and `{GROUP_COL}` / `{GROUP_COL_DISPLAY}` below are the factor
# the dashboards colour and filter by. Without a design table the CLI resolves
# them to a sentinel column no table carries and to "Group": the group
# breakdowns fall away, and template.yaml prunes the window comparison.
#
# The MultiQC report bound here was re-generated with MultiQC 1.35 from the
# run's raw tool outputs (the run published MultiQC 1.13, which writes no
# parquet), so module and plot names are the 1.35 ones. Genome coverage is
# Qualimap's: the Coverage tab binds `depictio/catalog/qualimap/`, owned by
# nf-core/eager. The run has no params.json: `params:` links search the
# software versions, the only provenance it carries.
main_dashboard:
  title: nf-core/methylseq
  subtitle: Bisulfite methylomes, from read QC to the windows that differ between groups
  project_tag: Bisulfite Methylation Profiling
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family: figures, advanced viz
  # and filter chips all colour a value the same way.
  category_colors:
    '{GROUP_COL}': auto
    context:
      CpG: '#7048e8'
      CHG: '#1098ad'
      CHH: '#f59f00'
    direction:
      Hypermethylated: '#e03131'
      Hypomethylated: '#1c7ed6'
      Not significant: '#adb5bd'
    cpg_density_class:
      CpG-poor: '#a5d8ff'
      Intermediate: '#4dabf7'
      CpG-dense: '#1864ab'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. Bound
  # to the `samples` hub, the source of every sample link in template.yaml.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The sample hub behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Samples, below).
  - component_type: interactive
    workflow_tag: methylseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Key figures
    tag: ms-ov-kf-group
    index: ov-kf-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: methylseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: ms-ov-kf-sample
    index: ov-kf-sample
    title: Sample ID
    layout: {x: 2, y: 0, w: 2, h: 1}
  # The pipeline's wordmark, read from its repository; where it cannot load (no
  # internet), the title is drawn as text.
  - component_type: text
    title: nf-core/methylseq
    logo: https://raw.githubusercontent.com/nf-core/methylseq/master/docs/images/nf-core-methylseq_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/methylseq/master/docs/images/nf-core-methylseq_logo_dark.png
    order: 1
    body: >
      Bisulfite reads turned into each library's methylome: how well it converted and
      aligned, how methylated its CpGs are and where two groups differ. [Run parameters](params:)
    tag: ms-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/methylseq aligns bisulfite-converted reads with Bismark, removes PCR duplicates and calls methylation at every cytosine, in CpG, CHG and CHH context. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The sample filters in the left panel apply to every tab: narrow the samples once and the whole dashboard follows. A bar above a section narrows that section only.
    tag: ms-ov-about
    index: ov-about
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's own numbers, read from the hub and Bismark's run summary: a 2.3.0
  # run publishes no params.json, so no {{param:...}} would fill in.
  - component_type: text
    surface: card
    values:
      samples: {dc: samples, column: sample_id, aggregation: nunique, format: integer}
      pairs: {dc: bismark_summary_report, column: total_reads, aggregation: sum, format: si}
      aligned: {dc: bismark_summary_report, column: aligned_reads, aggregation: sum, format: si}
      cpg_calls: {dc: bismark_summary_report, column: cpgs_called, aggregation: sum, format: si}
    body: |
      ### The run
      - ![](icon:mdi:flask-outline) **Samples** {{samples}}
      - ![](icon:mdi:counter) **Read pairs** {{pairs}}
      - ![](icon:mdi:dna) **Aligned** {{aligned}}
      - ![](icon:mdi:check-decagram) **CpG calls** {{cpg_calls}}
    tag: ms-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  # The marks take the family's colour (the header's), not the theme's blue.
  # `params:` searches the software versions, the run's only provenance.
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Five steps from reads to methylomes
      Each step names the tool version behind it and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:content-cut) **Trim** Trim Galore clips adapters and biased ends · [Version](params:trimgalore) · [MultiQC](tab:MultiQC)
      2. ![](icon:mdi:dna) **Align** Bismark maps to the converted genome · [Version](params:bismark) · [Run QC](tab:Run QC)
      3. ![](icon:mdi:content-duplicate) **Deduplicate** Duplicates removed, depth measured · [Version](params:qualimap) · [Coverage](tab:Coverage)
      4. ![](icon:mdi:chart-bell-curve) **Extract** Calls per cytosine and context · [Version](params:bismark) · [Bias](tab:Bias and context)
      5. ![](icon:mdi:chart-scatter-plot) **Methylome** CpGs binned into windows · [Pipeline](params:methylseq) · [Levels](tab:Methylation levels)
      :::
    tag: ms-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. The icon colour is that tab's colour.
  - component_type: card
    workflow_tag: methylseq
    data_collection_tag: samples
    aggregation: nunique
    column_name: sample_id
    column_type: object
    secondary_layout: composition
    breakdown_col: '{GROUP_COL}'
    display:
      icon_name: mdi:flask-outline
      icon_color: orange
      caption: in the sample sheet, by {GROUP_COL_DISPLAY}
      link: tab:MultiQC
    section: Key figures
    tag: ms-ov-kf-samples
    index: ov-kf-samples
    title: Samples
    description: Samples in the sample sheet. The bar splits them by {GROUP_COL_DISPLAY}.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    use: bismark/summary_report
    aggregation: median
    column_name: pct_aligned
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:dna
      icon_color: teal
      caption: median per library
      link: tab:Run QC
      decimals: 1
    section: Key figures
    tag: ms-ov-kf-aligned
    index: ov-kf-aligned
    title: Reads aligned (%)
    description: Median share of each library's read pairs Bismark aligned uniquely. The box shows how it spreads.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    use: bismark/summary_report
    aggregation: median
    column_name: pct_cpg_methylation
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: violet
      caption: median per library
      link: tab:Methylation levels
      decimals: 1
    section: Key figures
    tag: ms-ov-kf-cpg
    index: ov-kf-cpg
    title: CpG methylation (%)
    description: Median share of each library's CpG calls that are methylated. The box shows how it spreads.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # The worst library, not the median: one unconverted library is enough to
  # inflate its CpG calls.
  - component_type: card
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    use: bismark/summary_report
    aggregation: min
    column_name: conversion_efficiency_pct
    column_type: float64
    secondary_layout: coverage
    coverage_max: 100
    display:
      icon_name: mdi:shield-check-outline
      icon_color: teal
      caption: the worst library, of 100%
      link: tab:Run QC
      decimals: 1
    section: Key figures
    tag: ms-ov-kf-conversion
    index: ov-kf-conversion
    title: Conversion (%)
    description: Lowest bisulfite conversion over the libraries, read as 100 minus the CHH methylation.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the group, then the sample, both on the hub.
  - component_type: interactive
    workflow_tag: methylseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Findings
    tag: ms-ov-findings-group
    index: ov-findings-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: methylseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Sample
    section: Findings
    tag: ms-ov-findings-sample
    index: ov-findings-sample
    title: Sample ID
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data: the window row goes with the comparison on a
  # run without a design table.
  - component_type: text
    surface: card
    values:
      depth: {dc: qualimap_bamqc_genome_results, column: mean_coverage, aggregation: median, format: 'decimals:1'}
      full: {dc: bismark_methylation_density, column: fraction_of_cpgs, aggregation: median, filter_expr: "col('methylation_bin') > 98",
        format: 'decimals:1'}
      dense: {dc: bismark_binned_methylation, column: methylation_pct, aggregation: median, filter_expr: "col('cpg_density_class') == 'CpG-dense'",
        format: 'decimals:1'}
      poor: {dc: bismark_binned_methylation, column: methylation_pct, aggregation: median, filter_expr: "col('cpg_density_class') == 'CpG-poor'",
        format: 'decimals:1'}
      n_called: {dc: bismark_window_group_compare, column: window_id, aggregation: nunique, filter_expr: "col('direction') != 'Not significant'",
        format: integer}
      n_tested: {dc: bismark_window_group_compare, column: window_id, aggregation: nunique, format: integer}
    body: |
      - **{{depth}}×** median depth over the reference – Qualimap, bases at zero included [Coverage](tab:Coverage)
      - **{{full}}%** of CpGs are 98 to 100% methylated – median over the libraries [Levels](tab:Methylation levels)
      - **{{dense}}%** median methylation of CpG-dense windows – against {{poor}}% in CpG-poor ones [Levels](tab:Methylation levels)
      - **{{n_called}}** of {{n_tested}} windows differ between the groups – padj below 0.05, at least 10 points [Comparison](tab:Group comparison)
    section: Findings
    tag: ms-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One figure per analysis tab, two equal tiles per row. The M-bias tile is a
  # summary, not a highlight: the tab's explorer draws every context and read,
  # too dense for the Overview, so this one reads the CpG-only curves.
  - component_type: advanced_viz
    workflow_tag: methylseq
    data_collection_tag: bismark_mbias_curve
    use: bismark/mbias_cpg_profile
    config:
      x_title: Position in read (bp)
      y_title: CpG methylation (%)
      legend_pos: none
    title: CpG methylation along the read
    link: tab:Bias and context
    caption: One curve per library and read; a curve that bends at either end calls for a trim before extraction.
    section: Findings
    tag: ms-ov-mbias
    index: ov-mbias
    layout: {x: 0, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Methylation levels
    source_component: lvl-density-profile
    hide_legend: true
    caption: One colour per library; a healthy methylome peaks near 0% and, higher, near 100%.
    tag: ms-ov-hl-density
    index: ov-hl-density
    layout: {x: 4, y: 2, w: 4, h: 4}
  - component_type: highlight
    title: Libraries on a PCA
    section: Findings
    source_tab: Cohort structure
    source_component: coh-pca
    caption: One point per library on its binned methylome; libraries of one group should sit together.
    tag: ms-ov-hl-pca
    index: ov-hl-pca
    layout: {x: 0, y: 6, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Group comparison
    source_component: cmp-manhattan
    caption: Every tested window on its contig, the line at padj 0.05; a cluster on one contig beats a lone hit.
    tag: ms-ov-hl-manhattan
    index: ov-hl-manhattan
    layout: {x: 4, y: 6, w: 4, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle. A tab the run does
  # not have is left out.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Run QC](tab:Run QC)
      - [Coverage](tab:Coverage)

      ### Methylome
      - [Bias and context](tab:Bias and context)
      - [Methylation levels](tab:Methylation levels)
      - [Cohort structure](tab:Cohort structure)
      - [Group comparison](tab:Group comparison)
    section: How to read this dashboard
    tag: ms-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 3}
  # Persistent sample filters, the group first.
  - component_type: interactive
    workflow_tag: methylseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: ms-filter-group
    index: sample-filters-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: methylseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: ms-filter-sample
    index: sample-filters-sample
    title: Sample ID
    layout: {x: 0, y: 2, w: 1, h: 3}
  # Row selection feeds the Analysis panel.
  - component_type: table
    workflow_tag: methylseq
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Sample sheet
    tag: ms-sample-sheet
    index: sample-sheet
    title: Sample sheet
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
# ============================================================================
# MultiQC
# ============================================================================
- title: MultiQC
  subtitle: Did the reads trim, align and deduplicate cleanly in every library?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # Bound to multiqc_data, so the tab keeps a filter of its own whatever the
  # hub carries.
  filter_sections:
  - name: MultiQC report
    icon: mdi:file-document-outline
    color: orange
    description: Samples as the MultiQC report names them
  grid_sections:
  - name: QC overview
    icon: mdi:chart-box-outline
    color: orange
    description: Headline numbers per sample, base quality and the reads kept after trimming
  - name: Bisulfite alignment
    icon: mdi:dna
    color: indigo
    description: Bismark's alignment, duplication, cytosine methylation and M-bias panels
  - name: Read quality details
    icon: mdi:file-document-outline
    color: gray
    description: The remaining FastQC panels and the trimmed read lengths
    collapsed: true
  - name: Strand and coverage details
    icon: mdi:chart-line
    color: gray
    description: Bismark strand alignment and the Qualimap BamQC panels
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [MultiQC](https://multiqc.info) gathers the
      [FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/),
      [Trim Galore](https://www.bioinformatics.babraham.ac.uk/projects/trim_galore/),
      [Bismark](https://github.com/FelixKrueger/Bismark) and
      [Qualimap](http://qualimap.conesalab.org/) reports, re-run with MultiQC 1.35 over the
      run's own outputs. A bisulfite library fails the FastQC sequence content and GC checks
      by design, since conversion turns unmethylated cytosines into thymines. Read the
      alignment, duplication and M-bias panels first; the others are collapsed below.
    tag: ms-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: MultiQC report
    tag: ms-mqc-filter-sample
    index: mqc-sample-filter
    title: Sample ID
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: multiqc
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: QC overview
    tag: ms-mqc-general-stats
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    section: QC overview
    tag: ms-mqc-fastqc-quality
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    use: multiqc/cutadapt
    selected_module: cutadapt
    selected_plot: Filtered Reads
    section: QC overview
    tag: ms-mqc-cutadapt-filtered
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    use: multiqc/bismark
    selected_module: bismark
    selected_plot: Alignment Rates
    section: Bisulfite alignment
    tag: ms-mqc-bismark-align
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    use: multiqc/bismark
    selected_module: bismark
    selected_plot: Deduplication
    section: Bisulfite alignment
    tag: ms-mqc-bismark-dedup
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    use: multiqc/bismark
    selected_module: bismark
    selected_plot: Cytosine Methylation
    section: Bisulfite alignment
    tag: ms-mqc-bismark-methylation
    layout: {x: 0, y: 4, w: 4, h: 4}
  # MultiQC's own six-panel M-bias picker; the Bias and context tab queries the
  # same curves.
  - component_type: multiqc
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    use: multiqc/bismark
    selected_module: bismark
    selected_plot: M-Bias
    section: Bisulfite alignment
    tag: ms-mqc-bismark-mbias
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Counts
    section: Read quality details
    tag: ms-mqc-fastqc-counts
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Per Sequence Quality Scores
    section: Read quality details
    tag: ms-mqc-fastqc-perseq-quality
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Per Sequence GC Content
    section: Read quality details
    tag: ms-mqc-fastqc-gc
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Per Base N Content
    section: Read quality details
    tag: ms-mqc-fastqc-ncontent
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Length Distribution
    section: Read quality details
    tag: ms-mqc-fastqc-length
    layout: {x: 0, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Duplication Levels
    section: Read quality details
    tag: ms-mqc-fastqc-duplication
    layout: {x: 4, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Top overrepresented sequences
    section: Read quality details
