      point_size: 14
      legend_pos: right
      selection_enabled: true
      selection_column: sample_id
      show_centroids: true
    title: Libraries on the first components of their binned methylome
    description: Coloured by the two-level factor the cohort compares; with seven libraries the first component carries most of the depth difference too.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: advanced_viz
    tag: ms-structure-av-correlation
