    use: multiqc/cutadapt
    title: Trimmed sequence lengths
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 5}

  # -------------------------------------------------------- bisulfite align.
  - component_type: text
    tag: ms-qc-bismark-intro
    section: Bisulfite alignment
    title: Bismark, module by module
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [Bismark](https://github.com/FelixKrueger/Bismark)'s own plots: how
      many read pairs aligned, which bisulfite strand they came from, how many
      were removed as PCR duplicates, the per-context methylation table and the
      M-bias picker over all three contexts. The exact numbers behind them are
      on the Run QC and Bias and context tabs.
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: ms-qc-bismark-align
    section: Bisulfite alignment
    workflow_tag: methylseq
    data_collection_tag: multiqc_data
