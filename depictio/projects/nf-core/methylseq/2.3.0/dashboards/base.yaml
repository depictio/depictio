  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Window scope
    icon: mdi:tune
    color: violet
    description: Narrow the binned methylome to a contig, a CpG-density band or a methylation band
  grid_sections:
  - name: Per-CpG methylation
    icon: mdi:chart-bell-curve
    color: violet
    description: The distribution of methylation across every covered CpG, one curve per library
  - name: Methylation along the genome
    icon: mdi:chart-line
    color: blue
    description: A locus section on NKX2-1, the significance of the group difference over the genes with the per-library windows and the difference on the same region
  - name: Cohort structure
