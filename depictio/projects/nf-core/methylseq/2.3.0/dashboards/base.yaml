    data_collection_tag: bismark_window_group_compare
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: padj
    column_type: float64
    display:
      icon_name: mdi:filter-variant
      custom_color: red
    section: Comparison filters
    group: Comparison scope
    tag: ms-cmp-filter-padj
    index: cmp-padj-range
    title: Adjusted p
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: methylseq
    data_collection_tag: bismark_window_group_compare
    use: bismark/window_group_compare
    aggregation: nunique
    column_name: window_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: chromosome
    display:
      icon_name: mdi:dna
      icon_color: cyan
      caption: the contigs holding most
    section: Calls at a glance
    tag: ms-cmp-card-tested
    index: cmp-card-tested
    title: Windows tested
    description: 10 kb windows covered in every library and tested, ranked by contig.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: methylseq
    data_collection_tag: bismark_window_group_compare
    use: bismark/window_group_compare
