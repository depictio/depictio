# ============================================================================
# Run QC
# ============================================================================
# Bismark's run summary plus its alignment and deduplication reports: which
# libraries fail the alignment, duplication or conversion floors.
- title: Run QC
  subtitle: Which libraries fail the alignment, duplication or conversion floors?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:check-decagram
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Run QC filters
    icon: mdi:tune
    color: teal
    description: Narrows the per-library summaries to a band of depth, yield or quality
  grid_sections:
  - name: Run QC at a glance
    icon: mdi:counter
    color: teal
    description: The read funnel, then the worst library against each floor
  - name: Conversion per library
    icon: mdi:shield-check-outline
    color: teal
    description: Bisulfite conversion of each library, coloured by group
  - name: Library QC profile
    icon: mdi:chart-timeline-variant
    color: teal
    description: Every per-library QC ratio on its own axis, one line per library
  - name: Library detail
    icon: mdi:table
    color: gray
    description: The exact per-library counts behind every card on this tab
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [Bismark](https://github.com/FelixKrueger/Bismark)'s run summary, alignment and
      deduplication reports, one row per library. A bisulfite aligner searches four converted
      genomes, so a mapping efficiency in the seventies is the expected ceiling, not a failure.
      The floor cards read the worst library in view; conversion is 100 minus the CHH
      methylation, which assumes a genome with almost no CHH methylation, as in mammals.
    tag: ms-run-intro
    index: run-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: total_reads
    column_type: int64
    display:
      icon_name: mdi:counter
      custom_color: indigo
    section: Run QC filters
    group: Run summary
    tag: ms-run-filter-reads
    index: run-reads-range
    title: Read pairs analysed
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: pct_cpg_methylation
    column_type: float64
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: violet
    section: Run QC filters
    group: Run summary
    tag: ms-run-filter-cpg
    index: run-cpg-range
    title: CpG methylation
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: conversion_efficiency_pct
    column_type: float64
    display:
      icon_name: mdi:shield-check-outline
      custom_color: cyan
    section: Run QC filters
    group: Run summary
    tag: ms-run-filter-conversion
    index: run-conversion-range
    title: Conversion efficiency
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: methylseq
    data_collection_tag: bismark_alignment_summary
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: mapping_efficiency_pct
    column_type: float64
    display:
      icon_name: mdi:dna
      custom_color: teal
    section: Run QC filters
    group: Alignment quality
    tag: ms-run-filter-mapeff
    index: run-mapeff-range
    title: Mapping efficiency
    layout: {x: 0, y: 9, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: methylseq
    data_collection_tag: bismark_deduplication_summary
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: pct_duplication
    column_type: float64
    display:
      icon_name: mdi:content-duplicate
      custom_color: orange
    section: Run QC filters
    group: Alignment quality
    tag: ms-run-filter-dup
    index: run-dup-range
    title: Duplication rate
    layout: {x: 0, y: 12, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: methylseq
    data_collection_tag: bismark_deduplication_summary
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: leftover_sequences
    column_type: int64
    display:
      icon_name: mdi:database-outline
      custom_color: orange
    section: Run QC filters
    group: Alignment quality
    tag: ms-run-filter-leftover
    index: run-leftover-range
    title: Alignments kept after deduplication
    layout: {x: 0, y: 15, w: 1, h: 3}
  - component_type: card
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    use: bismark/summary_report
    aggregation: sum
    column_name: total_reads
    column_type: int64
    secondary_layout: attrition
    attrition_cols: [aligned_reads, unique_reads]
    display:
      icon_name: mdi:counter
      icon_color: indigo
      caption: aligned, then kept after deduplication
    section: Run QC at a glance
    tag: ms-run-card-funnel
    index: run-card-funnel
    title: Read pairs
    description: Read pairs Bismark analysed, then those aligned uniquely and those left after deduplication.
    layout: {x: 0, y: 0, w: 2, h: 2}
  # Floors. The card reads the worst library of the selection (min for a
  # higher-is-better column, max for a lower-is-better one); the strip counts
  # the libraries on each side of the cut-off, the warn band on the failing side.
  - component_type: card
    workflow_tag: methylseq
    data_collection_tag: bismark_alignment_summary
    use: bismark/alignment_summary
    aggregation: min
    column_name: mapping_efficiency_pct
    column_type: float64
    secondary_layout: threshold
    threshold_value: 70.0
    threshold_direction: min
    threshold_warn: 60.0
    display:
      icon_name: mdi:dna
      icon_color: teal
      caption: worst library; libraries at 70% or more
      decimals: 1
    section: Run QC at a glance
    tag: ms-run-card-mapeff
    index: run-card-mapeff
    title: Mapping efficiency (%)
    description: Lowest mapping efficiency in view. 70% passes, 60% to 70% warns.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: methylseq
    data_collection_tag: bismark_deduplication_summary
    use: bismark/deduplication_summary
    aggregation: max
    column_name: pct_duplication
    column_type: float64
    secondary_layout: threshold
    threshold_value: 10.0
    threshold_direction: max
    threshold_warn: 20.0
    display:
      icon_name: mdi:content-duplicate
      icon_color: orange
      caption: worst library; libraries at 10% or less
      decimals: 1
    section: Run QC at a glance
    tag: ms-run-card-dup
    index: run-card-dup
    title: Duplication (%)
    description: Highest PCR duplication in view. 10% passes, 10% to 20% warns.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    use: bismark/summary_report
    aggregation: min
    column_name: conversion_efficiency_pct
    column_type: float64
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:shield-check-outline
      icon_color: cyan
      caption: worst library, of 100%
      decimals: 1
    section: Run QC at a glance
    tag: ms-run-card-conversion
    index: run-card-conversion
    title: Conversion (%)
    description: Lowest bisulfite conversion in view; below about 98% the CpG calls carry the same error.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Colours by the group column (Analysis mode's groups when it has some), so
  # it takes the pieces of the group kwargs; one colour without a design.
  - component_type: figure
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    use: bismark/summary_report
    visu_type: bar
    mode: code
    code_content: |-
      # Conversion per library, coloured by the group column when the run has one.
      grp = depictio_group_by[0] if depictio_group_by else '{GROUP_COL}'
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get('{GROUP_COL}') or {}
      d = df.sort('sample').to_pandas()
      color = grp if grp in d.columns else None
      fig = px.bar(d, x='sample', y='conversion_efficiency_pct', color=color, color_discrete_map=colors, category_orders=depictio_group_kwargs.get('category_orders') or {}, labels={'sample': '', 'conversion_efficiency_pct': 'Conversion efficiency (%)', grp: ''})
      low = float(d['conversion_efficiency_pct'].min()) if len(d) else 0.0
      fig.update_yaxes(range=[max(0.0, low - 1.0), 100])
      fig.update_xaxes(tickangle=-45, automargin=True)
      fig.update_layout(margin=dict(t=10))
    section: Conversion per library
    tag: ms-run-conversion-bar
    index: run-conversion-bar
    title: Bisulfite conversion per library
    description: One bar per library, coloured by group, so a conversion gap that follows the design stands out.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    viz_kind: parallel_coordinates
    config:
      viz_kind: parallel_coordinates
      sample_col: sample
      group_col: '{GROUP_COL}'
      scale: minmax
      metric_cols:
      - total_reads
      - pct_aligned
      - pct_duplicate
      - pct_cpg_methylation
      - conversion_efficiency_pct
    section: Library QC profile
    tag: ms-run-parallel
    index: run-qc-profile
    title: Per-library QC profile
    description: Crossing the others on conversion is a bisulfite problem; on alignment and duplication, a library preparation one.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    use: bismark/summary_report
    row_selection_enabled: true
    row_selection_column: sample
    section: Library detail
    tag: ms-run-table-summary
    index: run-table-summary
    title: Bismark run summary
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: methylseq
    data_collection_tag: bismark_alignment_summary
    use: bismark/alignment_summary
    row_selection_enabled: true
    row_selection_column: sample
    section: Library detail
    tag: ms-run-table-alignment
    index: run-table-alignment
    title: Alignment summary
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: table
    workflow_tag: methylseq
    data_collection_tag: bismark_deduplication_summary
    use: bismark/deduplication_summary
    row_selection_enabled: true
    row_selection_column: sample
    section: Library detail
    tag: ms-run-table-dedup
    index: run-table-dedup
    title: Deduplication summary
    layout: {x: 0, y: 12, w: 8, h: 6}
# ============================================================================
# Coverage
# ============================================================================
# Qualimap BamQC at full resolution rather than as a MultiQC picture.
- title: Coverage
  subtitle: How deep and how evenly do the alignments cover the reference?
  tab_group: Data & QC
  tab_order: 3
  tab_icon: mdi:chart-line
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Coverage filters
    icon: mdi:tune
    color: cyan
    description: The contigs the depth track reads
  grid_sections:
  - name: Coverage at a glance
    icon: mdi:counter
    color: cyan
    description: Depth, breadth, duplication and mapping quality per library
  - name: Depth along the reference
    icon: mdi:chart-line
    color: cyan
    description: Windowed depth mapped back onto its contig, one lane per library
  # Its own bar holds the depth threshold: in the left panel it would also
  # narrow the 1X breadth card, which pins min_coverage == 1 (RULES §6).
  - name: Depth distribution
    icon: mdi:chart-bell-curve
    color: cyan
    filter_bar: true
    description: How many bases sit at each depth, and how much clears a threshold
  - name: Coverage detail
    icon: mdi:table
    color: gray
    description: Qualimap's per-library BamQC numbers
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [Qualimap](http://qualimap.conesalab.org/) BamQC on the deduplicated alignments: how
      deep and how evenly the reads cover the reference. Mean depth counts the bases at zero,
      so on a shallow run judge the share of the reference covered instead. The track maps
      Qualimap's windows back onto their contigs; the contig filter drops unplaced scaffolds.
    tag: ms-cov-intro
    index: cov-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: methylseq
    data_collection_tag: qualimap_coverage_across_reference
    interactive_component_type: MultiSelect
    column_name: chromosome
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: cyan
    section: Coverage filters
    group: Genomic scope
    tag: ms-cov-filter-contig
    index: cov-contig-filter
    title: Contig
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: methylseq
    data_collection_tag: qualimap_genome_fraction_coverage
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: min_coverage
    column_type: int64
    display:
      icon_name: mdi:ruler
      custom_color: cyan
      strip_label: Min depth
    section: Depth distribution
    tag: ms-cov-filter-depth
    index: cov-depth-range
    title: Depth threshold
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: card
    workflow_tag: methylseq
    data_collection_tag: qualimap_bamqc_genome_results
    use: qualimap/bamqc_genome_results
    aggregation: median
    column_name: mean_coverage
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-line
      icon_color: cyan
      caption: median, with its spread
      decimals: 1
    section: Coverage at a glance
    tag: ms-cov-card-depth
    index: cov-card-depth
    title: Mean depth (X)
    description: Median of each library's mean depth over the reference, bases at zero included.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: methylseq
    data_collection_tag: qualimap_genome_fraction_coverage
    use: qualimap/genome_fraction_coverage
    aggregation: median
    column_name: genome_fraction_pct
    column_type: float64
    filter_expr: col('min_coverage') == 1
    secondary_layout: coverage
    coverage_max: 100
    display:
      icon_name: mdi:check-all
      icon_color: teal
      caption: median share of the reference
      decimals: 1
    section: Coverage at a glance
    tag: ms-cov-card-breadth
    index: cov-card-breadth
    title: Covered at 1X (%)
    description: Median share of the reference that each library covers at least once.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: methylseq
    data_collection_tag: qualimap_bamqc_genome_results
    use: qualimap/bamqc_genome_results
    aggregation: median
    column_name: duplication_rate
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:content-duplicate
      icon_color: orange
      caption: median, with the distribution
      decimals: 1
    section: Coverage at a glance
    tag: ms-cov-card-dup
    index: cov-card-dup
    title: Duplication (%)
    description: Qualimap's duplicate estimate on the deduplicated alignments, median over the libraries.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: methylseq
    data_collection_tag: qualimap_bamqc_genome_results
    use: qualimap/bamqc_genome_results
    aggregation: median
    column_name: mean_mapping_quality
    column_type: float64
    secondary_layout: gauge
    coverage_max: 42
    display:
      icon_name: mdi:check-decagram
      icon_color: violet
      caption: median, on Bowtie 2's 0 to 42 scale
      decimals: 1
    section: Coverage at a glance
    tag: ms-cov-card-mapq
    index: cov-card-mapq
    title: Mapping quality
    description: Median of each library's mean MAPQ over its mapped reads.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: methylseq
    data_collection_tag: qualimap_coverage_across_reference
    use: qualimap/reference_coverage_track
    config:
      facet_by_sample: true
      view_mode: facet
      smoothing_window: 0
      color_by: sample
    section: Depth along the reference
    tag: ms-cov-track
    index: cov-track
    title: Read depth along the reference
    description: One lane per library; a lane flat at zero over a whole contig is a contig the library never reached.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: methylseq
    data_collection_tag: qualimap_coverage_histogram
    use: qualimap/depth_histogram_profile
    config:
      x_title: Depth (X)
      y_title: Share of the reference
      log_y: true
      legend_pos: bottom
      selection_enabled: true
      selection_column: sample
    section: Depth distribution
    tag: ms-cov-histogram
    index: cov-depth-histogram
    title: Bases at each depth
    description: One curve per library, log y, since the zero bucket holds most of the genome.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: methylseq
    data_collection_tag: qualimap_genome_fraction_coverage
    use: qualimap/genome_fraction_profile
    config:
      x_title: Minimum depth (X)
      y_title: Reference covered (%)
      legend_pos: bottom
      selection_enabled: true
      selection_column: sample
    section: Depth distribution
    tag: ms-cov-fraction
    index: cov-genome-fraction
    title: Reference covered at least X deep
    description: Where the curves part is where the libraries stop being comparable for a per-site call.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: table
    workflow_tag: methylseq
    data_collection_tag: qualimap_bamqc_genome_results
    use: qualimap/bamqc_genome_results
    row_selection_enabled: true
    row_selection_column: sample
    section: Coverage detail
    tag: ms-cov-table-bamqc
    index: cov-table-bamqc
    title: Qualimap BamQC summary
    layout: {x: 0, y: 0, w: 8, h: 6}
# ============================================================================
# Bias and context
# ============================================================================
# Whether the extraction needs an --ignore trim: one M-bias explorer over all
# six tables of the M-bias file, context and read picked in the bar of its
# section. The bar narrows that section only (RULES §6): in the left panel a
# context filter would also narrow the per-context summary, whose cards each
# pin one context and would print "–" on any other.
- title: Bias and context
  subtitle: Does the methylation extraction need a read-position trim?
  tab_group: Methylome
  tab_order: 4
  tab_icon: mdi:chart-bell-curve
  tab_icon_color: pink
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Read position
    icon: mdi:filter-variant
    color: pink
    description: The read positions the M-bias explorer and its table draw
  grid_sections:
  - name: Context at a glance
    icon: mdi:counter
    color: pink
    description: Methylation per cytosine context, and where the methylated calls fall
  - name: M-bias
    icon: mdi:chart-bell-curve
    color: pink
    filter_bar: true
    visible_filters: 2
    description: Methylation by read position; the bar picks the context and the read
  - name: Context detail
    icon: mdi:table
    color: gray
    description: The raw M-bias positions and the per-context methylation counts
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [Bismark](https://github.com/FelixKrueger/Bismark)'s M-bias report: methylation at each
      read position, per cytosine context and read. A CpG curve that has not flattened by the
      end of the read argues for an `--ignore` or `--ignore_r2` trim and a re-extraction. Pick
      the context and the read in the bar above the explorer, which opens on CpG.
    tag: ms-bias-intro
    index: bias-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  # The M-bias section's own bar: context and read narrow the explorer only.
  - component_type: interactive
    workflow_tag: methylseq
    data_collection_tag: bismark_mbias_all_contexts
    interactive_component_type: Select
    column_name: context
    column_type: object
    default_value: CpG
    display:
      icon_name: mdi:shape-outline
      custom_color: pink
      strip_label: Context
    section: M-bias
    tag: ms-bias-filter-context
    index: bias-context-filter
    title: Cytosine context
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: methylseq
    data_collection_tag: bismark_mbias_all_contexts
    interactive_component_type: Select
    column_name: read
    column_type: object
    display:
      icon_name: mdi:swap-vertical
      custom_color: pink
      strip_label: Read
    section: M-bias
    tag: ms-bias-filter-read
