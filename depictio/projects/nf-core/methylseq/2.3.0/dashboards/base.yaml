# ============================================================================
# Methylation levels
# ============================================================================
# The methylome itself, out of the per-CpG bedGraphs: the per-site
# distribution and methylation by CpG-density class (the annotation-free
# stand-in for a CpG-island panel).
- title: Methylation levels
  subtitle: Is each methylome bimodal, and are CpG-dense regions unmethylated?
  tab_group: Methylome
  tab_order: 5
  tab_icon: mdi:dna
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Window filters
    icon: mdi:filter-variant
    color: violet
    description: Narrows the binned windows to a CpG-density class or a methylation band
  grid_sections:
  - name: Levels at a glance
    icon: mdi:counter
    color: violet
    description: How many CpGs sit at either end, and how methylated the windows are
  - name: Per-CpG methylation
    icon: mdi:chart-bell-curve
    color: violet
    description: The distribution of methylation over every covered CpG, one curve per library
  - name: CpG density
    icon: mdi:shape-outline
    color: violet
    description: Window methylation in CpG-poor, intermediate and CpG-dense tertiles
  components:
  - component_type: text
    order: 1
    body: >
      [Bismark](https://github.com/FelixKrueger/Bismark)'s per-CpG calls, streamed into 2%
      buckets per library and into 10 kb windows. A healthy mammalian methylome is bimodal, a
      low peak for unmethylated islands and a taller one near 100% for the bulk. The CpG-density
      tertiles stand in for a CpG-island annotation, which nf-core/methylseq does not ship.
    tag: ms-lvl-intro
    index: lvl-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: methylseq
    data_collection_tag: bismark_binned_methylation
    interactive_component_type: MultiSelect
    column_name: cpg_density_class
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: blue
    section: Window filters
    group: Window scope
    tag: ms-lvl-filter-density
    index: lvl-density-filter
    title: CpG density class
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: methylseq
    data_collection_tag: bismark_binned_methylation
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: methylation_pct
    column_type: float64
    display:
      icon_name: mdi:ruler
      custom_color: violet
    section: Window filters
    group: Window scope
    tag: ms-lvl-filter-level
    index: lvl-level-range
    title: Window methylation
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: methylseq
    data_collection_tag: bismark_methylation_density
    use: bismark/methylation_density
    aggregation: median
    column_name: fraction_of_cpgs
    column_type: float64
    filter_expr: col('methylation_bin') > 98
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: violet
      caption: median share per library, with its spread
      decimals: 1
    section: Levels at a glance
    tag: ms-lvl-card-full
    index: lvl-card-full
    title: CpGs fully methylated (%)
    description: Share of each library's CpGs at 98 to 100% methylation, median over the libraries.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: methylseq
    data_collection_tag: bismark_methylation_density
    use: bismark/methylation_density
    aggregation: median
    column_name: fraction_of_cpgs
    column_type: float64
    filter_expr: col('methylation_bin') < 2
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:percent-outline
      icon_color: cyan
      caption: median share per library, of 100%
      decimals: 1
    section: Levels at a glance
    tag: ms-lvl-card-empty
    index: lvl-card-empty
    title: CpGs unmethylated (%)
    description: Share of each library's CpGs at 0 to 2% methylation, median over the libraries.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: methylseq
    data_collection_tag: bismark_binned_methylation
    use: bismark/binned_methylation
    aggregation: median
    column_name: methylation_pct
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:gauge
      icon_color: indigo
      caption: median window, with the distribution
      decimals: 1
    section: Levels at a glance
    tag: ms-lvl-card-window
    index: lvl-card-window
    title: Window methylation (%)
    description: Median CpG methylation of the 10 kb windows in view, all libraries pooled.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: methylseq
    data_collection_tag: bismark_binned_methylation
    use: bismark/binned_methylation
    aggregation: median
    column_name: methylation_pct
    column_type: float64
    secondary_layout: top_n
    breakdown_col: cpg_density_class
    display:
      icon_name: mdi:shape-outline
      icon_color: lime
      caption: median window, by CpG-density class
      decimals: 1
    section: Levels at a glance
    tag: ms-lvl-card-class
    index: lvl-card-class
    title: By CpG density (%)
    description: Median window methylation in each CpG-density tertile; the CpG-dense end should sit lowest.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: methylseq
    data_collection_tag: bismark_methylation_density
    use: bismark/density_profile
    config:
      x_title: Methylation at a CpG (%)
      y_title: Share of the library's CpGs (%)
      log_y: true
      legend_pos: right
      selection_enabled: true
      selection_column: sample
    section: Per-CpG methylation
    tag: ms-lvl-density
    index: lvl-density-profile
    title: Per-CpG methylation density
    description: One curve per library in 2% buckets, log y, so the shoulders between the two peaks stay readable.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: methylseq
    data_collection_tag: bismark_binned_methylation
    use: bismark/binned_methylation
    visu_type: box
    mode: code
    code_content: |-
      # Window methylation per CpG-density tertile, CpG-poor to CpG-dense, in the
      # family colours of the classes.
      order = ['CpG-poor', 'Intermediate', 'CpG-dense']
      fig = px.box(df.to_pandas(), x='cpg_density_class', y='methylation_pct', color='cpg_density_class', category_orders={'cpg_density_class': order}, color_discrete_map=depictio_category_colors.get('cpg_density_class') or {}, labels={'cpg_density_class': '', 'methylation_pct': 'Window methylation (%)'})
      fig.update_layout(showlegend=False, margin=dict(t=10))
    section: CpG density
    tag: ms-lvl-density-class
    index: lvl-density-class
    title: Methylation by CpG-density class
    description: Window methylation per tertile; the gap between the ends is what an island annotation would sharpen.
    layout: {x: 0, y: 0, w: 8, h: 4, fit: auto}
# ============================================================================
# Cohort structure
# ============================================================================
# The library-by-window matrix read three ways.
- title: Cohort structure
  subtitle: Do the libraries group by the design?
  tab_group: Methylome
  tab_order: 6
  tab_icon: mdi:relation-many-to-many
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Cohort filters
    icon: mdi:filter-variant
    color: grape
    description: Narrows the most variable windows to some contigs
  grid_sections:
  - name: Cohort at a glance
    icon: mdi:counter
    color: grape
    description: The libraries placed, and where the most variable windows lie
  - name: Library relationships
    icon: mdi:chart-scatter-plot
    color: grape
    description: The PCA, then the pairwise correlation it summarises
  # Collapsed: the heatmap autofits to its 150 rows (about 15 grid rows), past
  # the tab's budget; the PCA and the correlation answer the tab's question.
  - name: Variable windows
    icon: mdi:chart-box-outline
    color: grape
    description: The windows whose methylation moves most across the libraries
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      The library-by-window methylation matrix read three ways: a PCA, the pairwise Pearson
      correlation and the 150 windows that vary most. Libraries of one group should land
      together in all three. One that lands with the wrong block everywhere is a swap, a
      mislabelled sheet or a conversion failure that flattened its methylome.
    tag: ms-coh-intro
    index: coh-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: methylseq
    data_collection_tag: bismark_top_variable_windows
    interactive_component_type: MultiSelect
    column_name: chromosome
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: grape
    section: Cohort filters
    tag: ms-coh-filter-contig
    index: coh-contig-filter
    title: Contig
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: card
    workflow_tag: methylseq
    data_collection_tag: bismark_window_pca
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: donut
    breakdown_col: '{GROUP_COL}'
    display:
      icon_name: mdi:flask-outline
      icon_color: violet
      caption: one point each, by {GROUP_COL_DISPLAY}
    section: Cohort at a glance
    tag: ms-coh-card-libraries
    index: coh-card-libraries
    title: Libraries in the PCA
    description: Libraries placed on their binned methylome, split by {GROUP_COL_DISPLAY}.
    layout: {x: 0, y: 0, w: 4, h: 2}
  - component_type: card
    workflow_tag: methylseq
    data_collection_tag: bismark_top_variable_windows
    use: bismark/top_variable_windows
    aggregation: nunique
    column_name: window_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: chromosome
    display:
      icon_name: mdi:dna
      icon_color: grape
      caption: the contigs holding most
    section: Cohort at a glance
    tag: ms-coh-card-windows
    index: coh-card-windows
    title: Most variable windows
    description: The windows whose methylation varies most across the libraries, ranked by contig.
    layout: {x: 4, y: 0, w: 4, h: 2}
  - component_type: advanced_viz
    workflow_tag: methylseq
    data_collection_tag: bismark_window_pca
    use: bismark/pca_embedding
    config:
      color_col: '{GROUP_COL}'
      cluster_col: '{GROUP_COL}'
      point_size: 12
      legend_pos: right
      axis_prefix: PC
      selection_enabled: true
      selection_column: sample_id
      show_centroids: true
    section: Library relationships
    tag: ms-coh-pca
    index: coh-pca
    title: Libraries on their binned methylome (PCA)
    description: Coloured by {GROUP_COL_DISPLAY}; with few libraries the first component can carry depth as much as design.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: methylseq
    data_collection_tag: bismark_window_correlation
    use: bismark/correlation_heatmap
    config:
      cluster_rows: true
      cluster_cols: true
      colorscale: Viridis
    section: Library relationships
    tag: ms-coh-correlation
    index: coh-correlation
    title: Library correlation over the shared windows
    description: Pearson correlation of the 10 kb window means, clustered on both axes.
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: methylseq
    data_collection_tag: bismark_top_variable_windows
    use: bismark/variable_windows_heatmap
    config:
      cluster_rows: true
      cluster_cols: true
      colorscale: RdBu
      row_annotation_cols: [chromosome]
      # Every numeric column but the variance: one column per library of the
      # run, unknown until ingest. The variance (up to about 1000) would
      # otherwise set the colour scale and flatten the 0 to 100% libraries.
      value_columns_pattern: '^(?!window_variance$)'
    section: Variable windows
    tag: ms-coh-variable
    index: coh-variable-windows
    title: The 150 windows that move most across the libraries
    description: A ranking by variance, not a test; its blocks are where to read the group comparison first.
    layout: {x: 0, y: 0, w: 8, h: 5}
# ============================================================================
# Group comparison
# ============================================================================
# The comparison the cohort was sequenced for, run on the windows: nf-core/
# methylseq ships no differential-methylation caller at any version, so this is
# the screen the published files support, labelled as one. Every tile but the
# per-library lanes reads bismark_window_group_compare, which template.yaml
# prunes when the run declares no design table.
- title: Group comparison
  subtitle: Which windows differ in methylation between the two groups?
  tab_group: Methylome
  tab_order: 7
  tab_icon: mdi:scale-balance
  tab_icon_color: red
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Comparison filters
    icon: mdi:filter-variant
    color: red
    description: Narrows the tested windows by call, difference and adjusted p
  grid_sections:
  - name: Calls at a glance
    icon: mdi:counter
    color: red
    description: Windows tested and called, the size of the difference, the strongest call
  - name: Along the genome
    icon: mdi:chart-scatter-plot
    color: red
    description: Every tested window on its contig, the line at padj 0.05
  - name: Effect and significance
    icon: mdi:scale-balance
    color: red
    description: The difference against its significance, and how the differences spread
  # One navigator and the tracks that follow its region. The navigator keeps
  # every window above padj 0.05 whole while it samples the rest; the per-library
  # lanes follow it through the region link in template.yaml. default_region is
  # a documented default (VALIDATION_REPORT.md); no lateral chromosome filter,
  # which would fight the navigator.
  - name: Methylation at a locus
    icon: mdi:chart-line
    color: gray
    description: One region, with its significance, per-library methylation and difference
    collapsed: true
  - name: Window detail
    icon: mdi:table
    color: gray
    description: Every tested window with its group means, difference and adjusted p
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      Every 10 kb window covered in every library is tested between the two levels of the
      design factor, a t-test on arcsine-transformed proportions with Benjamini-Hochberg
      correction. nf-core/methylseq ships no DMR caller, so this is a window screen,
      low-powered with few libraries a side: read clusters of windows, not a lone hit. Open
      the locus section and type a region in its navigator to follow one region.
    tag: ms-cmp-intro
    index: cmp-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: methylseq
    data_collection_tag: bismark_window_group_compare
    interactive_component_type: MultiSelect
    column_name: direction
    column_type: object
    display:
      icon_name: mdi:swap-vertical
      custom_color: red
    section: Comparison filters
    group: Comparison scope
    tag: ms-cmp-filter-direction
    index: cmp-direction-filter
    title: Call
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: methylseq
    data_collection_tag: bismark_window_group_compare
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: delta_methylation
    column_type: float64
    display:
