tabs:
# ============================================================================
# Run QC
# ============================================================================
# Bismark's own run-level table: what was sequenced, what aligned, what survived
# deduplication, how many CpG calls came out, and whether the bisulfite
# conversion behind those calls held.
- title: Run QC
  subtitle: The read-to-methylome funnel and the bisulfite conversion behind every call
  tab_order: 2
  tab_icon: mdi:check-decagram
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Run QC scope
    icon: mdi:tune
    color: teal
    description: Narrow the run summary to the libraries in a depth or methylation band
  grid_sections:
  - name: Run funnel
    icon: mdi:counter
    color: teal
    description: Reads analysed, aligned, deduplicated and turned into CpG calls
  - name: Cytosine yield
    icon: mdi:chart-donut
    color: green
    description: How many cytosines were called, in which context, and at what level
  - name: Library QC profile
    icon: mdi:chart-timeline-variant
    color: teal
    description: Every per-library QC ratio on its own axis, one line per library
  components:
  # ------------------------------------------------------------- run funnel
  - component_type: text
    tag: ms-run-intro
    section: Run funnel
    title: From reads to a methylome
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Bismark's own run-level summary, one row per library. The first card is
      the whole funnel: reads analysed, reads with a unique best alignment,
      alignments left after deduplication, CpG calls extracted. The gauge beside
      it is the bisulfite conversion rate, read off the CHH calls: mammalian CHH
      methylation is biologically near zero, so an apparent CHH call is an
      unconverted cytosine, and below about 98 % the CpG calls inherit the same
      false-positive rate.
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ms-run-card-funnel
    index: ms-run-card-funnel
    section: Run funnel
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    use: bismark/summary_report
    aggregation: sum
    column_name: total_reads
    column_type: int64
    secondary_layout: attrition
    attrition_cols: [aligned_reads, unique_reads, cpgs_called]
    display: {icon_name: 'mdi:counter', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Reads to CpG calls
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ms-run-card-conversion
    index: ms-run-card-conversion
    section: Run funnel
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    use: bismark/summary_report
    aggregation: average
    column_name: conversion_efficiency_pct
    column_type: float64
    secondary_layout: gauge
    coverage_max: 100
    display: {icon_name: 'mdi:shield-check-outline', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Conversion efficiency
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ms-run-card-aligned
    index: ms-run-card-aligned
    section: Run funnel
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    use: bismark/summary_report
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: pct_aligned
    column_type: float64
    display: {icon_name: 'mdi:chart-line', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: "% reads aligned"
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ms-run-card-duplicate
    index: ms-run-card-duplicate
    section: Run funnel
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    use: bismark/summary_report
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: pct_duplicate
    column_type: float64
    display: {icon_name: 'mdi:chart-donut', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: "% duplicates"
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: figure
    tag: ms-run-fig-conversion
    section: Run funnel
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    use: bismark/summary_report
    visu_type: bar
    dict_kwargs: {x: sample, y: conversion_efficiency_pct, color: cell_line, title: Bisulfite conversion efficiency per library}
    title: Bisulfite conversion efficiency per library
    description: One bar per library, coloured by cell line; the two arms of this megatest sit about half a point apart.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 7}
  - component_type: table
    tag: ms-run-table-summary
    section: Run funnel
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    use: bismark/summary_report
    row_selection_enabled: true
    title: Bismark run summary
    description: Every column of bismark2summary plus the ratios derived from it, one row per library.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 11, w: 8, h: 3}

  # ---------------------------------------------------------- cytosine yield
  - component_type: text
    tag: ms-run-yield-intro
    section: Cytosine yield
    title: How many cytosines, and how methylated
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The same table read from the cytosine end. CpG methylation in the eighties
      is the normal mammalian level; the CHG and CHH percentages should sit near
      zero, and what they actually measure is unconverted cytosine rather than
      non-CpG methylation.
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: ms-run-card-cpgmeth
    index: ms-run-card-cpgmeth
    section: Cytosine yield
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    use: bismark/summary_report
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: pct_cpg_methylation
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: "% CpG methylation"
    layout: {x: 0, y: 1, w: 2, h: 2}
  - component_type: card
    tag: ms-run-card-cpgs
    index: ms-run-card-cpgs
    section: Cytosine yield
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    use: bismark/summary_report
    aggregation: sum
    column_name: cpgs_called
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:database-outline', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: CpG calls
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: ms-run-card-chh
    index: ms-run-card-chh
    section: Cytosine yield
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    use: bismark/summary_report
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: pct_chh_methylation
    column_type: float64
    display: {icon_name: 'mdi:alert-outline', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: "% CHH (unconverted)"
    layout: {x: 4, y: 1, w: 2, h: 2}
  - component_type: card
    tag: ms-run-card-totalcs
    index: ms-run-card-totalcs
    section: Cytosine yield
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    use: bismark/summary_report
    aggregation: sum
    column_name: total_cs
    column_type: int64
    secondary_layout: histogram
    display: {icon_name: 'mdi:counter', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Cytosines seen
    layout: {x: 6, y: 1, w: 2, h: 2}
  - component_type: figure
    tag: ms-run-fig-cpgs
    section: Cytosine yield
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    visu_type: bar
    dict_kwargs: {x: sample, y: cpgs_called, color: treatment, title: CpG calls per library}
    title: CpG calls per library
    description: How many CpG calls each library contributed, coloured by treatment; depth drives this far more than biology.
    title_size: h3
    layout: {x: 0, y: 3, w: 8, h: 7}

  # ------------------------------------------------------- library QC profile
  - component_type: text
    tag: ms-run-profile-intro
    section: Library QC profile
    title: One line per library across the QC ratios
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Mapping efficiency, duplication, methylation in each context and the
      conversion rate on parallel axes, each rescaled to its own range. A library
      that crosses the others on the CHH axis is a conversion problem; one that
      crosses them on the alignment and duplication axes together is a library
      preparation problem. Brush an axis to keep only the libraries inside it.
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: ms-run-av-parallel
    index: ms-run-av-parallel
    section: Library QC profile
    workflow_tag: methylseq
    data_collection_tag: bismark_summary_report
    viz_kind: parallel_coordinates
    config:
      viz_kind: parallel_coordinates
      sample_col: sample
      group_col: cell_line
      scale: minmax
      metric_cols:
      - total_reads
      - pct_aligned
      - pct_duplicate
      - cpgs_called
      - pct_cpg_methylation
      - pct_chg_methylation
      - pct_chh_methylation
      - conversion_efficiency_pct
      controls_placement: header
    title: Per-library QC profile
    description: Eight run-summary metrics per library, coloured by cell line; brushing an axis emits a range filter on that column.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 8}

  # ----------------------------------------------------------- tab filters
  - component_type: interactive
    tag: ms-run-filter-reads
    index: ms-run-reads-range
    section: Run QC scope
    group: Run summary
    workflow_tag: methylseq
