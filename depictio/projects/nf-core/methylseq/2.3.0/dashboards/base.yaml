  - component_type: interactive
    tag: ms-mbias-filter-read
    index: ms-mbias-read-filter
    section: Context and read
    group: M-bias panel
    workflow_tag: methylseq
    data_collection_tag: bismark_mbias_all_contexts
    interactive_component_type: Select
    column_name: read
    column_type: object
    display: {title_size: md, custom_color: '#E91E63', icon_name: 'mdi:ruler'}
    placement: left
    title: Read
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: ms-mbias-filter-position
    index: ms-mbias-position-range
    section: Context and read
    group: M-bias panel
    workflow_tag: methylseq
    data_collection_tag: bismark_mbias_all_contexts
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: position
    column_type: int64
    display: {title_size: md, custom_color: '#E91E63', icon_name: 'mdi:ruler'}
    placement: left
