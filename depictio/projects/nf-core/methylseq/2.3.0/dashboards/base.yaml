# ============================================================================
# Methylation profiling
# ============================================================================
# Post-deduplication methylation by cytosine context, then the CpG M-bias
# curve that says whether the extraction window needs an --ignore trim.
- title: Methylation profiling
  subtitle: Per-context methylation levels and the CpG read-position bias behind the extraction call
  tab_order: 3
  tab_icon: mdi:chart-bell-curve
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  grid_sections:
  - name: Methylation by context
    icon: mdi:chart-donut
    color: grape
    description: CpG, CHG and CHH methylation levels after deduplication and extraction
  - name: M-bias (CpG)
    icon: mdi:chart-bell-curve
    color: pink
    description: Whether the extraction window needs an --ignore / --ignore_r2 trim
  components:
  # ----------------------------------------------------- methylation context
  - component_type: text
    tag: ms-meth-intro
    section: Methylation by context
    title: Methylation level by cytosine context
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The extractor's "Final Cytosine Methylation Report", one row per sample
      per context. CpG is where mammalian methylation concentrates; CHG and
      CHH sitting near zero is the usual bisulfite-conversion sanity check,
      not signal.
    workflow_tag: methylseq
    data_collection_tag: bismark_methylation_context_summary
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: ms-meth-card-donut
    index: ms-meth-card-donut
    section: Methylation by context
    workflow_tag: methylseq
    data_collection_tag: bismark_methylation_context_summary
    use: bismark/methylation_context_summary
    aggregation: average
    column_name: pct_methylated
    column_type: float64
    secondary_layout: donut
    breakdown_col: context
    display: {icon_name: 'mdi:chart-donut', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Methylation by context
    layout: {x: 0, y: 1, w: 2, h: 2}
  - component_type: card
    tag: ms-meth-card-box
    index: ms-meth-card-box
    section: Methylation by context
    workflow_tag: methylseq
    data_collection_tag: bismark_methylation_context_summary
    use: bismark/methylation_context_summary
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: pct_methylated
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: "% methylated (spread)"
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: ms-meth-card-topn
    index: ms-meth-card-topn
    section: Methylation by context
    workflow_tag: methylseq
    data_collection_tag: bismark_methylation_context_summary
    use: bismark/methylation_context_summary
    aggregation: sum
    column_name: methylated_c
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Methylated cytosines
    layout: {x: 4, y: 1, w: 2, h: 2}
  - component_type: card
    tag: ms-meth-card-hist
    index: ms-meth-card-hist
    section: Methylation by context
    workflow_tag: methylseq
    data_collection_tag: bismark_methylation_context_summary
    use: bismark/methylation_context_summary
    aggregation: sum
    column_name: unmethylated_c
    column_type: int64
    secondary_layout: histogram
    display: {icon_name: 'mdi:database-outline', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Unmethylated cytosines
    layout: {x: 6, y: 1, w: 2, h: 2}
  - component_type: figure
    tag: ms-meth-fig-context
    section: Methylation by context
    workflow_tag: methylseq
    data_collection_tag: bismark_methylation_context_summary
    use: bismark/methylation_context_summary
    visu_type: bar
    dict_kwargs: {x: sample, y: pct_methylated, color: context, title: "% methylated cytosines by context"}
    title: "% methylated cytosines by context"
    description: CpG, CHG and CHH side by side for every sample.
    title_size: h3
    layout: {x: 0, y: 3, w: 8, h: 7}
  - component_type: table
    tag: ms-meth-table
    section: Methylation by context
    workflow_tag: methylseq
    data_collection_tag: bismark_methylation_context_summary
    use: bismark/methylation_context_summary
    row_selection_enabled: true
    title: Methylation by context
    description: Methylated / unmethylated cytosine counts and the percentage, one row per sample per context.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 10, w: 8, h: 7}

  # ------------------------------------------------------------------ mbias
  - component_type: text
    tag: ms-mbias-intro
    section: M-bias (CpG)
    title: Read-position methylation bias, CpG context
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      % methylation at each read position. A curve that has not flattened out
      by the end of the read is Bismark's own advice to add an `--ignore` /
      `--ignore_r2` trim and re-extract; a flat curve needs none.
    workflow_tag: methylseq
    data_collection_tag: bismark_mbias_curve
    layout: {x: 0, y: 0, w: 6, h: 2}
  - component_type: card
    tag: ms-mbias-card-box
    index: ms-mbias-card-box
    section: M-bias (CpG)
    workflow_tag: methylseq
    data_collection_tag: bismark_mbias_curve
    use: bismark/mbias_curve
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: pct_methylation
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: "% methylation (spread)"
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    tag: ms-mbias-av-curve
    index: ms-mbias-av-curve
    section: M-bias (CpG)
    workflow_tag: methylseq
    data_collection_tag: bismark_mbias_curve
    use: bismark/mbias_cpg_profile
    config:
      x_title: Position in read (bp)
      y_title: "% methylation (CpG)"
      selection_enabled: true
      selection_column: sample
      legend_pos: right
    title: CpG M-bias, read 1 and read 2
    description: One line per sample per read; a curve that has not flattened by the read's end argues for an --ignore trim.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: table
    tag: ms-mbias-table
    section: M-bias (CpG)
    workflow_tag: methylseq
    data_collection_tag: bismark_mbias_curve
    use: bismark/mbias_curve
    row_selection_enabled: false
    title: CpG M-bias, raw positions
    description: "% methylation and coverage at every read position, CpG context."
    title_size: h3
    title_align: left
    layout: {x: 0, y: 9, w: 8, h: 7}
