  components:
  # ------------------------------------------------------- per-CpG density
  - component_type: text
    tag: ms-meth-density-intro
    section: Per-CpG methylation
    title: The shape of the methylome, site by site
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Every covered CpG of every library, binned into 2 % buckets. A healthy
      mammalian methylome is sharply bimodal: a peak at 0 % for the
      unmethylated islands and promoters, a taller one at 100 % for the
      methylated bulk. A library that has lost the bimodality, or whose 0 %
      peak has drifted upward, is reporting incomplete conversion or a depth too
      low for a site call, long before any mean does.
    workflow_tag: methylseq
    data_collection_tag: bismark_methylation_density
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ms-density-card-peak
    index: ms-density-card-peak
    section: Per-CpG methylation
    workflow_tag: methylseq
    data_collection_tag: bismark_methylation_density
    use: bismark/methylation_density
    aggregation: max
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: fraction_of_cpgs
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
