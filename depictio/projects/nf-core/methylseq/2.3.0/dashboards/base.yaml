  - component_type: figure
    workflow_tag: methylseq
    data_collection_tag: bismark_window_group_compare
    use: bismark/window_group_compare
    visu_type: histogram
    mode: code
    code_content: |-
      # The per-window difference, stacked by the call each window received.
      order = ['Hypermethylated', 'Not significant', 'Hypomethylated']
      fig = px.histogram(df.to_pandas(), x='delta_methylation', color='direction', nbins=60, category_orders={'direction': order}, color_discrete_map=depictio_category_colors.get('direction') or {}, labels={'delta_methylation': 'Difference, group_a minus group_b (points)', 'direction': ''})
      fig.update_layout(barmode='stack', margin=dict(t=10))
      fig.update_yaxes(title_text='Windows')
    section: Effect and significance
    tag: ms-cmp-histogram
    index: cmp-delta-histogram
    title: How the differences spread
    description: One mode centred on zero is no systematic shift, whatever the top window says.
    layout: {x: 4, y: 0, w: 4, h: 6}
