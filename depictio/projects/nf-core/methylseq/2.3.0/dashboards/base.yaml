    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 7}

  # ------------------------------------------------------ the locus section
  # Plan C.5: one navigator and the tracks that follow its region. The
  # navigator (the significance of the group difference per window over the
  # hg38 genes) opens on NKX2-1, where the only window of the megatest that
  # passes padj 0.05 sits. Its score_threshold makes the server keep every
  # window above padj 0.05 whole while it samples the rest, so the hit is never
  # sampled away; the difference itself is a follower on the same collection,
  # whose fetch is narrowed to the region and therefore complete.
  # It sits on bismark_window_group_compare (19,350 rows) rather than on the
  # 135,450-row binned collection because a navigator fetches its whole
  # collection, sampled to the 10,000-point budget, whatever region it shows:
  # on the binned rows that left about 7 % of the windows in a region. The
  # per-library lanes follow the region instead (follow_region_filter), so
  # their fetch is narrowed to the region through the region link in
  # template.yaml and every window is drawn. The earlier coverage_track +
  # genome_view pair on bismark_binned_methylation was two drawings of the same
  # rows (test_no_double_track_binding); the follower replaces both.
  - component_type: text
    tag: ms-track-intro
    section: Methylation along the genome
    title: One region, the methylome and the comparison on one axis
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The navigator opens on chr14:35.5-37.5 Mb around NKX2-1, where the only
      window of this run that passes padj 0.05 sits: at 36.49 Mb the three
      MShef11 low-oxygen lanes drop to about 55 % while the four MShef4 lanes
      stay near 80 %, a difference of 24 points. Type another locus or a gene
      symbol in the navigator header, or brush its axis, and the per-library
      lanes and the difference track below redraw on the same region. Windows are 10
      kb, strided across the genome, so a region shows every window the cohort
      shares rather than every CpG.
    workflow_tag: methylseq
    data_collection_tag: bismark_binned_methylation
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: ms-track-av-navigator
    index: ms-track-av-navigator
    section: Methylation along the genome
    workflow_tag: methylseq
    data_collection_tag: bismark_window_group_compare
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      controls_placement: header
      chr_col: chromosome
      pos_col: position
      end_col: end
      score_col: neg_log10_padj
      feature_col: window_id
      category_col: direction
      mark: point
      point_size: 7
      score_threshold: 1.3
      annotation: hg38
      assembly: hg38
      score_title: "-log10(padj)"
      region_filter_enabled: true
      default_region: "chr14:35,500,000-37,500,000"
    title: Locus navigator, significance of the group difference per window
    description: The adjusted significance of the MShef11 against MShef4 difference per 10 kb window over the hg38 genes, coloured by the call; windows above padj 0.05 are always drawn. The locus field in the header (a region or a gene symbol) and a brush on the axis move every track below.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 3}
  - component_type: advanced_viz
    tag: ms-track-av-genomeview
    index: ms-track-av-genomeview
    section: Methylation along the genome
    workflow_tag: methylseq
    data_collection_tag: bismark_binned_methylation
    use: bismark/methylation_genome_view
    config:
      mark: point
      point_size: 6
      facet_by_sample: true
      max_facets: 8
      assembly: hg38
      score_title: "% methylation"
      region_filter_enabled: false
      follow_region_filter: true
    title: Binned CpG methylation per library on the same region
    description: One lane per library, every shared window of the navigator's region; the MShef11 lanes are the three low-oxygen replicates.
    title_size: h3
    layout: {x: 0, y: 5, w: 8, h: 7}
  - component_type: advanced_viz
    tag: ms-track-av-delta
    index: ms-track-av-delta
    section: Methylation along the genome
    workflow_tag: methylseq
    data_collection_tag: bismark_window_group_compare
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      chr_col: chromosome
      pos_col: position
      end_col: end
      score_col: delta_methylation
      feature_col: window_id
      category_col: direction
      mark: point
      point_size: 7
      assembly: hg38
      score_title: "MShef11 - MShef4 (pp)"
      region_filter_enabled: false
      follow_region_filter: true
    title: MShef11 minus MShef4 on the same region
    description: The group difference in percentage points for every window of the navigator's region; a run of windows on one side of zero is a regional shift, a lone point is noise.
    title_size: h3
    layout: {x: 0, y: 12, w: 8, h: 3}

  # ------------------------------------------------------ cohort structure
  - component_type: text
    tag: ms-structure-intro
    section: Cohort structure
    title: Do the libraries separate by the design
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The same sample-by-window matrix, read three ways: the first components
      of a PCA over it, the pairwise correlation between libraries, and the
      windows that move most across the cohort. What you want to see is the
      design in the first two and nothing else; a library that lands with the
      wrong block in all three is a swap, a mislabelled sheet, or a conversion
      failure that flattened its methylome.
    workflow_tag: methylseq
    data_collection_tag: bismark_window_pca
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
