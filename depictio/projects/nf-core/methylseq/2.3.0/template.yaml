    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the M-bias curves by the samples picked in the left panel"
    enabled: true

  # Hub -> the run summary and the per-CpG collections. Every one of these
  # carries a `sample` column matching the samplesheet name directly, so the
  # resolver is `direct`; the cohort-level results (correlation, top-variable
  # windows, group comparison) have libraries as COLUMNS rather than rows and
  # are filtered by their own tab-local filters instead.
  - source_dc_tag: "samples"
    source_column: "sample_id"
    target_dc_tag: "bismark_summary_report"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the run summary by the samples picked in the left panel"
    enabled: true

  - source_dc_tag: "samples"
    source_column: "sample_id"
    target_dc_tag: "bismark_mbias_all_contexts"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the per-context M-bias curves by the samples picked in the left panel"
    enabled: true

  - source_dc_tag: "samples"
