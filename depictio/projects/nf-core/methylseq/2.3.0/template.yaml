    target_dc_tag: "bismark_methylation_density"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the per-CpG methylation density curves by the samples picked in the left panel"
    enabled: true

  - source_dc_tag: "samples"
    source_column: "sample_id"
    target_dc_tag: "bismark_window_pca"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample_id"
    description: "Filter the library PCA by the samples picked in the left panel"
    enabled: true

  - source_dc_tag: "samples"
    source_column: "sample_id"
    target_dc_tag: "qualimap_bamqc_genome_results"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the Qualimap BamQC summary by the samples picked in the left panel"
    enabled: true

  - source_dc_tag: "samples"
    source_column: "sample_id"
    target_dc_tag: "qualimap_coverage_across_reference"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the depth track by the samples picked in the left panel"
    enabled: true

  - source_dc_tag: "samples"
    source_column: "sample_id"
    target_dc_tag: "qualimap_coverage_histogram"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the depth histogram by the samples picked in the left panel"
    enabled: true

  - source_dc_tag: "samples"
    source_column: "sample_id"
    target_dc_tag: "qualimap_genome_fraction_coverage"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the genome-fraction curves by the samples picked in the left panel"
