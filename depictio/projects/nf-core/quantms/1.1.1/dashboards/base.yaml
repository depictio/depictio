    title: Retention-time gap along the gradient
    description: 'One point per precursor, coloured by {GROUP_COL_DISPLAY}. A cloud flat on zero says the library predicts the run; a slope or a condition lifted off the others is a drift to check.'
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: quantms
    data_collection_tag: quantms_precursors
    visu_type: histogram
    mode: code
    code_content: |-
      fig = px.histogram(df.to_pandas(), x='length', color='modification_state', barmode='group', histnorm='percent', color_discrete_map=depictio_category_colors.get('modification_state') or {}, labels={'length': 'Peptide length (residues)', 'modification_state': ''})
      fig.update_yaxes(title='Share of precursors (%)')
      fig.update_layout(margin=dict(t=10), legend_title_text='')
    section: Peptide properties
    tag: qm-id-fig-length
    index: id-length-histogram
    title: Peptide length
    description: 'Share of the unmodified and of the modified precursors at each peptide length; each series sums to 100, so a shift between them is not hidden by their sizes.'
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: figure
    workflow_tag: quantms
    data_collection_tag: quantms_precursors
    visu_type: violin
    mode: code
    code_content: |-
      grp = depictio_group_by[0] if depictio_group_by else "{GROUP_COL}"
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get("{GROUP_COL}") or {}
      order = df.group_by('run_id').agg(pl.col('evidence').median().alias('m')).sort('m')['run_id'].to_list()
      fig = px.violin(df.to_pandas(), y='run_id', x='evidence', color=grp if grp in df.columns else None, orientation='h', box=True, points=False, color_discrete_map=colors, category_orders={'run_id': order}, labels={'run_id': '', 'evidence': 'DIA-NN evidence score'})
      fig.update_yaxes(automargin=True)
      fig.update_layout(margin=dict(t=10), legend_title_text='', violinmode='overlay')
    section: Peptide properties
    tag: qm-id-fig-score
    index: id-score-violin
    title: Identification confidence per run
    description: 'DIA-NN evidence score of the precursors of each run, weakest median on top. A run shifted to lower scores was identified less confidently than the others.'
    layout: {x: 4, y: 0, w: 4, h: 5}
  - component_type: table
