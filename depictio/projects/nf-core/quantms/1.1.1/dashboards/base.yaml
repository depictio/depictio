version: 1
# nf-core/quantms 1.1.1 (DIA, DIA-NN), on the family rules of depictio/projects/nf-core/RULES.md
# (ampliseq/2.18.0 is the reference implementation).
#
# Funnel: how the runs were acquired and what they identified (Data & QC) ->
# which proteins were quantified, how completely, and how well the runs of a
# condition agree and the conditions separate -> which proteins change between
# conditions (Quantification). The design (`samples`) is what every filter
# starts from: its links carry a pick to every run-level table by run_id and to
# the per-condition tables by the condition column.
#
# There is no MultiQC tab: quantms 1.1.1 reports through pmultiqc custom
# content, with no MultiQC module and no multiqc.parquet to read. Its plots are
# rebuilt here from the result tables. The run is the DIA-NN route only; the DDA
# and isobaric routes write other tables.
main_dashboard:
  title: nf-core/quantms
  subtitle: Label-free DIA proteomics, from the spectra to the proteins that change
  project_tag: quantms DIA Proteomics
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family.
  category_colors:
    '{GROUP_COL}': auto
    direction:
      Up: '#e03131'
      Down: '#1c7ed6'
      Not significant: '#adb5bd'
    modification_state:
      Unmodified: '#868e96'
      Modified: '#f76707'
    detection:
      All runs: '#0ca678'
      Some runs: '#f59f00'
      One run: '#e03131'
    peptide_support:
      1 peptide: '#e03131'
      2 to 3 peptides: '#f59f00'
      4 or more peptides: '#0ca678'
    charge_state: auto
    specificity:
      Proteotypic: '#1c7ed6'
      Shared: '#adb5bd'
    pair: auto
    contrast: auto
    p_region:
      p below 0.05: '#e8590c'
      p of 0.05 or more: '#adb5bd'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. Both
  # are bound to the design, the source of every run link.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab, which no route removes.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The design behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The per-run summary behind the tiles
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  - component_type: interactive
    workflow_tag: quantms
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Key figures
    tag: qm-ov-kf-group
    index: ov-kf-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: quantms
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: run_id
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Run
    section: Key figures
    tag: qm-ov-kf-run
    index: ov-kf-run
    title: Run
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: text
    title: nf-core/quantms
    logo: https://raw.githubusercontent.com/nf-core/quantms/master/docs/images/nf-core-quantms_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/quantms/master/docs/images/nf-core-quantms_logo_dark.png
    order: 1
    body: >
      Mass-spectrometry proteomics turned into protein quantities: how the runs were
      acquired, what DIA-NN identified in them, how well the replicates agree and which
      proteins differ between conditions. [Run parameters](params:)
    tag: qm-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  # The study: what the design says was measured. A column an SDRF may lack (fraction,
  # organism) has a line of its own, so the line goes when the column does.
  - component_type: text
    surface: card
    values:
      runs: {dc: samples, column: run_id, aggregation: nunique, format: integer}
      samples: {dc: samples, column: sample, aggregation: nunique, format: integer}
      conds: {dc: samples, column: '{GROUP_COL}', aggregation: nunique, format: integer}
      reps: {dc: samples, column: replicate, aggregation: max, format: integer}
      fractions: {dc: samples, column: fraction, aggregation: nunique, format: integer}
      organism: {dc: samples, column: organism, aggregation: top}
    body: |
      ### The study
      - ![](icon:mdi:flask-outline) **Runs** {{runs}} raw files from {{samples}} samples
      - ![](icon:mdi:shape-outline) **Conditions** {{conds}}
      - ![](icon:mdi:layers-outline) **Replicates** up to {{reps}} runs of one condition
      - ![](icon:mdi:filter-variant) **Fractions** {{fractions}} per sample
      - ![](icon:mdi:dna) **Organism** {{organism}}
      - ![](icon:mdi:file-table-outline) **Samplesheet** [one row per run](section:Sample sheet), its path in [the run parameters](params:input)
      - ![](icon:mdi:palette-outline) **{GROUP_COL_DISPLAY}** {{legend:{GROUP_COL}}}
    tag: qm-ov-study
    index: ov-study
    layout: {x: 0, y: 1, w: 5, h: 4}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash.
  - component_type: text
    surface: card
    body: |
      ### The run
      - ![](icon:mdi:source-branch) **Pipeline** nf-core/quantms 1.1.1
      - ![](icon:mdi:radar) **Acquisition** {{param:acquisition_method}}
      - ![](icon:mdi:magnify-scan) **Enzyme** {{param:enzyme}}
      - ![](icon:mdi:ruler) **Tolerances** {{param:precursor_mass_tolerance}}, {{param:fragment_mass_tolerance}}
      - ![](icon:mdi:molecule) **Database** {{param:database}}
    tag: qm-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 4}
  # The marks take the family's colour (the header's), not the theme's blue.
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Five steps from spectra to protein changes
      Each step names its settings and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:waveform) **Acquire** Spectra of every run · [Settings](params:acquisition) · [Acquisition](tab:Acquisition)
      2. ![](icon:mdi:magnify-scan) **Identify** DIA-NN matches spectra to a library · [Settings](params:diann) · [Identification](tab:Identification)
      3. ![](icon:mdi:molecule) **Quantify** Protein groups per run · [Settings](params:quantif) · [Proteins](tab:Proteins)
      4. ![](icon:mdi:set-merge) **Compare runs** Replicates and conditions · [Reproducibility](tab:Reproducibility)
      5. ![](icon:mdi:chart-scatter-plot) **Test** MSstats contrasts · [Settings](params:msstats) · [Differential abundance](tab:Differential abundance)
      :::
    tag: qm-ov-steps
    index: ov-steps
    layout: {x: 0, y: 5, w: 8, h: 3}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/quantms converts the raw files, searches every run against a spectral library with DIA-NN and quantifies the protein groups, then tests the conditions against each other with MSstats. This page sums up one run; each tab behind it answers one question, in the order of the steps above.

      The sample filters in the left panel apply to every tab: narrow the runs once and the whole dashboard follows. A bar above a section narrows that section only.
    tag: qm-ov-about
    index: ov-about
    layout: {x: 0, y: 8, w: 8, h: 3}
  - component_type: card
    workflow_tag: quantms
    data_collection_tag: samples
    aggregation: nunique
    column_name: run_id
    column_type: object
    secondary_layout: composition
    breakdown_col: '{GROUP_COL}'
    display:
      icon_name: mdi:flask-outline
      icon_color: orange
      caption: 'in the design, by {GROUP_COL_DISPLAY}'
      link: tab:Acquisition
    section: Key figures
    tag: qm-ov-kf-runs
    index: ov-kf-runs
    title: Runs
    description: 'Runs in the design, one raw file each. The bar splits them by {GROUP_COL_DISPLAY}.'
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: quantms
    data_collection_tag: quantms_run_summary
    aggregation: median
    column_name: protein_groups
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:molecule
      icon_color: violet
      caption: 'per run, with its spread'
      link: tab:Proteins
      decimals: 0
    section: Key figures
    tag: qm-ov-kf-proteins
    index: ov-kf-proteins
    title: Protein groups
    description: 'Protein groups quantified in a run, the median over the runs in view. The box shows the spread between runs.'
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: quantms
    data_collection_tag: quantms_protein_conditions
    aggregation: median
    column_name: cv_pct
    column_type: float64
    secondary_layout: threshold
    threshold_value: 20
    threshold_direction: max
    threshold_warn: 30
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: teal
      caption: 'median CV %; the strip, groups at 20 or less'
      link: tab:Reproducibility
      decimals: 1
    section: Key figures
    tag: qm-ov-kf-cv
    index: ov-kf-cv
    title: Variation
    description: 'Coefficient of variation of a protein group between the runs of its condition, in percent: the median over proteins and conditions. Under 20 is tight for label-free quantification, over 30 is noisy; the strip counts the protein groups at 20 or less.'
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: quantms
    data_collection_tag: quantms_comparisons
    aggregation: count
    column_name: protein
    column_type: object
    filter_expr: "col('direction') != 'Not significant'"
    secondary_layout: composition
    breakdown_col: direction
    display:
      icon_name: mdi:flash
      icon_color: pink
      caption: 'significant calls, by direction'
      link: tab:Differential abundance
    section: Key figures
    tag: qm-ov-kf-significant
    index: ov-kf-significant
    title: Significant proteins
    description: 'Proteins with an adjusted p-value below 0.05 and a two-fold change or more, over every tested contrast. The bar splits them by direction.'
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: interactive
    workflow_tag: quantms
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Findings
    tag: qm-ov-findings-group
    index: ov-findings-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: quantms
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: run_id
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Run
    section: Findings
    tag: qm-ov-findings-run
    index: ov-findings-run
    title: Run
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data.
  - component_type: text
    surface: card
    values:
      n_prec: {dc: quantms_precursors, column: peptidoform, aggregation: nunique, format: integer}
      n_prot: {dc: quantms_proteins, column: protein_group, aggregation: nunique, format: integer}
      n_full: {dc: quantms_protein_summary, column: protein_group, aggregation: count, format: integer,
        filter_expr: "col('detection') == 'All runs'"}
      cv: {dc: quantms_protein_conditions, column: cv_pct, aggregation: median, format: 'decimals:1'}
      n_sig: {dc: quantms_comparisons, column: protein, aggregation: count, format: integer,
        filter_expr: "col('direction') != 'Not significant'"}
      n_test: {dc: quantms_comparisons, column: protein, aggregation: count, format: integer}
    body: |
      - **{{n_prec}}** distinct precursors identified – at 1% FDR [Identification](tab:Identification)
      - **{{n_prot}}** protein groups quantified – over the runs in view [Proteins](tab:Proteins)
      - **{{n_full}}** protein groups quantified in every run – the complete core [Proteins](tab:Proteins)
      - **{{cv}} %** median variation between replicates – per protein and condition, under 20 % is tight [Reproducibility](tab:Reproducibility)
      - **{{n_sig}}** of {{n_test}} tested proteins change significantly – adjusted p below 0.05, two-fold or more [Differential abundance](tab:Differential abundance)
    section: Findings
    tag: qm-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: highlight
    section: Findings
    source_tab: Reproducibility
    source_component: rep-pca
    caption: 'One point per run, placed by its protein quantities: the runs of a condition should sit together and the conditions apart. A run beside another condition is an injection to check.'
    tag: qm-ov-hl-projection
    index: ov-hl-projection
    layout: {x: 0, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Proteins
    source_component: prot-cv-intensity
    caption: 'Variation between runs against abundance, one point per protein group: precision usually falls toward the faint end. The dashed line is a CV of 20 %, under which quantification is tight; the most variable groups above it are labelled.'
    tag: qm-ov-hl-variation
    index: ov-hl-variation
    layout: {x: 4, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Differential abundance
    source_component: da-volcano
    caption: 'Adjusted p-value against log2 fold change for every tested protein, the strongest labelled by gene; the dashed lines are the cut-offs, an adjusted p of 0.05 and a twofold change either way. Nothing beyond them means no protein changed enough to call.'
    tag: qm-ov-hl-volcano
    index: ov-hl-volcano
    layout: {x: 0, y: 6, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Differential abundance
    source_component: da-pvalue-histogram
    caption: 'Raw p-values of the tested proteins. The orange bin holds the proteins below 0.05; a bar above the dashed level (what to expect if none changed) is the excess that marks real changes, a flat histogram a test with nothing to find.'
    tag: qm-ov-hl-pvalues
    index: ov-hl-pvalues
    layout: {x: 4, y: 6, w: 4, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers.
  - component_type: text
    body: |
      ### Data & QC
      - [Acquisition](tab:Acquisition)
      - [Identification](tab:Identification)

      ### Quantification
      - [Proteins](tab:Proteins)
      - [Reproducibility](tab:Reproducibility)
      - [Differential abundance](tab:Differential abundance)
    section: How to read this dashboard
    tag: qm-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: quantms
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: qm-filter-group
    index: sample-filters-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: quantms
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: run_id
    column_type: object
    display:
      icon_name: mdi:file-document-outline
      custom_color: cyan
    section: Sample filters
    group: Sample scope
    tag: qm-filter-run
    index: sample-filters-run
    title: Run
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: table
    workflow_tag: quantms
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: run_id
    section: Sample sheet
    tag: qm-sample-sheet
    index: sample-sheet
    title: Design
    description: >-
      One row per run, with its sample, condition, replicate and acquisition settings, as the sample
      sheet (SDRF) states them.

      How to read: check first that the design is the one you meant, since every comparison on the
      other tabs rests on the condition and replicate columns. A condition with a single run has no
      replicate pair and no variation to measure. A picked row narrows the dashboard to that run.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: quantms
    data_collection_tag: quantms_run_summary
    row_selection_enabled: true
    row_selection_column: run_id
    section: Reference tables
    tag: qm-ref-run-summary
    index: ref-run-summary
    title: Run summary
    description: >-
      One row per run: precursors, peptides and protein groups identified, identification yield per
      thousand MS2 spectra, modified and missed-cleavage shares, and the median retention-time gap.

      How to read: compare the rows of one experiment. A run whose yield, modified share or
      missed-cleavage share departs from the others is the one to open in
      [Identification](tab:Identification); a high retention-time gap points at a gradient that
      drifted. No value is rated here.
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
# ============================================================================
# Data & QC
# ============================================================================
- title: Acquisition
  subtitle: Were the runs acquired alike?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: mdi:waveform
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Gradient filters
    icon: mdi:filter-variant
    color: blue
    description: Narrows the gradient profiles to a window of retention time
  grid_sections:
  - name: Acquisition at a glance
    icon: mdi:counter
    color: blue
    description: 'Spectra, gradient and peak counts of the runs'
  - name: Gradient
    icon: mdi:chart-line
    color: blue
    description: 'Spectra and signal per minute, one curve per run'
  - name: Spectrum content
    icon: mdi:chart-bar
    color: blue
    description: 'How many peaks the MS2 spectra hold'
  - name: Acquisition table
    icon: mdi:table
    color: gray
    description: 'The spectra summary of every run'
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      quantms converts every raw file to mzML and counts its spectra. Runs of one experiment
      should have the same gradient, the same MS2 rate and spectra of similar content, each within
      about 5% of the median of the runs. A run whose curve leaves the bundle, or whose spectra are emptier than its neighbours', was
      acquired differently from the rest.
    tag: qm-acq-intro
    index: acq-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: quantms
    data_collection_tag: quantms_acquisition_profile
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: rt_min
    column_type: float64
    display:
      icon_name: mdi:clock-outline
      custom_color: yellow
    section: Gradient filters
    group: Gradient
    tag: qm-acq-filter-rt
    index: acq-rt-range
    title: Retention time (min)
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: card
    workflow_tag: quantms
    data_collection_tag: quantms_acquisition
    aggregation: sum
    column_name: ms2_spectra
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:waveform
      icon_color: blue.4
      caption: 'per run, with its spread'
      format: si
    section: Acquisition at a glance
    tag: qm-acq-card-ms2
    index: acq-card-ms2
    title: MS2 spectra
    description: 'MS2 spectra acquired, summed over the runs in view. The box shows how many each run holds.'
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: quantms
    data_collection_tag: quantms_acquisition
    aggregation: median
    column_name: gradient_min
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:timer-outline
      icon_color: blue.6
      caption: 'minutes, with its spread'
      decimals: 0
    section: Acquisition at a glance
    tag: qm-acq-card-gradient
    index: acq-card-gradient
    title: Gradient
    description: 'Span between the first and the last spectrum of a run, in minutes: the median over the runs in view. Runs of one experiment sit within 5% of it.'
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: quantms
    data_collection_tag: quantms_acquisition
    aggregation: median
    column_name: median_ms2_peaks
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-histogram
      icon_color: blue.8
      caption: 'median per run, with its spread'
      decimals: 0
    section: Acquisition at a glance
    tag: qm-acq-card-peaks
    index: acq-card-peaks
    title: Peaks per MS2
    description: 'Number of peaks in a typical MS2 spectrum (the median of a run), then the median over the runs in view. Runs within 5% of each other were acquired alike.'
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: quantms
    data_collection_tag: quantms_acquisition
    aggregation: median
    column_name: ms2_per_min
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:speedometer
      icon_color: blue.9
      caption: 'spectra per minute, with its spread'
      decimals: 0
    section: Acquisition at a glance
    tag: qm-acq-card-rate
    index: acq-card-rate
    title: MS2 rate
    description: 'MS2 spectra acquired per minute of the gradient: the median over the runs in view. Runs of one experiment sit within 5% of it.'
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: quantms
    data_collection_tag: quantms_acquisition_profile
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: run_id
      x_col: rt_min
      y_col: ms2_spectra
      line_width: 1.5
      x_title: Retention time (min)
      y_title: MS2 spectra per minute
      legend_pos: none
    section: Gradient
    tag: qm-acq-av-ms2
    index: acq-ms2-profile
    title: MS2 spectra over the gradient
    description: >-
      Each curve is a run: the number of MS2 spectra acquired per minute of retention time. The
      question is whether the runs were acquired alike along the gradient.

      How to read: curves that overlay say the instrument sampled the gradient the same way in every
      run. A curve that is shifted in time, or flat where the others rise, is a run with a different
      gradient or a stalled acquisition; open the Spectra per run table for its totals. Hover names
      the run.

      Lines and annotations: no reference line is drawn; read each run against the others.
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: advanced_viz
    workflow_tag: quantms
    data_collection_tag: quantms_acquisition_profile
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: run_id
      x_col: rt_min
      y_col: median_base_peak_intensity
      line_width: 1.5
      log_y: true
      x_title: Retention time (min)
      y_title: Median MS2 base-peak intensity
      legend_pos: none
    section: Gradient
    tag: qm-acq-av-bpc
    index: acq-bpc-profile
    title: MS2 signal over the gradient
    description: >-
      Each curve is a run: the median base-peak intensity of its MS2 spectra per minute of retention
      time, a base-peak trace on a log axis. The question is whether the signal along the gradient
      is alike in every run.

      How to read: curves that overlay say the runs carried similar material through the same
      gradient. A curve far below the others is a run with a weaker signal, and one shifted in time
      is a gradient that drifted. Open [Identification](tab:Identification) to see whether the run
      also identified fewer precursors.

      Lines and annotations: no reference line is drawn; read each run against the others.
    layout: {x: 4, y: 0, w: 4, h: 5}
  - component_type: advanced_viz
    workflow_tag: quantms
    data_collection_tag: quantms_ms2_peak_bins
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: run_id
      x_col: bin_start
      y_col: fraction
      line_width: 1.5
      log_y: true
      x_title: Peaks in an MS2 spectrum (start of the bin of 100)
      y_title: Share of MS2 spectra
      legend_pos: none
    section: Spectrum content
    tag: qm-acq-av-peaks
    index: acq-peaks-profile
    title: Peaks per MS2 spectrum
    description: >-
      Each curve is a run: the share of its MS2 spectra holding a given number of peaks, in bins of
      100 peaks, on a log axis. The last bin holds 1000 peaks or more.

      How to read: runs of one experiment acquired alike show similar shapes. A run shifted to few
      peaks holds sparser spectra than the others, and one shifted to the right holds richer
      spectra.

      Lines and annotations: no reference line is drawn, because no published cut-off applies to the
      number of peaks per spectrum.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: quantms
    data_collection_tag: quantms_acquisition
    row_selection_enabled: true
    row_selection_column: run_id
    section: Acquisition table
    tag: qm-acq-table
    index: acq-table
    title: Spectra per run
    description: >-
      MS1 and MS2 counts, peaks, base-peak intensity and gradient length of every run.

      How to read: the gradient and the spectra counts should match across the runs of an
      experiment. A run that departs from the others on any of them is the one to open in the charts
      above. A picked row narrows the dashboard to that run.
    layout: {x: 0, y: 0, w: 8, h: 6}
