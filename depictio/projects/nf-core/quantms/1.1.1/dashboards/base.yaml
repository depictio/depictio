      max_rows: 9
    section: Run-to-run correlation
    tag: qm-rep-av-corr
    index: rep-correlation
    title: Run-to-run correlation
    description: 'Each cell is the Pearson correlation of the protein quantities of two runs; the dendrograms group the runs that behave alike. Replicate runs correlate above 0.95, so the colours differ little.'
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: figure
    workflow_tag: quantms
    data_collection_tag: quantms_replicate_pairs
    visu_type: scatter
    mode: code
    code_content: |-
      # Difference against mean of the log2 quantities of two runs, one point per protein group and pair; the dotted line is no difference and the grey band is within one log2 unit (a twofold change).
      grp = depictio_group_by[0] if depictio_group_by else '{GROUP_COL}'
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get('{GROUP_COL}') or {}
      d = df if grp in df.columns else df.with_columns(pl.lit('All runs').alias(grp))
      d = d.filter(pl.col('log2_x').is_not_null() & pl.col('log2_y').is_not_null()).with_columns(((pl.col('log2_x') + pl.col('log2_y')) / 2).alias('mean_log2'), (pl.col('log2_y') - pl.col('log2_x')).alias('diff_log2'))
      fig = px.scatter(d.to_pandas(), x='mean_log2', y='diff_log2', color=grp, color_discrete_map=colors, opacity=0.45, hover_name='genes', hover_data=['pair', 'run_x', 'run_y'], labels={'mean_log2': 'Mean log2 quantity of the two runs', 'diff_log2': 'Difference between the runs (log2)', grp: ''})
      fig.update_traces(marker=dict(size=4))
      fig.add_hrect(y0=-1, y1=1, fillcolor='rgba(134,142,150,0.2)', line_width=0, layer='below')
      fig.add_hline(y=0, line_dash='dot', line_width=1, opacity=0.6)
      fig.add_annotation(text='twofold difference either way', xref='paper', yref='y', x=1, y=1, xanchor='right', yanchor='bottom', showarrow=False)
      fig.add_annotation(text='no difference', xref='paper', yref='y', x=1, y=0, xanchor='right', yanchor='bottom', showarrow=False)
      fig.update_yaxes(automargin=True, zeroline=False)
      fig.update_layout(margin=dict(t=10), legend=dict(orientation='h', y=-0.2))
    section: Replicate agreement
    tag: qm-rep-av-pairs
    index: rep-pairs-scatter
    title: Run against run, difference over mean
    description: One point per protein group quantified in both runs of a pair, coloured by condition. The dotted line is no difference between the two runs (a log2 difference of 0). The grey band is one log2 unit either side of it, a twofold difference, the same twofold the differential abundance calls use; it is a reading guide, not a quality cut-off. A reproducible pair stays inside the band at every level, and a tilt or a fan marks a pair to check.
    layout: {x: 0, y: 0, w: 8, h: 6}
