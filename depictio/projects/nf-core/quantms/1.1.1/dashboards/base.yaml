  # One view of the per-run quality measures, the weakest run on top: the three
  # readings sit on their own axes, each with the median of the runs as a guide.
  - component_type: figure
    workflow_tag: quantms
    data_collection_tag: quantms_run_summary
    visu_type: bar
    mode: code
    code_content: |-
      grp = depictio_group_by[0] if depictio_group_by else "{GROUP_COL}"
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get("{GROUP_COL}") or {}
      measures = {'precursors': 'Precursors', 'precursors_per_1000_ms2': 'Precursors per 1000 MS2', 'modified_pct': 'Modified (%)', 'missed_cleavage_pct': 'Missed cleavage (%)'}
      measures = {c: t for c, t in measures.items() if c in df.columns and df[c].null_count() < df.height}
      lab = 'run_label' if 'run_label' in df.columns else 'run_id'
      rank = 'precursors_per_1000_ms2' if 'precursors_per_1000_ms2' in measures else 'precursors'
      dev = df.with_columns([((pl.col(c) / pl.col(c).median() - 1) * 100).alias(c) for c in measures])
      order = dev.sort(rank, nulls_last=True)[lab].to_list()
      keep = [lab] + ([grp] if grp in df.columns else [])
      long = dev.select(keep + list(measures)).unpivot(index=keep, variable_name='measure', value_name='value').with_columns(pl.col('measure').replace(measures)).drop_nulls('value')
      lim = max(15.0, float(long['value'].abs().max() or 0) * 1.1)
      fig = px.bar(long.to_pandas(), y=lab, x='value', color=grp if grp in df.columns else None, facet_col='measure', orientation='h', color_discrete_map=colors, category_orders={lab: order, 'measure': list(measures.values())}, labels={lab: '', 'value': '', 'measure': ''})
      fig.update_xaxes(range=[-lim, lim], ticksuffix='%', zeroline=True)
      fig.update_yaxes(automargin=True)
      fig.add_vrect(x0=-10, x1=10, fillcolor='rgba(134,142,150,0.2)', line_width=0, layer='below', row='all', col='all')
      fig.add_trace(go.Scatter(x=[None], y=[None], mode='markers', marker=dict(symbol='square', size=12, color='rgba(134,142,150,0.45)'), name='Grey band: within 10% of the median', showlegend=True))
      fig.for_each_annotation(lambda a: a.update(text=a.text.split('=')[-1]))
      fig.add_annotation(text='Deviation from the median of the runs in view', xref='paper', yref='paper', x=0.5, y=-0.1, showarrow=False)
      fig.update_layout(margin=dict(t=30, b=70), legend_title_text='')
    section: Run quality
    tag: qm-id-fig-runqc
    index: id-run-qc
    title: Run quality, weakest run first
    description: 'The grey band in each panel is the range within 10% either side of the median of the runs in view; a bar that leaves it is a run to check. The 10% is a rule of thumb of this dashboard for runs of one experiment, not a published cut-off. Each bar is how far a run sits from that median, in percent, for precursors, yield per thousand MS2 spectra, modified share and missed-cleavage share; runs are sorted by yield, weakest on top, and coloured by condition.'
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: quantms
    data_collection_tag: quantms_precursors
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: predicted_rt_min
      y_col: rt_error_min
      color_col: '{GROUP_COL}'
      label_col: peptidoform
