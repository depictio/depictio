    description: 'Absolute log2 fold change of a tested protein, the median over the proteins in view.'
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: quantms
    data_collection_tag: quantms_comparisons
    aggregation: min
    column_name: adj_p_value
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:sigma
      icon_color: pink.6
      caption: 'lowest, with the distribution'
      decimals: 2
    section: Calls at a glance
    tag: qm-da-card-padj
    index: da-card-padj
    title: Smallest adjusted p
    description: 'Lowest Benjamini-Hochberg adjusted p-value among the proteins in view. The histogram shows all of them.'
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: quantms
    data_collection_tag: quantms_comparisons
    aggregation: median
    column_name: se
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: pink.8
      caption: 'median, with its spread'
      decimals: 2
    section: Calls at a glance
    tag: qm-da-card-se
    index: da-card-se
    title: Standard error
    description: 'Standard error of the log fold change, the median over the proteins in view: the noise a call has to beat.'
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: quantms
    data_collection_tag: quantms_comparisons
    aggregation: count
    column_name: protein
    column_type: object
    filter_expr: "col('direction') != 'Not significant'"
    secondary_layout: composition
    breakdown_col: direction
    display:
      icon_name: mdi:flash
      icon_color: pink.9
      caption: 'significant calls, by direction'
    section: Calls at a glance
    tag: qm-da-card-calls
    index: da-card-calls
    title: Significant proteins
    description: 'Proteins with an adjusted p-value below 0.05 and a two-fold change or more. The bar splits them by direction.'
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: quantms
    data_collection_tag: quantms_comparisons
    visu_type: bar
    mode: code
    code_content: |-
      # Proteins called Up and Down in each contrast, with the number tested; a contrast that calls nothing still shows its two empty bars.
      d = df.filter(pl.col('p_value').is_not_null())
      tested = d.group_by('contrast').agg(pl.col('protein').n_unique().alias('tested')).sort('contrast')
      names = {c: '%s (%d tested)' % (c, t) for c, t in zip(tested['contrast'].to_list(), tested['tested'].to_list())}
      rows = [{'contrast': names[c], 'direction': dr, 'proteins': d.filter((pl.col('contrast') == c) & (pl.col('direction') == dr)).height} for c in tested['contrast'].to_list() for dr in ['Up', 'Down']]
      calls = pl.DataFrame(rows, schema={'contrast': pl.Utf8, 'direction': pl.Utf8, 'proteins': pl.Int64})
      order = calls.group_by('contrast').agg(pl.col('proteins').sum().alias('n')).sort(['n', 'contrast'], descending=[False, True])['contrast'].to_list()
      fig = px.bar(calls.to_pandas(), y='contrast', x='proteins', color='direction', barmode='group', orientation='h', text='proteins', color_discrete_map=depictio_category_colors.get('direction') or {}, category_orders={'direction': ['Up', 'Down'], 'contrast': order}, labels={'contrast': '', 'proteins': 'Proteins called', 'direction': ''})
      fig.update_traces(textposition='outside', cliponaxis=False)
      fig.update_yaxes(automargin=True)
      fig.update_xaxes(dtick=1 if calls['proteins'].max() <= 8 else None, rangemode='tozero')
      fig.update_layout(margin=dict(t=10, r=30), legend_title_text='', legend=dict(orientation='h', y=-0.3))
    section: Calls per contrast
    tag: qm-da-fig-contrast-calls
    index: da-contrast-calls
    title: Proteins called in each contrast
    description: >-
      Each pair of bars is a contrast: the number of proteins called Up (higher in the first
      condition of the contrast) and Down (lower), with the number of proteins tested in brackets.
      The question is how many proteins change in each comparison.

      How to read: a contrast with two empty bars was tested and found nothing to call, which says
      the conditions do not differ enough at this depth, not that they are identical. A contrast
      with many calls is the one to open in the volcano below.

      Lines and annotations: a call needs an adjusted p-value below 0.05 and a fold change of at
      least twofold either way. The 0.05 is MSstats' own default significance level for adjusted
      p-values in its result plots; MSstats applies no fold-change cut-off by default, so the
      twofold is this dashboard's setting.

      Source: MSstats, groupComparisonPlots,
      https://rdrr.io/bioc/MSstats/man/groupComparisonPlots.html

      Note: the twofold cut-off has no published source here.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: quantms
    data_collection_tag: quantms_comparisons
    viz_kind: volcano
    config:
      viz_kind: volcano
      feature_id_col: protein_group
      effect_size_col: log2fc
      significance_col: adj_p_value
      label_col: genes
      category_col: direction
      significance_threshold: 0.05
      effect_threshold: 1.0
      fold_change_threshold: 1.0
      top_n_labels: 8
      show_labels: true
      effect_label: log2 fold change
      significance_label: adjusted p-value
      avg_log_intensity_col: avg_log2_intensity
      log2_fold_change_col: log2fc
      p_value_col: p_value
      view: volcano
      views: [volcano, ma, qq]
      show_ci: true
      show_identity: true
    section: Volcano, MA and QQ
    tag: qm-da-av-volcano
    index: da-volcano
    title: Volcano, MA and QQ
    description: >-
      Each point is a protein group in a contrast: the significance (-log10 of the adjusted p-value)
      against the log2 fold change. The View switch puts the fold change against the mean abundance
      (MA), or the raw p-values against the null (QQ).

      How to read: the proteins far out on either side and high up are the strong changes. A protein
      beyond both cut-offs is called Up or Down, and the eight strongest are labelled by gene. With
      several contrasts the points of all are drawn together, so pick one in the Contrast filter.

      Lines and annotations: the horizontal dashed line is an adjusted p-value of 0.05, and the two
      vertical dashed lines are at log2 fold changes of -1 and 1, a twofold change either way. In
      the QQ view the diagonal is the null (observed equals expected) and the shaded band is its 95%
      confidence interval.

      Source: MSstats, groupComparisonPlots,
      https://rdrr.io/bioc/MSstats/man/groupComparisonPlots.html (the default significance level is
      0.05, with no fold-change cut-off by default).

      Note: the twofold cut-offs are this dashboard's own setting, not an MSstats default, and have
      no published source here.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: quantms
    data_collection_tag: quantms_comparisons
    visu_type: bar
    mode: code
    code_content: |-
      # Raw p-values in 20 bins of 0.05, so the first bin is exactly the p < 0.05 cut-off; with several contrasts the bars are stacked and coloured by contrast, with one the first bin is orange. The dashed line is the level a bin would hold if no protein changed: the share of unchanged proteins (pi0, Storey with lambda = 0.5, from the flat right half) times the bin average.
      d = df.filter(pl.col('p_value').is_not_null())
      n = d.height
      cut = 0.05
      counts, edges = np.histogram(d['p_value'].to_numpy(), bins=20, range=(0, 1))
      mid = (edges[:-1] + edges[1:]) / 2
      pi0 = min(1.0, float((d['p_value'] > 0.5).sum()) / (0.5 * max(n, 1)))
      level = pi0 * n / 20
      lo, hi = 'p below 0.05', 'p of 0.05 or more'
      colors = depictio_category_colors.get('p_region') or {}
      below = mid < cut
      contrasts = sorted(d['contrast'].unique().to_list()) if 'contrast' in d.columns else []
      if len(contrasts) > 1:
          cc = depictio_category_colors.get('contrast') or {}
          bars = []
          for c in contrasts:
              cnt, edge = np.histogram(d.filter(pl.col('contrast') == c)['p_value'].to_numpy(), bins=20, range=(0, 1))
              bars.append(go.Bar(x=mid.tolist(), y=cnt.tolist(), width=0.047, name=c, marker_color=cc.get(c), hovertemplate='p from %{customdata[0]:.2f} to %{customdata[1]:.2f}<br>%{y} proteins<extra></extra>', customdata=np.column_stack([edges[:-1], edges[1:]])))
          fig = go.Figure(bars)
          fig.update_layout(barmode='stack')
      else:
          fig = go.Figure([go.Bar(x=mid[keep].tolist(), y=counts[keep].tolist(), width=0.047, name=name, marker_color=colors.get(name), hovertemplate='p from %{customdata[0]:.2f} to %{customdata[1]:.2f}<br>%{y} proteins<extra></extra>', customdata=np.column_stack([edges[:-1][keep], edges[1:][keep]])) for name, keep in ((lo, below), (hi, ~below))])
      fig.add_scatter(x=[0, 1], y=[level, level], mode='lines', name='level if none changed', line=dict(dash='dash', width=1.5, color='gray'), hoverinfo='skip')
      fig.add_vline(x=cut, line_dash='dot', line_width=1, line_color='gray')
      n_low = int(counts[below].sum())
      chance = level * int(below.sum())
      fig.add_annotation(text='%d of %d proteins below %s<br>about %d expected if none changed<br>unchanged share (pi0): %d%%' % (n_low, n, cut, round(chance), round(pi0 * 100)), xref='paper', yref='paper', x=0.98, y=0.98, xanchor='right', yanchor='top', showarrow=False, align='right')
      fig.update_xaxes(title='Raw p-value', range=[0, 1])
      fig.update_yaxes(title='Proteins', rangemode='tozero')
      fig.update_layout(margin=dict(t=10), bargap=0, legend=dict(orientation='h', y=-0.3, title_text=''))
    section: Calibration
    tag: qm-da-fig-pvalue
    index: da-pvalue-histogram
    title: p-value histogram
    description: >-
      Each bar is a bin of 0.05 in the raw p-values of the tested proteins, so the first bin is
      exactly the p below 0.05. With one contrast the first bin is coloured as the proteins below
      0.05; with several, the bars are stacked and coloured by contrast.

      How to read: a flat histogram says a test with nothing to find. A bar well above the dashed
      level in the first bins is the excess that marks real changes. The note in the corner counts
      the proteins below 0.05, the number expected if none changed, and the unchanged share.

      Lines and annotations: the dashed line is the level a bin would hold if no protein changed,
      the estimated share of unchanged proteins (pi0) times the bin average. The dotted line is p =
      0.05. Pi0 is estimated as the share of p-values above 0.5 divided by 0.5, the estimator of
      Storey and Tibshirani with its parameter lambda set to 0.5, which is this dashboard's choice.

      Source: Storey and Tibshirani 2003, PNAS 100(16):9440-9445,
      https://pmc.ncbi.nlm.nih.gov/articles/PMC170937

      Note: the estimate assumes the right half of the histogram is flat, so a right half that is
      not flat makes the dashed level unreliable.
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: figure
    workflow_tag: quantms
    data_collection_tag: quantms_comparisons
    visu_type: histogram
    dict_kwargs: {x: log2fc, color: direction, barmode: stack, labels: {log2fc: log2 fold change, direction: ''}}
    section: Calibration
    tag: qm-da-fig-effect
    index: da-effect-histogram
    title: Fold changes
    description: >-
      Each bar is a bin of the log2 fold change of the tested proteins, stacked by call (Up, Down or
      Not significant).

      How to read: a distribution centred on zero says the runs are normalised alike. A distribution
      shifted to one side, with many calls in that direction, can come from a normalisation offset
      and not from biology, so check it against the run projection. The tails are where the calls
      sit.

      Lines and annotations: no reference line is drawn.
    layout: {x: 4, y: 0, w: 4, h: 5}
  - component_type: table
    workflow_tag: quantms
    data_collection_tag: quantms_comparisons
    row_selection_enabled: true
    row_selection_column: protein_group
    section: Protein detail
    tag: qm-da-table-comparisons
    index: da-table-comparisons
    title: MSstats results
    description: >-
      Every tested protein group in every contrast, with its log2 fold change, standard error,
      p-value, adjusted p-value, missing and imputed shares, and call.

      How to read: sort by the adjusted p-value, then check the missing and imputed shares of the
      proteins you care about, since a change that rests on imputed values is weaker. MSstats gives
      an issue when it could not test a protein. A picked row opens its record beside the table.

      Source: MSstats, groupComparison, https://rdrr.io/bioc/MSstats/man/groupComparison.html (tests
      changes in protein abundance across conditions with linear mixed-effects models).
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: quantms
    data_collection_tag: quantms_comparisons
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: protein_group
      title_col: genes
      selection_source: any
      linked_component: qm-da-table-comparisons
      sections: {Protein: [protein_group, protein, genes], Test: [contrast, direction, log2fc, adj_p_value, p_value], Support: [missing_pct, imputed_pct, avg_log2_intensity]}
      link_templates: {protein_group: 'https://www.uniprot.org/uniprotkb/{value}'}
    section: Protein detail
    tag: qm-da-record
    index: da-record
    title: Protein record
    description: >-
      The protein group picked in the table or in a figure, with one card per contrast it was tested
      in: its test (direction, fold change, p-values) and its support (missing and imputed shares,
      mean intensity).

      How to read: a call with a small adjusted p-value but a high imputed share is weaker than one
      measured in every run. The accession links to UniProt for a single-protein group.
    layout: {x: 5, y: 0, w: 3, h: 6}
