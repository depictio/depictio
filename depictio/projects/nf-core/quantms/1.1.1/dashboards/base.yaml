      icon_name: mdi:target
      icon_color: indigo.9
      caption: 'per 1000 MS2, with its spread'
      decimals: 1
    section: Identification at a glance
    tag: qm-id-card-yield
    index: id-card-yield
    title: Yield
    description: 'Precursors identified per thousand MS2 spectra acquired: the median over the runs in view.'
    layout: {x: 6, y: 0, w: 2, h: 2}
  # One view of the per-run quality measures, the weakest run on top: the three
  # readings sit on their own axes, each with the median of the runs as a guide.
  - component_type: figure
    workflow_tag: quantms
    data_collection_tag: quantms_run_summary
    visu_type: bar
    mode: code
    code_content: |-
      grp = depictio_group_by[0] if depictio_group_by else "{GROUP_COL}"
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get("{GROUP_COL}") or {}
      measures = {'precursors': 'Precursors', 'precursors_per_1000_ms2': 'Precursors per 1000 MS2', 'modified_pct': 'Modified (%)', 'missed_cleavage_pct': 'Missed cleavage (%)'}
      measures = {c: t for c, t in measures.items() if c in df.columns and df[c].null_count() < df.height}
      lab = 'run_label' if 'run_label' in df.columns else 'run_id'
      rank = 'precursors_per_1000_ms2' if 'precursors_per_1000_ms2' in measures else 'precursors'
      dev = df.with_columns([((pl.col(c) / pl.col(c).median() - 1) * 100).alias(c) for c in measures])
      order = dev.sort(rank, nulls_last=True)[lab].to_list()
      keep = [lab] + ([grp] if grp in df.columns else [])
      long = dev.select(keep + list(measures)).unpivot(index=keep, variable_name='measure', value_name='value').with_columns(pl.col('measure').replace(measures)).drop_nulls('value')
      lim = max(15.0, float(long['value'].abs().max() or 0) * 1.1)
      fig = px.bar(long.to_pandas(), y=lab, x='value', color=grp if grp in df.columns else None, facet_col='measure', orientation='h', color_discrete_map=colors, category_orders={lab: order, 'measure': list(measures.values())}, labels={lab: '', 'value': '', 'measure': ''})
      fig.update_xaxes(range=[-lim, lim], ticksuffix='%', zeroline=True)
      fig.update_yaxes(automargin=True)
      fig.add_vrect(x0=-10, x1=10, fillcolor='rgba(134,142,150,0.2)', line_width=0, layer='below', row='all', col='all')
      fig.add_trace(go.Scatter(x=[None], y=[None], mode='markers', marker=dict(symbol='square', size=12, color='rgba(134,142,150,0.45)'), name='Grey band: within 10% of the median', showlegend=True))
      fig.for_each_annotation(lambda a: a.update(text=a.text.split('=')[-1]))
      fig.add_annotation(text='Deviation from the median of the runs in view', xref='paper', yref='paper', x=0.5, y=-0.1, showarrow=False)
      fig.update_layout(margin=dict(t=30, b=70), legend_title_text='')
    section: Run quality
    tag: qm-id-fig-runqc
    index: id-run-qc
    title: Run quality, weakest run first
    description: >-
      Each bar is a run, in four panels: the precursors identified, the yield in precursors per
      thousand MS2 spectra, the share of modified precursors and the share with a missed cleavage. A
      bar is how far the run sits from the median of the runs in view, in percent. Runs are sorted
      by yield, weakest on top, and coloured by condition.

      How to read: a bar inside the grey band is within the spread of its experiment, and one that
      leaves it is a run to check. A weak run with a low yield points at the sample or the
      acquisition; a high missed-cleavage share can point at the digestion. Open
      [Acquisition](tab:Acquisition) for the spectra behind a weak run.

      Lines and annotations: the grey band in each panel spans 10 percent either side of the median
      of the runs in view, and the line at 0 is the median itself. The 10 percent is a display aid
      of this dashboard, not read from the run and not a published cut-off.

      Note: the median is taken over the runs in view, so a filter on a few runs moves the band.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: quantms
    data_collection_tag: quantms_precursors
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: predicted_rt_min
      y_col: rt_error_min
      color_col: '{GROUP_COL}'
      label_col: peptidoform
      x_title: Library-predicted retention time (min)
      y_title: Observed minus predicted retention time (min)
      reference_line: horizontal
      reference_value: 0
      density_threshold: 30000
      opacity: 0.4
      marker_size: 3
      legend_pos: bottom
    section: Retention time
    tag: qm-id-av-rt
    index: id-rt-residual
    title: Retention-time gap along the gradient
    description: >-
      Each point is an identified precursor, placed by its library-predicted retention time, with
      its height the observed minus the predicted retention time, coloured by {GROUP_COL_DISPLAY}.
      The question is whether the library predicts the runs.

      How to read: a cloud flat on zero says the library predicts the run. A slope, or a condition
      lifted off the others, is a drift to check in the gradient or the column; open
      [Acquisition](tab:Acquisition) to compare the runs.

      Lines and annotations: the horizontal line at 0 is no gap between observed and predicted. No
      tolerance band is drawn, because no published cut-off applies. A cloud of 30000 precursors or
      more is drawn as a density.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: quantms
    data_collection_tag: quantms_precursors
    visu_type: histogram
    mode: code
    code_content: |-
      fig = px.histogram(df.to_pandas(), x='length', color='modification_state', barmode='group', histnorm='percent', color_discrete_map=depictio_category_colors.get('modification_state') or {}, labels={'length': 'Peptide length (residues)', 'modification_state': ''})
      fig.update_yaxes(title='Share of precursors (%)')
      fig.update_layout(margin=dict(t=10), legend_title_text='')
    section: Peptide properties
    tag: qm-id-fig-length
    index: id-length-histogram
    title: Peptide length
    description: >-
      Each series is the unmodified or the modified precursors, as a share of that series at each
      peptide length. Each series sums to 100, so a shift between them is not hidden by their sizes.

      How to read: the two series should have similar shapes. Use the Precursor filters to narrow by
      charge or modification.

      Lines and annotations: no reference is drawn.
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: figure
    workflow_tag: quantms
    data_collection_tag: quantms_precursors
    visu_type: violin
    mode: code
    code_content: |-
      grp = depictio_group_by[0] if depictio_group_by else "{GROUP_COL}"
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get("{GROUP_COL}") or {}
      order = df.group_by('run_id').agg(pl.col('evidence').median().alias('m')).sort('m')['run_id'].to_list()
      fig = px.violin(df.to_pandas(), y='run_id', x='evidence', color=grp if grp in df.columns else None, orientation='h', box=True, points=False, color_discrete_map=colors, category_orders={'run_id': order}, labels={'run_id': '', 'evidence': 'DIA-NN evidence score'})
      fig.update_yaxes(automargin=True)
      fig.update_layout(margin=dict(t=10), legend_title_text='', violinmode='overlay')
    section: Peptide properties
    tag: qm-id-fig-score
    index: id-score-violin
    title: Identification confidence per run
    description: >-
      Each violin is a run: the DIA-NN evidence score of its precursors, with a box inside it. Runs
      are sorted by median score, weakest on top, and coloured by condition.

      How to read: a run shifted to lower scores was identified less confidently than the others and
      may deserve a closer look together with its yield in the run quality chart. The box marks the
      middle half of the scores and the line inside it the median.

      Lines and annotations: no cut-off is drawn. DIA-NN keeps a precursor at the q-value it was
      told to keep, 1 percent by default, so every precursor here has passed that filter and the
      score ranks confidence among them.
    layout: {x: 4, y: 0, w: 4, h: 5}
  - component_type: table
    workflow_tag: quantms
    data_collection_tag: quantms_precursors
    row_selection_enabled: true
    row_selection_column: peptidoform
    section: Identification tables
    tag: qm-id-table-precursors
    index: id-table-precursors
    title: Precursors
    description: >-
      Every identified precursor with its protein group, charge, scores, retention time and
      quantity.

      How to read: sort by a score to find the least confident identifications of a protein group of
      interest, or filter by modification, charge or length with the panel. A picked row narrows the
      dashboard to that peptidoform.
    layout: {x: 0, y: 0, w: 8, h: 6}
