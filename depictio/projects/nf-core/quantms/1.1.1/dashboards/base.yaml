  - component_type: card
    workflow_tag: quantms
    data_collection_tag: quantms_comparisons
    aggregation: median
    column_name: abs_log2fc
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: pink.4
      caption: 'median |log2 FC|, with its spread'
      decimals: 2
    section: Calls at a glance
    tag: qm-da-card-effect
    index: da-card-effect
