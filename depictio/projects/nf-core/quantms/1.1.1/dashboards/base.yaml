    description: 'Distinct peptides identified for a protein group, the median over the groups in view.'
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: quantms
    data_collection_tag: quantms_protein_summary
    aggregation: median
    column_name: mean_log2_intensity
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: violet.9
      caption: 'median log2 quantity, with its spread'
      decimals: 1
    section: Proteins at a glance
    tag: qm-prot-card-cv
    index: prot-card-cv
    title: Abundance
    description: 'Mean log2 quantity of a protein group over the runs that quantified it, the median over the groups in view. The box shows how far the groups spread across the range.'
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: quantms
    data_collection_tag: quantms_protein_summary
    visu_type: bar
    mode: code
    code_content: |-
      # The protein groups quantified in only some of the runs, by how many runs saw them, stacked by peptide support. The groups seen in every run are the bulk of a good experiment, so they sit in the note and the rest reads on a plain count axis.
      n_runs = int(df['runs_total'].max() or df['runs_detected'].max() or 1)
      total = df.height
      full = int((df['runs_detected'] >= n_runs).sum())
      part = df.filter(pl.col('runs_detected') < n_runs)
      part = part if part.height else df
      d = part.group_by('runs_detected', 'peptide_support').len().rename({'len': 'groups'})
      tot = part.group_by('runs_detected').len().sort('runs_detected')
      colors = depictio_category_colors.get('peptide_support') or {}
      fig = go.Figure(layout=go.Layout(barmode='stack', bargap=0.2, margin=dict(t=50), xaxis=dict(title='Runs that quantified the protein group', dtick=1, range=[0.4, int(part['runs_detected'].max()) + 0.6]), yaxis=dict(title='Protein groups', range=[0, float(tot['len'].max()) * 1.2])))
      for ps in ['1 peptide', '2 to 3 peptides', '4 or more peptides']:
          s = d.filter(pl.col('peptide_support') == ps).sort('runs_detected')
          fig.add_bar(x=s['runs_detected'].to_list(), y=s['groups'].to_list(), name=ps, marker_color=colors.get(ps), hovertemplate='%{y} protein groups on ' + ps + '<extra></extra>')
      fig.add_scatter(x=tot['runs_detected'].to_list(), y=tot['len'].to_list(), mode='text', text=[str(v) for v in tot['len'].to_list()], textposition='top center', showlegend=False, hoverinfo='skip')
      fig.add_annotation(text='%d of %d protein groups (%d%%) were quantified in all %d runs<br>and are not drawn here' % (full, total, round(100 * full / max(total, 1)), n_runs), xref='paper', yref='paper', x=0, y=1.02, xanchor='left', yanchor='bottom', showarrow=False, align='left')
      fig.update_layout(legend=dict(orientation='h', y=-0.3, title_text='', traceorder='normal'))
    section: Detection across runs
    tag: qm-prot-fig-detection
    index: prot-detection
    title: Protein groups missed in some runs
    description: >-
      Each bar is the number of protein groups that were quantified in some runs but not in all, by
      how many runs quantified them, stacked by the number of peptides that back the group (1, 2 to
      3, 4 or more). The number above a bar is its total.

      How to read: groups seen in every run are the bulk of a good experiment, so they are left out
      and counted in the note at the top. A tall bar at few runs is a set of groups that are
      patchily quantified, and a stack made of one-peptide groups is the weakest in support. Open
      the next chart to see whether they are the faint ones.

      Lines and annotations: the note counts the groups quantified in all runs and their share. No
      cut-off is drawn.
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: figure
    workflow_tag: quantms
    data_collection_tag: quantms_protein_summary
    visu_type: box
    mode: code
    code_content: |-
      d = df.with_columns(pl.col('runs_detected').cast(pl.Utf8).alias('n_runs'))
      order = [str(n) for n in sorted(df['runs_detected'].unique().to_list())]
      fig = px.box(d.to_pandas(), x='n_runs', y='mean_log2_intensity', color='detection', color_discrete_map=depictio_category_colors.get('detection') or {}, category_orders={'n_runs': order, 'detection': ['All runs', 'Some runs', 'One run']}, points='outliers', labels={'n_runs': 'Runs that quantified the protein group', 'mean_log2_intensity': 'Mean log2 quantity', 'detection': ''})
      fig.update_layout(margin=dict(t=10), legend_title_text='', boxmode='overlay')
    section: Detection across runs
    tag: qm-prot-fig-detect-abundance
    index: prot-detection-abundance
    title: Abundance of incomplete protein groups
    description: >-
      Each box is the mean log2 quantity of the protein groups quantified in a given number of runs,
      coloured by whether the groups were seen in all runs, some runs or one run. Outliers are drawn
      as points.

      How to read: groups missed in some runs usually sit at the low end of the range, which says
      the gaps follow abundance and not chance. A missed group that is abundant is the more
      surprising one, and worth checking in the run it is missing from.

      Lines and annotations: no reference line is drawn; read the boxes against each other.
    layout: {x: 4, y: 0, w: 4, h: 5}
  - component_type: advanced_viz
    workflow_tag: quantms
    data_collection_tag: quantms_protein_summary
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: mean_log2_intensity
      y_col: cv_pct
      label_col: genes
      x_title: Mean log2 quantity
      y_title: Variation between runs (CV, %)
      reference_line: horizontal
      reference_value: 20
      reference_label: 20 % CV
      reference_highlight: above
      top_n_labels: 8
      density_threshold: 2000
      opacity: 0.5
      marker_size: 4
      legend_pos: none
    section: Quantification precision
    tag: qm-prot-av-rank
    index: prot-cv-intensity
    title: Variation against abundance
    description: >-
      Each point is a protein group, placed by its mean log2 quantity and its variation between
      runs, the coefficient of variation (CV) in percent. The question is how precisely the groups
      are quantified.

      How to read: precision usually falls toward the faint end, so the high-CV groups sit at the
      left. Points under the dashed line are dimmed, and the eight most variable groups above it are
      labelled by gene. Open the Protein groups table to follow a labelled group.

      Lines and annotations: the dashed line is a CV of 20 %, the cut-off of the Variation card. It
      is a display setting of this dashboard, not read from the run, and has no published source. A
      cloud of 2000 protein groups or more is drawn as a density.

      Note: the 20 % line is a reading guide, not a validated quality cut-off.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: quantms
    data_collection_tag: quantms_protein_summary
    row_selection_enabled: true
    row_selection_column: protein_group
    section: Protein detail
    tag: qm-prot-table-summary
    index: prot-table-summary
    title: Protein groups
    description: >-
      Every protein group with its peptides, detection across the runs, mean quantity, variation and
      abundance rank.

      How to read: sort by the number of runs detected or by the CV to find the groups that are
      patchily or imprecisely quantified. A picked row opens its record beside the table.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: quantms
    data_collection_tag: quantms_protein_summary
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: protein_group
      title_col: genes
      selection_source: any
      linked_component: qm-prot-table-summary
      sections: {Protein: [protein_group, protein_name, genes, description], Support: [peptides, peptide_support], Detection: [detection, runs_detected, runs_total], Abundance: [mean_log2_intensity, cv_pct, abundance_rank]}
      link_templates: {protein_group: 'https://www.uniprot.org/uniprotkb/{value}'}
    section: Protein detail
    tag: qm-prot-record
    index: prot-record
    title: Protein record
    description: >-
      The protein group picked in the table or in a figure, in four groups: the protein, its peptide
      support, its detection across the runs and its abundance.

      How to read: no value is rated here. A group backed by one peptide, or detected in only some
      of the runs, is weaker than one with several peptides seen in every run. The accession links
      to UniProt for a single-protein group.
    layout: {x: 5, y: 0, w: 3, h: 6}
- title: Reproducibility
  subtitle: Do the runs of a condition agree, and do the conditions separate?
  tab_group: Quantification
  tab_order: 4
  tab_icon: mdi:set-merge
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Replicate filters
    icon: mdi:filter-variant
    color: cyan
    description: Narrows the replicate pairs and the per-condition variation
  grid_sections:
  - name: Reproducibility at a glance
    icon: mdi:counter
    color: cyan
    description: 'Variation within conditions and what separates the runs'
  - name: Sample relationships
    icon: mdi:chart-scatter-plot
    color: cyan
    description: 'How the runs group by their protein quantities'
  - name: Run-to-run correlation
    icon: mdi:chart-scatter-plot
    color: cyan
    description: 'Pearson correlation of every pair of runs, clustered'
    collapsed: true
  - name: Replicate agreement
    icon: mdi:chart-scatter-plot
    color: cyan
    description: 'The difference between two runs of a condition, against their mean'
  - name: Variation within conditions
    icon: mdi:chart-bell-curve
    color: cyan
    description: 'Coefficient of variation per protein and condition'
  - name: Condition table
    icon: mdi:table
    color: gray
    description: 'Mean and variation of every protein group per condition'
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      Runs of one condition are replicates: they should quantify the same proteins at similar
      levels, and the runs of different conditions should separate in the projection. A pair that
      leaves the grey band around no difference, or a run that sits with another condition, points at one injection to check.
    tag: qm-rep-intro
    index: rep-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: quantms
    data_collection_tag: quantms_replicate_pairs
    interactive_component_type: MultiSelect
    column_name: pair
    column_type: object
    display:
      icon_name: mdi:vector-link
      custom_color: green
    section: Replicate filters
    group: Replicates
    tag: qm-rep-filter-pair
    index: rep-pair-filter
    title: Replicate pair
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: quantms
    data_collection_tag: quantms_protein_conditions
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: cv_pct
    column_type: float64
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: yellow
    section: Replicate filters
    group: Replicates
    tag: qm-rep-filter-cv
    index: rep-cv-range
    title: Variation within condition (%)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: quantms
    data_collection_tag: quantms_protein_conditions
    aggregation: count
    column_name: protein_group
    column_type: object
    secondary_layout: composition
    breakdown_col: '{GROUP_COL}'
    display:
      icon_name: mdi:molecule
      icon_color: cyan.4
      caption: 'per condition, by {GROUP_COL_DISPLAY}'
      format: si
    section: Reproducibility at a glance
    tag: qm-rep-card-groups
    index: rep-card-groups
    title: Protein quantities
    description: 'Protein groups quantified in a condition, counted once per condition. The bar splits them by {GROUP_COL_DISPLAY}.'
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: quantms
    data_collection_tag: quantms_protein_conditions
    aggregation: median
    column_name: cv_pct
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: cyan.6
      caption: 'median CV %, with its spread'
      decimals: 1
    section: Reproducibility at a glance
    tag: qm-rep-card-cv
    index: rep-card-cv
    title: Variation
    description: 'Coefficient of variation of a protein group within a condition, in percent: the median over groups and conditions. Under 20 is tight for label-free quantification, over 30 is noisy.'
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: quantms
    data_collection_tag: quantms_sample_embedding
    aggregation: median
    column_name: explained_1
    column_type: float64
    display:
      icon_name: mdi:chart-scatter-plot
      icon_color: cyan.8
      caption: 'of the variance, percent'
      decimals: 0
    section: Reproducibility at a glance
    tag: qm-rep-card-pc1
    index: rep-card-pc1
    title: First component
    description: 'Share of the variance between runs that the first principal component explains, in percent. It is high when the first axis is the condition and the runs of a condition sit together in the projection; a low share says the runs differ in other ways.'
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: quantms
    data_collection_tag: quantms_replicate_pairs
    aggregation: count
    column_name: protein_group
    column_type: object
    secondary_layout: composition
    breakdown_col: pair
    display:
      icon_name: mdi:vector-link
      icon_color: cyan.9
      caption: 'protein groups, by pair'
      format: si
    section: Reproducibility at a glance
    tag: qm-rep-card-pairs
    index: rep-card-pairs
    title: Paired quantities
    description: 'Protein groups quantified in both runs of a pair, counted once per pair. The bar splits them by pair.'
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: quantms
    data_collection_tag: quantms_sample_embedding
    viz_kind: embedding
    config:
      viz_kind: embedding
      sample_id_col: run_id
      dim_1_col: dim_1
      dim_2_col: dim_2
      color_col: '{GROUP_COL}'
      default_color_by: '{GROUP_COL}'
      axis_prefix: PC
      show_centroids: false
      legend_pos: right
      selection_enabled: true
      selection_column: run_id
    section: Sample relationships
    tag: qm-rep-av-pca
    index: rep-pca
    title: Run projection
    description: >-
      Each point is a run, placed by the first two principal components of the protein groups
      quantified in every run, coloured by {GROUP_COL_DISPLAY}. The question is whether the runs of
      a condition sit together and the conditions apart.

      How to read: replicate runs that sit together and conditions that separate are the picture of
      a good experiment. A run beside another condition is an injection to check in
      [Acquisition](tab:Acquisition) and [Identification](tab:Identification). A lasso filters the
      linked panels.

      Lines and annotations: no line is drawn; the axes are the principal components. The groups are
      centred on their mean over the runs and not scaled, and the sign of a component is arbitrary.

      Note: only the protein groups quantified in every run are used, so a design with many missing
      values has a short list to project from.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: quantms
    data_collection_tag: quantms_sample_correlation
    viz_kind: complex_heatmap
    config:
      viz_kind: complex_heatmap
      index_column: run_id
      row_annotation_cols: ['{GROUP_COL}']
      cluster_rows: true
      cluster_cols: true
      cluster_method: average
      normalize: none
      colorscale: Blues
      max_rows: 9
    section: Run-to-run correlation
    tag: qm-rep-av-corr
    index: rep-correlation
    title: Run-to-run correlation
    description: >-
      Each cell is the Pearson correlation of the protein quantities of two runs, over the protein
      groups both quantified, with the dendrograms grouping the runs that behave alike. The side
      annotation names the condition.

      How to read: runs of one condition should correlate more than runs of different conditions, so
      the clusters should follow the annotation. A run that clusters with the wrong condition is the
      one to check. When replicates correlate closely the colours differ little, so read the
      clustering rather than the shade.

      Lines and annotations: the colour scale runs from lighter for a lower to darker blue for a
      higher correlation. No cut-off is drawn.
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: figure
    workflow_tag: quantms
    data_collection_tag: quantms_replicate_pairs
    visu_type: scatter
    mode: code
    code_content: |-
      # Difference against mean of the log2 quantities of two runs, one point per protein group and pair; the dotted line is no difference and the grey band is within one log2 unit (a twofold change).
      grp = depictio_group_by[0] if depictio_group_by else '{GROUP_COL}'
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get('{GROUP_COL}') or {}
      d = df if grp in df.columns else df.with_columns(pl.lit('All runs').alias(grp))
      d = d.filter(pl.col('log2_x').is_not_null() & pl.col('log2_y').is_not_null()).with_columns(((pl.col('log2_x') + pl.col('log2_y')) / 2).alias('mean_log2'), (pl.col('log2_y') - pl.col('log2_x')).alias('diff_log2'))
      fig = px.scatter(d.to_pandas(), x='mean_log2', y='diff_log2', color=grp, color_discrete_map=colors, opacity=0.45, hover_name='genes', hover_data=['pair', 'run_x', 'run_y'], labels={'mean_log2': 'Mean log2 quantity of the two runs', 'diff_log2': 'Difference between the runs (log2)', grp: ''})
      fig.update_traces(marker=dict(size=4))
      fig.add_hrect(y0=-1, y1=1, fillcolor='rgba(134,142,150,0.2)', line_width=0, layer='below')
      fig.add_hline(y=0, line_dash='dot', line_width=1, opacity=0.6)
      fig.add_annotation(text='twofold difference either way', xref='paper', yref='y', x=1, y=1, xanchor='right', yanchor='bottom', showarrow=False)
      fig.add_annotation(text='no difference', xref='paper', yref='y', x=1, y=0, xanchor='right', yanchor='bottom', showarrow=False)
      fig.update_yaxes(automargin=True, zeroline=False)
      fig.update_layout(margin=dict(t=10), legend=dict(orientation='h', y=-0.2))
    section: Replicate agreement
    tag: qm-rep-av-pairs
    index: rep-pairs-scatter
    title: Run against run, difference over mean
    description: >-
      Each point is a protein group quantified in both runs of a pair of one condition, placed by
      the mean of its two log2 quantities, with its height the difference between the runs, coloured
      by condition. The question is how well two replicates agree at every abundance level.

      How to read: a reproducible pair stays inside the grey band at every level, and a tilt or a
      fan marks a pair to check. A pair whose cloud sits off zero has a normalisation offset between
      its runs. Open [Proteins](tab:Proteins) for the precision of each group.

      Lines and annotations: the dotted line at 0 is no difference between the two runs. The grey
      band is one log2 unit either side of it, a twofold difference, the same twofold the
      differential abundance calls use. It is a reading guide of this dashboard, not a quality
      cut-off.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: quantms
    data_collection_tag: quantms_protein_conditions
    visu_type: violin
    dict_kwargs: {x: '{GROUP_COL}', y: cv_pct, color: '{GROUP_COL}', box: true, points: false, labels: {cv_pct: Coefficient of variation (%)}}
    section: Variation within conditions
    tag: qm-rep-fig-cv-box
    index: rep-cv-box
    title: Variation by condition
    description: >-
      Each violin is a condition: the distribution of the coefficient of variation (CV, in percent)
      of its protein groups across its runs, with a box inside it.

      How to read: a condition with more of its mass at higher values has noisier replicates.
      Compare the conditions with each other; a condition that stands out is the one to inspect in
      the run projection and the run-to-run correlation.

      Lines and annotations: no line is drawn. The 20 % used on the Variation chart of
      [Proteins](tab:Proteins) is a display setting without a published source.

      Note: the CV is null for a condition with a single run, which then has no violin.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: quantms
    data_collection_tag: quantms_protein_conditions
    row_selection_enabled: true
    row_selection_column: protein_group
    section: Condition table
    tag: qm-rep-table-conditions
    index: rep-table-conditions
    title: Protein groups per condition
    description: >-
      Mean log2 quantity, standard deviation and variation of every protein group in every
      condition.

      How to read: sort by the CV to find the least reproducible groups of a condition, and compare
      a group across conditions. A picked row narrows the dashboard to that protein group.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Differential abundance
  subtitle: Which proteins change between conditions, and can the test tell?
  tab_group: Quantification
  tab_order: 5
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: pink
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Call filters
    icon: mdi:filter-variant
    color: pink
    description: Narrows the calls by contrast, direction, effect size and missing values
  grid_sections:
  - name: Calls at a glance
    icon: mdi:counter
    color: pink
    description: 'How many proteins were tested and how many changed'
  - name: Calls per contrast
    icon: mdi:chart-bar
    color: pink
    description: 'Proteins that go up or down in each contrast'
  - name: Volcano, MA and QQ
    icon: mdi:chart-scatter-plot
    color: pink
    description: 'Effect size against significance, and the p-values against the null'
  - name: Calibration
    icon: mdi:chart-bell-curve
    color: pink
    description: 'Whether the test behaves: p-values and effect sizes'
  - name: Protein detail
    icon: mdi:table
    color: gray
    description: 'Every tested protein, with the one picked in the table'
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      MSstats fits every protein group and tests it between conditions. A protein is called when its
      adjusted p-value is below 0.05 and its fold change is two-fold or more; with few replicates
      the test has little power, so read the p-value histogram before the list of calls.
    tag: qm-da-intro
    index: da-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: quantms
    data_collection_tag: quantms_comparisons
