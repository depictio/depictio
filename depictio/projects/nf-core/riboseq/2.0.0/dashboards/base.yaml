version: 1
# nf-core/riboseq 2.0.0: Ribo-seq quality, translational regulation and ORF discovery.
#
# Funnel: MultiQC (are the libraries usable?) -> Ribo-seq QC (do the
# footprints come from translating ribosomes?) -> Sample space (do the
# libraries group by assay and design?) -> Translational regulation (which
# genes change translation between conditions, and how?) -> Translational
# efficiency (which genes are translated above or below their mRNA level?) ->
# ORF discovery (which ORFs are translated, and do the callers agree?).
#
# Two sections ride every tab: `Run at a glance` (four run-size cards, pinned
# top, open) and `Sample sheet` (pinned top, collapsed). The persistent sample
# filters read the sample sheet hub, which template.yaml links to every
# per-library collection; the group filter reads the optional design table
# (METADATA_FILE) and disappears with it.
main_dashboard:
  title: nf-core/riboseq
  subtitle: "nf-core/riboseq 2.0.0: Ribo-seq and RNA-seq QC, translational regulation, translational efficiency and ORF discovery"
  project_tag: Ribo-seq Translation Analysis
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Sample scope
    icon: mdi:filter-variant
    color: orange
    description: Which libraries, assays and groups every tab is about
    persistent: true
    pin: top
  - name: Library layout
    icon: mdi:tune
    color: gray
    description: Narrow the MultiQC panels to one read layout
  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: The size and design of the run, on every tab
    persistent: true
    pin: top
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The run's own sample sheet and the optional design table, on every tab
    collapsed: true
    persistent: true
    pin: top
  - name: Read quality
    icon: mdi:chart-bell-curve
    color: blue
    description: Raw reads, and the same reads after trimming and rRNA removal
  - name: rRNA depletion
    icon: mdi:filter-variant
    color: red
    description: How much of each library SortMeRNA matched to ribosomal RNA
  - name: Alignment and quantification
    icon: mdi:dna
    color: indigo
    description: What STAR placed on the genome and what Salmon quantified
  - name: Footprint quality
    icon: mdi:ruler
    color: grape
    description: Reading-frame proportions and footprint lengths as Ribo-TISH measured them
  - name: More MultiQC panels
    icon: mdi:chart-box-outline
    color: gray
    description: The remaining FastQC and alignment panels of the report
    collapsed: true
  components:
  # ------------------------------------------------------------ run at a glance
  - component_type: card
    tag: rb-card-libraries
    section: Run at a glance
    workflow_tag: riboseq
    data_collection_tag: samples
    aggregation: nunique
    column_name: sample
    column_type: object
    secondary_layout: donut
    breakdown_col: type
    display: {icon_name: 'mdi:test-tube', title_font_size: xl, value_font_size: xl}
    title: Libraries by assay
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: rb-card-contrasts
    section: Run at a glance
    workflow_tag: riboseq
    data_collection_tag: anota2seq_regulation
    use: anota2seq/regulation
    aggregation: nunique
    column_name: contrast
    column_type: object
    secondary_layout: donut
    breakdown_col: contrast
    display: {icon_name: 'mdi:scale-balance', title_font_size: xl, value_font_size: xl}
    title: Contrasts
    title_size: sm
    title_align: left
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: rb-card-genes
    section: Run at a glance
    workflow_tag: riboseq
    data_collection_tag: gene_counts
    use: salmon/merged_gene_counts
    aggregation: count
    column_name: gene_name
    column_type: object
    secondary_layout: completeness
    display: {icon_name: 'mdi:dna', title_font_size: xl, value_font_size: xl}
    title: Genes quantified
    title_size: sm
    title_align: left
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: rb-card-psites
    section: Run at a glance
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_summary
    use: ribowaltz/library_summary
    aggregation: sum
    column_name: psites
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:waves', title_font_size: xl, value_font_size: xl}
    title: P-sites assigned
    title_size: sm
    title_align: left
    layout: {x: 6, y: 0, w: 2, h: 2}

  # --------------------------------------------------------------- sample sheet
  - component_type: text
    tag: rb-sheet-intro
    section: Sample sheet
    workflow_tag: riboseq
    data_collection_tag: samples
    title: What the run was told about each library
    title_size: sm
    title_align: left
    order: 0
    alignment: left
    body: >
      Every column of the pipeline's input sheet except the FASTQ paths, with
      the assay type of each library. The design table below it, when the run
      was given one, holds the grouping the group filter reads.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: table
    tag: rb-table-samples
    section: Sample sheet
    workflow_tag: riboseq
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample
    title: Sample sheet
    description: One row per library, its assay type and the design columns the sheet declares.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 4}
  - component_type: table
    tag: rb-table-metadata
    section: Sample sheet
    workflow_tag: riboseq
    data_collection_tag: metadata
    row_selection_enabled: true
    row_selection_column: '{METADATA_ID_COL}'
    title: Design table
    description: The optional design table, one row per library; its first annotation column is the group the filter reads.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 5, w: 8, h: 4}

  # --------------------------------------------------------------- read quality
  - component_type: text
    tag: rb-qc-reads-intro
    section: Read quality
    workflow_tag: riboseq
    data_collection_tag: multiqc_data
    title: Reads before and after preprocessing
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/) ran
      on the raw reads and again after trimming and rRNA removal. Ribo-seq
      footprints are short, so a long raw read length with heavy adapter
      content is expected for those libraries.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: rb-qc-fastqc-raw-counts
    section: Read quality
    workflow_tag: riboseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Counts
    title: Raw sequence counts
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: rb-qc-fastqc-raw-adapters
    section: Read quality
    workflow_tag: riboseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Adapter Content
    title: Raw adapter content
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: rb-qc-fastqc-filtered-counts
    section: Read quality
    workflow_tag: riboseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc-2
    selected_plot: Sequence Counts
    title: Sequence counts after rRNA removal
    title_size: sm
    title_align: left
    layout: {x: 0, y: 6, w: 4, h: 5}
  - component_type: multiqc
    tag: rb-qc-fastqc-filtered-length
    section: Read quality
    workflow_tag: riboseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc-2
    selected_plot: Sequence Length Distribution
    title: Read length after rRNA removal
    title_size: sm
    title_align: left
    layout: {x: 4, y: 6, w: 4, h: 5}

  # -------------------------------------------------------------- rRNA depletion
  - component_type: text
    tag: rb-qc-rrna-intro
    section: rRNA depletion
    workflow_tag: riboseq
    data_collection_tag: multiqc_data
    title: How much rRNA each library carried
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Ribo-seq libraries often keep a large rRNA share even after depletion,
      which caps the footprints left to map. Compare the Ribo-seq libraries
      with each other rather than with the RNA-seq ones.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: rb-qc-sortmerna
    section: rRNA depletion
    workflow_tag: riboseq
    data_collection_tag: multiqc_data
    use: multiqc/sortmerna
    selected_module: sortmerna
    selected_plot: sortmerna-section-1
    title: Reads matched to rRNA databases
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 5}

  # ------------------------------------------------ alignment and quantification
  - component_type: text
    tag: rb-qc-align-intro
    section: Alignment and quantification
    workflow_tag: riboseq
    data_collection_tag: multiqc_data
    title: What STAR placed and what Salmon counted
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A low uniquely mapped share points at leftover rRNA or contamination; a
      high multimapping share at repeats. Salmon quantifies both assays on
      the same transcriptome, which is what the sample space and the
      efficiency tabs compare.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: rb-qc-star-summary
    section: Alignment and quantification
    workflow_tag: riboseq
    data_collection_tag: multiqc_data
    use: multiqc/star
    selected_module: star
    selected_plot: Summary Statistics
    title: STAR alignment summary
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: rb-qc-salmon
    section: Alignment and quantification
    workflow_tag: riboseq
    data_collection_tag: multiqc_data
    use: multiqc/salmon
    selected_module: salmon
    selected_plot: salmon-section-1
    title: Salmon fragment length distribution
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 5}

  # ---------------------------------------------------------- footprint quality
  - component_type: text
    tag: rb-qc-ribotish-intro
    section: Footprint quality
    workflow_tag: riboseq
    data_collection_tag: multiqc_data
    title: Ribo-TISH on the footprint libraries
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [Ribo-TISH](https://github.com/zhpn1024/ribotish) measures, per footprint
      length, how strongly the reads favour one reading frame. The riboWaltz
      view of the same question is on the Ribo-seq QC tab.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: rb-qc-ribotish-frames
    section: Footprint quality
    workflow_tag: riboseq
    data_collection_tag: multiqc_data
    use: multiqc/ribotish
    selected_module: ribotish
    selected_plot: Reading Frame Proportions
    title: Reading frame proportions
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: rb-qc-ribotish-length
    section: Footprint quality
    workflow_tag: riboseq
    data_collection_tag: multiqc_data
    use: multiqc/ribotish
    selected_module: ribotish
    selected_plot: Read Length Distribution
    title: Footprint length distribution
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 5}

  # -------------------------------------------------------- more MultiQC panels
  - component_type: multiqc
    tag: rb-qc-fastqc-raw-quality
    section: More MultiQC panels
    workflow_tag: riboseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    title: Raw per-base quality
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: multiqc
    tag: rb-qc-fastqc-trimmed-length
    section: More MultiQC panels
    workflow_tag: riboseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc-1
    selected_plot: Sequence Length Distribution
    title: Read length after trimming
    title_size: sm
    title_align: left
    layout: {x: 4, y: 0, w: 4, h: 5}
  - component_type: multiqc
    tag: rb-qc-fastqc-filtered-status
    section: More MultiQC panels
    workflow_tag: riboseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc-2
    selected_plot: Status Checks
    title: FastQC status after rRNA removal
    title_size: sm
    title_align: left
    layout: {x: 0, y: 5, w: 4, h: 5}
  - component_type: multiqc
    tag: rb-qc-samtools-mapped
    section: More MultiQC panels
    workflow_tag: riboseq
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Percent mapped
    title: Percent mapped
    title_size: sm
    title_align: left
    layout: {x: 4, y: 5, w: 4, h: 5}

  # ------------------------------------------------------------------ left panel
  - component_type: interactive
    tag: rb-filter-sample
    index: rb-sample-filter
    section: Sample scope
    group: Libraries
    workflow_tag: riboseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display: {title_size: md, custom_color: '#FB8C00', icon_name: 'mdi:test-tube'}
    placement: left
    title: Library
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: rb-filter-type
    index: rb-type-filter
    section: Sample scope
    group: Libraries
    workflow_tag: riboseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: type
    column_type: object
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Assay
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: rb-filter-group
    index: rb-group-filter
    section: Sample scope
    group: Libraries
    workflow_tag: riboseq
    data_collection_tag: metadata
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:account-group-outline'}
    placement: left
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: rb-filter-read-type
    index: rb-read-type-filter
    section: Library layout
    group: Layout
    workflow_tag: riboseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: read_type
    column_type: object
    display: {title_size: md, custom_color: '#607D8B', icon_name: 'mdi:tune'}
    placement: left
    title: Read layout
    layout: {x: 0, y: 9, w: 1, h: 3}

tabs:
# ============================================================== Ribo-seq QC
- title: Ribo-seq QC
  subtitle: Whether the footprints come from translating ribosomes, per Ribo-seq library
  tab_order: 1
  tab_icon: mdi:waves
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Library quality
    icon: mdi:tune
    color: grape
    description: Narrow the Ribo-seq views to libraries inside a phasing or CDS band
  grid_sections:
  - name: Periodicity at a glance
    icon: mdi:counter
    color: grape
    description: How well each Ribo-seq library is phased and where its P-sites fall
  - name: Reading frame
    icon: mdi:chart-bar
    color: grape
    description: Share of the P-sites in each reading frame, per library and region
  - name: Footprint length
    icon: mdi:ruler
    color: violet
    description: Read-length distribution of the footprints riboWaltz kept
  - name: Metagene profiles
    icon: mdi:chart-line
    color: violet
    description: P-site signal around the start and stop codons
  - name: P-site regions
    icon: mdi:chart-donut
    color: pink
    description: P-site share per transcript region
  - name: Library detail
    icon: mdi:information-outline
    color: grape
    description: Pick a library on the phasing plane and read its record
  - name: Library rows
    icon: mdi:table
    color: gray
    description: The per-library quality table behind the tab
    collapsed: true
  components:
  - component_type: text
    tag: rb-rq-intro
    section: Periodicity at a glance
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_summary
    title: Do the footprints step one codon at a time?
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Look for a frame-0 share well above a third in the CDS and a CDS share
      above the length expectation. A library that fails both is not
      reporting translation.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: rb-rq-card-frame0
    section: Periodicity at a glance
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_summary
    use: ribowaltz/library_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: frame0_cds_pct
    column_type: float64
    display: {icon_name: 'mdi:waves', title_font_size: xl, value_font_size: xl}
    title: Frame 0 share in CDS (%)
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 2, h: 2}
  - component_type: card
    tag: rb-rq-card-bias
    section: Periodicity at a glance
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_summary
    use: ribowaltz/library_summary
    aggregation: min
    column_name: frame_bias
    column_type: float64
    secondary_layout: threshold
    threshold_value: 20
    threshold_direction: min
    threshold_warn: 10
    display: {icon_name: 'mdi:alert-outline', title_font_size: xl, value_font_size: xl}
    title: Weakest frame margin (points)
    title_size: sm
    title_align: left
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: rb-rq-card-cds
    section: Periodicity at a glance
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_summary
    use: ribowaltz/library_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: cds_pct
    column_type: float64
    display: {icon_name: 'mdi:dna', title_font_size: xl, value_font_size: xl}
    title: P-sites in CDS (%)
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 2, h: 2}
  - component_type: card
    tag: rb-rq-card-length
    section: Periodicity at a glance
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_summary
    use: ribowaltz/library_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: modal_length
    column_type: int64
    display: {icon_name: 'mdi:ruler', title_font_size: xl, value_font_size: xl}
    title: Modal footprint length (nt)
    title_size: sm
    title_align: left
    layout: {x: 6, y: 1, w: 2, h: 2}

  - component_type: advanced_viz
    tag: rb-rq-av-frames
    index: rb-rq-av-frames
    section: Reading frame
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_frames
    use: ribowaltz/frame_composition
    config:
      default_rank: CDS
      normalise_to_one: true
      sort_by: abundance
      sample_sort: input
      top_n: 12
      controls_placement: header
    title: P-sites per reading frame
    description: Share of each library's P-sites in the three frames. The tile opens on the CDS; switch the level to a UTR to see the unphased background.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 7}

  - component_type: advanced_viz
    tag: rb-rq-av-length
    index: rb-rq-av-length
    section: Footprint length
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_length
    use: ribowaltz/length_profile
    config:
      x_title: Read length (nt)
      y_title: Share of reads (%)
      line_width: 1.5
      legend_pos: right
      controls_placement: header
    title: Footprint length per library
    description: One curve per Ribo-seq library. Monosome footprints form one narrow peak; a second peak or a broad shoulder is worth checking.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 6}

  - component_type: advanced_viz
    tag: rb-rq-av-start
    index: rb-rq-av-start
    section: Metagene profiles
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_metaprofile_start
    use: ribowaltz/start_profile
    config:
      reference_x: 0
      reference_label: Start codon
      x_title: Distance from the start codon (nt)
      y_title: P-site signal (%)
      line_width: 1.5
      legend_pos: right
      controls_placement: header
    title: P-sites around the start codon
    description: A phased library peaks at the start codon and repeats every three nucleotides along the CDS.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    tag: rb-rq-av-stop
    index: rb-rq-av-stop
    section: Metagene profiles
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_metaprofile_stop
    use: ribowaltz/stop_profile
    config:
      reference_x: 0
      reference_label: Stop codon
      x_title: Distance from the stop codon (nt)
      y_title: P-site signal (%)
      line_width: 1.5
      legend_pos: right
      controls_placement: header
    title: P-sites around the stop codon
    description: The three-nucleotide pattern should run up to the stop codon and fade after it, where ribosomes release.
    title_size: h3
    layout: {x: 0, y: 6, w: 8, h: 6}

  - component_type: advanced_viz
    tag: rb-rq-av-regions
    index: rb-rq-av-regions
    section: P-site regions
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_psite_region
    use: ribowaltz/region_composition
    config:
      normalise_to_one: true
      sort_by: abundance
      sample_sort: input
      top_n: 12
      controls_placement: header
    title: P-sites per transcript region
    description: Share of each library's P-sites in the 5' UTR, CDS and 3' UTR. The expected share from transcript length alone is in the table below the tab.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 6}

  - component_type: advanced_viz
    tag: rb-rq-av-phasing
    index: rb-rq-av-phasing
    section: Library detail
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_summary
    use: ribowaltz/phasing_plane
    config:
      x_title: P-sites in CDS (%)
      y_title: Frame 0 share in CDS (%)
      reference_line: horizontal
      reference_value: 33.3
      reference_highlight: above
      top_n_labels: 0
      selection_enabled: true
      selection_column: sample
      legend_pos: bottom
      controls_placement: header
    title: Phasing against CDS share
    description: One point per Ribo-seq library, sized by P-sites. The line is one third, the share of a library with no periodicity. Click a point to open its record.
    title_size: h3
    layout: {x: 0, y: 0, w: 5, h: 8}
  - component_type: advanced_viz
    tag: rb-rq-av-record
    index: rb-rq-av-record
    section: Library detail
