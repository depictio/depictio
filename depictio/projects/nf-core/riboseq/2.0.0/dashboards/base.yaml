version: 1
# nf-core/riboseq 2.0.0: ribosome profiling, translational efficiency,
# translational regulation and ORF discovery. Every rule this file follows is
# written out in depictio/projects/nf-core/RULES.md.
#
# Funnel: Data & QC (MultiQC, Ribo-seq QC, Sample space), then Translation
# (efficiency pooled over the run, then regulation per contrast), then ORFs.
#
# Routes: a run without --contrasts writes no anota2seq tables, one with
# --skip_ribowaltz no riboWaltz tables, --skip_ribotish / --skip_ribocode drop
# one ORF caller, and a run without METADATA_FILE has no design table.
# template.yaml prunes those collections; the tabs, cards, value rows and
# highlights bound to them go with them, and the import re-packs the Overview.
main_dashboard:
  title: nf-core/riboseq
  subtitle: Ribosome footprints and mRNA, from read QC to the ORFs being translated
  project_tag: Ribo-seq Translation Analysis
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family: figures, advanced viz
  # and filter chips all colour a value the same way.
  category_colors:
    '{GROUP_COL}': auto
    # The sample space's leading factor (the assay on a riboseq sheet).
    group: auto
    type:
      rnaseq: '#2a78d6'
      riboseq: '#eb6834'
      tiseq: '#1baf7a'
    # Frame 0 is the signal; the two other frames are the background.
    frame:
      Frame 0: '#e34948'
      Frame 1: '#adb5bd'
      Frame 2: '#868e96'
    region:
      5' UTR: '#eda100'
      CDS: '#1baf7a'
      3' UTR: '#4a3aa7'
    regulation_mode:
      translation: '#e34948'
      buffering: '#4a3aa7'
      mRNA abundance: '#eda100'
      not regulated: '#adb5bd'
    # anota2seq_regulation writes `none`, anota2seq_results `not significant`.
    direction:
      up: '#e34948'
      down: '#2a78d6'
      none: '#adb5bd'
      not significant: '#adb5bd'
    orf_class:
      Annotated CDS: '#2a78d6'
      N-terminal variant: '#4a3aa7'
      Upstream ORF: '#eb6834'
      Downstream ORF: '#1baf7a'
      Internal ORF: '#eda100'
      Novel ORF: '#e34948'
    # One class per bar of the caller-agreement figure: known coding sequence or not.
    orf_annotation:
      Annotated CDS: '#2a78d6'
      Outside the annotated CDS: '#e34948'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. The
  # library and assay filters read the sample sheet, the hub template.yaml links
  # to every per-library collection; the group filter reads the optional design
  # table and goes with it.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab that reads per-library data
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab rather than on an analysis tab: a run that prunes
  # that tab would take a persistent section declared there with it.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The run's sample sheet and the optional design table, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # First in component order on purpose: the group filter leads the Key figures
  # bar, and the library filter shares the sample sheet with the first card,
  # which is what the Guide demos.
  - component_type: interactive
    workflow_tag: riboseq
    data_collection_tag: metadata
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Key figures
    tag: rb-ov-kf-group
    index: ov-kf-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: riboseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Library
    section: Key figures
    tag: rb-ov-kf-library
    index: ov-kf-library
    title: Library
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: text
    title: nf-core/riboseq
    logo: https://raw.githubusercontent.com/nf-core/riboseq/master/docs/images/nf-core-riboseq_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/riboseq/master/docs/images/nf-core-riboseq_logo_dark.png
    order: 1
    body: >
      Ribosome footprints and total mRNA from the same samples, read gene by gene: are the
      footprints phased, which genes change translation and which ORFs are translated.
      [Run parameters](params:)
    tag: rb-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  # Who was sequenced, from the sample sheet: each line cites it, so a line goes with
  # its data. The groups line cites the design table and goes without one;
  # strandedness is a column a sheet may lack, so it has a line of its own.
  - component_type: text
    surface: card
    values:
      libraries: {dc: samples, column: sample, aggregation: nunique, format: integer}
      ribo: {dc: samples, column: sample, aggregation: nunique, filter_expr: "col('type') == 'riboseq'", format: integer}
      rna: {dc: samples, column: sample, aggregation: nunique, filter_expr: "col('type') == 'rnaseq'", format: integer}
      reads: {dc: samples, column: read_type, aggregation: top}
      strand: {dc: samples, column: strandedness, aggregation: top}
      groups: {dc: metadata, column: '{GROUP_COL}', aggregation: nunique, format: integer}
    body: |
      ### The study
      - ![](icon:mdi:flask-outline) **Libraries** {{libraries}}: {{ribo}} footprints and {{rna}} total mRNA
      - ![](icon:mdi:shape-outline) **Groups** {{groups}} in the design table
      - ![](icon:mdi:swap-horizontal) **Reads** {{reads}}
      - ![](icon:mdi:arrow-split-vertical) **Strandedness** {{strand}}
      - ![](icon:mdi:file-table-outline) **Samplesheet** [one row per library](section:Sample sheet), its path in [the run parameters](params:input)
      - ![](icon:mdi:palette-outline) **Assay** {{legend:group}}
      - ![](icon:mdi:palette-outline) **Frame** {{legend:frame}}
    tag: rb-ov-study
    index: ov-study
    layout: {x: 0, y: 1, w: 5, h: 6}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash. The contrasts line goes with the anota2seq tables.
  - component_type: text
    surface: card
    values:
      contrasts: {dc: anota2seq_regulation, column: contrast, aggregation: nunique, format: integer}
    body: |
      ### The run
      - ![](icon:mdi:source-branch) **Pipeline** nf-core/riboseq 2.0.0
      - ![](icon:mdi:compare-horizontal) **Contrasts** {{contrasts}}
      - ![](icon:mdi:filter-remove-outline) **rRNA removal** {{param:ribo_removal_tool}}
      - ![](icon:mdi:dna) **Aligners** {{param:aligner}} · {{param:pseudo_aligner}}
      - ![](icon:mdi:scale-balance) **Efficiency** {{param:translational_efficiency_method}}
      - ![](icon:mdi:tune) [All parameters and tool versions](params:)
    tag: rb-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 6}
  # The marks take the family's colour (the header's), not the theme's blue.
  # A step past the quantification cites a count from its tab's collections, so the
  # import takes the line out with its data: a run that skipped a stage keeps the rest.
  - component_type: text
    surface: card
    accent: green
    values:
      n_psites: {dc: ribowaltz_summary, column: psites, aggregation: sum, format: si}
      n_te: {dc: translational_efficiency, column: gene_id, aggregation: count, format: si}
      n_contr: {dc: anota2seq_regulation, column: contrast, aggregation: nunique, format: integer}
      n_orfs: {dc: orf_overlap, column: orf_id, aggregation: count, format: si}
    body: |
      ### Six steps from footprints to ORFs
      Each step names its settings and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:filter-remove-outline) **Clean** Adapters trimmed, rRNA removed by {{param:ribo_removal_tool}} · [Settings](params:ribo_removal) · [MultiQC](tab:MultiQC)
      2. ![](icon:mdi:waves) **P-sites** riboWaltz offsets and periodicity of {{n_psites}} P-sites · [Settings](params:ribowaltz) · [Ribo-seq QC](tab:Ribo-seq QC)
      3. ![](icon:mdi:dna) **Quantify** Salmon per gene, both assays · [Settings](params:pseudo_aligner) · [Sample space](tab:Sample space)
      4. ![](icon:mdi:scale-balance) **Efficiency** Footprints over mRNA for {{n_te}} genes · [Settings](params:te_) · [Efficiency](tab:Translational efficiency)
      5. ![](icon:mdi:compare-horizontal) **Regulation** anota2seq on {{n_contr}} contrasts · [Settings](params:translational_efficiency) · [Regulation](tab:Translational regulation)
      6. ![](icon:mdi:set-merge) **ORFs** {{n_orfs}} ORFs called by Ribo-TISH and RiboCode · [Settings](params:orf) · [ORF discovery](tab:ORF discovery) · [Locus](tab:Locus)
      :::
    tag: rb-ov-steps
    index: ov-steps
    layout: {x: 0, y: 7, w: 8, h: 3}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/riboseq profiles ribosome footprints (Ribo-seq) beside total mRNA (RNA-seq), checks that the footprints come from translating ribosomes and compares the two assays gene by gene. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The sample filters in the left panel apply to every tab that reads per-library data: narrow the libraries once and those tabs follow. A bar above a section narrows that section only.
    tag: rb-ov-about
    index: ov-about
    layout: {x: 0, y: 10, w: 8, h: 3}
  # Key figures: one card per Data & QC or ORF tab, in tab order, each opening
  # the tab that explains it; the icon colour is that tab's colour. Libraries is
  # a count over the sheet (one row per library), so its bar holds parts of a
  # whole. No anota2seq card: a run without --contrasts would leave three on the
  # row, so regulation is a Findings row and highlight instead.
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: samples
    aggregation: count
    column_name: sample
    column_type: object
    secondary_layout: composition
    breakdown_col: type
    display:
      icon_name: mdi:flask-outline
      icon_color: orange
      caption: in the sample sheet, by assay
      link: tab:MultiQC
    section: Key figures
    tag: rb-ov-kf-libraries
    index: ov-kf-libraries
    title: Libraries
    description: Libraries in the sample sheet. The bar splits them by assay, Ribo-seq against RNA-seq.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_summary
    use: ribowaltz/library_summary
    aggregation: median
    column_name: frame0_cds_pct
    column_type: float64
    filter_expr: col('psites') > 0
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:waves
      icon_color: grape
      caption: median per Ribo-seq library
      link: tab:Ribo-seq QC
      decimals: 1
    section: Key figures
    tag: rb-ov-kf-frame0
    index: ov-kf-frame0
    title: Frame 0 in CDS (%)
    description: Median share of each Ribo-seq library's CDS P-sites in the annotated frame. A third means no periodicity.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: sample_pca
    use: salmon/sample_pca
    aggregation: median
    column_name: genes_expressed
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: cyan
      caption: median per library, with its spread
      link: tab:Sample space
      decimals: 0
    section: Key figures
    tag: rb-ov-kf-expressed
    index: ov-kf-expressed
    title: Genes expressed
    description: Genes at 1 TPM or more in a library, the median over the libraries in view, both assays together.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: orf_overlap
    aggregation: count
    column_name: orf_id
    column_type: object
    secondary_layout: composition
    breakdown_col: orf_class
    display:
      icon_name: mdi:set-merge
      icon_color: pink
      caption: pooled over libraries, by class
      link: tab:ORF discovery
    section: Key figures
    tag: rb-ov-kf-orfs
    index: ov-kf-orfs
    title: ORFs
    description: ORFs either caller reported in at least one library. The bar splits them by class.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the group, then the contrast the regulation row and
  # its highlight are read on.
  - component_type: interactive
    workflow_tag: riboseq
    data_collection_tag: metadata
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Findings
    tag: rb-ov-findings-group
    index: ov-findings-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: riboseq
    data_collection_tag: anota2seq_regulation
    interactive_component_type: MultiSelect
    column_name: contrast
    column_type: object
    display:
      icon_name: mdi:compare-horizontal
      custom_color: indigo
      strip_label: Contrast
    section: Findings
    tag: rb-ov-findings-contrast
    index: ov-findings-contrast
    title: Contrast
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data. The efficiency and ORF rows are pooled over
  # the run, so the sample filters do not change them.
  - component_type: text
    surface: card
    values:
      frame0: {dc: ribowaltz_summary, column: frame0_cds_pct, aggregation: median, filter_expr: "col('psites') > 0",
        format: 'decimals:1'}
      te_high: {dc: translational_efficiency, column: gene_id, aggregation: nunique, filter_expr: "col('log2_te') >= 1",
        format: integer}
      te_genes: {dc: translational_efficiency, column: gene_id, aggregation: nunique, format: integer}
      n_transl: {dc: anota2seq_regulation, column: gene_id, aggregation: nunique, filter_expr: "col('regulation_mode') == 'translation'",
        format: integer}
      n_regulated: {dc: anota2seq_regulation, column: gene_id, aggregation: nunique, filter_expr: "col('regulation_mode') != 'not regulated'",
        format: integer}
      n_new: {dc: orf_overlap, column: orf_id, aggregation: nunique, filter_expr: "(col('annotated_cds') == 0) & (col('ribotish') == 1) & (col('ribocode') == 1)",
        format: integer}
      top_gene: {dc: orf_overlap, column: gene_name, aggregation: top, weight: support_score}
    body: |
      - **{{frame0}}%** of CDS P-sites sit in the annotated frame – median per Ribo-seq library [Ribo-seq QC](tab:Ribo-seq QC)
      - **{{te_high}}** of {{te_genes}} genes have a translational efficiency of 2 or more – pooled over the run [Efficiency](tab:Translational efficiency)
      - **{{n_transl}}** genes change translation beyond their mRNA level, of **{{n_regulated}}** regulated in any mode – anota2seq, contrasts in view [Regulation](tab:Translational regulation)
      - **{{n_new}}** ORFs outside the annotated CDS are called by both Ribo-TISH and RiboCode – the best supported; the genome browser opens on the top-ranked one [ORFs](tab:ORF discovery) · [Locus](tab:Locus)
      - The best-supported gene is [{{top_gene}}](locus:{{top_gene}}): its footprints and P-sites in the genome browser
    section: Findings
    tag: rb-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 3}
  # One highlight per Translation or ORF tab, in the order of the rows above. The
  # Ribo-seq QC result (the phasing) is the first Findings row and the frame-0
  # card; its metagene profile stays on its own tab.
  - component_type: highlight
    section: Findings
    source_tab: Translational efficiency
    source_component: te-plane
    caption: One point per gene; above the diagonal, more footprints than its mRNA level predicts.
    tag: rb-ov-hl-te-plane
    index: ov-hl-te-plane
    layout: {x: 0, y: 3, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Translational regulation
    source_component: tr-fold-change-plane
    caption: One point per gene and contrast, coloured by mode; off the diagonal, translation changes on its own.
    tag: rb-ov-hl-fold-change
    index: ov-hl-fold-change
    layout: {x: 4, y: 3, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: ORF discovery
    source_component: orf-caller-upset
    caption: ORFs by the callers that report them, split into the annotated CDS and new ORFs; compare the share of new ORFs when both callers agree with each caller alone.
    tag: rb-ov-hl-orf-upset
    index: ov-hl-orf-upset
    layout: {x: 0, y: 7, w: 8, h: 4}
  # The ORFs on the genome, opened on the region they cover: a click opens the
  # Locus tab's browser on the gene, so the Overview needs no browser of its own.
  - component_type: advanced_viz
    workflow_tag: riboseq
    data_collection_tag: orf_overlap
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      chr_col: chrom
      pos_col: orf_start
      end_col: orf_end
      score_col: aa_length
      feature_col: gene_name
      category_col: orf_class
      mark: point
      point_size: 9
      score_title: Protein length (aa)
      assembly: '{GENOME}'
      region_filter_enabled: false
      click_opens_browser: true
      open_on_data: true
    section: Findings
    tag: rb-ov-genome
    index: ov-genome
    title: ORFs along the genome
    link: tab:Locus
    description: >-
      Where along the genome were ORFs found? Each dot is one ORF, placed by its position, its height the protein length it encodes (amino acids) and its colour the ORF class, the same colours as on every other tile.

      How to read: short upstream ORFs sit low and long coding regions sit high. A cluster of dots on one chromosome is a region worth opening, and a dot outside the annotated CDS is a new ORF to check. Click a dot to open its gene in the genome browser of [Locus](tab:Locus).

      Note: the position is a span estimated from the stop codon and the protein length, so it is approximate for an ORF split over exons. No cut-off is drawn; the height is the protein length alone.
    layout: {x: 0, y: 11, w: 8, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers. A tab the run does not have is left out, and a heading whose
  # tabs are all missing is hidden.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Ribo-seq QC](tab:Ribo-seq QC)
      - [Sample space](tab:Sample space)

      ### Translation
      - [Translational efficiency](tab:Translational efficiency)
      - [Translational regulation](tab:Translational regulation)

      ### ORFs
      - [ORF discovery](tab:ORF discovery)
      - [Locus](tab:Locus)
    section: How to read this dashboard
    tag: rb-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the group first.
  - component_type: interactive
    workflow_tag: riboseq
    data_collection_tag: metadata
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: rb-filter-group
    index: sample-filters-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: riboseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: rb-filter-library
    index: sample-filters-library
    title: Library
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: riboseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: type
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: orange
    section: Sample filters
    group: Sample scope
    tag: rb-filter-assay
    index: sample-filters-assay
    title: Assay
    layout: {x: 0, y: 5, w: 1, h: 2}
  # Row selection feeds the Analysis panel. The design table goes with
  # METADATA_FILE.
  - component_type: table
    workflow_tag: riboseq
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample
    section: Sample sheet
    tag: rb-sample-sheet
    index: sample-sheet
    title: Sample sheet
    description: >-
      Which libraries does the run hold? One row per library, with its assay (Ribo-seq or RNA-seq) and the design columns the sheet declares.

      How to read: check here that every library carries the assay and the design values you expect before reading the other tabs. The sample filters of the left panel narrow the libraries every tab draws.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: riboseq
    data_collection_tag: metadata
    row_selection_enabled: true
    row_selection_column: '{METADATA_ID_COL}'
    section: Sample sheet
    tag: rb-design-table
    index: design-table
    title: Design table
    description: >-
      How are the libraries grouped? The optional design table, one row per library; its first annotation column is the group the filters read.

      How to read: the group column here is the one the sample PCA colours by, and a library the table does not list reads "All libraries" there. Check the grouping of each library before reading a contrast.
    layout: {x: 0, y: 6, w: 8, h: 6}
tabs:
- title: MultiQC
  subtitle: Did the reads survive trimming, rRNA removal and alignment?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # The read layout is bound to the sample sheet; samples are narrowed by the
  # pinned Sample filters through the link to multiqc_data.
  filter_sections:
  - name: MultiQC report
    icon: mdi:file-document-outline
    color: orange
    description: The read layout behind the MultiQC panels
  grid_sections:
  - name: Read quality
    icon: mdi:chart-bell-curve
    color: orange
    description: Raw reads, then the same reads after trimming and rRNA removal
  - name: rRNA and alignment
    icon: mdi:dna
    color: orange
    description: The reads SortMeRNA matched to rRNA, then what STAR placed on the genome
  - name: QC details
    icon: mdi:file-document-outline
    color: gray
    description: The remaining FastQC, samtools and Salmon panels, and Ribo-TISH's frame and length panels
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [MultiQC](https://multiqc.info) gathers FastQC on the raw, trimmed and rRNA-filtered
      reads with the SortMeRNA, STAR, Salmon and Ribo-TISH reports. Footprints are short, so
      Ribo-seq libraries show heavy adapter content and a large rRNA share: compare them with
      each other, not with RNA-seq.
