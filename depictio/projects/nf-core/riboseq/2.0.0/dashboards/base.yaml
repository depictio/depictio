# ================================================= Translational regulation
- title: Translational regulation
  subtitle: Which genes change translation between conditions, and through which mode, per anota2seq contrast
  tab_order: 3
  tab_icon: mdi:scale-balance
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Regulation scope
    icon: mdi:filter-variant
    color: indigo
    description: Which contrast, regulatory modes and genes the regulation panels cover
  grid_sections:
  - name: Regulation at a glance
    icon: mdi:counter
    color: indigo
    description: How many genes each mode holds and how large the changes are
  - name: Fold-change plane
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Total mRNA change against ribosome-bound mRNA change, per gene
  - name: Significance
    icon: mdi:chart-scatter-plot
    color: blue
    description: Effect against significance for the translation analysis and for each anota2seq analysis
  - name: Gene detail
    icon: mdi:information-outline
    color: indigo
    description: Select a gene in the regulation table to read it across the four anota2seq analyses in the record beside it
  components:
  - component_type: text
    tag: rb-tr-intro
    section: Regulation at a glance
    workflow_tag: riboseq
    data_collection_tag: anota2seq_regulation
    title: Translation, buffering or mRNA abundance?
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Pick a contrast first. Translation genes change ribosome loading beyond
      their mRNA change, buffered genes change mRNA without it, and mRNA
      abundance genes move both together.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: rb-tr-card-modes
    section: Regulation at a glance
    workflow_tag: riboseq
    data_collection_tag: anota2seq_regulation
    use: anota2seq/regulation
    aggregation: nunique
    column_name: gene_id
    column_type: object
    secondary_layout: donut
    breakdown_col: regulation_mode
    display: {icon_name: 'mdi:dna', title_font_size: xl, value_font_size: xl}
    title: Genes by regulatory mode
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 2, h: 2}
  - component_type: card
    tag: rb-tr-card-translation
    section: Regulation at a glance
    workflow_tag: riboseq
    data_collection_tag: anota2seq_regulation
    use: anota2seq/regulation
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: translation_effect
    column_type: float64
    display: {icon_name: 'mdi:scale-balance', title_font_size: xl, value_font_size: xl}
    title: Translation effect (log2)
    title_size: sm
    title_align: left
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: rb-tr-card-total
    section: Regulation at a glance
    workflow_tag: riboseq
    data_collection_tag: anota2seq_regulation
    use: anota2seq/regulation
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: total_mrna_lfc
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', title_font_size: xl, value_font_size: xl}
    title: Total mRNA change (log2)
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 2, h: 2}
  - component_type: card
    tag: rb-tr-card-translated
    section: Regulation at a glance
    workflow_tag: riboseq
    data_collection_tag: anota2seq_regulation
    use: anota2seq/regulation
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: translated_mrna_lfc
    column_type: float64
    display: {icon_name: 'mdi:waves', title_font_size: xl, value_font_size: xl}
    title: Ribosome-bound mRNA change (log2)
    title_size: sm
    title_align: left
    layout: {x: 6, y: 1, w: 2, h: 2}

  - component_type: advanced_viz
    tag: rb-tr-av-plane
    index: rb-tr-av-plane
    section: Fold-change plane
    workflow_tag: riboseq
    data_collection_tag: anota2seq_regulation
    use: anota2seq/fold_change_plane
    config:
      x_title: Total mRNA change (log2)
      y_title: Ribosome-bound mRNA change (log2)
      reference_line: diagonal
      marker_size: 5
      opacity: 0.7
      marker_outline: false
      top_n_labels: 10
      density_threshold: 40000
      selection_enabled: true
      selection_column: gene_id
      legend_pos: bottom
      controls_placement: header
    title: Ribosome-bound against total mRNA change
    description: One point per gene, coloured by regulatory mode. Genes on the diagonal change through mRNA level; genes off it change translation. Click a point to open its record.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 8}

  - component_type: advanced_viz
    tag: rb-tr-av-volcano
    index: rb-tr-av-volcano
    section: Significance
    workflow_tag: riboseq
    data_collection_tag: anota2seq_regulation
    use: anota2seq/translation_volcano
    config:
      label_col: gene_name
      significance_threshold: 0.15
      effect_threshold: 0.263
      top_n_labels: 15
      show_labels: true
      p_value_col: translation_pvalue
      view: volcano
      views: [volcano, qq]
      controls_placement: header
    title: Translation effect against significance
    description: -log10 adjusted p of the translation analysis against its effect, with the QQ view of the raw p-values in the header switch. The dashed lines are anota2seq's default cut-offs, adjusted p 0.15 and a 1.2-fold change.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: advanced_viz
    tag: rb-tr-av-analysis-volcano
    index: rb-tr-av-analysis-volcano
