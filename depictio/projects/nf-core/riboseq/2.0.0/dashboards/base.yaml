  # The strip counts the ORFs in view; the blues run light to dark across it.
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: orf_overlap
    aggregation: count
    column_name: orf_id
    column_type: object
    secondary_layout: donut
    breakdown_col: orf_class
    display:
      icon_name: mdi:set-merge
      icon_color: blue.4
      caption: in view, by class
    section: ORFs at a glance
    tag: rb-loc-card-orfs
    index: loc-card-orfs
    title: ORFs
    description: ORFs either caller reported in at least one library, split by class.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: orf_overlap
    aggregation: count
    column_name: orf_id
    column_type: object
    filter_expr: (col('annotated_cds') == 0) & (col('ribotish') == 1) & (col('ribocode') == 1)
    display:
      icon_name: mdi:star-circle-outline
      icon_color: blue.6
      caption: outside the annotated CDS, both callers
    section: ORFs at a glance
    tag: rb-loc-card-new
    index: loc-card-new
    title: New ORFs, both callers
    description: ORFs outside the annotated CDS that Ribo-TISH and RiboCode both reported, the best supported new candidates.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: orf_overlap
    aggregation: nunique
    column_name: gene_name
    column_type: object
    display:
      icon_name: mdi:dna
      icon_color: blue.8
      caption: with a gene symbol
    section: ORFs at a glance
    tag: rb-loc-card-genes
    index: loc-card-genes
    title: Genes
    description: Distinct gene symbols of the ORFs in view; an ORF outside any annotated gene has none.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: orf_overlap
    aggregation: median
    column_name: aa_length
    column_type: int64
    display:
      icon_name: mdi:ruler
      icon_color: blue.9
      caption: median, amino acids
      decimals: 0
    section: ORFs at a glance
    tag: rb-loc-card-length
    index: loc-card-length
    title: Protein length (aa)
    description: Median length of the ORFs in view, the longest either caller reported.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: table
    workflow_tag: riboseq
    data_collection_tag: orf_overlap
    row_selection_enabled: true
    row_selection_column: orf_id
    # One ORF at a time: the browser below frames one ORF.
    row_selection_mode: single
    section: ORF at its locus
    tag: rb-loc-table-pooled
    index: loc-table-pooled
    title: ORFs pooled over libraries
    description: >-
      Which ORFs are supported, and by whom? One row per ORF pooled over the libraries, with its class, protein length, gene, which callers reported it and in how many libraries.

      How to read: the best candidates for a new ORF are those outside the annotated CDS that both callers report, in several libraries. Pick a row to open its record and move the genome browser below to that ORF; unpicked, the browser opens on the best supported one.

      Note: the ranking behind that order is the template's own, new ORFs both callers report first, then new ORFs one caller reports, then annotated CDSs both report, so it is a reading order and not a statistical score.
    layout: {x: 0, y: 0, w: 5, h: 5}
  - component_type: advanced_viz
    workflow_tag: riboseq
    data_collection_tag: orf_overlap
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: orf_id
      title_col: gene_name
      selection_source: any
      linked_component: rb-loc-table-pooled
      sections:
        ORF: [orf_id, orf_class, aa_length]
        Gene: [gene_name, gene_id, gene_type]
        Support: [ribotish, ribocode, annotated_cds, ribotish_libraries, ribocode_libraries]
      link_templates:
        gene_id: "https://www.ensembl.org/id/{value}"
    section: ORF at its locus
    tag: rb-loc-record
    index: loc-record
    title: ORF record
    description: >-
      What do we know about this ORF? A fact panel for the ORF picked in the table: its class and protein length, its gene with a link to Ensembl, and which caller reported it in how many libraries.

      How to read: support from both callers in several libraries, outside the annotated CDS, makes the strongest new ORF. Check the footprints over it in the genome browser below. No cut-off is applied here.
    layout: {x: 5, y: 0, w: 3, h: 5}
  # The footprints on the ORF picked above: the table row narrows orf_overlap
  # to one ORF, whose coordinates (read off its key and protein length) the
  # view frames. Unpicked, it opens on the best supported new ORF (support_score:
  # new ORFs both callers report first), and the stepper walks the others.
  # The six opening tracks are the coverage of one library per assay and design
  # group (the manifest orders them); the P-sites and reads are in the track
  # menu: the P-site bedGraphs are read whole and the BAMs run to gigabytes.
  # The gene track is the assembly's own (show_annotation).
  - component_type: jbrowse
    workflow_tag: riboseq
    data_collection_tag: tracks
    section: ORF at its locus
    initial_tracks: 6
    max_tracks: 12
    show_overview: false
    show_annotation: true
    # The libraries of a design group share a hue, as on the other tiles.
    color_by: '{GROUP_COL}'
    selection_enabled: true
    selection_column: sample
    locus_from:
      data_collection_tag: orf_overlap
      name: ORFs
      chrom_column: chrom
      start_column: orf_start
      end_column: orf_end
      padding: 300
      max_rows: 20
      # A pick opens on its whole gene, the row's own span inside it.
      frame_gene: true
      sort_by: support_score
      descending: true
      label_column: gene_name
      # No track draws an ORF: a "Top 20" track names the best supported ones
      # by rank and gene (#1 GENE); the picked ORF, or the best three unpicked,
      # wear the selection colour there, and the transcripts of its gene too.
      rank_track: 20
    tag: rb-loc-browser
    index: loc-browser
    title: Genome browser
    description: >-
      Do the footprints agree with the ORF? A genome browser on the gene of the ORF picked in the table, or of the top-ranked ORF when none is picked (new ORFs both callers report first). It opens on the coverage of one library per assay and design group, coloured by group, with the assembly's own gene track; the P-sites and reads are in the track menu.

      How to read: footprint coverage that starts at the start codon and stops at the stop codon of an ORF, on the right strand, supports it. Coverage spread evenly over the gene, or absent over the ORF, does not. Step through the ranked ORFs with the stepper and compare the Ribo-seq lanes with the RNA-seq ones.

      Lines and annotations: the Top 20 track draws the best supported ORFs by rank and gene name (#1 first). The ORF picked and the transcripts of its gene are drawn in the selection colour; without a pick, the best three wear it.

      Note: the ORF span is approximate, the stop codon coordinate pushed back 3 bases per amino acid, so an ORF split over exons reaches further than the frame shown. The Top 20 rank is the template's reading order, not a statistical score.
    layout: {x: 0, y: 5, w: 8, h: 9}
