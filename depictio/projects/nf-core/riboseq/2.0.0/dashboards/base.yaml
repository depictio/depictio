    icon: mdi:counter
    color: pink
    description: How many ORFs each caller reported and how long they are
  - name: ORF classes per library
    icon: mdi:chart-bar
    color: pink
    description: The share of each ORF class per library, for each caller
  - name: Caller agreement
    icon: mdi:set-merge
    color: red
    description: Which ORFs one caller, both, or the annotation support
  - name: ORF detail
    icon: mdi:information-outline
    color: pink
    description: Select an ORF in the pooled table to read its record beside it
  - name: ORF rows
    icon: mdi:table
    color: gray
    description: Each caller's per-library calls
    collapsed: true
  components:
  - component_type: text
    tag: rb-orf-intro
    section: ORFs at a glance
    workflow_tag: riboseq
    data_collection_tag: orf_overlap
    title: Known coding sequences and new ORFs
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Ribo-TISH and RiboCode call ORFs from different signals, keyed here by
      their stop codon. ORFs outside the annotated CDS that both callers
      report are the best supported new candidates.
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: rb-orf-card-pooled
    section: ORFs at a glance
    workflow_tag: riboseq
    data_collection_tag: orf_overlap
    aggregation: nunique
    column_name: orf_id
    column_type: object
    secondary_layout: donut
    breakdown_col: orf_class
    display: {icon_name: 'mdi:set-merge', title_font_size: xl, value_font_size: xl}
    title: ORFs, both callers pooled
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 2, h: 2}
  - component_type: card
    tag: rb-orf-card-ribotish
    section: ORFs at a glance
    workflow_tag: riboseq
    data_collection_tag: ribotish_orfs
    use: ribotish/orfs
    aggregation: nunique
    column_name: orf_id
    column_type: object
    secondary_layout: donut
    breakdown_col: orf_class
    display: {icon_name: 'mdi:dna', title_font_size: xl, value_font_size: xl}
    title: Ribo-TISH ORFs
    title_size: sm
    title_align: left
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: rb-orf-card-ribocode
    section: ORFs at a glance
    workflow_tag: riboseq
    data_collection_tag: ribocode_orfs
    use: ribocode/orfs
    aggregation: nunique
    column_name: orf_id
    column_type: object
    secondary_layout: donut
    breakdown_col: orf_class
    display: {icon_name: 'mdi:dna', title_font_size: xl, value_font_size: xl}
    title: RiboCode ORFs
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 2, h: 2}
  - component_type: card
    tag: rb-orf-card-length
    section: ORFs at a glance
    workflow_tag: riboseq
    data_collection_tag: ribocode_orfs
    use: ribocode/orfs
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: aa_length
    column_type: int64
    display: {icon_name: 'mdi:ruler', title_font_size: xl, value_font_size: xl}
    title: RiboCode protein length (aa)
    title_size: sm
    title_align: left
    layout: {x: 6, y: 1, w: 2, h: 2}

  - component_type: advanced_viz
    tag: rb-orf-av-classes
    index: rb-orf-av-classes
    section: ORF classes per library
    workflow_tag: riboseq
    data_collection_tag: orf_calls
    viz_kind: stacked_taxonomy
    config:
      viz_kind: stacked_taxonomy
      sample_id_col: sample
      taxon_col: orf_class
      rank_col: caller
      abundance_col: pct
      default_rank: RiboCode
      normalise_to_one: true
      sort_by: abundance
      sample_sort: input
      top_n: 12
      controls_placement: header
    title: ORF classes per library
    description: Share of each library's ORFs per class. The level switch changes the caller; the annotated CDS dominates, so the other classes are the ones to compare.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 7}

  - component_type: advanced_viz
    tag: rb-orf-av-upset
    index: rb-orf-av-upset
    section: Caller agreement
    workflow_tag: riboseq
    data_collection_tag: orf_overlap
    viz_kind: upset_plot
    config:
      viz_kind: upset_plot
      set_columns: [ribotish, ribocode, annotated_cds]
      sort_by: cardinality
      sort_order: descending
      min_size: 1
      show_set_sizes: true
      color_intersections_by: degree
      default_annotation_cols: [orf_class]
    title: ORFs per caller and annotation
    description: Each bar counts the ORFs in one combination of Ribo-TISH, RiboCode and the annotated CDS. New ORFs both callers report sit in the bar without the annotation.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 7}

  - component_type: table
    tag: rb-orf-table-pooled
    section: ORF detail
    workflow_tag: riboseq
    data_collection_tag: orf_overlap
    row_selection_enabled: true
    row_selection_column: orf_id
    title: ORFs pooled over libraries
    description: One row per ORF with the caller support; select a row to read it in the record beside it and narrow the per-library tables in the ORF rows section.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 5, h: 7}
  - component_type: advanced_viz
    tag: rb-orf-av-record
    index: rb-orf-av-record
    section: ORF detail
    workflow_tag: riboseq
    data_collection_tag: orf_overlap
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: orf_id
      title_col: gene_name
      selection_source: any
      linked_component: rb-orf-table-pooled
      sections:
        ORF: [orf_id, orf_class, aa_length]
        Gene: [gene_name, gene_id, gene_type]
        Support: [ribotish, ribocode, annotated_cds, ribotish_libraries, ribocode_libraries]
      link_templates:
        gene_id: "https://www.ensembl.org/id/{value}"
    title: ORF record
    description: The ORF selected in the pooled table beside it, its gene and which caller reported it in how many libraries.
    title_size: h3
    layout: {x: 5, y: 0, w: 3, h: 7}
  - component_type: table
    tag: rb-orf-table-ribotish
    section: ORF rows
    workflow_tag: riboseq
    data_collection_tag: ribotish_orfs
    use: ribotish/orfs
    row_selection_enabled: false
    title: Ribo-TISH calls per library
    description: One row per library and ORF with the Ribo-TISH initiation type and frame-test q-value.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    tag: rb-orf-table-ribocode
    section: ORF rows
    workflow_tag: riboseq
    data_collection_tag: ribocode_orfs
    use: ribocode/orfs
    row_selection_enabled: false
    title: RiboCode calls per library
    description: One row per library and ORF with the RiboCode type, frame-0 P-sites and adjusted p-value.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 6, w: 8, h: 6}

  - component_type: interactive
    tag: rb-orf-filter-class
    index: rb-orf-class-filter
    section: ORF scope
    group: ORFs
    workflow_tag: riboseq
    data_collection_tag: orf_overlap
    interactive_component_type: MultiSelect
    column_name: orf_class
    column_type: object
    display: {title_size: md, custom_color: '#D81B60', icon_name: 'mdi:shape-outline'}
