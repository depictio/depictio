# --skip_ribowaltz prunes every riboWaltz collection, and the tab with them.
- title: Ribo-seq QC
  subtitle: Do the footprints come from translating ribosomes?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:waves
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # The library summary links to the other riboWaltz views, so a band picked
  # here narrows every tile of the tab.
  filter_sections:
  - name: Ribo-seq filters
    icon: mdi:filter-variant
    color: grape
    description: Narrows the Ribo-seq views to libraries inside a phasing or CDS band
  grid_sections:
  - name: Periodicity at a glance
    icon: mdi:counter
    color: grape
    description: How well the Ribo-seq libraries are phased, and where their P-sites fall
  - name: Reading frame
    icon: mdi:chart-bar
    color: grape
    description: Share of each library's P-sites in the three frames, per transcript region
  - name: Metagene profiles
    icon: mdi:chart-line
    color: grape
    description: P-site signal around the start and the stop codon
  - name: Libraries
    icon: mdi:chart-bar
    color: grape
    description: Each library's frame margin and CDS share, sorted and coloured by design group, and its footprint lengths
  - name: Library detail
    icon: mdi:table
    color: gray
    description: P-sites per region, and every riboWaltz readout of the library picked
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [riboWaltz](https://github.com/LabTranslationalArchitectomics/riboWaltz) places the
      P-site of each footprint and checks that it steps one codon at a time. Look for a
      frame-0 share well above a third in the CDS and P-sites enriched in the CDS; a library
      that fails both is not reporting translation. Ribo-TISH's own frame and length panels
      are under QC details of [MultiQC](tab:MultiQC).
    tag: rb-rq-intro
    index: rq-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_summary
    interactive_component_type: RangeSlider
    column_name: frame0_cds_pct
    column_type: float64
    display:
      icon_name: mdi:waves
      custom_color: grape
    section: Ribo-seq filters
    group: Phasing
    tag: rb-rq-filter-frame0
    index: rq-frame0-filter
    title: Frame 0 in CDS (%)
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_summary
    interactive_component_type: RangeSlider
    column_name: cds_pct
    column_type: float64
    display:
      icon_name: mdi:dna
      custom_color: teal
    section: Ribo-seq filters
    group: Phasing
    tag: rb-rq-filter-cds
    index: rq-cds-filter
    title: P-sites in CDS (%)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_summary
    use: ribowaltz/library_summary
    aggregation: sum
    column_name: psites
    column_type: int64
    # Not ranked by library: run accessions cut to "SRX117..." at card width.
    secondary_layout: histogram
    display:
      icon_name: mdi:counter
      icon_color: grape.4
      caption: total; its spread over libraries
    section: Periodicity at a glance
    tag: rb-rq-card-psites
    index: rq-card-psites
    title: P-sites assigned
    description: P-sites riboWaltz assigned to a transcript region, over the libraries in view. The bars spread the libraries by their own count.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_summary
    use: ribowaltz/library_summary
    aggregation: median
    column_name: frame0_cds_pct
    column_type: float64
    filter_expr: col('psites') > 0
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:waves
      icon_color: grape.6
      caption: median, with its spread
      decimals: 1
    section: Periodicity at a glance
    tag: rb-rq-card-frame0
    index: rq-card-frame0
    title: Frame 0 in CDS (%)
    description: Median share of each library's CDS P-sites in the annotated frame; a third is no periodicity.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_summary
    use: ribowaltz/library_summary
    aggregation: min
    column_name: frame_bias
    column_type: float64
    secondary_layout: threshold
    threshold_value: 20
    threshold_direction: min
    threshold_warn: 10
    display:
      icon_name: mdi:alert-outline
      icon_color: grape.8
      caption: lowest; libraries at 20 points or more pass
      decimals: 1
    section: Periodicity at a glance
    tag: rb-rq-card-margin
    index: rq-card-margin
    title: Frame margin (points)
    description: Frame-0 share of the CDS P-sites minus the larger of the two other frames, for the weakest library in view. A margin of 20 points passes and 10 warns; these are the template's working cut-offs, and with no periodicity the margin is near 0.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_summary
    use: ribowaltz/library_summary
    aggregation: median
    column_name: cds_pct
    column_type: float64
    filter_expr: col('psites') > 0
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:dna
      icon_color: grape.9
      caption: median share, 0 to 100
      decimals: 1
    section: Periodicity at a glance
    tag: rb-rq-card-cds
    index: rq-card-cds
    title: P-sites in CDS (%)
    description: Median share of each library's P-sites that fall in the coding sequence.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_frames
    use: ribowaltz/frame_composition
    config:
      default_rank: CDS
      normalise_to_one: true
      sort_by: abundance
      sample_sort: input
      top_n: 8
    section: Reading frame
    tag: rb-rq-frames
    index: rq-frames
    title: P-sites per reading frame
    description: >-
      Are the footprints in phase with the codons? Each bar is one library, split into the share of its P-sites in each of the three reading frames; the tile opens on the CDS and the level switch moves to a UTR. Frame 0, the annotated frame, is red and the two other frames are grey.

      How to read: in the CDS of a translating library the red share rises well above a third and the grey frames shrink. In a UTR ribosomes do not read in frame, so the three frames stay near a third each, which is the unphased background to compare with. A CDS bar with three equal thirds is a library with no periodicity; open its readouts in the table of the library detail below.

      Note: no cut-off is drawn. A third is only what three equal frames give, not a validated threshold; the lines of the phasing tile below are the template's own.

      Source: riboWaltz reports the percentage of P-sites in the three reading frames as its periodicity analysis, Lauria et al. 2018, https://doi.org/10.1371/journal.pcbi.1006169
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_metaprofile_start
    use: ribowaltz/start_profile
    config:
      reference_x: 0
      reference_label: Start codon
      x_title: Distance from the start codon (nt)
      y_title: P-site signal (%)
      line_width: 1.5
      legend_pos: right
    section: Metagene profiles
    tag: rb-rq-start-profile
    index: rq-start-profile
    title: P-sites around the start codon
    description: >-
      Where do P-sites pile up around the start codon? Each line is one library: the share of its P-site signal, summed over all transcripts, at each nucleotide from the start codon (x, in nucleotides), as a percentage of the window.

      How to read: a phased library peaks at the start codon and repeats a three-nucleotide saw-tooth along the CDS to the right. A flat line with no three-nucleotide pattern is weak periodicity, and a library that departs from the others of its assay is the one to open in the table of the library detail.

      Lines and annotations: the dotted vertical line at distance 0, labelled Start codon, marks the first nucleotide of the annotated start codon. It is a landmark, not a cut-off.

      Source: riboWaltz computes the metagene profiles and checks the trinucleotide periodicity of the P-sites, Lauria et al. 2018, https://doi.org/10.1371/journal.pcbi.1006169
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_metaprofile_stop
    use: ribowaltz/stop_profile
    config:
      reference_x: 0
      reference_label: Stop codon
      x_title: Distance from the stop codon (nt)
      y_title: P-site signal (%)
      line_width: 1.5
      legend_pos: right
    section: Metagene profiles
    tag: rb-rq-stop-profile
    index: rq-stop-profile
    title: P-sites around the stop codon
    description: >-
      Where do P-sites end around the stop codon? Each line is one library: the share of its P-site signal, summed over all transcripts, at each nucleotide from the stop codon (x, in nucleotides), as a percentage of the window.

      How to read: the three-nucleotide pattern should run up to the stop codon and drop after it, where ribosomes release. Signal that carries on past the stop, or no pattern before it, points at a library that is not reporting translation cleanly.

      Lines and annotations: the dotted vertical line at distance 0, labelled Stop codon, marks the first nucleotide of the annotated stop codon. It is a landmark, not a cut-off.

      Source: riboWaltz computes the metagene profiles and checks the trinucleotide periodicity of the P-sites, Lauria et al. 2018, https://doi.org/10.1371/journal.pcbi.1006169
    layout: {x: 4, y: 0, w: 4, h: 6}
  # Six libraries or so: a scatter of two shares would be a handful of points.
  # Sorted bars carry the same readings, coloured by the design group and
  # labelled by the library's description; the frame margin carries the lines of
  # the Frame margin card (20 passes, 10 warns), so the figure and the card agree.
  - component_type: figure
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_summary
    use: ribowaltz/library_summary
    visu_type: bar
    mode: code
    code_content: |-
      # Frame margin (frame-0 share of the CDS P-sites minus the larger of the two other frames, in points) and CDS share of all P-sites per library, sorted by margin and coloured by the design group. Dashed line at 20 points: the margin a library should reach; dotted line at 10: the warning level. Both are the template's working cut-offs (the Frame margin card's threshold_value and threshold_warn in the ribowaltz/library_summary catalog entry), not riboWaltz's. With no periodicity the three frames hold a third each, so the margin is near 0. The CDS share panel has no cut-off.
      names = {'frame_bias': 'Frame margin (points)', 'cds_pct': 'P-sites in CDS (%)'}
      grp = depictio_group_by[0] if depictio_group_by else '{GROUP_COL}'
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get('{GROUP_COL}') or {}
      grouped = grp in df.columns
      d = df.filter(pl.col('frame_bias').is_not_null())
      d = d if grouped else d.with_columns(pl.lit('All libraries').alias(grp))
      lab = 'sample_description' if 'sample_description' in d.columns else 'sample'
      d = d.with_columns(pl.col(lab).fill_null(pl.col('sample')).alias('library')).sort(['frame_bias', 'sample'])
      long = d.select(['sample', 'library', grp, *names.keys()]).unpivot(index=['sample', 'library', grp], variable_name='metric', value_name='value').with_columns(pl.col('metric').replace(names))
      fig = px.bar(long.to_pandas(), x='value', y='library', color=grp, color_discrete_map=colors, facet_col='metric', orientation='h', custom_data=['sample'], category_orders={'library': d.get_column('library').to_list(), 'metric': list(names.values())}, labels={'value': '', 'library': '', grp: ''})
      fig.update_xaxes(matches=None, showticklabels=True)
      fig.update_xaxes(range=[0, 100], col=2)
      if not d.is_empty():
          fig.update_xaxes(range=[min(0.0, float(d['frame_bias'].min())), max(25.0, float(d['frame_bias'].max()) * 1.05)], col=1)
      fig.update_yaxes(automargin=True)
      fig.for_each_annotation(lambda a: a.update(text=a.text.split('=')[-1]))
      fig.add_vline(x=20, line_dash='dash', line_width=1, opacity=0.6, annotation_text='pass 20', col=1)
      fig.add_vline(x=10, line_dash='dot', line_width=1, opacity=0.6, annotation_text='warn 10', col=1)
      fig.update_layout(margin=dict(t=30), showlegend=grouped, legend=dict(orientation='h', y=-0.12, title_text=''))
    selection_enabled: true
    selection_column: sample
    section: Libraries
    tag: rb-rq-phasing
    index: rq-phasing
    title: Phasing and CDS share per library
    description: >-
      Which libraries are well phased and mostly in the CDS? One bar per Ribo-seq library in two panels, sorted by frame margin with the best on top, coloured by design group and named by its description. Left, the frame margin is the frame-0 share of the CDS P-sites minus the larger of the two other frames, in points; right, the share of all P-sites that fall in the CDS.

      How to read: a bar that reaches the dashed line on the left is a clearly phased library, and a bar short of the dotted line is weak. With no periodicity each frame holds a third and the margin is near 0; a negative margin means another frame dominates, which usually points at wrong P-site offsets. A library with a short bar in either panel is the one to open in its record (click the bar), then in the metagene profiles above.

      Lines and annotations: on the left panel only, the dashed vertical line at 20 points (label pass 20) is the margin to reach, and the dotted vertical line at 10 points (label warn 10) is the warning level. The right panel has no line.

      Note: the 20 and 10 point lines are the template's working cut-offs, shared with the Frame margin card. They are not riboWaltz's and not a validated or published threshold, so read them as a display aid for comparing libraries.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_length
    use: ribowaltz/length_profile
    config:
      x_title: Read length (nt)
      y_title: Share of reads (%)
      line_width: 1.5
      legend_pos: right
    section: Libraries
    tag: rb-rq-length
    index: rq-length-profile
    title: Footprint length per library
    description: >-
      How long are the footprints? Each line is one library: the share of its reads at each read length, over the lengths riboWaltz kept for the P-site assignment.

      How to read: monosome footprints form one narrow peak, and libraries of one assay should peak at about the same length. A second peak or a broad shoulder is worth checking, since different footprint lengths may come from other ribosome conformations or from contamination. A library peaking elsewhere than its peers is the one to open in the table of the library detail.

      Note: no length window is drawn, and riboWaltz publishes no pass or fail cut-off for the distribution. Read it against the other libraries of the run.

      Source: riboWaltz discusses the read length distribution of the footprints, Lauria et al. 2018, https://doi.org/10.1371/journal.pcbi.1006169
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_psite_region
    use: ribowaltz/region_composition
    config:
      normalise_to_one: true
      sort_by: abundance
      sample_sort: input
      top_n: 8
    section: Library detail
    tag: rb-rq-regions
    index: rq-regions
    title: P-sites per transcript region
    description: >-
      Do the footprints sit in the coding sequence? Each bar is one library, split into the share of its P-sites in the 5' UTR, the CDS and the 3' UTR.

      How to read: protected footprints are enriched in the CDS, so a large CDS share is the good picture. A library whose regions split like the lengths of the regions behaves like fragmented RNA, not like protected footprints. The expected share by length alone is in the region table below.

      Note: the expectation is not drawn on the bars and no cut-off is applied; judge the CDS share against the other libraries and the enrichment in the table.
    layout: {x: 0, y: 0, w: 8, h: 5}
  # Master and detail: a picked row (or a library on the phasing bars) is the
  # selection the record card follows.
  - component_type: table
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_summary
    use: ribowaltz/library_summary
    row_selection_enabled: true
    row_selection_column: sample
    section: Library detail
    tag: rb-rq-table-summary
    index: rq-table-summary
    title: Ribo-seq library quality
    description: >-
      What are the quality readouts of each Ribo-seq library? One row per library: P-sites assigned, the frame-0 share of the CDS P-sites and its margin over the other frames, the P-site share per region, the CDS enrichment, and the modal footprint length with its spread.

      How to read: a frame-0 share near a third means no periodicity, and a negative margin means another frame dominates, which usually points at wrong P-site offsets. A CDS enrichment of 1 means the library follows the length expectation. Pick a row to open its record beside the table.

      Note: a third and an enrichment of 1 are what no signal gives, not quality cut-offs; no threshold is applied in this table.
    layout: {x: 0, y: 5, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_summary
    use: ribowaltz/library_record
    config:
      id_col: sample
      selection_source: any
      linked_component: rb-rq-table-summary
      sections:
        Library: [sample, psites]
        Periodicity: [frame0_cds_pct, frame_bias]
        Regions: [cds_pct, utr5_pct, utr3_pct, cds_enrichment]
        Footprints: [modal_length, length_iqr]
    section: Library detail
    tag: rb-rq-record
    index: rq-record
    title: Library record
    description: >-
      What are the readouts of one library? A fact panel for the library picked in the table or on the phasing bars: its P-sites, periodicity, region shares and footprint length.

      How to read: set the frame-0 share against a third (no periodicity) and the CDS enrichment against 1 (no enrichment). Use it to confirm which library a weak bar or profile belongs to. No cut-off is applied here.
    layout: {x: 5, y: 5, w: 3, h: 6}
  - component_type: table
    workflow_tag: riboseq
    data_collection_tag: ribowaltz_psite_region
    use: ribowaltz/psite_region
    row_selection_enabled: true
    row_selection_column: sample
    section: Library detail
    tag: rb-rq-table-regions
    index: rq-table-regions
    title: P-site regions against the length expectation
    description: >-
      Are the P-sites enriched in the CDS beyond what its length gives? One row per library and region: the observed P-site share, the share the region would get from its length alone over the same transcripts, and their ratio.

      How to read: enrichment above 1 in the CDS is what protected footprints look like. An enrichment near 1 means the library follows the length expectation, as fragmented RNA does, and values below 1 in the UTRs are the other side of a CDS enrichment.

      Note: an enrichment of 1 is the no-enrichment reference by construction, not a quality cut-off. The expectation is the length share riboWaltz reports for the transcripts.
    layout: {x: 0, y: 11, w: 8, h: 6}
- title: Sample space
  subtitle: Do the libraries separate by assay first, then by design?
  tab_group: Data & QC
  tab_order: 3
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Expression filters
    icon: mdi:filter-variant
    color: cyan
    description: Narrows the libraries to a gene-expression band
  grid_sections:
  - name: Libraries at a glance
    icon: mdi:counter
    color: cyan
    description: How many libraries were placed, and how many genes each expresses
  - name: Sample space
    icon: mdi:chart-scatter-plot
    color: cyan
    description: The libraries on the leading principal components of their Salmon TPMs
  - name: Library rows
    icon: mdi:table
    color: gray
    description: Each library's PCA coordinates and expression summary, and its record
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [Salmon](https://salmon.readthedocs.io) quantifies both assays on the same
      transcriptome, and the PCA places each library on its log2 TPMs. The first component
      usually splits RNA-seq from Ribo-seq; read the next ones, or colour by a design column,
      for the groups within each assay.
    tag: rb-sp-intro
    index: sp-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: riboseq
    data_collection_tag: sample_pca
    interactive_component_type: RangeSlider
    column_name: genes_expressed
    column_type: int64
    display:
      icon_name: mdi:dna
      custom_color: cyan
    section: Expression filters
    tag: rb-sp-filter-expressed
    index: sp-expressed-filter
    title: Genes expressed
    layout: {x: 0, y: 0, w: 1, h: 3}
  # A plain count: the sheet's leading factor splits the libraries evenly by
  # design (as many footprint as mRNA libraries), so a ring would say nothing.
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: sample_pca
    use: salmon/sample_pca
    aggregation: count
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:flask-outline
      icon_color: cyan.4
      caption: one point each on the PCA
    section: Libraries at a glance
    tag: rb-sp-card-libraries
    index: sp-card-libraries
    title: Libraries placed
    description: Libraries on the PCA, both assays together.
    layout: {x: 0, y: 0, w: 2, h: 2}
  # Every gene of the merged matrix carries a symbol, so a completeness bar
  # read 100%: the detected genes per library say more.
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: sample_pca
    use: salmon/sample_pca
    aggregation: median
    column_name: genes_detected
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:dna
      icon_color: cyan.6
      caption: median per library, its distribution
      decimals: 0
    section: Libraries at a glance
    tag: rb-sp-card-genes
    index: sp-card-genes
    title: Genes detected
    description: Genes with a TPM above zero in a library, the median over the libraries in view.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: sample_pca
    use: salmon/sample_pca
    aggregation: median
    column_name: genes_expressed
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: cyan.8
      caption: median per library, with its spread
      decimals: 0
    section: Libraries at a glance
    tag: rb-sp-card-expressed
    index: sp-card-expressed
    title: Genes expressed
    description: Genes at 1 TPM or more in a library, the median over the libraries in view.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: sample_pca
    use: salmon/sample_pca
    aggregation: median
    column_name: median_tpm
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:sigma
      icon_color: cyan.9
      caption: median per library, with its spread
      decimals: 2
    section: Libraries at a glance
    tag: rb-sp-card-tpm
    index: sp-card-tpm
    title: Median TPM
    description: Median TPM over the genes each library detects, the median over the libraries in view.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: riboseq
    data_collection_tag: sample_pca
    use: salmon/pca
    config:
      # The design group (GROUP_COL), a column the sample_pca recipe adds; the
      # catalog's `group` (the assay on a riboseq sheet) stays a Colour-by option.
      color_col: '{GROUP_COL}'
      point_size: 12
      # No centroid marks: a group's centroid label covers its replicates.
      show_centroids: false
      axis_prefix: PC
      selection_enabled: true
      selection_column: sample_id
      legend_pos: right
    section: Sample space
    tag: rb-sp-pca
    index: sp-pca
    title: Library PCA on Salmon TPMs
    description: >-
      Do the libraries separate by assay first, then by design? Each point is one library, placed on the leading principal components of its log2(TPM + 1) Salmon expression over the 500 most variable genes, and coloured by the design group ({GROUP_COL_DISPLAY}).

      How to read: the first component usually splits the two assays, so read the design on the next ones. Replicates of one group should sit together, and a library far from its group is the one to open in its record. Colour by the assay or any other sheet column from the controls, and lasso points to filter the linked panels.

      Note: no group centroid or cut-off is drawn. With few libraries a component rests on a handful of points, so read the grouping and not the distances.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: riboseq
    data_collection_tag: sample_pca
    use: salmon/sample_pca
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Library rows
    tag: rb-sp-table
    index: sp-table
    title: Library PCA and expression summary
    description: >-
      What does each library express? One row per library with its coordinates on the principal components, the number of genes it detects and expresses, its median TPM and the sheet columns.

      How to read: a library that detects or expresses far fewer genes than its peers of the same assay is the one to check first. Genes expressed counts the genes at 1 TPM or more, a definition of the column and not a quality threshold. Pick a row to open its record.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: riboseq
    data_collection_tag: sample_pca
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: sample_id
      selection_source: any
      linked_component: rb-sp-table
      sections:
        Library: [sample_id, '{GROUP_COL}', group]
        Expression: [genes_detected, genes_expressed, median_tpm]
        Position: [dim_1, dim_2, dim_3]
    section: Library rows
    tag: rb-sp-record
    index: sp-record
    title: Library record
    description: >-
      Which library is this, and how does it express? A fact panel for the library picked in the table or lassoed on the PCA: its group, its genes detected and expressed, its median TPM and its position on the first three components.

      How to read: compare its gene counts with the table rows of the same assay before calling it an outlier. No cut-off is applied here.
    layout: {x: 5, y: 0, w: 3, h: 6}
# Pooled over the run, so it needs no contrast; it reads the in-frame P-site
# counts and the sample sheet, and goes with them.
- title: Translational efficiency
  subtitle: Which genes carry more ribosomes than their mRNA level predicts?
  tab_group: Translation
  tab_order: 4
  tab_icon: mdi:chart-line
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Efficiency filters
    icon: mdi:filter-variant
    color: teal
    description: Narrows the genes to an efficiency band, or to named genes
  grid_sections:
  - name: Efficiency at a glance
    icon: mdi:counter
    color: teal
    description: How the genes spread on translational efficiency and on each assay
  - name: Efficiency plane
    icon: mdi:chart-scatter-plot
    color: teal
    description: Ribo-seq against RNA-seq abundance, one point per gene
  - name: Gene detail
    icon: mdi:table
    color: gray
    description: Every gene's abundance in each assay, and the record of the one picked
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      Translational efficiency is a gene's Ribo-seq abundance over its RNA-seq abundance, in
      counts per million pooled over every library of the run. Genes above the diagonal carry
      more ribosomes than their mRNA level predicts; the test between conditions is on
      [Translational regulation](tab:Translational regulation).
    tag: rb-te-intro
    index: te-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: riboseq
    data_collection_tag: translational_efficiency
    interactive_component_type: RangeSlider
    column_name: log2_te
    column_type: float64
    display:
      icon_name: mdi:scale-balance
      custom_color: teal
    section: Efficiency filters
    group: Genes
    tag: rb-te-filter-te
    index: te-te-filter
    title: Translational efficiency (log2)
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: riboseq
    data_collection_tag: translational_efficiency
    interactive_component_type: MultiSelect
    column_name: gene_name
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: cyan
    section: Efficiency filters
    group: Genes
    tag: rb-te-filter-gene
    index: te-gene-filter
    title: Gene
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: translational_efficiency
    # One row per gene, so a count of ribo_libraries counts the genes; the bars
    # spread them by how many Ribo-seq libraries see them (every gene has a
    # symbol, so a completeness bar read 100%).
    aggregation: count
    column_name: ribo_libraries
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:dna
      icon_color: teal.4
      caption: by the Ribo-seq libraries that see them
    section: Efficiency at a glance
    tag: rb-te-card-genes
    index: te-card-genes
    title: Genes
    description: Genes both assays reach on average, the ones the efficiency is computed for. A gene few Ribo-seq libraries see has a noisy efficiency.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: translational_efficiency
    aggregation: median
    column_name: log2_te
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:scale-balance
      icon_color: teal.6
      caption: median over genes, with its spread
      decimals: 2
    section: Efficiency at a glance
    tag: rb-te-card-te
    index: te-card-te
    title: Efficiency (log2)
    description: Median log2 of Ribo-seq CPM over RNA-seq CPM; 0 is a gene translated in line with its mRNA.
    layout: {x: 2, y: 0, w: 2, h: 2}
  # Genes past a fold in either direction: how many carry more, and how many
  # fewer, ribosomes than their mRNA level predicts. The bars spread them by
  # their own efficiency.
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: translational_efficiency
    aggregation: count
    column_name: log2_te
    column_type: float64
    filter_expr: col('log2_te') >= 1
    secondary_layout: histogram
    display:
      icon_name: mdi:trending-up
      icon_color: teal.8
      caption: efficiency of those genes, log2
      decimals: 0
    section: Efficiency at a glance
    tag: rb-te-card-high
    index: te-card-high
    title: Efficiency of 2 or more
    description: Genes with at least twice as many footprints as their mRNA level predicts (log2 efficiency of 1 or more).
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: translational_efficiency
    aggregation: count
    column_name: log2_te
    column_type: float64
    filter_expr: col('log2_te') <= -1
    secondary_layout: histogram
    display:
      icon_name: mdi:trending-down
      icon_color: teal.9
      caption: efficiency of those genes, log2
      decimals: 0
    section: Efficiency at a glance
    tag: rb-te-card-low
    index: te-card-low
    title: Efficiency of 0.5 or less
    description: Genes with at most half the footprints their mRNA level predicts (log2 efficiency of -1 or less).
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: riboseq
    data_collection_tag: translational_efficiency
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: log2_rna_cpm
      y_col: log2_ribo_cpm
      label_col: gene_name
      color_col: log2_te
      color_scale: RdBu
      x_title: RNA-seq log2(CPM + 1)
      y_title: Ribo-seq log2(CPM + 1)
      reference_line: diagonal
      marker_size: 4
      opacity: 0.6
      marker_outline: false
      # No labels: the top-N are the most abundant genes, piled at the top of
      # the diagonal, not the efficient ones. Hover names a gene.
      top_n_labels: 0
      density_threshold: 40000
      selection_enabled: true
      selection_column: gene_id
      legend_pos: bottom
    section: Efficiency plane
    tag: rb-te-plane
    index: te-plane
    title: Ribo-seq against RNA-seq abundance
    description: >-
      Which genes carry more ribosomes than their mRNA level predicts? Each point is one gene, placed by its mean RNA-seq abundance (x) and its mean Ribo-seq abundance (y), both as log2(CPM + 1), and coloured by its log2 efficiency, the log2 of (Ribo-seq CPM + 1) over (RNA-seq CPM + 1).

      How to read: genes on the diagonal are translated in line with their mRNA level, genes above it carry more footprints than that level predicts, and genes below it fewer. Efficiency is only trustworthy for genes both assays see well, because a gene with few reads in either assay has a noisy ratio. Pick a point to open its record in Gene detail, and narrow the efficiency band from the left panel.

      Lines and annotations: the dashed diagonal, labelled x = y, is equal abundance in both assays, a log2 efficiency of 0. It is the identity line by construction, not a cut-off, and no line marks a high or low efficiency.

      Note: genes under 1 mean CPM in both assays are left out. The +1 added to the CPM compresses the ratio of low-abundance genes toward 0.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: riboseq
    data_collection_tag: translational_efficiency
    row_selection_enabled: true
    row_selection_column: gene_id
    section: Gene detail
    tag: rb-te-table
    index: te-table
    title: Translational efficiency per gene
    description: >-
      What is the efficiency of each gene? One row per gene: its mean CPM in each assay, the log2 ratio of the two and the number of libraries of each assay that detect it.

      How to read: sort on the log2 efficiency to find the extremes, then check the library counts, since a gene few Ribo-seq libraries detect has a noisy efficiency. Pick a row to open its record beside the table. Only genes with at least 1 mean CPM in one assay are listed, a filter of the table and not a quality cut-off.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: riboseq
    data_collection_tag: translational_efficiency
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: gene_id
      title_col: gene_name
      selection_source: any
      linked_component: rb-te-table
      sections:
        Gene: [gene_name, gene_id]
        Efficiency: [log2_te]
        RNA-seq: [rna_cpm, log2_rna_cpm, rna_libraries]
        Ribo-seq: [ribo_cpm, log2_ribo_cpm, ribo_libraries]
      link_templates:
        gene_id: "https://www.ensembl.org/id/{value}"
    section: Gene detail
    tag: rb-te-record
    index: te-record
    title: Gene record
    description: >-
      How abundant is this gene in each assay, and how efficient? A fact panel for the gene picked in the table or on the plane: its mean CPM and log2 CPM in each assay, the libraries detecting it and its log2 efficiency, with a link to its Ensembl page.

      How to read: a log2 efficiency of 0 is a gene translated in line with its mRNA level. Read the library counts beside it to judge how firm the ratio is. No cut-off is applied here.
    layout: {x: 5, y: 0, w: 3, h: 6}
# A run without --contrasts writes no anota2seq tables; the tab goes with them.
- title: Translational regulation
  subtitle: Which genes change translation between conditions, and through which mode?
  tab_group: Translation
  tab_order: 5
  tab_icon: mdi:scale-balance
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Regulation filters
    icon: mdi:filter-variant
    color: indigo
    description: Pick a contrast first, then narrow the modes, the genes or the analysis
  grid_sections:
  - name: Regulation at a glance
    icon: mdi:counter
    color: indigo
    description: Regulated calls by mode and direction, how strong the translation effect is, and the p-values behind it
  - name: Fold-change plane
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Total mRNA change against ribosome-bound mRNA change, one point per gene
  - name: Significance
    icon: mdi:chart-scatter-plot
    color: indigo
    description: The translation analysis beside any one of the four anota2seq analyses
  - name: Gene detail
    icon: mdi:table
    color: gray
    description: Each gene's regulatory mode, and its record across the four analyses
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [anota2seq](https://bioconductor.org/packages/anota2seq) compares ribosome-bound with
      total mRNA between two conditions and sorts each gene into translation, buffering or
      mRNA abundance. Pick a contrast on the left first: every number on this tab depends on
      it.
    tag: rb-tr-intro
    index: tr-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: riboseq
    data_collection_tag: anota2seq_regulation
    interactive_component_type: MultiSelect
    column_name: contrast
    column_type: object
    display:
      icon_name: mdi:compare-horizontal
      custom_color: indigo
    section: Regulation filters
    group: Regulation
    tag: rb-tr-filter-contrast
    index: tr-contrast-filter
    title: Contrast
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: riboseq
    data_collection_tag: anota2seq_regulation
    use: anota2seq/regulation
    interactive_component_type: MultiSelect
    column_name: regulation_mode
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: grape
    section: Regulation filters
    group: Regulation
    tag: rb-tr-filter-mode
    index: tr-mode-filter
    title: Regulatory mode
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: riboseq
    data_collection_tag: anota2seq_regulation
    interactive_component_type: MultiSelect
    column_name: gene_name
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: cyan
    section: Regulation filters
    group: Regulation
    tag: rb-tr-filter-gene
    index: tr-gene-filter
    title: Gene
    layout: {x: 0, y: 5, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: riboseq
    data_collection_tag: anota2seq_results
    use: anota2seq/results
    interactive_component_type: Select
    column_name: analysis
    column_type: object
    display:
      icon_name: mdi:chart-scatter-plot
      custom_color: blue
    section: Regulation filters
    group: Analysis
    tag: rb-tr-filter-analysis
    index: tr-analysis-filter
    title: anota2seq analysis
    layout: {x: 0, y: 8, w: 1, h: 2}
  # Calls are rows (one per contrast and gene), so a count over them splits
  # into modes and directions as parts of a whole.
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: anota2seq_regulation
    use: anota2seq/regulation
    aggregation: count
    column_name: gene_id
    column_type: object
    filter_expr: col('regulation_mode') != 'not regulated'
    secondary_layout: donut
    breakdown_col: regulation_mode
    display:
      icon_name: mdi:chart-donut
      icon_color: indigo.4
      caption: calls, by mode
    section: Regulation at a glance
    tag: rb-tr-card-regulated
    index: tr-card-regulated
    title: Regulated
    description: Genes called regulated, one per contrast, split into translation, buffering and mRNA abundance.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: anota2seq_regulation
    use: anota2seq/regulation
    aggregation: count
    column_name: gene_id
    column_type: object
    filter_expr: col('regulation_mode') == 'translation'
    secondary_layout: composition
    breakdown_col: direction
    display:
      icon_name: mdi:trending-up
      icon_color: indigo.6
      caption: calls, up and down
    section: Regulation at a glance
    tag: rb-tr-card-translation
    index: tr-card-translation
    title: Translation
    description: Genes whose ribosome loading changes beyond their mRNA change, by direction of the effect.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: anota2seq_regulation
    use: anota2seq/regulation
    aggregation: median
    column_name: translation_effect
    column_type: float64
    filter_expr: col('regulation_mode') == 'translation'
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: indigo.8
      caption: median over translation genes, with its spread
      decimals: 2
    section: Regulation at a glance
    tag: rb-tr-card-effect
    index: tr-card-effect
    title: Translation effect (log2)
    description: Change in ribosome-bound mRNA not explained by total mRNA, over the genes called translation-regulated. Over every gene it would sit at 0; its sign here says which direction dominates.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # One row per contrast and gene. The bars spread the raw p-values of the
  # translation analysis: a spike near 0 is signal, a flat histogram is none.
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: anota2seq_regulation
    use: anota2seq/regulation
    aggregation: count
    column_name: translation_pvalue
    column_type: float64
    filter_expr: col('translation_pvalue').is_not_null()
    secondary_layout: histogram
    display:
      icon_name: mdi:check-decagram
      icon_color: indigo.9
      caption: raw p-values; a spike near 0 is signal
    section: Regulation at a glance
    tag: rb-tr-card-padj
    index: tr-card-padj
    title: Genes tested
    description: Genes anota2seq tested for a translation effect, one per contrast. The bars spread their raw p-values.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: riboseq
    data_collection_tag: anota2seq_regulation
    use: anota2seq/fold_change_plane
    config:
      x_title: Total mRNA change (log2)
      y_title: Ribosome-bound mRNA change (log2)
      reference_line: diagonal
      marker_size: 5
      opacity: 0.7
      marker_outline: false
      # Five: the Overview highlight draws this tile at a third of the width.
      top_n_labels: 5
      density_threshold: 40000
      selection_enabled: true
      selection_column: gene_id
      legend_pos: bottom
    section: Fold-change plane
    tag: rb-tr-plane
    index: tr-fold-change-plane
    title: Ribosome-bound against total mRNA change
    description: >-
      Through which mode does each gene change between the conditions? Each point is one gene of the picked contrast, placed by its change in total mRNA (x) and in ribosome-bound mRNA (y), both as log2, and coloured by its regulatory mode: translation, buffering, mRNA abundance or not regulated.

      How to read: genes that ride the diagonal change in ribosome-bound mRNA just as much as in total mRNA, so the mRNA level drives the change. Translation-regulated genes leave the diagonal, and buffered genes lie flat along x, with total mRNA changing and the ribosome-bound fraction not following. Pick a point to open its record in Gene detail; five genes carry a label.

      Lines and annotations: the dashed diagonal, labelled x = y, is an equal change in the two. The mode colours follow anota2seq's own selection. Every analysis needs an adjusted p-value below 0.15 (maxPAdj). Translation and buffering also need an absolute effect of at least a 1.2-fold change (0.263 in log2; deltaPT and deltaTP) and an APV slope between -1 and 2 for translation and between -2 and 1 for buffering. Total and ribosome-bound mRNA need no minimum effect (deltaT and deltaP default to NULL). A gene is mRNA abundance when total and ribosome-bound mRNA both pass and move the same way. A gene that fits several modes takes one in anota2seq's order: translation, then mRNA abundance, then buffering.

      Source: anota2seq, Oertlin et al. 2019, https://doi.org/10.1093/nar/gkz223; thresholds of anota2seqRun, https://rdrr.io/github/ChrOertlin/anota2seq/man/anota2seqRun.html; mode priority of anota2seqRegModes, https://github.com/ChrOertlin/anota2seq/blob/master/R/anota2seqRegModes.R; nf-core/riboseq 2.0.0 sets no effect cut on total or ribosome-bound mRNA (rna_lfc_threshold and ribo_lfc_threshold default to 0), https://github.com/nf-core/riboseq/blob/2.0.0/nextflow_schema.json
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: riboseq
    data_collection_tag: anota2seq_regulation
    use: anota2seq/translation_volcano
    config:
      label_col: gene_name
      significance_threshold: 0.15
      effect_threshold: 0.263
      effect_label: Translation effect (log2)
      significance_label: -log10 adjusted p
      # The adjusted p plateaus, so the top-ranked genes share one height and
      # their labels pile: hover names a gene.
      top_n_labels: 15
      show_labels: false
      p_value_col: translation_pvalue
      view: volcano
      views: [volcano, qq]
    section: Significance
    tag: rb-tr-volcano
    index: tr-translation-volcano
    title: Translation effect against significance
    description: >-
      Which genes change in translation beyond their mRNA level, and how firmly? Each point is one gene of the picked contrast in the anota2seq translation analysis: the translation effect in log2 (x), meaning the change in ribosome-bound mRNA that total mRNA does not explain, against -log10 of the adjusted p-value (y). Genes that pass both cut-offs are drawn larger, and hovering names a gene.

      How to read: genes in the upper left and upper right corners, beyond the vertical lines and above the horizontal one, are the translation-regulated candidates, to the left for a lower and to the right for a higher ribosome loading. Open them in the table of Gene detail to see the other three analyses. The View switch draws the QQ plot of the raw p-values.

      Lines and annotations: the two dotted vertical lines sit at an effect of -0.263 and +0.263 in log2, a 1.2-fold change, and the dotted horizontal line at an adjusted p-value of 0.15 (-log10 of 0.15 on the y axis). In the QQ view the dashed diagonal is observed equal to expected, the shaded band is the 95% range expected under the null, and the label gives the inflation factor lambda of the p-values.

      Source: anota2seqRun documentation, defaults maxPAdj 0.15 and a log2(1.2) minimum for the translation analysis, https://rdrr.io/github/ChrOertlin/anota2seq/man/anota2seqRun.html. Method: Oertlin et al. 2019, https://doi.org/10.1093/nar/gkz223

      Note: the adjusted p-value plateaus, so the strongest genes share one height. The QQ band and lambda are display aids, not cut-offs.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: riboseq
    data_collection_tag: anota2seq_results
    use: anota2seq/analysis_volcano
    config:
      label_col: gene_name
      significance_threshold: 0.15
      # anota2seqRun sets no effect cut on total and ribosome-bound mRNA
      # (deltaT, deltaP NULL) and log2(1.2) on translation and buffering
      # (deltaPT, deltaTP). One value cannot serve the four analyses, so the
      # tile starts at 0 and the viewer sets 0.263 for those two.
      effect_threshold: 0
      effect_label: Effect (log2)
      significance_label: -log10 adjusted p
      top_n_labels: 10
      show_labels: true
      p_value_col: pvalue
      view: volcano
      views: [volcano, qq]
    section: Significance
    tag: rb-tr-analysis-volcano
    index: tr-analysis-volcano
    title: Each anota2seq analysis
    description: >-
      Which genes pass in each anota2seq analysis? The same volcano for one analysis at a time, picked with the analysis filter: total mRNA, ribosome-bound mRNA, translation or buffering. Each point is one gene, its effect in log2 (x) against -log10 of the adjusted p-value (y), coloured up, down or not significant, and ten genes carry a label.

      How to read: genes above the horizontal line pass the adjusted p-value of that analysis, and for translation and buffering they must also lie beyond the effect cut (see the note). A gene that passes for ribosome-bound mRNA and also for total mRNA, in the same direction, follows its mRNA level; one that passes only for translation or buffering is changed at the translation step. The View switch draws the QQ plot of the raw p-values.

      Lines and annotations: the dotted horizontal line sits at an adjusted p-value of 0.15 (maxPAdj). The two dotted vertical lines start at an effect of 0, on the centre line, because anota2seq sets no minimum effect for total and ribosome-bound mRNA; for translation and buffering its minimum is a 1.2-fold change, 0.263 in log2, which the effect cut control of this tile sets. In the QQ view the dashed diagonal is observed equal to expected, the shaded band is the 95% range expected under the null, and the label gives the inflation factor lambda.

      Source: anota2seqRun documentation, defaults maxPAdj 0.15, deltaPT and deltaTP log2(1.2) for the translation and buffering analyses, deltaP and deltaT NULL (no minimum) for ribosome-bound and total mRNA, https://rdrr.io/github/ChrOertlin/anota2seq/man/anota2seqRun.html. The nf-core/riboseq 2.0.0 parameters rna_lfc_threshold and ribo_lfc_threshold default to 0 ("Set to 0 to disable"), https://github.com/nf-core/riboseq/blob/2.0.0/nextflow_schema.json

      Note: the points are coloured from this tile's two cut controls (adjusted p-value and effect), not from the recipe's significant column. At the start value of 0, a gene in total or ribosome-bound mRNA is coloured when its adjusted p-value is below 0.15, which is anota2seq's own selection for those two analyses. For translation or buffering, set the effect cut to 0.263 to match anota2seq's selection.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: table
    workflow_tag: riboseq
    data_collection_tag: anota2seq_regulation
    use: anota2seq/regulation
    row_selection_enabled: true
    row_selection_column: gene_id
    section: Gene detail
    tag: rb-tr-table
    index: tr-table
    title: Regulatory mode per gene
    description: >-
      Which mode was assigned to each gene? One row per contrast and gene, with the change and adjusted p-value of the four anota2seq analyses and the regulatory mode that results.

      How to read: filter the regulatory mode and the contrast, then sort on the adjusted p-value of the translation analysis to list the strongest candidates. Pick a row to open its record beside the table. The mode follows anota2seq's own selection, the one described under the plane above: an adjusted p-value below 0.15 for every analysis, a 1.2-fold minimum effect and the slope windows for translation and buffering only, and the order translation, mRNA abundance, buffering.

      Source: anota2seqRun documentation, https://rdrr.io/github/ChrOertlin/anota2seq/man/anota2seqRun.html; mode priority of anota2seqRegModes, https://github.com/ChrOertlin/anota2seq/blob/master/R/anota2seqRegModes.R
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: riboseq
    data_collection_tag: anota2seq_regulation
    use: anota2seq/gene_record
    config:
      id_col: gene_id
      title_col: gene_name
      selection_source: any
      linked_component: rb-tr-table
      sections:
        Gene: [gene_name, gene_id, contrast, regulation_mode, direction]
        Total mRNA: [total_mrna_lfc, total_mrna_padj]
        Ribosome-bound mRNA: [translated_mrna_lfc, translated_mrna_padj]
        Translation: [translation_effect, translation_padj]
        Buffering: [buffering_effect, buffering_padj]
      link_templates:
        gene_id: "https://www.ensembl.org/id/{value}"
    section: Gene detail
    tag: rb-tr-record
    index: tr-record
    title: Gene record
    description: >-
      How does this gene behave in each anota2seq analysis? A fact panel for the gene picked in the table or on the fold-change plane: its contrast, regulatory mode and direction, then the effect and adjusted p-value of total mRNA, ribosome-bound mRNA, translation and buffering, with a link to its Ensembl page.

      How to read: a translation call rests on the translation analysis passing, and the three other analyses show what else moves for the same gene. No cut-off is drawn here; the thresholds are those of the tiles above.
    layout: {x: 5, y: 0, w: 3, h: 6}
# --skip_ribotish and --skip_ribocode each drop one caller; the pooled ORF
# table survives either, so the tab goes only when both are skipped.
- title: ORF discovery
  subtitle: Which ORFs are translated, and do Ribo-TISH and RiboCode agree?
  tab_group: ORFs
  tab_order: 6
  tab_icon: mdi:set-merge
  tab_icon_color: pink
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: ORF filters
    icon: mdi:filter-variant
    color: pink
    description: Narrows the ORFs by class, gene and protein length
  grid_sections:
  - name: ORFs at a glance
    icon: mdi:counter
    color: pink
    description: How many ORFs each caller reported, of which class and length
  - name: Caller agreement
    icon: mdi:set-merge
    color: pink
    description: Which ORFs one caller, both, or the annotation support
  - name: ORF classes per library
    icon: mdi:chart-bar
    color: gray
    description: The share of each ORF class per library, for each caller
    collapsed: true
  - name: Calls per library
    icon: mdi:table
    color: gray
    description: Each caller's calls, one row per library and ORF
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [Ribo-TISH](https://github.com/zhpn1024/ribotish) and
      [RiboCode](https://github.com/xryanglab/RiboCode) call translated ORFs from different
      signals, compared here on their stop codon. ORFs outside the annotated CDS that both
      callers report are the best supported new candidates. The [Locus](tab:Locus) tab lists
      them and shows the footprints of the one you pick on the genome.
    tag: rb-orf-intro
    index: orf-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: riboseq
    data_collection_tag: orf_overlap
    interactive_component_type: MultiSelect
    column_name: orf_class
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: pink
    section: ORF filters
    group: ORFs
    tag: rb-orf-filter-class
    index: orf-class-filter
    title: ORF class
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: riboseq
    data_collection_tag: orf_overlap
    interactive_component_type: MultiSelect
    column_name: gene_name
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: cyan
    section: ORF filters
    group: ORFs
    tag: rb-orf-filter-gene
    index: orf-gene-filter
    title: Gene
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: riboseq
    data_collection_tag: orf_overlap
    interactive_component_type: RangeSlider
    column_name: aa_length
    column_type: int64
    display:
      icon_name: mdi:ruler
      custom_color: indigo
    section: ORF filters
    group: ORFs
    tag: rb-orf-filter-length
    index: orf-length-filter
    title: Protein length (aa)
    layout: {x: 0, y: 6, w: 1, h: 3}
  # One row per ORF, so a count splits into the classes as parts of a whole.
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: orf_overlap
    aggregation: count
    column_name: orf_id
    column_type: object
    secondary_layout: donut
    breakdown_col: orf_class
    display:
      icon_name: mdi:set-merge
      icon_color: pink.4
      caption: pooled over libraries, by class
    section: ORFs at a glance
    tag: rb-orf-card-pooled
    index: orf-card-pooled
    title: ORFs
    description: ORFs either caller reported in at least one library, split by class.
    layout: {x: 0, y: 0, w: 2, h: 2}
  # The caller cards read the pooled table, which survives --skip_ribotish and
  # --skip_ribocode, so the strip keeps four cards (a skipped caller reads 0).
  # One row per ORF: a count of the caller's library column counts its ORFs,
  # and the bars spread them by how many libraries report each one.
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: orf_overlap
    aggregation: count
    column_name: ribotish_libraries
    column_type: int64
    filter_expr: col('ribotish') == 1
    secondary_layout: histogram
    display:
      icon_name: mdi:magnify-scan
      icon_color: pink.6
      caption: ORFs, by the libraries reporting them
    section: ORFs at a glance
    tag: rb-orf-card-ribotish
    index: orf-card-ribotish
    title: Ribo-TISH
    description: ORFs Ribo-TISH reported in at least one library, pooled over the run; 0 when the run skipped it.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: orf_overlap
    aggregation: count
    column_name: ribocode_libraries
    column_type: int64
    filter_expr: col('ribocode') == 1
    secondary_layout: histogram
    display:
      icon_name: mdi:sine-wave
      icon_color: pink.8
      caption: ORFs, by the libraries reporting them
    section: ORFs at a glance
    tag: rb-orf-card-ribocode
    index: orf-card-ribocode
    title: RiboCode
    description: ORFs RiboCode reported in at least one library, pooled over the run; 0 when the run skipped it.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: riboseq
    data_collection_tag: orf_overlap
    aggregation: median
    column_name: aa_length
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: pink.9
      caption: median, with its spread
      decimals: 0
    section: ORFs at a glance
    tag: rb-orf-card-length
    index: orf-card-length
    title: Protein length (aa)
    description: Median length of the pooled ORFs, the longest either caller reported.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: riboseq
    data_collection_tag: orf_calls
    viz_kind: stacked_taxonomy
    config:
      viz_kind: stacked_taxonomy
      sample_id_col: sample
      taxon_col: orf_class
      rank_col: caller
      abundance_col: pct
      # No default_rank: a pinned caller the run skipped would draw an empty
      # chart. Unset, the tile opens on the first caller the table lists
      # (Ribo-TISH, or RiboCode alone under --skip_ribotish).
      normalise_to_one: true
      sort_by: abundance
      sample_sort: input
      top_n: 8
    section: ORF classes per library
    tag: rb-orf-classes
    index: orf-classes
    title: ORF classes per library
    description: >-
      What kinds of ORFs does each library hold? Each bar is one library, split into the share of its ORFs per class: annotated CDS, N-terminal variant, upstream ORF, downstream ORF, internal ORF and novel ORF. The tile opens on the first caller the table lists, Ribo-TISH when the run has it, and the level switch changes the caller.

      How to read: the annotated CDS dominates, so compare the other classes between libraries and between callers. A library with a very different mix from its peers, or a class one caller reports and the other never does, is worth a look in the ORF tables below. Open a new ORF in [Locus](tab:Locus) to see the footprints over it.

      Note: the classes are the template's harmonisation of each caller's own types, for example Extended and Truncated starts of Ribo-TISH both read N-terminal variant. No cut-off is drawn.

      Sources: Ribo-TISH, Zhang et al. 2017, https://doi.org/10.1038/s41467-017-01981-8; RiboCode, Xiao et al. 2018, https://doi.org/10.1093/nar/gky179
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: figure
    workflow_tag: riboseq
    data_collection_tag: orf_overlap
    visu_type: bar
    mode: code
    code_content: |-
      # ORFs by which caller reports them (both, or one), split by whether they are the annotated CDS; the note at the end of a bar is its share of new ORFs. Three bars replace the UpSet of the same three sets.
      d = df.with_columns(pl.when((pl.col('ribotish') == 1) & (pl.col('ribocode') == 1)).then(pl.lit('Both callers')).when(pl.col('ribotish') == 1).then(pl.lit('Ribo-TISH only')).otherwise(pl.lit('RiboCode only')).alias('support'), pl.when(pl.col('annotated_cds') == 1).then(pl.lit('Annotated CDS')).otherwise(pl.lit('Outside the annotated CDS')).alias('status'))
      g = d.group_by('support', 'status').len().rename({'len': 'orfs'})
      tot = g.group_by('support').agg(pl.col('orfs').sum().alias('total'))
      order = [s for s in ['Both callers', 'Ribo-TISH only', 'RiboCode only'] if s in tot['support'].to_list()]
      colors = depictio_category_colors.get('orf_annotation') or {}
      fig = go.Figure(layout=go.Layout(barmode='stack', bargap=0.35, margin=dict(t=10, r=10), xaxis=dict(title='ORFs', range=[0, float(tot['total'].max()) * 1.18]), yaxis=dict(autorange='reversed', categoryorder='array', categoryarray=order, automargin=True), legend=dict(orientation='h', y=-0.25, title_text='', traceorder='normal')))
      for st in ['Annotated CDS', 'Outside the annotated CDS']:
          s = g.filter(pl.col('status') == st)
          fig.add_bar(y=s['support'].to_list(), x=s['orfs'].to_list(), orientation='h', name=st, marker_color=colors.get(st), texttemplate='%{x:,}', textposition='inside', textangle=0, insidetextanchor='middle', hovertemplate='%{y}: %{x:,} ORFs<extra>' + st + '</extra>')
      new = g.filter(pl.col('status') != 'Annotated CDS')
      for sup, total in zip(tot['support'].to_list(), tot['total'].to_list()):
          n_new = int(new.filter(pl.col('support') == sup)['orfs'].sum())
          fig.add_annotation(x=total, y=sup, text='%d%% new' % round(100 * n_new / max(total, 1)), xanchor='left', yanchor='middle', xshift=6, showarrow=False)
    section: Caller agreement
    tag: rb-orf-upset
    index: orf-caller-upset
    title: ORFs per caller and annotation
    description: >-
      Do Ribo-TISH and RiboCode agree? One bar per support group, ORFs reported by both callers or by one only, counting ORFs pooled over the libraries and split into the annotated CDS and the rest, which are the new ORFs.

      How to read: an ORF both callers report is better supported than one only a single caller sees, since they detect translation from different signals. The note at the end of a bar is its share of new ORFs, and a high share on a single-caller bar is the least supported and the first to doubt. Open the new ORFs both callers report in [Locus](tab:Locus).

      Annotations: the percentage at the end of each bar is the share of that bar's ORFs outside the annotated CDS, and the number inside a segment is its ORF count. No cut-off or reference line is drawn.

      Note: the callers are matched on the ORF's stop codon, not its start, so two calls with different starts count as the same ORF. A run that skipped a caller shows only the bars the remaining caller can fill.

      Sources: Ribo-TISH, Zhang et al. 2017, https://doi.org/10.1038/s41467-017-01981-8; RiboCode, Xiao et al. 2018, https://doi.org/10.1093/nar/gky179
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    workflow_tag: riboseq
    data_collection_tag: ribotish_orfs
    use: ribotish/orfs
    row_selection_enabled: false
    section: Calls per library
    tag: rb-orf-table-ribotish
    index: orf-table-ribotish
    title: Ribo-TISH calls per library
    description: >-
      What did Ribo-TISH report in each library? One row per library and ORF, with the Ribo-TISH initiation type, the class shared with RiboCode, the protein length and the frame-test q-value.

      How to read: a lower frame-test q-value is stronger evidence of an in-frame ORF, and an ORF reported in several libraries is firmer than one seen once. The dashboard applies no q-value cut-off of its own, so the rows are what Ribo-TISH kept with its own settings.

      Source: Ribo-TISH, Zhang et al. 2017, https://doi.org/10.1038/s41467-017-01981-8
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: riboseq
    data_collection_tag: ribocode_orfs
    use: ribocode/orfs
    row_selection_enabled: false
    section: Calls per library
    tag: rb-orf-table-ribocode
    index: orf-table-ribocode
    title: RiboCode calls per library
    description: >-
      What did RiboCode report in each library? One row per library and ORF, with the RiboCode ORF type, the class shared with Ribo-TISH, the protein length, the frame-0 P-sites and the adjusted periodicity p-value.

      How to read: a lower adjusted p-value is stronger evidence of three-nucleotide periodicity along the ORF, and more frame-0 P-sites give the test more to work with. The dashboard applies no p-value cut-off of its own, so the rows are what RiboCode kept with its own settings.

      Source: RiboCode, Xiao et al. 2018, https://doi.org/10.1093/nar/gky179
    layout: {x: 0, y: 6, w: 8, h: 6}

