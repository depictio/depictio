version: 1
# nf-core/oncoanalyser 3.0.0 dashboard.
#
# Funnel: what the tumor is (purity, ploidy, mutational load, tissue of
# origin, signatures, HRD) -> whether the sequencing supports it -> the copy
# number landscape -> the driver catalog -> the somatic small variants -> their
# protein changes -> structural variants and fusions -> the immune context.
#
# oncoanalyser writes no MultiQC report parquet, so the first tab is an
# Overview built from PURPLE and the tumor-level tools. The pinned glance strip,
# the Sample filters and the Sample sheet section ride every tab; each tab adds
# its own open filter section. The protein tab binds the lollipop and the 3D
# structure to the same protein-change collection, so a residue picked in one
# is highlighted in the other.
main_dashboard:
  title: nf-core/oncoanalyser
  subtitle: Tumor purity and ploidy, copy number, drivers, somatic variants, structural variants and immune context from the WiGiTS toolkit
  project_tag: oncoanalyser Cancer Genomics
  main_tab_name: Overview
  tab_icon: mdi:view-dashboard-outline
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # Persistent: the sample filters ride every tab. They are sourced on the
  # samplesheet hub and the template's links fan the selection out to every
  # sample-level collection.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Samplesheet samples, analysis groups and sample classes, applied to every tab
    persistent: true
    pin: top
  - name: Tumor scope
    icon: mdi:tune
    color: blue
    description: Narrow the overview by fit status and tissue-of-origin classifier
  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: Samples, analysis groups, subjects and driver catalog entries in the current scope
    persistent: true
    pin: top
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The samplesheet every other tab is filtered by
    collapsed: true
    persistent: true
    pin: top
  - name: Tumor fit
    icon: mdi:chart-box-outline
    color: blue
    description: Purity, ploidy, mutational burden and microsatellite status per tumor
  - name: Tissue of origin
    icon: mdi:chart-bar
    color: blue
    description: CUPPA's cancer-type probabilities per classifier
  - name: Mutational processes
    icon: mdi:waves
    color: violet
    description: Mutational signatures and homologous recombination deficiency
  - name: Tumor detail
    icon: mdi:table
    color: gray
    description: One row per tumor with its full PURPLE fit; select a row to open its record
  - name: Tumor reference tables
    icon: mdi:table
    color: gray
    description: CUPPA probabilities and the CHORD prediction behind the tiles
    collapsed: true
  components:
  # ----------------------------------------------------------- glance strip
  - component_type: card
    tag: oa-glance-samples
    section: Run at a glance
    workflow_tag: oncoanalyser
    data_collection_tag: samples
    aggregation: nunique
    column_name: sample_id
    column_type: object
    secondary_layout: composition
    breakdown_col: "{GROUP_COL}"
    display: {icon_name: 'mdi:test-tube', title_font_size: xl, value_font_size: xl}
    title: Samples
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: oa-glance-groups
    section: Run at a glance
    workflow_tag: oncoanalyser
    data_collection_tag: samples
    aggregation: nunique
    column_name: group_id
    column_type: object
    secondary_layout: composition
    breakdown_col: sequence_type
    display: {icon_name: 'mdi:account-group-outline', title_font_size: xl, value_font_size: xl}
    title: Analysis groups
    title_size: sm
    title_align: left
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: oa-glance-subjects
    section: Run at a glance
    workflow_tag: oncoanalyser
    data_collection_tag: samples
    aggregation: nunique
    column_name: subject_id
    column_type: object
    secondary_layout: composition
    breakdown_col: sample_type
    display: {icon_name: 'mdi:account-multiple-outline', title_font_size: xl, value_font_size: xl}
    title: Subjects
    title_size: sm
    title_align: left
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: oa-glance-drivers
    section: Run at a glance
    workflow_tag: oncoanalyser
    data_collection_tag: purple_drivers
    use: purple/drivers
    aggregation: count
    column_name: driver_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: driver
    top_n_count: 3
    display: {icon_name: 'mdi:dna', title_font_size: xl, value_font_size: xl}
    title: Driver catalog entries
    title_size: sm
    title_align: left
    layout: {x: 6, y: 0, w: 2, h: 2}

  # ------------------------------------------------------------ sample sheet
  - component_type: text
    tag: oa-sheet-intro
    section: Sample sheet
    workflow_tag: oncoanalyser
    data_collection_tag: samples
    title: The samplesheet the run started from
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per sample, with the analysis group, subject, tumor or normal
      role and sequence type every other table joins on. The filters on the
      left select rows of this table.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: oa-sheet-table
    section: Sample sheet
    workflow_tag: oncoanalyser
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample_id
    title: Samplesheet
    description: Sample, analysis group, subject, role, sequence type and input files of every sample.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 4}

  # --------------------------------------------------------------- tumor fit
  - component_type: card
    tag: oa-ov-card-purity
    section: Tumor fit
    workflow_tag: oncoanalyser
    data_collection_tag: purple_purity
    use: purple/purity
    aggregation: median
    column_name: purity
    column_type: float64
    secondary_layout: gauge
    coverage_max: 1.0
    display: {icon_name: 'mdi:gauge', title_font_size: xl, value_font_size: xl}
    title: Tumor purity
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: oa-ov-card-ploidy
    section: Tumor fit
    workflow_tag: oncoanalyser
    data_collection_tag: purple_purity
    use: purple/purity
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: ploidy
    column_type: float64
    display: {icon_name: 'mdi:content-duplicate', title_font_size: xl, value_font_size: xl}
    title: Ploidy
    title_size: sm
    title_align: left
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: oa-ov-card-tmb
    section: Tumor fit
    workflow_tag: oncoanalyser
    data_collection_tag: purple_purity
    use: purple/purity
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: tmb_per_mb
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', title_font_size: xl, value_font_size: xl}
    title: Mutations per Mb
    title_size: sm
    title_align: left
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: oa-ov-card-msi
    section: Tumor fit
    workflow_tag: oncoanalyser
    data_collection_tag: purple_purity
    use: purple/purity
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: ms_indels_per_mb
    column_type: float64
    display: {icon_name: 'mdi:waves', title_font_size: xl, value_font_size: xl}
    title: Microsatellite indels per Mb
    title_size: sm
    title_align: left
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    tag: oa-ov-av-purity-ploidy
    index: oa-ov-av-purity-ploidy
    section: Tumor fit
    workflow_tag: oncoanalyser
    data_collection_tag: purple_purity
    use: purple/purity_ploidy_scatter
    config:
      x_title: Ploidy
      y_title: Tumor purity
      marker_size: 12
      legend_pos: bottom
      selection_enabled: true
      selection_column: sample
      controls_placement: header
    title: Purity against ploidy, one point per tumor
    description: PURPLE's chosen fit for every tumor, coloured by fit status. A tumor low on the purity axis has little tumor signal behind every call downstream.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 6}

  # -------------------------------------------------------- tissue of origin
  - component_type: advanced_viz
    tag: oa-ov-av-cuppa-heatmap
    index: oa-ov-av-cuppa-heatmap
    section: Tissue of origin
    workflow_tag: oncoanalyser
    data_collection_tag: cuppa_classifier_matrix
    use: cuppa/classifier_heatmap
    config:
      cluster_rows: false
      cluster_cols: false
      controls_placement: header
    title: Cancer-type probability per classifier
    description: One row per cancer type and one column per CUPPA classifier. The combined column is the final call; the DNA and RNA columns show which evidence drives it.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 8}

  # ---------------------------------------------------- mutational processes
  - component_type: card
    tag: oa-ov-card-hrd
    section: Mutational processes
    workflow_tag: oncoanalyser
    data_collection_tag: chord_prediction
    use: chord/prediction
    aggregation: max
    column_name: p_hrd
    column_type: float64
    secondary_layout: gauge
    coverage_max: 1.0
    display: {icon_name: 'mdi:alert-circle-outline', title_font_size: xl, value_font_size: xl}
    title: Highest HRD probability
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: oa-ov-card-signature-snvs
    section: Mutational processes
    workflow_tag: oncoanalyser
    data_collection_tag: sigs_allocation
    use: sigs/allocation
    aggregation: sum
    column_name: allocation
    column_type: float64
    secondary_layout: top_n
    breakdown_col: signature
    top_n_count: 3
    display: {icon_name: 'mdi:fingerprint', title_font_size: xl, value_font_size: xl}
    title: SNVs allocated to signatures
    title_size: sm
    title_align: left
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: oa-ov-card-tml
    section: Mutational processes
    workflow_tag: oncoanalyser
    data_collection_tag: purple_purity
    use: purple/purity
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: tml
    column_type: int64
    display: {icon_name: 'mdi:counter', title_font_size: xl, value_font_size: xl}
    title: Missense load
    title_size: sm
    title_align: left
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: oa-ov-card-sv-burden
    section: Mutational processes
    workflow_tag: oncoanalyser
    data_collection_tag: purple_purity
    use: purple/purity
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: sv_tmb
    column_type: int64
    display: {icon_name: 'mdi:vector-link', title_font_size: xl, value_font_size: xl}
    title: Structural variant burden
    title_size: sm
    title_align: left
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    tag: oa-ov-fig-signatures
    index: oa-ov-signature-bar
    section: Mutational processes
    workflow_tag: oncoanalyser
    data_collection_tag: sigs_allocation
    use: sigs/allocation
    visu_type: bar
    dict_kwargs: {x: signature, y: percent, color: sample, barmode: group}
    title: Share of SNVs per mutational signature
    description: SIGS' allocation of each tumor's SNVs to COSMIC signatures, in percent; MISALLOC is the share no signature explains.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 6}

  # ------------------------------------------------------------ tumor detail
  - component_type: table
    tag: oa-ov-table-fit
    section: Tumor detail
    workflow_tag: oncoanalyser
    data_collection_tag: purple_purity
    use: purple/purity
    row_selection_enabled: true
    row_selection_column: sample
    title: PURPLE fit per tumor
    description: Purity, ploidy, fit, mutational load, microsatellite status and QC of every tumor. Select a row to open its record.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 5, h: 7}
  - component_type: advanced_viz
    tag: oa-ov-av-tumor-record
    index: oa-ov-av-tumor-record
    section: Tumor detail
    workflow_tag: oncoanalyser
    data_collection_tag: purple_purity
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: oa-ov-table-fit
      id_col: sample
      title_col: sample
      selection_source: table_selection
      sections:
        Fit: [purity, ploidy, fit_status, fit_method, fit_score, min_purity, max_purity, min_ploidy, max_ploidy]
        Genome: [sex, whole_genome_duplication, diploid_fraction, polyclonal_fraction, loh_fraction, cn_segments, unsupported_cn_segments, deleted_genes]
        Mutational load: [tmb_per_mb, tmb_status, tml, tml_status, ms_indels_per_mb, ms_status, sv_tmb]
        QC: [qc_status, contamination, tinc_level, amber_mean_depth, germline_aberrations, run_mode]
    title: Tumor record
    description: The selected tumor's PURPLE fit, genome state, mutational load and QC.
    title_size: h3
    layout: {x: 5, y: 0, w: 3, h: 7}

  # ------------------------------------------------- tumor reference tables
  - component_type: table
    tag: oa-ov-table-cuppa
    section: Tumor reference tables
    workflow_tag: oncoanalyser
    data_collection_tag: cuppa_predictions
    use: cuppa/predictions
    title: CUPPA probabilities
    description: Probability and rank of every cancer type under every classifier.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    tag: oa-ov-table-chord
    section: Tumor reference tables
    workflow_tag: oncoanalyser
    data_collection_tag: chord_prediction
    use: chord/prediction
    title: CHORD prediction
    description: Probability of each deficiency type, HR status and HRD type per tumor.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 5, w: 8, h: 3}

  # ------------------------------------------------------------- left panel
  - component_type: interactive
    tag: oa-filter-sample
    index: oa-sample-filter
    section: Sample filters
    group: Samples
    workflow_tag: oncoanalyser
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display: {title_size: md, custom_color: '#26A69A', icon_name: 'mdi:test-tube'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: oa-filter-group-col
    index: oa-group-col-filter
    section: Sample filters
    group: Samples
    workflow_tag: oncoanalyser
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: "{GROUP_COL}"
    column_type: object
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:account-group-outline'}
    placement: left
    title: "{GROUP_COL_DISPLAY}"
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: oa-filter-analysis-group
    index: oa-analysis-group-filter
    section: Sample filters
    group: Samples
    workflow_tag: oncoanalyser
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: group_id
    column_type: object
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:folder-outline'}
    placement: left
    title: Analysis group
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: oa-ov-filter-fit-status
    index: oa-ov-fit-status-filter
    section: Tumor scope
    group: Tumor
    workflow_tag: oncoanalyser
    data_collection_tag: purple_purity
    interactive_component_type: MultiSelect
    column_name: fit_status
    column_type: object
    display: {title_size: md, custom_color: '#1E88E5', icon_name: 'mdi:check-decagram'}
    placement: left
    title: PURPLE fit status
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: oa-ov-filter-classifier
    index: oa-ov-classifier-filter
    section: Tumor scope
    group: Tumor
    workflow_tag: oncoanalyser
    data_collection_tag: cuppa_predictions
    interactive_component_type: MultiSelect
    column_name: classifier
    column_type: object
    display: {title_size: md, custom_color: '#3949AB', icon_name: 'mdi:sitemap'}
    placement: left
    title: CUPPA classifier
    layout: {x: 0, y: 3, w: 1, h: 3}

tabs:
# =========================================================================
# Tab 2 - Sequencing QC
# =========================================================================
- title: Sequencing QC
  subtitle: Alignment depth, duplicates, coverage breadth, insert size and QSEE's verdicts per DNA sample
  tab_order: 2
  tab_icon: mdi:quality-high
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: QC scope
    icon: mdi:tune
    color: orange
    description: Narrow the QC verdicts by status or by the tool they come from
  grid_sections:
  - name: Alignment at a glance
    icon: mdi:counter
    color: orange
    description: Depth, read count, duplicate share and coverage breadth per DNA sample
  - name: Coverage and insert size
    icon: mdi:chart-line
    color: orange
    description: Cumulative coverage and the read-pair insert size distribution
  - name: QC verdicts
    icon: mdi:check-decagram
    color: orange
    description: QSEE's PASS, WARN and FAIL calls per tool
  - name: Library detail
    icon: mdi:table
    color: gray
    description: One row per DNA sample with its BamTools summary; select a row to open its record
  - name: QC reference tables
    icon: mdi:table
    color: gray
    description: Every QSEE check behind the verdict bar
    collapsed: true
  components:
  - component_type: card
    tag: oa-qc-card-coverage
    section: Alignment at a glance
    workflow_tag: oncoanalyser
    data_collection_tag: hmf_bamtools_summary
    use: hmf_bamtools/summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: mean_coverage
    column_type: float64
    display: {icon_name: 'mdi:layers-outline', title_font_size: xl, value_font_size: xl}
    title: Mean coverage
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: oa-qc-card-reads
    section: Alignment at a glance
    workflow_tag: oncoanalyser
    data_collection_tag: hmf_bamtools_summary
    use: hmf_bamtools/summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: total_reads
    column_type: int64
    display: {icon_name: 'mdi:counter', title_font_size: xl, value_font_size: xl}
    title: Reads per sample
    title_size: sm
    title_align: left
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: oa-qc-card-duplicates
    section: Alignment at a glance
    workflow_tag: oncoanalyser
    data_collection_tag: hmf_bamtools_summary
    use: hmf_bamtools/summary
    aggregation: max
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: duplicate_frac
    column_type: float64
    display: {icon_name: 'mdi:content-duplicate', title_font_size: xl, value_font_size: xl}
    title: Highest duplicate share
    title_size: sm
    title_align: left
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: oa-qc-card-breadth
    section: Alignment at a glance
    workflow_tag: oncoanalyser
    data_collection_tag: hmf_bamtools_summary
    use: hmf_bamtools/summary
    aggregation: min
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: frac_ge_30x
    column_type: float64
    display: {icon_name: 'mdi:percent-outline', title_font_size: xl, value_font_size: xl}
    title: Lowest share at 30x or more
    title_size: sm
    title_align: left
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    tag: oa-qc-av-coverage-curve
    index: oa-qc-av-coverage-curve
    section: Coverage and insert size
    workflow_tag: oncoanalyser
    data_collection_tag: hmf_bamtools_coverage_profile
    use: hmf_bamtools/cumulative_coverage_curve
    config:
      x_title: Read depth
      y_title: Share of bases at this depth or more
      legend_pos: bottom
      controls_placement: header
    title: Cumulative coverage per sample
    description: The share of the genome covered at each depth or more. The tumor curve should reach further right than the normal one.
    title_size: h3
    layout: {x: 0, y: 0, w: 4, h: 7}
  - component_type: advanced_viz
    tag: oa-qc-av-fragment-length
    index: oa-qc-av-fragment-length
    section: Coverage and insert size
    workflow_tag: oncoanalyser
    data_collection_tag: hmf_bamtools_fragment_length
    use: hmf_bamtools/fragment_length_curve
    config:
      x_title: Insert size (bp)
      y_title: Share of read pairs
      legend_pos: bottom
      controls_placement: header
    title: Insert size distribution per sample
    description: Read-pair insert size from BamTools. A second peak or a shifted mode points at library preparation differences between samples.
    title_size: h3
    layout: {x: 4, y: 0, w: 4, h: 7}
  - component_type: card
    tag: oa-qc-card-checks
    section: QC verdicts
    workflow_tag: oncoanalyser
    data_collection_tag: qsee_status
    use: qsee/status
    aggregation: count
    column_name: check_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: qc_status
    top_n_count: 3
    display: {icon_name: 'mdi:check-all', title_font_size: xl, value_font_size: xl}
    title: QSEE checks
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 2, h: 5}
  - component_type: figure
    tag: oa-qc-fig-status
    index: oa-qc-status-bar
    section: QC verdicts
    workflow_tag: oncoanalyser
    data_collection_tag: qsee_status
    use: qsee/status
    visu_type: bar
    dict_kwargs:
      x: source_tool
      color: qc_status
      color_discrete_map: '{"PASS": "#40c057", "WARN": "#fd7e14", "FAIL": "#fa5252"}'
    title: QC verdicts per tool
    description: QSEE checks per source tool, stacked by PASS, WARN and FAIL.
    title_size: h3
    layout: {x: 2, y: 0, w: 6, h: 5}
  - component_type: table
    tag: oa-qc-table-bam
    section: Library detail
    workflow_tag: oncoanalyser
    data_collection_tag: hmf_bamtools_summary
    use: hmf_bamtools/summary
    row_selection_enabled: true
    row_selection_column: sample
    title: BamTools summary per sample
    description: Reads, duplicates, coverage statistics and breadth thresholds of every DNA sample. Select a row to open its record.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 5, h: 7}
