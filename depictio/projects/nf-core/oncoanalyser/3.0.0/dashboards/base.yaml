    data_collection_tag: lilac_alleles
    use: lilac/alleles
    visu_type: bar
    dict_kwargs: {x: allele, y: tumor_copy_number, color: gene, labels: '{"allele": "HLA allele", "tumor_copy_number": "Copy number in the tumor", "gene": "HLA gene"}'}
    section: HLA and telomeres
    tag: oa-im-fig-allele-cn
    index: im-allele-cn-bar
    title: Tumor copy number per HLA allele
    description: LILAC's copy number of each allele in the tumor; an allele near zero is lost, which hides its neoepitopes from T cells.
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: figure
    workflow_tag: oncoanalyser
    data_collection_tag: teal_telomere_length
    use: teal/telomere_length
    visu_type: bar
    mode: code
    code_content: |-
      # Telomere length per DNA sample (the normal is TEAL's reference), with the tumor to normal ratio under the bars.
      d = df.select('sampleId', 'type', 'finalTelomereLength').sort('type')
      fig = px.bar(d.to_pandas(), x='sampleId', y='finalTelomereLength', color='type', labels={'sampleId': 'Sample', 'finalTelomereLength': 'Telomere length (bp)', 'type': 'Sample type'})
      tum = d.filter(pl.col('type') == 'tumor')['finalTelomereLength'].mean()
      ref = d.filter(pl.col('type') == 'ref')['finalTelomereLength'].mean()
      if tum is not None and ref:
          fig.add_annotation(x=0.5, y=1.08, xref='paper', yref='paper', showarrow=False, text='tumor / normal: ' + str(round(tum / ref, 2)))
      fig.update_layout(margin=dict(t=40))
    section: HLA and telomeres
    tag: oa-im-fig-telomeres
    index: im-telomere-bar
    title: Telomere length per sample
    description: TEAL's purity and ploidy adjusted telomere length of the tumor and its normal, with their ratio on top. A ratio under 1 means the tumor telomeres are shorter than the normal's; above 1 they are longer, which points to a telomere maintenance mechanism.
    layout: {x: 4, y: 0, w: 4, h: 5}
