version: 1
# nf-core/oncoanalyser 3.0.0, on the family rules of depictio/projects/nf-core/RULES.md
# (ampliseq/2.18.0 is the reference implementation).
#
# Funnel: whether the sequencing supports the calls (Data & QC) -> the tumor's
# purity, ploidy and tissue of origin, its copy number and its structural
# variants (Genome) -> the driver catalog, the somatic small variants, their
# protein changes and the immune context (Variants). The sample hub (`samples`,
# the samplesheet) carries the persistent sample filters; its links reach every
# collection by the tumor or DNA sample id.
#
# oncoanalyser writes no MultiQC report parquet, so the family has no MultiQC
# tab. The Protein changes tab binds the gene scatter and the needle plot to the
# protein changes of one gene: a point picked on the scatter moves the needles.
# It draws no 3D structure: that tile needs the server's structure resolver
# (off by default) and said so above the figures that matter.
#
# Routes: CUPPA, SIGS, CHORD, LILAC, TEAL, Neo and QSEE can be excluded with
# --processes_exclude, and a targeted (panel) run skips several of them. Their
# collections are optional, so a run without them drops the tiles that bind
# them: the Findings row, the Pipeline step and the Immune context tab when
# LILAC, Neo and TEAL are all missing, and the tissue of origin and signature
# tiles of the Tumor profile tab.
main_dashboard:
  title: nf-core/oncoanalyser
  subtitle: Tumor genomes, from the reads to purity, copy number, drivers, variants and immune context
  project_tag: oncoanalyser Cancer Genomics
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family: figures, advanced viz
  # and filter chips all colour a value the same way.
  category_colors:
    '{GROUP_COL}': auto
    qc_status:
      PASS: '#2f9e44'
      WARN: '#f59f00'
      FAIL: '#e03131'
    variant_type:
      SNV: '#1c7ed6'
      MNV: '#f59f00'
      INDEL: '#ae3ec9'
    coding_effect:
      MISSENSE: '#f59f00'
      NONSENSE_OR_FRAMESHIFT: '#e03131'
      SPLICE: '#ae3ec9'
      SYNONYMOUS: '#868e96'
      NONE: '#adb5bd'
    worst_effect:
      MISSENSE: '#f59f00'
      NONSENSE_OR_FRAMESHIFT: '#e03131'
      SPLICE: '#ae3ec9'
      SYNONYMOUS: '#868e96'
    category:
      MISSENSE: '#f59f00'
      NONSENSE_OR_FRAMESHIFT: '#e03131'
      SPLICE: '#ae3ec9'
      SYNONYMOUS: '#868e96'
      ONCO: '#e8590c'
      TSG: '#1098ad'
    gene_role:
      ONCO: '#e8590c'
      TSG: '#1098ad'
      unlisted: '#adb5bd'
    cn_event:
      AMP: '#e03131'
      PARTIAL_AMP: '#ff8787'
      DEL: '#1c7ed6'
      PARTIAL_DEL: '#74c0fc'
      LOH: '#845ef7'
      NEUTRAL: '#adb5bd'
    driver:
      MUTATION: '#e8590c'
      AMP: '#e03131'
      PARTIAL_AMP: '#ff8787'
      DEL: '#1c7ed6'
      HET_DEL: '#74c0fc'
      LOH: '#845ef7'
      DISRUPTION: '#0ca678'
      GERMLINE_MUTATION: '#c2255c'
      GERMLINE_DELETION: '#364fc7'
      GERMLINE_DISRUPTION: '#087f5b'
    phased:
      INFRAME: '#0ca678'
      SKIPPED_EXONS: '#f59f00'
      OUT_OF_FRAME: '#868e96'
    # The event LINX resolves an SV cluster to: the chords and the bar beside them wear it.
    resolved_type: auto
    # The browsers colour a track by the kind of file it is.
    kind:
      somatic: '#e8590c'
      sv: '#f59f00'
      germline: '#1c7ed6'
      sv_germline: '#74c0fc'
      tumor_reads: '#c2255c'
      normal_reads: '#868e96'
    # The proposed cause of a COSMIC signature, as the signature bar groups them.
    signature_cause:
      '*': auto
      APOBEC: '#e8590c'
      HR deficiency: '#c2255c'
      Clock-like (ageing): '#1c7ed6'
      Mismatch repair: '#7048e8'
      Unexplained: '#adb5bd'
      Unknown cause: '#ced4da'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. All
  # three are bound to the samplesheet, the source of every sample link.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    persistent: true
    pin: top
    description: Applies to every tab
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab, which no route removes.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs: [Overview]
    description: The samplesheet behind every tab, narrowed by the sample filters
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Samples, below).
  - component_type: interactive
    workflow_tag: oncoanalyser
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Key figures
    tag: oa-ov-kf-group
    index: ov-kf-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: oncoanalyser
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: oa-ov-kf-sample
    index: ov-kf-sample
    title: Sample
    layout: {x: 2, y: 0, w: 2, h: 1}
  # The pipeline's wordmark, read from its repository; where it cannot load (no
  # internet), the title is drawn as text.
  - component_type: text
    title: nf-core/oncoanalyser
    logo: https://raw.githubusercontent.com/nf-core/oncoanalyser/master/docs/images/nf-core-oncoanalyser_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/oncoanalyser/master/docs/images/nf-core-oncoanalyser_logo_dark.png
    order: 1
    body: >
      Tumor and normal sequencing turned into one genomic profile per tumor: how pure the sample
      is, which regions are gained or lost, which genes drive it and which variants and
      rearrangements it carries. [Run parameters](params:)
    tag: oa-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/oncoanalyser runs the WiGiTS toolkit of the Hartwig Medical Foundation on tumor and normal DNA and on tumor RNA. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The sample filters in the left panel apply to every tab: narrow the samples once and the whole dashboard follows. A bar above a section narrows that section only.
    tag: oa-ov-about
    index: ov-about
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash.
  - component_type: text
    surface: card
    values:
      samples: {dc: samples, column: sample_id, aggregation: nunique, format: integer}
      n_groups: {dc: samples, column: group_id, aggregation: nunique, format: integer}
    body: |
      ### The run
      - ![](icon:mdi:test-tube) **Samples** {{samples}} in {{n_groups}} analysis groups
      - ![](icon:mdi:cog-outline) **Mode** {{param:mode}}
      - ![](icon:mdi:dna) **Genome** {{param:genome}}
      - ![](icon:mdi:gauge) **Purity fit** {{param:purity_estimate_mode}}
      - ![](icon:mdi:target) **Driver genes** {{param:driver_gene_panel}}
    tag: oa-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  # The marks take the family's colour (the header's), not the theme's blue. A
  # step citing a value goes with its collection when the run skipped the tool.
  - component_type: text
    surface: card
    accent: green
    values:
      n_fusions: {dc: linx_fusions, column: fusion_id, aggregation: count, format: integer}
      n_hla: {dc: lilac_alleles, column: allele_id, aggregation: count, format: integer}
      n_sigs: {dc: sigs_allocation, column: signature, aggregation: nunique, format: integer}
    body: |
      ### Six steps from reads to a tumor profile
      Each step names its settings and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:layers-outline) **Align** BWA-MEM2 and BamTools · [Settings](params:genome) · [Sequencing QC](tab:Sequencing QC)
      2. ![](icon:mdi:gauge) **Fit** AMBER, COBALT and PURPLE · [Settings](params:purity) · [Tumor profile](tab:Tumor profile)
      3. ![](icon:mdi:vector-link) **Link** LINX, {{n_fusions}} candidate fusions · [Settings](params:mode) · [Structural variants](tab:Structural variants)
      4. ![](icon:mdi:dna) **Call** SAGE and PAVE small variants · [Settings](params:driver) · [Small variants](tab:Small variants)
      5. ![](icon:mdi:fingerprint) **Classify** CUPPA, CHORD and SIGS, {{n_sigs}} signatures · [Settings](params:processes) · [Tumor profile](tab:Tumor profile)
      6. ![](icon:mdi:shield-check-outline) **Type** LILAC and Neo, {{n_hla}} HLA alleles · [Settings](params:isofox) · [Immune context](tab:Immune context)
      :::
    tag: oa-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. All four read collections every route writes.
  - component_type: card
    workflow_tag: oncoanalyser
    data_collection_tag: samples
    aggregation: nunique
    column_name: sample_id
    column_type: object
    secondary_layout: composition
    breakdown_col: '{GROUP_COL}'
    display:
      icon_name: mdi:test-tube
      icon_color: orange
      caption: in the samplesheet, by {GROUP_COL_DISPLAY}
      link: tab:Sequencing QC
    section: Key figures
    tag: oa-ov-kf-samples
    index: ov-kf-samples
    title: Samples
    description: Samples of the run, tumor and normal DNA and tumor RNA. The bar splits them by {GROUP_COL_DISPLAY}.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: oncoanalyser
    data_collection_tag: purple_purity
    use: purple/purity
    aggregation: median
    column_name: purity
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.2
    threshold_direction: min
    display:
      icon_name: mdi:gauge
      icon_color: blue
      caption: median; QSEE fails a fit under 20%
      link: tab:Tumor profile
      format: percent
    section: Key figures
    tag: oa-ov-kf-purity
    index: ov-kf-purity
    title: Tumor purity
    description: Share of tumor cells in the sample, from PURPLE's fit, median over the tumors in view. Below 20% the fit is too uncertain to trust the copy numbers.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: oncoanalyser
    data_collection_tag: purple_drivers
    use: purple/drivers
    aggregation: count
    column_name: driver_id
    column_type: object
    filter_expr: col('reported') == True
    secondary_layout: top_n
    breakdown_col: driver
    top_n_count: 3
    display:
      icon_name: mdi:target
      icon_color: red
      caption: reported, by driver type
      link: tab:Drivers
    section: Key figures
    tag: oa-ov-kf-drivers
    index: ov-kf-drivers
    title: Reported drivers
    description: Somatic and germline drivers that PURPLE and LINX report. The bars rank the commonest driver types.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # mean_coverage is per DNA sample, so the median is of samples, tumor and normal alike.
  - component_type: card
    workflow_tag: oncoanalyser
    data_collection_tag: hmf_bamtools_summary
    use: hmf_bamtools/summary
    aggregation: median
    column_name: mean_coverage
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:layers-outline
      icon_color: teal
      caption: median per DNA sample, with its spread
      link: tab:Sequencing QC
      decimals: 0
    section: Key figures
    tag: oa-ov-kf-coverage
    index: ov-kf-coverage
    title: Mean coverage
    description: Mean read depth of each DNA sample, tumor and normal alike, which is why a tumor sequenced deeper than its normal spreads the box.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the group, then the sample.
  - component_type: interactive
    workflow_tag: oncoanalyser
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Findings
    tag: oa-ov-findings-group
    index: ov-findings-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: oncoanalyser
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Sample
    section: Findings
    tag: oa-ov-findings-sample
    index: ov-findings-sample
    title: Sample
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data. Every row states a measure and lets the value
  # fill in; the gains and losses use the cut-offs of the Copy number cards.
  - component_type: text
    surface: card
    values:
      top_sig: {dc: sigs_allocation, column: signature, aggregation: top, weight: allocation}
      sig_share: {dc: sigs_allocation, column: signature, aggregation: top_share, weight: allocation, format: percent}
      n_loss: {dc: purple_gene_copy_number, column: gene, aggregation: nunique, filter_expr: 'col(''cn_event'').is_in([''DEL'', ''PARTIAL_DEL''])', format: integer}
      n_gain: {dc: purple_gene_copy_number, column: gene, aggregation: nunique, filter_expr: 'col(''cn_event'').is_in([''AMP'', ''PARTIAL_AMP''])', format: integer}
      n_sv: {dc: linx_svs, column: sv_key, aggregation: count, format: integer}
      top_event: {dc: linx_svs, column: resolved_type, aggregation: top}
      ev_share: {dc: linx_svs, column: resolved_type, aggregation: top_share, format: percent}
      n_calls: {dc: purple_somatic_variants, column: variant_key, aggregation: count, format: integer}
      tmb: {dc: purple_purity, column: tmb_per_mb, aggregation: median, format: decimals:1}
    body: |
      - **{{sig_share}}** of SNVs go to {{top_sig}} – the leading COSMIC signature [Tumor profile](tab:Tumor profile)
      - **{{n_loss}}** genes lost and **{{n_gain}}** gained – whole or partial, at PURPLE's cut-offs [Copy number](tab:Copy number)
      - **{{n_sv}}** structural variants, **{{ev_share}}** of them {{top_event}} – the commonest resolved event [Structural variants](tab:Structural variants)
      - **{{n_calls}}** somatic small variants at **{{tmb}}** per megabase – PASS calls of the PURPLE VCF [Small variants](tab:Small variants)
    section: Findings
    tag: oa-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per analysis tab, in the order of the rows above. The tiles of
  # a row share a stored height.
  - component_type: highlight
    section: Findings
    source_tab: Tumor profile
    source_component: tp-signature-bar
    caption: Share of the SNVs that each COSMIC signature explains, largest first and coloured by its proposed cause; MISALLOC is the share none explains.
    hide_legend: true
    tag: oa-ov-hl-sig
    index: ov-hl-sig
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Copy number
    source_component: cn-profile
    caption: PURPLE's fitted copy number along the genome as log2 over 2, with the B-allele frequency beneath.
    hide_legend: true
    tag: oa-ov-hl-cn
    index: ov-hl-cn
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Structural variants
    source_component: sx-chords
    caption: One chord per structural variant between its two breakends, coloured by the event its cluster resolves to.
    hide_legend: true
    tag: oa-ov-hl-sv
    index: ov-hl-sv
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Small variants
    source_component: sv-af-histogram
    caption: Purity-adjusted allele frequency of every PASS call; clonal calls pile up at one frequency, subclones below it.
    hide_legend: true
    tag: oa-ov-hl-af
    index: ov-hl-af
    layout: {x: 4, y: 7, w: 4, h: 5}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers. A tab the run does not have is left out.
  - component_type: text
    body: |
      ### Data & QC
      - [Sequencing QC](tab:Sequencing QC)

      ### Genome
      - [Tumor profile](tab:Tumor profile)
      - [Copy number](tab:Copy number)
      - [Structural variants](tab:Structural variants)

      ### Variants
      - [Drivers](tab:Drivers)
      - [Small variants](tab:Small variants)
      - [Protein changes](tab:Protein changes)
      - [Immune context](tab:Immune context)
    section: How to read this dashboard
    tag: oa-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the group first.
  - component_type: interactive
    workflow_tag: oncoanalyser
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: oa-filter-group
    index: sample-filters-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: oncoanalyser
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: oa-filter-sample
    index: sample-filters-sample
    title: Sample
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: oncoanalyser
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: group_id
    column_type: object
    display:
      icon_name: mdi:folder-outline
      custom_color: grape
    section: Sample filters
    group: Sample scope
    tag: oa-filter-analysis-group
    index: sample-filters-analysis-group
    title: Analysis group
    layout: {x: 0, y: 6, w: 1, h: 3}
  # Row selection feeds the Analysis panel.
  - component_type: table
    workflow_tag: oncoanalyser
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Sample sheet
    tag: oa-sample-sheet
    index: sample-sheet
    title: Samplesheet
    description: One row per sample, with its analysis group, subject, role and sequence type.
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
# ===========================================================================
# Data & QC
# ===========================================================================
- title: Sequencing QC
  subtitle: Is the sequencing deep and clean enough for the calls?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: mdi:quality-high
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: QC scope
    icon: mdi:tune
    color: orange
    description: Keep samples inside a depth band, or verdicts of one status
  grid_sections:
  - name: QC at a glance
    icon: mdi:counter
    color: orange
    description: Depth, reads, duplicates and coverage breadth per DNA sample
  - name: Coverage and insert size
    icon: mdi:chart-line
    color: orange
    description: Cumulative coverage and the read-pair insert size distribution
  - name: QC verdicts
    icon: mdi:check-decagram
    color: orange
    description: QSEE's PASS, WARN and FAIL calls per tool
  - name: Library detail
    icon: mdi:table
    color: gray
    collapsed: true
    description: One row per DNA sample with its BamTools summary
  - name: QC reference tables
    icon: mdi:table
    color: gray
    collapsed: true
    description: Every QSEE check behind the verdict bar
  components:
  - component_type: interactive
    workflow_tag: oncoanalyser
    data_collection_tag: hmf_bamtools_summary
    interactive_component_type: RangeSlider
    column_name: mean_coverage
    column_type: float64
    display:
      icon_name: mdi:layers-outline
      custom_color: orange
    placement: left
    section: QC scope
    group: Depth
    tag: oa-qc-filter-coverage
    index: qc-coverage-range
    title: Mean coverage
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: oncoanalyser
    data_collection_tag: qsee_status
    interactive_component_type: MultiSelect
    column_name: qc_status
    column_type: object
    display:
      icon_name: mdi:check-circle-outline
      custom_color: lime
    placement: left
    section: QC scope
    group: Verdicts
    tag: oa-qc-filter-status
    index: qc-status-filter
    title: QC verdict
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: oncoanalyser
    data_collection_tag: qsee_status
    interactive_component_type: MultiSelect
    column_name: source_tool
    column_type: object
    display:
      icon_name: mdi:tools
      custom_color: yellow
    placement: left
    section: QC scope
    group: Verdicts
    tag: oa-qc-filter-tool
    index: qc-tool-filter
    title: Source tool
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: text
    order: 1
    body: >
      [BamTools](https://github.com/hartwigmedical/hmftools/tree/master/bam-tools) reads each
      DNA BAM once for depth, duplicates and read quality, and
      [QSEE](https://github.com/hartwigmedical/hmftools/tree/master/qsee) checks those metrics
      against thresholds. Compare the tumor and normal curves first, then look for any WARN or
      FAIL verdict.
    tag: oa-qc-intro
    index: qc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    workflow_tag: oncoanalyser
    data_collection_tag: hmf_bamtools_summary
    use: hmf_bamtools/summary
    aggregation: median
    column_name: mean_coverage
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:layers-outline
      icon_color: orange.4
      caption: median per DNA sample, with its spread
      decimals: 0
    section: QC at a glance
    tag: oa-qc-card-coverage
    index: qc-card-coverage
    title: Mean coverage
    description: Mean read depth of each DNA sample, tumor and normal alike, median over the samples in view. A tumor is sequenced deeper than its normal, so the box spreads by design.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: oncoanalyser
    data_collection_tag: hmf_bamtools_summary
    use: hmf_bamtools/summary
    aggregation: median
    column_name: total_reads
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:counter
      icon_color: orange.6
      caption: median per DNA sample, with its spread
      format: si
    section: QC at a glance
    tag: oa-qc-card-reads
    index: qc-card-reads
    title: Reads per sample
    description: Reads in the BAM of each DNA sample, median over the samples in view.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: oncoanalyser
    data_collection_tag: hmf_bamtools_summary
    use: hmf_bamtools/summary
    aggregation: max
    column_name: duplicate_frac
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.3
    threshold_direction: max
    display:
      icon_name: mdi:content-duplicate
      icon_color: orange.8
      caption: highest of any DNA sample; QSEE fails above 30%
      format: percent
    section: QC at a glance
    tag: oa-qc-card-duplicates
    index: qc-card-duplicates
    title: Highest duplicate share
    description: Share of reads marked as duplicates in the worst DNA sample. QSEE fails a sample above 30%; a high share means a low-complexity library whose depth overstates the evidence.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: oncoanalyser
    data_collection_tag: hmf_bamtools_summary
    use: hmf_bamtools/summary
    aggregation: min
    column_name: frac_ge_10x
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.9
    threshold_direction: min
    display:
      icon_name: mdi:percent-outline
      icon_color: orange.9
      caption: lowest of any DNA sample; QSEE fails under 90%
      format: percent
    section: QC at a glance
    tag: oa-qc-card-breadth
    index: qc-card-breadth
    title: Lowest share at 10x or more
    description: Share of bases covered at least 10 times in the shallowest DNA sample. QSEE fails a tumor or a normal under 90% at this depth, so a variant caller has too little to work with there.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: oncoanalyser
    data_collection_tag: hmf_bamtools_coverage_profile
    use: hmf_bamtools/cumulative_coverage_curve
    config:
      x_title: Read depth (x)
      y_title: Share of bases at this depth or more
      legend_pos: bottom
    section: Coverage and insert size
    tag: oa-qc-av-coverage-curve
    index: qc-av-coverage-curve
    title: Cumulative coverage per sample
    description: The share of the genome covered at each depth or more. The tumor curve should reach further right than the normal one.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: oncoanalyser
    data_collection_tag: hmf_bamtools_fragment_length
    use: hmf_bamtools/fragment_length_curve
    config:
      x_title: Insert size (bp)
      y_title: Share of read pairs
      legend_pos: bottom
    section: Coverage and insert size
    tag: oa-qc-av-fragment-length
    index: qc-av-fragment-length
    title: Insert size distribution per sample
    description: Read-pair insert size from BamTools. A second peak or a shifted mode points at a library preparation difference.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: figure
    workflow_tag: oncoanalyser
    data_collection_tag: qsee_status
    use: qsee/status
    visu_type: bar
    dict_kwargs: {x: source_tool, color: qc_status, labels: '{"source_tool": "Source tool", "qc_status": "Verdict"}'}
    section: QC verdicts
    tag: oa-qc-fig-status
    index: qc-status-bar
    title: QC verdicts per tool
    description: QSEE checks per source tool, stacked by PASS, WARN and FAIL.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    workflow_tag: oncoanalyser
    data_collection_tag: hmf_bamtools_summary
    use: hmf_bamtools/summary
    row_selection_enabled: true
    row_selection_column: sample
    section: Library detail
    tag: oa-qc-table-bam
    index: qc-table-bam
    title: BamTools summary per sample
    description: Reads, duplicates, coverage statistics and breadth thresholds of every DNA sample. Select a row to open its record.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: oncoanalyser
    data_collection_tag: hmf_bamtools_summary
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: oa-qc-table-bam
      id_col: sample
      title_col: sample
      selection_source: table_selection
      sections:
        Reads: [total_reads, duplicate_reads, dual_strand_reads, duplicate_frac, unmapped_frac]
        Coverage: [mean_coverage, median_coverage, sd_coverage, mad_coverage]
        Breadth: [frac_ge_10x, frac_ge_20x, frac_ge_30x, frac_ge_60x, frac_ge_100x]
        Filtered bases: [low_map_qual_frac, low_base_qual_frac, overlapping_read_frac, capped_coverage_frac]
    section: Library detail
    tag: oa-qc-av-library-record
    index: qc-av-library-record
    title: Library record
    description: The selected sample's reads, coverage, breadth and the bases BamTools filtered out.
    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: table
    workflow_tag: oncoanalyser
    data_collection_tag: qsee_status
    use: qsee/status
    row_selection_enabled: true
    row_selection_column: check_id
    columns: [sample, sample_type, source_tool, feature, value, qc_status, fail_condition]
    section: QC reference tables
    tag: oa-qc-table-qsee
    index: qc-table-qsee
    title: QSEE checks
    description: Every checked metric with its value, verdict and the condition that fails it.
    layout: {x: 0, y: 0, w: 8, h: 6}
# ===========================================================================
# Genome
# ===========================================================================
- title: Tumor profile
  subtitle: How pure is the tumor, and what kind of tumor is it?
  tab_group: Genome
  tab_order: 2
  tab_icon: mdi:account-search-outline
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Tumor scope
    icon: mdi:tune
    color: blue
    description: Keep tumors by PURPLE fit status or QC verdict
  grid_sections:
  - name: Tumor at a glance
    icon: mdi:counter
    color: blue
    description: Purity, ploidy, mutational burden and microsatellite indels
  - name: Tissue of origin
    icon: mdi:chart-bar
    color: blue
    description: CUPPA's cancer-type probability per classifier
  - name: Mutational processes
    icon: mdi:waves
    color: blue
    description: COSMIC signatures and homologous recombination deficiency
  - name: Tumor detail
    icon: mdi:table
    color: gray
    collapsed: true
    description: One row per tumor with its full PURPLE fit
  - name: Reference tables
    icon: mdi:table
    color: gray
    collapsed: true
    description: CUPPA probabilities and the CHORD prediction behind the tiles
  components:
  - component_type: interactive
    workflow_tag: oncoanalyser
    data_collection_tag: purple_purity
    interactive_component_type: MultiSelect
    column_name: fit_status
    column_type: object
    display:
      icon_name: mdi:check-decagram
      custom_color: blue
    placement: left
    section: Tumor scope
    group: Tumor
    tag: oa-tp-filter-fit
    index: tp-fit-filter
    title: PURPLE fit status
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: oncoanalyser
    data_collection_tag: purple_purity
    interactive_component_type: MultiSelect
    column_name: qc_status
    column_type: object
    display:
      icon_name: mdi:shield-check-outline
      custom_color: lime
    placement: left
    section: Tumor scope
    group: Tumor
    tag: oa-tp-filter-qc
    index: tp-qc-filter
    title: PURPLE QC
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: text
    order: 1
    body: >
      [PURPLE](https://github.com/hartwigmedical/hmftools/tree/master/purple) fits purity and
      ploidy jointly, and every copy number and allele frequency in the other tabs is read
      against that fit. [CUPPA](https://github.com/hartwigmedical/hmftools/tree/master/cuppa)
      scores each cancer type per classifier,
      [SIGS](https://github.com/hartwigmedical/hmftools/tree/master/sig-analyser) allocates SNVs
      to COSMIC signatures and
      [CHORD](https://github.com/hartwigmedical/hmftools/tree/master/chord) predicts homologous
      recombination deficiency. Read the fit first, then the tissue of origin and the processes
      behind the mutations.
    tag: oa-tp-intro
    index: tp-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    workflow_tag: oncoanalyser
    data_collection_tag: purple_purity
    use: purple/purity
    aggregation: median
    column_name: purity
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.2
    threshold_direction: min
    display:
      icon_name: mdi:gauge
      icon_color: blue.4
      caption: median; QSEE fails a fit under 20%
      format: percent
    section: Tumor at a glance
    tag: oa-tp-card-purity
    index: tp-card-purity
    title: Tumor purity
    description: Share of tumor cells in the sample, from PURPLE's fit, median over the tumors in view. Below 20% the fit is too uncertain to trust the copy numbers.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: oncoanalyser
    data_collection_tag: purple_purity
    use: purple/purity
    aggregation: median
    column_name: ploidy
    column_type: float64
    secondary_layout: composition
    breakdown_col: fit_status
    display:
      icon_name: mdi:content-duplicate
      icon_color: blue.6
      caption: median, by PURPLE fit status
      decimals: 1
    section: Tumor at a glance
    tag: oa-tp-card-ploidy
    index: tp-card-ploidy
    title: Ploidy
    description: Average copy number of the tumor genome, median over the tumors in view. 2 is a diploid genome; a value near 3 or more says the genome doubled. The bar shows how PURPLE rates the fit.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: oncoanalyser
    data_collection_tag: purple_purity
    use: purple/purity
    aggregation: median
    column_name: tmb_per_mb
    column_type: float64
    secondary_layout: threshold
    threshold_value: 10
    threshold_direction: max
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: blue.8
      caption: median; PURPLE calls HIGH above 10
      decimals: 1
    section: Tumor at a glance
    tag: oa-tp-card-tmb
    index: tp-card-tmb
    title: Mutations per Mb
    description: Somatic variants per megabase of the genome, median over the tumors in view. PURPLE calls the burden HIGH above 10 per megabase, the range where immune checkpoint treatment is considered.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: oncoanalyser
    data_collection_tag: purple_purity
    use: purple/purity
    aggregation: median
    column_name: ms_indels_per_mb
    column_type: float64
    secondary_layout: threshold
    threshold_value: 4
    threshold_direction: max
    display:
      icon_name: mdi:waves
      icon_color: blue.9
      caption: median; PURPLE calls MSI above 4
      decimals: 2
    section: Tumor at a glance
    tag: oa-tp-card-msi
    index: tp-card-msi
    title: Microsatellite indels per Mb
    description: Indels at microsatellites per megabase, the signal behind PURPLE's MSI call. Above 4 per megabase the tumor is microsatellite unstable (MSI), otherwise stable (MSS).
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: oncoanalyser
    data_collection_tag: cuppa_classifier_matrix
    use: cuppa/classifier_heatmap
    config:
      cluster_rows: false
      cluster_cols: false
    section: Tissue of origin
    tag: oa-tp-av-cuppa-heatmap
    index: tp-cuppa-heatmap
    title: Cancer-type probability per classifier
    description: One row per cancer type and one column per CUPPA classifier. The combined column is the final call; the DNA and RNA columns show which evidence drives it.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: oncoanalyser
    data_collection_tag: sigs_allocation
    use: sigs/allocation
    visu_type: bar
    mode: code
    code_content: |-
      # SNVs per COSMIC signature, largest first, in the colour of the signature's proposed cause (COSMIC v2); the cause is in the hover. Mean over the tumors in view.
      cause = {'Sig1': 'Clock-like (ageing)', 'Sig5': 'Clock-like (ageing)', 'Sig2': 'APOBEC', 'Sig13': 'APOBEC', 'Sig3': 'HR deficiency', 'Sig4': 'Smoking', 'Sig29': 'Smoking', 'Sig6': 'Mismatch repair', 'Sig15': 'Mismatch repair', 'Sig20': 'Mismatch repair', 'Sig21': 'Mismatch repair', 'Sig26': 'Mismatch repair', 'Sig7': 'UV light', 'Sig9': 'Polymerase eta', 'Sig10': 'POLE', 'Sig14': 'POLE', 'Sig11': 'Alkylating agents', 'Sig22': 'Aristolochic acid', 'Sig24': 'Aflatoxin', 'MISALLOC': 'Unexplained'}
      d = df.group_by('signature').agg(pl.col('percent').mean().alias('percent'), pl.col('sample').n_unique().alias('tumors')).with_columns(pl.col('signature').replace_strict(cause, default='Unknown cause', return_dtype=pl.Utf8).alias('cause')).sort('percent', descending=True)
      fig = px.bar(d.to_pandas(), x='percent', y='signature', color='cause', orientation='h', color_discrete_map=depictio_category_colors.get('signature_cause') or {}, category_orders={'signature': d['signature'].to_list()}, hover_data={'cause': True, 'tumors': True}, labels={'percent': 'Share of SNVs (%)', 'signature': '', 'cause': 'Proposed cause', 'tumors': 'Tumors'})
      fig.update_yaxes(autorange='reversed')
      fig.update_layout(margin=dict(t=10), legend=dict(orientation='h', y=-0.2))
    section: Mutational processes
    tag: oa-tp-fig-signatures
    index: tp-signature-bar
    title: Share of SNVs per mutational signature
    description: SIGS' allocation of the SNVs to COSMIC signatures, largest first and coloured by the proposed cause of each (APOBEC, HR deficiency, ageing, mismatch repair); hover a bar for the cause. MISALLOC is the share no signature explains.
    layout: {x: 0, y: 0, w: 5, h: 4}
  - component_type: card
    workflow_tag: oncoanalyser
    data_collection_tag: chord_prediction
    use: chord/prediction
    aggregation: max
    column_name: p_hrd
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.5
    threshold_direction: max
    display:
      icon_name: mdi:alert-circle-outline
      icon_color: blue.6
      caption: highest; CHORD calls HRD from 50%
      format: percent
    section: Mutational processes
    tag: oa-tp-card-hrd
    index: tp-card-hrd
    title: HRD probability
    description: CHORD's probability of homologous recombination deficiency (the cell cannot repair double-strand breaks accurately), highest over the tumors in view. From 50% CHORD calls the tumor HR deficient.
    layout: {x: 5, y: 0, w: 3, h: 2}
  - component_type: card
    workflow_tag: oncoanalyser
    data_collection_tag: sigs_allocation
    use: sigs/allocation
    aggregation: sum
    column_name: allocation
    column_type: float64
    secondary_layout: top_n
    breakdown_col: signature
    top_n_count: 3
    display:
      icon_name: mdi:fingerprint
      icon_color: blue.8
      caption: SNVs, by leading signature
      format: si
    section: Mutational processes
    tag: oa-tp-card-signature-snvs
    index: tp-card-signature-snvs
    title: SNVs allocated
    description: SNVs that SIGS allocates to signatures. The bars rank the signatures that take the most.
    layout: {x: 5, y: 2, w: 3, h: 2}
  - component_type: table
    workflow_tag: oncoanalyser
    data_collection_tag: purple_purity
    use: purple/purity
    row_selection_enabled: true
    row_selection_column: sample
    section: Tumor detail
    tag: oa-tp-table-fit
    index: tp-table-fit
    title: PURPLE fit per tumor
    description: Purity, ploidy, fit, mutational load, microsatellite status and QC of every tumor. Select a row to open its record.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: oncoanalyser
    data_collection_tag: purple_purity
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: oa-tp-table-fit
      id_col: sample
      title_col: sample
      selection_source: table_selection
      sections:
        Fit: [purity, ploidy, fit_status, fit_method, fit_score, min_purity, max_purity, min_ploidy, max_ploidy]
        Genome: [sex, whole_genome_duplication, diploid_fraction, polyclonal_fraction, loh_fraction, cn_segments, unsupported_cn_segments, deleted_genes]
        Mutational load: [tmb_per_mb, tmb_status, tml, tml_status, ms_indels_per_mb, ms_status, sv_tmb]
        QC: [qc_status, contamination, tinc_level, amber_mean_depth, germline_aberrations, run_mode]
    section: Tumor detail
    tag: oa-tp-av-tumor-record
    index: tp-tumor-record
    title: Tumor record
    description: The selected tumor's PURPLE fit, genome state, mutational load and QC.
    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: table
    workflow_tag: oncoanalyser
    data_collection_tag: cuppa_predictions
    use: cuppa/predictions
    row_selection_enabled: true
    row_selection_column: cancer_type
    section: Reference tables
    tag: oa-tp-table-cuppa
    index: tp-table-cuppa
    title: CUPPA probabilities
    description: Probability and rank of every cancer type under every classifier.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: oncoanalyser
    data_collection_tag: chord_prediction
    use: chord/prediction
    row_selection_enabled: true
    row_selection_column: sample
    section: Reference tables
    tag: oa-tp-table-chord
    index: tp-table-chord
    title: CHORD prediction
    description: Probability of each deficiency type, HR status and HRD type per tumor.
    layout: {x: 0, y: 6, w: 8, h: 6}
- title: Copy number
  subtitle: Which regions are gained or lost, and in which genes?
  tab_group: Genome
  tab_order: 3
  tab_icon: mdi:chart-timeline-variant
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Copy-number scope
    icon: mdi:tune
    color: indigo
    description: Opens on gained and lost genes; add loss of heterozygosity or pick chromosomes
  grid_sections:
  - name: Copy number at a glance
    icon: mdi:counter
    color: indigo
    description: Segments, segment copy number, genes with an event and LOH
  - name: Copy-number profile
    icon: mdi:chart-line
    color: indigo
    description: Segment copy number and B-allele frequency along the genome
  - name: Gene copy number
    icon: mdi:chart-bar
    color: indigo
    description: How many genes each copy-number call holds
  - name: Gene detail
    icon: mdi:table
    color: gray
    collapsed: true
    description: One row per gene with its copy-number call
  components:
  - component_type: interactive
    workflow_tag: oncoanalyser
    data_collection_tag: purple_gene_copy_number
    interactive_component_type: MultiSelect
    column_name: cn_event
    column_type: object
    default_value: [AMP, PARTIAL_AMP, DEL, PARTIAL_DEL]
    display:
      icon_name: mdi:swap-vertical
      custom_color: indigo
    placement: left
    section: Copy-number scope
    group: Copy number
    tag: oa-cn-filter-event
    index: cn-event-filter
    title: Gene copy-number event
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: oncoanalyser
    data_collection_tag: purple_cnv_segments
    interactive_component_type: MultiSelect
    column_name: chrom
    column_type: object
    display:
      icon_name: mdi:map-marker-outline
      custom_color: blue
    placement: left
    section: Copy-number scope
    group: Copy number
    tag: oa-cn-filter-chrom
    index: cn-chrom-filter
    title: Chromosome
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: text
    order: 1
    body: >
      [PURPLE](https://github.com/hartwigmedical/hmftools/tree/master/purple) segments the
      genome by allele-specific copy number and calls amplifications, deletions and loss of
      heterozygosity per gene. The tab opens on the genes gained or lost; clear the event filter
      to add the genes with loss of heterozygosity or no change. Zoom the profile into a locus
      to see its genes.
    tag: oa-cn-intro
    index: cn-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    workflow_tag: oncoanalyser
    data_collection_tag: purple_cnv_segments
    use: purple/cnv_segments
    aggregation: count
    column_name: start
    column_type: int64
    secondary_layout: top_n
    breakdown_col: copy_number
    top_n_count: 3
    display:
      icon_name: mdi:vector-line
      icon_color: indigo.4
      caption: segments, by commonest copy number
    section: Copy number at a glance
    tag: oa-cn-card-segments
    index: cn-card-segments
    title: Copy-number segments
    description: Segments of PURPLE's fit. The bars rank the copy numbers the most segments sit at.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: oncoanalyser
    data_collection_tag: purple_cnv_segments
    use: purple/cnv_segments
    aggregation: median
    column_name: copy_number
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:content-duplicate
      icon_color: indigo.6
      caption: median per segment, with its spread
      decimals: 0
    section: Copy number at a glance
    tag: oa-cn-card-segment-cn
    index: cn-card-segment-cn
    title: Segment copy number
    description: Rounded absolute copy number of a segment, median over the segments in view.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: oncoanalyser
    data_collection_tag: purple_gene_copy_number
    use: purple/gene_copy_number
    aggregation: count
    column_name: gene
    column_type: object
    secondary_layout: top_n
    breakdown_col: cn_event
    top_n_count: 3
    display:
      icon_name: mdi:swap-vertical
      icon_color: indigo.8
      caption: genes, by event
    section: Copy number at a glance
    tag: oa-cn-card-genes
    index: cn-card-genes
    title: Genes in view
    description: Genes under the event filter, one row per tumor and gene. The bars rank the events.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: oncoanalyser
    data_collection_tag: purple_purity
    use: purple/purity
    aggregation: median
    column_name: loh_fraction
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:trending-down
      icon_color: indigo.9
      caption: median per tumor, with its spread
      format: percent
    section: Copy number at a glance
    tag: oa-cn-card-loh
    index: cn-card-loh
    title: LOH share of the genome
    description: Share of the genome that lost one parental copy, median over the tumors in view.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: oncoanalyser
    data_collection_tag: purple_cnv_segments
    use: purple/purple_cn_profile
    config:
      minor_copy_number_col: minor_copy_number
      annotation: '{GENOME}'
      views: [plotly]
      show_baf: true
      facet_by_sample: true
    section: Copy-number profile
    tag: oa-cn-av-profile
    index: cn-profile
    title: Copy-number profile along the genome
    description: PURPLE's fitted segments as log2 of copy number over 2, with the B-allele frequency underneath. Hover a segment for its major and minor allele copy number. Open in genome browser shows the reads and breakpoints at the region.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: oncoanalyser
    data_collection_tag: purple_gene_copy_number
    visu_type: bar
    mode: code
    code_content: |-
      # Genes under each copy-number call, largest first, on a log axis: loss of heterozygosity holds most of the genome's genes, which would flatten every gain and loss on a linear one. NEUTRAL genes are left out, and so is any call with no gene.
      order = ['AMP', 'PARTIAL_AMP', 'DEL', 'PARTIAL_DEL', 'LOH']
      colors = depictio_category_colors.get('cn_event') or {}
      d = df.filter(pl.col('cn_event').is_in(order)).group_by('cn_event').agg(pl.len().alias('genes'), pl.col('sample').n_unique().alias('tumors'), pl.col('gene').n_unique().alias('distinct'))
      fig = px.bar(d.to_pandas(), x='genes', y='cn_event', color='cn_event', orientation='h', color_discrete_map=colors, category_orders={'cn_event': order}, text='genes', hover_data={'tumors': True, 'distinct': True, 'genes': False}, labels={'genes': 'Genes (one per tumor and gene)', 'cn_event': '', 'tumors': 'Tumors', 'distinct': 'Distinct genes'})
      fig.update_traces(textposition='outside', cliponaxis=False)
      fig.update_yaxes(categoryorder='total ascending', automargin=True)
      fig.update_xaxes(type='log')
      fig.update_layout(margin=dict(t=10), showlegend=False)
    section: Gene copy number
    tag: oa-cn-fig-gene-events
    index: cn-gene-events
    title: Genes per copy-number call
    description: Genes gained, lost or with a lost allele (LOH), one per tumor and gene, under the event and chromosome filters, on a log axis because LOH holds most genes. The share of the genome in LOH is in the card above. Pick a gene in the table below to read its record.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    workflow_tag: oncoanalyser
    data_collection_tag: purple_gene_copy_number
    use: purple/gene_copy_number
    row_selection_enabled: true
    row_selection_column: gene
    columns: [gene, sample, chrom, min_copy_number, max_copy_number, min_minor_allele_copy_number, relative_min_copy_number, somatic_regions, cn_event, reported_status, driver_type]
    section: Gene detail
    tag: oa-cn-table-genes
    index: cn-table-genes
    title: Copy number per gene
    description: Copy-number range, minor-allele copy number, event and driver status of every gene. Select a row to open its record.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: oncoanalyser
    data_collection_tag: purple_gene_copy_number
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: oa-cn-table-genes
      id_col: gene
      title_col: gene
      selection_source: table_selection
      sections:
        Gene: [gene, sample, chrom, chromosome_band, start, end, transcript]
        Copy number: [min_copy_number, max_copy_number, min_minor_allele_copy_number, relative_min_copy_number, somatic_regions]
        Call: [cn_event, reported_status, driver_type]
    section: Gene detail
    tag: oa-cn-av-gene-record
    index: cn-gene-record
    title: Gene record
    description: The selected gene's copy-number range and call, one card per tumor.
    layout: {x: 5, y: 0, w: 3, h: 6}
- title: Structural variants
  subtitle: Which rearrangements shaped the genome, and which fusions follow?
  tab_group: Genome
  tab_order: 4
  tab_icon: mdi:vector-link
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Structural variant scope
    icon: mdi:tune
    color: violet
    description: Narrow the SVs by resolved event or type, the fusions by phase
  grid_sections:
  - name: Structural variants at a glance
    icon: mdi:counter
    color: violet
    description: SVs, clusters, junction copy number and candidate fusions
  - name: Rearrangement landscape
    icon: mdi:chart-donut
    color: violet
    description: Breakend pairs around the genome and the events they resolve to
  - name: Reads at the breakends
    icon: mdi:dna
    color: violet
    description: PURPLE's SV calls and the reads at the first breakend of the rearrangement picked above
    collapsed: true
  - name: Fusion structure
    icon: mdi:relation-many-to-many
    color: violet
    description: Kept and lost exons of each candidate fusion, and their phase
  - name: Fusion detail
    icon: mdi:table
    color: gray
    collapsed: true
    description: One row per candidate fusion
  - name: Structural variant tables
    icon: mdi:table
    color: gray
    collapsed: true
    description: Every structural variant with its cluster and breakend genes
  components:
  - component_type: interactive
    workflow_tag: oncoanalyser
    data_collection_tag: linx_svs
    interactive_component_type: MultiSelect
    column_name: resolved_type
    column_type: object
    display:
      icon_name: mdi:vector-link
      custom_color: violet
    placement: left
    section: Structural variant scope
    group: Structural variants
    tag: oa-sx-filter-resolved
    index: sx-resolved-filter
    title: Resolved event
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: oncoanalyser
    data_collection_tag: linx_svs
    interactive_component_type: MultiSelect
    column_name: type
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: indigo
    placement: left
    section: Structural variant scope
    group: Structural variants
    tag: oa-sx-filter-sv-type
    index: sx-sv-type-filter
    title: SV type
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: oncoanalyser
    data_collection_tag: linx_fusions
    interactive_component_type: MultiSelect
    column_name: phased
    column_type: object
    display:
      icon_name: mdi:call-split
      custom_color: grape
    placement: left
    section: Structural variant scope
    group: Fusions
    tag: oa-sx-filter-phase
    index: sx-phase-filter
    title: Fusion phase
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: text
    order: 1
    body: >
      [LINX](https://github.com/hartwigmedical/hmftools/tree/master/linx) clusters the
      structural variants into events and finds the gene fusions they create. The chord diagram
      draws each SV between its two breakends, and the fusion lanes show which exons each
      partner keeps. Pick a row in the fusion table to read its record.
    tag: oa-sx-intro
    index: sx-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    workflow_tag: oncoanalyser
    data_collection_tag: linx_svs
    use: linx/svs
    aggregation: count
    column_name: sv_key
    column_type: object
    secondary_layout: top_n
    breakdown_col: type
    top_n_count: 3
    display:
      icon_name: mdi:vector-link
      icon_color: violet.4
      caption: SVs, by commonest type
    section: Structural variants at a glance
    tag: oa-sx-card-svs
    index: sx-card-svs
    title: Structural variants
    description: Somatic structural variants LINX annotates. The bars rank the SV types.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: oncoanalyser
    data_collection_tag: linx_svs
    use: linx/svs
    aggregation: nunique
    column_name: cluster_id
    column_type: int64
    secondary_layout: top_n
    breakdown_col: cluster_category
    top_n_count: 3
    display:
      icon_name: mdi:family-tree
      icon_color: violet.6
      caption: clusters, by commonest category
    section: Structural variants at a glance
    tag: oa-sx-card-clusters
    index: sx-card-clusters
    title: SV clusters
    description: Clusters of SVs that LINX chains into one event. The bars rank the cluster categories.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: oncoanalyser
    data_collection_tag: linx_svs
    use: linx/svs
    aggregation: median
    column_name: junction_copy_number
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:content-duplicate
      icon_color: violet.8
      caption: median per SV, with its spread
      decimals: 1
    section: Structural variants at a glance
    tag: oa-sx-card-junction-cn
    index: sx-card-junction-cn
    title: Junction copy number
    description: Copies of the rearranged junction, median over the SVs in view.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: oncoanalyser
    data_collection_tag: linx_fusions
    use: linx/fusions
    aggregation: count
    column_name: fusion_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: gene_up
    top_n_count: 3
    display:
      icon_name: mdi:call-split
      icon_color: violet.9
      caption: candidates, by commonest 5' partner
    section: Structural variants at a glance
    tag: oa-sx-card-fusions
    index: sx-card-fusions
    title: Candidate fusions
    description: Gene fusions LINX finds in the SV chains. The bars rank the genes most often at the 5' end; the reading frames are on the Fusion structure bar.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: oncoanalyser
    data_collection_tag: linx_svs
    use: linx/sv_chords
    config:
      assembly: '{GENOME}'
      colour_by: category
      intra_chromosomal: true
      max_links: 2000
      show_labels: false
      selection_enabled: true
      selection_column: label
    section: Rearrangement landscape
    tag: oa-sx-av-chords
    index: sx-chords
    title: Structural variants around the genome
    description: One chord per SV between its two breakends, coloured by the event its cluster resolves to. Single breakends have no partner and are left out.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: figure
    workflow_tag: oncoanalyser
    data_collection_tag: linx_svs
    use: linx/svs
    visu_type: bar
    dict_kwargs: {x: resolved_type, color: resolved_type, labels: '{"resolved_type": "Resolved event"}'}
    section: Rearrangement landscape
    tag: oa-sx-fig-resolved
    index: sx-resolved-bar
    title: SVs per resolved event
    description: Structural variants by the event LINX resolved their cluster to, in the colour the chords beside it give that event.
    layout: {x: 4, y: 0, w: 4, h: 6}
  # An SV picked in the chord diagram or the table narrows linx_svs to one row:
  # the view jumps to its first breakend. Unpicked, it opens on the SV with the
  # highest junction copy number; the stepper walks the others, and the
  # Breakpoint view links the two breakends by their split reads and pairs.
  - component_type: jbrowse
    workflow_tag: oncoanalyser
    data_collection_tag: tracks
    section: Reads at the breakends
    # Opens on the first tumor's VCFs and its tumor and normal reads: the reads
    # are what the section is named for.
    initial_tracks: 6
    max_tracks: 9
    color_by: kind
    show_overview: false
    selection_enabled: true
    selection_column: sample_id
    read_pairs_display: arcs
    views: [breakpoint, circular]
    # Reads coloured by pair orientation: the inverted and everted pairs that
    # support a breakend stand out from the concordant ones.
    display:
      color_scheme: pairOrientation
    circular_categories: [Structural variants]
    locus_from:
      data_collection_tag: linx_svs
      chrom_column: chrom_a
      start_column: pos_a
      padding: 500
      max_rows: 20
      sort_by: junction_copy_number
      descending: true
      label_column: label
      # The stepper names a breakend by its type, length and genes, not by "DUP #0".
      columns: [type, length, genes_a, genes_b]
      search_columns: [genes_a, genes_b]
      mate:
        chrom_column: chrom_b
        start_column: pos_b
    tag: oa-sx-browser
    index: sx-reads-browser
    title: Genome browser
    description: PURPLE's SV calls with the tumor and normal reads, framed on the picked breakend. Opens on the SV with the highest junction copy number; the stepper lists up to 20, each with its type, length and genes.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: oncoanalyser
    data_collection_tag: linx_fusion_structure
    use: linx/fusion_exon_layout
    config:
      top_n: 6
      show_breakpoint: true
    section: Fusion structure
    tag: oa-sx-av-fusion-exons
    index: sx-fusion-exons
    title: Kept and lost exons per fusion
    description: One panel per candidate fusion, 5' partner then 3' partner along the fused transcript in exon units. Reported and in-frame fusions come first.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: figure
    workflow_tag: oncoanalyser
    data_collection_tag: linx_fusions
    use: linx/fusions
    visu_type: bar
    dict_kwargs: {x: phased, labels: '{"phased": "Reading frame"}'}
    section: Fusion structure
    tag: oa-sx-fig-phase
    index: sx-phase-bar
    title: Fusions per reading frame
    description: Candidate fusions by phase; in-frame fusions can make a chimeric protein.
    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: table
    workflow_tag: oncoanalyser
    data_collection_tag: linx_fusions
    use: linx/fusions
    row_selection_enabled: true
    row_selection_column: fusion_id
    columns: [fusion, sample, reported, reported_type, phased, likelihood, fused_exon_up, fused_exon_down, chain_length, domains_kept, domains_lost]
    section: Fusion detail
    tag: oa-sx-table-fusions
    index: sx-table-fusions
    title: Candidate fusions
    description: Partners, phase, fused exons, chain and protein domains of every candidate fusion. Select a row to open its record.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: oncoanalyser
    data_collection_tag: linx_fusions
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: oa-sx-table-fusions
      id_col: fusion_id
      title_col: fusion
      selection_source: table_selection
      sections:
        Fusion: [fusion, sample, phased, reported, reported_type, likelihood, reportable_reasons]
        5' partner: [gene_up, transcript_up, region_up, coords_up, fused_exon_up, exons_up_total, skipped_exons_up]
        3' partner: [gene_down, transcript_down, region_down, coords_down, fused_exon_down, exons_down_total, skipped_exons_down]
        Chain and domains: [chain_length, chain_links, chain_terminated, domains_kept, domains_lost]
    section: Fusion detail
    tag: oa-sx-av-fusion-record
    index: sx-fusion-record
    title: Fusion record
    description: The selected fusion's partners, breakends, fused exons and protein domains.
    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: table
    workflow_tag: oncoanalyser
    data_collection_tag: linx_svs
    use: linx/svs
    row_selection_enabled: true
    row_selection_column: label
    columns: [type, resolved_type, sample, cluster_id, chrom_a, pos_a, orient_a, chrom_b, pos_b, orient_b, length, junction_copy_number, genes_a, genes_b]
    section: Structural variant tables
    tag: oa-sx-table-svs
    index: sx-table-svs
    title: Structural variants
    description: Breakends, orientation, length, junction copy number, cluster and genes of every SV.
    layout: {x: 0, y: 0, w: 8, h: 6}
