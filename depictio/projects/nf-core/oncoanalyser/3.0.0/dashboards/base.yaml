- title: Immune context
  subtitle: Which HLA alleles does the tumor keep, and what could they present?
  tab_group: Variants
  tab_order: 8
  tab_icon: mdi:shield-check-outline
  tab_icon_color: pink
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Immune scope
    icon: mdi:tune
    color: pink
    description: Narrow the alleles by HLA gene and the neoepitopes by their source
  grid_sections:
  - name: Immune context at a glance
    icon: mdi:counter
    color: pink
    description: HLA alleles, neoepitopes, their expression and telomere length
  - name: HLA and telomeres
    icon: mdi:chart-bar
    color: pink
    description: Tumor copy number per HLA allele and telomere length per sample
  - name: Neoepitopes
    icon: mdi:chart-scatter-plot
    color: pink
    description: Expression and source of the candidate neoepitopes
  - name: Neoepitope detail
    icon: mdi:table
    color: gray
    collapsed: true
    description: One row per candidate neoepitope
  - name: Immune reference tables
    icon: mdi:table
    color: gray
    collapsed: true
    description: LILAC's alleles and TEAL's telomere lengths behind the tiles
  components:
  - component_type: interactive
    workflow_tag: oncoanalyser
    data_collection_tag: lilac_alleles
    interactive_component_type: MultiSelect
    column_name: gene
    column_type: object
    display:
      icon_name: mdi:shield-check-outline
      custom_color: pink
    placement: left
    section: Immune scope
    group: Immune
    tag: oa-im-filter-gene
    index: im-gene-filter
    title: HLA gene
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: oncoanalyser
    data_collection_tag: neo_neoepitopes
    interactive_component_type: MultiSelect
    column_name: variant_type
    column_type: object
    display:
      icon_name: mdi:molecule
      custom_color: grape
    placement: left
    section: Immune scope
    group: Immune
    tag: oa-im-filter-source
    index: im-source-filter
    title: Neoepitope source
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: text
    order: 1
    body: >
      [LILAC](https://github.com/hartwigmedical/hmftools/tree/master/lilac) types the HLA
      alleles and their copy number in the tumor, and
      [Neo](https://github.com/hartwigmedical/hmftools/tree/master/neo) scores the neoepitopes
      those alleles could present.
      [TEAL](https://github.com/hartwigmedical/hmftools/tree/master/teal) measures telomere
      length in the tumor and its normal. An allele with a tumor copy number near zero is lost,
      and its neoepitopes are hidden from T cells.
    tag: oa-im-intro
    index: im-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
