  tab_order: 6
  tab_icon: mdi:dna
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Variant scope
    icon: mdi:tune
    color: cyan
    description: Narrow the calls by coding effect, variant type or allele frequency
  grid_sections:
  - name: Variants at a glance
    icon: mdi:counter
    color: cyan
    description: Calls, coding calls, allele frequency and variant copy number
  - name: Clonality
    icon: mdi:chart-bell-curve
    color: cyan
    description: How clonal the calls are and on how many copies they sit
  - name: Calls and reads on one axis
    icon: mdi:dna
    color: cyan
    description: Brush the calls and the browser follows; its window shows as a band on the calls
    # One screen: the calls and the browser they drive, as on atacseq.
    display: linked
  - name: Variant detail
    icon: mdi:table
    color: gray
    collapsed: true
    description: One row per PASS call
  components:
  - component_type: interactive
    workflow_tag: oncoanalyser
    data_collection_tag: purple_somatic_variants
    interactive_component_type: MultiSelect
    column_name: coding_effect
    column_type: object
    display:
      icon_name: mdi:molecule
      custom_color: cyan
    placement: left
    section: Variant scope
    group: Variants
    tag: oa-sv-filter-effect
    index: sv-effect-filter
    title: Coding effect
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: oncoanalyser
    data_collection_tag: purple_somatic_variants
    interactive_component_type: MultiSelect
    column_name: variant_type
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: teal
    placement: left
    section: Variant scope
    group: Variants
    tag: oa-sv-filter-type
    index: sv-type-filter
    title: Variant type
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: oncoanalyser
    data_collection_tag: purple_somatic_variants
    interactive_component_type: RangeSlider
    column_name: purple_af
    column_type: float64
    display:
      icon_name: mdi:percent-outline
      custom_color: lime
    placement: left
    section: Variant scope
    group: Variants
    tag: oa-sv-filter-af
    index: sv-af-range
    title: Purity-adjusted allele frequency
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: text
    order: 1
    body: >
      [SAGE](https://github.com/hartwigmedical/hmftools/tree/master/sage) calls the somatic
      variants and [PAVE](https://github.com/hartwigmedical/hmftools/tree/master/pave) annotates
      them; PURPLE adds the purity-adjusted allele frequency and copy number of each. Only PASS
      calls are kept. Clonal calls pile up at one frequency, and a shoulder below it is a
      subclone.
    tag: oa-sv-intro
    index: sv-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    workflow_tag: oncoanalyser
    data_collection_tag: purple_somatic_variants
    use: purple/somatic_variants
    aggregation: count
    column_name: variant_key
    column_type: object
    secondary_layout: top_n
    breakdown_col: variant_type
    top_n_count: 3
    display:
      icon_name: mdi:dna
      icon_color: cyan.4
      caption: calls, by variant type
    section: Variants at a glance
    tag: oa-sv-card-calls
    index: sv-card-calls
    title: Somatic calls
    description: PASS somatic variants in view. The bars rank the variant types.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: oncoanalyser
    data_collection_tag: purple_somatic_variants
    use: purple/somatic_variants
    aggregation: count
    column_name: variant_key
    column_type: object
    filter_expr: col('coding_effect').is_in(['MISSENSE', 'NONSENSE_OR_FRAMESHIFT', 'SPLICE', 'SYNONYMOUS'])
    secondary_layout: composition
    breakdown_col: coding_effect
    display:
      icon_name: mdi:molecule
      icon_color: cyan.6
      caption: coding calls, by effect
    section: Variants at a glance
    tag: oa-sv-card-coding
    index: sv-card-coding
    title: Coding calls
    description: Calls with a coding effect on the canonical transcript. The bar splits them by effect.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: oncoanalyser
    data_collection_tag: purple_somatic_variants
    use: purple/somatic_variants
    aggregation: median
    column_name: purple_af
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:percent-outline
      icon_color: cyan.8
      caption: median, with its distribution
      decimals: 2
    section: Variants at a glance
    tag: oa-sv-card-af
    index: sv-card-af
    title: Purity-adjusted allele frequency
    description: Allele frequency after PURPLE corrects for purity, median over the calls in view.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: oncoanalyser
    data_collection_tag: purple_somatic_variants
    use: purple/somatic_variants
    aggregation: median
    column_name: variant_copy_number
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:content-duplicate
      icon_color: cyan.9
      caption: median, with its spread
      decimals: 1
    section: Variants at a glance
    tag: oa-sv-card-vcn
    index: sv-card-vcn
    title: Variant copy number
    description: Copies of the variant allele in the tumor, median over the calls in view.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: oncoanalyser
    data_collection_tag: purple_somatic_variants
    use: purple/somatic_variants
    visu_type: histogram
    dict_kwargs: {x: purple_af, color: variant_type, labels: '{"purple_af": "Purity-adjusted allele frequency", "variant_type": "Variant type"}'}
    section: Clonality
    tag: oa-sv-fig-af
    index: sv-af-histogram
    title: Purity-adjusted allele frequency
    description: Clonal heterozygous calls pile up at one frequency once purity is accounted for; a shoulder below it is a subclone.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: oncoanalyser
    data_collection_tag: purple_somatic_variants
    use: purple/somatic_variants
    visu_type: histogram
    dict_kwargs: {x: variant_copy_number, color: variant_type, labels: '{"variant_copy_number": "Copies of the variant allele", "variant_type": "Variant type"}'}
    section: Clonality
    tag: oa-sv-fig-vcn
    index: sv-vcn-histogram
    title: Variant copy number
    description: Copies of the variant allele; peaks above 1 mark calls on amplified or duplicated regions.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: advanced_viz
    workflow_tag: oncoanalyser
    data_collection_tag: purple_somatic_variants
    use: purple/somatic_variant_genome
    config:
      mark: point
      assembly: '{GENOME}'
      annotation: '{GENOME}'
      score_title: purity-adjusted allele frequency
      point_size: 4
      # Coloured by coding effect, as the calls in the browser below.
      category_col: coding_effect
      region_filter_enabled: true
      follow_region_filter: true
    section: Calls and reads on one axis
    tag: oa-sv-av-genome
    index: sv-genome
    title: Somatic calls along the genome
    description: One point per call at its position, raised by its purity-adjusted allele frequency and coloured by coding effect, as in the browser below. Zoom into a region to see its genes.
    layout: {x: 0, y: 0, w: 8, h: 5}
  # A call picked in the table, or few calls in the plot's region (a zoomed
  # region), narrows purple_somatic_variants: the view then frames them.
  # Unpicked, it opens on a reported driver call, and the stepper walks the
  # others. The tumor and normal reads are among the opening tracks.
  - component_type: jbrowse
    workflow_tag: oncoanalyser
    data_collection_tag: tracks
    section: Calls and reads on one axis
    # Opens on the first tumor's VCFs and its tumor and normal reads, with dbSNP
    # and ClinVar under them.
    initial_tracks: 6
    max_tracks: 9
    color_by: kind
    ucsc_tracks: [dbSnp155Common, clinvarMain]
    follow_window: true
    show_overview: false
    # The calls above already say where the browser is: its locus bar only
    # costs height here, and the tile's menu brings it back.
    show_header: false
    selection_enabled: true
    selection_column: sample_id
    # Three omics layers of the same tumors: small variants (primary: they
    # frame the view on a filter), LINX SV breakends and PURPLE copy-number
    # segments. Next / previous steps through all three along the genome; the
    # density strip has one row per layer, or per tumor sample.
    locus_from:
      - data_collection_tag: purple_somatic_variants
        name: Small variants
        color: blue
        chrom_column: chrom
        start_column: pos
        padding: 150
        max_rows: 20
        # Reported drivers first; the rest keep the order of the file. The highest allele
        # frequency is usually a clonal passenger.
        sort_by: reported
        descending: true
        label_column: gene
        sample_column: sample
        columns: [coding_effect, hgvs_p]
        search_columns: [hgvs_p]
      - data_collection_tag: linx_svs
        name: SV breakends
        color: grape
        chrom_column: chrom_a
        start_column: pos_a
        padding: 500
        sort_by: junction_copy_number
        descending: true
        label_column: label
        sample_column: sample
        columns: [type, resolved_type]
        search_columns: [genes_a, genes_b]
      - data_collection_tag: purple_cnv_segments
        name: CN segments
        color: orange
        chrom_column: chrom
        start_column: start
        end_column: end
        padding: 0
        sort_by: copy_number
        descending: true
        label_column: label
        sample_column: sample
        columns: [copy_number, baf]
    # Calls take the colour of their coding effect, as in the figures.
    variant_color_by:
      column: coding_effect
      info_field: IMPACT
    tag: oa-sv-browser
    index: sv-reads-browser
    title: Genome browser
    description: PURPLE's somatic and germline calls with the tumor and normal reads and the dbSNP and ClinVar tracks, framed on the picked call; it opens on a reported driver call when there is one.
    layout: {x: 0, y: 5, w: 8, h: 7}
  - component_type: table
    workflow_tag: oncoanalyser
    data_collection_tag: purple_somatic_variants
    use: purple/somatic_variants
    row_selection_enabled: true
    row_selection_column: variant_key
    columns: [gene, hgvs_p, coding_effect, purple_af, variant_copy_number, variant_type, sample, chrom, pos, biallelic, hotspot, reported]
    section: Variant detail
    tag: oa-sv-table-variants
    index: sv-table-variants
    title: Somatic small variants
    description: Gene, protein change, coding effect, allele frequency, copy number and locus of every PASS call. Select a row to open its record.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: oncoanalyser
    data_collection_tag: purple_somatic_variants
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: oa-sv-table-variants
      id_col: variant_key
      title_col: variant_key
      selection_source: table_selection
      sections:
        Call: [variant_key, sample, variant_type, tier, hotspot, reported, kataegis]
        Impact: [gene, transcript, canonical_effect, coding_effect, worst_coding_effect, hgvs_c, hgvs_p, splice_region]
        Allele frequency: [tumor_af, tumor_depth, tumor_alt_reads, purple_af, subclonal_likelihood]
        Copy number: [copy_number, variant_copy_number, minor_allele_copy_number, biallelic, germline_status]
        Context: [trinucleotide_context, gnomad_frequency, mappability]
    section: Variant detail
    tag: oa-sv-av-variant-record
    index: sv-variant-record
    title: Variant record
    description: The selected call's impact, allele frequency, copy number and sequence context.
    layout: {x: 5, y: 0, w: 3, h: 6}
