    description: The samples side by side; a sample with uniformly low scores has little spatial structure or too few spots.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 6}

  - component_type: table
    tag: sv-svg-table-genes
    section: Ranked genes
    workflow_tag: spatialvi
    data_collection_tag: sv-svg-genes
