# =============================================================================
# Spatially variable genes: ranked per sample, and compared.
# =============================================================================
- title: Spatially variable genes
  subtitle: Genes whose expression follows the tissue layout, ranked per sample by spatial autocorrelation
  advanced_viz_controls: header
  tab_order: 4
  tab_icon: mdi:waves
