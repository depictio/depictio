      labels:
        rank: Rank in the sample
        method: Statistic
        statistic: Value as written
        spatial_score: Spatial score
        pval: p-value
        qval: q-value (BH)
        neg_log10_qval: -log10 q-value
    title: Gene record
    description: The gene picked in the ranked table, its rank, statistic and significance in that sample.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 6}

# =============================================================================
