version: 1
# nf-core/spatialvi 1.0.0dev reference dashboard (dev branch, unreleased).
#
# Funnel: MultiQC (raw reads, Space Ranger curves, spots removed by the QC
# filter) -> Space Ranger QC (per-sample capture and sequencing metrics, the
# capture area) -> Tissue & spots (the hires tissue image with the spots the
# QC kept, coloured by Leiden cluster; lasso to the spot table and a spot
# record) -> Spatially variable genes (ranked per sample, score distributions,
# samples side by side; gene record) -> Integration (integrated clusters:
# composition per sample, agreement with the per-sample clusters, on tissue).
#
# Pinned on every tab: the four-card glance strip, the sample sheet and the
# Sample / {GROUP_COL_DISPLAY} filters. Each tab adds an open filter section on
# its own collections. The image and the spot tables read one sample, the
# IMAGE_SAMPLE template variable: the stores name their elements after the
# sample, and a collection reads one element path. The viewer takes no sample
# binding for that reason (its store is the merged one, not a per-sample one).
main_dashboard:
  title: nf-core/spatialvi
  subtitle: "nf-core/spatialvi (dev): Visium QC, the tissue image with its spots and clusters, spatially variable genes and integrated clusters"
  advanced_viz_controls: header
  project_tag: Visium Spatial Transcriptomics
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab through the project links
    persistent: true
    pin: top
  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: The run in four numbers, on every tab
    persistent: true
    pin: top
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The sample hub every other tab is filtered by
    collapsed: true
    persistent: true
    pin: top
  - name: Space Ranger curves
    icon: mdi:chart-line
    color: indigo
    description: Space Ranger count's genes and saturation curves, as MultiQC reports them
  - name: Read quality
    icon: mdi:chart-bell-curve
    color: blue
    description: FastQC on the raw reads
  - name: Spot filtering
    icon: mdi:filter-variant
    color: cyan
    description: Spots and genes the pipeline's QC filter removed, per sample
  components:
  # ------------------------------------------------------------- at a glance
  - component_type: card
    tag: sv-glance-card-samples
    index: sv-glance-card-samples
    section: Run at a glance
    workflow_tag: spatialvi
    data_collection_tag: samples
    aggregation: count
    column_name: sample
    column_type: object
    display: {icon_name: 'mdi:test-tube', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Samples
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: sv-glance-card-spots
    index: sv-glance-card-spots
    section: Run at a glance
    workflow_tag: spatialvi
    data_collection_tag: sv-qc-metrics
    use: spaceranger/metrics_summary
    aggregation: sum
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    column_name: spots_under_tissue
    column_type: int64
    display: {icon_name: 'mdi:map-marker-outline', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Spots under tissue
    description: Spots Space Ranger called under tissue, summed over the samples it ran on.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: sv-glance-card-reads
    index: sv-glance-card-reads
    section: Run at a glance
    workflow_tag: spatialvi
    data_collection_tag: sv-qc-metrics
    use: spaceranger/metrics_summary
    aggregation: sum
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    column_name: number_of_reads
    column_type: int64
    display: {icon_name: 'mdi:dna', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Reads sequenced
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: sv-glance-card-svg
    index: sv-glance-card-svg
    section: Run at a glance
    workflow_tag: spatialvi
    data_collection_tag: sv-svg-genes
    use: squidpy/spatial_autocorr
    aggregation: sum
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    column_name: significant_flag
    column_type: int64
    display: {icon_name: 'mdi:waves', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Spatially variable genes
    description: Genes with a spatial autocorrelation q-value below 0.05, summed over the samples.
    layout: {x: 6, y: 0, w: 2, h: 2}

  # ------------------------------------------------------------ sample sheet
  - component_type: text
    tag: sv-sheet-intro
    section: Sample sheet
    title: Samples of the run
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per sample, with how it entered the pipeline and the design
      columns of the sample sheet. Picking samples or a group here narrows
      every tab.
    workflow_tag: spatialvi
    data_collection_tag: samples
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: sv-sheet-table
    section: Sample sheet
    workflow_tag: spatialvi
    data_collection_tag: samples
    title: Sample sheet
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 5}

  # ---------------------------------------------------------- sample filters
  - component_type: interactive
    tag: sv-filter-sample
    index: sv-sample-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: spatialvi
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:test-tube'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: sv-filter-group
    index: sv-group-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: spatialvi
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: "{GROUP_COL}"
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:account-group-outline'}
    placement: left
    title: "{GROUP_COL_DISPLAY}"
    layout: {x: 0, y: 3, w: 1, h: 3}

  # ------------------------------------------------------ space ranger curves
  - component_type: text
    tag: sv-mqc-intro
    section: Space Ranger curves
    title: From reads to spots
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      MultiQC's view of the run: Space Ranger's genes and saturation curves,
      the raw-read quality and the spots the QC filter removed. The Space
      Ranger QC tab reads the per-sample metrics as a table.
    workflow_tag: spatialvi
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: sv-mqc-sr-genes
    section: Space Ranger curves
    workflow_tag: spatialvi
    data_collection_tag: multiqc_data
    selected_module: spaceranger
    selected_plot: "Count - Median genes"
    use: multiqc/spaceranger
    title: Median genes per spot
    description: Median genes per spot against downsampled depth; a curve still climbing means more reads would find more genes.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: sv-mqc-sr-saturation
    section: Space Ranger curves
    workflow_tag: spatialvi
    data_collection_tag: multiqc_data
    selected_module: spaceranger
    selected_plot: "Count - Saturation plot"
    use: multiqc/spaceranger
    title: Sequencing saturation
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: sv-mqc-sr-gdna
    section: Space Ranger curves
    workflow_tag: spatialvi
    data_collection_tag: multiqc_data
    selected_module: spaceranger
    selected_plot: "Count - UMIs from Genomic DNA"
    use: multiqc/spaceranger
    title: UMIs from genomic DNA
    description: Probe-based assays only; the share of UMIs Space Ranger attributes to genomic DNA rather than RNA.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 8, h: 5}

  # ------------------------------------------------------------- read quality
  - component_type: multiqc
    tag: sv-mqc-fastqc-counts
    section: Read quality
    workflow_tag: spatialvi
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Counts
    use: multiqc/fastqc
    title: Sequence counts
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: multiqc
    tag: sv-mqc-fastqc-quality
    section: Read quality
    workflow_tag: spatialvi
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Per Sequence Quality Scores
    use: multiqc/fastqc
    title: Per-sequence quality scores
    title_size: sm
    title_align: left
    layout: {x: 4, y: 0, w: 4, h: 5}
  - component_type: multiqc
    tag: sv-mqc-fastqc-gc
    section: Read quality
    workflow_tag: spatialvi
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Per Sequence GC Content
    use: multiqc/fastqc
    title: GC content
    title_size: sm
    title_align: left
    layout: {x: 0, y: 5, w: 4, h: 5}
  - component_type: multiqc
    tag: sv-mqc-fastqc-dup
    section: Read quality
    workflow_tag: spatialvi
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Duplication Levels
    use: multiqc/fastqc
    title: Sequence duplication levels
    title_size: sm
    title_align: left
    layout: {x: 4, y: 5, w: 4, h: 5}

  # ----------------------------------------------------------- spot filtering
  - component_type: multiqc
    tag: sv-mqc-quality-controls
    section: Spot filtering
    workflow_tag: spatialvi
    data_collection_tag: multiqc_data
    selected_module: quality_controls
    selected_plot: quality_controls-section
    title: Spots and genes removed by the QC filter
    description: Per sample, the spots outside tissue or below the count, gene and content thresholds of the run, and the genes seen in too few spots.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 5}

tabs:
# =============================================================================
# Space Ranger QC: capture and sequencing, per sample.
# =============================================================================
- title: Space Ranger QC
  subtitle: Capture, sequencing and mapping metrics of every sample Space Ranger ran on
  advanced_viz_controls: header
  tab_order: 2
  tab_icon: mdi:shield-check-outline
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Space Ranger filters
    icon: mdi:tune
    color: indigo
    description: Spots under tissue and assay on the metrics, tissue call on the capture spots
  grid_sections:
  - name: Capture and sequencing
    icon: mdi:shield-check-outline
    color: indigo
    description: Genes, UMIs, saturation and tissue coverage per sample
  - name: Depth and mapping
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Whether the samples were sequenced deeply enough and mapped well
  - name: Capture area
    icon: mdi:map-marker-outline
    color: blue
    description: The capture array of each sample, spots under and outside tissue
  - name: Space Ranger metrics
    icon: mdi:table
    color: gray
    description: One row per sample, every metric
  - name: Sample detail
    icon: mdi:information-outline
    color: gray
    description: The sample picked in the metrics table
  components:
  - component_type: interactive
    tag: sv-sr-filter-spots
    index: sv-sr-spots-range
    section: Space Ranger filters
    group: Space Ranger scope
    workflow_tag: spatialvi
    data_collection_tag: sv-qc-metrics
    use: spaceranger/metrics_summary
    interactive_component_type: RangeSlider
    column_name: spots_under_tissue
    column_type: int64
    display: {title_size: md, custom_color: '#3949AB', icon_name: 'mdi:map-marker-outline'}
    placement: left
    title: Spots under tissue
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: sv-sr-filter-assay
    index: sv-sr-assay-filter
    section: Space Ranger filters
    group: Space Ranger scope
    workflow_tag: spatialvi
    data_collection_tag: sv-qc-metrics
    interactive_component_type: MultiSelect
    column_name: assay
    column_type: object
    display: {title_size: md, custom_color: '#3949AB', icon_name: 'mdi:dna'}
    placement: left
    title: Assay
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: sv-sr-filter-tissue
    index: sv-sr-tissue-filter
    section: Space Ranger filters
    group: Space Ranger scope
    workflow_tag: spatialvi
    data_collection_tag: sv-qc-spots
    use: spaceranger/tissue_positions
    interactive_component_type: MultiSelect
    column_name: tissue_call
    column_type: object
    display: {title_size: md, custom_color: '#3949AB', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Tissue call
    layout: {x: 0, y: 6, w: 1, h: 3}

  - component_type: text
    tag: sv-sr-intro
    section: Capture and sequencing
    title: Did each capture area work?
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Genes and UMIs per spot under tissue, saturation and the share of the
      capture area the tissue covers, one strip per sample. Read depth
      against genes below, then the capture array itself.
    workflow_tag: spatialvi
    data_collection_tag: sv-qc-metrics
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: sv-sr-card-genes
    index: sv-sr-card-genes
    section: Capture and sequencing
    workflow_tag: spatialvi
    data_collection_tag: sv-qc-metrics
    use: spaceranger/metrics_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: median_genes_per_spot
    column_type: float64
    display: {icon_name: 'mdi:dna', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Median genes per spot
    description: Median of the per-sample medians; the strip shows their spread.
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sv-sr-card-umis
    index: sv-sr-card-umis
    section: Capture and sequencing
    workflow_tag: spatialvi
    data_collection_tag: sv-qc-metrics
    use: spaceranger/metrics_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: median_umi_per_spot
    column_type: float64
    display: {icon_name: 'mdi:counter', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Median UMIs per spot
    description: Median of the per-sample medians; the strip shows their spread.
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sv-sr-card-saturation
    index: sv-sr-card-saturation
    section: Capture and sequencing
    workflow_tag: spatialvi
    data_collection_tag: sv-qc-metrics
    use: spaceranger/metrics_summary
    aggregation: min
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: sequencing_saturation_pct
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Sequencing saturation (%)
    description: Lowest sample; the strip shows the spread across samples.
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sv-sr-card-tissue
    index: sv-sr-card-tissue
    section: Capture and sequencing
    workflow_tag: spatialvi
    data_collection_tag: sv-qc-metrics
    use: spaceranger/metrics_summary
    aggregation: min
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: fraction_spots_under_tissue_pct
    column_type: float64
    display: {icon_name: 'mdi:shape-outline', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Capture area under tissue (%)
    description: Lowest sample; the strip shows the spread across samples.
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: advanced_viz
    tag: sv-sr-av-depth
    index: sv-sr-av-depth
    section: Depth and mapping
    workflow_tag: spatialvi
    data_collection_tag: sv-qc-metrics
    viz_kind: scatter_xy
    use: spaceranger/depth_vs_genes
    config:
      viz_kind: scatter_xy
      x_col: mean_reads_under_tissue_per_spot
      y_col: median_genes_per_spot
      label_col: sample
      x_title: Mean reads per spot under tissue
      y_title: Median genes per spot
      selection_enabled: true
      selection_column: sample
    title: Depth against genes per spot
    description: One point per sample. A sample far below the others at the same depth captured less RNA per spot.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: figure
    tag: sv-sr-fig-mapping
    index: sv-sr-fig-mapping
    section: Depth and mapping
    workflow_tag: spatialvi
    data_collection_tag: sv-qc-metrics
    use: spaceranger/mapping_bars
    visu_type: bar
    dict_kwargs: {x: sample, y: reads_mapped_confidently_pct, color: sample}
    title: Reads mapped confidently (%)
    description: To the probe set on a probe-based assay, to the transcriptome otherwise.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 6}

  - component_type: advanced_viz
    tag: sv-sr-av-capture
    index: sv-sr-av-capture
    section: Capture area
    workflow_tag: spatialvi
    data_collection_tag: sv-qc-spots
    viz_kind: scatter_xy
    use: spaceranger/capture_area_map
    config:
      viz_kind: scatter_xy
      x_col: array_col
      y_col: array_row
      color_col: tissue_call
      label_col: spot_uid
      x_title: Capture array column
      y_title: Capture array row
      marker_size: 3
    title: Capture array
    description: Every spot of the capture area, coloured by Space Ranger's tissue call. Pick one sample in the sample filter to read one array.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 9}

  - component_type: table
    tag: sv-sr-table-metrics
    section: Space Ranger metrics
    workflow_tag: spatialvi
    data_collection_tag: sv-qc-metrics
    use: spaceranger/metrics_table
    row_selection_enabled: true
    row_selection_column: sample
    title: Space Ranger metrics
    description: One row per sample. Pick a row to read it below.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 6}

  - component_type: advanced_viz
    tag: sv-sr-av-record
    index: sv-sr-av-record
    section: Sample detail
    workflow_tag: spatialvi
    data_collection_tag: sv-qc-metrics
    use: spaceranger/sample_record
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: sample
      title_col: sample
      selection_source: table_selection
      linked_component: sv-sr-table-metrics
      sections:
        Capture: [assay, spots_under_tissue, fraction_spots_under_tissue_pct, fraction_reads_in_spots_under_tissue_pct]
        Sequencing: [number_of_reads, mean_reads_per_spot, mean_reads_under_tissue_per_spot, sequencing_saturation_pct, valid_barcodes_pct, valid_umis_pct]
        Quality: [q30_barcode_pct, q30_read_pct, q30_umi_pct, reads_mapped_pct, reads_mapped_confidently_pct]
        Spots: [median_genes_per_spot, median_umi_per_spot, genes_detected]
      labels:
        spots_under_tissue: Spots under tissue
        fraction_spots_under_tissue_pct: Capture area under tissue (%)
        fraction_reads_in_spots_under_tissue_pct: Reads in spots under tissue (%)
        number_of_reads: Reads
        mean_reads_per_spot: Mean reads per spot
        mean_reads_under_tissue_per_spot: Mean reads per spot under tissue
        sequencing_saturation_pct: Sequencing saturation (%)
        valid_barcodes_pct: Valid barcodes (%)
        valid_umis_pct: Valid UMIs (%)
        q30_barcode_pct: Q30 barcode (%)
        q30_read_pct: Q30 RNA or probe read (%)
        q30_umi_pct: Q30 UMI (%)
        reads_mapped_pct: Reads mapped (%)
        reads_mapped_confidently_pct: Reads mapped confidently (%)
        median_genes_per_spot: Median genes per spot
        median_umi_per_spot: Median UMIs per spot
        genes_detected: Genes detected
    title: Sample record
    description: The sample picked in the metrics table, every Space Ranger metric grouped.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 6}

# =============================================================================
# Tissue & spots: the tissue image with the spots the QC kept.
# =============================================================================
- title: Tissue & spots
  subtitle: The tissue image of one sample with the spots the QC filter kept, coloured by Leiden cluster
  advanced_viz_controls: header
  tab_order: 3
  tab_icon: mdi:microscope
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Spot filters
    icon: mdi:tune
    color: grape
    description: Cluster, UMIs and genes per spot; the viewer, the table and the cards follow
  grid_sections:
  - name: Spots in numbers
    icon: mdi:counter
    color: grape
    description: The spots of the image after the pipeline's QC filter
  - name: Tissue
    icon: mdi:microscope
    color: grape
    description: The hires tissue image with one point per spot; a lasso narrows the table below
  - name: Spot QC
    icon: mdi:chart-scatter-plot
    color: violet
    description: Counts, genes and clusters of the spots on the image
  - name: Spot detail
    icon: mdi:information-outline
    color: gray
    description: The spot picked in the spot table
  components:
  - component_type: interactive
    tag: sv-ts-filter-cluster
    index: sv-ts-cluster-filter
    section: Spot filters
    group: Spot scope
    workflow_tag: spatialvi
    data_collection_tag: spatialdata_visium_spots
    use: spatialdata/visium_spots
    interactive_component_type: MultiSelect
    column_name: cluster
    column_type: object
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:chart-donut'}
    placement: left
    title: Leiden cluster
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: sv-ts-filter-counts
    index: sv-ts-counts-range
    section: Spot filters
    group: Spot scope
    workflow_tag: spatialvi
    data_collection_tag: spatialdata_visium_spots
    use: spatialdata/visium_spots
    interactive_component_type: RangeSlider
    column_name: total_counts
    column_type: float64
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:counter'}
    placement: left
    title: UMIs per spot
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: sv-ts-filter-genes
    index: sv-ts-genes-range
    section: Spot filters
    group: Spot scope
    workflow_tag: spatialvi
    data_collection_tag: spatialdata_visium_spots
    use: spatialdata/visium_spots
    interactive_component_type: RangeSlider
    column_name: n_genes
    column_type: int64
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:dna'}
    placement: left
    title: Genes per spot
    layout: {x: 0, y: 6, w: 1, h: 3}

  - component_type: text
    tag: sv-ts-intro
    section: Spots in numbers
    title: Where the clusters sit in the tissue
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The spots the QC filter kept, over the tissue they were captured from and
