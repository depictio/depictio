- title: ID mapping
  subtitle: How many gene ids of each dataset map to an Ensembl gene?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:tag-outline
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Mapping filters
    icon: mdi:filter-variant
    color: cyan
    description: Narrow by what became of the ids or of the dataset
  grid_sections:
  - name: Mapping at a glance
    icon: mdi:counter
    color: cyan
    description: Gene ids in, the share kept, genes per dataset and rare genes dropped
  - name: Fate per dataset
    icon: mdi:chart-bar
    color: cyan
    description: Each dataset's ids by fate, as shares of what it came with
  - name: Fate of the gene ids
    icon: mdi:chart-bar
    color: cyan
    description: Ids kept, collapsed, rare or unmapped, by platform and by share
  - name: Mapping table
    icon: mdi:table
    color: gray
    description: The ids of every dataset by fate
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      Each dataset names its genes its own way: probe sets for a microarray, Ensembl ids of
      some release for RNA-seq. [g:Profiler](https://biit.cs.ut.ee/gprofiler/convert) maps them
      to Ensembl genes; ids of the same gene collapse into one, and genes seen in too few
      datasets are dropped as rare. A dataset whose ids map to nothing (an array design
      g:Profiler does not know) leaves the run here.
    tag: se-id-intro
    index: id-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_id_mapping
    interactive_component_type: MultiSelect
    column_name: fate
    column_type: object
    display:
      icon_name: mdi:tag-outline
      custom_color: cyan
    section: Mapping filters
    group: Gene ids
    tag: se-id-filter-fate
    index: id-fate-filter
    title: Fate of the ids
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_id_mapping
    interactive_component_type: MultiSelect
    column_name: outcome
    column_type: object
    display:
      icon_name: mdi:check-decagram-outline
      custom_color: green
    section: Mapping filters
    group: Gene ids
    tag: se-id-filter-outcome
    index: id-outcome-filter
    title: Dataset outcome
    layout: {x: 0, y: 2, w: 1, h: 2}
  - component_type: card
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_id_mapping
    use: stableexpression/id_fates
    aggregation: sum
    column_name: gene_ids
    column_type: int64
    secondary_layout: composition
    breakdown_col: fate
    display:
      icon_name: mdi:tag-outline
      icon_color: cyan
      caption: ids in, by fate
      format: si
    section: Mapping at a glance
    tag: se-id-card-ids
    index: id-card-ids
    title: Gene ids
    description: Ids the datasets came with, summed over the datasets, split by what became of them.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_id_mapping
    aggregation: median
    column_name: share
    column_type: float64
    filter_expr: col('fate') == 'Kept'
    secondary_layout: histogram
    display:
      icon_name: mdi:percent-outline
      icon_color: blue
      caption: median per dataset, with its spread
      format: percent
    section: Mapping at a glance
    tag: se-id-card-share
    index: id-card-share
    title: Ids kept
    description: Share of a dataset's ids kept as genes of the merged matrix, the median over the datasets.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_id_mapping
    aggregation: median
    column_name: gene_ids
    column_type: int64
    filter_expr: (col('fate') == 'Kept') & (col('gene_ids') > 0)
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:dna
      icon_color: green
      caption: median per mapped dataset, with its spread
      format: si
    section: Mapping at a glance
    tag: se-id-card-genes
    index: id-card-genes
    title: Genes per dataset
    description: Genes a mapped dataset contributes to the merged matrix, after collapsing and rare genes.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_id_mapping
    aggregation: sum
    column_name: gene_ids
    column_type: int64
    filter_expr: col('fate') == 'Rare gene'
    secondary_layout: top_n
    breakdown_col: platform
    top_n_count: 2
    display:
      icon_name: mdi:filter-remove-outline
      icon_color: orange
      caption: rare-gene ids, by platform
      format: si
    section: Mapping at a glance
    tag: se-id-card-rare
    index: id-card-rare
    title: Rare genes
    description: Ids of genes seen in too few datasets, which the pipeline drops before merging.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_id_mapping
    viz_kind: stacked_taxonomy
    config:
      viz_kind: stacked_taxonomy
      sample_id_col: platform
      taxon_col: fate
      rank_col: null
      abundance_col: gene_ids
      normalise_to_one: true
      sample_sort: category
      sort_category: Kept
      y_zoom: auto
      top_n: 4
      value_title: Share of the ids
      hidden_controls: [rank, top_n, group]
    section: Fate of the gene ids
    tag: se-id-fig-platform
    index: id-platform-bars
    title: Fate of the ids by platform
    description: Every dataset of a platform pooled, its ids split by fate. Kept fills most of each bar, so the axis starts near the smallest kept share (the // marks the cut); switch Zoom off for the whole bar.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_id_mapping
    visu_type: histogram
    dict_kwargs:
      x: share
      color: fate
      nbins: 20
      barmode: overlay
      category_orders: {fate: [Kept, Collapsed, Rare gene, Unmapped]}
      labels: {share: Share of the dataset's ids, fate: ''}
    section: Fate of the gene ids
    tag: se-id-fig-share
    index: id-share-histogram
    title: Shares per dataset, by fate
    description: Datasets by the share of their ids in each fate; kept near 1 is a clean mapping.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: advanced_viz
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_id_mapping
    viz_kind: stacked_taxonomy
    config:
      viz_kind: stacked_taxonomy
      sample_id_col: dataset
      taxon_col: fate
      rank_col: null
      abundance_col: gene_ids
      normalise_to_one: true
      sample_sort: category
      sort_category: Kept
      group_col: platform
      y_zoom: auto
      top_n: 4
      value_title: Share of the dataset's ids
      hidden_controls: [rank, top_n]
    section: Fate per dataset
    tag: se-id-fig-datasets
    index: id-dataset-bars
    title: Fate of the ids, dataset by dataset
    description: One bar per dataset, its ids split by fate, grouped by platform and sorted by the share kept. Sort by name, total or another fate, or regroup, from the controls; Normalise off shows the id counts.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_id_mapping
    row_selection_enabled: true
    row_selection_column: fate_key
    section: Mapping table
    tag: se-id-table
    index: id-table
    title: Gene ids by dataset and fate
    description: One row per dataset and fate, with the ids and their share of the dataset's ids.
    layout: {x: 0, y: 0, w: 8, h: 6}
