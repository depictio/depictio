    aggregation: count
    column_name: gene_id
    column_type: object
    secondary_layout: composition
    breakdown_col: expression_level
    display:
      icon_name: mdi:sort-numeric-ascending
      icon_color: grape
      caption: by the pipeline's expression level
    section: Ranking at a glance
    tag: se-rank-card-genes
    index: rank-card-genes
    title: Genes ranked
    description: The best-ranked candidates of each section kept for the ranking, split by expression level.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_stable_gene_distribution
    aggregation: min
    column_name: stability_score
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:trophy-outline
      icon_color: green
      caption: the lowest, with the spread of the ranked genes
      decimals: 3
    section: Ranking at a glance
    tag: se-rank-card-best
    index: rank-card-best
    title: Best score
    description: Stability score of the steadiest ranked gene; the box spreads the scores of every gene in view.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_stable_gene_distribution
    use: stableexpression/ranked_measured_share
    aggregation: median
    column_name: measured_share
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:percent-outline
      icon_color: teal
      caption: median per gene, with its spread
      format: percent
    section: Ranking at a glance
    tag: se-rank-card-measured
    index: rank-card-measured
    title: Samples measured
    description: Share of the cohort's samples that measured a ranked gene; the pipeline imputes the rest.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_stable_gene_distribution
    aggregation: median
    column_name: sd
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: blue
      caption: median standard deviation per gene
      decimals: 3
    section: Ranking at a glance
    tag: se-rank-card-sd
    index: rank-card-sd
    title: Spread
    description: Standard deviation of a ranked gene's normalised expression over the samples that measured it.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_stable_gene_distribution
    use: stableexpression/stability_ranking
    viz_kind: ranked_distribution
    config:
      viz_kind: ranked_distribution
      feature_id_col: gene_id
      score_col: stability_score
      rank_col: section_rank
      label_col: gene_name
      group_col: section
