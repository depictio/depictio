    tag: se-sec-card-levels
    index: sec-card-levels
    title: Expression levels
    description: Genes split by the pipeline's five expression levels, from very high to very low.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_stability
    use: stableexpression/score_by_section
