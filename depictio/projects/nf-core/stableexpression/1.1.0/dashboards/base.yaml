      orientation: horizontal
      score_label: Stability score (lower is steadier)
      value_label: Normalised expression (0 to 1)
      log_value: false
      max_features: 500
      selection_enabled: true
    section: Most stable genes
    tag: se-rank-av-distribution
    index: rank-distribution
    title: The best genes of each section
    description: >-
      Ten genes, the best of each section, then the second best as Top N grows; colour is the
      section. Boxes over every sample, from statistics the recipe computed (the matrix is too large
      to ship); the violins are below, drawn from each sample's value.
