      icon_name: mdi:percent-outline
      icon_color: teal
      caption: median per candidate, with its spread
      format: percent
    section: Candidates at a glance
    tag: se-cand-card-measured
    index: cand-card-measured
    title: Samples measured
    description: Share of the cohort's samples that measured a candidate; the missing ones add to its score.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_stability
    aggregation: median
    column_name: genorm_m
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: grape
      caption: median M, with its spread
      decimals: 2
    section: Candidates at a glance
    tag: se-cand-card-genorm
    index: cand-card-genorm
    title: geNorm M
    description: geNorm's M measure, the mean variation of a gene's ratio to every other candidate; lower is steadier.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_score_components
    viz_kind: stacked_taxonomy
    config:
      viz_kind: stacked_taxonomy
      sample_id_col: section
      taxon_col: component
      rank_col: null
      abundance_col: contribution
      normalise_to_one: true
      sample_sort: name
      top_n: 5
      value_title: Share of the score
      hidden_controls: [rank, top_n, group]
    section: Score parts
    tag: se-cand-fig-parts
    index: cand-parts
    title: The score of each section, part by part
    description: What each measure adds to the score of a section's candidates, as a share of it; sort by a part to see where it weighs most. Normalise off stacks the summed parts, so the bar's height is the section's total score.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_stability
    use: stableexpression/measure_agreement
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: normfinder_rank
      y_col: genorm_rank
      label_col: gene_name
      label_order_col: section_rank
      color_col: section
      x_title: Normfinder rank in the section (1 = steadiest)
      y_title: geNorm M rank in the section
      log_x: true
      log_y: true
      reference_line: diagonal
      top_n_labels: 10
      legend_pos: bottom
      selection_enabled: true
      selection_column: gene_id
    section: Measure agreement
    tag: se-cand-av-measures
    index: cand-measures
    title: Do Normfinder and geNorm agree?
    description: >-
      Each candidate's rank by Normfinder against its rank by geNorm M, within its section (log
      axes, so the best ranks spread out). Near the dashed diagonal both measures agree; bottom
      left is steady by both, the candidate to trust. A gene far off the diagonal is good by one
      measure only. Labels name each section's leader.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_stability
    use: stableexpression/candidate_table
    row_selection_enabled: true
    row_selection_column: gene_id
    section: Candidate detail
    tag: se-cand-table
    index: cand-table
    title: Candidate genes
    description: Every candidate with its ranks, score, measures and score parts. Select a row to open its record.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_stability
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: se-cand-table
      id_col: gene_id
      title_col: gene_name
      selection_source: table_selection
      sections:
        Gene: [gene_name, gene_id, description, section, expression_level, platforms, source_ids]
        Rank: [stability_score, section_rank, overall_rank]
        Score parts: [normfinder_part, genorm_part, cv_part, robust_cv_part, missing_penalty]
        Measures: [normfinder_stability, genorm_m, cv, robust_cv, rnaseq_cv, microarray_cv]
        Expression: [mean, median, measured_share, zero_share]
      link_templates:
        gene_id: https://www.ensembl.org/id/{value}
    section: Candidate detail
    tag: se-cand-av-record
    index: cand-record
    title: Candidate record
    description: The selected candidate, with its ranks, the parts of its score and its expression.
    layout: {x: 5, y: 0, w: 3, h: 6}
- title: Sections
  subtitle: How does stability change with expression level?
  tab_group: Stability
  tab_order: 5
  tab_icon: mdi:layers-outline
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Gene scope
    icon: mdi:filter-variant
    color: indigo
    description: Narrow by expression level, candidacy or platforms
  grid_sections:
  - name: Genes at a glance
    icon: mdi:counter
    color: indigo
    description: Genes of the matrix, their spread, measured share and levels
  - name: Stability by section
    icon: mdi:chart-box-outline
    color: indigo
    description: Candidate scores and every gene's spread, one box per section
  - name: Expression and spread
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Every gene by mean expression and coefficient of variation
  - name: Gene table
    icon: mdi:table
    color: gray
    description: Every gene of the matrix with its statistics
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      The pipeline cuts the genes into sections of equal size by mean expression and ranks
      candidates within each one, because a lowly expressed gene varies more by nature and a
      single ranking would favour one end of the range. Compare the boxes left to right: the
      scores rise or fall with expression level, the coefficient of variation of every gene
      rises as expression falls.
    tag: se-sec-intro
    index: sec-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_statistics
    interactive_component_type: MultiSelect
    column_name: expression_level
    column_type: object
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: indigo
    section: Gene scope
    group: Genes
    tag: se-sec-filter-level
    index: sec-level-filter
    title: Expression level
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_statistics
    interactive_component_type: MultiSelect
    column_name: candidate
    column_type: object
    display:
      icon_name: mdi:check-decagram-outline
      custom_color: green
    section: Gene scope
    group: Genes
    tag: se-sec-filter-candidate
    index: sec-candidate-filter
    title: Candidacy
    layout: {x: 0, y: 2, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_statistics
    interactive_component_type: MultiSelect
    column_name: platforms
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Gene scope
    group: Genes
    tag: se-sec-filter-platforms
    index: sec-platforms-filter
    title: Measured by
    layout: {x: 0, y: 4, w: 1, h: 2}
  - component_type: card
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_statistics
    use: stableexpression/gene_count
    aggregation: count
    column_name: gene_id
    column_type: object
    secondary_layout: donut
    breakdown_col: candidate
    display:
      icon_name: mdi:dna
      icon_color: indigo
      caption: genes, the candidates scored
      format: si
    section: Genes at a glance
    tag: se-sec-card-genes
    index: sec-card-genes
    title: Genes
    description: Genes of the merged matrix in view; the ring shows the share put forward as candidates.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_statistics
    aggregation: median
    column_name: cv
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: blue
      caption: median per gene, with its spread
      decimals: 2
    section: Genes at a glance
    tag: se-sec-card-cv
    index: sec-card-cv
    title: Coefficient of variation
    description: Standard deviation over mean of a gene's normalised expression, the median over the genes in view.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_statistics
    use: stableexpression/gene_measured_share
    aggregation: median
    column_name: measured_share
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:percent-outline
      icon_color: teal
      caption: median per gene, with its spread
      format: percent
    section: Genes at a glance
    tag: se-sec-card-measured
    index: sec-card-measured
    title: Samples measured
    description: Share of the cohort's samples that measured a gene, the median over the genes in view.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_statistics
