version: 1
# nf-core/stableexpression 1.1.0, on the family rules of depictio/projects/nf-core/RULES.md
# (ampliseq/2.18.0 is the reference implementation).
#
# Funnel: which public datasets reached the merged matrix, and with how many
# samples (Datasets) and gene ids (ID mapping), under Data & QC -> which genes
# are the most stable at each expression level (Ranking) -> what makes a
# candidate stable, measure by measure (Candidates) -> how stability changes
# with expression level (Sections), under Stability.
#
# The pipeline publishes no MultiQC report on the pinned run (its MULTIQC task
# failed; a 1.1.0 report holds custom content only), so there is no MultiQC tab.
# Its Dash app (reporting/dash_app/, not published either) is the design
# reference: the expression of the best gene of each section as horizontal
# boxes, with the score table beside it. The Ranking tab opens on that view.
#
# Two axes. The samples hub (`samples`) is what the sample filters start from:
# its links carry a pick to the dataset collections by dataset and to the
# per-sample values of the Ranking tab by sample. The gene collections have no
# sample axis (a stability score is a statistic of the whole cohort), so their
# tabs filter from their own gene filters; their links carry a section or gene
# pick between them by gene id.
#
# Routes: NO_ID_MAPPING (--skip_id_mapping) prunes the ID mapping collection,
# with the ID mapping tab, one pipeline step value and nothing else.
main_dashboard:
  title: nf-core/stableexpression
  subtitle: The most stable genes across public expression datasets, section by section
  project_tag: stableexpression Gene Stability
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family.
  category_colors:
    '{GROUP_COL}': auto
    # Ten sections by default (--nb_sections), most expressed first: a
    # colour-blind-safe sequential ramp, so neighbouring sections look alike.
    section:
      Section 01: '#440154'
      Section 02: '#482878'
      Section 03: '#3e4989'
      Section 04: '#31688e'
      Section 05: '#26828e'
      Section 06: '#1f9e89'
      Section 07: '#35b779'
      Section 08: '#6ece58'
      Section 09: '#b5de2b'
      Section 10: '#fde725'
      '*': auto
    expression_level:
      Very high expression: '#5f3dc4'
      High expression: '#1c7ed6'
      Medium range: '#0ca678'
      Low expression: '#f59f00'
      Very low expression: '#e8590c'
    candidate:
      Candidate: '#2f9e44'
      Not a candidate: '#adb5bd'
    outcome:
      Merged: '#2f9e44'
      No gene mapped: '#e8590c'
      Only rare genes: '#f59f00'
      All samples filtered out: '#c92a2a'
    fate:
      Kept: '#2f9e44'
      Collapsed: '#1c7ed6'
      Rare gene: '#f59f00'
      Unmapped: '#adb5bd'
    component:
      Normfinder: '#1c7ed6'
      geNorm M: '#ae3ec9'
      Coefficient of variation: '#0ca678'
      Robust CV: '#74b816'
      Missing values: '#adb5bd'
    status:
      Analysed: '#2f9e44'
      Filtered out: '#adb5bd'
    platforms: auto
    step: auto
    # The two platforms keep one colour on every tab: the dataset plots, the id
    # mapping plots and the sample filters.
    platform:
      Microarray: '#1c7ed6'
      RNA-seq: '#e8590c'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. All
  # three are bound to the samples hub, the source of every sample link.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Narrows the dataset tabs and the per-sample values
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow the dataset and sample counts only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab, which no route removes.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The public samples behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with a card (Samples, below).
  - component_type: interactive
    workflow_tag: stableexpression
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Key figures
    tag: se-ov-kf-group
    index: ov-kf-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: stableexpression
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: dataset
    column_type: object
    display:
      icon_name: mdi:database-outline
      custom_color: blue
      strip_label: Dataset
    section: Key figures
    tag: se-ov-kf-dataset
    index: ov-kf-dataset
    title: Dataset
    layout: {x: 2, y: 0, w: 2, h: 1}
  # The pipeline's wordmark, read from its repository; where it cannot load (no
  # internet), the title is drawn as text.
  - component_type: text
    title: nf-core/stableexpression
    logo: https://raw.githubusercontent.com/nf-core/stableexpression/master/docs/images/nf-core-stableexpression_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/stableexpression/master/docs/images/nf-core-stableexpression_logo_dark.png
    order: 1
    body: >
      Every public expression dataset of one species, merged into one matrix, and the genes
      whose expression holds steadiest across all of their samples, at each expression level:
      the reference genes a qPCR assay can trust. [Run parameters](params:)
    tag: se-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  # The study: the public datasets the run merged, from the sample hub. The run has no
  # samplesheet of its own (it takes a species), so the sheet line names no input.
  - component_type: text
    surface: card
    values:
      datasets: {dc: samples, column: dataset, aggregation: nunique, format: integer}
      samples: {dc: samples, column: sample, aggregation: count, filter_expr: "col('status') == 'Analysed'", format: si}
      platforms: {dc: samples, column: platform, aggregation: nunique, format: integer}
      top_platform: {dc: samples, column: platform, aggregation: top}
      conditions: {dc: samples, column: condition, aggregation: nunique, format: integer}
    body: |
      ### The study
      - ![](icon:mdi:database-outline) **Datasets** {{datasets}} merged, {{samples}} samples analysed
      - ![](icon:mdi:chip) **Platforms** {{platforms}}, mostly {{top_platform}}
      - ![](icon:mdi:shape-outline) **Conditions** {{conditions}} across the datasets
      - ![](icon:mdi:file-table-outline) **Sample sheet** [one row per public sample](section:Sample sheet)
      - ![](icon:mdi:palette-outline) **Section** {{legend:section}}
    tag: se-ov-study
    index: ov-study
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash.
  - component_type: text
    surface: card
    values:
      genes: {dc: stableexpression_gene_statistics, column: gene_id, aggregation: count, format: si}
    body: |
      ### The run
      - ![](icon:mdi:source-branch) **Pipeline** nf-core/stableexpression 1.1.0
      - ![](icon:mdi:earth) **Species** {{param:species}}
      - ![](icon:mdi:dna) **Genes** {{genes}} in the matrix
      - ![](icon:mdi:layers-outline) **Sections** {{param:nb_sections}}, {{param:nb_candidates_per_section}} candidates each
    tag: se-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  # The marks take the family's colour (the header's), not the theme's blue.
  # The Map step cites the ID mapping collection, so a --skip_id_mapping run
  # (NO_ID_MAPPING) drops it with its data.
  - component_type: text
    surface: card
    accent: green
    values:
      n_ids: {dc: stableexpression_id_mapping, column: gene_ids, aggregation: sum, format: si}
      n_cand: {dc: stableexpression_gene_stability, column: gene_id, aggregation: count, format: si}
    body: |
      ### Five steps from public datasets to reference genes
      Each step names its settings and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:import) **Download** Expression Atlas datasets of the species · [Settings](params:species) · [Datasets](tab:Datasets)
      2. ![](icon:mdi:tag-outline) **Map** {{n_ids}} gene ids to Ensembl with g:Profiler · [Settings](params:gprofiler_target_db) · [ID mapping](tab:ID mapping)
      3. ![](icon:mdi:filter-remove-outline) **Filter** Samples with too many zeros or gaps, then normalise · [Settings](params:max_zero_ratio) · [Datasets](tab:Datasets)
      4. ![](icon:mdi:scale-balance) **Score** {{n_cand}} candidates with Normfinder, geNorm and two CVs · [Settings](params:stability_score_weights) · [Candidates](tab:Candidates)
      5. ![](icon:mdi:trophy-outline) **Rank** The steadiest genes of each expression section · [Settings](params:nb_sections) · [Ranking](tab:Ranking)
      :::
    tag: se-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/stableexpression downloads the public RNA-seq and microarray datasets of a species, maps their gene ids to Ensembl, filters and normalises every dataset, merges them and scores the steadiest genes of each expression section. This page sums up one run; each tab behind it answers one question, in the order of the steps above.

      The sample filters in the left panel narrow the dataset tabs and the per-sample values. Scores are statistics of the whole cohort, so the gene tabs filter by section, level and score instead.
    tag: se-ov-about
    index: ov-about
    layout: {x: 0, y: 7, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. All four read collections every route writes.
  - component_type: card
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_dataset_summary
    use: stableexpression/dataset_attrition
    aggregation: sum
    column_name: downloaded
    column_type: int64
    secondary_layout: attrition
    attrition_cols: [id_mapped, merged]
    display:
      icon_name: mdi:database-outline
      icon_color: blue
      caption: downloaded, then ID-mapped and merged
      link: tab:Datasets
    section: Key figures
    tag: se-ov-kf-datasets
    index: ov-kf-datasets
    title: Datasets
    description: Public datasets the run downloaded. The strip follows them through the gene ID mapping to the merged matrix.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: stableexpression
    data_collection_tag: samples
    aggregation: count
    column_name: sample
    column_type: object
    filter_expr: col('status') == 'Analysed'
    secondary_layout: composition
    breakdown_col: '{GROUP_COL}'
    display:
      icon_name: mdi:flask-outline
      icon_color: teal
      caption: in the merged matrix, by {GROUP_COL_DISPLAY}
      link: tab:Datasets
      format: si
    section: Key figures
    tag: se-ov-kf-samples
    index: ov-kf-samples
    title: Samples
    description: Public samples that passed every filter into the merged matrix. The bar splits them by {GROUP_COL_DISPLAY}.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_statistics
    use: stableexpression/gene_count
    aggregation: count
    column_name: gene_id
    column_type: object
    secondary_layout: donut
    breakdown_col: candidate
    display:
      icon_name: mdi:dna
      icon_color: violet
      caption: genes measured, the candidates scored
      link: tab:Sections
      format: si
    section: Key figures
    tag: se-ov-kf-genes
    index: ov-kf-genes
    title: Genes
    description: Genes of the merged matrix. The ring shows the share each expression section put forward as candidates and scored.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_stability
    use: stableexpression/best_score
    aggregation: min
    column_name: stability_score
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:trophy-outline
      icon_color: green
      caption: the lowest, with the spread of all candidates
      link: tab:Ranking
      decimals: 3
    section: Key figures
    tag: se-ov-kf-best
    index: ov-kf-best
    title: Best stability score
    description: Stability score of the most stable candidate, lower is steadier. The box spreads the scores of every candidate.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the group, then the expression section.
  - component_type: interactive
    workflow_tag: stableexpression
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Findings
    tag: se-ov-findings-group
    index: ov-findings-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_stability
    interactive_component_type: MultiSelect
    column_name: section
    column_type: object
    display:
      icon_name: mdi:layers-outline
      custom_color: grape
      strip_label: Section
    section: Findings
    tag: se-ov-findings-section
    index: ov-findings-section
    title: Expression section
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data.
  - component_type: text
    surface: card
    values:
      top_gene: {dc: stableexpression_gene_stability, column: gene_name, aggregation: top, weight: rank_weight}
      top_score: {dc: stableexpression_gene_stability, column: stability_score, aggregation: min, format: 'decimals:3'}
      top_part: {dc: stableexpression_score_components, column: component, aggregation: top, weight: contribution}
      part_share: {dc: stableexpression_score_components, column: component, aggregation: top_share, weight: contribution, format: percent}
      lead_seen: {dc: stableexpression_stable_gene_distribution, column: measured_share, aggregation: median, filter_expr: "col('section_rank') == 1", format: percent}
      merged_pct: {dc: stableexpression_dataset_summary, column: merged, aggregation: average, format: percent}
      n_unmapped: {dc: stableexpression_dataset_summary, column: dataset, aggregation: count, filter_expr: "col('id_mapped') == 0", format: integer}
    body: |
      - **{{top_gene}}** is the most stable candidate in view – a stability score of {{top_score}} [Ranking](tab:Ranking)
      - **{{lead_seen}}** of the samples measured the median section leader – a box is drawn from those alone [Ranking](tab:Ranking)
      - **{{top_part}}** weighs most in the scores – {{part_share}} of all the candidates' score [Candidates](tab:Candidates)
      - **{{merged_pct}}** of the downloaded datasets reached the merged matrix – {{n_unmapped}} mapped no gene id [Datasets](tab:Datasets)
    section: Findings
    tag: se-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per analysis tab, and the sample funnel of the Datasets tab.
  # The tiles of a row share a stored height.
  - component_type: highlight
    section: Findings
    source_tab: Ranking
    source_component: rank-distribution
    caption: The best gene of each section, its expression across the cohort beside its score; colour is the section.
    hide_legend: true
    tag: se-ov-hl-ranking
    index: ov-hl-ranking
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Candidates
    source_component: cand-measures
    caption: Normfinder rank against geNorm rank per candidate; bottom left on the diagonal is steady by both measures.
    hide_legend: true
    tag: se-ov-hl-measures
    index: ov-hl-measures
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Sections
    source_component: sec-score-box
    caption: Stability scores of the candidates, one box per expression section, most expressed first.
    hide_legend: true
    tag: se-ov-hl-sections
    index: ov-hl-sections
    layout: {x: 0, y: 7, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Datasets
    source_component: ds-funnel
    caption: Samples still in after each step of the datasets, stacked by platform.
    tag: se-ov-hl-funnel
    index: ov-hl-funnel
    layout: {x: 4, y: 7, w: 4, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers.
  - component_type: text
    body: |
      ### Data & QC
      - [Datasets](tab:Datasets)
      - [ID mapping](tab:ID mapping)

      ### Stability
      - [Ranking](tab:Ranking)
      - [Candidates](tab:Candidates)
      - [Sections](tab:Sections)
    section: How to read this dashboard
    tag: se-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the group first.
  - component_type: interactive
    workflow_tag: stableexpression
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: se-filter-group
    index: sample-filters-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: stableexpression
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: dataset
    column_type: object
    display:
      icon_name: mdi:database-outline
      custom_color: blue
    section: Sample filters
    group: Sample scope
    tag: se-filter-dataset
    index: sample-filters-dataset
    title: Dataset
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: stableexpression
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: se-filter-sample
    index: sample-filters-sample
    title: Sample
    layout: {x: 0, y: 5, w: 1, h: 3}
  # Row selection feeds the Analysis panel.
  - component_type: table
    workflow_tag: stableexpression
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample
    section: Sample sheet
    tag: se-sample-sheet
    index: sample-sheet
    title: Public samples
    description: One row per sample, with its dataset, accession, platform, normalisation, condition and status.
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
# ============================================================================
# Data & QC
# ============================================================================
- title: Datasets
  subtitle: Which datasets reached the merged matrix, and with how many samples?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: mdi:database-outline
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Dataset filters
    icon: mdi:filter-variant
    color: blue
    description: Narrow by outcome or by the samples a dataset kept
  grid_sections:
  - name: Datasets at a glance
    icon: mdi:counter
    color: blue
    description: Datasets and samples through the steps, outcomes and missing genes
  - name: Samples through the filters
    icon: mdi:chart-bar
    color: blue
    description: The samples still in after each step, and why datasets dropped out
  - name: Dataset profile
    icon: mdi:chart-scatter-plot
    color: blue
    description: Each dataset by the samples it kept and the genes its platform misses
  - name: Dataset table
    icon: mdi:table
    color: gray
    description: Every downloaded dataset with its mapping, filters and outcome
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      stableexpression downloads every [Expression Atlas](https://www.ebi.ac.uk/gxa/home)
      dataset of the species, maps its gene ids, removes the samples with too many zeros or
      missing values and normalises what is left (TPM or CPM, then a quantile normalisation).
      Read the steps left to right: a dataset whose ids map to no Ensembl gene loses all its
      samples at once. A microarray covers only part of the genome, so its samples miss more of
      the merged matrix's genes.
    tag: se-ds-intro
    index: ds-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_dataset_summary
    interactive_component_type: MultiSelect
    column_name: outcome
    column_type: object
    display:
      icon_name: mdi:check-decagram-outline
      custom_color: green
    section: Dataset filters
    group: Datasets
    tag: se-ds-filter-outcome
    index: ds-outcome-filter
    title: Outcome
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_dataset_summary
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: samples_kept
    column_type: int64
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: Dataset filters
    group: Datasets
    tag: se-ds-filter-kept
    index: ds-kept-range
    title: Samples kept
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: card
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_dataset_summary
    use: stableexpression/dataset_attrition
    aggregation: sum
    column_name: downloaded
    column_type: int64
    secondary_layout: attrition
    attrition_cols: [id_mapped, merged]
    display:
      icon_name: mdi:database-outline
      icon_color: blue
      caption: downloaded, then ID-mapped and merged
    section: Datasets at a glance
    tag: se-ds-card-datasets
    index: ds-card-datasets
    title: Datasets
    description: Datasets downloaded, then those whose ids mapped and those that reached the merged matrix.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_dataset_summary
    use: stableexpression/sample_attrition
    aggregation: sum
    column_name: samples_downloaded
    column_type: int64
    secondary_layout: attrition
    attrition_cols: [samples_id_mapped, samples_after_zero_filter, samples_kept]
    display:
      icon_name: mdi:flask-outline
      icon_color: teal
      caption: downloaded, then after each filter
      format: si
    section: Datasets at a glance
    tag: se-ds-card-samples
    index: ds-card-samples
    title: Samples
    description: Samples downloaded, then still in after the gene ID mapping, the zero filter and the missing-value filter.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_dataset_summary
    use: stableexpression/dataset_outcomes
    aggregation: count
    column_name: dataset
    column_type: object
    secondary_layout: donut
    breakdown_col: outcome
    display:
      icon_name: mdi:check-decagram-outline
      icon_color: green
      caption: datasets, by outcome
    section: Datasets at a glance
    tag: se-ds-card-outcomes
    index: ds-card-outcomes
    title: Outcomes
    description: 'What became of each dataset: merged, no gene mapped, only rare genes, or every sample filtered out.'
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_dataset_summary
    aggregation: median
    column_name: missing_share
    column_type: float64
    filter_expr: col('merged') == 1
    secondary_layout: histogram
    display:
      icon_name: mdi:grid
      icon_color: orange
      caption: median per merged dataset, with its spread
      format: percent
    section: Datasets at a glance
    tag: se-ds-card-missing
    index: ds-card-missing
    title: Genes missing
    description: Share of the merged matrix's genes a sample of the dataset did not measure, the median over its samples.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_dataset_funnel
    mode: code
    code_content: |-
      # Samples still in after each step of the pipeline, summed over the datasets and stacked by platform; the figure over a bar is its total and the drop since the step before.
      colors = depictio_category_colors.get('platform') or {}
      order = ['Downloaded', 'Gene IDs mapped', 'Zero filter', 'Missing-value filter']
      d = df.group_by(['step', 'platform']).agg(pl.col('samples').sum().alias('samples'))
      tot = d.group_by('step').agg(pl.col('samples').sum().alias('total'))
      fig = px.bar(d.to_pandas(), x='step', y='samples', color='platform', color_discrete_map=colors, category_orders={'step': order}, labels={'step': '', 'samples': 'Samples', 'platform': ''})
      totals = {r['step']: r['total'] for r in tot.to_dicts()}
      prev = None
      for s in order:
          if s in totals:
              drop = '' if prev is None or not prev else '<br>' + str(round(100 * (totals[s] - prev) / prev)) + '%'
              fig.add_annotation(x=s, y=totals[s], text='<b>' + f'{totals[s]:,}' + '</b>' + drop, showarrow=False, yshift=22, font=dict(size=12))
              prev = totals[s]
      fig.update_yaxes(range=[0, max(totals.values()) * 1.2], tickformat=',')
      fig.update_layout(margin=dict(t=20), legend=dict(orientation='h', y=-0.18, title_text=''), bargap=0.3)
    section: Samples through the filters
    tag: se-ds-fig-funnel
    index: ds-funnel
    title: Samples after each step
    description: >-
      How many samples survive each step of the pipeline? Each bar is the samples still in after a step,
      summed over the datasets and stacked by platform.

      How to read: a healthy run loses few samples after the first bar. A large drop at gene ID mapping is
      whole datasets whose ids g:Profiler could not map, which leave the run there; the zero and
      missing-value filters then remove single samples, so their bars barely move. Open [ID
      mapping](tab:ID mapping) to find the datasets behind a drop, and the dataset table of this tab for
      their outcome.

      Annotations: the figure over each bar is the total of that step in bold, with the change in percent
      from the step before. Both are computed from the bars; no threshold is drawn.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_dataset_summary
    mode: code
    code_content: |-
      # Datasets per platform, stacked by what became of them: merged into the matrix, or lost because no gene id mapped, only rare genes were left, or every sample was filtered out. The count sits on each segment and the share merged over each bar.
      colors = depictio_category_colors.get('outcome') or {}
      d = df.group_by(['platform', 'outcome']).agg(pl.len().alias('datasets'))
      tot = df.group_by('platform').agg(pl.len().alias('n'), (pl.col('outcome') == 'Merged').sum().alias('merged'))
      fig = px.bar(d.to_pandas(), x='platform', y='datasets', color='outcome', text='datasets', color_discrete_map=colors, category_orders={'outcome': ['Merged', 'No gene mapped', 'Only rare genes', 'All samples filtered out']}, labels={'platform': '', 'datasets': 'Datasets', 'outcome': ''})
      fig.update_traces(textposition='inside', textfont=dict(size=13, color='white'))
      for r in tot.to_dicts():
          fig.add_annotation(x=r['platform'], y=r['n'], text='<b>' + str(round(100 * r['merged'] / r['n'])) + '%</b> merged of ' + str(r['n']), showarrow=False, yshift=16, font=dict(size=12))
      fig.update_yaxes(range=[0, tot['n'].max() * 1.15])
      fig.update_layout(margin=dict(t=20), legend=dict(orientation='h', y=-0.18, title_text=''), bargap=0.4)
    section: Samples through the filters
    tag: se-ds-fig-outcomes
    index: ds-outcome-bars
    title: Datasets by outcome
    description: >-
      What became of the datasets of each platform? Datasets per platform, stacked by outcome, with the
      count on each segment.

      How to read: a good platform is mostly **Merged**. The unmerged part is where to look first for a
      missing study: no gene mapped is an array design g:Profiler does not know, only rare genes means the
      genes were seen in too few datasets, and all samples filtered out means every sample failed the zero
      or missing-value filter. Filter the outcome and read the dataset table of this tab to name them, or
      open [ID mapping](tab:ID mapping) for the ids behind a mapping failure.

      Annotations: the label over each bar is the share of that platform's datasets that were merged, with
      their count. It is computed from the bars; no threshold is drawn.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_dataset_summary
    mode: code
    code_content: |-
      # Share of the merged matrix's genes each dataset did not measure, by the array design that measured it. An array only carries the probes of its chip, so every dataset of one design misses the same genes and the points stack at one height; RNA-seq measures nearly all of them. Marker area is the samples the dataset kept, the bar is the design's median.
      colors = depictio_category_colors.get('platform') or {}
      d = df.with_columns(pl.col('missing_share').alias('miss'))
      stats = d.group_by('design').agg(pl.len().alias('n'), pl.col('platform').first().alias('platform'), pl.col('miss').median().alias('med'), pl.col('miss').is_null().sum().alias('none'), pl.col('samples_kept').sum().alias('kept'))
      stats = stats.with_columns(pl.col('med').fill_null(-1).alias('key')).sort(['key', 'design'], descending=[True, False])
      designs = stats['design'].to_list()
      pos = {k: i for i, k in enumerate(designs)}
      ticks = [str(r['design']) + '<br>' + str(r['n']) + (' dataset' if r['n'] == 1 else ' datasets') for r in stats.to_dicts()]
      fig = go.Figure(layout=go.Layout(meta={'rows': d.height}))
      for plat in d['platform'].unique().sort().to_list():
          rows = d.filter((pl.col('platform') == plat) & pl.col('miss').is_not_null()).to_dicts()
          seen = {}
          xs, ys, sz, txt = [], [], [], []
          for r in rows:
              k = r['design']
              j = seen.get(k, 0)
              seen[k] = j + 1
              xs.append(pos[k] + ((j % 9) - 4) * 0.075)
              ys.append(r['miss'])
              sz.append(max(10, min(30, 5 + 1.6 * (r['samples_kept'] or 0) ** 0.5)))
              txt.append(r['accession'] + ': ' + str(r['samples_kept']) + ' samples kept')
          if xs:
              fig.add_trace(go.Scatter(x=xs, y=ys, mode='markers', name=plat, text=txt, hovertemplate='%{text}<br>%{y:.1%} of the genes not measured<extra></extra>', marker=dict(size=sz, color=colors.get(plat, '#1c7ed6'), opacity=0.8, line=dict(width=1, color='white'))))
      for r in stats.filter(pl.col('med').is_not_null()).to_dicts():
          x = pos[r['design']]
          fig.add_shape(type='line', x0=x - 0.4, x1=x + 0.4, y0=r['med'], y1=r['med'], line=dict(width=2.5, color='#343a40'))
          fig.add_annotation(x=x, y=r['med'], text=str(round(100 * r['med'])) + '%', showarrow=False, yshift=22 if r['platform'] == 'RNA-seq' else 24, font=dict(size=12))
      for r in stats.filter(pl.col('none') > 0).to_dicts():
          x = pos[r['design']]
          fig.add_annotation(x=x, y=0.42, text='no gene mapped' if r['none'] == r['n'] else str(r['none']) + ' of ' + str(r['n']) + ' mapped no gene', showarrow=False, textangle=-90, font=dict(size=12, color='#868e96'))
      fig.update_xaxes(tickmode='array', tickvals=list(range(len(designs))), ticktext=ticks, range=[-0.6, len(designs) - 0.4], title_text='Array design (or RNA-seq)', tickangle=0, tickfont=dict(size=11))
      fig.update_yaxes(range=[0, 0.95], tickformat='.0%', title_text='Share of the genes not measured')
      fig.update_layout(margin=dict(t=20, r=20), legend=dict(orientation='h', y=-0.3, title_text=''))
    section: Dataset profile
    tag: se-ds-fig-missing
    index: ds-plane
    title: Genes missing, by array design
    description: >-
      Why does a dataset miss so many genes? One point per dataset (area is the samples it kept), grouped
      by the array design that measured it, with the share of the merged matrix's genes the dataset did
      not measure on the y axis.

      How to read: an array only carries the probes of its chip, so every dataset of one design misses the
      same genes and its points stack at one height, while RNA-seq measures nearly every gene. A high
      share is therefore a property of the design, not a defect of the dataset. A point off its design bar
      is a dataset whose mapping or filters differ from its siblings, the one to open in the dataset table
      of this tab.

      Lines and annotations: the black bar of each design is the median share of its datasets, printed
      over it; it is computed from the data and is not a published cut-off. A grey vertical label names a
      design whose datasets, all or some, mapped no gene and so have no share to draw.
    layout: {x: 0, y: 0, w: 8, h: 5}
