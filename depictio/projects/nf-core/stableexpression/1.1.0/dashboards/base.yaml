    data_collection_tag: stableexpression_stable_gene_distribution
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: stability_score
    column_type: float64
    display:
      icon_name: mdi:scale-balance
      custom_color: green
    section: Gene filters
    group: Genes
    tag: se-rank-filter-score
    index: rank-score-range
    title: Stability score
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_stable_gene_distribution
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: measured_share
    column_type: float64
    display:
      icon_name: mdi:percent-outline
      custom_color: teal
    section: Gene filters
    group: Genes
    tag: se-rank-filter-measured
    index: rank-measured-range
    title: Share of samples measured
    layout: {x: 0, y: 5, w: 1, h: 3}
  - component_type: card
