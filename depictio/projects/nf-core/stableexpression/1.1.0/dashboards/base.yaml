  - component_type: figure
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_stability
    mode: code
    code_content: |-
      # Stability score of every candidate, one box per section (lower is more stable). Each point is a candidate, the best of each section is named, the dashed line is the median over all of them.
      colors = depictio_category_colors.get('section') or {}
      fig = go.Figure(layout=go.Layout(meta={'rows': df.height}))
      secs = sorted(df['section'].unique().to_list())
      for s in secs:
          sub = df.filter(pl.col('section') == s)
          fig.add_trace(go.Box(x=[s] * sub.height, y=sub['stability_score'].to_list(), name=s, marker=dict(color=colors.get(s, '#7048e8'), size=4, opacity=0.55), line=dict(width=1.5), fillcolor='rgba(255,255,255,0)', boxpoints='all', jitter=0.6, pointpos=0, width=0.7, boxmean=False, text=sub['gene_name'].to_list(), hovertemplate='%{text}: %{y:.3f}<extra>' + s + '</extra>', showlegend=False))
          best = sub.sort('stability_score').head(1).to_dicts()[0]
          fig.add_annotation(x=s, y=best['stability_score'], text=str(best['gene_name']), showarrow=False, yshift=-12, font=dict(size=10))
      med = df['stability_score'].median()
      fig.add_hline(y=med, line_dash='dash', line_width=1, opacity=0.5)
      fig.add_annotation(xref='paper', yref='y', x=1, y=med, text='median ' + f'{med:.2f}', showarrow=False, xanchor='right', yanchor='bottom', font=dict(size=11))
      fig.update_xaxes(title_text='Section (01 is the most expressed)', tickangle=0, tickmode='array', tickvals=secs, ticktext=[x.replace('Section ', '') for x in secs])
      fig.update_yaxes(title_text='Stability score (lower is more stable)')
      fig.update_layout(margin=dict(t=20), boxgap=0.15)
    section: Stability by section
    tag: se-sec-fig-score
    index: sec-score-box
    title: Candidate scores by section
    description: >-
      Are stable genes easier to find at some expression levels? Each box is one section of the genes
      ranked by expression, 01 the most expressed, and each point a candidate of it; the score is lower
      for a more stable gene.

      How to read: a section whose box sits low holds genes that are steadier across the datasets, and a
      long box means the candidates of that section differ a lot. A box wholly above the dashed line is a
      section where even the candidates are unsteady relative to the others. Open
      [Candidates](tab:Candidates) to see which measures drive a section's score.

      Lines and annotations: the dashed line is the median stability score over all candidates in view, a
      reference computed from the data and not a published cut-off. The name under each box is the
      candidate with the lowest score of its section. Boxes show the quartiles of Plotly's default, with
      whiskers to the furthest point within 1.5 IQR.

      Note: the score ranks candidates against each other, and this chart draws no absolute pass mark.
    layout: {x: 0, y: 0, w: 8, h: 5, fit: auto}
  - component_type: figure
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_statistics
    mode: code
    code_content: |-
      # Spread (coefficient of variation) of every gene in each section, candidates beside the other genes, on a log axis. The candidates are the genes the ranking kept as the most stable, so they sit at the lower edge of each section's band; the figure over a pair is the median candidate's spread as a share of the others'.
      colors = depictio_category_colors.get('candidate') or {}
      d = df.filter(pl.col('cv') > 0)
      secs = sorted(d['section'].unique().to_list())
      fig = go.Figure(layout=go.Layout(meta={'rows': d.height}))
      for cand in ['Not a candidate', 'Candidate']:
          sub = d.filter(pl.col('candidate') == cand)
          fig.add_trace(go.Box(x=sub['section'].to_list(), y=sub['cv'].to_list(), name=cand, marker_color=colors.get(cand, '#adb5bd'), boxpoints=False, line=dict(width=1.5)))
      rel = d.group_by(['section', 'candidate']).agg(pl.col('cv').median().alias('m')).pivot(on='candidate', index='section', values='m')
      top = d['cv'].max()
      for r in rel.to_dicts():
          if r.get('Candidate') and r.get('Not a candidate'):
              fig.add_annotation(x=r['section'], y=0, yref='paper', text=f'{100 * r['Candidate'] / r['Not a candidate']:.0f}' + '%', showarrow=False, yanchor='bottom', font=dict(size=10))
      fig.update_xaxes(title_text='Section (01 is the most expressed)', tickangle=0, categoryorder='array', categoryarray=secs, tickmode='array', tickvals=secs, ticktext=[x.replace('Section ', '') for x in secs])
      fig.update_yaxes(type='log', title_text='Coefficient of variation (log scale)')
      fig.update_layout(boxmode='group', margin=dict(t=20), legend=dict(orientation='h', y=-0.2, title_text=''))
    section: Stability by section
    tag: se-sec-fig-cv
    index: sec-cv-box
    title: Spread of every gene by section
    description: >-
      How much more stable are the candidates than the rest of their section? The coefficient of variation
      of every gene of each section on a log axis, candidates beside the other genes.

      How to read: spread grows with the expression section number, since low expressed genes vary more.
      Inside a section the candidates should sit at the lower edge of the band, and the smaller the
      percentage under a pair the more the candidates stand out. A pair whose boxes overlap is a section where the candidates stand out little.

      Annotations: the percentage under each pair is the median spread of the candidates as a share of the
      median spread of the other genes of that section, computed from the data. No threshold is drawn.

      Note: genes with a coefficient of variation of zero cannot sit on a log axis and are left out.
    layout: {x: 0, y: 5, w: 8, h: 5, fit: auto}
