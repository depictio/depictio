  - component_type: card
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_stable_gene_distribution
    aggregation: median
    column_name: sd
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: blue
      caption: median standard deviation per gene
      decimals: 3
    section: Ranking at a glance
    tag: se-rank-card-sd
    index: rank-card-sd
    title: Spread
    description: Standard deviation of a ranked gene's normalised expression over the samples that measured it.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_stable_gene_distribution
    use: stableexpression/stability_ranking
    viz_kind: ranked_distribution
    config:
      viz_kind: ranked_distribution
      feature_id_col: gene_id
      score_col: stability_score
      rank_col: section_rank
      label_col: gene_name
      group_col: section
      q1_col: q1
      median_col: median
      q3_col: q3
      lower_col: lower
      upper_col: upper
      mean_col: mean
      top_n: 10
      ascending: true
      distribution: box
      orientation: horizontal
      score_label: Stability score (lower is steadier)
      value_label: Normalised expression (0 to 1)
      log_value: false
      max_features: 500
      selection_enabled: true
    section: Most stable genes
    tag: se-rank-av-distribution
    index: rank-distribution
    title: The best genes of each section
    description: >-
      Which genes are the most stable in each expression section? Each row is a gene, the best of each
      section first: a box of its normalised expression over the samples that measured it, and a lollipop
      of the score that ranked it, coloured by section.

      How to read: a good gene has a low score (lower is steadier) and a narrow box, so its expression
      barely moves across the samples. A long box, or a score far above its section peers, is a gene that
      varies whatever its rank. Ten genes show by default, the best of each section; raise Top N for the
      next ones of each, filter a section to rank only it, and click a gene (its box or its lollipop) to
      select it across the dashboard.

      Lines and annotations: each box spans the first to the third quartile of the normalised expression
      (0 to 1), with the median as a line and the mean as a dashed line. The whiskers end at the furthest
      value within 1.5 IQR of the quartile (Tukey's convention). The lollipop is the gene's stability
      score, from zero.

      Source: the stability score and the section ranks are the pipeline's,
      https://nf-co.re/stableexpression. Boxes are computed from the merged matrix before imputation, so a
      box shows what was measured.

      Note: a narrow box on a gene measured by few samples rests on little data; filter the share of
      samples measured to leave those out. The violins of the same leaders are on the tile below, drawn
      from each sample's value.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_stable_gene_values
    use: stableexpression/stability_violins
    viz_kind: ranked_distribution
    config:
      viz_kind: ranked_distribution
      feature_id_col: gene_id
      score_col: stability_score
      rank_col: section_rank
      label_col: gene_name
      group_col: section
      value_col: value
      top_n: 10
      ascending: true
      distribution: violin
      orientation: horizontal
      score_label: Stability score (lower is steadier)
      value_label: Normalised expression (0 to 1)
      log_value: false
      max_features: 100
      selection_enabled: true
    section: Per-sample values
    tag: se-rank-av-values
    index: rank-values
    title: The section leaders, sample by sample
    description: >-
      Do the section leaders hold on the samples in view? The same leaders as the boxes above, each drawn
      as a violin of the normalised expression of every sample that measured it, with the stability score
      beside it as a lollipop.

      How to read: a good leader keeps a narrow violin on every platform and dataset you pick. One that
      widens or shifts when you pick a platform is steady only on average. Pick a platform or a dataset in
      the sample filters on the left to redraw the violins from those samples only; the score does not
      move, because it is a statistic of the whole cohort.

      Lines and annotations: each violin is cut at the extremes of its values, with a box and a mean line
      inside, and all violins share the same maximum width, so the width compares shapes and not sample
      counts. The lollipop is the gene's stability score, from zero. Click a gene to select it.

      Note: only the best few genes of each section are kept sample by sample (two by default, a template
      variable), so raising Top N past them adds no violin.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_stable_gene_distribution
    row_selection_enabled: true
    row_selection_column: gene_id
    section: Ranked genes table
    tag: se-rank-table
    index: rank-table
    title: Ranked genes
    description: Each ranked gene with its score, ranks, box statistics and the samples that measured it.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Candidates
  subtitle: What makes a candidate stable, measure by measure?
  tab_group: Stability
  tab_order: 4
  tab_icon: mdi:scale-balance
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Candidate filters
    icon: mdi:filter-variant
    color: violet
    description: Narrow by section, expression level or measured share
  grid_sections:
  - name: Candidates at a glance
    icon: mdi:counter
    color: violet
    description: Candidates, their typical score, measured share and geNorm M
  - name: Score parts
    icon: mdi:chart-bar
    color: violet
    description: What each measure and the missing values add to the score, by section
  - name: Measure agreement
    icon: mdi:chart-scatter-plot
    color: violet
    description: Normfinder rank against geNorm M rank, one point per candidate
  - name: Candidate detail
    icon: mdi:table
    color: gray
    description: Every candidate with its measures, score parts and ranks
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      Each candidate is scored by four measures, each rescaled to 0-1 over the candidates and
      weighted ([Normfinder](https://www.moma.dk/software/normfinder), geNorm M and two
      coefficients of variation), plus a penalty for the samples that never measured it. The
      bars split each section's mean score into those parts. Pick a candidate in the table to
      open its record.
    tag: se-cand-intro
    index: cand-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_stability
    interactive_component_type: MultiSelect
    column_name: section
    column_type: object
    display:
      icon_name: mdi:layers-outline
      custom_color: grape
    section: Candidate filters
    group: Candidates
    tag: se-cand-filter-section
    index: cand-section-filter
    title: Expression section
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_stability
    interactive_component_type: MultiSelect
    column_name: expression_level
    column_type: object
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: indigo
    section: Candidate filters
    group: Candidates
    tag: se-cand-filter-level
    index: cand-level-filter
    title: Expression level
    layout: {x: 0, y: 2, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_stability
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: measured_share
    column_type: float64
    display:
      icon_name: mdi:percent-outline
      custom_color: teal
    section: Candidate filters
    group: Candidates
    tag: se-cand-filter-measured
    index: cand-measured-range
    title: Share of samples measured
    layout: {x: 0, y: 4, w: 1, h: 3}
  - component_type: card
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_stability
    aggregation: count
    column_name: gene_id
    column_type: object
    secondary_layout: composition
    breakdown_col: platforms
    display:
      icon_name: mdi:dna
      icon_color: violet
      caption: by the platforms that measured them
    section: Candidates at a glance
    tag: se-cand-card-count
    index: cand-card-count
    title: Candidates
    description: Candidate genes scored for stability, split by the platforms that measured them.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_stability
    aggregation: median
    column_name: stability_score
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:scale-balance
      icon_color: green
      caption: median, with the spread of the scores
      decimals: 3
    section: Candidates at a glance
    tag: se-cand-card-score
    index: cand-card-score
    title: Stability score
    description: Median stability score of the candidates in view, lower is steadier.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_stability
    use: stableexpression/candidate_measured
    aggregation: median
    column_name: measured_share
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:percent-outline
      icon_color: teal
      caption: median per candidate, with its spread
      format: percent
    section: Candidates at a glance
    tag: se-cand-card-measured
    index: cand-card-measured
    title: Samples measured
    description: Share of the cohort's samples that measured a candidate; the missing ones add to its score.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_stability
    aggregation: median
    column_name: genorm_m
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: grape
      caption: median M, with its spread
      decimals: 2
    section: Candidates at a glance
    tag: se-cand-card-genorm
    index: cand-card-genorm
    title: geNorm M
    description: geNorm's M measure, the mean variation of a gene's ratio to every other candidate; lower is steadier.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_score_components
    viz_kind: stacked_taxonomy
    config:
      viz_kind: stacked_taxonomy
      sample_id_col: section
      taxon_col: component
      rank_col: null
      abundance_col: contribution
      normalise_to_one: true
      sample_sort: name
      top_n: 5
      value_title: Share of the score
      hidden_controls: [rank, top_n, group]
    section: Score parts
    tag: se-cand-fig-parts
    index: cand-parts
    title: The score of each section, part by part
    description: >-
      What does each measure add to the score of a section's candidates? Each bar is a section, split into
      the weighted parts of the stability score, as a share of it.

      How to read: a score made mostly of Normfinder, geNorm M and the coefficient of variation says the
      candidates of that section are steady on the data. The grey part is the penalty for genes missing
      from datasets, so a tall grey bar means the score of that section is mostly a coverage story, not a
      stability one. Sort by a part to see where it weighs most, and open [Ranking](tab:Ranking) for the
      genes behind a section.

      Annotations: each measure is rescaled to 0 to 1 over the candidates and multiplied by its weight,
      the pipeline's --stability_score_weights, and the parts add up to the score. Normalise off stacks
      the parts summed over the section's candidates, so the height is the sum of their scores and
      compares sections only as far as they hold the same number of candidates. No threshold is drawn.

      Sources: Normfinder, https://doi.org/10.1158/0008-5472.CAN-04-0496; geNorm,
      https://doi.org/10.1186/gb-2002-3-7-research0034.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_stability
    use: stableexpression/measure_agreement
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: normfinder_rank
      y_col: genorm_rank
      label_col: gene_name
      label_order_col: section_rank
      color_col: section
      x_title: Normfinder rank in the section (1 = steadiest)
      y_title: geNorm M rank in the section
      log_x: true
      log_y: true
      reference_line: diagonal
      top_n_labels: 10
      marker_size: 10
      opacity: 0.8
      marker_outline: true
      legend_pos: bottom
      selection_enabled: true
      selection_column: gene_id
    section: Measure agreement
    tag: se-cand-av-measures
    index: cand-measures
    title: Do Normfinder and geNorm agree?
    description: >-
      Do Normfinder and geNorm agree? Each candidate's rank by Normfinder against its rank by geNorm M,
      within its section, on log axes so the best ranks spread out.

      How to read: near the diagonal both measures agree, and bottom left is steady by both, the candidate
      to trust. A gene far off the diagonal is good by one measure only, so check it in the candidate
      table of this tab before using it as a reference. Click a point to select its gene.

      Lines and annotations: the dashed diagonal is x = y, where both ranks are equal; it is an identity
      line, not a cut-off. The labels name the ten candidates with the best rank within their section, the
      leader of each section on a default run of ten sections.

      Sources: Normfinder, https://doi.org/10.1158/0008-5472.CAN-04-0496; geNorm,
      https://doi.org/10.1186/gb-2002-3-7-research0034.

      Note: with --skip_genorm geNorm M is empty for every candidate and this chart has no points.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_stability
    use: stableexpression/candidate_table
    row_selection_enabled: true
    row_selection_column: gene_id
    section: Candidate detail
    tag: se-cand-table
    index: cand-table
    title: Candidate genes
    description: Every candidate with its ranks, score, measures and score parts. Select a row to open its record.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_gene_stability
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: se-cand-table
      id_col: gene_id
      title_col: gene_name
      selection_source: table_selection
      sections:
        Gene: [gene_name, gene_id, description, section, expression_level, platforms, source_ids]
        Rank: [stability_score, section_rank, overall_rank]
        Score parts: [normfinder_part, genorm_part, cv_part, robust_cv_part, missing_penalty]
        Measures: [normfinder_stability, genorm_m, cv, robust_cv, rnaseq_cv, microarray_cv]
        Expression: [mean, median, measured_share, zero_share]
      link_templates:
        gene_id: https://www.ensembl.org/id/{value}
    section: Candidate detail
    tag: se-cand-av-record
    index: cand-record
    title: Candidate record
    description: >-
      The selected candidate, with its ranks, the parts of its score and its expression.

      How to read: select a row of the candidate table to fill the card. Rank gives the stability score
      and the ranks within the section and overall, where lower is steadier; Score parts shows which
      measure weighs most, and a large missing-value part means the gene was missing from many samples.
      Measures and Expression give the raw values, and the gene id links to Ensembl.
    layout: {x: 5, y: 0, w: 3, h: 6}
- title: Sections
  subtitle: How does stability change with expression level?
  tab_group: Stability
