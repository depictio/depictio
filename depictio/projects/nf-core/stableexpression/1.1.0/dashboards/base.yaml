    section: Mapping at a glance
    tag: se-id-card-rare
    index: id-card-rare
    title: Rare genes
    description: Ids of genes seen in too few datasets, which the pipeline drops before merging.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_id_mapping
    mode: code
    code_content: |-
      # Two readings of the same gene ids, pooled by platform. Left, the share kept as genes of the merged matrix: both platforms keep most of what they came with. Right, the ids that are lost and why, on their own axis: unmapped ids (probes or ids g:Profiler does not know), rare genes (seen in too few datasets) and ids collapsed into another one of the same gene.
      colors = depictio_category_colors.get('fate') or {}
      d = df.group_by(['platform', 'fate']).agg(pl.col('gene_ids').sum().alias('ids'))
      d = d.with_columns((100 * pl.col('ids') / pl.col('ids').sum().over('platform')).alias('pct'))
      plats = sorted(d['platform'].unique().to_list())
      kept = d.filter(pl.col('fate') == 'Kept')
      fig = go.Figure(go.Bar(y=kept['platform'].to_list(), x=kept['pct'].to_list(), orientation='h', name='Kept', marker_color=colors.get('Kept', '#2f9e44'), text=[f'{v:.1f}' + '%' for v in kept['pct'].to_list()], textposition='inside', textfont=dict(size=13, color='white'), customdata=kept['ids'].to_list(), hovertemplate='%{y}: %{x:.1f}% of the ids kept (%{customdata:,})<extra></extra>', xaxis='x', yaxis='y'))
      for fate in ['Unmapped', 'Rare gene', 'Collapsed']:
          sub = d.filter(pl.col('fate') == fate)
          fig.add_trace(go.Bar(y=sub['platform'].to_list(), x=sub['pct'].to_list(), orientation='h', name=fate, marker_color=colors.get(fate, '#adb5bd'), text=[f'{v:.1f}' + '%' if v >= 0.9 else '' for v in sub['pct'].to_list()], textposition='inside', textfont=dict(size=12), customdata=sub['ids'].to_list(), hovertemplate='%{y}: %{x:.2f}% of the ids, ' + fate.lower() + ' (%{customdata:,})<extra></extra>', xaxis='x2', yaxis='y2'))
      lost_max = max(d.filter(pl.col('fate') != 'Kept').group_by('platform').agg(pl.col('pct').sum().alias('s'))['s'].max() or 1, 1)
      fig.update_layout(barmode='stack', xaxis=dict(domain=[0, 0.46], range=[0, 100], ticksuffix='%', title=dict(text='Share of the ids kept')), yaxis=dict(anchor='x', categoryorder='array', categoryarray=plats, autorange='reversed'), xaxis2=dict(domain=[0.56, 1], range=[0, lost_max * 1.1], ticksuffix='%', title=dict(text='Share of the ids lost, by cause'), anchor='y2'), yaxis2=dict(anchor='x2', categoryorder='array', categoryarray=plats, autorange='reversed', showticklabels=False), margin=dict(t=20), legend=dict(orientation='h', y=-0.25, title_text=''))
    section: Fate of the gene ids
    tag: se-id-fig-platform
    index: id-platform-bars
    title: Fate of the ids by platform
    description: >-
      Does a platform lose more ids, and why? Each bar is the ids of every dataset of a platform, pooled,
      as a share of the ids that platform came with.

      How to read: left, the share kept as genes of the merged matrix, where a good platform keeps most of
      its ids. Right, the ids lost, split by cause on their own axis so the thin slices read. A platform
      dominated by unmapped ids has an annotation problem, one dominated by rare genes has an overlap
      problem.

      Annotations: the percentage on a bar is its share of the platform's ids, left off thin slices.
      Unmapped ids are probes or ids g:Profiler does not know, rare genes were seen in too few datasets,
      and collapsed ids merge into another id of the same gene. No threshold is drawn.
    layout: {x: 0, y: 0, w: 8, h: 3}
  - component_type: figure
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_id_mapping
    mode: code
    code_content: |-
      # One point per dataset: how many gene ids it came with, against the share of them kept as genes. A clean mapping sits at the top; a dataset on the floor mapped no gene at all, which is an array design g:Profiler does not know. The dashed line is the median over the datasets that mapped.
      colors = depictio_category_colors.get('platform') or {}
      tot = df.group_by(['dataset', 'accession', 'platform']).agg(pl.col('gene_ids').sum().alias('total'), pl.col('outcome').first().alias('outcome'))
      kept = df.filter(pl.col('fate') == 'Kept').select('dataset', pl.col('gene_ids').alias('kept'))
      d = tot.join(kept, on='dataset', how='left').with_columns((100 * pl.col('kept') / pl.col('total')).alias('pct')).filter(pl.col('total') > 0)
      d = d.with_columns(pl.col('pct').fill_null(0))
      fig = px.scatter(d.to_pandas(), x='total', y='pct', color='platform', color_discrete_map=colors, hover_name='accession', hover_data={'total': ':,', 'pct': ':.1f', 'platform': False}, log_x=True, labels={'total': 'Gene ids the dataset came with (log scale)', 'pct': 'Share kept (%)', 'platform': ''})
      fig.update_traces(marker=dict(size=13, opacity=0.75, line=dict(width=1, color='white')))
      ok = d.filter(pl.col('pct') > 0)
      med = ok['pct'].median() or 0
      med_all = d['pct'].median() or 0
      fig.add_hline(y=med, line_dash='dash', line_width=1, opacity=0.6)
      fig.add_annotation(xref='paper', yref='y', x=0.01, y=med, text='median of the ' + str(ok.height) + ' that mapped: ' + f'{med:.1f}' + '%', showarrow=False, xanchor='left', yanchor='bottom', font=dict(size=11))
      if d.height > ok.height:
          fig.add_hline(y=med_all, line_dash='dot', line_width=1, opacity=0.6)
          fig.add_annotation(xref='paper', yref='y', x=0.01, y=med_all, text='median of all ' + str(d.height) + ': ' + f'{med_all:.1f}' + '%', showarrow=False, xanchor='left', yanchor='top', font=dict(size=11))
      nz = d.filter(pl.col('pct') == 0).height
      if nz:
          fig.add_annotation(xref='paper', yref='y', x=0.5, y=0, text=str(nz) + ' datasets mapped no gene id', showarrow=False, yshift=14, font=dict(size=12, color='#868e96'))
      low = ok.filter(pl.col('pct') < 70).sort('pct').head(5)
      for r in low.to_dicts():
          fig.add_annotation(x=float(np.log10(r['total'])), y=r['pct'], text=r['accession'], xref='x', yref='y', showarrow=False, xanchor='left', xshift=10, font=dict(size=10))
      fig.update_yaxes(range=[-6, 104], ticksuffix='%')
      fig.update_xaxes(tickvals=[100, 1000, 10000, 100000, 1000000], ticktext=['100', '1k', '10k', '100k', '1M'], minor=dict(ticks=''))
      fig.update_layout(margin=dict(t=20), legend=dict(orientation='h', y=-0.2, title_text=''))
    section: Fate of the gene ids
    tag: se-id-fig-share
    index: id-share-histogram
    title: Which datasets map badly?
    description: >-
      Which datasets lose most of their ids? One point per dataset, the gene ids it came with (log scale)
      against the share kept as genes, coloured by platform.

      How to read: a clean mapping sits near the top. A point on the floor mapped no gene at all, which is
      an array design g:Profiler does not know and the reason a dataset leaves the run. The named points
      between the two are the ones to check against their identifiers, with the fate filter and the
      per-dataset bars of this tab.

      Lines and annotations: the dashed line is the median share kept over the datasets that mapped at
      least one id, and the dotted line, drawn only when some datasets mapped nothing, is the median over
      all datasets; both are computed from the data and are not a pipeline or published cut-off. The grey
      text on the floor counts the datasets that mapped no gene id. The named points are at most the five
      lowest datasets that kept under 70 %, a labelling limit chosen by this template that has no
      published or pipeline source, so it marks nothing as failed.
    layout: {x: 0, y: 3, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_id_mapping
    viz_kind: stacked_taxonomy
    config:
      viz_kind: stacked_taxonomy
      sample_id_col: dataset
      taxon_col: fate
      rank_col: null
      abundance_col: gene_ids
      normalise_to_one: true
      sample_sort: category
      sort_category: Kept
      group_col: platform
      y_zoom: auto
      top_n: 4
      value_title: Share of the dataset's ids
      hidden_controls: [rank, top_n]
    section: Fate per dataset
    tag: se-id-fig-datasets
    index: id-dataset-bars
    title: Fate of the ids, dataset by dataset
    description: >-
      One bar per dataset, its ids split by fate, grouped by platform and sorted by the share kept.

      How to read: a good dataset is almost all **Kept**, and a dataset that mapped nothing is all
      Unmapped. A large Unmapped or Rare gene slice marks the dataset to look at, and bars compare best
      within a platform. Sort by name, total or another fate, regroup, or turn Normalise off to see the id
      counts, from the controls; open [Datasets](tab:Datasets) for the outcome of a bad one.

      Note: Kept fills most of every bar, so the axis starts near the smallest kept share and its title
      says where; Zoom off draws the whole bar.
    layout: {x: 0, y: 0, w: 8, h: 6}
