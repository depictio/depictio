- title: Ranking
  subtitle: Which genes are the most stable at each expression level?
  tab_group: Stability
  tab_order: 3
  tab_icon: mdi:trophy-outline
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Gene filters
    icon: mdi:filter-variant
    color: grape
    description: Narrow the ranking by section or by score
  grid_sections:
  - name: Ranking at a glance
    icon: mdi:counter
    color: grape
    description: Genes ranked, the best score, and how many samples measured them
  - name: Most stable genes
    icon: mdi:chart-box-outline
    color: grape
    description: The best genes of each section, their spread across the cohort beside their score
  - name: Per-sample values
    icon: mdi:chart-bell-curve
    color: grape
    description: The top two genes of each section, redrawn from the samples in view
  - name: Ranked genes table
    icon: mdi:table
    color: gray
    description: The box statistics of every ranked gene
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      Genes are split into sections by mean expression, Section 01 the most expressed, and the
      candidates of each section are scored for stability (lower is steadier). The ranking
      opens on the best gene of each section, the qPCR reference panel the pipeline's own app
      shows; raise Top N in the controls for the next ones. Each box spans the normalised
      expression (0 to 1) of the samples that measured the gene, so a gene measured by few
      samples draws a narrow box from little data.
    tag: se-rank-intro
    index: rank-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: stableexpression
    data_collection_tag: stableexpression_stable_gene_distribution
    interactive_component_type: MultiSelect
    column_name: section
    column_type: object
    display:
      icon_name: mdi:layers-outline
      custom_color: grape
    section: Gene filters
    group: Genes
