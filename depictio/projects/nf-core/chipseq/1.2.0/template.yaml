# nf-core/chipseq Template v1.2.0 - Transcription-factor / histone ChIP-seq
# ============================================================================
# This is a TEMPLATE project configuration. Use with:
#   depictio run --template nf-core/chipseq/1.2.0 --data-root /path/to/your/data
#
# Tested against nf-core/chipseq AWS megatest results:
#   s3://nf-core-awsmegatests/chipseq/results-048fd6854fcc85b355c61dfc2e21da0bcc6399ea
#   (16 human libraries: EZH2 ChIP in NTKO / TKO cells, FOXA1 ChIP in E2 /
#    VEH-treated cells, each with its own input control. See megatest.yaml.)
# ============================================================================
#
# SCOPE
# This template covers the narrowPeak route (`--narrow_peak`, the default for a
# transcription factor). A `--broad_peak` run writes the same tree under
# `macs/broadPeak/` with `*_peaks.broadPeak` files, which are BED6+3 with no
# summit column: that route needs its own peak output and is not bound here.
#
# MULTIQC WAS REPROCESSED.
# chipseq 1.2.0 is a DSL1 pipeline and this run shipped MultiQC 1.9, which
# writes `multiqc_data.json` and no parquet. Depictio reads only the parquet
# (MultiQC >= 1.31), so the report bound below is NOT the one the run
# published: it is produced by re-running the pinned MultiQC 1.35 over the same
# raw tool outputs,
#
#   python -m depictio.dev_scripts.multiqc_reprocess --src DATA_ROOT --dest DATA_ROOT
#
# which writes `multiqc/multiqc_data/multiqc.parquet` next to a `REPROCESSED.json`
# recording both versions. `modules` / `plots` below are authored against the
# 1.35 anchors, which differ from the 1.9 ones (see docs/dashboards.md).
#
# NO params.json. DSL1 wrote no `pipeline_info/params*.json`; the run's
# parameters survive only inside `execution_report.html`. Provenance therefore
# collects the tool versions from the tab-separated `software_versions.csv` and
# nothing else, and no template variable is auto-set from pipeline parameters.
#
# LAYOUT NOTE. Data collection scans and recipe globs match on file NAME, so the
# `bwa/mergedLibrary/macs/narrowPeak/...` prefix is never spelled out: a run
# aligned with a different aligner (`bowtie2/`, `star/`) lands in the same
# collections.
template:
  template_id: "nf-core/chipseq/1.2.0"
  description: "nf-core/chipseq template: MACS2 peak calls, HOMER peak annotation, consensus peak sets per antibody and DESeq2 differential binding, on top of the reprocessed MultiQC report."
  version: "1.0.0"
  variables:
    - name: "DATA_ROOT"
      description: "Root directory containing chipseq output (bwa/, fastqc/, trim_galore/, multiqc/, pipeline_info/) plus the reprocessed multiqc/multiqc_data/multiqc.parquet."
      required: true
  # The bundled reference dataset needs no variable beyond DATA_ROOT: the design
  # sheets are part of the run's own pipeline_info/ output.
  reference:
    vars: {}
  # How this run's provenance is collected at ingest, surfaced in the ingestion
  # report and the dashboard Settings drawer. Keys matched by no group rule land
  # in 'Other'.
  provenance:
    sources:
      # DSL1 software_versions.csv is a two-column "tool<TAB>version" table, not
      # the YAML later releases write.
      - name: "software_versions"
        glob: "pipeline_info/software_versions.csv"
        format: "tsv"
        pick: "latest"
        group: "Software versions"
    groups:
      - group: "Software versions"
        key_patterns: ["*"]
  dashboards:
    - "dashboards/base.yaml"

# ============================================================================
# PROJECT CONFIGURATION
# ============================================================================

name: "ChIP-seq Peak Analysis"
project_type: "advanced"
is_public: true
workflows:
  - name: "chipseq"
    version: "1.2.0"
    engine:
      name: "nextflow"
      version: "20.11.0-edge"
    catalog:
      name: "nf-core"
      url: "https://nf-co.re"
    repository_url: "https://github.com/nf-core/chipseq"
    data_location:
      structure: "flat"
      locations:
        - "{DATA_ROOT}"
    data_collections:
      # ----------------------------------------------------------------
      # Hub: every library of the run with its experimental factors as
      # columns. The pipeline's own `design_controls.csv` is not enough for
      # that on two counts, both fixed by the recipe:
      #   * the conditions the run was built to compare (NTKO / TKO,
      #     E2 / VEH) live only inside the sample NAMES, so a reader could
      #     filter by antibody but not by the thing under test;
      #   * the sheet lists the 8 ChIP libraries and none of the 8 input
      #     controls, although the controls appear in every QC collection.
      # `replicatesExist` and `multipleGroups` are dropped: the pipeline
      # writes 1 in both for every row here, so they back a dead filter.
      # ----------------------------------------------------------------
      - data_collection_tag: "design"
        description: "Per-library hub: the ChIPs and their input controls, with the antibody, the condition and the replicate parsed out of the sample names"
        config:
          type: "Table"
          metatype: "Metadata"
          source: "transformed"
          transform:
            recipe: "nf-core/chipseq/design_factors.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample_id": "Library identifier, the key every other collection is linked on"
              "role": "ChIP or input control"
              "is_control": "True for the input control libraries"
              "antibody": "Antibody the ChIP was raised against, or the control's own prefix; the consensus peak sets are built per antibody"
              "condition": "Experimental condition parsed out of the sample name (NTKO / TKO, E2 / VEH in the megatest)"
              "replicate": "Replicate tag parsed out of the sample name"
              "control_id": "Input control this ChIP was called against; empty on a control row"

      - data_collection_tag: "design_controls"
        description: "The design sheet the pipeline derived, one row per ChIP with its input control and antibody"
        config:
          type: "Table"
          metatype: "Metadata"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: "design_controls\\.csv$"
          dc_specific_properties:
            format: "CSV"
            columns_description:
              "sample_id": "ChIP sample identifier"
              "control_id": "Input control the peaks were called against"
              "antibody": "Antibody the ChIP was raised against"
              "replicatesExist": "1 when the antibody has more than one replicate"
              "multipleGroups": "1 when the antibody was assayed in more than one condition"

      - data_collection_tag: "design_reads"
        description: "Library-level design: one row per sequencing library and its FASTQ files"
        config:
          type: "Table"
          metatype: "Metadata"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: "design_reads\\.csv$"
          dc_specific_properties:
            format: "CSV"
            columns_description:
              "sample_id": "Library identifier (<sample>_T<technical replicate>)"
              "fastq_1": "Read 1 FASTQ"
              "fastq_2": "Read 2 FASTQ, empty for single-end libraries"

      # ----------------------------------------------------------------
      # MultiQC. Reprocessed with MultiQC 1.35: the anchors below are the
      # 1.35 ones, not the 1.9 ones the run itself published.
      # ----------------------------------------------------------------
      - data_collection_tag: "multiqc_data"
        description: "MultiQC report, re-generated with MultiQC 1.35 from the run's raw tool outputs (the run itself wrote MultiQC 1.9, which ships no parquet)"
        config:
          type: "MultiQC"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                # Layout-agnostic on purpose (lint rule F7): a real run writes
                # multiqc/<peak route>/multiqc_data/, the reprocessed artefact
                # sits at multiqc/multiqc_data/, and neither prefix is anchored.
                pattern: "(?:.*/)?multiqc(?:/[^/]+)?/multiqc_data/multiqc\\.parquet$"
          dc_specific_properties:
            s3_location: null
            modules:
              - "general_stats"
              - "fastqc"
              - "cutadapt"
              - "samtools"
              - "picard"
              - "preseq"
              - "phantompeakqualtools"
              - "deepTools"
              - "macs"
              - "featurecounts"
              # Custom content the pipeline writes as *_mqc.tsv. The numeric
              # suffixes are assigned per antibody by the run itself:
              # _2 is EZH2, _1 is FOXA1 in the megatest.
              - "peak_count"
              - "frip_score"
              - "peak_annotation"
              - "nsc_coefficient"
              - "rsc_coefficient"
              - "strand_shift_correlation"
              - "deseq2_pca_1"
              - "deseq2_pca_2"
              - "deseq2_clustering_1"
              - "deseq2_clustering_2"
            plots:
              fastqc:
                - "Sequence Counts"
                - "Sequence Quality Histograms"
                - "Per Sequence Quality Scores"
                - "Per Sequence GC Content":
                    - "Percentages"
                    - "Counts"
                - "Per Base N Content"
                - "Sequence Length Distribution"
                - "Sequence Duplication Levels"
                - "Top overrepresented sequences"
                - "Status Checks"
              cutadapt:
                - "Filtered Reads"
                - "Trimmed Sequence Lengths (3')":
                    - "Counts"
                    - "Obs/Exp"
              samtools:
                - "Percent mapped"
                - "Alignment stats"
                - "Flagstat"
                - "Flagstat: Percentage of total"
                - "XY counts"
                - "Mapped reads per contig":
                    - "Normalised Counts"
                    - "Observed over Expected Counts"
                    - "Raw Counts"
              picard:
                - "Alignment Summary":
                    - "Aligned Reads"
                    - "Aligned Bases"
                - "Mean read length"
                - "Base Distribution":
                    - "% Adenine"
                    - "% Cytosine"
                    - "% Guanine"
                    - "% Thymine"
                    - "% Undetermined"
                - "Mark Duplicates"
                - "Mean Base Quality by Cycle"
                - "Base Quality Distribution"
              preseq:
                - "Complexity curve (molecule count)"
              deepTools:
                - "Fingerprint plot"
                - "Read Distribution Profile after Annotation"
              featurecounts:
                - "Assignments"
              peak_count:
                - "peak_count-section"
              frip_score:
                - "frip_score-section"
              peak_annotation:
                - "peak_annotation-section"
              nsc_coefficient:
                - "nsc_coefficient-section"
              rsc_coefficient:
                - "rsc_coefficient-section"
              strand_shift_correlation:
                - "strand_shift_correlation-section"
              deseq2_pca_1:
                - "deseq2_pca_1-section"
              deseq2_pca_2:
                - "deseq2_pca_2-section"
              deseq2_clustering_1:
                - "deseq2_clustering_1-section"
              deseq2_clustering_2:
                - "deseq2_clustering_2-section"

      # ----------------------------------------------------------------
      # Signal-level QC the MultiQC report cannot show as data (tools
      # `preseq` and `deeptools`). MultiQC draws the complexity and the
      # fingerprint curves but not the numbers under them: the preseq
      # confidence bounds and the per-sample fingerprint metrics never reach
      # a panel, and the plotProfile matrix has no panel at all. The raw
      # preseq collection exists so the tidy one can read it through
      # `dc_ref`: the sample id lives only in the FILE NAME, and only a scan
      # carries the path (`include_file_paths`) into the frame.
      # ----------------------------------------------------------------
      - data_collection_tag: "preseq_ccurve_raw"
        description: "Raw per-sample preseq complexity curves (input of preseq_complexity_curve)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: ".*\\.ccurve\\.txt$"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
              null_values: ["NA", "NaN", ""]
              include_file_paths: "source_path"
              infer_schema_length: 0
            columns_description:
              "TOTAL_READS": "Sequencing depth the row extrapolates to"
              "EXPECTED_DISTINCT": "Unique molecules expected at that depth"
              "LOWER_0.95CI": "Lower bound of the 95% interval on that extrapolation"
              "UPPER_0.95CI": "Upper bound of the 95% interval"
              "source_path": "File the row came from; the sample id is derived from it"

      - data_collection_tag: "preseq_complexity_curve"
        description: "Library complexity curve of every sample with its 95% confidence ribbon, clipped to a billion reads and thinned for plotting"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "preseq/complexity_curve.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Library preseq ran on"
              "total_reads": "Sequencing depth the row extrapolates to"
              "expected_distinct": "Unique molecules expected at that depth"
              "lower_ci": "Lower bound of the 95% interval"
              "upper_ci": "Upper bound of the 95% interval"
              "ci_width": "upper_ci - lower_ci, how wide the extrapolation is"

      - data_collection_tag: "deeptools_fingerprint_metrics"
        description: "Per-sample plotFingerprint quality metrics: how concentrated each library's coverage is against a uniform library of the same depth. The run compared each IP against its input, so the JSD columns are filled."
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "deeptools/fingerprint_metrics.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Library plotFingerprint ran on"
              "auc": "Area under the observed cumulative-coverage curve"
              "synthetic_auc": "Same area for a perfectly uniform library of that depth"
              "auc_ratio": "auc / synthetic_auc; 1.0 means coverage indistinguishable from uniform"
              "x_intercept": "Share of genome bins with no reads at all"
              "synthetic_x_intercept": "Same, for the uniform library"
              "elbow_point": "Where the observed coverage curve turns"
              "synthetic_elbow_point": "Same, for the uniform library"
              "synthetic_js_distance": "Jensen-Shannon distance to the uniform library"
              "js_distance": "Jensen-Shannon distance to the input control"
              "percent_genome_enriched": "Share of the genome called enriched against the control"
              "diff_enrichment": "Differential enrichment over the control"
              "chance_divergence": "CHANCE divergence from the control"

      - data_collection_tag: "deeptools_plot_profile"
        description: "Mean signal of every library across the plotted metagene window, one row per sample and bin"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "deeptools/plot_profile.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Library plotProfile ran on"
              "group": "Region group deepTools plotted (nf-core plots one, `genes`)"
              "bin": "1-based bin index along the plotted window; 1 to 300 is the upstream flank, 300 to 400 the scaled gene body, 400 to 700 the downstream flank"
              "bin_label": "deepTools' own anchor label at that bin (-3.0Kb, TSS, TES, 3.0Kb), empty in between"
              "signal": "Mean signal in that bin"

      # ----------------------------------------------------------------
      # Catalog-transformed collections (tools `macs2` and `homer`)
      # ----------------------------------------------------------------
      - data_collection_tag: "macs2_peaks"
        description: "Every MACS2 narrow peak of every sample, with summit, width and the enrichment and significance MACS2 reported"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "macs2/peaks.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Sample the peak was called in, read off the MACS2 peak name"
              "peak_id": "MACS2 peak name, unique across samples"
              "chr": "Chromosome"
              "start": "Peak start (0-based)"
              "end": "Peak end"
              "width": "Peak width in bp"
              "summit": "Genomic position of the summit"
              "score": "MACS2 integer score"
              "fold_enrichment": "Fold enrichment at the summit over the input control"
              "neg_log10_pvalue": "-log10 of the peak p-value"
              "neg_log10_qvalue": "-log10 of the peak q-value (FDR)"

      - data_collection_tag: "macs2_peak_summary"
        description: "Per-sample peak QC: peak count, FRiP score and the spread of peak width, enrichment and significance"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "macs2/peak_summary.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "ChIP sample"
              "num_peaks": "Peaks MACS2 called for the sample"
              "frip_score": "Fraction of mapped reads falling inside called peaks"
              "width_median": "Median peak width (bp)"
              "width_mean": "Mean peak width (bp)"
              "width_max": "Widest peak (bp)"
              "fold_enrichment_median": "Median fold enrichment over the control"
              "fold_enrichment_mean": "Mean fold enrichment over the control"
              "neg_log10_qvalue_median": "Median -log10 q-value"
              "neg_log10_pvalue_median": "Median -log10 p-value"

      - data_collection_tag: "homer_annotated_peaks"
        description: "HOMER annotation of every peak: genomic feature class, distance to the nearest TSS and the gene it belongs to"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "homer/annotate_peaks.py"
            source_overrides:
              annotation:
                # Per-sample tables of the merged-library level only. The recipe's
                # own glob is layout-agnostic and would also take the consensus
                # tables and the merged-REPLICATE copy of the whole peak tree,
                # concatenating two aggregation levels into one table under a
                # `sample` column that then means two different things.
                #
                # Lint rule F7: the aligner directory is NOT spelled out. It was
                # `bwa/mergedLibrary/...`, which exists only because this megatest
                # aligned with BWA; a `--aligner bowtie2` run of the same pipeline
                # writes `bowtie2/mergedLibrary/` and matched nothing. Only
                # `mergedLibrary` is anchored, and that is the aggregation level
                # every chipseq 1.2.0 run publishes, not a mirror artefact.
                glob_pattern: "**/mergedLibrary/macs/*/*_peaks.annotatePeaks.txt"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Sample the peak was called in"
              "peak_id": "Peak identifier, the same one macs2_peaks uses"
              "chr": "Chromosome"
              "start": "Peak start"
              "end": "Peak end"
              "strand": "Peak strand as HOMER reports it (always + for MACS2 peaks)"
              "peak_score": "Score carried over from the peak caller"
              "annotation_class": "Coarse feature class: promoter-TSS, intron, exon, Intergenic, TTS"
              "annotation": "Full HOMER annotation string, with the transcript detail"
              "distance_to_tss": "Signed distance to the nearest transcription start site (bp)"
              "nearest_promoter_id": "Identifier of the nearest promoter"
              "gene_name": "Symbol of the nearest gene"
              "gene_type": "Biotype of the nearest gene; empty when the run annotated against a plain GTF"

      - data_collection_tag: "homer_tss_distance_profile"
        description: "Where each sample's peaks sit relative to the nearest TSS, counted in 250 bp bins across a 20 kb window"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "homer/tss_distance_profile.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Sample the peaks were called in"
              "distance_to_tss": "Centre of the bin, signed bp from the transcription start site"
              "peak_count": "Peaks of that sample falling in the bin"
              "fraction": "peak_count over the sample's peaks inside the window"

      - data_collection_tag: "macs2_consensus_boolean"
        description: "Consensus peak intervals per antibody against the samples that called them, as 0/1 set columns"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "macs2/consensus_boolean.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "peak_id": "<consensus set>:<interval id>, unique across antibodies"
              "consensus_set": "Which consensus table the interval came from, named after its samples"
              "interval_id": "Interval id inside that consensus table"
              "chr": "Chromosome"
              "start": "Merged interval start"
              "end": "Merged interval end"
              "num_peaks": "Per-sample peaks merged into the interval"
              "num_samples": "Samples calling a peak on the interval"

      - data_collection_tag: "macs2_consensus_fc"
        description: "Fold enrichment of the most strongly bound consensus intervals, one numeric column per sample"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "macs2/consensus_fc.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "peak_id": "<consensus set>:<interval id>, unique across antibodies"
              "consensus_set": "Which consensus table the interval came from"
              "interval_id": "Interval id inside that consensus table"
              "chr": "Chromosome"
              "region": "chr:start-end, the heatmap row label"
              "support": "How many samples call the peak, kept categorical"

      # ----------------------------------------------------------------
      # DESeq2 differential binding. The raw collection exists so the tidy
      # one can read it through `dc_ref`: the contrast id lives only in the
      # FILE NAME, and only a scan carries the path (`include_file_paths`)
      # into the frame. `infer_schema_length: 0` reads every column as text
      # because DESeq2 writes `NA` in numeric columns; the recipe recasts.
      # The `*.deseq2.FDR0.05.results.txt` subsets are deliberately not
      # scanned: they are a filtered copy of the same rows.
      # ----------------------------------------------------------------
      - data_collection_tag: "deseq2_results_raw"
        description: "Raw per-contrast DESeq2 differential-binding tables (input of deseq2_results)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: ".*\\.deseq2\\.results\\.txt$"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
              null_values: ["NA", "NaN", ""]
              include_file_paths: "source_path"
              infer_schema_length: 0
            columns_description:
              "Geneid": "Consensus interval identifier"
              "baseMean": "Mean of normalised counts across samples"
              "log2FoldChange": "Effect size of the contrast"
              "lfcSE": "Standard error of log2FoldChange"
              "pvalue": "Raw Wald p-value"
              "padj": "Benjamini-Hochberg adjusted p-value"
              "source_path": "File the row came from; the contrast id is derived from it"

      - data_collection_tag: "deseq2_results"
        description: "DESeq2 differential binding per contrast and consensus interval, with the significance call and the MA abscissa precomputed"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "deseq2/results_long.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "contrast": "Contrast id, derived from the results file name"
              "gene_id": "Consensus interval the row scores"
              "base_mean": "Mean of normalised counts across samples"
              "log2fc": "log2 fold change between the two conditions"
              "lfc_se": "Standard error of log2fc"
              "stat": "Wald statistic (log2fc / lfc_se)"
              "pvalue": "Raw Wald p-value"
              "padj": "Benjamini-Hochberg adjusted p-value"
              "log2_base_mean": "log2(baseMean + 1), the A axis of the MA plot"
              "neg_log10_padj": "-log10(padj)"
              "significant": "padj < 0.05 and |log2fc| >= 1"
              "direction": "up / down / not significant"

      # ----------------------------------------------------------------
      # DESeq2 sample-space QC. `deseq2_qc.r` writes the principal
      # components and the sample-to-sample distance matrix of the count
      # matrix it tested, as MultiQC custom content (`*_mqc.tsv`) rather
      # than as the plain `.txt` a single-matrix pipeline publishes, so
      # both collections repoint the catalog recipe's glob.
      # ----------------------------------------------------------------
      - data_collection_tag: "deseq2_qc_pca"
        description: "Principal components of the consensus count matrix DESeq2 tested, one PCA per antibody, with the variance each component explains"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          # NOT the catalog `deseq2/qc_pca.py`: that recipe maps the component
          # columns to the embedding roles by POSITION on the concatenated
          # frame, and chipseq writes one PCA per antibody whose headers carry
          # different variance percentages. The concat then spreads two
          # matrices over four columns and half the cohort comes out null on
          # dim_1 / dim_2. The pipeline-local recipe resolves the components
          # per matrix and keeps the catalog output's column names, so the
          # dashboard still binds `use: deseq2/qc_pca_embedding`.
          transform:
            recipe: "nf-core/chipseq/deseq2_qc_pca.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample_id": "Library the PCA placed"
              "consensus_set": "Which count matrix the components come from, named after the samples in it"
              "dim_1": "First principal component, inside that matrix"
              "dim_2": "Second principal component, inside that matrix"
              "dim_1_percent": "Variance the first component explains in that matrix"
              "dim_2_percent": "Variance the second component explains in that matrix"

      - data_collection_tag: "deseq2_qc_sample_dists"
        description: "Euclidean distance between every pair of libraries on DESeq2 rlog values, one square matrix per antibody"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "deseq2/qc_sample_dists.py"
            source_overrides:
              dists:
                # chipseq publishes the matrix only in its MultiQC
                # custom-content flavour; the recipe's own glob wants the
                # plain `.txt` a single-matrix pipeline writes.
                glob_pattern: "**/*sample.dists_mqc.tsv"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Row label: the library the distances are measured from. The remaining columns are one per library of the same matrix; a pair from two different antibodies is empty, because the two matrices were never compared."

links:
  # Hub -> everything keyed on the ChIP sample name.
  - source_dc_tag: "design"
    source_column: "sample_id"
    target_dc_tag: "multiqc_data"
    target_type: "multiqc"
    link_config:
      resolver: "sample_mapping"
      target_field: "sample_name"
    description: "Filter the MultiQC panels by the samples picked on the design sheet"
    enabled: true

  - source_dc_tag: "design"
    source_column: "sample_id"
    target_dc_tag: "macs2_peaks"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the peak table by the samples picked on the design sheet"
    enabled: true

  - source_dc_tag: "design"
    source_column: "sample_id"
    target_dc_tag: "macs2_peak_summary"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the peak QC summary by the samples picked on the design sheet"
    enabled: true

  - source_dc_tag: "design"
    source_column: "sample_id"
    target_dc_tag: "homer_annotated_peaks"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the peak annotation by the samples picked on the design sheet"
    enabled: true

  # Peak-level selection: pick peaks on the MACS2 panels, read their annotation.
  - source_dc_tag: "macs2_peaks"
    source_column: "peak_id"
    target_dc_tag: "homer_annotated_peaks"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "peak_id"
    description: "Carry a peak selected on the MACS2 panels over to its HOMER annotation"
    enabled: true

  - source_dc_tag: "homer_annotated_peaks"
    source_column: "peak_id"
    target_dc_tag: "macs2_peaks"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "peak_id"
    description: "Carry a peak selected in the annotation table back to the MACS2 panels"
    enabled: true

  # Consensus-level selection: an interval scored by DESeq2 is the same
  # interval the consensus matrices carry.
  - source_dc_tag: "macs2_consensus_boolean"
    source_column: "peak_id"
    target_dc_tag: "macs2_consensus_fc"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "peak_id"
    description: "Carry a consensus interval selected on the overlap panels over to the signal heatmap"
    enabled: true

  - source_dc_tag: "macs2_consensus_fc"
    source_column: "peak_id"
    target_dc_tag: "macs2_consensus_boolean"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "peak_id"
    description: "Carry a consensus interval selected on the signal heatmap back to the overlap panels"
    enabled: true

  # Signal-level QC, keyed on the same ChIP sample name as everything else.
  - source_dc_tag: "design"
    source_column: "sample_id"
    target_dc_tag: "preseq_complexity_curve"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the complexity curves by the samples picked on the design sheet"
    enabled: true

  - source_dc_tag: "design"
    source_column: "sample_id"
    target_dc_tag: "deeptools_fingerprint_metrics"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the fingerprint metrics by the samples picked on the design sheet"
    enabled: true

  - source_dc_tag: "design"
    source_column: "sample_id"
    target_dc_tag: "deeptools_plot_profile"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the metagene profiles by the samples picked on the design sheet"
    enabled: true

  - source_dc_tag: "design"
    source_column: "sample_id"
    target_dc_tag: "homer_tss_distance_profile"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the TSS distance profiles by the samples picked on the design sheet"
    enabled: true

  # Library-level scope. The FastQC and Trim Galore panels are keyed on the
  # sequencing library (<sample>_T<n>), not on the merged sample, so the library
  # sheet reaches the MultiQC report on its own key.
  - source_dc_tag: "design_reads"
    source_column: "sample_id"
    target_dc_tag: "multiqc_data"
    target_type: "multiqc"
    link_config:
      resolver: "sample_mapping"
      target_field: "sample_name"
    description: "Filter the read-level MultiQC panels by the sequencing libraries picked in the left panel"
    enabled: true

  # The consensus sets and the DESeq2 contrasts are per ANTIBODY, not per
  # sample: a consensus set is named after the longest common prefix of the
  # samples merged into it (EZH2_IP, FOXA1_IP) and a contrast after the two
  # groups compared (EZH2_IP_NTKOvsEZH2_IP_TKO). The `wildcard` resolver matches
  # a target value that starts with the antibody, which is what makes the
  # persistent antibody filter reach the Consensus and Differential binding
  # tabs. A per-sample link cannot exist there: neither collection has a sample
  # column, because both aggregate over samples by construction.
  - source_dc_tag: "design"
    source_column: "antibody"
    target_dc_tag: "macs2_consensus_boolean"
    target_type: "table"
    link_config:
      resolver: "wildcard"
      target_field: "consensus_set"
    description: "Narrow the consensus overlap panels to the antibody picked in the left panel"
    enabled: true

  - source_dc_tag: "design"
    source_column: "antibody"
    target_dc_tag: "macs2_consensus_fc"
    target_type: "table"
    link_config:
      resolver: "wildcard"
      target_field: "consensus_set"
    description: "Narrow the consensus signal heatmap to the antibody picked in the left panel"
    enabled: true

  - source_dc_tag: "design"
    source_column: "antibody"
    target_dc_tag: "deseq2_results"
    target_type: "table"
    link_config:
      resolver: "wildcard"
      target_field: "contrast"
    description: "Narrow the differential binding panels to the contrasts of the antibody picked in the left panel"
    enabled: true

  # Interval-level selection. A DESeq2 row scores one consensus interval, and
  # that is the interval the consensus tables carry: `gene_id` here is the
  # `interval_id` there. Without this pair `deseq2_results` was bound by four
  # tabs' worth of tiles and reachable by no filter at all.
  - source_dc_tag: "macs2_consensus_boolean"
    source_column: "interval_id"
    target_dc_tag: "deseq2_results"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "gene_id"
    description: "Carry a consensus interval selected on the overlap panels over to its differential binding row"
    enabled: true

  - source_dc_tag: "deseq2_results"
    source_column: "gene_id"
    target_dc_tag: "macs2_consensus_boolean"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "interval_id"
    description: "Carry an interval selected on the differential binding panels back to the consensus tables"
    enabled: true

  # Sample-space QC is per library again, so it rejoins the hub on the sample
  # name; the antibody link narrows the PCA to one matrix, which is the only
  # scale on which its axes mean anything.
  - source_dc_tag: "design"
    source_column: "sample_id"
    target_dc_tag: "deseq2_qc_pca"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample_id"
    description: "Filter the count-matrix PCA by the libraries picked in the left panel"
    enabled: true

  - source_dc_tag: "design"
    source_column: "antibody"
    target_dc_tag: "deseq2_qc_pca"
    target_type: "table"
    link_config:
      resolver: "wildcard"
      target_field: "consensus_set"
    description: "Narrow the count-matrix PCA to the antibody picked in the left panel"
    enabled: true

  - source_dc_tag: "design"
    source_column: "sample_id"
    target_dc_tag: "deseq2_qc_sample_dists"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the sample distance matrix by the libraries picked in the left panel"
    enabled: true
