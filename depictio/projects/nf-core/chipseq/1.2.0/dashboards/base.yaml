version: 1
# nf-core/chipseq 1.2.0 reference dashboard.
#
# Funnel: sequencing QC (the reprocessed MultiQC report) -> the peaks each
# sample yielded -> the consensus peak set per antibody -> differential binding
# between conditions. The design sheet is the hub: the sample filter in the left
# panel reaches the MultiQC panels, the peak table, the peak QC summary and the
# HOMER annotation through the project links.
#
# The MultiQC report bound here was re-generated with MultiQC 1.35 from the
# run's raw tool outputs; the run itself published MultiQC 1.9, which writes no
# parquet. Anchors and section names are therefore the 1.35 ones.
main_dashboard:
  title: nf-core/chipseq
  subtitle: "nf-core/chipseq 1.2.0 megatest: EZH2 (NTKO / TKO) and FOXA1 (E2 / VEH) ChIP against matched inputs"
  project_tag: ChIP-seq Peak Analysis
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab through the project links
    persistent: true
    pin: top
  - name: QC thresholds
    icon: mdi:tune
    color: cyan
    description: Signal-to-noise and yield floors on the per-sample QC summary
    collapsed: true
    persistent: true
    pin: bottom
  # `ChIP design` is pinned to the top and `Reference tables` to the bottom, so
  # the design sheet every filter starts from and the per-sample QC rows every
  # tile is computed from trail each tab. Both are declared here, on the tab no
  # route conditional can remove.
  grid_sections:
  - name: ChIP design
    icon: mdi:table-account
    color: teal
    description: The design sheet every tab is filtered by
    collapsed: true
    persistent: true
    pin: top
  - name: Run summary
    icon: mdi:view-dashboard-outline
    color: teal
    description: MultiQC's general statistics table, one row per library
  - name: Read quality
    icon: mdi:chart-bell-curve
    color: blue
    description: FastQC and Trim Galore as MultiQC reports them
  - name: Alignment and library complexity
    icon: mdi:chart-bar
    color: indigo
    description: How much of each library survived alignment, filtering and deduplication
  - name: ChIP enrichment
    icon: mdi:chart-line
    color: cyan
    description: Whether the ChIP is enriched over its input, and how sharply
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The per-sample peak QC rows, on every tab
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # -------------------------------------------------------------- run summary
  # This tab holds MultiQC panels only. The four peak-yield cards that used to
  # open it read `macs2/peak_summary`, not the report; see VALIDATION_REPORT.md,
  # CS-D13, for where each of them already existed.
  - component_type: text
    tag: cs-qc-intro
    section: Run summary
    title: A ChIP-seq run, from reads to peaks
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [MultiQC](https://multiqc.info) pools what every tool reported into one
      row per library. The panels below take that apart: read quality,
      alignment and library complexity, and whether each ChIP is enriched over
      its own input. The peaks themselves are on the Peaks tab.
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  # chipseq runs `samtools stats` and `samtools flagstat` over the same BAMs and
  # both contribute a general-stats column titled "Reads mapped", which the API's
  # payload builder used to collapse onto one label (a 500 on render). See
  # VALIDATION_REPORT.md, CS-D3. The table paginates at 50 rows, so the 80
  # libraries of this run come out over two pages.
  - component_type: multiqc
    tag: cs-qc-general-stats
    section: Run summary
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    title: General statistics
    description: One row per library, pooling the FastQC, Trim Galore, samtools, Picard, MACS2 and phantompeakqualtools headline numbers.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 5}

  # ------------------------------------------------------------ read quality
  - component_type: text
    tag: cs-qc-reads-intro
    section: Read quality
    title: Raw and trimmed reads
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/) on
      the raw and the trimmed libraries, plus what
      [Trim Galore](https://www.bioinformatics.babraham.ac.uk/projects/trim_galore/)
      removed. Every library carries a technical-replicate suffix, so a sample
      appears here once per library.
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: cs-qc-fastqc-counts
    section: Read quality
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Counts
    use: multiqc/fastqc
    title: Sequence counts
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: cs-qc-fastqc-quality
    section: Read quality
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    use: multiqc/fastqc
    title: Per-base sequence quality
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: cs-qc-cutadapt
    section: Read quality
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    selected_module: cutadapt
    selected_plot: Filtered Reads
    use: multiqc/cutadapt
    title: Reads kept after trimming
    title_size: sm
    title_align: left
    layout: {x: 0, y: 6, w: 8, h: 4}

  # ------------------------------------------- alignment and library complexity
  - component_type: text
    tag: cs-qc-align-intro
    section: Alignment and library complexity
    title: From libraries to filtered alignments
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Libraries are merged per sample, duplicates marked and low-quality or
      blacklisted alignments removed. The complexity curve says whether deeper
      sequencing would still find new molecules.
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: cs-qc-samtools
    section: Alignment and library complexity
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    selected_module: samtools
    selected_plot: Percent mapped
    use: multiqc/samtools
    title: Percent mapped
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: cs-qc-picard-dup
    section: Alignment and library complexity
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    selected_module: picard
    selected_plot: Mark Duplicates
    use: multiqc/picard
    title: Duplication
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: cs-qc-preseq
    section: Alignment and library complexity
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    selected_module: preseq
    selected_plot: Complexity curve (molecule count)
    use: multiqc/preseq
    title: Library complexity curve
    title_size: sm
    title_align: left
    layout: {x: 0, y: 6, w: 8, h: 5}
  - component_type: multiqc
    tag: cs-qc-featurecounts
    section: Alignment and library complexity
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    selected_module: featurecounts
    selected_plot: Assignments
    use: multiqc/featurecounts
    title: Reads assigned to consensus peaks
    title_size: sm
    title_align: left
    layout: {x: 0, y: 11, w: 8, h: 4}

  # --------------------------------------------------------- ChIP enrichment
  - component_type: text
    tag: cs-qc-enrich-intro
    section: ChIP enrichment
    title: Is the ChIP enriched over its input?
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The fingerprint curve separates an enriched ChIP from a flat input. FRiP
      is the share of reads inside called peaks, and the strand cross-correlation
      coefficients say how sharp the signal is.
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: cs-qc-fingerprint
    section: ChIP enrichment
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    selected_module: deepTools
    selected_plot: Fingerprint plot
    use: multiqc/deeptools
    title: deepTools fingerprint
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: cs-qc-frip
    section: ChIP enrichment
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    selected_module: frip_score
    selected_plot: frip_score-section
    title: FRiP score
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: cs-qc-strandshift
    section: ChIP enrichment
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    selected_module: strand_shift_correlation
    selected_plot: strand_shift_correlation-section
    title: Strand cross-correlation
    title_size: sm
    title_align: left
    layout: {x: 0, y: 6, w: 4, h: 5}
  - component_type: multiqc
    tag: cs-qc-nsc
    section: ChIP enrichment
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    selected_module: nsc_coefficient
    selected_plot: nsc_coefficient-section
    title: NSC coefficient
    title_size: sm
    title_align: left
    layout: {x: 4, y: 6, w: 4, h: 5}
  # The deepTools "Read Distribution Profile after Annotation" panel used to sit
  # beside this one. It is MultiQC's rendering of the same plotProfile matrix the
  # Signal tab draws as an advanced_viz, so only the richer of the two is kept.
  - component_type: multiqc
    tag: cs-qc-rsc
    section: ChIP enrichment
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    selected_module: rsc_coefficient
    selected_plot: rsc_coefficient-section
    title: RSC coefficient
    title_size: sm
    title_align: left
    layout: {x: 0, y: 11, w: 8, h: 5}

  # ------------------------------------------------------------- ChIP design
  - component_type: text
    tag: cs-meta-intro
    section: ChIP design
    title: The cohort behind the run
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Which input control each ChIP was called against, and the antibody it was
      raised against. Every sample filter in the left panel starts from this
      sheet, so it is what the rest of the dashboard is narrowed by.
    workflow_tag: chipseq
    data_collection_tag: design
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: cs-meta-card-samples
    index: cs-meta-card-samples
    section: ChIP design
    workflow_tag: chipseq
    data_collection_tag: design
    aggregation: nunique
    column_name: sample_id
    column_type: object
    secondary_layout: donut
    breakdown_col: antibody
    display: {icon_name: 'mdi:test-tube', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: ChIP samples
    layout: {x: 0, y: 1, w: 2, h: 2}
  - component_type: card
    tag: cs-meta-card-antibodies
    index: cs-meta-card-antibodies
    section: ChIP design
    workflow_tag: chipseq
    data_collection_tag: design
    aggregation: nunique
    column_name: antibody
    column_type: object
    secondary_layout: top_n
    breakdown_col: antibody
    top_n_count: 3
    display: {icon_name: 'mdi:dna', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Antibodies
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: cs-meta-card-controls
    index: cs-meta-card-controls
    section: ChIP design
    workflow_tag: chipseq
    data_collection_tag: design
    aggregation: nunique
    column_name: control_id
    column_type: object
    secondary_layout: composition
    breakdown_col: antibody
    display: {icon_name: 'mdi:flask', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Input controls
    layout: {x: 4, y: 1, w: 2, h: 2}
  - component_type: card
    tag: cs-meta-card-replicates
    index: cs-meta-card-replicates
    section: ChIP design
    workflow_tag: chipseq
    data_collection_tag: design
    aggregation: average
    column_name: replicatesExist
    column_type: int64
    secondary_layout: gauge
    coverage_max: 1
    display: {icon_name: 'mdi:relation-many-to-many', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Replicated share
    layout: {x: 6, y: 1, w: 2, h: 2}
  - component_type: table
    tag: cs-ref-table-design
    section: ChIP design
    workflow_tag: chipseq
    data_collection_tag: design
    row_selection_enabled: false
    title: ChIP design
    description: One row per ChIP sample, with its input control and antibody.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 3, w: 8, h: 4}

  # -------------------------------------------------------- reference tables
  - component_type: text
    tag: cs-ref-intro
    section: Reference tables
    title: The per-sample QC rows
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per ChIP sample: the peak count, the FRiP score and the width,
      enrichment and significance spreads of what MACS2 called. Pinned to every
      tab, and narrowed by the filters picked in the left panel.
    workflow_tag: chipseq
    data_collection_tag: macs2_peak_summary
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: table
    tag: cs-ref-table-summary
    section: Reference tables
    workflow_tag: chipseq
    data_collection_tag: macs2_peak_summary
    use: macs2/peak_summary
    row_selection_enabled: false
    title: Peak QC summary
    description: Peak count, FRiP score and the width, enrichment and significance spreads per sample.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 4}

  # -------------------------------------------------------------- left panel
  - component_type: interactive
    tag: cs-filter-sample
    index: cs-sample-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: chipseq
    data_collection_tag: design
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:test-tube'}
    placement: left
    title: ChIP sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: cs-filter-antibody
    index: cs-antibody-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: chipseq
    data_collection_tag: design
    interactive_component_type: MultiSelect
    column_name: antibody
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:dna'}
    placement: left
    title: Antibody
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: cs-filter-frip
    index: cs-frip-range
    section: QC thresholds
    group: Signal quality
    workflow_tag: chipseq
    data_collection_tag: macs2_peak_summary
    interactive_component_type: RangeSlider
    column_name: frip_score
    column_type: float64
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:target'}
    placement: left
    title: FRiP score
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: cs-filter-peakcount
    index: cs-peakcount-range
    section: QC thresholds
    group: Signal quality
    workflow_tag: chipseq
    data_collection_tag: macs2_peak_summary
    interactive_component_type: RangeSlider
    column_name: num_peaks
    column_type: int64
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:counter'}
    placement: left
    title: Peaks called
    layout: {x: 0, y: 3, w: 1, h: 3}

tabs:
# ============================================================================
# Signal
# ============================================================================
# The MultiQC tab holds MultiQC panels. preseq, plotFingerprint and plotProfile
# each write a per-sample table beside the curve MultiQC draws, and those tables
# are what this tab reads. The persistent `Sample filters`, `QC thresholds`,
# `ChIP design` and `Reference tables` sections declared on the main tab reach
# this one too, so no filter section is redeclared here.
- title: Signal
  subtitle: The per-sample signal numbers behind the MultiQC curves - library complexity, coverage concentration and the metagene profile
  tab_order: 2
  tab_icon: mdi:waves
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  grid_sections:
  - name: Signal at a glance
    icon: mdi:counter
    color: cyan
    description: The four numbers a ChIP library's signal is judged on
  - name: Library complexity
    icon: mdi:chart-line
    color: blue
    description: Whether sequencing deeper would still find new molecules
  - name: Coverage concentration
    icon: mdi:chart-scatter-plot
    color: indigo
    description: How far each IP's coverage departs from its own input control
  - name: Metagene signal
    icon: mdi:chart-bell-curve
    color: teal
    description: Where the signal sits along a gene, from upstream flank to downstream flank
  components:
  # ---------------------------------------------------------- at a glance
  - component_type: text
    tag: cs-sig-intro
    section: Signal at a glance
    title: The numbers beside the curves
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [preseq](https://github.com/smithlabcode/preseq), plotFingerprint and
      plotProfile each write a per-sample table next to the curve
      [MultiQC](https://multiqc.info) renders. Those tables are read here: how
      much new material a library still holds, how concentrated its coverage
      is, and where its signal sits along a gene.
    workflow_tag: chipseq
    data_collection_tag: deeptools_fingerprint_metrics
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: cs-sig-card-ratio
    index: cs-sig-card-ratio
    section: Signal at a glance
    workflow_tag: chipseq
    data_collection_tag: deeptools_fingerprint_metrics
    use: deeptools/fingerprint_metrics
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: auc_ratio
    column_type: float64
    display: {icon_name: 'mdi:target', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Coverage concentration
    layout: {x: 0, y: 1, w: 2, h: 2}
  - component_type: card
    tag: cs-sig-card-jsd
    index: cs-sig-card-jsd
    section: Signal at a glance
    workflow_tag: chipseq
    data_collection_tag: deeptools_fingerprint_metrics
    use: deeptools/fingerprint_metrics
    aggregation: average
    column_name: js_distance
    column_type: float64
    secondary_layout: gauge
    coverage_max: 1
    display: {icon_name: 'mdi:magnet', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Divergence from input
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: cs-sig-card-enriched
    index: cs-sig-card-enriched
    section: Signal at a glance
    workflow_tag: chipseq
    data_collection_tag: deeptools_fingerprint_metrics
    use: deeptools/fingerprint_metrics
    aggregation: average
    column_name: percent_genome_enriched
    column_type: float64
    secondary_layout: histogram
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Genome called enriched
    layout: {x: 4, y: 1, w: 2, h: 2}
  - component_type: card
    tag: cs-sig-card-signal
    index: cs-sig-card-signal
    section: Signal at a glance
    workflow_tag: chipseq
    data_collection_tag: deeptools_plot_profile
    use: deeptools/plot_profile
    aggregation: max
    column_name: signal
    column_type: float64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:chart-line', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Strongest metagene signal
    layout: {x: 6, y: 1, w: 2, h: 2}

  # ----------------------------------------------------- library complexity
  - component_type: text
    tag: cs-sig-complexity-intro
    section: Library complexity
    title: "How much new material is left in each library"
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The MultiQC tab plots the expected-distinct curve alone. This one adds the 95% interval preseq puts around it: where the ribbon is narrow the extrapolation is safe, where it fans out, sequencing deeper is a guess.
    workflow_tag: chipseq
    data_collection_tag: preseq_complexity_curve
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: cs-qc-av-complexity
    index: cs-qc-av-complexity
    section: Library complexity
    workflow_tag: chipseq
    data_collection_tag: preseq_complexity_curve
    use: preseq/complexity_ribbon
    config:
      log_x: true
      band_opacity: 0.18
      line_width: 2
      x_title: Sequencing depth (reads)
      y_title: Expected distinct molecules
      legend_pos: right
      selection_enabled: true
      selection_column: sample
    title: "Library complexity with its confidence ribbon"
    description: "One curve per library, extrapolated by preseq; the band is the 95% interval on that extrapolation. Click a curve to filter the dashboard to that library."
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 7}

  # -------------------------------------------------- coverage concentration
  - component_type: text
    tag: cs-sig-fingerprint-intro
    section: Coverage concentration
    title: "How far each IP departs from its own input"
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      plotFingerprint compares every IP against the input it was called against. The two axes are that comparison: how much of the genome is called enriched, and how far the coverage diverges from the control. The eight input libraries carry no point because they are the reference.
    workflow_tag: chipseq
    data_collection_tag: deeptools_fingerprint_metrics
    layout: {x: 0, y: 0, w: 8, h: 1}
  # Rebound off the catalog's `auc` / `synthetic_js_distance` default. Those two
  # are the same measurement twice (r = -0.87 across the 16 libraries here), so
  # the cloud came out as a diagonal band that says nothing a single bar chart
  # would not. `percent_genome_enriched` against `js_distance` is deepTools' own
  # QC scatter and the two axes are independent; the price is that it plots the
  # 8 IP libraries only, because the JSD columns need `--JSDsample` and the
  # inputs are the sample they are compared against.
  - component_type: advanced_viz
    tag: cs-qc-av-fingerprint
    index: cs-qc-av-fingerprint
    section: Coverage concentration
    workflow_tag: chipseq
    data_collection_tag: deeptools_fingerprint_metrics
    use: deeptools/fingerprint_scatter
    config:
      x_col: percent_genome_enriched
      y_col: js_distance
      label_col: sample
      size_col: diff_enrichment
      color_col: auc_ratio
      color_scale: Viridis
      x_title: Share of the genome called enriched
