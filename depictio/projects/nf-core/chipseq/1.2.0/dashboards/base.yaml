    column_type: int64
    secondary_layout: histogram
    display: {icon_name: 'mdi:layers-outline', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Peaks merged
    layout: {x: 4, y: 1, w: 2, h: 2}
  - component_type: card
    tag: cs-cons-card-sets
    index: cs-cons-card-sets
    section: Consensus at a glance
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    aggregation: count
    column_name: consensus_set
    column_type: object
    secondary_layout: donut
    breakdown_col: consensus_set
    display: {icon_name: 'mdi:shape-outline', icon_color: '#5E35B1', title_color: '#5E35B1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Intervals per set
    layout: {x: 6, y: 1, w: 2, h: 2}

  - component_type: text
    tag: cs-cons-upset-intro
    section: Replicate agreement
    title: Which samples call the same intervals
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each bar is a combination of samples calling exactly the same set of
      intervals. Pick one antibody in the left panel first: with two consensus
      sets in view the combinations of one never meet those of the other.
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: cs-cons-av-upset
    index: cs-cons-av-upset
    section: Replicate agreement
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_upset
    config:
      set_columns: [EZH2_IP_NTKO_R1, EZH2_IP_NTKO_R2, EZH2_IP_TKO_R1, EZH2_IP_TKO_R2, FOXA1_IP_E2_R1, FOXA1_IP_E2_R2, FOXA1_IP_VEH_R1, FOXA1_IP_VEH_R2]
      color_intersections_by: degree
      show_set_sizes: true
      show_values: true
      sort_by: cardinality
      sort_order: descending
      min_size: 1
    title: Consensus peak overlap
    description: Intersections of the samples calling each consensus interval, largest first.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 7}

  - component_type: text
    tag: cs-cons-heatmap-intro
    section: Signal at the strongest intervals
    title: How strong the binding is, interval by interval
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Fold enrichment of the 250 most strongly bound intervals of each consensus
      set. A cell is zero where that sample called no peak, so condition-specific
      binding reads as a block rather than as scattered gaps.
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_fc
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: cs-cons-av-heatmap
    index: cs-cons-av-heatmap
    section: Signal at the strongest intervals
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_fc
    use: macs2/consensus_signal_heatmap
    config:
      value_columns: [EZH2_IP_NTKO_R1, EZH2_IP_NTKO_R2, EZH2_IP_TKO_R1, EZH2_IP_TKO_R2, FOXA1_IP_E2_R1, FOXA1_IP_E2_R2, FOXA1_IP_VEH_R1, FOXA1_IP_VEH_R2]
      row_annotation_cols: [consensus_set, support]
      cluster_rows: true
      cluster_cols: true
      normalize: log1p
      colorscale: Viridis
    title: Consensus signal heatmap
    description: Log-scaled MACS2 fold enrichment per sample at the strongest consensus intervals, rows and columns clustered.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 7}

  - component_type: text
    tag: cs-cons-tables-intro
    section: Consensus tables
    title: The consensus rows
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The merged intervals and their per-sample presence, and the fold
      enrichment behind the heatmap. Selecting a row in one carries the interval
      to the other.
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: table
    tag: cs-cons-table-boolean
    section: Consensus tables
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    row_selection_enabled: true
    row_selection_column: peak_id
    title: Consensus intervals
    description: Coordinates, how many peaks merged into the interval and which samples called it.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 5}
  - component_type: table
    tag: cs-cons-table-fc
    section: Consensus tables
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_fc
    use: macs2/consensus_fc
    row_selection_enabled: true
    row_selection_column: peak_id
    title: Consensus fold enrichment
    description: Per-sample fold enrichment at the strongest intervals of each set.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 6, w: 8, h: 5}

  - component_type: interactive
    tag: cs-cons-filter-set
    index: cs-cons-set-filter
    section: Consensus scope
    group: Consensus
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
    interactive_component_type: MultiSelect
    column_name: consensus_set
    column_type: object
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Consensus set
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: cs-cons-filter-support
    index: cs-cons-support-range
    section: Consensus scope
    group: Consensus
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
    interactive_component_type: RangeSlider
    column_name: num_samples
    column_type: int64
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:account-group-outline'}
    placement: left
    title: Samples per interval
    layout: {x: 0, y: 3, w: 1, h: 3}

# ============================================================================
# Differential binding
# ============================================================================
- title: Differential binding
  subtitle: "DESeq2 on the consensus peak counts: EZH2 NTKO against TKO, FOXA1 E2 against VEH"
  tab_order: 5
  tab_icon: mdi:scale-balance
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Contrast
    icon: mdi:scale-balance
    color: grape
    description: Which comparison to read, and how strong a change has to be
  grid_sections:
  - name: Differential binding at a glance
    icon: mdi:counter
    color: grape
    description: How many intervals changed, and by how much
  - name: Volcano and MA
    icon: mdi:chart-scatter-plot
    color: grape
    description: Significance against effect size, and effect size against read depth
  - name: Calibration and direction
    icon: mdi:chart-bell-curve
    color: violet
    description: Whether the p-values behave, and which way the changes go
  - name: Differential tables
    icon: mdi:table
    color: violet
    description: The DESeq2 rows behind the panels
    collapsed: true
  components:
  - component_type: text
    tag: cs-db-intro
    section: Differential binding at a glance
    title: Binding that changes between conditions
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [DESeq2](https://bioconductor.org/packages/DESeq2) counts reads over the
      consensus intervals of one antibody and tests each interval between the
      two conditions. Pick a single contrast in the left panel before reading
      the volcano or the MA plot.
    workflow_tag: chipseq
    data_collection_tag: deseq2_results
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: cs-db-card-intervals
    index: cs-db-card-intervals
    section: Differential binding at a glance
    workflow_tag: chipseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: nunique
    column_name: gene_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: direction
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Intervals tested
    layout: {x: 0, y: 1, w: 2, h: 2}
  - component_type: card
    tag: cs-db-card-direction
    index: cs-db-card-direction
    section: Differential binding at a glance
    workflow_tag: chipseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: count
    column_name: direction
    column_type: object
    secondary_layout: donut
    breakdown_col: direction
    display: {icon_name: 'mdi:chart-donut', icon_color: '#5E35B1', title_color: '#5E35B1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Direction of change
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: cs-db-card-lfc
    index: cs-db-card-lfc
    section: Differential binding at a glance
    workflow_tag: chipseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: log2fc
    column_type: float64
    display: {icon_name: 'mdi:scale-balance', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: log2 fold change
    layout: {x: 4, y: 1, w: 2, h: 2}
  - component_type: card
    tag: cs-db-card-padj
    index: cs-db-card-padj
    section: Differential binding at a glance
    workflow_tag: chipseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: max
    column_name: neg_log10_padj
    column_type: float64
    secondary_layout: threshold
    threshold_value: 1.3
    threshold_direction: min
    threshold_warn: 1
    display: {icon_name: 'mdi:check-decagram', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Strongest -log10 padj
    layout: {x: 6, y: 1, w: 2, h: 2}

  - component_type: text
    tag: cs-db-volcano-intro
    section: Volcano and MA
    title: Effect size against significance and against depth
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The volcano puts significance against effect size, the MA plot puts effect
      size against how many reads the interval carries. Together they separate a
      real change from a loud one measured on almost no reads.
    workflow_tag: chipseq
    data_collection_tag: deseq2_results
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: cs-db-av-volcano
    index: cs-db-av-volcano
    section: Volcano and MA
    workflow_tag: chipseq
    data_collection_tag: deseq2_results
    use: deseq2/volcano
    config:
      label_col: gene_id
      category_col: direction
      significance_threshold: 0.05
      effect_threshold: 1.0
      top_n_labels: 15
      show_labels: true
    title: Volcano
    description: -log10(padj) against log2 fold change. The dashed lines are padj 0.05 and a two-fold change.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 7}
  - component_type: advanced_viz
    tag: cs-db-av-ma
    index: cs-db-av-ma
    section: Volcano and MA
    workflow_tag: chipseq
    data_collection_tag: deseq2_results
    use: deseq2/ma
    config:
      significance_col: padj
      label_col: gene_id
      significance_threshold: 0.05
      fold_change_threshold: 1.0
      top_n_labels: 15
      show_labels: true
    title: MA plot
    description: log2 fold change against log2 mean normalised count. Low-count intervals fan out on the left.
    title_size: h3
    layout: {x: 0, y: 8, w: 8, h: 7}

  - component_type: text
    tag: cs-db-qq-intro
    section: Calibration and direction
    title: Do the p-values behave?
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The QQ plot compares the observed p-values against the uniform null: a
      curve that leaves the diagonal early is real signal, one that leaves it
      immediately is usually confounding. The bars rank the strongest changes.
    workflow_tag: chipseq
    data_collection_tag: deseq2_results
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: cs-db-av-qq
    index: cs-db-av-qq
    section: Calibration and direction
    workflow_tag: chipseq
    data_collection_tag: deseq2_results
    use: deseq2/qq
    config:
      feature_id_col: gene_id
      category_col: direction
    title: QQ plot
    description: Observed against expected p-value quantiles for the contrast in view.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 7}
  - component_type: advanced_viz
    tag: cs-db-av-dabar
    index: cs-db-av-dabar
    section: Calibration and direction
    workflow_tag: chipseq
    data_collection_tag: deseq2_results
    use: deseq2/da_barplot
    config:
      significance_col: padj
      significance_threshold: 0.05
      top_n: 25
    title: Strongest differential intervals
    description: The 25 intervals with the largest significant effect, signed by direction.
    title_size: h3
    layout: {x: 0, y: 8, w: 8, h: 7}

  - component_type: text
    tag: cs-db-tables-intro
    section: Differential tables
    title: The DESeq2 rows
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Every tested interval with its effect size, standard error and adjusted
      p-value. Tick a row to carry that interval into the panels above.
    workflow_tag: chipseq
    data_collection_tag: deseq2_results
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: table
    tag: cs-db-table-results
    section: Differential tables
    workflow_tag: chipseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    row_selection_enabled: true
    row_selection_column: gene_id
    title: DESeq2 differential binding
    description: One row per contrast and consensus interval, sorted by adjusted p-value.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 6}

  - component_type: interactive
    tag: cs-db-filter-contrast
    index: cs-db-contrast-filter
    section: Contrast
    group: Contrast scope
    workflow_tag: chipseq
    data_collection_tag: deseq2_results
    interactive_component_type: Select
    column_name: contrast
    column_type: object
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:scale-balance'}
    placement: left
    title: Contrast
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    tag: cs-db-filter-direction
    index: cs-db-direction-filter
    section: Contrast
    group: Contrast scope
    workflow_tag: chipseq
    data_collection_tag: deseq2_results
    interactive_component_type: MultiSelect
    column_name: direction
    column_type: object
    display: {title_size: md, custom_color: '#5E35B1', icon_name: 'mdi:chart-donut'}
    placement: left
    title: Direction
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: interactive
    tag: cs-db-filter-lfc
    index: cs-db-lfc-range
    section: Contrast
    group: Effect size
    workflow_tag: chipseq
    data_collection_tag: deseq2_results
    interactive_component_type: RangeSlider
    column_name: log2fc
    column_type: float64
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:scale-balance'}
    placement: left
    title: log2 fold change
    layout: {x: 0, y: 5, w: 1, h: 3}
  - component_type: interactive
    tag: cs-db-filter-padj
    index: cs-db-padj-range
    section: Contrast
    group: Effect size
    workflow_tag: chipseq
    data_collection_tag: deseq2_results
    interactive_component_type: RangeSlider
    column_name: neg_log10_padj
    column_type: float64
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:check-decagram'}
    placement: left
    title: -log10 padj
    layout: {x: 0, y: 8, w: 1, h: 3}
