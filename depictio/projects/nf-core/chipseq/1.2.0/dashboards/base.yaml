    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [DESeq2](https://bioconductor.org/packages/DESeq2) counts reads over the consensus
      intervals of each antibody and tests each one between two conditions. Pick a single
      contrast on the left first: every number on this tab depends on it.
