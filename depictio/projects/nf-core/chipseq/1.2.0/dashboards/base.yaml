version: 1
# nf-core/chipseq 1.2.0, on the family rules of depictio/projects/nf-core/RULES.md
# (ampliseq/2.18.0 is the reference implementation). atacseq/1.2.2 is its
# sibling: the two share their tab groups, tab names and KPI logic wherever
# their data allow, so a reader moving between them finds the same places.
#
# Funnel: library QC (the reprocessed MultiQC report, the deepTools and preseq
# tables) -> the peaks each library yielded, where they land and what one
# region holds -> the consensus set per antibody -> differential binding
# between conditions. The `design` hub carries one row per library (the ChIPs
# and their input controls) with the antibody, the replicate and the condition:
# GROUP_COL of the design table (METADATA_FILE) when there is one, else the
# design sheet's group. The hub column is always named `condition`, so the
# dashboard reads it literally and never depends on the optional table.
#
# The MultiQC report bound here was re-generated with MultiQC 1.35 from the
# run's raw tool outputs; the run itself published MultiQC 1.9, which writes no
# parquet. DSL1 wrote no params.json either: the Run parameters dialog lists
# the software versions, which is what the `params:` links search.
main_dashboard:
  title: nf-core/chipseq
  subtitle: Protein-DNA binding, from library quality to the regions that change between conditions
  project_tag: ChIP-seq Peak Analysis
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family.
  category_colors:
    condition: auto
    antibody: auto
    role:
      ChIP: '#1c7ed6'
      input control: '#868e96'
    # HOMER's coarse feature classes, written out so a class keeps its colour
    # on the annotation bars, the donut cards and the gene track.
    annotation_class:
      '*': auto
      promoter-TSS: '#d6336c'
      "5' UTR": '#ae3ec9'
      exon: '#7048e8'
      intron: '#1c7ed6'
      "3' UTR": '#1098ad'
      TTS: '#0ca678'
      non-coding: '#74b816'
      Intergenic: '#f59f00'
    direction:
      up: '#e03131'
      down: '#1971c2'
      not significant: '#adb5bd'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. All
  # five are bound to the design hub; the antibody reaches the consensus sets
  # and the DESeq2 contrasts through prefix links.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  - name: QC thresholds
    icon: mdi:tune
    color: cyan
    description: Signal-to-noise and yield floors on the per-library peak QC
    collapsed: true
    persistent: true
    pin: bottom
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab, which no route removes.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The design behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The per-library peak QC rows behind the tiles
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Libraries, below).
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: design
    interactive_component_type: MultiSelect
    column_name: condition
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: Condition
    section: Key figures
    tag: cs-ov-kf-condition
    index: ov-kf-condition
    title: Condition
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: design
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Library
    section: Key figures
    tag: cs-ov-kf-library
    index: ov-kf-library
    title: Library
    layout: {x: 2, y: 0, w: 2, h: 1}
  # The pipeline's wordmark, read from its repository; where it cannot load (no
  # internet), the title is drawn as text.
  - component_type: text
    title: nf-core/chipseq
    logo: https://raw.githubusercontent.com/nf-core/chipseq/master/docs/images/nf-core-chipseq_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/chipseq/master/docs/images/nf-core-chipseq_logo_dark.png
    order: 1
    body: >
      Protein-DNA binding from ChIP-seq reads: how well each library worked, the peaks
      each ChIP yielded against its input, and the regions bound differently between
      conditions. [Run parameters](params:)
    tag: cs-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/chipseq aligns ChIP-seq reads, calls the peaks of each ChIP against its input control with MACS2 and compares them between the conditions of the design, one antibody at a time. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The sample filters in the left panel apply to every tab: narrow the libraries once and the whole dashboard follows. A bar above a section narrows that section only.
    tag: cs-ov-about
    index: ov-about
    layout: {x: 0, y: 1, w: 5, h: 3}
  # DSL1 wrote no params.json, so the run's facts come from its own tables
  # (`values:`) and the genome from the GENOME template variable.
  - component_type: text
    surface: card
    values:
      libraries: {dc: design, column: sample_id, aggregation: nunique, format: integer}
      chips: {dc: design, column: sample_id, aggregation: nunique, filter_expr: col('role') == 'ChIP', format: integer}
      antibodies: {dc: design, column: antibody, aggregation: nunique, filter_expr: col('role') == 'ChIP',
        format: integer}
      conditions: {dc: design, column: condition, aggregation: nunique, format: integer}
      peaks: {dc: macs2_peak_summary, column: num_peaks, aggregation: sum, format: si}
    body: |
      ### The run
      - ![](icon:mdi:test-tube) **Libraries** {{libraries}}, {{chips}} of them ChIPs
      - ![](icon:mdi:molecule) **Antibodies** {{antibodies}} in {{conditions}} conditions
      - ![](icon:mdi:dna) **Genome** {GENOME}
      - ![](icon:mdi:chart-scatter-plot) **Peaks** {{peaks}} narrow calls
    tag: cs-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  # The marks take the family's colour (the header's), not the theme's blue.
  # A `params:` link searches the software versions the run recorded.
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Six steps from reads to differential binding
      Each step names the tool version it ran and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:content-cut) **Trim** Adapters cut by Trim Galore · [Version](params:trim) · [MultiQC](tab:MultiQC)
      2. ![](icon:mdi:dna) **Align** BWA, then duplicates and poor alignments filtered · [Version](params:bwa) · [Signal](tab:Signal)
      3. ![](icon:mdi:chart-scatter-plot) **Call** MACS2 narrow peaks, each ChIP against its input · [Version](params:macs2) · [Peaks](tab:Peaks)
      4. ![](icon:mdi:tag-outline) **Annotate** HOMER, the nearest gene of each peak · [Annotation](tab:Annotation)
      5. ![](icon:mdi:set-merge) **Merge** One consensus set per antibody · [Version](params:bedtools) · [Consensus](tab:Consensus)
      6. ![](icon:mdi:scale-balance) **Test** DESeq2 between conditions · [Version](params:featurecounts) · [Differential](tab:Differential binding)
      :::
    tag: cs-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it.
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: design
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: composition
    breakdown_col: condition
    display:
      icon_name: mdi:test-tube
      icon_color: orange
      caption: ChIPs and inputs, by condition
      link: tab:MultiQC
    section: Key figures
    tag: cs-ov-kf-libraries
    index: ov-kf-libraries
    title: Libraries
    description: Libraries in the design, the ChIPs and their input controls. The bar splits them by condition.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: macs2_peak_summary
    use: macs2/peak_summary
    aggregation: sum
    column_name: num_peaks
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-scatter-plot
      icon_color: indigo
      caption: peaks per ChIP, with their spread
      link: tab:Peaks
      format: si
    section: Key figures
    tag: cs-ov-kf-peaks
    index: ov-kf-peaks
    title: Peaks called
    description: MACS2 narrow peaks over the ChIPs in view. The box shows how many each ChIP yielded.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: count
    column_name: gene_id
    column_type: object
    filter_expr: col('significant') == True
    secondary_layout: composition
    breakdown_col: direction
    display:
      icon_name: mdi:scale-balance
      icon_color: red
      caption: significant calls, by direction
      link: tab:Differential binding
    section: Key figures
    tag: cs-ov-kf-diff
    index: ov-kf-diff
    title: Differential calls
    description: Intervals passing padj 0.05 and a two-fold change, one call per interval and contrast. The bar splits them into gained and lost binding.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # frip_score is per ChIP, so the median is of libraries, not of reads.
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: macs2_peak_summary
    use: macs2/peak_summary
    aggregation: median
    column_name: frip_score
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.01
    threshold_direction: min
    display:
      icon_name: mdi:target
      icon_color: lime
      caption: median; ENCODE wants at least 1%
      link: tab:MultiQC
      format: percent
    section: Key figures
    tag: cs-ov-kf-frip
    index: ov-kf-frip
    title: FRiP
    description: Median fraction of each ChIP's reads falling inside its called peaks, the ChIP signal-to-noise. The strip counts the ChIPs at or above the ENCODE floor of 1%.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the condition, then the antibody, both on the hub.
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: design
    interactive_component_type: MultiSelect
    column_name: condition
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: Condition
    section: Findings
    tag: cs-ov-findings-condition
    index: ov-findings-condition
    title: Condition
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: design
    interactive_component_type: MultiSelect
    column_name: antibody
    column_type: object
    display:
      icon_name: mdi:molecule
      custom_color: grape
      strip_label: Antibody
    section: Findings
    tag: cs-ov-findings-antibody
    index: ov-findings-antibody
    title: Antibody
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data.
  - component_type: text
    surface: card
    values:
      fold: {dc: macs2_peaks, column: fold_enrichment, aggregation: median, format: 'decimals:1'}
      top: {dc: homer_annotated_peaks, column: annotation_class, aggregation: top}
      top_share: {dc: homer_annotated_peaks, column: annotation_class, aggregation: top_share, format: percent}
      n_cons: {dc: macs2_consensus_boolean, column: peak_id, aggregation: count, format: integer}
      n_repro: {dc: macs2_consensus_boolean, column: peak_id, aggregation: count, filter_expr: col('num_samples') > 1,
        format: integer}
      n_sig: {dc: deseq2_results, column: gene_id, aggregation: count, filter_expr: col('significant') == True,
        format: integer}
      n_tested: {dc: deseq2_results, column: gene_id, aggregation: count, format: integer}
    body: |
      - **{{fold}}** median fold enrichment at the summits over the input – MACS2 narrow calls [Peaks](tab:Peaks)
      - **{{top_share}}** of the peaks sit in the {{top}} class – the most common HOMER feature class [Annotation](tab:Annotation)
      - **{{n_repro}}** of {{n_cons}} consensus intervals are called by more than one library – the reproducible set [Consensus](tab:Consensus)
      - **{{n_sig}}** of {{n_tested}} interval tests call a change – DESeq2, padj below 0.05 and two-fold, per contrast [Differential](tab:Differential binding)
    section: Findings
    tag: cs-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per analysis tab, in the order of the rows above. The tiles
  # of a row share a stored height.
  - component_type: highlight
    section: Findings
    source_tab: Peaks
    source_component: pk-manhattan
    caption: One point per peak at its summit, as high as its significance; colour is the library.
    hide_legend: true
    tag: cs-ov-hl-manhattan
    index: ov-hl-manhattan
    layout: {x: 0, y: 2, w: 5, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Annotation
    source_component: anno-tss-distance
    caption: Each library's peaks by distance to the nearest start site, one curve per library; the band is the promoter window.
    hide_legend: true
    tag: cs-ov-hl-tss
    index: ov-hl-tss
    layout: {x: 5, y: 2, w: 3, h: 4}
  # The consensus UpSet stacks every antibody's libraries into one plot, too
  # many sets for a third of the row: this summary counts each antibody's
  # intervals by how many of its libraries call them.
  - component_type: figure
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    visu_type: bar
    mode: code
    code_content: |-
      # Consensus intervals per antibody by the number of libraries calling them.
      d = df.group_by(['consensus_set', 'num_samples']).agg(pl.len().cast(pl.Int64).alias('intervals')).sort(['consensus_set', 'num_samples'])
      fig = px.bar(d.to_pandas(), x='num_samples', y='intervals', color='consensus_set', barmode='group', labels={'num_samples': 'Libraries calling the interval', 'intervals': 'Consensus intervals', 'consensus_set': ''})
      fig.update_xaxes(dtick=1)
      fig.update_layout(margin=dict(t=10))
    title: Replicate agreement
    link: tab:Consensus
    caption: Each antibody's consensus intervals by how many of its libraries call a peak on them; the right-hand bars are the reproducible set.
    section: Findings
    tag: cs-ov-consensus-support
    index: ov-consensus-support
    layout: {x: 0, y: 6, w: 3, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Differential binding
    source_component: diff-volcano
    caption: One point per interval and contrast; right of the line, more binding in the first condition.
    tag: cs-ov-hl-volcano
    index: ov-hl-volcano
    layout: {x: 3, y: 6, w: 5, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers. A tab the run does not have is left out.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Signal](tab:Signal)

      ### Peak calls
      - [Peaks](tab:Peaks)
      - [Annotation](tab:Annotation)
      - [Locus](tab:Locus)

      ### Comparison
      - [Consensus](tab:Consensus)
      - [Differential binding](tab:Differential binding)
    section: How to read this dashboard
    tag: cs-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the condition first. One per real factor of
  # the hub: the condition, the antibody, the library, the replicate and the
  # role (ChIP or input control).
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: design
    interactive_component_type: MultiSelect
    column_name: condition
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: cs-filter-condition
    index: sample-filters-condition
    title: Condition
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: design
    interactive_component_type: MultiSelect
    column_name: antibody
    column_type: object
    display:
      icon_name: mdi:molecule
      custom_color: grape
    section: Sample filters
    group: Sample scope
    tag: cs-filter-antibody
    index: sample-filters-antibody
    title: Antibody
    layout: {x: 0, y: 2, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: design
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: cs-filter-sample
    index: sample-filters-library
    title: Library
    layout: {x: 0, y: 4, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: design
    interactive_component_type: MultiSelect
    column_name: replicate
    column_type: object
    display:
      icon_name: mdi:content-duplicate
      custom_color: cyan
    section: Sample filters
    group: Sample scope
    tag: cs-filter-replicate
    index: sample-filters-replicate
    title: Replicate
    layout: {x: 0, y: 7, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: design
    interactive_component_type: MultiSelect
    column_name: role
    column_type: object
    display:
      icon_name: mdi:tag-outline
      custom_color: pink
    section: Sample filters
    group: Sample scope
    tag: cs-filter-role
    index: sample-filters-role
    title: Role
    layout: {x: 0, y: 9, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: macs2_peak_summary
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: frip_score
    column_type: float64
    display:
      icon_name: mdi:magnet
      custom_color: yellow
    section: QC thresholds
    group: Library quality
    tag: cs-filter-frip
    index: qc-frip-range
    title: FRiP score
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: macs2_peak_summary
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: num_peaks
    column_type: int64
    display:
      icon_name: mdi:counter
      custom_color: indigo
    section: QC thresholds
    group: Library quality
    tag: cs-filter-peakcount
    index: qc-peakcount-range
    title: Peaks called
    layout: {x: 0, y: 3, w: 1, h: 3}
  # Row selection feeds the Analysis panel.
  - component_type: table
    workflow_tag: chipseq
    data_collection_tag: design
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Sample sheet
    tag: cs-sample-sheet
    index: sample-sheet
    title: Sample sheet
    description: One row per library, ChIP or input control, with its antibody, condition, replicate and control.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: chipseq
    data_collection_tag: macs2_peak_summary
    use: macs2/peak_summary
    row_selection_enabled: true
    row_selection_column: sample
    section: Reference tables
    tag: cs-ref-table-summary
    index: ref-peak-summary
    title: Peak QC summary
    description: Peak count, FRiP score and the width, enrichment and significance spreads per ChIP.
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
# ============================================================================
# Data & QC
# ============================================================================
- title: MultiQC
  subtitle: Did sequencing, alignment and filtering work for every library?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # Tab-local: the read-level panels are keyed on the sequencing library, a
  # finer grain than the sample every other tab works in.
  filter_sections:
  - name: Library scope
    icon: mdi:test-tube
    color: orange
    description: The sequencing libraries behind the FastQC and Trim Galore panels
  grid_sections:
  - name: Run summary
    icon: mdi:view-dashboard-outline
    color: orange
    description: Every module's headline numbers, one row per library
  - name: Reads and alignment
    icon: mdi:chart-bar
    color: orange
    description: Reads sequenced per library, and the share that mapped
  - name: Enrichment
    icon: mdi:chart-line
    color: orange
    description: How concentrated the reads are, how much falls in peaks, and the strand shift scores
  - name: QC details
    icon: mdi:file-document-outline
    color: gray
    description: Read quality, trimming, duplication, read assignment and strand shift curves
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [MultiQC](https://multiqc.info) gathers what every tool of the run reported: FastQC
      and Trim Galore on the reads, samtools and Picard on the alignments, deepTools,
      phantompeakqualtools and MACS2 on the signal. Read whether each library yielded
      enough reads, how many mapped, and how well each ChIP separates from its input.
    tag: cs-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: design_reads
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: Library scope
    tag: cs-mqc-filter-library
    index: mqc-library-filter
    title: Sequencing library
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: multiqc
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: Run summary
    tag: cs-mqc-general-stats
    title: General statistics
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Counts
    section: Reads and alignment
    tag: cs-mqc-fastqc-counts
    title: Sequence counts
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Percent mapped
    section: Reads and alignment
    tag: cs-mqc-samtools-mapped
    title: Reads mapped
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: chipseq
