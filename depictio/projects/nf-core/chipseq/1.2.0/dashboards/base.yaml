    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    row_selection_enabled: true
    row_selection_column: peak_id
    section: Consensus tables
    tag: cs-cons-table-boolean
    index: cons-table-boolean
    title: Consensus intervals
    description: Coordinates, consensus set, how many peaks merged into the interval and which libraries called it.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_fc
    use: macs2/consensus_fc
    row_selection_enabled: true
    row_selection_column: peak_id
    section: Consensus tables
    tag: cs-cons-table-fc
    index: cons-table-fc
    title: Consensus fold enrichment
    description: Per-library fold enrichment at the strongest intervals of each consensus set.
    layout: {x: 0, y: 6, w: 8, h: 6}
- title: Differential binding
  subtitle: Which regions change binding between conditions?
  tab_group: Comparison
  tab_order: 7
  tab_icon: mdi:scale-balance
  tab_icon_color: red
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Differential filters
    icon: mdi:filter-variant
    color: red
    description: Pick a contrast first, then how strong a change has to be
  grid_sections:
  - name: Calls at a glance
    icon: mdi:counter
    color: red
    description: Intervals tested, and the calls passing padj 0.05 and a two-fold change
  - name: Volcano and ranked effects
    icon: mdi:chart-scatter-plot
    color: red
    description: Effect size against significance, then the largest effects and the calls per contrast
  - name: Sample space
    icon: mdi:chart-box-outline
    color: red
    description: Where the libraries sit in the count matrix DESeq2 tested, before any interval
  - name: Differential tables
    icon: mdi:table
    color: gray
