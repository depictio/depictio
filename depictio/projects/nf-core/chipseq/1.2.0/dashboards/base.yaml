    section: Differential binding at a glance
    workflow_tag: chipseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: count
    column_name: direction
    column_type: object
    secondary_layout: donut
    breakdown_col: direction
    display: {icon_name: 'mdi:chart-donut', icon_color: '#5E35B1', title_color: '#5E35B1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Direction of change
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: cs-db-card-lfc
    index: cs-db-card-lfc
    section: Differential binding at a glance
    workflow_tag: chipseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: log2fc
    column_type: float64
    display: {icon_name: 'mdi:scale-balance', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: log2 fold change
    layout: {x: 4, y: 1, w: 2, h: 2}
  - component_type: card
    tag: cs-db-card-padj
    index: cs-db-card-padj
    section: Differential binding at a glance
    workflow_tag: chipseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: max
    column_name: neg_log10_padj
    column_type: float64
    secondary_layout: threshold
    threshold_value: 1.3
    threshold_direction: min
    threshold_warn: 1
    display: {icon_name: 'mdi:check-decagram', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Strongest -log10 padj
    layout: {x: 6, y: 1, w: 2, h: 2}

  - component_type: text
    tag: cs-db-volcano-intro
    section: Volcano and MA
    title: Effect size against significance and against depth
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The volcano puts significance against effect size, the MA plot puts effect
      size against how many reads the interval carries. Together they separate a
      real change from a loud one measured on almost no reads.
    workflow_tag: chipseq
    data_collection_tag: deseq2_results
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: cs-db-av-volcano
    index: cs-db-av-volcano
    section: Volcano and MA
    workflow_tag: chipseq
    data_collection_tag: deseq2_results
    use: deseq2/volcano
    config:
      label_col: gene_id
      category_col: direction
      significance_threshold: 0.05
      effect_threshold: 1.0
      top_n_labels: 15
      show_labels: true
    title: Volcano
    description: -log10(padj) against log2 fold change. The dashed lines are padj 0.05 and a two-fold change.
    title_size: h3
    layout: {x: 0, y: 1, w: 4, h: 7}
  - component_type: advanced_viz
    tag: cs-db-av-ma
    index: cs-db-av-ma
    section: Volcano and MA
    workflow_tag: chipseq
    data_collection_tag: deseq2_results
    use: deseq2/ma
    config:
      significance_col: padj
      label_col: gene_id
      significance_threshold: 0.05
      fold_change_threshold: 1.0
      top_n_labels: 15
      show_labels: true
    title: MA plot
    description: log2 fold change against log2 mean normalised count. Low-count intervals fan out on the left.
    title_size: h3
    layout: {x: 4, y: 1, w: 4, h: 7}

  - component_type: text
    tag: cs-db-qq-intro
    section: Calibration and direction
    title: Do the p-values behave?
    title_size: sm
