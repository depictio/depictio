- title: Consensus
  subtitle: Merged peak sets per antibody, which samples agree on an interval and how strong the signal is there
  tab_order: 4
  tab_icon: mdi:set-merge
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Consensus scope
    icon: mdi:filter-variant
    color: cyan
    description: Which antibody's consensus set to read, and how well supported an interval must be
  grid_sections:
  - name: Consensus at a glance
    icon: mdi:counter
    color: cyan
    description: How many intervals each antibody's consensus set holds, and how many samples back them
  - name: Replicate agreement
    icon: mdi:set-merge
    color: cyan
    description: Which combinations of samples call the same interval
  - name: Signal at the strongest intervals
    icon: mdi:chart-box-outline
    color: blue
    description: Fold enrichment of the most strongly bound intervals, clustered
  - name: Consensus tables
    icon: mdi:table
    color: violet
    description: The consensus rows behind the panels
    collapsed: true
  components:
  - component_type: text
    tag: cs-cons-intro
    section: Consensus at a glance
    title: One peak set per antibody
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The per-sample peaks of one antibody are merged into consensus intervals.
      An interval called by every replicate is reproducible binding; one called
      by a single sample is usually noise or a condition-specific site.
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
