    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: width
    column_type: int64
    display: {icon_name: 'mdi:ruler', icon_color: '#5E35B1', title_color: '#5E35B1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Peak width
