      max_size: 26
      opacity: 0.85
      marker_outline: true
      top_n_labels: 8
      legend_pos: right
      selection_enabled: true
      selection_column: sample
    title: "Coverage concentration per IP"
    description: "plotFingerprint's own QC scatter: enriched genome share against divergence from the input. Point size is the differential enrichment, colour is how concentrated the coverage is against a uniform library of the same depth."
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 7}

  # ----------------------------------------------------------- metagene signal
  - component_type: text
    tag: cs-sig-metagene-intro
