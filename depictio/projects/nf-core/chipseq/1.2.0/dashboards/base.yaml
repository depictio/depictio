- title: Signal
  subtitle: How enriched and how complex is each library?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:waves
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Signal filters
    icon: mdi:filter-variant
    color: cyan
    description: Narrows the libraries by enriched share, and the curves by depth
  grid_sections:
  - name: Signal at a glance
    icon: mdi:counter
    color: cyan
    description: The deepTools numbers a library's signal is judged on
  - name: Coverage concentration
    icon: mdi:chart-scatter-plot
    color: cyan
    description: How far each ChIP's coverage departs from its input control
  - name: Complexity and metagene
    icon: mdi:chart-line
    color: cyan
    description: Distinct fragments left at deeper sequencing, and the mean signal along a gene
  components:
  - component_type: text
    order: 1
    body: >
      The tables [deepTools](https://deeptools.readthedocs.io) and
      [preseq](https://github.com/smithlabcode/preseq) write beside the curves MultiQC
      draws. The fingerprint metrics say how concentrated each ChIP's coverage is against
      its input, the complexity curve whether sequencing deeper would still find new
      fragments. The metagene profile shows where the signal sits along a gene.
    tag: cs-sig-intro
    index: sig-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: deeptools_fingerprint_metrics
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: percent_genome_enriched
    column_type: float64
    display:
      icon_name: mdi:percent-outline
      custom_color: orange
    section: Signal filters
    group: Signal strength
    tag: cs-sig-filter-enriched
    index: sig-enriched-range
    title: Genome called enriched
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: preseq_complexity_curve
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: total_reads
    column_type: float64
    display:
      icon_name: mdi:ruler
      custom_color: blue
    section: Signal filters
    group: Signal strength
    tag: cs-sig-filter-depth
    index: sig-depth-range
    title: Extrapolated depth
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: deeptools_fingerprint_metrics
    use: deeptools/fingerprint_metrics
    aggregation: median
    column_name: auc_ratio
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-areaspline
      icon_color: cyan
      caption: median, with its spread
      decimals: 2
    section: Signal at a glance
    tag: cs-sig-card-auc
    index: sig-card-auc
    title: Coverage concentration
    description: Area under the fingerprint curve over that of a uniform library; 1 is no concentration at all.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: deeptools_fingerprint_metrics
    use: deeptools/fingerprint_metrics
    aggregation: median
    column_name: js_distance
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:magnet
      icon_color: indigo
      caption: median, with its distribution
      decimals: 2
    section: Signal at a glance
    tag: cs-sig-card-jsd
    index: sig-card-jsd
    title: Divergence from input
    description: Median Jensen-Shannon distance between a ChIP's coverage and that of its input control.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: deeptools_fingerprint_metrics
    use: deeptools/fingerprint_metrics
    aggregation: median
    column_name: percent_genome_enriched
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:percent-outline
      icon_color: orange
      caption: median, with its distribution
      decimals: 1
    section: Signal at a glance
    tag: cs-sig-card-enriched
    index: sig-card-enriched
    title: Genome called enriched
    description: Median share of the genome deepTools calls enriched over the input.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # preseq's curve ends at a billion reads for every library (the recipe clips
  # there), so that depth compares the libraries like for like.
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: preseq_complexity_curve
    use: preseq/complexity_curve
    aggregation: median
    column_name: expected_distinct
    column_type: float64
    filter_expr: col('total_reads') == 1000000000
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:fingerprint
      icon_color: teal
      caption: median at 1 billion reads, with its spread
      decimals: 0
    section: Signal at a glance
    tag: cs-sig-card-distinct
    index: sig-card-distinct
    title: Distinct fragments
    description: Distinct fragments preseq expects a library to yield at a billion reads; a low value is a library that sequencing deeper will not save.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: chipseq
    data_collection_tag: deeptools_fingerprint_metrics
    use: deeptools/fingerprint_scatter
    config:
      x_col: percent_genome_enriched
      y_col: js_distance
      label_col: sample
      size_col: diff_enrichment
      # A colour and a legend per ChIP: point labels piled up on the replicates.
      color_col: sample
      x_title: Share of the genome called enriched
      y_title: Jensen-Shannon distance to the input
      min_size: 8
      max_size: 26
      opacity: 0.85
      marker_outline: true
      top_n_labels: 0
      legend_pos: right
      selection_enabled: true
      selection_column: sample
    section: Coverage concentration
    tag: cs-sig-fingerprint
    index: sig-fingerprint
    title: Coverage concentration per ChIP
    description: Enriched genome share against divergence from the input; size is the differential enrichment, colour the ChIP. Click a point to select the library.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: chipseq
    data_collection_tag: preseq_complexity_curve
    use: preseq/complexity_ribbon
    config:
      log_x: true
      band_opacity: 0.18
      line_width: 2
      x_title: Sequencing depth (reads)
      y_title: Expected distinct molecules
      # Every ChIP and input has a curve: under the plot the legend wraps
      # across the row instead of scrolling.
      legend_pos: bottom
      selection_enabled: true
      selection_column: sample
    section: Complexity and metagene
    tag: cs-sig-complexity
    index: sig-complexity
    title: Library complexity
    description: One curve per library, extrapolated by preseq; the band is the 95% interval on that extrapolation.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: chipseq
    data_collection_tag: deeptools_plot_profile
    use: deeptools/metagene_profile
    config:
      reference_x: 300
      reference_label: TSS
      shaded_bands:
      - [300, 400, Gene body]
      x_title: Bin (TSS at 300, TES at 400)
      y_title: Mean signal
      line_width: 2
      legend_pos: bottom
      selection_enabled: true
      selection_column: sample
    section: Complexity and metagene
    tag: cs-sig-metagene
    index: sig-metagene
    title: Metagene signal profile
    description: Mean signal of every library along a scaled gene with 3 kb flanks, the start site marked and the gene body shaded.
    layout: {x: 0, y: 6, w: 8, h: 6}
# ============================================================================
# Peak calls
# ============================================================================
- title: Peaks
  subtitle: How many peaks did each library yield, and how strong?
  tab_group: Peak calls
  tab_order: 3
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Peak filters
    icon: mdi:filter-variant
    color: indigo
    description: How significant, enriched and wide a call has to be, and on which chromosomes
  grid_sections:
  - name: Peaks at a glance
    icon: mdi:counter
    color: indigo
    description: How many calls the libraries made, how wide, how enriched and how significant
  - name: Significance along the genome
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Every call at its summit, as high as its q-value
  - name: Peak width
    icon: mdi:ruler
    color: indigo
    description: How wide the narrow calls are, library by library
  - name: Around the summits
    icon: mdi:chart-bell-curve
    color: indigo
    description: How sharply replicates agree on a summit, and how far a call spreads from it
  - name: Peak table
    icon: mdi:table
    color: gray
    description: Coordinates, summit, enrichment and significance of every call
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [MACS2](https://github.com/macs3-project/MACS) narrow peaks, one row per peak and
      ChIP, each called against its input control around a summit. The cards count the
      calls and sum up their width, enrichment and significance. A lasso on the
      genome-wide panel narrows the tab and, through the peak links, the HOMER annotation.
    tag: cs-pk-intro
    index: pk-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: neg_log10_qvalue
    column_type: float64
    display:
      icon_name: mdi:check-decagram
      custom_color: red
    section: Peak filters
    group: Peak strength
    tag: cs-pk-filter-qvalue
    index: pk-qvalue-range
    title: Peak significance
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: fold_enrichment
    column_type: float64
    display:
      icon_name: mdi:magnet
      custom_color: yellow
    section: Peak filters
    group: Peak strength
    tag: cs-pk-filter-fold
    index: pk-fold-range
    title: Fold enrichment
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: width
    column_type: int64
    display:
      icon_name: mdi:ruler
      custom_color: orange
    section: Peak filters
    group: Peak strength
    tag: cs-pk-filter-width
    index: pk-width-range
    title: Peak width
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    interactive_component_type: MultiSelect
    column_name: chr
    column_type: object
    display:
      icon_name: mdi:chart-timeline-variant
      custom_color: indigo
    section: Peak filters
    group: Peak location
    tag: cs-pk-filter-chr
    index: pk-chr-filter
    title: Chromosome
    layout: {x: 0, y: 9, w: 1, h: 3}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    use: macs2/peaks
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: chr
    display:
      icon_name: mdi:counter
      icon_color: indigo
      caption: the chromosomes with the most
    section: Peaks at a glance
    tag: cs-pk-card-count
    index: pk-card-count
    title: Peaks in view
    description: Narrow calls over the ChIPs in view, one per peak and library.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    use: macs2/peaks
    aggregation: median
    column_name: width
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: orange
      caption: median bp, with its spread
      decimals: 0
    section: Peaks at a glance
    tag: cs-pk-card-width
    index: pk-card-width
    title: Peak width
    description: Median width of the calls in bp.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    use: macs2/peaks
    aggregation: median
    column_name: fold_enrichment
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:magnet
      icon_color: yellow
      caption: median, with its distribution
      decimals: 1
    section: Peaks at a glance
    tag: cs-pk-card-fold
    index: pk-card-fold
    title: Fold enrichment
    description: Median enrichment at the summit over the input control.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    use: macs2/peaks
    aggregation: median
    column_name: neg_log10_qvalue
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:check-decagram
      icon_color: red
      caption: median, with its spread
      decimals: 1
    section: Peaks at a glance
    tag: cs-pk-card-qvalue
    index: pk-card-qvalue
    title: Median -log10 q
    description: Median significance of the calls, as -log10 of the MACS2 q-value; every call already passes q 0.05 (1.3).
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    use: macs2/peak_significance
    config:
      feature_col: peak_id
      score_kind: -log10(q)
      color_by_columns: [sample]
      default_color_by: sample
      selection_enabled: true
      selection_column: peak_id
      # Peak ids say nothing as point labels; they piled up over the tallest calls.
      top_n_labels: 0
    section: Significance along the genome
    tag: cs-pk-manhattan
    index: pk-manhattan
    title: Peak significance along the genome
    description: Every call at its summit; height is -log10 of the MACS2 q-value, colour is the library.
    layout: {x: 0, y: 0, w: 8, h: 6}
  # Log x: peak width is a long tail. On a linear axis the widest call sets the
  # range and the panel reads as a single spike.
  - component_type: figure
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    use: macs2/peaks
    visu_type: histogram
    dict_kwargs:
      x: width
      color: sample
      nbins: 60
      log_x: true
      labels: {width: Peak width (bp), sample: Library}
    section: Peak width
    tag: cs-pk-width
    index: pk-width
    title: Peak width distribution
    description: How wide the calls are, per library, on a log axis. A sharp factor gives a tight band; a broad mark spreads.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: chipseq
    data_collection_tag: macs2_summit_profile
    use: macs2/summit_concordance_profile
    config:
      reference_x: 0
      reference_label: Summit
      log_y: true
      x_title: Offset from the summit (bp)
      y_title: Other libraries' summits per kb
      legend_pos: right
      selection_enabled: true
      selection_column: sample
    section: Around the summits
    tag: cs-pk-summit-concordance
    index: pk-summit-concordance
    title: Other libraries' summits around each summit
    description: Summits called in the other libraries, per anchor summit and per kb, on a log axis. Replicates of a sharp factor pile their summits onto each other.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: chipseq
    data_collection_tag: macs2_summit_profile
    use: macs2/summit_footprint_profile
    config:
      reference_x: 0
      reference_label: Summit
      x_title: Offset from the summit (bp)
      y_title: Share of the library's peaks covering the offset
      legend_pos: right
      selection_enabled: true
      selection_column: sample
    section: Around the summits
    tag: cs-pk-summit-footprint
    index: pk-summit-footprint
    title: Average peak footprint
    description: The share of each library's calls still open at every offset from their own summit; where a curve crosses one half is the median half-width.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: table
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    use: macs2/peaks
    row_selection_enabled: true
    row_selection_column: peak_id
    section: Peak table
    tag: cs-pk-table
    index: pk-table-peaks
    title: MACS2 narrow peaks
    description: Coordinates, summit, width, fold enrichment and significance of every call.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Annotation
  subtitle: Where do the peaks fall relative to genes?
  tab_group: Peak calls
  tab_order: 4
  tab_icon: mdi:tag-outline
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Annotation filters
    icon: mdi:filter-variant
    color: blue
    description: The feature class of a peak and its distance to the nearest start site
  grid_sections:
  - name: Annotation at a glance
    icon: mdi:counter
    color: blue
    description: Feature classes, genes reached and distance to the start sites of the peaks in view
  - name: Feature classes
    icon: mdi:chart-bar
    color: blue
    description: The share of each library's peaks in each HOMER feature class
  - name: Distance to the nearest TSS
    icon: mdi:chart-line
    color: blue
    description: Each library's peaks binned by their distance to the nearest start site
  - name: Peak annotation
    icon: mdi:table
    color: gray
    description: Every annotated peak, and the full record of the one picked
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [HOMER](http://homer.ucsd.edu/homer/) assigns every peak to a genomic feature class
      and to the nearest transcription start site. A promoter-bound factor puts most of
      its peaks in the promoter window, a distal one spreads them over introns and
      intergenic space. Pick a row of the collapsed table to read the record of one peak.
    tag: cs-anno-intro
    index: anno-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: homer_annotated_peaks
    interactive_component_type: MultiSelect
    column_name: annotation_class
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: blue
    section: Annotation filters
    group: Annotation
    tag: cs-anno-filter-class
    index: anno-class-filter
    title: Feature class
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: homer_annotated_peaks
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: distance_to_tss
    column_type: int64
    display:
      icon_name: mdi:ruler
      custom_color: lime
    section: Annotation filters
    group: Annotation
    tag: cs-anno-filter-tss
    index: anno-tss-range
    title: Distance to TSS
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: homer_annotated_peaks
    use: homer/annotated_peaks
    aggregation: count
    column_name: annotation_class
    column_type: object
    secondary_layout: donut
    breakdown_col: annotation_class
    display:
      icon_name: mdi:chart-donut
      icon_color: blue
      caption: peaks, by feature class
    section: Annotation at a glance
    tag: cs-anno-card-classes
    index: anno-card-classes
    title: Annotated peaks
    description: Peaks HOMER annotated, split by the feature class they fall in.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: homer_annotated_peaks
    use: homer/annotated_peaks
    aggregation: nunique
    column_name: gene_name
    column_type: object
    filter_expr: col('gene_name').is_not_null() & (col('gene_name') != '')
    secondary_layout: top_n
    breakdown_col: annotation_class
    display:
      icon_name: mdi:dna
      icon_color: teal
      caption: distinct genes, by feature class
    section: Annotation at a glance
    tag: cs-anno-card-genes
    index: anno-card-genes
    title: Genes reached
    description: Distinct genes named as the nearest gene of a peak.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: homer_annotated_peaks
    use: homer/annotated_peaks
    aggregation: median
    column_name: distance_to_tss
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: lime
      caption: median signed bp, with its spread
      decimals: 0
    section: Annotation at a glance
    tag: cs-anno-card-tss
    index: anno-card-tss
    title: Distance to TSS
    description: Median signed distance from a peak to the nearest start site.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: homer_annotated_peaks
    use: homer/annotated_peaks
    aggregation: median
    column_name: peak_score
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:trending-up
      icon_color: orange
      caption: median, with its distribution
      decimals: 0
    section: Annotation at a glance
    tag: cs-anno-card-score
    index: anno-card-score
    title: Peak score
    description: Median score the peak caller gave the annotated peaks.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # A share per library, not a count, so libraries of different depth compare.
  - component_type: figure
    workflow_tag: chipseq
    data_collection_tag: homer_annotated_peaks
    use: homer/annotated_peaks
    visu_type: histogram
    dict_kwargs:
      x: sample
      color: annotation_class
      barnorm: percent
      labels: {sample: '', annotation_class: Feature class}
    section: Feature classes
    tag: cs-anno-classes
    index: anno-classes
    title: Feature classes per library
    description: The share of each library's peaks in each feature class, as a percentage.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: chipseq
    data_collection_tag: homer_tss_distance_profile
    use: homer/tss_distance
    config:
      reference_x: 0
      reference_label: TSS
      shaded_bands:
      - [-1000, 1000, Promoter window]
      x_title: Distance to the nearest TSS (bp)
      y_title: Share of the library's peaks
      legend_pos: right
    section: Distance to the nearest TSS
    tag: cs-anno-tss-distance
    index: anno-tss-distance
    title: Peaks around the nearest TSS
    description: Peaks counted in 250 bp bins across a 20 kb window; the band is the 1 kb promoter window either side.
    layout: {x: 0, y: 0, w: 8, h: 6}
  # Master and detail: a picked row is the selection the record card follows.
  - component_type: table
    workflow_tag: chipseq
    data_collection_tag: homer_annotated_peaks
    use: homer/annotated_peaks
    row_selection_enabled: true
    row_selection_column: peak_id
    section: Peak annotation
    tag: cs-anno-table
    index: anno-table
    title: HOMER peak annotation
    description: Feature class, distance to the nearest start site and the gene of every call.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: chipseq
    data_collection_tag: homer_annotated_peaks
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: peak_id
      title_col: peak_id
      selection_source: any
      linked_component: cs-anno-table
      sections:
        Call: [sample, chr, start, end, strand, peak_score]
        Annotation: [annotation_class, annotation, distance_to_tss, nearest_promoter_id, gene_name, gene_type]
      labels:
        distance_to_tss: Distance to TSS (bp)
        nearest_promoter_id: Nearest promoter
    section: Peak annotation
    tag: cs-anno-record
    index: anno-record
    title: Peak record
    description: The call picked in the table beside it, with the feature and gene HOMER assigned to it.
    layout: {x: 5, y: 0, w: 3, h: 5}
# The locus section: three collections on one genomic region. The navigator
# (macs2/peak_genome_view on macs2_peaks) opens on its default_region and emits
# the chromosome and position filters; the two region links in template.yaml
# rename them onto the consensus intervals and the HOMER annotation, so every
# track clamps to the same window. A tab of its own: a region filter narrows
# every tile of its collection on the tab. The axis comes from GENOME (the
# bundled gene lanes are hg38 and mm10 only, so the HOMER track stands in).
- title: Locus
  subtitle: What do the libraries call at one genomic region?
  tab_group: Peak calls
  tab_order: 5
  tab_icon: mdi:map-search-outline
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Locus filters
    icon: mdi:filter-variant
    color: teal
    description: Peak strength, consensus support and feature class of the tracks on the region
  grid_sections:
  - name: Region at a glance
    icon: mdi:counter
    color: teal
    description: What the region in view holds, recounted on every brush or locus entry
  - name: Peaks on one axis
    icon: mdi:dna
    color: teal
    description: The narrow calls per library, then the tracks that follow their region
  components:
  - component_type: text
    order: 1
    body: >
      The narrow calls of every ChIP, the consensus intervals per antibody and the HOMER
      annotation on one genome axis. The tab opens on a fixed default region set in the
      navigator; type a locus in its header or brush its axis, and the tracks and cards
      follow.
    tag: cs-loc-intro
    index: loc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: neg_log10_qvalue
    column_type: float64
    display:
      icon_name: mdi:check-decagram
      custom_color: red
    section: Locus filters
    group: Region
    tag: cs-loc-filter-qvalue
    index: loc-qvalue-range
    title: Peak significance
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: num_samples
    column_type: int64
    display:
      icon_name: mdi:account-group-outline
      custom_color: green
    section: Locus filters
    group: Region
    tag: cs-loc-filter-support
    index: loc-support-range
    title: Libraries per interval
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: homer_annotated_peaks
    interactive_component_type: MultiSelect
    column_name: annotation_class
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: blue
    section: Locus filters
    group: Region
    tag: cs-loc-filter-class
    index: loc-class-filter
    title: Feature class
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    use: macs2/peaks
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: composition
    breakdown_col: sample
    follow_region_filter: true
    display:
      icon_name: mdi:counter
      icon_color: indigo
      caption: calls, by library
    section: Region at a glance
    tag: cs-loc-card-peaks
    index: loc-card-peaks
    title: Calls in the region
    description: Narrow calls on the region in view, one per peak and library.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    aggregation: median
    column_name: num_samples
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    follow_region_filter: true
    display:
      icon_name: mdi:set-merge
      icon_color: violet
      caption: median, with its spread
      decimals: 0
    section: Region at a glance
    tag: cs-loc-card-support
    index: loc-card-support
    title: Libraries per interval
    description: How many libraries call each consensus interval on the region.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: homer_annotated_peaks
    use: homer/annotated_peaks
    aggregation: count
    column_name: annotation_class
    column_type: object
    secondary_layout: donut
    breakdown_col: annotation_class
    follow_region_filter: true
    display:
      icon_name: mdi:chart-donut
      icon_color: blue
      caption: peaks, by feature class
    section: Region at a glance
    tag: cs-loc-card-classes
    index: loc-card-classes
    title: Feature classes
    description: The annotated calls on the region, split by feature class.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: homer_annotated_peaks
    use: homer/annotated_peaks
    aggregation: nunique
    column_name: gene_name
    column_type: object
    filter_expr: col('gene_name').is_not_null() & (col('gene_name') != '')
    secondary_layout: top_n
    breakdown_col: annotation_class
    follow_region_filter: true
    display:
      icon_name: mdi:dna
      icon_color: teal
      caption: distinct genes, by feature class
    section: Region at a glance
    tag: cs-loc-card-genes
    index: loc-card-genes
    title: Nearest genes
    description: Distinct genes named as the nearest gene of a call on the region.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Default region: a 400 kb window on chr21 that every ChIP of the reference
  # run calls peaks on, so no track opens empty.
  - component_type: advanced_viz
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    use: macs2/peak_genome_view
    config:
      mark: rect
      facet_by_sample: true
      max_facets: 8
      score_title: -log10(q)
      opacity: 0.85
      assembly: '{GENOME}'
      default_region: chr21:43,600,000-44,000,000
      region_filter_enabled: true
      selection_enabled: true
      selection_column: peak_id
    section: Peaks on one axis
    tag: cs-loc-navigator
    index: loc-navigator
    title: Narrow calls per library
    description: Every MACS2 call on the region, one lane per library, as high as its significance. The locus field and a brush on this axis move every track below.
    layout: {x: 0, y: 0, w: 8, h: 6}
  # A coverage track, faceted by consensus set: chipseq builds one consensus
  # set per antibody, and a lane per set keeps them apart.
  - component_type: advanced_viz
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
    viz_kind: coverage_track
    config:
      viz_kind: coverage_track
      chromosome_col: chr
      position_col: start
      end_col: end
      value_col: num_samples
      sample_col: consensus_set
      color_by: sample
      view_mode: facet
      mark: rect
      smoothing_window: 0
      show_annotation_lane: false
      view: track
      views: [track]
    section: Peaks on one axis
    tag: cs-loc-consensus
    index: loc-consensus
    title: Consensus intervals per antibody
    description: The merged intervals of each consensus set on the same region, each as high as the number of libraries calling a peak there.
    layout: {x: 0, y: 6, w: 8, h: 3}
  - component_type: advanced_viz
    workflow_tag: chipseq
    data_collection_tag: homer_annotated_peaks
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      chr_col: chr
      pos_col: start
      end_col: end
      score_col: peak_score
      feature_col: gene_name
      category_col: annotation_class
      mark: rect
      score_title: HOMER peak score
      assembly: '{GENOME}'
      region_filter_enabled: false
      follow_region_filter: true
      selection_enabled: true
      selection_column: peak_id
    section: Peaks on one axis
    tag: cs-loc-genes
    index: loc-genes
    title: Nearest gene of every call
    description: The same calls as HOMER annotated them, coloured by feature class; hover a call for its nearest gene.
    layout: {x: 0, y: 9, w: 8, h: 3}
