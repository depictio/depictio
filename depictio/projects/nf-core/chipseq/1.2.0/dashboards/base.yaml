    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: num_samples
    column_type: int64
    display: {icon_name: 'mdi:account-group-outline', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Samples per interval
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: cs-cons-card-peaks
    index: cs-cons-card-peaks
    section: Consensus at a glance
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    aggregation: sum
    column_name: num_peaks
    column_type: int64
