version: 1
# nf-core/chipseq 1.2.0 reference dashboard.
#
# Funnel: sequencing QC (the reprocessed MultiQC report) -> the peaks each
# sample yielded -> the consensus peak set per antibody -> differential binding
# between conditions. The design sheet is the hub: the sample filter in the left
# panel reaches the MultiQC panels, the peak table, the peak QC summary and the
# HOMER annotation through the project links.
#
# The MultiQC report bound here was re-generated with MultiQC 1.35 from the
# run's raw tool outputs; the run itself published MultiQC 1.9, which writes no
# parquet. Anchors and section names are therefore the 1.35 ones.
main_dashboard:
  title: ChIP-seq Peak Analysis
  subtitle: "nf-core/chipseq 1.2.0 megatest: EZH2 (NTKO / TKO) and FOXA1 (E2 / VEH) ChIP against matched inputs"
  project_tag: ChIP-seq Peak Analysis
  main_tab_name: Sequencing QC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab through the project links
    persistent: true
    pin: top
  - name: QC thresholds
    icon: mdi:tune
    color: cyan
    description: Signal-to-noise and yield floors on the per-sample QC summary
    collapsed: true
    persistent: true
    pin: bottom
  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: What the run produced, per ChIP sample
  - name: Read quality
    icon: mdi:chart-bell-curve
    color: blue
    description: FastQC and Trim Galore as MultiQC reports them
  - name: Alignment and library complexity
    icon: mdi:chart-bar
    color: indigo
    description: How much of each library survived alignment, filtering and deduplication
  - name: ChIP enrichment
    icon: mdi:chart-line
    color: cyan
    description: Whether the ChIP is enriched over its input, and how sharply
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The design sheet and the per-sample QC rows, on every tab
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # ------------------------------------------------------------- at a glance
  - component_type: text
    tag: cs-qc-intro
    section: Run at a glance
    title: A ChIP-seq run, from reads to peaks
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Four cards for the peak yield and signal-to-noise of the run, then the
      MultiQC panels behind them: read quality, alignment and library
      complexity, and the enrichment of each ChIP over its own input control.
    workflow_tag: chipseq
    data_collection_tag: macs2_peak_summary
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: cs-qc-card-peaks
    index: cs-qc-card-peaks
    section: Run at a glance
    workflow_tag: chipseq
    data_collection_tag: macs2_peak_summary
    use: macs2/peak_summary
    aggregation: sum
    column_name: num_peaks
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Peaks called
    layout: {x: 0, y: 1, w: 2, h: 2}
  - component_type: card
    tag: cs-qc-card-frip
    index: cs-qc-card-frip
    section: Run at a glance
    workflow_tag: chipseq
    data_collection_tag: macs2_peak_summary
    use: macs2/peak_summary
    aggregation: average
    column_name: frip_score
    column_type: float64
    secondary_layout: gauge
    coverage_max: 1
    display: {icon_name: 'mdi:target', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: FRiP score
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: cs-qc-card-width
    index: cs-qc-card-width
    section: Run at a glance
    workflow_tag: chipseq
    data_collection_tag: macs2_peak_summary
    use: macs2/peak_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: width_median
    column_type: float64
    display: {icon_name: 'mdi:ruler', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Median peak width
    layout: {x: 4, y: 1, w: 2, h: 2}
  - component_type: card
    tag: cs-qc-card-fold
    index: cs-qc-card-fold
    section: Run at a glance
    workflow_tag: chipseq
    data_collection_tag: macs2_peak_summary
    use: macs2/peak_summary
    aggregation: average
    column_name: fold_enrichment_median
    column_type: float64
    secondary_layout: threshold
    threshold_value: 5
    threshold_direction: min
    threshold_warn: 3
    display: {icon_name: 'mdi:magnet', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Median fold enrichment
    layout: {x: 6, y: 1, w: 2, h: 2}

  # ------------------------------------------------------------ read quality
  - component_type: text
    tag: cs-qc-reads-intro
    section: Read quality
    title: Raw and trimmed reads
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      FastQC on the raw and the trimmed libraries, plus what Trim Galore
      removed. Every library carries a technical-replicate suffix, so a sample
      appears here once per library.
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: cs-qc-fastqc-counts
    section: Read quality
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Counts
    use: multiqc/fastqc
    title: Sequence counts
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: cs-qc-fastqc-quality
    section: Read quality
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    use: multiqc/fastqc
    title: Per-base sequence quality
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: cs-qc-cutadapt
    section: Read quality
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    selected_module: cutadapt
    selected_plot: Filtered Reads
    use: multiqc/cutadapt
    title: Reads kept after trimming
    title_size: sm
    title_align: left
    layout: {x: 0, y: 6, w: 8, h: 4}

  # ------------------------------------------- alignment and library complexity
  - component_type: text
    tag: cs-qc-align-intro
    section: Alignment and library complexity
    title: From libraries to filtered alignments
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Libraries are merged per sample, duplicates marked and low-quality or
      blacklisted alignments removed. The complexity curve says whether deeper
      sequencing would still find new molecules.
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: cs-qc-samtools
    section: Alignment and library complexity
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    selected_module: samtools
    selected_plot: Percent mapped
    use: multiqc/samtools
    title: Percent mapped
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: cs-qc-picard-dup
    section: Alignment and library complexity
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    selected_module: picard
    selected_plot: Mark Duplicates
    use: multiqc/picard
    title: Duplication
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: cs-qc-preseq
    section: Alignment and library complexity
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    selected_module: preseq
    selected_plot: Complexity curve (molecule count)
    use: multiqc/preseq
    title: Library complexity curve
    title_size: sm
    title_align: left
    layout: {x: 0, y: 6, w: 8, h: 5}
  - component_type: multiqc
    tag: cs-qc-featurecounts
    section: Alignment and library complexity
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    selected_module: featurecounts
    selected_plot: Assignments
    use: multiqc/featurecounts
    title: Reads assigned to consensus peaks
    title_size: sm
    title_align: left
    layout: {x: 0, y: 11, w: 8, h: 4}

  # --------------------------------------------------------- ChIP enrichment
  - component_type: text
    tag: cs-qc-enrich-intro
    section: ChIP enrichment
    title: Is the ChIP enriched over its input?
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The fingerprint curve separates an enriched ChIP from a flat input. FRiP
      is the share of reads inside called peaks, and the strand cross-correlation
      coefficients say how sharp the signal is.
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: cs-qc-fingerprint
    section: ChIP enrichment
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    selected_module: deepTools
    selected_plot: Fingerprint plot
    use: multiqc/deeptools
    title: deepTools fingerprint
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: cs-qc-frip
    section: ChIP enrichment
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    selected_module: frip_score
    selected_plot: frip_score-section
    title: FRiP score
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: cs-qc-strandshift
    section: ChIP enrichment
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    selected_module: strand_shift_correlation
    selected_plot: strand_shift_correlation-section
    title: Strand cross-correlation
    title_size: sm
    title_align: left
    layout: {x: 0, y: 6, w: 4, h: 5}
  - component_type: multiqc
    tag: cs-qc-nsc
    section: ChIP enrichment
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    selected_module: nsc_coefficient
    selected_plot: nsc_coefficient-section
    title: NSC coefficient
    title_size: sm
    title_align: left
    layout: {x: 4, y: 6, w: 4, h: 5}
  # The MultiQC General Statistics table is deliberately NOT bound on this tab.
  # chipseq runs samtools stats and samtools flagstat over the same BAMs and
  # both contribute a general-stats column titled "Reads mapped". The API's
  # general-stats payload de-duplicates column names through a dict keyed on the
  # display title, so the two collapse onto one label, the frame ends up with two
  # identically named columns and the render answers 500. See VALIDATION_REPORT.md,
  # CS-D3. The per-tool panels above and below carry the same numbers.
  - component_type: multiqc
    tag: cs-qc-rsc
    section: ChIP enrichment
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    selected_module: rsc_coefficient
    selected_plot: rsc_coefficient-section
    title: RSC coefficient
    title_size: sm
    title_align: left
    layout: {x: 0, y: 11, w: 4, h: 5}
  - component_type: multiqc
    tag: cs-qc-readdist
    section: ChIP enrichment
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    selected_module: deepTools
    selected_plot: Read Distribution Profile after Annotation
    use: multiqc/deeptools
    title: Read distribution around genes
    title_size: sm
    title_align: left
    layout: {x: 4, y: 11, w: 4, h: 5}

  # -------------------------------------------------------- reference tables
  - component_type: text
    tag: cs-ref-intro
    section: Reference tables
    title: The design sheet and the per-sample QC rows
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Which input control each ChIP was called against, and the peak count,
      FRiP score and peak-metric spreads per sample. Filters picked in the left
      panel narrow both tables.
    workflow_tag: chipseq
    data_collection_tag: design
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: table
    tag: cs-ref-table-design
    section: Reference tables
    workflow_tag: chipseq
    data_collection_tag: design
    row_selection_enabled: false
    title: ChIP design
    description: One row per ChIP sample, with its input control and antibody.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 1, w: 4, h: 4}
  - component_type: table
    tag: cs-ref-table-summary
    section: Reference tables
    workflow_tag: chipseq
    data_collection_tag: macs2_peak_summary
    use: macs2/peak_summary
    row_selection_enabled: false
    title: Peak QC summary
    description: Peak count, FRiP score and the width, enrichment and significance spreads per sample.
    title_size: h3
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 4}

  # -------------------------------------------------------------- left panel
  - component_type: interactive
    tag: cs-filter-sample
    index: cs-sample-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: chipseq
    data_collection_tag: design
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:test-tube'}
    placement: left
    title: ChIP sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: cs-filter-antibody
    index: cs-antibody-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: chipseq
    data_collection_tag: design
    interactive_component_type: MultiSelect
    column_name: antibody
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:dna'}
    placement: left
    title: Antibody
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: cs-filter-frip
    index: cs-frip-range
    section: QC thresholds
    group: Signal quality
    workflow_tag: chipseq
    data_collection_tag: macs2_peak_summary
    interactive_component_type: RangeSlider
    column_name: frip_score
    column_type: float64
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:target'}
    placement: left
    title: FRiP score
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: cs-filter-peakcount
    index: cs-peakcount-range
    section: QC thresholds
    group: Signal quality
    workflow_tag: chipseq
    data_collection_tag: macs2_peak_summary
    interactive_component_type: RangeSlider
    column_name: num_peaks
    column_type: int64
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:counter'}
    placement: left
    title: Peaks called
    layout: {x: 0, y: 3, w: 1, h: 3}

tabs:
# ============================================================================
# Peaks
# ============================================================================
- title: Peaks
  subtitle: MACS2 narrow peaks per sample, their significance along the genome and where they land relative to genes
  tab_order: 2
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Peak scope
    icon: mdi:tune
    color: indigo
    description: Keep only the peaks inside a significance, enrichment and width band
  - name: Annotation scope
    icon: mdi:dna
    color: grape
    description: Genomic feature class and distance to the nearest TSS
    collapsed: true
  grid_sections:
  - name: Peak yield
    icon: mdi:counter
    color: indigo
    description: How many peaks each sample contributed, and how strong they are
  - name: Significance along the genome
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Every peak placed on its chromosome, height is the q-value
  - name: Where the peaks land
    icon: mdi:dna
    color: grape
    description: Genomic feature classes and the distance from each peak to the nearest TSS
  - name: Peak tables
    icon: mdi:table
    color: violet
    description: The peak rows behind the panels, with the HOMER annotation
    collapsed: true
  components:
  # ---------------------------------------------------------------- yield
  - component_type: text
    tag: cs-pk-intro
    section: Peak yield
    title: What MACS2 called
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per peak per sample. The cards count the peaks and summarise their
      width, enrichment and significance; the sliders in the left panel narrow
      every panel on this tab to a band of each.
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: cs-pk-card-count
    index: cs-pk-card-count
    section: Peak yield
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    use: macs2/peaks
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Peaks in view
    layout: {x: 0, y: 1, w: 2, h: 2}
  - component_type: card
    tag: cs-pk-card-width
    index: cs-pk-card-width
    section: Peak yield
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    use: macs2/peaks
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: width
    column_type: int64
    display: {icon_name: 'mdi:ruler', icon_color: '#5E35B1', title_color: '#5E35B1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Peak width
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: cs-pk-card-fold
    index: cs-pk-card-fold
    section: Peak yield
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    use: macs2/peaks
    aggregation: average
    column_name: fold_enrichment
    column_type: float64
    secondary_layout: histogram
    display: {icon_name: 'mdi:magnet', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Fold enrichment
    layout: {x: 4, y: 1, w: 2, h: 2}
  - component_type: card
    tag: cs-pk-card-qvalue
    index: cs-pk-card-qvalue
    section: Peak yield
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    use: macs2/peaks
    aggregation: median
    column_name: neg_log10_qvalue
    column_type: float64
    secondary_layout: threshold
    threshold_value: 10
    threshold_direction: min
    threshold_warn: 5
    display: {icon_name: 'mdi:check-decagram', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Median -log10 q
    layout: {x: 6, y: 1, w: 2, h: 2}

  # ----------------------------------------------------- manhattan + scatter
  - component_type: text
    tag: cs-pk-manhattan-intro
    section: Significance along the genome
    title: Pick peaks here, read them in the tables below
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each point is a peak at its summit, height is the MACS2 q-value. Lasso a
      region on either panel: the selection carries the peak id into the HOMER
      annotation table through the project links.
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: cs-pk-av-manhattan
    index: cs-pk-av-manhattan
    section: Significance along the genome
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    use: macs2/peak_significance
    config:
      feature_col: peak_id
      score_kind: "-log10(q)"
      color_by_columns: [sample]
      default_color_by: sample
      selection_enabled: true
      selection_column: peak_id
      top_n_labels: 10
    title: Peak significance along the genome
    description: Every peak at its summit position; height is -log10 of the MACS2 q-value, colour is the sample.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 7}
  - component_type: figure
    tag: cs-pk-fig-volcano
    index: cs-pk-fig-volcano
    section: Significance along the genome
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    mode: code
    visu_type: scatter
    code_content: |
      # enrichment against significance for the strongest peaks in view;
      # the full frame is ~260k peaks, far more than a scatter can show
      df_modified = (
          df.sort("neg_log10_qvalue", descending=True)
          .head(2000)
          .with_columns(pl.col("width").clip(50, 2000).alias("peak_width"))
      )

      fig = px.scatter(
          df_modified.to_pandas(),
          x="fold_enrichment",
          y="neg_log10_qvalue",
          color="sample",
          size="peak_width",
          size_max=18,
          hover_name="peak_id",
          custom_data=["peak_id"],
          opacity=0.7,
      )
      fig.update_layout(
          xaxis_title="Fold enrichment over input",
          yaxis_title="-log10(q-value)",
          legend_title_text="Sample",
          margin={"t": 24, "l": 64, "r": 16, "b": 48},
      )
    selection_enabled: true
    selection_column: peak_id
    title: Enrichment against significance
    description: The 2000 most significant peaks in view; point size is the peak width. Lasso to select peaks.
    title_size: h3
    layout: {x: 0, y: 8, w: 4, h: 6}
  - component_type: figure
    tag: cs-pk-fig-width
    section: Significance along the genome
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    use: macs2/peaks
    visu_type: histogram
    dict_kwargs: {x: width, color: sample, nbins: 60}
    title: Peak width distribution
    description: How wide the calls are, per sample. A histone mark gives broader peaks than a transcription factor.
    title_size: h3
    layout: {x: 4, y: 8, w: 4, h: 6}

  # -------------------------------------------------------------- annotation
  - component_type: text
    tag: cs-pk-anno-intro
    section: Where the peaks land
    title: Peaks against gene structure
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      HOMER assigns every peak to a genomic feature and to the nearest
      transcription start site. A promoter-heavy profile and a TSS-centred
      distance histogram are what a transcription factor should look like.
    workflow_tag: chipseq
    data_collection_tag: homer_annotated_peaks
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: cs-pk-card-anno
    index: cs-pk-card-anno
    section: Where the peaks land
    workflow_tag: chipseq
    data_collection_tag: homer_annotated_peaks
    use: homer/annotated_peaks
    aggregation: count
    column_name: annotation_class
    column_type: object
    secondary_layout: donut
    breakdown_col: annotation_class
