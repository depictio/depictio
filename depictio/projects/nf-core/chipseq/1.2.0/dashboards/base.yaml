# Peaks
# ============================================================================
- title: Peaks
  subtitle: MACS2 narrow peaks per sample, their significance along the genome and where they land relative to genes
  tab_order: 3
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Peak scope
    icon: mdi:tune
    color: indigo
    description: Keep only the peaks inside a significance, enrichment and width band
  - name: Annotation scope
    icon: mdi:dna
    color: grape
    description: Genomic feature class and distance to the nearest TSS
    collapsed: true
  grid_sections:
  - name: Peak yield
    icon: mdi:counter
    color: indigo
    description: How many peaks each sample contributed, and how strong they are
  - name: Significance along the genome
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Every peak placed on its chromosome, height is the q-value
  - name: Where the peaks land
    icon: mdi:dna
    color: grape
    description: Genomic feature classes and the distance from each peak to the nearest TSS
  - name: Peak tables
    icon: mdi:table
    color: violet
    description: The peak rows behind the panels, with the HOMER annotation
    collapsed: true
  components:
  # ---------------------------------------------------------------- yield
  - component_type: text
    tag: cs-pk-intro
