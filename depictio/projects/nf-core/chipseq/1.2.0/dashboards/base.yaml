      width, enrichment and significance; the sliders in the left panel narrow
      every panel on this tab to a band of each.
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: cs-pk-card-count
