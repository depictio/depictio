- title: Consensus
  subtitle: Which peaks do the libraries agree on?
  tab_group: Comparison
  tab_order: 6
  tab_icon: mdi:set-merge
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Consensus filters
    icon: mdi:filter-variant
    color: violet
    description: Which antibody's consensus set to read, how well supported and where
  grid_sections:
  - name: Consensus at a glance
    icon: mdi:counter
    color: violet
    description: How many intervals the merged sets hold, and how many libraries back them
  - name: Replicate agreement
    icon: mdi:set-merge
    color: violet
    description: Which combinations of libraries call the same interval
  - name: Signal at the strongest intervals
    icon: mdi:chart-box-outline
    color: violet
    description: Fold enrichment of the most strongly bound intervals, clustered
    collapsed: true
  - name: Consensus tables
    icon: mdi:table
    color: gray
    description: The merged intervals, and the fold enrichment behind the heatmap
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      The per-ChIP calls merged into one set of intervals per antibody: an interval every
      replicate calls is reproducible binding. Pick one consensus set on the left first,
      since the libraries of two sets never meet. The UpSet shows which libraries agree;
      the heatmap below it, folded, the signal at the strongest intervals.
    tag: cs-cons-intro
    index: cons-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
