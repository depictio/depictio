    data_collection_tag: homer_annotated_peaks
    use: homer/annotated_peaks
    visu_type: bar
    dict_kwargs: {x: sample, color: annotation_class}
    title: Peak annotation per sample
    description: How the peaks of each sample split across promoter-TSS, exon, intron, TTS and intergenic.
    title_size: h3
    layout: {x: 0, y: 3, w: 4, h: 6}
  - component_type: figure
    tag: cs-pk-fig-tss
    index: cs-pk-fig-tss
    section: Where the peaks land
    workflow_tag: chipseq
    data_collection_tag: homer_annotated_peaks
    mode: code
    visu_type: histogram
    code_content: |
      # distance to the nearest TSS, clipped to a 10 kb window: the raw column
      # runs to several hundred kb and would flatten the peak at zero
      window = 10_000
      df_modified = df.filter(
          pl.col("distance_to_tss").is_not_null()
          & (pl.col("distance_to_tss").abs() <= window)
      )

      fig = px.histogram(
          df_modified.to_pandas(),
          x="distance_to_tss",
          color="annotation_class",
          nbins=80,
          opacity=0.8,
      )
      fig.update_layout(
          barmode="overlay",
          xaxis_title="Distance to nearest TSS (bp)",
          yaxis_title="Peaks",
          legend_title_text="Feature class",
          margin={"t": 24, "l": 64, "r": 16, "b": 48},
      )
      fig.add_vline(x=0, line_dash="dot", line_color="grey")
    title: Distance to the nearest TSS
    description: Peaks within 10 kb of a TSS, by feature class. The dotted line is the TSS itself.
    title_size: h3
    layout: {x: 4, y: 3, w: 4, h: 6}

