    layout: {x: 6, y: 1, w: 2, h: 2}

  # ----------------------------------------------------- manhattan + scatter
  - component_type: text
    tag: cs-pk-manhattan-intro
    section: Significance along the genome
    title: Pick peaks here, read them in the tables below
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each point is a peak at its summit, height is the
      [MACS2](https://github.com/macs3-project/MACS) q-value. Lasso a region
      on the Manhattan panel: the selection carries the peak id into the
      [HOMER](http://homer.ucsd.edu/homer/) annotation table through the
      project links.
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: cs-pk-av-manhattan
    index: cs-pk-av-manhattan
    section: Significance along the genome
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    use: macs2/peak_significance
    config:
      feature_col: peak_id
      score_kind: "-log10(q)"
      color_by_columns: [sample]
      default_color_by: sample
      selection_enabled: true
      selection_column: peak_id
      top_n_labels: 10
    title: Peak significance along the genome
    description: Every peak at its summit position; height is -log10 of the MACS2 q-value, colour is the sample.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 7}
  # Was a `mode: code` scatter that pulled the whole 258 986-row frame into the
  # worker and then kept `head(2000)`: code mode skips column projection and
  # aggregation pushdown, so the read was the full table however few points were
  # drawn. The `volcano` kind reduces at scan level and keeps the tail whole
  # (sampling.py, TAIL_ROLE["volcano"]), which is what that head() was reaching
  # for. `index` is the figure's, unchanged, so saved filters survive.
  # The per-sample colouring the code figure had is not reproducible here - the
  # volcano colours by hit tier - but the Manhattan above already colours by
  # sample over the same frame, and `category_col` keeps the sample in the
  # show-underlying-data table.
  - component_type: advanced_viz
    tag: cs-pk-av-volcano
    index: cs-pk-fig-volcano
    section: Significance along the genome
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    viz_kind: volcano
    config:
      viz_kind: volcano
      feature_id_col: peak_id
      effect_size_col: fold_enrichment
      significance_col: neg_log10_qvalue
      significance_is_neg_log10: true
      label_col: peak_id
      category_col: sample
      # q < 1e-10, the same cut-off the "Median -log10 q" card draws at 10. It is
      # also what the scan keeps whole: every peak past it reaches the browser,
      # the undifferentiated middle is strided.
      significance_threshold: 1.0e-10
      effect_threshold: 5.0
      top_n_labels: 15
      show_labels: true
    title: Enrichment against significance
    description: -log10 of the MACS2 q-value against fold enrichment over input. The dashed lines are q 1e-10 and five-fold enrichment; peaks past both are drawn large.
    title_size: h3
    layout: {x: 0, y: 8, w: 4, h: 6}
  - component_type: figure
    tag: cs-pk-fig-width
    section: Significance along the genome
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    use: macs2/peaks
    visu_type: histogram
    # Log x: peak width is a long tail. On a linear axis the widest call
    # sets the range, every bin but the first two is empty, and the panel
    # reads as a single spike against 19 kb of white space.
    dict_kwargs: {x: width, color: sample, nbins: 60, log_x: true}
    title: Peak width distribution
    description: How wide the calls are, per sample, on a log axis. A histone mark gives broader peaks than a transcription factor.
    title_size: h3
    layout: {x: 4, y: 8, w: 4, h: 6}

