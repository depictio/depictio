    column_name: neg_log10_padj
    column_type: float64
    display:
      icon_name: mdi:check-decagram
      custom_color: red
    section: Differential filters
    group: Effect
    tag: cs-diff-filter-padj
    index: diff-padj-range
    title: Significance
    layout: {x: 0, y: 7, w: 1, h: 3}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: count
