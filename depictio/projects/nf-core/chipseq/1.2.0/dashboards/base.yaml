      custom_color: indigo
    section: Consensus filters
    group: Location
    tag: cs-cons-filter-chr
    index: cons-chr-filter
    title: Chromosome
    layout: {x: 0, y: 6, w: 1, h: 3}
  # The breakdown is the consensus set: chipseq builds one set per antibody.
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: consensus_set
    display:
      icon_name: mdi:counter
      icon_color: violet
      caption: intervals, by consensus set
    section: Consensus at a glance
    tag: cs-cons-card-intervals
    index: cons-card-intervals
