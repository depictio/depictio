    description: The annotated calls on the region, split by feature class.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: homer_annotated_peaks
    use: homer/annotated_peaks
    aggregation: nunique
    column_name: gene_name
    column_type: object
    filter_expr: col('gene_name').is_not_null() & (col('gene_name') != '')
    secondary_layout: top_n
    breakdown_col: annotation_class
    follow_region_filter: true
    display:
      icon_name: mdi:dna
      icon_color: teal
      caption: distinct genes, by feature class
    section: Region at a glance
    tag: cs-loc-card-genes
    index: loc-card-genes
    title: Nearest genes
    description: Distinct genes named as the nearest gene of a call on the region.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # A navigator that drives a browser sets no default_region: the browser opens on
  # its own locus, and the axis opens on the whole chromosome it shows
  # (open_on_view_window), its window drawn as a band. The axis does not follow
  # that window: on a few kilobases it would open on empty lanes, where the
  # chromosome shows where the calls are to zoom and brush. Bars, not level rects:
  # a rect is a 2 px segment at the score and vanishes at chromosome scale, a bar
  # rises from the baseline and keeps a minimum width. A drag brushes a region
  # (interaction_mode: select), which is what the tile is for.
  - component_type: advanced_viz
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    use: macs2/peak_genome_view
    config:
      mark: bar
      facet_by_sample: true
      lane_height: 56
      max_facets: 8
      # Per lane: the weaker antibodies would draw flat on a shared ruler.
      facet_y_scale: independent
      score_title: -log10(q)
      opacity: 0.85
      assembly: '{GENOME}'
      open_on_view_window: true
      interaction_mode: select
      region_filter_enabled: true
      selection_enabled: true
      selection_column: peak_id
    section: Peaks on one axis
    tag: cs-loc-navigator
    index: loc-navigator
    title: Calls per library
    description: >-
      Where does each library call peaks along the genome, and do replicates agree? Each lane is one
      library and each bar a MACS3 call, as high as its -log10(q), on a chromosome axis. Every lane has its
      own height scale, so heights compare within a lane and not between lanes.

      How to read: look for bars at the same place in the replicates of an antibody, which is reproducible
      binding, and for bars under one antibody or condition only. Drag on the axis to pick a region, or
      type a locus; the cards, the consensus lane and the genome browser follow it.

      Lines and annotations: the band on the axis is the genome browser's current window, drawn when the
      browser is beside this tile. No threshold line is drawn.

      Note: at most eight lanes are drawn, the first libraries in genome order, so narrow the libraries
      with the sample filters to see the others.
    layout: {x: 0, y: 0, w: 8, h: 8}
  # The run's own files in a genome browser: bigWig signal of every ChIP and
  # input, the MACS3 peak calls and the filtered BAMs, read by range from the
  # results folder (TRACKS_URI) or from the files uploaded at ingestion. The
  # sample filter of the left panel (persistent across tabs) picks which tracks
  # are open.
  - component_type: jbrowse
    tag: cs-loc-browser
    index: loc-browser
    section: Peaks on one axis
    workflow_tag: chipseq
    data_collection_tag: tracks
    title: Genome browser
    description: >-
      What do the run's own files show at one locus? A genome browser on the run's assembly with the tracks
      the pipeline published: the bigWig signal of every ChIP and input, the MACS3 peak calls and the
      filtered alignments. Six tracks open first and up to sixteen can be open, coloured by antibody (by
      condition in a single-antibody run), with the inputs in grey.

      How to read: a clean binding site has signal in the ChIP and its replicate under a called peak, over
      a flat input. Signal without a peak call, or a peak over a flat ChIP, deserves a doubt, and the
      alignments show the reads behind it. The sample filters of the left panel pick which tracks are open,
      and the browser steps through the strongest calls and the consensus intervals.

      Note: the tracks are read in place from the results folder or from the files uploaded at ingestion,
      and a run given no assembly has no browser.
    max_tracks: 16
    initial_tracks: 6
    show_overview: false
    # The lanes above already say where the browser is: its locus bar only
    # costs height here, and the tile's menu brings it back.
    show_header: false
    # No selection write-back: a picked track would narrow the peaks to one
    # library and reframe the view. Two sources: the per-library calls (one
    # density row per library) and the consensus intervals of each antibody.
    # A picked peak narrows macs2_peaks to a few rows and the view jumps to it;
    # a sample filter leaves hundreds, so it never moves the view.
    locus_from:
      - data_collection_tag: macs2_peaks
        name: Peaks
        color: teal
        chrom_column: chr
        start_column: start
        end_column: end
        padding: 2000
        max_rows: 5
        sort_by: neg_log10_qvalue
        descending: true
        label_column: peak_id
        sample_column: sample
        columns: [fold_enrichment, width]
      - data_collection_tag: macs2_consensus_boolean
        name: Consensus
        color: grape
        chrom_column: chr
        start_column: start
        end_column: end
        padding: 2000
        sort_by: num_samples
        descending: true
        label_column: peak_id
        columns: [num_samples, consensus_set]
    layout: {x: 0, y: 8, w: 8, h: 10}
  # A coverage track, faceted by consensus set: chipseq builds one consensus
  # set per antibody, and a lane per set keeps them apart.
  - component_type: advanced_viz
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
    viz_kind: coverage_track
    config:
      viz_kind: coverage_track
      chromosome_col: chr
      position_col: start
      end_col: end
      value_col: num_samples
      sample_col: consensus_set
      color_by: sample
      view_mode: facet
      mark: rect
      smoothing_window: 0
      show_annotation_lane: false
      view: track
      views: [track]
    section: Peaks on one axis
    tag: cs-loc-consensus
    index: loc-consensus
    title: Consensus intervals per antibody
    description: >-
      Where do the libraries of an antibody agree on this region? One lane per consensus set, one set per
      antibody. Each bar is a merged interval, as high as the number of libraries calling a peak there.

      How to read: a bar as high as the number of replicates is reproducible binding, and a short bar is an
      interval only some libraries call. A set with no bar on the region has no consensus interval there.
    layout: {x: 0, y: 18, w: 8, h: 3}
