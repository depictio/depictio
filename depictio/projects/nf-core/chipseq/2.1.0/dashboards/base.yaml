    config:
      mark: bar
      facet_by_sample: true
      lane_height: 56
      max_facets: 8
      # Per lane: the weaker antibodies would draw flat on a shared ruler.
      facet_y_scale: independent
      score_title: -log10(q)
      opacity: 0.85
      assembly: '{GENOME}'
      interaction_mode: select
      default_region: first
      region_filter_enabled: true
      selection_enabled: true
      selection_column: peak_id
    section: Peaks on one axis
    tag: cs-loc-navigator
    index: loc-navigator
    title: Calls per library
    description: Each lane is a library and each bar a MACS3 call, as high as its -log10(q). Look for bars at the same place in the replicates of an antibody, which is reproducible binding, and for bars present under one antibody or condition only. It opens on the first chromosome of the calls; drag on the axis to pick a region, or type a locus.
    layout: {x: 0, y: 0, w: 8, h: 8}
  # A coverage track, faceted by consensus set: chipseq builds one consensus
  # set per antibody, and a lane per set keeps them apart.
  - component_type: advanced_viz
