  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:waves
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Signal filters
