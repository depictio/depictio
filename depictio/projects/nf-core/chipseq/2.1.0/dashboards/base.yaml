    layout: {x: 0, y: 6, w: 1, h: 3}
  # Ranked by chromosome, not by consensus set: a run with one antibody has one
  # set, and a ranking of one bar says nothing.
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: chr
    display:
      icon_name: mdi:counter
      icon_color: violet
      caption: the chromosomes with the most
    section: Consensus at a glance
    tag: cs-cons-card-intervals
    index: cons-card-intervals
    title: Consensus intervals
    description: Intervals of the merged peak sets in view.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    aggregation: median
    column_name: num_samples
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:account-group-outline
      icon_color: indigo
      caption: median, with its spread
      decimals: 0
    section: Consensus at a glance
    tag: cs-cons-card-support
    index: cons-card-support
    title: Libraries per interval
    description: How many libraries call a peak on each consensus interval.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    aggregation: sum
    column_name: num_peaks
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:layers-outline
      icon_color: teal
      caption: total; the bars, peaks per interval
    section: Consensus at a glance
    tag: cs-cons-card-peaks
    index: cons-card-peaks
    title: Peaks merged
    description: Per-library peaks merged into the consensus intervals in view.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_fc
    use: macs2/consensus_fc
    aggregation: count
    column_name: support
    column_type: object
    secondary_layout: donut
    breakdown_col: support
    display:
      icon_name: mdi:chart-donut
      icon_color: orange
      caption: by libraries calling them
    section: Consensus at a glance
    tag: cs-cons-card-strongest
    index: cons-card-strongest
    title: Strongest intervals
    description: The most strongly bound intervals, split by how many libraries call them.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_upset
    config:
      # Library columns of the run (`<sample>_REP<replicate>`), whatever the samples.
      set_columns_pattern: '_REP\d+$'
      color_intersections_by: degree
      show_set_sizes: true
      show_values: true
      sort_by: cardinality
      sort_order: descending
      min_size: 1
    section: Replicate agreement
    tag: cs-cons-upset
    index: cons-upset
    title: Consensus peak overlap
    description: >-
      Which libraries call the same consensus intervals? Each matrix column is one combination of
      libraries, and its bar counts the consensus intervals called by that combination, largest first. The
      bars on the left give each library's total, and the colour tells how many libraries the combination
      holds.

      How to read: a tall bar for all the replicates is a reproducible set, while many single-library bars
      are calls their replicates do not support. Pick one consensus set in the filters first, since the
      libraries of two antibodies never meet.
    layout: {x: 0, y: 0, w: 8, h: 8}
  - component_type: advanced_viz
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_fc
    use: macs2/consensus_signal_heatmap
    config:
      value_columns_pattern: '_REP\d+$'
      row_annotation_cols: [consensus_set, support]
      cluster_rows: true
      cluster_cols: true
      normalize: log1p
      colorscale: Viridis
    section: Signal at the strongest intervals
    tag: cs-cons-heatmap
    index: cons-heatmap
    title: Consensus signal heatmap
    description: >-
      Which intervals do the libraries bind most strongly, and in which libraries? Rows are the strongest
      consensus intervals of each set (up to 250, ranked by their summed fold enrichment), columns are
      libraries, and a cell is the library's fold enrichment at the interval, shown as log(1 + fold
      enrichment) on a Viridis scale. Rows and columns are clustered by Ward linkage on Euclidean distance.

      How to read: blocks of bright cells shared by the replicates of a condition are condition-specific
      binding, and a column that is dim everywhere is a weak library. A zero cell is a library that called
      no peak there.

      Lines and annotations: the two row strips give each interval's consensus set and its support, the
      number of libraries calling it. The clustering is a display choice and no threshold is applied.
    layout: {x: 0, y: 0, w: 8, h: 5}
  # One PCA per antibody: a component only compares libraries inside its own
  # count matrix, so the Consensus set filter narrows it to one set. Coloured by the
  # condition the 2.1.0 recipe joins from the hub, the question 2.x has left
  # without its differential test; the set stays one switch away.
  - component_type: advanced_viz
    workflow_tag: chipseq
    data_collection_tag: deseq2_qc_pca
    use: deseq2/qc_pca_embedding
    config:
      cluster_col: consensus_set
      color_col: condition
      default_color_by: condition
      hover_cols: [consensus_set, dim_1_percent, dim_2_percent]
      point_size: 12
      marker_outline: true
      axis_prefix: PC
      legend_pos: right
      selection_enabled: true
      selection_column: sample_id
    section: Sample space
    tag: cs-cons-pca
    index: cons-pca
    title: Consensus count PCA
    description: >-
      Do the libraries of one antibody group by condition? Each point is one library, placed by the first
      two principal components the pipeline computed on its antibody's consensus counts, and coloured by
      condition. The hover gives the consensus set and the variance each component explains.

      How to read: replicates of a condition that sit close together and apart from the other conditions
      along PC1 mean the condition is the main source of variation in the counts. A replicate far from its
      condition is an outlier or a mislabelled library worth a look in [Peaks](tab:Peaks) and
      [MultiQC](tab:MultiQC).

      Note: each antibody has its own count matrix, so pick one consensus set in the filters, since
      libraries of two antibodies are never placed together. The components come from DESeq2 QC on
      variance-stabilised counts (vst unless the run sets deseq2_vst off), and a set with few libraries
      gives a coarse picture.

      Source: nf-core/chipseq parameters, deseq2_vst, https://nf-co.re/chipseq/2.1.0/parameters
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: chipseq
    data_collection_tag: deseq2_qc_sample_dists
    use: deseq2/qc_distance_heatmap
    config:
      cluster_rows: true
      cluster_cols: true
      cluster_method: ward
      colorscale: Blues
    section: Sample space
    tag: cs-cons-dists
    index: cons-dists
    title: Library distances
    description: >-
      Which libraries resemble each other on the consensus counts? Each cell is the Euclidean distance
      between two libraries of one antibody on DESeq2 variance-stabilised values (vst unless the run sets
      deseq2_vst off, then rlog), with rows and columns clustered by Ward linkage. The colour bar gives the
      scale.

      How to read: replicates of a condition should sit next to each other in the clustering with small
      distances, and a library that clusters away from its condition is a candidate outlier. Libraries of
      two antibodies were never compared, so those cells are empty and the matrix is block diagonal.

      Source: nf-core/chipseq parameters, deseq2_vst, https://nf-co.re/chipseq/2.1.0/parameters
    layout: {x: 0, y: 5, w: 8, h: 5}
  - component_type: table
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    row_selection_enabled: true
    row_selection_column: peak_id
    section: Consensus tables
    tag: cs-cons-table-boolean
    index: cons-table-boolean
    title: Consensus intervals
    description: >-
      Which intervals did the per-library peaks merge into, and who called them? One row per consensus
      interval, with its coordinates, its consensus set, the number of peaks merged into it, the number of
      libraries calling it and a 1 or 0 per library.

      How to read: sort by the number of libraries to separate the reproducible intervals from the ones a
      single library calls, and filter by consensus set or chromosome. Open [Locus](tab:Locus) to see an
      interval on the genome.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_fc
    use: macs2/consensus_fc
    row_selection_enabled: true
    row_selection_column: peak_id
    section: Consensus tables
    tag: cs-cons-table-fc
    index: cons-table-fc
    title: Consensus fold enrichment
    description: >-
      How strong is each library at the strongest intervals? One row per interval among the strongest of
      its consensus set, with the fold enrichment of every library there and the number of libraries
      calling it.

      How to read: a 0 means the library called no peak on the interval. Compare the values across the
      replicates of an antibody to see which library carries the interval, and read the same matrix as
      clusters in the heatmap above.
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: table
    workflow_tag: chipseq
    data_collection_tag: deseq2_qc_pca
    use: deseq2/qc_pca
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Consensus tables
    tag: cs-cons-table-pca
    index: cons-table-pca
    title: Principal components
    description: >-
      Where does each library sit on the principal components? One row per library, with its first two
      components inside its antibody's count matrix, its condition and the share of the variance each
      component explains.

      How to read: compare libraries of one consensus set only, and read the variance shares before the
      positions, since a component that explains little separates little. The same values draw the PCA
      above.
    layout: {x: 0, y: 12, w: 8, h: 6}
  - component_type: table
    workflow_tag: chipseq
    data_collection_tag: deseq2_qc_sample_dists
    use: deseq2/qc_sample_dists
    row_selection_enabled: true
    row_selection_column: sample
    section: Consensus tables
    tag: cs-cons-table-dists
    index: cons-table-dists
    title: Library distance matrix
    description: >-
      How far apart is every pair of libraries? The square table of Euclidean distances between libraries
      on DESeq2 variance-stabilised values, one row and one column per library.

      How to read: read a row for the libraries closest to it, which should be its replicates. A pair from
      two different antibodies is empty because those libraries were never compared.
    layout: {x: 0, y: 18, w: 8, h: 6}
