  # The preseq slider's route alternate: a default run has no preseq, every run
  # has the MarkDuplicates metrics (removed when PRESEQ_RAN is set).
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: picard_markduplicates_metrics
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: percent_duplication
    column_type: float64
    display:
      icon_name: mdi:content-copy
      custom_color: pink
    section: Signal filters
    group: Signal strength
    tag: cs-sig-filter-duplication
    index: sig-duplication-range
    title: Duplicate share
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: deeptools_fingerprint_metrics
    use: deeptools/fingerprint_metrics
    aggregation: median
    column_name: auc_ratio
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-areaspline
      icon_color: cyan
      caption: median, with its spread
      decimals: 2
    section: Signal at a glance
    tag: cs-sig-card-auc
    index: sig-card-auc
    title: Coverage concentration
    description: Area under the fingerprint curve over that of a uniform library of the same depth; 1 is no concentration at all, and a ChIP sits below its input.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: deeptools_fingerprint_metrics
    use: deeptools/fingerprint_metrics
    aggregation: median
    column_name: synthetic_js_distance
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:magnet
      icon_color: indigo
      caption: median, with its distribution
      decimals: 2
    section: Signal at a glance
    tag: cs-sig-card-jsd
    index: sig-card-jsd
    title: Distance from uniform
    description: Median Jensen-Shannon distance between a library's coverage and a uniform one of the same depth; 2.x writes no distance to the input itself.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: deeptools_fingerprint_metrics
    use: deeptools/fingerprint_metrics
    aggregation: median
    column_name: elbow_point
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:percent-outline
      icon_color: orange
      caption: median, with its distribution
      format: percent
    section: Signal at a glance
    tag: cs-sig-card-enriched
    index: sig-card-enriched
    title: Genome at background
    description: Median share of genome bins before the fingerprint curve turns upward, the part left at background coverage; near one half for an input, higher when the reads gather in a few regions.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # Route alternates, one slot. preseq's curve ends at a billion reads for every
  # library (the recipe clips there), so that depth compares the libraries like
  # for like; 2.x skips preseq by default, and the import then drops the card
  # with its empty collection. The duplication card beside it reads Picard,
  # which every run writes, and goes when PRESEQ_RAN removes its collection.
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: preseq_complexity_curve
    use: preseq/complexity_curve
    aggregation: median
    column_name: expected_distinct
    column_type: float64
    filter_expr: col('total_reads') == 1000000000
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:fingerprint
      icon_color: teal
      caption: median at 1 billion reads, with its spread
      decimals: 0
    section: Signal at a glance
    tag: cs-sig-card-distinct
    index: sig-card-distinct
    title: Distinct fragments
    description: Distinct fragments preseq expects a library to yield at a billion reads; a low value is a library that sequencing deeper will not save.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: picard_markduplicates_metrics
    use: picard/markduplicates_metrics
    aggregation: median
    column_name: percent_duplication
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:content-copy
      icon_color: teal
      caption: median, with its spread
      format: percent
    section: Signal at a glance
    tag: cs-sig-card-duplication
    index: sig-card-duplication
    title: Duplicate reads
    description: Median share of a library's reads Picard MarkDuplicates flags as duplicates before they are removed; a high share is a library sequenced past its complexity.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: chipseq
    data_collection_tag: deeptools_fingerprint_metrics
    use: deeptools/fingerprint_metrics
    visu_type: bar
    mode: code
    code_content: |-
      # One bar per library, the least concentrated on top. Left, the area under its coverage curve over that of a uniform library: red past 0.95 (no better than uniform), amber from 0.85, cyan below. Right, its Jensen-Shannon distance to a uniform library, coloured the same way.
      names = {'auc_ratio': 'Coverage area over uniform', 'synthetic_js_distance': 'Distance to uniform (JS)'}
      d = df.filter(pl.col('auc_ratio').is_not_null()).with_columns(pl.when(pl.col('auc_ratio') > 0.95).then(pl.lit('Flat')).when(pl.col('auc_ratio') > 0.85).then(pl.lit('Borderline')).otherwise(pl.lit('Concentrated')).alias('verdict')).sort(['auc_ratio', 'sample'], descending=[True, True])
      long = d.select(['sample', 'verdict', 'auc_ratio', 'synthetic_js_distance']).unpivot(index=['sample', 'verdict'], variable_name='metric', value_name='value').with_columns(pl.col('metric').replace(names))
      fig = px.bar(long.to_pandas(), x='value', y='sample', color='verdict', color_discrete_map={'Concentrated': '#15aabf', 'Borderline': '#f59f00', 'Flat': '#e03131'}, facet_col='metric', orientation='h', custom_data=['sample'], category_orders={'sample': d.get_column('sample').to_list(), 'metric': list(names.values()), 'verdict': ['Concentrated', 'Borderline', 'Flat']}, labels={'value': '', 'sample': '', 'verdict': ''})
      fig.update_traces(hovertemplate='<b>%{customdata[0]}</b><br>%{x:.3f}<extra></extra>')
      fig.update_xaxes(matches=None, showticklabels=True)
      fig.update_yaxes(automargin=True)
      fig.update_xaxes(range=[0, 1], col=1)
      fig.for_each_annotation(lambda a: a.update(text=a.text.split('=')[-1]))
      fig.add_vrect(x0=0.85, x1=0.95, fillcolor='rgba(245,159,0,0.15)', line_width=0, layer='below', col=1)
      fig.add_vrect(x0=0.95, x1=1, fillcolor='rgba(224,49,49,0.15)', line_width=0, layer='below', col=1)
      fig.update_layout(margin=dict(t=30), legend=dict(orientation='h', y=-0.12))
    selection_enabled: true
    selection_column: sample
    section: Coverage concentration
    tag: cs-sig-fingerprint
    index: sig-fingerprint
    title: Coverage concentration per library
    description: >-
      Which libraries gather their reads in few places, and which look like an input? Each bar is one
      library, in two panels that share the order. Left, the area under its fingerprint curve over that of
      a library whose reads are spread evenly (1 is no concentration, lower is more); right, its
      Jensen-Shannon distance to that even library (higher is more concentrated, bars coloured by the
      verdict of the left panel: cyan concentrated, amber borderline, red flat).

      How to read: an enriched ChIP has a low area ratio and a high distance, while an input or a failed IP
      sits near 1 on the left and near 0 on the right. Compare each ChIP with its own input, and open
      [MultiQC](tab:MultiQC) for the full curve of a library that looks odd. Click a bar to select the
      library.

      Lines and annotations: the left panel shades two zones, amber from 0.85 to 0.95 and red from 0.95 to
      1, and the verdict colours switch at the same two values. They are display aids set by this
      dashboard, not read from the run and not published by deepTools.

      Source: deepTools plotFingerprint QC metrics,
      https://deeptools.readthedocs.io/en/3.5.5/content/feature/plotFingerprint_QC_metrics.html

      Note: deepTools gives no cut-off for the area ratio, so the zones are not validated thresholds and a
      colour is a lead, not a pass or a fail. Every metric except the synthetic JS distance depends on the
      sequencing depth.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: chipseq
    data_collection_tag: preseq_complexity_curve
    use: preseq/complexity_ribbon
    config:
      log_x: true
      band_opacity: 0.18
      line_width: 2
      x_title: Sequencing depth (reads)
      y_title: Expected distinct molecules
      # Every ChIP and input has a curve: under the plot the legend wraps
      # across the row instead of scrolling.
      legend_pos: bottom
      selection_enabled: true
      selection_column: sample
    section: Metagene and complexity
    tag: cs-sig-complexity
    index: sig-complexity
    title: Library complexity
    description: >-
      Would sequencing deeper buy new molecules? Each curve is one library: the distinct molecules preseq
      expects (y) at each sequencing depth (x, in reads, on a log axis up to 1 billion reads), with a
      ribbon around it.

      How to read: a curve still climbing steeply at the depth already sequenced means resequencing pays,
      and one that has flattened means the library is exhausted. A ribbon that fans out means the
      extrapolation itself is uncertain. Compare libraries at the same depth rather than by curve height
      alone, and click a curve to select the library.

      Lines and annotations: the ribbon is the 95% interval preseq puts around its extrapolation, its
      lower and upper bounds as the tool writes them. No reference line or cut-off is drawn.

      Source: nf-core/chipseq output documentation, https://nf-co.re/chipseq/2.1.0/docs/output

      Note: preseq is skipped in a default run, so this tile only draws when the run kept it, and its
      predictions are not absolute.
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: chipseq
    data_collection_tag: deeptools_plot_profile
    use: deeptools/metagene_profile
    config:
      reference_x: 300
      reference_label: TSS
      shaded_bands:
      - [300, 400, Gene body]
      x_title: Bin (TSS at 300, TES at 400)
      y_title: Mean signal
      line_width: 2
      legend_pos: bottom
      selection_enabled: true
      selection_column: sample
    section: Metagene and complexity
    tag: cs-sig-metagene
    index: sig-metagene
    title: Metagene signal profile
    description: >-
      Where along a gene does each library put its signal? Each line is one library: the mean signal (y) in
      the bins (x) of a gene scaled to one length, with a 3 kb flank on either side.

      How to read: a promoter-bound factor or mark peaks around the transcription start site, a broad mark
      spreads over the gene body, and an input control stays flat. Compare each ChIP with its input and
      replicates with each other, and click a line to select the library.

      Lines and annotations: the dotted line at bin 300 is the transcription start site, where the 3 kb
      upstream flank ends. The shaded bins 300 to 400 are the gene body, scaled to one length. Both mark
      positions of the matrix layout and are not cut-offs.
    layout: {x: 0, y: 0, w: 8, h: 6}
