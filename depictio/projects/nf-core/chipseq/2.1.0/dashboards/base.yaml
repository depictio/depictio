    order: 1
    body: >
      The per-ChIP calls merged into one set of intervals per antibody: an interval every
      replicate calls is reproducible binding. Pick one consensus set in the Consensus
      filters first (the Antibody filter of the panel does not reach this tab), since the
      libraries of two sets never meet. The UpSet shows which libraries agree,
      and the [DESeq2](https://bioconductor.org/packages/DESeq2) QC whether they group by
      condition on the counts.
    tag: cs-cons-intro
    index: cons-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
    interactive_component_type: MultiSelect
    column_name: consensus_set
    column_type: object
    display:
      icon_name: mdi:set-merge
      custom_color: grape
    section: Consensus filters
    group: Consensus
    tag: cs-cons-filter-set
    index: cons-set-filter
    title: Consensus set
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: num_samples
    column_type: int64
    display:
      icon_name: mdi:account-group-outline
      custom_color: green
    section: Consensus filters
    group: Consensus
    tag: cs-cons-filter-support
