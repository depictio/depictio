  - component_type: advanced_viz
    workflow_tag: chipseq
    data_collection_tag: homer_feature_classes
    viz_kind: stacked_bar
    config:
      viz_kind: stacked_bar
      sample_id_col: sample
      taxon_col: annotation_class
      rank_col: rank
      abundance_col: peak_count
      top_n: 12
      sort_by: abundance
      normalise_to_one: true
      sample_sort: name
      orientation: h
      value_title: Share of the library's peaks
      x_title: ''
      hidden_controls: [rank, top_n]
    section: Feature classes
    tag: cs-anno-classes
    index: anno-classes
    title: Feature classes per library
    description: >-
      Where do each library's peaks fall relative to genes? Each bar is one library, split into the share
      of its peaks in each HOMER feature class, in the colour of the class used everywhere in this
      dashboard. The twelve most abundant classes are listed.

      How to read: a promoter-bound factor puts most of its peaks in promoter-TSS, a factor that binds
      distal elements spreads them over intron and Intergenic, and replicates of one antibody should look
      alike. Normalise off shows the counts, Sort samples ranks the libraries, and a class can be hidden
      from the controls.

      Note: the classes are HOMER's coarse feature classes, taken before the transcript detail of its
      annotation, so one peak belongs to exactly one class.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: chipseq
    data_collection_tag: homer_tss_distance_profile
    use: homer/tss_distance
    config:
      reference_x: 0
      reference_label: TSS
      shaded_bands:
      - [-1000, 1000, Promoter window]
      x_title: Distance to the nearest TSS (bp)
      y_title: Share of the library's peaks
      legend_pos: right
    section: Distance to the nearest TSS
    tag: cs-anno-tss-distance
    index: anno-tss-distance
    title: Peaks around the nearest TSS
    description: >-
      How close to a gene start do the peaks sit? Each curve is one library: the share of its peaks (y) in
      250 bp bins of signed distance to the nearest transcription start site (x), across a 20 kb window.
      Peaks further out are counted in the outermost bin.

      How to read: a sharp spike at 0 means the peaks are promoter-bound, and a flat curve means they sit
      across gene bodies and intergenic space. Replicates of one antibody should draw similar curves.

      Lines and annotations: the line at 0 is the transcription start site. The shaded band from -1000 to
      1000 bp is a promoter window, a fixed display aid of this dashboard that is not read from the run.

      Note: the band is not a validated cut-off and not HOMER's own classification, whose feature classes
      follow HOMER's rules.
    layout: {x: 0, y: 0, w: 8, h: 6}
  # Master and detail: a picked row is the selection the record card follows.
  - component_type: table
    workflow_tag: chipseq
    data_collection_tag: homer_annotated_peaks
    use: homer/annotated_peaks
    row_selection_enabled: true
    row_selection_column: peak_id
    section: Peak annotation
    tag: cs-anno-table
    index: anno-table
    title: HOMER peak annotation
    description: >-
      Which feature and which gene did HOMER assign to each peak? One row per peak, with its feature
      class, the distance to the nearest start site and the nearest gene.

      How to read: read the class and the distance together. A promoter-TSS peak a few hundred bp from a
      start site is a promoter peak, while an Intergenic one tens of kb away is distal and its gene is only
      the nearest one.

      Note: the nearest gene is a position, not evidence that the factor regulates it, and the gene type
      is empty when the run annotated against a plain GTF.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: chipseq
    data_collection_tag: homer_annotated_peaks
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: peak_id
      title_col: peak_id
      selection_source: any
      linked_component: cs-anno-table
      sections:
        Call: [sample, chr, start, end, strand, peak_score]
        Annotation: [annotation_class, annotation, distance_to_tss, nearest_promoter_id, gene_name, gene_type]
      labels:
        distance_to_tss: Distance to TSS (bp)
        nearest_promoter_id: Nearest promoter
    section: Peak annotation
    tag: cs-anno-record
    index: anno-record
    title: Peak record
    description: >-
      What does HOMER say about one peak? The card lists the call picked in the table beside it (library,
      chromosome, start, end, strand and peak score) and its annotation (feature class, full HOMER
      annotation, distance to the nearest start site, nearest promoter, gene name and gene type).

      How to read: no value is rated here. Read the feature class with the distance to the start site, and
      treat the gene as the nearest one, not as a target.

      Note: the gene type is empty when the run annotated against a plain GTF.
    layout: {x: 5, y: 0, w: 3, h: 5}
# The locus section: the calls and the run's own files on one genomic region.
# The navigator (macs2/peak_genome_view on macs2_peaks) opens on the chromosome
# the browser shows and emits the chromosome and position filters; the two region
# links in template.yaml rename them onto the consensus intervals and the HOMER
# annotation, so the consensus lane and the cards clamp to the same window, and
# the genome browser under the navigator follows the brush. The consensus
# intervals are also a source of the browser (its density strip and next /
# previous). A tab of its own: a region filter narrows every tile of its
# collection on the tab. The axis and the browser come from GENOME (2.x runs on
# any reference).
- title: Locus
  subtitle: What do the libraries call at one genomic region?
  tab_group: Peak calls
  tab_order: 5
  tab_icon: mdi:map-search-outline
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Locus filters
    icon: mdi:filter-variant
    color: teal
    description: Peak strength, consensus support and feature class of the tracks on the region
  grid_sections:
  - name: Region at a glance
    icon: mdi:counter
    color: teal
    description: What the region in view holds, recounted on every brush or locus entry
  - name: Peaks on one axis
    icon: mdi:dna
    color: teal
    description: Brush the lanes to move the browser below; its view returns as a dashed band.
  components:
  - component_type: text
    order: 1
    body: >
      The calls of every ChIP on one genome axis, with the run's own signal and
      alignments in a genome browser under them (once the run's assembly is given)
      and the consensus intervals per antibody below. The tab opens where the
      browser does, on the strongest call; drag on the navigator's axis or type a
      locus in its header, and the browser, the consensus lane and the cards follow.
    tag: cs-loc-intro
    index: loc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: neg_log10_qvalue
    column_type: float64
    display:
      icon_name: mdi:check-decagram
      custom_color: red
    section: Locus filters
    group: Region
    tag: cs-loc-filter-qvalue
    index: loc-qvalue-range
    title: Peak significance
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: num_samples
    column_type: int64
    display:
      icon_name: mdi:account-group-outline
      custom_color: green
    section: Locus filters
    group: Region
    tag: cs-loc-filter-support
    index: loc-support-range
    title: Libraries per interval
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: homer_annotated_peaks
    interactive_component_type: MultiSelect
    column_name: annotation_class
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: blue
    section: Locus filters
    group: Region
    tag: cs-loc-filter-class
    index: loc-class-filter
    title: Feature class
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    use: macs2/peaks
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: composition
    breakdown_col: sample
    follow_region_filter: true
    display:
      icon_name: mdi:counter
      icon_color: indigo
      caption: calls, by library
    section: Region at a glance
    tag: cs-loc-card-peaks
    index: loc-card-peaks
    title: Calls in the region
    description: MACS3 calls on the region in view, one per peak and library.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    aggregation: median
    column_name: num_samples
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    follow_region_filter: true
    display:
      icon_name: mdi:set-merge
      icon_color: violet
      caption: median, with its spread
      decimals: 0
    section: Region at a glance
    tag: cs-loc-card-support
    index: loc-card-support
    title: Libraries per interval
    description: How many libraries call each consensus interval on the region.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: homer_annotated_peaks
    use: homer/annotated_peaks
    aggregation: count
    column_name: annotation_class
    column_type: object
    secondary_layout: donut
    breakdown_col: annotation_class
    follow_region_filter: true
    display:
      icon_name: mdi:chart-donut
      icon_color: blue
      caption: peaks, by feature class
    section: Region at a glance
    tag: cs-loc-card-classes
    index: loc-card-classes
