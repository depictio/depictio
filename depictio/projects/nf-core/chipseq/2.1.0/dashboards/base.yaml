      y_title: Mean signal
      line_width: 2
      legend_pos: bottom
      selection_enabled: true
      selection_column: sample
    section: Metagene and complexity
    tag: cs-sig-metagene
    index: sig-metagene
    title: Metagene signal profile
    description: Mean signal of every library along a scaled gene with 3 kb flanks, the line at bin 300 is the transcription start site, where the 3 kb upstream flank ends, and the shaded bins 300 to 400 are the gene body, scaled to one length.
    layout: {x: 0, y: 0, w: 8, h: 6}
