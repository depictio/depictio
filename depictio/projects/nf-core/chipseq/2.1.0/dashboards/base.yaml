  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Signal filters
    icon: mdi:filter-variant
    color: cyan
    description: Narrows the libraries by background share, and by duplication or depth
  grid_sections:
  - name: Signal at a glance
    icon: mdi:counter
    color: cyan
    description: The fingerprint and duplication numbers a library's signal is judged on
  - name: Coverage concentration
    icon: mdi:chart-bar
    color: cyan
    description: How far each library's coverage departs from a uniform one
  - name: Metagene and complexity
    icon: mdi:chart-line
    color: cyan
    description: The mean signal along a gene, then preseq's extrapolation when the run kept it
  components:
  - component_type: text
    order: 1
    body: >
      The tables [deepTools](https://deeptools.readthedocs.io) writes beside the curves
      MultiQC draws, with the duplication rate from Picard or, when the run kept it, the
      [preseq](https://github.com/smithlabcode/preseq) complexity curve. The fingerprint
      metrics say how concentrated each library's coverage is against a uniform one, inputs
      included: pick ChIP in the Role filter to leave them out. The metagene profile shows
      where the signal sits along a gene.
    tag: cs-sig-intro
    index: sig-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: deeptools_fingerprint_metrics
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: elbow_point
    column_type: float64
    display:
      icon_name: mdi:percent-outline
      custom_color: orange
    section: Signal filters
    group: Signal strength
    tag: cs-sig-filter-enriched
    index: sig-enriched-range
    title: Genome at background
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: preseq_complexity_curve
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: total_reads
