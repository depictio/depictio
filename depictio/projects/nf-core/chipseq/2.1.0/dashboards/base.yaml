      legend_pos: right
      selection_enabled: true
      selection_column: sample
    section: Around the summits
    tag: cs-pk-summit-footprint
    index: pk-summit-footprint
    title: Average peak footprint
    description: The share of each library's calls still open at every offset from their own summit; where a curve crosses one half is the median half-width. The vertical line at 0 is the summit the offsets are measured from.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: table
    workflow_tag: chipseq
    data_collection_tag: macs2_peaks
    use: macs2/peaks
    row_selection_enabled: true
    row_selection_column: peak_id
    section: Peak table
