version: 1
# nf-core/chipseq 2.1.0, on the family rules of depictio/projects/nf-core/RULES.md
# (ampliseq/2.18.0 is the reference implementation). Rebuilt from the chipseq
# 1.2.0 dashboard: the same tab groups, tab names, tags and KPI logic wherever
# the 2.x outputs allow, so a reader moving between the two versions finds the
# same places.
#
# Funnel: library QC (the MultiQC report, the deepTools tables, Picard or preseq)
# -> the peaks each library yielded, where they land and what one region holds
# -> the consensus set per antibody and where the libraries sit in its counts.
# 2.0.0 removed the DESeq2 differential binding test, so the 1.2.0 Differential
# binding tab and every tile, link and line that read its contrasts are gone;
# the DESeq2 sample-space QC that remains moved to the Consensus tab.
#
# The `design` hub carries one row per merged library (the ChIPs and their input
# controls) with the antibody, the replicate and the condition: GROUP_COL of the
# design table (METADATA_FILE) when there is one, else the sample group. The hub
# column is always named `condition`, so the dashboard reads it literally and
# never depends on the optional table.
#
# The MultiQC report is either the one the pipeline wrote under a parquet-era
# MultiQC (module ids such as samtools-1 and mlib_deeptools) or one regenerated
# by the reprocess tool (one id per tool); see template.yaml.
main_dashboard:
  title: nf-core/chipseq
  subtitle: Protein-DNA binding, from library quality to the regions the replicates agree on
  project_tag: ChIP-seq Peak Analysis
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family.
  category_colors:
    condition: auto
    antibody: auto
    role:
      ChIP: '#1c7ed6'
      input control: '#868e96'
    # HOMER's coarse feature classes, written out so a class keeps its colour
    # on the annotation bars, the donut cards and the gene track.
    annotation_class:
      '*': auto
      promoter-TSS: '#d6336c'
      "5' UTR": '#ae3ec9'
      exon: '#7048e8'
      intron: '#1c7ed6'
      "3' UTR": '#1098ad'
      TTS: '#0ca678'
      non-coding: '#74b816'
      Intergenic: '#f59f00'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. All
  # five are bound to the design hub; the antibody reaches the consensus sets
  # and the sample PCA through prefix links.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  - name: QC thresholds
    icon: mdi:tune
    color: cyan
    description: Signal-to-noise and yield floors on the per-library peak QC
    collapsed: true
    persistent: true
    pin: bottom
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab, which no route removes.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The design behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The per-library peak QC rows behind the tiles
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Libraries, below).
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: design
    interactive_component_type: MultiSelect
    column_name: condition
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: Condition
    section: Key figures
    tag: cs-ov-kf-condition
    index: ov-kf-condition
    title: Condition
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: design
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Library
    section: Key figures
    tag: cs-ov-kf-library
    index: ov-kf-library
    title: Library
    layout: {x: 2, y: 0, w: 2, h: 1}
  # The pipeline's wordmark, read from its repository; where it cannot load (no
  # internet), the title is drawn as text.
  - component_type: text
    title: nf-core/chipseq
    logo: https://raw.githubusercontent.com/nf-core/chipseq/master/docs/images/nf-core-chipseq_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/chipseq/master/docs/images/nf-core-chipseq_logo_dark.png
    order: 1
    body: >
      Protein-DNA binding from ChIP-seq reads: how well each library worked, the peaks
      each ChIP yielded against its input, and the regions its replicates agree on.
      [Run parameters](params:)
    tag: cs-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  # Who was sequenced, from the design table: every line cites it, so a line goes
  # with its data.
  - component_type: text
    surface: card
    values:
      libraries: {dc: design, column: sample_id, aggregation: nunique, format: integer}
      chips: {dc: design, column: sample_id, aggregation: nunique, filter_expr: col('role') == 'ChIP', format: integer}
      inputs: {dc: design, column: sample_id, aggregation: nunique, filter_expr: col('role') != 'ChIP', format: integer}
      antibodies: {dc: design, column: antibody, aggregation: nunique, filter_expr: col('role') == 'ChIP',
        format: integer}
      conditions: {dc: design, column: condition, aggregation: nunique, format: integer}
      reps: {dc: design, column: replicate, aggregation: nunique, format: integer}
    body: |
      ### The study
      - ![](icon:mdi:test-tube) **Libraries** {{libraries}}: {{chips}} ChIP and {{inputs}} input control
      - ![](icon:mdi:molecule) **Antibodies** {{antibodies}}, each with its own consensus set
      - ![](icon:mdi:shape-outline) **Conditions** {{conditions}}
      - ![](icon:mdi:content-copy) **Replicates** up to {{reps}} biological per condition
      - ![](icon:mdi:file-table-outline) **Samplesheet** [one row per library](section:Sample sheet), its path in [the run parameters](params:input)
      - ![](icon:mdi:palette-outline) **Condition** {{legend:condition}}
      - ![](icon:mdi:palette-outline) **Antibody** {{legend:antibody}}
    tag: cs-ov-study
    index: ov-study
    layout: {x: 0, y: 1, w: 5, h: 6}
  # The aligner and the read length come from the run's params.json
  # (`{{param:...}}`). No genome line: 2.x runs often name no iGenomes key (a
  # custom FASTA), which would print a dash.
  - component_type: text
    surface: card
    values:
      peaks: {dc: macs2_peak_summary, column: num_peaks, aggregation: sum, format: si}
      ptype: {dc: macs2_peaks, column: peak_type, aggregation: top}
    body: |
      ### The run
      - ![](icon:mdi:source-branch) **Pipeline** nf-core/chipseq 2.1.0
      - ![](icon:mdi:content-cut) **Aligner** {{param:aligner}}, {{param:read_length}} bp reads
      - ![](icon:mdi:chart-scatter-plot) **Peaks** {{peaks}} {{ptype}} calls
      - ![](icon:mdi:tune) [All parameters and tool versions](params:)
    tag: cs-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 6}
  # The marks take the family's colour (the header's), not the theme's blue.
  # A `params:` link searches the software versions the run recorded.
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Five steps from reads to a consensus
      Each step names the tool version it ran and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:content-cut) **Trim** Adapters cut by Trim Galore · [Version](params:trim) · [MultiQC](tab:MultiQC)
      2. ![](icon:mdi:dna) **Align** Reads aligned with {{param:aligner}}, then duplicates and poor alignments filtered · [Settings](params:align) · [Signal](tab:Signal)
      3. ![](icon:mdi:chart-scatter-plot) **Call** MACS3 peaks, each ChIP against its input · [Version](params:macs3) · [Peaks](tab:Peaks)
      4. ![](icon:mdi:tag-outline) **Annotate** HOMER, the nearest gene of each peak · [Annotation](tab:Annotation)
      5. ![](icon:mdi:set-merge) **Merge** One consensus set per antibody, its libraries placed by DESeq2 QC · [Version](params:bedtools) · [Consensus](tab:Consensus)
      :::
    tag: cs-ov-steps
    index: ov-steps
    layout: {x: 0, y: 7, w: 8, h: 3}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/chipseq aligns ChIP-seq reads, calls the peaks of each ChIP against its input control with MACS3 and merges them into one consensus set per antibody. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The sample filters in the left panel apply to every tab: narrow the libraries once and the whole dashboard follows. A bar above a section narrows that section only.
    tag: cs-ov-about
    index: ov-about
    layout: {x: 0, y: 10, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it.
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: design
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: composition
    breakdown_col: condition
    display:
      icon_name: mdi:test-tube
      icon_color: orange
      caption: ChIPs and inputs, by condition
      link: tab:MultiQC
    section: Key figures
    tag: cs-ov-kf-libraries
    index: ov-kf-libraries
    title: Libraries
    description: Libraries in the design, the ChIPs and their input controls. The bar splits them by condition.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: macs2_peak_summary
    use: macs2/peak_summary
    aggregation: sum
    column_name: num_peaks
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-scatter-plot
      icon_color: indigo
      caption: peaks per ChIP, with their spread
      link: tab:Peaks
      format: si
    section: Key figures
    tag: cs-ov-kf-peaks
    index: ov-kf-peaks
    title: Peaks called
    description: MACS3 peaks over the ChIPs in view. The box shows how many each ChIP yielded.
    layout: {x: 2, y: 0, w: 2, h: 2}
  # Every route writes the consensus set (it is not optional), so the card
  # needs no alternate. num_samples splits it into the reproducible tiers.
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: macs2_consensus_boolean
    use: macs2/consensus_boolean
    aggregation: count
    column_name: peak_id
    column_type: object
    secondary_layout: composition
    breakdown_col: num_samples
    top_n_count: 5
    display:
      icon_name: mdi:set-merge
      icon_color: violet
      caption: intervals, by libraries calling them
      link: tab:Consensus
    section: Key figures
    tag: cs-ov-kf-consensus
    index: ov-kf-consensus
    title: Consensus intervals
    description: Merged intervals of the consensus sets in view, one set per antibody. The bar splits them by how many libraries call a peak on each.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # frip_score is per ChIP, so the median is of libraries, not of reads.
  - component_type: card
    workflow_tag: chipseq
    data_collection_tag: macs2_peak_summary
    use: macs2/peak_summary
    aggregation: median
    column_name: frip_score
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.01
    threshold_direction: min
    display:
      icon_name: mdi:target
      icon_color: lime
      caption: median; ENCODE wants at least 1%
      link: tab:MultiQC
      format: percent
    section: Key figures
    tag: cs-ov-kf-frip
    index: ov-kf-frip
    title: FRiP
    description: Median fraction of each ChIP's reads falling inside its called peaks, the ChIP signal-to-noise. The strip counts the ChIPs at or above the ENCODE floor of 1%.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the condition, then the antibody, both on the hub.
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: design
    interactive_component_type: MultiSelect
    column_name: condition
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: Condition
    section: Findings
    tag: cs-ov-findings-condition
    index: ov-findings-condition
    title: Condition
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: design
    interactive_component_type: MultiSelect
    column_name: antibody
    column_type: object
    display:
      icon_name: mdi:molecule
      custom_color: grape
      strip_label: Antibody
    section: Findings
    tag: cs-ov-findings-antibody
    index: ov-findings-antibody
    title: Antibody
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data.
  - component_type: text
    surface: card
    values:
      fold: {dc: macs2_peaks, column: fold_enrichment, aggregation: median, format: 'decimals:1'}
      top: {dc: homer_annotated_peaks, column: annotation_class, aggregation: top}
      top_share: {dc: homer_annotated_peaks, column: annotation_class, aggregation: top_share, format: percent}
      n_cons: {dc: macs2_consensus_boolean, column: peak_id, aggregation: count, format: integer}
      n_repro: {dc: macs2_consensus_boolean, column: peak_id, aggregation: count, filter_expr: col('num_samples') > 1,
        format: integer}
      jsd: {dc: deeptools_fingerprint_metrics, column: synthetic_js_distance, aggregation: max, format: 'decimals:2'}
    body: |
      - **{{fold}}** median fold enrichment of the calls over the input – MACS3 peaks [Peaks](tab:Peaks)
      - **{{top_share}}** of the peaks sit in the {{top}} class – the most common HOMER feature class [Annotation](tab:Annotation)
      - **{{n_repro}}** of {{n_cons}} consensus intervals are called by more than one library – the reproducible set [Consensus](tab:Consensus)
      - **{{jsd}}** is the furthest a library's coverage sits from a uniform one – deepTools fingerprint, near 0 for an input [Signal](tab:Signal)
    section: Findings
    tag: cs-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per analysis tab, in the order of the rows above. The tiles
  # of a row share a stored height.
  - component_type: highlight
    section: Findings
    source_tab: Peaks
    source_component: pk-density
    caption: Peak calls per megabase along the genome, one row per library; brighter is more calls.
    tag: cs-ov-hl-calls
    index: ov-hl-calls
    layout: {x: 0, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Annotation
    source_component: anno-tss-distance
    caption: Each library's peaks by distance to the nearest start site, one curve per library; the band is the promoter window.
    hide_legend: true
    tag: cs-ov-hl-tss
    index: ov-hl-tss
    layout: {x: 4, y: 2, w: 4, h: 4}
  # 2.x has no contrast to test, so the sample space takes the place the volcano
  # held: whether the libraries of one antibody group by condition. Optional
  # (--skip_deseq2_qc): the import drops the highlight with its source, and the
  # fingerprint beside it widens to the row.
  - component_type: highlight
    section: Findings
    source_tab: Consensus
    source_component: cons-pca
    caption: One point per library, placed by the DESeq2 QC on its antibody's consensus counts; colour is the condition.
    tag: cs-ov-hl-pca
    index: ov-hl-pca
    layout: {x: 0, y: 6, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Signal
    source_component: sig-fingerprint
    caption: One point per library, its distance from a uniform coverage against the genome left at background; inputs sit low.
    hide_legend: true
    tag: cs-ov-hl-fingerprint
    index: ov-hl-fingerprint
    layout: {x: 4, y: 6, w: 4, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers. A tab the run does not have is left out.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Signal](tab:Signal)

      ### Peak calls
      - [Peaks](tab:Peaks)
      - [Annotation](tab:Annotation)
      - [Locus](tab:Locus)

      ### Comparison
      - [Consensus](tab:Consensus)
    section: How to read this dashboard
    tag: cs-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the condition first. One per real factor of
  # the hub: the condition, the antibody, the library, the replicate and the
  # role (ChIP or input control).
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: design
    interactive_component_type: MultiSelect
    column_name: condition
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: cs-filter-condition
    index: sample-filters-condition
    title: Condition
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: design
    interactive_component_type: MultiSelect
    column_name: antibody
    column_type: object
    display:
      icon_name: mdi:molecule
      custom_color: grape
    section: Sample filters
    group: Sample scope
    tag: cs-filter-antibody
    index: sample-filters-antibody
    title: Antibody
    layout: {x: 0, y: 2, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: design
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: cs-filter-sample
    index: sample-filters-library
    title: Library
    layout: {x: 0, y: 4, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: design
    interactive_component_type: MultiSelect
    column_name: replicate
    column_type: object
    display:
      icon_name: mdi:content-duplicate
      custom_color: cyan
    section: Sample filters
    group: Sample scope
    tag: cs-filter-replicate
    index: sample-filters-replicate
    title: Replicate
    layout: {x: 0, y: 7, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: design
    interactive_component_type: MultiSelect
    column_name: role
    column_type: object
    display:
      icon_name: mdi:tag-outline
      custom_color: pink
    section: Sample filters
    group: Sample scope
    tag: cs-filter-role
    index: sample-filters-role
    title: Role
    layout: {x: 0, y: 9, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: macs2_peak_summary
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: frip_score
    column_type: float64
    display:
      icon_name: mdi:magnet
      custom_color: yellow
    section: QC thresholds
    group: Library quality
    tag: cs-filter-frip
    index: qc-frip-range
    title: FRiP score
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: chipseq
    data_collection_tag: macs2_peak_summary
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: num_peaks
    column_type: int64
    display:
      icon_name: mdi:counter
      custom_color: indigo
    section: QC thresholds
    group: Library quality
    tag: cs-filter-peakcount
    index: qc-peakcount-range
    title: Peaks called
    layout: {x: 0, y: 3, w: 1, h: 3}
  # Row selection feeds the Analysis panel.
  - component_type: table
    workflow_tag: chipseq
    data_collection_tag: design
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Sample sheet
    tag: cs-sample-sheet
    index: sample-sheet
    title: Sample sheet
    description: >-
      Which libraries does the run hold, and how do they relate? One row per library, ChIP or input control,
      with its antibody, condition, replicate and control.

      How to read: check that every ChIP has its input control and that each condition has its replicates
      before reading a chart, since the peaks are called against the control and the consensus sets need
      the replicates.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: chipseq
    data_collection_tag: macs2_peak_summary
    use: macs2/peak_summary
    row_selection_enabled: true
    row_selection_column: sample
    section: Reference tables
    tag: cs-ref-table-summary
    index: ref-peak-summary
    title: Peak QC summary
    description: >-
      How strong is each ChIP's signal, and how many peaks did it yield? One row per ChIP with its peak
      count, its FRiP score, and the median, mean and maximum of its peak width, fold enrichment and
      significance.

      How to read: FRiP is the fraction of mapped reads that fall inside the called peaks, so a low value
      is a weak signal over background. ENCODE scrutinises experiments below 1%, which is a flag to look
      closer and not an automatic failure, so compare the ChIPs of one antibody with each other. Open
      [MultiQC](tab:MultiQC) for the bar chart of the same score.

      Source: Landt et al. 2012, ChIP-seq guidelines and practices of the ENCODE and modENCODE consortia,
      https://pmc.ncbi.nlm.nih.gov/articles/PMC3431496/
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
# ============================================================================
# Data & QC
# ============================================================================
- title: MultiQC
  subtitle: Did sequencing, alignment and filtering work for every library?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  grid_sections:
  - name: Run summary
    icon: mdi:view-dashboard-outline
    color: orange
    description: Every module's headline numbers, one row per library
  - name: Reads and alignment
    icon: mdi:chart-bar
    color: orange
    description: Reads sequenced per library, and the share that mapped
  - name: Enrichment
    icon: mdi:chart-line
    color: orange
    description: How concentrated the reads are, how much falls in peaks, and the strand shift scores
  - name: QC details
    icon: mdi:file-document-outline
    color: gray
    description: Read quality, trimming, duplication, read assignment and strand shift curves
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [MultiQC](https://multiqc.info) gathers what every tool of the run reported: FastQC
      and Trim Galore on the reads, samtools and Picard on the alignments, deepTools,
      phantompeakqualtools and MACS3 on the signal. Read whether each library yielded
      enough reads, how many mapped, and how well each ChIP separates from its input.
    tag: cs-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: Run summary
    tag: cs-mqc-general-stats
    title: General statistics
    description: >-
      Which libraries stand out across every tool of the run? One row per library, one column per headline
      number the MultiQC modules report, with each cell shaded within its column.

      How to read: scan a column for the library far from its peers, then open the module section below
      for the plot behind that number. The shading is relative to the libraries shown, so it flags a
      difference between libraries and not a pass or a fail.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Counts
    section: Reads and alignment
    tag: cs-mqc-fastqc-counts
    title: Sequence counts
    description: >-
      How many reads did each library start with? One bar per FastQC run, split into the reads FastQC
      counts as unique and those it counts as duplicates, in read counts or in percent.

      How to read: look for libraries far below their peers in depth, and for a large duplicate share.
      ChIP-seq libraries often duplicate more than others because enrichment concentrates reads on few
      sites, so judge the share again on the Mark Duplicates plot after alignment.

      Source: FastQC help, Duplicate Sequences,
      https://www.bioinformatics.babraham.ac.uk/projects/fastqc/Help/3%20Analysis%20Modules/8%20Duplicate%20Sequences.html

      Note: FastQC tracks only the sequences that first appear in the first 100,000 reads of a file, so the
      split is an estimate.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    # MERGED LIB: SAMTools (unfiltered) in the report the pipeline writes, whose
    # samples carry the hub's names. `samtools` there is per sequencing library,
    # and `samtools-2` reads the filtered BAM, 100% mapped by construction.
    selected_module: samtools-1
    selected_plot: Percent mapped
    section: Reads and alignment
    tag: cs-mqc-samtools-mapped
    title: Reads mapped
    description: >-
      What share of each library's reads aligned? One bar per library from samtools stats on the
      alignments before filtering, split into reads mapped with a mapping quality above 0 (MQ>0), reads
      mapped with mapping quality 0 (MQ0) and unmapped reads, in counts or in percent.

      How to read: a bar that is mostly MQ>0 is a library that aligned well. A large unmapped share points
      at contamination, adapters or low base quality, and a large MQ0 share at reads that fit several
      places, as in repeats. Compare the libraries of one antibody, then open the FastQC and Cutadapt plots
      under QC details.
    layout: {x: 4, y: 0, w: 4, h: 4}
  # Route alternates, one slot: the pipeline's own multiqc_config files the
  # merged-library deepTools panels under `mlib_deeptools`, a report regenerated
  # without it under `deepTools`. A report holds one of the two ids, and the
  # import drops the tile whose module is absent.
  - component_type: multiqc
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    use: multiqc/deeptools
    selected_module: mlib_deeptools
    selected_plot: Fingerprint plot
    section: Enrichment
    tag: cs-mqc-fingerprint
    title: deepTools fingerprint
    description: >-
      Which libraries gather their reads in few places, as an enriched ChIP does? Each curve is one
      library: the genome's bins are ranked from the lowest to the highest coverage along x, and y is the
      cumulative share of the reads they hold.

      How to read: a curve that hugs 0 for most of the ranks and then rises steeply at the right has its
      reads piled into few bins, as an enriched ChIP does. A curve close to the diagonal has its reads
      spread evenly, as an input control or a failed enrichment does. Narrow and broad marks give
      different shapes, so compare a ChIP with its own input and open [Signal](tab:Signal) for the
      per-library numbers.

      Source: nf-core/chipseq output documentation, https://nf-co.re/chipseq/2.1.0/docs/output

      Note: no reference line is drawn, and the dashboard sets no cut-off on this curve.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    use: multiqc/deeptools
    selected_module: deepTools
    selected_plot: Fingerprint plot
    section: Enrichment
    tag: cs-mqc-fingerprint-reprocessed
    title: deepTools fingerprint
    description: >-
      Which libraries gather their reads in few places, as an enriched ChIP does? Each curve is one
      library: the genome's bins are ranked from the lowest to the highest coverage along x, and y is the
      cumulative share of the reads they hold.

      How to read: a curve that hugs 0 for most of the ranks and then rises steeply at the right has its
      reads piled into few bins, as an enriched ChIP does. A curve close to the diagonal has its reads
      spread evenly, as an input control or a failed enrichment does. Narrow and broad marks give
      different shapes, so compare a ChIP with its own input and open [Signal](tab:Signal) for the
      per-library numbers.

      Source: nf-core/chipseq output documentation, https://nf-co.re/chipseq/2.1.0/docs/output

      Note: no reference line is drawn, and the dashboard sets no cut-off on this curve.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    use: multiqc/frip_score
    selected_module: frip_score
    selected_plot: frip_score-section
    section: Enrichment
    tag: cs-mqc-frip
    title: FRiP score
    description: >-
      How much of each ChIP's signal falls inside its peaks? One bar per library: the FRiP score, the
      fraction of mapped reads that overlap a MACS3 peak by at least 20%, on an axis from 0 to 1.

      How to read: a taller bar is a stronger signal over background. ENCODE scrutinises experiments
      below 1%, which is a flag to look closer and not an automatic failure, since a factor with few
      binding sites can score low. Compare the ChIPs of one antibody and open [Peaks](tab:Peaks) for the
      calls behind the score.

      Sources: Landt et al. 2012, https://pmc.ncbi.nlm.nih.gov/articles/PMC3431496/; nf-core/chipseq FRiP
      header, https://raw.githubusercontent.com/nf-core/chipseq/2.1.0/assets/multiqc/frip_score_header.txt
    layout: {x: 4, y: 0, w: 4, h: 4}
  # The two phantompeakqualtools scores: NSC and RSC read the strand shift
  # curve (in QC details) as one number per ChIP.
  - component_type: multiqc
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    use: multiqc/nsc_coefficient
    selected_module: nsc_coefficient
    selected_plot: nsc_coefficient-section
    section: Enrichment
    tag: cs-mqc-nsc
    title: Normalised strand coefficient
    description: >-
      Does each ChIP stand out from background in the strand cross-correlation? One bar per ChIP: the
      normalised strand coefficient (NSC) from phantompeakqualtools, the ratio of the fragment-length
      cross-correlation peak to the background cross-correlation. The axis starts at 1, the lowest possible
      value.

      How to read: a taller bar is more enrichment over background. phantompeakqualtools calls 1.1 the
      critical threshold and reads values below 1.05 as low signal-to-noise or few peaks, which can be
      biological or technical. ENCODE repeats replicates below 1.05, so open the strand shift curve under
      QC details for a library under it.

      Sources: phantompeakqualtools README, https://github.com/kundajelab/phantompeakqualtools; Landt et al.
      2012, https://pmc.ncbi.nlm.nih.gov/articles/PMC3431496/
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    use: multiqc/rsc_coefficient
    selected_module: rsc_coefficient
    selected_plot: rsc_coefficient-section
    section: Enrichment
    tag: cs-mqc-rsc
    title: Relative strand coefficient
    description: >-
      Does the fragment-length peak stand above the phantom peak? One bar per ChIP: the relative strand
      coefficient (RSC) from phantompeakqualtools, the ratio of the fragment-length cross-correlation peak
      to the read-length (phantom) peak. The axis starts at 0.

      How to read: a taller bar is a clearer IP. phantompeakqualtools calls 1 the critical threshold and
      reads values below 0.8 as low signal-to-noise, and ENCODE repeats replicates below 0.8. A factor with
      few binding sites can score low without a technical failure, so check the strand shift curve before
      discarding a library.

      Sources: phantompeakqualtools README, https://github.com/kundajelab/phantompeakqualtools; Landt et al.
      2012, https://pmc.ncbi.nlm.nih.gov/articles/PMC3431496/
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    section: QC details
    tag: cs-mqc-fastqc-quality
    title: Per-base sequence quality
    description: >-
      Does base quality hold along the read? Each line is one FastQC run: the mean Phred score (y) at each
      base position (x), over a background split into three bands.

      How to read: a line in the green band is made of very good calls. A drop into the amber band towards
      the end of the read is common as quality degrades along a run, and a line in the red band flags poor
      calls to trim or to look into. A line that sits apart from its peers is the library to open first.

      Lines and annotations: the background bands are MultiQC's, green from Phred 28 up, amber from 20 to
      28 and red below 20. A line takes FastQC's status colour for the section: green for pass, amber for
      warn, red for fail. FastQC warns when, at any position, the lower quartile is below 10 or the median
      below 25, and fails when they are below 5 and 20.

      Sources: FastQC help, Per Base Sequence Quality,
      https://www.bioinformatics.babraham.ac.uk/projects/fastqc/Help/3%20Analysis%20Modules/2%20Per%20Base%20Sequence%20Quality.html;
      MultiQC fastqc module,
      https://raw.githubusercontent.com/MultiQC/MultiQC/v1.23/multiqc/modules/fastqc/fastqc.py

      Note: the plot draws the mean only, while FastQC judges the lower quartile and the median, so a
      line can be coloured warn or fail without crossing a band.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    use: multiqc/cutadapt
    selected_module: cutadapt
    selected_plot: Filtered Reads
    section: QC details
    tag: cs-mqc-cutadapt
    title: Reads kept after trimming
    description: >-
      How many reads did trimming keep? One bar per library: the reads (single-end) or pairs (paired-end)
      Cutadapt kept, and those it removed as too short, too long, with too many N or for another reason,
      in counts or in percent.

      How to read: a bar that is almost all passing reads lost little to trimming. A visible removed share,
      mostly too short, points at heavy adapter read-through or low-quality tails. A library that loses
      far more than its peers is worth a look at its FastQC adapter content before the alignment.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    use: multiqc/picard
    selected_module: picard
    selected_plot: Mark Duplicates
    section: QC details
    tag: cs-mqc-picard-dups
    title: Duplicate reads
    description: >-
      How many reads are duplicates? One bar per library: Picard MarkDuplicates counts reads by duplication
      state, such as unique pairs, duplicate pairs (optical and non-optical), unpaired reads and unmapped
      reads, with pair counts doubled so the states sum to the reads. Counts or percent.

      How to read: a mostly unique bar is a complex library. A large duplicate share is a library
      sequenced past its complexity or made from little material, which costs usable reads once the
      duplicates are removed. Open [Signal](tab:Signal) for the duplicate share beside the other signal
      numbers.

      Source: nf-core/chipseq parameters, keep_dups, https://nf-co.re/chipseq/2.1.0/parameters

      Note: the pipeline removes duplicates from the alignments unless the run sets keep_dups, and
      ChIP-seq libraries duplicate more than whole-genome ones because enrichment concentrates reads.
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    use: multiqc/featurecounts
    selected_module: featurecounts
    selected_plot: Assignments
    section: QC details
    tag: cs-mqc-featurecounts
    title: Reads assigned to consensus peaks
    description: >-
      How many reads land in the consensus intervals? One bar per library: the reads featureCounts
      assigned to a consensus interval and those it left unassigned, split by the reason (no feature,
      ambiguity, multi-mapping and others), in counts or in percent.

      How to read: the assigned share is the part of a library's reads that falls in the regions its
      antibody's replicates merged. A library with a much smaller assigned share than its replicates puts
      fewer of its reads in the shared regions, so compare it with them and with its FRiP score.

      Source: nf-core/chipseq output documentation, https://nf-co.re/chipseq/2.1.0/docs/output
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: chipseq
    data_collection_tag: multiqc_data
    use: multiqc/strand_shift_correlation
    selected_module: strand_shift_correlation
    selected_plot: strand_shift_correlation-section
    section: QC details
    tag: cs-mqc-strandshift
    title: Strand shift correlation
    description: >-
      Where does the cross-correlation of forward and reverse reads peak? Each line is one ChIP: the
      cross-correlation between the reads of the two strands (y) as one strand is shifted against the other
      by x base pairs.

      How to read: a successful IP shows a peak at the average fragment length that stands well above a
      smaller one at the read length, the phantom peak. A failed experiment shows a small or absent
      fragment-length peak, with the phantom peak dominating. The NSC and RSC bars summarise the heights of
      these peaks.

      Source: nf-core/chipseq output documentation, https://nf-co.re/chipseq/2.1.0/docs/output
    layout: {x: 0, y: 8, w: 8, h: 4}
- title: Signal
