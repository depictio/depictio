# The locus section: three collections on one genomic region. The navigator
# (macs2/peak_genome_view on macs2_peaks) opens on its default_region and emits
# the chromosome and position filters; the two region links in template.yaml
# rename them onto the consensus intervals and the HOMER annotation, so the
# consensus lanes and the cards clamp to the same window. A tab of its own: a
# region filter narrows every tile of its collection on the tab. The axis comes
# from GENOME, empty by default, which lays it out from the contigs of the calls
# (2.x runs on any reference).
