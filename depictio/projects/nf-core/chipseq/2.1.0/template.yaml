# nf-core/chipseq Template v2.1.0 - Transcription-factor / histone ChIP-seq
# ============================================================================
# This is a TEMPLATE project configuration. Use with:
#   depictio ingest --template nf-core/chipseq/2.1.0 --data-root /path/to/your/data
#
# DATA_ROOT is the pipeline's own --outdir. Validated against nf-core/chipseq
# 2.1.0 runs made on the EMBL HPC (scripts/nfcore_validation_hpc.py, keys
# chipseq2-*): the `test` profile with --narrow_peak under all four aligners
# (bwa, bowtie2, chromap, star). The broadPeak megatest (`test_full`) was not
# run locally; see megatest.yaml and VALIDATION_REPORT.md.
# ============================================================================
#
# SCOPE
# Any aligner, either peak type. 2.x publishes everything below
# `<aligner>/merged_library/`, and MACS3 writes its calls under
# `macs3/narrow_peak/` (`--narrow_peak`) or `macs3/broad_peak/` (the pipeline
# default). Every scan and recipe glob matches on file NAME, never on the
# aligner or the peak-type directory, so all routes land in the same
# collections. The one place the two peak types differ in schema (narrowPeak
# has a summit column, broadPeak does not) is absorbed by the template-local
# `recipes/peaks.py`, which reads whichever of the two the run wrote.
#
# MULTIQC
# The 2.1.0 release pins MultiQC 1.23, which writes no parquet. Depictio reads
# only `multiqc.parquet` (MultiQC >= 1.31), so the MultiQC collection accepts
# the parquet in either of two places, and a tree only ever holds one of them:
#   * `multiqc/<narrow_peak|broad_peak>/multiqc_data/multiqc.parquet`, where the
#     pipeline publishes it when the run is forced to a parquet-era MultiQC
#     (the Nextflow completion trigger runs 1.35 over the pipeline's --outdir);
#   * `multiqc/multiqc_data/multiqc.parquet`, where
#       python -m depictio.dev_scripts.multiqc_reprocess --src DATA_ROOT --dest DATA_ROOT
#     writes a report regenerated with MultiQC 1.35 over a 1.23 run's raw tool
#     outputs, next to a `REPROCESSED.json` recording both versions.
# `modules` / `plots` below name the module ids of the report the pipeline writes
# itself under MultiQC 1.35; the regenerated report uses fewer ids (see the
# comment on the collection).
#
# PROVENANCE. 2.x writes `pipeline_info/params_<timestamp>.json` and a YAML
# `pipeline_info/nf_core_chipseq_software_mqc_versions.yml`; both are collected.
#
# DESIGN IS A VARIABLE, as in 1.2.0.
# There is no design_reads.csv / design_controls.csv any more. The pipeline
# validates the samplesheet into `pipeline_info/samplesheet.valid.csv`, one row
# per sequencing library, ChIPs and input controls alike. The 2.1.0 override of
# `nf-core/chipseq/design_factors.py` collapses it to one row per merged library
# (`<sample>_REP<n>`, the id every downstream file uses) with the 1.2.0 hub
# columns. The factor the run tests comes from an optional design table declared
# through METADATA_FILE (sample id in METADATA_ID_COL, every other column a
# factor): `condition` of the hub is its GROUP_COL column, else the sample
# group.
#
# DESEQ2. 2.0.0 removed the differential binding analysis: `consensus/<antibody>/
# deseq2/` holds only the QC on the consensus peak counts (PCA and sample
# distances), read by the shared 1.x readers (the PCA through a 2.1.0 override
# that adds each library's condition).
#
# OPTIONAL COLLECTIONS. preseq is skipped by default in 2.x (`--skip_preseq`),
# and the DESeq2 QC is skipped with `--skip_deseq2_qc`; their collections are
# `optional: true`, so a run without them ingests everything else. The Picard
# MarkDuplicates metrics stand in for preseq on the Signal tab: a run made with
# `--skip_preseq false` passes `--var PRESEQ_RAN=true`, which removes them so
# the preseq card takes the slot alone.
template:
  template_id: "nf-core/chipseq/2.1.0"
  description: "nf-core/chipseq 2.x template: MACS3 peak calls (narrowPeak or broadPeak), HOMER peak annotation, consensus peak sets per antibody and their DESeq2 sample QC, for any aligner, on top of the MultiQC report."
  version: "2.0.0"
  variables:
    - name: "DATA_ROOT"
      description: "The chipseq --outdir (one directory per aligner, fastqc/, trimgalore/, multiqc/, pipeline_info/), with the MultiQC parquet under multiqc/narrow_peak/multiqc_data/ or multiqc/broad_peak/multiqc_data/, or multiqc/multiqc_data/ for a reprocessed run."
      required: true
    - name: "METADATA_FILE"
      description: "Optional design table (TSV): merged-library id (or sample group) in METADATA_ID_COL, one column per factor. GROUP_COL becomes the condition column of the design hub; the other factors are carried as extra columns."
      required: false
    - name: "METADATA_ID_COL"
      description: "Design table id column. Auto-detected as the first column."
      required: false
    - name: "GROUP_COL"
      description: "Design table factor the run compares, carried as the condition column. Auto-detected as the first factor column of METADATA_FILE."
      required: false
    - name: "GROUP_COL_DISPLAY"
      description: "Auto-populated: title-cased GROUP_COL for titles."
      required: false
    - name: "ANNOTATION_COLS"
      description: "Auto-populated: comma-separated factor columns of METADATA_FILE."
      required: false
    # Empty by default: 2.x runs on any iGenomes or custom reference, and an
    # empty assembly lays the Locus axis out from the contigs the calls carry.
    - name: "GENOME"
      description: "UCSC assembly the run was aligned to (hg38, hg19, mm10, ...). Sets the genome axis of the Locus tab from that assembly; left empty, the axis is built from the contigs of the peak calls, which suits any reference."
      required: false
      default: ""
    # Route flag. The CLI sets no variable from chipseq's params.json, so a run
    # made with --skip_preseq false passes it explicitly.
    - name: "PRESEQ_RAN"
      description: "Set to true for a run made with --skip_preseq false. The Signal tab then counts distinct fragments with preseq instead of reading the Picard duplication rate in the same slot."
      required: false
  # The bundled reference dataset needs no variable beyond DATA_ROOT: the
  # samplesheet is part of the run's own pipeline_info/ output, no design table
  # is vendored (the condition is the sample group) and the test reference is
  # not a UCSC assembly, so GENOME keeps its empty default.
  reference:
    vars: {}
  # How this run's provenance is collected at ingest, surfaced in the ingestion
  # report and the dashboard Settings drawer. Keys matched by no group rule land
  # in 'Other'.
  provenance:
    sources:
      - name: "params"
        glob: "pipeline_info/params*.json"
        format: "json"
        pick: "latest"
        exclude_keys:
          - "hook_url"   # nf-core runs put a live Slack webhook here
          - "email*"     # submitter address
      - name: "software_versions"
        glob: "pipeline_info/*software*versions.yml"
        format: "yaml"
        pick: "latest"
        group: "Software versions"
    groups:
      - group: "Alignment & filtering"
        key_patterns: ["aligner", "keep_dups", "keep_multi_map", "bwa_min_score", "blacklist", "save_align_intermeds", "save_unaligned", "seq_center", "read_length", "fragment_size"]
      - group: "Peak calling & consensus"
        key_patterns: ["narrow_peak", "broad_cutoff", "macs_*", "min_reps_consensus", "save_macs_pileup", "with_control"]
      - group: "Read trimming"
        key_patterns: ["clip_r1", "clip_r2", "three_prime_clip_r1", "three_prime_clip_r2", "trim_nextseq", "save_trimmed", "min_trimmed_reads"]
      - group: "References"
        key_patterns: ["genome", "fasta", "gtf", "gff", "gene_bed", "tss_bed", "*_index", "igenomes_*", "save_reference"]
      - group: "Run context"
        key_patterns: ["input", "outdir", "multiqc_*", "max_multiqc_email_size", "config_profile_*", "custom_config_*", "publish_dir_mode", "validate_params", "monochrome_logs", "plaintext_email", "version", "help*", "show_hidden*", "schema_ignore_params", "validation*"]
      - group: "Skipped steps"
        key_patterns: ["skip_*"]
    highlight:
      - "aligner"
      - "narrow_peak"
      - "macs_gsize"
      - "min_reps_consensus"
      - "keep_dups"
      - "keep_multi_map"
  dashboards:
    - "dashboards/base.yaml"
  conditional:
    # No design table: the hub falls back to the sample group, so only the
    # table's own collection goes.
    - if_var_absent: "METADATA_FILE"
      remove_dc_tags: ["metadata"]
      dashboards: ["dashboards/base.yaml"]
    - if_var_present: "METADATA_FILE"
      dashboards: ["dashboards/base.yaml"]
    # preseq ran: its card takes the Signal slot the duplication card holds on a
    # default run, so the two never share it.
    - if_var_present: "PRESEQ_RAN"
      remove_dc_tags: ["picard_markduplicates_metrics_raw", "picard_markduplicates_metrics"]
      dashboards: ["dashboards/base.yaml"]

# ============================================================================
# PROJECT CONFIGURATION
# ============================================================================

name: "ChIP-seq Peak Analysis"
project_type: "advanced"
is_public: true
workflows:
  - name: "chipseq"
    version: "2.1.0"
    engine:
      name: "nextflow"
      version: "24.04.2"
    catalog:
      name: "nf-core"
      url: "https://nf-co.re"
    repository_url: "https://github.com/nf-core/chipseq"
    data_location:
      structure: "flat"
      locations:
        - "{DATA_ROOT}"
    data_collections:
      # ----------------------------------------------------------------
      # Design table (optional): the run's factors, keyed on the merged-library
      # id or the sample group. Pruned when METADATA_FILE is absent. The hub
      # below joins it, so every design filter reads the hub.
      # ----------------------------------------------------------------
      - data_collection_tag: "metadata"
        optional: true
        description: "Sample design table (optional, --var METADATA_FILE=...): one row per merged library or sample group, one column per factor"
        config:
          type: "Table"
          metatype: "Metadata"
          scan:
            mode: "single"
            scan_parameters:
              filename: "{METADATA_FILE}"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
              infer_schema_length: 0
            columns_description:
              "sample": "Merged-library id (or sample group) as the pipeline names it. Every other column is a design factor and is passed through."

      # ----------------------------------------------------------------
      # Hub: every merged library of the run, ChIPs and input controls, with
      # its experimental factors as columns. Built from the validated
      # samplesheet by the 2.1.0 override of the shared hub recipe, so the
      # columns are the 1.2.0 ones.
      # ----------------------------------------------------------------
      - data_collection_tag: "design"
        description: "Per-library hub: the ChIPs and their input controls, with the antibody, the replicate, and the condition from the design table"
        config:
          type: "Table"
          metatype: "Metadata"
          source: "transformed"
          transform:
            recipe: "nf-core/chipseq/design_factors.py"
            params:
              group_col: "{GROUP_COL}"
              id_col: "{METADATA_ID_COL}"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample_id": "Merged library, named SAMPLE_REPn, the key every other collection is linked on"
              "role": "ChIP or input control"
              "is_control": "True for the input control libraries"
              "antibody": "Antibody the ChIP was raised against, or of the ChIPs an input control serves; the consensus peak sets are built per antibody"
              "condition": "GROUP_COL of the design table (METADATA_FILE), else the sample name without its replicate suffix"
              "replicate": "Biological replicate, as the pipeline tags the library id (REP1, REP2)"
              "control_id": "Input control this ChIP was called against; empty on a control row"

      - data_collection_tag: "samplesheet"
        description: "The samplesheet as the pipeline validated it: one row per sequencing library, ChIP and input alike, with its FASTQ files"
        config:
          type: "Table"
          metatype: "Metadata"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: "samplesheet\\.valid\\.csv$"
          dc_specific_properties:
            format: "CSV"
            columns_description:
              "sample": "Library identifier, named SAMPLE_REPn_Tm, where m is the technical replicate"
              "single_end": "1 for single-end, 0 for paired-end"
              "fastq_1": "Read 1 FASTQ"
              "fastq_2": "Read 2 FASTQ, empty for single-end libraries"
              "replicate": "Biological replicate number"
              "antibody": "Antibody of a ChIP library, empty for an input control"
              "control": "Input control of a ChIP library, named CONTROL_REPn, empty for an input"

      # ----------------------------------------------------------------
      # MultiQC. One pattern, two accepted locations (see the MULTIQC note
      # above): the pipeline's own `multiqc/<peak_type>/` when the run wrote a
      # parquet, the reprocess tool's `multiqc/multiqc_data/` otherwise. The
      # pattern is matched against the path relative to DATA_ROOT.
      # ----------------------------------------------------------------
      - data_collection_tag: "multiqc_data"
        description: "MultiQC report of the run: the pipeline's own parquet when it ran a parquet-era MultiQC, otherwise the report regenerated with MultiQC 1.35 from the run's raw tool outputs (2.1.0 pins MultiQC 1.23, which ships no parquet)"
        config:
          type: "MultiQC"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                # The family's layout-agnostic form (1.2.0 lint F7): the run's
                # multiqc/<peak type>/multiqc_data/ and the reprocessed
                # multiqc/multiqc_data/ both match, no prefix is anchored.
                pattern: "(?:.*/)?multiqc(?:/[^/]+)?/multiqc_data/multiqc\\.parquet$"
          dc_specific_properties:
            s3_location: null
            # Module ids and plot names of the report nf-core/chipseq 2.1.0 writes
            # itself, with its own multiqc_config, under MultiQC 1.35: the report the
            # Nextflow trigger ingests (checked on the chipseq2-test run). That
            # config runs some tools more than once under distinct ids:
            #   fastqc: raw reads; fastqc-1: trimmed reads
            #   samtools: per library; samtools-1: merged library, unfiltered;
            #   samtools-2: merged library, filtered
            #   picard: MarkDuplicates (merged, unfiltered); picard-1:
            #   CollectMultipleMetrics (merged, filtered)
            #   mlib_deeptools: merged-library deepTools
            # A report regenerated by multiqc_reprocess without that config merges
            # each tool under one id (fastqc, samtools, picard, deepTools). The
            # samtools-1 tile stays empty on it; the fingerprint tile has a twin
            # bound to deepTools in the same slot, so whichever id the report
            # carries draws.
            # Not declared because a default run does not write them: star
            # (--aligner star), preseq (--skip_preseq false), and deseq2_pca_N /
            # deseq2_clustering_N beyond the first antibody.
            modules:
              - "general_stats"
              - "fastqc"
              - "fastqc-1"
              - "cutadapt"
              - "samtools"
              - "samtools-1"
              - "samtools-2"
              - "picard"
              - "picard-1"
              - "phantompeakqualtools"
              - "mlib_deeptools"
              - "deepTools"
              - "featurecounts"
              - "peak_count"
              - "frip_score"
              - "peak_annotation"
              - "strand_shift_correlation"
              - "nsc_coefficient"
              - "rsc_coefficient"
              - "deseq2_pca_1"
              - "deseq2_clustering_1"
              - "nf-core-chipseq-summary"
            plots:
              fastqc:
                - "Sequence Counts"
                - "Sequence Quality Histograms"
                - "Per Sequence Quality Scores"
                - "Per Sequence GC Content":
                    - "Percentages"
                    - "Counts"
                - "Per Base N Content"
                - "Sequence Duplication Levels"
                - "Top overrepresented sequences"
                - "Adapter Content"
                - "Status Checks"
              fastqc-1:
                - "Sequence Counts"
                - "Sequence Quality Histograms"
                - "Per Sequence Quality Scores"
                - "Per Sequence GC Content":
                    - "Percentages"
                    - "Counts"
                - "Per Base N Content"
                - "Sequence Length Distribution"
                - "Sequence Duplication Levels"
                - "Status Checks"
              cutadapt:
                - "Filtered Reads"
                - "Trimmed Sequence Lengths (3')":
                    - "Counts"
                    - "Obs/Exp"
              samtools:
                - "Percent mapped"
                - "Insert size distribution"
                - "Alignment stats"
                - "Flagstat"
                - "Flagstat: Percentage of total"
                - "Mapped reads per contig":
                    - "Normalised Counts"
                    - "Observed over Expected Counts"
                    - "Raw Counts"
              samtools-1:
                - "Percent mapped"
                - "Insert size distribution"
                - "Alignment stats"
                - "Flagstat"
                - "Flagstat: Percentage of total"
                - "Mapped reads per contig":
                    - "Normalised Counts"
                    - "Observed over Expected Counts"
                    - "Raw Counts"
              samtools-2:
                - "Percent mapped"
                - "Insert size distribution"
                - "Alignment stats"
                - "Flagstat"
                - "Flagstat: Percentage of total"
                - "Mapped reads per contig":
                    - "Normalised Counts"
                    - "Observed over Expected Counts"
                    - "Raw Counts"
              picard:
                - "Mark Duplicates"
              picard-1:
                - "Alignment Summary":
                    - "Aligned Reads"
                    - "Aligned Bases"
                - "Mean read length"
                - "Base Distribution":
                    - "% Adenine"
                    - "% Cytosine"
                    - "% Guanine"
                    - "% Thymine"
                    - "% Undetermined"
                - "Insert Size":
                    - "Counts"
                    - "Percentages"
                - "Mean Base Quality by Cycle"
                - "Base Quality Distribution"
              mlib_deeptools:
                - "Fingerprint plot"
                - "Read Distribution Profile after Annotation"
              deepTools:
                - "Fingerprint plot"
                - "Fingerprint quality metrics"
                - "Read Distribution Profile after Annotation"
              featurecounts:
                - "Assignments"
              peak_count:
                - "peak_count-section"
              frip_score:
                - "frip_score-section"
              peak_annotation:
                - "peak_annotation-section"
              nsc_coefficient:
                - "nsc_coefficient-section"
              rsc_coefficient:
                - "rsc_coefficient-section"
              strand_shift_correlation:
                - "strand_shift_correlation-section"
              deseq2_pca_1:
                - "deseq2_pca_1-section"
              deseq2_clustering_1:
                - "deseq2_clustering_1-section"
      # ----------------------------------------------------------------
      # Signal-level QC the MultiQC report cannot show as data (tools
      # `preseq` and `deeptools`). The raw preseq collection exists so the
      # tidy one can read it through `dc_ref`: the sample id lives only in the
      # FILE NAME, and only a scan carries the path (`include_file_paths`) into
      # the frame. Both preseq collections are optional: 2.x skips preseq
      # unless the run passes `--skip_preseq false`. 2.x runs the nf-core
      # preseq/lcextrap module, which writes `<sample>.mLb.mkD.lc_extrap.txt`
      # (1.x wrote `.ccurve.txt`). Not validated on 2.x data.
      # ----------------------------------------------------------------
      - data_collection_tag: "preseq_ccurve_raw"
        description: "Raw per-sample preseq lc_extrap complexity curves (input of preseq_complexity_curve); only written when the run did not skip preseq"
        optional: true
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: ".*\\.lc_extrap\\.txt$"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\t"
              null_values: ["NA", "NaN", ""]
              include_file_paths: "source_path"
              infer_schema_length: 0
            columns_description:
              "TOTAL_READS": "Sequencing depth the row extrapolates to"
              "EXPECTED_DISTINCT": "Unique molecules expected at that depth"
              "LOWER_0.95CI": "Lower bound of the 95% interval on that extrapolation"
              "UPPER_0.95CI": "Upper bound of the 95% interval"
              "source_path": "File the row came from; the sample id is derived from it"

      - data_collection_tag: "preseq_complexity_curve"
        description: "Library complexity curve of every sample with its 95% confidence ribbon, clipped to a billion reads and thinned for plotting"
        optional: true
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "preseq/complexity_curve.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Library preseq ran on"
              "total_reads": "Sequencing depth the row extrapolates to"
              "expected_distinct": "Unique molecules expected at that depth"
              "lower_ci": "Lower bound of the 95% interval"
              "upper_ci": "Upper bound of the 95% interval"
              "ci_width": "upper_ci - lower_ci, how wide the extrapolation is"

      - data_collection_tag: "deeptools_fingerprint_metrics"
        description: "Per-library plotFingerprint quality metrics: how concentrated each library's coverage is against a uniform library of the same depth. 2.x writes no metric against the input control (no JSD or CHANCE columns), and the inputs are rows of their own"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "deeptools/fingerprint_metrics.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Library plotFingerprint ran on"
              "auc": "Area under the observed cumulative-coverage curve"
              "synthetic_auc": "Same area for a perfectly uniform library of that depth"
              "auc_ratio": "auc / synthetic_auc; 1.0 means coverage indistinguishable from uniform"
              "x_intercept": "Share of genome bins with no reads at all"
              "synthetic_x_intercept": "Same, for the uniform library"
              "elbow_point": "Where the observed coverage curve turns"
              "synthetic_elbow_point": "Same, for the uniform library"
              "synthetic_js_distance": "Jensen-Shannon distance to the uniform library"
              "js_distance": "Jensen-Shannon distance to the input control (not written by 2.x)"
              "percent_genome_enriched": "Share of the genome called enriched against the control (not written by 2.x)"
              "diff_enrichment": "Differential enrichment over the control (not written by 2.x)"
              "chance_divergence": "CHANCE divergence from the control (not written by 2.x)"

      - data_collection_tag: "deeptools_plot_profile"
        description: "Mean signal of every library across the plotted metagene window, one row per sample and bin"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "deeptools/plot_profile.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Library plotProfile ran on"
              "group": "Region group deepTools plotted (nf-core plots one, `genes`)"
              "bin": "1-based bin index along the plotted window; 1 to 300 is the upstream flank, 300 to 400 the scaled gene body, 400 to 700 the downstream flank"
              "bin_label": "deepTools' own anchor label at that bin (-3.0Kb, TSS, TES, 3.0Kb), empty in between"
              "signal": "Mean signal in that bin"

      # ----------------------------------------------------------------
      # Duplication, every route: Picard MarkDuplicates runs on every merged
      # library, ChIPs and inputs. It stands in for the preseq card on a
      # default run and is removed when PRESEQ_RAN is set. The raw collection
      # reads each report one LINE per row (a separator the report cannot
      # contain) with its path, because the library id lives only in the file
      # name; only the MarkDuplicates reports are scanned, not the
      # CollectMultipleMetrics files beside them.
      # ----------------------------------------------------------------
      - data_collection_tag: "picard_markduplicates_metrics_raw"
        description: "Raw Picard MarkDuplicates metrics reports, one line per row (input of picard_markduplicates_metrics)"
        config:
          type: "Table"
          metatype: "Aggregate"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: ".*\\.MarkDuplicates\\.metrics\\.txt$"
          dc_specific_properties:
            format: "TSV"
            polars_kwargs:
              separator: "\x1f"
              has_header: false
              new_columns: ["raw"]
              include_file_paths: "source_path"
              infer_schema_length: 0
            columns_description:
              "raw": "One line of the MarkDuplicates report"
              "source_path": "File the line came from; the library id is derived from its name"

      - data_collection_tag: "picard_markduplicates_metrics"
        description: "Reads examined, duplicates flagged and the resulting duplication rate, per merged library"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "picard/markduplicates_metrics.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Merged library MarkDuplicates ran on"
              "library": "Picard's own LIBRARY field, as written (the read group's)"
              "unpaired_reads_examined": "Single-end reads considered"
              "read_pairs_examined": "Read pairs considered"
              "unmapped_reads": "Reads MarkDuplicates could not place"
              "unpaired_read_duplicates": "Single-end duplicates flagged"
              "read_pair_duplicates": "Paired duplicates flagged"
              "read_pair_optical_duplicates": "Of those, the optical duplicates"
              "duplicate_reads": "unpaired plus twice the paired duplicates"
              "reads_after_dedup": "Examined reads left once duplicates are removed"
              "percent_duplication": "Picard's own PERCENT_DUPLICATION, 0 to 1"
              "estimated_library_size": "Picard's library-size estimate (null when it reports none)"

      # ----------------------------------------------------------------
      # Peak calls (MACS3) and their annotation (HOMER). The collection tags
      # keep the `macs2_` prefix of the catalog tool whose readers they use:
      # MACS3 writes the same file formats.
      # ----------------------------------------------------------------
      - data_collection_tag: "macs2_peaks"
        description: "Every MACS3 peak of every sample, narrowPeak or broadPeak (whichever the run called), with summit, width and the enrichment and significance MACS3 reported"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            # Template-local: reads either peak type through the catalog's
            # macs2/peaks.py and macs2/broad_peaks.py transforms.
            recipe: "nf-core/chipseq/peaks.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Sample the peak was called in, read off the MACS3 peak name"
              "peak_id": "MACS3 peak name, unique across samples"
              "chr": "Chromosome"
              "start": "Peak start (0-based)"
              "end": "Peak end"
              "width": "Peak width in bp"
              "summit": "Genomic position of the summit; the region centre for a broadPeak call, which has no summit"
              "score": "MACS3 integer score"
              "fold_enrichment": "Fold enrichment over the input control (at the summit for narrow peaks)"
              "neg_log10_pvalue": "-log10 of the peak p-value"
              "neg_log10_qvalue": "-log10 of the peak q-value (FDR)"
              "peak_type": "narrowPeak or broadPeak, the MACS3 output the row was read from"

      - data_collection_tag: "macs2_peak_summary"
        description: "Per-sample peak QC: peak count, FRiP score and the spread of peak width, enrichment and significance"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "macs2/peak_summary.py"
            source_overrides:
              frip:
                # 2.x names the FRiP file `<sample>.FRiP_mqc.tsv`; the recipe's
                # own glob is the 1.x `<sample>_peaks.FRiP_mqc.tsv`. The summary
                # glob (`**/*peak.summary.txt`) already matches
                # `macs3_peak.summary.txt`.
                glob_pattern: "**/*.FRiP_mqc.tsv"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "ChIP sample"
              "num_peaks": "Peaks MACS3 called for the sample"
              "frip_score": "Fraction of mapped reads falling inside called peaks"
              "width_median": "Median peak width (bp)"
              "width_mean": "Mean peak width (bp)"
              "width_max": "Widest peak (bp)"
              "fold_enrichment_median": "Median fold enrichment over the control"
              "fold_enrichment_mean": "Mean fold enrichment over the control"
              "neg_log10_qvalue_median": "Median -log10 q-value"
              "neg_log10_pvalue_median": "Median -log10 p-value"

      - data_collection_tag: "homer_annotated_peaks"
        description: "HOMER annotation of every peak: genomic feature class, distance to the nearest TSS and the gene it belongs to"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "homer/annotate_peaks.py"
            source_overrides:
              annotation:
                # Per-sample tables of the merged-library level only, for any
                # aligner and either peak type. The recipe's own glob is
                # layout-agnostic and would also take the consensus tables
                # (`consensus/<antibody>/<antibody>.consensus_peaks.annotatePeaks.txt`),
                # concatenating two aggregation levels under one `sample` column.
                # The aligner directory is not spelled out (1.2.0 lint F7):
                # `**/` takes bwa/, bowtie2/, chromap/ and star/ alike.
                glob_pattern: "**/merged_library/macs3/*/*_peaks.annotatePeaks.txt"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Sample the peak was called in"
              "peak_id": "Peak identifier, the same one macs2_peaks uses"
              "chr": "Chromosome"
              "start": "Peak start"
              "end": "Peak end"
              "strand": "Peak strand as HOMER reports it (always + for MACS3 peaks)"
              "peak_score": "Score carried over from the peak caller"
              "annotation_class": "Coarse feature class: promoter-TSS, intron, exon, Intergenic, TTS"
              "annotation": "Full HOMER annotation string, with the transcript detail"
              "distance_to_tss": "Signed distance to the nearest transcription start site (bp)"
              "nearest_promoter_id": "Identifier of the nearest promoter"
              "gene_name": "Symbol of the nearest gene"
              "gene_type": "Biotype of the nearest gene; empty when the run annotated against a plain GTF"

      - data_collection_tag: "homer_tss_distance_profile"
        description: "Where each sample's peaks sit relative to the nearest TSS, counted in 250 bp bins across a 20 kb window"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "homer/tss_distance_profile.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Sample the peaks were called in"
              "distance_to_tss": "Centre of the bin, signed bp from the transcription start site"
              "peak_count": "Peaks of that sample falling in the bin"
              "fraction": "peak_count over the sample's peaks inside the window"

      - data_collection_tag: "macs2_summit_profile"
        description: "Every sample's peak calls aggregated on a 4 kb window centred on their summits: the average peak footprint and the other samples' summits around each summit"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "macs2/summit_profile.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Sample the anchor summits were called in"
              "offset_bp": "Bin centre, signed bp from the summit (50 bp bins, -2 kb to +2 kb)"
              "n_summits": "Summits of that sample used as anchors"
              "peak_footprint": "Share of the sample's peaks whose interval still covers that offset from their own summit"
              "neighbour_summit_density": "Summits called in the other samples of the run, per anchor summit and per kb, in that bin"

      - data_collection_tag: "macs2_consensus_boolean"
        description: "Consensus peak intervals per antibody against the samples that called them, as 0/1 set columns"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "macs2/consensus_boolean.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "peak_id": "Consensus set and interval id joined by a colon, unique across antibodies"
              "consensus_set": "Which consensus table the interval came from, labelled by the longest common prefix of its sample names"
              "interval_id": "Interval id inside that consensus table"
              "chr": "Chromosome"
              "start": "Merged interval start"
              "end": "Merged interval end"
              "num_peaks": "Per-sample peaks merged into the interval"
              "num_samples": "Samples calling a peak on the interval"

      - data_collection_tag: "macs2_consensus_fc"
        description: "Fold enrichment of the most strongly bound consensus intervals, one numeric column per sample"
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "macs2/consensus_fc.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "peak_id": "Consensus set and interval id joined by a colon, unique across antibodies"
              "consensus_set": "Which consensus table the interval came from"
              "interval_id": "Interval id inside that consensus table"
              "chr": "Chromosome"
              "region": "chr:start-end, the heatmap row label"
              "support": "How many samples call the peak, kept categorical"


      # ----------------------------------------------------------------
      # DESeq2 sample-space QC on the consensus peak counts. Differential
      # binding was removed in 2.0.0; `deseq2_qc.r` still places the libraries
      # of each antibody by their counts. Optional: `--skip_deseq2_qc` writes
      # none of it. Both read the 1.x readers: 2.x publishes the same
      # `*.pca.vals_mqc.tsv`, and the plain `*.sample.dists.txt` the catalog
      # recipe globs for by default.
      # ----------------------------------------------------------------
      - data_collection_tag: "deseq2_qc_pca"
        description: "Principal components of the consensus count matrix DESeq2 QC ran on, one PCA per antibody, with the variance each component explains and each library's condition"
        optional: true
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          # The 2.1.0 override of the shared recipe: the same columns (the
          # components resolved per matrix, so the dashboard binds
          # `use: deseq2/qc_pca_embedding`), plus the condition joined from
          # the design hub, declared above.
          transform:
            recipe: "nf-core/chipseq/deseq2_qc_pca.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample_id": "Library the PCA placed"
              "consensus_set": "Which count matrix the components come from, named after the samples in it"
              "dim_1": "First principal component, inside that matrix"
              "dim_2": "Second principal component, inside that matrix"
              "dim_1_percent": "Variance the first component explains in that matrix"
              "dim_2_percent": "Variance the second component explains in that matrix"
              "condition": "Condition of the library on the design hub"

      - data_collection_tag: "deseq2_qc_sample_dists"
        description: "Euclidean distance between every pair of libraries on DESeq2 rlog values, one square matrix per antibody"
        optional: true
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "deseq2/qc_sample_dists.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Row label: the library the distances are measured from. The remaining columns are one per library of the same matrix; a pair from two different antibodies is empty, because the two matrices were never compared."

links:
  # Hub -> everything keyed on the ChIP sample name.
  - source_dc_tag: "design"
    source_column: "sample_id"
    target_dc_tag: "multiqc_data"
    target_type: "multiqc"
    link_config:
      resolver: "sample_mapping"
      target_field: "sample_name"
    description: "Filter the MultiQC panels by the samples picked on the design sheet"
    enabled: true

  - source_dc_tag: "design"
    source_column: "sample_id"
    target_dc_tag: "macs2_peaks"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the peak table by the samples picked on the design sheet"
    enabled: true

  - source_dc_tag: "design"
    source_column: "sample_id"
    target_dc_tag: "macs2_peak_summary"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the peak QC summary by the samples picked on the design sheet"
    enabled: true

  - source_dc_tag: "design"
    source_column: "sample_id"
    target_dc_tag: "homer_annotated_peaks"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the peak annotation by the samples picked on the design sheet"
    enabled: true

  # Peak-level selection: pick peaks on the MACS3 panels, read their annotation.
  - source_dc_tag: "macs2_peaks"
    source_column: "peak_id"
    target_dc_tag: "homer_annotated_peaks"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "peak_id"
    description: "Carry a peak selected on the MACS3 panels over to its HOMER annotation"
    enabled: true

  - source_dc_tag: "homer_annotated_peaks"
    source_column: "peak_id"
    target_dc_tag: "macs2_peaks"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "peak_id"
    description: "Carry a peak selected in the annotation table back to the MACS3 panels"
    enabled: true

  # Consensus-level selection between the two consensus matrices.
  - source_dc_tag: "macs2_consensus_boolean"
    source_column: "peak_id"
    target_dc_tag: "macs2_consensus_fc"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "peak_id"
    description: "Carry a consensus interval selected on the overlap panels over to the signal heatmap"
    enabled: true

  - source_dc_tag: "macs2_consensus_fc"
    source_column: "peak_id"
    target_dc_tag: "macs2_consensus_boolean"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "peak_id"
    description: "Carry a consensus interval selected on the signal heatmap back to the overlap panels"
    enabled: true

  # Signal-level QC, keyed on the same ChIP sample name as everything else.
  - source_dc_tag: "design"
    source_column: "sample_id"
    target_dc_tag: "preseq_complexity_curve"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the complexity curves by the samples picked on the design sheet"
    enabled: true

  - source_dc_tag: "design"
    source_column: "sample_id"
    target_dc_tag: "deeptools_fingerprint_metrics"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the fingerprint metrics by the samples picked on the design sheet"
    enabled: true

  - source_dc_tag: "design"
    source_column: "sample_id"
    target_dc_tag: "deeptools_plot_profile"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the metagene profiles by the samples picked on the design sheet"
    enabled: true

  - source_dc_tag: "design"
    source_column: "sample_id"
    target_dc_tag: "homer_tss_distance_profile"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the TSS distance profiles by the samples picked on the design sheet"
    enabled: true

  - source_dc_tag: "design"
    source_column: "sample_id"
    target_dc_tag: "macs2_summit_profile"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the summit-centred profiles by the samples picked on the design sheet"
    enabled: true

  # Picard names the library after the duplicate-marked BAM
  # (<sample_id>.mLb.mkD.sorted), so the sample is spelled into that name
  # rather than matched as is.
  - source_dc_tag: "design"
    source_column: "sample_id"
    target_dc_tag: "picard_markduplicates_metrics"
    target_type: "table"
    link_config:
      resolver: "pattern"
      pattern: "{sample}.mLb.mkD.sorted"
      target_field: "sample"
    description: "Filter the duplication metrics by the libraries picked on the design sheet"
    enabled: true

  # Genomic region. The Locus tab's navigator (a genome_view on macs2_peaks)
  # emits a chromosome and a position filter on open (its default_region) and
  # on every brush or locus entry. These two links rename that pair onto the
  # other collections the tab stacks under it, so every track shows the same
  # region. The persistent sample filter reaches them through the links above.
  - source_dc_tag: "macs2_peaks"
    source_column: "chr"
    target_dc_tag: "macs2_consensus_boolean"
    target_type: "table"
    link_config:
      resolver: "region"
      columns: {chrom: "chr", pos: "start"}
    description: "A region brushed or typed on the peak navigator narrows the consensus intervals"
    enabled: true

  - source_dc_tag: "macs2_peaks"
    source_column: "chr"
    target_dc_tag: "homer_annotated_peaks"
    target_type: "table"
    link_config:
      resolver: "region"
      columns: {chrom: "chr", pos: "start"}
    description: "A region brushed or typed on the peak navigator narrows the HOMER annotation track"
    enabled: true

  # Library-level scope. The FastQC and Trim Galore panels are keyed on the
  # sequencing library (SAMPLE_REPn_Tm), not on the merged library, so the
  # validated samplesheet reaches the MultiQC report on its own key.
  - source_dc_tag: "samplesheet"
    source_column: "sample"
    target_dc_tag: "multiqc_data"
    target_type: "multiqc"
    link_config:
      resolver: "sample_mapping"
      target_field: "sample_name"
    description: "Filter the read-level MultiQC panels by the sequencing libraries picked in the left panel"
    enabled: true

  # The consensus sets are per ANTIBODY, not per sample: a consensus set is
  # named after the longest common prefix of the samples merged into it. The
  # `wildcard` resolver matches a target value that starts with the antibody,
  # which is what makes the persistent antibody filter reach the Consensus
  # tab. It holds when the sample names start with the antibody (the nf-core
  # convention); see VALIDATION_REPORT.md CS2-D7.
  - source_dc_tag: "design"
    source_column: "antibody"
    target_dc_tag: "macs2_consensus_boolean"
    target_type: "table"
    link_config:
      resolver: "wildcard"
      target_field: "consensus_set"
    description: "Narrow the consensus overlap panels to the antibody picked in the left panel"
    enabled: true

  - source_dc_tag: "design"
    source_column: "antibody"
    target_dc_tag: "macs2_consensus_fc"
    target_type: "table"
    link_config:
      resolver: "wildcard"
      target_field: "consensus_set"
    description: "Narrow the consensus signal heatmap to the antibody picked in the left panel"
    enabled: true

  # Sample-space QC is per library again, so it rejoins the hub on the sample
  # name; the antibody link narrows the PCA to one matrix, which is the only
  # scale on which its axes mean anything.
  - source_dc_tag: "design"
    source_column: "sample_id"
    target_dc_tag: "deseq2_qc_pca"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample_id"
    description: "Filter the count-matrix PCA by the libraries picked in the left panel"
    enabled: true

  - source_dc_tag: "design"
    source_column: "antibody"
    target_dc_tag: "deseq2_qc_pca"
    target_type: "table"
    link_config:
      resolver: "wildcard"
      target_field: "consensus_set"
    description: "Narrow the count-matrix PCA to the antibody picked in the left panel"
    enabled: true

  - source_dc_tag: "design"
    source_column: "sample_id"
    target_dc_tag: "deseq2_qc_sample_dists"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the sample distance matrix by the libraries picked in the left panel"
    enabled: true
