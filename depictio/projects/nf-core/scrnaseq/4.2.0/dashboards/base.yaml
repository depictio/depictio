  - component_type: advanced_viz
    tag: sc-cl-av-sankey
    index: sc-cl-av-sankey
    section: Cluster stability
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/cluster_stability
    title: Cluster stability across k
    description: graphclust -> kmeans_6 -> kmeans_10. A graph-based cluster that fans out to several k-means clusters is a candidate for further splitting; one that stays a single ribbon is stable.
    title_size: h3
