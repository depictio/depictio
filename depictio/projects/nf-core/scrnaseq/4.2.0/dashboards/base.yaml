    data_collection_tag: cellranger_cell_qc
    use: cellranger/cell_qc
    visu_type: box
    mode: code
    code_content: |-
      # Top-20 gene share per cell in each cluster: a high box is a cluster
      # of low-complexity cells, often damaged or dying.
      d = df.with_columns(pl.col('graphclust').str.extract(r'(\d+)', 1).cast(pl.Int64).alias('_n')).sort('_n')
      orders = d.select(['graphclust', '_n']).unique().sort('_n').get_column('graphclust').to_list()
      fig = px.box(d.to_pandas(), x='graphclust', y='pct_top20', points=False, category_orders={'graphclust': orders}, labels={'graphclust': 'Cluster', 'pct_top20': 'Top-20 gene share (%)'})
      fig.update_layout(margin=dict(t=10))
    section: Per cluster
    tag: sc-cq-fig-top20
    index: cq-top20-box
    title: Top-20 gene share, by cluster
