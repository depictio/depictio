version: 1
# nf-core/scrnaseq 4.2.0 reference dashboard.
#
# Funnel: the MultiQC report (raw-read QC + Cell Ranger's own summary) ->
# Library QC (headline metrics, thresholded) -> Cell calling (the barcode-rank
# curve and CellBender's ambient-RNA removal) -> Cell QC (the MAD-based flag
# every downstream tab can filter on) -> Embeddings (UMAP / t-SNE / PCA) ->
# Clusters (sizes, QC medians, stability across k) -> Markers (per-cluster
# marker genes) -> Aligner concordance (optional: simpleaf / kallisto against
# Cell Ranger). The cell-level QC filters (cluster, QC status, mito %, genes,
# CellBender agreement) are pinned on every tab and compose forward through
# the cluster_label links: pick a cluster on any tab and the cluster summary,
# marker expression and marker-gene tables all narrow to it.
#
# The MultiQC tab holds MultiQC panels only. The pinned sections are the
# deliberate exception: the sample sheet and the Cell Ranger metrics ride
# along on every tab, as do the cell-level QC filters.
main_dashboard:
  title: nf-core/scrnaseq
  subtitle: "nf-core/scrnaseq 4.2.0 megatest: pbmc8k, 10x v2, 8 767 cells called out of 499 387 raw barcodes (Cell Ranger route); simpleaf and kallisto routes feed the optional Aligner concordance tab"
  project_tag: Single-Cell RNA-seq
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab through the project links
    persistent: true
    pin: top
  - name: Cell QC filters
    icon: mdi:tune
    color: cyan
    description: Cluster, QC status, mito % and gene count; applies wherever cells are shown, through the cluster_label links
    collapsed: true
    persistent: true
    pin: bottom
  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: One row per sample, pooling FastQC and Cell Ranger's headline numbers
  - name: Read quality
    icon: mdi:chart-bell-curve
    color: blue
    description: FastQC on the raw reads
  - name: Cell Ranger summary
    icon: mdi:dna
    color: indigo
    description: Cell Ranger count's own summary stats and QC curves
  # Pinned to every tab: the design the whole dashboard is filtered by should
  # be one collapse away wherever the viewer lands.
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The sample hub every other tab is filtered by
    collapsed: true
    persistent: true
    pin: top
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: Cell Ranger's per-sample metrics, on every tab
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # ------------------------------------------------------------- at a glance
  - component_type: text
    tag: sc-qc-intro
    section: Run at a glance
    title: A Cell Ranger run, from reads to cells
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The MultiQC report, module by module: FastQC on the raw reads, then Cell
      Ranger count's own summary stats, barcode-rank, median-genes and
      saturation curves. Library QC, cell calling, per-cell QC, embeddings,
      clusters, marker genes and aligner concordance each have their own tab.
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: sc-qc-general-stats
    section: Run at a glance
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    title: General statistics
    description: One row per sample, pooling the FastQC and Cell Ranger headline numbers.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 5}

  # ------------------------------------------------------------ read quality
  - component_type: text
    tag: sc-qc-reads-intro
    section: Read quality
    title: Raw reads
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/) on
      every FASTQ Cell Ranger read (R1, the cell barcode and UMI, and R2, the
      transcript read).
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: sc-qc-fastqc-counts
    section: Read quality
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Counts
    use: multiqc/fastqc
    title: Sequence counts
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: sc-qc-fastqc-quality
    section: Read quality
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Per Sequence Quality Scores
    use: multiqc/fastqc
    title: Per-sequence quality scores
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: sc-qc-fastqc-gc
    section: Read quality
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Per Sequence GC Content
    use: multiqc/fastqc
    title: GC content
    title_size: sm
    title_align: left
    layout: {x: 0, y: 6, w: 4, h: 5}

  # ------------------------------------------------------- cellranger summary
  - component_type: text
    tag: sc-qc-cellranger-intro
    section: Cell Ranger summary
    title: Cell Ranger's own QC
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Cell Ranger count's summary stats table, then the three curves it plots
      as a function of downsampled sequencing depth: the barcode-rank
      ("knee") plot, median genes per cell and sequencing saturation.
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: sc-qc-cellranger-stats
    section: Cell Ranger summary
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    selected_module: cellranger
    selected_plot: "Count - Summary stats"
    use: multiqc/cellranger
    title: Cell Ranger count summary stats
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 5}
  - component_type: multiqc
    tag: sc-qc-cellranger-knee
    section: Cell Ranger summary
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    selected_module: cellranger
    selected_plot: "Count - BC rank plot"
    use: multiqc/cellranger
    title: Barcode rank plot (MultiQC)
    description: Cell Ranger's own knee plot. The Cell calling tab draws the same curve from the raw matrix directly.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 6, w: 4, h: 5}
  - component_type: multiqc
    tag: sc-qc-cellranger-genes
    section: Cell Ranger summary
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    selected_module: cellranger
    selected_plot: "Count - Median genes"
    use: multiqc/cellranger
    title: Median genes per cell
    title_size: sm
    title_align: left
    layout: {x: 4, y: 6, w: 4, h: 5}
  - component_type: multiqc
    tag: sc-qc-cellranger-saturation
    section: Cell Ranger summary
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    selected_module: cellranger
    selected_plot: "Count - Saturation plot"
    use: multiqc/cellranger
    title: Sequencing saturation
    title_size: sm
    title_align: left
    layout: {x: 0, y: 11, w: 4, h: 5}

  # ---------------------------------------------------------- filters (main)
  - component_type: interactive
    tag: sc-filter-sample
    index: sc-sample-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: scrnaseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:test-tube'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}

  # -------------------------------------------------- cell QC filters (main)
  - component_type: interactive
    tag: sc-filter-cluster
    index: sc-cluster-filter
    section: Cell QC filters
    group: Cell scope
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    interactive_component_type: MultiSelect
    column_name: cluster_label
    column_type: object
    display: {title_size: md, custom_color: '#5E35B1', icon_name: 'mdi:chart-scatter-plot'}
    placement: left
    title: Cluster
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: sc-filter-qc-status
    index: sc-qc-status-filter
    section: Cell QC filters
    group: Cell scope
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    interactive_component_type: SegmentedControl
    column_name: qc_status
    column_type: object
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:check-decagram'}
    placement: left
    title: QC status
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: sc-filter-n-umi
    index: sc-n-umi-filter
    section: Cell QC filters
    group: Cell scope
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    interactive_component_type: RangeSlider
    column_name: n_umi
    column_type: int64
    display: {title_size: md, custom_color: '#D81B60', icon_name: 'mdi:counter'}
    placement: left
    title: UMI counts per cell
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: sc-filter-n-genes
    index: sc-n-genes-filter
    section: Cell QC filters
    group: Cell scope
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    interactive_component_type: RangeSlider
    column_name: n_genes
    column_type: int64
    display: {title_size: md, custom_color: '#3949AB', icon_name: 'mdi:dna'}
    placement: left
    title: Genes detected
    layout: {x: 0, y: 9, w: 1, h: 3}

  # --------------------------------------------------------- pinned sections
  - component_type: table
    tag: sc-ref-table-samples
    section: Sample sheet
    workflow_tag: scrnaseq
    data_collection_tag: samples
    row_selection_enabled: false
    title: Sample hub
    description: One row per sample, its expected cell count and how many lanes were merged.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    tag: sc-ref-table-metrics
    section: Reference tables
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_metrics
    use: cellranger/metrics_summary
    row_selection_enabled: false
    title: Cell Ranger metrics
    description: Cells called, sequencing depth and saturation, mapping and Q30 rates, per sample.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 4}

tabs:
# ============================================================================
# Library QC
# ============================================================================
- title: Library QC
  subtitle: Cell Ranger's headline library metrics, thresholded against 10x's own QC guidance
  tab_order: 2
  tab_icon: mdi:check-decagram
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  grid_sections:
  - name: Library metrics
    icon: mdi:check-decagram
    color: blue
    description: Cells called against expectation, depth, saturation and mapping quality
  - name: Mapping breakdown
    icon: mdi:chart-bar
    color: indigo
    description: Where confidently-mapped reads land in the genome
  components:
  - component_type: text
    tag: sc-lq-intro
    section: Library metrics
    title: Reading the library metrics
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Cell Ranger's headline numbers against 10x's own QC guidance: sequencing
      saturation, fraction of reads in cell-associated barcodes, valid
      barcodes and Q30 RNA-read bases each carry a pass/warn/fail band in the
      table below. `Cells called` should track `expected_cells` from the
      pinned sample sheet; a large gap is worth a second look before trusting
      anything downstream. The MultiQC saturation curve lives on the MultiQC
      tab only; the card and table here give the same reading as a number.
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_library_metrics_long
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: sc-lq-card-cells
    index: sc-lq-card-cells
    section: Library metrics
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_metrics
    use: cellranger/metrics_summary
    aggregation: max
    column_name: estimated_cells
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#1E88E5', title_color: '#1E88E5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Cells called
    description: Compare against expected_cells on the pinned Sample sheet.
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sc-lq-card-reads
    index: sc-lq-card-reads
    section: Library metrics
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_metrics
    use: cellranger/metrics_summary
    aggregation: max
    column_name: mean_reads_per_cell
    column_type: int64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#1E88E5', title_color: '#1E88E5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mean reads / cell
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sc-lq-card-genes
    index: sc-lq-card-genes
    section: Library metrics
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_metrics
    use: cellranger/metrics_summary
    aggregation: max
    column_name: median_genes_per_cell
    column_type: int64
    display: {icon_name: 'mdi:dna', icon_color: '#1E88E5', title_color: '#1E88E5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Median genes / cell
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sc-lq-card-umi
    index: sc-lq-card-umi
    section: Library metrics
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_metrics
    use: cellranger/metrics_summary
    aggregation: max
    column_name: median_umi_counts_per_cell
    column_type: int64
    display: {icon_name: 'mdi:counter', icon_color: '#1E88E5', title_color: '#1E88E5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Median UMI / cell
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sc-lq-card-saturation
    index: sc-lq-card-saturation
    section: Library metrics
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_metrics
    use: cellranger/metrics_summary
    aggregation: average
    column_name: sequencing_saturation_frac
    column_type: float64
    secondary_layout: gauge
    coverage_max: 1.0
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#43A047', title_color: '#43A047', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Sequencing saturation
    layout: {x: 0, y: 4, w: 2, h: 2}
  - component_type: card
    tag: sc-lq-card-incells
    index: sc-lq-card-incells
    section: Library metrics
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_metrics
    use: cellranger/metrics_summary
    aggregation: average
    column_name: fraction_reads_in_cells_frac
    column_type: float64
    secondary_layout: gauge
    coverage_max: 1.0
    display: {icon_name: 'mdi:test-tube', icon_color: '#43A047', title_color: '#43A047', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Reads in cells
    layout: {x: 2, y: 4, w: 2, h: 2}
  - component_type: card
    tag: sc-lq-card-validbc
    index: sc-lq-card-validbc
    section: Library metrics
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_metrics
    use: cellranger/metrics_summary
    aggregation: average
    column_name: valid_barcodes_frac
    column_type: float64
    secondary_layout: gauge
    coverage_max: 1.0
    display: {icon_name: 'mdi:barcode', icon_color: '#43A047', title_color: '#43A047', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Valid barcodes
    layout: {x: 4, y: 4, w: 2, h: 2}
  - component_type: card
    tag: sc-lq-card-q30
    index: sc-lq-card-q30
    section: Library metrics
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_metrics
    use: cellranger/metrics_summary
    aggregation: average
    column_name: q30_rna_read_frac
    column_type: float64
    secondary_layout: gauge
    coverage_max: 1.0
    display: {icon_name: 'mdi:quality-high', icon_color: '#43A047', title_color: '#43A047', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Q30 RNA bases
    layout: {x: 6, y: 4, w: 2, h: 2}
  - component_type: table
    tag: sc-lq-table-thresholds
    section: Library metrics
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_library_metrics_long
    use: cellranger/library_metrics_long
    row_selection_enabled: false
    title: Thresholded library metrics
    description: The 5 metrics 10x's QC guidance bands, with the threshold and the status each one crosses.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: figure
    tag: sc-lq-fig-mapping
    section: Mapping breakdown
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_mapping_breakdown
    use: cellranger/mapping_stacked_bar
    visu_type: bar
    dict_kwargs: {x: sample, y: fraction, color: region, barmode: group}
    title: Read mapping breakdown
    description: >
      Grouped, not stacked: `antisense` overlaps `exonic`/`intronic` by
      Cell Ranger's own definition, so the regions do not sum to 1 and a
      100%-stacked bar would misread as a partition.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 6}

# ============================================================================
# Cell calling
# ============================================================================
- title: Cell calling
  subtitle: The barcode-rank curve behind Cell Ranger's cell calling, and CellBender's ambient-RNA removal
  tab_order: 3
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  grid_sections:
  - name: Cell calling
    icon: mdi:chart-scatter-plot
    color: cyan
    description: UMI count per barcode against its rank; the knee separates cells from background droplets
  - name: Ambient RNA removal
    icon: mdi:filter-variant
    color: blue
    description: CellBender's per-sample accounting of background removed from the raw counts, and its agreement with Cell Ranger
  components:
  - component_type: text
    tag: sc-cc-intro
    section: Cell calling
    title: The barcode-rank ("knee") curve
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      UMI counts summed per barcode from the raw feature-barcode matrix
      (background droplets included), ranked from highest to lowest. The
      knee is where Cell Ranger drew the cell-calling threshold; colour
      marks the barcodes it kept as cells versus discarded background.
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_barcode_rank
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: sc-cc-av-knee
    index: sc-cc-av-knee
    section: Cell calling
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_barcode_rank
    use: cellranger/barcode_rank_knee
    title: Barcode-rank curve
    description: UMI count vs rank, log-log axes, one line per sample, cell-calling cutoff marked.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 7}
  - component_type: figure
    tag: sc-cc-fig-hist
    section: Cell calling
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_barcode_rank
    visu_type: histogram
    dict_kwargs: {x: umi_count, color: is_cell, log_x: "true"}
    title: Total UMIs, cells vs background
    description: Same barcodes as the knee curve, as a distribution instead of a rank order; the two colours should barely overlap.
    title_size: h3
    layout: {x: 0, y: 8, w: 8, h: 5}
  - component_type: card
    tag: sc-cc-card-found
    index: sc-cc-card-found
    section: Ambient RNA removal
    workflow_tag: scrnaseq
    data_collection_tag: cellbender_metrics
    use: cellbender/metrics
    aggregation: max
    column_name: found_cells
    column_type: float64
    display: {icon_name: 'mdi:test-tube', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: CellBender cells found
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: sc-cc-card-removed
    index: sc-cc-card-removed
    section: Ambient RNA removal
    workflow_tag: scrnaseq
    data_collection_tag: cellbender_metrics
    use: cellbender/metrics
    aggregation: average
    column_name: fraction_counts_removed
    column_type: float64
    secondary_layout: gauge
    coverage_max: 1.0
    display: {icon_name: 'mdi:filter-variant', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Fraction counts removed
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: sc-cc-card-totalremoved
    index: sc-cc-card-totalremoved
    section: Ambient RNA removal
    workflow_tag: scrnaseq
    data_collection_tag: cellbender_metrics
    use: cellbender/metrics
    aggregation: max
    column_name: total_counts_removed
    column_type: float64
    display: {icon_name: 'mdi:counter', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Counts removed
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: sc-cc-card-ratio
    index: sc-cc-card-ratio
    section: Ambient RNA removal
    workflow_tag: scrnaseq
    data_collection_tag: cellbender_metrics
    use: cellbender/metrics
    aggregation: average
    column_name: ratio_of_found_cells_to_expected_cells
    column_type: float64
    display: {icon_name: 'mdi:scale-balance', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Found / expected ratio
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: card
    tag: sc-cc-card-agreement
    index: sc-cc-card-agreement
    section: Ambient RNA removal
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    aggregation: sum
    column_name: cellbender_cell
    column_type: bool
