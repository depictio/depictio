    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/cluster_stability
    title: Cluster stability across k
    description: graphclust, then kmeans_6, then kmeans_10. A graph-based cluster that fans out to several k-means clusters is a candidate for further splitting; one that stays a single ribbon is stable.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 7}

