    data_collection_tag: cellranger_cluster_summary
    use: cellranger/cluster_qc_heatmap
    config:
      value_columns: [median_n_umi, median_n_genes, pct_flagged, pct_cellbender_cell]
      normalize: row_z
    title: Cluster QC heatmap
    description: Row-z-scored medians per cluster (median_pct_mito dropped, constant 0 on this reference, which a z-score can't normalise).
    title_size: h3
    layout: {x: 0, y: 17, w: 8, h: 7}
  - component_type: card
    tag: sc-cl-card-cells
