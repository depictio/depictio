      (log10 genes detected, since pct_mito is empty on this reference) and
      by QC status, then t-SNE by cluster for a second projection of the
      same structure. Lasso-select on the cluster UMAP to carry that
      selection into the Analysis panel; pick a cluster on any tab's Cluster
      filter to see its marker genes on the Markers tab.
