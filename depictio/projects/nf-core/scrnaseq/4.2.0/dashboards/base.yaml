    title_align: left
    order: 2
    alignment: left
    body: >
      The same five bands as the table, one card each, so a run with many
      samples reads as "how many crossed it" rather than as rows to scan.
      Each card pre-filters the long table to its own metric and counts
      samples against 10x's cut-off; `min` means at-least, which is the right
      direction for all five.
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_library_metrics_long
