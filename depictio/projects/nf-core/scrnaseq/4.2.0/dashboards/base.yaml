    display: {icon_name: 'mdi:chart-donut', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Cells by phase
    layout: {x: 0, y: 8, w: 2, h: 2}
  - component_type: card
    tag: sc-cy-card-s
    index: sc-cy-card-s
    section: Cell cycle
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_cycle
    use: cellranger/cell_cycle
    aggregation: median
    column_name: s_score
    column_type: float64
    secondary_layout: box_plot
    aggregations: [box_plot_stats]
    display: {icon_name: 'mdi:chart-box-outline', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: S score
    layout: {x: 2, y: 8, w: 2, h: 2}
  - component_type: card
    tag: sc-cy-card-g2m
    index: sc-cy-card-g2m
    section: Cell cycle
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_cycle
    use: cellranger/cell_cycle
    aggregation: median
    column_name: g2m_score
    column_type: float64
    secondary_layout: box_plot
    aggregations: [box_plot_stats]
    display: {icon_name: 'mdi:chart-box-outline', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: G2/M score
    layout: {x: 4, y: 8, w: 2, h: 2}
  - component_type: card
    tag: sc-cy-card-cycling
    index: sc-cy-card-cycling
    section: Cell cycle
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_cycle
    use: cellranger/cell_cycle
    aggregation: average
    column_name: g2m_score
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.05
    threshold_direction: min
    display: {icon_name: 'mdi:scale-balance', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Clearly cycling cells
    description: Cells whose G2/M score clears 0.05, a little above the 0 the phase call itself uses, so a marginal score does not read as cycling.
    layout: {x: 6, y: 8, w: 2, h: 2}
  - component_type: table
    tag: sc-cy-table
    section: Cell cycle
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_cycle
    use: cellranger/cell_cycle
    row_selection_enabled: false
    title: Cell-cycle scores
    description: One row per cell, its two scores, its phase and how many genes of each set this reference carries.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 10, w: 8, h: 6}
