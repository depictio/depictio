      caption: called, kept by CellBender, passing QC
    section: Calling at a glance
    tag: sc-cc-card-funnel
    index: cc-card-funnel
    title: Barcodes observed
    description: Every barcode with a read, then the cells Cell Ranger calls, those CellBender keeps and those that pass the MAD rules.
    layout: {x: 0, y: 0, w: 4, h: 2}
  # Optional: gone with --skip_cellbender, and the funnel card widens.
  - component_type: card
    workflow_tag: scrnaseq
    data_collection_tag: cellbender_metrics
    use: cellbender/metrics
    aggregation: sum
    column_name: total_raw_counts
    column_type: float64
    secondary_layout: attrition
    attrition_cols: [total_output_counts]
    display:
      icon_name: mdi:waves
      icon_color: teal
      caption: UMI counts, kept after ambient RNA removal
    section: Calling at a glance
    tag: sc-cc-card-cellbender
    index: cc-card-cellbender
    title: UMI counts
    description: UMI counts before CellBender, then the share left once the ambient RNA is removed.
    layout: {x: 4, y: 0, w: 4, h: 2}
  - component_type: advanced_viz
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_barcode_rank
