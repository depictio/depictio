    interactive_component_type: RangeSlider
    column_name: pct_top20
    column_type: float64
    display: {title_size: md, custom_color: '#7C4DFF', icon_name: 'mdi:chart-donut'}
    placement: left
    title: Top-20 gene share
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: text
    tag: sc-cq-intro
    section: QC rules
    title: The MAD rules
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Per sample, on log1p values (sc-best-practices convention): a cell is
      flagged `mad_low_umi` / `mad_low_genes` when log1p(n_umi) or
      log1p(n_genes) falls more than 5 MAD below the sample median,
      `mad_high_top20` when the top-20 genes account for an outlying share of
      its counts (+5 MAD), and `mad_high_mito` when pct_mito exceeds the
      sample median + 3 MAD OR 8% outright. **This reference carries no
      mitochondrial genes** (pbmc8k's bundled GRCh38 has zero `MT-*` features),
      so `pct_mito` and `mad_high_mito` read 0 / false for every cell here;
      the rule is unchanged and will activate against a reference that does
      carry them. The reading below leads with UMI / gene counts, the top-20
      share and the ribosomal fraction instead.
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    layout: {x: 0, y: 0, w: 8, h: 3}
