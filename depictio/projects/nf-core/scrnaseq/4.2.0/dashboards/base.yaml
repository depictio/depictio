    title_align: left
    title: Detection rate in cluster
    aggregations: [box_plot_stats]
    layout: {x: 4, y: 2, w: 4, h: 2}
  - component_type: table
    tag: sc-mk-table-expression
    section: Marker expression
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_marker_expression
    use: cellranger/marker_expression
    row_selection_enabled: true
    row_selection_column: gene
    title: Marker expression table
