    data_collection_tag: cellranger_library_metrics_long
    use: cellranger/library_metrics_long
    aggregation: average
    column_name: threshold
    column_type: float64
    secondary_layout: histogram
    display: {icon_name: 'mdi:ruler', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Cut-offs in play
    description: The thresholds themselves, so a filtered view says which bands it is still judging against.
    layout: {x: 6, y: 4, w: 2, h: 2}
  - component_type: figure
    tag: sc-lq-fig-mapping
    section: Mapping breakdown
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_mapping_breakdown
    use: cellranger/mapping_stacked_bar
    visu_type: bar
    dict_kwargs: {x: sample, y: fraction, color: region, barmode: group}
    title: Read mapping breakdown
    description: >
      Grouped, not stacked: `antisense` overlaps `exonic`/`intronic` by
      Cell Ranger's own definition, so the regions do not sum to 1 and a
      100%-stacked bar would misread as a partition.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 6}

# ============================================================================
# Cell calling
# ============================================================================
- title: Cell calling
  subtitle: The barcode-rank curve behind Cell Ranger's cell calling, the filtering waterfall, and CellBender's ambient-RNA removal
  tab_order: 3
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Barcode filters
    icon: mdi:filter-variant
    color: cyan
    description: Narrow the rank curve and the tables below it to a UMI range
  grid_sections:
  - name: Calling funnel
    icon: mdi:filter-variant
    color: teal
    description: Every barcode observed, narrowed stage by stage down to the cells the QC keeps
  - name: Cell calling
    icon: mdi:chart-scatter-plot
    color: cyan
    description: UMI count per barcode against its rank; the knee separates cells from background droplets
  - name: Ambient RNA removal
    icon: mdi:tune
    color: blue
    description: CellBender's per-sample accounting of background removed from the raw counts, and its agreement with Cell Ranger
  components:
  - component_type: interactive
    tag: sc-cc-filter-umi
    index: sc-cc-umi-filter
    section: Barcode filters
    group: Barcode scope
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_barcode_rank
    use: cellranger/barcode_umi_filter
    interactive_component_type: RangeSlider
    column_name: umi_count
    column_type: int64
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:counter'}
    placement: left
    title: UMIs per barcode
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: text
    tag: sc-cc-intro
    section: Cell calling
    title: The barcode-rank ("knee") curve
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      UMI counts summed per barcode from the raw feature-barcode matrix
      (background droplets included), ranked from highest to lowest. The
      knee is where Cell Ranger drew the cell-calling threshold; colour
      marks the barcodes it kept as cells versus discarded background.
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_barcode_rank
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: sc-cc-av-knee
    index: sc-cc-av-knee
    section: Cell calling
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_barcode_rank
    use: cellranger/barcode_rank_knee
    title: Barcode-rank curve
    description: UMI count vs rank, log-log axes, one line per sample, cell-calling cutoff marked.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: table
    tag: sc-cc-table-rank
    section: Cell calling
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_barcode_rank
    use: cellranger/barcode_rank
    row_selection_enabled: false
    title: Barcode-rank samples (log-spaced)
    description: The downsampled rows the curve above is drawn from. Ranks are geometrically spaced, so counting rows here is not counting barcodes.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 9, w: 8, h: 6}
  - component_type: text
    tag: sc-cc-funnel-intro
    section: Calling funnel
    title: From every droplet to the cells you keep
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Four nested stages, in pipeline order: every barcode the raw matrix
      observed, the ones Cell Ranger called a cell, the subset CellBender also
      called a cell, and the subset no MAD rule flagged. Each stage is a
      subset of the one before it, so the drop between two bars is the cost of
      that step and nothing else. The Cell QC tab says which rule did the
      flagging.
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_funnel
    layout: {x: 0, y: 2, w: 8, h: 2}
  - component_type: card
    tag: sc-cc-card-waterfall
    index: sc-cc-card-waterfall
    section: Calling funnel
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_funnel
    use: cellranger/cell_waterfall
    aggregation: sum
    column_name: barcodes_observed
    column_type: int64
    secondary_layout: attrition
    attrition_cols: [cells_called, cellbender_cells, cells_qc_pass]
    display: {icon_name: 'mdi:filter-variant', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Barcodes observed
    description: Then called, then kept by CellBender, then passing the per-cell QC.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: sc-cc-card-called
    index: sc-cc-card-called
    section: Calling funnel
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_funnel
    use: cellranger/cell_funnel
    aggregation: sum
    column_name: cells_called
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:test-tube', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Cells called
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: sc-cc-card-qcpass
