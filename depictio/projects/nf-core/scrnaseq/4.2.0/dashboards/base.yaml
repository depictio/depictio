    section: The knee
    tag: sc-cc-knee
    index: cc-knee
    title: Barcode-rank curve
    description: Log scales. Called cells are drawn darker; the dashed line is the last one.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_funnel
    use: cellranger/cell_funnel
    row_selection_enabled: true
    row_selection_column: sample
    section: Calling tables
    tag: sc-cc-table-funnel
    index: cc-table-funnel
    title: Cell-calling funnel
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    workflow_tag: scrnaseq
    data_collection_tag: cellbender_metrics
    use: cellbender/metrics
    section: Calling tables
    tag: sc-cc-table-cellbender
