    index: mk-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_diffexp
    interactive_component_type: Select
    column_name: resolution
    column_type: object
    default_value: graphclust
    display:
      icon_name: mdi:set-merge
      custom_color: pink
    section: Marker filters
    tag: sc-mk-filter-resolution
    index: mk-resolution-filter
    title: Clustering
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression_long
    interactive_component_type: Select
    column_name: gene
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: red
    section: Marker filters
    tag: sc-mk-filter-gene
    index: mk-gene-filter
    title: Gene, cell by cell
    layout: {x: 0, y: 2, w: 1, h: 2}
  - component_type: card
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_diffexp
    use: cellranger/diffexp
    aggregation: nunique
    column_name: gene
    column_type: object
    filter_expr: "(col('adjusted_pvalue') < 0.05) & (col('log2fc') > 0)"
    secondary_layout: uniqueness
    display:
      icon_name: mdi:dna
      icon_color: pink
      caption: up-regulated, and how many recur
    section: Markers at a glance
    tag: sc-mk-card-markers
    index: mk-card-markers
    title: Marker genes
    description: Genes up-regulated in a cluster of the chosen clustering at adjusted p below 0.05. The strip shows how many mark more than one cluster.
    layout: {x: 0, y: 0, w: 4, h: 2}
  # Up-regulated markers only: a median over both directions of a fold change
  # would sit near zero.
  - component_type: card
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_diffexp
    use: cellranger/diffexp
    aggregation: median
    column_name: log2fc
    column_type: float64
    filter_expr: "(col('adjusted_pvalue') < 0.05) & (col('log2fc') > 0)"
    secondary_layout: histogram
    display:
      icon_name: mdi:trending-up
      icon_color: red
      caption: median log2 fold change, with the distribution
      decimals: 2
    section: Markers at a glance
    tag: sc-mk-card-lfc
    index: mk-card-lfc
    title: Up-regulation
    description: How much more a significant marker is expressed in its cluster than in the other cells, on a log2 scale.
    layout: {x: 4, y: 0, w: 4, h: 2}
  - component_type: advanced_viz
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_marker_expression
    use: cellranger/marker_dotplot
    config:
      max_genes: 30
      gene_sort: mean
      cluster_sort: name
    section: Marker dot plot
    tag: sc-mk-dotplot
    index: mk-dotplot
    title: Marker dot plot
    description: Graph-based clusters. Dot size is the share of cells expressing the gene, colour its mean.
    layout: {x: 0, y: 0, w: 8, h: 8}
  - component_type: advanced_viz
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_diffexp
    use: cellranger/cluster_volcano
    config:
      views: [volcano]
      top_n_labels: 10
      effect_label: log2 fold change, cluster vs rest
      significance_label: -log10 adjusted p-value
    section: Differential expression
    tag: sc-mk-volcano
    index: mk-volcano
    title: Marker volcano
    description: One point per gene and cluster, coloured by cluster; the top genes are named.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: figure
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_diffexp
    use: cellranger/diffexp
    visu_type: bar
    mode: code
    code_content: |-
      # The strongest up-regulated marker of each cluster, named on its bar.
      # Graph-based clusters unless the resolution filter picks another one.
      res = df.get_column('resolution').unique().sort().to_list()
      pick = 'graphclust' if 'graphclust' in res else (res[0] if res else '')
      d = df.filter((pl.col('resolution') == pick) & (pl.col('adjusted_pvalue') < 0.05) & (pl.col('log2fc') > 0))
      d = d.sort('log2fc', descending=True).group_by('cluster_label', maintain_order=True).head(1)
      d = d.with_columns(pl.col('cluster_label').str.extract(r'(C\d+)', 1).alias('cluster'), pl.col('cluster_label').str.extract(r'C(\d+)', 1).cast(pl.Int64).alias('_n')).sort('_n')
      fig = px.bar(d.to_pandas(), x='log2fc', y='cluster', text='gene', orientation='h', labels={'log2fc': 'log2 fold change', 'cluster': 'Cluster'})
      fig.update_traces(textposition='inside', insidetextanchor='start')
      fig.update_yaxes(type='category', autorange='reversed')
      fig.update_layout(margin=dict(t=10))
    section: Differential expression
    tag: sc-mk-fig-top
    index: mk-top-markers
    title: Strongest marker per cluster
    description: The gene with the largest fold change among each cluster's significant markers.
    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: figure
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression_long
    use: cellranger/cell_expression_long
    visu_type: violin
    mode: code
    code_content: |-
      # One panel per marker gene (the first twelve, or the gene picked in the
      # filter), one violin per cluster, clusters in numeric order.
      genes = df.get_column('gene').unique().sort().to_list()[:12]
      d = df.filter(pl.col('gene').is_in(genes))
      d = d.with_columns(pl.col('cluster_label').str.extract(r'(C\d+)', 1).alias('cluster'), pl.col('cluster_label').str.extract(r'C(\d+)', 1).cast(pl.Int64).alias('_n')).sort('_n')
      orders = d.select(['cluster', '_n']).unique().sort('_n').get_column('cluster').to_list()
      fig = px.violin(d.to_pandas(), x='cluster', y='expression', facet_col='gene', facet_col_wrap=4, box=True, points=False, category_orders={'cluster': orders, 'gene': genes}, labels={'cluster': 'Cluster', 'expression': 'log1p(CP10k)', 'gene': 'Gene'})
      fig.update_layout(margin=dict(t=30))
    section: Per-cell marker spread
    tag: sc-mk-fig-violin
    index: mk-violin
    title: Marker expression per cluster
    description: Expression per cell, log1p of counts per 10 000.
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: table
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_diffexp
    use: cellranger/diffexp
    row_selection_enabled: true
    row_selection_column: gene
    section: Gene detail
    tag: sc-mk-table-diffexp
    index: mk-table-diffexp
    title: Marker genes
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_diffexp
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: gene
      title_col: gene
      selection_source: any
      linked_component: sc-mk-table-diffexp
      sections:
        Cluster: [resolution, cluster, cluster_label, rank_in_cluster]
        Differential expression: [log2fc, adjusted_pvalue, mean_counts]
      link_templates:
        gene_id: https://www.ensembl.org/Multi/Search/Results?q={value}
    section: Gene detail
    tag: sc-mk-record
    index: mk-record
    title: Gene record
    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: table
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_marker_expression
    use: cellranger/marker_expression
    row_selection_enabled: true
    row_selection_column: gene
    section: Gene detail
    tag: sc-mk-table-expression
    index: mk-table-expression
    title: Marker expression per cluster
    layout: {x: 0, y: 6, w: 8, h: 5}
- title: Compare Selections
  subtitle: Which genes separate two groups of cells you lasso?
  tab_group: Genes
  tab_order: 9
  tab_icon: mdi:scale-balance
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Comparison filters
    icon: mdi:filter-variant
    color: teal
    description: Which cells are on the map before you lasso
  grid_sections:
  - name: Cells in play
    icon: mdi:counter
    color: teal
    description: The cells on the map, by QC status and by cluster
  - name: Pick the cells
    icon: mdi:chart-scatter-plot
    color: teal
    description: The UMAP of the marker panel, lasso on
  - name: Compare the groups
    icon: mdi:scale-balance
    color: teal
    description: Every panel gene tested between the two saved groups
  components:
  - component_type: text
    order: 1
    body: >
      Lasso cells on the map and save them as group A, lasso a second set as group B, and the
      test below compares every gene of the marker panel between them (Wilcoxon, FDR 0.05).
      With no saved groups it compares the largest clusters.
    tag: sc-gc-intro
    index: gc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression
    interactive_component_type: MultiSelect
    column_name: cluster_label
    column_type: object
    display:
      icon_name: mdi:chart-donut
      custom_color: violet
    section: Comparison filters
    tag: sc-gc-filter-cluster
    index: gc-cluster-filter
    title: Clusters on the map
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression
    interactive_component_type: SegmentedControl
    column_name: qc_status
    column_type: object
    display:
      icon_name: mdi:check-decagram
      custom_color: grape
    section: Comparison filters
    tag: sc-gc-filter-qc
    index: gc-qc-filter
    title: QC status
    layout: {x: 0, y: 3, w: 1, h: 2}
  - component_type: card
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression
    use: cellranger/cell_expression
    aggregation: count
    column_name: barcode
    column_type: object
    secondary_layout: donut
    breakdown_col: qc_status
    top_n_count: 2
    display:
      icon_name: mdi:test-tube
      icon_color: teal
      caption: on the map, by QC status
    section: Cells in play
    tag: sc-gc-card-cells
    index: gc-card-cells
    title: Cells on the map
    description: Cells the comparison can draw from, passing and flagged.
    layout: {x: 0, y: 0, w: 4, h: 2}
  - component_type: card
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression
    use: cellranger/cell_expression
    aggregation: nunique
    column_name: cluster_label
    column_type: object
    secondary_layout: composition
    breakdown_col: cluster_label
    top_n_count: 5
    display:
      icon_name: mdi:chart-donut
      icon_color: violet
      caption: on the map, the largest five
    section: Cells in play
    tag: sc-gc-card-clusters
    index: gc-card-clusters
    title: Clusters on the map
    description: Clusters with cells on the map. The bar shows the share of cells the five largest hold.
    layout: {x: 4, y: 0, w: 4, h: 2}
  - component_type: advanced_viz
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression
    use: cellranger/gene_umap
    config:
      axis_prefix: UMAP
      selection_enabled: true
      selection_column: barcode
    section: Pick the cells
    tag: sc-gc-umap
    index: gc-umap
    title: UMAP, lasso to build a group
    description: Lasso a set of cells, then save it as group A or B in the panel below.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression
    use: cellranger/selection_compare
    config:
      index_col: barcode
      group_col: cluster_label
      test: wilcoxon
      log_transform: false
      min_observations: 10
      fdr_threshold: 0.05
      log2fc_threshold: 0.5
      top_n_labels: 20
      auto_run: true
    section: Compare the groups
    tag: sc-gc-compare
    index: gc-compare
    title: Group A against group B, gene by gene
    description: Values are already log1p(CP10k), so no further log is taken.
    layout: {x: 0, y: 0, w: 8, h: 7}
