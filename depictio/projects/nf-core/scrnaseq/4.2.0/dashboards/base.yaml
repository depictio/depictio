# ============================================================================
- title: Embeddings
  subtitle: UMAP and t-SNE against the graph-based clusters and the QC flag, plus the PCA scree behind them
  tab_order: 5
  tab_icon: mdi:relation-many-to-many
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
