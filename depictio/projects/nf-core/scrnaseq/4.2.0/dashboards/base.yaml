- title: Aligner concordance
  subtitle: Cell Ranger against simpleaf/alevin-fry and kallisto|bustools, when the run has all three
  tab_order: 8
  tab_icon: mdi:set-merge
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
