# ============================================================================
# Cell QC
# ============================================================================
- title: Cell QC
  subtitle: The MAD-based flag every other tab can filter on
  tab_order: 4
  tab_icon: mdi:shield-check-outline
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  grid_sections:
  - name: QC rules
    icon: mdi:shield-check-outline
    color: grape
    description: The MAD criteria a cell is flagged against, per sample
  - name: QC distributions
    icon: mdi:chart-bell-curve
    color: violet
    description: UMI / gene counts and per-cluster spread
  - name: Flagged cells
    icon: mdi:table
    color: gray
    description: Every cell the MAD rules flagged
  components:
  - component_type: text
    tag: sc-cq-intro
    section: QC rules
    title: The MAD rules
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Per sample, on log1p values (sc-best-practices convention): a cell is
      flagged `mad_low_umi` / `mad_low_genes` when log1p(n_umi) or
      log1p(n_genes) falls more than 5 MAD below the sample median,
      `mad_high_top20` when the top-20 genes account for an outlying share of
      its counts (+5 MAD), and `mad_high_mito` when pct_mito exceeds the
      sample median + 3 MAD OR 8% outright. **This reference carries no
      mitochondrial genes** (pbmc8k's bundled GRCh38 has zero `MT-*` features),
      so `pct_mito` and `mad_high_mito` read 0 / false for every cell here;
      the rule is unchanged and will activate against a reference that does
      carry them. The reading below leads with UMI / gene counts, the top-20
      share and the ribosomal fraction instead.
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    layout: {x: 0, y: 0, w: 8, h: 3}
  - component_type: card
    tag: sc-cq-card-flagged
    index: sc-cq-card-flagged
    section: QC rules
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/cell_qc
    aggregation: average
    column_name: qc_flagged
    column_type: int64
    secondary_layout: gauge
    coverage_max: 1.0
    display: {icon_name: 'mdi:alert-outline', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Cells flagged (any rule)
    layout: {x: 0, y: 3, w: 2, h: 2}
  - component_type: card
    tag: sc-cq-card-lowumi
    index: sc-cq-card-lowumi
    section: QC rules
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    aggregation: sum
    column_name: mad_low_umi
    column_type: bool
    display: {icon_name: 'mdi:trending-down', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Low-UMI outliers
    layout: {x: 2, y: 3, w: 2, h: 2}
  - component_type: card
    tag: sc-cq-card-lowgenes
    index: sc-cq-card-lowgenes
    section: QC rules
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    aggregation: sum
    column_name: mad_low_genes
    column_type: bool
    display: {icon_name: 'mdi:trending-down', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Low-gene outliers
    layout: {x: 4, y: 3, w: 2, h: 2}
  - component_type: card
    tag: sc-cq-card-top20
    index: sc-cq-card-top20
    section: QC rules
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    aggregation: sum
    column_name: mad_high_top20
    column_type: bool
    display: {icon_name: 'mdi:trending-up', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: High top-20 share outliers
    layout: {x: 6, y: 3, w: 2, h: 2}
  - component_type: advanced_viz
    tag: sc-cq-av-scatter
    index: sc-cq-av-scatter
    section: QC distributions
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/umi_vs_genes
    title: UMI counts vs genes detected
    description: Coloured by QC status; flagged cells should sit apart from the main cloud.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: figure
    tag: sc-cq-fig-umi
    section: QC distributions
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/umi_histogram
    visu_type: histogram
    dict_kwargs: {x: n_umi, title: UMI counts per cell}
    title: UMI counts per cell
    title_size: h3
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: figure
    tag: sc-cq-fig-genes
    section: QC distributions
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/genes_histogram
    visu_type: histogram
    dict_kwargs: {x: n_genes, title: Genes detected per cell}
    title: Genes detected per cell
    title_size: h3
    layout: {x: 4, y: 7, w: 4, h: 5}
  - component_type: figure
    tag: sc-cq-fig-ribo-box
    section: QC distributions
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    visu_type: box
    dict_kwargs: {x: cluster_label, y: pct_ribo, title: Ribosomal fraction by cluster}
    title: Ribosomal fraction by cluster
    description: pct_ribo spread per graph-based cluster; a cluster shifted high or low is worth a second look.
    title_size: h3
    layout: {x: 0, y: 12, w: 4, h: 5}
  - component_type: figure
    tag: sc-cq-fig-umi-box
    section: QC distributions
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    visu_type: box
    dict_kwargs: {x: cluster_label, y: log10_n_umi, title: log10 UMI count by cluster}
    title: log10 UMI count by cluster
    description: Depth spread per cluster; a low-depth cluster is a candidate for a doublet or ambient artefact, not necessarily a real cell type.
    title_size: h3
    layout: {x: 4, y: 12, w: 4, h: 5}
  - component_type: table
    tag: sc-cq-table-flagged
    section: Flagged cells
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/cell_qc
    row_selection_enabled: true
    row_selection_column: barcode
    title: Per-cell QC table
    description: Use the QC status filter above (Cell QC filters, pinned) to narrow this to flagged cells only.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 7}

# ============================================================================
