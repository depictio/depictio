  - component_type: text
    tag: sc-em-gene-intro
    section: Gene expression on the map
    title: Colour the map by a gene
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The same UMAP bound to the per-cell expression matrix, where every
      panel gene is a column of the searchable Colour by menu, as
      log1p(CP10k) with 0 where the gene is undetected. The panel is the
      run's MARKER_PANEL when set, the top markers of every cluster and
      the most dispersed genes.
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: sc-em-av-gene-umap
    index: sc-em-av-gene-umap
    section: Gene expression on the map
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression
    use: cellranger/gene_umap
    config: {controls_placement: header}
    title: UMAP coloured by gene
    description: Opens coloured by cluster; pick any panel gene in the Colour by menu.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 8}
  - component_type: text
    tag: sc-em-hvg-intro
    section: Feature selection
    title: Gene dispersion behind the PCA
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Mean expression against normalised dispersion for every gene Cell
      Ranger could normalise, the genes its PCA is computed on. Genes
      with no finite dispersion (undetected or constant) are left out.
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_hvg_dispersion
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
