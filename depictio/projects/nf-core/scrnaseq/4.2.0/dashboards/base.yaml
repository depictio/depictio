    column_name: pc
    column_type: object
    secondary_layout: uniqueness
    display: {icon_name: 'mdi:counter', icon_color: '#3949AB', title_color: '#3949AB', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Components reported
    description: Cell Ranger publishes the variance of the components it kept, not of every gene.
    layout: {x: 4, y: 2, w: 4, h: 2}
  - component_type: figure
    tag: sc-em-fig-scree
