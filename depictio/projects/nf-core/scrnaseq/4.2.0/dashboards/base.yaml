    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/cell_qc
    visu_type: box
    mode: code
    code_content: |-
      # UMIs per cell in each graph-based cluster, log scale, clusters in
      # numeric order. A low box is a cluster of small or damaged cells.
      d = df.with_columns(pl.col('graphclust').str.extract(r'(\d+)', 1).cast(pl.Int64).alias('_n')).sort('_n')
      orders = d.select(['graphclust', '_n']).unique().sort('_n').get_column('graphclust').to_list()
      fig = px.box(d.to_pandas(), x='graphclust', y='n_umi', log_y=True, points=False, category_orders={'graphclust': orders}, labels={'graphclust': 'Cluster', 'n_umi': 'UMIs per cell'})
      fig.update_layout(margin=dict(t=10))
    section: Per cluster
    tag: sc-cq-fig-umi
    index: cq-umi-box
    title: UMIs per cell, by cluster
    layout: {x: 0, y: 0, w: 4, h: 4}
