# ============================================================================
# Compare selections
# ============================================================================
- title: Compare selections
  subtitle: Lasso two groups of cells on the UMAP and test every panel gene between them
  tab_order: 8
  tab_icon: mdi:scale-balance
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Comparison filters
    icon: mdi:filter-variant
    color: teal
    description: Which cells are on the map before you lasso anything
  grid_sections:
  - name: Pick the cells
    icon: mdi:chart-scatter-plot
    color: teal
    description: The same UMAP, bound to the per-cell expression matrix, with lasso selection on
  - name: Compare the groups
    icon: mdi:scale-balance
    color: green
    description: Every panel gene tested between the two saved groups
  components:
  - component_type: interactive
    tag: sc-gc-filter-cluster
    index: sc-gc-cluster-filter
    section: Comparison filters
    group: Comparison scope
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression
    use: cellranger/cell_cluster_picker
    interactive_component_type: MultiSelect
    column_name: cluster_label
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:chart-scatter-plot'}
    placement: left
    title: Clusters on the map
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: sc-gc-filter-qc
    index: sc-gc-qc-filter
    section: Comparison filters
    group: Comparison scope
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression
    use: cellranger/cell_qc_status_picker
    interactive_component_type: SegmentedControl
    column_name: qc_status
    column_type: object
    display: {title_size: md, custom_color: '#43A047', icon_name: 'mdi:check-decagram'}
    placement: left
    title: QC status
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: text
    tag: sc-gc-intro
    section: Pick the cells
    title: How to compare two groups of cells
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Lasso a set of cells on the UMAP below and save it as group A, lasso a
      second set and save it as group B, then run the comparison on the tile
      underneath: every gene of the panel is tested between the two groups and
      drawn as a volcano, effect size against significance. With no groups
      saved, the comparison falls back to the cluster each cell belongs to,
      so the tile has something to show before you touch it. The values are
      already log1p(CP10k), so no further transform is applied, and the test
      is a Wilcoxon rank-sum, which assumes nothing about the distribution.
      Colour the map by a gene first if you want to lasso by expression
      rather than by position.
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression
    layout: {x: 0, y: 0, w: 8, h: 3}
  - component_type: advanced_viz
    tag: sc-gc-av-umap
    index: sc-gc-av-umap
    section: Pick the cells
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression
    use: cellranger/gene_umap
    config: {color_col: MS4A1, selection_enabled: true, selection_column: barcode}
    title: UMAP, lasso to build a group
    description: Opens on MS4A1 (B cells). Colour by any panel gene, then lasso the cells you want to compare.
    title_size: h3
    layout: {x: 0, y: 3, w: 8, h: 8}
  - component_type: card
    tag: sc-gc-card-cells
    index: sc-gc-card-cells
    section: Pick the cells
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression
    use: cellranger/cell_expression
    aggregation: count
    column_name: barcode
    column_type: object
    secondary_layout: donut
    breakdown_col: cluster_label
    top_n_count: 5
    display: {icon_name: 'mdi:chart-donut', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Cells on the map
    layout: {x: 0, y: 11, w: 2, h: 2}
  - component_type: card
    tag: sc-gc-card-qc
    index: sc-gc-card-qc
    section: Pick the cells
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression
    use: cellranger/cell_expression
    aggregation: count
    column_name: barcode
    column_type: object
    secondary_layout: top_n
    breakdown_col: qc_status
    top_n_count: 2
    display: {icon_name: 'mdi:check-decagram', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Cells by QC status
    description: A comparison run over flagged cells is a comparison of QC artefacts; narrow it first.
    layout: {x: 2, y: 11, w: 2, h: 2}
  - component_type: card
    tag: sc-gc-card-depth
    index: sc-gc-card-depth
    section: Pick the cells
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/cell_qc
    aggregation: median
    column_name: log10_n_umi
    column_type: float64
    secondary_layout: box_plot
    aggregations: [box_plot_stats]
    display: {icon_name: 'mdi:chart-box-outline', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Depth of the cells in view
    description: Two groups of very different depth will differ on almost every gene, for the wrong reason.
    layout: {x: 4, y: 11, w: 2, h: 2}
  - component_type: card
    tag: sc-gc-card-genes
    index: sc-gc-card-genes
    section: Pick the cells
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression_long
    use: cellranger/cell_expression_long
    aggregation: nunique
    column_name: gene
    column_type: object
    secondary_layout: uniqueness
    display: {icon_name: 'mdi:dna', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Curated panel genes
    description: The comparison tests the full panel, which is wider than this curated subset.
    layout: {x: 6, y: 11, w: 2, h: 2}
  - component_type: text
    tag: sc-gc-compare-intro
    section: Compare the groups
    title: What the test does
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each gene column is compared between the two groups, the p-values are
      FDR-corrected across genes, and the result is cached server-side, so
      re-opening the tab does not recompute it. Points above the line and
      away from centre are the genes that separate your two groups. Two
      coordinate columns ride along in the same matrix, so read a hit named
      after an axis, not a gene, as an artefact of the layout.
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: sc-gc-av-compare
    index: sc-gc-av-compare
    section: Compare the groups
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression
    use: cellranger/selection_compare
    config:
      index_col: barcode
      group_col: cluster_label
      test: wilcoxon
      log_transform: false
      min_observations: 10
      fdr_threshold: 0.05
      log2fc_threshold: 0.5
      top_n_labels: 20
    title: Group A vs group B, gene by gene
    description: Wilcoxon rank-sum per gene on the already-normalised values, FDR-corrected across the panel.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 8}

