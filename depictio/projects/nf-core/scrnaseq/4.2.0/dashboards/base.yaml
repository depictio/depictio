    aggregation: sum
    column_name: n_cells
    column_type: int64
    secondary_layout: composition
    breakdown_col: graphclust
    top_n_count: 5
    display:
      icon_name: mdi:test-tube
      icon_color: violet
      caption: in the clusters, the largest five
    section: Clusters at a glance
    tag: sc-cl-card-cells
    index: cl-card-cells
