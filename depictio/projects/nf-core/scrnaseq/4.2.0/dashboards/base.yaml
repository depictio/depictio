    secondary_layout: box_plot
    aggregations: [box_plot_stats]
    display: {icon_name: 'mdi:chart-box-outline', icon_color: '#5E35B1', title_color: '#5E35B1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mitochondrial fraction
    description: Share of each cell's UMIs on `MT-` genes; reads 0 on a reference without them.
    layout: {x: 6, y: 4, w: 2, h: 2}
  - component_type: advanced_viz
    tag: sc-cq-av-scatter
