    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 5}

# ============================================================================
# Clusters
# ============================================================================
- title: Clusters
  subtitle: Cluster sizes, QC medians, cell-cycle phase and how stable the clusters are across k-means resolutions
  advanced_viz_controls: header
  tab_order: 6
  tab_icon: mdi:chart-donut
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Cluster filters
    icon: mdi:filter-variant
    color: violet
    description: Cluster size and cell-cycle phase, on top of the pinned cell filters
  grid_sections:
  - name: Cluster composition
    icon: mdi:chart-donut
    color: violet
    description: Size and QC medians of each graph-based cluster
  - name: Cell cycle
    icon: mdi:chart-scatter-plot
    color: grape
    description: S and G2/M scores per cell, and which clusters are cycling
  - name: Cluster stability
    icon: mdi:set-merge
    color: grape
    description: How graph-based clusters split across k-means resolutions
  components:
  - component_type: interactive
    tag: sc-cl-filter-size
    index: sc-cl-size-filter
    section: Cluster filters
    group: Cluster scope
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cluster_summary
    use: cellranger/cluster_size_filter
    interactive_component_type: RangeSlider
    column_name: n_cells
    column_type: int64
    show_histogram: true
    display: {title_size: md, custom_color: '#7C4DFF', icon_name: 'mdi:counter'}
    placement: left
    title: Cells per cluster
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: sc-cl-filter-phase
    index: sc-cl-phase-filter
    section: Cluster filters
    group: Cluster scope
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_cycle
    use: cellranger/phase_filter
    interactive_component_type: MultiSelect
    column_name: phase
    column_type: object
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Cell-cycle phase
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: text
    tag: sc-cl-intro
    section: Cluster composition
    title: Reading the clusters
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per graph-based cluster: its size, QC medians and the
      share CellBender also calls a cell, with the heatmap z-scoring
      each metric across clusters. Cell Ranger clusters each sample on
      its own, so a label shared by two samples is not the same
      population.
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cluster_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: sc-cl-fig-composition
    section: Cluster composition
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cluster_summary
    use: cellranger/cluster_composition
    visu_type: bar
    dict_kwargs: {x: sample, y: pct_cells, color: cluster_label, barmode: stack}
    title: Cluster composition per sample
    description: "Each sample's cells split by cluster, as percentages. Labels are per sample: a colour shared by two samples is not the same population."
    title_size: h3
    layout: {x: 0, y: 16, w: 8, h: 5}
  - component_type: figure
    tag: sc-cl-fig-qcstatus
    section: Cluster composition
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/qc_status_by_cluster
    visu_type: bar
    dict_kwargs: {x: cluster_label, color: qc_status}
    title: QC status per cluster
    description: Cell counts by qc_status within each cluster, so the bar height is also the cluster size; a cluster with a high flagged share may be a QC artefact rather than a cell type.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 5}
  - component_type: advanced_viz
    tag: sc-cl-av-heatmap
    index: sc-cl-av-heatmap
    section: Cluster composition
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cluster_summary
    use: cellranger/cluster_qc_heatmap
    config:
      value_columns: [median_n_umi, median_n_genes, pct_flagged, pct_cellbender_cell]
      normalize: col_z
    title: Cluster QC heatmap
    description: "Column-z-scored medians: each metric is centred across clusters, so a cell reads high or low against the other clusters on that metric."
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 7}
  - component_type: card
    tag: sc-cl-card-cells
    index: sc-cl-card-cells
    section: Cluster composition
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cluster_summary
    use: cellranger/cluster_summary
    aggregation: sum
    column_name: n_cells
    column_type: int64
    secondary_layout: top_n
    breakdown_col: cluster_label
    top_n_count: 3
    display: {icon_name: 'mdi:test-tube', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Cells by cluster
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sc-cl-card-flagged
    index: sc-cl-card-flagged
    section: Cluster composition
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cluster_summary
    use: cellranger/cluster_summary
    aggregation: median
    column_name: pct_flagged
    column_type: float64
    secondary_layout: box_plot
    display: {icon_name: 'mdi:alert-outline', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Flagged share per cluster
    aggregations: [box_plot_stats]
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sc-cl-card-cellbender
    index: sc-cl-card-cellbender
    section: Cluster composition
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cluster_summary
    use: cellranger/cluster_summary
    aggregation: median
    column_name: pct_cellbender_cell
    column_type: float64
    secondary_layout: box_plot
    display: {icon_name: 'mdi:check-decagram', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: CellBender agreement per cluster
    aggregations: [box_plot_stats]
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sc-cl-card-depth
    index: sc-cl-card-depth
    section: Cluster composition
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cluster_summary
    use: cellranger/cluster_summary
    aggregation: median
    column_name: median_n_umi
    column_type: float64
    secondary_layout: box_plot
    aggregations: [box_plot_stats]
    display: {icon_name: 'mdi:chart-box-outline', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Cluster median depth
    description: Quartiles of the per-cluster median UMI count; a cluster far below the box is a depth artefact candidate.
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: table
    tag: sc-cl-table-summary
    section: Cluster composition
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cluster_summary
    use: cellranger/cluster_summary
    row_selection_enabled: true
    row_selection_column: cluster_label
    title: Cluster summary
    description: Selecting a row carries the cluster over to the Markers tab through the cluster_label link.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 21, w: 8, h: 6}
  - component_type: text
    tag: sc-cy-intro
    section: Cell cycle
    title: Is this cluster a cell type, or the same type cycling?
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      S and G2/M scores from the Tirosh gene sets, a cell's mean
      expression over the set minus its mean over every gene; the phase
      is the larger positive score, else G1. A cluster mostly in G2M or
      S next to a G1 cluster with the same markers is one population
      cycling, not two cell types.
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_cycle
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: sc-cy-av-scatter
    index: sc-cy-av-scatter
    section: Cell cycle
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_cycle
    use: cellranger/phase_scatter
    config: {selection_enabled: true, selection_column: barcode, controls_placement: header}
    title: S score vs G2/M score
    description: One point per cell, coloured by the phase call. Cells near the origin are the G1 bulk. Lasso cells to count their clusters in the bar beside it.
    title_size: h3
    layout: {x: 0, y: 4, w: 4, h: 6}
  - component_type: figure
    tag: sc-cy-fig-bycluster
    section: Cell cycle
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_cycle
    use: cellranger/phase_by_cluster
    visu_type: bar
    dict_kwargs: {x: cluster_label, color: phase}
    title: Phase per cluster
    description: Cell counts by phase within each cluster.
    title_size: h3
    layout: {x: 4, y: 4, w: 4, h: 6}
  - component_type: card
    tag: sc-cy-card-phase
    index: sc-cy-card-phase
    section: Cell cycle
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_cycle
    use: cellranger/cell_cycle
    aggregation: count
    column_name: barcode
    column_type: object
    secondary_layout: donut
    breakdown_col: phase
    top_n_count: 3
    display: {icon_name: 'mdi:chart-donut', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Cells by phase
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sc-cy-card-s
    index: sc-cy-card-s
    section: Cell cycle
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_cycle
    use: cellranger/cell_cycle
    aggregation: median
    column_name: s_score
    column_type: float64
    secondary_layout: box_plot
    aggregations: [box_plot_stats]
    display: {icon_name: 'mdi:chart-box-outline', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: S score
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sc-cy-card-g2m
    index: sc-cy-card-g2m
    section: Cell cycle
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_cycle
    use: cellranger/cell_cycle
    aggregation: median
    column_name: g2m_score
    column_type: float64
    secondary_layout: box_plot
    aggregations: [box_plot_stats]
    display: {icon_name: 'mdi:chart-box-outline', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: G2/M score
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sc-cy-card-cycling
    index: sc-cy-card-cycling
    section: Cell cycle
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_cycle
    use: cellranger/cell_cycle
    aggregation: count
    column_name: barcode
    column_type: object
    secondary_layout: top_n
    display: {icon_name: 'mdi:scale-balance', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Cycling cells
    description: Cells whose G2/M score is at least 0.05 (default cut-off, a little above the 0 the phase call uses), by cluster.
    filter_expr: "col('g2m_score') >= 0.05"
    breakdown_col: cluster_label
    top_n_count: 3
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: sc-cl-av-sankey
    index: sc-cl-av-sankey
    section: Cluster stability
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/cluster_stability
    title: Cluster stability across k
    description: graphclust, then kmeans_6, then kmeans_10, the resolutions Cell Ranger computes by default. A graph-based cluster that fans out to several k-means clusters is a candidate for further splitting; one that stays a single ribbon is stable.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 7}

