    display: {icon_name: 'mdi:chart-bar', icon_color: '#3949AB', title_color: '#3949AB', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Top component's variance
    layout: {x: 0, y: 2, w: 4, h: 2}
  - component_type: card
    tag: sc-em-card-pcs
    index: sc-em-card-pcs
    section: Cell embeddings
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_pca_variance
