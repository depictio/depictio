# ============================================================================
# Embeddings
# ============================================================================
- title: Embeddings
  subtitle: UMAP and t-SNE against the clusters and the QC flag, the gene-coloured UMAP, and the feature selection behind them
  tab_order: 5
  tab_icon: mdi:relation-many-to-many
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Feature selection filters
    icon: mdi:filter-variant
    color: indigo
    description: Which genes the embedding was computed on, and how variable they are
  grid_sections:
  - name: Cell embeddings
    icon: mdi:chart-scatter-plot
    color: indigo
    description: UMAP and t-SNE, one point per cell, four readings of the same layout
  - name: Gene expression on the map
    icon: mdi:dna
    color: pink
    description: The same UMAP, coloured by any gene of the marker panel
  - name: Feature selection
    icon: mdi:tune
    color: violet
    description: Mean expression against dispersion, and which genes the PCA was run on
  - name: Embedding summary
    icon: mdi:chart-donut
    color: violet
    description: Cluster counts and the PCA scree behind the embedding
  components:
  - component_type: interactive
    tag: sc-em-filter-selection
    index: sc-em-selection-filter
    section: Feature selection filters
    group: Gene scope
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_hvg_dispersion
    use: cellranger/hvg_selection_filter
    interactive_component_type: Select
    column_name: selection
    column_type: object
    display: {title_size: md, custom_color: '#3949AB', icon_name: 'mdi:tune'}
    placement: left
    title: Kept for the PCA
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: sc-em-filter-dispersion
    index: sc-em-dispersion-filter
    section: Feature selection filters
    group: Gene scope
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_hvg_dispersion
    use: cellranger/hvg_dispersion_filter
    interactive_component_type: RangeSlider
    column_name: normalized_dispersion
    column_type: float64
    display: {title_size: md, custom_color: '#5E35B1', icon_name: 'mdi:chart-bell-curve'}
    placement: left
    title: Normalised dispersion
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: text
    tag: sc-em-intro
    section: Cell embeddings
    title: UMAP and t-SNE, four readings
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The same UMAP laid out three ways, by cluster identity, by depth
      (log10 genes detected, since pct_mito is empty on this reference) and
      by QC status, then t-SNE by cluster for a second projection of the
      same structure. Pick a cluster on any tab's Cluster filter to see its
      marker genes on the Markers tab; lasso on the Compare selections tab
      to test two groups of cells against each other.
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: sc-em-av-umap-cluster
    index: sc-em-av-umap-cluster
    section: Cell embeddings
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/umap_label
    config: {selection_enabled: true, selection_column: barcode}
    title: UMAP by cluster
    description: Coloured by cluster_label (graph-based cluster + its top-2 marker genes). Lasso-select feeds the Analysis panel.
    title_size: h3
    layout: {x: 0, y: 2, w: 4, h: 7}
  - component_type: advanced_viz
    tag: sc-em-av-umap-depth
    index: sc-em-av-umap-depth
    section: Cell embeddings
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/umap_qc
    title: UMAP by depth (log10 genes)
    description: Coloured by log10_n_genes; a cluster that is uniformly low-depth is a candidate low-quality population.
    title_size: h3
    layout: {x: 4, y: 2, w: 4, h: 7}
  - component_type: advanced_viz
    tag: sc-em-av-umap-qc
    index: sc-em-av-umap-qc
    section: Cell embeddings
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/umap_qc
    config: {color_col: qc_status}
    title: UMAP by QC status
    description: Coloured by qc_status; flagged cells clustering together (rather than scattered) would flag a real biological population, not noise.
    title_size: h3
    layout: {x: 0, y: 9, w: 4, h: 7}
  - component_type: advanced_viz
    tag: sc-em-av-tsne
    index: sc-em-av-tsne
    section: Cell embeddings
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/tsne_label
    title: t-SNE by cluster
    description: Second projection of the same graph-based clustering.
    title_size: h3
    layout: {x: 4, y: 9, w: 4, h: 7}
  - component_type: text
    tag: sc-em-gene-intro
    section: Gene expression on the map
    title: Type a gene, see it on the UMAP
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      This tile is bound to the per-cell expression matrix, where every panel
      gene is its own column, so the tile's Colour by menu lists them all.
      The panel is the top markers of each cluster, a curated PBMC panel and
      the most dispersed genes, log1p(CP10k) normalised. A cell with no UMI
      of the gene reads 0 rather than missing, which is what makes an
      unexpressed region look empty instead of hollow.
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: sc-em-av-gene-umap
    index: sc-em-av-gene-umap
    section: Gene expression on the map
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression
    use: cellranger/gene_umap
    config: {color_col: CD3D}
    title: UMAP coloured by gene
    description: Opens on CD3D (pan-T-cell). Switch the Colour by menu to any other panel gene.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 8}
  - component_type: text
    tag: sc-em-hvg-intro
    section: Feature selection
    title: Which genes the embedding was built on
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Cell Ranger picks the variable genes, runs the PCA on those alone, and
      the UMAP on the PCA. This is that step: mean expression across every
      called cell against normalised dispersion, coloured by whether the gene
      was kept. A gene missing from the embedding is a gene in the grey cloud.
      Genes Cell Ranger could not normalise carry no dispersion and are the
      ones it dropped.
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_hvg_dispersion
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: sc-em-av-hvg
    index: sc-em-av-hvg
    section: Feature selection
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_hvg_dispersion
    use: cellranger/hvg_scatter
    title: Mean expression vs dispersion
    description: One point per gene, coloured by whether Cell Ranger kept it for the PCA; hover for the symbol.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
