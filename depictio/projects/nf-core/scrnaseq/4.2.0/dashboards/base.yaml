    title_size: h3
    title_align: left
    layout: {x: 0, y: 16, w: 8, h: 6}
  - component_type: text
    tag: sc-mp-intro
    section: Per-cell marker spread
    title: The mean hides the shape
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Every cell of the marker panel (the run's MARKER_PANEL, else the
      top 2 markers of each cluster), so a bimodal marker does not hide
      behind its cluster mean. Pick a gene on the left to keep one
      panel; cells are capped per cluster.
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression_long
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: sc-mp-fig-bycluster
    section: Per-cell marker spread
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression_long
    use: cellranger/marker_by_cluster
    visu_type: violin
    dict_kwargs: {x: cluster_label, y: expression, color: cluster_label, facet_col: gene, facet_col_wrap: 4, box: true, points: false}
    title: Marker expression per cluster, one panel per gene
    description: One violin per cluster in each gene's panel; the Gene filter on the left narrows it to one panel.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 12}
  - component_type: figure
    tag: sc-mp-fig-bygene
    section: Per-cell marker spread
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression_long
    use: cellranger/marker_by_gene
    visu_type: box
    dict_kwargs: {x: gene, y: expression, color: gene}
    title: Expression per gene
    description: The panel genes side by side; narrow to one cluster with the pinned Cluster filter to see what that cluster expresses.
    title_size: h3
    layout: {x: 0, y: 14, w: 8, h: 6}
  - component_type: text
    tag: sc-mk-de-intro
    section: Differential expression
    title: One gene, every clustering
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The volcano places each marker by fold change and significance
      within its cluster, at the resolution picked on the left. Tick a
      row of the marker table in the Gene detail section below to open
      that gene's record beside it.
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_diffexp
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: sc-mk-av-volcano
    index: sc-mk-av-volcano
    section: Differential expression
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_diffexp
    use: cellranger/cluster_volcano
    # Only the volcano view: these are Cell Ranger's top-ranked markers per
    # cluster, not a genome-wide test, so a QQ plot of their p-values has no
    # null to compare against.
    config: {views: [volcano], controls_placement: header}
    title: Marker gene volcano
    description: log2 fold change vs adjusted p-value, one colour per cluster. Narrows to the picked cluster and resolution through the filters.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 9}
  - component_type: card
    tag: sc-mk-card-genes
    index: sc-mk-card-genes
    section: Differential expression
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_diffexp
    use: cellranger/diffexp
    aggregation: count
    column_name: gene
    column_type: object
    secondary_layout: top_n
    breakdown_col: cluster_label
    top_n_count: 3
    display: {icon_name: 'mdi:dna', icon_color: '#E53935', title_color: '#E53935', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Significant markers
    filter_expr: "col('adjusted_pvalue') < 0.05"
    description: Marker rows with an adjusted p-value below 0.05, by cluster, at the resolution picked on the left.
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sc-mk-card-lfc
    index: sc-mk-card-lfc
    section: Differential expression
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_diffexp
    use: cellranger/diffexp
    aggregation: median
    column_name: log2fc
    column_type: float64
    secondary_layout: box_plot
    aggregations: [box_plot_stats]
    display: {icon_name: 'mdi:chart-box-outline', icon_color: '#E53935', title_color: '#E53935', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: log2 fold change
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sc-mk-card-padj
    index: sc-mk-card-padj
    section: Differential expression
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_diffexp
    use: cellranger/diffexp
    aggregation: median
    column_name: adjusted_pvalue
    column_type: float64
    secondary_layout: box_plot
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#E53935', title_color: '#E53935', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Adjusted p-value
    aggregations: [box_plot_stats]
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sc-mk-card-counts
    index: sc-mk-card-counts
    section: Differential expression
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_diffexp
    use: cellranger/diffexp
    aggregation: median
    column_name: mean_counts
    column_type: float64
    secondary_layout: box_plot
    display: {icon_name: 'mdi:counter', icon_color: '#E53935', title_color: '#E53935', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mean counts of markers
    description: Mean UMI count of each marker in its cluster; a marker at a very low count is fragile however significant.
    aggregations: [box_plot_stats]
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: table
    tag: sc-mk-table-diffexp
    section: Gene detail
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_diffexp
    use: cellranger/diffexp
    row_selection_enabled: true
    row_selection_column: gene
    title: Marker gene table
    description: Gene, resolution, cluster, rank, mean counts, log2 fold change and adjusted p-value. Tick a row to read it in the gene record beside the table.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 5, h: 7}
  - component_type: advanced_viz
    tag: sc-mk-av-record
    index: sc-mk-av-record
    section: Gene detail
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_diffexp
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: gene
      title_col: gene
      selection_source: any
      linked_component: sc-mk-table-diffexp
      sections:
        Cluster: [resolution, cluster, cluster_label, rank_in_cluster]
        Differential expression: [log2fc, adjusted_pvalue, mean_counts]
      link_templates:
        gene_id: 'https://www.ensembl.org/Multi/Search/Results?q={value}'
    title: Gene record
    description: The gene ticked in the marker table beside it, one row per clustering where it ranks as a marker; pick the resolution in the card.
    title_size: h3
    layout: {x: 5, y: 0, w: 3, h: 7}

# ============================================================================
# Compare selections
# ============================================================================
- title: Compare selections
  subtitle: Lasso two groups of cells on the UMAP and test every panel gene between them
  advanced_viz_controls: header
  tab_order: 8
  tab_icon: mdi:scale-balance
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Comparison filters
    icon: mdi:filter-variant
    color: teal
    description: Which cells are on the map before you lasso anything
  grid_sections:
  - name: Pick the cells
    icon: mdi:chart-scatter-plot
    color: teal
    description: The same UMAP, bound to the per-cell expression matrix, with lasso selection on
  - name: Compare the groups
    icon: mdi:scale-balance
    color: green
    description: Every panel gene tested between the two saved groups
  components:
  - component_type: interactive
    tag: sc-gc-filter-cluster
    index: sc-gc-cluster-filter
    section: Comparison filters
    group: Comparison scope
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression
    use: cellranger/cell_cluster_picker
    interactive_component_type: MultiSelect
    column_name: cluster_label
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:chart-scatter-plot'}
    placement: left
    title: Clusters on the map
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: sc-gc-filter-qc
    index: sc-gc-qc-filter
    section: Comparison filters
    group: Comparison scope
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression
    use: cellranger/cell_qc_status_picker
    interactive_component_type: SegmentedControl
    column_name: qc_status
    column_type: object
    display: {title_size: md, custom_color: '#43A047', icon_name: 'mdi:check-decagram'}
    placement: left
    title: QC status
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: text
    tag: sc-gc-intro
    section: Pick the cells
    title: How to compare two groups of cells
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Lasso a set of cells on the UMAP and save it as group A, lasso a
      second set as group B, and read the volcano below for the genes
      that separate them. With no lasso, the comparison opens on the two
      largest clusters.
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: sc-gc-av-umap
    index: sc-gc-av-umap
    section: Pick the cells
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression
    use: cellranger/gene_umap
    config: {selection_enabled: true, selection_column: barcode, controls_placement: header}
    title: UMAP, lasso to build a group
    description: Opens coloured by cluster; colour by any panel gene first to lasso by expression rather than by position.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 8}
  - component_type: card
    tag: sc-gc-card-cells
    index: sc-gc-card-cells
    section: Pick the cells
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression
    use: cellranger/cell_expression
    aggregation: count
    column_name: barcode
    column_type: object
    secondary_layout: donut
    breakdown_col: cluster_label
    top_n_count: 5
    display: {icon_name: 'mdi:chart-donut', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Cells on the map
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sc-gc-card-qc
    index: sc-gc-card-qc
    section: Pick the cells
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression
    use: cellranger/cell_expression
    aggregation: count
    column_name: barcode
    column_type: object
    secondary_layout: top_n
    breakdown_col: qc_status
    top_n_count: 2
    display: {icon_name: 'mdi:check-decagram', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Cells by QC status
    description: A comparison run over flagged cells is a comparison of QC artefacts; narrow it first.
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sc-gc-card-depth
    index: sc-gc-card-depth
    section: Pick the cells
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/cell_qc
    aggregation: median
    column_name: log10_n_umi
    column_type: float64
    secondary_layout: box_plot
    aggregations: [box_plot_stats]
    display: {icon_name: 'mdi:chart-box-outline', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Depth of the cells in view
    description: Two groups of very different depth will differ on almost every gene, for the wrong reason.
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sc-gc-card-genes
    index: sc-gc-card-genes
    section: Pick the cells
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression_long
    use: cellranger/cell_expression_long
    aggregation: nunique
    column_name: gene
    column_type: object
    secondary_layout: uniqueness
    display: {icon_name: 'mdi:dna', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Marker panel genes
    description: Genes on the Markers violin; the comparison tests every gene column of the wider matrix.
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: text
    tag: sc-gc-compare-intro
    section: Compare the groups
    title: What the test does
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each gene is tested with a Wilcoxon rank-sum on the log1p(CP10k)
      values, FDR-corrected across genes.
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: sc-gc-av-compare
    index: sc-gc-av-compare
    section: Compare the groups
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_expression
    use: cellranger/selection_compare
    config:
      index_col: barcode
      group_col: cluster_label
      test: wilcoxon
      log_transform: false
      min_observations: 10
      fdr_threshold: 0.05
      log2fc_threshold: 0.5
      top_n_labels: 20
      auto_run: true
      controls_placement: header
    title: Group A vs group B, gene by gene
    description: Wilcoxon rank-sum per gene on the already-normalised values, FDR-corrected across the panel.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 8}

# ============================================================================
# Aligner concordance (optional)
