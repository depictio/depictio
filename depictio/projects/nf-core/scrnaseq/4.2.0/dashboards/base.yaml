  - component_type: card
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cluster_summary
    use: cellranger/cluster_summary
    aggregation: median
    column_name: pct_flagged
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:alert-outline
      icon_color: red
      caption: median over clusters, with the spread
      decimals: 1
    section: Clusters at a glance
    tag: sc-cl-card-flagged
    index: cl-card-flagged
    title: Flagged share (%)
    description: Share of each cluster's cells the MAD rules flag. An outlier box is a cluster to check.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_cycle
    use: cellranger/cell_cycle
    aggregation: count
    column_name: barcode
    column_type: object
    secondary_layout: donut
    breakdown_col: phase
    top_n_count: 3
    display:
      icon_name: mdi:shape-outline
      icon_color: orange
      caption: scored cells, by phase
    section: Clusters at a glance
    tag: sc-cl-card-phase
    index: cl-card-phase
    title: Cells by phase
    description: Cells scored for the cell cycle, by the phase their S and G2/M scores give.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cluster_summary
    use: cellranger/cluster_summary
    aggregation: median
    column_name: pct_cellbender_cell
    column_type: float64
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:waves
      icon_color: teal
      caption: median over clusters, cells CellBender keeps
      decimals: 1
    section: Clusters at a glance
    tag: sc-cl-card-cellbender
    index: cl-card-cellbender
    title: Kept by CellBender (%)
    description: Share of each cluster's cells CellBender also calls a cell, the median over clusters.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/cell_qc
    visu_type: bar
    mode: code
    code_content: |-
      # Cells per graph-based cluster, the flagged ones stacked on top; one
      # panel per sample when the run has several (clusters are per sample).
      d = df.group_by(['sample', 'graphclust', 'qc_status']).agg(pl.len().alias('cells'))
      d = d.with_columns(pl.col('graphclust').str.extract(r'(\d+)', 1).cast(pl.Int64).alias('_n')).sort(['_n', 'qc_status'], descending=[False, True])
      orders = d.select(['graphclust', '_n']).unique().sort('_n').get_column('graphclust').to_list()
      facet = {'facet_row': 'sample'} if d.get_column('sample').n_unique() > 1 else {}
      fig = px.bar(d.to_pandas(), x='graphclust', y='cells', color='qc_status', color_discrete_map=depictio_category_colors.get('qc_status') or {}, category_orders={'graphclust': orders, 'qc_status': ['pass', 'flagged']}, labels={'graphclust': 'Cluster', 'cells': 'Cells', 'qc_status': 'QC status', 'sample': 'Sample'}, **facet)
      fig.update_layout(margin=dict(t=10))
    section: Cluster sizes
    tag: sc-cl-fig-sizes
    index: cl-sizes
    title: Cells per cluster
    description: Clusters in numeric order; red is the share the MAD rules flag.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: figure
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cluster_summary
    use: cellranger/cluster_summary
    visu_type: heatmap
    mode: code
    code_content: |-
      # Each cluster's QC medians, coloured by how far they sit from the other
      # clusters (z-score per row), the value itself printed in the cell.
      # Averaged over samples when the run has several. A measure with one
      # value for every cluster (no MT- genes, no CellBender) is left out.
      names = {'median_n_umi': 'Median UMIs', 'median_n_genes': 'Median genes', 'median_pct_mito': 'Mitochondrial %', 'pct_flagged': 'Flagged %', 'pct_cellbender_cell': 'Kept by CellBender %'}
      have = [c for c in names if c in df.columns and df.get_column(c).drop_nulls().n_unique() > 1]
      d = df.with_columns(pl.col('graphclust').str.extract(r'(\d+)', 1).cast(pl.Int64).alias('_n'))
      d = d.group_by(['graphclust', '_n']).agg([pl.col(c).mean() for c in have]).sort('_n')
      z = d.select([((pl.col(c) - pl.col(c).mean()) / pl.col(c).std()).fill_nan(0.0).fill_null(0.0).alias(names[c]) for c in have])
      raw = d.select([pl.col(c).round(1).alias(names[c]) for c in have])
      fig = go.Figure(go.Heatmap(z=z.to_pandas().T.values, x=d.get_column('graphclust').to_list(), y=[names[c] for c in have], text=raw.to_pandas().T.values, texttemplate='%{text}', colorscale='RdBu', reversescale=True, zmid=0, colorbar=dict(title='z-score')))
      fig.update_xaxes(title_text='Cluster', type='category')
      fig.update_layout(margin=dict(t=10))
    section: Cluster QC profile
    tag: sc-cl-fig-profile
    index: cl-qc-profile
    title: Cluster QC medians
    description: Red is above the other clusters, blue below; the printed value is the cluster's own.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_cycle
    use: cellranger/phase_scatter
    config:
      x_title: S phase score
      y_title: G2/M phase score
      top_n_labels: 0
      selection_enabled: true
      selection_column: barcode
    section: Cell cycle
    tag: sc-cl-phase-scatter
    index: cl-phase-scatter
    title: S against G2/M score
    description: Cells low on both scores are in G1.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: figure
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_cycle
    use: cellranger/cell_cycle
    visu_type: bar
    mode: code
    code_content: |-
      # Phase mix of each cluster, as a share of its cells, clusters in
      # numeric order and named by their short id.
      d = df.with_columns(pl.col('cluster_label').str.extract(r'(C\d+)', 1).alias('cluster'), pl.col('cluster_label').str.extract(r'C(\d+)', 1).cast(pl.Int64).alias('_n'))
      d = d.group_by(['cluster', '_n', 'phase']).agg(pl.len().alias('cells')).sort('_n')
      orders = d.select(['cluster', '_n']).unique().sort('_n').get_column('cluster').to_list()
      fig = px.bar(d.to_pandas(), x='cluster', y='cells', color='phase', color_discrete_map=depictio_category_colors.get('phase') or {}, category_orders={'cluster': orders, 'phase': ['G1', 'S', 'G2M']}, labels={'cluster': 'Cluster', 'cells': 'Share of cells (%)', 'phase': 'Phase'})
      fig.update_layout(barnorm='percent', margin=dict(t=10))
    section: Cell cycle
    tag: sc-cl-fig-phase
    index: cl-phase-mix
    title: Phase mix per cluster
    description: A cluster rich in S and G2M is cycling.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/cluster_stability
    section: Cluster details
    tag: sc-cl-stability
    index: cl-stability
    title: Clusters across resolutions
    description: Graph-based clusters, then k-means with 6 and 10 clusters. Clean bands mean stable clusters.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cluster_summary
    use: cellranger/cluster_summary
    row_selection_enabled: true
    row_selection_column: cluster_label
    section: Cluster details
    tag: sc-cl-table
    index: cl-table
    title: Cluster summary
    layout: {x: 0, y: 6, w: 8, h: 5}
