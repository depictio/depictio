version: 1
# nf-core/scrnaseq 4.2.0 reference dashboard.
#
# Funnel: the MultiQC report (raw-read QC + Cell Ranger's own summary) ->
# Library QC (headline metrics, thresholded) -> Cell calling (the barcode-rank
# curve, the filtering waterfall and CellBender's ambient-RNA removal) ->
# Cell QC (the MAD-based flag every downstream tab can filter on) ->
# Embeddings (UMAP / t-SNE / PCA, the gene-coloured UMAP and the feature
# selection behind them) -> Clusters (sizes, QC medians, cell cycle, stability
# across k) -> Markers (per-cluster marker genes and their per-cell spread) ->
# Compare selections (two lassoed groups of cells, tested gene by gene) ->
# Aligner concordance (optional: simpleaf / kallisto against Cell Ranger).
#
# The cell-level QC filters (cluster, QC status, UMI counts, genes detected)
# are pinned on every tab and compose forward through the cluster_label links:
# pick a cluster on any tab and the cluster summary, marker expression,
# marker-gene, per-cell expression and cell-cycle tables all narrow to it.
# Every tab also carries its own non-persistent filter section for the
# question that tab asks (resolution, phase, gene, aligner route, ...); the
# MultiQC tab is the exception, its only collection is the MultiQC report,
# which is filtered by sample mapping rather than by column.
#
# The MultiQC tab holds MultiQC panels only. The pinned sections are the
# deliberate exception: the glance strip and the sample sheet ride along on
# every tab, as do the cell-level QC filters. The Cell Ranger metrics table
# lives on Library QC only.
#
# The Sample filter is a one-value control on a single-sample run. It stays
# because the template is written for runs with many, and every per-sample
# tile is keyed on it.
main_dashboard:
  title: nf-core/scrnaseq
  subtitle: "nf-core/scrnaseq 4.2.0: from reads to called cells, per-cell QC, clusters and marker genes on the Cell Ranger route; the Aligner concordance tab fills when the run used several --aligner routes"
  advanced_viz_controls: header
  project_tag: Single-Cell RNA-seq
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab through the project links
    persistent: true
    pin: top
  - name: Cell QC filters
    icon: mdi:tune
    color: cyan
    description: Cluster, QC status, UMI counts and genes detected; applies wherever cells are shown, through the cluster_label links
    collapsed: true
    persistent: true
    pin: bottom
  grid_sections:
  # Pinned to the top and carried by every tab: the four numbers that size the
  # run. Cards are legal on the MultiQC tab only inside a pinned persistent
  # section, which is exactly what this is.
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: The run in four numbers, on every tab
    persistent: true
    pin: top
  - name: MultiQC general statistics
    icon: mdi:view-dashboard-outline
    color: blue
    description: One row per sample, pooling FastQC and Cell Ranger's headline numbers
  - name: Read quality
    icon: mdi:chart-bell-curve
    color: blue
    description: FastQC on the raw reads
  - name: Cell Ranger summary
    icon: mdi:dna
    color: indigo
    description: Cell Ranger count's own summary stats and QC curves
  # Pinned to every tab: the design the whole dashboard is filtered by should
  # be one collapse away wherever the viewer lands.
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The sample hub every other tab is filtered by
    collapsed: true
    persistent: true
    pin: top
  components:
  # ------------------------------------------------------------- at a glance
  - component_type: card
    tag: sc-glance-card-cells
    index: sc-glance-card-cells
    section: Run at a glance
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_metrics
    use: cellranger/metrics_summary
    aggregation: sum
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    column_name: estimated_cells
    column_type: int64
    display: {icon_name: 'mdi:test-tube', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Cells called
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: sc-glance-card-genes
    index: sc-glance-card-genes
    section: Run at a glance
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_metrics
    use: cellranger/metrics_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: median_genes_per_cell
    column_type: int64
    display: {icon_name: 'mdi:dna', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Median genes per cell
    description: Median of the per-library medians; the strip shows their spread.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: sc-glance-card-saturation
    index: sc-glance-card-saturation
    section: Run at a glance
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_metrics
    use: cellranger/metrics_summary
    aggregation: min
    secondary_layout: box_plot
    column_name: sequencing_saturation_frac
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Sequencing saturation
    aggregations: [box_plot_stats]
    description: Lowest library, as a 0 to 1 fraction; the strip shows the spread across libraries.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: sc-glance-card-incells
    index: sc-glance-card-incells
    section: Run at a glance
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_metrics
    use: cellranger/metrics_summary
    aggregation: min
    secondary_layout: box_plot
    column_name: fraction_reads_in_cells_frac
    column_type: float64
    display: {icon_name: 'mdi:shield-check-outline', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Reads in cells
    aggregations: [box_plot_stats]
    description: Lowest library, as a 0 to 1 fraction; the strip shows the spread across libraries.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # ------------------------------------------------------ general statistics
  - component_type: text
    tag: sc-qc-intro
    section: MultiQC general statistics
    title: A Cell Ranger run, from reads to cells
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      FastQC on the raw reads and Cell Ranger count's own summary, as
      MultiQC reports them. The other tabs follow the run from libraries
      to called cells, per-cell QC, clusters and marker genes.
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: sc-qc-general-stats
    section: MultiQC general statistics
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    title: General statistics
    description: One row per sample, pooling the FastQC and Cell Ranger headline numbers.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 5}

  # ------------------------------------------------------------ read quality
  - component_type: text
    tag: sc-qc-reads-intro
    section: Read quality
    title: Raw reads
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc
      /) on every FASTQ Cell Ranger read: R1 carries the cell barcode
      and UMI, R2 the transcript. Read counts, quality, GC profile and
      duplication, one panel each.
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: sc-qc-fastqc-counts
    section: Read quality
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Counts
    use: multiqc/fastqc
    title: Sequence counts
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: sc-qc-fastqc-quality
    section: Read quality
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Per Sequence Quality Scores
    use: multiqc/fastqc
    title: Per-sequence quality scores
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: sc-qc-fastqc-gc
    section: Read quality
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Per Sequence GC Content
    use: multiqc/fastqc
    title: GC content
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: sc-qc-fastqc-dup
    section: Read quality
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Duplication Levels
    use: multiqc/fastqc
    title: Sequence duplication levels
    description: High duplication is expected on a 3' scRNA-seq library; read it next to the saturation curve rather than on its own.
    title_size: sm
    title_align: left
    layout: {x: 4, y: 7, w: 4, h: 5}

  # ------------------------------------------------------- cellranger summary
  - component_type: text
    tag: sc-qc-cellranger-intro
    section: Cell Ranger summary
    title: Cell Ranger's own QC
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Cell Ranger count's summary stats, then median genes per cell and
      sequencing saturation against downsampled depth. The Cell calling
      tab draws the barcode-rank curve with the cell cutoff marked.
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: sc-qc-cellranger-stats
    section: Cell Ranger summary
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    selected_module: cellranger
    selected_plot: "Count - Summary stats"
    use: multiqc/cellranger
    title: Cell Ranger count summary stats
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 5}
  - component_type: multiqc
    tag: sc-qc-cellranger-genes
    section: Cell Ranger summary
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    selected_module: cellranger
    selected_plot: "Count - Median genes"
    use: multiqc/cellranger
    title: Median genes per cell
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: sc-qc-cellranger-saturation
    section: Cell Ranger summary
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    selected_module: cellranger
    selected_plot: "Count - Saturation plot"
    use: multiqc/cellranger
    title: Sequencing saturation
    description: Saturation against downsampled depth. Flattening means more reads would add few new UMIs; still climbing means the library is under-sequenced.
    title_size: sm
    title_align: left
    layout: {x: 4, y: 7, w: 4, h: 5}

  # ---------------------------------------------------------- filters (main)
  - component_type: interactive
    tag: sc-filter-sample
    index: sc-sample-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: scrnaseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:test-tube'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}

  # -------------------------------------------------- cell QC filters (main)
  - component_type: interactive
    tag: sc-filter-cluster
    index: sc-cluster-filter
    section: Cell QC filters
    group: Cell scope
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/cluster_picker
    interactive_component_type: MultiSelect
    column_name: cluster_label
    column_type: object
    display: {title_size: md, custom_color: '#5E35B1', icon_name: 'mdi:chart-scatter-plot'}
    placement: left
    title: Cluster
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: sc-filter-qc-status
    index: sc-qc-status-filter
    section: Cell QC filters
    group: Cell scope
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/qc_status_picker
    interactive_component_type: SegmentedControl
    column_name: qc_status
    column_type: object
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:check-decagram'}
    placement: left
    title: QC status
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: sc-filter-n-umi
    index: sc-n-umi-filter
    section: Cell QC filters
    group: Cell scope
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/n_umi_filter
    interactive_component_type: RangeSlider
    column_name: n_umi
    column_type: int64
    show_histogram: true
    display: {title_size: md, custom_color: '#D81B60', icon_name: 'mdi:counter'}
    placement: left
    title: UMI counts per cell
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: sc-filter-n-genes
    index: sc-n-genes-filter
    section: Cell QC filters
    group: Cell scope
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/n_genes_filter
    interactive_component_type: RangeSlider
    column_name: n_genes
    column_type: int64
    show_histogram: true
    display: {title_size: md, custom_color: '#3949AB', icon_name: 'mdi:dna'}
    placement: left
    title: Genes detected
    layout: {x: 0, y: 9, w: 1, h: 3}


  # --------------------------------------------------------- pinned sections
  - component_type: table
    tag: sc-ref-table-samples
    section: Sample sheet
    workflow_tag: scrnaseq
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample_id
    title: Sample hub
    description: One row per sample, its expected cell count and how many lanes were merged; select rows to narrow every linked tile to those samples.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 3}

tabs:
# ============================================================================
# Library QC
# ============================================================================
- title: Library QC
  subtitle: Cell Ranger's headline library metrics, thresholded against 10x's own QC guidance
  advanced_viz_controls: header
  tab_order: 2
  tab_icon: mdi:check-decagram
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Library filters
    icon: mdi:filter-variant
    color: blue
    description: Narrow the thresholded metrics to one metric or one QC band
  grid_sections:
  - name: Library metrics
    icon: mdi:check-decagram
    color: blue
    description: Five metrics against 10x's own cut-offs, depth per cell, and the thresholded table
  - name: Mapping breakdown
    icon: mdi:chart-bar
    color: indigo
    description: Where confidently-mapped reads land in the genome
  - name: Cell Ranger metrics table
    icon: mdi:table
    color: gray
    description: Cell Ranger's per-sample metrics_summary.csv, every column
    collapsed: true
  components:
  - component_type: interactive
    tag: sc-lq-filter-metric
    index: sc-lq-metric-filter
    section: Library filters
    group: Library scope
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_library_metrics_long
    use: cellranger/library_metric_picker
    interactive_component_type: Select
    column_name: metric
    column_type: object
    display: {title_size: md, custom_color: '#1E88E5', icon_name: 'mdi:tune'}
    placement: left
    title: Metric
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: sc-lq-filter-status
    index: sc-lq-status-filter
    section: Library filters
    group: Library scope
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_library_metrics_long
    use: cellranger/library_status_picker
    interactive_component_type: SegmentedControl
    column_name: status
    column_type: object
    display: {title_size: md, custom_color: '#43A047', icon_name: 'mdi:check-decagram'}
    placement: left
    title: QC band
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: text
    tag: sc-lq-intro
    section: Library metrics
    title: Reading the library metrics
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Five Cell Ranger metrics against 10x's own cut-offs, one card
      each, next to sequencing depth per cell. `Cells called` should
      track `expected_cells` on the pinned sample sheet.
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_library_metrics_long
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: sc-lq-card-reads
    index: sc-lq-card-reads
    section: Library metrics
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_metrics
    use: cellranger/metrics_summary
    aggregation: median
    column_name: mean_reads_per_cell
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#1E88E5', title_color: '#1E88E5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mean reads / cell
    layout: {x: 2, y: 4, w: 2, h: 2}
  - component_type: card
    tag: sc-lq-card-umi
    index: sc-lq-card-umi
    section: Library metrics
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_metrics
    use: cellranger/metrics_summary
    aggregation: median
    column_name: median_umi_counts_per_cell
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display: {icon_name: 'mdi:counter', icon_color: '#1E88E5', title_color: '#1E88E5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Median UMI / cell
    layout: {x: 4, y: 4, w: 2, h: 2}
  - component_type: table
    tag: sc-lq-table-thresholds
    section: Library metrics
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_library_metrics_long
    use: cellranger/library_metrics_long
    row_selection_enabled: false
    title: Thresholded library metrics
    description: The 5 metrics 10x's QC guidance bands, with the threshold and the status each one crosses.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 6, w: 8, h: 4}
  - component_type: card
    tag: sc-lq-th-saturation
    index: sc-lq-th-saturation
    section: Library metrics
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_library_metrics_long
    use: cellranger/library_metrics_long
    aggregation: min
    column_name: value
    column_type: float64
    filter_expr: "col('metric') == 'sequencing_saturation'"
    secondary_layout: threshold
    threshold_value: 0.6
    threshold_direction: min
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#1E88E5', title_color: '#1E88E5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Saturation vs 0.6
    description: Lowest library against 10x's cut-off.
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sc-lq-th-incells
    index: sc-lq-th-incells
    section: Library metrics
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_library_metrics_long
    use: cellranger/library_metrics_long
    aggregation: min
    column_name: value
    column_type: float64
    filter_expr: "col('metric') == 'fraction_reads_in_cells'"
    secondary_layout: threshold
    threshold_value: 0.7
    threshold_direction: min
    display: {icon_name: 'mdi:test-tube', icon_color: '#1E88E5', title_color: '#1E88E5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Reads in cells vs 0.7
    description: Lowest library against 10x's cut-off.
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sc-lq-th-validbc
    index: sc-lq-th-validbc
    section: Library metrics
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_library_metrics_long
    use: cellranger/library_metrics_long
    aggregation: min
    column_name: value
    column_type: float64
    filter_expr: "col('metric') == 'valid_barcodes'"
    secondary_layout: threshold
    threshold_value: 0.75
    threshold_direction: min
    display: {icon_name: 'mdi:barcode', icon_color: '#1E88E5', title_color: '#1E88E5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Valid barcodes vs 0.75
    description: Lowest library against 10x's cut-off.
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sc-lq-th-q30
    index: sc-lq-th-q30
    section: Library metrics
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_library_metrics_long
    use: cellranger/library_metrics_long
    aggregation: min
    column_name: value
    column_type: float64
    filter_expr: "col('metric') == 'q30_rna'"
    secondary_layout: threshold
    threshold_value: 0.65
    threshold_direction: min
    display: {icon_name: 'mdi:quality-high', icon_color: '#1E88E5', title_color: '#1E88E5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Q30 RNA vs 0.65
    description: Lowest library against 10x's cut-off.
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sc-lq-th-mapped
    index: sc-lq-th-mapped
    section: Library metrics
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_library_metrics_long
    use: cellranger/library_metrics_long
    aggregation: min
    column_name: value
    column_type: float64
    filter_expr: "col('metric') == 'confidently_mapped_transcriptome'"
    secondary_layout: threshold
    threshold_value: 0.3
    threshold_direction: min
    display: {icon_name: 'mdi:dna', icon_color: '#1E88E5', title_color: '#1E88E5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mapped to transcriptome vs 0.3
    description: Lowest library against 10x's cut-off.
    layout: {x: 0, y: 4, w: 2, h: 2}
  - component_type: card
    tag: sc-lq-card-band
    index: sc-lq-card-band
    section: Library metrics
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_library_metrics_long
    use: cellranger/library_metrics_long
    aggregation: count
    column_name: metric
    column_type: object
    secondary_layout: top_n
    breakdown_col: status
    top_n_count: 3
    display: {icon_name: 'mdi:check-decagram', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
