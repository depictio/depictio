  - name: Aligner headlines
    icon: mdi:scale-balance
    color: orange
    description: Cells called, CellBender agreement and mapping rate, per --aligner route
  - name: Cell-call overlap
    icon: mdi:set-merge
    color: red
    description: How the three routes' cell calls, plus CellBender on each, agree on the same physical barcode
  components:
  - component_type: text
    tag: sc-al-intro
    section: Aligner headlines
    title: Reading the aligner comparison
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      nf-core/scrnaseq's default `--aligner cellranger` is the only route this
      megatest fetches matrices and secondary analysis for; simpleaf/alevin-fry
      and kallisto|bustools are tables-and-JSON only, fetched for cell-calling
      comparison alone. **A Cell Ranger-only run leaves every tile on this tab
      empty**, every collection here is optional. Barcodes are normalised to
      the bare 16-mer (`barcode_core`) before comparison: Cell Ranger's own
      barcodes carry a `-1` GEM-well suffix the other two routes do not.
    workflow_tag: scrnaseq
    data_collection_tag: aligner_summary
    layout: {x: 0, y: 0, w: 8, h: 3}
