# nf-core/scrnaseq 4.2.0, following depictio/projects/nf-core/RULES.md (the
# ampliseq 2.18.0 template is the reference).
#
# Routes: the Cell Ranger route is the template's core and every Key figure
# reads it. CellBender (--skip_cellbender drops it) and the simpleaf and
# kallisto routes are optional collections: a run without them loses the
# CellBender card and the Aligner Concordance tab, nothing else.
main_dashboard:
  title: nf-core/scrnaseq
  subtitle: Droplet single-cell RNA-seq, from reads to called cells, clusters and their marker genes
  project_tag: Single-Cell RNA-seq
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family: figures, advanced viz
  # and filter chips all colour a value the same way. Clusters are left to the
  # default palette: their labels carry the run's own marker genes.
  category_colors:
    sample: auto
    qc_status:
      pass: '#2f9e44'
      flagged: '#e03131'
    qc_reason:
      pass: '#2f9e44'
      low_umi: '#f08c00'
      low_genes: '#e8590c'
      high_top20: '#ae3ec9'
      high_mito: '#e03131'
    status:
      pass: '#2f9e44'
      warn: '#f08c00'
      fail: '#e03131'
    phase:
      G1: '#74c0fc'
      S: '#fab005'
      G2M: '#e8590c'
    selection:
      selected: '#1c7ed6'
      not selected: '#adb5bd'
    aligner:
      cellranger: '#1c7ed6'
      simpleaf: '#2f9e44'
      kallisto: '#e8590c'
    region:
      exonic: '#1c7ed6'
      intronic: '#74c0fc'
      intergenic: '#adb5bd'
      antisense: '#f08c00'
      unmapped: '#e03131'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. The
  # sample filter reads the sample hub, the source of every sample link in
  # template.yaml; the cell filters read the per-cell QC table, whose
  # cluster_label links reach the cluster, marker and expression tables.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  - name: Cell filters
    icon: mdi:tune
    color: grape
    description: Cluster, QC status and depth, on every tab that shows cells
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
    - MultiQC
    - Library QC
    - Cell Calling
    - Aligner Concordance
    - Compare Selections
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The sample hub behind every tab, narrowed by the sample filter
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Cells called).
  - component_type: interactive
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    interactive_component_type: MultiSelect
    column_name: qc_status
    column_type: object
    display:
      icon_name: mdi:check-decagram
      custom_color: grape
      strip_label: QC status
    section: Key figures
    tag: sc-ov-kf-qc
    index: ov-kf-qc
    title: QC status
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: scrnaseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: sc-ov-kf-sample
    index: ov-kf-sample
    title: Sample
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: text
    title: nf-core/scrnaseq
    order: 1
    body: >
      Droplet single-cell RNA-seq turned into cells: which barcodes hold a cell, which cells
      pass QC, how they cluster and which genes mark each cluster. [Run parameters](params:)
    tag: sc-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/scrnaseq quantifies droplet single-cell RNA-seq with Cell Ranger (and, on request, simpleaf or kallisto), then CellBender removes the ambient RNA. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The sample filter in the left panel applies to every tab: narrow the samples once and the whole dashboard follows. A bar above a section narrows that section only.
    tag: sc-ov-about
    index: ov-about
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash.
  - component_type: text
    surface: card
    values:
      samples: {dc: samples, column: sample_id, aggregation: nunique, format: integer}
    body: |
      ### The run
      - ![](icon:mdi:flask-outline) **Samples** {{samples}}
      - ![](icon:mdi:source-branch) **Aligner** {{param:aligner}}
      - ![](icon:mdi:barcode) **Protocol** {{param:protocol}}
      - ![](icon:mdi:book-open-variant) **Genome** {{param:genome}}
    tag: sc-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  # The marks take the family's colour (the header's), not the theme's blue.
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Five steps from reads to marker genes
      Each step names its settings and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:file-document-outline) **Reads** FastQC on the raw reads · [Settings](params:fastqc) · [MultiQC](tab:MultiQC)
      2. ![](icon:mdi:dna) **Count** Reads mapped and counted per barcode · [Settings](params:aligner) · [Library QC](tab:Library QC)
      3. ![](icon:mdi:filter-variant) **Call** Barcodes called as cells, ambient RNA removed · [Settings](params:cellbender) · [Cell Calling](tab:Cell Calling)
      4. ![](icon:mdi:shield-check-outline) **Flag** Outlier cells flagged by MAD rules · [Settings](params:doublets) · [Cell QC](tab:Cell QC)
      5. ![](icon:mdi:chart-scatter-plot) **Cluster** Graph-based clusters and their markers · [Settings](params:cellranger) · [Clusters](tab:Clusters) · [Markers](tab:Markers)
      :::
    tag: sc-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. The icon colour is that tab's colour. All four read Cell
  # Ranger collections, which every run writes.
  - component_type: card
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/cell_qc
    aggregation: count
    column_name: barcode
    column_type: object
    secondary_layout: composition
    breakdown_col: qc_status
    top_n_count: 2
    display:
      icon_name: mdi:test-tube
      icon_color: cyan
      caption: called by Cell Ranger, by QC status
      link: tab:Cell Calling
    section: Key figures
    tag: sc-ov-kf-cells
    index: ov-kf-cells
    title: Cells called
    description: Barcodes Cell Ranger called as cells. The bar splits them into cells that pass the MAD rules and cells flagged.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/cell_qc
    aggregation: median
    column_name: n_genes
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:dna
      icon_color: grape
      caption: median per cell, with the spread
      link: tab:Cell QC
    section: Key figures
    tag: sc-ov-kf-genes
    index: ov-kf-genes
    title: Genes per cell
    description: Genes detected in each called cell. The box shows how they spread over the cells.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/cell_qc
    aggregation: nunique
    column_name: graphclust
    column_type: object
    secondary_layout: composition
    breakdown_col: graphclust
    top_n_count: 5
    display:
      icon_name: mdi:chart-donut
      icon_color: violet
      caption: graph-based, the largest by cells
      link: tab:Clusters
    section: Key figures
    tag: sc-ov-kf-clusters
    index: ov-kf-clusters
    title: Clusters
    description: Cell Ranger's graph-based clusters. The bar shows the share of cells the five largest hold.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_diffexp
    use: cellranger/diffexp
    aggregation: nunique
    column_name: gene
    column_type: object
    filter_expr: "(col('resolution') == 'graphclust') & (col('adjusted_pvalue') < 0.05) & (col('log2fc') > 0)"
    secondary_layout: uniqueness
    display:
      icon_name: mdi:dna
      icon_color: pink
      caption: up-regulated in a cluster, and how many recur
      link: tab:Markers
    section: Key figures
    tag: sc-ov-kf-markers
    index: ov-kf-markers
    title: Marker genes
    description: Genes up-regulated in a graph-based cluster at adjusted p below 0.05. The strip shows how many mark more than one cluster.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the sample, then the cluster.
  - component_type: interactive
    workflow_tag: scrnaseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Sample
    section: Findings
    tag: sc-ov-findings-sample
    index: ov-findings-sample
    title: Sample
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    interactive_component_type: MultiSelect
    column_name: cluster_label
    column_type: object
    display:
      icon_name: mdi:chart-donut
      custom_color: violet
      strip_label: Cluster
    section: Findings
    tag: sc-ov-findings-cluster
    index: ov-findings-cluster
    title: Cluster
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing the collections it reads, so the
  # import removes a row with its data.
  - component_type: text
    surface: card
    values:
      cells: {dc: cellranger_cell_funnel, column: cells_called, aggregation: sum, format: integer}
      barcodes: {dc: cellranger_cell_funnel, column: barcodes_observed, aggregation: sum, format: si}
      flagged: {dc: cellranger_cell_qc, column: qc_flagged, aggregation: average, format: percent}
      reason: {dc: cellranger_cell_qc, column: qc_reason, aggregation: top, filter_expr: "col('qc_status') == 'flagged'"}
      top_share: {dc: cellranger_cell_qc, column: cluster_label, aggregation: top_share, format: percent}
      top_cl: {dc: cellranger_cell_qc, column: cluster_label, aggregation: top}
      n_clust: {dc: cellranger_cell_qc, column: graphclust, aggregation: nunique, format: integer}
      n_markers: {dc: cellranger_diffexp, column: gene, aggregation: nunique, format: integer,
        filter_expr: "(col('resolution') == 'graphclust') & (col('adjusted_pvalue') < 0.05) & (col('log2fc') > 0)"}
    body: |
      - **{{cells}}** cells called from {{barcodes}} barcodes – the rest are empty droplets [Cell Calling](tab:Cell Calling)
      - **{{flagged}}** of the called cells are flagged – most common rule: {{reason}} [Cell QC](tab:Cell QC)
      - **{{top_share}}** of the cells sit in {{top_cl}} – the largest of {{n_clust}} clusters [Clusters](tab:Clusters)
      - **{{n_markers}}** genes mark a graph-based cluster – up-regulated, adjusted p below 0.05 [Markers](tab:Markers)
    section: Findings
    tag: sc-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Four figures in two rows, wide then narrow, then narrow then wide.
  - component_type: highlight
    section: Findings
    source_tab: Embeddings
    source_component: em-umap
    hide_legend: true
    caption: One point per cell, coloured by graph-based cluster; nearby cells have similar expression.
    tag: sc-ov-hl-umap
    index: ov-hl-umap
    layout: {x: 0, y: 2, w: 5, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Cell Calling
    source_component: cc-knee
    hide_legend: true
    caption: UMIs per barcode against its rank, one curve per sample; the cliff is where cells end.
    tag: sc-ov-hl-knee
    index: ov-hl-knee
    layout: {x: 5, y: 2, w: 3, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Clusters
    source_component: cl-sizes
    caption: Cells per graph-based cluster, the flagged ones stacked on top in red.
    tag: sc-ov-hl-sizes
    index: ov-hl-sizes
    layout: {x: 0, y: 7, w: 3, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Markers
    source_component: mk-top-markers
    caption: The strongest up-regulated marker of each graph-based cluster, named on its bar.
    tag: sc-ov-hl-markers
    index: ov-hl-markers
    layout: {x: 3, y: 7, w: 5, h: 5}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers. A tab the run does not have is left out.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Library QC](tab:Library QC)

      ### Cells
      - [Cell Calling](tab:Cell Calling)
      - [Aligner Concordance](tab:Aligner Concordance)
      - [Cell QC](tab:Cell QC)
      - [Embeddings](tab:Embeddings)
      - [Clusters](tab:Clusters)

      ### Genes
      - [Markers](tab:Markers)
      - [Compare Selections](tab:Compare Selections)
    section: How to read this dashboard
    tag: sc-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filter.
  - component_type: interactive
    workflow_tag: scrnaseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: sc-filter-sample
    index: sample-filters-sample
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  # Persistent cell filters, on the tabs that draw cells.
  - component_type: interactive
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    interactive_component_type: MultiSelect
    column_name: cluster_label
    column_type: object
    display:
      icon_name: mdi:chart-donut
      custom_color: violet
    section: Cell filters
    group: Cell scope
    tag: sc-filter-cluster
    index: cell-filters-cluster
    title: Cluster
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    interactive_component_type: SegmentedControl
    column_name: qc_status
    column_type: object
    display:
      icon_name: mdi:check-decagram
      custom_color: grape
    section: Cell filters
    group: Cell scope
    tag: sc-filter-qc-status
    index: cell-filters-qc-status
    title: QC status
    layout: {x: 0, y: 3, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    interactive_component_type: RangeSlider
    column_name: n_umi
    column_type: int64
    show_histogram: true
    display:
      icon_name: mdi:counter
      custom_color: pink
    section: Cell filters
    group: Cell scope
    tag: sc-filter-umi
    index: cell-filters-umi
    title: UMIs per cell
    layout: {x: 0, y: 5, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    interactive_component_type: RangeSlider
    column_name: n_genes
    column_type: int64
    show_histogram: true
    display:
      icon_name: mdi:dna
      custom_color: indigo
    section: Cell filters
    group: Cell scope
    tag: sc-filter-genes
    index: cell-filters-genes
    title: Genes per cell
    layout: {x: 0, y: 8, w: 1, h: 3}
  # Row selection feeds the Analysis panel: the one component of the family
  # that is both persistent and row-addressable.
  - component_type: table
    workflow_tag: scrnaseq
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Sample sheet
    tag: sc-sample-sheet
    index: sample-sheet
    title: Sample hub
    layout: {x: 0, y: 0, w: 8, h: 4}
tabs:
- title: MultiQC
  subtitle: Did the reads and Cell Ranger's own QC hold for every sample?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  grid_sections:
  - name: QC overview
    icon: mdi:view-dashboard-outline
    color: orange
    description: One row per sample, FastQC and Cell Ranger side by side
  - name: Cell Ranger curves
    icon: mdi:chart-line
    color: orange
    description: Genes per cell and saturation as the reads are subsampled
  - name: Read quality
    icon: mdi:chart-bell-curve
    color: orange
    description: FastQC on the raw reads
  - name: QC details
    icon: mdi:file-document-outline
    color: gray
    description: The remaining FastQC panels
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [MultiQC](https://multiqc.info) gathers [FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/)
      on the raw reads and the summary of [Cell Ranger](https://www.10xgenomics.com/support/software/cell-ranger)
      count. Read whether every sample has enough good reads and how close each library comes
      to saturation. High duplication is expected: each transcript is read many times.
    tag: sc-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: QC overview
    tag: sc-mqc-general-stats
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/cellranger
    selected_module: cellranger
    selected_plot: Count - Summary stats
    section: QC overview
    tag: sc-mqc-cellranger-summary
    layout: {x: 0, y: 4, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/cellranger
    selected_module: cellranger
    selected_plot: Count - Median genes
    section: Cell Ranger curves
    tag: sc-mqc-cellranger-genes
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/cellranger
    selected_module: cellranger
    selected_plot: Count - Saturation plot
    section: Cell Ranger curves
    tag: sc-mqc-cellranger-saturation
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Counts
    section: Read quality
    tag: sc-mqc-fastqc-counts
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Per Sequence Quality Scores
    section: Read quality
    tag: sc-mqc-fastqc-quality
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Per Sequence GC Content
    section: QC details
    tag: sc-mqc-fastqc-gc
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: scrnaseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Duplication Levels
    section: QC details
    tag: sc-mqc-fastqc-dup
    layout: {x: 4, y: 0, w: 4, h: 4}
- title: Library QC
  subtitle: Do the libraries meet 10x Genomics' own QC guidance?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:check-decagram
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Library filters
    icon: mdi:filter-variant
    color: blue
    description: Narrows the checks to a verdict and the mapping to some regions
  grid_sections:
  - name: Libraries at a glance
    icon: mdi:counter
    color: blue
    description: Reads in cells, depth, saturation and transcriptome mapping
  - name: Against 10x's guidance
    icon: mdi:check-decagram
    color: blue
    description: Each library metric against the cut-off 10x Genomics recommends
  - name: Where the reads map
    icon: mdi:chart-bar
    color: blue
    description: Share of each sample's reads by genomic region
  - name: Metrics tables
    icon: mdi:table
    color: gray
    description: The thresholded checks and every column of Cell Ranger's metrics summary
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      Cell Ranger's per-sample metrics, read against the cut-offs
      [10x Genomics](https://www.10xgenomics.com/support/single-cell-gene-expression) gives for
      a usable library. A dot left of its cut-off is a library to check; the bars show where
      the reads land, exonic first.
    tag: sc-lq-intro
    index: lq-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_library_metrics_long
    interactive_component_type: MultiSelect
    column_name: status
    column_type: object
    display:
      icon_name: mdi:check-decagram
      custom_color: green
    section: Library filters
    tag: sc-lq-filter-status
    index: lq-status-filter
    title: Check verdict
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_mapping_breakdown
    interactive_component_type: MultiSelect
    column_name: region
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: blue
    section: Library filters
    tag: sc-lq-filter-region
    index: lq-region-filter
    title: Mapping region
    layout: {x: 0, y: 3, w: 1, h: 3}
  # Levels rather than spreads: a run of one sample still reads them. The
  # percent columns are 0 to 100, so the gauges run to 100.
  - component_type: card
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_metrics
    use: cellranger/metrics_summary
    aggregation: median
    column_name: fraction_reads_in_cells_pct
    column_type: float64
    filter_expr: "col('estimated_cells') > 0"
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:test-tube
      icon_color: blue
      caption: median, 10x expects 70% or more
      decimals: 1
    section: Libraries at a glance
    tag: sc-lq-card-incells
    index: lq-card-incells
    title: Reads in cells (%)
    description: Share of valid-barcode reads that fall in called cells, the median over samples.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_metrics
    use: cellranger/metrics_summary
    aggregation: median
    column_name: mean_reads_per_cell
    column_type: int64
    secondary_layout: threshold
    threshold_value: 20000
    threshold_direction: min
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: indigo
      caption: median, samples against 20 000
    section: Libraries at a glance
    tag: sc-lq-card-depth
    index: lq-card-depth
    title: Reads per cell
    description: Mean reads per called cell. The strip counts the samples at or above the 20 000 10x recommends.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_metrics
    use: cellranger/metrics_summary
    aggregation: median
    column_name: sequencing_saturation_pct
    column_type: float64
    filter_expr: "col('estimated_cells') > 0"
    secondary_layout: coverage
    coverage_max: 100
    display:
      icon_name: mdi:chart-line
      icon_color: cyan
      caption: median, how much more depth would add
      decimals: 1
    section: Libraries at a glance
    tag: sc-lq-card-saturation
    index: lq-card-saturation
    title: Saturation (%)
    description: Share of reads that repeat a UMI already seen. Near 100, more sequencing finds few new transcripts.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_metrics
    use: cellranger/metrics_summary
    aggregation: median
    column_name: reads_mapped_confidently_transcriptome_pct
    column_type: float64
    filter_expr: "col('estimated_cells') > 0"
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:dna
      icon_color: grape
      caption: median, 10x expects 30% or more
      decimals: 1
    section: Libraries at a glance
    tag: sc-lq-card-transcriptome
    index: lq-card-transcriptome
    title: On the transcriptome (%)
    description: Share of reads mapped confidently to the transcriptome, the median over samples.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_library_metrics_long
    use: cellranger/library_metrics_long
    visu_type: scatter
    mode: code
    code_content: |-
      # One dot per sample and metric, coloured by its verdict, with the 10x
      # cut-off as a grey tick: a dot left of its tick fails the check.
      names = {'sequencing_saturation': 'Sequencing saturation', 'fraction_reads_in_cells': 'Reads in cells', 'valid_barcodes': 'Valid barcodes', 'q30_rna': 'Q30 bases, RNA read', 'confidently_mapped_transcriptome': 'Mapped to transcriptome'}
      d = df.with_columns(pl.col('metric').replace(names).alias('check')).sort('check')
      cuts = d.group_by('check').agg(pl.col('threshold').first()).sort('check')
      fig = px.scatter(d.to_pandas(), x='value', y='check', color='status', hover_name='sample', color_discrete_map=depictio_category_colors.get('status') or {}, category_orders={'status': ['pass', 'warn', 'fail']}, labels={'value': 'Value', 'check': '', 'status': 'Verdict'})
      fig.update_traces(marker=dict(size=12))
      fig.add_scatter(x=cuts.get_column('threshold').to_list(), y=cuts.get_column('check').to_list(), mode='markers', marker=dict(symbol='line-ns-open', size=24, color='#868e96', line=dict(width=3)), name='10x cut-off')
      fig.update_xaxes(tickformat='.0%', range=[0, 1.02])
      fig.update_layout(margin=dict(t=10))
    section: Against 10x's guidance
    tag: sc-lq-fig-checks
    index: lq-checks
    title: Library metrics against their cut-offs
    description: The grey tick is the 10x cut-off; the dot is the sample's value.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: figure
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_mapping_breakdown
    use: cellranger/mapping_breakdown
    visu_type: bar
    mode: code
    code_content: |-
      # Each sample's reads by genomic region, side by side, exonic first.
      order = ['exonic', 'intronic', 'intergenic', 'antisense', 'unmapped']
      fig = px.bar(df.to_pandas(), x='sample', y='fraction', color='region', barmode='group', color_discrete_map=depictio_category_colors.get('region') or {}, category_orders={'region': order}, labels={'sample': '', 'fraction': 'Share of reads', 'region': 'Region'})
      fig.update_yaxes(tickformat='.0%')
      fig.update_layout(margin=dict(t=10))
    section: Where the reads map
    tag: sc-lq-fig-mapping
    index: lq-mapping
    title: Read mapping by region
    description: Intronic reads are expected from nuclei and from unspliced RNA.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_library_metrics_long
    use: cellranger/library_metrics_long
    section: Metrics tables
    tag: sc-lq-table-checks
    index: lq-table-checks
    title: Library checks
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_metrics
    use: cellranger/metrics_summary
    row_selection_enabled: true
    row_selection_column: sample
    section: Metrics tables
    tag: sc-lq-table-metrics
    index: lq-table-metrics
    title: Cell Ranger metrics
    layout: {x: 0, y: 5, w: 8, h: 5}
- title: Cell Calling
  subtitle: How many barcodes are cells, and how much ambient RNA was removed?
  tab_group: Cells
  tab_order: 3
  tab_icon: mdi:filter-variant
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Barcode filters
    icon: mdi:filter-variant
    color: cyan
    description: Narrows the rank curve to a band of UMI counts
  grid_sections:
  - name: Calling at a glance
    icon: mdi:counter
    color: cyan
    description: From every barcode to the cells kept, and the counts CellBender removes
  - name: The knee
    icon: mdi:chart-scatter-plot
    color: cyan
    description: UMIs per barcode against rank; the cliff separates cells from empty droplets
  - name: Calling tables
    icon: mdi:table
    color: gray
    description: The calling funnel and CellBender's accounting, per sample
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      Most barcodes are empty droplets holding a little ambient RNA. Cell Ranger calls the
      barcodes above the knee of the rank curve as cells, and
      [CellBender](https://cellbender.readthedocs.io) removes the ambient counts from them. The
      funnel card follows the barcodes down to the cells that pass QC.
    tag: sc-cc-intro
    index: cc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_barcode_rank
    interactive_component_type: RangeSlider
    column_name: umi_count
    column_type: int64
    show_histogram: true
    display:
      icon_name: mdi:counter
      custom_color: cyan
    section: Barcode filters
    tag: sc-cc-filter-umi
    index: cc-umi-range
    title: UMIs per barcode
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: card
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_funnel
    use: cellranger/cell_waterfall
    aggregation: sum
    column_name: barcodes_observed
    column_type: int64
    secondary_layout: attrition
    attrition_cols: [cells_called, cellbender_cells, cells_qc_pass]
    display:
      icon_name: mdi:barcode
