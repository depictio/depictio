    body: >
      One row per graph-based cluster: how many cells it holds, its QC
      medians (z-scored against the other clusters in the heatmap below) and
      the share of its cells CellBender also called a cell. The sankey
      tracks whether a graph-based cluster splits cleanly into k-means
      clusters as k grows from 6 to 10, or stays merged with a neighbour.
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cluster_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
