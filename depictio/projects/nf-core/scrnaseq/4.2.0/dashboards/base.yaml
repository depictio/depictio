    data_collection_tag: cellranger_cell_funnel
    use: cellranger/cell_funnel
    aggregation: average
    column_name: pct_qc_pass
    column_type: float64
    secondary_layout: gauge
    coverage_max: 100.0
    display: {icon_name: 'mdi:shield-check-outline', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Called cells passing QC
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: sc-cc-card-pctcalled
    index: sc-cc-card-pctcalled
    section: Calling funnel
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_funnel
    use: cellranger/cell_funnel
    aggregation: average
    aggregations: [box_plot_stats]
    column_name: pct_called
    column_type: float64
    secondary_layout: box_plot
    display: {icon_name: 'mdi:chart-box-outline', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Barcodes called as cells
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: table
    tag: sc-cc-table-funnel
    section: Calling funnel
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_funnel
    use: cellranger/cell_funnel
    row_selection_enabled: false
    title: Cell-calling funnel
    description: One row per sample, the four stage counts and the two percentages derived from them.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 4, w: 8, h: 3}
  - component_type: card
    tag: sc-cc-card-found
    index: sc-cc-card-found
    section: Ambient RNA removal
    workflow_tag: scrnaseq
    data_collection_tag: cellbender_metrics
    use: cellbender/metrics
    aggregation: max
    column_name: found_cells
    column_type: float64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:test-tube', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: CellBender cells found
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: sc-cc-card-removed
    index: sc-cc-card-removed
    section: Ambient RNA removal
    workflow_tag: scrnaseq
    data_collection_tag: cellbender_metrics
    use: cellbender/metrics
    aggregation: average
    column_name: fraction_counts_removed
    column_type: float64
