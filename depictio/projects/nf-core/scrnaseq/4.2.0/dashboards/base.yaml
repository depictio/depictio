      fig = px.bar(d.to_pandas(), x='aligner', y='mapping_rate', color='aligner', color_discrete_map=depictio_category_colors.get('aligner') or {}, labels={'aligner': '', 'mapping_rate': 'Reads mapped'})
      fig.update_traces(texttemplate='%{y:.1%}', textposition='outside', cliponaxis=False)
      fig.update_yaxes(tickformat='.0%', range=[0, 1.05])
      fig.update_layout(showlegend=False, margin=dict(t=10))
    section: Routes side by side
