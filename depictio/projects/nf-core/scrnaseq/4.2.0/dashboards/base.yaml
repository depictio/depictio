  workflow_system: nf-core
  filter_sections:
  - name: QC detail filters
    icon: mdi:tune
    color: grape
    description: The failing rule and the top-20 share, on top of the pinned cell filters
  grid_sections:
  - name: QC rules
    icon: mdi:shield-check-outline
    color: grape
    description: The MAD criteria a cell is flagged against, per sample
  - name: QC distributions
    icon: mdi:chart-bell-curve
    color: violet
    description: UMI against genes per cell, and the depth and mitochondrial spread per cluster
  - name: Flagged cells
    icon: mdi:table
    color: gray
    description: Every cell the MAD rules flagged; select one to read its record beside the table
  components:
  - component_type: interactive
    tag: sc-cq-filter-reason
    index: sc-cq-reason-filter
    section: QC detail filters
    group: QC scope
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/qc_reason_picker
    interactive_component_type: MultiSelect
    column_name: qc_reason
    column_type: object
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:alert-outline'}
    placement: left
    title: Failing rule
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: sc-cq-filter-top20
    index: sc-cq-top20-filter
    section: QC detail filters
    group: QC scope
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/top20_share_filter
    interactive_component_type: RangeSlider
    column_name: pct_top20
    column_type: float64
    show_histogram: true
    display: {title_size: md, custom_color: '#7C4DFF', icon_name: 'mdi:chart-donut'}
    placement: left
    title: Top-20 gene share
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: text
    tag: sc-cq-intro
    section: QC rules
    title: The MAD rules
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Per sample, a cell is flagged when log1p UMI or genes falls 5 MAD
      below the median, its top-20 gene share sits 5 MAD above it, or
      its mitochondrial fraction exceeds the median plus 3 MAD or 8%
      (the mito rule reads `MT-` gene symbols, so it stays silent on a
      reference without them). The pinned QC status filter carries the
      flag to every other tab.
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: sc-cq-card-flagged
    index: sc-cq-card-flagged
    section: QC rules
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/cell_qc
    aggregation: average
    column_name: qc_flagged
    column_type: int64
    secondary_layout: gauge
    coverage_max: 1.0
    display: {icon_name: 'mdi:alert-outline', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Cells flagged (any rule)
    layout: {x: 0, y: 4, w: 2, h: 2}
  - component_type: card
    tag: sc-cq-card-lowumi
    index: sc-cq-card-lowumi
    section: QC rules
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/cell_qc
    aggregation: sum
    column_name: mad_low_umi
    column_type: bool
    secondary_layout: top_n
    breakdown_col: cluster_label
    top_n_count: 3
    display: {icon_name: 'mdi:trending-down', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Low-UMI outliers
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sc-cq-card-lowgenes
    index: sc-cq-card-lowgenes
    section: QC rules
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/cell_qc
    aggregation: sum
    column_name: mad_low_genes
    column_type: bool
    secondary_layout: top_n
    breakdown_col: cluster_label
    top_n_count: 3
    display: {icon_name: 'mdi:trending-down', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Low-gene outliers
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: sc-cq-card-top20
    index: sc-cq-card-top20
    section: QC rules
    workflow_tag: scrnaseq
    data_collection_tag: cellranger_cell_qc
    use: cellranger/cell_qc
    aggregation: sum
    column_name: mad_high_top20
    column_type: bool
    secondary_layout: top_n
    breakdown_col: cluster_label
    top_n_count: 3
    display: {icon_name: 'mdi:trending-up', icon_color: '#8E24AA', title_color: '#8E24AA', title_font_size: xl, value_font_size: xl}
