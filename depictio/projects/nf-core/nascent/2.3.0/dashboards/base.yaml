version: 1
# nf-core/nascent 2.3.0, on the family rules of depictio/projects/nf-core/RULES.md
# (ampliseq/2.18.0 is the reference implementation).
#
# One unit carries every tile: the library (one run-on library, the `sample` of
# the samplesheet), placed on the time course by its time point. Funnel: whether
# each library has the depth, the complexity and the strand balance to be read
# (Data & QC) -> which genes change transcription and when, how far each time
# point has moved from the baseline, and where along the genome the signal
# changes (Time course). The pipeline writes no MultiQC report, so the family has
# no MultiQC tab; the megatest run published no transcript identification
# (groHMM, PINTS, HOMER), so there is no Transcripts tab either.
#
# The sample hub (`samples`) carries the persistent filters. Its links reach the
# per-library collections by `sample` and the per-time-point ones (trajectories,
# curves, chromosome shares) by `time_point`; the per-gene and per-window calls
# by the time point of their peak.
#
# Time is drawn on log2(1 + hours) (`time_axis`): a nascent time course is
# sampled every few minutes at the start and every day at the end, and a linear
# axis would crowd the early points into a few pixels.
#
# Routes: without the design table the metadata collection goes, and with it the
# group filter and colours. A run without its strand bedGraphs loses the binned
# collections, and with them the Genome signal and Signal dynamics tabs, their
# steps and their Findings rows; without the bigWigs the browser goes.
main_dashboard:
  title: nf-core/nascent
  subtitle: Nascent transcription over a time course, from run-on reads to responding genes
  project_tag: Nascent Transcription Time Course
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family: figures, advanced viz
  # and filter chips all colour a value the same way.
  category_colors:
    # The groups of a time course are its phases. They are pinned on the viridis ramp
    # the browser and the binned lanes colour a library by (the later, the darker), so
    # a group, a phase and a library share one time scale; any other group value takes
    # the palette.
    '{GROUP_COL}':
      '*': auto
      Baseline: '#440154'
      Early: '#3b528b'
      Mid: '#27a882'
      Late: '#bdde2e'
    # Response classes of a gene: warm when induced, cool when repressed, darker
    # the later the peak.
    response:
      Induced early: '#ffa94d'
      Induced mid: '#f76707'
      Induced late: '#c92a2a'
      Repressed early: '#74c0fc'
      Repressed mid: '#1c7ed6'
      Repressed late: '#364fc7'
      Stable: '#868e96'
    direction:
      Induced: '#e8590c'
      Repressed: '#1971c2'
      Stable: '#868e96'
    trend:
      Rising: '#e8590c'
      Falling: '#1971c2'
      Stable: '#868e96'
    # The phase of a time point (and of a peak), from the baseline on: the viridis
    # ramp of the browser and the lanes, one stop per phase.
    phase:
      Baseline: '#440154'
      Early: '#3b528b'
      Mid: '#27a882'
      Late: '#bdde2e'
    peak_phase:
      Early: '#3b528b'
      Mid: '#27a882'
      Late: '#bdde2e'
    comparison:
      Against the baseline: '#7048e8'
      Against the previous time point: '#12b886'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. All
  # three are bound to the sample hub, the source of every library and time
  # point link.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The libraries with their time point and QC, the table every tab filters through
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Libraries, below).
  - component_type: interactive
    workflow_tag: nascent
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Key figures
    tag: nc-ov-kf-group
    index: nc-ov-kf-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: nascent
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    order_by: time_order
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Library
    section: Key figures
    tag: nc-ov-kf-sample
    index: nc-ov-kf-sample
    title: Library
    layout: {x: 2, y: 0, w: 2, h: 1}
  # The pipeline's wordmark, read from its repository; where it cannot load (no
  # internet), the title is drawn as text.
  - component_type: text
    title: nf-core/nascent
    logo: https://raw.githubusercontent.com/nf-core/nascent/master/docs/images/nf-core-nascent_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/nascent/master/docs/images/nf-core-nascent_logo_dark.png
    order: 1
    body: >
      Run-on libraries of nascent RNA along a time course, counted over every gene and read as
      strand coverage along the genome: which genes change transcription, when, and how far each
      time point moves from the first. [Run parameters](params:)
    tag: nc-ov-hero
    index: nc-ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  # Who was sequenced, from the sample hub: each line cites it, so a line goes with
  # its data. The hub always holds the group column (the design's, else the phases of
  # the time course).
  - component_type: text
    surface: card
    values:
      libs: {dc: samples, column: sample, aggregation: nunique, format: integer}
      points: {dc: samples, column: time_point, aggregation: nunique, format: integer}
      last: {dc: samples, column: time_h, aggregation: max, format: "decimals:1"}
      groups: {dc: samples, column: '{GROUP_COL}', aggregation: nunique, format: integer}
    body: |
      ### The study
      - ![](icon:mdi:test-tube) **Libraries** {{libs}} of run-on RNA
      - ![](icon:mdi:chart-timeline-variant) **Time points** {{points}}, the baseline to {{last}} h
      - ![](icon:mdi:shape-outline) **Groups** {{groups}} to compare the time points by
      - ![](icon:mdi:file-table-outline) **Samplesheet** [one row per library](section:Sample sheet), its path in [the run parameters](params:input)
      - ![](icon:mdi:palette-outline) **{GROUP_COL_DISPLAY}** {{legend:{GROUP_COL}}}
    tag: nc-ov-study
    index: nc-ov-study
    layout: {x: 0, y: 1, w: 5, h: 5}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash.
  - component_type: text
    surface: card
    body: |
      ### The run
      - ![](icon:mdi:source-branch) **Pipeline** nf-core/nascent 2.3.0
      - ![](icon:mdi:flask-outline) **Assay** {{param:assay_type}}
      - ![](icon:mdi:dna) **Genome** {{param:genome}}
      - ![](icon:mdi:sort-variant) **Aligner** {{param:aligner}}
      - ![](icon:mdi:barcode) **UMIs** {{param:with_umi}}
      - ![](icon:mdi:tune) [All parameters and tool versions](params:)
    tag: nc-ov-run
    index: nc-ov-run
    layout: {x: 5, y: 1, w: 3, h: 5}
  # A step citing a value goes with its collection when the run lacks it.
  - component_type: text
    surface: card
    accent: green
    values:
      n_libs: {dc: samples, column: sample, aggregation: nunique, format: integer}
      n_genes: {dc: gene_dynamics, column: gene_id, aggregation: nunique, format: integer}
      n_windows: {dc: signal_window_dynamics, column: window_id, aggregation: nunique, format: integer}
      n_chrom: {dc: chromosome_signal, column: chromosome, aggregation: nunique, format: integer}
      n_points: {dc: samples, column: time_point, aggregation: nunique, format: integer}
    body: |
      ### Five steps from run-on reads to the time course
      Each step names its settings and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:filter-variant) **Prepare** Trim and check {{n_libs}} libraries with fastp and FastQC · [Settings](params:skip_trimming) · [Library QC](tab:Library QC)
      2. ![](icon:mdi:sort-variant) **Align** Each library to {{param:genome}} with {{param:aligner}} · [Settings](params:aligner) · [Library QC](tab:Library QC)
      3. ![](icon:mdi:counter) **Count** Reads over every gene body, {{n_genes}} genes expressed · [Gene dynamics](tab:Gene dynamics)
      4. ![](icon:mdi:waves) **Cover** Strand coverage of {{n_chrom}} chromosomes, binned into {{n_windows}} comparable windows · [Settings](params:genome) · [Genome signal](tab:Genome signal) · [Signal dynamics](tab:Signal dynamics)
      5. ![](icon:mdi:chart-timeline-variant) **Compare** {{n_points}} time points against the baseline · [Sample similarity](tab:Sample similarity)
      :::
    tag: nc-ov-steps
    index: nc-ov-steps
    layout: {x: 0, y: 6, w: 8, h: 3}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/nascent aligns each run-on library, counts its reads over every gene body and writes its coverage strand by strand. Each tab behind this page answers one question about the time course, against the earliest time point as the baseline.

      The sample filters in the left panel apply to every tab. A bar above a section narrows that section only. A library id is the sample name and its time point; the sheet of libraries, with their QC, is at the bottom of every tab.
    tag: nc-ov-about
    index: nc-ov-about
    layout: {x: 0, y: 9, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. The icon colour is that tab's colour.
  - component_type: card
    workflow_tag: nascent
    data_collection_tag: samples
    aggregation: count
    column_name: sample
    column_type: object
    secondary_layout: composition
    breakdown_col: '{GROUP_COL}'
    display:
      icon_name: mdi:test-tube
      icon_color: teal
      caption: libraries, by {GROUP_COL_DISPLAY}
      link: tab:Library QC
    section: Key figures
    tag: nc-ov-kf-libraries
    index: nc-ov-kf-libraries
    title: Libraries
    description: Run-on libraries of the run, one per samplesheet row. The bar splits them over the groups of the design.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nascent
    data_collection_tag: samples
    aggregation: sum
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: assigned_reads
    column_type: int64
    display:
      icon_name: mdi:counter
      icon_color: blue
      caption: reads in genes; the box spreads them over the libraries
      link: tab:Library QC
      format: si
    section: Key figures
    tag: nc-ov-kf-reads
    index: nc-ov-kf-reads
    title: Reads in genes
    description: Reads featureCounts counted over gene bodies, summed over the libraries in view.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nascent
    data_collection_tag: gene_dynamics
    aggregation: count
    column_name: gene_id
    column_type: object
    filter_expr: col('direction') != 'Stable'
    secondary_layout: donut
    breakdown_col: direction
    display:
      icon_name: mdi:chart-timeline-variant
      icon_color: grape
      caption: genes, induced and repressed
      link: tab:Gene dynamics
    section: Key figures
    tag: nc-ov-kf-responsive
    index: nc-ov-kf-responsive
    title: Responsive genes
    description: Genes whose transcription changes by a log2 fold change of 1 against the baseline at two time points or more.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nascent
    data_collection_tag: samples
    aggregation: median
    column_name: strand_skew_pct
    column_type: float64
    filter_expr: col('total_read_bases') > 0
    secondary_layout: threshold
    threshold_value: 10
    threshold_direction: max
    threshold_warn: 15
    display:
      icon_name: mdi:scale-balance
      icon_color: indigo
      caption: libraries within 10 points of an even strand split
      link: tab:Library QC
      decimals: 1
    section: Key figures
    tag: nc-ov-kf-strand
    index: nc-ov-kf-strand
    title: Strand skew (points)
    description: How far a library's plus-strand share sits from half, median over the libraries in view. Genes sit on both strands, so within 10 points (40 to 60%) reads as balanced, and past 15 a library has lost one strand.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the group, then the library.
  - component_type: interactive
    workflow_tag: nascent
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Findings
    tag: nc-ov-findings-group
    index: nc-ov-findings-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: nascent
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    order_by: time_order
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Library
    section: Findings
    tag: nc-ov-findings-sample
    index: nc-ov-findings-sample
    title: Library
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per analysis tab, each citing one data collection, so the
  # import removes a row with its data. Every row states a measure and lets the
  # value fill in.
  - component_type: text
    surface: card
    values:
      n_up: {dc: gene_dynamics, column: gene_id, aggregation: count, filter_expr: "col('direction') == 'Induced'", format: integer}
      n_down: {dc: gene_dynamics, column: gene_id, aggregation: count, filter_expr: "col('direction') == 'Repressed'", format: integer}
      pc1_var: {dc: sample_similarity, column: pc1_variance, aggregation: max, format: 'decimals:0'}
      top_chr: {dc: chromosome_signal, column: chromosome, aggregation: top, weight: abs_log2_ratio}
      n_rise: {dc: signal_window_dynamics, column: window_id, aggregation: count, filter_expr: "col('trend') == 'Rising'", format: integer}
      n_fall: {dc: signal_window_dynamics, column: window_id, aggregation: count, filter_expr: "col('trend') == 'Falling'", format: integer}
      top_gene: {dc: gene_dynamics, column: gene_id, aggregation: top, weight: abs_peak_log2fc}
    body: |
      - **{{n_up}}** genes induced and **{{n_down}}** repressed – a log2 fold change of 1 against the baseline at two time points or more [Gene dynamics](tab:Gene dynamics)
      - **{{pc1_var}}%** of the variance between libraries lies on the first component – in a time course, usually the time axis itself [Sample similarity](tab:Sample similarity)
      - **{{top_chr}}** moves its share of the nascent signal most over the time course – a chromosome that gains or loses share against its baseline carries a large response or a hotspot [Genome signal](tab:Genome signal)
      - **{{n_rise}}** windows rise and **{{n_fall}}** fall – the same rule on the strand coverage, without a gene annotation [Signal dynamics](tab:Signal dynamics)
      - The most responsive gene is [{{top_gene}}](locus:{{top_gene}}): its nascent signal along the time course in the genome browser
    section: Findings
    tag: nc-ov-findings
    index: nc-ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per analysis tab, in the order of the rows above. The tiles of
  # a row share a stored height.
  - component_type: highlight
    section: Findings
    source_tab: Gene dynamics
    source_component: gd-av-response
    caption: Median change of each response class against the baseline, with its band; warm classes are induced, cool ones repressed.
    hide_legend: true
    tag: nc-ov-hl-response
    index: nc-ov-hl-response
    layout: {x: 0, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Sample similarity
    source_component: ss-av-embedding
    caption: PCA of the libraries (PC1 against PC2), one point per library, coloured by its phase of the time course; the points move along the first component with time.
    hide_legend: true
    tag: nc-ov-hl-embedding
    index: nc-ov-hl-embedding
    layout: {x: 4, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Genome signal
    source_component: gs-fig-chromosomes
    caption: Each chromosome's share of the signal against its own baseline share, per time point; red rows gain share, blue rows lose it, and a row that moves carries a response or a hotspot.
    tag: nc-ov-hl-chromosomes
    index: nc-ov-hl-chromosomes
    layout: {x: 0, y: 6, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Signal dynamics
    source_component: sd-av-trends
    caption: Median change of the rising, falling and stable windows against the baseline, with its band.
    hide_legend: true
    tag: nc-ov-hl-trends
    index: nc-ov-hl-trends
    layout: {x: 4, y: 6, w: 4, h: 4}
  # The expressed genes along the genome, opened on the chromosome or region they
  # cover: a click opens the Genome signal tab's browser on the gene, so the
  # Overview needs no browser of its own.
  - component_type: advanced_viz
    workflow_tag: nascent
    data_collection_tag: gene_dynamics
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      chr_col: chromosome
      pos_col: start
      end_col: end
      score_col: abs_peak_log2fc
      feature_col: gene_id
      category_col: direction
      mark: point
      point_size: 9
      score_title: Peak change (absolute log2 fold change)
      assembly: '{GENOME}'
      region_filter_enabled: false
      click_opens_browser: true
      open_on_data: true
    section: Findings
    tag: nc-ov-genome
    index: ov-genome
    title: Responsive genes along the genome
    link: tab:Genome signal
    description: >-
      Which expressed genes respond, and where do they sit on the genome? Each dot is an expressed gene
      placed at its start, its height the largest absolute change of its transcription against the
      baseline at any time point, its colour whether it is induced, repressed or stable. Click a dot to
      open the gene in the genome browser.

      How to read: a run of tall dots of one colour in one region points at a regional response, while an
      isolated tall dot is a single gene to open in the browser. Dots near the floor are genes that barely
      move. Open [Gene dynamics](tab:Gene dynamics) to read the curve of a gene before trusting its colour.

      Annotations: no reference line is drawn. The colour follows the direction call: a gene is induced or
      repressed when its largest change reaches a log2 fold change of 1 (two-fold) and at least two time
      points change that much the same way, otherwise stable.

      Source: counts from featureCounts (Liao et al. 2014, doi:10.1093/bioinformatics/btt656), as written
      by nf-core/nascent, https://nf-co.re/nascent/2.3.0/docs/output

      Note: the two-fold, two-time-point rule is a fixed convention of this template, not a validated
      cut-off, and the calls are a fold-change rule rather than a statistical test.
    layout: {x: 0, y: 10, w: 8, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers.
  - component_type: text
    body: |
      ### Data & QC
      - [Library QC](tab:Library QC)

      ### Time course
      - [Gene dynamics](tab:Gene dynamics)
      - [Sample similarity](tab:Sample similarity)
      - [Genome signal](tab:Genome signal)
      - [Signal dynamics](tab:Signal dynamics)
    section: How to read this dashboard
    tag: nc-ov-how-to-read
    index: nc-ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the group first.
  - component_type: interactive
    workflow_tag: nascent
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: nc-filter-group
    index: sample-filters-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nascent
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    order_by: time_order
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: nc-filter-sample
    index: sample-filters-sample
    title: Library
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nascent
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: time_point
    column_type: object
    order_by: time_order
    display:
      icon_name: mdi:chart-timeline-variant
      custom_color: cyan
    section: Sample filters
    group: Sample scope
    tag: nc-filter-time
    index: sample-filters-time
    title: Time point
    layout: {x: 0, y: 6, w: 1, h: 3}
  # Row selection feeds the Analysis panel.
  - component_type: table
    workflow_tag: nascent
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample
    section: Sample sheet
    tag: nc-sheet-samples
    index: nc-sheet-samples
    title: Libraries
    description: >-
      One row per library with its time point, the design columns and its QC measures. Ticking rows
      narrows every tab to those libraries.

      How to read: sort a QC column to find the libraries that stand out, then tick them to follow the
      same libraries in every tile. The measures are the ones plotted in [Library QC](tab:Library QC):
      reads in genes, genes detected, the share of the 100 most counted genes, the plus-strand share and
      its distance from half, and the mitochondrial, off-chromosome and hotspot shares.

      Source: gene counts from featureCounts (Liao et al. 2014, doi:10.1093/bioinformatics/btt656) and
      strand coverage from bedtools genomecov, as written by nf-core/nascent,
      https://nf-co.re/nascent/2.3.0/docs/output
    layout: {x: 0, y: 0, w: 8, h: 6}

tabs:
# =========================================================================
# Data & QC
# =========================================================================
- title: Library QC
  subtitle: Does each library have the depth and balance to be read?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: mdi:shield-check-outline
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Library scope
    icon: mdi:tune
    color: blue
    description: Keep libraries inside a depth or hotspot band
  grid_sections:
  - name: Libraries at a glance
    icon: mdi:counter
    color: blue
    description: Depth, genes detected, strand balance and hotspots over the libraries
  - name: Depth and complexity
    icon: mdi:chart-bar
    color: blue
    description: Reads in genes per library, and the genes detected in each
  - name: Strand and hotspots
    icon: mdi:scale-balance
    color: blue
    description: Strand balance per time point, and where the signal outside genes goes
  - name: Library tables
    icon: mdi:table
    color: gray
    description: Gene-count summary and strand coverage totals per library
    collapsed: true
  components:
  - component_type: interactive
    workflow_tag: nascent
    data_collection_tag: subread_library_summary
    interactive_component_type: RangeSlider
    column_name: assigned_reads
    column_type: int64
    display:
      icon_name: mdi:counter
      custom_color: blue
    placement: left
    section: Library scope
    group: Libraries
    tag: nc-qc-filter-reads
    index: nc-qc-reads-range
    title: Reads in genes
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nascent
    data_collection_tag: bedtools_strand_summary
    interactive_component_type: RangeSlider
    column_name: hotspot_share_pct
    column_type: float64
    display:
      icon_name: mdi:alert-outline
      custom_color: orange
    placement: left
    section: Library scope
    group: Libraries
    tag: nc-qc-filter-hotspot
    index: nc-qc-hotspot-range
    title: Signal in hotspot windows (%)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: text
    order: 1
    body: >
      Each library is checked on what the run publishes: the reads [featureCounts](https://subread.sourceforge.net/featureCounts.html)
      counted over gene bodies, and the strand coverage
      [bedtools genomecov](https://bedtools.readthedocs.io/en/latest/content/tools/genomecov.html) wrote. A
      library short of reads, far from an even strand split (more than 10 points from half), or holding
      much of its signal in a few hotspot windows (the busiest 1% of 250 kb windows: ribosomal DNA, poor
      depletion) reads its genes from what is left. Bars wear the colour of their time point, as the
      browser's tracks and the lanes do.
    tag: nc-qc-intro
    index: nc-qc-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    workflow_tag: nascent
    data_collection_tag: samples
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: assigned_reads
    column_type: int64
    display:
      icon_name: mdi:counter
      icon_color: blue.4
      caption: median reads, with their spread
      format: si
    section: Libraries at a glance
    tag: nc-qc-card-reads
    index: nc-qc-card-reads
    title: Reads in genes per library
    description: Median reads counted over gene bodies per library. The box shows how the depth spreads over the libraries.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nascent
    data_collection_tag: samples
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: histogram
    column_name: genes_detected
    column_type: int64
    display:
      icon_name: mdi:dna
      icon_color: blue.6
      caption: libraries by genes detected
    section: Libraries at a glance
    tag: nc-qc-card-genes
    index: nc-qc-card-genes
    title: Genes detected
    description: Genes with at least 10 reads in a library, median over the libraries in view.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nascent
    data_collection_tag: samples
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: top100_share_pct
    column_type: float64
    filter_expr: col('assigned_reads') > 0
    display:
      icon_name: mdi:format-list-numbered
      icon_color: blue.8
      caption: median share held by the 100 most counted genes, with its spread
      decimals: 1
    section: Libraries at a glance
    tag: nc-qc-card-top100
    index: nc-qc-card-top100
    title: Top-100 genes share (%)
    description: Share of a library's gene reads held by its 100 most counted genes, median over the libraries in view. A high share means a few genes (histones, ribosomal proteins) swamp the library.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nascent
    data_collection_tag: samples
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: hotspot_share_pct
    column_type: float64
    filter_expr: col('total_read_bases') > 0
    display:
      icon_name: mdi:alert-outline
      icon_color: blue.9
      caption: median share in the top 1% of windows, with its spread
      decimals: 1
    section: Libraries at a glance
    tag: nc-qc-card-hotspot
    index: nc-qc-card-hotspot
    title: Signal in hotspots (%)
    description: Share of a library's chromosome signal held by its busiest 1% of 250 kb windows (hotspot windows, where the ribosomal DNA arrays sit), median over the libraries in view.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: nascent
    data_collection_tag: samples
    visu_type: bar
    mode: code
    code_content: |-
      # Reads in genes per library, in time order. Each bar wears the colour the browser
      # and the binned lanes give its time point along the viridis ramp; Analysis mode's
      # groups take over when it has some. The median is dashed, half of it dotted.
      stops = ['#440154', '#472d7b', '#3b528b', '#2c728e', '#21918c', '#28ae80', '#5ec962', '#addc30', '#fde725']
      d = df.filter(pl.col('assigned_reads').is_not_null()).sort(['time_order', 'sample'], nulls_last=True)
      pts = d.select('time_point', 'time_order').unique().sort('time_order', nulls_last=True)['time_point'].to_list()
      ts = [i / (len(pts) - 1) for i in range(len(pts))] if len(pts) > 1 else [0.5]
      colors = dict(zip(pts, px.colors.sample_colorscale(stops, ts)))
      by = 'time_point'
      if depictio_group_by and depictio_group_by[0] in d.columns:
          by = depictio_group_by[0]
          colors = depictio_group_kwargs.get('color_discrete_map') or {}
      fig = px.bar(d.to_pandas(), x='sample', y='assigned_reads', color=by, color_discrete_map=colors, category_orders={'sample': d['sample'].to_list()}, hover_data=['time_point'], labels={'sample': '', 'assigned_reads': 'Reads in genes', 'time_point': 'Time point', by: ''})
      if not d.is_empty():
          med = d['assigned_reads'].median()
          fig.add_hline(y=med, line_dash='dash', line_color='gray', annotation_text='median', annotation_position='top left')
          fig.add_hline(y=med / 2, line_dash='dot', line_color='gray', annotation_text='half the median', annotation_position='bottom left')
      fig.update_layout(margin=dict(t=10), showlegend=(by != 'time_point'))
      fig.update_xaxes(tickangle=-45, automargin=True)
    section: Depth and complexity
    tag: nc-qc-fig-reads
    index: nc-qc-fig-reads
    title: Reads in genes per library
    description: >-
      Does each library have the depth to be read? One bar per library, in time order, is the number of
      reads featureCounts assigned to gene bodies, in the colour of its time point (or of its group when
      the analysis groups are on).

      How to read: bars of similar height are libraries of comparable depth. A bar under the dotted line
      reads its genes from under half the typical depth, so its fold changes are less reliable. Check its
      genes detected beside it and its strand and hotspot shares before keeping it.

      Lines and annotations: the dashed grey line, labelled median, is the median reads in genes of the
      libraries in view. The dotted grey line, labelled half the median, sits at half of that. Both are
      read from the data on display; the half-median line is a display aid.

      Source: featureCounts (Liao et al. 2014, doi:10.1093/bioinformatics/btt656), as written by
      nf-core/nascent, https://nf-co.re/nascent/2.3.0/docs/output

      Note: nf-core/nascent and featureCounts publish no minimum depth for a run-on library, so a bar
      under the dotted line is a lead and not a failed library.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: nascent
    data_collection_tag: samples
    visu_type: bar
    mode: code
    selection_enabled: true
    selection_column: sample
    code_content: |-
      # Genes detected per library, one bar per library in time order and in the colour of its time point (the ramp of the browser and the lanes), with the median as a dashed line; the reads in genes are in the hover.
      stops = ['#440154', '#472d7b', '#3b528b', '#2c728e', '#21918c', '#28ae80', '#5ec962', '#addc30', '#fde725']
      d = df.filter(pl.col('genes_detected').is_not_null()).sort(['time_order', 'sample'], nulls_last=True)
      pts = d.select('time_point', 'time_order').unique().sort('time_order', nulls_last=True)['time_point'].to_list()
      ts = [i / (len(pts) - 1) for i in range(len(pts))] if len(pts) > 1 else [0.5]
      fig = px.bar(d.to_pandas(), x='sample', y='genes_detected', color='time_point', color_discrete_map=dict(zip(pts, px.colors.sample_colorscale(stops, ts))), category_orders={'sample': d['sample'].to_list()}, hover_data=['time_point', 'assigned_reads'], custom_data=['sample'], labels={'genes_detected': 'Genes detected (10 reads)', 'sample': '', 'assigned_reads': 'Reads in genes', 'time_point': 'Time point'})
      if not d.is_empty():
          fig.add_hline(y=d['genes_detected'].median(), line_dash='dash', line_color='gray', annotation_text='median', annotation_position='top left')
      fig.update_xaxes(tickangle=-45, automargin=True)
      fig.update_layout(margin=dict(t=10), showlegend=False)
    section: Depth and complexity
    tag: nc-qc-fig-depth-genes
    index: nc-qc-fig-depth-genes
    title: Genes detected per library
    description: >-
      Does each library detect as many genes as the others? One bar per library, in time order and in the
      colour of its time point, is the number of genes with at least 10 assigned reads. The reads in genes
      are in the hover; click a bar to narrow the other tiles.

      How to read: bars near the line are libraries of comparable complexity. A bar well below it detects
      fewer genes, because the library is shallow or a few genes take its reads. Compare it with the reads
      in genes beside it before deciding which of the two it is.

      Lines and annotations: the dashed grey line, labelled median, is the median genes detected of the
      libraries in view, read from the data. The detection floor of 10 reads is a fixed constant of this
      template.

      Source: featureCounts (Liao et al. 2014, doi:10.1093/bioinformatics/btt656), as written by
      nf-core/nascent, https://nf-co.re/nascent/2.3.0/docs/output

      Note: the median is a reference drawn from the data and not a cut-off; nf-core/nascent publishes no
      minimum number of genes detected, and the 10-read floor is not a published threshold.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: nascent
    data_collection_tag: samples
    visu_type: bar
    mode: code
    code_content: |-
      # Plus-strand share per library, in time order and in the colour of its time point (Analysis mode's groups take over when it has some), with the balanced band (40 to 60%) shaded and the even split marked.
      stops = ['#440154', '#472d7b', '#3b528b', '#2c728e', '#21918c', '#28ae80', '#5ec962', '#addc30', '#fde725']
      d = df.filter(pl.col('plus_share_pct').is_not_null()).sort(['time_order', 'sample'], nulls_last=True)
      pts = d.select('time_point', 'time_order').unique().sort('time_order', nulls_last=True)['time_point'].to_list()
      ts = [i / (len(pts) - 1) for i in range(len(pts))] if len(pts) > 1 else [0.5]
      colors = dict(zip(pts, px.colors.sample_colorscale(stops, ts)))
      by = 'time_point'
      if depictio_group_by and depictio_group_by[0] in d.columns:
          by = depictio_group_by[0]
          colors = depictio_group_kwargs.get('color_discrete_map') or {}
      fig = px.bar(d.to_pandas(), x='sample', y='plus_share_pct', color=by, color_discrete_map=colors, category_orders={'sample': d['sample'].to_list()}, hover_data=['time_point'], labels={'sample': '', 'plus_share_pct': 'Plus-strand share (%)', 'time_point': 'Time point', by: ''})
      fig.add_hrect(y0=40, y1=60, fillcolor='gray', opacity=0.14, line_width=0, layer='below')
      fig.add_hline(y=50, line_dash='dot', line_color='gray')
      fig.add_annotation(x=0, y=96, xref='paper', yref='y', text='shaded: balanced split, 40 to 60%', showarrow=False, xanchor='left', yanchor='top')
      fig.update_layout(yaxis_range=[0, 100], margin=dict(t=10), showlegend=(by != 'time_point'))
      fig.update_xaxes(tickangle=-45, automargin=True)
    section: Strand and hotspots
    tag: nc-qc-fig-strand
    index: nc-qc-fig-strand
    title: Plus-strand share per library
    description: >-
      Are both strands represented in each library? One bar per library, in time order and in the colour
      of its time point (or of its group), is the share of the signal on the plus strand, from 0 to 100%.

      How to read: genes lie on both strands, so the reads are expected to split about evenly and a bar in
      the shaded band reads as balanced. A bar outside the band has one strand over-represented, which
      points at a protocol or library-strandedness problem. Open the bigWigs in [Genome signal](tab:Genome signal)
      to see which strand is thin.

      Lines and annotations: the dotted grey line at 50% is the even split between the strands. The grey
      band from 40% to 60%, labelled balanced split, is 10 points either side of the even split, the same
      distance the Strand skew card uses.

      Source: strand coverage from bedtools genomecov,
      https://bedtools.readthedocs.io/en/latest/content/tools/genomecov.html; neither it nor the
      nf-core/nascent output documentation, https://nf-co.re/nascent/2.3.0/docs/output, gives a strand
      balance criterion.

      Note: the 40 to 60% band is a display aid and not a validated cut-off, so a bar outside it is a lead
      to check and not a failed library.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: nascent
    data_collection_tag: samples
    visu_type: bar
    mode: code
    code_content: |-
      # Where the signal goes outside the gene bodies: the busiest windows, the
      # contigs outside the chromosomes and the mitochondrion, per library.
      names = {'hotspot_share_pct': 'Top 1% of windows', 'off_main_pct': 'Outside the chromosomes', 'mito_pct': 'Mitochondrion'}
      d = df.filter(pl.col('total_read_bases').is_not_null()).sort(['time_order', 'sample'], nulls_last=True)
      long = d.unpivot(index=['sample', 'time_point'], on=list(names), variable_name='measure', value_name='share').with_columns(pl.col('measure').replace(names))
      fig = px.bar(long.to_pandas(), x='sample', y='share', color='measure', barmode='group', category_orders={'sample': d['sample'].to_list(), 'measure': list(names.values())}, hover_data=['time_point'], labels={'sample': '', 'share': 'Share of the signal (%)', 'measure': ''})
      fig.update_layout(margin=dict(t=10), legend=dict(orientation='h', y=-0.35))
      fig.update_xaxes(tickangle=-45, automargin=True)
    section: Strand and hotspots
    tag: nc-qc-fig-hotspots
    index: nc-qc-fig-hotspots
    title: Signal in hotspots and off the chromosomes
    description: >-
      Where does the signal go outside the gene bodies? Three bars per library, in time order, give the
      share of its chromosome signal held by the busiest 1% of 250 kb windows, and the shares of its whole
      signal that fall outside the chromosomes and on the mitochondrion.

      How to read: three low bars mean the signal sits on the chromosomes and is spread over many windows.
      A tall first bar is a library dominated by a few hotspot windows, where the ribosomal DNA arrays
      sit, so the rest of the genome is read from what is left. A tall third bar is depth spent on the
      mitochondrion, which says nothing about nuclear genes.

      Source: strand coverage from bedtools genomecov,
      https://bedtools.readthedocs.io/en/latest/content/tools/genomecov.html

      Note: no reference line is drawn because none is published for these shares; the 1% and the 250 kb
      window width are fixed choices of this template.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: table
    workflow_tag: nascent
    data_collection_tag: subread_library_summary
    use: subread/library_summary
    row_selection_enabled: true
    row_selection_column: sample
    section: Library tables
    tag: nc-qc-table-counts
    index: nc-qc-table-counts
    title: Gene-count summary per library
    description: >-
      Reads counted over genes, genes detected and the share of the 100 most counted genes, one row per
      library.

      How to read: sort by reads in genes to rank the libraries by depth, and by the top-100 share to find
      libraries that a few genes swamp. Ticking a row narrows the other tiles to that library.

      Source: featureCounts (Liao et al. 2014, doi:10.1093/bioinformatics/btt656), as written by
      nf-core/nascent, https://nf-co.re/nascent/2.3.0/docs/output
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: nascent
    data_collection_tag: bedtools_strand_summary
    use: bedtools/strand_summary
    row_selection_enabled: true
    row_selection_column: sample
    section: Library tables
    tag: nc-qc-table-strand
    index: nc-qc-table-strand
    title: Strand coverage totals per library
    description: >-
      Read bases per strand, covered bases, deepest base and the plus-strand, mitochondrial,
      off-chromosome and hotspot shares, one row per library.

      How to read: the plus and minus read bases show whether a library is balanced between the strands,
      and the three shares tell where its signal goes outside the gene bodies, as plotted in the figures
      above. Ticking a row narrows the other tiles to that library.

      Source: strand coverage from bedtools genomecov,
      https://bedtools.readthedocs.io/en/latest/content/tools/genomecov.html
    layout: {x: 0, y: 6, w: 8, h: 6}

# =========================================================================
# Time course
# =========================================================================
- title: Gene dynamics
  subtitle: Which genes change transcription over the time course, and when?
  tab_group: Time course
  tab_order: 2
  tab_icon: mdi:chart-timeline-variant
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Gene scope
    icon: mdi:tune
    color: grape
    description: Narrow the genes by the size of their change or their level; every tile of the tab follows
  grid_sections:
  - name: Genes at a glance
    icon: mdi:counter
    color: grape
    description: Genes tested, induced and repressed, and the size of their change
  - name: Response over time
    icon: mdi:chart-line
    color: grape
    description: The typical course of each response class, and the genes that move most
  - name: Most dynamic genes
    icon: mdi:chart-box-outline
    color: grape
    description: The forty genes that change most, one row each, in time order
  - name: Gene tables
    icon: mdi:table
    color: gray
    description: The call of every expressed gene, and its value at every time point
    collapsed: true
  components:
  - component_type: interactive
    workflow_tag: nascent
    data_collection_tag: gene_dynamics
    interactive_component_type: RangeSlider
    column_name: abs_peak_log2fc
    column_type: float64
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: grape
    placement: left
    section: Gene scope
    group: Genes
    tag: nc-gd-filter-change
    index: nc-gd-change-range
    title: Peak change (absolute log2 fold change)
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nascent
    data_collection_tag: gene_dynamics
    interactive_component_type: RangeSlider
    column_name: mean_log2_cpm
    column_type: float64
    display:
      icon_name: mdi:counter
      custom_color: blue
    placement: left
    section: Gene scope
    group: Genes
    tag: nc-gd-filter-level
    index: nc-gd-level-range
    title: Mean level (log2 CPM)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: text
    order: 1
    body: >
      A run-on library counts transcription while it happens, so a gene's
      [featureCounts](https://nf-co.re/nascent/2.3.0/docs/output) count at a time point is its rate then.
      Each expressed gene is compared with the baseline, the earliest time point: induced or repressed
      when its log2 fold change reaches 1 at two time points or more, and classed by the phase of its
      peak. The curves are drawn on log2 of one plus the hours, so the first minutes keep their room, and without
      replicates the calls are a fold-change rule rather than a test: read a gene's curve before trusting its class.
    tag: nc-gd-intro
    index: nc-gd-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    workflow_tag: nascent
    data_collection_tag: gene_dynamics
    aggregation: count
    column_name: gene_id
    column_type: object
    secondary_layout: donut
    breakdown_col: direction
    display:
      icon_name: mdi:dna
      icon_color: grape.4
      caption: genes, by the direction of their change
    section: Genes at a glance
    tag: nc-gd-card-tested
    index: nc-gd-card-tested
    title: Expressed genes
    description: Genes with at least 10 reads in half of the libraries, the genes the time course is read on.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nascent
    data_collection_tag: gene_dynamics
    aggregation: count
    column_name: gene_id
    column_type: object
    filter_expr: col('direction') == 'Induced'
    secondary_layout: composition
    breakdown_col: peak_phase
    display:
      icon_name: mdi:trending-up
      icon_color: grape.6
      caption: induced genes, by the phase of their peak
    section: Genes at a glance
    tag: nc-gd-card-induced
    index: nc-gd-card-induced
    title: Induced genes
    description: Genes up by a log2 fold change of 1 against the baseline at two time points or more.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nascent
    data_collection_tag: gene_dynamics
    aggregation: count
    column_name: gene_id
    column_type: object
    filter_expr: col('direction') == 'Repressed'
    secondary_layout: composition
    breakdown_col: peak_phase
    display:
      icon_name: mdi:trending-down
      icon_color: grape.8
      caption: repressed genes, by the phase of their dip
    section: Genes at a glance
    tag: nc-gd-card-repressed
    index: nc-gd-card-repressed
    title: Repressed genes
    description: Genes down by a log2 fold change of 1 against the baseline at two time points or more.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nascent
    data_collection_tag: gene_dynamics
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: abs_peak_log2fc
    column_type: float64
    filter_expr: col('direction') != 'Stable'
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: grape.9
      caption: median over the responsive genes, with its spread
      decimals: 2
    section: Genes at a glance
    tag: nc-gd-card-change
    index: nc-gd-card-change
    title: Peak change (log2)
    description: Absolute log2 fold change of a responsive gene at its peak, median over the genes in view.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: nascent
    data_collection_tag: gene_trajectories
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: response
      x_col: time_axis
      y_col: log2fc
      # One row per gene and time point: the median and quartiles are taken
      # over the genes the filters leave, so the curves follow them.
      aggregate: median_iqr
      reference_x: 0
      reference_label: Baseline
      x_title: Time, log2(1 + hours)
      y_title: log2 fold change against the baseline
      band_opacity: 0.15
      legend_pos: bottom
    section: Response over time
    tag: nc-gd-av-response
    index: gd-av-response
    title: Response classes over time
    description: >-
      What does a typical gene of each response class do over time? Each curve is the median log2 fold
      change against the baseline of the genes of one class at each time point, with a band from the first
      to the third quartile of those genes. The x axis is log2(1 + hours).

      How to read: warm curves above zero are induced classes and cool curves below zero repressed ones,
      darker the later the peak. A narrow band means the genes of a class move together, a wide one that
      the median hides very different curves. Read the genes behind a class in the next tile and in the
      calls table below.

      Lines and annotations: the dotted vertical line, labelled Baseline, marks the baseline time point,
      where every fold change is 0 by construction. The band is the interquartile range of the genes in
      view, computed after the gene filters. A gene is induced or repressed when its largest change reaches
      a log2 fold change of 1 and at least two time points change that much the same way; the class adds
      the phase of the peak, the early, mid or late third of the later time points.

      Source: counts from featureCounts (Liao et al. 2014, doi:10.1093/bioinformatics/btt656), as written
      by nf-core/nascent, https://nf-co.re/nascent/2.3.0/docs/output

      Note: the two-fold, two-time-point rule and the tertile phases are fixed conventions of this
      template, not validated cut-offs, and the calls are a fold-change rule rather than a statistical
      test.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: figure
    workflow_tag: nascent
    data_collection_tag: top_gene_trajectories
    visu_type: line
    mode: code
    code_content: |-
      # The responsive genes with the largest change at their peak, one curve each, in the
      # colour of their response class (the one every other tile of the tab uses); the gene is
      # named at the end of its curve and in the hover. Time is log-spaced, labelled by time point.
      colors = depictio_category_colors.get('response') or {}
      d = df.sort(['gene_id', 'time_order'])
      pts = d.select('time_point', 'time_axis', 'time_order').unique().sort('time_order')
      last = d.sort('time_order').group_by('gene_id', maintain_order=True).last()
      fig = px.line(d.to_pandas(), x='time_axis', y='log2fc', color='response', line_group='gene_id', hover_name='gene_id', hover_data={'time_point': True, 'time_axis': False}, markers=True, color_discrete_map=colors, labels={'time_axis': 'Time', 'log2fc': 'log2 fold change against the baseline', 'time_point': 'Time point', 'response': ''})
      fig.update_traces(showlegend=False)
      for r in d.select('response').unique().sort('response')['response'].to_list():
          fig.add_trace(go.Scatter(x=[None], y=[None], mode='lines', name=r, legendgroup=r, line=dict(color=colors.get(r))))
      fig.add_trace(go.Scatter(x=last['time_axis'].to_list(), y=last['log2fc'].to_list(), mode='text', text=last['gene_id'].to_list(), textposition='middle right', showlegend=False, hoverinfo='skip'))
      fig.add_hline(y=0, line_dash='dot', line_color='gray', annotation_text='Baseline', annotation_position='bottom left')
      fig.update_xaxes(tickmode='array', tickvals=pts['time_axis'].to_list(), ticktext=pts['time_point'].to_list(), title_text='Time point (log-spaced)', range=[-0.3, pts['time_axis'].max() + 1.3])
      fig.update_layout(margin=dict(t=10), legend=dict(orientation='h', y=-0.25))
    section: Response over time
    tag: nc-gd-av-top-genes
    index: gd-av-top-genes
    title: The ten genes that move most
    description: >-
      Which individual genes move most, and how? Each curve is one of the ten responsive genes with the
      largest absolute change at their peak, in the colour of its response class, with the gene named at
      the end of the curve and in the hover. The x axis has one tick per time point, spaced on log2(1 +
      hours); the gene filters keep those of the ten in scope.

      How to read: a curve that rises then falls is a transient response, one that keeps climbing or
      dropping a sustained response. Curves of one colour that overlap are genes with the same course. Open
      a gene in the genome browser of [Genome signal](tab:Genome signal) to check the signal itself.

      Lines and annotations: the dotted horizontal line at 0, labelled Baseline, is no change against the
      baseline time point. The ten genes are the responsive genes with the largest absolute peak change
      among those transcribed at a usable level at the baseline or at the peak, which the recipe sets at 3
      on the log2 CPM scale (about 7 counts per million). That level floor and the choice of ten genes are
      fixed constants of this template.

      Source: counts from featureCounts (Liao et al. 2014, doi:10.1093/bioinformatics/btt656), as written
      by nf-core/nascent, https://nf-co.re/nascent/2.3.0/docs/output

      Note: the level floor is not a validated cut-off; it keeps a gene going from no reads to a few off
      the list.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: nascent
    data_collection_tag: top_gene_heatmap
    viz_kind: complex_heatmap
    config:
      viz_kind: complex_heatmap
      index_column: gene_id
      row_annotation_cols: [response]
      # Rows z-scored so a row reads as when the gene is high, not how high;
      # columns stay in time order.
      normalize: row_z
      cluster_rows: true
      cluster_cols: false
      cluster_method: average
      cluster_metric: correlation
      colorscale: RdBu_r
    section: Most dynamic genes
    tag: nc-gd-av-heatmap
    index: gd-av-heatmap
    title: Transcription of the forty most dynamic genes
    description: >-
      Do the most dynamic genes share a course? Each row is one of the forty responsive genes with the
      largest absolute peak change, each column a time point in time order, and each cell the gene's log2
      CPM there, z-scored per row. The gene filters keep the rows in scope.

      How to read: red cells are the time points where a gene is highest and blue where it is lowest, so a
      row reads as when the gene is on and not how much. Rows clustered together share a shape, and a
      block of red moving to the right is a wave of genes switched on at the same time. The size of each
      gene's change is in the calls table below.

      Annotations: each row is z-scored, so 0 is the gene's own mean across the time points, red above it
      and blue below. Rows are clustered with average linkage on a correlation distance; columns keep their
      time order and are not clustered. The row strip is the gene's response class, and the forty genes are
      selected as in the curves above, with the same level floor of 3 on the log2 CPM scale at the
      baseline or at the peak.

      Source: counts from featureCounts (Liao et al. 2014, doi:10.1093/bioinformatics/btt656), as written
      by nf-core/nascent, https://nf-co.re/nascent/2.3.0/docs/output

      Note: the level floor and the choice of forty genes are fixed constants of this template, not
      validated cut-offs.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: nascent
    data_collection_tag: gene_dynamics
    columns: [gene_id, chromosome, start, end, strand, response, peak_log2fc, peak_time_point, n_changed, baseline_log2_cpm, mean_log2_cpm, last_log2fc, rank]
    section: Gene tables
    tag: nc-gd-table-calls
    index: nc-gd-table-calls
    title: Call per expressed gene
    description: >-
      The peak change, its time point, the time points changed and the response class of every expressed
      gene, largest change first.

      How to read: peak_log2fc is the largest change against the baseline and peak_time_point where it
      happens. n_changed counts the time points that changed by a log2 fold change of 1 in the peak's
      direction, and response combines the direction with the phase of the peak. Sort or filter a column
      to list the genes of one class.

      Source: counts from featureCounts (Liao et al. 2014, doi:10.1093/bioinformatics/btt656), as written
      by nf-core/nascent, https://nf-co.re/nascent/2.3.0/docs/output

      Note: the response class is a fold-change rule rather than a statistical test, and its two-fold,
      two-time-point cut is a fixed convention of this template.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: nascent
    data_collection_tag: gene_trajectories
    section: Gene tables
    tag: nc-gd-table-trajectories
    index: nc-gd-table-trajectories
    title: Gene value per time point
    description: >-
      Mean log2 CPM and log2 fold change against the baseline of every expressed gene at every time
      point, one row per gene and time point.

      How to read: filter the table on one gene to read its whole course, where the fold change is 0 at
      the baseline by construction. Libraries sharing a time point are averaged before the change is
      taken.

      Source: counts from featureCounts (Liao et al. 2014, doi:10.1093/bioinformatics/btt656), as written
      by nf-core/nascent, https://nf-co.re/nascent/2.3.0/docs/output
    layout: {x: 0, y: 6, w: 8, h: 6}

- title: Sample similarity
  subtitle: How far has each time point moved from the baseline?
  tab_group: Time course
  tab_order: 3
  tab_icon: mdi:chart-scatter-plot-hexbin
  tab_icon_color: pink
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Library scope
    icon: mdi:tune
    color: pink
    description: Narrow the libraries by phase or by their correlation with the baseline
  grid_sections:
  - name: Similarity at a glance
    icon: mdi:counter
    color: pink
    description: Libraries, the first component, and the correlation along the time course
  - name: Library correlation
    icon: mdi:relation-many-to-many
    color: pink
    description: Spearman correlation of every pair of libraries over the expressed genes
  - name: Libraries over time
    icon: mdi:chart-scatter-plot
    color: pink
    description: A PCA of the libraries (PC1 against PC2), and the drift from the baseline
  - name: Similarity table
    icon: mdi:table
    color: gray
    description: Components and correlations per library
    collapsed: true
  components:
  - component_type: interactive
    workflow_tag: nascent
    data_collection_tag: sample_similarity
    interactive_component_type: MultiSelect
    column_name: phase
    column_type: object
    order_by: time_order
    display:
      icon_name: mdi:chart-timeline-variant
      custom_color: yellow
    placement: left
    section: Library scope
    group: Libraries
    tag: nc-ss-filter-phase
    index: nc-ss-phase-select
    title: Phase
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nascent
    data_collection_tag: sample_similarity
    interactive_component_type: RangeSlider
    column_name: corr_to_baseline
    column_type: float64
    display:
      icon_name: mdi:relation-many-to-many
      custom_color: pink
    placement: left
    section: Library scope
    group: Libraries
    tag: nc-ss-filter-corr
    index: nc-ss-corr-range
    title: Correlation with the baseline
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: text
    order: 1
    body: >
      Libraries compared over the genes detected in half of them, on log2 CPM: a Spearman correlation
      for every pair, and a [PCA](https://en.wikipedia.org/wiki/Principal_component_analysis) over the
      2,000 most variable genes. In a time course the libraries move along the first component with time, and
      their correlation with the baseline falls as the response unfolds; points are coloured by phase, on the
      ramp of the browser's tracks. Lasso libraries on the embedding to narrow the other tiles.
    tag: nc-ss-intro
    index: nc-ss-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    workflow_tag: nascent
    data_collection_tag: sample_similarity
    aggregation: count
    column_name: sample
    column_type: object
    secondary_layout: donut
    breakdown_col: phase
    display:
      icon_name: mdi:test-tube
      icon_color: pink.4
      caption: libraries, by phase of the time course
    section: Similarity at a glance
    tag: nc-ss-card-libraries
    index: nc-ss-card-libraries
    title: Libraries compared
    description: Libraries on the embedding and in the correlation curves.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nascent
    data_collection_tag: sample_similarity
    aggregation: max
    column_name: pc1_variance
    column_type: float64
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:chart-scatter-plot
      icon_color: pink.6
      caption: share of the variance on the first component
      decimals: 1
    section: Similarity at a glance
    tag: nc-ss-card-pc1
    index: nc-ss-card-pc1
    title: First component (%)
    description: Variance between libraries explained by the first principal component of the PCA.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nascent
    data_collection_tag: sample_similarity
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: corr_to_baseline
    column_type: float64
    filter_expr: col('time_order') > 1
    display:
      icon_name: mdi:relation-many-to-many
      icon_color: pink.8
      caption: median after the baseline, with its spread
      decimals: 3
    section: Similarity at a glance
    tag: nc-ss-card-baseline
    index: nc-ss-card-baseline
    title: Correlation with the baseline
    description: Spearman correlation of a later library with the mean baseline library, median over the libraries in view.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nascent
    data_collection_tag: sample_similarity
    aggregation: min
    aggregations: [box_plot_stats]
    secondary_layout: histogram
    column_name: corr_to_previous
    column_type: float64
    filter_expr: col('time_order') > 1
    display:
      icon_name: mdi:chart-timeline-variant
      icon_color: pink.9
      caption: lowest step correlation, and how the steps spread
      decimals: 3
    section: Similarity at a glance
    tag: nc-ss-card-step
    index: nc-ss-card-step
    title: Largest step
    description: Spearman correlation of a library with the previous time point; the lowest marks the step where transcription changed most.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: nascent
    data_collection_tag: subread_correlation
    use: subread/correlation_heatmap
    config:
      index_column: sample
      # Average linkage on a correlation distance: these rows are
      # correlations, not coordinates.
      cluster_rows: true
      cluster_cols: true
      cluster_method: average
      cluster_metric: correlation
    section: Library correlation
    tag: nc-ss-av-correlation
    index: ss-av-correlation
    title: Library correlation matrix
    description: >-
      How similar are the libraries to one another? Each cell is the Spearman correlation of log2 CPM
      between two libraries, for every pair, over the genes detected in at least half of the libraries.
      Libraries are ordered by hierarchical clustering.

      How to read: a block of high values along the diagonal is a group of libraries with the same
      transcription, and in a time course neighbouring time points are expected to sit together. A library
      that sits away from the libraries of its own time point is an outlier to check in
      [Library QC](tab:Library QC).

      Annotations: rows and columns are clustered with average linkage on a correlation distance, and the
      colour bar gives the coefficient. Spearman works on ranks, so a few very highly counted genes do not
      set the coefficients on their own.

      Source: Spearman's rank correlation, https://en.wikipedia.org/wiki/Spearman%27s_rank_correlation_coefficient

      Note: no cut-off is drawn, because nf-core/nascent publishes no minimum correlation between
      libraries; read the pattern and not a threshold.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: nascent
    data_collection_tag: sample_similarity
    viz_kind: embedding
    config:
      viz_kind: embedding
      sample_id_col: sample
      dim_1_col: pc1
      dim_2_col: pc2
      # The phase of the time course, on the ramp the browser and the lanes use; the
      # group is one choice away in the colour menu.
      color_col: phase
      default_color_by: phase
      axis_prefix: PC
      hover_cols: [time_point]
      legend_pos: bottom
      selection_enabled: true
      selection_column: sample
    section: Libraries over time
    tag: nc-ss-av-embedding
    index: ss-av-embedding
    title: PCA of libraries (PC1 vs PC2)
    description: >-
      Do the libraries order themselves by time? Each point is one library on the first two principal
      components of a PCA over the 2,000 most variable of the genes detected in at least half of the
      libraries, coloured by its phase of the time course. Lasso libraries to narrow the other tiles.

      How to read: in a time course the first component is usually time itself, so the points fan out
      from the baseline to the late phase along PC1. A point away from the libraries of its own phase is
      an outlier or a mislabelled library; check it in [Library QC](tab:Library QC).

      Annotations: no line or zone is drawn. The colour is the phase: the baseline, then the early, mid
      and late thirds of the later time points, on the ramp the browser tracks use. The colour menu can
      switch to the group.

      Source: principal component analysis, https://en.wikipedia.org/wiki/Principal_component_analysis

      Note: a PCA is descriptive and gives no test, and the choice of 2,000 genes is a fixed constant of
      this template.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: nascent
    data_collection_tag: sample_drift
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: comparison
      x_col: time_axis
      y_col: correlation
      reference_x: 0
      reference_label: Baseline
      x_title: Time, log2(1 + hours)
      y_title: Spearman correlation
      legend_pos: bottom
    section: Libraries over time
    tag: nc-ss-av-drift
    index: ss-av-drift
    title: Correlation along the time course
    description: >-
      How far has transcription moved at each time point? Two curves over log2(1 + hours): the Spearman
      correlation of each time point with the baseline, and with the previous time point, libraries of
      one time point averaged.

      How to read: a curve against the baseline that falls is the programme moving away from where it
      started, and one that rises again after a dip is a transient response. A dip in the previous-point
      curve marks the step where transcription changed most. The baseline is 1 against itself and has no
      previous point.

      Lines and annotations: the dotted vertical line, labelled Baseline, marks the baseline time point.
      No threshold is drawn, so a step is large only relative to the other steps of this run.

      Source: Spearman's rank correlation, https://en.wikipedia.org/wiki/Spearman%27s_rank_correlation_coefficient
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: table
    workflow_tag: nascent
    data_collection_tag: sample_similarity
    row_selection_enabled: true
    row_selection_column: sample
    section: Similarity table
    tag: nc-ss-table
    index: nc-ss-table
    title: Components and correlations per library
    description: >-
      PCA coordinates, variance explained and the two correlations, one row per library.

      How to read: pc1 to pc3 place the library on the embedding, and the variance columns say how much of
      the variation each component holds. corr_to_baseline and corr_to_previous are the Spearman
      correlations plotted above. Ticking a row narrows the other tiles to that library.

      Source: Spearman's rank correlation, https://en.wikipedia.org/wiki/Spearman%27s_rank_correlation_coefficient
    layout: {x: 0, y: 0, w: 8, h: 6}

- title: Genome signal
  subtitle: Where along the genome is nascent transcription read?
  tab_group: Time course
  tab_order: 4
  tab_icon: mdi:dna
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Signal scope
    icon: mdi:tune
    color: teal
    description: Narrow the binned signal to chromosomes or a signal band; brush the binned lanes to move the browser
  grid_sections:
  - name: Signal at a glance
    icon: mdi:counter
    color: teal
    description: Window signal, strand balance, silent windows and the busiest window
  - name: Binned signal and the bigWigs
    icon: mdi:waves
    color: teal
    description: The binned lanes drive the browser below. A brush or a locus on them moves the browser, and the browser's view comes back on them as a dashed band.
  - name: Signal by chromosome
    icon: mdi:chart-box-outline
    color: teal
    description: Each chromosome's share of the signal, per time point
  - name: Binned signal table
    icon: mdi:table
    color: gray
    description: Every 250 kb window of every library, with both strands
    collapsed: true
  components:
  - component_type: interactive
    workflow_tag: nascent
    data_collection_tag: bedtools_strand_bins
    interactive_component_type: MultiSelect
    column_name: chromosome
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: teal
    placement: left
    section: Signal scope
    group: Windows
    tag: nc-gs-filter-chrom
    index: nc-gs-chrom-select
    title: Chromosome
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nascent
    data_collection_tag: bedtools_strand_bins
    interactive_component_type: RangeSlider
    column_name: log2_signal
    column_type: float64
    display:
      icon_name: mdi:waves
      custom_color: cyan
    placement: left
    section: Signal scope
    group: Windows
    tag: nc-gs-filter-signal
    index: nc-gs-signal-range
    title: Window signal (log2)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: text
    order: 1
    body: >
      The strand coverage [bedtools genomecov](https://nf-co.re/nascent/2.3.0/docs/output) writes is
      binned into 250 kb windows, per million of each library's signal, one lane per library, coloured
      along the time course (the later, the darker) as the browser's tracks are. Pick Select in the lanes' header
      and brush a region: the browser below zooms to it, strand by strand; zoom the browser and its window comes
      back as a band on the lanes. Hotspot windows (ribosomal DNA) tower over the rest, so the lanes
      are drawn on log2 of one plus the signal.
    tag: nc-gs-intro
    index: nc-gs-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    workflow_tag: nascent
    data_collection_tag: bedtools_strand_bins
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: signal_rpm
    column_type: float64
    follow_region_filter: true
    display:
      icon_name: mdi:waves
      icon_color: teal.4
      caption: median per window and library, with its spread
      decimals: 1
    section: Signal at a glance
    tag: nc-gs-card-signal
    index: nc-gs-card-signal
    title: Window signal (per million)
    description: Both strands of a 250 kb window, per million of the library's signal, median over the windows in view.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nascent
    data_collection_tag: bedtools_strand_bins
    aggregation: median
    column_name: plus_share_pct
    column_type: float64
    filter_expr: col('signal_rpm') > 0
    secondary_layout: gauge
    coverage_max: 100
    follow_region_filter: true
    display:
      icon_name: mdi:scale-balance
      icon_color: teal.6
      caption: median plus-strand share of a window
      decimals: 1
    section: Signal at a glance
    tag: nc-gs-card-strand
    index: nc-gs-card-strand
    title: Plus-strand share (%)
    description: The plus strand's share of a window's signal, median over the windows with signal in view.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nascent
    data_collection_tag: bedtools_strand_bins
    aggregation: count
    column_name: signal_rpm
    column_type: float64
    filter_expr: col('signal_rpm') == 0
    secondary_layout: top_n
    breakdown_col: chromosome
    top_n_count: 3
    follow_region_filter: true
    display:
      icon_name: mdi:alert-outline
      icon_color: teal.8
      caption: the 3 chromosomes holding most
    section: Signal at a glance
    tag: nc-gs-card-silent
    index: nc-gs-card-silent
    title: Silent windows
    description: Windows of a library with no read on either strand, counted over the libraries in view.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nascent
    data_collection_tag: bedtools_strand_bins
    aggregation: max
    aggregations: [box_plot_stats]
    secondary_layout: histogram
    column_name: log2_signal
    column_type: float64
    follow_region_filter: true
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: teal.9
      caption: how the windows spread on the log2 scale
      decimals: 1
    section: Signal at a glance
    tag: nc-gs-card-peak
    index: nc-gs-card-peak
    title: Busiest window (log2)
    description: The highest log2 signal of any window in view; a hotspot sits far right of the rest.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # The navigator: a brush (Select mode) moves the browser below, in the same
  # linked section.
  - component_type: advanced_viz
    workflow_tag: nascent
    data_collection_tag: bedtools_strand_bins
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      chr_col: chromosome
      pos_col: position
      end_col: end
      score_col: log2_signal
      sample_col: sample
      mark: bar
      facet_by_sample: true
      max_facets: 12
      # Thin lanes: the axis stays in view while they scroll, and each lane
      # wears the colour the browser below gives the same library.
      lane_height: 18
      score_title: log2 signal
      assembly: '{GENOME}'
      annotation: '{GENOME}'
      # No default region: the lanes open on the whole genome, the browser below
      # on the most responsive gene, and its window shows here as a band.
      region_filter_enabled: true
      # The tile is as tall as its lanes.
      auto_height: true
    section: Binned signal and the bigWigs
    tag: nc-gs-av-binned
    index: gs-av-binned
    title: Binned signal, one lane per library
    description: >-
      Where along the genome is nascent transcription read, and how does it change with time? One lane
      per library, up to 12, in time order and in the colour of its time point, shows the reads of both
      strands summed in 250 kb windows, as log2(1 + signal per million of the library). Pick Select in the
      header and brush a region, or type one, to move the browser below to it.

      How to read: a tall bar that repeats in every lane is an expressed region, and one that grows or
      shrinks down the lanes is a region that changes with time. A window towering over its neighbours in
      every lane is a hotspot, typically the ribosomal DNA arrays. A region brushed here also narrows the
      cards of the tab that follow the region.

      Lines and annotations: the dashed band that appears on the lanes is the window the browser below
      currently shows. The log2 scale keeps hotspot windows from flattening the rest and is a display
      choice, not a threshold; the 250 kb width is a fixed choice of this template.

      Source: strand coverage from bedtools genomecov,
      https://bedtools.readthedocs.io/en/latest/content/tools/genomecov.html
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: jbrowse
    workflow_tag: nascent
    data_collection_tag: tracks
    section: Binned signal and the bigWigs
    # Every bigWig open, in the manifest's time order (each library's plus strand above
    # its minus strand), so the time course reads down the tile.
    initial_tracks: 24
    max_tracks: 24
    # Opens on the gene whose nascent transcription changes most over the time
    # course, not on a whole chromosome where the bigWigs read as a few spikes.
    locus_from:
      data_collection_tag: gene_dynamics
      chrom_column: chromosome
      start_column: start
      end_column: end
      padding: 20000
      sort_by: abs_peak_log2fc
      descending: true
      # The header's Previous / Next walk the genes by response.
      name: responsive gene
      label_column: gene_id
    show_overview: false
    # The binned lanes above already say where the browser is.
    show_header: false
    # The libraries along the time course wear one ramp, the later the darker.
    # The binned lanes above take the same colours from the browser's tracks.
    color_scale:
      column: time_point
      order_by: time_order
      scheme: viridis
    # Follows a region brushed or typed on the binned lanes (panning them does not move it)
    # and publishes its own window back to them.
    follow_window: true
    # The tile is as tall as the tracks it has open.
    auto_height: true
    # Each track on its mean plus three standard deviations of what is in view:
    # a few hot bins no longer flatten the transcribed genes around them. Zoomed out, a
    # pixel draws the mean of its bins: their maximum tops that scale nearly everywhere
    # on a whole chromosome and fills each track to the top.
    display:
      autoscale: localsd
      summary: avg
    selection_enabled: true
    selection_column: sample
    tag: nc-gs-browser
    index: gs-browser
    title: Strand coverage from the bigWigs
    description: >-
      What do the reads look like at a locus? The plus (+) and minus (-) strand bigWig of every library,
      up to 24 tracks, in time order and in the colour of the library's time point. The browser opens on
      the gene whose transcription changes most over the time course.

      How to read: genes on the plus strand read on the plus tracks and genes on the minus strand on the
      minus tracks. Follow the same gene down the tracks: signal that rises or falls with time is the
      response seen in [Gene dynamics](tab:Gene dynamics). Brush a region on the binned lanes above to
      move the browser.

      Lines and annotations: each track is scaled on its own, to the mean plus three standard deviations
      of what is in view, and when zoomed out a pixel draws the mean of its bins. Heights are therefore
      not comparable between tracks; read the shape and not the level.

      Source: strand bigWigs from deepTools bamCoverage,
      https://deeptools.readthedocs.io/en/latest/content/tools/bamCoverage.html, as listed in the
      nf-core/nascent output documentation, https://nf-co.re/nascent/2.3.0/docs/output
    layout: {x: 0, y: 7, w: 8, h: 9}
  - component_type: figure
    workflow_tag: nascent
    data_collection_tag: chromosome_signal
    visu_type: heatmap
    mode: code
    code_content: |-
      # Each chromosome's share of the signal against its own share at the baseline, as a
      # log2 ratio on a diverging scale (a raw share only says how long the chromosome is):
      # chromosomes in karyotype order down, time points in time order across. The share
      # itself is in the hover.
      d = df.sort(['contig_order', 'time_order'])
      rows = d.select('chromosome', 'contig_order').unique().sort('contig_order')['chromosome'].to_list()
      cols = d.select('time_point', 'time_order').unique().sort('time_order')['time_point'].to_list()
      ratio = d.pivot(on='time_point', index='chromosome', values='log2_ratio', aggregate_function='first')
      share = d.pivot(on='time_point', index='chromosome', values='share_pct', aggregate_function='first')
      z = [[ratio.filter(pl.col('chromosome') == r)[c].item() if c in ratio.columns else None for c in cols] for r in rows]
      s = [[share.filter(pl.col('chromosome') == r)[c].item() if c in share.columns else None for c in cols] for r in rows]
      top = d['abs_log2_ratio'].drop_nulls().quantile(0.95) if d['abs_log2_ratio'].drop_nulls().len() else 0.5
      lim = max(0.5, round(2 * top, 1))
      fig = go.Figure(go.Heatmap(z=z, customdata=s, x=cols, y=rows, colorscale='RdBu_r', zmid=0, zmin=-lim, zmax=lim, colorbar=dict(title='log2 ratio'), hovertemplate='%{y} at %{x}: %{z:+.2f} log2 against the baseline<br>%{customdata:.2f}% of the signal<extra></extra>'))
      fig.update_yaxes(autorange='reversed', automargin=True)
      fig.update_layout(margin=dict(t=10), xaxis_title='Time point', yaxis_title='')
    section: Signal by chromosome
    tag: nc-gs-fig-chromosomes
    index: gs-fig-chromosomes
    title: Share of the signal per chromosome, against its baseline
    description: >-
      Which chromosomes gain or lose share of the signal over time? Each row is a chromosome in karyotype
      order and each column a time point; the colour is the log2 of the chromosome's share of the signal
      over its own share at the baseline, libraries of a time point averaged. The share itself is in the
      hover.

      How to read: white means the same share as at the baseline, red a larger share and blue a smaller
      one. A row that stays white follows the genome, while a row that moves carries a large response or a
      hotspot such as ribosomal DNA arrays, whose share follows how well each library was depleted. Open
      the binned lanes above on that chromosome to find the windows behind it.

      Lines and annotations: the colour scale is centred on 0 (white, no change) and runs to plus and
      minus twice the 95th percentile of the absolute log2 ratios on display, with a floor of 0.5. The
      range is a display choice and not a threshold. A cell is blank where the chromosome has no signal at
      that time point or at the baseline.

      Source: strand coverage from bedtools genomecov,
      https://bedtools.readthedocs.io/en/latest/content/tools/genomecov.html
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    workflow_tag: nascent
    data_collection_tag: bedtools_strand_bins
    use: bedtools/strand_bins
    section: Binned signal table
    tag: nc-gs-table-bins
    index: nc-gs-table-bins
    title: Binned strand signal per library and window
    description: >-
      Plus, minus and total signal per million of the library, and the plus-strand share, for every 250 kb
      window of every library. A click centres the browser on the window.

      How to read: sort by total signal to list the busiest windows, which are mostly hotspots, or filter
      on a chromosome to list its windows. The plus-strand share swings between the strands along a
      chromosome because a gene dominates its window, and sits near half for the genome as a whole.

      Source: strand coverage from bedtools genomecov,
      https://bedtools.readthedocs.io/en/latest/content/tools/genomecov.html
    layout: {x: 0, y: 0, w: 8, h: 6}

- title: Signal dynamics
  subtitle: Which genomic windows gain or lose nascent signal over time?
  tab_group: Time course
  tab_order: 5
  tab_icon: mdi:chart-bell-curve
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Window scope
    icon: mdi:tune
    color: orange
    description: Narrow the windows to chromosomes or by the size of their change; every tile of the tab follows
  grid_sections:
  - name: Windows at a glance
    icon: mdi:counter
    color: orange
    description: Windows compared, rising and falling, and the size of their change
  - name: Windows that change most
    icon: mdi:chart-box-outline
    color: orange
    description: The forty windows that change most, one row each, in time order
  - name: Trends over time
    icon: mdi:chart-line
    color: orange
    description: The typical course of the rising, falling and stable windows
  - name: Window table
    icon: mdi:table
    color: gray
    description: The call of every window compared
    collapsed: true
  components:
  - component_type: interactive
    workflow_tag: nascent
    data_collection_tag: signal_window_dynamics
    interactive_component_type: MultiSelect
    column_name: chromosome
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: teal
    placement: left
    section: Window scope
    group: Windows
    tag: nc-sd-filter-chrom
    index: nc-sd-chrom-select
    title: Chromosome
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nascent
    data_collection_tag: signal_window_dynamics
    interactive_component_type: RangeSlider
    column_name: abs_peak_log2fc
    column_type: float64
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: grape
    placement: left
    section: Window scope
    group: Windows
    tag: nc-sd-filter-change
    index: nc-sd-change-range
    title: Peak change (absolute log2 fold change)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: text
    order: 1
    body: >
      The rule of [Gene dynamics](tab:Gene dynamics), applied to the 250 kb windows of the strand coverage
      instead of gene bodies, so a change outside any annotated gene shows too. The windows compared
      are the transcribed half of the genome without its hotspots, whose share follows depletion rather
      than transcription. A window rises or falls when its log2 fold change reaches 1 at two time points or more.
    tag: nc-sd-intro
    index: nc-sd-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    workflow_tag: nascent
    data_collection_tag: signal_window_dynamics
    aggregation: count
    column_name: window_id
    column_type: object
    filter_expr: col('trend') != 'Stable'
    secondary_layout: donut
    breakdown_col: trend
    display:
      icon_name: mdi:waves
      icon_color: orange.4
      caption: windows that change, rising or falling
    section: Windows at a glance
    tag: nc-sd-card-windows
    index: nc-sd-card-windows
    title: Windows that change
    description: Windows that rise or fall by a log2 fold change of 1 against the baseline at two time points or more, among the transcribed 250 kb windows without the hotspots that the time course is read on. Most windows are stable.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nascent
    data_collection_tag: signal_window_dynamics
    aggregation: count
    column_name: window_id
    column_type: object
    filter_expr: col('trend') == 'Rising'
    secondary_layout: composition
    breakdown_col: peak_phase
    display:
      icon_name: mdi:trending-up
      icon_color: orange.6
      caption: rising windows, by the phase of their peak
    section: Windows at a glance
    tag: nc-sd-card-rising
    index: nc-sd-card-rising
    title: Rising windows
    description: Windows up by a log2 fold change of 1 against the baseline at two time points or more.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nascent
    data_collection_tag: signal_window_dynamics
    aggregation: count
    column_name: window_id
    column_type: object
    filter_expr: col('trend') == 'Falling'
    secondary_layout: composition
    breakdown_col: peak_phase
    display:
      icon_name: mdi:trending-down
      icon_color: orange.8
      caption: falling windows, by the phase of their dip
    section: Windows at a glance
    tag: nc-sd-card-falling
    index: nc-sd-card-falling
    title: Falling windows
    description: Windows down by a log2 fold change of 1 against the baseline at two time points or more.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nascent
    data_collection_tag: signal_window_dynamics
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: abs_peak_log2fc
    column_type: float64
    filter_expr: col('trend') != 'Stable'
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: orange.9
      caption: median over the changing windows, with its spread
      decimals: 2
    section: Windows at a glance
    tag: nc-sd-card-change
    index: nc-sd-card-change
    title: Peak change (log2)
    description: Absolute log2 fold change of a rising or falling window at its peak, median over the windows in view.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: nascent
    data_collection_tag: signal_window_heatmap
    viz_kind: complex_heatmap
    config:
      viz_kind: complex_heatmap
      index_column: window_id
      row_annotation_cols: [trend]
      normalize: row_z
      cluster_rows: true
      cluster_cols: false
      cluster_method: average
      cluster_metric: correlation
      colorscale: RdBu_r
    section: Windows that change most
    tag: nc-sd-av-heatmap
    index: sd-av-heatmap
    title: Signal of the forty windows that change most
    description: >-
      Do the windows that change most share a course? Each row is one of the forty rising or falling
      250 kb windows with the largest absolute peak change, each column a time point in time order, and
      each cell the window's log2 signal there, z-scored per row. The window filters keep the rows in
      scope.

      How to read: red cells are the time points where a window is highest and blue where it is lowest,
      so a row reads as when the signal is high and not how high. Rows clustered together share a shape.
      The window ids name the chromosome and the span, to find in the browser of [Genome signal](tab:Genome signal).

      Annotations: each row is z-scored, so 0 is the window's own mean across the time points. Rows are
      clustered with average linkage on a correlation distance, columns keep their time order, and the
      row strip is the trend, rising or falling. The windows compared are those whose mean signal lies
      between the median window's and the 99.5th percentile of all windows, which drops the hotspots.

      Source: strand coverage from bedtools genomecov,
      https://bedtools.readthedocs.io/en/latest/content/tools/genomecov.html

      Note: the median and 99.5th percentile bounds, the choice of forty windows and the two-fold,
      two-time-point rule are fixed conventions of this template, not validated cut-offs.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: nascent
    data_collection_tag: signal_window_series
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: trend
      x_col: time_axis
      y_col: log2fc
      # One row per window and time point, summarised over the windows in scope.
      aggregate: median_iqr
      reference_x: 0
      reference_label: Baseline
      x_title: Time, log2(1 + hours)
      y_title: log2 fold change against the baseline
      band_opacity: 0.15
      legend_pos: bottom
    section: Trends over time
    tag: nc-sd-av-trends
    index: sd-av-trends
    title: Rising, falling and stable windows over time
    description: >-
      What do the windows that rise, fall or stay stable do over time? Each curve is the median log2 fold
      change against the baseline of the windows of one trend at each time point, with a band from the
      first to the third quartile of those windows. The x axis is log2(1 + hours).

      How to read: the rising curve climbs above zero and the falling curve drops below it, by
      construction of the call. A narrow band means the windows of a trend move together, and a stable
      curve should stay near zero. Read the windows behind a trend in the heatmap above and in the table
      below.

      Lines and annotations: the dotted vertical line, labelled Baseline, marks the baseline time point,
      where every fold change is 0 by construction. The band is the interquartile range of the windows in
      view, computed after the window filters. A window rises or falls when its largest change reaches a
      log2 fold change of 1 and at least two time points change that much the same way.

      Source: strand coverage from bedtools genomecov,
      https://bedtools.readthedocs.io/en/latest/content/tools/genomecov.html

      Note: the two-fold, two-time-point rule is a fixed convention of this template, not a validated
      cut-off, and the calls are a fold-change rule rather than a statistical test.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: nascent
    data_collection_tag: signal_window_dynamics
    columns: [window_id, chromosome, start, end, trend, peak_log2fc, peak_time_point, peak_phase, n_changed, mean_rpm, baseline_log2_signal, last_log2fc, rank]
    section: Window table
    tag: nc-sd-table
    index: nc-sd-table
    title: Call per window
    description: >-
      The peak change, its time point, the time points changed and the trend of every window compared,
      one row per 250 kb window.

      How to read: peak_log2fc is the largest change against the baseline and peak_time_point where it
      happens. n_changed counts the time points that changed by a log2 fold change of 1 in the peak's
      direction, and trend is rising, falling or stable. Sort or filter a column to list the windows of
      one trend or one chromosome.

      Source: strand coverage from bedtools genomecov,
      https://bedtools.readthedocs.io/en/latest/content/tools/genomecov.html

      Note: only the transcribed windows without hotspots are compared, and the trend is a fold-change
      rule rather than a statistical test.
    layout: {x: 0, y: 0, w: 8, h: 6}
