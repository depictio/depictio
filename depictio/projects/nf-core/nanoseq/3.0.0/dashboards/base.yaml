- title: Reads
  subtitle: How long and how good are the reads of each library?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:waves
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Read filters
    icon: mdi:filter-variant
    color: cyan
    description: Quality and N50 floors on the NanoStat summary
  grid_sections:
  - name: Reads at a glance
    icon: mdi:counter
    color: cyan
    description: Yield, length and quality over the libraries in view
  - name: Length and quality
    icon: mdi:chart-bar
    color: cyan
    description: Each library's mean read length, quality and yield, sorted by quality
  - name: Ladders
    icon: mdi:chart-line
    color: cyan
    description: Read length and quality, rung by rung
  - name: Read tables
    icon: mdi:table
    color: gray
    description: The NanoStat summary and the yield per quality floor
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [NanoPlot](https://github.com/wdecoster/nanoplot) summarises each library's raw reads:
      yield, length and quality. Click a library in the bars to read its summary
      beside it; the ladders show its read lengths and qualities rung by rung.
    tag: ns-rd-intro
    index: rd-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    interactive_component_type: Slider
    slider_mode: gte
    column_name: mean_read_quality
    column_type: float64
    display:
      icon_name: mdi:check-decagram
      custom_color: cyan
    section: Read filters
    group: Floors
    tag: ns-rd-filter-quality
    index: rd-quality-filter
    title: Mean read quality at least
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: read_length_n50
    column_type: float64
    display:
      icon_name: mdi:ruler
      custom_color: blue
    section: Read filters
    group: Floors
    tag: ns-rd-filter-n50
    index: rd-n50-filter
    title: Read length N50
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: sum
    column_name: n_reads
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:counter
      icon_color: cyan.4
      caption: per library, their distribution
    section: Reads at a glance
    tag: ns-rd-card-reads
    index: rd-card-reads
    title: Reads
    description: Reads basecalled over the libraries in view; the bars show how they spread over the libraries.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: median
    column_name: read_length_n50
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: cyan.6
      caption: median per library, with its spread
      decimals: 0
    section: Reads at a glance
    tag: ns-rd-card-n50
    index: rd-card-n50
    title: Read length N50
    description: Half of a library's bases sit in reads at least this long.
    layout: {x: 2, y: 0, w: 2, h: 2}
  # Q7 is the basecaller's pass floor (Guppy and Dorado sort reads into pass
  # and fail at it); Q10 is the good-quality mark the figures draw beside it.
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: median
    column_name: mean_read_quality
    column_type: float64
    secondary_layout: threshold
    threshold_value: 7
    threshold_direction: min
    display:
      icon_name: mdi:check-decagram
      icon_color: cyan.8
      caption: libraries against Q7, the pass floor
      decimals: 1
    section: Reads at a glance
    tag: ns-rd-card-quality
    index: rd-card-quality
    title: Mean read quality
    description: Median of the libraries' mean Phred quality. Q7 is the basecaller's pass floor, Q10 is good.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # One row per library and quality floor: the card reads the Q7 rung only.
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: nanostats_quality
    use: nanoplot/nanostats_quality
    aggregation: median
    column_name: pct_reads
    column_type: float64
    filter_expr: col('q_cutoff') == 7
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:percent-outline
      icon_color: cyan.9
      caption: median share of each library
      decimals: 1
    section: Reads at a glance
    tag: ns-rd-card-q7
    index: rd-card-q7
    title: Reads passing Q7 (%)
    description: Median share of a library's reads at a mean quality of Q7 or above, the pass floor.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # nanoseq publishes no per-read table (NanoPlot runs without --raw), so a
  # scatter would hold one point per library: six or so. Sorted bars say more,
  # with the Q7 pass floor and the Q10 good mark drawn as lines on the quality panel.
  - component_type: figure
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    visu_type: bar
    mode: code
    code_content: |-
      # Mean read length, mean read quality and yield per library, sorted by quality, coloured by condition; the solid line is Q7 (pass), the dashed one Q10 (good). A picked bar stays full, the others dim.
      names = {'mean_read_length': 'Mean read length (bases)', 'mean_read_quality': 'Mean read quality (Phred)', 'total_gigabases': 'Yield (Gb)'}
      d = df.filter(pl.col('mean_read_quality').is_not_null()).sort(['mean_read_quality', 'sample']).with_columns(pl.col('sample').str.replace(r'_(?:R|r|rep|REP|Rep)\d+$', '').alias('condition'))
      long = d.select(['sample', 'condition', *names.keys()]).unpivot(index=['sample', 'condition'], variable_name='metric', value_name='value').with_columns(pl.col('metric').replace(names))
      fig = px.bar(long.to_pandas(), x='value', y='sample', color='condition', color_discrete_map=depictio_category_colors.get('condition') or {}, facet_col='metric', orientation='h', custom_data=['sample'], category_orders={'sample': d.get_column('sample').to_list(), 'metric': list(names.values())}, labels={'value': '', 'sample': '', 'condition': 'Condition'})
      fig.update_xaxes(matches=None, showticklabels=True)
      fig.update_yaxes(automargin=True)
      fig.for_each_annotation(lambda a: a.update(text=a.text.split('=')[-1]))
      fig.update_xaxes(range=[0, max(12, (d['mean_read_quality'].max() or 0) * 1.1)], col=2)
      fig.add_vline(x=7, line_width=1, opacity=0.6, annotation_text='Q7 pass', annotation_position='top left', col=2)
      fig.add_vline(x=10, line_dash='dash', line_width=1, opacity=0.6, annotation_text='Q10 good', col=2)
      fig.update_traces(unselected=dict(marker=dict(opacity=0.3)))
      fig.update_layout(margin=dict(t=30), clickmode='event+select', legend=dict(orientation='h', y=-0.12, title_text=''))
    selection_enabled: true
    selection_column: sample
    section: Length and quality
    tag: ns-rd-length-quality
    index: rd-length-quality
    title: Length, quality and yield per library
    description: >-
      How long, how good and how big is each library? One bar per library in three panels, mean read
      length in bases, mean read quality on the Phred scale and yield in gigabases. Libraries are sorted
      by mean quality, the best on top, and coloured by condition.

      How to read: a library with a short bar in the quality panel, or one whose bar ends short of the Q7
      line, holds reads that are noisy for any analysis that needs accurate bases. A short mean length
      with a normal yield means many short reads, so check its Nx curve on this tab before trusting it for
      isoform work. Click a bar to open the library's NanoStat summary beside it.

      Lines and annotations: on the quality panel only, a solid vertical line at Q7 (labelled Q7 pass) and
      a dashed one at Q10 (labelled Q10 good). Q is the Phred scale, so Q10 is one expected error in ten
      bases. Q7 is the pass quality pycoQC uses by default; Q10 is a display aid with no source.

      Source: pycoQC, option min_pass_qual (default 7),
      https://raw.githubusercontent.com/a-slide/pycoQC/master/pycoQC/pycoQC.py

      Note: neither line is a validated cut-off. A basecaller sets its own pass filter by version and
      model, and Dorado applies none unless --min-qscore is set
      (https://software-docs.nanoporetech.com/dorado/latest/basecaller/simplex/).
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: ns-rd-length-quality
      id_col: sample
      title_col: sample
      selection_source: any
      sections:
        Yield: [n_reads, total_bases, total_gigabases]
        Read length: [mean_read_length, median_read_length, read_length_n50, stdev_read_length, longest_read_length]
        Read quality: [mean_read_quality, median_read_quality, top_read_quality]
      labels:
        n_reads: Reads
        total_bases: Bases
        total_gigabases: Gigabases
        mean_read_length: Mean length
        median_read_length: Median length
        read_length_n50: N50
        stdev_read_length: Length spread (SD)
        longest_read_length: Longest read
        mean_read_quality: Mean quality
        median_read_quality: Median quality
        top_read_quality: Best read quality
    section: Length and quality
    tag: ns-rd-library-record
    index: rd-library-record
    title: Library record
    description: >-
      The NanoStat summary of the library picked on the bars: its yield, its read length statistics and
      its read quality.

      How to read: compare the mean and the median length. A mean far above the median means a few very
      long reads pull it up, and the N50 says where half of the bases lie. Pick another bar, or a row of
      the table below, to switch library.
    layout: {x: 5, y: 0, w: 3, h: 6}
  # The Nx ladder replaces an N50 bar: N50 is its marked rung, and the rest of
  # the ladder is what a single bar hides.
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: samtools_read_length_nx
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: sample
      x_col: nx
      y_col: read_length
      log_y: true
      reference_x: 50
      reference_label: N50
      x_title: Share of the bases (Nx, %)
      y_title: Read length (bases)
      selection_enabled: true
      selection_column: sample
    section: Ladders
    tag: ns-rd-nx-ladder
    index: rd-nx-ladder
    title: Nx ladder per library
    description: >-
      How is each library's yield spread over read lengths? One curve per library: for each share x of the
      bases, from 1% to 99%, the read length L such that reads of L or longer hold x% of the bases. The
      length axis is logarithmic.

      How to read: a long, flat top is a library whose yield sits in a few very long reads, and a steep
      drop is one whose reads are all about the same length. Two libraries with the same N50 can have very
      different curves, which a bar of N50 values hides. Click a curve to pick its library.

      Lines and annotations: the dotted vertical line at 50% is the N50, the length at which half of the
      bases lie in reads that long or longer. It is the definition of N50 and not a quality cut-off.

      Source: samtools stats, RL section, http://www.htslib.org/doc/samtools-stats.html

      Note: the ladder is rebuilt from the samtools stats read-length histogram, which covers every
      primary read of the alignment file, mapped or not. It describes the library handed to the aligner.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: nanostats_quality
    use: nanoplot/quality_ladder
    config:
      x_title: Phred quality floor
      y_title: Reads above the floor (%)
      reference_x: 7
      reference_label: Q7 pass
      line_width: 2.5
      selection_enabled: true
      selection_column: sample
    section: Ladders
    tag: ns-rd-quality-ladder
    index: rd-quality-ladder
    title: Reads above each quality floor
    description: >-
      How much of each library survives a quality floor? One curve per library: the share of its reads
      whose mean quality is above each Phred cut-off that NanoStat reports. A mean quality hides whether a
      library is tight around it or bimodal, and this curve does not.

      How to read: a curve that stays high up to Q10 is a library of mostly good reads, and one that falls
      early loses much of its yield at the floor an analysis wants to impose. Pick the floor the
      downstream step needs and read the share that remains. Click a curve to pick its library.

      Lines and annotations: the dotted vertical line at Q7 (labelled Q7 pass) is the pass quality pycoQC
      uses by default. The curves are drawn at the cut-offs NanoStat prints and no other.

      Source: pycoQC, option min_pass_qual (default 7),
      https://raw.githubusercontent.com/a-slide/pycoQC/master/pycoQC/pycoQC.py

      Note: Q7 is a reference and not a verdict. The pass filter of a basecaller depends on its version
      and model, and Dorado applies none unless --min-qscore is set.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: table
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    row_selection_enabled: true
    row_selection_column: sample
    section: Read tables
    tag: ns-rd-table-nanostats
    index: rd-table-nanostats
    title: NanoStat summary
    description: >-
      NanoStat's summary, one row per library: reads, bases, read length statistics and read quality.

      How to read: sort by mean quality or by N50 to find the weakest libraries, then pick a row to move
      the record above. The same numbers sit behind the bars, which show them side by side.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: nanoseq
    data_collection_tag: nanostats_quality
    use: nanoplot/nanostats_quality
    row_selection_enabled: true
    row_selection_column: sample
    section: Read tables
    tag: ns-rd-table-ladder
    index: rd-table-ladder
    title: Yield per quality floor
    description: >-
      The numbers behind the quality curves: reads, share of reads and megabases above each quality
      cut-off, one row per library and cut-off.

      How to read: filter on a cut-off to compare the megabases that survive it between libraries.
    layout: {x: 0, y: 6, w: 8, h: 6}
- title: Alignment
  subtitle: How much of each library aligned, and how accurately?
  tab_group: Data & QC
  tab_order: 3
  tab_icon: mdi:chart-bar
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Alignment filters
    icon: mdi:filter-variant
    color: indigo
    description: Libraries shown on this tab
  grid_sections:
  - name: Alignment at a glance
    icon: mdi:counter
    color: indigo
    description: Placement, identity and split reads over the libraries in view
  - name: Coverage
    icon: mdi:chart-line
    color: indigo
    description: How much of the reference sits at each depth
  - name: Indels and read lengths
    icon: mdi:chart-bell-curve
    color: indigo
    description: The long-read error mode, and the length of the aligned reads
  - name: Alignment table
    icon: mdi:table
    color: gray
    description: Every point of the samtools stats distributions
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [minimap2](https://github.com/lh3/minimap2) alignments as
      [samtools stats](https://www.htslib.org/doc/samtools-stats.html) reads them, one summary
      per library. Identity is 100 minus the mismatch rate per aligned base; the curves show how
      depth, indel lengths and aligned read lengths spread.
    tag: ns-al-intro
    index: al-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: Alignment filters
    tag: ns-al-filter-library
    index: al-library-filter
    title: Library
    layout: {x: 0, y: 0, w: 1, h: 3}
  # Every card reads the SN rows, one per library: the other rows are the
  # histograms and carry no summary.
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/stats_sections
    aggregation: median
    column_name: reads_mapped_pct
    column_type: float64
    filter_expr: col('section') == 'SN'
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:check-decagram
      icon_color: indigo.4
      caption: median share of each library's reads
      decimals: 1
    section: Alignment at a glance
    tag: ns-al-card-placed
    index: al-card-placed
    title: Reads placed (%)
    description: Median share of each library's reads minimap2 placed.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/stats_sections
    aggregation: median
    column_name: identity_pct
    column_type: float64
    filter_expr: col('section') == 'SN'
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:shield-check-outline
      icon_color: indigo.6
      caption: median per library, with its spread
      decimals: 1
    section: Alignment at a glance
    tag: ns-al-card-identity
    index: al-card-identity
    title: Per-base identity (%)
    description: Median agreement of the aligned bases with the reference.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/stats_sections
    aggregation: sum
    column_name: reads_mapped
    column_type: float64
    filter_expr: col('section') == 'SN'
    secondary_layout: histogram
    display:
      icon_name: mdi:counter
      icon_color: indigo.8
      caption: per library, their distribution
    section: Alignment at a glance
    tag: ns-al-card-mapped
    index: al-card-mapped
    title: Reads mapped
    description: Reads placed on the reference over the libraries in view.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/stats_sections
    aggregation: sum
    column_name: supplementary_alignments
    column_type: float64
    filter_expr: col('section') == 'SN'
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:set-merge
      icon_color: indigo.9
      caption: per library, with its spread
    section: Alignment at a glance
    tag: ns-al-card-suppl
    index: al-card-suppl
    title: Supplementary alignments
    description: Split alignments, the long-read signal of chimeras and structural differences.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/coverage_distribution
    config:
      x_title: Coverage depth
      y_title: Bases at that depth
      log_x: true
      log_y: true
      selection_enabled: true
      selection_column: sample
    section: Coverage
    tag: ns-al-coverage
    index: al-coverage
    title: Coverage depth distribution
    description: >-
      How evenly is the reference covered? One curve per library: the number of reference positions
      covered at each depth, from 1x upward, on logarithmic axes.

      How to read: a peak at low depth with a short tail is a thinly covered reference. For a
      transcriptome library depth follows expression, so a long tail towards high depth is a few abundant
      genes, and a curve shifted to the right is a deeper library. Click a curve to pick its library.

      Lines and annotations: no line is drawn. The last point pools every position at 1000x and above,
      because samtools stats reports depths up to 1000 by default and one final bin beyond it.

      Source: samtools stats, COV section, http://www.htslib.org/doc/samtools-stats.html

      Note: only positions with at least one read are counted, so the curve says nothing about the share
      of the reference left uncovered.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/indel_spectrum
    config:
      x_title: Indel length (bases)
      y_title: Events
      log_x: true
      log_y: true
      # Two curves per library (insertions, deletions): past 8 entries the
      # legend scrolls and eats the plot. A hover names the curve.
      legend_pos: none
      selection_enabled: true
      selection_column: sample
    section: Indels and read lengths
    tag: ns-al-indels
    index: al-indels
    title: Indel length spectrum
    description: >-
      What is the long-read error mode? Two curves per library, insertions and deletions, giving the
      number of events at each indel length, on logarithmic axes. Hover a curve for its library.

      How to read: events fall steeply with length,. A library whose curves sit above the others carries
      more indel events at the same length, as a noisier basecaller or a poorer match to the reference
      does.

      Source: samtools stats, ID section, http://www.htslib.org/doc/samtools-stats.html

      Note: the curves count events and not rates, so a deeper library has more of them at every length.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/read_length_profile
    config:
      x_title: Read length (bases)
      y_title: Reads
      log_x: true
      log_y: true
      selection_enabled: true
      selection_column: sample
    section: Indels and read lengths
    tag: ns-al-read-length
    index: al-read-length
    title: Aligned read lengths
    description: >-
      How long are the reads in the alignment file? One curve per library: the number of reads at each
      read length, from the samtools stats read-length histogram, on logarithmic axes.

      How to read: a single sharp peak is a library of reads that are all about one length, and a long
      shoulder to the right is a mix. Libraries prepared the same way should have curves of the same
      shape. Click a curve to pick its library, and read the yield by length on the Nx curves of the
      [Reads](tab:Reads) tab.

      Source: samtools stats, RL section, http://www.htslib.org/doc/samtools-stats.html

      Note: this counts reads and not bases, so the long reads that hold much of the yield look rare here.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: table
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/stats_sections
    row_selection_enabled: true
    row_selection_column: sample
    section: Alignment table
    tag: ns-al-table
    index: al-table
    title: Alignment distributions
    description: >-
      Every point of the samtools stats distributions behind the three curves of this tab, one row per
      library, section and bin, plus one summary row per library.

      How to read: filter on a section (read length, coverage or indel) to list the exact values of one
      curve. The summary rows carry the placement, identity and split-read numbers of the cards above.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Quantification
  subtitle: Do the libraries group by condition, or by preparation?
  tab_group: Expression
  tab_order: 4
  tab_icon: mdi:dna
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # The biotype filter also narrows the variable-gene heatmap, which carries
  # the same column.
  filter_sections:
  - name: Gene filters
    icon: mdi:filter-variant
    color: violet
    description: Biotype and expression floor on the gene counts
  grid_sections:
  - name: Libraries at a glance
    icon: mdi:counter
    color: violet
    description: Depth, genes detected and how concentrated each library is
  - name: Sample structure
    icon: mdi:chart-scatter-plot
    color: violet
    description: The libraries on the first components of log CPM
  - name: Sample correlation
    icon: mdi:relation-many-to-many
    color: violet
    description: Spearman correlation between the libraries, clustered
  # Collapsed: its 100 rows autofit to about ten grid rows, past the tab's
  # budget, and the PCA and the correlation above already answer the tab.
  - name: Most variable genes
    icon: mdi:chart-box-outline
    color: gray
    description: The genes that separate the libraries, row-standardised
    collapsed: true
  - name: Libraries and counts
    icon: mdi:chart-bar
    color: gray
    description: The design behind the libraries and the count distributions
    collapsed: true
  - name: Quantification tables
    icon: mdi:table
    color: gray
    description: Per-library readings, the correlation matrix and the gene counts
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [Bambu](https://github.com/GoekeLab/bambu) assigns each long read to a gene and transcript
      model and counts them per library. The PCA and the correlation matrix read log CPM over the
      most variable genes: the libraries should group by condition, and a split by library
      preparation or flow-cell run, where a design table names them, is a confounder.
    tag: ns-qt-intro
    index: qt-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_gene_long
    interactive_component_type: MultiSelect
    column_name: gene_biotype
    column_type: object
    display:
      icon_name: mdi:shape-plus-outline
      custom_color: grape
    section: Gene filters
    group: Genes
    tag: ns-qt-filter-biotype
    index: qt-biotype-filter
    title: Gene biotype
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_gene_long
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: log_cpm
    column_type: float64
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: violet
    section: Gene filters
    group: Genes
    tag: ns-qt-filter-logcpm
    index: qt-logcpm-filter
    title: log2(CPM + 1)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/sample_pca
    aggregation: sum
    column_name: total_counts
    column_type: float64
    secondary_layout: composition
    breakdown_col: condition
    display:
      icon_name: mdi:counter
      icon_color: violet.4
      caption: assigned reads, by condition
    section: Libraries at a glance
    tag: ns-qt-card-assigned
    index: qt-card-assigned
    title: Reads assigned
    description: Reads Bambu assigned to a gene over the libraries in view.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/sample_pca
    aggregation: median
    column_name: n_genes_detected
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:dna
      icon_color: violet.6
      caption: median per library, with its spread
      decimals: 0
    section: Libraries at a glance
    tag: ns-qt-card-genes
    index: qt-card-genes
    title: Genes detected
    description: Median number of genes with at least one read in a library.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/sample_pca
    aggregation: median
    column_name: pct_protein_coding
    column_type: float64
    filter_expr: col('total_counts') > 0
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:chart-donut
      icon_color: violet.8
      caption: median share of each library
      decimals: 1
    section: Libraries at a glance
    tag: ns-qt-card-coding
    index: qt-card-coding
    title: Protein-coding share (%)
    description: Median share of a library's counts on protein-coding genes.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/sample_pca
    aggregation: median
    column_name: top50_share_pct
    column_type: float64
    filter_expr: col('total_counts') > 0
    secondary_layout: histogram
    display:
      icon_name: mdi:star-outline
      icon_color: violet.9
      caption: median, with its distribution
      decimals: 1
    section: Libraries at a glance
    tag: ns-qt-card-top50
    index: qt-card-top50
    title: Top-50 gene share (%)
    description: Median share of a library's counts on its 50 most expressed genes; high is concentrated.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # No centroids: with two or three libraries per condition the labels would
  # cover the points.
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/pca
    config:
      color_col: condition
      default_color_by: condition
      axis_prefix: PC
      hover_cols: [total_counts, n_genes_detected, top50_share_pct]
      selection_enabled: true
      selection_column: sample_id
    section: Sample structure
    tag: ns-qt-pca
    index: qt-pca
    title: Libraries on log-CPM gene expression (PCA)
    description: >-
      Do the libraries group by condition? Each point is one library placed on the first two principal
      components of its log2(CPM + 1) gene expression, computed on the 500 most variable genes and
      coloured by condition. Hover a point for its depth, genes detected and top-50 share.

      How to read: replicates of one condition should sit together and the conditions apart along the
      first component, and a first component that follows the preparation or the run is a confounder. A
      library that sits away from its replicates is the one to check on the correlation heatmap of this
      tab. Click a point to pick its library.

      Lines and annotations: no line, ellipse or centroid is drawn, so each point stands for one library
      only. The 500 genes follow the default of the DESeq2 plotPCA function.

      Source: DESeq2 plotPCA, argument ntop (default 500),
      https://sources.debian.org/src/r-bioc-deseq2/1.46.0%2Bdfsg-2/man/plotPCA.Rd

      Note: with only a few libraries per condition the components are unstable, so read the grouping and
      not the exact distances.
    layout: {x: 0, y: 0, w: 8, h: 6}
  # Library ids on both axes: full width, and 40 px cells, or the heatmap draws as
  # a strip (the viewer sizes it from its rows at 12 px a cell by default).
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_correlation
    use: bambu/correlation_heatmap
    config:
      index_column: sample_id
      # Every library column, not the per-row mean the table also carries.
      value_columns_pattern: '^(?!mean_correlation$)'
      row_annotation_cols: [condition]
      cluster_rows: true
      cluster_cols: true
      cluster_method: ward
      colorscale: Blues
      min_cell_px: 40
      max_rows: 10
    section: Sample correlation
    tag: ns-qt-correlation
    index: qt-correlation
    title: Library correlation (Spearman, log CPM)
    description: >-
      How alike are the libraries? Each cell is the Spearman correlation of two libraries on log2(CPM +
      1), over the genes with at least one read in the run. Libraries are clustered by Ward linkage on
      both axes, and a bar beside the heatmap gives each library's condition.

      How to read: replicates should form the darkest blocks, next to each other in the tree. A library
      that correlates better with the other condition than with its own replicates is a swapped label or a
      replicate that did not replicate. Whole-transcriptome correlations are high between any two
      libraries, so read the contrast between cells and not the absolute value.

      Lines and annotations: no cut-off is drawn. The Blues scale darkens with the correlation, and the
      legend gives its range.

      Note: Spearman uses ranks, so a few very highly expressed genes cannot set the coefficient.
    layout: {x: 0, y: 0, w: 8, h: 10}
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: bambu_top_variable_genes
    use: bambu/variable_gene_heatmap
    config:
      index_column: gene_id
      # Every library column, not the variance the genes were ranked by.
      value_columns_pattern: '^(?!log_cpm_variance$)'
      row_annotation_cols: [gene_biotype]
      normalize: row_z
      cluster_rows: true
      cluster_cols: true
      colorscale: RdBu
    section: Most variable genes
    tag: ns-qt-variable-genes
    index: qt-variable-genes
    title: The 100 most variable genes
    description: >-
      Which genes separate the libraries? One row per gene, for the 100 genes with the highest variance of
      log2(CPM + 1) among those with at least 10 reads in the run, and one column per library. Each row is
      standardised, so a cell shows the library against the gene's own mean.

      How to read: the tree over the columns should repeat the split of the PCA. Blocks of genes high in
      one condition and low in the other are the expression signature of the contrast. A gene that departs
      in a single library is an outlier to check in the counts table.

      Lines and annotations: a diverging scale centred on the gene's mean, with rows and columns
      clustered, and a bar giving each gene's biotype. No cut-off is drawn.

      Note: ranking by variance on CPM and not on raw counts is what keeps the list from being a
      library-size ranking.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: design
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: donut
    breakdown_col: protocol
    display:
      icon_name: mdi:flask-outline
      icon_color: violet.5
      caption: libraries, by preparation
    section: Libraries and counts
    tag: ns-qt-card-protocol
    index: qt-card-protocol
    title: Libraries by preparation
    description: A preparation that splits with the condition confounds it.
    layout: {x: 0, y: 0, w: 4, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: design
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: donut
    breakdown_col: run_id
    display:
      icon_name: mdi:calendar-outline
      icon_color: violet.7
      caption: libraries, by flow-cell run
    section: Libraries and counts
    tag: ns-qt-card-runs
    index: qt-card-runs
    title: Libraries by flow-cell run
    description: A run that splits with the condition confounds it.
    layout: {x: 4, y: 0, w: 4, h: 2}
  - component_type: figure
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_gene_long
    use: bambu/counts_gene_long
    visu_type: box
    mode: code
    code_content: |-
      # log CPM of the detected genes per library: by condition, or by Analysis
      # mode's groups when it has some.
      d = df.filter(pl.col('count') > 0).sort('sample')
      kw = depictio_group_kwargs or {'color': 'condition', 'color_discrete_map': depictio_category_colors.get('condition') or {}}
      fig = px.box(d.to_pandas(), x='sample', y='log_cpm', labels={'sample': 'Library', 'log_cpm': 'log2(CPM + 1)', 'condition': 'Condition'}, **kw)
      fig.update_layout(margin=dict(t=10))
    section: Libraries and counts
    tag: ns-qt-distribution
    index: qt-distribution
    title: Gene expression per library
    description: >-
      Are the libraries comparable after normalisation? One box per library of log2(CPM + 1) over the
      genes with at least one read in that library, coloured by condition.

      How to read: after CPM normalisation the boxes should line up. A shifted or squeezed box is a
      library whose composition differs, for example one dominated by a few genes or one detecting many
      low-count genes. Such a library is worth a look on the PCA and the correlation before it enters a
      comparison.

      Lines and annotations: the line in each box is the median and the box spans the quartiles. The
      whiskers reach 1.5 times the interquartile range and the dots beyond are outliers, as the Plotly box
      plot draws them.

      Note: genes with no read are left out, so a deeper library detects more genes and its box shifts.
    layout: {x: 0, y: 2, w: 8, h: 4}
  - component_type: table
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/sample_pca
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Quantification tables
    tag: ns-qt-table-pca
    index: qt-table-pca
    title: Per-library readings
    description: >-
      Per-library readings: reads Bambu assigned, genes detected, share of the reads on protein-coding
      genes, share on the 50 most expressed genes, and the PCA coordinates.

      How to read: a high top-50 share means a few genes take most of the library, which is the plainest
      reading of low complexity. A protein-coding share that differs between replicates is worth a look.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_correlation
    use: bambu/sample_correlation
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Quantification tables
    tag: ns-qt-table-correlation
    index: qt-table-correlation
    title: Correlation matrix
    description: >-
      The correlation matrix of the heatmap as numbers: one row per library, one column per library, and
      the library's mean correlation.

      How to read: sort by the mean correlation to find the library that agrees least with the rest. A
      value far below those of its replicates is a library to check before any comparison.
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: table
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_gene_long
    use: bambu/counts_gene_long
    section: Quantification tables
    tag: ns-qt-table-counts
    index: qt-table-counts
    title: Gene counts per library
    description: >-
      Bambu's gene counts, one row per library and gene, with the count, its CPM and log2(CPM + 1), the
      gene's biotype and the library's condition.

      How to read: filter on a gene or a biotype to see its counts in every library, or on a library to
      list its most expressed genes. The gene and sample filters of the tab narrow it.

      Note: annotation entries that share an Ensembl gene id are summed into one gene, and genes with no
      read in the run are left out.
    layout: {x: 0, y: 12, w: 8, h: 6}
- title: Gene expression
  subtitle: Which genes differ between the two conditions?
  tab_group: Expression
  tab_order: 5
  tab_icon: mdi:scale-balance
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # Every control here filters deseq2_results, which has no sample column. No
  # direction filter: the up and down cards each read one direction.
  filter_sections:
  - name: DE filters
    icon: mdi:filter-variant
    color: grape
    description: Significance, effect size, biotype and expression on the DESeq2 results
  grid_sections:
  - name: Calls at a glance
    icon: mdi:counter
    color: grape
    description: Significant genes, their effect sizes and the strong effects
  - name: Volcano
    icon: mdi:chart-scatter-plot
    color: grape
    description: Effect size against significance, one point per tested entry
  - name: Largest effects
    icon: mdi:chart-bar
    color: grape
    description: The genes with the largest fold changes, signed
  - name: Best-measured genes
    icon: mdi:table
    color: gray
    description: The 200 rows with the highest mean normalised count
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    values:
      contrast: {dc: deseq2_results, column: contrast, aggregation: top}
    body: >
      [DESeq2](https://bioconductor.org/packages/DESeq2/) tests Bambu's counts between the
      run's two conditions ({{contrast}}), once over the whole run, so the sample filters do not
      narrow this tab. A call clears a 5% FDR and a two-fold change, and up means higher in the
      first condition; the View switch reads the same rows as an MA or a QQ plot.
    tag: ns-de-intro
    index: de-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: padj
    column_type: float64
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: grape
    section: DE filters
    group: Calls
    tag: ns-de-filter-padj
    index: de-padj-filter
    title: Adjusted p-value
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: log2fc
    column_type: float64
    display:
      icon_name: mdi:swap-vertical
      custom_color: pink
    section: DE filters
    group: Calls
    tag: ns-de-filter-log2fc
    index: de-log2fc-filter
    title: log2 fold change
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    interactive_component_type: MultiSelect
    column_name: gene_biotype
    column_type: object
    display:
      icon_name: mdi:shape-plus-outline
      custom_color: grape
    section: DE filters
    group: Genes
    tag: ns-de-filter-biotype
    index: de-biotype-filter
    title: Gene biotype
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: log2_base_mean
    column_type: float64
    display:
      icon_name: mdi:chart-line
      custom_color: violet
    section: DE filters
    group: Genes
    tag: ns-de-filter-basemean
    index: de-basemean-filter
    title: log2 mean expression
    layout: {x: 0, y: 9, w: 1, h: 3}
  # nunique per direction draws ranked bars: up and down, short labels.
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: nunique
    column_name: gene_id
    column_type: object
    filter_expr: col('significant') == True
    secondary_layout: top_n
    breakdown_col: direction
    top_n_count: 2
    display:
      icon_name: mdi:scale-balance
      icon_color: grape.4
      caption: genes, up and down
      decimals: 0
    section: Calls at a glance
    tag: ns-de-card-genes
    index: de-card-genes
    title: Significant genes
    description: Distinct genes with a call at a 5% FDR and a two-fold change.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: median
    column_name: log2fc
    column_type: float64
    filter_expr: col('direction') == 'up'
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:trending-up
      icon_color: grape.6
      caption: median of the up calls, with its spread
      decimals: 2
    section: Calls at a glance
    tag: ns-de-card-up
    index: de-card-up
    title: Fold change up (log2)
    description: Median log2 fold change of the calls higher in the first condition of the contrast.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: median
    column_name: log2fc
    column_type: float64
    filter_expr: col('direction') == 'down'
    secondary_layout: histogram
    display:
      icon_name: mdi:trending-down
      icon_color: grape.8
      caption: the down calls, their distribution
      decimals: 2
    section: Calls at a glance
    tag: ns-de-card-down
    index: de-card-down
    title: Fold change down (log2)
    description: Median log2 fold change of the calls lower in the first condition of the contrast.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # Past the two-fold cut-off every call already is significant, so the strong
  # effects are the calls at four-fold or more, either way: the genes where the
  # biology is large, ranked by biotype (nunique per category draws ranked bars).
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: nunique
    column_name: gene_id
    column_type: object
    filter_expr: "(col('significant') == True) & ((col('log2fc') >= 2) | (col('log2fc') <= -2))"
    secondary_layout: top_n
    breakdown_col: gene_biotype
    top_n_count: 3
    display:
      icon_name: mdi:target
      icon_color: grape.9
      caption: genes at four-fold or more, by biotype
      decimals: 0
    section: Calls at a glance
    tag: ns-de-card-strong
    index: de-card-strong
    title: Strong effects
    description: Distinct genes with a call and a log2 fold change of 2 or more, in either direction.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # One tile, three views of the same rows: the MA view reads log2_base_mean,
  # the QQ view the raw p-values. No point labels: Ensembl ids pile up.
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/volcano
    config:
      view: volcano
      views: [volcano, ma, qq]
      avg_log_intensity_col: log2_base_mean
      log2_fold_change_col: log2fc
      p_value_col: pvalue
      label_col: gene_id
      category_col: direction
      significance_threshold: 0.05
      effect_threshold: 1.0
      fold_change_threshold: 1.0
      show_labels: false
      effect_label: log2 fold change
      significance_label: -log10 adjusted p-value
    section: Volcano
    tag: ns-de-volcano
    index: de-volcano
    title: Effect size against significance
    description: >-
      Which genes change between the conditions, and by how much? Each point is one annotation entry
      DESeq2 tested, placed by its log2 fold change (x) and by -log10 of its adjusted p-value (y), and
      coloured by the direction of the call.

      How to read: points far to the left or right and high up are strong, significant changes, and the
      first condition of the contrast is the one a positive fold change is higher in. A tall column near
      zero is significant but small, which is why a fold-change cut-off is added. Switch the view to MA to
      see whether the calls sit only at low expression, and to QQ to read the inflation: a lambda near 1
      means the p-values follow what chance gives, and a high one means more small p-values than chance,
      from a wide real response or a confounder.

      Lines and annotations: on the volcano, two dotted vertical lines at log2 fold change -1 and +1
      (two-fold) and one dotted horizontal line at an adjusted p-value of 0.05 (a 5% false discovery
      rate). On the MA view, two dotted horizontal lines at log2 fold change -1 and +1. On the QQ view, a
      dashed diagonal where observed equals expected, and the lambda badge.

      Source: DESeq2 vignette,
      https://bioconductor.org/packages/release/bioc/vignettes/DESeq2/inst/doc/DESeq2.html

      Note: the 0.05 and the two-fold lines are this template's call and not DESeq2's, whose own alpha
      default is 0.1. They are not validated cut-offs. A point is an annotation entry and not a gene, so
      entries that share a gene are separate points.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/da_barplot
    config:
      feature_id_col: gene_id
      contrast_col: contrast
      lfc_col: log2fc
      significance_col: padj
      significance_threshold: 0.05
      top_n: 20
    section: Largest effects
    tag: ns-de-barplot
    index: de-barplot
    title: The twenty largest fold changes
    description: >-
      Which entries have the largest fold changes? The twenty annotation entries with the largest absolute
      log2 fold change among those DESeq2 tested, as signed bars labelled by gene, coloured by direction.

      How to read: a solid bar cleared the adjusted p-value cut-off, and a hatched one did not. Solid bars
      at both ends are the candidates to follow up on the volcano. A large hatched bar is a big change
      measured on little evidence, often a lowly expressed entry.

      Lines and annotations: the vertical axis line at 0 is no change. The solid or hatched fill switches
      at an adjusted p-value of 0.05 (a 5% false discovery rate), and an entry that DESeq2 gave no
      adjusted p-value counts as not significant.

      Note: the entries are ranked on effect size alone, and the 0.05 is this template's choice and not a
      validated cut-off. DESeq2's own alpha default is 0.1
      (https://bioconductor.org/packages/release/bioc/vignettes/DESeq2/inst/doc/DESeq2.html).
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: nanoseq
    data_collection_tag: deseq2_top_expressed
    use: deseq2/results
    section: Best-measured genes
    tag: ns-de-table-top
    index: de-table-top
    title: Best-measured DESeq2 rows
    description: >-
      The 200 DESeq2 rows with the highest mean normalised count, the best-measured entries of the run,
      with their log2 fold change, p-value and adjusted p-value.

      How to read: use it to check a number seen on a plot against the table. Sort by adjusted p-value or
      by fold change to list the entries that matter among the well-measured ones.

      Note: this is a slice of the results. The volcano, the MA view, the QQ view and the bars read the
      full table.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Isoform usage
  subtitle: Which transcripts change their share, and what do their reads show?
  tab_group: Expression
  tab_order: 6
  tab_icon: mdi:chart-timeline-variant
  tab_icon_color: pink
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Isoform filters
    icon: mdi:filter-variant
    color: pink
    description: Gene picks the genes of the usage split; biotype and floor narrow the transcript counts
  grid_sections:
  - name: Usage at a glance
    icon: mdi:counter
    color: pink
    description: Transcripts tested, their usage shifts and the reads on isoforms
  - name: Usage volcano
    icon: mdi:chart-scatter-plot
    color: pink
    description: Change in usage against the gene-level q-value, one point per transcript
  - name: Usage per library
    icon: mdi:chart-bar
    color: pink
    description: Opens on the 6 best genes by q-value; the Gene filter picks up to 12 of the best 40.
  - name: Isoform expression
    icon: mdi:chart-box-outline
    color: gray
    description: Transcript-level counts per library
    collapsed: true
  - name: Isoform tables
    icon: mdi:table
    color: gray
    description: The transcript counts behind the usage
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    values:
      contrast: {dc: deseq2_results, column: contrast, aggregation: top}
    body: >
      [DEXSeq](https://bioconductor.org/packages/DEXSeq/) asks whether a transcript is used more
      or less relative to its gene's other transcripts, on Bambu's transcript counts, once over the
      whole run: significance is the gene-level adjusted q-value, and a gain is a higher share in
      the first condition of {{contrast}}. To choose a gene, use the Gene filter at the head of this
      tab's filters in the left panel: it lists the 40 genes with the best q-value and redraws the usage split of the ones you
      pick. A transcript's record and its reads in the genome browser are on the [Locus](tab:Locus) tab.
    tag: ns-is-intro
    index: is-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  # First filter of the tab on purpose: it is how a gene is chosen. The recipe keeps
  # the forty best-ranked genes and any of them can be picked here. Only the
  # usage-per-library tile has this column (gene id with its q-value), so no
  # other tile of the tab narrows.
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: dexseq_usage
    interactive_component_type: MultiSelect
    column_name: gene_label
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: pink
    section: Isoform filters
    group: Genes
    tag: ns-is-filter-gene
    index: is-gene-filter
    title: Gene
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_transcript_long
    interactive_component_type: MultiSelect
    column_name: gene_biotype
    column_type: object
    display:
      icon_name: mdi:shape-plus-outline
      custom_color: grape
    section: Isoform filters
    group: Transcripts
    tag: ns-is-filter-biotype
    index: is-biotype-filter
    title: Gene biotype
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_transcript_long
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: log_cpm
    column_type: float64
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: pink
    section: Isoform filters
    group: Transcripts
    tag: ns-is-filter-logcpm
    index: is-logcpm-filter
    title: log2(CPM + 1)
    layout: {x: 0, y: 6, w: 1, h: 3}
  # Not a ring by direction: "not significant" fills it, and one call in 400
  # rounds to 0%. The threshold counts the calls exactly. One row per
  # transcript, every one with a q-value, so the count is the transcripts.
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: dexseq_results
    use: dexseq/results
    aggregation: count
    column_name: padj
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.05
    threshold_direction: max
    display:
      icon_name: mdi:chart-donut
      icon_color: pink.4
      caption: transcripts against a 5% gene-level q-value
      decimals: 0
    section: Usage at a glance
    tag: ns-is-card-tested
    index: is-card-tested
    title: Transcripts tested
    description: Transcripts DEXSeq tested; the bar counts those whose gene clears a 5% q-value.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: dexseq_results
    use: dexseq/results
    aggregation: median
    column_name: log2fc
    column_type: float64
    filter_expr: (col('significant') == True) & (col('log2fc') > 0)
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:trending-up
      icon_color: pink.6
      caption: median of the significant gains, with its spread
      decimals: 2
    section: Usage at a glance
    tag: ns-is-card-gain
    index: is-card-gain
    title: Usage gain (log2)
    description: Median log2 fold change of the significant transcripts used more in the first condition of the contrast.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: dexseq_results
    use: dexseq/results
    aggregation: median
    column_name: log2fc
    column_type: float64
    filter_expr: (col('significant') == True) & (col('log2fc') < 0)
    secondary_layout: histogram
    display:
      icon_name: mdi:trending-down
      icon_color: pink.8
      caption: the significant losses, their distribution
      decimals: 2
    section: Usage at a glance
    tag: ns-is-card-loss
    index: is-card-loss
    title: Usage loss (log2)
    description: Median log2 fold change of the significant transcripts used less in the first condition of the contrast.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_transcript_long
    use: bambu/counts_transcript_long
    aggregation: sum
    column_name: count
    column_type: float64
    secondary_layout: composition
    breakdown_col: condition
    display:
      icon_name: mdi:counter
      icon_color: pink.9
      caption: reads, by condition
    section: Usage at a glance
    tag: ns-is-card-reads
    index: is-card-reads
    title: Reads on isoforms
    description: Reads Bambu assigned to a transcript over the libraries in view.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # DEXSeq has no mean-intensity column, so no MA view. No point labels:
  # transcript ids pile up.
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: dexseq_results
    use: dexseq/volcano
    config:
      view: volcano
      views: [volcano, qq]
      p_value_col: pvalue
      label_col: feature_id
      category_col: direction
      significance_threshold: 0.05
      # 0: DEXSeq's call is the gene-level q-value alone, so the badges count
      # the transcripts the cards and the Findings row count.
      effect_threshold: 0.0
      show_labels: false
      effect_label: log2 fold change in usage
      significance_label: -log10 gene-level q-value
    section: Usage volcano
    tag: ns-is-volcano
    index: iso-volcano
    title: Change in usage against significance
    description: >-
      Which transcripts change their share of their gene? Each point is one transcript DEXSeq tested,
      placed by the log2 fold change of its usage (x) and by -log10 of its gene-level adjusted q-value
      (y), coloured by the direction of the call.

      How to read: a high point is a gene whose isoform use changed between the conditions, and the sign
      says in which condition the transcript gains share. The q-value belongs to the gene, so the
      transcripts of one gene sit at the same height. Switch the view to QQ to read the raw p-values
      against what chance gives, and open the [Locus](tab:Locus) tab to see the reads of a transcript.

      Lines and annotations: the dotted horizontal line is a gene-level q-value of 0.05 (a 5% false
      discovery rate). The vertical line at 0 is no change in usage, and no fold-change cut-off is applied
      since the q-value alone decides the call. On the QQ view, a dashed diagonal where observed equals
      expected, and the lambda badge.

      Source: DEXSeq, Anders, Reyes and Huber 2012, doi:10.1101/gr.133744.111

      Note: the 0.05 is this template's call and not a validated cut-off. As the q-value is shared by all
      the transcripts of a gene, the points above the line overstate the number of genes affected.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: figure
    workflow_tag: nanoseq
    data_collection_tag: dexseq_usage
    visu_type: bar
    mode: code
    code_content: |-
      # Each library's split of its gene's reads across the gene's transcripts,
      # one panel per gene, its q-value in the panel title. The recipe keeps the
      # best-ranked genes; unfiltered the tile draws the six best, and a pick of
      # up to twelve genes in the left panel is drawn whole.
      d = df.sort(['gene_padj', 'gene_id', 'sample', 'transcript_id'], nulls_last=True)
      genes = d.get_column('gene_label').unique(maintain_order=True).to_list()
      if len(genes) > 12:
          genes = genes[:6]
      d = d.filter(pl.col('gene_label').is_in(genes))
      fig = px.bar(d.to_pandas(), x='sample', y='usage_pct', color='transcript_id', facet_col='gene_label', facet_col_wrap=3, category_orders={'gene_label': genes}, labels={'sample': 'Library', 'usage_pct': 'Share of the gene (%)', 'transcript_id': 'Transcript', 'gene_label': 'Gene'})
      fig.for_each_annotation(lambda a: a.update(text=a.text.split('=')[-1]))
      # No legend: one entry per transcript id of every panel; a hover names it.
      fig.update_layout(barmode='stack', showlegend=False, margin=dict(t=30))
    section: Usage per library
    tag: ns-is-usage
    index: is-usage
    title: Transcript usage per library, chosen genes
    description: >-
      How is each gene's reads split across its transcripts in each library? One panel per gene, its
      gene-level DEXSeq q-value in the title, with one stacked bar per library. Each segment is a
      transcript and each bar sums to 100% of the gene's reads.

      How to read: a segment that grows in the libraries of one condition and shrinks in the other is the
      switch DEXSeq called. Bars that look alike across all libraries mean that the gene's q-value rests
      on a small change or on a single library. The tile opens on the six genes with the best q-value, or
      on the genes picked in the Gene filter, up to twelve of the best forty.

      Lines and annotations: no line or cut-off is drawn. The q-value in each panel title is DEXSeq's
      result for the gene and not a threshold. Hover a segment for its transcript, since no legend is
      drawn.

      Note: the shares are recomputed from the Bambu transcript counts DEXSeq ran on, so they follow the
      test but are not DEXSeq's own normalised counts.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_transcript_long
    use: bambu/counts_transcript_long
    visu_type: box
    mode: code
    code_content: |-
      # log CPM of the detected transcripts per library: by condition, or by
      # Analysis mode's groups when it has some.
      d = df.filter(pl.col('count') > 0).sort('sample')
      kw = depictio_group_kwargs or {'color': 'condition', 'color_discrete_map': depictio_category_colors.get('condition') or {}}
      fig = px.box(d.to_pandas(), x='sample', y='log_cpm', labels={'sample': 'Library', 'log_cpm': 'log2(CPM + 1)', 'condition': 'Condition'}, **kw)
      fig.update_layout(margin=dict(t=10))
    section: Isoform expression
    tag: ns-is-distribution
    index: is-distribution
    title: Transcript expression per library
    description: >-
      Are the libraries comparable at the transcript level? One box per library of log2(CPM + 1) over the
      transcripts with at least one read in that library, coloured by condition. It is the
      transcript-level twin of the gene distribution, on the same CPM scale.

      How to read: the boxes should line up after CPM normalisation. A shifted or squeezed box is a
      library of different composition or depth, which weakens a comparison of transcript usage with the
      others.

      Lines and annotations: the line in each box is the median and the box spans the quartiles. The
      whiskers reach 1.5 times the interquartile range and the dots beyond are outliers, as the Plotly box
      plot draws them.

      Note: transcripts with no read are left out, so a deeper library detects more of them and its box
      shifts.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_transcript_long
    use: bambu/counts_transcript_long
    section: Isoform tables
    tag: ns-is-table-counts
    index: is-table-counts
    title: Transcript counts per library
    description: >-
      Bambu's transcript counts, one row per library and transcript, with the count, its CPM and log2(CPM
      + 1), the gene's biotype and the library's condition.

      How to read: filter on a transcript to see its counts in every library, and compare the libraries of
      one condition. The sample, biotype and expression filters of the tab narrow it.
    layout: {x: 0, y: 0, w: 8, h: 6}
# The transcripts DEXSeq tested, picked in a table: its record, its structure and
