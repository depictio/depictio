# nf-core/nanoseq 3.0.0. Every rule it follows is written out in
# depictio/projects/nf-core/RULES.md.
#
# The hub is `samples`, one row per library, the source of every sample link
# in template.yaml: a filter on it reaches NanoStat, samtools stats, the melted
# Bambu counts and the sample-structure collections. DESeq2 and DEXSeq run
# once over the whole run and carry no sample column, so the sample filters do
# not narrow those two tabs, and their intros say so.
#
# Routes: without a design table (METADATA_FILE) the hub falls back to the
# samplesheet group as the condition and writes "unknown" for the preparation,
# source replicate and flow-cell run; `metadata` and `design` are pruned, and with
# `design` the filters and rings bound to it (preparation, source replicate,
# flow-cell run) and the Preparations line of "The run".
# The isoform structures and the weighted introns of the Locus tab need
# bambu/extended_annotations.gtf, which a quantification-only run does not write.
# The genome browser of that tab takes its calls from `isoform_loci`, written on
# every run: without the annotation its rows have no coordinates, so the browser
# frames a transcript by its gene symbol where it can, else it opens on the first
# region its tracks hold.
#
# The design group is the `condition` column of every collection: the hub names it
# from GROUP_COL, but the Bambu collections of the catalog (counts, PCA, correlation)
# write `condition` from the `<group>_R<n>` sample name, so the dashboard keys on that
# column rather than on {GROUP_COL}.
#
# The MultiQC report was reprocessed with MultiQC 1.35 from the run's raw tool
# outputs (nanoseq 3.0.0 writes no parquet); the module and plot names below
# are the 1.35 ones.
main_dashboard:
  title: nf-core/nanoseq
  subtitle: Nanopore long reads, from QC to the genes and isoforms that differ
  project_tag: Nanopore RNA-Seq
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family: figures, advanced viz
  # and filter chips all colour a value the same way.
  category_colors:
    condition: auto
    protocol:
      '*': auto
      unknown: '#adb5bd'
    run_id:
      '*': auto
      unknown: '#adb5bd'
    direction:
      up: '#e03131'
      down: '#1971c2'
      not significant: '#adb5bd'
    # Biotypes outnumber the palette: the import ranks them by their summed
    # counts and gives the eight largest the palette.
    gene_biotype:
      '*': 'auto:count'
      Other: '#868e96'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs.
  # Bound to the samples hub, the source of every sample link.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab that has a sample column
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab rather than on an analysis tab: a run that prunes
  # that tab would take a persistent section declared there with it.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The library design behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Libraries, below).
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: condition
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: Condition
    section: Key figures
    tag: ns-ov-kf-condition
    index: ov-kf-condition
    title: Condition
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Library
    section: Key figures
    tag: ns-ov-kf-sample
    index: ov-kf-sample
    title: Library
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: text
    title: nf-core/nanoseq
    logo: https://raw.githubusercontent.com/nf-core/nanoseq/master/docs/images/nf-core-nanoseq_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/nanoseq/master/docs/images/nf-core-nanoseq_logo_dark.png
    order: 1
    body: >
      Nanopore long reads from basecalled FASTQ to gene and transcript counts, and the genes and
      isoforms that differ between conditions. [Run parameters](params:)
    tag: ns-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  # The study: the libraries and the design they were prepared under, from the sample hub
  # and the design table. The preparation line cites the design table, so it goes with it.
  - component_type: text
    surface: card
    values:
      libs: {dc: samples, column: sample_id, aggregation: nunique, format: integer}
      conds: {dc: samples, column: condition, aggregation: nunique, format: integer}
      reps: {dc: samples, column: replicate, aggregation: max, format: integer}
      preps: {dc: design, column: protocol, aggregation: nunique, format: integer}
    body: |
      ### The study
      - ![](icon:mdi:test-tube) **Libraries** {{libs}} in {{conds}} conditions
      - ![](icon:mdi:content-copy) **Replicates** up to {{reps}} a condition
      - ![](icon:mdi:flask-outline) **Preparations** {{preps}} library protocols
      - ![](icon:mdi:file-table-outline) **Samplesheet** [one row per library](section:Sample sheet), its path in [the run parameters](params:input)
      - ![](icon:mdi:palette-outline) **Condition** {{legend:condition}}
      - ![](icon:mdi:palette-outline) **Protocol** {{legend:protocol}}
    tag: ns-ov-study
    index: ov-study
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's facts, read from its data and its software versions. A tool version
  # shares its line with a count, so the line goes with its data.
  - component_type: text
    surface: card
    values:
      reads: {dc: nanostats, column: n_reads, aggregation: sum, format: si}
      genes: {dc: bambu_counts_gene_long, column: gene_id, aggregation: nunique, format: si}
    body: |
      ### The run
      - ![](icon:mdi:source-branch) **Pipeline** nf-core/nanoseq 3.0.0
      - ![](icon:mdi:counter) **Reads** {{reads}}, NanoPlot {{param:NANOPLOT.nanoplot}}
      - ![](icon:mdi:dna) **Counting** {{genes}} genes, Bambu {{param:BAMBU.bioconductor-bambu}}
    tag: ns-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  # The marks take the family's colour (the header's), not the theme's blue.
  # The run has no params.json, so each step's link searches the software
  # versions for its tool.
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Five steps from raw reads to isoforms
      Each step names its tool versions and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:check-decagram) **QC** NanoPlot and FastQC on the raw reads · [Versions](params:nanoplot) · [Reads](tab:Reads)
      2. ![](icon:mdi:dna) **Align** minimap2 to the reference · [Versions](params:minimap2) · [Alignment](tab:Alignment)
      3. ![](icon:mdi:counter) **Count** Bambu, per gene and transcript · [Versions](params:bambu) · [Quantification](tab:Quantification)
      4. ![](icon:mdi:scale-balance) **Genes** DESeq2 between the conditions · [Versions](params:deseq2) · [Genes](tab:Gene expression)
      5. ![](icon:mdi:chart-timeline-variant) **Isoforms** DEXSeq on transcript usage, reads in the browser · [Versions](params:dexseq) · [Isoforms](tab:Isoform usage) · [Locus](tab:Locus)
      :::
    tag: ns-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/nanoseq takes Nanopore reads through quality control and alignment, counts them per gene and transcript with Bambu, and tests what differs between conditions, gene by gene and isoform by isoform. This page sums up one run; each tab behind it answers one question, in the order of the steps above.

      A library is named `<condition>_R<replicate>` by the pipeline, so its name reads as its condition and replicate; the Libraries card below splits them by condition. The sample filters in the left panel apply to every tab with a sample column: narrow the libraries once and those tabs follow. A bar above a section narrows that section only.
    tag: ns-ov-about
    index: ov-about
    layout: {x: 0, y: 7, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. The icon colour is that tab's colour. Every route writes all
  # four collections.
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: samples
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: composition
    breakdown_col: condition
    display:
      icon_name: mdi:test-tube
      icon_color: orange
      caption: in the sample sheet, by condition
      link: tab:MultiQC
    section: Key figures
    tag: ns-ov-kf-libraries
    index: ov-kf-libraries
    title: Libraries
    description: Libraries in the sample sheet. The bar splits them by condition.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: median
    column_name: read_length_n50
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: cyan
      caption: median per library, with its spread
      link: tab:Reads
      decimals: 0
    section: Key figures
    tag: ns-ov-kf-n50
    index: ov-kf-n50
    title: Read length N50
    description: Median read length N50 of the libraries in view, in bases. The box shows how it spreads.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/stats_sections
    aggregation: median
    column_name: reads_mapped_pct
    column_type: float64
    filter_expr: col('section') == 'SN'
    secondary_layout: coverage
    coverage_max: 100
    display:
      icon_name: mdi:check-decagram
      icon_color: indigo
      caption: median share of each library's reads
      link: tab:Alignment
      decimals: 1
    section: Key figures
    tag: ns-ov-kf-placed
    index: ov-kf-placed
    title: Reads placed (%)
    description: Median share of each library's reads minimap2 placed on the reference.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # DESeq2 tests one row per annotation entry (an exon), so the rows are not
  # genes: this counts the distinct genes with a call, as the Gene expression
  # tab does, and the two numbers are the same.
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: nunique
    column_name: gene_id
    column_type: object
    filter_expr: col('significant') == True
    secondary_layout: top_n
    breakdown_col: direction
    top_n_count: 2
    display:
      icon_name: mdi:scale-balance
      icon_color: grape
      caption: genes with a call, up and down
      link: tab:Gene expression
      decimals: 0
    section: Key figures
    tag: ns-ov-kf-de-calls
    index: ov-kf-de-calls
    title: Significant genes
    description: Distinct genes with a call at a 5% FDR and a two-fold change, over the whole run. The bars split them by direction.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the condition, then the library, on the hub.
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: condition
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: Condition
    section: Findings
    tag: ns-ov-findings-condition
    index: ov-findings-condition
    title: Condition
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Library
    section: Findings
    tag: ns-ov-findings-sample
    index: ov-findings-sample
    title: Library
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data. The two test rows are computed once over the
  # whole run, so no sample filter changes them. The DESeq2 row counts the
  # distinct genes with a call, as the Key figure and the Gene expression tab do
  # (DESeq2's rows are annotation entries, several per gene).
  # The DEXSeq row counts the transcripts of the genes under a 5% gene-level
  # q-value, which the volcano colours (effect_threshold 0 on its source).
  - component_type: text
    surface: card
    values:
      q7: {dc: nanostats_quality, column: pct_reads, aggregation: median, filter_expr: "col('q_cutoff') == 7",
        format: 'decimals:1'}
      pc1: {dc: bambu_sample_pca, column: pc1_var_pct, aggregation: max, format: 'decimals:1'}
      n_up: {dc: deseq2_results, column: gene_id, aggregation: nunique, filter_expr: "col('direction') == 'up'",
        format: integer}
      n_down: {dc: deseq2_results, column: gene_id, aggregation: nunique, filter_expr: "col('direction') == 'down'",
        format: integer}
      n_dtu: {dc: dexseq_results, column: feature_id, aggregation: nunique, filter_expr: "col('significant') == True",
        format: integer}
      n_tx: {dc: dexseq_results, column: feature_id, aggregation: nunique, format: integer}
      top_gene: {dc: isoform_loci, column: gene_name, aggregation: top, weight: rank_score}
    body: |
      - **{{q7}}%** of a library's reads reach Q7, the basecaller's pass floor – the median over the libraries [Reads](tab:Reads)
      - **{{pc1}}%** of the expression variance lies on the first principal component – log CPM of the most variable genes [Quantification](tab:Quantification)
      - **{{n_up}}** genes up and **{{n_down}}** down between the conditions – DESeq2, 5% FDR and a two-fold change [Genes](tab:Gene expression)
      - **{{n_dtu}}** of {{n_tx}} transcripts shift their share of their gene – DEXSeq, gene-level 5% FDR; pick one to read its splice arcs in the genome browser [Locus](tab:Locus)
      - The strongest shift of usage is in [{{top_gene}}](locus:{{top_gene}}): its reads and splice arcs in the genome browser
    section: Findings
    tag: ns-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per tab behind the rows above, in their order. The tiles of
  # a row share a stored height.
  - component_type: highlight
    section: Findings
    title: Reads above each quality floor
    source_tab: Reads
    source_component: rd-quality-ladder
    caption: One curve per library, the share of its reads above each quality floor, hover for its name; the marker is Q7, the pass floor, and a curve that falls early is the library to check.
    hide_legend: true
    tag: ns-ov-hl-quality-ladder
    index: ov-hl-quality-ladder
    layout: {x: 0, y: 2, w: 4, h: 4}
  # The highlights take a short title: the source's is cut at half width.
  - component_type: highlight
    section: Findings
    title: Libraries (PCA)
    source_tab: Quantification
    source_component: qt-pca
    caption: One point per library on the first two components of log CPM, coloured by condition; replicates should sit together.
    tag: ns-ov-hl-pca
    index: ov-hl-pca
    layout: {x: 4, y: 2, w: 4, h: 4}
  # show_labels is off on both volcano sources: Ensembl and transcript ids pile
  # up over the points.
  - component_type: highlight
    section: Findings
    title: DESeq2 volcano
    source_tab: Gene expression
    source_component: de-volcano
    caption: One point per tested annotation entry, effect against significance; the coloured calls clear a 5% FDR and a two-fold change.
    tag: ns-ov-hl-de-volcano
    index: ov-hl-de-volcano
    layout: {x: 0, y: 6, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Isoform usage
    source_component: iso-volcano
    caption: One point per transcript, its change in usage against the gene-level q-value; the coloured ones shift their share of the gene.
    tag: ns-ov-hl-iso-volcano
    index: ov-hl-iso-volcano
    layout: {x: 4, y: 6, w: 4, h: 4}
  # The transcripts DEXSeq tested along the genome, opened on the region they
  # cover: a click opens the Locus tab's browser on the gene, so the Overview
  # needs no browser of its own.
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: isoform_loci
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      chr_col: chrom
      pos_col: start
      end_col: end
      score_col: rank_score
      feature_col: gene_name
      mark: point
      point_size: 9
      score_title: Usage shift (-log10 q-value)
      assembly: '{GENOME}'
      region_filter_enabled: false
      click_opens_browser: true
      open_on_data: true
    section: Findings
    tag: ns-ov-genome
    index: ov-genome
    title: Isoform shifts along the genome
    link: tab:Locus
    description: >-
      Where along the genome do transcripts change their usage? Each dot is one transcript DEXSeq tested,
      placed at its position on the reference. Its height is -log10 of the gene-level adjusted q-value,
      with a thousandth of the effect size added so the transcripts of one gene do not overlap.

      How to read: a tall dot is a strong shift in how a gene uses its isoforms, and most dots sit low. A
      cluster of tall dots on one chromosome is a region worth opening. Click a dot to open its gene in
      the genome browser of the [Locus](tab:Locus) tab.

      Lines and annotations: no line or cut-off is drawn, the height only ranks the transcripts. On this
      axis the 5% gene-level q-value that this template uses to call a shift sits at 1.3.

      Source: DEXSeq, Anders, Reyes and Huber 2012, doi:10.1101/gr.133744.111

      Note: positions come from the annotation Bambu extended. A run without that file gives the
      transcripts no coordinates, so none can be drawn.
    layout: {x: 0, y: 10, w: 8, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Reads](tab:Reads)
      - [Alignment](tab:Alignment)

      ### Expression
      - [Quantification](tab:Quantification)
      - [Gene expression](tab:Gene expression)
      - [Isoform usage](tab:Isoform usage)
      - [Locus](tab:Locus)
    section: How to read this dashboard
    tag: ns-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the condition first, then the design columns
  # of the design table. Those are bound to `design`, which a run without a
  # design table does not have: its three filters leave the dashboard with it.
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: condition
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: ns-filter-condition
    index: sample-filters-condition
    title: Condition
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: ns-filter-sample
    index: sample-filters-sample
    title: Library
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: design
    interactive_component_type: MultiSelect
    column_name: protocol
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: grape
    section: Sample filters
    group: Design
    tag: ns-filter-protocol
    index: sample-filters-protocol
    title: Library preparation
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: design
    interactive_component_type: MultiSelect
    column_name: run_id
    column_type: object
    display:
      icon_name: mdi:calendar-outline
      custom_color: indigo
    section: Sample filters
    group: Design
    tag: ns-filter-run
    index: sample-filters-run
    title: Flow-cell run
    layout: {x: 0, y: 9, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: design
    interactive_component_type: MultiSelect
    column_name: source_replicate
    column_type: object
    display:
      icon_name: mdi:relation-many-to-many
      custom_color: blue
    section: Sample filters
    group: Design
    tag: ns-filter-source-replicate
    index: sample-filters-source-rep
    title: Source replicate
    layout: {x: 0, y: 12, w: 1, h: 3}
  # Row selection feeds the Analysis panel: the one component of the family
  # that is both persistent and row-addressable.
  - component_type: table
    workflow_tag: nanoseq
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Sample sheet
    tag: ns-sample-sheet
    index: sample-sheet
    title: Library design
    description: >-
      The library design behind every tab: one row per library with its condition, replicate and
      reference, and the preparation, source replicate and flow-cell run when a design table was given.

      How to read: check that the condition does not line up with the preparation or the run. When it
      does, a difference between conditions cannot be told from a batch effect. Rows picked here feed the
      Analysis panel.

      Note: without a design table the preparation, source replicate and run read as unknown.
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
- title: MultiQC
  subtitle: Did every library sequence and align as expected?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  grid_sections:
  - name: QC overview
    icon: mdi:chart-box-outline
    color: orange
    description: General statistics, read counts and quality, and where the reads aligned
  - name: FastQC details
    icon: mdi:file-document-outline
    color: gray
    description: The remaining FastQC panels
    collapsed: true
  - name: samtools details
    icon: mdi:file-document-outline
    color: gray
    description: The remaining samtools panels
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [MultiQC](https://multiqc.info) gathers the per-library FastQC, NanoStat and samtools
      reports. Read the general statistics first, then whether quality holds along the read and
      where the reads aligned; the NanoStat and samtools summaries are drawn in full on the
      Reads and Alignment tabs.
    tag: ns-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: QC overview
    tag: ns-mqc-general-stats
    index: mqc-general-stats
