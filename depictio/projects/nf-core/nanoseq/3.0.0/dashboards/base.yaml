# ============================================================================
# Isoforms
# ============================================================================
- title: Isoforms
  subtitle: Transcript-level counts, and the structures a run with the annotation step carries
  tab_order: 7
  tab_icon: mdi:chart-timeline-variant
  tab_icon_color: pink
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Isoform scope
    icon: mdi:filter-variant
    color: pink
    description: Biotype and expression floor on the transcript counts
  grid_sections:
  - name: Isoform expression
    icon: mdi:chart-timeline-variant
    color: pink
    description: The same matrix one level down, per transcript
  - name: Isoform structures
    icon: mdi:dna
    color: grape
    description: Exon lanes, when the run publishes the models it used
  components:
  - component_type: text
    tag: ns-is-intro
    section: Isoform expression
    title: Where the gene-level signal actually sits
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A gene's count is the sum over its isoforms, and long reads are the
      technology that can tell them apart. The cards and the table read the
      melted transcript matrix, so the sample, condition and preparation
      filters reach them; the heatmap shows the 50 transcripts with the highest
      total count.
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_transcript_long
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ns-is-card-logcpm
    index: ns-is-card-logcpm
    section: Isoform expression
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_transcript_long
    use: bambu/counts_transcript_long
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: log_cpm
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#D81B60', title_color: '#D81B60', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: log2(CPM + 1)
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-is-card-transcripts
    index: ns-is-card-transcripts
    section: Isoform expression
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_transcript_long
    use: bambu/counts_transcript_long
    aggregation: nunique
    column_name: transcript_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: gene_biotype
    top_n_count: 3
    display: {icon_name: 'mdi:chart-timeline-variant', icon_color: '#AB47BC', title_color: '#AB47BC', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Transcripts with reads
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-is-card-genes
    index: ns-is-card-genes
    section: Isoform expression
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_transcript_long
    use: bambu/counts_transcript_long
    aggregation: nunique
    column_name: gene_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:dna', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Genes with an isoform
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-is-card-counts
    index: ns-is-card-counts
    section: Isoform expression
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_transcript_long
    use: bambu/counts_transcript_long
    aggregation: sum
    column_name: count
    column_type: float64
    secondary_layout: donut
    breakdown_col: condition
    display: {icon_name: 'mdi:counter', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Reads on isoforms
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: ns-is-av-heatmap
    index: ns-is-av-heatmap
    section: Isoform expression
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_transcript
    use: bambu/top_expressed_transcripts_heatmap
    config:
      index_column: transcript_id
      row_annotation_cols: [gene_id]
      normalize: log1p
    title: "The 50 highest-count transcripts"
    description: "Raw counts, log-transformed for display. The gene annotation strip on the right shows where two isoforms of the same gene behave differently."
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 7}
  - component_type: figure
    tag: ns-is-fig-distribution
    index: ns-is-fig-distribution
    section: Isoform expression
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_transcript_long
    use: bambu/counts_transcript_long
    visu_type: box
    dict_kwargs: {x: sample, y: log_cpm, color: condition}
    title: Isoform expression distribution per library
    description: The transcript-level twin of the gene distribution, on the same CPM scale.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 11, w: 8, h: 5}
  - component_type: table
    tag: ns-is-table-long
    section: Isoform expression
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_transcript_long
    use: bambu/counts_transcript_long
    row_selection_enabled: false
    title: Transcript counts per sample
    description: One row per library and transcript, with the gene it belongs to, the raw count, CPM and log CPM.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 16, w: 8, h: 7}

  - component_type: text
    tag: ns-is-structures-intro
    section: Isoform structures
    title: Exon lanes need the models, not just the counts
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Drawing a gene's isoforms as lanes needs the exon coordinates, which live
      in `bambu/extended_annotations.gtf`, written whenever Bambu is allowed to
      extend the annotation rather than only quantify against it. This megatest
      was quantification-only and carries no annotation of its own, so the
      collection behind the tile below is optional and the tile is empty here;
      a run with that file fills it with no change to the template. The scan is
      pinned to `bambu/extended_annotations.gtf` so the reference annotation
      the run was quantified against is not drawn beside the discovered models.
    workflow_tag: nanoseq
    data_collection_tag: gtf_transcripts
    layout: {x: 0, y: 0, w: 8, h: 3}
  - component_type: advanced_viz
    tag: ns-is-av-structures
    index: ns-is-av-structures
    section: Isoform structures
    workflow_tag: nanoseq
    data_collection_tag: gtf_transcripts
    use: gtf/transcript_structures
    config:
      max_transcripts: 25
      colour_by: transcript_class
    title: "Isoform structures of one gene"
    description: "One lane per transcript of the picked gene, exons drawn on a base-pair axis. Empty on this run: see the note above."
    title_size: h3
    layout: {x: 0, y: 3, w: 8, h: 7}
  - component_type: interactive
    tag: ns-is-filter-biotype
    index: ns-is-biotype-filter
    section: Isoform scope
    group: Isoform scope
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_transcript_long
    interactive_component_type: MultiSelect
    column_name: gene_biotype
    column_type: object
    display: {title_size: md, custom_color: '#D81B60', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Gene biotype
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: ns-is-filter-logcpm
    index: ns-is-logcpm-filter
    section: Isoform scope
    group: Isoform scope
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_transcript_long
    interactive_component_type: RangeSlider
    column_name: log_cpm
    column_type: float64
    display: {title_size: md, custom_color: '#D81B60', icon_name: 'mdi:chart-bell-curve'}
    placement: left
    title: log2(CPM + 1)
    layout: {x: 0, y: 3, w: 1, h: 3}
