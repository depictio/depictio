    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_gene_long
    use: bambu/counts_gene_long
    visu_type: box
    dict_kwargs: {x: sample, y: log_cpm, color: condition}
    title: Expression distribution per library
    description: After CPM normalisation the distributions should sit on top of each other; a shifted box is a composition difference, not a depth one.
