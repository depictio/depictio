# ============================================================================
- title: Quantification and sample structure
  subtitle: What Bambu counted per gene, and whether the libraries sit where the design says
  tab_order: 5
  tab_icon: mdi:dna
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Feature scope
    icon: mdi:filter-variant
    color: violet
    description: Biotype and expression floor on the gene counts
  grid_sections:
  - name: Library composition
    icon: mdi:chart-donut
    color: violet
    description: Depth, genes detected and how concentrated each library is
  - name: Sample structure
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Where the libraries sit relative to each other
  - name: Gene counts
    icon: mdi:chart-box-outline
    color: teal
    description: The genes that separate the conditions, and the full matrix
  components:
  - component_type: text
    tag: ns-qt-intro
    section: Library composition
    title: What Bambu assigned, per library
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [Bambu](https://github.com/GoekeLab/bambu) assigns each spliced alignment
      to a gene model and counts per sample. Library size, genes detected and
      the share of the library its 50 highest genes take are three readings of
      the same thing: how much of this library is worth comparing.
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ns-qt-card-depth
    index: ns-qt-card-depth
    section: Library composition
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/sample_pca
    aggregation: sum
    column_name: total_counts
    column_type: float64
    secondary_layout: top_n
    breakdown_col: sample_id
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Reads assigned
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-qt-card-genes
    index: ns-qt-card-genes
    section: Library composition
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/sample_pca
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: n_genes_detected
    column_type: int64
    display: {icon_name: 'mdi:dna', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Genes detected
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-qt-card-coding
    index: ns-qt-card-coding
    section: Library composition
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/sample_pca
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: pct_protein_coding
    column_type: float64
    display: {icon_name: 'mdi:chart-donut', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Protein-coding share (%)
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-qt-card-top50
    index: ns-qt-card-top50
    section: Library composition
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/sample_pca
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: top50_share_pct
    column_type: float64
    display: {icon_name: 'mdi:star-outline', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Top-50 gene share (%)
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: table
    tag: ns-qt-table-pca
    section: Library composition
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/sample_pca
    row_selection_enabled: true
    row_selection_column: sample_id
    title: Per-library readings
    description: Six rows, one per library, with the embedding coordinates, library size, genes detected and the two concentration readings.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 4, w: 8, h: 3}

  - component_type: text
    tag: ns-qt-structure-intro
    section: Sample structure
    title: Do the libraries group by condition, or by preparation
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The question the preparation filter exists for. The PCA is computed on
      log CPM over the 500 most variable genes, the way DESeq2 plotPCA does;
      the correlation matrix is Spearman on the same values, which is the plot
      that catches a swapped label.
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: ns-qt-av-pca
    index: ns-qt-av-pca
    section: Sample structure
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/pca
    config:
      color_col: condition
      default_color_by: condition
      point_size: 16
      show_centroids: true
      plot_style: grid
      hover_cols: [total_counts, n_genes_detected, top50_share_pct]
      selection_enabled: true
      selection_column: sample_id
    title: "Sample PCA on log-CPM gene expression"
    description: "One point per library. The first component carries 90% of the variance here and separates the two cell lines; the second is where the library preparation shows up."
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: advanced_viz
    tag: ns-qt-av-depth
    index: ns-qt-av-depth
    section: Sample structure
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/depth_vs_complexity
    config:
      x_title: Reads assigned to a gene
      y_title: Genes detected
      log_x: true
      top_n_labels: 6
      selection_enabled: true
      selection_column: sample_id
    title: "Depth against complexity"
    description: "Genes detected saturates with depth, so a library sitting below the trend is concentrated rather than shallow. Marker size is the share its 50 top genes take."
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 7}
  - component_type: advanced_viz
    tag: ns-qt-av-correlation
    index: ns-qt-av-correlation
    section: Sample structure
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_correlation
    use: bambu/correlation_heatmap
    config:
      index_column: sample_id
      row_annotation_cols: [condition]
      cluster_rows: true
      cluster_cols: true
      cluster_metric: correlation
      colorscale: Viridis
    title: "Sample correlation, Spearman on log CPM"
    description: "Replicates of a cell line correlate around 0.85 here and across cell lines around 0.65, so the dendrogram splits on condition rather than on preparation."
    title_size: h3
    layout: {x: 0, y: 16, w: 8, h: 7}
  - component_type: table
    tag: ns-qt-table-correlation
    section: Sample structure
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_correlation
    use: bambu/sample_correlation
    row_selection_enabled: false
    title: Correlation matrix
    description: Six rows and six columns, plus each library's mean correlation with the others.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 23, w: 8, h: 3}

  - component_type: text
    tag: ns-qt-counts-intro
    section: Gene counts
    title: The genes that carry the difference
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Ranking genes by total count returns the same mitochondrial and
      ribosomal shortlist on every run. Ranking by variance of log CPM returns
      the genes that separate these libraries, which is the heatmap below; the
      count-ranked one is kept underneath for reference.
    workflow_tag: nanoseq
    data_collection_tag: bambu_top_variable_genes
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ns-qt-card-logcpm
    index: ns-qt-card-logcpm
    section: Gene counts
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_gene_long
    use: bambu/counts_gene_long
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: log_cpm
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: log2(CPM + 1)
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-qt-card-genecount
    index: ns-qt-card-genecount
    section: Gene counts
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_gene_long
    use: bambu/counts_gene_long
    aggregation: nunique
    column_name: gene_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: gene_biotype
    top_n_count: 3
    display: {icon_name: 'mdi:dna', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Genes with reads
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-qt-card-biotype
    index: ns-qt-card-biotype
    section: Gene counts
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_gene_long
    use: bambu/counts_gene_long
    aggregation: nunique
    column_name: gene_biotype
    column_type: object
    secondary_layout: donut
    breakdown_col: gene_biotype
    display: {icon_name: 'mdi:chart-donut', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Biotypes represented
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-qt-card-variance
    index: ns-qt-card-variance
    section: Gene counts
    workflow_tag: nanoseq
    data_collection_tag: bambu_top_variable_genes
    use: bambu/top_variable_genes
    aggregation: max
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: log_cpm_variance
    column_type: float64
    display: {icon_name: 'mdi:ruler', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Top log-CPM variance
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: ns-qt-av-variable
    index: ns-qt-av-variable
    section: Gene counts
    workflow_tag: nanoseq
    data_collection_tag: bambu_top_variable_genes
    use: bambu/variable_gene_heatmap
    config:
      index_column: gene_id
      row_annotation_cols: [gene_biotype]
      normalize: row_z
      cluster_rows: true
      cluster_cols: true
      colorscale: RdBu
    title: "The 100 most variable genes, row-standardised log CPM"
    description: "Rows standardised so a gene expressed at any level contributes equally. The column dendrogram is the same split the PCA and the correlation matrix show."
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 7}
  - component_type: advanced_viz
    tag: ns-qt-av-topcount
    index: ns-qt-av-topcount
    section: Gene counts
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_gene
    use: bambu/top_expressed_genes_heatmap
    config:
      index_column: gene_id
      row_annotation_cols: [gene_biotype]
      normalize: log1p
    title: "The 50 highest-count genes"
    description: "Raw counts as Bambu reports them, log-transformed for display only: no library-size normalisation, which is why the deepest libraries dominate every row."
    title_size: h3
    layout: {x: 0, y: 11, w: 8, h: 7}
  - component_type: figure
    tag: ns-qt-fig-distribution
    index: ns-qt-fig-distribution
    section: Gene counts
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_gene_long
    use: bambu/counts_gene_long
    visu_type: box
    dict_kwargs: {x: sample, y: log_cpm, color: condition}
    title: Expression distribution per library
    description: After CPM normalisation the six distributions should sit on top of each other; a shifted box is a composition difference, not a depth one.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 18, w: 8, h: 5}
  - component_type: table
    tag: ns-qt-table-long
    section: Gene counts
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_gene_long
    use: bambu/counts_gene_long
    row_selection_enabled: false
    title: Gene counts per sample
    description: One row per library and gene, with the raw count, CPM and log CPM; narrowed by the sample and biotype filters.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 23, w: 8, h: 7}
  - component_type: interactive
    tag: ns-qt-filter-biotype
    index: ns-qt-biotype-filter
    section: Feature scope
    group: Feature scope
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_gene_long
    interactive_component_type: MultiSelect
    column_name: gene_biotype
    column_type: object
    display: {title_size: md, custom_color: '#7C4DFF', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Gene biotype
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: ns-qt-filter-logcpm
    index: ns-qt-logcpm-filter
    section: Feature scope
    group: Feature scope
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_gene_long
    interactive_component_type: RangeSlider
    column_name: log_cpm
    column_type: float64
    display: {title_size: md, custom_color: '#7C4DFF', icon_name: 'mdi:chart-bell-curve'}
    placement: left
    title: log2(CPM + 1)
    layout: {x: 0, y: 3, w: 1, h: 3}

# ============================================================================
# DE and usage
# ============================================================================
- title: DE and usage
  subtitle: DESeq2 gene expression and DEXSeq transcript usage, A549 against K562
  tab_order: 6
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: DE scope
    icon: mdi:filter-variant
    color: grape
    description: Direction, biotype and expression floor on the differential results
  - name: Significance thresholds
    icon: mdi:tune
    color: cyan
    description: p-value and effect-size floors on the DESeq2 gene results
  grid_sections:
  - name: Gene expression (DESeq2)
    icon: mdi:chart-scatter-plot
    color: grape
    description: Genes whose Bambu counts differ between the two cell lines
  - name: Per-library expression behind the contrast
    icon: mdi:chart-box-outline
    color: violet
    description: The counts the statistics were computed from, per library
  - name: Exon/transcript usage (DEXSeq)
    icon: mdi:scale-balance
    color: pink
    description: Transcripts whose share of their gene shifts between conditions
  components:
  - component_type: text
    tag: ns-de-intro
    section: Gene expression (DESeq2)
    title: What moved between the cell lines
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      DESeq2 on Bambu's gene counts, one comparison. The statistic is computed
      across the whole run, so these three collections carry no sample column
      and the sample filter does not narrow them; the section below shows the
      per-library counts they were computed from, and that one does filter.
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ns-de-card-sig
    index: ns-de-card-sig
    section: Gene expression (DESeq2)
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: count
    column_name: direction
    column_type: object
    secondary_layout: donut
    breakdown_col: direction
    display: {icon_name: 'mdi:chart-donut', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Features by direction
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-de-card-lfc
    index: ns-de-card-lfc
    section: Gene expression (DESeq2)
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: log2fc
    column_type: float64
    display: {icon_name: 'mdi:ruler', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: log2 fold change
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-de-card-topn
    index: ns-de-card-topn
    section: Gene expression (DESeq2)
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: nunique
    column_name: gene_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: direction
    top_n_count: 3
    display: {icon_name: 'mdi:dna', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Genes tested
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-de-card-gauge
    index: ns-de-card-gauge
    section: Gene expression (DESeq2)
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: max
    column_name: neg_log10_padj
    column_type: float64
    secondary_layout: gauge
    coverage_max: 60
    display: {icon_name: 'mdi:target', icon_color: '#EC407A', title_color: '#EC407A', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Strongest -log10(padj)
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: ns-de-av-volcano
    index: ns-de-av-volcano
    section: Gene expression (DESeq2)
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/volcano
    config:
      label_col: gene_id
      category_col: direction
      significance_threshold: 0.05
      effect_threshold: 1.0
      top_n_labels: 15
      show_labels: true
    title: "Volcano: A549 against K562"
    description: "Effect size against significance, one point per tested feature. Labels are Ensembl gene ids now that the recipe extracts them from Bambu's attribute string."
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 7}
  - component_type: advanced_viz
    tag: ns-de-av-ma
    index: ns-de-av-ma
    section: Gene expression (DESeq2)
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/ma
    config:
      significance_col: padj
      label_col: gene_id
      significance_threshold: 0.05
      fold_change_threshold: 1.0
      top_n_labels: 15
      show_labels: true
    title: "MA plot"
    description: "log2 fold change against mean expression: whether the effect size depends on how highly a feature is counted."
    title_size: h3
    layout: {x: 0, y: 11, w: 8, h: 7}
  - component_type: advanced_viz
    tag: ns-de-av-barplot
    index: ns-de-av-barplot
    section: Gene expression (DESeq2)
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/da_barplot
    config:
      feature_id_col: gene_id
      contrast_col: contrast
      lfc_col: log2fc
      significance_col: padj
      significance_threshold: 0.05
      top_n: 20
    title: "Largest effect sizes in the contrast"
    description: "The twenty features with the largest absolute fold change, signed, with the ones clearing the adjusted p-value cut-off highlighted."
    title_size: h3
    layout: {x: 0, y: 18, w: 8, h: 7}
  - component_type: advanced_viz
    tag: ns-de-av-qq
    index: ns-de-av-qq
    section: Gene expression (DESeq2)
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/qq
    config:
      feature_id_col: gene_id
      category_col: direction
    title: "QQ plot of raw p-values"
    description: "Observed against expected p-value quantiles under the null: departure from the diagonal is the differential signal."
    title_size: h3
    layout: {x: 0, y: 25, w: 8, h: 7}

  - component_type: text
    tag: ns-de-counts-intro
    section: Per-library expression behind the contrast
    title: The counts the statistics came from
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The melted Bambu matrix, which does carry a sample column: pick a library
      or a condition in the left panel and this section follows, while the
      volcano above stays as it is. Use the biotype filter to check whether an
      effect is carried by protein-coding genes or by a single RNA class.
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_gene_long
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: ns-de-fig-distribution
    index: ns-de-fig-distribution
    section: Per-library expression behind the contrast
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_gene_long
    use: bambu/counts_gene_long
    visu_type: box
    dict_kwargs: {x: sample, y: log_cpm, color: condition}
    title: Expression distribution per library
    description: Narrowed by the sample, condition, preparation and biotype filters, unlike the differential tiles above it.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 5}
  - component_type: table
    tag: ns-de-table-counts
    section: Per-library expression behind the contrast
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_gene_long
    use: bambu/counts_gene_long
    row_selection_enabled: false
    title: Gene counts per sample
    description: One row per library and gene, with the raw count, CPM and log CPM.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 7, w: 8, h: 7}

  - component_type: text
    tag: ns-de-dexseq-intro
    section: Exon/transcript usage (DEXSeq)
    title: Transcripts whose share of their gene shifted
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      DEXSeq on Bambu's transcript counts: not whether a gene's total
      expression changed, but whether one of its transcripts is used more or
      less relative to its siblings. Significance is the gene-level adjusted
      q-value DEXSeq reports. 419 features were testable here, of which four
      clear the cut-off, so one panel and its table say everything there is.
    workflow_tag: nanoseq
    data_collection_tag: dexseq_results
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ns-de-dex-card-sig
