# ============================================================================
# Alignment and coverage
# ============================================================================
- title: Alignment and coverage
  subtitle: How much of each library minimap2 placed, how accurately, and how evenly
  tab_order: 3
  tab_icon: mdi:chart-bar
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Alignment scope
    icon: mdi:filter-variant
    color: indigo
    description: Libraries shown on this tab only
  grid_sections:
  - name: Mapping at a glance
    icon: mdi:check-decagram
    color: indigo
    description: Placement rate and per-base agreement with the reference
  - name: Coverage and indels
    icon: mdi:chart-bell-curve
    color: blue
    description: How evenly the reference was hit, and the error mode behind it
  - name: Alignment tables
    icon: mdi:table
    color: gray
    description: Every point of the samtools stats distributions
    collapsed: true
  components:
  - component_type: text
    tag: ns-al-intro
    section: Mapping at a glance
    title: What minimap2 placed
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [minimap2](https://github.com/lh3/minimap2) placement read out of the
      `samtools stats` summary block, one reading per library. Identity is 100
      minus the mismatch rate per mapped base, the reading a long-read run is
      judged on.
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ns-al-card-mapped
    index: ns-al-card-mapped
    section: Mapping at a glance
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/stats_sections
    filter_expr: "col('section') == 'SN'"
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: reads_mapped_pct
    column_type: float64
    display: {icon_name: 'mdi:check-decagram', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Reads placed (%)
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-al-card-identity
    index: ns-al-card-identity
    section: Mapping at a glance
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/stats_sections
    filter_expr: "col('section') == 'SN'"
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: identity_pct
    column_type: float64
    display: {icon_name: 'mdi:shield-check-outline', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Per-base identity (%)
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-al-card-reads
    index: ns-al-card-reads
    section: Mapping at a glance
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/stats_sections
    aggregation: sum
    column_name: reads_mapped
    column_type: float64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Reads mapped
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-al-card-suppl
    index: ns-al-card-suppl
    section: Mapping at a glance
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/stats_sections
    aggregation: sum
    column_name: supplementary_alignments
    column_type: float64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:set-merge', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Supplementary alignments
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: text
    tag: ns-al-cov-intro
    section: Coverage and indels
    title: Evenness, and the error mode under it
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The coverage histogram says how much of the reference sits at each depth;
      on a transcriptome run a long right tail is expression, not bias. The
      indel spectrum is the characteristic Nanopore error mode, insertions and
      deletions drawn as separate curves.
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: ns-al-av-coverage
    index: ns-al-av-coverage
    section: Coverage and indels
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/coverage_distribution
    config:
      x_title: Coverage depth
      y_title: Bases at that depth
      log_x: true
      log_y: true
      selection_enabled: true
      selection_column: sample
    title: "Coverage depth distribution"
    description: "Bases of the reference at each depth, one curve per library, both axes logarithmic. The last bin pools everything at 1000x and above, as samtools reports it."
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: advanced_viz
    tag: ns-al-av-indels
    index: ns-al-av-indels
    section: Coverage and indels
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/indel_spectrum
    config:
      x_title: Indel length (bases)
      y_title: Events
      log_x: true
      log_y: true
      selection_enabled: true
      selection_column: sample
    title: "Indel length spectrum"
    description: "Two curves per library, insertions and deletions. The balance between the two and how fast each falls with length depend on the pore chemistry and the basecaller model."
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 7}
  - component_type: table
    tag: ns-al-table-sections
    section: Alignment tables
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/stats_sections
    row_selection_enabled: true
    row_selection_column: sample
    title: Alignment distributions
    description: Every point of the three histograms plus the per-sample summary row, with the stats section it came from.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: interactive
    tag: ns-al-filter-library
    index: ns-al-library-filter
    section: Alignment scope
    group: Alignment scope
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display: {title_size: md, custom_color: '#5C6BC0', icon_name: 'mdi:test-tube'}
    placement: left
    title: Library
    layout: {x: 0, y: 0, w: 1, h: 3}

# ============================================================================
# Quantification and sample structure
# ============================================================================
- title: Quantification and sample structure
  subtitle: What Bambu counted per gene, and whether the libraries group by condition or by preparation
  tab_order: 4
  tab_icon: mdi:dna
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Feature scope
    icon: mdi:filter-variant
    color: violet
    description: Biotype and expression floor on the gene counts
  grid_sections:
  - name: Library composition
    icon: mdi:chart-donut
    color: violet
    description: Depth, genes detected and how concentrated each library is
  - name: Sample structure
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Where the libraries sit relative to each other
  - name: Gene counts
    icon: mdi:chart-box-outline
    color: teal
    description: The genes that separate the libraries, and the per-library distribution
  - name: Quantification tables
    icon: mdi:table
    color: gray
    description: Per-library readings, the correlation matrix and the melted gene counts
    collapsed: true
  components:
  - component_type: text
    tag: ns-qt-intro
    section: Library composition
    title: What Bambu assigned, per library
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [Bambu](https://github.com/GoekeLab/bambu) assigns each spliced alignment
      to a gene model and counts per sample. Library size, genes detected and
      the share its 50 highest genes take say how much of each library is worth
      comparing.
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ns-qt-card-depth
    index: ns-qt-card-depth
    section: Library composition
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/sample_pca
    aggregation: sum
    column_name: total_counts
    column_type: float64
    secondary_layout: top_n
    breakdown_col: sample_id
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Reads assigned
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-qt-card-genes
    index: ns-qt-card-genes
    section: Library composition
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/sample_pca
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: n_genes_detected
    column_type: int64
    display: {icon_name: 'mdi:dna', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Genes detected
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-qt-card-coding
    index: ns-qt-card-coding
    section: Library composition
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/sample_pca
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: pct_protein_coding
    column_type: float64
    display: {icon_name: 'mdi:chart-donut', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Protein-coding share (%)
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-qt-card-top50
    index: ns-qt-card-top50
    section: Library composition
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/sample_pca
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: top50_share_pct
    column_type: float64
    display: {icon_name: 'mdi:star-outline', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Top-50 gene share (%)
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: text
    tag: ns-qt-structure-intro
    section: Sample structure
    title: Do the libraries group by condition, or by preparation
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The PCA is computed on log CPM over the 500 most variable genes, the way
      DESeq2 plotPCA does, and the correlation matrix is Spearman on the same
      values. Replicates should cluster by condition; a split by preparation or
      flow-cell run is a confounder.
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ns-qt-card-protocol
    index: ns-qt-card-protocol
    section: Sample structure
    workflow_tag: nanoseq
    data_collection_tag: samples
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: donut
    breakdown_col: protocol
    display: {icon_name: 'mdi:shape-outline', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Libraries by preparation
    layout: {x: 0, y: 2, w: 4, h: 2}
  - component_type: card
    tag: ns-qt-card-runs
    index: ns-qt-card-runs
    section: Sample structure
    workflow_tag: nanoseq
    data_collection_tag: samples
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: donut
    breakdown_col: run_id
    display: {icon_name: 'mdi:calendar-outline', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Libraries by flow-cell run
    layout: {x: 4, y: 2, w: 4, h: 2}
  - component_type: advanced_viz
    tag: ns-qt-av-pca
    index: ns-qt-av-pca
    section: Sample structure
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/pca
    config:
      controls_placement: header
      color_col: condition
      default_color_by: condition
      point_size: 16
      show_centroids: true
      plot_style: grid
      hover_cols: [total_counts, n_genes_detected, top50_share_pct]
      selection_enabled: true
      selection_column: sample_id
    title: "Sample PCA on log-CPM gene expression"
    description: "One point per library, coloured by condition. If the first component separates the conditions the design holds; a component that follows the preparation or the flow-cell run is a confounder."
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 7}
  - component_type: advanced_viz
    tag: ns-qt-av-depth
    index: ns-qt-av-depth
    section: Sample structure
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/depth_vs_complexity
    config:
      controls_placement: header
      x_title: Reads assigned to a gene
      y_title: Genes detected
      log_x: true
      top_n_labels: 6
      selection_enabled: true
      selection_column: sample_id
    title: "Depth against complexity"
    description: "Genes detected saturates with depth, so a library sitting below the trend is concentrated rather than shallow. Marker size is the share its 50 top genes take."
    title_size: h3
    layout: {x: 0, y: 11, w: 8, h: 7}
  - component_type: advanced_viz
    tag: ns-qt-av-correlation
    index: ns-qt-av-correlation
    section: Sample structure
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_correlation
    use: bambu/correlation_heatmap
    config:
      index_column: sample_id
      row_annotation_cols: [condition]
      cluster_rows: true
      cluster_cols: true
      cluster_method: ward
      colorscale: Blues
    title: "Sample correlation, Spearman on log CPM"
    description: "Replicates of a condition should correlate more with each other than across conditions; the dendrogram says whether the libraries split on condition or on preparation."
    title_size: h3
    layout: {x: 0, y: 18, w: 8, h: 7}

  - component_type: text
    tag: ns-qt-counts-intro
    section: Gene counts
    title: The genes that carry the difference
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Ranking genes by the variance of log CPM returns the genes that separate
      the libraries, not the mitochondrial and ribosomal shortlist a total-count
      ranking gives. The biotype and expression filters in the left panel narrow
      the cards and the distribution.
    workflow_tag: nanoseq
    data_collection_tag: bambu_top_variable_genes
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ns-qt-card-logcpm
