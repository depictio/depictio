# ============================================================================
# Run dynamics
# ============================================================================
- title: Run dynamics
  subtitle: How the library behaved across the flow cell, and what a pycoQC run would add
  tab_order: 3
  tab_icon: mdi:chart-line
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Distribution scope
    icon: mdi:filter-variant
    color: blue
    description: Which samtools stats section and which part of its axis
  grid_sections:
  - name: What this run cannot show
    icon: mdi:alert-outline
    color: orange
    description: The flow-cell views that need a pycoQC summary
  - name: Read length across the library
    icon: mdi:chart-bell-curve
    color: blue
    description: The length distribution the aligner actually saw
  components:
  - component_type: text
    tag: ns-rd-gated
    section: What this run cannot show
    title: Yield over time and the channel map need pycoQC
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The views a Nanopore run is usually watched through, cumulative yield
      over the sequencing hours, quality drifting as the pores age, and the
      flow-cell channel map, all read
      [pycoQC](https://a-slide.github.io/pycoQC/)'s summary of the
      `sequencing_summary.txt` the basecaller writes. nanoseq produces it when
      a run supplies that file and `--skip_pycoqc` is not set; this megatest
      started from FASTQ, so neither the summary nor pycoQC's output exists and
      no collection here can stand in for them. What the run does carry is
      below: the read-length distribution measured after alignment, which is
      the same library seen one step later.
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    layout: {x: 0, y: 0, w: 8, h: 3}
  - component_type: text
    tag: ns-rd-intro
    section: Read length across the library
    title: What the aligner saw
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      `samtools stats` records a full read-length histogram per BAM, which
      MultiQC never surfaces. The cards read its summary block; the curve below
      is the histogram itself, decimated to 200 geometric bins per library so a
      16 kb tail does not collapse the mode.
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ns-rd-card-avglen
    index: ns-rd-card-avglen
    section: Read length across the library
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/stats_sections
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: average_length
    column_type: float64
    display: {icon_name: 'mdi:ruler', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mean aligned length
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-rd-card-maxlen
    index: ns-rd-card-maxlen
    section: Read length across the library
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/stats_sections
    aggregation: max
    column_name: maximum_length
    column_type: float64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:star-outline', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Longest aligned read
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-rd-card-basequal
    index: ns-rd-card-basequal
    section: Read length across the library
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/stats_sections
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: average_quality
    column_type: float64
    display: {icon_name: 'mdi:check-decagram', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mean mapped base quality
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
