- title: Reads
  subtitle: How long and how good are the reads of each library?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:waves
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Read filters
    icon: mdi:filter-variant
    color: cyan
    description: Quality and N50 floors on the NanoStat summary
  grid_sections:
  - name: Reads at a glance
    icon: mdi:counter
    color: cyan
    description: Yield, length and quality over the libraries in view
  - name: Length and quality
    icon: mdi:chart-bar
    color: cyan
    description: Each library's mean read length, quality and yield, sorted by quality
  - name: Ladders
    icon: mdi:chart-line
    color: cyan
    description: Read length and quality, rung by rung
  - name: Read tables
    icon: mdi:table
    color: gray
    description: The NanoStat summary and the yield per quality floor
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [NanoPlot](https://github.com/wdecoster/nanoplot) summarises each library's raw reads:
      yield, length and quality. Click a library in the bars to read its summary
      beside it; the ladders show its read lengths and qualities rung by rung.
    tag: ns-rd-intro
    index: rd-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    interactive_component_type: Slider
    slider_mode: gte
    column_name: mean_read_quality
    column_type: float64
    display:
      icon_name: mdi:check-decagram
      custom_color: cyan
    section: Read filters
    group: Floors
    tag: ns-rd-filter-quality
    index: rd-quality-filter
    title: Mean read quality at least
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: read_length_n50
    column_type: float64
    display:
      icon_name: mdi:ruler
      custom_color: blue
    section: Read filters
    group: Floors
    tag: ns-rd-filter-n50
    index: rd-n50-filter
    title: Read length N50
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: sum
    column_name: n_reads
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:counter
      icon_color: cyan.4
      caption: per library, their distribution
    section: Reads at a glance
    tag: ns-rd-card-reads
    index: rd-card-reads
    title: Reads
    description: Reads basecalled over the libraries in view; the bars show how they spread over the libraries.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: median
    column_name: read_length_n50
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: cyan.6
      caption: median per library, with its spread
      decimals: 0
    section: Reads at a glance
    tag: ns-rd-card-n50
    index: rd-card-n50
    title: Read length N50
    description: Half of a library's bases sit in reads at least this long.
    layout: {x: 2, y: 0, w: 2, h: 2}
  # Q7 is the basecaller's pass floor (Guppy and Dorado sort reads into pass
  # and fail at it); Q10 is the good-quality mark the figures draw beside it.
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: median
    column_name: mean_read_quality
    column_type: float64
    secondary_layout: threshold
    threshold_value: 7
    threshold_direction: min
    display:
      icon_name: mdi:check-decagram
      icon_color: cyan.8
      caption: libraries against Q7, the pass floor
      decimals: 1
    section: Reads at a glance
    tag: ns-rd-card-quality
    index: rd-card-quality
    title: Mean read quality
    description: Median of the libraries' mean Phred quality. Q7 is the basecaller's pass floor, Q10 is good.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # One row per library and quality floor: the card reads the Q7 rung only.
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: nanostats_quality
    use: nanoplot/nanostats_quality
    aggregation: median
    column_name: pct_reads
    column_type: float64
    filter_expr: col('q_cutoff') == 7
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:percent-outline
      icon_color: cyan.9
      caption: median share of each library
      decimals: 1
    section: Reads at a glance
    tag: ns-rd-card-q7
    index: rd-card-q7
    title: Reads passing Q7 (%)
    description: Median share of a library's reads at a mean quality of Q7 or above, the pass floor.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # nanoseq publishes no per-read table (NanoPlot runs without --raw), so a
  # scatter would hold one point per library: six or so. Sorted bars say more,
  # with the Q7 pass floor and the Q10 good mark drawn as lines on the quality panel.
  - component_type: figure
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    visu_type: bar
    mode: code
    code_content: |-
      # Mean read length, mean read quality and yield per library, sorted by quality, coloured by condition; the solid line is Q7 (pass), the dashed one Q10 (good). A picked bar stays full, the others dim.
      names = {'mean_read_length': 'Mean read length (bases)', 'mean_read_quality': 'Mean read quality (Phred)', 'total_gigabases': 'Yield (Gb)'}
      d = df.filter(pl.col('mean_read_quality').is_not_null()).sort(['mean_read_quality', 'sample']).with_columns(pl.col('sample').str.replace(r'_(?:R|r|rep|REP|Rep)\d+$', '').alias('condition'))
      long = d.select(['sample', 'condition', *names.keys()]).unpivot(index=['sample', 'condition'], variable_name='metric', value_name='value').with_columns(pl.col('metric').replace(names))
      fig = px.bar(long.to_pandas(), x='value', y='sample', color='condition', color_discrete_map=depictio_category_colors.get('condition') or {}, facet_col='metric', orientation='h', custom_data=['sample'], category_orders={'sample': d.get_column('sample').to_list(), 'metric': list(names.values())}, labels={'value': '', 'sample': '', 'condition': 'Condition'})
      fig.update_xaxes(matches=None, showticklabels=True)
      fig.update_yaxes(automargin=True)
      fig.for_each_annotation(lambda a: a.update(text=a.text.split('=')[-1]))
      fig.update_xaxes(range=[0, max(12, (d['mean_read_quality'].max() or 0) * 1.1)], col=2)
      fig.add_vline(x=7, line_width=1, opacity=0.6, annotation_text='Q7 pass', annotation_position='top left', col=2)
      fig.add_vline(x=10, line_dash='dash', line_width=1, opacity=0.6, annotation_text='Q10 good', col=2)
      fig.update_traces(unselected=dict(marker=dict(opacity=0.3)))
      fig.update_layout(margin=dict(t=30), clickmode='event+select', legend=dict(orientation='h', y=-0.12, title_text=''))
    selection_enabled: true
    selection_column: sample
    section: Length and quality
    tag: ns-rd-length-quality
    index: rd-length-quality
    title: Length, quality and yield per library
    description: Libraries sorted by mean quality, the best on top, coloured by condition. The solid line is Q7, the basecaller's pass floor (Guppy and Dorado sort reads at it); the dashed one is Q10, the usual mark of good quality. Click a library to read its summary.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: ns-rd-length-quality
      id_col: sample
      title_col: sample
      selection_source: any
      sections:
        Yield: [n_reads, total_bases, total_gigabases]
        Read length: [mean_read_length, median_read_length, read_length_n50, stdev_read_length, longest_read_length]
        Read quality: [mean_read_quality, median_read_quality, top_read_quality]
      labels:
        n_reads: Reads
        total_bases: Bases
        total_gigabases: Gigabases
        mean_read_length: Mean length
        median_read_length: Median length
        read_length_n50: N50
        stdev_read_length: Length spread (SD)
        longest_read_length: Longest read
        mean_read_quality: Mean quality
        median_read_quality: Median quality
        top_read_quality: Best read quality
    section: Length and quality
    tag: ns-rd-library-record
    index: rd-library-record
    title: Library record
    description: The picked library's NanoStat summary.
    layout: {x: 5, y: 0, w: 3, h: 6}
  # The Nx ladder replaces an N50 bar: N50 is its marked rung, and the rest of
  # the ladder is what a single bar hides.
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: samtools_read_length_nx
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: sample
      x_col: nx
      y_col: read_length
      log_y: true
      reference_x: 50
      reference_label: N50
      x_title: Share of the bases (Nx, %)
      y_title: Read length (bases)
      selection_enabled: true
      selection_column: sample
    section: Ladders
    tag: ns-rd-nx-ladder
    index: rd-nx-ladder
    title: Nx ladder per library
    description: The shortest read inside the longest x% of the bases. The marker is N50, the length at which half the bases lie in reads that long or longer.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: nanostats_quality
    use: nanoplot/quality_ladder
    config:
      x_title: Phred quality floor
      y_title: Reads above the floor (%)
      reference_x: 7
      reference_label: Q7 pass
      line_width: 2.5
      selection_enabled: true
      selection_column: sample
    section: Ladders
    tag: ns-rd-quality-ladder
    index: rd-quality-ladder
    title: Reads above each quality floor
    description: Where a curve falls off is the quality floor that library can afford. The marker is Q7, the basecaller's pass floor.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: table
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    row_selection_enabled: true
    row_selection_column: sample
    section: Read tables
    tag: ns-rd-table-nanostats
    index: rd-table-nanostats
    title: NanoStat summary
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: nanoseq
    data_collection_tag: nanostats_quality
    use: nanoplot/nanostats_quality
    row_selection_enabled: true
    row_selection_column: sample
    section: Read tables
    tag: ns-rd-table-ladder
    index: rd-table-ladder
    title: Yield per quality floor
    layout: {x: 0, y: 6, w: 8, h: 6}
- title: Alignment
  subtitle: How much of each library aligned, and how accurately?
  tab_group: Data & QC
  tab_order: 3
  tab_icon: mdi:chart-bar
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Alignment filters
    icon: mdi:filter-variant
    color: indigo
    description: Libraries shown on this tab
  grid_sections:
  - name: Alignment at a glance
    icon: mdi:counter
    color: indigo
    description: Placement, identity and split reads over the libraries in view
  - name: Coverage
    icon: mdi:chart-line
    color: indigo
    description: How much of the reference sits at each depth
  - name: Indels and read lengths
    icon: mdi:chart-bell-curve
    color: indigo
    description: The long-read error mode, and the length of the aligned reads
  - name: Alignment table
    icon: mdi:table
    color: gray
    description: Every point of the samtools stats distributions
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [minimap2](https://github.com/lh3/minimap2) alignments as
      [samtools stats](https://www.htslib.org/doc/samtools-stats.html) reads them, one summary
      per library. Identity is 100 minus the mismatch rate per aligned base; the curves show how
      depth, indel lengths and aligned read lengths spread.
    tag: ns-al-intro
    index: al-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: Alignment filters
    tag: ns-al-filter-library
    index: al-library-filter
    title: Library
    layout: {x: 0, y: 0, w: 1, h: 3}
  # Every card reads the SN rows, one per library: the other rows are the
  # histograms and carry no summary.
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/stats_sections
    aggregation: median
    column_name: reads_mapped_pct
    column_type: float64
    filter_expr: col('section') == 'SN'
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:check-decagram
      icon_color: indigo.4
      caption: median share of each library's reads
      decimals: 1
    section: Alignment at a glance
    tag: ns-al-card-placed
    index: al-card-placed
    title: Reads placed (%)
    description: Median share of each library's reads minimap2 placed.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/stats_sections
    aggregation: median
    column_name: identity_pct
    column_type: float64
    filter_expr: col('section') == 'SN'
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:shield-check-outline
      icon_color: indigo.6
      caption: median per library, with its spread
      decimals: 1
    section: Alignment at a glance
    tag: ns-al-card-identity
    index: al-card-identity
    title: Per-base identity (%)
    description: Median agreement of the aligned bases with the reference.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/stats_sections
    aggregation: sum
    column_name: reads_mapped
    column_type: float64
    filter_expr: col('section') == 'SN'
    secondary_layout: histogram
    display:
      icon_name: mdi:counter
      icon_color: indigo.8
      caption: per library, their distribution
    section: Alignment at a glance
    tag: ns-al-card-mapped
    index: al-card-mapped
    title: Reads mapped
    description: Reads placed on the reference over the libraries in view.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/stats_sections
    aggregation: sum
    column_name: supplementary_alignments
    column_type: float64
    filter_expr: col('section') == 'SN'
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:set-merge
      icon_color: indigo.9
      caption: per library, with its spread
    section: Alignment at a glance
    tag: ns-al-card-suppl
    index: al-card-suppl
    title: Supplementary alignments
    description: Split alignments, the long-read signal of chimeras and structural differences.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/coverage_distribution
    config:
      x_title: Coverage depth
      y_title: Bases at that depth
      log_x: true
      log_y: true
      selection_enabled: true
      selection_column: sample
    section: Coverage
    tag: ns-al-coverage
    index: al-coverage
    title: Coverage depth distribution
    description: One curve per library; the last bin pools everything at 1000x and above.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/indel_spectrum
    config:
      x_title: Indel length (bases)
      y_title: Events
