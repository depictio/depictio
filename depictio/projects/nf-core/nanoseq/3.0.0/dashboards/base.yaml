# ============================================================================
# Gene expression (DESeq2)
# ============================================================================
- title: Gene expression (DESeq2)
  subtitle: Which genes differ between the conditions of the run's contrast
  tab_order: 5
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # One section: every control here filters deseq2_results, which has no
  # sample column, so the pinned sample filters do not narrow this tab.
  filter_sections:
  - name: DE scope
    icon: mdi:filter-variant
    color: grape
    description: Significance, effect size, direction, biotype and expression floor on the DESeq2 results
  grid_sections:
  - name: Differential expression
    icon: mdi:chart-scatter-plot
    color: grape
    description: Genes whose Bambu counts differ between the two conditions
  - name: DESeq2 tables
    icon: mdi:table
    color: gray
    description: The best-measured DESeq2 rows
    collapsed: true
  components:
  - component_type: text
    tag: ns-de-intro
    section: Differential expression
    title: What moved between the conditions
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      DESeq2 on Bambu's gene counts, one comparison across the whole run, so
      the sample filters do not narrow this tab. Narrow it with the DE scope
      filters, and read the per-library counts on the Quantification tab.
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ns-de-card-sig
    index: ns-de-card-sig
    section: Differential expression
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: count
    column_name: direction
    column_type: object
    secondary_layout: donut
    breakdown_col: direction
    display: {icon_name: 'mdi:chart-donut', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Features by direction
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-de-card-lfc
    index: ns-de-card-lfc
    section: Differential expression
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: log2fc
    column_type: float64
    display: {icon_name: 'mdi:ruler', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: log2 fold change
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-de-card-topn
    index: ns-de-card-topn
    section: Differential expression
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: nunique
    column_name: gene_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: direction
    top_n_count: 3
    display: {icon_name: 'mdi:dna', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Genes tested
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-de-card-strongest
    index: ns-de-card-strongest
    section: Differential expression
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: max
    column_name: neg_log10_padj
    column_type: float64
    display: {icon_name: 'mdi:target', icon_color: '#EC407A', title_color: '#EC407A', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Strongest -log10(padj)
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: ns-de-av-volcano
    index: ns-de-av-volcano
    section: Differential expression
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/volcano
    # One tile, three readings of the same table: MA and QQ are views of the
    # volcano (header switch).
    config:
      controls_placement: header
      view: volcano
      views: [volcano, ma, qq]
      avg_log_intensity_col: log2_base_mean
      log2_fold_change_col: log2fc
      p_value_col: pvalue
      label_col: gene_id
      category_col: direction
      significance_threshold: 0.05
      effect_threshold: 1.0
      fold_change_threshold: 1.0
      top_n_labels: 15
      show_labels: true
    title: "Volcano, MA and QQ: the run's contrast"
    description: "Effect size against significance, one point per tested feature; switch to MA to see whether the effect depends on expression, or to QQ to see how far the raw p-values leave the null. Labels are Ensembl gene ids."
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 7}
  - component_type: advanced_viz
    tag: ns-de-av-barplot
    index: ns-de-av-barplot
    section: Differential expression
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/da_barplot
    config:
      feature_id_col: gene_id
      contrast_col: contrast
      lfc_col: log2fc
      significance_col: padj
      significance_threshold: 0.05
      top_n: 20
    title: "Largest effect sizes in the contrast"
    description: "The twenty features with the largest absolute fold change, signed, with the ones clearing the adjusted p-value cut-off highlighted."
    title_size: h3
    layout: {x: 0, y: 11, w: 8, h: 7}
  - component_type: table
    tag: ns-de-table-top
    section: DESeq2 tables
    workflow_tag: nanoseq
    data_collection_tag: deseq2_top_expressed
    use: deseq2/results
    row_selection_enabled: false
    title: Best-measured DESeq2 rows
    description: The 200 rows with the highest mean normalised count, with log2 fold change, p-value, adjusted p-value, Ensembl gene id and biotype.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: interactive
    tag: ns-de-filter-padj
    index: ns-de-padj-range
    section: DE scope
    group: DE scope
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: padj
    column_type: float64
    display: {title_size: md, custom_color: '#AB47BC', icon_name: 'mdi:chart-bell-curve'}
    placement: left
    title: Adjusted p-value
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: ns-de-filter-log2fc
    index: ns-de-log2fc-range
    section: DE scope
    group: DE scope
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: log2fc
    column_type: float64
    display: {title_size: md, custom_color: '#AB47BC', icon_name: 'mdi:swap-vertical'}
    placement: left
    title: log2 fold change
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: ns-de-filter-direction
    index: ns-de-direction-filter
    section: DE scope
    group: DE scope
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    interactive_component_type: MultiSelect
    column_name: direction
    column_type: object
    display: {title_size: md, custom_color: '#AB47BC', icon_name: 'mdi:swap-vertical'}
    placement: left
    title: Direction
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: ns-de-filter-biotype
    index: ns-de-biotype-filter
    section: DE scope
    group: DE scope
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    interactive_component_type: MultiSelect
    column_name: gene_biotype
    column_type: object
    display: {title_size: md, custom_color: '#AB47BC', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Gene biotype
    layout: {x: 0, y: 9, w: 1, h: 3}
  - component_type: interactive
    tag: ns-de-filter-basemean
    index: ns-de-basemean-filter
    section: DE scope
    group: DE scope
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: log2_base_mean
    column_type: float64
    display: {title_size: md, custom_color: '#AB47BC', icon_name: 'mdi:chart-bell-curve'}
    placement: left
    title: log2 mean expression
    layout: {x: 0, y: 12, w: 1, h: 3}

# ============================================================================
# Isoform usage and expression
# ============================================================================
- title: Isoform usage and expression
  subtitle: Which transcripts change their share of their gene, and how the isoforms are expressed
  tab_order: 6
  tab_icon: mdi:chart-timeline-variant
  tab_icon_color: pink
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Isoform scope
    icon: mdi:filter-variant
    color: pink
    description: Biotype and expression floor on the transcript counts
  grid_sections:
  - name: Transcript usage (DEXSeq)
    icon: mdi:scale-balance
    color: pink
    description: Transcripts whose share of their gene shifts between the conditions
  - name: Isoform expression
    icon: mdi:chart-timeline-variant
    color: grape
    description: Transcript-level counts per library
  - name: Isoform structures
    icon: mdi:dna
    color: violet
    description: Exon lanes, when the run publishes the models it used
  - name: Isoform tables
    icon: mdi:table
    color: gray
    description: The DEXSeq results and the melted transcript counts
    collapsed: true
  components:
  - component_type: text
    tag: ns-is-dexseq-intro
    section: Transcript usage (DEXSeq)
    title: Transcripts whose share of their gene shifted
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      DEXSeq on Bambu's transcript counts asks whether one transcript is used
      more or less relative to its siblings, not whether the gene changed.
      Significance is the gene-level adjusted q-value, and the usage bars show
      each top gene's split library by library.
    workflow_tag: nanoseq
    data_collection_tag: dexseq_results
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ns-is-dex-card-sig
    index: ns-is-dex-card-sig
    section: Transcript usage (DEXSeq)
    workflow_tag: nanoseq
    data_collection_tag: dexseq_results
    use: dexseq/results
    aggregation: count
    column_name: direction
    column_type: object
    secondary_layout: donut
    breakdown_col: direction
    display: {icon_name: 'mdi:chart-donut', icon_color: '#D81B60', title_color: '#D81B60', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Transcripts by direction
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-is-dex-card-lfc
    index: ns-is-dex-card-lfc
    section: Transcript usage (DEXSeq)
    workflow_tag: nanoseq
    data_collection_tag: dexseq_results
    use: dexseq/results
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: log2fc
    column_type: float64
    display: {icon_name: 'mdi:ruler', icon_color: '#AB47BC', title_color: '#AB47BC', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Usage log2 fold change
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-is-dex-card-genes
    index: ns-is-dex-card-genes
    section: Transcript usage (DEXSeq)
    workflow_tag: nanoseq
    data_collection_tag: dexseq_results
    use: dexseq/results
    aggregation: nunique
    column_name: gene_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: direction
    top_n_count: 3
    display: {icon_name: 'mdi:dna', icon_color: '#8D6E63', title_color: '#8D6E63', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Genes with a tested transcript
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-is-dex-card-transcripts
    index: ns-is-dex-card-transcripts
    section: Transcript usage (DEXSeq)
    workflow_tag: nanoseq
    data_collection_tag: dexseq_results
    use: dexseq/results
    aggregation: nunique
    column_name: feature_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: direction
    top_n_count: 3
    display: {icon_name: 'mdi:star-outline', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Transcripts tested
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: ns-is-dex-av-volcano
    index: ns-is-dex-av-volcano
    section: Transcript usage (DEXSeq)
    workflow_tag: nanoseq
    data_collection_tag: dexseq_results
    use: dexseq/volcano
    # DEXSeq has no mean-intensity column, so no MA view; QQ reads the raw
    # p-values.
    config:
      controls_placement: header
      view: volcano
      views: [volcano, qq]
      p_value_col: pvalue
      label_col: feature_id
      category_col: direction
      significance_threshold: 0.05
      effect_threshold: 1.0
      top_n_labels: 10
      show_labels: true
    title: "Volcano: differential transcript usage"
    description: "Usage effect size against the gene-level adjusted q-value, one point per transcript. The QQ view shows how far the raw p-values depart from the null."
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 7}
  - component_type: figure
    tag: ns-is-dex-fig-usage
    index: ns-is-dex-fig-usage
    section: Transcript usage (DEXSeq)
    workflow_tag: nanoseq
    data_collection_tag: dexseq_usage
    visu_type: bar
    dict_kwargs:
      x: sample
      y: usage_pct
      color: transcript_id
      facet_col: gene_label
      facet_col_wrap: 3
      barmode: stack
    title: Transcript usage per library, top DEXSeq genes
    description: Each bar is one library and sums to 100 percent of its gene's reads. A gene DEXSeq calls shows its colours shifting between the bars of the two conditions; the q-value is in each panel title.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 11, w: 8, h: 7}

  - component_type: text
    tag: ns-is-intro
    section: Isoform expression
    title: Where the gene-level signal sits
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A gene's count is the sum over its isoforms, and long reads can tell them
      apart. These tiles read the melted transcript matrix, so the sample and
      isoform filters reach them.
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_transcript_long
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ns-is-card-logcpm
    index: ns-is-card-logcpm
    section: Isoform expression
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_transcript_long
    use: bambu/counts_transcript_long
    filter_expr: "col('count') > 0"
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: log_cpm
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#D81B60', title_color: '#D81B60', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Median log2(CPM + 1), detected transcripts
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-is-card-transcripts
    index: ns-is-card-transcripts
    section: Isoform expression
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_transcript_long
    use: bambu/counts_transcript_long
    filter_expr: "col('count') > 0"
    aggregation: nunique
    column_name: transcript_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: gene_biotype
    top_n_count: 3
    display: {icon_name: 'mdi:chart-timeline-variant', icon_color: '#AB47BC', title_color: '#AB47BC', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Transcripts with reads
    layout: {x: 2, y: 2, w: 2, h: 2}
  # nunique under top_n shows the per-library value (wave 3a); scoped to
  # count > 0 so each library reports the genes it actually detected.
  - component_type: card
    tag: ns-is-card-genes
    index: ns-is-card-genes
    section: Isoform expression
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_transcript_long
    use: bambu/counts_transcript_long
    filter_expr: "col('count') > 0"
    aggregation: nunique
    column_name: gene_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:dna', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Genes with a detected isoform
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-is-card-counts
    index: ns-is-card-counts
    section: Isoform expression
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_transcript_long
    use: bambu/counts_transcript_long
    aggregation: sum
    column_name: count
    column_type: float64
    secondary_layout: donut
    breakdown_col: condition
    display: {icon_name: 'mdi:counter', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Reads on isoforms
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: figure
    tag: ns-is-fig-distribution
    index: ns-is-fig-distribution
    section: Isoform expression
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_transcript_long
    use: bambu/counts_transcript_long
    visu_type: box
    dict_kwargs: {x: sample, y: log_cpm, color: condition}
    title: Isoform expression distribution per library
    description: The transcript-level twin of the gene distribution, on the same CPM scale.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 4, w: 8, h: 5}

  - component_type: text
    tag: ns-is-structures-intro
    section: Isoform structures
    title: Exon lanes need the models, not just the counts
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Isoform lanes read `bambu/extended_annotations.gtf`, which Bambu writes
      only when it is allowed to extend the annotation. On a
      quantification-only run the collection is absent and the tile stays
      empty.
