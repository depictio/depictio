# nf-core/nanoseq 3.0.0. Every rule it follows is written out in
# depictio/projects/nf-core/RULES.md.
#
# The hub is `samples`, one row per library, the source of every sample link
# in template.yaml: a filter on it reaches NanoStat, samtools stats, the melted
# Bambu counts and the sample-structure collections. DESeq2 and DEXSeq run
# once over the whole run and carry no sample column, so the sample filters do
# not narrow those two tabs, and their intros say so.
#
# Routes: without a design table (METADATA_FILE) the hub falls back to the
# samplesheet group as the condition and writes "unknown" for the preparation,
# source replicate and flow-cell run; only the `metadata` collection is pruned.
# The isoform structures need bambu/extended_annotations.gtf, which a
# quantification-only run does not write.
#
# The MultiQC report was reprocessed with MultiQC 1.35 from the run's raw tool
# outputs (nanoseq 3.0.0 writes no parquet); the module and plot names below
# are the 1.35 ones.
main_dashboard:
  title: nf-core/nanoseq
  subtitle: Nanopore long reads, from QC to the genes and isoforms that differ
  project_tag: Nanopore RNA-Seq
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family: figures, advanced viz
  # and filter chips all colour a value the same way.
  category_colors:
    condition: auto
    protocol:
      '*': auto
      unknown: '#adb5bd'
    run_id:
      '*': auto
      unknown: '#adb5bd'
    direction:
      up: '#e03131'
      down: '#1971c2'
      not significant: '#adb5bd'
    # Biotypes outnumber the palette: the import ranks them by their summed
    # counts and gives the eight largest the palette.
    gene_biotype:
      '*': 'auto:count'
      Other: '#868e96'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs.
  # Bound to the samples hub, the source of every sample link.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab that has a sample column
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab rather than on an analysis tab: a run that prunes
  # that tab would take a persistent section declared there with it.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The library design behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Libraries, below).
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: condition
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: Condition
    section: Key figures
    tag: ns-ov-kf-condition
    index: ov-kf-condition
    title: Condition
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Library
    section: Key figures
    tag: ns-ov-kf-sample
    index: ov-kf-sample
    title: Library
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: text
    title: nf-core/nanoseq
    logo: https://raw.githubusercontent.com/nf-core/nanoseq/master/docs/images/nf-core-nanoseq_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/nanoseq/master/docs/images/nf-core-nanoseq_logo_dark.png
    order: 1
    body: >
      Nanopore long reads from basecalled FASTQ to gene and transcript counts, and the genes and
      isoforms that differ between conditions. [Run parameters](params:)
    tag: ns-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/nanoseq takes Nanopore reads through quality control and alignment, counts them per gene and transcript with Bambu, and tests what differs between conditions, gene by gene and isoform by isoform. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The sample filters in the left panel apply to every tab with a sample column: narrow the libraries once and those tabs follow. A bar above a section narrows that section only.
    tag: ns-ov-about
    index: ov-about
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's facts, read from its data: it ships no params.json, so no
  # {{param:...}} line would print anything but a dash.
  - component_type: text
    surface: card
    values:
      libs: {dc: samples, column: sample_id, aggregation: nunique, format: integer}
      conds: {dc: samples, column: condition, aggregation: nunique, format: integer}
      preps: {dc: samples, column: protocol, aggregation: nunique, format: integer}
      reads: {dc: nanostats, column: n_reads, aggregation: sum, format: si}
    body: |
      ### The run
      - ![](icon:mdi:test-tube) **Libraries** {{libs}}
      - ![](icon:mdi:shape-outline) **Conditions** {{conds}}
      - ![](icon:mdi:flask-outline) **Preparations** {{preps}}
      - ![](icon:mdi:counter) **Reads** {{reads}}
    tag: ns-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  # The marks take the family's colour (the header's), not the theme's blue.
  # The run has no params.json, so each step's link searches the software
  # versions for its tool.
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Five steps from raw reads to isoforms
      Each step names its tool versions and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:check-decagram) **QC** NanoPlot and FastQC on the raw reads · [Versions](params:nanoplot) · [Reads](tab:Reads)
      2. ![](icon:mdi:dna) **Align** minimap2 to the reference · [Versions](params:minimap2) · [Alignment](tab:Alignment)
      3. ![](icon:mdi:counter) **Count** Bambu, per gene and transcript · [Versions](params:bambu) · [Quantification](tab:Quantification)
      4. ![](icon:mdi:scale-balance) **Genes** DESeq2 between the conditions · [Versions](params:deseq2) · [Genes](tab:Gene expression)
      5. ![](icon:mdi:chart-timeline-variant) **Isoforms** DEXSeq on transcript usage · [Versions](params:dexseq) · [Isoforms](tab:Isoform usage)
      :::
    tag: ns-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. The icon colour is that tab's colour. Every route writes all
  # four collections.
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: samples
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: composition
    breakdown_col: condition
    display:
      icon_name: mdi:test-tube
      icon_color: orange
      caption: in the sample sheet, by condition
      link: tab:MultiQC
    section: Key figures
    tag: ns-ov-kf-libraries
    index: ov-kf-libraries
    title: Libraries
    description: Libraries in the sample sheet. The bar splits them by condition.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: median
    column_name: read_length_n50
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: cyan
      caption: median per library, with its spread
      link: tab:Reads
      decimals: 0
    section: Key figures
    tag: ns-ov-kf-n50
    index: ov-kf-n50
    title: Read length N50
    description: Median read length N50 of the libraries in view, in bases. The box shows how it spreads.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/stats_sections
    aggregation: median
    column_name: reads_mapped_pct
    column_type: float64
    filter_expr: col('section') == 'SN'
    secondary_layout: coverage
    coverage_max: 100
    display:
      icon_name: mdi:check-decagram
      icon_color: indigo
      caption: median share of each library's reads
      link: tab:Alignment
      decimals: 1
    section: Key figures
    tag: ns-ov-kf-placed
    index: ov-kf-placed
    title: Reads placed (%)
    description: Median share of each library's reads minimap2 placed on the reference.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # DESeq2 tests one row per annotation entry, so this counts calls, not
  # distinct genes; the Gene expression tab counts the genes.
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: count
    column_name: gene_id
    column_type: object
    filter_expr: col('significant') == True
    secondary_layout: composition
    breakdown_col: direction
    display:
      icon_name: mdi:scale-balance
      icon_color: grape
      caption: significant calls, up and down
      link: tab:Gene expression
    section: Key figures
    tag: ns-ov-kf-de-calls
    index: ov-kf-de-calls
    title: DESeq2 calls
    description: Calls at a 5% FDR and a two-fold change, over the whole run. The bar splits them by direction.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the condition, then the library, on the hub.
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: condition
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: Condition
    section: Findings
    tag: ns-ov-findings-condition
    index: ov-findings-condition
    title: Condition
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Library
    section: Findings
    tag: ns-ov-findings-sample
    index: ov-findings-sample
    title: Library
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data. The two test rows are computed once over the
  # whole run, so no sample filter changes them. The DESeq2 row counts calls
  # (one per tested annotation entry), as the Key figure and the volcano's
  # badges do; the Gene expression tab counts the distinct genes.
  # The DEXSeq row counts the transcripts of the genes under a 5% gene-level
  # q-value, which the volcano colours (effect_threshold 0 on its source).
  - component_type: text
    surface: card
    values:
      q10: {dc: nanostats_quality, column: pct_reads, aggregation: median, filter_expr: "col('q_cutoff') == 10",
        format: 'decimals:1'}
      pc1: {dc: bambu_sample_pca, column: pc1_var_pct, aggregation: max, format: 'decimals:1'}
      n_up: {dc: deseq2_results, column: gene_id, aggregation: count, filter_expr: "col('direction') == 'up'",
        format: integer}
      n_down: {dc: deseq2_results, column: gene_id, aggregation: count, filter_expr: "col('direction') == 'down'",
        format: integer}
      n_dtu: {dc: dexseq_results, column: feature_id, aggregation: nunique, filter_expr: "col('significant') == True",
        format: integer}
      n_tx: {dc: dexseq_results, column: feature_id, aggregation: nunique, format: integer}
    body: |
      - **{{q10}}%** of a library's reads reach Q10 or above – the median over the libraries [Reads](tab:Reads)
      - **{{pc1}}%** of the expression variance lies on the first principal component – log CPM of the most variable genes [Quantification](tab:Quantification)
      - **{{n_up}}** calls up and **{{n_down}}** down between the conditions – DESeq2, 5% FDR and a two-fold change [Genes](tab:Gene expression)
      - **{{n_dtu}}** of {{n_tx}} transcripts shift their share of their gene – DEXSeq, gene-level 5% FDR [Isoforms](tab:Isoform usage)
    section: Findings
    tag: ns-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per tab behind the rows above, in their order. The tiles of
  # a row share a stored height.
  - component_type: highlight
    section: Findings
    source_tab: Reads
    source_component: rd-length-quality
    caption: One point per library, mean read length against mean quality, sized by its yield; one off the trend of the others is the one to check.
    hide_legend: true
    tag: ns-ov-hl-length-quality
    index: ov-hl-length-quality
    layout: {x: 0, y: 2, w: 4, h: 5}
  # The highlights take a short title: the source's is cut at half width.
  - component_type: highlight
    section: Findings
    title: Libraries (PCA)
    source_tab: Quantification
    source_component: qt-pca
    caption: One point per library on the first two components of log CPM, coloured by condition; replicates should sit together.
    tag: ns-ov-hl-pca
    index: ov-hl-pca
    layout: {x: 4, y: 2, w: 4, h: 5}
  # show_labels is off on both volcano sources: Ensembl and transcript ids pile
  # up over the points.
  - component_type: highlight
    section: Findings
    title: DESeq2 volcano
    source_tab: Gene expression
    source_component: de-volcano
    caption: One point per tested gene, effect against significance; the coloured calls clear a 5% FDR and a two-fold change.
    tag: ns-ov-hl-de-volcano
    index: ov-hl-de-volcano
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Isoform usage
    source_component: iso-volcano
    caption: One point per transcript, its change in usage against the gene-level q-value; the coloured ones shift their share of the gene.
    tag: ns-ov-hl-iso-volcano
    index: ov-hl-iso-volcano
    layout: {x: 4, y: 7, w: 4, h: 5}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Reads](tab:Reads)
      - [Alignment](tab:Alignment)

      ### Expression
      - [Quantification](tab:Quantification)
      - [Gene expression](tab:Gene expression)
      - [Isoform usage](tab:Isoform usage)
    section: How to read this dashboard
    tag: ns-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the condition first, then the design columns
  # of the design table ("unknown" without one).
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: condition
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: ns-filter-condition
    index: sample-filters-condition
    title: Condition
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: ns-filter-sample
    index: sample-filters-sample
    title: Library
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: protocol
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: grape
    section: Sample filters
    group: Design
    tag: ns-filter-protocol
    index: sample-filters-protocol
    title: Library preparation
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: run_id
    column_type: object
    display:
      icon_name: mdi:calendar-outline
      custom_color: indigo
    section: Sample filters
    group: Design
    tag: ns-filter-run
    index: sample-filters-run
    title: Flow-cell run
    layout: {x: 0, y: 9, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: source_replicate
    column_type: object
    display:
      icon_name: mdi:relation-many-to-many
      custom_color: blue
    section: Sample filters
    group: Design
    tag: ns-filter-source-replicate
    index: sample-filters-source-rep
    title: Source replicate
    layout: {x: 0, y: 12, w: 1, h: 3}
  # Row selection feeds the Analysis panel: the one component of the family
  # that is both persistent and row-addressable.
  - component_type: table
    workflow_tag: nanoseq
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Sample sheet
    tag: ns-sample-sheet
    index: sample-sheet
    title: Library design
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
- title: MultiQC
  subtitle: Did every library sequence and align as expected?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: MultiQC report
    icon: mdi:file-document-outline
    color: orange
    description: Libraries as the MultiQC report names them
  grid_sections:
  - name: QC overview
    icon: mdi:chart-box-outline
    color: orange
    description: General statistics, read counts and quality, and where the reads aligned
  - name: FastQC details
    icon: mdi:file-document-outline
    color: gray
    description: The remaining FastQC panels
    collapsed: true
  - name: samtools details
    icon: mdi:file-document-outline
    color: gray
    description: The remaining samtools panels
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [MultiQC](https://multiqc.info) gathers the per-library FastQC, NanoStat and samtools
      reports. Read the general statistics first, then whether quality holds along the read and
      where the reads aligned; the NanoStat and samtools summaries are drawn in full on the
      Reads and Alignment tabs.
    tag: ns-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: MultiQC report
    tag: ns-mqc-filter-sample
    index: mqc-sample-filter
    title: Library
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: multiqc
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: QC overview
    tag: ns-mqc-general-stats
    index: mqc-general-stats
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Counts
    section: QC overview
    tag: ns-mqc-fastqc-counts
    index: mqc-fastqc-counts
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    section: QC overview
    tag: ns-mqc-fastqc-quality
    index: mqc-fastqc-quality
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Flagstat
    section: QC overview
    tag: ns-mqc-samtools-flagstat
    index: mqc-samtools-flagstat
    layout: {x: 0, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Mapped reads per contig
    section: QC overview
    tag: ns-mqc-samtools-contig
    index: mqc-samtools-contig
    layout: {x: 4, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Per Sequence Quality Scores
    section: FastQC details
    tag: ns-mqc-fastqc-perseq
    index: mqc-fastqc-perseq
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Per Sequence GC Content
    section: FastQC details
    tag: ns-mqc-fastqc-gc
    index: mqc-fastqc-gc
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Per Base N Content
    section: FastQC details
    tag: ns-mqc-fastqc-ncontent
    index: mqc-fastqc-ncontent
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Duplication Levels
    section: FastQC details
    tag: ns-mqc-fastqc-dup
    index: mqc-fastqc-dup
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Top overrepresented sequences
    section: FastQC details
    tag: ns-mqc-fastqc-over
    index: mqc-fastqc-over
    layout: {x: 0, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Status Checks
    section: FastQC details
    tag: ns-mqc-fastqc-status
    index: mqc-fastqc-status
    layout: {x: 4, y: 8, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: 'Flagstat: Percentage of total'
    section: samtools details
    tag: ns-mqc-samtools-flagstat-pct
    index: mqc-samtools-flagstat-pct
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: XY counts
    section: samtools details
    tag: ns-mqc-samtools-xy
    index: mqc-samtools-xy
    layout: {x: 4, y: 0, w: 4, h: 4}
- title: Reads
  subtitle: How long and how good are the reads of each library?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:waves
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Read filters
    icon: mdi:filter-variant
    color: cyan
    description: Quality and N50 floors on the NanoStat summary
  grid_sections:
  - name: Reads at a glance
    icon: mdi:counter
    color: cyan
    description: Yield, length and quality over the libraries in view
  - name: Length and quality
    icon: mdi:chart-scatter-plot
    color: cyan
    description: Each library's mean read length against its mean quality
  - name: Ladders
    icon: mdi:chart-line
    color: cyan
    description: Read length and quality, rung by rung
  - name: Read tables
    icon: mdi:table
    color: gray
    description: The NanoStat summary and the yield per quality floor
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [NanoPlot](https://github.com/wdecoster/nanoplot) summarises each library's raw reads:
      yield, length and quality. Click a point in the scatter to read that library's summary
      beside it; the ladders show its read lengths and qualities rung by rung.
    tag: ns-rd-intro
    index: rd-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    interactive_component_type: Slider
    slider_mode: gte
    column_name: mean_read_quality
    column_type: float64
    display:
      icon_name: mdi:check-decagram
      custom_color: cyan
    section: Read filters
    group: Floors
    tag: ns-rd-filter-quality
    index: rd-quality-filter
    title: Mean read quality at least
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: read_length_n50
    column_type: float64
    display:
      icon_name: mdi:ruler
      custom_color: blue
    section: Read filters
    group: Floors
    tag: ns-rd-filter-n50
    index: rd-n50-filter
    title: Read length N50
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: sum
    column_name: n_reads
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:counter
      icon_color: cyan
      caption: per library, their distribution
    section: Reads at a glance
    tag: ns-rd-card-reads
    index: rd-card-reads
    title: Reads
    description: Reads basecalled over the libraries in view; the bars show how they spread over the libraries.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: median
    column_name: read_length_n50
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: violet
      caption: median per library, with its spread
      decimals: 0
    section: Reads at a glance
    tag: ns-rd-card-n50
    index: rd-card-n50
    title: Read length N50
    description: Half of a library's bases sit in reads at least this long.
    layout: {x: 2, y: 0, w: 2, h: 2}
  # Q10 passes, under Q7 fails: the floors of the high- and fast-accuracy
  # basecaller models.
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: median
    column_name: mean_read_quality
    column_type: float64
    secondary_layout: threshold
    threshold_value: 10
    threshold_direction: min
    threshold_warn: 7
    display:
      icon_name: mdi:check-decagram
      icon_color: teal
      caption: libraries against Q10, failing under Q7
      decimals: 1
    section: Reads at a glance
    tag: ns-rd-card-quality
    index: rd-card-quality
    title: Mean read quality
    description: Median of the libraries' mean Phred quality.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # One row per library and quality floor: the card reads the Q10 rung only.
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: nanostats_quality
    use: nanoplot/nanostats_quality
    aggregation: median
    column_name: pct_reads
    column_type: float64
    filter_expr: col('q_cutoff') == 10
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:percent-outline
      icon_color: blue
      caption: median share of each library
      decimals: 1
    section: Reads at a glance
    tag: ns-rd-card-q10
    index: rd-card-q10
    title: Reads at Q10 (%)
    description: Median share of a library's reads at a mean quality of Q10 or above.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # nanoseq publishes no per-read table (NanoPlot runs without --raw), so the
  # scatter holds one point per library, sized by its yield.
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/length_vs_quality
    config:
      x_title: Mean read length (bases)
      y_title: Mean read quality (Phred)
      top_n_labels: 6
      marker_size: 14
      selection_enabled: true
      selection_column: sample
    section: Length and quality
    tag: ns-rd-length-quality
    index: rd-length-quality
    title: Length against quality, one point per library
    description: Marker size is the yield; click a library to read its summary beside the plot.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: ns-rd-length-quality
      id_col: sample
      title_col: sample
      selection_source: any
      sections:
        Yield: [n_reads, total_bases, total_gigabases]
        Read length: [mean_read_length, median_read_length, read_length_n50, stdev_read_length, longest_read_length]
        Read quality: [mean_read_quality, median_read_quality, top_read_quality]
      labels:
        n_reads: Reads
        total_bases: Bases
        total_gigabases: Gigabases
        mean_read_length: Mean length
        median_read_length: Median length
        read_length_n50: N50
        stdev_read_length: Length spread (SD)
        longest_read_length: Longest read
        mean_read_quality: Mean quality
        median_read_quality: Median quality
        top_read_quality: Best read quality
    section: Length and quality
    tag: ns-rd-library-record
    index: rd-library-record
    title: Library record
    description: The picked library's NanoStat summary.
    layout: {x: 5, y: 0, w: 3, h: 6}
  # The Nx ladder replaces an N50 bar: N50 is its marked rung, and the rest of
  # the ladder is what a single bar hides.
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: samtools_read_length_nx
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: sample
      x_col: nx
      y_col: read_length
      log_y: true
      reference_x: 50
      reference_label: N50
      x_title: Share of the bases (Nx, %)
      y_title: Read length (bases)
      selection_enabled: true
      selection_column: sample
    section: Ladders
    tag: ns-rd-nx-ladder
    index: rd-nx-ladder
    title: Nx ladder per library
    description: The shortest read inside the longest x% of the bases; the marker is N50.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: nanostats_quality
    use: nanoplot/quality_ladder
    config:
      x_title: Phred quality floor
      y_title: Reads above the floor (%)
      reference_x: 10
      reference_label: Q10
      line_width: 2.5
      selection_enabled: true
      selection_column: sample
    section: Ladders
    tag: ns-rd-quality-ladder
    index: rd-quality-ladder
    title: Reads above each quality floor
    description: Where a curve falls off is the quality floor that library can afford.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: table
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    row_selection_enabled: true
    row_selection_column: sample
    section: Read tables
    tag: ns-rd-table-nanostats
    index: rd-table-nanostats
    title: NanoStat summary
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: nanoseq
    data_collection_tag: nanostats_quality
    use: nanoplot/nanostats_quality
    row_selection_enabled: true
    row_selection_column: sample
    section: Read tables
    tag: ns-rd-table-ladder
    index: rd-table-ladder
    title: Yield per quality floor
    layout: {x: 0, y: 6, w: 8, h: 6}
- title: Alignment
  subtitle: How much of each library aligned, and how accurately?
  tab_group: Data & QC
  tab_order: 3
  tab_icon: mdi:chart-bar
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Alignment filters
    icon: mdi:filter-variant
    color: indigo
    description: Libraries shown on this tab
  grid_sections:
  - name: Alignment at a glance
    icon: mdi:counter
    color: indigo
    description: Placement, identity and split reads over the libraries in view
  - name: Coverage
    icon: mdi:chart-line
    color: indigo
    description: How much of the reference sits at each depth
  - name: Indels and read lengths
    icon: mdi:chart-bell-curve
    color: indigo
    description: The long-read error mode, and the length of the aligned reads
  - name: Alignment table
    icon: mdi:table
    color: gray
    description: Every point of the samtools stats distributions
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [minimap2](https://github.com/lh3/minimap2) alignments as
      [samtools stats](https://www.htslib.org/doc/samtools-stats.html) reads them, one summary
      per library. Identity is 100 minus the mismatch rate per aligned base; the curves show how
      depth, indel lengths and aligned read lengths spread.
    tag: ns-al-intro
    index: al-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: Alignment filters
    tag: ns-al-filter-library
    index: al-library-filter
    title: Library
    layout: {x: 0, y: 0, w: 1, h: 3}
  # Every card reads the SN rows, one per library: the other rows are the
  # histograms and carry no summary.
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/stats_sections
    aggregation: median
    column_name: reads_mapped_pct
    column_type: float64
    filter_expr: col('section') == 'SN'
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:check-decagram
      icon_color: indigo
      caption: median share of each library's reads
      decimals: 1
    section: Alignment at a glance
    tag: ns-al-card-placed
    index: al-card-placed
    title: Reads placed (%)
    description: Median share of each library's reads minimap2 placed.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/stats_sections
    aggregation: median
    column_name: identity_pct
    column_type: float64
    filter_expr: col('section') == 'SN'
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:shield-check-outline
      icon_color: teal
      caption: median per library, with its spread
      decimals: 1
    section: Alignment at a glance
    tag: ns-al-card-identity
    index: al-card-identity
    title: Per-base identity (%)
    description: Median agreement of the aligned bases with the reference.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/stats_sections
    aggregation: sum
    column_name: reads_mapped
    column_type: float64
    filter_expr: col('section') == 'SN'
    secondary_layout: histogram
    display:
      icon_name: mdi:counter
      icon_color: cyan
      caption: per library, their distribution
    section: Alignment at a glance
    tag: ns-al-card-mapped
    index: al-card-mapped
    title: Reads mapped
    description: Reads placed on the reference over the libraries in view.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/stats_sections
    aggregation: sum
    column_name: supplementary_alignments
    column_type: float64
    filter_expr: col('section') == 'SN'
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:set-merge
      icon_color: violet
      caption: per library, with its spread
    section: Alignment at a glance
    tag: ns-al-card-suppl
    index: al-card-suppl
    title: Supplementary alignments
    description: Split alignments, the long-read signal of chimeras and structural differences.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/coverage_distribution
    config:
      x_title: Coverage depth
      y_title: Bases at that depth
      log_x: true
      log_y: true
      selection_enabled: true
      selection_column: sample
    section: Coverage
    tag: ns-al-coverage
    index: al-coverage
    title: Coverage depth distribution
    description: One curve per library; the last bin pools everything at 1000x and above.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/indel_spectrum
    config:
      x_title: Indel length (bases)
      y_title: Events
      log_x: true
      log_y: true
      # Two curves per library (insertions, deletions): past 8 entries the
      # legend scrolls and eats the plot. A hover names the curve.
      legend_pos: none
      selection_enabled: true
      selection_column: sample
    section: Indels and read lengths
    tag: ns-al-indels
    index: al-indels
    title: Indel length spectrum
    description: Insertions and deletions per library, by length; hover a curve for its name.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/read_length_profile
    config:
      x_title: Read length (bases)
      y_title: Reads
      log_x: true
      log_y: true
      selection_enabled: true
      selection_column: sample
    section: Indels and read lengths
    tag: ns-al-read-length
    index: al-read-length
    title: Aligned read lengths
    description: The samtools read-length histogram, one curve per library.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: table
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/stats_sections
    row_selection_enabled: true
    row_selection_column: sample
    section: Alignment table
    tag: ns-al-table
    index: al-table
    title: Alignment distributions
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Quantification
  subtitle: Do the libraries group by condition, or by preparation?
  tab_group: Expression
  tab_order: 4
  tab_icon: mdi:dna
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # The biotype filter also narrows the variable-gene heatmap, which carries
  # the same column.
  filter_sections:
  - name: Gene filters
    icon: mdi:filter-variant
    color: violet
    description: Biotype and expression floor on the gene counts
  grid_sections:
  - name: Libraries at a glance
    icon: mdi:counter
    color: violet
    description: Depth, genes detected and how concentrated each library is
  - name: Sample structure
    icon: mdi:chart-scatter-plot
    color: violet
    description: The libraries on the first components of log CPM
  - name: Sample correlation
    icon: mdi:relation-many-to-many
    color: violet
    description: Spearman correlation between the libraries, clustered
  # Collapsed: its 100 rows autofit to about ten grid rows, past the tab's
  # budget, and the PCA and the correlation above already answer the tab.
  - name: Most variable genes
    icon: mdi:chart-box-outline
    color: gray
    description: The genes that separate the libraries, row-standardised
    collapsed: true
  - name: Libraries and counts
    icon: mdi:chart-bar
    color: gray
    description: Depth against complexity, the design behind the libraries and the count distributions
    collapsed: true
  - name: Quantification tables
    icon: mdi:table
    color: gray
    description: Per-library readings, the correlation matrix and the gene counts
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [Bambu](https://github.com/GoekeLab/bambu) assigns each long read to a gene and transcript
      model and counts them per library. The PCA and the correlation matrix read log CPM over the
      most variable genes: the libraries should group by condition, and a split by preparation or
      flow-cell run is a confounder.
    tag: ns-qt-intro
    index: qt-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_gene_long
    interactive_component_type: MultiSelect
    column_name: gene_biotype
    column_type: object
    display:
      icon_name: mdi:shape-plus-outline
      custom_color: grape
    section: Gene filters
    group: Genes
    tag: ns-qt-filter-biotype
    index: qt-biotype-filter
    title: Gene biotype
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_gene_long
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: log_cpm
    column_type: float64
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: violet
    section: Gene filters
    group: Genes
    tag: ns-qt-filter-logcpm
    index: qt-logcpm-filter
    title: log2(CPM + 1)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/sample_pca
    aggregation: sum
    column_name: total_counts
    column_type: float64
    secondary_layout: composition
    breakdown_col: condition
    display:
      icon_name: mdi:counter
      icon_color: violet
      caption: assigned reads, by condition
    section: Libraries at a glance
    tag: ns-qt-card-assigned
    index: qt-card-assigned
    title: Reads assigned
    description: Reads Bambu assigned to a gene over the libraries in view.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/sample_pca
    aggregation: median
    column_name: n_genes_detected
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:dna
      icon_color: indigo
      caption: median per library, with its spread
      decimals: 0
    section: Libraries at a glance
    tag: ns-qt-card-genes
    index: qt-card-genes
    title: Genes detected
    description: Median number of genes with at least one read in a library.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/sample_pca
    aggregation: median
    column_name: pct_protein_coding
    column_type: float64
    filter_expr: col('total_counts') > 0
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:chart-donut
      icon_color: teal
      caption: median share of each library
      decimals: 1
    section: Libraries at a glance
    tag: ns-qt-card-coding
    index: qt-card-coding
    title: Protein-coding share (%)
    description: Median share of a library's counts on protein-coding genes.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/sample_pca
    aggregation: median
    column_name: top50_share_pct
    column_type: float64
    filter_expr: col('total_counts') > 0
    secondary_layout: histogram
    display:
      icon_name: mdi:star-outline
      icon_color: orange
      caption: median, with its distribution
      decimals: 1
    section: Libraries at a glance
    tag: ns-qt-card-top50
    index: qt-card-top50
    title: Top-50 gene share (%)
    description: Median share of a library's counts on its 50 most expressed genes; high is concentrated.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # No centroids: with two or three libraries per condition the labels would
  # cover the points.
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/pca
    config:
      color_col: condition
      default_color_by: condition
      point_size: 16
      axis_prefix: PC
      plot_style: grid
      hover_cols: [total_counts, n_genes_detected, top50_share_pct]
      selection_enabled: true
      selection_column: sample_id
    section: Sample structure
    tag: ns-qt-pca
    index: qt-pca
    title: Libraries on log-CPM gene expression (PCA)
    description: A first component that follows the preparation or the run, not the condition, is a confounder.
    layout: {x: 0, y: 0, w: 8, h: 6}
  # Library ids on both axes: full width, or the labels leave the plot no room.
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_correlation
    use: bambu/correlation_heatmap
    config:
      index_column: sample_id
      # Every library column, not the per-row mean the table also carries.
      value_columns_pattern: '^(?!mean_correlation$)'
      row_annotation_cols: [condition]
      cluster_rows: true
      cluster_cols: true
      cluster_method: ward
      colorscale: Blues
    section: Sample correlation
    tag: ns-qt-correlation
    index: qt-correlation
    title: Library correlation (Spearman, log CPM)
    description: Replicates should correlate more with each other than across conditions.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: bambu_top_variable_genes
    use: bambu/variable_gene_heatmap
    config:
      index_column: gene_id
      # Every library column, not the variance the genes were ranked by.
      value_columns_pattern: '^(?!log_cpm_variance$)'
      row_annotation_cols: [gene_biotype]
      normalize: row_z
      cluster_rows: true
      cluster_cols: true
      colorscale: RdBu
    section: Most variable genes
    tag: ns-qt-variable-genes
    index: qt-variable-genes
    title: The 100 most variable genes
    description: Row-standardised log CPM; the column dendrogram should repeat the split of the PCA.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/depth_vs_complexity
    config:
      x_title: Reads assigned to a gene
      y_title: Genes detected
      log_x: true
      top_n_labels: 6
      selection_enabled: true
      selection_column: sample_id
    section: Libraries and counts
    tag: ns-qt-depth-complexity
    index: qt-depth-complexity
    title: Depth against complexity
    description: Genes detected saturates with depth; a library under the trend is concentrated, not shallow.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: samples
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: donut
    breakdown_col: protocol
    display:
      icon_name: mdi:flask-outline
      icon_color: grape
      caption: libraries, by preparation
    section: Libraries and counts
    tag: ns-qt-card-protocol
    index: qt-card-protocol
    title: Libraries by preparation
    description: A preparation that splits with the condition confounds it.
    layout: {x: 0, y: 6, w: 4, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: samples
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: donut
    breakdown_col: run_id
    display:
      icon_name: mdi:calendar-outline
      icon_color: indigo
      caption: libraries, by flow-cell run
    section: Libraries and counts
    tag: ns-qt-card-runs
    index: qt-card-runs
    title: Libraries by flow-cell run
    description: A run that splits with the condition confounds it.
    layout: {x: 4, y: 6, w: 4, h: 2}
  - component_type: figure
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_gene_long
    use: bambu/counts_gene_long
    visu_type: box
    mode: code
    code_content: |-
      # log CPM of the detected genes per library: by condition, or by Analysis
      # mode's groups when it has some.
      d = df.filter(pl.col('count') > 0).sort('sample')
      kw = depictio_group_kwargs or {'color': 'condition', 'color_discrete_map': depictio_category_colors.get('condition') or {}}
      fig = px.box(d.to_pandas(), x='sample', y='log_cpm', labels={'sample': 'Library', 'log_cpm': 'log2(CPM + 1)', 'condition': 'Condition'}, **kw)
      fig.update_layout(margin=dict(t=10))
    section: Libraries and counts
    tag: ns-qt-distribution
    index: qt-distribution
    title: Gene expression per library
    description: After CPM normalisation the boxes should line up; a shifted one differs in composition.
    layout: {x: 0, y: 8, w: 8, h: 4}
  - component_type: table
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/sample_pca
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Quantification tables
    tag: ns-qt-table-pca
    index: qt-table-pca
    title: Per-library readings
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_correlation
    use: bambu/sample_correlation
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Quantification tables
    tag: ns-qt-table-correlation
    index: qt-table-correlation
    title: Correlation matrix
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: table
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_gene_long
    use: bambu/counts_gene_long
    section: Quantification tables
    tag: ns-qt-table-counts
    index: qt-table-counts
    title: Gene counts per library
    layout: {x: 0, y: 12, w: 8, h: 6}
- title: Gene expression
  subtitle: Which genes differ between the two conditions?
  tab_group: Expression
  tab_order: 5
  tab_icon: mdi:scale-balance
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # Every control here filters deseq2_results, which has no sample column. No
  # direction filter: the up and down cards each read one direction.
  filter_sections:
  - name: DE filters
    icon: mdi:filter-variant
    color: grape
    description: Significance, effect size, biotype and expression on the DESeq2 results
  grid_sections:
  - name: Calls at a glance
    icon: mdi:counter
    color: grape
    description: Significant genes, their effect sizes and the strongest call
  - name: Volcano
    icon: mdi:chart-scatter-plot
    color: grape
    description: Effect size against significance, one point per tested gene
  - name: Largest effects
    icon: mdi:chart-bar
    color: grape
    description: The genes with the largest fold changes, signed
  - name: Best-measured genes
    icon: mdi:table
    color: gray
    description: The 200 rows with the highest mean normalised count
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [DESeq2](https://bioconductor.org/packages/DESeq2/) tests Bambu's gene counts between the
      run's two conditions, once over the whole run, so the sample filters do not narrow this
      tab. A call clears a 5% FDR and a two-fold change; the View switch reads the same rows as an
      MA or a QQ plot.
    tag: ns-de-intro
    index: de-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: padj
    column_type: float64
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: grape
    section: DE filters
    group: Calls
    tag: ns-de-filter-padj
    index: de-padj-filter
    title: Adjusted p-value
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: log2fc
    column_type: float64
    display:
      icon_name: mdi:swap-vertical
      custom_color: pink
    section: DE filters
    group: Calls
    tag: ns-de-filter-log2fc
    index: de-log2fc-filter
    title: log2 fold change
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    interactive_component_type: MultiSelect
    column_name: gene_biotype
    column_type: object
    display:
      icon_name: mdi:shape-plus-outline
      custom_color: grape
    section: DE filters
    group: Genes
    tag: ns-de-filter-biotype
    index: de-biotype-filter
    title: Gene biotype
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: log2_base_mean
    column_type: float64
    display:
      icon_name: mdi:chart-line
      custom_color: violet
    section: DE filters
    group: Genes
    tag: ns-de-filter-basemean
    index: de-basemean-filter
    title: log2 mean expression
    layout: {x: 0, y: 9, w: 1, h: 3}
  # nunique per direction draws ranked bars: up and down, short labels.
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: nunique
    column_name: gene_id
    column_type: object
    filter_expr: col('significant') == True
    secondary_layout: top_n
    breakdown_col: direction
    top_n_count: 2
    display:
      icon_name: mdi:scale-balance
      icon_color: grape
      caption: genes, up and down
      decimals: 0
    section: Calls at a glance
    tag: ns-de-card-genes
    index: de-card-genes
    title: Significant genes
    description: Distinct genes with a call at a 5% FDR and a two-fold change.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: median
    column_name: log2fc
    column_type: float64
    filter_expr: col('direction') == 'up'
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:trending-up
      icon_color: red
      caption: median of the up calls, with its spread
      decimals: 2
    section: Calls at a glance
    tag: ns-de-card-up
    index: de-card-up
    title: Fold change up (log2)
    description: Median log2 fold change of the calls higher in the contrast's first condition.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: median
    column_name: log2fc
    column_type: float64
    filter_expr: col('direction') == 'down'
    secondary_layout: histogram
    display:
      icon_name: mdi:trending-down
      icon_color: blue
      caption: the down calls, their distribution
      decimals: 2
    section: Calls at a glance
    tag: ns-de-card-down
    index: de-card-down
    title: Fold change down (log2)
    description: Median log2 fold change of the calls lower in the contrast's first condition.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # 1.3 is -log10(0.05): the rows at or above it pass the 5% FDR.
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/results
    aggregation: max
    column_name: neg_log10_padj
    column_type: float64
    secondary_layout: threshold
    threshold_value: 1.3
    threshold_direction: min
    display:
      icon_name: mdi:target
      icon_color: violet
      caption: tested rows against the 5% FDR (1.3)
      decimals: 1
    section: Calls at a glance
    tag: ns-de-card-strongest
    index: de-card-strongest
    title: Strongest significance
    description: The highest -log10 adjusted p-value, capped at 300 where it underflowed.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # One tile, three views of the same rows: the MA view reads log2_base_mean,
  # the QQ view the raw p-values. No point labels: Ensembl ids pile up.
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/volcano
    config:
      view: volcano
      views: [volcano, ma, qq]
      avg_log_intensity_col: log2_base_mean
      log2_fold_change_col: log2fc
      p_value_col: pvalue
      label_col: gene_id
      category_col: direction
      significance_threshold: 0.05
      effect_threshold: 1.0
      fold_change_threshold: 1.0
      show_labels: false
      effect_label: log2 fold change
      significance_label: -log10 adjusted p-value
    section: Volcano
    tag: ns-de-volcano
    index: de-volcano
    title: Effect size against significance
    description: The View switch reads the same rows as an MA plot or a QQ plot of the raw p-values.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: deseq2_results
    use: deseq2/da_barplot
    config:
      feature_id_col: gene_id
      contrast_col: contrast
      lfc_col: log2fc
      significance_col: padj
      significance_threshold: 0.05
      top_n: 20
    section: Largest effects
    tag: ns-de-barplot
    index: de-barplot
    title: The twenty largest fold changes
    description: Signed, the ones clearing the adjusted p-value cut-off highlighted.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: nanoseq
    data_collection_tag: deseq2_top_expressed
    use: deseq2/results
    section: Best-measured genes
    tag: ns-de-table-top
    index: de-table-top
    title: Best-measured DESeq2 rows
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Isoform usage
  subtitle: Which transcripts change their share of their gene?
  tab_group: Expression
  tab_order: 6
  tab_icon: mdi:chart-timeline-variant
  tab_icon_color: pink
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Isoform filters
    icon: mdi:filter-variant
    color: pink
    description: Biotype and expression floor on the transcript counts
  grid_sections:
  - name: Usage at a glance
    icon: mdi:counter
    color: pink
    description: Transcripts tested, their usage shifts and the reads on isoforms
  - name: Usage volcano
    icon: mdi:chart-scatter-plot
    color: pink
    description: Change in usage against the gene-level q-value, one point per transcript
  - name: Usage per library
    icon: mdi:chart-bar
    color: pink
    description: Each top gene's split across its transcripts, library by library
  - name: Isoform expression
    icon: mdi:chart-box-outline
    color: gray
    description: Transcript-level counts per library
    collapsed: true
  - name: Isoform structures
    icon: mdi:dna
    color: gray
    description: Exon lanes, when the run publishes the models it used
    collapsed: true
  - name: Isoform tables
    icon: mdi:table
    color: gray
    description: The DEXSeq results and the transcript counts
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [DEXSeq](https://bioconductor.org/packages/DEXSeq/) asks whether a transcript is used more
      or less relative to its gene's other transcripts, on Bambu's transcript counts, once over the
      whole run. Significance is the gene-level adjusted q-value; the bars show each top gene's
      split library by library.
    tag: ns-is-intro
    index: is-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_transcript_long
    interactive_component_type: MultiSelect
    column_name: gene_biotype
    column_type: object
    display:
      icon_name: mdi:shape-plus-outline
      custom_color: grape
    section: Isoform filters
    group: Transcripts
    tag: ns-is-filter-biotype
    index: is-biotype-filter
    title: Gene biotype
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_transcript_long
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: log_cpm
    column_type: float64
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: pink
    section: Isoform filters
    group: Transcripts
    tag: ns-is-filter-logcpm
    index: is-logcpm-filter
    title: log2(CPM + 1)
    layout: {x: 0, y: 3, w: 1, h: 3}
  # Not a ring by direction: "not significant" fills it, and one call in 400
  # rounds to 0%. The threshold counts the calls exactly. One row per
  # transcript, every one with a q-value, so the count is the transcripts.
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: dexseq_results
    use: dexseq/results
    aggregation: count
    column_name: padj
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.05
    threshold_direction: max
    display:
      icon_name: mdi:chart-donut
      icon_color: pink
      caption: transcripts against a 5% gene-level q-value
      decimals: 0
    section: Usage at a glance
    tag: ns-is-card-tested
    index: is-card-tested
    title: Transcripts tested
    description: Transcripts DEXSeq tested; the bar counts those whose gene clears a 5% q-value.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: dexseq_results
    use: dexseq/results
    aggregation: median
    column_name: log2fc
    column_type: float64
    filter_expr: col('log2fc') > 0
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:trending-up
      icon_color: red
      caption: median of the gains, with its spread
      decimals: 2
    section: Usage at a glance
    tag: ns-is-card-gain
    index: is-card-gain
    title: Usage gain (log2)
    description: Median log2 fold change of the tested transcripts used more in the contrast's first condition.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: dexseq_results
    use: dexseq/results
    aggregation: median
    column_name: log2fc
    column_type: float64
    filter_expr: col('log2fc') < 0
    secondary_layout: histogram
    display:
      icon_name: mdi:trending-down
      icon_color: blue
      caption: the losses, their distribution
      decimals: 2
    section: Usage at a glance
    tag: ns-is-card-loss
    index: is-card-loss
    title: Usage loss (log2)
    description: Median log2 fold change of the tested transcripts used less in the contrast's first condition.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_transcript_long
    use: bambu/counts_transcript_long
    aggregation: sum
    column_name: count
    column_type: float64
    secondary_layout: composition
    breakdown_col: condition
    display:
      icon_name: mdi:counter
      icon_color: violet
      caption: reads, by condition
    section: Usage at a glance
    tag: ns-is-card-reads
    index: is-card-reads
    title: Reads on isoforms
    description: Reads Bambu assigned to a transcript over the libraries in view.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # DEXSeq has no mean-intensity column, so no MA view. No point labels:
  # transcript ids pile up.
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: dexseq_results
    use: dexseq/volcano
    config:
      view: volcano
      views: [volcano, qq]
      p_value_col: pvalue
      label_col: feature_id
      category_col: direction
      significance_threshold: 0.05
      # 0: DEXSeq's call is the gene-level q-value alone, so the badges count
      # the transcripts the cards and the Findings row count.
      effect_threshold: 0.0
      show_labels: false
      effect_label: log2 fold change in usage
      significance_label: -log10 gene-level q-value
    section: Usage volcano
    tag: ns-is-volcano
    index: iso-volcano
    title: Change in usage against significance
    description: The View switch reads the raw p-values as a QQ plot.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: nanoseq
    data_collection_tag: dexseq_usage
    visu_type: bar
    mode: code
    code_content: |-
      # Each library's split of its gene's reads across the gene's transcripts,
      # one panel per top DEXSeq gene, its q-value in the panel title.
      d = df.sort(['gene_label', 'sample'])
      fig = px.bar(d.to_pandas(), x='sample', y='usage_pct', color='transcript_id', facet_col='gene_label', facet_col_wrap=3, labels={'sample': 'Library', 'usage_pct': 'Share of the gene (%)', 'transcript_id': 'Transcript', 'gene_label': 'Gene'})
      fig.for_each_annotation(lambda a: a.update(text=a.text.split('=')[-1]))
      # No legend: one entry per transcript id of every panel; a hover names it.
      fig.update_layout(barmode='stack', showlegend=False, margin=dict(t=30))
    section: Usage per library
    tag: ns-is-usage
    index: is-usage
    title: Transcript usage per library, top DEXSeq genes
    description: Each bar sums to 100% of its gene's reads; hover a segment for its transcript.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_transcript_long
    use: bambu/counts_transcript_long
    visu_type: box
    mode: code
    code_content: |-
      # log CPM of the detected transcripts per library: by condition, or by
      # Analysis mode's groups when it has some.
      d = df.filter(pl.col('count') > 0).sort('sample')
      kw = depictio_group_kwargs or {'color': 'condition', 'color_discrete_map': depictio_category_colors.get('condition') or {}}
      fig = px.box(d.to_pandas(), x='sample', y='log_cpm', labels={'sample': 'Library', 'log_cpm': 'log2(CPM + 1)', 'condition': 'Condition'}, **kw)
      fig.update_layout(margin=dict(t=10))
    section: Isoform expression
    tag: ns-is-distribution
    index: is-distribution
    title: Transcript expression per library
    description: The transcript-level twin of the gene distribution, on the same CPM scale.
    layout: {x: 0, y: 0, w: 8, h: 4}
  # Needs bambu/extended_annotations.gtf, which only a run that lets Bambu
  # extend the annotation writes; without it the import drops the tile.
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: gtf_transcripts
    use: gtf/transcript_structures
    config:
      max_transcripts: 25
      colour_by: transcript_class
    section: Isoform structures
    tag: ns-is-structures
    index: is-structures
    title: Isoform structures of one gene
    description: One lane per transcript of the chosen gene, exons on a base-pair axis.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: nanoseq
    data_collection_tag: dexseq_results
    use: dexseq/results
    row_selection_enabled: true
    row_selection_column: feature_id
    section: Isoform tables
    tag: ns-is-table-dexseq
    index: is-table-dexseq
    title: DEXSeq usage results
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: nanoseq
    data_collection_tag: bambu_counts_transcript_long
    use: bambu/counts_transcript_long
    section: Isoform tables
    tag: ns-is-table-counts
    index: is-table-counts
    title: Transcript counts per library
    layout: {x: 0, y: 6, w: 8, h: 6}
