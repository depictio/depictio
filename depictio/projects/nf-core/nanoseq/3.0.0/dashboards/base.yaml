version: 1
# nf-core/nanoseq 3.0.0 reference dashboard.
#
# Funnel, seven tabs: what the run is -> what the basecaller produced -> how
# the library behaved -> how it aligned -> what Bambu counted and whether the
# samples sit where the design says -> what moved between the conditions ->
# which isoforms carry it.
#
# EVERY TAB HAS A SCOPE. The pinned `Sample filters` section carries the
# sample, condition and library-preparation pickers, and the template's links
# fan them out to NanoStat, the samtools distributions, the melted Bambu
# counts and the sample-structure collections, so the pick means the same
# thing on every tab. Each tab adds a non-persistent filter section on its own
# columns (a quality cutoff, a stats section, a biotype, a direction). The
# three run-level collections (DESeq2, DEXSeq, the wide matrices) are the
# exception and say so: they have no sample column because the statistic is
# computed across the whole run.
#
# The MultiQC report bound here was already reprocessed with MultiQC 1.35 from
# the run's raw tool outputs before this template was built (REPROCESSED.json
# next to the parquet); the run itself published MultiQC 1.11, which writes no
# parquet. Module and plot names below are the 1.35 ones.
main_dashboard:
  title: nf-core/nanoseq
  subtitle: "nf-core/nanoseq 3.0.0 megatest: SG-NEx A549 and K562 cell lines, cDNA and direct cDNA Nanopore RNA-seq, 3 libraries each"
  project_tag: Nanopore RNA-Seq
  main_tab_name: Run hub
  tab_icon: mdi:counter
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab through the project links
    persistent: true
    pin: top
  - name: Run scope
    icon: mdi:tune
    color: indigo
    description: Flow-cell run and source replicate, on this tab only
  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: What the basecaller delivered, pooled over every module
  - name: Cohort design
    icon: mdi:account-group-outline
    color: indigo
    description: Two cell lines, two library preparations, three flow-cell runs
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The sample hub the sample filter is sourced on
    collapsed: true
    persistent: true
    pin: top
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The 200 best-measured DESeq2 rows, on every tab
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # ------------------------------------------------------------- at a glance
  - component_type: text
    tag: ns-hub-intro
    section: Run at a glance
    title: A nanoseq run, from reads to isoforms
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Six Nanopore RNA libraries from two cell lines. The cards read
      [NanoStat](https://github.com/wdecoster/nanoplot) on the raw FASTQ; the
      table under them is the reprocessed
      [MultiQC](https://multiqc.info) general statistics, one row per sample
      over FastQC, NanoStat and samtools. Every tab to the right narrows with
      the sample, condition and preparation pickers in the left panel.
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ns-hub-card-reads
    index: ns-hub-card-reads
    section: Run at a glance
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: sum
    column_name: n_reads
    column_type: float64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Reads basecalled
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-hub-card-yield
    index: ns-hub-card-yield
    section: Run at a glance
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: sum
    column_name: total_gigabases
    column_type: float64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:database-outline', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Gigabases sequenced
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-hub-card-n50
    index: ns-hub-card-n50
    section: Run at a glance
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: read_length_n50
    column_type: float64
    display: {icon_name: 'mdi:ruler', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Read length N50
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-hub-card-quality
    index: ns-hub-card-quality
    section: Run at a glance
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: mean_read_quality
    column_type: float64
    display: {icon_name: 'mdi:check-decagram', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mean read quality
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: multiqc
    tag: ns-hub-general-stats
    section: Run at a glance
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    title: General statistics
    description: One row per sample, pooling the FastQC, NanoStat and samtools headline numbers.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 4, w: 8, h: 5}

  # ----------------------------------------------------------- cohort design
  - component_type: text
    tag: ns-hub-design-intro
    section: Cohort design
    title: Three libraries per cell line, but not three replicates
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The samplesheet names the libraries `A549_R1..R3` and `K562_R1..R3`, and
      the input FASTQ names say what they really are: one cDNA library and two
      direct-cDNA ones per cell line, off three different flow-cell runs. The
      preparation is a confounder with the condition here, so it is a filter of
      its own rather than a footnote.
    workflow_tag: nanoseq
    data_collection_tag: samples
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ns-hub-card-samples
    index: ns-hub-card-samples
    section: Cohort design
    workflow_tag: nanoseq
    data_collection_tag: samples
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: donut
    breakdown_col: condition
    display: {icon_name: 'mdi:test-tube', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Libraries by condition
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-hub-card-protocol
    index: ns-hub-card-protocol
    section: Cohort design
    workflow_tag: nanoseq
    data_collection_tag: samples
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: donut
    breakdown_col: protocol
    display: {icon_name: 'mdi:shape-outline', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Libraries by preparation
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-hub-card-runs
    index: ns-hub-card-runs
    section: Cohort design
    workflow_tag: nanoseq
    data_collection_tag: samples
    aggregation: nunique
    column_name: run_id
    column_type: object
    secondary_layout: donut
    breakdown_col: run_id
    display: {icon_name: 'mdi:calendar-outline', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Flow-cell runs
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-hub-card-replicates
    index: ns-hub-card-replicates
    section: Cohort design
    workflow_tag: nanoseq
    data_collection_tag: samples
    aggregation: nunique
    column_name: source_replicate
    column_type: object
    secondary_layout: top_n
    breakdown_col: condition
    top_n_count: 2
    display: {icon_name: 'mdi:relation-many-to-many', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Source replicates
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: figure
    tag: ns-hub-fig-depth
    index: ns-hub-fig-depth
    section: Cohort design
    workflow_tag: nanoseq
    data_collection_tag: bambu_sample_pca
    use: bambu/sample_pca
    visu_type: bar
    dict_kwargs: {x: sample_id, y: total_counts, color: condition}
    title: Reads Bambu assigned per library
    description: The library sizes every per-sample number on the quantification tabs is normalised against.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 4, w: 8, h: 5}

  # ------------------------------------------------------------- sample sheet
  - component_type: text
    tag: ns-sheet-intro
    section: Sample sheet
    title: The design behind every panel
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per library, with its condition, replicate, preparation, source
      replicate, flow-cell run and reference build. This is the collection the
      filters in the left panel are sourced on, and the links carry a pick made
      here to every other collection.
    workflow_tag: nanoseq
    data_collection_tag: samples
    layout: {x: 0, y: 0, w: 6, h: 2}
  - component_type: card
    tag: ns-sheet-card-condition
    index: ns-sheet-card-condition
    section: Sample sheet
    workflow_tag: nanoseq
    data_collection_tag: samples
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: donut
    breakdown_col: condition
    display: {icon_name: 'mdi:test-tube', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Samples by condition
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: table
    tag: ns-sheet-table-samples
    section: Sample sheet
    workflow_tag: nanoseq
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample_id
    title: Sample hub
    description: Six rows, one per library, with condition, replicate, library preparation, source replicate, flow-cell run and reference build.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 3}

  # -------------------------------------------------------- reference tables
  - component_type: text
    tag: ns-ref-intro
    section: Reference tables
    title: The rows behind the significance thresholds
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The 200 DESeq2 rows with the highest mean normalised count: the features
      the run measured well enough to check a number against. The full table,
      all 208 722 rows of it, is what the volcano, MA and QQ tiles read on the
      DE tab; pinning it here would put an unscrollable grid on seven tabs.
    workflow_tag: nanoseq
    data_collection_tag: deseq2_top_expressed
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: ns-ref-table-deseq2
    section: Reference tables
    workflow_tag: nanoseq
    data_collection_tag: deseq2_top_expressed
    use: deseq2/results
    row_selection_enabled: true
    row_selection_column: gene_id
    title: Best-measured DESeq2 rows
    description: Mean normalised count, log2 fold change, p-value and adjusted p-value, with the Ensembl gene id and biotype.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 7}

  # ---------------------------------------------------------------- filters
  - component_type: interactive
    tag: ns-filter-sample
    index: ns-sample-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: nanoseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:test-tube'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: ns-filter-condition
    index: ns-condition-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: nanoseq
    data_collection_tag: samples
    interactive_component_type: Select
    column_name: condition
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:dna'}
    placement: left
    title: Condition
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: ns-filter-protocol
    index: ns-protocol-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: nanoseq
    data_collection_tag: samples
    interactive_component_type: Select
    column_name: protocol
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Library preparation
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: ns-hub-filter-run
    index: ns-hub-run-filter
    section: Run scope
    group: Run scope
    workflow_tag: nanoseq
    data_collection_tag: samples
    interactive_component_type: Select
    column_name: run_id
    column_type: object
    display: {title_size: md, custom_color: '#5C6BC0', icon_name: 'mdi:calendar-outline'}
    placement: left
    title: Flow-cell run
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: ns-hub-filter-sourcerep
    index: ns-hub-sourcerep-filter
    section: Run scope
    group: Run scope
    workflow_tag: nanoseq
    data_collection_tag: samples
    interactive_component_type: Select
    column_name: source_replicate
    column_type: object
    display: {title_size: md, custom_color: '#5C6BC0', icon_name: 'mdi:relation-many-to-many'}
    placement: left
    title: Source replicate
    layout: {x: 0, y: 3, w: 1, h: 3}

tabs:
# ============================================================================
# Basecall and read QC
# ============================================================================
- title: Basecall and read QC
  subtitle: What the basecaller delivered, before anything was aligned
  tab_order: 2
  tab_icon: mdi:waves
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Read QC scope
    icon: mdi:filter-variant
    color: cyan
    description: Quality floor applied to the yield ladder on this tab
  grid_sections:
  - name: Yield and read length
    icon: mdi:ruler
    color: cyan
    description: How long the reads are, per library
  - name: Quality ladder
    icon: mdi:chart-bell-curve
    color: blue
    description: How much of each library survives a quality floor
  - name: MultiQC read panels
    icon: mdi:chart-bar
    color: indigo
    description: FastQC and NanoStat as MultiQC reports them
    collapsed: true
  components:
  - component_type: text
    tag: ns-rq-intro
    section: Yield and read length
    title: The read itself
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      NanoStat's summary of the raw FASTQ, read straight from the report rather
      than through MultiQC, so it filters and cards like any other collection.
      Mean and median length, their spread, and the longest read the flow cell
      produced.
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ns-rq-card-mean-len
    index: ns-rq-card-mean-len
    section: Yield and read length
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: mean_read_length
    column_type: float64
    display: {icon_name: 'mdi:ruler', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mean read length
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-rq-card-median-len
    index: ns-rq-card-median-len
    section: Yield and read length
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: median_read_length
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Median read length
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-rq-card-stdev
    index: ns-rq-card-stdev
    section: Yield and read length
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: stdev_read_length
    column_type: float64
    display: {icon_name: 'mdi:waves', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Read length spread
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-rq-card-longest
    index: ns-rq-card-longest
    section: Yield and read length
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: max
    column_name: longest_read_length
    column_type: float64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:star-outline', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Longest read
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: ns-rq-av-length-quality
    index: ns-rq-av-length-quality
    section: Yield and read length
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/length_vs_quality
    config:
      x_title: Mean read length (bases)
      y_title: Mean read quality (Phred)
      top_n_labels: 6
      marker_size: 14
      selection_enabled: true
      selection_column: sample
    title: "Length against quality, one point per library"
    description: "The trade-off a Nanopore run is read on: the longer libraries here are also the lower-quality ones, and the marker size is the yield each one delivered."
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 7}
  - component_type: figure
    tag: ns-rq-fig-n50
    index: ns-rq-fig-n50
    section: Yield and read length
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    visu_type: bar
    dict_kwargs: {x: sample, y: read_length_n50, color: sample}
    title: Read length N50 per library
    description: Half of each library's yield sits in reads at least this long.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 11, w: 8, h: 5}
  - component_type: table
    tag: ns-rq-table-nanostats
    section: Yield and read length
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    row_selection_enabled: true
    row_selection_column: sample
    title: NanoStat summary
    description: Six rows, one per library, with reads, yield, the length and quality summaries, N50 and the run's extremes.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 16, w: 8, h: 3}

  - component_type: text
    tag: ns-rq-ladder-intro
    section: Quality ladder
    title: What survives a quality floor
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A mean quality of 8.5 hides whether that is a tight distribution or a
      bimodal one. The ladder does not: it says how many reads, what share of
      the library and how many megabases are left once a Phred floor is
      imposed, which is the number an analysis actually spends.
    workflow_tag: nanoseq
    data_collection_tag: nanostats_quality
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ns-rq-card-pct
    index: ns-rq-card-pct
    section: Quality ladder
    workflow_tag: nanoseq
    data_collection_tag: nanostats_quality
    use: nanoplot/nanostats_quality
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: pct_reads
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Share above cutoff
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-rq-card-mb
    index: ns-rq-card-mb
    section: Quality ladder
    workflow_tag: nanoseq
    data_collection_tag: nanostats_quality
    use: nanoplot/nanostats_quality
    aggregation: sum
    column_name: megabases
    column_type: float64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:database-outline', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Megabases above cutoff
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-rq-card-ladder-reads
    index: ns-rq-card-ladder-reads
    section: Quality ladder
    workflow_tag: nanoseq
    data_collection_tag: nanostats_quality
    use: nanoplot/nanostats_quality
    aggregation: sum
    column_name: n_reads
    column_type: float64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Reads above cutoff
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-rq-card-topq
    index: ns-rq-card-topq
    section: Quality ladder
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: max
