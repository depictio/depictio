version: 1
# nf-core/nanoseq 3.0.0 reference dashboard.
#
# Six tabs, one question each: what MultiQC reports -> how long and how good
# the reads are -> how they aligned -> what Bambu counted and whether the
# libraries group by condition -> which genes moved (DESeq2) -> which
# transcripts changed their share of their gene (DEXSeq) and how the isoforms
# are expressed.
#
# EVERY TAB HAS A SCOPE. The pinned `Sample filters` section carries the
# sample, condition and library-preparation pickers, and the template's links
# fan them out to NanoStat, the samtools distributions, the melted Bambu counts
# and the sample-structure collections, so the pick means the same thing on
# every tab. Each tab adds an open, non-persistent filter section on its own
# columns. The run-level collections (DESeq2, DEXSeq) have no sample column,
# because the statistic is computed across the whole run, and their tab says so.
#
# The pinned `Run at a glance` strip (4 cards: libraries by condition, reads,
# yield, N50) opens every tab and is not repeated as a tab card. MultiQC panels
# live on the MultiQC tab only, minus the ones a data-collection tile already
# draws (NanoStat summary and quality ladder, FastQC length distribution,
# samtools SN block).
#
# The MultiQC report bound here was reprocessed with MultiQC 1.35 from the
# run's raw tool outputs (REPROCESSED.json next to the parquet); nanoseq 3.0.0
# publishes MultiQC 1.11, which writes no parquet. Module and plot names below
# are the 1.35 ones.
main_dashboard:
  title: nf-core/nanoseq
  subtitle: "Nanopore long-read QC, alignment and Bambu gene and transcript quantification"
  project_tag: Nanopore RNA-Seq
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab through the project links
    persistent: true
    pin: top
  - name: Run scope
    icon: mdi:tune
    color: indigo
    description: Flow-cell run and source replicate, on this tab only
  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: What the run contains and what the basecaller delivered, on every tab
    persistent: true
    pin: top
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The sample hub the sample filter is sourced on
    collapsed: true
    persistent: true
    pin: top
  - name: General statistics
    icon: mdi:view-dashboard-outline
    color: orange
    description: MultiQC's general statistics table, one row per sample
  - name: Read QC (FastQC)
    icon: mdi:chart-bell-curve
    color: blue
    description: FastQC as MultiQC reports it
  - name: Alignment (samtools)
    icon: mdi:chart-bar
    color: indigo
    description: samtools flagstat and idxstats as MultiQC reports them
  components:
  # ------------------------------------------------------- run at a glance
  # Pinned persistent strip: what the run is made of and what it yielded.
  - component_type: card
    tag: ns-glance-card-libraries
    index: ns-glance-card-libraries
    section: Run at a glance
    workflow_tag: nanoseq
    data_collection_tag: samples
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: donut
    breakdown_col: condition
    display: {icon_name: 'mdi:test-tube', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Libraries by condition
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: ns-glance-card-reads
    index: ns-glance-card-reads
    section: Run at a glance
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: sum
    column_name: n_reads
    column_type: float64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:counter', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Reads basecalled
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: ns-glance-card-yield
    index: ns-glance-card-yield
    section: Run at a glance
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: sum
    column_name: total_gigabases
    column_type: float64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:database-outline', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Gigabases sequenced
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: ns-glance-card-n50
    index: ns-glance-card-n50
    section: Run at a glance
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: read_length_n50
    column_type: float64
    display: {icon_name: 'mdi:ruler', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Read length N50
    layout: {x: 6, y: 0, w: 2, h: 2}

  # ------------------------------------------------------------- sample sheet
  - component_type: text
    tag: ns-sheet-intro
    section: Sample sheet
    title: The design behind every panel
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per library, with its condition, replicate, library preparation
      and flow-cell run. The filters in the left panel are sourced on this
      table, and a row picked here scopes every other tab.
    workflow_tag: nanoseq
    data_collection_tag: samples
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: ns-sheet-table-samples
    section: Sample sheet
    workflow_tag: nanoseq
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample_id
    title: Sample hub
    description: One row per library, with condition, replicate, library preparation, source replicate, flow-cell run and reference build.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 3}

  # ------------------------------------------------------ general statistics
  - component_type: multiqc
    tag: ns-mqc-general-stats
    section: General statistics
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    title: General statistics
    description: One row per sample, pooling the FastQC, NanoStat and samtools headline numbers.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 5}

  # ---------------------------------------------------------------- FastQC
  # No NanoStat panels and no FastQC length distribution: the Reads tab draws
  # the NanoStat summary, its quality ladder and the length profile from data
  # collections.
  - component_type: multiqc
    tag: ns-mqc-fastqc-counts
    section: Read QC (FastQC)
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Counts
    title: Sequence counts
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: multiqc
    tag: ns-mqc-fastqc-quality
    section: Read QC (FastQC)
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    title: Per-base sequence quality
    title_size: sm
    title_align: left
    layout: {x: 4, y: 0, w: 4, h: 5}
  - component_type: multiqc
    tag: ns-mqc-fastqc-perseq
    section: Read QC (FastQC)
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Per Sequence Quality Scores
    title: Per-sequence quality scores
    title_size: sm
    title_align: left
    layout: {x: 0, y: 5, w: 4, h: 5}
  - component_type: multiqc
    tag: ns-mqc-fastqc-gc
    section: Read QC (FastQC)
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Per Sequence GC Content
    title: GC content
    title_size: sm
    title_align: left
    layout: {x: 4, y: 5, w: 4, h: 5}
  - component_type: multiqc
    tag: ns-mqc-fastqc-ncontent
    section: Read QC (FastQC)
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Per Base N Content
    title: Per-base N content
    title_size: sm
    title_align: left
    layout: {x: 0, y: 10, w: 4, h: 5}
  - component_type: multiqc
    tag: ns-mqc-fastqc-dup
    section: Read QC (FastQC)
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Duplication Levels
    title: Sequence duplication levels
    title_size: sm
    title_align: left
    layout: {x: 4, y: 10, w: 4, h: 5}
  - component_type: multiqc
    tag: ns-mqc-fastqc-over
    section: Read QC (FastQC)
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Top overrepresented sequences
    title: Top overrepresented sequences
    title_size: sm
    title_align: left
    layout: {x: 0, y: 15, w: 4, h: 5}
  - component_type: multiqc
    tag: ns-mqc-fastqc-status
    section: Read QC (FastQC)
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Status Checks
    title: FastQC status checks
    title_size: sm
    title_align: left
    layout: {x: 4, y: 15, w: 4, h: 5}

  # -------------------------------------------------------------- samtools
  # No "Percent mapped" or "Alignment stats": both read the samtools stats SN
  # block, which the Alignment tab cards and table read directly.
  - component_type: multiqc
    tag: ns-mqc-samtools-flagstat
    section: Alignment (samtools)
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Flagstat
    title: Flagstat
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: multiqc
    tag: ns-mqc-samtools-flagstat-pct
    section: Alignment (samtools)
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: "Flagstat: Percentage of total"
    title: Flagstat as a percentage
    title_size: sm
    title_align: left
    layout: {x: 4, y: 0, w: 4, h: 5}
  - component_type: multiqc
    tag: ns-mqc-samtools-xy
    section: Alignment (samtools)
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: XY counts
    title: XY counts
    title_size: sm
    title_align: left
    layout: {x: 0, y: 5, w: 4, h: 5}
  - component_type: multiqc
    tag: ns-mqc-samtools-contig
    section: Alignment (samtools)
    workflow_tag: nanoseq
    data_collection_tag: multiqc_data
    use: multiqc/samtools
    selected_module: samtools
    selected_plot: Mapped reads per contig
    title: Mapped reads per contig
    title_size: sm
    title_align: left
    layout: {x: 4, y: 5, w: 4, h: 5}

  # ---------------------------------------------------------------- filters
  - component_type: interactive
    tag: ns-filter-sample
    index: ns-sample-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: nanoseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:test-tube'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: ns-filter-condition
    index: ns-condition-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: nanoseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: condition
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:dna'}
    placement: left
    title: Condition
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: ns-filter-protocol
    index: ns-protocol-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: nanoseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: protocol
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Library preparation
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: ns-mqc-filter-run
    index: ns-mqc-run-filter
    section: Run scope
    group: Run scope
    workflow_tag: nanoseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: run_id
    column_type: object
    display: {title_size: md, custom_color: '#5C6BC0', icon_name: 'mdi:calendar-outline'}
    placement: left
    title: Flow-cell run
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: ns-mqc-filter-sourcerep
    index: ns-mqc-sourcerep-filter
    section: Run scope
    group: Run scope
    workflow_tag: nanoseq
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: source_replicate
    column_type: object
    display: {title_size: md, custom_color: '#5C6BC0', icon_name: 'mdi:relation-many-to-many'}
    placement: left
    title: Source replicate
    layout: {x: 0, y: 3, w: 1, h: 3}

tabs:
# ============================================================================
# Reads and read length (basecall QC, with the former Run dynamics tab folded in)
# ============================================================================
- title: Reads and read length
  subtitle: How long and how good the reads are, and what survives a quality floor
  tab_order: 2
  tab_icon: mdi:waves
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Read QC scope
    icon: mdi:filter-variant
    color: cyan
    description: Quality and N50 floors on the NanoStat summary, on this tab only
  grid_sections:
  - name: Read length
    icon: mdi:ruler
    color: cyan
    description: How long the reads are, per library, before and after alignment
  - name: Quality ladder
    icon: mdi:chart-bell-curve
    color: blue
    description: How much of each library survives a quality floor
  - name: Run dynamics (pycoQC)
    icon: mdi:alert-outline
    color: orange
    description: The flow-cell views that need a sequencing summary
  - name: Read QC tables
    icon: mdi:table
    color: gray
    description: The NanoStat summary and the yield per quality cutoff
    collapsed: true
  components:
  - component_type: text
    tag: ns-rq-intro
    section: Read length
    title: The read itself
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The cards and the scatter read NanoStat's summary of the raw FASTQ, the
      two ladders below read the samtools stats read-length histogram. Look for
      libraries whose length and quality both sit apart from the rest.
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ns-rq-card-mean-len
    index: ns-rq-card-mean-len
    section: Read length
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: mean_read_length
    column_type: float64
    display: {icon_name: 'mdi:ruler', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mean read length
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-rq-card-median-len
    index: ns-rq-card-median-len
    section: Read length
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: median_read_length
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Median read length
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-rq-card-stdev
    index: ns-rq-card-stdev
    section: Read length
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: stdev_read_length
    column_type: float64
    display: {icon_name: 'mdi:waves', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Read length spread
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-rq-card-longest
    index: ns-rq-card-longest
    section: Read length
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/nanostats
    aggregation: max
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: longest_read_length
    column_type: float64
    display: {icon_name: 'mdi:star-outline', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Longest read
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: ns-rq-av-length-quality
    index: ns-rq-av-length-quality
    section: Read length
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    use: nanoplot/length_vs_quality
    # No `density: true`: nanoseq publishes no per-read table (NanoPlot runs
    # without --raw, pycoQC needs sequencing_summary.txt), so this collection
    # holds one row per library and a binned density would be empty bins
    # (NS-D14).
    config:
      controls_placement: header
      x_title: Mean read length (bases)
      y_title: Mean read quality (Phred)
      top_n_labels: 6
      marker_size: 14
      selection_enabled: true
      selection_column: sample
    title: "Length against quality, one point per library"
    description: "The trade-off a Nanopore run is read on; marker size is the yield each library delivered. A library off the trend of the others is the one to check first. Click a point to read its NanoStat summary beside the plot."
    title_size: h3
    layout: {x: 0, y: 4, w: 5, h: 7}
  - component_type: advanced_viz
    tag: ns-rq-av-library-record
    index: ns-rq-av-library-record
    section: Read length
    workflow_tag: nanoseq
    data_collection_tag: nanostats
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: ns-rq-av-length-quality
      id_col: sample
      selection_source: any
      sections:
        Yield: [n_reads, total_bases, total_gigabases]
        Read length: [mean_read_length, median_read_length, read_length_n50, stdev_read_length, longest_read_length]
        Read quality: [mean_read_quality, median_read_quality, top_read_quality]
    title: Library record
    description: The picked library's NanoStat summary; it stays a thin rail until a library is picked.
    title_size: h3
    layout: {x: 5, y: 4, w: 3, h: 7}
  # The Nx ladder replaces the N50 bar: N50 is its rung 50 (marked), and the
  # rest of the ladder is what a single bar hides.
  - component_type: advanced_viz
    tag: ns-rq-av-nx-ladder
    index: ns-rq-av-nx-ladder
    section: Read length
    workflow_tag: nanoseq
    data_collection_tag: samtools_read_length_nx
    viz_kind: profile
    config:
      viz_kind: profile
      series_col: sample
      x_col: nx
      y_col: read_length
      log_y: true
      reference_x: 50
      reference_label: N50
      x_title: Share of the library's bases (Nx, percent)
      y_title: Read length (bases)
      selection_enabled: true
      selection_column: sample
    title: "Nx ladder per library"
    description: "Nx is the shortest read inside the longest x percent of the bases; the marker is N50. A flat top is a library whose yield sits in a few long reads, a steep drop one whose reads share one length."
    title_size: h3
    layout: {x: 0, y: 11, w: 8, h: 7}
  - component_type: advanced_viz
    tag: ns-rq-av-readlen
    index: ns-rq-av-readlen
    section: Read length
    workflow_tag: nanoseq
    data_collection_tag: samtools_stats_sections
    use: samtools/read_length_profile
    config:
      x_title: Read length (bases)
      y_title: Reads
      log_x: true
      log_y: true
      selection_enabled: true
      selection_column: sample
    title: "Aligned read length distribution per library"
    description: "The samtools stats read-length histogram, one curve per library, both axes logarithmic. Library preparations differ here far more than their mean lengths suggest."
    title_size: h3
    layout: {x: 0, y: 18, w: 8, h: 7}

  - component_type: text
    tag: ns-rq-ladder-intro
    section: Quality ladder
    title: What survives a quality floor
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A mean quality hides whether the distribution is tight or bimodal; the
      ladder says how much of each library is left above each Phred floor.
      The cards read the Q10 rung, the floor most long-read analyses assume.
    workflow_tag: nanoseq
    data_collection_tag: nanostats_quality
    layout: {x: 0, y: 0, w: 8, h: 2}
  # The three ladder cards are scoped to one rung with filter_expr: the
  # collection has one row per library and cutoff, so a sum or an average over
  # every rung counts each read up to five times.
  - component_type: card
    tag: ns-rq-card-pct
    index: ns-rq-card-pct
    section: Quality ladder
    workflow_tag: nanoseq
    data_collection_tag: nanostats_quality
    use: nanoplot/nanostats_quality
    filter_expr: "col('q_cutoff') == 10"
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: pct_reads
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Reads at Q10 or above (%)
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ns-rq-card-ladder-reads
    index: ns-rq-card-ladder-reads
    section: Quality ladder
    workflow_tag: nanoseq
    data_collection_tag: nanostats_quality
    use: nanoplot/nanostats_quality
    filter_expr: "col('q_cutoff') == 10"
    aggregation: sum
    column_name: n_reads
