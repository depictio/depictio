    title: Transcripts with a locus
    description: Transcripts the extended annotation gives coordinates; the browser frames only these, and a run without that file shows 0.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # The DEXSeq table is the picker of this section: a row narrows the record
  # card, the exon lanes, the weighted introns and the browser to one transcript.
  - component_type: table
    workflow_tag: nanoseq
    data_collection_tag: dexseq_results
    use: dexseq/results
    columns: [feature_id, gene_id, log2fc, padj, significant, direction]
    row_selection_enabled: true
    row_selection_column: feature_id
    # One pick at a time: the browser frames one feature.
    row_selection_mode: single
    section: Transcript at its locus
    tag: ns-loc-table-dexseq
    index: loc-table-dexseq
    title: DEXSeq usage results
    description: >-
      Which transcript shifts its usage? One row per transcript DEXSeq tested, with its gene, the log2
      fold change of its usage, the gene-level adjusted q-value and the call.

      How to read: sort by the q-value to list the strongest shifts and pick one row. The record opens and
      the genome browser below frames the transcript. One row is picked at a time.

      Note: the q-value is the gene's, so the transcripts of one gene share it.
    layout: {x: 0, y: 0, w: 5, h: 5}
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: dexseq_results
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: feature_id
      title_col: gene_id
      selection_source: any
      linked_component: ns-loc-table-dexseq
      sections:
        Transcript: [feature_id, gene_id]
        Usage: [log2fc, direction]
        Test: [padj, pvalue, significant]
      link_templates:
        gene_id: https://www.ensembl.org/id/{value}
    section: Transcript at its locus
    tag: ns-loc-record
    index: loc-record
    title: Transcript record
    description: >-
      The transcript picked in the table and the call DEXSeq made on it: its gene (linked to Ensembl), the
      log2 fold change of its usage and the gene-level q-value, p-value and verdict.

      How to read: the q-value and the call belong to the gene, and the fold change to the transcript. A
      large fold change with a weak q-value is a transcript that moved but a gene that DEXSeq could not
      call.
    layout: {x: 5, y: 0, w: 3, h: 5}
  # The reads behind the isoform. The browser takes its calls from `isoform_loci`
  # (a collection written on every run): one per transcript DEXSeq tested, spanned
  # by the extended annotation, ranked by the DEXSeq verdict (rank_score). It opens
  # on the strongest shift, the header steps to the next ones, and a transcript
  # picked in the DEXSeq table frames its span. Without bambu/extended_annotations.gtf
  # the rows carry no coordinates: no span to frame, so the gene symbol (label_column)
  # stands in, and failing that the tracks open on the first region that holds data; the
  # assembly's gene track (show_annotation) still names the genes. The alignments open
  # first, so the junction arcs a long read draws over its coverage show at once.
  - component_type: jbrowse
    workflow_tag: nanoseq
    data_collection_tag: tracks
    section: Transcript at its locus
    initial_tracks: 4
    max_tracks: 12
    show_overview: false
    show_annotation: true
    selection_enabled: true
    selection_column: sample
    show_junctions: true
    color_by: condition
    locus_from:
      data_collection_tag: isoform_loci
      chrom_column: chrom
      start_column: start
      end_column: end
      padding: 500
      max_rows: 20
      # A pick opens on its whole gene, the row's own span inside it.
      frame_gene: true
      sort_by: rank_score
      descending: true
      label_column: gene_name
      locate_column: transcript_id
      columns: [log2fc, padj]
      search_columns: [gene_id, transcript_id]
    tag: ns-loc-browser
    index: loc-browser
    title: Genome browser
    description: >-
      What do the reads of a transcript's locus show? The aligned reads and coverage of the libraries in
      view, coloured by condition, with the splice arcs of the split reads and the assembly's gene track.

      How to read: it opens on the strongest shift in usage, the header steps to the next ones, and a
      transcript picked in the table frames its whole gene. Look for an exon or an intron that reads of
      one condition use and the others skip, and for coverage that steps at an exon boundary. Use the
      sample filters to choose the libraries drawn.

      Lines and annotations: the arcs join the donor and the acceptor of each split read.

      Note: without the annotation Bambu extended, the transcripts have no coordinates. The tile then
      frames them by gene symbol where it can, else it opens on the first region its tracks hold.
    layout: {x: 0, y: 5, w: 8, h: 9}
  # Needs bambu/extended_annotations.gtf, which only a run that lets Bambu
  # extend the annotation writes; without it the import drops the tile.
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: gtf_transcripts
    use: gtf/transcript_structures
    config:
      max_transcripts: 25
      colour_by: transcript_class
    section: Isoform structure
    tag: ns-loc-structures
    index: loc-structures
    title: Isoform structures
    description: >-
      Which exons does each transcript have? One lane per transcript, up to 25, with its exons on a
      base-pair axis, coloured by the novelty class the annotation gives it. The table's pick narrows it
      to that transcript.

      How to read: compare the exon chains of the transcripts of one gene to see which exon is skipped or
      extended. A transcript in a novel class is an isoform Bambu found beyond the reference annotation.

      Note: the tile needs the annotation Bambu extended, which only a run that lets Bambu extend it
      writes.
    layout: {x: 0, y: 0, w: 4, h: 6}
  # The introns of the picked transcript, one lane per condition, each arc as
  # high as the reads Bambu assigned to the transcript there: the same
  # isoform, used differently in the two conditions. Unpicked it opens on the
  # busiest cluster; a shared intron draws once per transcript that uses it.
  - component_type: advanced_viz
    workflow_tag: nanoseq
    data_collection_tag: isoform_junctions
    viz_kind: sashimi
    config:
      viz_kind: sashimi
      chr_col: chrom
      start_col: start
      end_col: end
      count_col: reads
      sample_col: condition
      annotation_col: annotation
      color_by: sample
      min_count: 0
      top_n: 25
      view: plotly
      views: [plotly]
    section: Isoform structure
    tag: ns-loc-sashimi
    index: loc-sashimi
    title: Weighted introns of the transcript
    description: >-
      How heavily is each intron of the picked transcript used in each condition? One lane per condition,
      an arc for each intron from its donor to its acceptor, as high as the reads Bambu assigned to the
      transcript in that condition, averaged over the condition's libraries. Unpicked, it opens on the
      busiest cluster of introns.

      How to read: the same arc taller in one lane means the transcript is used more in that condition,
      which is the isoform switch seen from its introns. A transcript with a single exon has no intron and
      draws nothing.

      Lines and annotations: arcs only, no cut-off. Up to 25 introns are shown.

      Note: all the introns of one transcript share its height, since the weight is the transcript's reads
      and not the reads crossing a junction. Read the junction counts in the genome browser.
    layout: {x: 4, y: 0, w: 4, h: 6}
