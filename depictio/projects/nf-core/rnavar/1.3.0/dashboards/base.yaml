- title: Callset
  subtitle: How many calls does each sample yield, and how clean are they?
  tab_group: Variants
  tab_order: 4
  tab_icon: mdi:magnify-scan
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Callset scope
    icon: mdi:filter-variant
    color: teal
    description: These picks narrow the FILTER breakdown and the per-call plot; the callset summary, Ts/Tv and spectrum count every PASS call
  grid_sections:
  - name: Callset at a glance
    icon: mdi:counter
    color: teal
    description: PASS calls, Ts/Tv, het/hom ratio and what VariantFiltration removed
  - name: Callset quality
    icon: mdi:chart-scatter-plot
    color: teal
    description: Every sample by its het/hom ratio and Ts/Tv
  - name: Substitution spectrum
    icon: mdi:chart-bar
    color: teal
    description: The PASS SNVs of each sample folded onto six substitution classes
  - name: Depth and allele fraction
    icon: mdi:chart-bell-curve
    color: teal
    description: Every call by its read depth and allele fraction, coloured by FILTER
  - name: Callset tables
    icon: mdi:table
    color: gray
    description: The callset summary and the FILTER breakdown per sample
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [GATK HaplotypeCaller](https://gatk.broadinstitute.org) calls every sample on the exon
      intervals, and VariantFiltration marks strand bias (FS), low quality by depth (QD) and SNP
      clusters instead of removing them. T to C here folds A to G and T to C together, the change
      A-to-I RNA editing leaves, so an RNA callset carries more of it than a DNA one. Pick a FILTER
      value on the left to see what it removed.
    tag: rv-cs-intro
    index: cs-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: vcf_filter_breakdown
    interactive_component_type: MultiSelect
    column_name: filter_label
    column_type: object
    display:
      icon_name: mdi:filter-outline
      custom_color: teal
    section: Callset scope
    group: Calls
    tag: rv-cs-filter-filter
    index: cs-filter-filter
    title: FILTER value
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: vcf_variants
    interactive_component_type: MultiSelect
    column_name: variant_type
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: indigo
    section: Callset scope
    group: Calls
    tag: rv-cs-filter-type
    index: cs-type-filter
    title: Variant type
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: vcf_callset_summary
    use: vcf/pass_calls
    aggregation: median
    column_name: pass_calls
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:magnify-scan
      icon_color: teal
      caption: median per sample, with the spread
      format: si
    section: Callset at a glance
    tag: rv-cs-card-pass
    index: cs-card-pass
    title: PASS calls
    description: Calls that failed none of the hard filters, per sample.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: vcf_callset_summary
    use: vcf/ts_tv
    aggregation: median
    column_name: ts_tv
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:scale-balance
      icon_color: violet
      caption: median per sample, with the spread
      decimals: 2
    section: Callset at a glance
    tag: rv-cs-card-tstv
    index: cs-card-tstv
    title: Transitions over transversions
    description: Ts/Tv of the PASS SNVs, first ALT allele.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: vcf_callset_summary
    use: vcf/het_hom
    aggregation: median
    column_name: het_hom_ratio
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:set-merge
      icon_color: blue
      caption: median per sample, with the spread
      decimals: 2
    section: Callset at a glance
    tag: rv-cs-card-hethom
    index: cs-card-hethom
    title: Het over hom-alt
    description: Heterozygous over homozygous-alternate PASS calls. A sample that lost heterozygosity reads lower.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: vcf_filter_breakdown
    use: vcf/calls_by_filter
    aggregation: sum
    column_name: calls
    column_type: int64
    secondary_layout: top_n
    breakdown_col: filter_label
    top_n_count: 4
    display:
      icon_name: mdi:filter-outline
      icon_color: green
      caption: calls by FILTER value, the largest four
      format: si
    section: Callset at a glance
    tag: rv-cs-card-filters
    index: cs-card-filters
    title: Calls by FILTER
    description: Every call of the samples in scope, PASS and each set of failed filters.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: rnavar
    data_collection_tag: samples
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: het_hom_ratio
      y_col: ts_tv
      label_col: sample
      color_col: '{GROUP_COL}'
      size_col: pass_calls
      x_title: Heterozygous over homozygous-alternate calls
      y_title: Transitions over transversions
      legend_pos: bottom
      selection_enabled: true
      selection_column: sample
    section: Callset quality
    tag: rv-cs-av-tstv-hethom
    index: cs-tstv-vs-hethom
    title: Ts/Tv against het/hom ratio per sample
    description: One point per sample, sized by its PASS calls. Replicates of one sample sit together; a group apart differs in genotype, not in quality.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: rnavar
    data_collection_tag: vcf_substitution_spectrum
    use: vcf/spectrum_bars
    visu_type: bar
    mode: code
    code_content: |-
      # Share of each sample's PASS SNVs per folded class, transitions first.
      order = ['C to T', 'T to C', 'C to A', 'C to G', 'T to A', 'T to G']
      d = df.with_columns((pl.col('fraction') * 100).alias('share')).sort(['sample', 'substitution_class'])
      fig = px.bar(d.to_pandas(), x='substitution_class', y='share', color='sample', barmode='group', category_orders={'substitution_class': order}, labels={'substitution_class': '', 'share': 'Share of the PASS SNVs (%)', 'sample': 'Sample'})
      fig.update_layout(margin=dict(t=10), legend_title_text='')
    section: Substitution spectrum
    tag: rv-cs-fig-spectrum
    index: cs-spectrum
    title: Substitution spectrum per sample
    description: The six pyrimidine-folded classes as shares of each sample's PASS SNVs; T to C carries the editing signal.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: rnavar
    data_collection_tag: vcf_variants
    use: vcf/vaf_against_depth
    config:
      color_col: filter_status
      log_x: true
      x_title: Read depth at the call (log)
      y_title: Variant allele fraction
      legend_pos: bottom
    section: Depth and allele fraction
    tag: rv-cs-av-vaf-dp
    index: cs-vaf-vs-depth
    title: Allele fraction against depth per call
    description: Heterozygous calls band at 0.5 and homozygous ones at 1; filtered calls gather at low depth.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: rnavar
    data_collection_tag: vcf_callset_summary
    use: vcf/callset_summary
    columns: [sample, calls, pass_calls, pass_pct, snvs, indels, multiallelic, ts_tv, het, hom_alt, het_hom_ratio, median_qual, median_dp, median_het_vaf]
    row_selection_enabled: true
    row_selection_column: sample
    section: Callset tables
    tag: rv-cs-table-summary
    index: cs-table-summary
    title: Callset summary per sample
    description: Calls, PASS share, SNVs, indels, Ts/Tv, zygosity and the median quality, depth and allele fraction.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: rnavar
    data_collection_tag: vcf_filter_breakdown
    use: vcf/filter_breakdown
    columns: [sample, filter_label, failed_filters, calls, calls_pct, snvs, indels]
    row_selection_enabled: true
    row_selection_column: filter_label
    section: Callset tables
    tag: rv-cs-table-filters
    index: cs-table-filters
    title: FILTER breakdown per sample
    description: Each FILTER value with its calls, their share of the sample's callset and the SNVs and indels among them.
    layout: {x: 0, y: 6, w: 8, h: 6}
# Every component below reads a snpeff_* collection, all optional: a run
# without --tools snpeff has none of them, and the import drops the tab.
- title: Annotation
  subtitle: What do the calls change in the genes they hit?
  tab_group: Variants
  tab_order: 5
  tab_icon: mdi:tag-outline
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Annotation scope
    icon: mdi:filter-variant
    color: grape
    description: These picks narrow the annotated calls and the gene table; snpEff's own impact and consequence totals cannot be split
  grid_sections:
  - name: Annotation at a glance
    icon: mdi:counter
    color: grape
    description: Annotated calls, genes hit, HIGH impact calls and coding allele fractions
  - name: Impact per sample
    icon: mdi:chart-bar
    color: grape
    description: snpEff impact classes as shares of each sample's effects
  - name: Consequences
    icon: mdi:chart-box-outline
    color: grape
    description: The commonest consequence terms over the samples in scope
  - name: Coding calls
    icon: mdi:chart-scatter-plot
    color: grape
    description: Every annotated call by depth and allele fraction, coloured by impact
  - name: Gene tables
    icon: mdi:table
    color: gray
    description: Variants per gene by impact class, and the annotated calls behind them
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [snpEff](https://pcingola.github.io/SnpEff/) predicts what each call does to the transcripts
      it overlaps and keeps the most severe effect: HIGH (a lost stop or a frameshift), MODERATE (a
      missense change), LOW (a synonymous change) or MODIFIER (non-coding). This tab needs a run
      started with `--tools snpeff`. Pick a gene in the table to open its calls.
    tag: rv-ann-intro
    index: ann-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: snpeff_ann_variants
    interactive_component_type: MultiSelect
    column_name: impact
    column_type: object
    display:
      icon_name: mdi:alert-outline
      custom_color: grape
    section: Annotation scope
    group: Annotation
    tag: rv-ann-filter-impact
    index: ann-impact-filter
    title: Impact
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: snpeff_genes
    interactive_component_type: MultiSelect
    column_name: biotype
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: pink
    section: Annotation scope
    group: Annotation
    tag: rv-ann-filter-biotype
    index: ann-biotype-filter
    title: Gene biotype
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: snpeff_ann_variants
    use: snpeff/impact_composition
    aggregation: count
    column_name: variant_key
    column_type: object
    secondary_layout: donut
    breakdown_col: impact
    display:
      icon_name: mdi:tag-outline
      icon_color: grape
      caption: annotated calls, by impact
      format: si
    section: Annotation at a glance
    tag: rv-ann-card-calls
    index: ann-card-calls
    title: Annotated calls
    description: Calls snpEff annotated, one per sample carrying them. The ring splits them by impact class.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: snpeff_genes
    aggregation: nunique
    column_name: gene_name
    column_type: object
    secondary_layout: top_n
    breakdown_col: biotype
    top_n_count: 3
    display:
      icon_name: mdi:dna
      icon_color: pink
      caption: genes, by the biotype snpEff assigned
      format: si
    section: Annotation at a glance
    tag: rv-ann-card-genes
    index: ann-card-genes
    title: Genes hit
    description: Distinct genes with at least one annotated call, ranked by biotype.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: snpeff_ann_variants
    aggregation: count
    column_name: variant_key
    column_type: object
    secondary_layout: composition
    breakdown_col: variant_type
    filter_expr: "col('impact') == 'HIGH'"
    display:
      icon_name: mdi:alert-outline
      icon_color: red
      caption: HIGH impact calls, by variant type
      format: si
    section: Annotation at a glance
    tag: rv-ann-card-high
    index: ann-card-high
    title: HIGH impact calls
    description: Calls snpEff classes HIGH, a lost or gained stop, a frameshift or a splice-site change.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: snpeff_ann_variants
    aggregation: median
    column_name: vaf
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    filter_expr: "col('impact').is_in(['HIGH', 'MODERATE'])"
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: cyan
      caption: median per coding call, with the spread
      decimals: 2
    section: Annotation at a glance
    tag: rv-ann-card-vaf
    index: ann-card-vaf
    title: Coding allele fraction
    description: Allele fraction of the HIGH and MODERATE calls. Allele-specific expression spreads it away from 0.5.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: rnavar
    data_collection_tag: snpeff_csv_stats
    viz_kind: stacked_taxonomy
    config:
      viz_kind: stacked_taxonomy
      sample_id_col: sample
      taxon_col: category
      rank_col: section
      default_rank: impact
      abundance_col: count
      normalise_to_one: true
      orientation: h
      sample_sort: name
      y_zoom: auto
      top_n: 10
      value_title: Share of the effects
      hidden_controls: [top_n]
    section: Impact per sample
    tag: rv-ann-fig-impact
    index: ann-impact-bars
    title: Impact classes per sample
    description: HIGH, MODERATE, LOW and MODIFIER effects as shares of each sample's effects; the level switch shows snpEff's other breakdowns (effect, functional class, region). MODIFIER fills most of every bar, so the axis starts near its smallest share (the // marks the cut).
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: figure
    workflow_tag: rnavar
    data_collection_tag: snpeff_csv_stats
    use: snpeff/composition_bars
    visu_type: bar
    mode: code
    code_content: |-
      # The twelve commonest consequence terms over the samples in view.
      d = df.filter(pl.col('section') == 'effect').group_by('category').agg(pl.col('count').sum()).sort('count', descending=True).head(12)
      d = d.with_columns(pl.col('category').str.replace_all('_', ' '))
      fig = px.bar(d.to_pandas(), x='count', y='category', orientation='h', labels={'count': 'Effects', 'category': ''})
      fig.update_layout(margin=dict(t=10), yaxis={'categoryorder': 'total ascending'})
      fig.update_yaxes(automargin=True)
    section: Consequences
    tag: rv-ann-fig-effects
    index: ann-consequences
    title: Commonest consequence terms
    description: The twelve consequence terms snpEff assigned most often, summed over the samples.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: rnavar
    data_collection_tag: snpeff_ann_variants
    use: snpeff/annotated_vaf_against_depth
    config:
      log_x: true
      x_title: Read depth at the call (log)
      y_title: Variant allele fraction
      legend_pos: bottom
    section: Coding calls
    tag: rv-ann-av-vaf-dp
    index: ann-vaf-vs-depth
    title: Allele fraction against depth per annotated call
    description: Every annotated call, coloured by impact; hover a point for its protein change.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: rnavar
    data_collection_tag: snpeff_genes
    use: snpeff/genes
    columns: [sample, gene_name, biotype, n_high, n_moderate, n_low, n_modifier, n_variants, n_coding]
    row_selection_enabled: true
    row_selection_column: gene_name
    section: Gene tables
    tag: rv-ann-table-genes
    index: ann-table-genes
    title: Variants per gene and impact class
    description: One row per gene and sample with its HIGH, MODERATE, LOW and MODIFIER counts.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: rnavar
    data_collection_tag: snpeff_ann_variants
    use: snpeff/ann_variants
    columns: [sample, chrom, pos, ref, alt, gene, impact, consequence, hgvs_p, gt, dp, vaf, filter_status]
    row_selection_enabled: true
    row_selection_column: variant_key
    section: Gene tables
    tag: rv-ann-table-calls
    index: ann-table-calls
    title: Annotated calls
    description: Locus, alleles, gene, impact, consequence and protein change of each call, with its genotype and depth.
    layout: {x: 0, y: 6, w: 8, h: 6}
# The navigator (a genome_view on variant_windows) drives the call track
# through the region link in template.yaml and the file track through
# follow_region_filter. The cards opt in to the region with
# follow_region_filter, so they recount what the region holds. Above them, the
# karyotype reads the per-sample density (vcf_variant_density, catalog
# vcf/variant_density) and shows one sample at a time.
- title: Genome
  subtitle: Where along the genome do the calls fall?
  tab_group: Variants
  tab_order: 6
  tab_icon: mdi:map-marker-outline
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Locus filters
    icon: mdi:filter-variant
    color: indigo
    description: These picks narrow the call track and cards; the navigator, karyotype density and VCF lanes read every PASS call
  grid_sections:
  - name: Region at a glance
    icon: mdi:counter
    color: indigo
    description: What the region in view holds, recounted on every brush or locus entry
  - name: Calls along the genome
    icon: mdi:chart-timeline-variant
    color: indigo
    description: One sample's distinct PASS variants per 1 Mb window, on the karyotype
  - name: One region, three tracks
    icon: mdi:dna
    color: indigo
    description: The variant navigator and the tracks that follow its region
  components:
  - component_type: text
    order: 1
    body: >
      The karyotype bands one sample's PASS variants per 1 Mb; the navigator draws the cohort's in
      the same windows, and the calls and filtered VCFs follow its region. Type a locus or a gene in
      its header, or brush its axis, and the tracks and cards follow. The VCF lanes are range-read
      from the files for the region in view.
    tag: rv-gen-intro
    index: gen-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: vcf_variants
    interactive_component_type: MultiSelect
    column_name: variant_type
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: indigo
    section: Locus filters
    group: Locus
    tag: rv-gen-filter-type
    index: gen-type-filter
    title: Variant type
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: vcf_variants
    interactive_component_type: MultiSelect
    column_name: filter_status
    column_type: object
    display:
      icon_name: mdi:filter-outline
      custom_color: teal
    section: Locus filters
    group: Locus
    tag: rv-gen-filter-status
    index: gen-status-filter
    title: FILTER value
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: vcf_variants
    aggregation: count
    column_name: variant_key
    column_type: object
    secondary_layout: composition
    breakdown_col: variant_type
    follow_region_filter: true
    display:
      icon_name: mdi:counter
      icon_color: indigo
      caption: calls in the region, by variant type
      format: si
    section: Region at a glance
    tag: rv-gen-card-calls
    index: gen-card-calls
    title: Calls
    description: Calls inside the region in view, one per sample carrying them.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: variant_windows
    aggregation: sum
    column_name: variants
    column_type: int64
    secondary_layout: histogram
    follow_region_filter: true
    display:
      icon_name: mdi:chart-timeline-variant
      icon_color: blue
      caption: distinct variants, per 1 Mb window
      format: si
    section: Region at a glance
    tag: rv-gen-card-variants
    index: gen-card-variants
    title: Distinct PASS variants
    description: PASS variants of the cohort in the windows of the region, each counted once.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: vcf_variants
    aggregation: median
    column_name: vaf
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    follow_region_filter: true
    display:
      icon_name: mdi:chart-box-outline
      icon_color: cyan
      caption: median per call, with its spread
      decimals: 2
    section: Region at a glance
    tag: rv-gen-card-vaf
    index: gen-card-vaf
    title: Allele fraction
    description: Median allele fraction of the calls inside the region in view.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: vcf_variants
    aggregation: median
    column_name: dp
    column_type: int64
    secondary_layout: histogram
    follow_region_filter: true
    display:
      icon_name: mdi:layers-outline
      icon_color: grape
      caption: median per call, with its distribution
      decimals: 0
    section: Region at a glance
    tag: rv-gen-card-dp
    index: gen-card-dp
    title: Depth at the call
    description: Median read depth HaplotypeCaller reported at the calls inside the region.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # One karyotype per sample would be eight side by side, past the six facets
  # a tile draws: the tile shows one sample, picked in its controls (the first
  # until then), and the left panel's sample filter narrows the list.
  - component_type: advanced_viz
    workflow_tag: rnavar
    data_collection_tag: vcf_variant_density
    use: vcf/density_karyotype
    config:
      assembly: '{GENOME}'
      mode: density
      orientation: vertical
      facet_by_sample: false
      colour_scale: Viridis
    section: Calls along the genome
    tag: rv-gen-av-karyotype
    index: gen-karyotype
    title: PASS variants per 1 Mb on the karyotype
    description: Each chromosome drawn to its length, banded by one sample's distinct PASS variants per 1 Mb; the dark bands are gene-dense, expressed regions.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: rnavar
    data_collection_tag: variant_windows
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      chr_col: chrom
      pos_col: pos
      end_col: end
      score_col: variants
      mark: rect
      assembly: '{GENOME}'
      score_title: PASS variants
      opacity: 0.8
      default_region: first
      region_filter_enabled: true
    section: One region, three tracks
    tag: rv-gen-av-navigator
    index: gen-navigator
    title: Variant navigator, 1 Mb windows
    description: Distinct PASS variants per megabase window. A locus or gene in the header, or a brush, moves every track.
    layout: {x: 0, y: 0, w: 8, h: 3}
  - component_type: advanced_viz
    workflow_tag: rnavar
    data_collection_tag: vcf_variants
    use: vcf/variant_genome_view
    config:
      sample_col: sample
      category_col: filter_status
      mark: point
      assembly: '{GENOME}'
      annotation: '{GENOME}'
      score_title: VAF
      point_size: 5
      facet_by_sample: true
      max_facets: 8
      region_filter_enabled: false
      follow_region_filter: true
    section: One region, three tracks
    tag: rv-gen-av-calls
    index: gen-call-track
    title: Calls over the genes, one lane per sample
    description: Every call in the region at its variant allele fraction, coloured by FILTER, over the gene lane.
    layout: {x: 0, y: 3, w: 8, h: 5}
  # TODO(jbrowse): swap indexed_file+genome_view for a JBrowse2 DC once jbrowse.py is rebuilt
  - component_type: advanced_viz
    workflow_tag: rnavar
    data_collection_tag: vcf_files
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      source: file
      chr_col: chrom
      pos_col: pos
      assembly: '{GENOME}'
      point_size: 6
      file_max_lanes: 8
      # 250 Mb, not the 1 Mb default: a lazy file lane reads nothing until the
      # view is under its window, and the tab opens on a whole contig
      # (default_region: first). An RNA callset's VCF is 1 to 3 MB whole, so a
      # whole-contig range read costs little; 250 Mb covers the longest human
      # contig.
      file_window_size: 250000000
      region_filter_enabled: false
      follow_region_filter: true
    section: One region, three tracks
    tag: rv-gen-av-vcf
    index: gen-vcf-files
    title: The filtered VCFs, read from the files
    description: Each sample's filtered VCF, range-read through its index for the region in view, one lane per sample.
    layout: {x: 0, y: 8, w: 8, h: 4}
