version: 1
# nf-core/rnavar 1.3.0, on the family rules of depictio/projects/nf-core/RULES.md
# (ampliseq/2.18.0 is the reference implementation).
#
# Funnel: the MultiQC report, how the reads aligned and spliced (Alignment) and
# how deep and where they cover the genome (Coverage), all in Data & QC -> how
# many calls each sample yields and how clean they are (Callset) -> what the
# calls change in the genes (Annotation, snpEff route only) -> where along the
# genome they fall (Genome). The sample hub (`samples`, one row per sample) is
# what every filter starts from: the template's links carry a pick on a sample
# or a design group to every per-sample collection.
#
# Routes: the design table is optional (METADATA_FILE; without it the group
# filter, group colours and group splits fall away); a run without --tools
# snpeff has no snpeff_* collections, so the Annotation tab, its pipeline step
# and its tile in the tab list are pruned at import; a run that skipped
# VariantFiltration has no filtered VCFs, so the file track of the Genome tab
# is pruned and the calls are read from the unfiltered VCFs.
main_dashboard:
  title: nf-core/rnavar
  subtitle: Germline variant calling from RNA-seq, from the alignment to the annotated calls
  project_tag: RNA-seq Germline Variant Calling
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family.
  category_colors:
    '{GROUP_COL}': auto
    motif_class:
      GT/AG: '#1c7ed6'
      GC/AG: '#0ca678'
      AT/AC: '#7048e8'
      non-canonical: '#e03131'
    contig_class:
      autosome: '#1c7ed6'
      X: '#7048e8'
      Y: '#0ca678'
      mitochondrion: '#f08c00'
      other: '#adb5bd'
    # How many replicates of a group call a site; the Genome tab's shared variants.
    sharing:
      In every replicate: '#2f9e44'
      In some replicates: '#f08c00'
      In one replicate: '#e8590c'
      Single sample: '#adb5bd'
    variant_type:
      SNP: '#1c7ed6'
      INDEL: '#7048e8'
      MNP: '#0ca678'
      SV: '#f08c00'
    mutation_class:
      transition: '#1c7ed6'
      transversion: '#e8590c'
    substitution_class:
      C to T: '#1c7ed6'
      T to C: '#e8590c'
      C to A: '#74c0fc'
      C to G: '#0ca678'
      T to A: '#7048e8'
      T to G: '#adb5bd'
    impact:
      HIGH: '#e03131'
      MODERATE: '#f08c00'
      LOW: '#1c7ed6'
      MODIFIER: '#adb5bd'
    # VariantFiltration writes its own filter names, joined when a call fails
    # several: PASS stays green, the rest take the palette.
    filter_label:
      '*': auto
      PASS: '#2f9e44'
    filter_status:
      '*': auto
      PASS: '#2f9e44'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. Both
  # are bound to the sample hub, the source of every sample link.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab, which no route removes.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: One row per sample, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Samples, below).
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Key figures
    tag: rv-ov-kf-group
    index: ov-kf-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: rv-ov-kf-sample
    index: ov-kf-sample
    title: Sample
    layout: {x: 2, y: 0, w: 2, h: 1}
  # The pipeline's wordmark, read from its repository; where it cannot load (no
  # internet), the title is drawn as text.
  - component_type: text
    title: nf-core/rnavar
    logo: https://raw.githubusercontent.com/nf-core/rnavar/master/docs/images/nf-core-rnavar_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/rnavar/master/docs/images/nf-core-rnavar_logo_dark.png
    order: 1
    body: >
      Germline variant calling from RNA-seq: how the reads aligned and spliced, how deep they
      cover the transcribed genome, and which variants each sample carries. [Run parameters](params:)
    tag: rv-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  # The study: the samples and, when the run was given a design table, how they
  # group. Each design fact is a line of its own citing the design's collections, so
  # a run without a design table keeps the first line and drops the rest.
  - component_type: text
    surface: card
    values:
      n_samples: {dc: samples, column: sample, aggregation: nunique, format: integer}
      n_reads: {dc: samples, column: input_reads, aggregation: sum, format: si}
      n_groups: {dc: metadata, column: '{GROUP_COL}', aggregation: nunique, format: integer}
      max_reps: {dc: replicate_sharing, column: samples, aggregation: max, format: integer}
      sites: {dc: replicate_sharing, column: sites, aggregation: sum, format: si}
      shared: {dc: replicate_sharing, column: shared_sites, aggregation: sum, format: si}
    body: |
      ### The study
      - ![](icon:mdi:test-tube) **Samples** {{n_samples}}, {{n_reads}} reads given to STAR
      - ![](icon:mdi:account-group-outline) **Design** {{n_groups}} groups from the design table
      - ![](icon:mdi:content-copy) **Replicates** up to {{max_reps}} samples in a group
      - ![](icon:mdi:set-merge) **Shared sites** {{shared}} of {{sites}} PASS sites called in every sample of their group
      - ![](icon:mdi:file-table-outline) **Samplesheet** [one row per sample](section:Sample sheet), its path in [the run parameters](params:input)
    tag: rv-ov-study
    index: ov-study
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash.
  - component_type: text
    surface: card
    body: |
      ### The run
      - ![](icon:mdi:source-branch) **Pipeline** nf-core/rnavar 1.3.0
      - ![](icon:mdi:dna) **Genome** {{param:genome}}
      - ![](icon:mdi:align-horizontal-left) **Aligner** {{param:aligner}}, two-pass {{param:star_twopass}}
      - ![](icon:mdi:magnify-scan) **Calling** confidence {{param:gatk_hc_call_conf}}
      - ![](icon:mdi:filter-outline) **Filters** FS above {{param:gatk_vf_fs_filter}}, QD below {{param:gatk_vf_qd_filter}}
      - ![](icon:mdi:tag-outline) **Annotation** {{param:tools}}
    tag: rv-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  # The marks take the accent colour, not the theme's blue. The step that leads
  # to the snpEff route's tab cites a value from that route's collection: the
  # import removes the line with its data, so a run shows only the steps it took.
  - component_type: text
    surface: card
    accent: teal
    values:
      n_reads: {dc: star_log_final, column: input_reads, aggregation: sum, format: si}
      n_pass: {dc: vcf_callset_summary, column: pass_calls, aggregation: sum, format: si}
      n_ann: {dc: snpeff_ann_variants, column: variant_key, aggregation: count, format: si}
    body: |
      ### Six steps from reads to annotated calls
      Each step names its settings and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:align-horizontal-left) **Align** STAR maps {{n_reads}} reads in two passes over the splice junctions · [Settings](params:aligner) · [Alignment](tab:Alignment)
      2. ![](icon:mdi:content-copy) **Mark** Picard flags duplicates and SplitNCigarReads cuts reads at the introns · [Settings](params:remove_duplicates) · [Coverage](tab:Coverage)
      3. ![](icon:mdi:magnify-scan) **Call** HaplotypeCaller calls every sample on the exon intervals · [Settings](params:gatk_hc_call_conf) · [Callset](tab:Callset)
      4. ![](icon:mdi:filter-outline) **Filter** VariantFiltration marks strand bias, low QD and SNP clusters, {{n_pass}} calls pass · [Settings](params:gatk_vf_fs_filter) · [Callset](tab:Callset)
      5. ![](icon:mdi:tag-outline) **Annotate** snpEff predicts the effect of {{n_ann}} calls · [Settings](params:tools) · [Annotation](tab:Annotation)
      6. ![](icon:mdi:file-document-outline) **Report** MultiQC gathers STAR, Picard and samtools · [Settings](params:skip_tools) · [MultiQC](tab:MultiQC)
      :::
    tag: rv-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/rnavar aligns RNA-seq reads with STAR, marks duplicates, splits the spliced reads and calls germline variants with GATK HaplotypeCaller, then hard-filters them. Only expressed genes are covered, so a call set reads differently from an exome: depth follows expression, and RNA editing adds A to G changes no DNA carries. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The sample filters in the left panel apply to every tab: narrow the samples once and the whole dashboard follows. A bar above a section narrows that section only.

      Provenance: every setting and tool version on this page is read from the run's own `params.json` and software-versions report, and every number from the files the run wrote.
    tag: rv-ov-about
    index: ov-about
    layout: {x: 0, y: 7, w: 8, h: 3}
  # Key figures: four readings of the callset, each opening the tab that
  # explains it. The failed-calls card reads the sample hub, which every route
  # writes, and comes first in the file so the Guide demos the group filter on
  # it; the grid puts it last.
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: samples
    aggregation: median
    column_name: filtered_pct
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:filter-remove-outline
      icon_color: red
      caption: median per sample, with the spread (%)
      link: tab:Callset
      decimals: 1
    section: Key figures
    tag: rv-ov-kf-failed
    index: ov-kf-failed
    title: Calls failing a filter
    description: Calls VariantFiltration marked for strand bias, low quality by depth or an SNP cluster, in percent of all calls. The box shows how it spreads across samples.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: vcf_variants
    aggregation: nunique
    column_name: variant_key
    column_type: object
    filter_expr: "col('is_pass') == True"
    secondary_layout: top_n
    breakdown_col: variant_type
    top_n_count: 4
    display:
      icon_name: mdi:dna
      icon_color: teal
      caption: distinct PASS variants, by type
      link: tab:Callset
      format: si
    section: Key figures
    tag: rv-ov-kf-variants
    index: ov-kf-variants
    title: PASS variants
    description: Distinct sites (contig, position and alleles) that passed every filter in any sample. The bars rank them by variant type.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: replicate_sharing
    aggregation: median
    column_name: shared_pct
    column_type: float64
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:content-duplicate
      icon_color: blue
      caption: median share per {GROUP_COL_DISPLAY}, of 100
      link: tab:Callset
      decimals: 1
    section: Key figures
    tag: rv-ov-kf-shared
    index: ov-kf-shared
    title: Replicate agreement
    description: Share of a group's PASS sites that every one of its replicates calls, in percent. A low value means the replicates reached different parts of the transcriptome; replicates of one group agree far more than samples of different groups do.
    layout: {x: 2, y: 0, w: 2, h: 2}
  # The same slot on a run with no design table: replicates need groups to be
  # compared in, so the import keeps this card (its collection exists on that
  # route only) and drops the one above.
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: vcf_callset_nodesign
    aggregation: median
    column_name: ts_tv
    column_type: float64
    secondary_layout: threshold
    threshold_value: 2.5
    threshold_direction: min
    threshold_warn: 2.0
    display:
      icon_name: mdi:scale-balance
      icon_color: blue
      caption: samples at 2.5 or more, the exonic range
      link: tab:Callset
      decimals: 2
    section: Key figures
    tag: rv-ov-kf-tstv
    index: ov-kf-tstv
    title: Transitions over transversions
    description: Ts/Tv of the PASS SNVs, median over the samples. Calls on exons read about 2.5 to 3, the template's working range; a lower value mixes in errors, which fall evenly on both kinds of change, and the card warns under 2.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: vcf_substitution_spectrum
    aggregation: median
    column_name: fraction
    column_type: float64
    filter_expr: "col('substitution_class') == 'T to C'"
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:swap-horizontal
      icon_color: violet
      caption: median per sample, with the spread
      link: tab:Callset
      format: percent
    section: Key figures
    tag: rv-ov-kf-editing
    index: ov-kf-editing
    title: T to C share
    description: Share of the PASS SNVs that are T to C, the change A-to-I RNA editing leaves (A to G on the other strand). Six classes spread evenly would give 17% each; an RNA callset carries more of this one than a DNA one.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # Findings filter bar: the group, then the sample.
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Findings
    tag: rv-ov-findings-group
    index: ov-findings-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Sample
    section: Findings
    tag: rv-ov-findings-sample
    index: ov-findings-sample
    title: Sample
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one collection.
  - component_type: text
    surface: card
    values:
      n_var: {dc: vcf_variants, column: variant_key, aggregation: nunique, filter_expr: "col('is_pass') == True", format: si}
      failed: {dc: samples, column: filtered_pct, aggregation: median, format: 'decimals:1'}
      shared: {dc: replicate_sharing, column: shared_pct, aggregation: median, format: 'decimals:1'}
      t_to_c: {dc: vcf_substitution_spectrum, column: fraction, aggregation: median, filter_expr: "col('substitution_class') == 'T to C'", format: percent}
      unique: {dc: star_log_final, column: uniquely_mapped_pct, aggregation: median, format: 'decimals:1'}
      dup: {dc: picard_markduplicates_metrics, column: percent_duplication, aggregation: median, format: percent}
      top_gene: {dc: snpeff_ann_variants, column: gene, aggregation: top, weight: dp, filter_expr: "col('is_pass') == True"}
    body: |
      - **{{n_var}}** distinct PASS variants across the samples – {{failed}}% of all calls fail a filter at the median [Callset](tab:Callset)
      - **{{shared}}%** of a group's PASS sites are called in every replicate at the median – the rest sit where one replicate was too shallow [Callset](tab:Callset)
      - **{{t_to_c}}** of the PASS SNVs are T to C at the median, the change A-to-I editing leaves – read it against the other classes [Callset](tab:Callset)
      - **{{unique}}%** of the reads map to a single locus at the median – read the {{dup}} duplicates beside it, since they follow expression [Alignment](tab:Alignment)
      - The PASS calls with the deepest reads sit in [{{top_gene}}](locus:{{top_gene}}): its calls and their alignments in the genome browser
    section: Findings
    tag: rv-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 3}
  # Three figures: the alignment's two QC axes per sample, the substitution
  # classes, and the genotype concordance on its own row (a matrix labelled
  # with sample ids needs the full width).
  - component_type: highlight
    section: Findings
    source_tab: Alignment
    source_component: aln-unique-vs-dup
    caption: Uniquely mapped and duplicate reads of each sample; red and amber mark the ranges worth a look.
    tag: rv-ov-hl-alignment
    index: ov-hl-alignment
    layout: {x: 0, y: 3, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Callset
    source_component: cs-spectrum
    caption: Each sample's PASS SNVs over the six substitution classes; T to C carries the editing signal.
    tag: rv-ov-hl-spectrum
    index: ov-hl-spectrum
    layout: {x: 4, y: 3, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Callset
    source_component: cs-concordance
    caption: Share of PASS genotype calls two samples have in common; replicates of one group should cluster.
    tag: rv-ov-hl-concordance
    index: ov-hl-concordance
    layout: {x: 0, y: 7, w: 8, h: 4}
  # The PASS sites on the genome, opened on the region they cover: a click opens
  # the Genome tab's browser on the site, so the Overview needs no browser of its own.
  - component_type: advanced_viz
    workflow_tag: rnavar
    data_collection_tag: shared_variants
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      chr_col: chrom
      pos_col: pos
      end_col: end
      score_col: min_dp
      feature_col: variant_key
      category_col: sharing
      mark: point
      point_size: 9
      score_title: Reads at the weakest call
      assembly: '{GENOME}'
      region_filter_enabled: false
      click_opens_browser: true
      open_on_data: true
    section: Findings
    tag: rv-ov-genome
    index: ov-genome
    title: PASS sites along the genome
    link: tab:Genome
    description: Each dot is a PASS site of a group, its height the read depth at the call in the replicate that read it least and its colour how many replicates call it. Click a dot to open the site in the genome browser.
    layout: {x: 0, y: 11, w: 8, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers. A tile whose tab a route pruned draws nothing.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Alignment](tab:Alignment)
      - [Coverage](tab:Coverage)

      ### Variants
      - [Callset](tab:Callset)
      - [Annotation](tab:Annotation)
      - [Genome](tab:Genome)
    section: How to read this dashboard
    tag: rv-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the group first.
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: rv-filter-group
    index: sample-filters-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: rv-filter-sample
    index: sample-filters-sample
    title: Sample
    layout: {x: 0, y: 2, w: 1, h: 3}
  # Row selection feeds the Analysis panel.
  - component_type: table
    workflow_tag: rnavar
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample
    section: Sample sheet
    tag: rv-sample-sheet
    index: sample-sheet
    title: Samples
    description: One row per sample, with its design columns, alignment, duplication, coverage and callset numbers.
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
# ============================================================================
# Data & QC
# ============================================================================
- title: MultiQC
  subtitle: What does the MultiQC report say about the alignments?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Report scope
    icon: mdi:tune
    color: orange
    description: Narrow the MultiQC panels to selected report rows
  grid_sections:
  - name: Alignment sections
    icon: mdi:chart-box-outline
    color: orange
    description: STAR read fate and alignment scores, and the duplicates Picard flagged
  - name: Contig sections
    icon: mdi:chart-bar
    color: orange
    description: Reads per contig and on the sex chromosomes, from samtools idxstats
  components:
  - component_type: text
    order: 1
    body: >
      The [MultiQC](https://multiqc.info) report of the run carries STAR's alignment summary,
      Picard's duplication rate and samtools' reads per contig for every sample. MultiQC names a
      sample twice, as aligned and as duplicate-marked (`.md`), and the sample filters reach both.
      A sample that stands out here is worth a look on the Alignment and Coverage tabs.
    tag: rv-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    workflow_tag: rnavar
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: Alignment sections
    tag: rv-mqc-general-stats
    title: General statistics
    description: One row per library, the headline columns of every tool in the report side by side.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: rnavar
    data_collection_tag: multiqc_data
    selected_module: star
    selected_plot: Alignment Scores
    section: Alignment sections
    tag: rv-mqc-star-scores
    title: STAR alignment scores
    description: Uniquely mapped, multi-mapped and unmapped reads per sample, as STAR counts them.
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: rnavar
    data_collection_tag: multiqc_data
    selected_module: picard
    selected_plot: Mark Duplicates
    section: Alignment sections
    tag: rv-mqc-picard-dups
    title: Mark Duplicates
