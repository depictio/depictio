- title: Alignment
  subtitle: How well did the reads align, splice and deduplicate?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:align-horizontal-left
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Alignment scope
    icon: mdi:filter-variant
    color: blue
    description: Keep samples inside a uniquely mapped or mismatch-rate band
  grid_sections:
  - name: Alignment at a glance
    icon: mdi:counter
    color: blue
    description: Input reads, unique mapping, duplication and mismatch rate across the samples
  - name: Mapping and duplication
    icon: mdi:chart-scatter-plot
    color: blue
    description: Every sample by duplication and unique mapping, with the record of the picked one
  - name: Splice junctions
    icon: mdi:relation-many-to-many
    color: blue
    description: The novel junctions STAR found per sample, by intron motif
  - name: Alignment tables
    icon: mdi:table
    color: gray
    description: STAR's summary and Picard's duplication metrics per sample
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [STAR](https://github.com/alexdobin/STAR) aligns the reads in two passes, the second one
      across the junctions the first one found, and Picard marks the duplicates. Duplication runs
      high on RNA-seq because a highly expressed gene yields many identical fragments, so read it
      beside the unique mapping rather than alone. Click a point to open the record of its sample;
      where each sample's reads went is on the [MultiQC](tab:MultiQC) tab.
    tag: rv-aln-intro
    index: aln-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: star_log_final
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: uniquely_mapped_pct
    column_type: float64
    display:
      icon_name: mdi:align-horizontal-left
      custom_color: blue
    section: Alignment scope
    group: Alignment
    tag: rv-aln-filter-unique
    index: aln-unique-range
    title: Uniquely mapped (%)
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: star_log_final
    interactive_component_type: RangeSlider
    column_name: mismatch_rate_pct
    column_type: float64
    display:
      icon_name: mdi:alert-outline
      custom_color: grape
    section: Alignment scope
    group: Alignment
    tag: rv-aln-filter-mismatch
    index: aln-mismatch-range
    title: Mismatch rate (%)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: star_log_final
    use: star/input_reads
    aggregation: sum
    column_name: input_reads
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:counter
      icon_color: blue.4
      caption: reads per sample, with the spread
      format: si
    section: Alignment at a glance
    tag: rv-aln-card-reads
    index: aln-card-reads
    title: Input reads
    description: Reads given to STAR, summed over the samples in scope.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: star_log_final
    use: star/unique_mapped
    aggregation: median
    column_name: uniquely_mapped_pct
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:align-horizontal-left
      icon_color: blue.6
      caption: median per sample, with the spread (%)
      decimals: 1
    section: Alignment at a glance
    tag: rv-aln-card-unique
    index: aln-card-unique
    title: Uniquely mapped
    description: Reads placed at a single locus, in percent of the input. Under 60% points at degraded RNA, contamination or the wrong reference.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: picard_markduplicates_metrics
    aggregation: median
    column_name: percent_duplication
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:content-copy
      icon_color: blue.8
      caption: median per sample, with the spread
      format: percent
    section: Alignment at a glance
    tag: rv-aln-card-dup
    index: aln-card-dup
    title: Duplication
    description: Share of the examined reads Picard MarkDuplicates flagged as duplicates. It runs high on RNA-seq; above 80% a few genes fill the library.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: star_log_final
    use: star/mismatch_rate
    aggregation: median
    column_name: mismatch_rate_pct
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:alert-outline
      icon_color: blue.9
      caption: median per sample, with the spread (%)
      decimals: 2
    section: Alignment at a glance
    tag: rv-aln-card-mismatch
    index: aln-card-mismatch
    title: Mismatch rate
    description: Mismatches per aligned base, in percent. Variants, editing and sequencing errors all add to it; a sample well above the others has a bad library or the wrong reference.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: rnavar
    data_collection_tag: samples
    visu_type: scatter
    mode: code
    code_content: |-
      # One dot per sample on two QC axes, the weakest unique mapping on top; the dashed line is the median of the samples in view, the red band is below 60% uniquely mapped, the amber one above 80% duplicates, and a sample more than three MADs from the median carries its name.
      grp = depictio_group_by[0] if depictio_group_by else '{GROUP_COL}'
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get('{GROUP_COL}') or {}
      names = {'uniquely_mapped_pct': 'Uniquely mapped reads (%)', 'duplication_pct': 'Duplicate reads (%)'}
      d = df if grp in df.columns else df.with_columns(pl.lit('All samples').alias(grp))
      d = d.filter(pl.col('uniquely_mapped_pct').is_not_null() & pl.col('duplication_pct').is_not_null()).sort(['uniquely_mapped_pct', 'sample'])
      long = d.select(['sample', grp, 'uniquely_mapped_pct', 'duplication_pct']).unpivot(index=['sample', grp], variable_name='metric', value_name='value').with_columns(pl.col('metric').replace(names))
      long = long.with_columns(pl.col('value').median().over('metric').alias('med')).with_columns((pl.col('value') - pl.col('med')).abs().median().over('metric').alias('mad'))
      long = long.with_columns(pl.when((pl.col('mad') > 0) & ((pl.col('value') - pl.col('med')).abs() > 3 * 1.4826 * pl.col('mad'))).then(pl.col('sample')).otherwise(pl.lit('')).alias('flag'))
      meds = [long.filter(pl.col('metric') == m).get_column('med').min() for m in names.values()]
      fig = px.scatter(long.to_pandas(), x='value', y='sample', color=grp, color_discrete_map=colors, facet_col='metric', text='flag', custom_data=['sample', grp], category_orders={'sample': d.get_column('sample').to_list(), 'metric': list(names.values())}, labels={grp: '', 'value': '', 'sample': ''})
      fig.update_traces(marker=dict(size=12), textposition='middle right', hovertemplate='<b>%{customdata[0]}</b><br>%{x}<extra></extra>')
      fig.update_xaxes(matches=None, showticklabels=True)
      fig.update_yaxes(automargin=True)
      fig.for_each_annotation(lambda a: a.update(text=a.text.split('=')[-1]))
      for i, m in enumerate(meds):
          fig.add_vline(x=m, line_dash='dash', line_width=1, opacity=0.5, col=i + 1)
      fig.add_vrect(x0=0, x1=60, fillcolor='rgba(224,49,49,0.12)', line_width=0, layer='below', col=1)
      fig.add_vrect(x0=80, x1=100, fillcolor='rgba(240,140,0,0.12)', line_width=0, layer='below', col=2)
      fig.update_layout(margin=dict(t=30), legend_title_text='', legend=dict(orientation='h', y=-0.15))
    selection_enabled: true
    selection_column: sample
    section: Mapping and duplication
    tag: rv-aln-fig-unique-dup
    index: aln-unique-vs-dup
    title: Unique mapping and duplication per sample
    description: One dot per sample, the lowest unique mapping on top, with the median of the samples in view dashed. Red shades under 60% uniquely mapped, amber over 80% duplicates, where a few genes fill the library; both are working limits of this template, and duplication tracks expression in RNA-seq, so read it by group. A sample more than 3 scaled median absolute deviations from the median carries its name; a click opens its record.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: rnavar
    data_collection_tag: samples
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: aln-unique-vs-dup
      id_col: sample
      title_col: sample
      selection_source: scatter_selection
      sections:
        Alignment: [input_reads, uniquely_mapped_pct, multimapped_pct, unmapped_pct, mismatch_rate_pct]
        Splicing: [splices_annotated_pct, novel_junction_pct]
        Coverage: [duplication_pct, bases_10x_pct, mito_reads_pct, other_contig_reads_pct]
        Calls: [pass_calls, snvs, indels, ts_tv, het_hom_ratio, median_dp]
    section: Mapping and duplication
    tag: rv-aln-av-sample-record
    index: aln-sample-record
    title: Picked sample
    description: The sample picked on the plot, from its reads to its calls.
    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: advanced_viz
    workflow_tag: rnavar
    data_collection_tag: star_junctions
    viz_kind: stacked_taxonomy
    config:
      viz_kind: stacked_taxonomy
      sample_id_col: sample
      taxon_col: motif_class
      rank_col: annotation
      default_rank: novel
      abundance_col: junctions
      normalise_to_one: true
      orientation: h
      sample_sort: name
      y_zoom: auto
      top_n: 8
      value_title: Share of the junctions
      hidden_controls: [top_n]
    section: Splice junctions
    tag: rv-aln-fig-junctions
    index: aln-novel-junctions
    title: Novel splice junctions per sample
    description: Junctions by intron motif, the novel ones first (the level switch shows the annotated ones, nearly all GT/AG). Canonical novel junctions can be real; non-canonical ones rarely are. Normalise off shows the counts.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    workflow_tag: rnavar
    data_collection_tag: star_log_final
    use: star/log_final
    row_selection_enabled: true
    row_selection_column: sample
    section: Alignment tables
    tag: rv-aln-table-star
    index: aln-table-star
    title: STAR alignment summary per sample
    description: Input reads, read fate, splices and the mismatch, deletion and insertion rates.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: rnavar
    data_collection_tag: picard_markduplicates_metrics
    use: picard/markduplicates_metrics
    columns: [sample, read_pairs_examined, unpaired_reads_examined, duplicate_reads, read_pair_optical_duplicates, percent_duplication, estimated_library_size]
    row_selection_enabled: true
    row_selection_column: sample
    section: Alignment tables
    tag: rv-aln-table-dups
    index: aln-table-dups
    title: Duplication metrics per sample
    description: Pairs and reads examined, duplicates flagged, optical duplicates and Picard's library-size estimate.
    layout: {x: 0, y: 6, w: 8, h: 6}
- title: Coverage
  subtitle: How deep do the reads cover the genome, and where?
  tab_group: Data & QC
  tab_order: 3
  tab_icon: mdi:layers-outline
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Coverage scope
    icon: mdi:filter-variant
    color: cyan
    description: The contig class narrows the per-contig chart and table; the other tiles are whole-genome numbers per sample
  grid_sections:
  - name: Coverage at a glance
    icon: mdi:counter
    color: cyan
    description: Callable depth, mapped reads and the mitochondrial and unplaced shares
  - name: Depth distribution
    icon: mdi:chart-line
    color: cyan
    description: Reference bases at each read depth, one curve per sample
  - name: Reads per contig class
    icon: mdi:chart-bar
    color: cyan
    description: Where each sample's mapped reads land, autosomes to unplaced contigs
  - name: Contig tables
    icon: mdi:table
    color: gray
    description: Mapped reads per contig and sample
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [samtools](https://www.htslib.org) stats and idxstats read the duplicate-marked alignment
      the calls are made on. RNA-seq covers only what is expressed, so most of the genome sits at
      zero depth and the depth curve follows expression rather than capture. On GRCh38 the
      ribosomal DNA repeats sit on unplaced contigs, so a large unplaced share points at ribosomal
      RNA the library kept.
    tag: rv-cov-intro
    index: cov-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: samtools_idxstats
    interactive_component_type: MultiSelect
    column_name: contig_class
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: cyan
    section: Coverage scope
    group: Contigs
    tag: rv-cov-filter-class
    index: cov-class-filter
    title: Contig class
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: samples
    aggregation: median
    column_name: bases_10x_pct
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:layers-outline
      icon_color: cyan.4
      caption: median per sample, with the spread (%)
      decimals: 1
    section: Coverage at a glance
    tag: rv-cov-card-10x
    index: cov-card-10x
    title: Covered bases at 10x
    description: Covered bases with ten reads or more, in percent of the covered bases; the part deep enough to call on.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: samtools_stats_sections
    aggregation: sum
    column_name: reads_mapped
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    filter_expr: "col('section') == 'SN'"
    display:
      icon_name: mdi:counter
      icon_color: cyan.6
      caption: reads per sample, with the spread
      format: si
    section: Coverage at a glance
    tag: rv-cov-card-mapped
    index: cov-card-mapped
    title: Mapped reads
    description: Reads samtools counts as mapped in the duplicate-marked alignment, summed over the samples.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: samples
    aggregation: median
    column_name: mito_reads_pct
    column_type: float64
    secondary_layout: threshold
    threshold_value: 5
    threshold_direction: max
    threshold_warn: 10
    display:
      icon_name: mdi:waves
      icon_color: cyan.8
      caption: samples at 5% or less, warn to 10%
      decimals: 1
    section: Coverage at a glance
    tag: rv-cov-card-mito
    index: cov-card-mito
    title: Mitochondrial reads
    description: Mapped reads on the mitochondrial genome, in percent. A stressed or dying culture sends more there; the card passes up to 5% and warns above 10%, both working limits of this template.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: samples
    aggregation: median
    column_name: other_contig_reads_pct
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:help-circle-outline
      icon_color: cyan.9
      caption: median per sample, with the spread (%)
      decimals: 1
    section: Coverage at a glance
    tag: rv-cov-card-other
    index: cov-card-other
    title: Unplaced and alt contigs
    description: Mapped reads on alt, unplaced and decoy contigs, in percent; on GRCh38 mostly the ribosomal DNA repeats.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: rnavar
    data_collection_tag: samtools_stats_sections
    use: samtools/coverage_distribution
    config:
      log_x: true
      log_y: true
      x_title: Read depth (log)
      y_title: Reference bases (log)
      legend_pos: bottom
    section: Depth distribution
    tag: rv-cov-av-depth
    index: cov-depth-profile
    title: Reference bases at each read depth
    description: One curve per sample. A curve that falls later covers more of its expressed genes deep enough to call.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: rnavar
    data_collection_tag: samtools_idxstats
    viz_kind: stacked_taxonomy
    config:
      viz_kind: stacked_taxonomy
      sample_id_col: sample
      taxon_col: contig_class
      rank_col: null
      abundance_col: mapped_reads
      normalise_to_one: true
      orientation: h
      sample_sort: name
      y_zoom: auto
      top_n: 8
      value_title: Share of the mapped reads
      hidden_controls: [rank, top_n]
    section: Reads per contig class
    tag: rv-cov-fig-contigs
    index: cov-contig-classes
    title: Mapped reads by contig class per sample
    description: Autosomes, X, Y, the mitochondrion and the alt and unplaced contigs, as shares of each sample's mapped reads. The autosomes fill most of every bar, so the axis starts near the smallest autosome share (the // marks the cut).
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    workflow_tag: rnavar
    data_collection_tag: samtools_idxstats
    use: samtools/idxstats
    columns: [sample, contig, contig_class, length, mapped_reads, mapped_pct, reads_per_mb]
    row_selection_enabled: true
    row_selection_column: contig
    section: Contig tables
    tag: rv-cov-table-idxstats
    index: cov-table-idxstats
    title: Mapped reads per contig
    description: Contig length, mapped reads, their share of the sample and reads per megabase.
    layout: {x: 0, y: 0, w: 8, h: 6}
