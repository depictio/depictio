version: 1
# nf-core/rnavar 1.3.0, on the family rules of depictio/projects/nf-core/RULES.md
# (ampliseq/2.18.0 is the reference implementation).
#
# Funnel: the MultiQC report, how the reads aligned and spliced (Alignment) and
# how deep and where they cover the genome (Coverage), all in Data & QC -> how
# many calls each sample yields and how clean they are (Callset) -> what the
# calls change in the genes (Annotation, snpEff route only) -> where along the
# genome they fall (Genome). The sample hub (`samples`, one row per sample) is
# what every filter starts from: the template's links carry a pick on a sample
# or a design group to every per-sample collection.
#
# Routes: the design table is optional (METADATA_FILE; without it the group
# filter, group colours and group splits fall away); a run without --tools
# snpeff has no snpeff_* collections, so the Annotation tab, its pipeline step
# and its tile in the tab list are pruned at import; a run that skipped
# VariantFiltration has no filtered VCFs, so the file track of the Genome tab
# is pruned and the calls are read from the unfiltered VCFs.
main_dashboard:
  title: nf-core/rnavar
  subtitle: Germline variant calling from RNA-seq, from the alignment to the annotated calls
  project_tag: RNA-seq Germline Variant Calling
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family.
  category_colors:
    '{GROUP_COL}': auto
    fate:
      Uniquely mapped: '#1c7ed6'
      Multi-mapped: '#74c0fc'
      Too many loci: '#f08c00'
      'Unmapped: too short': '#e03131'
      'Unmapped: other': '#adb5bd'
      'Unmapped: too many mismatches': '#862e9c'
    motif_class:
      GT/AG: '#1c7ed6'
      GC/AG: '#0ca678'
      AT/AC: '#7048e8'
      non-canonical: '#e03131'
    contig_class:
      autosome: '#1c7ed6'
      X: '#7048e8'
      Y: '#0ca678'
      mitochondrion: '#f08c00'
      other: '#adb5bd'
    variant_type:
      SNP: '#1c7ed6'
      INDEL: '#7048e8'
      MNP: '#0ca678'
      SV: '#f08c00'
    mutation_class:
      transition: '#1c7ed6'
      transversion: '#e8590c'
    impact:
      HIGH: '#e03131'
      MODERATE: '#f08c00'
      LOW: '#1c7ed6'
      MODIFIER: '#adb5bd'
    # VariantFiltration writes its own filter names, joined when a call fails
    # several: PASS stays green, the rest take the palette.
    filter_label:
      '*': auto
      PASS: '#2f9e44'
    filter_status:
      '*': auto
      PASS: '#2f9e44'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. Both
  # are bound to the sample hub, the source of every sample link.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab, which no route removes.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: One row per sample, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Samples, below).
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Key figures
    tag: rv-ov-kf-group
    index: ov-kf-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: rv-ov-kf-sample
    index: ov-kf-sample
    title: Sample
    layout: {x: 2, y: 0, w: 2, h: 1}
  # The pipeline's wordmark, read from its repository; where it cannot load (no
  # internet), the title is drawn as text.
  - component_type: text
    title: nf-core/rnavar
    logo: https://raw.githubusercontent.com/nf-core/rnavar/master/docs/images/nf-core-rnavar_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/rnavar/master/docs/images/nf-core-rnavar_logo_dark.png
    order: 1
    body: >
      Germline variant calling from RNA-seq: how the reads aligned and spliced, how deep they
      cover the transcribed genome, and which variants each sample carries. [Run parameters](params:)
    tag: rv-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/rnavar aligns RNA-seq reads with STAR, marks duplicates, splits the spliced reads and calls germline variants with GATK HaplotypeCaller, then hard-filters them. Only expressed genes are covered, so a call set reads differently from an exome: depth follows expression, and RNA editing adds A to G changes no DNA carries. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The sample filters in the left panel apply to every tab: narrow the samples once and the whole dashboard follows. A bar above a section narrows that section only.
    tag: rv-ov-about
    index: ov-about
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash.
  - component_type: text
    surface: card
    values:
      n_samples: {dc: samples, column: sample, aggregation: nunique, format: integer}
    body: |
      ### The run
      - ![](icon:mdi:test-tube) **Samples** {{n_samples}} on {{param:genome}}
      - ![](icon:mdi:align-horizontal-left) **Aligner** {{param:aligner}}, two-pass {{param:star_twopass}}
      - ![](icon:mdi:magnify-scan) **Calling** confidence {{param:gatk_hc_call_conf}}
      - ![](icon:mdi:filter-outline) **Filters** FS above {{param:gatk_vf_fs_filter}}, QD below {{param:gatk_vf_qd_filter}}
      - ![](icon:mdi:tag-outline) **Annotation** {{param:tools}}
    tag: rv-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  # The marks take the accent colour, not the theme's blue. The step that leads
  # to the snpEff route's tab cites a value from that route's collection: the
  # import removes the line with its data, so a run shows only the steps it took.
  - component_type: text
    surface: card
    accent: teal
    values:
      n_reads: {dc: star_log_final, column: input_reads, aggregation: sum, format: si}
      n_pass: {dc: vcf_callset_summary, column: pass_calls, aggregation: sum, format: si}
      n_ann: {dc: snpeff_ann_variants, column: variant_key, aggregation: count, format: si}
    body: |
      ### Six steps from reads to annotated calls
      Each step names its settings and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:align-horizontal-left) **Align** STAR maps {{n_reads}} reads in two passes over the splice junctions · [Settings](params:aligner) · [Alignment](tab:Alignment)
      2. ![](icon:mdi:content-copy) **Mark** Picard flags duplicates and SplitNCigarReads cuts reads at the introns · [Settings](params:remove_duplicates) · [Coverage](tab:Coverage)
      3. ![](icon:mdi:magnify-scan) **Call** HaplotypeCaller calls every sample on the exon intervals · [Settings](params:gatk_hc_call_conf) · [Callset](tab:Callset)
      4. ![](icon:mdi:filter-outline) **Filter** VariantFiltration marks strand bias, low QD and SNP clusters, {{n_pass}} calls pass · [Settings](params:gatk_vf_fs_filter) · [Callset](tab:Callset)
      5. ![](icon:mdi:tag-outline) **Annotate** snpEff predicts the effect of {{n_ann}} calls · [Settings](params:tools) · [Annotation](tab:Annotation)
      6. ![](icon:mdi:file-document-outline) **Report** MultiQC gathers STAR, Picard and samtools · [Settings](params:skip_tools) · [MultiQC](tab:MultiQC)
      :::
    tag: rv-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. All four read the sample hub, which every route writes.
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: samples
    aggregation: nunique
    column_name: sample
    column_type: object
    secondary_layout: composition
    breakdown_col: '{GROUP_COL}'
    display:
      icon_name: mdi:test-tube
      icon_color: orange
      caption: sequenced, by {GROUP_COL_DISPLAY}
      link: tab:Alignment
    section: Key figures
    tag: rv-ov-kf-samples
    index: ov-kf-samples
    title: Samples
    description: RNA-seq libraries called. The bar splits them by {GROUP_COL_DISPLAY}.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: samples
    aggregation: median
    column_name: uniquely_mapped_pct
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:align-horizontal-left
      icon_color: blue
      caption: median per sample, with the spread (%)
      link: tab:Alignment
      decimals: 1
    section: Key figures
    tag: rv-ov-kf-unique
    index: ov-kf-unique
    title: Uniquely mapped
    description: Reads STAR placed at a single locus, in percent of its input. The box shows the spread across samples.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: samples
    aggregation: median
    column_name: pass_calls
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:magnify-scan
      icon_color: teal
      caption: median per sample, with the spread
      link: tab:Callset
      format: si
    section: Key figures
    tag: rv-ov-kf-pass
    index: ov-kf-pass
    title: PASS calls
    description: Calls that failed none of the VariantFiltration filters. The box shows how much the samples differ.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: samples
    aggregation: median
    column_name: ts_tv
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:scale-balance
      icon_color: violet
      caption: median per sample, with the spread
      link: tab:Callset
      decimals: 2
    section: Key figures
    tag: rv-ov-kf-tstv
    index: ov-kf-tstv
    title: Transitions over transversions
    description: Ts/Tv of the PASS SNVs. Transcribed sequence and RNA editing raise it above the genome-wide value of about 2.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the group, then the sample.
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Findings
    tag: rv-ov-findings-group
    index: ov-findings-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Sample
    section: Findings
    tag: rv-ov-findings-sample
    index: ov-findings-sample
    title: Sample
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing collections every route writes.
  - component_type: text
    surface: card
    values:
      uniq: {dc: samples, column: uniquely_mapped_pct, aggregation: median, format: 'decimals:1'}
      dup: {dc: samples, column: duplication_pct, aggregation: median, format: 'decimals:1'}
      deep: {dc: samples, column: bases_10x_pct, aggregation: median, format: 'decimals:1'}
      mito: {dc: samples, column: mito_reads_pct, aggregation: median, format: 'decimals:1'}
      tstv: {dc: samples, column: ts_tv, aggregation: median, format: 'decimals:2'}
      t_to_c: {dc: vcf_substitution_spectrum, column: fraction, aggregation: median, filter_expr: "col('substitution_class') == 'T to C'", format: percent}
      top_chr: {dc: variant_windows, column: chrom, aggregation: top, weight: variants}
      n_win: {dc: variant_windows, column: pos, aggregation: count, format: integer}
    body: |
      - **{{uniq}}%** of the reads map uniquely at the median – Picard flags {{dup}}% of them as duplicates [Alignment](tab:Alignment)
      - **{{deep}}%** of the covered bases reach 10x at the median – {{mito}}% of the reads go to the mitochondrion [Coverage](tab:Coverage)
      - **{{tstv}}** median Ts/Tv of the PASS SNVs – T to C, where A-to-I editing folds, takes {{t_to_c}} of them [Callset](tab:Callset)
      - **{{n_win}}** windows of 1 Mb hold a PASS call – {{top_chr}} holds the most variants [Genome](tab:Genome)
    section: Findings
    tag: rv-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per analysis tab every route keeps, in the order of the tabs.
  # The tiles of a row share a stored height.
  - component_type: highlight
    section: Findings
    source_tab: Alignment
    source_component: aln-unique-vs-dup
    caption: One point per sample, by its duplication rate and uniquely mapped share; colour is the design group.
    hide_legend: true
    tag: rv-ov-hl-alignment
    index: ov-hl-alignment
    layout: {x: 0, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Coverage
    source_component: cov-depth-profile
    caption: Reference bases at each read depth, one curve per sample; a curve further right covers its genes deeper.
    hide_legend: true
    tag: rv-ov-hl-coverage
    index: ov-hl-coverage
    layout: {x: 4, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Callset
    source_component: cs-tstv-vs-hethom
    caption: One point per sample, by its het/hom ratio and Ts/Tv; a cell line that lost heterozygosity sits left.
    hide_legend: true
    tag: rv-ov-hl-callset
    index: ov-hl-callset
    layout: {x: 0, y: 6, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Genome
    source_component: gen-karyotype
    caption: One sample's PASS variants per 1 Mb on each chromosome; the bands darken where genes are dense and expressed.
    tag: rv-ov-hl-genome
    index: ov-hl-genome
    layout: {x: 4, y: 6, w: 4, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers. A tile whose tab a route pruned draws nothing.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Alignment](tab:Alignment)
      - [Coverage](tab:Coverage)

      ### Variants
      - [Callset](tab:Callset)
      - [Annotation](tab:Annotation)
      - [Genome](tab:Genome)
    section: How to read this dashboard
    tag: rv-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the group first.
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: rv-filter-group
    index: sample-filters-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: rv-filter-sample
    index: sample-filters-sample
    title: Sample
    layout: {x: 0, y: 2, w: 1, h: 3}
  # Row selection feeds the Analysis panel.
  - component_type: table
    workflow_tag: rnavar
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample
    section: Sample sheet
    tag: rv-sample-sheet
    index: sample-sheet
    title: Samples
    description: One row per sample, with its design columns, alignment, duplication, coverage and callset numbers.
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
# ============================================================================
# Data & QC
# ============================================================================
- title: MultiQC
  subtitle: What does the MultiQC report say about the alignments?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Report scope
    icon: mdi:tune
    color: orange
    description: Narrow the MultiQC panels to selected report rows
  grid_sections:
  - name: Alignment sections
    icon: mdi:chart-box-outline
    color: orange
    description: STAR read fate and alignment scores, and the duplicates Picard flagged
  - name: Contig sections
    icon: mdi:chart-bar
    color: orange
    description: Reads per contig and on the sex chromosomes, from samtools idxstats
  components:
  - component_type: text
    order: 1
    body: >
      The [MultiQC](https://multiqc.info) report of the run carries STAR's alignment summary,
      Picard's duplication rate and samtools' reads per contig for every sample. MultiQC names a
      sample twice, as aligned and as duplicate-marked (`.md`), and the sample filters reach both.
      A sample that stands out here is worth a look on the Alignment and Coverage tabs.
    tag: rv-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    workflow_tag: rnavar
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: Alignment sections
    tag: rv-mqc-general-stats
    title: General statistics
    description: One row per library, the headline columns of every tool in the report side by side.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: rnavar
    data_collection_tag: multiqc_data
    selected_module: star
    selected_plot: Alignment Scores
    section: Alignment sections
    tag: rv-mqc-star-scores
    title: STAR alignment scores
    description: Uniquely mapped, multi-mapped and unmapped reads per sample, as STAR counts them.
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: rnavar
    data_collection_tag: multiqc_data
    selected_module: picard
    selected_plot: Mark Duplicates
    section: Alignment sections
    tag: rv-mqc-picard-dups
    title: Mark Duplicates
    description: Unique and duplicate reads and pairs per sample, from Picard MarkDuplicates.
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: rnavar
    data_collection_tag: multiqc_data
    selected_module: star
    selected_plot: Summary Statistics
    section: Alignment sections
    tag: rv-mqc-star-summary
    title: STAR summary statistics
    description: Input reads, mapped share, splices and mismatch rate per sample.
    layout: {x: 0, y: 8, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: rnavar
    data_collection_tag: multiqc_data
    selected_module: samtools
    selected_plot: Mapped reads per contig
    section: Contig sections
    tag: rv-mqc-idxstats
    title: Mapped reads per contig
    description: Reads on each contig, normalised per sample, from samtools idxstats.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: rnavar
    data_collection_tag: multiqc_data
    selected_module: samtools
    selected_plot: XY counts
    section: Contig sections
    tag: rv-mqc-xy
    title: Reads on chrX and chrY
    description: Share of the mapped reads on each sex chromosome, per sample.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: multiqc_data
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:file-document-outline
      custom_color: orange
    section: Report scope
    group: Report scope
    tag: rv-mqc-filter-report-row
    index: rv-mqc-report-row-filter
    title: Report row
    layout: {x: 0, y: 0, w: 1, h: 3}
- title: Alignment
  subtitle: How well did the reads align, splice and deduplicate?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:align-horizontal-left
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Alignment scope
    icon: mdi:filter-variant
    color: blue
    description: Keep samples inside a uniquely mapped or mismatch-rate band
  grid_sections:
  - name: Alignment at a glance
    icon: mdi:counter
    color: blue
    description: Input reads, unique mapping, duplication and mismatch rate across the samples
  - name: Read fate
    icon: mdi:chart-bar
    color: blue
    description: Where each sample's reads went, from uniquely mapped to unmapped
  - name: Mapping and duplication
    icon: mdi:chart-scatter-plot
    color: blue
    description: Every sample by duplication and unique mapping, with the record of the picked one
  - name: Splice junctions
    icon: mdi:relation-many-to-many
    color: blue
    description: The novel junctions STAR found per sample, by intron motif
  - name: Alignment tables
    icon: mdi:table
    color: gray
    description: STAR's summary and Picard's duplication metrics per sample
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [STAR](https://github.com/alexdobin/STAR) aligns the reads in two passes, the second one
      across the junctions the first one found, and Picard marks the duplicates. Duplication runs
      high on RNA-seq because a highly expressed gene yields many identical fragments, so read it
      beside the unique mapping rather than alone. Click a point to open the record of its sample.
    tag: rv-aln-intro
    index: aln-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: star_log_final
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: uniquely_mapped_pct
    column_type: float64
    display:
      icon_name: mdi:align-horizontal-left
      custom_color: blue
    section: Alignment scope
    group: Alignment
    tag: rv-aln-filter-unique
    index: aln-unique-range
    title: Uniquely mapped (%)
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
