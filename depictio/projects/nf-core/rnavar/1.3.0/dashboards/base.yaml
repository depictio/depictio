- title: Callset
  subtitle: How many calls does each sample yield, and how clean are they?
  tab_group: Variants
  tab_order: 4
  tab_icon: mdi:magnify-scan
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Callset scope
    icon: mdi:filter-variant
    color: teal
    description: These picks narrow the FILTER breakdown and the allele-fraction plot; the callset summary, Ts/Tv and spectrum count every PASS call
  grid_sections:
  - name: Callset at a glance
    icon: mdi:counter
    color: teal
    description: PASS calls, Ts/Tv, het/hom ratio and what VariantFiltration removed
  - name: Calls per sample
    icon: mdi:chart-bar
    color: teal
    description: PASS SNVs and indels of each sample, the replicates of a group side by side
    collapsed: true
  - name: Agreement between samples
    icon: mdi:relation-many-to-many
    color: teal
    description: Share of PASS genotype calls every pair of samples has in common
  - name: Substitution spectrum
    icon: mdi:chart-bar
    color: teal
    description: The PASS SNVs of each sample over six substitution classes; T to C is the editing signal
  - name: Callset quality
    icon: mdi:chart-bar
    color: teal
    description: Ts/Tv and het/hom ratio of each sample against their usual range
  - name: Allele fraction
    icon: mdi:chart-bell-curve
    color: teal
    description: Each sample's calls over the allele fraction, against the germline peaks
    collapsed: true
  - name: Callset tables
    icon: mdi:table
    color: gray
    description: The callset summary, the FILTER breakdown and, with a design, the replicate agreement
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [GATK HaplotypeCaller](https://gatk.broadinstitute.org) calls every sample on the exon
      intervals, and VariantFiltration marks strand bias (FS), low quality by depth (QD) and SNP
      clusters instead of removing them. The concordance matrix compares samples on the genotype
      calls they share, so replicates should sit together. T to C folds A to G and T to C together,
      the change A-to-I RNA editing leaves; pick a FILTER value on the left to see what it removed.
    tag: rv-cs-intro
    index: cs-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: vcf_filter_breakdown
    interactive_component_type: MultiSelect
    column_name: filter_label
    column_type: object
    display:
      icon_name: mdi:filter-outline
      custom_color: teal
    section: Callset scope
    group: Calls
    tag: rv-cs-filter-filter
    index: cs-filter-filter
    title: FILTER value
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: vcf_allele_fractions
    interactive_component_type: MultiSelect
    column_name: variant_type
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: indigo
    section: Callset scope
    group: Calls
    tag: rv-cs-filter-type
    index: cs-type-filter
    title: Variant type
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: vcf_allele_fractions
    interactive_component_type: MultiSelect
    column_name: depth_class
    column_type: object
    display:
      icon_name: mdi:layers-outline
      custom_color: cyan
    section: Callset scope
    group: Calls
    tag: rv-cs-filter-depth
    index: cs-depth-filter
    title: Read depth at the call
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: vcf_callset_summary
    use: vcf/pass_calls
    aggregation: median
    column_name: pass_calls
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:magnify-scan
      icon_color: teal.4
      caption: median per sample, with the spread
      format: si
    section: Callset at a glance
    tag: rv-cs-card-pass
    index: cs-card-pass
    title: PASS calls
    description: Calls that failed none of the hard filters, per sample.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: vcf_callset_summary
    use: vcf/ts_tv
    aggregation: median
    column_name: ts_tv
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:scale-balance
      icon_color: teal.6
      caption: median per sample, with the spread
      decimals: 2
    section: Callset at a glance
    tag: rv-cs-card-tstv
    index: cs-card-tstv
    title: Transitions over transversions
    description: Ts/Tv of the PASS SNVs, first ALT allele. Calls on exons read about 2.5 to 3; a lower value mixes in errors, which fall evenly on both kinds of change.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: vcf_callset_summary
    use: vcf/het_hom
    aggregation: median
    column_name: het_hom_ratio
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:set-merge
      icon_color: teal.8
      caption: median per sample, with the spread
      decimals: 2
    section: Callset at a glance
    tag: rv-cs-card-hethom
    index: cs-card-hethom
    title: Het over hom-alt
    description: Heterozygous over homozygous-alternate PASS calls, about 1.5 to 2 on exons. A sample that lost heterozygosity reads lower, and so does allele-specific expression in RNA.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: vcf_filter_breakdown
    use: vcf/calls_by_filter
    aggregation: sum
    column_name: calls
    column_type: int64
    secondary_layout: top_n
    breakdown_col: filter_label
    top_n_count: 4
    display:
      icon_name: mdi:filter-outline
      icon_color: teal.9
      caption: calls by FILTER value, the largest four
      format: si
    section: Callset at a glance
    tag: rv-cs-card-filters
    index: cs-card-filters
    title: Calls by FILTER
    description: Every call of the samples in scope, PASS and each set of failed filters.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: rnavar
    data_collection_tag: samples
    visu_type: bar
    mode: code
    code_content: |-
      # Ts/Tv and het/hom ratio of each sample as sorted bars, the weakest Ts/Tv on top. Green bands: Ts/Tv 2.5 to 3 (exonic human callsets sit near 3; random errors fall evenly on transitions and transversions and pull the ratio toward 0.5) and het/hom 1.5 to 2 (the range outbred human exomes report; allele-specific expression in RNA lowers it). The band edges are working values of this template, not pipeline thresholds.
      grp = depictio_group_by[0] if depictio_group_by else '{GROUP_COL}'
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get('{GROUP_COL}') or {}
      names = {'ts_tv': 'Ts/Tv', 'het_hom_ratio': 'Het/hom ratio'}
      bands = [(2.5, 3.0), (1.5, 2.0)]
      d = df if grp in df.columns else df.with_columns(pl.lit('All samples').alias(grp))
      d = d.filter(pl.col('ts_tv').is_not_null() & pl.col('het_hom_ratio').is_not_null()).sort(['ts_tv', 'sample'])
      long = d.select(['sample', grp, 'ts_tv', 'het_hom_ratio']).unpivot(index=['sample', grp], variable_name='metric', value_name='value').with_columns(pl.col('metric').replace(names))
      fig = px.bar(long.to_pandas(), x='value', y='sample', color=grp, color_discrete_map=colors, facet_col='metric', orientation='h', custom_data=['sample', grp], category_orders={'sample': d.get_column('sample').to_list(), 'metric': list(names.values())}, labels={grp: '', 'value': '', 'sample': ''})
      fig.update_traces(hovertemplate='<b>%{customdata[0]}</b><br>%{x:.2f}<extra></extra>')
      fig.update_xaxes(matches=None, showticklabels=True)
      fig.update_yaxes(automargin=True)
      fig.for_each_annotation(lambda a: a.update(text=a.text.split('=')[-1]))
      for i, band in enumerate(bands):
          fig.add_vrect(x0=band[0], x1=band[1], fillcolor='rgba(47,158,68,0.15)', line_width=0, layer='below', col=i + 1)
      fig.update_layout(margin=dict(t=30), legend_title_text='', legend=dict(orientation='h', y=-0.15))
    selection_enabled: true
    selection_column: sample
    section: Callset quality
    tag: rv-cs-fig-quality
    index: cs-quality-bars
    title: Ts/Tv and het/hom ratio per sample
    description: One bar per sample, the lowest Ts/Tv on top, with a working range shaded in green on each panel. Ts/Tv 2.5 to 3 is where exonic callsets sit, since random errors fall evenly on transitions and transversions and pull the ratio down; het/hom 1.5 to 2 is the range outbred exomes report. A bar outside a band points at a different error profile or genotype mix, and a het/hom ratio below it is often allele-specific expression, which RNA shows and DNA does not, rather than a call error.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: figure
    workflow_tag: rnavar
    data_collection_tag: samples
    visu_type: bar
    mode: code
    code_content: |-
      # PASS SNVs and indels per sample, the samples of one group side by side.
      grp = depictio_group_by[0] if depictio_group_by else '{GROUP_COL}'
      d = df.sort([c for c in (grp, 'sample') if c in df.columns])
      colors = depictio_category_colors.get('variant_type') or {}
      x = [d.get_column(grp).to_list(), d.get_column('sample').to_list()] if grp in d.columns else d.get_column('sample').to_list()
      bars = []
      for label, col in (('SNP', 'snvs'), ('INDEL', 'indels')):
          bars.append(go.Bar(x=x, y=d.get_column(col).to_list(), name=label, marker_color=colors.get(label)))
      fig = go.Figure(data=bars)
      fig.update_layout(barmode='stack', margin=dict(t=10), legend_title_text='', yaxis_title='PASS calls', legend=dict(orientation='h', y=-0.35))
      fig.update_yaxes(automargin=True)
    section: Calls per sample
    tag: rv-cs-fig-types
    index: cs-calls-by-type
    title: PASS calls per sample, by variant type
    description: Stacked SNVs and indels of each sample; the samples of one group sit together on the axis.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: rnavar
    data_collection_tag: sample_concordance
    viz_kind: complex_heatmap
    config:
      viz_kind: complex_heatmap
      index_column: sample
      col_annotation_cols: ['{GROUP_COL}']
      annotation_source_dc_tag: samples
      cluster_rows: true
      cluster_cols: true
      cluster_method: average
      colorscale: Blues
      # A square matrix of eight or so samples: rows 40 px tall, not the 12 px default
      # that suits a long list, or the tile asks for a strip.
      min_cell_px: 40
    section: Agreement between samples
    tag: rv-cs-av-concordance
    index: cs-concordance
    title: Genotype concordance between samples
    description: Calls both samples make with the same genotype, over the calls either makes (percent), clustered. A replicate that leaves its group is a swap or a shallow library.
    layout: {x: 0, y: 0, w: 8, h: 9}
  - component_type: figure
    workflow_tag: rnavar
    data_collection_tag: vcf_substitution_spectrum
    use: vcf/spectrum_bars
    visu_type: bar
    mode: code
    code_content: |-
      # Each sample's PASS SNVs over the six folded classes, in percent; T to C carries the A-to-I editing signal.
      order = ['C to T', 'T to C', 'C to A', 'C to G', 'T to A', 'T to G']
      colors = depictio_category_colors.get('substitution_class') or {}
      d = df.with_columns((pl.col('fraction') * 100).alias('share')).sort('sample')
      samples = d.get_column('sample').unique(maintain_order=True).to_list()
      bars = []
      for cls in order:
          m = d.filter(pl.col('substitution_class') == cls)
          bars.append(go.Bar(x=m.get_column('sample').to_list(), y=m.get_column('share').to_list(), name=cls, marker_color=colors.get(cls)))
      fig = go.Figure(data=bars)
      fig.update_layout(barmode='stack', margin=dict(t=10), legend_title_text='', yaxis_title='Share of the PASS SNVs (%)', legend=dict(orientation='h', y=-0.35))
      fig.update_xaxes(categoryorder='array', categoryarray=samples)
      fig.update_yaxes(automargin=True)
    section: Substitution spectrum
    tag: rv-cs-fig-spectrum
    index: cs-spectrum
    title: Substitution spectrum per sample
    description: The six pyrimidine-folded classes as shares of each sample's PASS SNVs; T to C carries the editing signal.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: figure
    workflow_tag: rnavar
    data_collection_tag: vcf_allele_fractions
    visu_type: bar
    mode: code
    code_content: |-
      # Each sample's PASS calls over the allele fraction, as the share of its calls in each 0.05 bin (calls read fewer than 10 times are left out); the green band is where a heterozygous germline call sits (0.3 to 0.7: an even split gives 0.5 and read sampling spreads it), the blue one where a homozygous-alternate call sits (0.9 to 1); both are working edges of this template.
      grp = depictio_group_by[0] if depictio_group_by else '{GROUP_COL}'
      colors = depictio_group_kwargs.get('color_discrete_map') or depictio_category_colors.get('{GROUP_COL}') or {}
      d = df if grp in df.columns else df.with_columns(pl.lit('All samples').alias(grp))
      d = d.group_by(['sample', grp, 'vaf']).agg(pl.col('calls').sum())
      d = d.with_columns((pl.col('calls') * 100 / pl.col('calls').sum().over('sample')).alias('share')).sort([grp, 'sample', 'vaf'])
      order = d.get_column('sample').unique(maintain_order=True).to_list()
      fig = px.bar(d.to_pandas(), x='vaf', y='share', color=grp, color_discrete_map=colors, facet_col='sample', facet_col_wrap=4, custom_data=['sample', 'calls'], category_orders={'sample': order}, labels={grp: '', 'vaf': '', 'share': ''})
      fig.update_traces(hovertemplate='<b>%{customdata[0]}</b><br>allele fraction %{x:.2f}<br>%{y:.1f}% of its calls (%{customdata[1]:,})<extra></extra>')
      fig.update_xaxes(range=[0, 1], tickvals=[0, 0.5, 1], title_text='')
      top = d.get_column('share').max() * 1.1
      fig.update_yaxes(title_text='', automargin=True, range=[0, top])
      fig.for_each_annotation(lambda a: a.update(text=a.text.split('=')[-1]))
      fig.add_shape(type='rect', x0=0.3, x1=0.7, y0=0, y1=top, fillcolor='rgba(47,158,68,0.15)', line_width=0, layer='below', row='all', col='all')
      fig.add_shape(type='rect', x0=0.9, x1=1, y0=0, y1=top, fillcolor='rgba(28,126,214,0.15)', line_width=0, layer='below', row='all', col='all')
      fig.add_annotation(text='Allele fraction', xref='paper', yref='paper', x=0.5, y=-0.1, showarrow=False)
      fig.add_annotation(text="Share of the sample's calls (%)", xref='paper', yref='paper', x=-0.05, y=0.5, showarrow=False, textangle=-90)
      fig.update_layout(margin=dict(t=30, l=50, b=50), bargap=0.05, legend_title_text='', legend=dict(orientation='h', y=-0.2))
    section: Allele fraction
    tag: rv-cs-fig-vaf
    index: cs-vaf-distribution
    title: Allele fraction per sample
    description: Share of each sample's PASS calls in each 0.05 bin of allele fraction; only calls read at least 10 times count, below which one read moves the fraction by 0.1, and the depth and variant type filters on the left narrow it. A germline sample peaks in the green band, 0.3 to 0.7 around the 0.5 of a heterozygous call, and in the blue one, 0.9 to 1, of a homozygous-alternate call. A heterozygous peak off 0.5, or a broad shoulder of low fractions, flags contamination, allelic imbalance (in RNA, allele-specific expression) or artefacts.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: rnavar
    data_collection_tag: vcf_callset_summary
    use: vcf/callset_summary
    columns: [sample, calls, pass_calls, pass_pct, snvs, indels, multiallelic, ts_tv, het, hom_alt, het_hom_ratio, median_qual, median_dp, median_het_vaf]
    row_selection_enabled: true
    row_selection_column: sample
    section: Callset tables
    tag: rv-cs-table-summary
    index: cs-table-summary
    title: Callset summary per sample
    description: Calls, PASS share, SNVs, indels, Ts/Tv, zygosity and the median quality, depth and allele fraction.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: rnavar
    data_collection_tag: vcf_filter_breakdown
    use: vcf/filter_breakdown
    columns: [sample, filter_label, failed_filters, calls, calls_pct, snvs, indels]
    row_selection_enabled: true
    row_selection_column: filter_label
    section: Callset tables
    tag: rv-cs-table-filters
    index: cs-table-filters
    title: FILTER breakdown per sample
    description: Each FILTER value with its calls, their share of the sample's callset and the SNVs and indels among them.
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: table
    workflow_tag: rnavar
    data_collection_tag: replicate_sharing
    columns: ['{GROUP_COL}', samples, sites, shared_sites, shared_pct]
    row_selection_enabled: true
    row_selection_column: '{GROUP_COL}'
    section: Callset tables
    tag: rv-cs-table-sharing
    index: cs-table-sharing
    title: Replicate agreement per group
    description: PASS sites called in any sample of a group, those called in every one, and the share.
    layout: {x: 0, y: 12, w: 8, h: 6}
# Every component below reads a snpeff_* collection, all optional: a run
# without --tools snpeff has none of them, and the import drops the tab.
- title: Annotation
  subtitle: What do the calls change in the genes they hit?
  tab_group: Variants
  tab_order: 5
  tab_icon: mdi:tag-outline
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Annotation scope
    icon: mdi:filter-variant
    color: grape
    description: These picks narrow the annotated calls and the gene table; snpEff's own impact and consequence totals cannot be split
  grid_sections:
  - name: Annotation at a glance
    icon: mdi:counter
    color: grape
    description: Annotated calls, genes hit, HIGH impact calls and coding allele fractions
  - name: Impact per sample
    icon: mdi:chart-bar
    color: grape
    description: snpEff impact classes as shares of each sample's effects
  - name: Consequences
    icon: mdi:chart-box-outline
    color: grape
    description: The commonest consequence terms over the samples in scope
  - name: Gene tables
    icon: mdi:table
    color: gray
    description: Variants per gene by impact class, and the annotated calls behind them
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [snpEff](https://pcingola.github.io/SnpEff/) predicts what each call does to the transcripts
      it overlaps and keeps the most severe effect: HIGH (a lost stop or a frameshift), MODERATE (a
      missense change), LOW (a synonymous change) or MODIFIER (non-coding). This tab needs a run
      started with `--tools snpeff`. Pick a gene in the table to open its calls.
    tag: rv-ann-intro
    index: ann-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: snpeff_ann_variants
    interactive_component_type: MultiSelect
    column_name: impact
    column_type: object
    display:
      icon_name: mdi:alert-outline
      custom_color: grape
    section: Annotation scope
    group: Annotation
    tag: rv-ann-filter-impact
    index: ann-impact-filter
    title: Impact
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: snpeff_genes
    interactive_component_type: MultiSelect
    column_name: biotype
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: pink
    section: Annotation scope
    group: Annotation
    tag: rv-ann-filter-biotype
    index: ann-biotype-filter
    title: Gene biotype
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: snpeff_ann_variants
    use: snpeff/impact_composition
    aggregation: count
    column_name: variant_key
    column_type: object
    secondary_layout: donut
    breakdown_col: impact
    display:
      icon_name: mdi:tag-outline
      icon_color: grape.4
      caption: annotated calls, by impact
      format: si
    section: Annotation at a glance
    tag: rv-ann-card-calls
    index: ann-card-calls
    title: Annotated calls
    description: Calls snpEff annotated, one per sample carrying them. The ring splits them by impact class.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: snpeff_genes
    aggregation: nunique
    column_name: gene_name
    column_type: object
    secondary_layout: top_n
    breakdown_col: biotype
    top_n_count: 3
    display:
      icon_name: mdi:dna
      icon_color: grape.6
      caption: genes, by the biotype snpEff assigned
      format: si
    section: Annotation at a glance
    tag: rv-ann-card-genes
    index: ann-card-genes
    title: Genes hit
    description: Distinct genes with at least one annotated call, ranked by biotype.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: snpeff_ann_variants
    aggregation: count
    column_name: variant_key
    column_type: object
    secondary_layout: composition
    breakdown_col: variant_type
    filter_expr: "col('impact') == 'HIGH'"
    display:
      icon_name: mdi:alert-outline
      icon_color: grape.8
      caption: HIGH impact calls, by variant type
      format: si
    section: Annotation at a glance
    tag: rv-ann-card-high
    index: ann-card-high
    title: HIGH impact calls
    description: Calls snpEff classes HIGH, a lost or gained stop, a frameshift or a splice-site change.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: snpeff_ann_variants
    aggregation: median
    column_name: vaf
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    filter_expr: "col('impact').is_in(['HIGH', 'MODERATE'])"
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: grape.9
      caption: median per coding call, with the spread
      decimals: 2
    section: Annotation at a glance
    tag: rv-ann-card-vaf
    index: ann-card-vaf
    title: Coding allele fraction
    description: Allele fraction of the HIGH and MODERATE calls. Allele-specific expression spreads it away from 0.5.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: rnavar
    data_collection_tag: snpeff_csv_stats
    viz_kind: stacked_taxonomy
    config:
      viz_kind: stacked_taxonomy
      sample_id_col: sample
      taxon_col: category
      rank_col: section
      default_rank: impact
      abundance_col: count
      normalise_to_one: true
      orientation: h
      sample_sort: name
      y_zoom: auto
      top_n: 10
      value_title: Share of the effects
      hidden_controls: [top_n]
    section: Impact per sample
    tag: rv-ann-fig-impact
    index: ann-impact-bars
    title: Impact classes per sample
    description: HIGH, MODERATE, LOW and MODIFIER effects as shares of each sample's effects; the level switch shows snpEff's other breakdowns (effect, functional class, region). MODIFIER fills most of every bar, so the axis starts near its smallest share (the // marks the cut).
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: figure
    workflow_tag: rnavar
    data_collection_tag: snpeff_csv_stats
    use: snpeff/composition_bars
    visu_type: bar
    mode: code
    code_content: |-
      # The twelve commonest consequence terms over the samples in view, coloured by the impact class snpEff gives the term (the Sequence Ontology term's class: loss of function HIGH, protein-changing MODERATE, silent or near-silent LOW, the rest MODIFIER).
      high = ['transcript_ablation', 'splice_acceptor_variant', 'splice_donor_variant', 'stop_gained', 'frameshift_variant', 'stop_lost', 'start_lost', 'exon_loss_variant', 'gene_fusion', 'rare_amino_acid_variant', 'transcript_amplification', 'feature_ablation']
      moderate = ['missense_variant', 'inframe_insertion', 'inframe_deletion', 'disruptive_inframe_insertion', 'disruptive_inframe_deletion', 'conservative_inframe_insertion', 'conservative_inframe_deletion', 'protein_altering_variant', '5_prime_UTR_truncation', '3_prime_UTR_truncation', 'coding_sequence_variant', 'initiator_codon_variant', 'non_canonical_start_codon']
      low = ['synonymous_variant', 'stop_retained_variant', 'start_retained_variant', 'splice_region_variant', '5_prime_UTR_premature_start_codon_gain_variant', 'splice_donor_5th_base_variant', 'splice_donor_region_variant', 'splice_polypyrimidine_tract_variant']
      impact_of = {**{t: 'HIGH' for t in high}, **{t: 'MODERATE' for t in moderate}, **{t: 'LOW' for t in low}}
      d = df.filter(pl.col('section') == 'effect').group_by('category').agg(pl.col('count').sum()).sort('count', descending=True).head(12)
      d = d.with_columns(pl.col('category').str.split('&').list.first().replace_strict(impact_of, default='MODIFIER').alias('impact'), pl.col('category').str.replace_all('_', ' '))
      colors = depictio_category_colors.get('impact') or {}
      fig = px.bar(d.to_pandas(), x='count', y='category', color='impact', color_discrete_map=colors, category_orders={'impact': ['HIGH', 'MODERATE', 'LOW', 'MODIFIER']}, orientation='h', labels={'count': 'Effects', 'category': '', 'impact': ''})
      fig.update_layout(margin=dict(t=10), yaxis={'categoryorder': 'total ascending'}, legend=dict(orientation='h', y=-0.15, title_text=''))
      fig.update_yaxes(automargin=True)
    section: Consequences
    tag: rv-ann-fig-effects
    index: ann-consequences
    title: Commonest consequence terms
    description: The twelve consequence terms snpEff assigned most often, summed over the samples and coloured by the impact class snpEff gives each term. Most are MODIFIER (intron, UTR, up- and downstream); the few HIGH and MODERATE terms are the ones that change a protein.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: rnavar
    data_collection_tag: snpeff_genes
    use: snpeff/genes
    columns: [sample, gene_name, biotype, n_high, n_moderate, n_low, n_modifier, n_variants, n_coding]
    row_selection_enabled: true
    row_selection_column: gene_name
    section: Gene tables
    tag: rv-ann-table-genes
    index: ann-table-genes
    title: Variants per gene and impact class
    description: One row per gene and sample with its HIGH, MODERATE, LOW and MODIFIER counts.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: rnavar
    data_collection_tag: snpeff_ann_variants
    use: snpeff/ann_variants
    columns: [sample, chrom, pos, ref, alt, gene, impact, consequence, hgvs_p, gt, dp, vaf, filter_status]
    row_selection_enabled: true
    row_selection_column: variant_key
    section: Gene tables
    tag: rv-ann-table-calls
    index: ann-table-calls
    title: Annotated calls
    description: Locus, alleles, gene, impact, consequence and protein change of each call, with its genotype and depth.
    layout: {x: 0, y: 6, w: 8, h: 6}
# How the tiles of this tab are connected. The navigator (a genome_view on
# variant_windows, one lane per design group) brushes a region; the region link
# in template.yaml carries it to the call table and the cards, and the genome
# browser follows the navigator's window (follow_window) without filtering it.
# The connection runs both ways: the browser's window comes back on the
# navigator as a dashed band, and a row clicked in the call table centres the
# browser on that call. The cards opt in to the region with follow_region_filter.
- title: Genome
  subtitle: Are PASS variants shared between replicates, and do the reads support them?
  tab_group: Variants
  tab_order: 6
  tab_icon: mdi:map-marker-outline
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Locus filters
    icon: mdi:filter-variant
    color: indigo
    description: Type and FILTER narrow the call table and cards; Sharing narrows the shared variants
  grid_sections:
  - name: Shared between replicates
    icon: mdi:set-merge
    color: indigo
    description: The PASS sites of each group and how many of its replicates call them
  - name: Region at a glance
    icon: mdi:counter
    color: indigo
    description: What the region in view holds, recounted on every brush or locus entry
  - name: Replicates and their reads
    icon: mdi:dna
    color: indigo
    description: Are PASS variants shared between a line's replicates, and do the reads support them?
    display: linked
  - name: Shared variants
    icon: mdi:table
    color: gray
    description: The shared PASS sites, best supported first. Click a row to centre the browser on the site.
    collapsed: true
  - name: Call detail
    icon: mdi:table
    color: gray
    description: The calls of the region in view. Click a row to centre the browser on the call.
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      A cell line sequenced twice should give the same variants twice. The browser opens on the
      best supported variant that every replicate of a line calls, with the replicates' calls above
      their alignments, so you can read whether the reads carry the call. The navigator draws one
      lane per group (distinct PASS variants per megabase): type a locus or a gene in its header,
      or brush its axis, and the browser follows.
    tag: rv-gen-intro
    index: gen-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: vcf_variants
    interactive_component_type: MultiSelect
    column_name: variant_type
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: indigo
    section: Locus filters
    group: Locus
    tag: rv-gen-filter-type
    index: gen-type-filter
    title: Variant type
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: vcf_variants
    interactive_component_type: MultiSelect
    column_name: filter_status
    column_type: object
    display:
      icon_name: mdi:filter-outline
      custom_color: teal
    section: Locus filters
    group: Locus
    tag: rv-gen-filter-status
    index: gen-status-filter
    title: FILTER value
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: rnavar
    data_collection_tag: shared_variants
    interactive_component_type: MultiSelect
    column_name: sharing
    column_type: object
    display:
      icon_name: mdi:set-merge
      custom_color: grape
    section: Locus filters
    group: Locus
    tag: rv-gen-filter-sharing
    index: gen-sharing-filter
    title: Sharing
    layout: {x: 0, y: 6, w: 1, h: 3}
  # The question of the tab, counted on the shared sites: PASS sites of each
  # group, by how many replicates call them. The cards do not follow the
  # navigator's region (the shared table is not linked to it).
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: shared_variants
    aggregation: count
    column_name: variant_key
    column_type: object
    secondary_layout: composition
    breakdown_col: sharing
    display:
      icon_name: mdi:set-merge
      icon_color: indigo.4
      caption: PASS sites, by replicates calling them
      format: si
    section: Shared between replicates
    tag: rv-gen-card-sites
    index: gen-card-sites
    title: PASS sites
    description: PASS sites of every group in view, a site counted once per group; the bar splits them by how many of the group's replicates call it.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: shared_variants
    aggregation: count
    column_name: variant_key
    column_type: object
    filter_expr: col('sharing') == 'In every replicate'
    display:
      icon_name: mdi:check-all
      icon_color: indigo.6
      caption: called by every replicate of the group
      format: si
    section: Shared between replicates
    tag: rv-gen-card-every
    index: gen-card-every
    title: In every replicate
    description: PASS sites that every replicate of a group calls; a group of a single sample has none.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: shared_variants
    aggregation: median
    column_name: min_dp
    column_type: int64
    secondary_layout: threshold
    threshold_value: 10
    threshold_direction: min
    threshold_warn: 5
    display:
      icon_name: mdi:layers-outline
      icon_color: indigo.8
      caption: weakest call read 10 times or more, warn from 5
      decimals: 0
    section: Shared between replicates
    tag: rv-gen-card-mindp
    index: gen-card-mindp
    title: Depth of the weakest call
    description: Median, over the sites, of the read depth at the call in the replicate that read it least. Under 10 reads an allele fraction is too coarse to tell a heterozygous call from a homozygous one.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: shared_variants
    aggregation: median
    column_name: median_vaf
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-box-outline
      icon_color: indigo.9
      caption: median per site, with its spread
      decimals: 2
    section: Shared between replicates
    tag: rv-gen-card-sharedvaf
    index: gen-card-sharedvaf
    title: Allele fraction
    description: Median allele fraction of the calls at each site; a heterozygous site sits near 0.5 and a homozygous-alternate one near 1.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: vcf_variants
    aggregation: count
    column_name: variant_key
    column_type: object
    secondary_layout: composition
    breakdown_col: variant_type
    follow_region_filter: true
    display:
      icon_name: mdi:counter
      icon_color: indigo.4
      caption: calls in the region, by variant type
      format: si
    section: Region at a glance
    tag: rv-gen-card-calls
    index: gen-card-calls
    title: Calls
    description: Calls inside the region in view, one per sample carrying them.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: vcf_variants
    aggregation: nunique
    column_name: variant_key
    column_type: object
    secondary_layout: top_n
    breakdown_col: filter_status
    top_n_count: 4
    follow_region_filter: true
    display:
      icon_name: mdi:dna
      icon_color: indigo.6
      caption: distinct sites in the region, by FILTER value
      format: si
    section: Region at a glance
    tag: rv-gen-card-variants
    index: gen-card-variants
    title: Distinct variants
    description: Sites of the region in view (contig, position and alleles), each counted once however many samples carry it.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: vcf_variants
    aggregation: median
    column_name: vaf
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    follow_region_filter: true
    display:
      icon_name: mdi:chart-box-outline
      icon_color: indigo.8
      caption: median per call, with its spread
      decimals: 2
    section: Region at a glance
    tag: rv-gen-card-vaf
    index: gen-card-vaf
    title: Allele fraction
    description: Median allele fraction of the calls inside the region in view.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: rnavar
    data_collection_tag: vcf_variants
    aggregation: median
    column_name: dp
    column_type: int64
    secondary_layout: threshold
    threshold_value: 10
    threshold_direction: min
    threshold_warn: 5
    follow_region_filter: true
    display:
      icon_name: mdi:layers-outline
      icon_color: indigo.9
      caption: calls read 10 times or more, warn from 5
      decimals: 0
    section: Region at a glance
    tag: rv-gen-card-dp
    index: gen-card-dp
    title: Depth at the call
    description: Median read depth HaplotypeCaller reported at the calls inside the region. Under 10 reads an allele fraction is too coarse to tell a heterozygous call from a homozygous one.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: rnavar
    data_collection_tag: variant_windows
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      chr_col: chrom
      pos_col: pos
      end_col: end
      score_col: variants
      sample_col: '{GROUP_COL}'
      category_col: '{GROUP_COL}'
      facet_by_sample: true
      max_facets: 8
      # Bars, the coverage-profile look: a window's height reads at once in a lane.
      mark: bar
      # No lane_height: the lanes fit the tile (a fixed 26 px lane read as a sliver).
      assembly: '{GENOME}'
      score_title: PASS variants
      opacity: 0.8
      # No default_region: `first` filters the whole first contig on load, the browser
      # follows it and every track shows "Force load". The browser opens on its locus_from.
      region_filter_enabled: true
    section: Replicates and their reads
    tag: rv-gen-av-navigator
    index: gen-navigator
    title: Variant navigator, 1 Mb windows
    description: Distinct PASS variants per megabase window, one lane per group. A locus or gene in the header, or a brush, moves the browser below, whose window comes back as a band.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: jbrowse
    workflow_tag: rnavar
    data_collection_tag: tracks
    section: Replicates and their reads
    # The replicates' VCFs of the group that holds the best shared variant, then
    # their alignments (the order of tracks.py); the other groups' VCFs follow in
    # the track menu. Four tracks suit two replicates; a third replicate's
    # alignment is one click away in the menu.
    initial_tracks: 4
    max_tracks: 16
    show_overview: false
    # Sashimi arcs over the coverage of the BAMs.
    show_junctions: true
    # The samples of a group share a hue, as in the navigator's lanes.
    color_by: '{GROUP_COL}'
    # Common dbSNP sites and ClinVar under the calls, from UCSC.
    ucsc_tracks: [dbSnp155Common, clinvarMain]
    # Follows the navigator's window, and publishes its own back to it.
    follow_window: true
    selection_enabled: true
    selection_column: sample
    # The shared PASS sites of every group, best first: sites every replicate
    # calls, then some, then one; deeper weakest call first inside a tier. The
    # browser opens on the first, the stepper walks the next ones, and a row
    # picked in the shared-variant table frames its site.
    locus_from:
      - data_collection_tag: shared_variants
        name: Shared variants
        color: indigo
        chrom_column: chrom
        start_column: pos
        end_column: end
        padding: 150
        max_rows: 20
        sort_by: support_score
        descending: true
        label_column: variant_key
        columns: [sharing, min_dp, median_vaf]
    variant_color_by:
      column: filter_status
    tag: rv-gen-browser
    index: gen-browser
    title: Genome browser
    description: The calls (coloured by FILTER) of the replicates of one line above their alignments, opening on the best supported shared variant; the stepper walks the next ones and the other lines are in the track menu.
    layout: {x: 0, y: 4, w: 8, h: 9}
  # One row per group and PASS site, best supported first: pick one to frame it
  # in the browser above. The group column is the cell line, so a site shared by
  # two lines is two rows.
  - component_type: table
    workflow_tag: rnavar
    data_collection_tag: shared_variants
    columns: ['{GROUP_COL}', chrom, pos, ref, alt, variant_type, sharing, n_calling, samples, min_dp, median_vaf, best_qual]
    row_selection_enabled: true
    row_selection_column: variant_key
    section: Shared variants
    tag: rv-gen-table-shared
    index: gen-table-shared
    title: Shared PASS variants
    description: One row per group and PASS site with how many replicates call it and how deeply the weakest call was read; a click centres the browser.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: rnavar
    data_collection_tag: vcf_variants
    columns: [sample, chrom, pos, ref, alt, variant_type, qual, filter_status, gt, dp, vaf]
    row_selection_enabled: true
    row_selection_column: variant_key
    section: Call detail
    tag: rv-gen-table-calls
    index: gen-table-calls
    title: Calls in the region
    description: One row per call of the region in view, with its genotype, depth and allele fraction; a click centres the browser.
    layout: {x: 0, y: 0, w: 8, h: 6}
