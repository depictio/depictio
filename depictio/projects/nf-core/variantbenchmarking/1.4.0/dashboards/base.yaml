    title_size: h3
    layout: {x: 4, y: 4, w: 4, h: 6}

  # ------------------------------------------------------------- CNV strata
  - component_type: text
    tag: text-cnv-intro
    section: Wittyer, per event and per base
    title: Wittyer scores each callset twice
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [Wittyer](https://github.com/Illumina/witty.er) scores each callset per
      event and per base. A caller that finds events but misplaces their
      breakpoints scores well per event and poorly per base.
    workflow_tag: variantbenchmarking
    data_collection_tag: cnv_wittyer_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
