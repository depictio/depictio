version: 1
# nf-core/variantbenchmarking 1.4.0 dashboard, to the family rules of
# depictio/projects/nf-core/RULES.md (ampliseq is the reference).
#
# A run benchmarks one variant type, so it writes one family of tables:
# germline small variants (rtg-tools vcfeval + hap.py), somatic SNVs or indels
# (som.py + rtg-tools vcfeval) or structural variants (Truvari, SVanalyzer,
# Wittyer). Every data collection is optional, and a tab whose collections are
# all absent is dropped at import. No MultiQC report and no sample sheet: no
# MultiQC tab, no Data & QC group, no persistent sample filters.
#
# Route blocks on the Overview: each route has its own Key figures cards,
# filter-bar filters and highlights, on slots of their own rather than shared
# ones. A single-route run drops the other blocks and the import re-packs the
# section, so it reads as one row of cards and two rows of highlights. A data
# root holding two routes (the AWS megatest has germline and somatic) keeps
# both blocks stacked instead of drawing them on top of each other.
main_dashboard:
  title: nf-core/variantbenchmarking
  subtitle: Which callset recovers its truth set best, on precision, recall and F1
  project_tag: Variant Benchmarking Analysis
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  category_colors:
    caller: auto
    variant_type:
      '*': auto
      SNP: '#1c7ed6'
      INDEL: '#7048e8'
    filter:
      ALL: '#868e96'
      PASS: '#2f9e44'
    stats_type:
      Event: '#1098ad'
      Base: '#f08c00'
    error_type:
      False positives: '#e03131'
      Missed calls: '#f08c00'
      True positives: '#2f9e44'
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  - name: Callsets
    icon: mdi:table
    color: gray
    collapsed: true
    description: The callsets of the run and their scores, one table per route.
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Callsets).
  # Key figures bar: caller, then callset, once per route.
  - component_type: interactive
    workflow_tag: variantbenchmarking
    data_collection_tag: germline_vcfeval_summary
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:tools
      custom_color: indigo
      strip_label: Caller
    section: Key figures
    tag: vb-ov-kf-caller-germline
    index: ov-kf-caller-germline
    title: Caller
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: variantbenchmarking
    data_collection_tag: germline_vcfeval_summary
    interactive_component_type: MultiSelect
    column_name: label
    column_type: object
    display:
      icon_name: mdi:flask
      custom_color: teal
      strip_label: Callset
    section: Key figures
    tag: vb-ov-kf-callset-germline
    index: ov-kf-callset-germline
    title: Callset
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: variantbenchmarking
    data_collection_tag: somatic_sompy_summary
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:tools
      custom_color: indigo
      strip_label: Caller
    section: Key figures
    tag: vb-ov-kf-caller-somatic
    index: ov-kf-caller-somatic
    title: Caller
    layout: {x: 0, y: 1, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: variantbenchmarking
    data_collection_tag: somatic_sompy_summary
    interactive_component_type: MultiSelect
    column_name: label
    column_type: object
    display:
      icon_name: mdi:flask
      custom_color: teal
      strip_label: Callset
    section: Key figures
    tag: vb-ov-kf-callset-somatic
    index: ov-kf-callset-somatic
    title: Callset
    layout: {x: 2, y: 1, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:tools
      custom_color: indigo
      strip_label: Caller
    section: Key figures
    tag: vb-ov-kf-caller-sv
    index: ov-kf-caller-sv
    title: Caller
    layout: {x: 0, y: 2, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    interactive_component_type: MultiSelect
    column_name: label
    column_type: object
    display:
      icon_name: mdi:flask
      custom_color: teal
      strip_label: Callset
    section: Key figures
    tag: vb-ov-kf-callset-sv
    index: ov-kf-callset-sv
    title: Callset
    layout: {x: 2, y: 2, w: 2, h: 1}
  - component_type: text
    title: nf-core/variantbenchmarking
    logo: https://raw.githubusercontent.com/nf-core/variantbenchmarking/master/docs/images/nf-core-variantbenchmarking_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/variantbenchmarking/master/docs/images/nf-core-variantbenchmarking_logo_dark.png
    order: 1
    body: >
      Variant callers scored against a truth set: precision, recall and F1 for every callset,
      split by variant type, allele fraction or scoring level. [Run parameters](params:)
    tag: vb-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/variantbenchmarking compares the calls of one or more callers with a truth set and scores each callset on precision, recall and F1. A run benchmarks one variant type (germline small variants, somatic SNVs or indels, or structural variants), so only the tab of that type appears.

      A route can run several tools, so a result can be cross-checked: rtg-tools vcfeval beside hap.py or som.py, SVanalyzer and Wittyer beside Truvari. Each tab keeps its own filters in the left panel; a bar above a section narrows that section only.
    tag: vb-ov-about
    index: ov-about
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash. One callset line per route, each pruned with its data.
  - component_type: text
    surface: card
    values:
      n_germ: {dc: germline_vcfeval_summary, column: label, aggregation: nunique, format: integer}
      n_som: {dc: somatic_sompy_summary, column: label, aggregation: nunique, format: integer}
      n_sv: {dc: sv_truvari_summary, column: label, aggregation: nunique, format: integer}
    body: |
      ### The run
      - ![](icon:mdi:shape-outline) **Variants** {{param:analysis}} · {{param:variant_type}}
      - ![](icon:mdi:check-all) **Truth set** {{param:truth_id}}
      - ![](icon:mdi:tools) **Methods** {{param:method}}
      - ![](icon:mdi:map-marker-outline) **Genome** {{param:genome}}
      - ![](icon:mdi:flask) **Callsets** {{n_germ}} germline
      - ![](icon:mdi:flask) **Callsets** {{n_som}} somatic
      - ![](icon:mdi:flask) **Callsets** {{n_sv}} structural
    tag: vb-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  - component_type: text
    surface: card
    accent: indigo
    # Each route step cites a count from its route's collection, so the import
    # drops the steps of the routes the run did not take: four steps remain.
    values:
      n_germ: {dc: germline_vcfeval_summary, column: label, aggregation: nunique, format: integer}
      n_som: {dc: somatic_sompy_summary, column: label, aggregation: nunique, format: integer}
      n_wit: {dc: cnv_wittyer_summary, column: label, aggregation: nunique, format: integer}
    body: |
      ### One run, one variant type
      The calls are prepared once, scored against the truth set on the route of the run's variant type, then summarised per tool.

      ::: steps
      1. ![](icon:mdi:tune) **Prepare** Normalise and deduplicate the calls · [Settings](params:preprocess)
      2. ![](icon:mdi:check-all) **Truth** Scored against {{param:truth_id}} · [Settings](params:truth)
      3. ![](icon:mdi:dna) **Germline** {{n_germ}} callsets scored by hap.py and rtg-tools vcfeval · [Settings](params:method) · [Germline](tab:Germline)
      4. ![](icon:mdi:target) **Somatic** {{n_som}} callsets scored by som.py and rtg-tools vcfeval · [Settings](params:method) · [Somatic](tab:Somatic)
      5. ![](icon:mdi:chart-scatter-plot) **Structural** {{n_wit}} callsets scored by Truvari, SVanalyzer and Wittyer · [Settings](params:method) · [Structural](tab:Structural & CNV)
      6. ![](icon:mdi:table-multiple) **Summarise** One table and plot per tool, the callers side by side
      :::
    tag: vb-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  # Key figures: one row of four cards per route, each opening its route's tab.
  # ------------------------------------------------------------ germline row
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: germline_vcfeval_summary
    use: rtgtools/vcfeval_summary
    aggregation: sum
    column_name: tp_comp
    column_type: int64
    secondary_layout: composition
    breakdown_col: caller
    display:
      icon_name: mdi:check-decagram
      icon_color: blue
      caption: calls the truth set confirms, by caller
      link: tab:Germline
      decimals: 0
    section: Key figures
    tag: vb-ov-kf-germline-tp
    index: ov-kf-germline-tp
    title: True positives
    description: Calls the truth set confirms (rtg-tools vcfeval), summed over the callsets and split by caller.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: germline_vcfeval_summary
    use: rtgtools/vcfeval_summary
    aggregation: median
    column_name: f1
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:trophy
      icon_color: grape
      caption: median per callset, with its spread
      link: tab:Germline
      decimals: 3
    section: Key figures
    tag: vb-ov-kf-germline-f1
    index: ov-kf-germline-f1
    title: F1
    description: Median F1 of the germline callsets (rtg-tools vcfeval). The box shows how it spreads.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: germline_vcfeval_summary
    use: rtgtools/vcfeval_summary
    aggregation: median
    column_name: recall
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.9
    threshold_direction: min
    threshold_warn: 0.8
    display:
      icon_name: mdi:magnet
      icon_color: orange
      caption: median per callset, floor 0.9
      link: tab:Germline
      decimals: 3
    section: Key figures
    tag: vb-ov-kf-germline-recall
    index: ov-kf-germline-recall
    title: Recall
    description: Median share of the truth variants a germline callset recovers. It passes at 0.9 and warns below 0.8.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: germline_vcfeval_summary
    use: rtgtools/vcfeval_summary
    aggregation: median
    column_name: precision
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:bullseye-arrow
      icon_color: teal
      caption: median per callset, with its spread
      link: tab:Germline
      decimals: 3
    section: Key figures
    tag: vb-ov-kf-germline-precision
    index: ov-kf-germline-precision
    title: Precision
    description: Median share of a germline callset's calls that are in the truth set.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # ------------------------------------------------------------- somatic row
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: somatic_sompy_summary
    use: sompy/summary
    aggregation: sum
    column_name: tp
    column_type: int64
    secondary_layout: composition
    breakdown_col: caller
    display:
      icon_name: mdi:check-decagram
      icon_color: blue
      caption: calls the truth set confirms, by caller
      link: tab:Somatic
      decimals: 0
    section: Key figures
    tag: vb-ov-kf-somatic-tp
    index: ov-kf-somatic-tp
    title: True positives
    description: Calls the truth set confirms (som.py), summed over the callsets and split by caller.
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: somatic_sompy_summary
    use: sompy/summary
    aggregation: median
    column_name: f1
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:trophy
      icon_color: grape
      caption: median per callset, with its spread
      link: tab:Somatic
    section: Key figures
    tag: vb-ov-kf-somatic-f1
    index: ov-kf-somatic-f1
    title: F1
    description: Median F1 of the somatic callsets (som.py); a callset without calls has none and is left out. The box shows how it spreads.
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: somatic_sompy_summary
    use: sompy/summary
    aggregation: median
    column_name: recall
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:magnet
      icon_color: orange
      caption: median per callset, with its spread
      link: tab:Somatic
    section: Key figures
    tag: vb-ov-kf-somatic-recall
    index: ov-kf-somatic-recall
    title: Recall
    description: Median share of the truth variants a somatic callset recovers. It counts every truth variant, also those outside the regions the run called, so a partial run scores low by design.
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: somatic_sompy_summary
    use: sompy/summary
    aggregation: median
    column_name: precision
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.5
    threshold_direction: min
    threshold_warn: 0.25
    display:
      icon_name: mdi:bullseye-arrow
      icon_color: teal
      caption: median per callset, floor 0.5
      link: tab:Somatic
    section: Key figures
    tag: vb-ov-kf-somatic-precision
    index: ov-kf-somatic-precision
    title: Precision
    description: Median share of a somatic callset's calls that are in the truth set, over the callsets that made calls. It passes at 0.5 and warns below 0.25.
    layout: {x: 6, y: 2, w: 2, h: 2}
  # ---------------------------------------------------------- structural row
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    use: truvari/summary
    aggregation: sum
    column_name: tp_comp
    column_type: int64
    secondary_layout: composition
    breakdown_col: caller
    display:
      icon_name: mdi:check-decagram
      icon_color: blue
      caption: calls the truth set confirms, by caller
      link: tab:Structural & CNV
      decimals: 0
    section: Key figures
    tag: vb-ov-kf-sv-tp
    index: ov-kf-sv-tp
    title: True positives
    description: Calls the truth set confirms (Truvari), summed over the callsets and split by caller.
    layout: {x: 0, y: 4, w: 2, h: 2}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    use: truvari/summary
    aggregation: median
    column_name: f1
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:trophy
      icon_color: grape
      caption: median per callset, with its spread
      link: tab:Structural & CNV
      decimals: 3
    section: Key figures
    tag: vb-ov-kf-sv-f1
    index: ov-kf-sv-f1
    title: F1
    description: Median Truvari F1 of the structural-variant callsets; a callset without calls has none and is left out. The box shows how it spreads.
    layout: {x: 2, y: 4, w: 2, h: 2}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    use: truvari/summary
    aggregation: median
    column_name: recall
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.8
    threshold_direction: min
    threshold_warn: 0.6
    display:
      icon_name: mdi:magnet
      icon_color: orange
      caption: median per callset, floor 0.8
      link: tab:Structural & CNV
      decimals: 3
    section: Key figures
    tag: vb-ov-kf-sv-recall
    index: ov-kf-sv-recall
    title: Recall
    description: Median share of the truth structural variants a callset recovers. It passes at 0.8 and warns below 0.6.
    layout: {x: 4, y: 4, w: 2, h: 2}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    use: truvari/summary
    aggregation: median
    column_name: precision
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:bullseye-arrow
      icon_color: teal
      caption: median per callset, with its spread
      link: tab:Structural & CNV
      decimals: 3
    section: Key figures
    tag: vb-ov-kf-sv-precision
    index: ov-kf-sv-precision
    title: Precision
    description: Median share of a structural callset's calls that are in the truth set, over the callsets that made calls.
    layout: {x: 6, y: 4, w: 2, h: 2}
  # Findings bar: caller, then callset, once per route.
  - component_type: interactive
    workflow_tag: variantbenchmarking
    data_collection_tag: germline_vcfeval_summary
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:tools
      custom_color: indigo
      strip_label: Caller
    section: Findings
    tag: vb-ov-findings-caller-germline
    index: ov-fd-caller-germline
    title: Caller
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: variantbenchmarking
    data_collection_tag: germline_vcfeval_summary
    interactive_component_type: MultiSelect
    column_name: label
    column_type: object
    display:
      icon_name: mdi:flask
      custom_color: teal
      strip_label: Callset
    section: Findings
    tag: vb-ov-findings-callset-germline
    index: ov-fd-callset-germline
    title: Callset
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: variantbenchmarking
    data_collection_tag: somatic_sompy_summary
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:tools
      custom_color: indigo
      strip_label: Caller
    section: Findings
    tag: vb-ov-findings-caller-somatic
    index: ov-fd-caller-somatic
    title: Caller
    layout: {x: 4, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: variantbenchmarking
    data_collection_tag: somatic_sompy_summary
    interactive_component_type: MultiSelect
    column_name: label
    column_type: object
    display:
      icon_name: mdi:flask
      custom_color: teal
      strip_label: Callset
    section: Findings
    tag: vb-ov-findings-callset-somatic
    index: ov-fd-callset-somatic
    title: Callset
    layout: {x: 6, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:tools
      custom_color: indigo
      strip_label: Caller
    section: Findings
    tag: vb-ov-findings-caller-sv
    index: ov-fd-caller-sv
    title: Caller
    layout: {x: 0, y: 1, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    interactive_component_type: MultiSelect
    column_name: label
    column_type: object
    display:
      icon_name: mdi:flask
      custom_color: teal
      strip_label: Callset
    section: Findings
    tag: vb-ov-findings-callset-sv
    index: ov-fd-callset-sv
    title: Callset
    layout: {x: 2, y: 1, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # keeps only the rows of the run's route.
  - component_type: text
    surface: card
    values:
      g_best: {dc: germline_vcfeval_summary, column: f1, aggregation: max, format: 'decimals:3'}
      g_top: {dc: germline_vcfeval_summary, column: caller, aggregation: top, weight: f1}
      g_fp_share: {dc: germline_vcfeval_summary, column: caller, aggregation: top_share, weight: fp, format: percent}
      g_fp_top: {dc: germline_vcfeval_summary, column: caller, aggregation: top, weight: fp}
      h_snp: {dc: germline_happy_summary, column: f1, aggregation: max, filter_expr: "(col('variant_type') == 'SNP') & (col('filter') == 'PASS')",
        format: 'decimals:3'}
      h_indel: {dc: germline_happy_summary, column: f1, aggregation: max, filter_expr: "(col('variant_type') == 'INDEL') & (col('filter') == 'PASS')",
        format: 'decimals:3'}
      s_tp: {dc: somatic_sompy_summary, column: tp, aggregation: max, format: integer}
      s_truth: {dc: somatic_sompy_summary, column: tp_base, aggregation: max, format: integer}
      s_best: {dc: somatic_sompy_summary, column: f1, aggregation: max}
      s_top: {dc: somatic_sompy_summary, column: caller, aggregation: top, weight: f1}
      s_fp_share: {dc: somatic_sompy_summary, column: caller, aggregation: top_share, weight: fp, format: percent}
      s_fp_top: {dc: somatic_sompy_summary, column: caller, aggregation: top, weight: fp}
      r_best: {dc: somatic_vcfeval_summary, column: f1, aggregation: max}
      r_top: {dc: somatic_vcfeval_summary, column: caller, aggregation: top, weight: f1}
      t_best: {dc: sv_truvari_summary, column: f1, aggregation: max, format: 'decimals:3'}
      t_top: {dc: sv_truvari_summary, column: caller, aggregation: top, weight: f1}
      v_best: {dc: sv_svbenchmark_summary, column: f1, aggregation: max, format: 'decimals:3'}
      v_top: {dc: sv_svbenchmark_summary, column: caller, aggregation: top, weight: f1}
      w_event: {dc: cnv_wittyer_summary, column: f1, aggregation: median, filter_expr: "col('stats_type') == 'Event'",
        format: 'decimals:3'}
      w_base: {dc: cnv_wittyer_summary, column: f1, aggregation: median, filter_expr: "col('stats_type') == 'Base'",
        format: 'decimals:3'}
    body: |
      - **{{g_best}}** best germline F1, from {{g_top}} – rtg-tools vcfeval, one value per callset [Germline](tab:Germline)
      - **{{h_snp}}** SNP F1 of the PASS calls, {{h_indel}} for indels – hap.py, pooled over samples [Germline](tab:Germline)
      - **{{g_fp_share}}** of the false positives come from {{g_fp_top}} – rtg-tools vcfeval, summed per caller [Germline](tab:Germline)
      - **{{s_tp}}** of {{s_truth}} truth variants found, the most of any callset – som.py true positives [Somatic](tab:Somatic)
      - **{{s_best}}** best somatic F1, from {{s_top}} – som.py, one value per callset [Somatic](tab:Somatic)
      - **{{s_fp_share}}** of the false positives come from {{s_fp_top}} – som.py, summed per caller [Somatic](tab:Somatic)
      - **{{r_best}}** best F1 on haplotypes, from {{r_top}} – rtg-tools vcfeval over all variants, the cross-check [Somatic](tab:Somatic)
      - **{{t_best}}** best structural F1, from {{t_top}} – Truvari, one value per callset [Structural](tab:Structural & CNV)
      - **{{v_best}}** best SVanalyzer F1, from {{v_top}} – the cross-check of Truvari [Structural](tab:Structural & CNV)
      - **{{w_event}}** median F1 per event, {{w_base}} per base – Wittyer, over the callsets [Structural](tab:Structural & CNV)
    section: Findings
    tag: vb-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Four highlights per route, in two rows that each fill the width. A route
  # the run did not take drops its four and the import re-packs the rest.
  # ------------------------------------------------------------- germline
  - component_type: highlight
    section: Findings
    source_tab: Germline
    source_component: gl-pr-scatter
    caption: One point per callset, coloured by caller; top right is best, the curves are F1 contours.
    tag: vb-ov-hl-germline-pr
    index: ov-hl-germline-pr
    layout: {x: 0, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Germline
    source_component: gl-happy-f1
    caption: hap.py F1 of the PASS calls for SNPs and indels; the ALL calls join them where hard-filtered calls change the score.
    tag: vb-ov-hl-germline-happy
    index: ov-hl-germline-happy
    layout: {x: 4, y: 2, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Germline
    source_component: gl-happy-roc
    caption: Precision against recall at each quality cut-off the run swept (SNP, PASS); few cut-offs give few points.
    tag: vb-ov-hl-germline-roc
    index: ov-hl-germline-roc
    layout: {x: 0, y: 6, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Germline
    source_component: gl-errors
    caption: False positives and missed calls per callset, stacked; the longest bar errs most.
    tag: vb-ov-hl-germline-errors
    index: ov-hl-germline-errors
    layout: {x: 4, y: 6, w: 4, h: 4}
  # -------------------------------------------------------------- somatic
  - component_type: highlight
    section: Findings
    source_tab: Somatic
    source_component: so-pr-scatter
    caption: One point per callset, coloured by caller; top right is best, the curves are F1 contours.
    tag: vb-ov-hl-somatic-pr
    index: ov-hl-somatic-pr
    layout: {x: 0, y: 10, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Somatic
    source_component: so-recall-ci
    caption: Recall per caller with its binomial 95% interval; overlapping whiskers cannot be told apart.
    tag: vb-ov-hl-somatic-ci
    index: ov-hl-somatic-ci
    layout: {x: 4, y: 10, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Somatic
    source_component: so-errors
    caption: False positives and missed calls per caller and variant type; an over-calling caller fills the red bar.
    tag: vb-ov-hl-somatic-errors
    index: ov-hl-somatic-errors
    layout: {x: 0, y: 14, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Somatic
    source_component: so-precision-ci
    caption: Precision per caller with its binomial 95% interval; a wide whisker rests on few calls.
    tag: vb-ov-hl-somatic-precision
    index: ov-hl-somatic-precision
    layout: {x: 4, y: 14, w: 4, h: 4}
  # ----------------------------------------------------------- structural
  - component_type: highlight
    section: Findings
    source_tab: Structural & CNV
    source_component: sv-truvari-pr
    caption: One point per callset, coloured by caller; top right is best, the curves are F1 contours.
    tag: vb-ov-hl-sv-pr
    index: ov-hl-sv-pr
    layout: {x: 0, y: 18, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Structural & CNV
    source_component: sv-svbench-f1
    hide_legend: true
    caption: SVanalyzer F1 per callset, the bar coloured by its caller.
    tag: vb-ov-hl-sv-svbench
    index: ov-hl-sv-svbench
    layout: {x: 4, y: 18, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Structural & CNV
    source_component: sv-truvari-errors
    caption: Truvari false positives and missed calls per callset, stacked; the longest bar errs most.
    tag: vb-ov-hl-sv-errors
    index: ov-hl-sv-errors
    layout: {x: 0, y: 22, w: 4, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Structural & CNV
    source_component: sv-wittyer-f1
    caption: Wittyer F1 per callset, scored per event and per base; a gap means misplaced breakpoints.
    tag: vb-ov-hl-sv-wittyer
    index: ov-hl-sv-wittyer
    layout: {x: 4, y: 22, w: 4, h: 4}
  # Link-only tab tiles: a tab the run does not have is left out, and a
  # heading whose tabs are all missing is hidden.
  - component_type: text
    body: |
      ### Small variants
      - [Germline](tab:Germline)
      - [Somatic](tab:Somatic)

      ### Structural
      - [Structural & CNV](tab:Structural & CNV)
    section: How to read this dashboard
    tag: vb-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # The run has no sample sheet: its callsets are the samples. One table per
  # route, each dropped with its data collection when the run did not take it.
  - component_type: table
    workflow_tag: variantbenchmarking
    data_collection_tag: germline_vcfeval_summary
    use: rtgtools/vcfeval_summary
    row_selection_enabled: false
    section: Callsets
    tag: vb-ov-table-germline
    index: ov-table-germline
    title: Germline callsets
    description: Each callset with its caller, truth set and rtg-tools vcfeval score.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: variantbenchmarking
    data_collection_tag: somatic_sompy_summary
    use: sompy/summary
    row_selection_enabled: false
    section: Callsets
    tag: vb-ov-table-somatic
    index: ov-table-somatic
    title: Somatic callsets
    description: Each callset with its caller, truth set and som.py score.
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: table
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    use: truvari/summary
    row_selection_enabled: false
    section: Callsets
    tag: vb-ov-table-sv
    index: ov-table-sv
    title: Structural callsets
    description: Each callset with its caller, truth set and Truvari score.
    layout: {x: 0, y: 12, w: 8, h: 6}
tabs:
# ============================================================================
# Small variants
# ============================================================================
- title: Germline
  subtitle: How well does each germline callset recover the truth set?
  tab_group: Small variants
  tab_order: 1
  tab_icon: mdi:dna
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Germline filters
    icon: mdi:filter-variant
    color: indigo
    description: The callers and callsets in view, and the hap.py variant type and calls
  grid_sections:
  - name: Germline at a glance
    icon: mdi:counter
    color: indigo
    description: F1, recall and the errors over the germline callsets in view
  - name: Precision and recall
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Each callset on the precision-recall plane, beside its false positives and misses
  - name: hap.py by variant type
    icon: mdi:chart-bar
    color: indigo
    description: SNP and indel F1, and precision against recall over the quality cut-off
  - name: Errors on the genome
    icon: mdi:dna
    color: indigo
    description: Where the picked callsets' false positives and missed calls sit, with the known variants
  - name: Germline tables
    icon: mdi:table
    color: gray
    description: The vcfeval, hap.py and quality-sweep rows behind every tile
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [rtg-tools vcfeval](https://github.com/RealTimeGenomics/rtg-tools) matches each
      callset's haplotypes to the truth set, and [hap.py](https://github.com/Illumina/hap.py)
      scores SNPs and indels apart, for all calls and PASS calls. Top right on the
      precision-recall plane is best; the bars beside it count each callset's false positives
      and missed calls. A callset's caller is the name its samplesheet row gives it: a tool, or
      a version of the calls being compared.
    tag: vb-gl-intro
    index: gl-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: variantbenchmarking
    data_collection_tag: germline_vcfeval_summary
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:tools
      custom_color: indigo
    section: Germline filters
    tag: vb-gl-filter-caller
    index: gl-caller-filter
    title: Caller
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: variantbenchmarking
    data_collection_tag: germline_vcfeval_summary
    interactive_component_type: MultiSelect
    column_name: label
    column_type: object
    display:
      icon_name: mdi:flask
      custom_color: teal
    section: Germline filters
    tag: vb-gl-filter-callset
    index: gl-callset-filter
    title: Callset
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: variantbenchmarking
    data_collection_tag: germline_happy_summary
    interactive_component_type: MultiSelect
    column_name: variant_type
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: green
    section: Germline filters
    tag: vb-gl-filter-happy-type
    index: gl-happy-type-filter
    title: hap.py variant type
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: variantbenchmarking
    data_collection_tag: germline_happy_summary
    interactive_component_type: SegmentedControl
    column_name: filter
    column_type: object
    display:
      icon_name: mdi:filter-variant
      custom_color: lime
    section: Germline filters
    tag: vb-gl-filter-happy-filter
    index: gl-happy-filter
    title: hap.py calls
    layout: {x: 0, y: 9, w: 1, h: 2}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: germline_vcfeval_summary
    use: rtgtools/vcfeval_summary
    aggregation: median
    column_name: f1
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:trophy
      icon_color: indigo.4
      caption: median per callset, with its spread
      decimals: 3
    section: Germline at a glance
    tag: vb-gl-card-f1
    index: gl-card-f1
    title: F1
    description: Median F1 of the germline callsets in view.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: germline_vcfeval_summary
    use: rtgtools/vcfeval_summary
    aggregation: median
    column_name: recall
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.9
    threshold_direction: min
    threshold_warn: 0.8
    display:
      icon_name: mdi:magnet
      icon_color: indigo.6
      caption: median per callset, floor 0.9
      decimals: 3
    section: Germline at a glance
    tag: vb-gl-card-recall
    index: gl-card-recall
    title: Recall
    description: Median share of the truth variants a callset recovers. It passes at 0.9 and warns below 0.8.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: germline_vcfeval_summary
    use: rtgtools/vcfeval_summary
    aggregation: sum
    column_name: fp
    column_type: int64
    secondary_layout: top_n
    breakdown_col: caller
    top_n_count: 3
    display:
      icon_name: mdi:alert-outline
      icon_color: indigo.8
      caption: calls absent from the truth set, by caller
      decimals: 0
    section: Germline at a glance
    tag: vb-gl-card-fp
    index: gl-card-fp
    title: False positives
    description: Calls absent from the truth set, summed over the callsets in view and ranked by caller.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: germline_vcfeval_summary
    use: rtgtools/vcfeval_summary
    aggregation: sum
    column_name: tp_comp
    column_type: int64
    secondary_layout: composition
    breakdown_col: caller
    display:
      icon_name: mdi:check-decagram
      icon_color: indigo.9
      caption: calls the truth set confirms, by caller
      decimals: 0
    section: Germline at a glance
    tag: vb-gl-card-tp
    index: gl-card-tp
    title: True positives
    description: Calls the truth set confirms, summed over the callsets in view and split by caller.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: variantbenchmarking
    data_collection_tag: germline_vcfeval_summary
    use: rtgtools/pr_scatter
    config:
      category_col: caller
      show_iso_f1: true
      show_labels: true
    section: Precision and recall
    tag: vb-gl-av-pr
    index: gl-pr-scatter
    title: Precision against recall
    description: One point per callset, labelled and coloured by its caller; the dotted curves are lines of equal F1.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: figure
    workflow_tag: variantbenchmarking
    data_collection_tag: germline_vcfeval_summary
    visu_type: bar
    mode: code
    code_content: |-
      # The errors of each callset, one stacked bar: calls the truth set does not hold and truth variants the callset missed. True positives are left out, they dwarf both.
      colors = depictio_category_colors.get('error_type') or {}
      names = {'fp': 'False positives', 'fn': 'Missed calls'}
      d = df.select(['label', 'caller', 'fp', 'fn']).with_columns(pl.col('fp').fill_null(0), pl.col('fn').fill_null(0)).with_columns((pl.col('fp') + pl.col('fn')).alias('total'), pl.col('label').alias('callset'))
      order = d.sort('total').get_column('callset').to_list()
      m = d.unpivot(index=['label', 'caller', 'callset', 'total'], on=['fp', 'fn'], variable_name='kind', value_name='calls').with_columns(pl.col('kind').replace(names))
      fig = px.bar(m.to_pandas(), x='calls', y='callset', color='kind', orientation='h', color_discrete_map=colors, category_orders={'callset': order, 'kind': list(names.values())}, hover_data=['label', 'caller'], labels={'calls': 'Calls', 'callset': '', 'kind': ''})
      fig.update_layout(margin=dict(t=10), legend_title_text='', legend=dict(orientation='h', y=-0.2))
      fig.update_yaxes(automargin=True)
    selection_enabled: true
    selection_column: label
    section: Precision and recall
    tag: vb-gl-fig-errors
    index: gl-errors
    title: False positives and missed calls per callset
    description: Calls the truth set does not hold, and truth variants the callset missed, summed per callset. The longest bar is the callset that errs most.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: figure
    workflow_tag: variantbenchmarking
    data_collection_tag: germline_happy_summary
    visu_type: bar
    mode: code
    code_content: |-
      # F1 of the PASS calls per variant type. The ALL calls join them only where hard-filtered calls change the score: two identical bars say nothing.
      colors = depictio_category_colors.get('filter') or {}
      d = df.select(['variant_type', 'filter', 'f1']).drop_nulls('f1')
      p = d.filter(pl.col('filter') == 'PASS').select('variant_type', pl.col('f1').alias('pass_f1'))
      a = d.filter(pl.col('filter') == 'ALL').select('variant_type', pl.col('f1').alias('all_f1'))
      j = p.join(a, on='variant_type', how='inner')
      split = j.height > 0 and bool(j.select(((pl.col('pass_f1') - pl.col('all_f1')).abs() > 0.0005).any()).item())
      show = d if (split or p.height == 0) else d.filter(pl.col('filter') == 'PASS')
      fig = px.bar(show.to_pandas(), x='variant_type', y='f1', color='filter', barmode='group', color_discrete_map=colors, category_orders={'filter': ['PASS', 'ALL']}, text_auto='.3f', labels={'variant_type': '', 'f1': 'F1', 'filter': 'Calls'})
      fig.update_layout(margin=dict(t=10), legend_title_text='')
      fig.update_yaxes(automargin=True)
    section: hap.py by variant type
    tag: vb-gl-fig-happy
    index: gl-happy-f1
    title: F1 by variant type
    description: F1 of the PASS calls, pooled over samples; the ALL calls are drawn beside them only where hard-filtered calls change the score.
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: advanced_viz
    workflow_tag: variantbenchmarking
    data_collection_tag: germline_happy_roc
    use: happy/pr_curve
    config:
      threshold_col: quality
    section: hap.py by variant type
    tag: vb-gl-av-roc
    index: gl-happy-roc
    title: Quality-threshold sweep
    description: Precision against recall at each quality cut-off the run swept, with its AUC (SNP, PASS). A run that swept two cut-offs draws two operating points.
    layout: {x: 4, y: 0, w: 4, h: 5}
  # Each callset's false positives and false negatives (rtg-tools vcfeval), with its
  # true positives, as VCFs. Pick a callset in the left panel to open its tracks.
  - component_type: jbrowse
    workflow_tag: variantbenchmarking
    data_collection_tag: tracks
    section: Errors on the genome
    # The manifest lists the callsets best first: the false positives, the missed
    # calls and the true positives of the best one open, the others follow in the menu.
    initial_tracks: 3
    max_tracks: 12
    show_overview: false
    # The files wear the colours of the bars (category_colors: error_type).
    color_by: error_type
    # Common dbSNP sites and ClinVar under the calls, from UCSC (human germline only).
    ucsc_tracks: [dbSnp155Common, clinvarMain]
    selection_enabled: true
    selection_column: sample_id
    tag: vb-gl-browser
    index: gl-browser
    title: Genome browser
    description: The false positives, missed calls and true positives of the callsets picked in the left panel, best callset first.
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: table
    workflow_tag: variantbenchmarking
    data_collection_tag: germline_vcfeval_summary
    use: rtgtools/vcfeval_summary
    row_selection_enabled: true
    row_selection_column: label
    section: Germline tables
    tag: vb-gl-table-vcfeval
    index: gl-table-vcfeval
    title: rtg-tools vcfeval summary
    description: TP, FP, FN, precision, recall and F1 per callset, with its caller and truth set.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: variantbenchmarking
    data_collection_tag: germline_happy_summary
    use: happy/summary
    row_selection_enabled: false
    section: Germline tables
    tag: vb-gl-table-happy
    index: gl-table-happy
    title: hap.py pooled summary
    description: One row per variant type and filter, pooled over samples.
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: table
    workflow_tag: variantbenchmarking
    data_collection_tag: germline_happy_roc
    use: happy/roc
    row_selection_enabled: false
    section: Germline tables
    tag: vb-gl-table-roc
    index: gl-table-roc
    title: hap.py threshold sweep
    description: Precision, recall and F1 per quality threshold.
    layout: {x: 0, y: 12, w: 8, h: 6}
- title: Somatic
  subtitle: How well does each somatic caller recover the truth set?
  tab_group: Small variants
  tab_order: 2
  tab_icon: mdi:target
  tab_icon_color: pink
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # The caller narrows the allele-fraction strata and the rtg-tools cross-check
  # too, through the template's links.
  filter_sections:
  - name: Somatic filters
    icon: mdi:filter-variant
    color: pink
    description: The callers in view, and the allele-fraction bins of the strata
  grid_sections:
  - name: Somatic at a glance
    icon: mdi:counter
    color: pink
    description: F1, precision and the errors over the somatic callers in view
  - name: Precision and recall
    icon: mdi:chart-scatter-plot
    color: pink
    description: Each callset on the precision-recall plane, beside its false positives and misses
  - name: Confidence intervals
    icon: mdi:scale-balance
    color: pink
    description: som.py's binomial 95% intervals around precision and recall
  - name: Allele-fraction strata
    icon: mdi:chart-bell-curve
    color: pink
    description: False positives per allele-fraction bin, where low fractions are hardest
    collapsed: true
  - name: rtg-tools cross-check
    icon: mdi:check-decagram
    color: gray
    description: rtg-tools vcfeval over all variants, not som.py's one type – compare ranks
    collapsed: true
  - name: Somatic tables
    icon: mdi:table
    color: gray
    description: The som.py summary and allele-fraction rows behind every tile
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [som.py](https://github.com/Illumina/hap.py) scores each somatic caller against the
      truth set, with binomial 95% intervals, and bins its false positives by allele fraction.
      Recall counts every truth variant, also those outside the regions the run called, so a
      partial run scores low by design. [rtg-tools vcfeval](https://github.com/RealTimeGenomics/rtg-tools)
      cross-checks the ranking over all variants, so its counts differ from som.py's.
    tag: vb-so-intro
    index: so-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: variantbenchmarking
    data_collection_tag: somatic_sompy_summary
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:tools
      custom_color: indigo
    section: Somatic filters
    tag: vb-so-filter-caller
    index: so-caller-filter
    title: Caller
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: variantbenchmarking
    data_collection_tag: somatic_sompy_regions
    interactive_component_type: MultiSelect
    column_name: af_bin
    column_type: object
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: grape
    section: Somatic filters
    tag: vb-so-filter-afbin
    index: so-afbin-filter
    title: Allele-fraction bin
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: somatic_sompy_summary
    use: sompy/summary
    aggregation: median
    column_name: f1
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:trophy
      icon_color: pink.4
      caption: median per callset, with its spread
    section: Somatic at a glance
    tag: vb-so-card-f1
    index: so-card-f1
    title: F1
    description: Median F1 of the somatic callsets in view; a callset without calls has none and is left out.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: somatic_sompy_summary
    use: sompy/summary
    aggregation: median
    column_name: precision
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.5
    threshold_direction: min
    threshold_warn: 0.25
    display:
      icon_name: mdi:bullseye-arrow
      icon_color: pink.6
      caption: median per callset, floor 0.5
    section: Somatic at a glance
    tag: vb-so-card-precision
    index: so-card-precision
    title: Precision
    description: Median share of a callset's calls in the truth set, over the callsets that made calls. It passes at 0.5 and warns below 0.25.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: somatic_sompy_summary
    use: sompy/summary
    aggregation: sum
    column_name: fp
    column_type: int64
    secondary_layout: top_n
    breakdown_col: caller
    top_n_count: 3
    display:
      icon_name: mdi:alert-outline
      icon_color: pink.8
      caption: calls absent from the truth set, by caller
      decimals: 0
    section: Somatic at a glance
    tag: vb-so-card-fp
    index: so-card-fp
    title: False positives
    description: Calls absent from the truth set, summed over the callers in view and ranked by caller.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: somatic_sompy_summary
    use: sompy/summary
    aggregation: sum
    column_name: tp
    column_type: int64
    secondary_layout: composition
    breakdown_col: caller
    display:
      icon_name: mdi:check-decagram
      icon_color: pink.9
      caption: calls the truth set confirms, by caller
      decimals: 0
    section: Somatic at a glance
    tag: vb-so-card-tp
    index: so-card-tp
    title: True positives
    description: Calls the truth set confirms, summed over the callers in view and split by caller.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: variantbenchmarking
    data_collection_tag: somatic_sompy_summary
    use: sompy/pr_scatter
    config:
      category_col: caller
      show_iso_f1: true
      show_labels: true
    section: Precision and recall
    tag: vb-so-av-pr
    index: so-pr-scatter
    title: Precision against recall
    description: One point per callset, labelled and coloured by its caller; the dotted curves are lines of equal F1.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: figure
    workflow_tag: variantbenchmarking
    data_collection_tag: somatic_sompy_summary
    visu_type: bar
    mode: code
    code_content: |-
      # The errors of each caller and variant type, one stacked bar: calls the truth set does not hold and truth variants the caller missed. True positives are left out, they dwarf both.
      colors = depictio_category_colors.get('error_type') or {}
      names = {'fp': 'False positives', 'fn': 'Missed calls'}
      d = df.select(['caller', 'variant_type', 'fp', 'fn']).with_columns(pl.col('fp').fill_null(0), pl.col('fn').fill_null(0)).with_columns((pl.col('fp') + pl.col('fn')).alias('total'), pl.when(pl.col('variant_type').is_not_null()).then(pl.concat_str([pl.col('caller'), pl.lit(' · '), pl.col('variant_type')])).otherwise(pl.col('caller')).alias('callset'))
      order = d.sort('total').get_column('callset').to_list()
      m = d.unpivot(index=['caller', 'variant_type', 'callset', 'total'], on=['fp', 'fn'], variable_name='kind', value_name='calls').with_columns(pl.col('kind').replace(names))
      fig = px.bar(m.to_pandas(), x='calls', y='callset', color='kind', orientation='h', color_discrete_map=colors, category_orders={'callset': order, 'kind': list(names.values())}, hover_data=['caller', 'variant_type'], labels={'calls': 'Calls', 'callset': '', 'kind': ''})
      fig.update_layout(margin=dict(t=10), legend_title_text='', legend=dict(orientation='h', y=-0.2))
      fig.update_yaxes(automargin=True)
    selection_enabled: true
    selection_column: caller
    section: Precision and recall
    tag: vb-so-fig-errors
    index: so-errors
    title: False positives and missed calls per caller
    description: Calls the truth set does not hold, and truth variants the caller missed, per variant type. An over-calling caller fills the false positive bar.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: variantbenchmarking
    data_collection_tag: somatic_sompy_summary
    use: sompy/precision_ci
    config:
      metric_name: Precision
    section: Confidence intervals
    tag: vb-so-av-precision-ci
    index: so-precision-ci
    title: Precision with its 95% interval
    description: Point estimate and binomial interval per caller; a wide whisker rests on few calls.
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: advanced_viz
    workflow_tag: variantbenchmarking
    data_collection_tag: somatic_sompy_summary
    use: sompy/recall_ci
    config:
      metric_name: Recall
    section: Confidence intervals
    tag: vb-so-av-recall-ci
    index: so-recall-ci
    title: Recall with its 95% interval
    description: Point estimate and binomial interval per caller; overlapping whiskers tie.
    layout: {x: 4, y: 0, w: 4, h: 5}
  - component_type: figure
    workflow_tag: variantbenchmarking
    data_collection_tag: somatic_sompy_regions
    use: sompy/regions
    visu_type: bar
    dict_kwargs:
      x: af_bin
      y: fp
      color: caller
      barmode: group
      labels: {af_bin: Allele-fraction bin, fp: False positives, caller: Caller}
    section: Allele-fraction strata
    tag: vb-so-fig-af-fp
    index: so-af-fp
    title: False positives per allele-fraction bin
    description: One bar per caller and bin, the bin read off the caller's allele fraction. som.py bins a true positive or a miss by the truth set's allele fraction, so without one only false positives are binned. A caller whose false positives pile up in the lowest bin is calling into the noise floor.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: variantbenchmarking
    data_collection_tag: somatic_vcfeval_summary
    use: rtgtools/pr_scatter
    config:
      category_col: caller
      show_iso_f1: true
      show_labels: true
    section: rtg-tools cross-check
    tag: vb-so-av-vcfeval-pr
    index: so-vcfeval-pr
    title: Precision against recall, rtg-tools vcfeval (all variants)
    description: vcfeval matches haplotypes over every variant of a callset, whereas som.py scores one variant type, so its counts and precision differ. Compare how the callers rank, not the values.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: variantbenchmarking
    data_collection_tag: somatic_vcfeval_summary
    use: rtgtools/vcfeval_summary
    row_selection_enabled: true
    row_selection_column: caller
    section: rtg-tools cross-check
    tag: vb-so-table-vcfeval
    index: so-table-vcfeval
    title: rtg-tools vcfeval summary
    description: TP, FP, FN, precision, recall and F1 per callset over all variants, with its caller and truth set.
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: table
    workflow_tag: variantbenchmarking
    data_collection_tag: somatic_sompy_summary
    use: sompy/summary
    row_selection_enabled: true
    row_selection_column: caller
    section: Somatic tables
    tag: vb-so-table-sompy
    index: so-table-sompy
    title: som.py summary
    description: TP, FP, FN, precision, recall and F1 per callset, with 95% intervals.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: variantbenchmarking
    data_collection_tag: somatic_sompy_regions
    use: sompy/regions
    row_selection_enabled: true
    row_selection_column: caller
    section: Somatic tables
    tag: vb-so-table-regions
    index: so-table-regions
    title: som.py allele-fraction strata
    description: One row per caller and allele-fraction bin; recall and F1 are empty where no truth variant is binned.
    layout: {x: 0, y: 6, w: 8, h: 6}
# ============================================================================
# Structural
# ============================================================================
- title: Structural & CNV
  subtitle: How well do the structural callsets match the truth set?
  tab_group: Structural
  tab_order: 3
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Structural filters
    icon: mdi:filter-variant
    color: orange
    description: The callsets and callers in view, and the Wittyer scoring level
  grid_sections:
  - name: Structural at a glance
    icon: mdi:counter
    color: orange
    description: True positives, F1, recall and precision over the Truvari callsets in view
  - name: Precision and recall
    icon: mdi:chart-scatter-plot
    color: orange
    description: Each callset on the precision-recall plane, beside its false positives and misses
  - name: SVanalyzer and Wittyer
    icon: mdi:chart-bar
    color: orange
    description: The same callsets scored by SVanalyzer, and by Wittyer per event and per base
  - name: Errors on the genome
    icon: mdi:dna
    color: orange
    description: Where the picked callsets' false positives and missed calls sit
  - name: Structural tables
    icon: mdi:table
    color: gray
    description: The Truvari, SVanalyzer and Wittyer rows behind every tile
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [Truvari](https://github.com/ACEnglish/truvari) and
      [SVanalyzer](https://github.com/nhansen/SVanalyzer) score each structural-variant
      callset against the truth set; [Wittyer](https://github.com/Illumina/witty.er) scores it
      per event and per base. A caller that finds events but misplaces their breakpoints
      scores well per event and poorly per base.
    tag: vb-sv-intro
    index: sv-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    interactive_component_type: MultiSelect
    column_name: label
    column_type: object
    display:
      icon_name: mdi:flask
      custom_color: teal
    section: Structural filters
    tag: vb-sv-filter-callset
    index: sv-callset-filter
    title: Callset
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:tools
      custom_color: indigo
    section: Structural filters
    tag: vb-sv-filter-caller
    index: sv-caller-filter
    title: Caller
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: variantbenchmarking
    data_collection_tag: cnv_wittyer_summary
    interactive_component_type: MultiSelect
    column_name: stats_type
    column_type: object
    display:
      icon_name: mdi:ruler
      custom_color: cyan
    section: Structural filters
    tag: vb-sv-filter-level
    index: sv-level-filter
    title: Wittyer level
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    use: truvari/summary
    aggregation: sum
    column_name: tp_comp
    column_type: int64
    secondary_layout: composition
    breakdown_col: caller
    display:
      icon_name: mdi:check-decagram
      icon_color: orange.4
      caption: calls the truth set confirms, by caller
      decimals: 0
    section: Structural at a glance
    tag: vb-sv-card-tp
    index: sv-card-tp
    title: True positives
    description: Calls the truth set confirms (Truvari), summed over the callsets in view and split by caller.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    use: truvari/summary
    aggregation: median
    column_name: f1
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:trophy
      icon_color: orange.6
      caption: median per callset, with its spread
      decimals: 3
    section: Structural at a glance
    tag: vb-sv-card-f1
    index: sv-card-f1
    title: F1
    description: Median Truvari F1 of the callsets in view; a callset without calls has none and is left out.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    use: truvari/summary
    aggregation: median
    column_name: recall
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.8
    threshold_direction: min
    threshold_warn: 0.6
    display:
      icon_name: mdi:magnet
      icon_color: orange.8
      caption: median per callset, floor 0.8
      decimals: 3
    section: Structural at a glance
    tag: vb-sv-card-recall
    index: sv-card-recall
    title: Recall
    description: Median share of the truth variants a callset recovers. It passes at 0.8 and warns below 0.6.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    use: truvari/summary
    aggregation: median
    column_name: precision
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:bullseye-arrow
      icon_color: orange.9
      caption: median per callset, with its distribution
      decimals: 3
    section: Structural at a glance
    tag: vb-sv-card-precision
    index: sv-card-precision
    title: Precision
    description: Median share of a callset's calls that are in the truth set, over the callsets that made calls.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    use: truvari/pr_scatter
    config:
      category_col: caller
      show_iso_f1: true
      show_labels: true
    section: Precision and recall
    tag: vb-sv-av-pr
    index: sv-truvari-pr
    title: Precision against recall, Truvari
    description: One point per callset, labelled and coloured by its caller; the dotted curves are lines of equal F1.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: figure
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    visu_type: bar
    mode: code
    code_content: |-
      # The errors of each callset, one stacked bar: calls the truth set does not hold and truth variants the callset missed. True positives are left out, they dwarf both.
      colors = depictio_category_colors.get('error_type') or {}
      names = {'fp': 'False positives', 'fn': 'Missed calls'}
      d = df.select(['label', 'caller', 'fp', 'fn']).with_columns(pl.col('fp').fill_null(0), pl.col('fn').fill_null(0)).with_columns((pl.col('fp') + pl.col('fn')).alias('total'), pl.col('label').alias('callset'))
      order = d.sort('total').get_column('callset').to_list()
      m = d.unpivot(index=['label', 'caller', 'callset', 'total'], on=['fp', 'fn'], variable_name='kind', value_name='calls').with_columns(pl.col('kind').replace(names))
      fig = px.bar(m.to_pandas(), x='calls', y='callset', color='kind', orientation='h', color_discrete_map=colors, category_orders={'callset': order, 'kind': list(names.values())}, hover_data=['label', 'caller'], labels={'calls': 'Calls', 'callset': '', 'kind': ''})
      fig.update_layout(margin=dict(t=10), legend_title_text='', legend=dict(orientation='h', y=-0.2))
      fig.update_yaxes(automargin=True)
    selection_enabled: true
    selection_column: label
    section: Precision and recall
    tag: vb-sv-fig-errors
    index: sv-truvari-errors
    title: False positives and missed calls per callset, Truvari
    description: Calls the truth set does not hold, and truth variants the callset missed, summed per callset. The longest bar is the callset that errs most.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: figure
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_svbenchmark_summary
    use: svanalyzer/svbenchmark
    visu_type: bar
    dict_kwargs:
      x: label
      y: f1
      color: caller
      labels: {label: Callset, f1: F1, caller: Caller}
    section: SVanalyzer and Wittyer
    tag: vb-sv-fig-svbench
    index: sv-svbench-f1
    title: F1 per callset, SVanalyzer
    description: SVanalyzer's F1 per callset, the second structural benchmark the pipeline runs.
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: figure
    workflow_tag: variantbenchmarking
    data_collection_tag: cnv_wittyer_summary
    use: wittyer/summary
    visu_type: bar
    dict_kwargs:
      x: label
      y: f1
      color: stats_type
      barmode: group
      labels: {label: Callset, f1: F1, stats_type: Scored per}
    section: SVanalyzer and Wittyer
    tag: vb-sv-fig-wittyer
    index: sv-wittyer-f1
    title: F1 per callset, Wittyer
    description: Two bars per callset, scored per event and per base.
    layout: {x: 4, y: 0, w: 4, h: 5}
  # Each callset's false positives and false negatives (Truvari), with its true
  # positives, as VCFs. Pick a callset in the left panel to open its tracks.
  - component_type: jbrowse
    workflow_tag: variantbenchmarking
    data_collection_tag: tracks
    section: Errors on the genome
    # The manifest lists the callsets best first: the false positives, the missed
    # calls and the true positives of the best one open, the others follow in the menu.
    initial_tracks: 3
    max_tracks: 12
    show_overview: false
    # The files wear the colours of the bars (category_colors: error_type).
    color_by: error_type
    selection_enabled: true
    selection_column: sample_id
    tag: vb-sv-browser
    index: sv-browser
    title: Genome browser
    description: The false positives, missed calls and true positives of the callsets picked in the left panel, best callset first.
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: table
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
