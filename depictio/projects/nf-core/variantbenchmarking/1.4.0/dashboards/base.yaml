- title: Structural & CNV
  subtitle: Structural-variant and copy-number benchmarking with Truvari, SVanalyzer and Wittyer
  tab_order: 3
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  advanced_viz_controls: header
  dashboard_id: 846b0f3c1e4a2d7f8e5bba22
  # Every data collection on this tab is optional: the public megatest has no
  # sv/ or cnv/ output, so on the reference dataset the importer hides the
  # components and drops the tab. It comes back as soon as a run ships the
  # Truvari / SVanalyzer / Wittyer summaries.
  filter_sections:
  - name: SV callsets
    icon: mdi:dna
    color: orange
    description: Which structural-variant callsets to compare
  - name: Wittyer scope
    icon: mdi:shape-outline
    color: orange
    description: Which Wittyer level to read
  grid_sections:
  - name: SV benchmark
    icon: mdi:chart-scatter-plot
    color: orange
    description: Truvari and SVanalyzer accuracy per structural-variant callset
  - name: Wittyer, per event and per base
    icon: mdi:shape-outline
    color: orange
    description: Wittyer accuracy per callset, scored per event and per base
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The Truvari, SVanalyzer and Wittyer rows behind every tile
    collapsed: true
  components:
  # -------------------------------------------------------------- SV benchmark
  - component_type: text
    tag: text-svcnv-intro
    section: SV benchmark
    title: Structural-variant and CNV benchmarking
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [Truvari](https://github.com/ACEnglish/truvari) and
      [SVanalyzer](https://github.com/nhansen/SVanalyzer) score each
      structural-variant callset against the run's truth set, and the tab
      appears only on a run that produced their tables. The recall card passes
      at 0.8 and warns below 0.6, defaults you can edit in the card.
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: card-sv-callsets
    section: SV benchmark
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    use: truvari/summary
    aggregation: nunique
    aggregations: [count]
    column_name: label
    column_type: object
    secondary_layout: compact
    display: {icon_name: 'mdi:flask', icon_color: '#FB8C00', title_color: '#FB8C00', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: SV callsets
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: card-sv-f1
    section: SV benchmark
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    use: truvari/summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: f1
    column_type: float64
    display: {icon_name: 'mdi:trophy', icon_color: '#FB8C00', title_color: '#FB8C00', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Truvari F1
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: card-sv-prec
    section: SV benchmark
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    use: truvari/summary
    aggregation: average
    column_name: precision
    column_type: float64
    secondary_layout: gauge
    coverage_max: 1
    display: {icon_name: 'mdi:bullseye-arrow', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Truvari precision
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: card-sv-recall
    section: SV benchmark
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    use: truvari/summary
    aggregation: median
    column_name: recall
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.8
    threshold_direction: min
    threshold_warn: 0.6
    display: {icon_name: 'mdi:magnet', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Truvari recall
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: av-sv-truvari-pr
    section: SV benchmark
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    use: truvari/pr_scatter
    title: SV precision-recall benchmark (Truvari)
    description: Each point is a callset, coloured by F1. Top right is best.
    title_size: h3
    layout: {x: 0, y: 4, w: 4, h: 6}
  - component_type: figure
    tag: fig-sv-svbenchmark-f1
    section: SV benchmark
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_svbenchmark_summary
    use: svanalyzer/svbenchmark
    visu_type: bar
