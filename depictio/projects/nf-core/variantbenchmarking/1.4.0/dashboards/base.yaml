# ============================================================================
# Structural
# ============================================================================
- title: Structural & CNV
  subtitle: How well do the structural callsets match the truth set?
  tab_group: Structural
  tab_order: 3
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Structural filters
    icon: mdi:filter-variant
    color: orange
    description: The callsets and callers in view, and the Wittyer scoring level
  grid_sections:
  - name: Structural at a glance
    icon: mdi:counter
    color: orange
    description: True positives, F1, recall and precision over the Truvari callsets in view
  - name: Precision and recall
    icon: mdi:chart-scatter-plot
    color: orange
    description: Each callset on the precision-recall plane, beside its error counts
  - name: SVanalyzer and Wittyer
    icon: mdi:chart-bar
    color: orange
    description: The same callsets scored by SVanalyzer, and by Wittyer per event and per base
  - name: Structural tables
    icon: mdi:table
    color: gray
    description: The Truvari, SVanalyzer and Wittyer rows behind every tile
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [Truvari](https://github.com/ACEnglish/truvari) and
      [SVanalyzer](https://github.com/nhansen/SVanalyzer) score each structural-variant
      callset against the truth set; [Wittyer](https://github.com/Illumina/witty.er) scores it
      per event and per base. A caller that finds events but misplaces their breakpoints
      scores well per event and poorly per base.
    tag: vb-sv-intro
    index: sv-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    interactive_component_type: MultiSelect
    column_name: label
    column_type: object
    display:
      icon_name: mdi:flask
      custom_color: teal
    section: Structural filters
    tag: vb-sv-filter-callset
    index: sv-callset-filter
    title: Callset
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:tools
      custom_color: indigo
    section: Structural filters
    tag: vb-sv-filter-caller
    index: sv-caller-filter
    title: Caller
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: variantbenchmarking
    data_collection_tag: cnv_wittyer_summary
    interactive_component_type: MultiSelect
    column_name: stats_type
    column_type: object
    display:
      icon_name: mdi:ruler
      custom_color: cyan
    section: Structural filters
    tag: vb-sv-filter-level
    index: sv-level-filter
    title: Wittyer level
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    use: truvari/summary
    aggregation: sum
    column_name: tp_comp
    column_type: int64
    secondary_layout: composition
    breakdown_col: caller
    display:
      icon_name: mdi:check-decagram
      icon_color: blue
      caption: calls the truth set confirms, by caller
      decimals: 0
    section: Structural at a glance
    tag: vb-sv-card-tp
    index: sv-card-tp
    title: True positives
    description: Calls the truth set confirms (Truvari), summed over the callsets in view and split by caller.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    use: truvari/summary
    aggregation: median
    column_name: f1
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:trophy
      icon_color: grape
      caption: median per callset, with its spread
      decimals: 3
    section: Structural at a glance
    tag: vb-sv-card-f1
    index: sv-card-f1
    title: F1
    description: Median Truvari F1 of the callsets in view.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    use: truvari/summary
    aggregation: median
    column_name: recall
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.8
    threshold_direction: min
    threshold_warn: 0.6
    display:
      icon_name: mdi:magnet
      icon_color: orange
      caption: median per callset, floor 0.8
      decimals: 3
    section: Structural at a glance
    tag: vb-sv-card-recall
    index: sv-card-recall
    title: Recall
    description: Median share of the truth variants a callset recovers. It passes at 0.8 and warns below 0.6.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    use: truvari/summary
    aggregation: median
    column_name: precision
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:bullseye-arrow
      icon_color: teal
      caption: median per callset, with its distribution
      decimals: 3
    section: Structural at a glance
    tag: vb-sv-card-precision
    index: sv-card-precision
    title: Precision
    description: Median share of a callset's calls that are in the truth set.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    use: truvari/pr_scatter
    config:
      support_col: tp_comp
      category_col: caller
      show_labels: false
    section: Precision and recall
    tag: vb-sv-av-pr
    index: sv-truvari-pr
    title: Precision against recall, Truvari
    description: One point per callset, sized by its true positives and coloured by caller.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    viz_kind: confusion_matrix
    config:
      viz_kind: confusion_matrix
      label_col: label
      tp_col: tp_comp
      fp_col: fp
      fn_col: fn
    section: Precision and recall
    tag: vb-sv-av-confusion
    index: sv-truvari-confusion
    title: Errors per callset, Truvari
    description: TP, FP and FN per callset; the shade is the share of its calls, the label the count.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: figure
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_svbenchmark_summary
    use: svanalyzer/svbenchmark
    visu_type: bar
    dict_kwargs:
      x: label
      y: f1
      color: caller
      labels: {label: Callset, f1: F1, caller: Caller}
    section: SVanalyzer and Wittyer
    tag: vb-sv-fig-svbench
    index: sv-svbench-f1
    title: F1 per callset, SVanalyzer
    description: SVanalyzer's F1 per callset, the second structural benchmark the pipeline runs.
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: figure
    workflow_tag: variantbenchmarking
    data_collection_tag: cnv_wittyer_summary
    use: wittyer/summary
    visu_type: bar
    dict_kwargs:
      x: label
      y: f1
      color: stats_type
      barmode: group
      labels: {label: Callset, f1: F1, stats_type: Scored per}
    section: SVanalyzer and Wittyer
    tag: vb-sv-fig-wittyer
    index: sv-wittyer-f1
    title: F1 per callset, Wittyer
    description: Two bars per callset, scored per event and per base.
    layout: {x: 4, y: 0, w: 4, h: 5}
  - component_type: table
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_truvari_summary
    use: truvari/summary
    row_selection_enabled: true
    row_selection_column: label
    section: Structural tables
    tag: vb-sv-table-truvari
    index: sv-table-truvari
    title: Truvari summary
    description: TP, FP, FN, precision, recall and F1 per callset.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: variantbenchmarking
    data_collection_tag: sv_svbenchmark_summary
    use: svanalyzer/svbenchmark
    row_selection_enabled: true
    row_selection_column: label
    section: Structural tables
    tag: vb-sv-table-svbench
    index: sv-table-svbench
    title: SVanalyzer svbenchmark summary
    description: Precision, recall and F1 per callset.
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: table
    workflow_tag: variantbenchmarking
    data_collection_tag: cnv_wittyer_summary
    use: wittyer/summary
    row_selection_enabled: true
    row_selection_column: label
    section: Structural tables
    tag: vb-sv-table-wittyer
    index: sv-table-wittyer
    title: Wittyer summary
    description: Precision, recall and F1 per callset and Wittyer level.
    layout: {x: 0, y: 12, w: 8, h: 6}
