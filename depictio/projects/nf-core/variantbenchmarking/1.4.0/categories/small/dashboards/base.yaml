version: 1
main_dashboard:
  title: Variant Benchmarking — Germline small variants
  subtitle: "analysis=germline · variant_type=small — SNV + INDEL, hap.py / rtg-tools vcfeval (HG002 / GIAB)"
  project_tag: Variant Benchmarking — Germline small variants
  main_tab_name: Benchmark
  tab_icon: mdi:target-arrow
  tab_icon_color: indigo
  workflow_system: none
  # Left panel. The three sections narrow the vcfeval callsets (and, for the
  # last one, the hap.py rows). They are declared once here and stay local to
  # this tab: the MultiQC tab reads a different data collection, so a fanned-out
  # sample filter would have nothing to act on there.
  filter_sections:
  - name: Callsets
    icon: mdi:dna
    color: indigo
    description: Which samples and truth-set versions to compare
  - name: Score ranges
    icon: mdi:tune
    color: indigo
    description: Keep only the callsets inside an accuracy band
    collapsed: true
  - name: hap.py scope
    icon: mdi:filter-variant
    color: teal
    description: Variant type and filter for the hap.py panels
    collapsed: true
  # Right panel, in reading order: the funnel goes from the run-level cards to
  # the signature precision-recall view, then to the error breakdown and the
  # hap.py stratification. `Reference tables` is persistent and pinned to the
  # bottom so the raw rows trail the MultiQC tab as well.
  grid_sections:
  - name: Benchmark at a glance
    icon: mdi:counter
    color: indigo
    description: How the germline callsets score against the GIAB / HG002 truth set
  - name: Precision vs recall
    icon: mdi:chart-scatter-plot
    color: indigo
    description: The signature benchmark view, top-right is best
  - name: Error profile
    icon: mdi:alert-outline
    color: orange
    description: Where the calls go wrong, false positives and misses per callset
  - name: hap.py stratification
    icon: mdi:chart-line
    color: teal
    description: SNP vs INDEL accuracy and the quality-threshold sweep
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The vcfeval and hap.py rows behind every tile, on every tab
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # ---------------------------------------------------------------- at a glance
  - component_type: text
    tag: small-bench-intro
    section: Benchmark at a glance
    title: Germline small-variant benchmarking
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      How well does each callset recover the GIAB / HG002 truth set? The cards
      summarise the run, the precision-recall benchmark ranks the callsets, the
      confusion matrix counts TP / FP / FN, and the hap.py panels split the score
      by variant type and quality threshold.
    workflow_tag: variantbenchmarking
    data_collection_tag: vcfeval_summary
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    tag: small-card-callsets
    section: Benchmark at a glance
    workflow_tag: variantbenchmarking
    data_collection_tag: vcfeval_summary
    aggregation: nunique
    column_name: label
    column_type: object
    secondary_layout: donut
    breakdown_col: caller
    top_n_count: 3
    display: {icon_name: 'mdi:flask', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Callsets
    layout: {x: 0, y: 1, w: 2, h: 2}
  - component_type: card
    tag: small-card-f1
    section: Benchmark at a glance
    workflow_tag: variantbenchmarking
    data_collection_tag: vcfeval_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: f1
    column_type: float64
    display: {icon_name: 'mdi:trophy', icon_color: '#3F51B5', title_color: '#3F51B5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: F1
    layout: {x: 2, y: 1, w: 2, h: 2}
  - component_type: card
    tag: small-card-prec
    section: Benchmark at a glance
    workflow_tag: variantbenchmarking
    data_collection_tag: vcfeval_summary
    aggregation: average
    column_name: precision
    column_type: float64
    secondary_layout: gauge
    coverage_max: 1
    display: {icon_name: 'mdi:bullseye-arrow', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Precision
    layout: {x: 4, y: 1, w: 2, h: 2}
  - component_type: card
    tag: small-card-recall
    section: Benchmark at a glance
    workflow_tag: variantbenchmarking
    data_collection_tag: vcfeval_summary
    aggregation: median
    column_name: recall
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.9
    threshold_direction: min
    threshold_warn: 0.8
    display: {icon_name: 'mdi:magnet', icon_color: '#F2A93B', title_color: '#F2A93B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Recall
    layout: {x: 6, y: 1, w: 2, h: 2}

  # ---------------------------------------------------------- precision vs recall
  - component_type: text
    tag: small-pr-intro
    section: Precision vs recall
    title: Every callset on one precision-recall plane
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each point is a callset: size is the number of true positives, colour is
      F1 and the dotted lines are equal-F1 contours. The ranked strip on the
      right zooms the F1 axis to the data so small gaps between callsets stay
      readable.
    workflow_tag: variantbenchmarking
    data_collection_tag: vcfeval_summary
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: small-av-pr
    section: Precision vs recall
    workflow_tag: variantbenchmarking
    data_collection_tag: vcfeval_summary
    use: rtgtools/pr_scatter
    config: {support_col: tp_comp}
    title: Precision-recall benchmark
    description: Each point is a sample; size = true positives, colour = F1, dotted lines = equal-F1 contours. Top-right is best.
    title_size: h3
    layout: {x: 0, y: 1, w: 5, h: 7}
  - component_type: figure
    tag: small-fig-f1
    section: Precision vs recall
    workflow_tag: variantbenchmarking
    data_collection_tag: vcfeval_summary
    visu_type: scatter
    dict_kwargs: {x: f1, y: label, color: f1, size: f1, size_max: 26, color_continuous_scale: Tealgrn}
    title: F1 by sample
    description: Ranked accuracy per sample (x-axis zoomed to the data).
    title_size: h3
    layout: {x: 5, y: 1, w: 3, h: 7}

  # ------------------------------------------------------------- error profile
  - component_type: text
    tag: small-errors-intro
    section: Error profile
    title: Where the calls go wrong
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The confusion matrix shades each cell by its share of the callset's calls
      and labels it with the raw count. The two bars split the errors: false
      positives are calls absent from the truth set, false negatives are truth
      variants the callset missed.
    workflow_tag: variantbenchmarking
    data_collection_tag: vcfeval_summary
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: small-av-confusion
    section: Error profile
    workflow_tag: variantbenchmarking
    data_collection_tag: vcfeval_summary
    use: rtgtools/confusion
    title: Confusion matrix
    description: TP / FP / FN per sample; cell shade = share of that callset's calls, label = raw count.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 4}
  - component_type: figure
    tag: small-fig-fp
    section: Error profile
    workflow_tag: variantbenchmarking
    data_collection_tag: vcfeval_summary
    visu_type: bar
    dict_kwargs: {x: label, y: fp, color: caller}
    title: False positives per callset
    description: Calls made by the callset that are not in the truth set.
    title_size: h3
    layout: {x: 0, y: 5, w: 4, h: 4}
  - component_type: figure
    tag: small-fig-fn
    section: Error profile
    workflow_tag: variantbenchmarking
    data_collection_tag: vcfeval_summary
    visu_type: bar
    dict_kwargs: {x: label, y: fn, color: caller}
    title: False negatives per callset
    description: Truth-set variants the callset missed.
    title_size: h3
    layout: {x: 4, y: 5, w: 4, h: 4}

  # ------------------------------------------------------ hap.py stratification
  - component_type: text
    tag: small-happy-intro
    section: hap.py stratification
    title: hap.py splits the score by variant type and quality threshold
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      hap.py pools the samples and scores SNPs and INDELs separately, once for
      all calls and once for PASS calls only. The threshold sweep traces
      precision against recall as the quality cut-off rises; the panel settings
      switch it to a per-threshold view.
    workflow_tag: variantbenchmarking
    data_collection_tag: happy_summary
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    tag: small-fig-happy-type
    section: hap.py stratification
    workflow_tag: variantbenchmarking
    data_collection_tag: happy_summary
    visu_type: bar
    dict_kwargs: {x: variant_type, y: f1, color: filter, barmode: group}
    title: F1 by variant type
    description: "SNP vs INDEL, pooled across samples. ALL and PASS coincide when no variant was hard-filtered."
    title_size: h3
    layout: {x: 0, y: 1, w: 4, h: 5}
  - component_type: advanced_viz
    tag: small-av-roc
    section: hap.py stratification
    workflow_tag: variantbenchmarking
    data_collection_tag: happy_roc
    use: happy/pr_curve
    config: {threshold_col: quality}
    title: Quality-threshold sweep
    description: Precision-recall curve with AUC across hap.py quality thresholds (germline SNP, PASS). A test subset yields only a few points; a full run draws the whole curve.
    title_size: h3
    layout: {x: 4, y: 1, w: 4, h: 5}

  # ---------------------------------------------------------- reference tables
  - component_type: text
    tag: small-tables-intro
    section: Reference tables
    title: The rows behind every tile
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The rtg-tools vcfeval and hap.py summary rows every panel above is computed
      from. Filters picked in the left panel narrow these tables too.
    workflow_tag: variantbenchmarking
    data_collection_tag: vcfeval_summary
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: table
    tag: small-table-vcfeval
    section: Reference tables
    workflow_tag: variantbenchmarking
    data_collection_tag: vcfeval_summary
    row_selection_enabled: false
    title: rtg-tools vcfeval summary
    description: Per-sample TP / FP / FN and precision / recall / F1.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 4}
  - component_type: table
    tag: small-table-happy
    section: Reference tables
    workflow_tag: variantbenchmarking
    data_collection_tag: happy_summary
    row_selection_enabled: false
    title: hap.py pooled summary
    description: Variant type × filter, pooled across samples.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 5, w: 4, h: 3}
  - component_type: table
    tag: small-table-happy-roc
    section: Reference tables
    workflow_tag: variantbenchmarking
    data_collection_tag: happy_roc
    row_selection_enabled: false
    title: hap.py threshold sweep
    description: Precision / recall / F1 per quality threshold.
    title_size: h3
    title_align: left
    layout: {x: 4, y: 5, w: 4, h: 3}

  # -------------------------------------------------------------- left panel
  - component_type: interactive
    tag: small-filter-sample
    index: small-sample-filter
    section: Callsets
    group: Callset scope
    workflow_tag: variantbenchmarking
    data_collection_tag: vcfeval_summary
    interactive_component_type: MultiSelect
    column_name: label
    column_type: object
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:flask'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: small-filter-truthset
    index: small-truthset-filter
    section: Callsets
    group: Callset scope
    workflow_tag: variantbenchmarking
    data_collection_tag: vcfeval_summary
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:dna'}
    placement: left
    title: Truth set
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: small-filter-f1
    index: small-f1-range
    section: Score ranges
    group: Accuracy
    workflow_tag: variantbenchmarking
    data_collection_tag: vcfeval_summary
    interactive_component_type: RangeSlider
    column_name: f1
    column_type: float64
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:trophy'}
    placement: left
    title: F1
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: small-filter-precision
    index: small-precision-range
    section: Score ranges
    group: Accuracy
    workflow_tag: variantbenchmarking
    data_collection_tag: vcfeval_summary
    interactive_component_type: RangeSlider
    column_name: precision
    column_type: float64
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:bullseye-arrow'}
    placement: left
    title: Precision
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: small-filter-recall
    index: small-recall-range
    section: Score ranges
    group: Accuracy
    workflow_tag: variantbenchmarking
    data_collection_tag: vcfeval_summary
    interactive_component_type: RangeSlider
    column_name: recall
    column_type: float64
    display: {title_size: md, custom_color: '#F2A93B', icon_name: 'mdi:magnet'}
    placement: left
    title: Recall
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: small-filter-happy-filter
    index: small-happy-filter
    section: hap.py scope
    group: hap.py
    workflow_tag: variantbenchmarking
    data_collection_tag: happy_summary
    interactive_component_type: SegmentedControl
    column_name: filter
    column_type: object
    display: {title_size: md, custom_color: '#26A69A', icon_name: 'mdi:filter-variant'}
    placement: left
    title: Filter
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    tag: small-filter-happy-type
    index: small-happy-type-filter
    section: hap.py scope
    group: hap.py
    workflow_tag: variantbenchmarking
    data_collection_tag: happy_summary
    interactive_component_type: MultiSelect
    column_name: variant_type
    column_type: object
    display: {title_size: md, custom_color: '#26A69A', icon_name: 'mdi:dna'}
    placement: left
    title: Variant type
    layout: {x: 0, y: 2, w: 1, h: 3}

tabs:
- title: MultiQC
  subtitle: MultiQC report — small-variant run (bcftools stats · hap.py)
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  workflow_system: none
  filter_sections:
  - name: Report samples
    icon: mdi:filter-variant
    color: orange
    description: Narrow the MultiQC panels to selected callsets
  grid_sections:
  - name: Report at a glance
    icon: mdi:chart-box-outline
    color: orange
    description: bcftools and hap.py general statistics per callset
  - name: hap.py panels
    icon: mdi:dna
    color: indigo
    description: SNP and INDEL accuracy as MultiQC reports it
  - name: Variant statistics
    icon: mdi:chart-bar
    color: orange
    description: Substitution types and indel-length distribution from bcftools stats
    collapsed: true
  components:
  - component_type: text
    tag: small-qc-intro
    section: Report at a glance
    title: MultiQC report for the germline small-variant run
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The pipeline's own MultiQC report: bcftools general statistics per callset,
      hap.py SNP and INDEL panels, and the variant substitution and indel-length
      distributions.
    workflow_tag: variantbenchmarking
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: small-qc-general-stats
    section: Report at a glance
    workflow_tag: variantbenchmarking
    data_collection_tag: multiqc_data
    selected_module: general_stats
    selected_plot: general_stats
    title: General statistics
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 4}

  - component_type: text
    tag: small-qc-happy-intro
    section: hap.py panels
    title: hap.py as MultiQC reports it
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The per-callset SNP and INDEL panels MultiQC builds from the hap.py
      summaries. The Benchmark tab recomputes the same numbers from the pooled
      tables.
    workflow_tag: variantbenchmarking
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: small-qc-happy-snp
    section: hap.py panels
    workflow_tag: variantbenchmarking
    data_collection_tag: multiqc_data
    selected_module: happy
    selected_plot: SNP
    use: multiqc/happy
    title: hap.py SNP
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: small-qc-happy-indel
    section: hap.py panels
    workflow_tag: variantbenchmarking
    data_collection_tag: multiqc_data
    selected_module: happy
    selected_plot: INDEL
    use: multiqc/happy
    title: hap.py INDEL
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 5}

  - component_type: text
    tag: small-qc-bcftools-intro
    section: Variant statistics
    title: bcftools stats on the callsets
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Substitution-type spectrum and indel-length distribution per callset, the
      two bcftools stats panels the pipeline forwards to MultiQC.
    workflow_tag: variantbenchmarking
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: small-qc-bcftools-subtypes
    section: Variant statistics
    workflow_tag: variantbenchmarking
    data_collection_tag: multiqc_data
    selected_module: bcftools
    selected_plot: Variant Substitution Types
    use: multiqc/bcftools
    title: Variant substitution types
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 5}
  - component_type: multiqc
    tag: small-qc-bcftools-indel
    section: Variant statistics
    workflow_tag: variantbenchmarking
    data_collection_tag: multiqc_data
    selected_module: bcftools
    selected_plot: Indel Distribution
    use: multiqc/bcftools
    title: Indel distribution
    title_size: sm
    title_align: left
    layout: {x: 0, y: 6, w: 8, h: 5}

  - component_type: interactive
    tag: small-qc-filter-sample
    index: small-qc-sample-filter
    section: Report samples
    group: Sample scope
    workflow_tag: variantbenchmarking
    data_collection_tag: multiqc_data
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display: {title_size: md, custom_color: '#FB8C00', icon_name: 'mdi:flask'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
