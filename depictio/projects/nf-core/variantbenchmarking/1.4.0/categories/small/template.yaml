# nf-core/variantbenchmarking 1.4.0 — Germline small variants (variant_type=small)
# ============================================================================
# One of three per-variant-type projects (the pipeline runs once per variant
# type, so each gets its own MultiQC report — see Kübra Narcı, 2026-06-23).
# Named after the pipeline's own analysis × variant_type parameters:
#   small      : analysis=germline, variant_type=small  (hap.py + rtg-tools, HG002/GIAB) + multiqc_small
#   indel      : analysis=somatic,  variant_type=indel  (som.py + rtg-tools, SEQC2)      + multiqc_indel
#   structural : variant_type=structural                (truvari + SURVIVOR, HG002 SVs)  + multiqc_structural
#
#   depictio run --template nf-core/variantbenchmarking/1.4.0/categories/small \
#     --data-root <root with small/ + multiqc/multiqc_data/multiqc.parquet>
# ============================================================================

template:
  template_id: "nf-core/variantbenchmarking/1.4.0/categories/small"
  description: "nf-core/variantbenchmarking — germline small-variant (analysis=germline, variant_type=small) benchmarking: hap.py / rtg-tools precision/recall/F1 per sample + the small-variant MultiQC report."
  version: "1.0.0"
  variables:
    - name: "DATA_ROOT"
      description: "Root containing small/ (germline benchmark tables) and multiqc/multiqc_data/multiqc.parquet."
      required: true
  dashboards:
    - "dashboards/base.yaml"

name: "Variant Benchmarking — Germline small variants"
project_type: "advanced"
is_public: true
workflows:
  - name: "variantbenchmarking"
    version: "1.4.0"
    engine:
      name: "nextflow"
      version: "24.10.4"
    catalog:
      name: "nf-core"
      url: "https://nf-co.re"
    repository_url: "https://github.com/nf-core/variantbenchmarking"
    data_location:
      structure: "flat"
      locations:
        - "{DATA_ROOT}"
    data_collections:
      - data_collection_tag: "vcfeval_summary"
        description: "Germline rtg-tools vcfeval benchmark summary (precision/recall/F1 per sample)"
        config:
          type: "Table"
          metatype: "Aggregated"
          source: "transformed"
          transform:
            recipe: "rtgtools/vcfeval_summary.py"
          dc_specific_properties:
            format: "CSV"
            columns_description:
              "label": "Sample identifier"
              "caller": "Truth-set version"
              "tp_base": "True positives (baseline)"
              "tp_comp": "True positives (comparison)"
              "fp": "False positives"
              "fn": "False negatives"
              "precision": "Precision (0-1)"
              "recall": "Recall / sensitivity (0-1)"
              "f1": "F1 score (0-1)"

      - data_collection_tag: "happy_summary"
        optional: true
        description: "Germline hap.py pooled performance by variant type (SNP/INDEL) × filter (ALL/PASS)"
        config:
          type: "Table"
          metatype: "Aggregated"
          source: "transformed"
          transform:
            recipe: "happy/summary.py"
          dc_specific_properties:
            format: "CSV"
            columns_description:
              "variant_type": "Variant type (SNP / INDEL)"
              "filter": "hap.py filter (ALL / PASS)"
              "truth_tp": "Pooled truth true positives"
              "truth_fn": "Pooled truth false negatives"
              "query_fp": "Pooled query false positives"
              "recall": "Recall recomputed from pooled counts"
              "precision": "Precision recomputed from pooled counts"
              "f1": "F1 score recomputed from pooled counts"

      - data_collection_tag: "happy_roc"
        optional: true
        description: "Germline hap.py SNP precision-recall sweep (per quality threshold)"
        config:
          type: "Table"
          metatype: "Aggregated"
          source: "transformed"
          transform:
            recipe: "happy/roc.py"
          dc_specific_properties:
            format: "CSV"
            columns_description:
              "quality": "hap.py quality threshold (QQ)"
              "recall": "Recall at threshold"
              "precision": "Precision at threshold"
              "f1": "F1 score at threshold"

      - data_collection_tag: "multiqc_data"
        description: "MultiQC report for the small-variant (SNP/INDEL) run — bcftools stats + hap.py."
        config:
          type: "MultiQC"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: "multiqc/multiqc_data/multiqc.parquet"
          dc_specific_properties:
            s3_location: null
            modules:
              - "general_stats"
              - "bcftools"
              - "happy"
              - "variant_calling_summary"
            plots:
              bcftools:
                - "Variant Substitution Types"
                - "Indel Distribution"
              happy:
                - "SNP"
                - "INDEL"
