version: 1
main_dashboard:
  title: Variant Benchmarking — Somatic indels
  subtitle: "analysis=somatic · variant_type=indel — som.py / rtg-tools per caller (SEQC2 / HCC1395)"
  project_tag: Variant Benchmarking — Somatic indels
  main_tab_name: Benchmark
  tab_icon: mdi:target-arrow
  tab_icon_color: pink
  workflow_system: none
  components:
  - component_type: text
    tag: indel-bench-intro
    title: Somatic indel benchmarking
    order: 1
    alignment: left
    body: >
      How well does each somatic caller recover the SEQC2 truth set? Somatic
      indels are hard — recall is low, so callsets sit to the left of the
      precision–recall benchmark. The confusion matrix exposes over-calling and
      the precision / recall ± 95% CI forest plots surface som.py's intervals.
    workflow_tag: variantbenchmarking
    data_collection_tag: sompy_summary
    layout: {x: 0, y: 0, w: 8, h: 2}

  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: sompy_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: f1
    column_type: float64
    display: {icon_name: 'mdi:trophy', icon_color: '#E91E63', title_color: '#E91E63'}
    tag: indel-card-f1
    title: F1
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: sompy_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: precision
    column_type: float64
    display: {icon_name: 'mdi:bullseye-arrow', icon_color: '#00897B', title_color: '#00897B'}
    tag: indel-card-prec
    title: Precision
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: sompy_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: recall
    column_type: float64
    display: {icon_name: 'mdi:magnet', icon_color: '#F2A93B', title_color: '#F2A93B'}
    tag: indel-card-recall
    title: Recall
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    workflow_tag: variantbenchmarking
    data_collection_tag: sompy_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: tp
    column_type: int64
    display: {icon_name: 'mdi:check-decagram', icon_color: '#7E57C2', title_color: '#7E57C2'}
    tag: indel-card-tp
    title: True positives
    layout: {x: 6, y: 2, w: 2, h: 2}

  - component_type: interactive
    workflow_tag: variantbenchmarking
    data_collection_tag: sompy_summary
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display: {title_size: md, custom_color: '#E91E63', icon_name: 'mdi:tools'}
    tag: indel-filter-caller
    index: indel-caller-filter
    title: Caller
    layout: {x: 0, y: 4, w: 1, h: 2}

  - component_type: advanced_viz
    workflow_tag: variantbenchmarking
    data_collection_tag: sompy_summary
    use: sompy/pr_scatter
    config: {support_col: tp}
    tag: indel-av-pr
    title: Precision–recall benchmark
    description: Each point is a caller; size = true positives, colour = F1, dotted lines = equal-F1 contours.
    layout: {x: 0, y: 4, w: 5, h: 7}
  - component_type: figure
    workflow_tag: variantbenchmarking
    data_collection_tag: sompy_summary
    visu_type: scatter
    dict_kwargs: {x: f1, y: caller, color: f1, size: f1, size_max: 26, color_continuous_scale: Sunsetdark}
    tag: indel-fig-f1
    title: F1 by caller
    description: Ranked accuracy per caller (x-axis zoomed to the data).
    title_size: h3
    layout: {x: 5, y: 4, w: 3, h: 7}

  - component_type: advanced_viz
    workflow_tag: variantbenchmarking
    data_collection_tag: sompy_summary
    use: sompy/confusion
    tag: indel-av-confusion
    title: Confusion matrix
    description: TP / FP / FN per caller — over-calling callers (e.g. freebayes) dominate the FP row.
    layout: {x: 0, y: 11, w: 8, h: 4}

  - component_type: figure
    workflow_tag: variantbenchmarking
    data_collection_tag: sompy_regions
    visu_type: heatmap
    dict_kwargs: {x: af_bin, y: caller, z: f1, histfunc: avg, color_continuous_scale: Sunsetdark}
    tag: indel-fig-afheatmap
    title: F1 by caller × allele-fraction bin
    description: Where each caller's accuracy concentrates across allele-fraction strata.
    title_size: h3
    layout: {x: 0, y: 15, w: 8, h: 4}

  - component_type: advanced_viz
    workflow_tag: variantbenchmarking
    data_collection_tag: sompy_summary
    use: sompy/precision_ci
    config: {metric_name: Precision}
    tag: indel-av-precision-ci
    title: Precision ± 95% CI
    description: Point estimate + binomial confidence interval per caller (som.py).
    layout: {x: 0, y: 19, w: 4, h: 5}
  - component_type: advanced_viz
    workflow_tag: variantbenchmarking
    data_collection_tag: sompy_summary
    use: sompy/recall_ci
    config: {metric_name: Recall}
    tag: indel-av-recall-ci
    title: Recall ± 95% CI
    description: Point estimate + binomial confidence interval per caller (som.py).
    layout: {x: 4, y: 19, w: 4, h: 5}

  - component_type: table
    workflow_tag: variantbenchmarking
    data_collection_tag: sompy_summary
    row_selection_enabled: false
    tag: indel-table-sompy
    title: som.py summary
    description: Per-caller TP / FP / FN, precision / recall / F1 with 95% confidence intervals.
    title_size: h3
    layout: {x: 0, y: 24, w: 8, h: 5}

tabs:
- title: MultiQC
  subtitle: MultiQC report — somatic indel run (bcftools stats · som.py)
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  workflow_system: none
  components:
  - component_type: text
    tag: indel-qc-intro
    title: MultiQC — somatic indel run
    order: 1
    alignment: left
    body: >
      The pipeline's MultiQC report for the somatic indel run: bcftools general
      statistics per callset, som.py combined / indel / SNV panels, and variant
      substitution distributions.
    workflow_tag: variantbenchmarking
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}

  - component_type: interactive
    workflow_tag: variantbenchmarking
    data_collection_tag: multiqc_data
    interactive_component_type: MultiSelect
    column_name: sample
    display: {title_size: md, custom_color: '#26A69A', icon_name: 'mdi:tools'}
    tag: indel-qc-filter-sample
    index: indel-qc-sample-filter
    title: Sample
    layout: {x: 0, y: 2, w: 1, h: 2}

  - component_type: multiqc
    workflow_tag: variantbenchmarking
    data_collection_tag: multiqc_data
    selected_module: general_stats
    selected_plot: general_stats
    tag: indel-qc-general-stats
    title: General statistics
    layout: {x: 0, y: 2, w: 8, h: 4}

  - component_type: multiqc
    workflow_tag: variantbenchmarking
    data_collection_tag: multiqc_data
    selected_module: sompy
    selected_plot: Combined
    tag: indel-qc-sompy-combined
    title: som.py — combined
    layout: {x: 0, y: 6, w: 4, h: 5}

  - component_type: multiqc
    workflow_tag: variantbenchmarking
    data_collection_tag: multiqc_data
    selected_module: sompy
    selected_plot: Indel
    tag: indel-qc-sompy-indel
    title: som.py — indel
    layout: {x: 4, y: 6, w: 4, h: 5}

  - component_type: multiqc
    workflow_tag: variantbenchmarking
    data_collection_tag: multiqc_data
    selected_module: sompy
    selected_plot: SNV
    tag: indel-qc-sompy-snv
    title: som.py — SNV
    layout: {x: 0, y: 11, w: 8, h: 5}

  - component_type: multiqc
    workflow_tag: variantbenchmarking
    data_collection_tag: multiqc_data
    selected_module: bcftools
    selected_plot: Variant Substitution Types
    tag: indel-qc-bcftools-subtypes
    title: bcftools — variant substitution types
    layout: {x: 0, y: 16, w: 8, h: 5}
