    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: ea-map-filter-dup
    index: ea-map-dup-range
    section: Mapping scope
    group: Mapping scope
    workflow_tag: eager
    data_collection_tag: picard_markduplicates_metrics
    interactive_component_type: RangeSlider
    column_name: percent_duplication
    column_type: float64
    show_histogram: true
    display: {title_size: md, custom_color: '#5C6BC0', icon_name: 'mdi:set-merge'}
