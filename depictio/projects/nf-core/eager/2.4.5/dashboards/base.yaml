# ============================================================================
# Damage authentication
# ============================================================================
- title: Damage authentication
  subtitle: The C>T / G>A misincorporation signature at the read ends, the ancient-DNA authenticity read
  tab_order: 4
  tab_icon: mdi:dna
  tab_icon_color: red
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  grid_sections:
  - name: Misincorporation signature
    icon: mdi:dna
    color: red
    description: Substitution frequency by distance from the read end, from DamageProfiler
  components:
  - component_type: text
    tag: ea-dmg-intro
    section: Misincorporation signature
    title: Does this library look ancient?
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [DamageProfiler](https://github.com/Integrative-Transcriptomics/DamageProfiler)
      counts, at each position from a read end, how often the reference base
      was read as something else. Authentic ancient DNA shows C>T
      substitutions rising sharply at the 5' end and the complementary G>A
      rise at the 3' end, both well above the flat background every other
      substitution type traces out. A run with no such rise, on fresh
      material, is not damage, it is contamination or a library-prep
      artefact.
    workflow_tag: eager
    data_collection_tag: damageprofiler_misincorporation
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: ea-dmg-av-profile
    section: Misincorporation signature
    workflow_tag: eager
    data_collection_tag: damageprofiler_misincorporation
    use: damageprofiler/misincorporation
    config: {}
    title: Misincorporation profile, 5' and 3'
    description: C>T and G>A frequency by position from the read end, every other substitution pooled as the background it is read against.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: figure
    tag: ea-dmg-fig-line
    index: ea-dmg-fig-line
    section: Misincorporation signature
    workflow_tag: eager
    data_collection_tag: damageprofiler_misincorporation
    use: damageprofiler/misincorporation
    visu_type: line
    dict_kwargs: {x: position, y: frequency, color: base_change}
    title: Misincorporation frequency by position
    description: One line per substitution class, pooled across libraries and read ends.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 6}
  - component_type: card
    tag: ea-dmg-card-ct
    index: ea-dmg-card-ct
    section: Misincorporation signature
    workflow_tag: eager
    data_collection_tag: damageprofiler_misincorporation
    use: damageprofiler/misincorporation
    aggregation: max
    secondary_layout: top_n
    breakdown_col: base_change
    top_n_count: 3
    column_name: frequency
    column_type: float64
    display: {icon_name: 'mdi:dna', icon_color: '#EF5350', title_color: '#EF5350', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Peak substitution frequency
    layout: {x: 0, y: 15, w: 2, h: 2}
  - component_type: multiqc
    tag: ea-dmg-mqc-5p
    section: Misincorporation signature
    workflow_tag: eager
    data_collection_tag: multiqc_data
    selected_module: damageprofiler
    selected_plot: 5P misincorporation plot
    use: multiqc/damageprofiler
    title: 5' misincorporation (MultiQC)
    title_size: sm
    title_align: left
    layout: {x: 2, y: 15, w: 3, h: 5}
  - component_type: multiqc
