    section: Duplication at a glance
    tag: ea-dup-card-rate
    index: cx-card-rate
    title: Duplication rate
    description: Share of the reads checked that Picard flagged as PCR duplicates.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: picard_markduplicates_metrics
    use: picard/markduplicates_metrics
    aggregation: sum
    column_name: unpaired_reads_examined
    column_type: int64
    secondary_layout: attrition
    attrition_cols: [reads_after_dedup]
    display:
      icon_name: mdi:magnify
      icon_color: blue
      caption: checked, then kept as unique
    section: Duplication at a glance
    tag: ea-dup-card-examined
    index: cx-card-examined
    title: Reads checked
    description: Unpaired and collapsed reads Picard examined, and those kept as unique.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: picard_markduplicates_metrics
