    icon: mdi:counter
    color: green
    description: The on-target share before and after filtering, and the reads behind it
  - name: Before and after filtering
    icon: mdi:chart-scatter-plot
    color: green
    description: Each library's endogenous DNA before against after the filter
  - name: Alignment
    icon: mdi:chart-bar
    color: green
    description: Reads placed before and after eager's mapping-quality filter
  - name: Off-target screen
    icon: mdi:bacteria-outline
    color: gray
    description: MaltExtract and Kraken reports, when the run enabled a metagenomic screen
    collapsed: true
  - name: Endogenous tables
    icon: mdi:table
    color: gray
    description: Endogenous DNA and flagstat counts per library
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [endorS.py](https://github.com/aidaanva/endorS.py) divides the reads that map to the
      reference by the reads the mapper was given, before and after the quality filter and
      deduplication. A low share is normal for ancient extracts, where most DNA is
      environmental; the gap between the two is the on-target signal filtering lost.
    tag: ea-endo-intro
    index: endo-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: endorspy_endogenous
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: endogenous_dna_post
    column_type: float64
    display:
      icon_name: mdi:check-decagram
      custom_color: green
    section: Endogenous filters
    group: Endogenous DNA
    tag: ea-endo-filter-post
    index: endo-post-range
    title: Endogenous DNA after filtering
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: endorspy_endogenous
    use: endorspy/endogenous
    aggregation: median
    column_name: endogenous_dna
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:dna
      icon_color: green
      caption: median % per library, with its spread
      decimals: 1
    section: Endogenous DNA at a glance
    tag: ea-endo-card-raw
    index: endo-card-raw
    title: Endogenous DNA
    description: Share of the reads given to the mapper that map to the reference, per library.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: endorspy_endogenous
    use: endorspy/endogenous
    aggregation: median
    column_name: endogenous_dna_post
    column_type: float64
    secondary_layout: coverage
    coverage_max: 100
    display:
      icon_name: mdi:check-decagram
      icon_color: teal
      caption: median % of reads, after filtering
      decimals: 1
    section: Endogenous DNA at a glance
    tag: ea-endo-card-post
    index: endo-card-post
    title: After filtering
    description: The same share once the quality filter and deduplication have run.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: endorspy_endogenous
    use: endorspy/endogenous
    aggregation: median
    column_name: endogenous_dna_loss
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:trending-down
      icon_color: red
      caption: median points per library, distribution
      decimals: 1
    section: Endogenous DNA at a glance
    tag: ea-endo-card-loss
    index: endo-card-loss
    title: Lost to filtering
    description: Percentage points of endogenous DNA lost between the two measures.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # Stage-scoped: flagstat has one row per library and filter stage, so an
  # unscoped sum would count every read twice. No stage filter on this tab:
  # it would leave this card without its stage.
  - component_type: card
    workflow_tag: eager
    data_collection_tag: samtools_flagstat
    use: samtools/flagstat
    aggregation: sum
    column_name: total_reads
    column_type: int64
    filter_expr: col('stage') == 'pre-filter'
    secondary_layout: attrition
    attrition_cols: [mapped_reads]
    display:
      icon_name: mdi:counter
      icon_color: indigo
      caption: given to the mapper, then mapped
    section: Endogenous DNA at a glance
    tag: ea-map-card-input
    index: endo-card-input
    title: Reads to the mapper
    description: flagstat totals before the mapping-quality filter; what did not map is the off-target share.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Library ids label nothing on a third of a row: the legend names them on the
  # tab, the Overview highlight hides it.
  - component_type: advanced_viz
    workflow_tag: eager
    data_collection_tag: endorspy_endogenous
    use: endorspy/endogenous_pre_post
    config:
      x_title: Endogenous DNA before filtering (%)
      y_title: Endogenous DNA after filtering (%)
      reference_line: diagonal
      top_n_labels: 0
      marker_size: 14
      selection_enabled: true
      selection_column: sample
    section: Before and after filtering
    tag: ea-endo-av-prepost
    index: endo-pre-post
    title: Endogenous DNA, before against after filtering
    description: >-
      How much on-target signal does filtering lose? Each point is a library: endogenous DNA before
      the quality filter and deduplication on x, after them on y, both in percent.

      How to read: a point on the dashed diagonal lost nothing to filtering, and the further below it,
      the more on-target signal the filter and deduplication removed. A low share overall is common
      for ancient extracts, where most DNA is environmental; open [Complexity](tab:Complexity) for a
      library far below the line.

      Lines and annotations: the dashed diagonal, labelled x = y, is the identity line over the range
      of the data. It is a geometric reference where before equals after, not a quality cut-off, and
      no threshold is drawn.

      Sources: endorS.py, https://github.com/aidaanva/endorS.py; nf-core/eager 2.4.5 output
      documentation, https://nf-co.re/eager/2.4.5/docs/output
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: eager
    data_collection_tag: samtools_flagstat
    use: samtools/flagstat
    visu_type: bar
    dict_kwargs:
      x: sample
      y: mapped_reads
      color: stage
      barmode: group
      labels: {sample: '', mapped_reads: Mapped reads, stage: Stage}
    section: Alignment
    tag: ea-map-fig-bar
    index: endo-mapped-bar
    title: Mapped reads before and after the filter
    description: >-
      How many reads place, and how many survive the mapping-quality filter? One group of bars per
      library: the reads samtools flagstat flags as mapped, before the filter and after it.

      How to read: the gap between the two bars of a library is what the mapping-quality filter
      removed, and a small gap means the reads placed unambiguously. Compare the gaps rather than the
      heights, since a deeper library has taller bars.

      Lines and annotations: no reference line or cut-off is drawn; the two colours are the pre-filter
      and post-filter stages.

      Source: samtools flagstat manual, http://www.htslib.org/doc/samtools-flagstat.html
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: maltextract_heatmap
    row_selection_enabled: false
    section: Off-target screen
    tag: ea-meta-table-maltextract
    index: endo-table-maltextract
    title: MaltExtract authentication overview
    description: >-
      The HOPS summary per taxon and library, with the evidence levels MaltExtract assigned. It is
      present only when the run enabled the metagenomic screen.

      How to read: a taxon with a high evidence level in a library is a lead on what the extract
      holds, not a verdict. Confirm it against the damage and fragment length of the reads assigned to
      that taxon.

      Source: HOPS paper (Genome Biology 2019), doi:10.1186/s13059-019-1903-0
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: kraken_report
    row_selection_enabled: false
    section: Off-target screen
    tag: ea-meta-table-kraken
    index: endo-table-kraken
    title: Kraken classification
    description: >-
      The merged Kraken report: one row per taxon, with the reads assigned to it in each library. It
      is present only when the run enabled the Kraken screen.

      How to read: sort a library's column to see which taxa dominate its reads. A classification is a
      lead, not a verdict, since Kraken assigns reads by exact k-mer matches to a database.

      Source: Kraken paper (Genome Biology 2014), doi:10.1186/gb-2014-15-3-r46
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: endorspy_endogenous
    use: endorspy/endogenous
    row_selection_enabled: true
    row_selection_column: sample
    section: Endogenous tables
    tag: ea-endo-table
    index: endo-table
    title: Endogenous DNA per library
    description: >-
      Endogenous DNA per library as endorS.py reports it: before filtering, after the quality filter
      and deduplication, the drop between them in percentage points, and the off-target remainder.

      How to read: a high value before and after is the good result, and a large drop means filtering
      removed much of the on-target signal. The off-target share is 100 minus the value before
      filtering, the part a metagenomic screen would work on.

      Sources: endorS.py, https://github.com/aidaanva/endorS.py; nf-core/eager 2.4.5 output
      documentation, https://nf-co.re/eager/2.4.5/docs/output
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: samtools_flagstat
    use: samtools/flagstat
    row_selection_enabled: true
    row_selection_column: sample
    section: Endogenous tables
    tag: ea-map-table
    index: endo-table-flagstat
    title: Flagstat, pre- and post-filter
    description: >-
      One row per library and filter stage (pre-filter and post-filter) from samtools flagstat, with
      total, mapped, duplicate and properly-paired counts.

      How to read: compare the two rows of a library to see what the mapping-quality filter removed.
      The mapped share of the pre-filter row is the on-target fraction of the reads given to the
      mapper.

      Source: samtools flagstat manual, http://www.htslib.org/doc/samtools-flagstat.html
    layout: {x: 0, y: 6, w: 8, h: 6}
- title: Complexity
  subtitle: How many distinct molecules does each library hold?
  tab_group: Ancient DNA
  tab_order: 5
  tab_icon: mdi:content-duplicate
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Complexity filters
    icon: mdi:filter-variant
    color: violet
    description: Narrow the libraries by their Picard duplication
  grid_sections:
  - name: Duplication at a glance
    icon: mdi:counter
    color: violet
    description: PCR duplicates removed, and the unique reads left
  - name: Screening plane
    icon: mdi:chart-scatter-plot
    color: violet
    description: Endogenous DNA against clonality, the plane a library is screened on
  - name: Duplication and depth
    icon: mdi:chart-line
    color: violet
    description: Duplication against what survived it, and what more sequencing would buy
  - name: Duplication table
    icon: mdi:table
    color: gray
    description: Duplication metrics per library
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [Picard MarkDuplicates](https://broadinstitute.github.io/picard/) flags PCR copies on
      the filtered alignments, and [preseq](http://smithlabresearch.org/software/preseq/)
      extrapolates how many new molecules more sequencing would find. A library worth
      sequencing deeper is high in endogenous DNA and low in duplicates; a flattened curve
      means the extract, not the sequencing, is the limit.
    tag: ea-cx-intro
    index: cx-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: picard_markduplicates_metrics
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: percent_duplication
    column_type: float64
    display:
      icon_name: mdi:content-duplicate
      custom_color: violet
    section: Complexity filters
    group: Duplication
    tag: ea-cx-filter-dup
    index: cx-dup-range
    title: Picard duplication
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: picard_markduplicates_metrics
    use: picard/markduplicates_metrics
    aggregation: median
    column_name: percent_duplication
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:content-duplicate
      icon_color: violet
      caption: median per library, with its spread
      format: percent
    section: Duplication at a glance
    tag: ea-dup-card-rate
    index: cx-card-rate
    title: Duplication rate
    description: Share of the reads checked that Picard flagged as PCR duplicates.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: picard_markduplicates_metrics
    use: picard/markduplicates_metrics
    aggregation: sum
    column_name: unpaired_reads_examined
    column_type: int64
    secondary_layout: attrition
    attrition_cols: [reads_after_dedup]
    display:
      icon_name: mdi:magnify
      icon_color: blue
      caption: checked, then kept as unique
    section: Duplication at a glance
    tag: ea-dup-card-examined
    index: cx-card-examined
    title: Reads checked
    description: Unpaired and collapsed reads Picard examined, and those kept as unique.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: picard_markduplicates_metrics
    use: picard/markduplicates_metrics
    aggregation: sum
    column_name: duplicate_reads
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:delete-outline
      icon_color: red
      caption: per library, distribution
    section: Duplication at a glance
    tag: ea-dup-card-dups
    index: cx-card-dups
    title: Duplicates removed
    description: PCR duplicates Picard removed over the libraries in view.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: picard_markduplicates_metrics
    use: picard/markduplicates_metrics
    aggregation: sum
    column_name: reads_after_dedup
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:check-decagram
      icon_color: teal
      caption: per library, with their spread
    section: Duplication at a glance
    tag: ea-dup-card-kept
    index: cx-card-kept
    title: Unique reads kept
    description: Reads left after deduplication, the molecules every later step works on.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: eager
    data_collection_tag: eager_library_qc
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: clonality_pct
      y_col: endogenous_dna
      label_col: sample
      color_col: sample
      size_col: mean_coverage
      x_title: Clonality, Picard duplicates (%)
      y_title: Endogenous DNA (%)
      top_n_labels: 0
      marker_size: 14
      selection_enabled: true
      selection_column: sample
    section: Screening plane
    tag: ea-dup-av-endo-clonality
    index: cx-screening-plane
    title: Endogenous DNA against clonality
    description: >-
      Which libraries are worth sequencing deeper? Each point is a library: clonality, the share of
      reads Picard flags as PCR duplicates, on x and endogenous DNA on y, with marker size the mean
      coverage already reached.

      How to read: high and to the left is the good picture, since much of the library is the organism
      and few reads are copies, so more sequencing buys new molecules. To the right, copies dominate
      and more sequencing returns the same molecules; low down, most of the extract is not the
      organism. The complexity curve below shows how much a library would still yield.

      Lines and annotations: no zone, line or cut-off is drawn. High, low, left and right are relative
      to the other libraries in view, not validated limits.

      Sources: Picard DuplicationMetrics definitions,
      https://broadinstitute.github.io/picard/picard-metric-definitions.html; endorS.py,
      https://github.com/aidaanva/endorS.py
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: eager
    data_collection_tag: picard_markduplicates_metrics
    use: picard/duplication_vs_depth
    config:
      x_title: Unique reads kept
      y_title: Duplication rate
      top_n_labels: 0
      marker_size: 14
      selection_enabled: true
      selection_column: sample
    section: Duplication and depth
    tag: ea-dup-av-scatter
    index: cx-dup-depth
    title: Duplication against what survived it
    description: >-
      How much of the depth is PCR copies? Each point is a library: the unique reads kept after
      deduplication on x, the Picard duplication rate on y, marker size the duplicates removed.

      How to read: low and to the right is the good picture, many unique reads with few copies. A
      library high on this plane paid for its depth in PCR copies, not molecules, and the complexity
      curve beside it shows what more sequencing would add.

      Lines and annotations: no zone or cut-off is drawn; positions are relative to the other
      libraries in view.

      Source: Picard DuplicationMetrics definitions,
      https://broadinstitute.github.io/picard/picard-metric-definitions.html
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: eager
    data_collection_tag: preseq_complexity_curve
    use: preseq/complexity_curve
    config:
      series_col: sample
      x_col: total_reads
      y_col: expected_distinct
      lower_col: lower_ci
      upper_col: upper_ci
      x_title: Total reads
      y_title: Expected distinct molecules
    section: Duplication and depth
    tag: ea-complex-av-curve
    index: cx-complexity-curve
    title: Library complexity curve
    description: >-
      Would more sequencing find new molecules? One curve per library: the number of distinct
      molecules preseq expects at each sequencing depth, extrapolated from the depth already
      sequenced.

      How to read: a curve still rising steeply means more sequencing would find new molecules. A
      curve that has flattened means the extract, not the sequencing, is the limit and more reads
      would return copies; at the same depth, the higher curve is the library with more distinct
      molecules.

      Lines and annotations: no confidence band, reference line or cut-off is drawn. preseq can report
      a confidence interval, but eager's run writes the expected count only.

      Note: the right-hand part of a curve is a prediction beyond the sequenced depth, not a
      measurement.

      Sources: preseq paper (Nature Methods 2013), doi:10.1038/nmeth.2375; preseq,
      http://smithlabresearch.org/software/preseq/
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: picard_markduplicates_metrics
    use: picard/markduplicates_metrics
    row_selection_enabled: true
    row_selection_column: sample
    section: Duplication table
    tag: ea-dup-table
    index: cx-table
    title: Duplication metrics per library
    description: >-
      Duplication metrics per library from Picard MarkDuplicates: reads examined, duplicates flagged
      and what is left after removal.

      How to read: a high duplication rate with few reads left means a library of low complexity;
      compare it with its curve on this tab. The Picard duplication slider in the filter panel narrows
      the libraries by the rate in this table.

      Source: Picard DuplicationMetrics definitions,
      https://broadinstitute.github.io/picard/picard-metric-definitions.html
    layout: {x: 0, y: 0, w: 8, h: 6}
