    column_name: mean_length
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: orange
      caption: bp per library, with its spread
      decimals: 1
    section: Damage at a glance
    tag: ea-auth-card-length
    index: auth-card-length
    title: Fragment length
    description: Mean length of each library's mapped fragments.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: damageprofiler_authenticity
    use: damageprofiler/authenticity
    aggregation: median
    column_name: fraction_under_70bp
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:content-cut
      icon_color: violet
      caption: share per library, distribution
      format: percent
    section: Damage at a glance
    tag: ea-auth-card-short
    index: auth-card-short
    title: Under {SHORT_FRAGMENT_BP} bp
    description: Share of mapped fragments shorter than the short-fragment cut-off.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: eager
    data_collection_tag: damageprofiler_authenticity
    use: damageprofiler/authenticity_plane
    config:
      x_title: Mean fragment length (bp)
      y_title: Deamination at the first 5 prime base
      top_n_labels: 0
      marker_size: 16
      selection_enabled: true
      selection_column: sample
    section: Length and damage
    tag: ea-auth-av-plane
    index: auth-plane
    title: The ancient-DNA plane
    description: >-
      Is the DNA both short and damaged, as ancient DNA is? Each point is a library: mean fragment
      length on x, C to T deamination at the first 5 prime base on y, marker size the fragments
      counted.

      How to read: short and damaged (left and up) is the ancient-DNA picture. Long and undamaged is a
      modern contaminant, and short but undamaged is usually over-sheared modern DNA; neither signal
      is conclusive alone. Compare libraries of the same UDG treatment, since the treatment reduces
      the damage.

      Lines and annotations: no zone, line or cut-off is drawn, so the plane shows each library
      relative to the others, not a verdict.

      Sources: DamageProfiler paper (Bioinformatics 2021), doi:10.1093/bioinformatics/btab190; Briggs
      and colleagues (PNAS 2007), doi:10.1073/pnas.0704665104; nf-core/eager 2.4.5 output
      documentation, https://nf-co.re/eager/2.4.5/docs/output
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: eager
    data_collection_tag: damageprofiler_lgdistribution
    use: damageprofiler/fragment_length_profile
    config:
      x_title: Fragment length (bp)
      y_title: Share of the library's reads
      selection_enabled: true
      selection_column: sample
    section: Length and damage
    tag: ea-len-av-profile
    index: auth-length-profile
    title: Fragment length distribution
    description: >-
      How long are the fragments? One curve per library and strand: the share of the library's reads
      at each fragment length, normalised so libraries of any depth compare.

      How to read: ancient DNA is fragmented, so a curve that peaks at short lengths is the expected
      picture, and a curve weighted to long fragments looks like a modern library. Read it with the
      ancient-DNA plane beside it, since long fragments with no damage point at contamination.

      Sources: DamageProfiler paper (Bioinformatics 2021), doi:10.1093/bioinformatics/btab190; Briggs
      and colleagues (PNAS 2007), doi:10.1073/pnas.0704665104
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: eager
    data_collection_tag: damageprofiler_misincorporation
    use: damageprofiler/misincorporation
    config: {}
    section: Misincorporation
    tag: ea-dmg-av-profile
    index: auth-misincorporation
    title: Misincorporation profile, both read ends
    description: >-
      Does the damage sit at the read ends? Two panels, the 5 prime and the 3 prime end of the reads,
      show the frequency of each substitution by distance from the read end, one line per library and
      substitution.

      How to read: deamination shows as C to T rising toward the 5 prime end and, on double-stranded
      libraries, G to A rising toward the 3 prime end, while the other substitutions stay flat. Flat C
      to T and G to A curves mean no damage, as in a modern library; a UDG-treated library keeps its
      damage at the terminal base only.

      Lines and annotations: C to T and G to A are drawn as thick solid lines and every other
      substitution as a thin dotted grey line, so the background reads as the baseline. No reference
      line or cut-off is drawn.

      Sources: DamageProfiler paper (Bioinformatics 2021), doi:10.1093/bioinformatics/btab190; Briggs
      and colleagues (PNAS 2007), doi:10.1073/pnas.0704665104
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: nuclear_contamination
    row_selection_enabled: false
    section: Contamination
    tag: ea-contam-table-nuclear
    index: auth-table-nuclear
    title: Nuclear contamination (ANGSD)
    description: >-
      X-chromosome contamination per library from ANGSD, by two estimators with their errors. It
      applies to male individuals only and is present only when the run enabled it.

      How to read: a low estimate with a small error is the good result; read each estimate against
      its own error before judging a library. No pass limit is applied here.

      Sources: ANGSD paper (BMC Bioinformatics 2014), doi:10.1186/s12859-014-0356-4; nf-core/eager
      2.4.5 output documentation, https://nf-co.re/eager/2.4.5/docs/output
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: mtnucratio
    row_selection_enabled: false
    section: Contamination
    tag: ea-contam-table-mtnuc
    index: auth-table-mtnuc
    title: Mitochondrial to nuclear ratio
    description: >-
      The mitochondrial to nuclear read ratio per library from MTNucRatio. It is present only when the
      run enabled it.

      How to read: compare the libraries within the run; one far above the others is a lead to check,
      not a verdict.

      Note: no threshold is applied here, and the ratio alone does not say whether a library is
      contaminated.

      Source: MTNucRatio, https://github.com/apeltzer/MTNucRatioCalculator
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: damageprofiler_authenticity
    use: damageprofiler/authenticity
    row_selection_enabled: true
    row_selection_column: sample
    section: Authentication tables
    tag: ea-auth-table
    index: auth-table
    title: Authenticity summary per library
    description: >-
      The authenticity summary per library from DamageProfiler: C to T at the first 5 prime base, G to
      A at the first 3 prime base, the background rate of every other substitution at those positions,
      and the fragment lengths.

      How to read: terminal damage clearly above the background, with short fragments, is the
      ancient-DNA picture; the ancient-DNA plane above draws the same two signals. The short-fragment
      column counts the fragments below the short-fragment cut-off set when the template is added (70
      bp by default).

      Note: that cut-off is a display choice of this dashboard, not a validated limit.

      Sources: DamageProfiler paper (Bioinformatics 2021), doi:10.1093/bioinformatics/btab190; Briggs
      and colleagues (PNAS 2007), doi:10.1073/pnas.0704665104
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: damageprofiler_misincorporation
    use: damageprofiler/misincorporation
    row_selection_enabled: true
    row_selection_column: sample
    section: Authentication tables
    tag: ea-dmg-table
    index: auth-table-misincorporation
    title: Misincorporation table
    description: >-
      The misincorporation profile as a table: one row per library, read end, position and
      substitution class, with its frequency.

      How to read: filter on the read end and the distance from it to list the positions the profile
      above draws. The C to T and G to A rows near the 5 prime and 3 prime ends carry the damage
      signal.

      Source: DamageProfiler paper (Bioinformatics 2021), doi:10.1093/bioinformatics/btab190
    layout: {x: 0, y: 6, w: 8, h: 6}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: damageprofiler_lgdistribution
    use: damageprofiler/lgdistribution
    row_selection_enabled: true
    row_selection_column: sample
    section: Authentication tables
    tag: ea-len-table
    index: auth-table-length
    title: Fragment length table
    description: >-
      The fragment length curves as a table: one row per library, strand and length, with the reads at
      that length and their share.

      How to read: filter on the strand or the length range to list the fragments the curve draws. The
      share column is what makes libraries of different depth comparable.

      Source: DamageProfiler paper (Bioinformatics 2021), doi:10.1093/bioinformatics/btab190
    layout: {x: 0, y: 12, w: 8, h: 6}
# ============================================================================
# Genome
# ============================================================================
- title: Coverage
  subtitle: How deep and how evenly is the reference covered?
  tab_group: Genome
  tab_order: 7
  tab_icon: mdi:waves
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Coverage filters
    icon: mdi:filter-variant
    color: blue
    description: Narrow the per-contig tiles by relative depth or contig length
  grid_sections:
  - name: Coverage at a glance
    icon: mdi:counter
    color: blue
    description: Depth per library and per contig, and the share of the reference seen
  - name: Per-contig depth
    icon: mdi:chart-scatter-plot
    color: blue
    description: Depth per reference sequence relative to the library mean, what a sex call reads
  - name: Depth distribution
    icon: mdi:chart-bell-curve
    color: blue
    description: How the depth is spread across the reference
  - name: Sex determination
    icon: mdi:account-group-outline
    color: gray
    description: Sex.DetERRmine's relative X and Y coverage, when the run enabled it
    collapsed: true
  - name: Coverage tables
    icon: mdi:table
    color: gray
    description: Per-contig depth and the genome fraction by depth threshold
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [Qualimap](http://qualimap.conesalab.org) BamQC depth per reference sequence, relative
      to each library's own mean: an even library sits on 1, the mitochondrion far above it, a
      sex chromosome near 0.5 or 1. The depth curves say whether a shallow library covers the
      genome thinly or piles up on a fraction of it.
    tag: ea-cov-intro
    index: cov-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_per_contig
    interactive_component_type: RangeSlider
    column_name: relative_coverage
    column_type: float64
    display:
      icon_name: mdi:scale-balance
      custom_color: cyan
    section: Coverage filters
    group: Contigs
    tag: ea-sex-filter-relative
    index: cov-relative-range
    title: Relative depth
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_per_contig
    interactive_component_type: RangeSlider
    column_name: length
    column_type: int64
    display:
      icon_name: mdi:ruler
      custom_color: indigo
    section: Coverage filters
    group: Contigs
    tag: ea-sex-filter-length
    index: cov-length-range
    title: Contig length
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: qualimap_bamqc_genome_results
    use: qualimap/bamqc_genome_results
    aggregation: median
    column_name: mean_coverage
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:waves
      icon_color: blue
      caption: median X per library, with its spread
      decimals: 2
    section: Coverage at a glance
    tag: ea-cov-card-depth
    index: cov-card-depth
    title: Mean coverage
    description: Mean depth over the whole reference, per library.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: qualimap_genome_fraction_coverage
    use: qualimap/genome_fraction_coverage
    aggregation: median
    column_name: genome_fraction_pct
    column_type: float64
    filter_expr: col('min_coverage') == 1
    secondary_layout: coverage
    coverage_max: 100
    display:
      icon_name: mdi:percent-outline
      icon_color: indigo
      caption: median % of the reference at 1X
      decimals: 1
    section: Coverage at a glance
    tag: ea-cov-card-fraction
    index: cov-card-fraction
    title: Genome covered
    description: Share of the reference each library covers at least once.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: qualimap_genome_fraction_coverage
    use: qualimap/genome_fraction_coverage
    aggregation: median
    column_name: genome_fraction_pct
    column_type: float64
    filter_expr: col('min_coverage') == 2
    secondary_layout: coverage
    coverage_max: 100
    display:
      icon_name: mdi:layers-triple-outline
      icon_color: teal
      caption: median % of the reference at 2X
      decimals: 1
    section: Coverage at a glance
    tag: ea-cov-card-2x
    index: cov-card-2x
    title: Genome at 2X
    description: Share of the reference each library covers at least twice; how fast it falls from 1X shows how thin the coverage is.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # Chromosome-scale sequences only: an organelle sits tens of times above 1
  # and unplaced scaffolds scatter near 0, which leaves one bar of the
  # histogram for everything else.
  - component_type: card
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_per_contig
    use: qualimap/coverage_per_contig
    aggregation: median
    column_name: relative_coverage
    column_type: float64
    filter_expr: col('length') >= 1000000
    secondary_layout: histogram
    display:
      icon_name: mdi:scale-balance
      icon_color: cyan
      caption: sequences of 1 Mb or more, distribution
      decimals: 2
    section: Coverage at a glance
    tag: ea-sex-card-relative
    index: cov-card-relative
    title: Relative depth
    description: Depth of each sequence of 1 Mb or more over its library's mean; an even library sits on 1, a sex chromosome near 0.5.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Contig ids label nothing a reader looks up at this density.
  - component_type: advanced_viz
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_per_contig
    use: qualimap/contig_depth_scatter
    config:
      x_title: Contig length (bp)
      y_title: Depth relative to the library mean
      log_x: true
      log_y: true
      reference_line: horizontal
      reference_value: 1.0
      top_n_labels: 0
      selection_enabled: true
      selection_column: sample
    section: Per-contig depth
    tag: ea-sex-av-contig
    index: cov-contig-scatter
    title: Relative depth against contig length
    description: >-
      Which sequences are deeper or shallower than their library's average? Each point is one
      reference sequence of one library: its length on x and its depth relative to the library's mean
      depth on y, both on log scales, with marker size the bases mapped to it.

      How to read: long chromosomes cluster on 1, short contigs scatter, and an organelle sits far
      above. A sex chromosome present once in an individual whose autosomes are present twice sits
      near 0.5, which is the basis of a coverage-ratio sex call; the Sex.DetERRmine table below gives
      the call when the run enabled it.

      Lines and annotations: the dashed horizontal line at 1, labelled y = 1, marks a sequence whose
      depth equals its library's mean. It follows from how the y value is defined (sequence depth
      divided by library mean depth), not from a cut-off.

      Note: both axes are logarithmic, so a sequence with no mapped reads has no position and is not
      drawn.

      Sources: Qualimap 2 paper (Bioinformatics 2016), doi:10.1093/bioinformatics/btv566; Skoglund and
      colleagues (J Archaeol Sci 2013), doi:10.1016/j.jas.2013.07.004
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_histogram
    use: qualimap/depth_histogram_profile
    config:
      x_title: Depth (X)
      y_title: Share of the reference
      log_y: true
    section: Depth distribution
    tag: ea-dist-av-hist
    index: cov-depth-histogram
    title: Depth histogram
    description: >-
      How is the depth spread over the reference? One curve per library: the share of the reference at
      each read depth, on a logarithmic share axis.

      How to read: a shallow library peaks at the lowest depths and a deeper one shifts to the right.
      A narrow peak means even coverage, and a long right tail means parts of the reference piled up
      with reads; the genome fraction curve beside it reads how much of the reference passes a given
      depth.

      Source: Qualimap 2 paper (Bioinformatics 2016), doi:10.1093/bioinformatics/btv566
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: eager
    data_collection_tag: qualimap_genome_fraction_coverage
    use: qualimap/genome_fraction_profile
    config:
      x_title: Depth threshold (X)
      y_title: Genome covered (%)
      # The curve falls to 0 within a few X on a shallow library; a log axis
      # keeps that drop from filling a tenth of the plot.
      log_x: true
      selection_enabled: true
      selection_column: sample
    section: Depth distribution
    tag: ea-dist-av-fraction
    index: cov-genome-fraction
    title: Share of the reference covered at least X deep
    description: >-
      How much of the reference is covered at least X deep? One curve per library: the share of the
      reference covered at each depth threshold, on a logarithmic threshold axis.

      How to read: where a curve meets 1X is the share of the genome seen at all. A curve that stays
      high as the threshold grows belongs to an even library, and one that falls at once covers the
      genome thinly or piles its reads on a fraction of it.

      Source: Qualimap 2 paper (Bioinformatics 2016), doi:10.1093/bioinformatics/btv566
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: sexdeterrmine
    row_selection_enabled: false
    section: Sex determination
    tag: ea-sex-table-sexdet
    index: cov-table-sexdet
    title: Sex.DetERRmine
    description: >-
      Relative X and Y coverage per library with their errors, as Sex.DetERRmine reports them: the
      depth on each sex chromosome divided by the depth on the autosomes. It is present only when the
      run enabled it.

      How to read: compare the X and Y rates with their error bars; the table gives the rates and the
      call is left to the reader. A rate with a large error rests on little data.

      Note: Sex.DetERRmine estimates the rates from the depth at a given set of SNPs, so a library
      with few reads on that set has wide errors.

      Sources: Sex.DetERRmine, https://github.com/TCLamnidis/Sex.DetERRmine; Skoglund and colleagues
      (J Archaeol Sci 2013), doi:10.1016/j.jas.2013.07.004
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_per_contig
    use: qualimap/coverage_per_contig
    row_selection_enabled: true
    row_selection_column: sample
    section: Coverage tables
    tag: ea-sex-table
    index: cov-table-contig
    title: Coverage per contig
    description: >-
      One row per library and reference sequence, with its length, mapped bases, depth and depth
      relative to the library mean.

      How to read: sort by relative depth to list the sequences far from 1. The relative depth and
      contig length sliders of the filter panel narrow the rows, and the scatter above draws the same
      table.

      Source: Qualimap 2 paper (Bioinformatics 2016), doi:10.1093/bioinformatics/btv566
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: qualimap_genome_fraction_coverage
    use: qualimap/genome_fraction_coverage
    row_selection_enabled: true
    row_selection_column: sample
    section: Coverage tables
    tag: ea-dist-table
    index: cov-table-fraction
    title: Genome fraction by depth threshold
    description: >-
      One row per library and depth threshold, with the share of the reference reaching it.

      How to read: the table behind the genome fraction curve. Read the 1X row of a library for the
      share of the genome seen at all.

      Source: Qualimap 2 paper (Bioinformatics 2016), doi:10.1093/bioinformatics/btv566
    layout: {x: 0, y: 6, w: 8, h: 6}
- title: Locus
  subtitle: How deep and how well mapped is one region?
