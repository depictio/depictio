version: 1
# nf-core/eager 2.4.5 reference dashboard.
#
# Funnel, one tab per question an ancient-DNA run has to answer:
#   MultiQC              the report itself, MultiQC panels with no tile twin only
#   Run and library hub  which libraries, from how many lanes, and how they
#                        compare on every tool at once
#   Reads and read fate  where every sequenced read stops, and what each lane
#                        returned after trimming and collapsing
#   Mapping, endogenous DNA and duplication
#                        how much of the extract is the target organism, how
#                        much survives filtering and deduplication, and (when a
#                        metagenomic screen ran) what the rest is
#   Authentication       is it ancient: deamination against fragment length,
#                        the full profiles, and (when enabled) contamination
#   Coverage, sex and genotyping
#                        per-contig depth, the depth distribution, the locus
#                        detail and the variants called
#
# Pinned on every tab: the four-card run strip (run size and design), the
# library sheet, the pinned sample filters, the QC thresholds (which reach every
# tab through the qualimap/endorspy -> samples links in template.yaml) and the
# BamQC reference table.
#
# Optional eager branches (Sex.DetERRmine, MTNucRatio, ANGSD contamination,
# MaltExtract, Kraken) each have one table tile bound to their `optional: true`
# collection. The import drops a tile whose collection is absent, so a run that
# did not enable the branch shows only the two-sentence note of its section.
#
# The MultiQC report bound here was re-generated with MultiQC 1.35 from the
# run's raw tool outputs (eager 2.x writes a pre-parquet report). Module and plot
# names are therefore the 1.35 ones.
main_dashboard:
  title: nf-core/eager
  subtitle: "nf-core/eager 2.4.5: ancient-DNA QC from trimming and collapsing to endogenous content, authentication, coverage and genotypes"
  project_tag: Ancient DNA Authentication
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Sample scope
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab through the project links
    persistent: true
    pin: top
  - name: QC thresholds
    icon: mdi:tune
    color: cyan
    description: Coverage, duplication and endogenous-DNA floors; each narrows the library hub, and through it every tab
    collapsed: true
    persistent: true
    pin: bottom
  - name: Report scope
    icon: mdi:tune
    color: orange
    description: Narrow the MultiQC panels to selected report samples
  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: Run size and design, on every tab
    persistent: true
    pin: top
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The library hub every other tab is filtered by
    collapsed: true
    persistent: true
    pin: top
  - name: Reference metrics
    icon: mdi:table
    color: gray
    description: Per-library coverage and duplication, the table the QC thresholds read
    collapsed: true
    persistent: true
    pin: bottom
  - name: MultiQC overview
    icon: mdi:view-dashboard-outline
    color: orange
    description: One row per library, pooling the headline numbers of every module
  - name: Read quality and trimming
    icon: mdi:chart-bell-curve
    color: blue
    description: FastQC on the raw lanes and the AdapterRemoval collapsed-read length, as MultiQC reports them
  - name: Variant calling
    icon: mdi:scale-balance
    color: grape
    description: The bcftools stats panels the Coverage tab has no tile for
  components:
  # ------------------------------------------------------- run at a glance
  - component_type: card
    tag: ea-glance-card-libraries
    index: ea-glance-card-libraries
    section: Run at a glance
    workflow_tag: eager
    data_collection_tag: samples
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: donut
    breakdown_col: udg_treatment
    display: {icon_name: 'mdi:test-tube', icon_color: '#26A69A', title_color: '#26A69A', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Libraries
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: ea-glance-card-samples
    index: ea-glance-card-samples
    section: Run at a glance
    workflow_tag: eager
    data_collection_tag: samples
    aggregation: nunique
    column_name: sample_name
    column_type: object
    secondary_layout: top_n
    breakdown_col: organism
    top_n_count: 3
    display: {icon_name: 'mdi:account-group-outline', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Biological samples
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: ea-glance-card-lanes
    index: ea-glance-card-lanes
    section: Run at a glance
    workflow_tag: eager
    data_collection_tag: samples
    aggregation: sum
    column_name: n_lanes
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample_id
    top_n_count: 4
    display: {icon_name: 'mdi:layers-outline', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Lanes merged
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: ea-glance-card-reads
    index: ea-glance-card-reads
    section: Run at a glance
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    aggregation: sum
    secondary_layout: attrition
    attrition_cols: [retained_reads]
    column_name: total_reads
    column_type: int64
    display: {icon_name: 'mdi:counter', icon_color: '#42A5F5', title_color: '#42A5F5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Reads sequenced
    layout: {x: 6, y: 0, w: 2, h: 2}

  # ------------------------------------------------------------ sample sheet
  - component_type: text
    tag: ea-sheet-intro
    section: Sample sheet
    title: The design behind every panel
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per library, with the biological sample it was prepared from, the
      organism, the UDG treatment and how many lanes eager merged into it. The
      library filter narrows every tab; the sample filter is the one that
      reaches the genotyping tiles, which key on the sample.
    workflow_tag: eager
    data_collection_tag: samples
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: ea-sheet-table
    section: Sample sheet
    workflow_tag: eager
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample_id
    title: Library hub
    description: One row per library, with its sample, organism, UDG treatment and lane count.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 3}

  # -------------------------------------------------------- reference metrics
  - component_type: text
    tag: ea-ref-intro
    section: Reference metrics
    title: Coverage and duplication behind the thresholds
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The per-library [Qualimap](http://qualimap.conesalab.org) BamQC summary
      the coverage and duplication thresholds read. The depth profiles are on
      the Coverage, sex and genotyping tab.
    workflow_tag: eager
    data_collection_tag: qualimap_bamqc_genome_results
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: table
    tag: ea-ref-table-qualimap
    section: Reference metrics
    workflow_tag: eager
    data_collection_tag: qualimap_bamqc_genome_results
    use: qualimap/bamqc_genome_results
    row_selection_enabled: true
    row_selection_column: sample
    title: BamQC summary
    description: Mean coverage, mapping quality, error rate and duplication per library.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 3}

  # ------------------------------------------------------- MultiQC overview
  - component_type: text
    tag: ea-qc-intro
    section: MultiQC overview
    title: The report, module by module
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The [MultiQC](https://multiqc.info) panels that no other tab redraws from
      a tool table: general statistics, FastQC, the collapsed-read length and
      the bcftools variant panels. Mapping, endogenous DNA, duplication,
      damage and coverage each have their own tab, built from the tool outputs.
    workflow_tag: eager
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: ea-qc-general-stats
    section: MultiQC overview
    workflow_tag: eager
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    title: General statistics
    description: One row per library, pooling the headline numbers of every module that ran, including endorS.py's endogenous DNA percentage.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 5}

  # ------------------------------------------------------ read quality
  - component_type: text
    tag: ea-qc-reads-intro
    section: Read quality and trimming
    title: Raw reads, and the fragments collapsing recovered
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/) on
      the raw lanes, then the length of the reads
      [AdapterRemoval](https://github.com/MikkelSchubert/adapterremoval)
      collapsed from overlapping mates. Ancient fragments are usually shorter
      than the read length, so a high collapse rate and a short length peak are
      expected, not a warning sign.
    workflow_tag: eager
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: ea-qc-fastqc-counts
    section: Read quality and trimming
    workflow_tag: eager
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Counts
    use: multiqc/fastqc
    title: Sequence counts
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: ea-qc-fastqc-quality
    section: Read quality and trimming
    workflow_tag: eager
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    use: multiqc/fastqc
    title: Per-base sequence quality
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: ea-qc-fastqc-gc
    section: Read quality and trimming
    workflow_tag: eager
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Per Sequence GC Content
    use: multiqc/fastqc
    title: GC content
    description: An unexpected second GC peak is the cheapest hint that something other than the target organism is in the extract.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: ea-qc-fastqc-adapter
    section: Read quality and trimming
    workflow_tag: eager
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Adapter Content
    use: multiqc/fastqc
    title: Adapter content
    title_size: sm
    title_align: left
    layout: {x: 4, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: ea-qc-fastqc-dup
    section: Read quality and trimming
    workflow_tag: eager
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Duplication Levels
    use: multiqc/fastqc
    title: Sequence duplication levels
    title_size: sm
    title_align: left
    layout: {x: 0, y: 12, w: 4, h: 5}
  - component_type: multiqc
    tag: ea-qc-ar-length
    section: Read quality and trimming
    workflow_tag: eager
    data_collection_tag: multiqc_data
    selected_module: adapterremoval
    selected_plot: Length Distribution
    use: multiqc/adapterremoval
    title: Collapsed-read length distribution
    title_size: sm
    title_align: left
    layout: {x: 4, y: 12, w: 4, h: 5}

  # ------------------------------------------------------ variant calling
  - component_type: text
    tag: ea-qc-vc-intro
    section: Variant calling
    title: What the variant caller wrote
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [bcftools stats](https://samtools.github.io/bcftools/) over the
      genotyping VCFs, as MultiQC plots them. The counts and the Ts to Tv ratio
      are on the Coverage, sex and genotyping tab.
    workflow_tag: eager
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: ea-geno-mqc-subtypes
    section: Variant calling
    workflow_tag: eager
    data_collection_tag: multiqc_data
    selected_module: bcftools
    selected_plot: Variant Substitution Types
    use: multiqc/bcftools
    title: Substitution types
    description: Deamination reads as C to T and G to A substitutions, so an excess of those two in a damaged library is damage, not variation.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: ea-geno-mqc-quality
    section: Variant calling
    workflow_tag: eager
    data_collection_tag: multiqc_data
    selected_module: bcftools
    selected_plot: Variant Quality
    use: multiqc/bcftools
    title: Variant quality
    title_size: sm
    title_align: left
    layout: {x: 4, y: 1, w: 4, h: 5}
  - component_type: multiqc
    tag: ea-geno-mqc-indels
    section: Variant calling
    workflow_tag: eager
    data_collection_tag: multiqc_data
    selected_module: bcftools
    selected_plot: Indel Distribution
    use: multiqc/bcftools
    title: Indel length distribution
    title_size: sm
    title_align: left
    layout: {x: 0, y: 6, w: 4, h: 5}
  - component_type: multiqc
    tag: ea-geno-mqc-depths
    section: Variant calling
    workflow_tag: eager
    data_collection_tag: multiqc_data
    selected_module: bcftools
    selected_plot: Variant depths
    use: multiqc/bcftools
    title: Variant depths
    title_size: sm
    title_align: left
    layout: {x: 4, y: 6, w: 4, h: 5}

  # ---------------------------------------------------------------- filters
  - component_type: interactive
    tag: ea-filter-library
    index: ea-library-filter
    section: Sample scope
    group: Sample scope
    workflow_tag: eager
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:test-tube'}
    placement: left
    title: Library
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: ea-filter-sample
    index: ea-sample-filter
    section: Sample scope
    group: Sample scope
    workflow_tag: eager
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_name
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:account-group-outline'}
    placement: left
    title: Sample
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: ea-filter-udg
    index: ea-udg-filter
    section: Sample scope
    group: Sample scope
    workflow_tag: eager
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: udg_treatment
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:flask-outline'}
    placement: left
    title: UDG treatment
    layout: {x: 0, y: 6, w: 1, h: 3}
  # QC floors. Each collection links back to the library hub (template.yaml),
  # so a floor narrows the hub and the hub fans the pick out to every tab.
  - component_type: interactive
    tag: ea-filter-coverage
    index: ea-coverage-range
    section: QC thresholds
    group: Coverage and duplication
    workflow_tag: eager
    data_collection_tag: qualimap_bamqc_genome_results
    interactive_component_type: RangeSlider
    column_name: mean_coverage
    column_type: float64
    show_histogram: true
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:waves'}
    placement: left
    title: Mean coverage
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: ea-filter-duprate
    index: ea-duprate-range
    section: QC thresholds
    group: Coverage and duplication
    workflow_tag: eager
    data_collection_tag: qualimap_bamqc_genome_results
    interactive_component_type: RangeSlider
    column_name: duplication_rate
    column_type: float64
    show_histogram: true
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:set-merge'}
    placement: left
    title: Duplication rate
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: ea-filter-endogenous
    index: ea-endogenous-range
    section: QC thresholds
    group: Coverage and duplication
    workflow_tag: eager
    data_collection_tag: endorspy_endogenous
    interactive_component_type: RangeSlider
    column_name: endogenous_dna
    column_type: float64
    show_histogram: true
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:dna'}
    placement: left
    title: Endogenous DNA
    layout: {x: 0, y: 6, w: 1, h: 3}
  # Tab-local: narrows the MultiQC panels only.
  - component_type: interactive
    tag: ea-mq-filter-sample
    index: ea-mq-sample-filter
    section: Report scope
    group: Report scope
    workflow_tag: eager
    data_collection_tag: multiqc_data
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display: {title_size: md, custom_color: '#FB8C00', icon_name: 'mdi:file-document-outline'}
    placement: left
    title: Report sample
    layout: {x: 0, y: 0, w: 1, h: 3}

tabs:
# ============================================================================
# Run and library hub
# ============================================================================
- title: Run and library hub
  subtitle: Which libraries, from how many lanes, and how they compare on every tool at once
  tab_order: 2
  tab_icon: mdi:table-account
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Lane scope
    icon: mdi:filter-variant
    color: blue
    description: Narrow the per-lane table on this tab
  grid_sections:
  - name: Library QC profile
    icon: mdi:chart-timeline-variant
    color: indigo
    description: Every per-library QC number eager produced, on one set of axes
  - name: Library detail
    icon: mdi:information-outline
    color: indigo
    description: Select a library in the pooled table to read its record field by field beside it
  - name: Libraries and lanes
    icon: mdi:table-account
    color: teal
    description: One row per lane, with the library eager merged it into
    collapsed: true
  components:
  - component_type: interactive
    tag: ea-hub-filter-lane
    index: ea-hub-lane-filter
    section: Lane scope
    group: Lane scope
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    interactive_component_type: MultiSelect
    column_name: lane
    column_type: object
    display: {title_size: md, custom_color: '#42A5F5', icon_name: 'mdi:layers-outline'}
    placement: left
    title: Lane
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: ea-hub-filter-run
    index: ea-hub-run-filter
    section: Lane scope
    group: Lane scope
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    interactive_component_type: MultiSelect
    column_name: run_accession
    column_type: object
    display: {title_size: md, custom_color: '#42A5F5', icon_name: 'mdi:database-outline'}
    placement: left
    title: Sequencing run
    layout: {x: 0, y: 3, w: 1, h: 3}

  - component_type: text
    tag: ea-hub-profile-intro
    section: Library QC profile
    title: One line per library, across every tool
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      endorS.py, Picard, Qualimap and DamageProfiler each score a library on
      their own axis; here they share one plot, one polyline per library, each
      axis rescaled to its own range. Brush an axis to narrow the profile and
      the pooled table in Library detail, and select a row of that table to
      open the library's record beside it.
    workflow_tag: eager
    data_collection_tag: eager_library_qc
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: ea-hub-av-pcoords
    index: ea-hub-av-pcoords
    section: Library QC profile
    workflow_tag: eager
    data_collection_tag: eager_library_qc
    viz_kind: parallel_coordinates
    config:
      viz_kind: parallel_coordinates
      controls_placement: header
      sample_col: sample
      group_col: sample
      scale: minmax
      metric_cols:
      - endogenous_dna
      - endogenous_dna_post
      - clonality_pct
      - mean_coverage
      - mean_mapping_quality
      - error_rate_pct
      - gc_percentage
      - ct_5p_first_pct
      - mean_length
    title: Per-library QC profile
    description: One polyline per library across nine metrics from four tools. Each axis is rescaled to its own range and keeps its original units on the ticks, so read the ticks before reading a gap.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: table
    tag: ea-hub-profile-table
    section: Library detail
    workflow_tag: eager
    data_collection_tag: eager_library_qc
    row_selection_enabled: true
    row_selection_column: sample
    title: Library QC, pooled
    description: The numbers behind the profile, one row per library. Select a row to read it in the record beside it.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 5, h: 6}

  - component_type: advanced_viz
    tag: ea-hub-av-record
    index: ea-hub-av-record
    section: Library detail
    workflow_tag: eager
    data_collection_tag: eager_library_qc
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: sample
      title_col: sample
      selection_source: table_selection
      sections:
        Endogenous content: [endogenous_dna, endogenous_dna_post, clonality_pct]
        Alignment: [mean_coverage, mean_mapping_quality, error_rate_pct, gc_percentage]
        Authenticity: [ct_5p_first_pct, mean_length]
      labels:
        endogenous_dna: Endogenous DNA (%)
        endogenous_dna_post: Endogenous DNA after filtering (%)
        clonality_pct: Clonality (%)
        mean_coverage: Mean coverage (X)
        mean_mapping_quality: Mean mapping quality
        error_rate_pct: Error rate (%)
        gc_percentage: GC (%)
        ct_5p_first_pct: C to T at the first 5 prime base (%)
        mean_length: Mean fragment length (bp)
      linked_component: ea-hub-profile-table
    title: Library record
    description: The library selected in the pooled table beside it, grouped by the question each number answers.
    title_size: h3
    layout: {x: 5, y: 0, w: 3, h: 6}

  - component_type: table
    tag: ea-hub-table-lanes
    section: Libraries and lanes
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    row_selection_enabled: true
    row_selection_column: lane_id
    title: Per-lane trimming and collapsing
    description: One row per lane, with the library it was merged into and what AdapterRemoval returned. eager trims each lane on its own and merges lanes into a library before mapping.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 4}

# ============================================================================
# Reads and read fate
# ============================================================================
- title: Reads and read fate
  subtitle: Where every sequenced read stops, from trimming and collapsing through mapping, the quality filter and deduplication
  tab_order: 3
  tab_icon: mdi:relation-many-to-many
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Fate scope
    icon: mdi:filter-variant
    color: grape
    description: Narrow the flow to one stage outcome; the lane filter narrows the per-lane tiles only
  grid_sections:
  - name: Read fate
    icon: mdi:relation-many-to-many
    color: grape
    description: One flow per library, exact at every stage
  - name: Lane yield
    icon: mdi:chart-bar
    color: blue
    description: What each lane returned after trimming and collapsing
  - name: Read fate tables
    icon: mdi:table
    color: gray
    description: The counts behind the flow
    collapsed: true
  components:
  - component_type: interactive
    tag: ea-fate-filter-trimming
