    placement: left
    title: Contig
    layout: {x: 0, y: 0, w: 1, h: 3}
  # No position slider: the navigator's brush and locus field own the position
  # filter on this collection, and a second control on the same column would
  # fight them. The window-depth band is the threshold this section reads. No
  # histogram on it: the mitochondrion's ~59X window puts every nuclear window
  # in the first bin, so the bars would say nothing.
  - component_type: interactive
    tag: ea-cov-filter-window-depth
    index: ea-cov-window-depth-range
    section: Coverage filters
    group: Region scope
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_across_reference
    interactive_component_type: RangeSlider
    column_name: coverage
    column_type: float64
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:waves'}
    placement: left
    title: Window depth (X)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: ea-cov-filter-depth
    index: ea-cov-depth-range
    section: Coverage filters
    group: Region scope
    workflow_tag: eager
    data_collection_tag: qualimap_genome_fraction_coverage
    interactive_component_type: RangeSlider
    column_name: min_coverage
    column_type: int64
    show_histogram: true
    display: {title_size: md, custom_color: '#42A5F5', icon_name: 'mdi:waves'}
    placement: left
    title: Depth threshold
    layout: {x: 0, y: 6, w: 1, h: 3}

  - component_type: text
    tag: ea-cov-intro
    section: Depth along the reference
    title: How deep, and how even
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [Qualimap](http://qualimap.conesalab.org) BamQC reports a mean depth and
      a mean mapping quality per window of about 1.7 Mb, mapped here back onto
      the contig each window falls in. The section opens on chromosome 1
      (NC_044048.1, the whole contig), where both libraries lose depth at the
      two ends, below 0.6X against about 1X along the arm, while mapping
      quality barely moves. Type a contig or a range in the navigator header,
      or brush its axis: the navigator, the cards and the mapping-quality track
      below all follow that region.
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_across_reference
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ea-cov-card-mean
    index: ea-cov-card-mean
    section: Depth along the reference
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_across_reference
    use: qualimap/coverage_across_reference
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: coverage
    column_type: float64
    display: {icon_name: 'mdi:waves', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Windowed depth (X)
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ea-cov-card-peak
    index: ea-cov-card-peak
    section: Depth along the reference
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_across_reference
    use: qualimap/coverage_across_reference
    aggregation: max
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 2
    column_name: coverage
    column_type: float64
    display: {icon_name: 'mdi:chart-line', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Deepest window (X)
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ea-cov-card-std
    index: ea-cov-card-std
    section: Depth along the reference
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_across_reference
    use: qualimap/coverage_across_reference
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: coverage_std
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#42A5F5', title_color: '#42A5F5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Depth spread within a window
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ea-cov-card-fraction
    index: ea-cov-card-fraction
    section: Depth along the reference
    workflow_tag: eager
    data_collection_tag: qualimap_genome_fraction_coverage
    use: qualimap/genome_fraction_coverage
    aggregation: max
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 2
    column_name: genome_fraction_pct
    column_type: float64
    display: {icon_name: 'mdi:percent-outline', icon_color: '#26A69A', title_color: '#26A69A', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Genome covered at 1X (%)
    layout: {x: 6, y: 2, w: 2, h: 2}
  # Locus section. The navigator is the only tile on the depth windows that
  # draws a track (the former coverage_track + genome_view pair on this one
  # collection is gone, see test_no_double_track_binding); the track under it
  # reads a second collection, reached by the region link in template.yaml.
  # The draft cod assembly has no GenomeSpy built-in, so `assembly` stays null
  # and the contig list comes from the data; there is no gene lane.
  - component_type: advanced_viz
    tag: ea-cov-av-genomeview
    index: ea-cov-av-genomeview
    section: Depth along the reference
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_across_reference
    use: qualimap/reference_genome_view
    config:
      controls_placement: header
      score_title: Mean depth (X)
      mark: point
      point_size: 4
      facet_by_sample: true
      region_filter_enabled: true
      default_region: "NC_044048.1:1-30,875,876"
    title: Locus navigator, depth per window
    description: One lane per library on the contig axis. The locus field in the header and a brush on this axis move every tile of the section.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 3}
  - component_type: advanced_viz
    tag: ea-cov-av-mapq
    index: ea-cov-av-mapq
    section: Depth along the reference
    workflow_tag: eager
    data_collection_tag: qualimap_mapq_across_reference
    viz_kind: coverage_track
    config:
      viz_kind: coverage_track
      chromosome_col: chromosome
      position_col: position
      value_col: mapping_quality
      sample_col: sample
      view_mode: facet
      color_by: sample
      smoothing_window: 0
      show_annotation_lane: false
      view: track
      views: [track]
    title: Mapping quality along the region
    description: Mean MAPQ per window, one lane per library, clamped to the navigator's region. A dip under a depth dip marks repeats the mapper could not place.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 3}
  - component_type: table
    tag: ea-cov-table-track
    section: Depth along the reference
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_across_reference
    use: qualimap/coverage_across_reference
    row_selection_enabled: false
    title: Windowed depth
    description: One row per library and window of the current region, with the contig it falls in and its position on both the contig and the concatenated reference.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 10, w: 8, h: 7}

  - component_type: text
    tag: ea-dist-intro
    section: Depth distribution
    title: Spread thin, or piled up
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A mean depth well under 1X says nothing about whether the reads are
      spread over the genome once or piled on a tenth of it. These two curves
      do: the first is how many bases sit at each depth, the second is the
      share of the reference covered at least that deep.
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_histogram
