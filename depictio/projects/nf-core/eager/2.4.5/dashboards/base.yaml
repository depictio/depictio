    description: Distinct molecules against total reads, extrapolated per library by preseq.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: picard_markduplicates_metrics
    use: picard/markduplicates_metrics
    row_selection_enabled: true
    row_selection_column: sample
    section: Duplication table
    tag: ea-dup-table
    index: cx-table
    title: Duplication metrics per library
    description: Reads examined, duplicates flagged and what is left, from Picard MarkDuplicates.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Authentication
  subtitle: Is the DNA damaged and short, as ancient DNA is?
  tab_group: Ancient DNA
  tab_order: 6
  tab_icon: mdi:shield-check-outline
  tab_icon_color: red
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Damage filters
    icon: mdi:filter-variant
    color: red
    description: Narrow the profiles to a read end, a position window, a strand or a length band
  grid_sections:
  - name: Damage at a glance
    icon: mdi:counter
    color: red
    description: Terminal deamination at both ends, and how long the fragments are
  - name: Length and damage
    icon: mdi:chart-scatter-plot
    color: red
    description: Each library on the ancient-DNA plane, beside its fragment length curve
  - name: Misincorporation
    icon: mdi:dna
    color: red
    description: Substitution frequency by distance from the read end, from DamageProfiler
  - name: Contamination
    icon: mdi:scale-balance
    color: gray
    description: ANGSD nuclear contamination and MTNucRatio, when the run enabled them
    collapsed: true
  - name: Authentication tables
    icon: mdi:table
    color: gray
    description: The per-library summary and the full profiles behind the plots
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [DamageProfiler](https://github.com/Integrative-Transcriptomics/DamageProfiler)
      measures the two marks of ancient DNA: cytosines deaminated at the read ends, read as
      C to T, and short fragments. Short and damaged is ancient, long and undamaged is modern
      contamination; only the two together separate them. UDG-treated libraries keep the
      damage at the terminal base only.
    tag: ea-auth-intro
    index: auth-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: damageprofiler_misincorporation
    interactive_component_type: MultiSelect
    column_name: end
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: red
    section: Damage filters
    group: Damage
    tag: ea-dmg-filter-end
    index: auth-end-filter
    title: Read end
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: damageprofiler_misincorporation
    interactive_component_type: RangeSlider
    column_name: position
    column_type: int64
    display:
      icon_name: mdi:ruler
      custom_color: orange
    section: Damage filters
    group: Damage
    tag: ea-dmg-filter-position
    index: auth-position-range
    title: Distance from the read end
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: damageprofiler_lgdistribution
    interactive_component_type: MultiSelect
    column_name: strand
    column_type: object
    display:
      icon_name: mdi:swap-vertical
      custom_color: pink
    section: Damage filters
    group: Fragments
    tag: ea-dmg-filter-strand
    index: auth-strand-filter
    title: Strand
    layout: {x: 0, y: 5, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: damageprofiler_lgdistribution
    interactive_component_type: RangeSlider
    column_name: length
    column_type: int64
    display:
      icon_name: mdi:content-cut
      custom_color: yellow
    section: Damage filters
    group: Fragments
    tag: ea-dmg-filter-length
    index: auth-length-range
    title: Fragment length
    layout: {x: 0, y: 7, w: 1, h: 3}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: damageprofiler_authenticity
    use: damageprofiler/authenticity
    aggregation: median
    column_name: ct_5p_first
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:dna
      icon_color: red
      caption: first base, median per library
      format: percent
    section: Damage at a glance
    tag: ea-auth-card-ct
    index: auth-card-ct
    title: C to T, 5 prime end
    description: Frequency of C read as T at the first base of the read, the deamination signal.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: damageprofiler_authenticity
    use: damageprofiler/authenticity
    aggregation: median
    column_name: ga_3p_first
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:swap-vertical
      icon_color: pink
      caption: last base, distribution
      format: percent
    section: Damage at a glance
    tag: ea-auth-card-ga
    index: auth-card-ga
    title: G to A, 3 prime end
    description: The same signal on the other strand, read at the last base of the read.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: damageprofiler_authenticity
