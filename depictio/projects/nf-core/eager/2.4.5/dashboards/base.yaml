version: 1
# nf-core/eager 2.4.5 reference dashboard.
#
# Funnel, one tab per question an ancient-DNA run has to answer:
#   MultiQC              what every module reported, as the report itself
#   Run and library hub  what was sequenced, and what each lane contributed
#   Reads and read fate  where every sequenced read ended up, as one flow
#   Mapping, endogenous DNA and duplication
#                        how much of the extract is the target organism, and
#                        how much of that survives filtering and deduplication
#   Damage authentication
#                        is it ancient: terminal deamination against fragment
#                        length, then each signal's full profile
#   Contamination and sex
#                        the branch that did not run here, and the per-contig
#                        depth a sex or aneuploidy call would be made from
#   Coverage and genotyping
#                        depth along the reference and the variants called
#   Metagenomic screening
#                        the branch that did not run here, and the off-target
#                        fraction it would have worked on
#
# Three pinned sections ride every tab, including MultiQC: the four-card run
# strip, the library sheet the whole dashboard is filtered by, and the BamQC
# reference table the left-panel thresholds read. The MultiQC tab holds MultiQC
# panels only; everything drawn from a table eager or this template's recipes
# published beside the report lives on its own tab.
#
# The MultiQC report bound here was re-generated with MultiQC 1.35 from the
# run's raw tool outputs; the run itself published MultiQC 1.13.dev0, which
# writes no parquet. Module and plot names are therefore the 1.35 ones.
#
# Two tabs are gated on pipeline branches this megatest did not enable
# (sex determination, MTNucRatio, ANGSD contamination, MALT/HOPS/Kraken). Their
# data collections are declared `optional: true` in template.yaml with the globs
# the eager output docs publish, and each tab opens with a text tile saying so,
# then shows the data that IS on disk and answers the nearest question.
main_dashboard:
  title: nf-core/eager
  subtitle: "nf-core/eager 2.4.5 megatest: two Atlantic cod libraries, BWA-mapped, Picard-deduplicated and damage-profiled"
  project_tag: Ancient DNA Authentication
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab through the project links
    persistent: true
    pin: top
  - name: QC thresholds
    icon: mdi:tune
    color: cyan
    description: Coverage, duplication and endogenous-DNA floors, applied on every tab
    collapsed: true
    persistent: true
    pin: bottom
  - name: Glance scope
    icon: mdi:tune
    color: orange
    description: Terminal C-to-T damage window on the authenticity summary the pinned glance strip reads
  grid_sections:
  # Pinned to the top and carried by every tab: four headline numbers, then
  # the design the whole dashboard is filtered by, one collapse away.
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: The four numbers an ancient-DNA run is read on, on every tab
    persistent: true
    pin: top
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The library hub every other tab is filtered by
    collapsed: true
    persistent: true
    pin: top
  - name: Reference metrics
    icon: mdi:table
    color: gray
    description: Per-library coverage and duplication, on every tab
    collapsed: true
    persistent: true
    pin: bottom
  - name: MultiQC overview
    icon: mdi:view-dashboard-outline
    color: orange
    description: One row per library, pooling the headline numbers of every module
  - name: Read quality and trimming
    icon: mdi:chart-bell-curve
    color: blue
    description: FastQC and AdapterRemoval as MultiQC reports them
  components:
  # ------------------------------------------------------- run at a glance
  - component_type: card
    tag: ea-glance-card-endogenous
    index: ea-glance-card-endogenous
    section: Run at a glance
    workflow_tag: eager
    data_collection_tag: endorspy_endogenous
    use: endorspy/endogenous
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: endogenous_dna
    column_type: float64
    display: {icon_name: 'mdi:dna', icon_color: '#26A69A', title_color: '#26A69A', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Endogenous DNA (%)
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: ea-glance-card-damage
    index: ea-glance-card-damage
    section: Run at a glance
    workflow_tag: eager
    data_collection_tag: damageprofiler_authenticity
    use: damageprofiler/authenticity
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: terminal_damage
    column_type: float64
    display: {icon_name: 'mdi:dna', icon_color: '#EF5350', title_color: '#EF5350', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Terminal deamination
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: ea-glance-card-coverage
    index: ea-glance-card-coverage
    section: Run at a glance
    workflow_tag: eager
    data_collection_tag: qualimap_bamqc_genome_results
    use: qualimap/bamqc_genome_results
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: mean_coverage
    column_type: float64
    display: {icon_name: 'mdi:waves', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mean coverage (X)
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: ea-glance-card-lanes
    index: ea-glance-card-lanes
    section: Run at a glance
    workflow_tag: eager
    data_collection_tag: samples
    aggregation: sum
    column_name: n_lanes
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample_id
    top_n_count: 2
    display: {icon_name: 'mdi:layers-outline', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Lanes merged
    layout: {x: 6, y: 0, w: 2, h: 2}

  # ------------------------------------------------------------ sample sheet
  - component_type: text
    tag: ea-sheet-intro
    section: Sample sheet
    title: The design behind every panel
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per library, with the biological sample it was prepared from, the
      organism and how many sequencing lanes eager merged into it. The library
      filter in the left panel is sourced here, so this is what narrows every
      other tab; the sample filter beside it is what reaches the genotyping
      tiles, which key on the sample rather than the library.
    workflow_tag: eager
    data_collection_tag: samples
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: ea-sheet-table
    section: Sample sheet
    workflow_tag: eager
    data_collection_tag: samples
    row_selection_enabled: false
    title: Library hub
    description: One row per library, with its sample, organism, UDG treatment and lane count.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 3}

  # -------------------------------------------------------- reference metrics
  - component_type: text
    tag: ea-ref-intro
    section: Reference metrics
    title: Coverage and duplication behind every panel
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The per-library [Qualimap](http://qualimap.conesalab.org) BamQC summary
      the left-panel thresholds read. The coverage figures and the depth
      profiles are on the Coverage and genotyping tab.
    workflow_tag: eager
    data_collection_tag: qualimap_bamqc_genome_results
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: table
    tag: ea-ref-table-qualimap
    section: Reference metrics
    workflow_tag: eager
    data_collection_tag: qualimap_bamqc_genome_results
    use: qualimap/bamqc_genome_results
    row_selection_enabled: false
    title: BamQC summary
    description: Mean coverage, mapping quality, error rate and duplication per library.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 3}

  # ------------------------------------------------------- MultiQC overview
  - component_type: text
    tag: ea-qc-intro
    section: MultiQC overview
    title: An ancient-DNA run, from reads to authentication
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The reprocessed [MultiQC](https://multiqc.info) report, module by module:
      the general statistics table first, then read quality and trimming.
      Mapping, endogenous DNA, duplication, coverage, damage and genotyping
      each have their own tab, built from the tool outputs directly rather than
      from the report.
    workflow_tag: eager
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: multiqc
    tag: ea-qc-general-stats
    section: MultiQC overview
    workflow_tag: eager
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    title: General statistics
    description: One row per library, pooling the headline numbers of every module that ran, including endorSpy's endogenous DNA percentage.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 5}

  # ------------------------------------------------------ read quality
  - component_type: text
    tag: ea-qc-reads-intro
    section: Read quality and trimming
    title: Raw reads, trimming and collapsing
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [FastQC](https://www.bioinformatics.babraham.ac.uk/projects/fastqc/) on
      the raw lanes, plus what
      [AdapterRemoval](https://github.com/MikkelSchubert/adapterremoval)
      trimmed and collapsed into single merged reads. Ancient DNA fragments are
      usually shorter than the read length, so a high collapse rate is expected
      here, not a warning sign.
    workflow_tag: eager
    data_collection_tag: multiqc_data
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: ea-qc-fastqc-counts
    section: Read quality and trimming
    workflow_tag: eager
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Counts
    use: multiqc/fastqc
    title: Sequence counts
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: ea-qc-fastqc-quality
    section: Read quality and trimming
    workflow_tag: eager
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    use: multiqc/fastqc
    title: Per-base sequence quality
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 4, h: 5}
  - component_type: multiqc
    tag: ea-qc-fastqc-gc
    section: Read quality and trimming
    workflow_tag: eager
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Per Sequence GC Content
    use: multiqc/fastqc
    title: GC content
    title_size: sm
    title_align: left
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: ea-qc-fastqc-adapter
    section: Read quality and trimming
    workflow_tag: eager
    data_collection_tag: multiqc_data
    selected_module: fastqc
    selected_plot: Adapter Content
    use: multiqc/fastqc
    title: Adapter content
    title_size: sm
    title_align: left
    layout: {x: 4, y: 7, w: 4, h: 5}
  - component_type: multiqc
    tag: ea-qc-ar-retained
    section: Read quality and trimming
    workflow_tag: eager
    data_collection_tag: multiqc_data
    selected_module: adapterremoval
    selected_plot: Retained and Discarded Reads
    use: multiqc/adapterremoval
    title: Retained, discarded and collapsed reads
    title_size: sm
    title_align: left
    layout: {x: 0, y: 12, w: 4, h: 5}
  - component_type: multiqc
    tag: ea-qc-ar-length
    section: Read quality and trimming
    workflow_tag: eager
    data_collection_tag: multiqc_data
    selected_module: adapterremoval
    selected_plot: Length Distribution
    use: multiqc/adapterremoval
    title: Collapsed-read length distribution
    title_size: sm
    title_align: left
    layout: {x: 4, y: 12, w: 4, h: 5}

  # ---------------------------------------------------------------- filters
  - component_type: interactive
    tag: ea-filter-library
    index: ea-library-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: eager
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:test-tube'}
    placement: left
    title: Library
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: ea-filter-sample
    index: ea-sample-filter
    section: Sample filters
    group: Sample scope
    workflow_tag: eager
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_name
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:account-group-outline'}
    placement: left
    title: Sample
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: ea-filter-coverage
    index: ea-coverage-range
    section: QC thresholds
    group: Coverage and duplication
    workflow_tag: eager
    data_collection_tag: qualimap_bamqc_genome_results
    interactive_component_type: RangeSlider
    column_name: mean_coverage
    column_type: float64
    show_histogram: true
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:waves'}
    placement: left
    title: Mean coverage
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: ea-filter-duprate
    index: ea-duprate-range
    section: QC thresholds
    group: Coverage and duplication
    workflow_tag: eager
    data_collection_tag: qualimap_bamqc_genome_results
    interactive_component_type: RangeSlider
    column_name: duplication_rate
    column_type: float64
    show_histogram: true
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:set-merge'}
    placement: left
    title: Duplication rate
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: ea-filter-endogenous
    index: ea-endogenous-range
    section: QC thresholds
    group: Coverage and duplication
    workflow_tag: eager
    data_collection_tag: endorspy_endogenous
    interactive_component_type: RangeSlider
    column_name: endogenous_dna
    column_type: float64
    show_histogram: true
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:dna'}
    placement: left
    title: Endogenous DNA
    layout: {x: 0, y: 6, w: 1, h: 3}

  # Tab-local, not persistent: this tab's own control beside the pinned ones.
  # It narrows the pinned glance strip that rides this tab.
  - component_type: interactive
    tag: ea-mq-filter-damage
    index: ea-mq-damage-range
    section: Glance scope
    group: Damage
    workflow_tag: eager
    data_collection_tag: damageprofiler_authenticity
    interactive_component_type: RangeSlider
    column_name: ct_5p_first
    column_type: float64
    show_histogram: true
    display: {title_size: md, custom_color: '#FB8C00', icon_name: 'mdi:chart-bell-curve'}
    placement: left
    title: C-to-T at the first 5p base
    layout: {x: 0, y: 0, w: 1, h: 3}

tabs:
# ============================================================================
# Run and library hub
# ============================================================================
- title: Run and library hub
  subtitle: What was sequenced, and what each of the six lanes contributed to the two libraries
  tab_order: 2
  tab_icon: mdi:table-account
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Lane filters
    icon: mdi:filter-variant
    color: blue
    description: Narrow the per-lane tiles on this tab
  grid_sections:
  - name: Libraries and lanes
    icon: mdi:table-account
    color: teal
    description: One row per lane, with the library eager merged it into
  - name: Lane yield
    icon: mdi:chart-bar
    color: blue
    description: What each lane returned after trimming and collapsing
  - name: Library QC profile
    icon: mdi:chart-timeline-variant
    color: indigo
    description: Every per-library QC number eager produced, on one set of axes
  components:
  - component_type: interactive
    tag: ea-hub-filter-lane
    index: ea-hub-lane-filter
    section: Lane filters
    group: Lane scope
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    interactive_component_type: MultiSelect
    column_name: lane
    column_type: object
    display: {title_size: md, custom_color: '#42A5F5', icon_name: 'mdi:layers-outline'}
    placement: left
    title: Lane
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: ea-hub-filter-run
    index: ea-hub-run-filter
    section: Lane filters
    group: Lane scope
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    interactive_component_type: MultiSelect
    column_name: run_accession
    column_type: object
    display: {title_size: md, custom_color: '#42A5F5', icon_name: 'mdi:database-outline'}
    placement: left
    title: Sequencing run
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: ea-hub-filter-retained
    index: ea-hub-retained-range
    section: Lane filters
    group: Lane scope
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    interactive_component_type: RangeSlider
    column_name: retained_reads
    column_type: int64
    show_histogram: true
    display: {title_size: md, custom_color: '#42A5F5', icon_name: 'mdi:counter'}
    placement: left
    title: Retained reads
    layout: {x: 0, y: 6, w: 1, h: 3}

  - component_type: text
    tag: ea-hub-intro
    section: Libraries and lanes
    title: Two libraries, six lanes
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      eager trims and collapses each sequencing lane on its own, then merges
      the lanes into a library before mapping. The lane is therefore the only
      samplesheet column with more than one value in this run, and the
      AdapterRemoval reports are the only per-lane numbers eager publishes.
      Everything downstream is per library.
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ea-hub-card-reads
    index: ea-hub-card-reads
    section: Libraries and lanes
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    aggregation: sum
    secondary_layout: attrition
    attrition_cols: [retained_reads, collapsed_pairs]
    column_name: total_reads
    column_type: int64
    display: {icon_name: 'mdi:counter', icon_color: '#26A69A', title_color: '#26A69A', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Reads sequenced
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ea-hub-card-retained
    index: ea-hub-card-retained
    section: Libraries and lanes
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    aggregation: sum
    secondary_layout: top_n
    breakdown_col: sample_id
    top_n_count: 2
    column_name: retained_reads
    column_type: int64
    display: {icon_name: 'mdi:filter-variant', icon_color: '#42A5F5', title_color: '#42A5F5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Reads kept for mapping
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ea-hub-card-length
    index: ea-hub-card-length
    section: Libraries and lanes
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: average_retained_length
    column_type: float64
    display: {icon_name: 'mdi:ruler', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mean retained length (bp)
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ea-hub-card-collapse
    index: ea-hub-card-collapse
    section: Libraries and lanes
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: collapse_rate
    column_type: float64
    display: {icon_name: 'mdi:set-merge', icon_color: '#AB47BC', title_color: '#AB47BC', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Collapse rate
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: table
    tag: ea-hub-table-lanes
    section: Libraries and lanes
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    row_selection_enabled: false
    title: Per-lane trimming and collapsing
    description: One row per lane, with the library it was merged into and what AdapterRemoval returned.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 4, w: 8, h: 4}

  - component_type: text
    tag: ea-hub-yield-intro
    section: Lane yield
    title: What each lane returned
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The two libraries were prepared and sequenced differently enough to show
      it here: one discards under a tenth of its reads on quality and length,
      the other a quarter, and the collapse rates differ with it.
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    tag: ea-hub-fig-retained
    index: ea-hub-fig-retained
    section: Lane yield
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    visu_type: bar
    dict_kwargs: {x: lane_id, y: retained_reads, color: sample_id}
    title: Reads kept for mapping, per lane
    description: Sequences AdapterRemoval wrote out, which is exactly what the mapper was given.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 6}
  - component_type: advanced_viz
    tag: ea-hub-av-collapse
    index: ea-hub-av-collapse
    section: Lane yield
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    use: adapterremoval/collapse_vs_length
    config:
      controls_placement: header
      x_col: average_retained_length
      y_col: collapse_rate
      label_col: lane_id
      color_col: sample_id
      size_col: retained_reads
      x_title: Mean retained length (bp)
      y_title: Collapse rate
      top_n_labels: 6
    title: Collapse rate against retained length
    description: A lane whose inserts are shorter than the read length collapses more of its pairs, so the two move together within a library and separate between them.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 7}
  - component_type: figure
    tag: ea-hub-fig-discard
    index: ea-hub-fig-discard
    section: Lane yield
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    visu_type: bar
    dict_kwargs: {x: lane_id, y: discard_rate, color: sample_id}
    title: Share of reads discarded on quality or length, per lane
    description: Reads AdapterRemoval dropped before mapping, as a fraction of everything sequenced on that lane.
    title_size: h3
    layout: {x: 0, y: 14, w: 8, h: 6}

  - component_type: text
