  - component_type: text
    tag: ea-sex-gate
    section: What did not run
    title: Sex determination and contamination were switched off in this run
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      This megatest ran with Sex.DetERRmine, MTNucRatio and the ANGSD
      X-chromosome contamination estimate disabled, and the reference is
      Atlantic cod, which has no assembled sex chromosome to call from anyway.
      The template declares those three collections as optional, with the file
      names the eager output documentation publishes, so a run that enables
      them ingests with no template edit. What is on disk instead is the
      per-contig depth below, which is the quantity all three build on: a sex
      call is a depth ratio between a sex chromosome and the autosomes, and a
      contamination estimate needs the same per-contig baseline. The
      mitochondrion is visible here as the one sequence at roughly sixty times
      the nuclear depth, which is the mitochondrial-to-nuclear ratio MTNucRatio
      would have reported.
