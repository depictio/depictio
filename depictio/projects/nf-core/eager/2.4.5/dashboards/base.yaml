# ============================================================================
# Coverage and genotyping
# ============================================================================
- title: Coverage and genotyping
  subtitle: Depth along the reference and how it is distributed, next to the variants GATK called from it
  tab_order: 7
  tab_icon: mdi:waves
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Coverage filters
    icon: mdi:filter-variant
    color: cyan
    description: Narrow the locus section to contigs or a window-depth band, and the depth curves to a threshold
  grid_sections:
  - name: Depth along the reference
    icon: mdi:waves
    color: cyan
    description: A locus section, depth and mapping quality on one contig axis that follows the navigator's region
  - name: Depth distribution
    icon: mdi:chart-bell-curve
    color: blue
    description: How that depth is spread across the reference
  - name: Variant calls
    icon: mdi:scale-balance
    color: grape
    description: bcftools stats over the GATK HaplotypeCaller VCFs
  components:
  - component_type: interactive
    tag: ea-cov-filter-chrom
    index: ea-cov-chrom-filter
    section: Coverage filters
    group: Region scope
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_across_reference
    interactive_component_type: MultiSelect
    column_name: chromosome
    column_type: object
