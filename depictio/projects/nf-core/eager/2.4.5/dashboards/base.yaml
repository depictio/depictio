- title: Metagenomic screening
  subtitle: The branch this run did not enable, and the off-target fraction it would have worked on
  tab_order: 8
  tab_icon: mdi:bacteria-outline
  tab_icon_color: lime
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Off-target filters
    icon: mdi:filter-variant
    color: lime
    description: Narrow by how much of a library missed the reference
  grid_sections:
  - name: What did not run
    icon: mdi:alert-outline
    color: yellow
    description: The optional eager screen this megatest left off, and what stands in for it
  - name: Off-target fraction
    icon: mdi:bacteria-outline
    color: lime
    description: The share of each library that did not place on the target reference
  components:
  - component_type: interactive
    tag: ea-meta-filter-offtarget
    index: ea-meta-offtarget-range
    section: Off-target filters
    group: Off-target scope
    workflow_tag: eager
    data_collection_tag: endorspy_endogenous
    interactive_component_type: RangeSlider
    column_name: off_target_pct
    column_type: float64
    display: {title_size: md, custom_color: '#C0CA33', icon_name: 'mdi:bacteria-outline'}
    placement: left
    title: Off-target share
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: ea-meta-filter-stage
    index: ea-meta-stage-filter
    section: Off-target filters
    group: Off-target scope
    workflow_tag: eager
    data_collection_tag: samtools_flagstat
    interactive_component_type: Select
    column_name: stage
    column_type: object
    display: {title_size: md, custom_color: '#C0CA33', icon_name: 'mdi:filter-variant'}
    placement: left
    title: Filter stage
    layout: {x: 0, y: 3, w: 1, h: 3}

  - component_type: text
    tag: ea-meta-gate
    section: What did not run
    title: No metagenomic screen ran on this megatest
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      eager can hand the reads that do not map to the target reference to MALT
      and MaltExtract, or to Kraken, to say what else is in the extract. This
      megatest enabled none of them, so there is no taxon table to show. The
      template declares the MaltExtract authentication heatmap and the Kraken
      report as optional collections, with the file names the eager output
      documentation publishes, so a run that enables either ingests with no
      template edit. What is on disk instead is the size of the problem: nearly
      two thirds of each library did not place on the cod reference, and that
      is exactly the fraction a screen would have classified.
    workflow_tag: eager
    data_collection_tag: endorspy_endogenous
    layout: {x: 0, y: 0, w: 8, h: 3}
  - component_type: card
    tag: ea-meta-card-offtarget
    index: ea-meta-card-offtarget
    section: What did not run
    workflow_tag: eager
    data_collection_tag: endorspy_endogenous
    use: endorspy/endogenous
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: off_target_pct
    column_type: float64
    display: {icon_name: 'mdi:bacteria-outline', icon_color: '#C0CA33', title_color: '#C0CA33', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Off target (%)
    layout: {x: 0, y: 3, w: 2, h: 2}
