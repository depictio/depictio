    tag: ea-fate-card-total
    index: ea-fate-card-total
    section: Read fate
    workflow_tag: eager
    data_collection_tag: eager_read_fate
    aggregation: sum
    secondary_layout: top_n
    breakdown_col: step_trimming
    top_n_count: 3
    column_name: reads
    column_type: int64
    display: {icon_name: 'mdi:counter', icon_color: '#AB47BC', title_color: '#AB47BC', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Reads accounted for
    layout: {x: 0, y: 3, w: 2, h: 2}
