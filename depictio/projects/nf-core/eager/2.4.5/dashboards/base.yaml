  components:
  - component_type: text
    order: 1
    body: >
      [endorS.py](https://github.com/aidaanva/endorS.py), Picard, Qualimap and
      DamageProfiler each score a library on their own axis; the profile draws them on one
      plot, one line per library, each axis rescaled to its range. Brush an axis to narrow the
      profile, and pick a row of the pooled table in Library detail to read its record.
    tag: ea-lib-intro
    index: lib-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: eager_library_qc
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: clonality_pct
    column_type: float64
    display:
      icon_name: mdi:content-duplicate
      custom_color: violet
    section: Library filters
    group: Libraries
    tag: ea-lib-filter-clonality
    index: lib-clonality-range
    title: Clonality (%)
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    interactive_component_type: MultiSelect
    column_name: lane
    column_type: object
    display:
      icon_name: mdi:layers-outline
      custom_color: blue
    section: Library filters
    group: Lanes
    tag: ea-lib-filter-lane
    index: lib-lane-filter
    title: Lane
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: samples
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: composition
    breakdown_col: sample_name
    display:
      icon_name: mdi:test-tube
