    placement: left
    title: Lane
    layout: {x: 0, y: 6, w: 1, h: 3}

  - component_type: text
    tag: ea-fate-intro
    section: Read fate
    title: Five stages, and the reads that fall out at each
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Trimming drops short and low-quality reads, collapsing merges two
      overlapping mates into one sequence, mapping drops everything that is not
      the target organism, the mapping-quality filter drops ambiguous
      placements and deduplication drops PCR copies. Nothing here is
      apportioned: the AdapterRemoval counts balance exactly, and their
      retained total is the flagstat total to the read, so the flow closes
      stage by stage. Collapsing is an outflow rather than a stage of its own
      because one read of each merged pair stops existing there, and no report
      says which of the survivors were merged.
    workflow_tag: eager
    data_collection_tag: eager_read_fate
    layout: {x: 0, y: 0, w: 8, h: 3}
