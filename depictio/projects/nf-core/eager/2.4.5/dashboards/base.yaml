  - component_type: text
    tag: ea-geno-intro
    section: Variant calls
    title: What GATK called, and why the ratio is low
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [bcftools stats](https://samtools.github.io/bcftools/) over the GATK
      HaplotypeCaller VCFs. Read this next to the coverage curves above: a
      shallow, damaged library calls far fewer confident variants than its raw
      read count suggests. The transition to transversion ratio is worth a
      second look on ancient data, because deamination turns cytosines into
      thymines, which is a transition, so an undamaged-model caller reads
      damage as extra real variants.
    workflow_tag: eager
    data_collection_tag: bcftools_stats_summary
    layout: {x: 0, y: 0, w: 8, h: 3}
