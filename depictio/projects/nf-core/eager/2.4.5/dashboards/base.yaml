    column_name: ts_tv
    column_type: float64
    display: {icon_name: 'mdi:scale-balance', icon_color: '#EF5350', title_color: '#EF5350', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Ts to Tv ratio
    description: A germline call set usually lands near 2.0; deamination read as variation pushes it up, and a shallow, noisy call set pushes it down.
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ea-geno-card-multi
    index: ea-geno-card-multi
