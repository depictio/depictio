    display:
      icon_name: mdi:ruler
      icon_color: orange
      caption: bp per library, with its spread
      decimals: 1
    section: Damage at a glance
    tag: ea-auth-card-length
    index: auth-card-length
    title: Fragment length
    description: Mean length of each library's mapped fragments.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: damageprofiler_authenticity
    use: damageprofiler/authenticity
    aggregation: median
    column_name: fraction_under_70bp
    column_type: float64
