# Genome
# ============================================================================
- title: Coverage
  subtitle: How deep and how evenly is the reference covered?
  tab_group: Genome
  tab_order: 7
  tab_icon: mdi:waves
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Coverage filters
    icon: mdi:filter-variant
    color: blue
    description: Narrow the per-contig tiles by relative depth or contig length
  grid_sections:
  - name: Coverage at a glance
    icon: mdi:counter
    color: blue
    description: Depth per library and per contig, and the share of the reference seen
  - name: Per-contig depth
    icon: mdi:chart-scatter-plot
    color: blue
    description: Depth per reference sequence relative to the library mean, what a sex call reads
  - name: Depth distribution
    icon: mdi:chart-bell-curve
    color: blue
    description: How the depth is spread across the reference
  - name: Sex determination
    icon: mdi:account-group-outline
    color: gray
    description: Sex.DetERRmine's relative X and Y coverage, when the run enabled it
    collapsed: true
  - name: Coverage tables
    icon: mdi:table
    color: gray
    description: Per-contig depth and the genome fraction by depth threshold
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [Qualimap](http://qualimap.conesalab.org) BamQC depth per reference sequence, relative
      to each library's own mean: an even library sits on 1, the mitochondrion far above it, a
      sex chromosome near 0.5 or 1. The depth curves say whether a shallow library covers the
      genome thinly or piles up on a fraction of it.
    tag: ea-cov-intro
    index: cov-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_per_contig
    interactive_component_type: RangeSlider
    column_name: relative_coverage
    column_type: float64
    display:
      icon_name: mdi:scale-balance
      custom_color: cyan
    section: Coverage filters
    group: Contigs
    tag: ea-sex-filter-relative
    index: cov-relative-range
    title: Relative depth
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_per_contig
    interactive_component_type: RangeSlider
    column_name: length
    column_type: int64
    display:
      icon_name: mdi:ruler
      custom_color: indigo
    section: Coverage filters
    group: Contigs
    tag: ea-sex-filter-length
    index: cov-length-range
    title: Contig length
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: qualimap_bamqc_genome_results
    use: qualimap/bamqc_genome_results
    aggregation: median
    column_name: mean_coverage
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:waves
      icon_color: blue
      caption: median X per library, with its spread
      decimals: 2
    section: Coverage at a glance
    tag: ea-cov-card-depth
    index: cov-card-depth
    title: Mean coverage
    description: Mean depth over the whole reference, per library.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: qualimap_genome_fraction_coverage
    use: qualimap/genome_fraction_coverage
    aggregation: median
    column_name: genome_fraction_pct
    column_type: float64
    filter_expr: col('min_coverage') == 1
    secondary_layout: coverage
    coverage_max: 100
    display:
      icon_name: mdi:percent-outline
      icon_color: indigo
      caption: median % of the reference at 1X
      decimals: 1
    section: Coverage at a glance
    tag: ea-cov-card-fraction
    index: cov-card-fraction
    title: Genome covered
    description: Share of the reference each library covers at least once.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: qualimap_genome_fraction_coverage
    use: qualimap/genome_fraction_coverage
    aggregation: median
    column_name: genome_fraction_pct
    column_type: float64
    filter_expr: col('min_coverage') == 2
    secondary_layout: coverage
    coverage_max: 100
    display:
      icon_name: mdi:layers-triple-outline
      icon_color: teal
      caption: median % of the reference at 2X
      decimals: 1
    section: Coverage at a glance
    tag: ea-cov-card-2x
    index: cov-card-2x
    title: Genome at 2X
    description: Share of the reference each library covers at least twice; how fast it falls from 1X shows how thin the coverage is.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # Chromosome-scale sequences only: an organelle sits tens of times above 1
  # and unplaced scaffolds scatter near 0, which leaves one bar of the
  # histogram for everything else.
  - component_type: card
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_per_contig
    use: qualimap/coverage_per_contig
    aggregation: median
    column_name: relative_coverage
    column_type: float64
    filter_expr: col('length') >= 1000000
    secondary_layout: histogram
    display:
      icon_name: mdi:scale-balance
      icon_color: cyan
      caption: sequences of 1 Mb or more, distribution
      decimals: 2
    section: Coverage at a glance
    tag: ea-sex-card-relative
    index: cov-card-relative
    title: Relative depth
    description: Depth of each sequence of 1 Mb or more over its library's mean; an even library sits on 1, a sex chromosome near 0.5.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Contig ids label nothing a reader looks up at this density.
  - component_type: advanced_viz
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_per_contig
    use: qualimap/contig_depth_scatter
    config:
      x_title: Contig length (bp)
      y_title: Depth relative to the library mean
      log_x: true
      log_y: true
      reference_line: horizontal
      reference_value: 1.0
      top_n_labels: 0
      selection_enabled: true
      selection_column: sample
    section: Per-contig depth
    tag: ea-sex-av-contig
    index: cov-contig-scatter
    title: Relative depth against contig length
    description: Long chromosomes cluster on 1; short contigs scatter, an organelle sits far above.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_histogram
    use: qualimap/depth_histogram_profile
    config:
      x_title: Depth (X)
      y_title: Share of the reference
      log_y: true
    section: Depth distribution
    tag: ea-dist-av-hist
    index: cov-depth-histogram
    title: Depth histogram
    description: Share of the reference at each depth, per library, on a log scale.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: eager
    data_collection_tag: qualimap_genome_fraction_coverage
    use: qualimap/genome_fraction_profile
    config:
      x_title: Depth threshold (X)
      y_title: Genome covered (%)
      # The curve falls to 0 within a few X on a shallow library; a log axis
      # keeps that drop from filling a tenth of the plot.
      log_x: true
      selection_enabled: true
      selection_column: sample
    section: Depth distribution
    tag: ea-dist-av-fraction
    index: cov-genome-fraction
    title: Share of the reference covered at least X deep
    description: Where this curve meets 1X is how much of the genome was seen at all.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: sexdeterrmine
    row_selection_enabled: false
    section: Sex determination
    tag: ea-sex-table-sexdet
    index: cov-table-sexdet
    title: Sex.DetERRmine
    description: Relative X and Y coverage per library, with their errors, as Sex.DetERRmine reports them.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_per_contig
    use: qualimap/coverage_per_contig
    row_selection_enabled: true
    row_selection_column: sample
    section: Coverage tables
    tag: ea-sex-table
    index: cov-table-contig
    title: Coverage per contig
    description: One row per library and reference sequence, with its length, mapped bases and depth.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: qualimap_genome_fraction_coverage
    use: qualimap/genome_fraction_coverage
    row_selection_enabled: true
    row_selection_column: sample
    section: Coverage tables
    tag: ea-dist-table
    index: cov-table-fraction
    title: Genome fraction by depth threshold
    description: One row per library and depth threshold, with the share of the reference reaching it.
    layout: {x: 0, y: 6, w: 8, h: 6}
- title: Locus
  subtitle: How deep and how well mapped is one region?
  tab_group: Genome
  tab_order: 8
  tab_icon: mdi:map-marker-outline
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # No position or chromosome control: the navigator's brush and locus field
  # own the region filter on the depth windows, and the four cards follow it.
  # No histogram on the window depth: an organelle window puts every nuclear
  # window in the first bin.
  filter_sections:
  - name: Locus filters
    icon: mdi:filter-variant
    color: cyan
    description: Narrow the depth windows by their depth
  grid_sections:
  - name: Region at a glance
    icon: mdi:counter
    color: cyan
    description: The windows in view, the whole reference or the navigator's region once picked
  - name: Depth along the reference
    icon: mdi:waves
    color: cyan
    description: Depth and mapping quality on one contig axis that follows the navigator
  - name: Window table
    icon: mdi:table
    color: gray
    description: The depth windows of the navigator's region
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [Qualimap](http://qualimap.conesalab.org) depth and mapping quality per window, placed
      back on the contig each window falls in. Type a contig or range in the navigator's
      header, or brush its axis, to move every tile of the tab. A dip in mapping quality under
      a depth dip marks repeats the mapper could not place.
    tag: ea-locus-intro
    index: locus-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_across_reference
    interactive_component_type: RangeSlider
    column_name: coverage
    column_type: float64
    display:
      icon_name: mdi:waves
      custom_color: cyan
    section: Locus filters
    group: Windows
    tag: ea-cov-filter-window-depth
    index: locus-depth-range
    title: Window depth (X)
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_across_reference
    use: qualimap/coverage_across_reference
    aggregation: median
    column_name: coverage
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:waves
      icon_color: cyan
      caption: median X per window, with its spread
      decimals: 2
    follow_region_filter: true
    section: Region at a glance
    tag: ea-cov-card-mean
    index: locus-card-depth
    title: Window depth
    description: Mean depth of the windows in the navigator's region.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_across_reference
    use: qualimap/coverage_across_reference
    aggregation: count
    column_name: coverage
    column_type: float64
    secondary_layout: threshold
    threshold_value: 1
    threshold_direction: min
    follow_region_filter: true
    display:
      icon_name: mdi:chart-line
      icon_color: violet
      caption: windows in view, 1X or deeper passes
      decimals: 0
    section: Region at a glance
    tag: ea-cov-card-peak
    index: locus-card-peak
    title: Windows
    description: Depth windows per library in view, and how many reach a mean depth of 1X.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_across_reference
    use: qualimap/coverage_across_reference
    aggregation: median
    column_name: coverage_std
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: blue
      caption: median per window, with its spread
      decimals: 2
    follow_region_filter: true
    section: Region at a glance
    tag: ea-cov-card-std
    index: locus-card-std
    title: Depth spread
    description: Standard deviation of the depth within each window.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: qualimap_mapq_across_reference
    aggregation: median
    column_name: mapping_quality
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:target
      icon_color: teal
      caption: median per window, distribution
      decimals: 1
    follow_region_filter: true
    section: Region at a glance
    tag: ea-cov-card-mapq
    index: locus-card-mapq
    title: Mapping quality
    description: Mean mapping quality of the windows in the navigator's region.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # The navigator is the only tile on the depth windows that draws a track;
  # the MAPQ track under it reads a second collection, reached by the region
  # link in template.yaml. A non-model reference has no GenomeSpy built-in
  # assembly, so `assembly` stays null and the contig list comes from the data.
  # default_region: first opens the navigator on the whole first contig of
  # the data, whatever the reference names it; a typed or brushed region
  # narrows the tab.
  - component_type: advanced_viz
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_across_reference
    use: qualimap/reference_genome_view
    config:
      score_title: Mean depth (X)
      mark: point
      point_size: 4
      facet_by_sample: true
      region_filter_enabled: true
      default_region: first
    section: Depth along the reference
    tag: ea-cov-av-genomeview
    index: locus-genome-view
    title: Locus navigator, depth per window
    description: One lane per library on the contig axis; its locus field and brush move the tab.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: eager
    data_collection_tag: qualimap_mapq_across_reference
    viz_kind: coverage_track
    config:
      viz_kind: coverage_track
      chromosome_col: chromosome
      position_col: position
      value_col: mapping_quality
      sample_col: sample
      view_mode: facet
      color_by: sample
      smoothing_window: 0
      show_annotation_lane: false
      view: track
      views: [track]
    section: Depth along the reference
    tag: ea-cov-av-mapq
    index: locus-mapq-track
    title: Mapping quality along the region
    description: Mean MAPQ per window, one lane per library, clamped to the navigator's region.
    layout: {x: 0, y: 5, w: 8, h: 5}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_across_reference
    use: qualimap/coverage_across_reference
    row_selection_enabled: true
    row_selection_column: sample
    section: Window table
    tag: ea-cov-table-track
    index: locus-table
    title: Windowed depth
    description: One row per library and window of the region, with its contig and position.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Genotypes
  subtitle: How many variants did each sample yield, and how clean?
  tab_group: Genome
  tab_order: 9
  tab_icon: mdi:scale-balance
  tab_icon_color: pink
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Genotype filters
    icon: mdi:filter-variant
    color: pink
    description: Narrow the call sets to one variant caller
  grid_sections:
  - name: Calls at a glance
    icon: mdi:counter
    color: pink
    description: SNPs, indels, the Ts to Tv ratio and multiallelic sites
  - name: Calls per sample
    icon: mdi:chart-bar
    color: pink
    description: SNPs and the Ts to Tv ratio, sample by sample and caller by caller
  - name: Genotype tables
    icon: mdi:table
    color: gray
    description: Variant counts and transition and transversion counts per sample
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [bcftools stats](https://samtools.github.io/bcftools/) over the genotyping VCFs, per
      biological sample and caller. A shallow, damaged library calls far fewer confident
      variants than its read count suggests, and deamination read as variation inflates the
      transitions.
    tag: ea-geno-intro
    index: geno-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: bcftools_stats_summary
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:tools
      custom_color: pink
    section: Genotype filters
    group: Calls
    tag: ea-geno-filter-caller
    index: geno-caller-filter
    title: Variant caller
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    aggregation: sum
    column_name: n_snps
    column_type: int64
    secondary_layout: composition
    breakdown_col: sample
    display:
      icon_name: mdi:file-document-outline
      icon_color: pink
      caption: SNPs, by biological sample
    section: Calls at a glance
    tag: ea-geno-card-snps
    index: geno-card-snps
    title: SNPs called
    description: SNPs in the genotyping VCFs, split by the sample they were called in.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    aggregation: sum
    column_name: n_indels
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:shape-outline
      icon_color: violet
      caption: per sample and caller, distribution
    section: Calls at a glance
    tag: ea-geno-card-indels
    index: geno-card-indels
    title: Indels called
    description: Insertions and deletions over the samples in view.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: bcftools_stats_tstv
    use: bcftools/stats_tstv
    aggregation: median
    column_name: ts_tv
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:swap-vertical
      icon_color: red
      caption: median per sample, with its spread
      decimals: 2
    section: Calls at a glance
    tag: ea-geno-card-tstv
    index: geno-card-tstv
    title: Ts to Tv ratio
    description: A germline call set lands near 2; deamination read as variation pushes it up.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    aggregation: sum
    column_name: n_multiallelic_sites
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:call-split
      icon_color: teal
      caption: per sample and caller, with their spread
    section: Calls at a glance
    tag: ea-geno-card-multi
    index: geno-card-multi
    title: Multiallelic sites
    description: Sites with more than one alternate allele, a sign of noise on a haploid or shallow sample.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: eager
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    visu_type: bar
    dict_kwargs:
      x: sample
      y: n_snps
      color: caller
      barmode: group
      labels: {sample: '', n_snps: SNPs called, caller: Caller}
    section: Calls per sample
    tag: ea-geno-fig-snps
    index: geno-snps-bar
    title: SNPs called per sample
    description: SNPs per biological sample, one bar per variant caller.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: eager
    data_collection_tag: bcftools_stats_tstv
    use: bcftools/stats_tstv
    visu_type: bar
    dict_kwargs:
      x: sample
      y: ts_tv
      color: caller
      barmode: group
      labels: {sample: '', ts_tv: Ts to Tv ratio, caller: Caller}
    section: Calls per sample
    tag: ea-geno-fig-tstv
    index: geno-tstv-bar
    title: Ts to Tv ratio per sample
    description: The transition to transversion ratio per sample, one bar per variant caller.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    row_selection_enabled: true
    row_selection_column: sample
    section: Genotype tables
    tag: ea-geno-table-summary
    index: geno-table-summary
    title: Variant counts per sample and caller
    description: Records, SNPs, indels and multiallelic sites, straight out of the bcftools stats SN block.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: bcftools_stats_tstv
    use: bcftools/stats_tstv
    row_selection_enabled: true
    row_selection_column: sample
    section: Genotype tables
    tag: ea-geno-table-tstv
    index: geno-table-tstv
    title: Transition and transversion counts
    description: The TSTV block of the same reports, with the ratio on all alleles and on the first alternate.
    layout: {x: 0, y: 6, w: 8, h: 6}
