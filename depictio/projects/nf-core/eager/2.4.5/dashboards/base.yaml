  - component_type: text
    tag: ea-cov-intro
    section: Depth along the reference
    title: How deep, and how even, along the reference
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [Qualimap](http://qualimap.conesalab.org) BamQC depth and mapping
      quality per window, placed back on the contig each window falls in. The
      navigator opens on the template's default region (the first chromosome
      of the megatest reference, or the whole-reference overview when that
      contig is absent); type a contig or range in its header, or brush its
      axis, to move every tile of this section.
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_across_reference
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ea-cov-card-mean
    index: ea-cov-card-mean
    section: Depth along the reference
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_across_reference
    use: qualimap/coverage_across_reference
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: coverage
    column_type: float64
    display: {icon_name: 'mdi:waves', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Windowed depth (X)
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ea-cov-card-peak
    index: ea-cov-card-peak
    section: Depth along the reference
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_across_reference
    use: qualimap/coverage_across_reference
    aggregation: max
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: coverage
    column_type: float64
    display: {icon_name: 'mdi:chart-line', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Deepest window (X)
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ea-cov-card-std
    index: ea-cov-card-std
    section: Depth along the reference
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_across_reference
    use: qualimap/coverage_across_reference
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: coverage_std
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', icon_color: '#42A5F5', title_color: '#42A5F5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Depth spread within a window
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ea-cov-card-mapq
    index: ea-cov-card-mapq
    section: Depth along the reference
    workflow_tag: eager
    data_collection_tag: qualimap_mapq_across_reference
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: mapping_quality
    column_type: float64
    display: {icon_name: 'mdi:target', icon_color: '#26A69A', title_color: '#26A69A', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Windowed mapping quality
    layout: {x: 6, y: 2, w: 2, h: 2}
  # The navigator is the only tile on the depth windows that draws a track;
  # the MAPQ track under it reads a second collection, reached by the region
  # link in template.yaml. A non-model reference has no GenomeSpy built-in
  # assembly, so `assembly` stays null and the contig list comes from the data.
  - component_type: advanced_viz
    tag: ea-cov-av-genomeview
    index: ea-cov-av-genomeview
    section: Depth along the reference
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_across_reference
    use: qualimap/reference_genome_view
    config:
      controls_placement: header
      score_title: Mean depth (X)
      mark: point
      point_size: 4
      facet_by_sample: true
      region_filter_enabled: true
      default_region: "NC_044048.1:1-30,875,876"
    title: Locus navigator, depth per window
    description: One lane per library on the contig axis. The locus field in the header and a brush on this axis move every tile of the section.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 3}
  - component_type: advanced_viz
    tag: ea-cov-av-mapq
    index: ea-cov-av-mapq
    section: Depth along the reference
    workflow_tag: eager
    data_collection_tag: qualimap_mapq_across_reference
    viz_kind: coverage_track
    config:
      viz_kind: coverage_track
      chromosome_col: chromosome
      position_col: position
      value_col: mapping_quality
      sample_col: sample
      view_mode: facet
      color_by: sample
      smoothing_window: 0
      show_annotation_lane: false
      view: track
      views: [track]
    title: Mapping quality along the region
    description: Mean MAPQ per window, one lane per library, clamped to the navigator's region. A dip under a depth dip marks repeats the mapper could not place.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 3}

  - component_type: text
    tag: ea-geno-intro
    section: Variant calls
    title: What the caller called, read next to the depth
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [bcftools stats](https://samtools.github.io/bcftools/) over the
      genotyping VCFs, per biological sample. A shallow, damaged library calls
      far fewer confident variants than its read count suggests, and
      deamination inflates the transition count.
    workflow_tag: eager
    data_collection_tag: bcftools_stats_summary
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ea-geno-card-snps
    index: ea-geno-card-snps
    section: Variant calls
    workflow_tag: eager
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    aggregation: sum
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 4
    column_name: n_snps
    column_type: int64
    display: {icon_name: 'mdi:scale-balance', icon_color: '#AB47BC', title_color: '#AB47BC', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: SNPs called
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ea-geno-card-indels
    index: ea-geno-card-indels
    section: Variant calls
    workflow_tag: eager
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    aggregation: sum
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 4
    column_name: n_indels
    column_type: int64
    display: {icon_name: 'mdi:shape-outline', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Indels called
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ea-geno-card-tstv
    index: ea-geno-card-tstv
    section: Variant calls
    workflow_tag: eager
    data_collection_tag: bcftools_stats_tstv
    use: bcftools/stats_tstv
    aggregation: average
    aggregations: [box_plot_stats]
