      endogenous DNA, clonality, depth, mapping quality, error rate, GC,
      terminal C-to-T and fragment length. With two libraries the min-max scale
      stretches every axis end to end, so read the ticks: most gaps are small,
      but COD076E1bL1 carries 2.4 times the terminal damage of COD092E1bL1i69
