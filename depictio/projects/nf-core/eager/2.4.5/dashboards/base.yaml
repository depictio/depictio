    column_name: step_duplication
    column_type: object
    display: {title_size: md, custom_color: '#AB47BC', icon_name: 'mdi:set-merge'}
    placement: left
    title: Final fate
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: ea-fate-filter-lane
    index: ea-fate-lane-filter
    section: Fate scope
    group: Fate scope
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    interactive_component_type: MultiSelect
    column_name: lane
    column_type: object
    display: {title_size: md, custom_color: '#AB47BC', icon_name: 'mdi:layers-outline'}
    placement: left
    title: Lane
    layout: {x: 0, y: 6, w: 1, h: 3}

  - component_type: text
    tag: ea-fate-intro
    section: Read fate
    title: Five stages, and the reads that fall out at each
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Trimming drops short and low-quality reads, collapsing merges two
      overlapping mates into one sequence, mapping drops everything that is not
      the target organism, the quality filter drops ambiguous placements and
      deduplication drops PCR copies. Nothing is apportioned: the
      AdapterRemoval counts balance and their retained total is the flagstat
      total, so the flow closes stage by stage.
    workflow_tag: eager
    data_collection_tag: eager_read_fate
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ea-fate-card-total
    index: ea-fate-card-total
    section: Read fate
    workflow_tag: eager
    data_collection_tag: eager_read_fate
    aggregation: sum
    secondary_layout: top_n
    breakdown_col: step_trimming
    top_n_count: 3
    column_name: reads
    column_type: int64
    display: {icon_name: 'mdi:counter', icon_color: '#AB47BC', title_color: '#AB47BC', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Reads accounted for
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ea-fate-card-final
    index: ea-fate-card-final
    section: Read fate
    workflow_tag: eager
    data_collection_tag: eager_read_fate
    aggregation: sum
    secondary_layout: donut
    breakdown_col: step_duplication
    column_name: reads
    column_type: int64
    display: {icon_name: 'mdi:chart-donut', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Reads by final fate
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ea-fate-card-discard
    index: ea-fate-card-discard
    section: Read fate
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: discard_rate
    column_type: float64
    display: {icon_name: 'mdi:delete-outline', icon_color: '#EF5350', title_color: '#EF5350', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Discard rate per lane
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ea-fate-card-collapse
    index: ea-fate-card-collapse
    section: Read fate
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: collapse_rate
    column_type: float64
    display: {icon_name: 'mdi:set-merge', icon_color: '#42A5F5', title_color: '#42A5F5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Collapse rate per lane
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: ea-fate-av-sankey
    index: ea-fate-av-sankey
    section: Read fate
    workflow_tag: eager
    viz_kind: sankey
    data_collection_tag: eager_read_fate
    config:
      viz_kind: sankey
      step_cols:
      - step_sequencing
      - step_trimming
      - step_mapping
      - step_filtering
      - step_duplication
      value_col: reads
      value_label: reads
      value_format: count
      sort_mode: total_flow
      color_mode: source
      link_opacity: 0.55
      show_node_labels: true
    title: Read fate, sequencing to deduplication
    description: Every sequenced read, followed to where it stopped. Collapsing is an outflow because one read of each merged pair stops existing there. Pick a library in the left panel to see one flow at a time.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 9}

  - component_type: text
    tag: ea-fate-yield-intro
    section: Lane yield
    title: What each lane returned
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [AdapterRemoval](https://github.com/MikkelSchubert/adapterremoval) runs
      per lane, so this is where a bad lane or a differently prepared library
      shows before the lanes are merged. A collapsed read is one sequence
      spanning a whole fragment, which is why the mapper sees fewer sequences
      than the sequencer produced.
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: ea-hub-fig-retained
    index: ea-hub-fig-retained
    section: Lane yield
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    visu_type: bar
    dict_kwargs: {x: lane_id, y: retained_reads, color: sample_id}
    title: Reads kept for mapping, per lane
    description: Sequences AdapterRemoval wrote out, which is exactly what the mapper was given.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 6}
  - component_type: advanced_viz
    tag: ea-hub-av-collapse
    index: ea-hub-av-collapse
    section: Lane yield
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    use: adapterremoval/collapse_vs_length
    config:
      controls_placement: header
      x_col: average_retained_length
      y_col: collapse_rate
      label_col: lane_id
      color_col: sample_id
      size_col: retained_reads
      x_title: Mean retained length (bp)
      y_title: Collapse rate
      top_n_labels: 6
      selection_enabled: true
      selection_column: lane_id
    title: Collapse rate against retained length
    description: A lane whose inserts are shorter than the read length collapses more of its pairs, so the two move together within a library and separate between libraries.
    title_size: h3
    layout: {x: 0, y: 8, w: 8, h: 7}
  - component_type: figure
    tag: ea-hub-fig-discard
    index: ea-hub-fig-discard
    section: Lane yield
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    visu_type: bar
    dict_kwargs: {x: lane_id, y: discard_rate, color: sample_id}
    title: Share of reads discarded on quality or length, per lane
    description: Reads AdapterRemoval dropped before mapping, as a fraction of everything sequenced on that lane.
    title_size: h3
    layout: {x: 0, y: 15, w: 8, h: 6}

  - component_type: table
    tag: ea-fate-table
    section: Read fate tables
    workflow_tag: eager
    data_collection_tag: eager_read_fate
    row_selection_enabled: true
    row_selection_column: sample
    title: Read fate, as counts
    description: One row per library and path through the five stages, with the reads that took it.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 5}

# ============================================================================
# Mapping, endogenous DNA and duplication
# ============================================================================
- title: Mapping, endogenous DNA and duplication
  subtitle: How much of each extract is the target organism, how much of that survives filtering and deduplication, and what the rest is when a screen ran
  tab_order: 4
  tab_icon: mdi:chart-bar
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Mapping scope
    icon: mdi:filter-variant
    color: indigo
    description: Narrow this tab by filter stage, by how on-target a library stays, or by its duplication
  grid_sections:
  - name: Endogenous DNA
    icon: mdi:dna
    color: teal
    description: The share of each extract that is the target organism
  - name: Alignment
    icon: mdi:chart-bar
    color: indigo
