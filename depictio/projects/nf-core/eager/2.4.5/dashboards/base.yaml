  - component_type: card
    tag: ea-dup-card-kept
    index: ea-dup-card-kept
    section: Duplication and complexity
    workflow_tag: eager
    data_collection_tag: picard_markduplicates_metrics
    use: picard/markduplicates_metrics
    aggregation: sum
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 4
    column_name: reads_after_dedup
    column_type: int64
    display: {icon_name: 'mdi:check-decagram', icon_color: '#26A69A', title_color: '#26A69A', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Unique reads kept
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: ea-dup-av-endo-clonality
    index: ea-dup-av-endo-clonality
    section: Duplication and complexity
    workflow_tag: eager
    data_collection_tag: eager_library_qc
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      controls_placement: header
      x_col: clonality_pct
      y_col: endogenous_dna
      label_col: sample
      color_col: sample
      size_col: mean_coverage
      x_title: Clonality, Picard duplicates (%)
      y_title: Endogenous DNA (%)
      top_n_labels: 4
      marker_size: 14
      selection_enabled: true
      selection_column: sample
    title: Endogenous DNA against clonality
    description: The screening plane. A library worth sequencing deeper sits high (much of the extract is the organism) and left (few PCR copies yet); marker size is the depth already reached.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 7}
  - component_type: advanced_viz
    tag: ea-dup-av-scatter
