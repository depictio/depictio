version: 1
# nf-core/eager 2.4.5, on the family rules of depictio/projects/nf-core/RULES.md
# (ampliseq/2.18.0 is the reference implementation).
#
# Funnel: the reads and the libraries they came from (Data & QC) -> how much of
# each extract is the target organism, how complex the libraries are and
# whether the DNA is authentically ancient (Ancient DNA) -> how deep the
# genome is covered, along the reference, and the genotypes called from it
# (Genome). The library hub (`samples`, one row per Library_ID) is what every
# filter starts from; the genotyping collections key on the biological sample
# (`sample_name`) instead.
#
# The MultiQC report bound here was re-generated with MultiQC 1.35 from the
# run's raw tool outputs (eager 2.x writes a pre-parquet report), so module and
# plot names are the 1.35 ones. DSL1 wrote no params.json either: the Run
# parameters dialog lists the software versions, which is what the `params:`
# links search.
#
# Optional eager branches (Sex.DetERRmine, MTNucRatio, ANGSD contamination,
# MaltExtract, Kraken) each have one table tile, in a collapsed section, bound
# to their `optional: true` collection; the import drops a tile whose
# collection is absent.
main_dashboard:
  title: nf-core/eager
  subtitle: Ancient DNA, from the reads to authentication, coverage and genotypes
  project_tag: Ancient DNA Authentication
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family. eager has no
  # GROUP_COL: the vocabularies below are the read fates, the filter stage,
  # the read end and the substitution classes, written out.
  category_colors:
    udg_treatment:
      none: '#f59f00'
      half: '#1098ad'
      full: '#7048e8'
    step_trimming:
      Retained by trimming: '#1c7ed6'
      Merged on collapse: '#7048e8'
      Discarded by trimming: '#adb5bd'
    step_mapping:
      Mapped: '#0ca678'
      Unmapped: '#868e96'
    step_filtering:
      Passed the quality filter: '#0ca678'
      Below the quality filter: '#f76707'
    step_duplication:
      Unique: '#0ca678'
      PCR duplicate: '#e03131'
      Below the quality filter: '#f76707'
      Unmapped: '#868e96'
      Merged on collapse: '#7048e8'
      Discarded by trimming: '#adb5bd'
    stage:
      pre-filter: '#74c0fc'
      post-filter: '#1971c2'
    end:
      5p: '#e03131'
      3p: '#1971c2'
    base_change:
      C>T: '#e03131'
      G>A: '#1971c2'
      other: '#adb5bd'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. The
  # sample filters are bound to the library hub, the source of every library
  # link; the QC floors narrow the hub through the qualimap and endorS.py
  # links back to it, and through it every tab.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  - name: QC thresholds
    icon: mdi:tune
    color: cyan
    description: Coverage, duplication and endogenous-DNA floors on the libraries
    collapsed: true
    persistent: true
    pin: bottom
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab, which no route removes.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The library hub behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: Per-library coverage and duplication, the table the QC thresholds read
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Libraries,
  # below). The biological sample plays the group's part.
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_name
    column_type: object
    display:
      icon_name: mdi:account-group-outline
      custom_color: violet
      strip_label: Sample
    section: Key figures
    tag: ea-ov-kf-sample
    index: ov-kf-sample
    title: Sample
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
      strip_label: Library
    section: Key figures
    tag: ea-ov-kf-library
    index: ov-kf-library
    title: Library
    layout: {x: 2, y: 0, w: 2, h: 1}
  # The pipeline's wordmark, read from its repository. eager ships no dark-page
  # variant, so a dark page, or a page that cannot load it, draws the title as text.
  - component_type: text
    title: nf-core/eager
    logo: https://raw.githubusercontent.com/nf-core/eager/master/docs/images/nf-core-eager_logo.png
    order: 1
    body: >
      Ancient-DNA reads followed from trimming to genotypes: how much of each extract is the
      organism, how complex the libraries are, whether the DNA is authentically old and how
      deep the genome is covered. [Run parameters](params:)
    tag: ea-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/eager trims and collapses ancient-DNA reads, maps them to a reference, removes PCR duplicates, measures the damage that authenticates old DNA and calls genotypes. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The sample filters in the left panel apply to every tab: narrow the libraries once and the whole dashboard follows. A bar above a section narrows that section only.
    tag: ea-ov-about
    index: ov-about
    layout: {x: 0, y: 1, w: 5, h: 3}
  # DSL1 wrote no params.json, so the run's facts come from its own tables.
  - component_type: text
    surface: card
    values:
      libraries: {dc: samples, column: sample_id, aggregation: nunique, format: integer}
      samples: {dc: samples, column: sample_name, aggregation: nunique, format: integer}
      udg: {dc: samples, column: udg_treatment, aggregation: top}
      organism: {dc: samples, column: organism, aggregation: top}
      lanes: {dc: eager_lane_stats, column: lane_id, aggregation: nunique, format: integer}
      reads: {dc: eager_lane_stats, column: total_reads, aggregation: sum, format: si}
    body: |
      ### The run
      - ![](icon:mdi:test-tube) **Libraries** {{libraries}} from {{samples}} samples
      - ![](icon:mdi:flask-outline) **UDG** {{udg}}, most libraries
      - ![](icon:mdi:dna) **Organism** {{organism}}
      - ![](icon:mdi:layers-outline) **Lanes** {{lanes}}, {{reads}} reads
    tag: ea-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  # The marks take the family's colour (the header's), not the theme's blue.
  # A `params:` link searches the software versions the run recorded.
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Six steps from reads to genotypes
      Each step names the tool version it ran and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:content-cut) **Trim** AdapterRemoval cuts adapters and collapses mates · [Version](params:AdapterRemoval) · [Read fate](tab:Read fate)
      2. ![](icon:mdi:dna) **Map** BWA by default, then a mapping-quality filter · [Version](params:BWA) · [Endogenous DNA](tab:Endogenous DNA)
      3. ![](icon:mdi:content-duplicate) **Deduplicate** PCR copies removed, complexity extrapolated · [Version](params:Picard) · [Complexity](tab:Complexity)
      4. ![](icon:mdi:shield-check-outline) **Authenticate** DamageProfiler, deamination and fragment length · [Version](params:DamageProfiler) · [Authentication](tab:Authentication)
      5. ![](icon:mdi:waves) **Cover** Qualimap depth per contig and along the reference · [Version](params:Qualimap) · [Coverage](tab:Coverage)
      6. ![](icon:mdi:scale-balance) **Genotype** Variants called, summed up by bcftools stats · [Version](params:bcftools) · [Genotypes](tab:Genotypes)
      :::
    tag: ea-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. The icon colour is that tab's colour.
  - component_type: card
    workflow_tag: eager
    data_collection_tag: samples
    aggregation: count
    column_name: sample_id
    column_type: object
    secondary_layout: composition
    breakdown_col: sample_name
    display:
      icon_name: mdi:test-tube
      icon_color: teal
      caption: libraries, by biological sample
      link: tab:Libraries
    section: Key figures
    tag: ea-ov-kf-libraries
    index: ov-kf-libraries
    title: Libraries
    description: Libraries in the hub, one per Library_ID once eager merged its lanes. The bar splits them by the sample they were prepared from.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: endorspy_endogenous
    use: endorspy/endogenous
    aggregation: median
    column_name: endogenous_dna
    column_type: float64
    secondary_layout: coverage
    coverage_max: 100
    display:
      icon_name: mdi:dna
      icon_color: green
      caption: median % of reads on the reference
      link: tab:Endogenous DNA
      decimals: 1
    section: Key figures
    tag: ea-ov-kf-endogenous
    index: ov-kf-endogenous
    title: Endogenous DNA
    description: Median share of each library's reads that map to the reference, before filtering (endorS.py).
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: damageprofiler_authenticity
    use: damageprofiler/authenticity
    aggregation: median
    column_name: ct_5p_first
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:shield-check-outline
      icon_color: red
      caption: C to T at the first base, per library
      link: tab:Authentication
      format: percent
    section: Key figures
    tag: ea-ov-kf-damage
    index: ov-kf-damage
    title: Terminal deamination
    description: Median C to T frequency at the first 5 prime base, the mark of ancient DNA. The box shows how it spreads across libraries.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: qualimap_genome_fraction_coverage
    use: qualimap/genome_fraction_coverage
    aggregation: median
    column_name: genome_fraction_pct
    column_type: float64
    filter_expr: col('min_coverage') == 1
    secondary_layout: coverage
    coverage_max: 100
    display:
      icon_name: mdi:waves
      icon_color: blue
      caption: median % of the reference at 1X
      link: tab:Coverage
      decimals: 1
    section: Key figures
    tag: ea-ov-kf-genome
    index: ov-kf-genome
    title: Genome covered
    description: Median share of the reference each library covers at least once (Qualimap).
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the biological sample, then the UDG treatment.
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_name
    column_type: object
    display:
      icon_name: mdi:account-group-outline
      custom_color: violet
      strip_label: Sample
    section: Findings
    tag: ea-ov-findings-sample
    index: ov-findings-sample
    title: Sample
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: udg_treatment
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: grape
      strip_label: UDG
    section: Findings
    tag: ea-ov-findings-udg
    index: ov-findings-udg
    title: UDG treatment
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data.
  - component_type: text
    surface: card
    values:
      endo_post: {dc: endorspy_endogenous, column: endogenous_dna_post, aggregation: median, format: 'decimals:1'}
      dup: {dc: picard_markduplicates_metrics, column: percent_duplication, aggregation: median,
        format: percent}
      frag_len: {dc: damageprofiler_authenticity, column: mean_length, aggregation: median, format: 'decimals:0'}
      depth: {dc: qualimap_bamqc_genome_results, column: mean_coverage, aggregation: median,
        format: 'decimals:2'}
    body: |
      - **{{endo_post}}%** of the reads stay on target after filtering – endorS.py, median per library [Endogenous DNA](tab:Endogenous DNA)
      - **{{dup}}** of the reads checked are PCR duplicates – Picard, median per library [Complexity](tab:Complexity)
      - **{{frag_len}} bp** median fragment length – short fragments mark old DNA [Authentication](tab:Authentication)
      - **{{depth}}X** median depth over the reference – Qualimap, per library [Coverage](tab:Coverage)
    section: Findings
    tag: ea-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per analysis tab, in the order of the rows above. Each source
  # draws one point or curve per library, so the legend is hidden and the
  # caption says what the colour is.
  - component_type: highlight
    section: Findings
    source_tab: Endogenous DNA
    source_component: endo-pre-post
    caption: One point per library, endogenous DNA before against after filtering; below the diagonal is what filtering lost.
    hide_legend: true
    tag: ea-ov-hl-endogenous
    index: ov-hl-endogenous
    layout: {x: 0, y: 2, w: 5, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Complexity
    source_component: cx-complexity-curve
    caption: Distinct molecules against depth, one curve per library; a flat curve has run out of molecules.
    hide_legend: true
    tag: ea-ov-hl-complexity
    index: ov-hl-complexity
    layout: {x: 5, y: 2, w: 3, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Authentication
    source_component: auth-plane
    caption: One point per library; short and damaged, top left, is ancient.
    hide_legend: true
    tag: ea-ov-hl-authentication
    index: ov-hl-authentication
    layout: {x: 0, y: 6, w: 3, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Coverage
    source_component: cov-genome-fraction
    caption: Share of the reference covered at least as deep as each threshold, one curve per library.
    hide_legend: true
    tag: ea-ov-hl-coverage
    index: ov-hl-coverage
    layout: {x: 3, y: 6, w: 5, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Libraries](tab:Libraries)
      - [Read fate](tab:Read fate)

      ### Ancient DNA
      - [Endogenous DNA](tab:Endogenous DNA)
      - [Complexity](tab:Complexity)
      - [Authentication](tab:Authentication)

      ### Genome
      - [Coverage](tab:Coverage)
      - [Locus](tab:Locus)
      - [Genotypes](tab:Genotypes)
    section: How to read this dashboard
    tag: ea-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the biological sample first.
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_name
    column_type: object
    display:
      icon_name: mdi:account-group-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: ea-filter-sample
    index: sample-filters-sample
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: ea-filter-library
    index: sample-filters-library
    title: Library
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: udg_treatment
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: grape
    section: Sample filters
    group: Sample scope
    tag: ea-filter-udg
    index: sample-filters-udg
    title: UDG treatment
    layout: {x: 0, y: 6, w: 1, h: 2}
  # QC floors. Each collection links back to the library hub (template.yaml),
  # so a floor narrows the hub and the hub fans the pick out to every tab.
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: qualimap_bamqc_genome_results
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: mean_coverage
    column_type: float64
    display:
      icon_name: mdi:waves
      custom_color: blue
    section: QC thresholds
    group: Library quality
    tag: ea-filter-coverage
    index: qc-coverage-range
    title: Mean coverage
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: qualimap_bamqc_genome_results
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: duplication_rate
    column_type: float64
    display:
      icon_name: mdi:content-duplicate
      custom_color: violet
    section: QC thresholds
    group: Library quality
    tag: ea-filter-duprate
    index: qc-duprate-range
    title: Duplication rate
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: endorspy_endogenous
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: endogenous_dna
    column_type: float64
    display:
      icon_name: mdi:dna
      custom_color: green
    section: QC thresholds
    group: Library quality
    tag: ea-filter-endogenous
    index: qc-endogenous-range
    title: Endogenous DNA
    layout: {x: 0, y: 6, w: 1, h: 3}
  # Row selection feeds the Analysis panel.
  - component_type: table
    workflow_tag: eager
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Sample sheet
    tag: ea-sample-sheet
    index: sample-sheet
    title: Library hub
    description: One row per library, with its sample, organism, UDG treatment and lane count.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: qualimap_bamqc_genome_results
    use: qualimap/bamqc_genome_results
    row_selection_enabled: true
    row_selection_column: sample
    section: Reference tables
    tag: ea-ref-table-qualimap
    index: ref-bamqc
    title: BamQC summary
    description: Mean coverage, mapping quality, error rate and duplication per library.
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
# ============================================================================
# Data & QC
# ============================================================================
- title: MultiQC
  subtitle: Did sequencing and trimming work for every library?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: MultiQC report
    icon: mdi:file-document-outline
    color: orange
    description: Libraries as the MultiQC report names them
  grid_sections:
  - name: QC overview
    icon: mdi:view-dashboard-outline
    color: orange
    description: Every module's headline numbers, the raw read counts and the collapsed lengths
  - name: Read quality
    icon: mdi:chart-bell-curve
    color: orange
    description: Base quality along the read and the GC content of the raw lanes
  - name: QC details
    icon: mdi:file-document-outline
    color: gray
    description: Adapter content and sequence duplication levels
    collapsed: true
  - name: Variant calling
    icon: mdi:scale-balance
    color: gray
    description: The bcftools stats panels of the genotyping VCFs
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [MultiQC](https://multiqc.info) gathers what the tools of the run reported: FastQC on
      the raw lanes, AdapterRemoval, and bcftools stats on the genotypes. eager 2.4.5 wrote a
      report MultiQC 1.35 cannot read, so these panels come from a report regenerated over
      the run's raw outputs.
    tag: ea-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: multiqc_data
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:test-tube
      custom_color: teal
    section: MultiQC report
    tag: ea-mqc-filter-sample
    index: mqc-report-sample-filter
    title: Report sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: multiqc
    workflow_tag: eager
    data_collection_tag: multiqc_data
    use: multiqc/general_stats
    selected_module: general_stats
    selected_plot: general_stats
    section: QC overview
    tag: ea-qc-general-stats
    title: General statistics
    description: One row per library, pooling the headline numbers of every module, endorS.py's endogenous DNA included.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: eager
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Counts
    section: QC overview
    tag: ea-qc-fastqc-counts
    title: Sequence counts
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: eager
    data_collection_tag: multiqc_data
    use: multiqc/adapterremoval
    selected_module: adapterremoval
    selected_plot: Length Distribution
    section: QC overview
    tag: ea-qc-ar-length
    title: Collapsed-read length distribution
    description: Ancient fragments are shorter than the read length, so a short length peak is expected.
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: eager
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Sequence Quality Histograms
    section: Read quality
    tag: ea-qc-fastqc-quality
    title: Per-base sequence quality
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: eager
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Per Sequence GC Content
    section: Read quality
    tag: ea-qc-fastqc-gc
    title: GC content
    description: A second GC peak is the cheapest hint that something other than the organism is in the extract.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: eager
    data_collection_tag: multiqc_data
    use: multiqc/fastqc
    selected_module: fastqc
    selected_plot: Adapter Content
    section: QC details
