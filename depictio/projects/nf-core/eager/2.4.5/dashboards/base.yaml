    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: ea-map-filter-post
    index: ea-map-post-range
    section: Mapping scope
    group: Mapping scope
    workflow_tag: eager
    data_collection_tag: endorspy_endogenous
