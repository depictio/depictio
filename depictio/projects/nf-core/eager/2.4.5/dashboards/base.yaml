    layout: {x: 0, y: 9, w: 1, h: 3}

  - component_type: text
    tag: ea-auth-intro
    section: Authenticity plane
    title: Two signals, and why neither is enough alone
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Ancient DNA gives itself away twice: cytosines deaminate at the ends of a
      fragment, so the first base of a read is misread far more often than the
      middle, and depurination breaks the molecule, so fragments rarely survive
      past about 100 bp. A modern contaminant is long and undamaged, an ancient
      extract is short and damaged, and DNA that is short but undamaged is
      usually over-sheared modern material rather than old. Plotted against
      each other the three separate; read on their own, none of them does.
    workflow_tag: eager
    data_collection_tag: damageprofiler_authenticity
    layout: {x: 0, y: 0, w: 8, h: 3}
  - component_type: card
    tag: ea-auth-card-ct
    index: ea-auth-card-ct
    section: Authenticity plane
    workflow_tag: eager
    data_collection_tag: damageprofiler_authenticity
    use: damageprofiler/authenticity
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: ct_5p_first
    column_type: float64
    display: {icon_name: 'mdi:dna', icon_color: '#EF5350', title_color: '#EF5350', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Deamination at the 5 prime end
    layout: {x: 0, y: 3, w: 2, h: 2}
  - component_type: card
    tag: ea-auth-card-ga
    index: ea-auth-card-ga
