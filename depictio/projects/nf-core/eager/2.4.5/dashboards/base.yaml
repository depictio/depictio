  - component_type: card
    workflow_tag: eager
    data_collection_tag: qualimap_mapq_across_reference
    aggregation: median
    column_name: mapping_quality
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:target
      icon_color: teal
      caption: median per window, distribution
      decimals: 1
    follow_region_filter: true
    section: Region at a glance
    tag: ea-cov-card-mapq
    index: locus-card-mapq
    title: Mapping quality
    description: Mean mapping quality of the windows in the navigator's region.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # The navigator is the only tile on the depth windows that draws a track;
  # the MAPQ track under it reads a second collection, reached by the region
  # link in template.yaml. A non-model reference has no GenomeSpy built-in
  # assembly, so `assembly` stays null and the contig list comes from the data.
  # default_region: first opens the navigator on the whole first contig of
  # the data, whatever the reference names it; a typed or brushed region
  # narrows the tab.
  - component_type: advanced_viz
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_across_reference
    use: qualimap/reference_genome_view
    config:
      score_title: Mean depth (X)
      mark: point
      point_size: 4
      facet_by_sample: true
      region_filter_enabled: true
      default_region: first
    section: Depth along the reference
    tag: ea-cov-av-genomeview
    index: locus-genome-view
    title: Locus navigator, depth per window
    description: >-
      Where along the reference is a library deep or shallow? One lane per library on the contig axis,
      each point the mean depth of one Qualimap window.

      How to read: dips and gaps are regions the reads did not reach, and peaks are regions where
      reads pile up. Read a dip against the mapping-quality lane below, since a dip in mapping quality
      under a depth dip marks repeats the mapper could not place. Type a contig or range in the locus
      field, or brush the axis, to move every tile of the tab to that region.

      Lines and annotations: no depth threshold or reference line is drawn.

      Source: Qualimap 2 paper (Bioinformatics 2016), doi:10.1093/bioinformatics/btv566
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: eager
    data_collection_tag: qualimap_mapq_across_reference
    viz_kind: coverage_track
    config:
      viz_kind: coverage_track
      chromosome_col: chromosome
      position_col: position
      value_col: mapping_quality
      sample_col: sample
      view_mode: facet
      color_by: sample
      smoothing_window: 0
      show_annotation_lane: false
      view: track
      views: [track]
    section: Depth along the reference
    tag: ea-cov-av-mapq
    index: locus-mapq-track
    title: Mapping quality along the region
    description: >-
      How well are the reads placed along the region? One lane per library: the mean mapping quality
      of each Qualimap window, clamped to the region picked in the navigator above.

      How to read: steady high mapping quality means the reads placed unambiguously, and a dip under a
      depth dip marks repeats the mapper could not place with confidence. Compare it with the depth
      lanes above at the same positions.

      Lines and annotations: no reference line or cut-off is drawn.

      Source: Qualimap 2 paper (Bioinformatics 2016), doi:10.1093/bioinformatics/btv566
    layout: {x: 0, y: 5, w: 8, h: 5}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_across_reference
    use: qualimap/coverage_across_reference
    row_selection_enabled: true
    row_selection_column: sample
    section: Window table
    tag: ea-cov-table-track
    index: locus-table
    title: Windowed depth
    description: >-
      One row per library and window of the region, with its contig, position and mean depth.

      How to read: the table follows the region picked in the navigator, so it lists the windows the
      tracks above draw. Sort by depth to find the deepest and the shallowest windows.

      Source: Qualimap 2 paper (Bioinformatics 2016), doi:10.1093/bioinformatics/btv566
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Genotypes
  subtitle: How many variants did each sample yield, and how clean?
  tab_group: Genome
  tab_order: 9
  tab_icon: mdi:scale-balance
  tab_icon_color: pink
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Genotype filters
    icon: mdi:filter-variant
    color: pink
    description: Narrow the call sets to one variant caller
  grid_sections:
  - name: Calls at a glance
    icon: mdi:counter
    color: pink
    description: SNPs, indels, the Ts to Tv ratio and multiallelic sites
  - name: Calls per sample
    icon: mdi:chart-bar
    color: pink
    description: SNPs and the Ts to Tv ratio, sample by sample and caller by caller
  - name: Genotype tables
    icon: mdi:table
    color: gray
    description: Variant counts and transition and transversion counts per sample
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [bcftools stats](https://samtools.github.io/bcftools/) over the genotyping VCFs, per
      biological sample and caller. A shallow, damaged library calls far fewer confident
      variants than its read count suggests, and deamination read as variation inflates the
      transitions.
    tag: ea-geno-intro
    index: geno-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: bcftools_stats_summary
    interactive_component_type: MultiSelect
    column_name: caller
    column_type: object
    display:
      icon_name: mdi:tools
      custom_color: pink
    section: Genotype filters
    group: Calls
    tag: ea-geno-filter-caller
    index: geno-caller-filter
    title: Variant caller
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    aggregation: sum
    column_name: n_snps
    column_type: int64
    secondary_layout: composition
    breakdown_col: sample
    display:
      icon_name: mdi:file-document-outline
      icon_color: pink
      caption: SNPs, by biological sample
    section: Calls at a glance
    tag: ea-geno-card-snps
    index: geno-card-snps
    title: SNPs called
    description: SNPs in the genotyping VCFs, split by the sample they were called in.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    aggregation: sum
    column_name: n_indels
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:shape-outline
      icon_color: violet
      caption: per sample and caller, distribution
    section: Calls at a glance
    tag: ea-geno-card-indels
    index: geno-card-indels
    title: Indels called
    description: Insertions and deletions over the samples in view.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: bcftools_stats_tstv
    use: bcftools/stats_tstv
    aggregation: median
    column_name: ts_tv
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:swap-vertical
      icon_color: red
      caption: median per sample, with its spread
      decimals: 2
    section: Calls at a glance
    tag: ea-geno-card-tstv
    index: geno-card-tstv
    title: Ts to Tv ratio
    description: A germline call set lands near 2; deamination read as variation pushes it up.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    aggregation: sum
    column_name: n_multiallelic_sites
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:call-split
      icon_color: teal
      caption: per sample and caller, with their spread
    section: Calls at a glance
    tag: ea-geno-card-multi
    index: geno-card-multi
    title: Multiallelic sites
    description: Sites with more than one alternate allele, a sign of noise on a haploid or shallow sample.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: figure
    workflow_tag: eager
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    visu_type: bar
    dict_kwargs:
      x: sample
      y: n_snps
      color: caller
      barmode: group
      labels: {sample: '', n_snps: SNPs called, caller: Caller}
    section: Calls per sample
    tag: ea-geno-fig-snps
    index: geno-snps-bar
    title: SNPs called per sample
    description: >-
      How many SNPs did each sample yield? One group of bars per biological sample, one bar per
      variant caller, from bcftools stats.

      How to read: compare the callers within a sample; a caller far below the others found less,
      whether by its filters or by the depth available. A shallow, damaged library calls fewer
      confident variants than its read count suggests, so open [Coverage](tab:Coverage) to check the
      depth behind a low bar.

      Source: bcftools manual, https://samtools.github.io/bcftools/bcftools.html
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: eager
    data_collection_tag: bcftools_stats_tstv
    use: bcftools/stats_tstv
    visu_type: bar
    dict_kwargs:
      x: sample
      y: ts_tv
      color: caller
      barmode: group
      labels: {sample: '', ts_tv: Ts to Tv ratio, caller: Caller}
    section: Calls per sample
    tag: ea-geno-fig-tstv
    index: geno-tstv-bar
    title: Ts to Tv ratio per sample
    description: >-
      How clean are the calls? One group of bars per biological sample, one bar per variant caller:
      the transition to transversion (Ts/Tv) ratio of its SNPs, from bcftools stats.

      How to read: compare the bars of a caller across samples; one that sits above its peers may
      carry deamination read as variation, since C to T and G to A are transitions. A caller with too
      few SNPs to score shows a ratio of 0.

      Lines and annotations: no reference line is drawn, because the expected ratio depends on the
      organism and on the call set.

      Source: bcftools manual, https://samtools.github.io/bcftools/bcftools.html
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: bcftools_stats_summary
    use: bcftools/stats_summary
    row_selection_enabled: true
    row_selection_column: sample
    section: Genotype tables
    tag: ea-geno-table-summary
    index: geno-table-summary
    title: Variant counts per sample and caller
    description: >-
      Records, SNPs, indels and multiallelic sites per sample and caller, straight from the summary
      numbers block of bcftools stats.

      How to read: the counts behind the SNP bars above. Many multiallelic sites on a haploid or
      shallow sample point at noise in the calls.

      Source: bcftools manual, https://samtools.github.io/bcftools/bcftools.html
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: bcftools_stats_tstv
    use: bcftools/stats_tstv
    row_selection_enabled: true
    row_selection_column: sample
    section: Genotype tables
    tag: ea-geno-table-tstv
    index: geno-table-tstv
    title: Transition and transversion counts
    description: >-
      The transition and transversion counts of the same reports, with the ratio on all alleles and on
      the first alternate allele.

      How to read: the counts behind the Ts/Tv bars above. A ratio built on few SNPs moves a lot with
      a handful of calls, so read it with the SNP count of the same sample.

      Source: bcftools manual, https://samtools.github.io/bcftools/bcftools.html
    layout: {x: 0, y: 6, w: 8, h: 6}
