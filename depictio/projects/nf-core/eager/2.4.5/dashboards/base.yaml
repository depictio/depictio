    layout: {x: 0, y: 14, w: 8, h: 5}

  - component_type: text
    tag: ea-fate-trim-intro
    section: Trimming and collapsing
    title: What AdapterRemoval did
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The same step as MultiQC reports it, next to the per-lane numbers read
