  - component_type: card
    workflow_tag: eager
    data_collection_tag: eager_library_qc
    aggregation: median
    column_name: mean_mapping_quality
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:target
      icon_color: orange
      caption: median per library, with its spread
      decimals: 1
    section: Libraries at a glance
    tag: ea-lib-card-mapq
    index: lib-card-mapq
    title: Mapping quality
    description: Mean mapping quality of each library's reads, from Qualimap.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: eager
    data_collection_tag: eager_library_qc
    viz_kind: parallel_coordinates
    config:
      viz_kind: parallel_coordinates
      sample_col: sample
      group_col: sample
      scale: minmax
      # Seven axes: the axis titles are the column names and pile on each
      # other past that at w8.
      metric_cols:
      - endogenous_dna
      - clonality_pct
      - mean_coverage
      - error_rate_pct
      - gc_percentage
      - ct_5p_first_pct
      - mean_length
    section: Library QC profile
    tag: ea-hub-av-pcoords
    index: lib-pcoords
    title: Per-library QC profile
    description: >-
      Which libraries stand out across several tools at once? Each line is one library, drawn across
      seven axes: endogenous DNA (endorS.py), clonality (Picard), mean coverage, error rate and GC
      content (Qualimap), C to T at the first 5 prime base and mean fragment length (DamageProfiler).
      Each axis is rescaled from the lowest to the highest library in view, and its ticks keep the
      column's own units.

      How to read: a line that is high on endogenous DNA, low on clonality, high on damage and low on
      fragment length is a good ancient-DNA library with material left to sequence. A line that is
      extreme on one axis points at that tool; one that is extreme on several is the library to open
      in the pooled table below. Brush an axis to keep only the libraries inside its range.

      Note: positions are relative to the other libraries in view, so a line near the top of an axis
      is high for this run, not necessarily high in absolute terms. No reference line or cut-off is
      drawn.

      Sources: endorS.py, https://github.com/aidaanva/endorS.py; Picard DuplicationMetrics
      definitions, https://broadinstitute.github.io/picard/picard-metric-definitions.html; Qualimap 2
      paper (Bioinformatics 2016), doi:10.1093/bioinformatics/btv566; DamageProfiler paper
      (Bioinformatics 2021), doi:10.1093/bioinformatics/btab190
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: eager_library_qc
    row_selection_enabled: true
    row_selection_column: sample
    section: Library detail
    tag: ea-hub-profile-table
    index: lib-table-profile
    title: Library QC, pooled
    description: >-
      The numbers behind the profile, one row per library: endogenous DNA before and after filtering,
      clonality, mean coverage, mapping quality, error rate, GC content, terminal C to T and mean
      fragment length. Select a row to read it in the record beside it.

      How to read: sort a column to rank the libraries on one measure. A blank cell means the tool
      behind that column has no result for the library.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: eager
    data_collection_tag: eager_library_qc
    viz_kind: record_card
    config:
      viz_kind: record_card
      id_col: sample
      title_col: sample
      selection_source: table_selection
      sections:
        Endogenous content: [endogenous_dna, endogenous_dna_post, clonality_pct]
        Alignment: [mean_coverage, mean_mapping_quality, error_rate_pct, gc_percentage]
        Authenticity: [ct_5p_first_pct, mean_length]
      labels:
        endogenous_dna: Endogenous DNA (%)
        endogenous_dna_post: Endogenous DNA after filtering (%)
        clonality_pct: Clonality (%)
        mean_coverage: Mean coverage (X)
        mean_mapping_quality: Mean mapping quality
        error_rate_pct: Error rate (%)
        gc_percentage: GC (%)
        ct_5p_first_pct: C to T at the first 5 prime base (%)
        mean_length: Mean fragment length (bp)
      linked_component: ea-hub-profile-table
    section: Library detail
    tag: ea-hub-av-record
    index: lib-record
    title: Library record
    description: >-
      The library selected in the pooled table, its numbers grouped by the question each answers:
      endogenous content, alignment and authenticity. Each label carries its unit.

      How to read: pick a row in the pooled table beside it to read one library. Read the three groups
      in order: how much of the library is the organism, how well it aligned, and whether the DNA is
      ancient.
    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    row_selection_enabled: true
    row_selection_column: lane_id
    section: Lanes
    tag: ea-hub-table-lanes
    index: lib-table-lanes
    title: Per-lane trimming and collapsing
    description: >-
      One row per sequencing lane, with the library eager merged it into and what AdapterRemoval
      returned: reads given, reads discarded, pairs collapsed, sequences retained, their mean length
      and the collapse and discard rates.

      How to read: lanes of one library should look alike, so a lane with a much higher discard rate
      or a shorter retained length than its siblings is the one to inspect. The retained sequences of
      a library's lanes are what the mapper received.

      Source: AdapterRemoval, https://github.com/MikkelSchubert/adapterremoval
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Read fate
  subtitle: Where does every sequenced read stop?
  tab_group: Data & QC
  tab_order: 3
  tab_icon: mdi:chart-sankey
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Read fate filters
    icon: mdi:filter-variant
    color: grape
    description: Narrow the flow to one final fate, and the lane tiles to one lane
  grid_sections:
  - name: Reads at a glance
    icon: mdi:counter
    color: grape
    description: The reads, where they stopped, and how each lane trimmed and collapsed
  - name: Read fate
    icon: mdi:relation-many-to-many
    color: grape
    description: One flow per library, exact at every stage
  - name: Lane yield
    icon: mdi:chart-bar
    color: grape
    description: What each lane returned after trimming and collapsing
  - name: Read fate table
    icon: mdi:table
    color: gray
    description: The counts behind the flow
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [AdapterRemoval](https://github.com/MikkelSchubert/adapterremoval) trims each lane and
      collapses overlapping mates into one sequence; mapping, the quality filter and
      deduplication then drop the rest. The flow follows every sequenced read to where it
      stopped, and its counts balance stage by stage. Pick a library in the left panel to
      read one flow at a time.
    tag: ea-fate-intro
    index: fate-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: eager_read_fate
    interactive_component_type: MultiSelect
    column_name: step_duplication
    column_type: object
    display:
      icon_name: mdi:call-split
      custom_color: grape
    section: Read fate filters
    group: Reads
    tag: ea-fate-filter-duplication
    index: fate-final-filter
    title: Final fate
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    interactive_component_type: MultiSelect
    column_name: lane
    column_type: object
    display:
      icon_name: mdi:layers-outline
      custom_color: blue
    section: Read fate filters
    group: Lanes
    tag: ea-fate-filter-lane
    index: fate-lane-filter
    title: Lane
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: eager_read_fate
    aggregation: sum
    column_name: reads
    column_type: int64
    secondary_layout: composition
    breakdown_col: step_trimming
    display:
      icon_name: mdi:counter
      icon_color: grape
      caption: reads, by trimming outcome
    section: Reads at a glance
    tag: ea-fate-card-total
    index: fate-card-total
    title: Reads sequenced
    description: Every sequenced read, split into kept, merged on collapse and discarded by trimming.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: eager_read_fate
    aggregation: sum
    column_name: reads
    column_type: int64
    secondary_layout: donut
    breakdown_col: step_duplication
    display:
      icon_name: mdi:chart-donut
      icon_color: violet
      caption: reads, by where they stopped
    section: Reads at a glance
    tag: ea-fate-card-final
    index: fate-card-final
    title: Final fate
    description: The same reads by the stage that stopped them, or as unique reads at the end.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    aggregation: median
    column_name: collapse_rate
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:set-merge
      icon_color: blue
      caption: median per lane, with its spread
      format: percent
    section: Reads at a glance
    tag: ea-fate-card-collapse
    index: fate-card-collapse
    title: Collapse rate
    description: Share of read pairs AdapterRemoval merged into one sequence, per lane.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    aggregation: median
    column_name: discard_rate
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:delete-outline
      icon_color: red
      caption: median per lane, distribution
      format: percent
    section: Reads at a glance
    tag: ea-fate-card-discard
    index: fate-card-discard
    title: Discard rate
    description: Share of reads AdapterRemoval dropped on quality or length, per lane.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: eager
    viz_kind: sankey
    data_collection_tag: eager_read_fate
    config:
      viz_kind: sankey
      step_cols:
      - step_sequencing
      - step_trimming
      - step_mapping
      - step_filtering
      - step_duplication
      value_col: reads
      value_label: reads
      value_format: count
      sort_mode: total_flow
      # Every flow starts at one node, so colouring by source paints it all
      # one colour; by target, each fate keeps its own.
      color_mode: target
      link_opacity: 0.55
      show_node_labels: true
    section: Read fate
    tag: ea-fate-av-sankey
    index: fate-sankey
    title: Read fate, sequencing to deduplication
    description: >-
      Where does every sequenced read stop? Each column is a stage (sequencing, trimming and
      collapsing, mapping, the mapping-quality filter, deduplication), each band is the reads that
      took that path, and its width is their number.

      How to read: a wide unmapped band is common in ancient extracts, where most DNA is not the
      organism. A wide band below the quality filter means ambiguous placements were dropped, and a
      wide PCR duplicate band means a library of low complexity; open [Complexity](tab:Complexity) for
      the second. Pick a library in the left panel to read one flow at a time.

      Lines and annotations: no reference line or cut-off is drawn. Each node is labelled with its
      fate and each band takes the colour of the node it ends at.

      Note: collapsing is drawn as an outflow of the trimming step, because the reports do not say
      which of the surviving sequences were merged. Two mates merged into one sequence count as one
      read from there on, so the flow narrows at that step.

      Sources: AdapterRemoval, https://github.com/MikkelSchubert/adapterremoval; samtools flagstat
      manual, http://www.htslib.org/doc/samtools-flagstat.html; Picard DuplicationMetrics definitions,
      https://broadinstitute.github.io/picard/picard-metric-definitions.html
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    visu_type: bar
    dict_kwargs:
      x: lane_id
      y: retained_reads
      color: sample_id
      labels: {lane_id: '', retained_reads: Reads kept for mapping, sample_id: Library}
    section: Lane yield
    tag: ea-hub-fig-retained
    index: fate-lane-retained
    title: Reads kept for mapping, per lane
    description: >-
      Did every lane give the mapper enough reads? One bar per lane: the sequences AdapterRemoval
      wrote out, exactly what the mapper was given, coloured by the library the lane was merged into.

      How to read: bars of one colour are the lanes of one library, and they add up to that library's
      input to the mapper. A bar far shorter than its siblings is a lane that lost reads in trimming;
      open the discard tile beside it and the collapse tile below.

      Source: AdapterRemoval, https://github.com/MikkelSchubert/adapterremoval
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    visu_type: bar
    dict_kwargs:
      x: lane_id
      y: discard_rate
      color: sample_id
      labels: {lane_id: '', discard_rate: Share of reads discarded, sample_id: Library}
    section: Lane yield
    tag: ea-hub-fig-discard
    index: fate-lane-discard
    title: Reads discarded, per lane
    description: >-
      Which lanes lost the most reads to trimming? One bar per lane: the share of its reads
      AdapterRemoval discarded, coloured by the library.

      How to read: a low bar is the good result. Lanes of one library should discard alike, so a lane
      far above its siblings is the one to check against the per-base quality and adapter content on
      [MultiQC](tab:MultiQC).

      Note: a read counts as discarded when it fails on quality or falls below the minimum length
      AdapterRemoval was given, so a library rich in very short fragments can discard more without any
      sequencing fault.

      Source: AdapterRemoval, https://github.com/MikkelSchubert/adapterremoval
    layout: {x: 4, y: 0, w: 4, h: 4}
  # Lane ids label nothing a reader looks up: the legend names the libraries.
  - component_type: advanced_viz
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    use: adapterremoval/collapse_vs_length
    config:
      x_col: average_retained_length
      y_col: collapse_rate
      label_col: lane_id
      color_col: sample_id
      size_col: retained_reads
      x_title: Mean retained length (bp)
      y_title: Collapse rate
      top_n_labels: 0
      selection_enabled: true
      selection_column: lane_id
    section: Lane yield
    tag: ea-hub-av-collapse
    index: fate-collapse-length
    title: Collapse rate against retained length
    description: >-
      Does collapsing follow fragment length? Each point is a lane: the mean length of its retained
      sequences on x, the share of its read pairs AdapterRemoval merged into one sequence on y, marker
      size the sequences retained, colour the library.

      How to read: overlapping mates merge, and shorter fragments overlap more, so the shorter the
      retained length the higher the collapse rate. Lanes of one library should sit together; a lane
      off the trend of its siblings was trimmed or sequenced differently.

      Lines and annotations: no reference line or cut-off is drawn, and the points carry no labels;
      the legend names the libraries.

      Source: AdapterRemoval, https://github.com/MikkelSchubert/adapterremoval
    layout: {x: 0, y: 4, w: 8, h: 6}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: eager_read_fate
    row_selection_enabled: true
    row_selection_column: sample
    section: Read fate table
    tag: ea-fate-table
    index: fate-table
    title: Read fate, as counts
    description: >-
      The counts behind the read-fate flow: one row per library and path through the five stages, with
      the reads that took it.

      How to read: sort by reads to see the most common path of each library, and use the Final fate
      filter to list where one kind of read stopped. The rows of one library are the paths of its flow
      above.
    layout: {x: 0, y: 0, w: 8, h: 6}
