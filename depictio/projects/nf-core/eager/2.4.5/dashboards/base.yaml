- title: Read fate
  subtitle: Where does every sequenced read stop?
  tab_group: Data & QC
  tab_order: 3
  tab_icon: mdi:chart-sankey
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Read fate filters
    icon: mdi:filter-variant
    color: grape
    description: Narrow the flow to one final fate, and the lane tiles to one lane
  grid_sections:
  - name: Reads at a glance
    icon: mdi:counter
    color: grape
    description: The reads, where they stopped, and how each lane trimmed and collapsed
  - name: Read fate
    icon: mdi:relation-many-to-many
    color: grape
    description: One flow per library, exact at every stage
  - name: Lane yield
    icon: mdi:chart-bar
    color: grape
    description: What each lane returned after trimming and collapsing
  - name: Read fate table
    icon: mdi:table
    color: gray
    description: The counts behind the flow
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [AdapterRemoval](https://github.com/MikkelSchubert/adapterremoval) trims each lane and
      collapses overlapping mates into one sequence; mapping, the quality filter and
      deduplication then drop the rest. The flow follows every sequenced read to where it
      stopped, and its counts balance stage by stage. Pick a library in the left panel to
      read one flow at a time.
    tag: ea-fate-intro
    index: fate-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: eager_read_fate
    interactive_component_type: MultiSelect
    column_name: step_duplication
    column_type: object
    display:
      icon_name: mdi:call-split
      custom_color: grape
    section: Read fate filters
    group: Reads
    tag: ea-fate-filter-duplication
    index: fate-final-filter
    title: Final fate
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    interactive_component_type: MultiSelect
    column_name: lane
    column_type: object
    display:
      icon_name: mdi:layers-outline
      custom_color: blue
    section: Read fate filters
    group: Lanes
    tag: ea-fate-filter-lane
    index: fate-lane-filter
    title: Lane
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: eager_read_fate
    aggregation: sum
    column_name: reads
    column_type: int64
    secondary_layout: composition
    breakdown_col: step_trimming
    display:
      icon_name: mdi:counter
      icon_color: grape
      caption: reads, by trimming outcome
    section: Reads at a glance
    tag: ea-fate-card-total
    index: fate-card-total
    title: Reads sequenced
    description: Every sequenced read, split into kept, merged on collapse and discarded by trimming.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: eager_read_fate
    aggregation: sum
    column_name: reads
    column_type: int64
    secondary_layout: donut
    breakdown_col: step_duplication
    display:
      icon_name: mdi:chart-donut
      icon_color: violet
      caption: reads, by where they stopped
    section: Reads at a glance
    tag: ea-fate-card-final
    index: fate-card-final
    title: Final fate
    description: The same reads by the stage that stopped them, or as unique reads at the end.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    aggregation: median
    column_name: collapse_rate
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:set-merge
      icon_color: blue
      caption: median per lane, with its spread
      format: percent
    section: Reads at a glance
    tag: ea-fate-card-collapse
    index: fate-card-collapse
    title: Collapse rate
    description: Share of read pairs AdapterRemoval merged into one sequence, per lane.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    aggregation: median
    column_name: discard_rate
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:delete-outline
      icon_color: red
      caption: median per lane, distribution
      format: percent
    section: Reads at a glance
    tag: ea-fate-card-discard
    index: fate-card-discard
    title: Discard rate
    description: Share of reads AdapterRemoval dropped on quality or length, per lane.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: eager
    viz_kind: sankey
    data_collection_tag: eager_read_fate
    config:
      viz_kind: sankey
      step_cols:
      - step_sequencing
      - step_trimming
      - step_mapping
      - step_filtering
      - step_duplication
      value_col: reads
      value_label: reads
      value_format: count
      sort_mode: total_flow
      # Every flow starts at one node, so colouring by source paints it all
      # one colour; by target, each fate keeps its own.
      color_mode: target
      link_opacity: 0.55
      show_node_labels: true
    section: Read fate
    tag: ea-fate-av-sankey
    index: fate-sankey
    title: Read fate, sequencing to deduplication
    description: Every sequenced read, followed to where it stopped; collapsing merges two reads into one.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    visu_type: bar
    dict_kwargs:
      x: lane_id
      y: retained_reads
      color: sample_id
      labels: {lane_id: '', retained_reads: Reads kept for mapping, sample_id: Library}
    section: Lane yield
    tag: ea-hub-fig-retained
    index: fate-lane-retained
    title: Reads kept for mapping, per lane
    description: Sequences AdapterRemoval wrote out, exactly what the mapper was given.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    visu_type: bar
    dict_kwargs:
      x: lane_id
      y: discard_rate
      color: sample_id
      labels: {lane_id: '', discard_rate: Share of reads discarded, sample_id: Library}
    section: Lane yield
    tag: ea-hub-fig-discard
    index: fate-lane-discard
    title: Reads discarded, per lane
    description: Reads AdapterRemoval dropped on quality or length, as a share of the lane.
    layout: {x: 4, y: 0, w: 4, h: 4}
  # Lane ids label nothing a reader looks up: the legend names the libraries.
  - component_type: advanced_viz
    workflow_tag: eager
    data_collection_tag: eager_lane_stats
    use: adapterremoval/collapse_vs_length
    config:
      x_col: average_retained_length
      y_col: collapse_rate
      label_col: lane_id
      color_col: sample_id
      size_col: retained_reads
      x_title: Mean retained length (bp)
      y_title: Collapse rate
      top_n_labels: 0
      selection_enabled: true
      selection_column: lane_id
    section: Lane yield
    tag: ea-hub-av-collapse
    index: fate-collapse-length
    title: Collapse rate against retained length
    description: Short inserts collapse more pairs, so the two move together within a library.
    layout: {x: 0, y: 4, w: 8, h: 6}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: eager_read_fate
    row_selection_enabled: true
    row_selection_column: sample
    section: Read fate table
    tag: ea-fate-table
    index: fate-table
    title: Read fate, as counts
    description: One row per library and path through the five stages, with the reads that took it.
    layout: {x: 0, y: 0, w: 8, h: 6}
# ============================================================================
# Ancient DNA
# ============================================================================
- title: Endogenous DNA
  subtitle: How much of each extract is the target organism?
  tab_group: Ancient DNA
  tab_order: 4
  tab_icon: mdi:dna
  tab_icon_color: green
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Endogenous filters
    icon: mdi:filter-variant
    color: green
    description: Narrow the libraries by how on-target they stay after filtering
  grid_sections:
  - name: Endogenous DNA at a glance
    icon: mdi:counter
    color: green
    description: The on-target share before and after filtering, and the reads behind it
  - name: Before and after filtering
    icon: mdi:chart-scatter-plot
    color: green
    description: Each library's endogenous DNA before against after the filter
  - name: Alignment
    icon: mdi:chart-bar
    color: green
    description: Reads placed before and after eager's mapping-quality filter
  - name: Off-target screen
    icon: mdi:bacteria-outline
    color: gray
    description: MaltExtract and Kraken reports, when the run enabled a metagenomic screen
    collapsed: true
  - name: Endogenous tables
    icon: mdi:table
    color: gray
    description: Endogenous DNA and flagstat counts per library
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [endorS.py](https://github.com/aidaanva/endorS.py) divides the reads that map to the
      reference by the reads the mapper was given, before and after the quality filter and
      deduplication. A low share is normal for ancient extracts, where most DNA is
      environmental; the gap between the two is the on-target signal filtering lost.
    tag: ea-endo-intro
    index: endo-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: eager
    data_collection_tag: endorspy_endogenous
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: endogenous_dna_post
    column_type: float64
    display:
      icon_name: mdi:check-decagram
      custom_color: green
    section: Endogenous filters
    group: Endogenous DNA
    tag: ea-endo-filter-post
    index: endo-post-range
    title: Endogenous DNA after filtering
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: endorspy_endogenous
    use: endorspy/endogenous
    aggregation: median
    column_name: endogenous_dna
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:dna
      icon_color: green
      caption: median % per library, with its spread
      decimals: 1
    section: Endogenous DNA at a glance
    tag: ea-endo-card-raw
    index: endo-card-raw
    title: Endogenous DNA
    description: Share of the reads given to the mapper that map to the reference, per library.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: endorspy_endogenous
    use: endorspy/endogenous
    aggregation: median
    column_name: endogenous_dna_post
    column_type: float64
    secondary_layout: coverage
    coverage_max: 100
    display:
      icon_name: mdi:check-decagram
      icon_color: teal
      caption: median % of reads, after filtering
      decimals: 1
    section: Endogenous DNA at a glance
    tag: ea-endo-card-post
    index: endo-card-post
    title: After filtering
    description: The same share once the quality filter and deduplication have run.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: eager
    data_collection_tag: endorspy_endogenous
    use: endorspy/endogenous
    aggregation: median
    column_name: endogenous_dna_loss
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:trending-down
      icon_color: red
      caption: median points per library, distribution
      decimals: 1
    section: Endogenous DNA at a glance
    tag: ea-endo-card-loss
    index: endo-card-loss
    title: Lost to filtering
    description: Percentage points of endogenous DNA lost between the two measures.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # Stage-scoped: flagstat has one row per library and filter stage, so an
  # unscoped sum would count every read twice. No stage filter on this tab:
  # it would leave this card without its stage.
  - component_type: card
    workflow_tag: eager
    data_collection_tag: samtools_flagstat
    use: samtools/flagstat
    aggregation: sum
    column_name: total_reads
    column_type: int64
    filter_expr: col('stage') == 'pre-filter'
    secondary_layout: attrition
    attrition_cols: [mapped_reads]
    display:
      icon_name: mdi:counter
      icon_color: indigo
      caption: given to the mapper, then mapped
    section: Endogenous DNA at a glance
    tag: ea-map-card-input
    index: endo-card-input
    title: Reads to the mapper
    description: flagstat totals before the mapping-quality filter; what did not map is the off-target share.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Library ids label nothing on a third of a row: the legend names them on the
  # tab, the Overview highlight hides it.
  - component_type: advanced_viz
    workflow_tag: eager
    data_collection_tag: endorspy_endogenous
    use: endorspy/endogenous_pre_post
    config:
      x_title: Endogenous DNA before filtering (%)
      y_title: Endogenous DNA after filtering (%)
      reference_line: diagonal
      top_n_labels: 0
      marker_size: 14
      selection_enabled: true
      selection_column: sample
    section: Before and after filtering
    tag: ea-endo-av-prepost
    index: endo-pre-post
    title: Endogenous DNA, before against after filtering
    description: Distance below the diagonal is the on-target signal lost to filtering and deduplication.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: eager
    data_collection_tag: samtools_flagstat
    use: samtools/flagstat
    visu_type: bar
    dict_kwargs:
      x: sample
      y: mapped_reads
      color: stage
      barmode: group
      labels: {sample: '', mapped_reads: Mapped reads, stage: Stage}
    section: Alignment
    tag: ea-map-fig-bar
    index: endo-mapped-bar
    title: Mapped reads before and after the filter
    description: Reads flagged mapped by samtools flagstat, per library and filter stage.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: table
    workflow_tag: eager
    data_collection_tag: maltextract_heatmap
