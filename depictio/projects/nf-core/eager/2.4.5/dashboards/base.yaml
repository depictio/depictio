  workflow_system: nf-core
  filter_sections:
  - name: Library filters
    icon: mdi:filter-variant
    color: teal
    description: Narrow the profile by clonality, and the lane tiles by lane
  grid_sections:
  - name: Libraries at a glance
    icon: mdi:counter
    color: teal
    description: The libraries, their lanes, the reads they got and how well those mapped
  - name: Library QC profile
    icon: mdi:chart-timeline-variant
    color: teal
    description: Every per-library QC number eager produced, on one set of axes
  - name: Library detail
    icon: mdi:information-outline
