      y_title: Share of the library's reads
      selection_enabled: true
      selection_column: sample
    section: Length and damage
    tag: ea-len-av-profile
    index: auth-length-profile
    title: Fragment length distribution
    description: One curve per library and strand, normalised so libraries of any depth compare.
    layout: {x: 4, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: eager
    data_collection_tag: damageprofiler_misincorporation
    use: damageprofiler/misincorporation
    config: {}
    section: Misincorporation
    tag: ea-dmg-av-profile
    index: auth-misincorporation
    title: Misincorporation profile, both read ends
