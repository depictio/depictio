    layout: {x: 0, y: 6, w: 1, h: 3}

  - component_type: text
    tag: ea-endo-intro
    section: Endogenous DNA
    title: How much of this extract is the organism
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [endorS.py](https://github.com/aidaanva/endorS.py) divides the reads that
      map to the reference by the reads the mapper was given, before and after
      the quality filter and deduplication. The gap between the two is the
      on-target signal lost to ambiguous placement and PCR copies.
    workflow_tag: eager
    data_collection_tag: endorspy_endogenous
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ea-endo-card-raw
    index: ea-endo-card-raw
    section: Endogenous DNA
    workflow_tag: eager
    data_collection_tag: endorspy_endogenous
    use: endorspy/endogenous
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: endogenous_dna
    column_type: float64
    display: {icon_name: 'mdi:dna', icon_color: '#26A69A', title_color: '#26A69A', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Endogenous DNA (%)
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ea-endo-card-post
    index: ea-endo-card-post
    section: Endogenous DNA
    workflow_tag: eager
    data_collection_tag: endorspy_endogenous
    use: endorspy/endogenous
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: endogenous_dna_post
    column_type: float64
    display: {icon_name: 'mdi:check-decagram', icon_color: '#00897B', title_color: '#00897B', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: After filtering (%)
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ea-endo-card-loss
    index: ea-endo-card-loss
    section: Endogenous DNA
    workflow_tag: eager
    data_collection_tag: endorspy_endogenous
    use: endorspy/endogenous
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: endogenous_dna_loss
    column_type: float64
    display: {icon_name: 'mdi:trending-down', icon_color: '#EF5350', title_color: '#EF5350', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Lost to filtering (pp)
    layout: {x: 4, y: 2, w: 2, h: 2}
  # Stage-scoped: flagstat has one row per library AND filter stage, so an
  # unscoped sum would count every read twice.
  - component_type: card
    tag: ea-map-card-input
    index: ea-map-card-input
    section: Endogenous DNA
    workflow_tag: eager
    data_collection_tag: samtools_flagstat
    use: samtools/flagstat
    filter_expr: "col('stage') == 'pre-filter'"
    aggregation: sum
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 4
    column_name: total_reads
    column_type: int64
    display: {icon_name: 'mdi:counter', icon_color: '#5C6BC0', title_color: '#5C6BC0', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Reads given to the mapper
    description: flagstat totals before the mapping-quality filter only. Everything that did not map is the off-target share a metagenomic screen classifies.
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: ea-endo-av-prepost
    index: ea-endo-av-prepost
    section: Endogenous DNA
    workflow_tag: eager
    data_collection_tag: endorspy_endogenous
    use: endorspy/endogenous_pre_post
    config:
      controls_placement: header
      x_title: Endogenous DNA before filtering (%)
      y_title: Endogenous DNA after filtering (%)
      reference_line: diagonal
      top_n_labels: 4
      marker_size: 14
      selection_enabled: true
      selection_column: sample
    title: Endogenous DNA, before against after filtering
    description: Distance below the diagonal is the on-target signal lost to the quality filter and deduplication.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 7}

  - component_type: text
    tag: ea-map-intro
    section: Alignment
    title: What placed, and what the filter kept
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [samtools flagstat](http://www.htslib.org/) before and after eager's
      mapping-quality filter. A low pre-filter mapped share is normal for
      ancient extracts, where most DNA is environmental.
    workflow_tag: eager
    data_collection_tag: samtools_flagstat
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: figure
    tag: ea-map-fig-bar
    index: ea-map-fig-bar
    section: Alignment
    workflow_tag: eager
    data_collection_tag: samtools_flagstat
    use: samtools/flagstat
    visu_type: bar
    dict_kwargs: {x: sample, y: mapped_reads, color: stage}
    title: Mapped reads before and after the filter
    description: Reads flagged mapped by samtools flagstat, per library and stage.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 6}

  - component_type: text
    tag: ea-dup-intro
    section: Duplication and complexity
    title: PCR duplicates, and whether more sequencing would help
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [Picard MarkDuplicates](https://broadinstitute.github.io/picard/) flags
      PCR copies on the filtered BAM, and
      [preseq](http://smithlabresearch.org/software/preseq/) extrapolates how
      many new molecules the next reads would buy. High duplication with a
      flattened complexity curve means the extract, not the sequencing, is the
      limit.
    workflow_tag: eager
    data_collection_tag: picard_markduplicates_metrics
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ea-dup-card-rate
    index: ea-dup-card-rate
    section: Duplication and complexity
    workflow_tag: eager
    data_collection_tag: picard_markduplicates_metrics
    use: picard/markduplicates_metrics
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: percent_duplication
    column_type: float64
    display: {icon_name: 'mdi:set-merge', icon_color: '#AB47BC', title_color: '#AB47BC', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Duplication rate
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ea-dup-card-examined
    index: ea-dup-card-examined
