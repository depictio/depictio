# ============================================================================
# Authentication
# ============================================================================
- title: Authentication
  subtitle: "Is it ancient, and how contaminated: terminal deamination against fragment length, the full profiles, then the contamination estimates"
  tab_order: 5
  tab_icon: mdi:dna
  tab_icon_color: red
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Damage scope
    icon: mdi:filter-variant
    color: red
    description: Narrow the profiles to one read end, position window, strand or length band
  grid_sections:
  - name: Authenticity plane
    icon: mdi:chart-scatter-plot
    color: red
    description: The two signals against each other, one point per library
  - name: Misincorporation signature
    icon: mdi:dna
    color: red
    description: Substitution frequency by distance from the read end, from DamageProfiler
  - name: Fragment length
    icon: mdi:ruler
    color: orange
    description: How long the mapped fragments are, per library and strand
  - name: Contamination
    icon: mdi:scale-balance
    color: yellow
    description: ANGSD nuclear contamination and MTNucRatio, when the run enabled them
  - name: Authentication tables
    icon: mdi:table
    color: gray
    description: The per-library summary and the full profiles behind the plots
    collapsed: true
  components:
  - component_type: interactive
    tag: ea-dmg-filter-end
    index: ea-dmg-end-filter
    section: Damage scope
    group: Damage scope
    workflow_tag: eager
    data_collection_tag: damageprofiler_misincorporation
    interactive_component_type: Select
    column_name: end
    column_type: object
    display: {title_size: md, custom_color: '#EF5350', icon_name: 'mdi:dna'}
    placement: left
    title: Read end
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: ea-dmg-filter-position
    index: ea-dmg-position-range
    section: Damage scope
    group: Damage scope
    workflow_tag: eager
    data_collection_tag: damageprofiler_misincorporation
    interactive_component_type: RangeSlider
    column_name: position
    column_type: int64
    display: {title_size: md, custom_color: '#EF5350', icon_name: 'mdi:ruler'}
    placement: left
    title: Distance from the read end
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: ea-dmg-filter-strand
    index: ea-dmg-strand-filter
    section: Damage scope
    group: Damage scope
    workflow_tag: eager
    data_collection_tag: damageprofiler_lgdistribution
    interactive_component_type: Select
    column_name: strand
    column_type: object
    display: {title_size: md, custom_color: '#FB8C00', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Strand
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: ea-dmg-filter-length
    index: ea-dmg-length-range
    section: Damage scope
    group: Damage scope
    workflow_tag: eager
    data_collection_tag: damageprofiler_lgdistribution
    interactive_component_type: RangeSlider
    column_name: length
    column_type: int64
    display: {title_size: md, custom_color: '#FB8C00', icon_name: 'mdi:ruler'}
    placement: left
    title: Fragment length
    layout: {x: 0, y: 9, w: 1, h: 3}

  - component_type: text
    tag: ea-auth-intro
    section: Authenticity plane
    title: Two signals, and why neither is enough alone
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Ancient DNA is damaged at its ends (cytosines deaminate, so the first
      base of a read is misread far more often than the middle) and short
      (depurination breaks the molecule). Short and damaged is ancient, long
      and undamaged is modern contamination, and short but undamaged is
      usually over-sheared modern DNA, which only the two axes together
      separate.
    workflow_tag: eager
    data_collection_tag: damageprofiler_authenticity
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ea-auth-card-ct
    index: ea-auth-card-ct
    section: Authenticity plane
    workflow_tag: eager
    data_collection_tag: damageprofiler_authenticity
    use: damageprofiler/authenticity
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: ct_5p_first
    column_type: float64
    display: {icon_name: 'mdi:dna', icon_color: '#EF5350', title_color: '#EF5350', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Deamination at the 5 prime end
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ea-auth-card-ga
    index: ea-auth-card-ga
    section: Authenticity plane
    workflow_tag: eager
    data_collection_tag: damageprofiler_authenticity
    use: damageprofiler/authenticity
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: ga_3p_first
    column_type: float64
    display: {icon_name: 'mdi:dna', icon_color: '#D81B60', title_color: '#D81B60', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Deamination at the 3 prime end
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ea-auth-card-length
    index: ea-auth-card-length
    section: Authenticity plane
    workflow_tag: eager
    data_collection_tag: damageprofiler_authenticity
    use: damageprofiler/authenticity
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: mean_length
    column_type: float64
    display: {icon_name: 'mdi:ruler', icon_color: '#FB8C00', title_color: '#FB8C00', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mean fragment length (bp)
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ea-auth-card-short
    index: ea-auth-card-short
    section: Authenticity plane
    workflow_tag: eager
    data_collection_tag: damageprofiler_authenticity
    use: damageprofiler/authenticity
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: fraction_under_70bp
    column_type: float64
    display: {icon_name: 'mdi:content-cut', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Fragments under {SHORT_FRAGMENT_BP} bp
    description: Share of mapped fragments shorter than the short-fragment cut-off, 0 to 1, per library. An ancient extract puts most of its fragments here.
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: ea-auth-av-plane
    index: ea-auth-av-plane
    section: Authenticity plane
    workflow_tag: eager
    data_collection_tag: damageprofiler_authenticity
    use: damageprofiler/authenticity_plane
    config:
      controls_placement: header
      x_title: Mean fragment length (bp)
      y_title: Deamination at the first 5 prime base
      top_n_labels: 4
      marker_size: 16
      selection_enabled: true
      selection_column: sample
    title: The ancient-DNA plane
    description: Short and damaged is ancient, long and undamaged is modern contamination, short and undamaged is usually over-sheared modern DNA. Marker size is the number of fragments each library contributed.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 7}

  - component_type: text
    tag: ea-dmg-intro
    section: Misincorporation signature
    title: The full misincorporation profile
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      [DamageProfiler](https://github.com/Integrative-Transcriptomics/DamageProfiler)
      counts, at each position from a read end, how often the reference base
      was misread. Authentic ancient DNA rises sharply in the first few
      positions and decays to the flat background of every other substitution;
      no such rise means contamination or a library-prep artefact.
    workflow_tag: eager
    data_collection_tag: damageprofiler_misincorporation
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: ea-dmg-av-profile
    index: ea-dmg-av-profile
    section: Misincorporation signature
    workflow_tag: eager
    data_collection_tag: damageprofiler_misincorporation
    use: damageprofiler/misincorporation
    config: {}
    title: Misincorporation profile, both read ends
    description: The two deamination substitutions by position from the read end, every other substitution pooled as the background they are read against. UDG-treated libraries keep the rise at the terminal base only.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}

  - component_type: text
    tag: ea-len-intro
    section: Fragment length
    title: How long the surviving fragments are
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The mapped fragment length distribution, per library and strand. An
      ancient extract peaks well under {SHORT_FRAGMENT_BP} bp and has little
      mass past 100 bp; a modern library runs out to the read length.
    workflow_tag: eager
    data_collection_tag: damageprofiler_lgdistribution
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: advanced_viz
    tag: ea-len-av-profile
    index: ea-len-av-profile
    section: Fragment length
    workflow_tag: eager
    data_collection_tag: damageprofiler_lgdistribution
    use: damageprofiler/fragment_length_profile
    config:
      x_title: Fragment length (bp)
      y_title: Share of the library's reads
      selection_enabled: true
      selection_column: sample
    title: Fragment length distribution
    description: One curve per library and strand, normalised so libraries of different depth are comparable.
    title_size: h3
    layout: {x: 0, y: 1, w: 8, h: 7}

  - component_type: text
    tag: ea-contam-note
    section: Contamination
    title: How much of the signal is someone else's DNA
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      When the run enables ANGSD nuclear contamination or MTNucRatio, their
      estimates appear below this note. Without them, the damage profile and
      the fragment length above are the authentication this run carries.
    workflow_tag: eager
    data_collection_tag: damageprofiler_authenticity
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: table
    tag: ea-contam-table-nuclear
    section: Contamination
    workflow_tag: eager
    data_collection_tag: nuclear_contamination
    row_selection_enabled: false
    title: Nuclear contamination (ANGSD)
    description: X-chromosome contamination per library, method of moments and maximum likelihood, with their standard errors. Only meaningful for a male individual.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 1, w: 8, h: 4}
  - component_type: table
    tag: ea-contam-table-mtnuc
    section: Contamination
    workflow_tag: eager
    data_collection_tag: mtnucratio
    row_selection_enabled: false
    title: Mitochondrial to nuclear ratio
    description: MTNucRatio per library. A ratio far above the rest of the run hints at a contaminant or a different tissue.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 5, w: 8, h: 4}

  - component_type: table
    tag: ea-auth-table
    section: Authentication tables
    workflow_tag: eager
    data_collection_tag: damageprofiler_authenticity
    use: damageprofiler/authenticity
    row_selection_enabled: true
    row_selection_column: sample
    title: Authenticity summary per library
    description: Terminal deamination at both ends against the substitution background, next to the fragment length statistics.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 3}
  - component_type: table
    tag: ea-dmg-table
    section: Authentication tables
    workflow_tag: eager
    data_collection_tag: damageprofiler_misincorporation
    use: damageprofiler/misincorporation
    row_selection_enabled: true
    row_selection_column: sample
    title: Misincorporation table
    description: One row per library, read end, position and substitution class.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 3, w: 8, h: 7}
  - component_type: table
    tag: ea-len-table
    section: Authentication tables
    workflow_tag: eager
    data_collection_tag: damageprofiler_lgdistribution
    use: damageprofiler/lgdistribution
    row_selection_enabled: true
    row_selection_column: sample
    title: Fragment length table
    description: One row per library, strand and length, with the reads at that length and their share.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 10, w: 8, h: 7}

# ============================================================================
# Coverage, sex and genotyping
# ============================================================================
- title: Coverage, sex and genotyping
  subtitle: Depth per contig, how that depth is spread, the locus detail, then the variants called from it
  tab_order: 6
  tab_icon: mdi:waves
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Coverage scope
    icon: mdi:filter-variant
    color: cyan
    description: Narrow the per-contig tiles by size or relative depth, the locus windows by depth, and the depth curves to a threshold
  grid_sections:
  - name: Per-contig depth and sex
    icon: mdi:chart-scatter-plot
    color: cyan
    description: Depth per reference sequence relative to the library mean, the quantity a sex call is made from
  - name: Depth distribution
    icon: mdi:chart-bell-curve
    color: blue
    description: How the depth is spread across the reference
  - name: Depth along the reference
    icon: mdi:waves
    color: cyan
    description: A locus section, depth and mapping quality on one contig axis that follows the navigator's region
  - name: Variant calls
    icon: mdi:scale-balance
    color: grape
    description: bcftools stats over the genotyping VCFs
  - name: Coverage tables
    icon: mdi:table
    color: gray
    description: Per-contig depth, genome fraction, windowed depth and variant counts
    collapsed: true
  components:
  - component_type: interactive
    tag: ea-sex-filter-relative
    index: ea-sex-relative-range
    section: Coverage scope
    group: Coverage scope
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_per_contig
    interactive_component_type: RangeSlider
    column_name: relative_coverage
    column_type: float64
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:scale-balance'}
    placement: left
    title: Relative depth
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: ea-sex-filter-length
    index: ea-sex-length-range
    section: Coverage scope
    group: Coverage scope
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_per_contig
    interactive_component_type: RangeSlider
    column_name: length
    column_type: int64
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:ruler'}
    placement: left
    title: Contig length
    layout: {x: 0, y: 3, w: 1, h: 3}
  # No position or chromosome control: the navigator's brush and locus field
  # own the region filter on the depth windows. No histogram on the window
  # depth: a mitochondrial window puts every nuclear window in the first bin.
  - component_type: interactive
    tag: ea-cov-filter-window-depth
    index: ea-cov-window-depth-range
    section: Coverage scope
    group: Coverage scope
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_across_reference
    interactive_component_type: RangeSlider
    column_name: coverage
    column_type: float64
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:waves'}
    placement: left
    title: Window depth (X)
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: ea-cov-filter-depth
    index: ea-cov-depth-range
    section: Coverage scope
    group: Coverage scope
    workflow_tag: eager
    data_collection_tag: qualimap_genome_fraction_coverage
    interactive_component_type: RangeSlider
    column_name: min_coverage
    column_type: int64
    show_histogram: true
    display: {title_size: md, custom_color: '#42A5F5', icon_name: 'mdi:waves'}
    placement: left
    title: Depth threshold
    layout: {x: 0, y: 9, w: 1, h: 3}

  - component_type: text
    tag: ea-sex-contig-intro
    section: Per-contig depth and sex
    title: Where the reads landed, sequence by sequence
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Depth per reference sequence relative to the library's own mean: an even
      library sits on 1.0, the mitochondrion sits far above it, and a sex
      chromosome sits near 0.5 or 1.0 depending on the individual. When the
      run enables Sex.DetERRmine, its call appears below the plots.
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_per_contig
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: ea-sex-card-relative
    index: ea-sex-card-relative
    section: Per-contig depth and sex
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_per_contig
    use: qualimap/coverage_per_contig
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: relative_coverage
    column_type: float64
    display: {icon_name: 'mdi:scale-balance', icon_color: '#00ACC1', title_color: '#00ACC1', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Relative depth per contig
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ea-sex-card-top
    index: ea-sex-card-top
    section: Per-contig depth and sex
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_per_contig
    use: qualimap/coverage_per_contig
    aggregation: max
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: mean_coverage
    column_type: float64
    display: {icon_name: 'mdi:waves', icon_color: '#7C4DFF', title_color: '#7C4DFF', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Deepest contig (X)
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ea-sex-card-bases
    index: ea-sex-card-bases
    section: Per-contig depth and sex
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_per_contig
    use: qualimap/coverage_per_contig
    aggregation: sum
    secondary_layout: top_n
    breakdown_col: chromosome
    top_n_count: 3
    column_name: mapped_bases
    column_type: int64
    display: {icon_name: 'mdi:counter', icon_color: '#26A69A', title_color: '#26A69A', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Mapped bases
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: ea-cov-card-fraction
    index: ea-cov-card-fraction
    section: Per-contig depth and sex
    workflow_tag: eager
    data_collection_tag: qualimap_genome_fraction_coverage
    use: qualimap/genome_fraction_coverage
    filter_expr: "col('min_coverage') == 1"
    aggregation: average
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: genome_fraction_pct
    column_type: float64
    display: {icon_name: 'mdi:percent-outline', icon_color: '#42A5F5', title_color: '#42A5F5', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Genome covered at 1X (%)
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: ea-sex-av-contig
    index: ea-sex-av-contig
    section: Per-contig depth and sex
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_per_contig
    use: qualimap/contig_depth_scatter
    config:
      controls_placement: header
      x_title: Contig length (bp)
      y_title: Depth relative to the library mean
      log_x: true
      log_y: true
      reference_line: horizontal
      reference_value: 1.0
      top_n_labels: 5
      selection_enabled: true
      selection_column: sample
    title: Relative depth against contig length
    description: Short contigs scatter widely because a handful of reads moves their mean; long chromosomes cluster on 1.0, and an organelle genome sits far above it.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 7}
  - component_type: figure
    tag: ea-sex-fig-relative
    index: ea-sex-fig-relative
    section: Per-contig depth and sex
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_per_contig
    use: qualimap/coverage_per_contig
    visu_type: bar
    dict_kwargs: {x: chromosome, y: relative_coverage, color: sample}
    title: Depth per contig, relative to the library mean
    description: Use the contig length filter in the left panel to drop unplaced scaffolds and keep the assembled chromosomes.
    title_size: h3
    layout: {x: 0, y: 11, w: 8, h: 6}
  - component_type: table
    tag: ea-sex-table-sexdet
    section: Per-contig depth and sex
    workflow_tag: eager
    data_collection_tag: sexdeterrmine
    row_selection_enabled: false
    title: Sex.DetERRmine
    description: Relative X and Y coverage per library, with their errors, as Sex.DetERRmine reports them.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 17, w: 8, h: 4}

  - component_type: text
    tag: ea-dist-intro
    section: Depth distribution
    title: Spread thin, or piled up
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A mean depth under 1X says nothing about whether the reads cover the
      genome once or pile on a fraction of it. The first curve is how many
      bases sit at each depth, the second is the share of the reference
      covered at least that deep.
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_histogram
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: ea-dist-av-hist
    index: ea-dist-av-hist
    section: Depth distribution
    workflow_tag: eager
    data_collection_tag: qualimap_coverage_histogram
    use: qualimap/depth_histogram_profile
    config:
      x_title: Depth (X)
      y_title: Share of the reference
      log_y: true
    title: Depth histogram
    description: Share of the reference at each depth, per library, on a log scale so the long tail stays readable.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: advanced_viz
    tag: ea-dist-av-fraction
    index: ea-dist-av-fraction
    section: Depth distribution
    workflow_tag: eager
    data_collection_tag: qualimap_genome_fraction_coverage
    use: qualimap/genome_fraction_profile
    config:
      x_title: Depth threshold (X)
      y_title: Genome covered (%)
      selection_enabled: true
      selection_column: sample
    title: Share of the reference covered at least X deep
    description: "The cumulative read on a shallow library: where this curve meets 1X is how much of the genome was seen at all."
