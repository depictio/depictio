    description: The object overlays carry no site; outlines do.
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cp-im-card-plates
    index: cp-im-card-plates
    section: Segmentation images
    workflow_tag: cellpainting
    data_collection_tag: cp-overlays
