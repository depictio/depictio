    section: Segmentation images
    workflow_tag: cellpainting
    data_collection_tag: cp-overlays
    use: cellprofiler/object_overlays
    aggregation: nunique
    column_name: well_id
    column_type: object
    secondary_layout: uniqueness
    display: {icon_name: 'mdi:grid', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Wells with an image
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cp-im-card-sites
    index: cp-im-card-sites
    section: Segmentation images
    workflow_tag: cellpainting
    data_collection_tag: cp-overlays
    use: cellprofiler/object_overlays
    aggregation: nunique
    column_name: site_id
    column_type: object
    secondary_layout: completeness
    display: {icon_name: 'mdi:image-outline', title_font_size: xl, value_font_size: xl}
