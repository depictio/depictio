version: 1
# nf-core/cellpainting 1.0.0dev reference dashboard (the pipeline is unreleased;
# the template is pinned to a dev commit, see template.yaml).
#
# Funnel: the plate (what was imaged, how many cells per well, the plate
# layout) -> acquisition and segmentation QC (cells per site, image quality,
# illumination, the shape of the segmented objects) -> the segmentation images
# themselves (the visual QC gate) -> the morphological profiles (feature
# distributions, the well x feature heatmap, the single-cell PCA) -> the
# comparison between perturbation groups.
#
# The run publishes no MultiQC module (its report carries run metadata only),
# so the main tab is an Overview. The plate-map hub (`samples`, keyed on
# well_id) is the anchor: the pinned Well filters (well and GROUP_COL) reach
# every collection through the project links, and every tab adds an open
# tab-local filter section on its own columns.
#
# The four glance cards, the plate map (collapsed) and the Well filters are
# pinned persistent sections, so they ride along on every tab.
#
# No bioimage viewer: the raw TIFF stacks are pipeline inputs, not outputs, and
# the run publishes no pyramidal image. The Images tab shows the segmentation
# PNGs through the image gallery.
main_dashboard:
  title: nf-core/cellpainting
  subtitle: "Cell Painting plate: cells per well and site, image quality, morphological profiles and perturbation groups"
  project_tag: Cell Painting Profiling
  main_tab_name: Overview
  tab_icon: mdi:microscope
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  advanced_viz_controls: header
  filter_sections:
  - name: Well filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab through the project links
    persistent: true
    pin: top
  - name: Well scope
    icon: mdi:tune
    color: indigo
    description: Keep only the wells inside a cell-count band
  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: What the plate holds, on every tab
    persistent: true
    pin: top
  - name: Plate map
    icon: mdi:table-account
    color: teal
    description: The well hub every filter starts from
    collapsed: true
    persistent: true
    pin: top
  - name: Plate layout
    icon: mdi:view-dashboard-outline
    color: blue
    description: Cells segmented per well, as the plate and as a ranking
  - name: Well detail
    icon: mdi:information-outline
    color: cyan
    description: One row per well with its median profile, and the record of the picked well
  components:
  # --------------------------------------------------------- run at a glance
  - component_type: card
    tag: cp-gl-card-wells
    index: cp-gl-card-wells
    section: Run at a glance
    workflow_tag: cellpainting
    data_collection_tag: samples
    aggregation: count
    column_name: well_id
    column_type: object
    secondary_layout: donut
    breakdown_col: "{GROUP_COL}"
    display: {icon_name: 'mdi:grid', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: "Wells by {GROUP_COL_DISPLAY}"
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: cp-gl-card-cells
    index: cp-gl-card-cells
    section: Run at a glance
    workflow_tag: cellpainting
    data_collection_tag: cp-wells
    use: cytotable/well_profile
    aggregation: sum
    column_name: n_cells
    column_type: int64
    secondary_layout: top_n
    breakdown_col: well_id
    top_n_count: 3
    display: {icon_name: 'mdi:counter', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Cells segmented
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: cp-gl-card-sites
    index: cp-gl-card-sites
    section: Run at a glance
    workflow_tag: cellpainting
    data_collection_tag: cp-sites
    use: cytotable/site_summary
    aggregation: count
    column_name: site_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: well
    top_n_count: 3
    display: {icon_name: 'mdi:image-multiple-outline', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Sites imaged
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: cp-gl-card-cells-per-site
    index: cp-gl-card-cells-per-site
    section: Run at a glance
    workflow_tag: cellpainting
    data_collection_tag: cp-sites
    use: cytotable/site_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: n_cells
    column_type: int64
    display: {icon_name: 'mdi:chart-box-outline', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Cells per site
    layout: {x: 6, y: 0, w: 2, h: 2}

  # ---------------------------------------------------------------- plate map
  - component_type: text
    tag: cp-ref-intro
    section: Plate map
    title: The design behind every panel
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per imaged well, read from the screen's plate map, with the
      sites and cells the run produced for it. Every well filter starts from
      this table, so it is what narrows every other tab.
    workflow_tag: cellpainting
    data_collection_tag: samples
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: cp-ref-table-platemap
    section: Plate map
    workflow_tag: cellpainting
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: well_id
    title: Plate map
    description: One row per imaged well with its design columns.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 4}

  # ------------------------------------------------------------ plate layout
  - component_type: text
    tag: cp-ov-intro
    section: Plate layout
    title: Where the cells are on the plate
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Cells segmented per well, drawn as the plate and ranked per well. A
      pattern along a row, a column or the plate edge points at acquisition
      or dispensing rather than at the perturbations.
    workflow_tag: cellpainting
    data_collection_tag: cp-plate-layout
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: cp-ov-av-plate
    index: cp-ov-av-plate
    section: Plate layout
    workflow_tag: cellpainting
    data_collection_tag: cp-plate-layout
    use: cytotable/plate_heatmap
    config:
      controls_placement: header
      index_column: plate_row
      value_columns_pattern: "^col_"
      cluster_rows: false
      cluster_cols: false
      colorscale: Blues
    title: Cells segmented per well, plate layout
    description: Plate rows down, plate columns across; empty cells are wells the run did not image.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}
  - component_type: figure
    tag: cp-ov-fig-cells-per-well
    section: Plate layout
    workflow_tag: cellpainting
    data_collection_tag: cp-wells
    use: cytotable/cells_per_well_bar
    visu_type: bar
    dict_kwargs: {x: well_id, y: n_cells, color: group, title: Cells segmented per well}
    title: Cells segmented per well
    description: "Coloured by {GROUP_COL_DISPLAY}; a well far below its group has lost cells to toxicity, seeding or segmentation."
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 5}

  # ------------------------------------------------------------- well detail
  - component_type: table
    tag: cp-ov-table-wells
    section: Well detail
    workflow_tag: cellpainting
    data_collection_tag: cp-wells
    use: cytotable/well_profile
    row_selection_enabled: true
    row_selection_column: well_id
    title: Per-well profiles
    description: One row per well, the medians of the curated features and their z-scores across wells; select a row to read the well beside the table.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 5, h: 7}
  - component_type: advanced_viz
    tag: cp-ov-av-well-record
    index: cp-ov-av-well-record
    section: Well detail
    workflow_tag: cellpainting
    data_collection_tag: cp-wells
    use: cytotable/well_record
    config:
      id_col: well_id
      title_col: well_id
      selection_source: any
      linked_component: cp-ov-table-wells
      sections:
        Well: [well_id, plate, well, group]
        Imaging: [n_sites, n_cells, cells_per_site]
        Shape: [cell_area, nucleus_area, cytoplasm_area, cell_eccentricity, nucleus_form_factor]
        Stains: [nucleus_dna_integrated, cell_rna_mean, cell_er_mean, cell_agp_mean, cell_mito_mean]
        Organelles: [cell_mito_granularity, cell_er_mito_correlation, cell_mito_inner_ring_frac, cell_neighbors]
      labels:
        group: "{GROUP_COL_DISPLAY}"
    title: Well record
    description: The picked well with its imaging yield and median profile.
    title_size: h3
    layout: {x: 5, y: 0, w: 3, h: 7}

  # ----------------------------------------------------------------- filters
  - component_type: interactive
    tag: cp-filter-well
    index: cp-well-filter
    section: Well filters
    group: Well scope
    workflow_tag: cellpainting
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: well_id
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:grid'}
    placement: left
    title: Well
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: cp-filter-group
    index: cp-group-filter
    section: Well filters
    group: Well scope
    workflow_tag: cellpainting
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: "{GROUP_COL}"
    column_type: object
    display: {title_size: md, custom_color: '#00897B', icon_name: 'mdi:flask-outline'}
    placement: left
    title: "{GROUP_COL_DISPLAY}"
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: cp-ov-filter-cells
    index: cp-ov-cells-range
    section: Well scope
    group: Well yield
    workflow_tag: cellpainting
    data_collection_tag: cp-wells
    use: cytotable/well_cells_filter
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: n_cells
    column_type: int64
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:counter'}
    placement: left
    title: Cells per well
    layout: {x: 0, y: 0, w: 1, h: 3}

tabs:
# ============================================================================
# Plate QC
# ============================================================================
- title: Plate QC
  subtitle: Cells per site, image focus and saturation, illumination correction and the segmented object shapes
  advanced_viz_controls: header
  tab_order: 2
  tab_icon: mdi:check-decagram
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Site scope
    icon: mdi:tune
    color: blue
    description: Keep only the sites inside a cell-count band, and pick the channels of the image-quality panels
  grid_sections:
  - name: Cells per site
    icon: mdi:chart-box-outline
    color: blue
    description: How many cells each site yielded and what they look like, site by site
  - name: Image quality
    icon: mdi:microscope
    color: indigo
    description: Focus and saturation of every raw channel of the analysed sites
  - name: Illumination correction
    icon: mdi:chart-line
    color: violet
    description: How uneven the illumination was that every raw image was corrected for
  - name: Segmentation
    icon: mdi:shape-outline
    color: cyan
    description: Nucleus against cell size, one point per segmented cell
  - name: Site detail
    icon: mdi:information-outline
    color: cyan
    description: One row per site, and the record of the picked site
  components:
  - component_type: interactive
    tag: cp-qc-filter-cells
    index: cp-qc-cells-range
    section: Site scope
    group: Site yield
    workflow_tag: cellpainting
    data_collection_tag: cp-sites
    use: cytotable/site_cells_filter
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: n_cells
    column_type: int64
    display: {title_size: md, custom_color: '#1E88E5', icon_name: 'mdi:counter'}
    placement: left
    title: Cells per site
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: cp-qc-filter-channel
    index: cp-qc-channel-filter
    section: Site scope
    group: Site yield
    workflow_tag: cellpainting
    data_collection_tag: cp-image-qc
    use: cellprofiler/channel_filter
    interactive_component_type: MultiSelect
    column_name: channel
    column_type: object
    display: {title_size: md, custom_color: '#1E88E5', icon_name: 'mdi:palette-outline'}
    placement: left
    title: Channel
    layout: {x: 0, y: 3, w: 1, h: 3}

  # ---------------------------------------------------------- cells per site
  - component_type: text
    tag: cp-qc-intro
    section: Cells per site
    title: Which sites to trust
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each well is imaged at several sites, and a site out of focus, at the
      well edge or on debris yields few cells or abnormal nuclei. Compare every
      site with the other sites of its well before reading any profile.
    workflow_tag: cellpainting
    data_collection_tag: cp-sites
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: cp-qc-card-nucleus-area
    index: cp-qc-card-nucleus-area
    section: Cells per site
    workflow_tag: cellpainting
    data_collection_tag: cp-sites
    use: cytotable/site_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: median_nucleus_area
    column_type: float64
    display: {icon_name: 'mdi:circle-outline', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Nucleus area per site
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cp-qc-card-cell-area
    index: cp-qc-card-cell-area
    section: Cells per site
    workflow_tag: cellpainting
    data_collection_tag: cp-sites
    use: cytotable/site_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: median_cell_area
    column_type: float64
    display: {icon_name: 'mdi:shape-outline', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Cell area per site
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cp-qc-card-dna
    index: cp-qc-card-dna
    section: Cells per site
    workflow_tag: cellpainting
    data_collection_tag: cp-sites
    use: cytotable/site_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: median_nucleus_dna
    column_type: float64
    display: {icon_name: 'mdi:dna', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Nuclear DNA per site
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cp-qc-card-neighbors
    index: cp-qc-card-neighbors
    section: Cells per site
    workflow_tag: cellpainting
    data_collection_tag: cp-sites
    use: cytotable/site_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: median_neighbors
    column_type: float64
    display: {icon_name: 'mdi:account-group-outline', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Touching cells per site
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: figure
    tag: cp-qc-fig-cells-per-site
    section: Cells per site
    workflow_tag: cellpainting
    data_collection_tag: cp-sites
    use: cytotable/cells_per_site_box
    visu_type: box
    dict_kwargs: {x: well, y: n_cells, points: all, title: "Cells per site, by well"}
    title: Cells per site, by well
    description: One point per site; a site far below its well's box is the one to drop or to look at on the Images tab.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 5}
  - component_type: advanced_viz
    tag: cp-qc-av-site-scatter
    index: cp-qc-av-site-scatter
    section: Cells per site
    workflow_tag: cellpainting
    data_collection_tag: cp-sites
    use: cytotable/site_scatter
    config:
      controls_placement: header
      x_title: Cells on the site
      y_title: Median nucleus area (pixels)
      selection_enabled: true
      selection_column: site_id
    title: Cell count against nucleus size, per site
    description: Sites with few cells and large or small nuclei are the usual signature of a focus or segmentation problem; lasso them to narrow the tables.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 7}

  # ----------------------------------------------------------- image quality
  - component_type: text
    tag: cp-qc-iq-intro
    section: Image quality
    title: Focus and saturation per channel
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      CellProfiler measures every raw channel of every analysed site. A power
      log-log slope far below the rest of its channel marks a blurred field,
      and saturated pixels mark an over-exposed stain.
    workflow_tag: cellpainting
    data_collection_tag: cp-image-qc
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: figure
    tag: cp-qc-fig-blur
    section: Image quality
    workflow_tag: cellpainting
    data_collection_tag: cp-image-qc
    use: cellprofiler/focus_box
    visu_type: box
    dict_kwargs: {x: channel, y: power_log_log_slope, points: all, title: Power log-log slope per channel}
    title: Blur per channel
    description: Power log-log slope, one point per site; more negative is blurrier.
    title_size: h3
    layout: {x: 0, y: 2, w: 4, h: 5}
  - component_type: figure
    tag: cp-qc-fig-saturation
    section: Image quality
    workflow_tag: cellpainting
    data_collection_tag: cp-image-qc
    use: cellprofiler/saturation_box
    visu_type: box
    dict_kwargs: {x: channel, y: percent_saturated, points: all, title: Saturated pixels per channel}
    title: Saturation per channel
    description: Share of pixels at the maximum intensity, one point per site.
    title_size: h3
    layout: {x: 4, y: 2, w: 4, h: 5}

  # ------------------------------------------------- illumination correction
  - component_type: text
    tag: cp-qc-illum-intro
    section: Illumination correction
    title: How even the field was lit
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each curve is the correction factor of one plate and channel, from the
      field centre to its corners; a flat curve means even illumination. A
      steep or lopsided curve means the images leaned on the correction.
    workflow_tag: cellpainting
    data_collection_tag: cp-illumination
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: cp-qc-av-illum
    index: cp-qc-av-illum
    section: Illumination correction
    workflow_tag: cellpainting
    data_collection_tag: cp-illumination
    use: cellprofiler/illumination_radial
    config:
      controls_placement: header
      x_title: Distance from the field centre (0 centre, 1 corner)
      y_title: Correction factor
    title: Illumination correction, centre to corner
    description: One curve per plate and channel; the factor every raw pixel at that distance was divided by.
    title_size: h3
    layout: {x: 0, y: 2, w: 5, h: 6}
  - component_type: figure
    tag: cp-qc-fig-illum-range
    section: Illumination correction
    workflow_tag: cellpainting
    data_collection_tag: cp-illumination
    use: cellprofiler/illumination_range_bar
    visu_type: bar
    dict_kwargs: {x: channel, y: correction_range, color: plate, barmode: group, title: Illumination correction range per channel}
    title: Correction range per channel
    description: Maximum over minimum of each correction function; 1 is a perfectly even field.
    title_size: h3
    layout: {x: 5, y: 2, w: 3, h: 6}

  # ------------------------------------------------------------ segmentation
  - component_type: text
    tag: cp-qc-seg-intro
    section: Segmentation
    title: Nucleus against cell size
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One point per segmented cell. Under-segmented clumps sit far to the top
      right and over-segmented fragments pile up at the bottom left, apart from
      the main cloud.
    workflow_tag: cellpainting
    data_collection_tag: cp-cells
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: cp-qc-av-shape
    index: cp-qc-av-shape
    section: Segmentation
    workflow_tag: cellpainting
    data_collection_tag: cp-cells
    use: cytotable/shape_scatter
    config:
      controls_placement: header
      x_title: Nucleus area (pixels)
      y_title: Cell area (pixels)
      selection_enabled: true
      selection_column: cell_id
    title: Nucleus area against cell area
    description: Coloured by well; lasso a cloud of outliers to see which sites they come from.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 7}

  # ------------------------------------------------------------- site detail
  - component_type: table
    tag: cp-qc-table-sites
    section: Site detail
    workflow_tag: cellpainting
    data_collection_tag: cp-sites
    use: cytotable/site_summary
    row_selection_enabled: true
    row_selection_column: site_id
    title: Per-site summary
    description: One row per site with its cell count and median morphology; select a row to read the site beside the table.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 5, h: 7}
  - component_type: advanced_viz
    tag: cp-qc-av-site-record
    index: cp-qc-av-site-record
    section: Site detail
    workflow_tag: cellpainting
    data_collection_tag: cp-sites
    use: cytotable/site_record
    config:
      id_col: site_id
      title_col: site_id
      selection_source: any
      linked_component: cp-qc-table-sites
      sections:
        Site: [site_id, plate, well, site]
        Yield: [n_cells, median_neighbors]
        Morphology: [median_cell_area, median_nucleus_area, median_nucleus_dna]
    title: Site record
    description: The picked site with its yield and median morphology.
    title_size: h3
    layout: {x: 5, y: 0, w: 3, h: 7}

# ============================================================================
# Images
# ============================================================================
- title: Images
  subtitle: The segmentation overlays and outlines CellProfiler wrote, filtered by well, site and group
  advanced_viz_controls: header
  tab_order: 3
  tab_icon: mdi:image-multiple-outline
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Image scope
    icon: mdi:tune
    color: cyan
    description: Which kind of segmentation image the gallery shows
  grid_sections:
  - name: Segmentation images
    icon: mdi:microscope
    color: cyan
    description: Outlines drawn over the stains, the visual check of the segmentation
  - name: Image list
    icon: mdi:table
    color: gray
    description: One row per image file
    collapsed: true
  components:
  - component_type: interactive
    tag: cp-im-filter-kind
    index: cp-im-kind-filter
    section: Image scope
    group: Image kind
    workflow_tag: cellpainting
    data_collection_tag: cp-overlays
    use: cellprofiler/overlay_kind_filter
    interactive_component_type: SegmentedControl
    column_name: image_kind
    column_type: object
    display: {title_size: md, custom_color: '#00ACC1', icon_name: 'mdi:image-outline'}
    placement: left
    title: Image kind
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: text
    tag: cp-im-intro
