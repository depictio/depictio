# ============================================================================
# Profiles
# ============================================================================
- title: Profiles
  subtitle: Feature distributions, the well x feature heatmap and the single-cell PCA
  advanced_viz_controls: header
  tab_order: 4
  tab_icon: mdi:chart-scatter-plot
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Cell scope
    icon: mdi:tune
    color: violet
    description: Keep only the cells inside a size band, for example to drop fragments and clumps
  grid_sections:
  - name: Feature distributions
    icon: mdi:chart-bell-curve
    color: violet
    description: How the curated features are distributed, cell by cell
  - name: Well profiles
    icon: mdi:chart-box-outline
    color: grape
    description: Every well's median profile, as z-scores across the run's wells
  - name: Cell embedding
    icon: mdi:chart-scatter-plot
    color: indigo
    description: The single cells projected on the principal components of their features
  - name: Cell table
    icon: mdi:table
    color: gray
    description: One row per cell with its curated features
    collapsed: true
  components:
  - component_type: interactive
    tag: cp-pr-filter-cell-area
    index: cp-pr-cell-area-range
    section: Cell scope
    group: Cell size
    workflow_tag: cellpainting
    data_collection_tag: cp-cells
    use: cytotable/cell_area_filter
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: cell_area
    column_type: float64
    display: {title_size: md, custom_color: '#5E35B1', icon_name: 'mdi:shape-outline'}
    placement: left
    title: Cell area (pixels)
    layout: {x: 0, y: 0, w: 1, h: 3}

  # --------------------------------------------------- feature distributions
  - component_type: text
    tag: cp-pr-intro
    section: Feature distributions
    title: The curated morphological profile
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      About two dozen of the thousands of features CellProfiler measures:
      size and shape, DNA content, stain intensities, texture, granularity,
      colocalisation and crowding. A two-peaked DNA content histogram is the
      cell cycle; a shift of the whole distribution between wells is a
      phenotype or a plate effect.
    workflow_tag: cellpainting
    data_collection_tag: cp-cells
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: cp-pr-card-cells
    index: cp-pr-card-cells
    section: Feature distributions
    workflow_tag: cellpainting
    data_collection_tag: cp-cells
    use: cytotable/single_cell
    aggregation: count
    column_name: cell_id
    column_type: object
    secondary_layout: top_n
    breakdown_col: well
    top_n_count: 3
    display: {icon_name: 'mdi:counter', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Cells in scope
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cp-pr-card-cell-area
    index: cp-pr-card-cell-area
    section: Feature distributions
    workflow_tag: cellpainting
    data_collection_tag: cp-cells
    use: cytotable/single_cell
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: cell_area
    column_type: float64
    display: {icon_name: 'mdi:shape-outline', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Cell area
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cp-pr-card-dna
    index: cp-pr-card-dna
    section: Feature distributions
    workflow_tag: cellpainting
    data_collection_tag: cp-cells
    use: cytotable/single_cell
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: nucleus_dna_integrated
    column_type: float64
    display: {icon_name: 'mdi:dna', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Nuclear DNA content
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cp-pr-card-neighbors
    index: cp-pr-card-neighbors
    section: Feature distributions
    workflow_tag: cellpainting
    data_collection_tag: cp-cells
    use: cytotable/single_cell
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: cell_neighbors
    column_type: float64
    display: {icon_name: 'mdi:account-group-outline', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Touching cells
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: figure
    tag: cp-pr-fig-dna
    section: Feature distributions
    workflow_tag: cellpainting
    data_collection_tag: cp-cells
    use: cytotable/dna_content_histogram
    visu_type: histogram
    dict_kwargs: {x: nucleus_dna_integrated, color: well, title: Integrated nuclear DNA intensity}
    title: DNA content per cell
    description: Integrated DNA stain in the nucleus; G1 and G2 cells form two peaks about a factor two apart.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 5}
  - component_type: figure
    tag: cp-pr-fig-cell-area
    section: Feature distributions
    workflow_tag: cellpainting
    data_collection_tag: cp-cells
    use: cytotable/cell_area_box
    visu_type: box
    dict_kwargs: {x: well, y: cell_area, title: Cell area per well}
    title: Cell area per well
    description: One box per well, one value per cell.
    title_size: h3
    layout: {x: 0, y: 9, w: 8, h: 5}

  # ------------------------------------------------------------ well profiles
  - component_type: text
    tag: cp-pr-heat-intro
    section: Well profiles
    title: Wells by feature
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each row is a well, each column a curated feature, coloured by how far
      the well's median sits from the median of all wells in robust
      standard deviations. Wells that cluster together share a phenotype;
      the side strip shows their group.
    workflow_tag: cellpainting
    data_collection_tag: cp-wells
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: cp-pr-av-heatmap
    index: cp-pr-av-heatmap
    section: Well profiles
    workflow_tag: cellpainting
    data_collection_tag: cp-wells
    use: cytotable/well_heatmap
    config:
      controls_placement: header
      index_column: well_id
      value_columns_pattern: "^z_"
      row_annotation_cols: [group]
      cluster_rows: true
      cluster_cols: true
      cluster_method: ward
      cluster_metric: euclidean
      colorscale: RdBu_r
    title: Well x feature profile (robust z-scores)
    description: "Rows are wells, annotated by {GROUP_COL_DISPLAY}; columns are the curated features."
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 8}

  # ----------------------------------------------------------- cell embedding
  - component_type: text
    tag: cp-pr-emb-intro
    section: Cell embedding
    title: Where each cell sits in feature space
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      A PCA of the standardised curated features, one point per cell. Colour
      by group, well, size or DNA content to see whether cells separate by
      perturbation, by plate position or by cell cycle.
    workflow_tag: cellpainting
    data_collection_tag: cp-cell-embedding
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: cp-pr-av-pca
    index: cp-pr-av-pca
    section: Cell embedding
    workflow_tag: cellpainting
    data_collection_tag: cp-cell-embedding
    use: cytotable/cell_pca
    config:
      controls_placement: header
      selection_enabled: true
      selection_column: cell_id
      hover_cols: [well_id, pc_1_variance, pc_2_variance]
    title: Single-cell PCA
    description: "Opens coloured by {GROUP_COL_DISPLAY}; the hover gives the share of variance of PC1 and PC2."
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 8}

  # --------------------------------------------------------------- cell table
  - component_type: table
    tag: cp-pr-table-cells
    section: Cell table
    workflow_tag: cellpainting
    data_collection_tag: cp-cells
    use: cytotable/single_cell
    row_selection_enabled: true
    row_selection_column: cell_id
    title: Single cells
    description: One row per cell with its site, position and curated features.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 7}

# ============================================================================
# Perturbations
# ============================================================================
- title: Perturbations
  subtitle: Per-group summaries and a feature-by-feature comparison between two groups
  advanced_viz_controls: header
  tab_order: 5
  tab_icon: mdi:scale-balance
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Comparison scope
    icon: mdi:tune
    color: grape
    description: Which groups the summaries and the comparison read
  grid_sections:
  - name: Per-group summaries
    icon: mdi:chart-box-outline
    color: grape
    description: Wells and cells per group, and the well medians of two key features
  - name: Compare two groups
    icon: mdi:scale-balance
    color: pink
    description: Every curated feature tested between two groups of cells
  components:
  - component_type: interactive
    tag: cp-pt-filter-group
    index: cp-pt-group-filter
    section: Comparison scope
    group: Groups
    workflow_tag: cellpainting
    data_collection_tag: cp-cell-profiles
    use: cytotable/cell_group_filter
    interactive_component_type: MultiSelect
    column_name: group
    column_type: object
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:flask-outline'}
    placement: left
    title: "{GROUP_COL_DISPLAY} (cells)"
    layout: {x: 0, y: 0, w: 1, h: 3}

  # --------------------------------------------------- per-group summaries
  - component_type: text
    tag: cp-pt-intro
    section: Per-group summaries
    title: What each group looks like
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Each well is summarised by the median of its cells, the unit a
      perturbation is compared on. A group whose wells scatter as widely as
      the groups differ has no consistent phenotype.
    workflow_tag: cellpainting
    data_collection_tag: cp-wells
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: cp-pt-card-wells
    index: cp-pt-card-wells
    section: Per-group summaries
    workflow_tag: cellpainting
    data_collection_tag: cp-wells
    use: cytotable/well_profile
    aggregation: count
    column_name: well_id
    column_type: object
    secondary_layout: donut
    breakdown_col: group
    display: {icon_name: 'mdi:grid', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Profiled wells by group
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cp-pt-card-cells
    index: cp-pt-card-cells
    section: Per-group summaries
    workflow_tag: cellpainting
    data_collection_tag: cp-cell-profiles
    use: cytotable/cell_profiles
    aggregation: count
    column_name: cell_id
    column_type: object
    secondary_layout: donut
    breakdown_col: group
    display: {icon_name: 'mdi:chart-donut', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Cells by group
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cp-pt-card-cell-area
    index: cp-pt-card-cell-area
    section: Per-group summaries
    workflow_tag: cellpainting
    data_collection_tag: cp-wells
    use: cytotable/well_profile
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: cell_area
    column_type: float64
    display: {icon_name: 'mdi:shape-outline', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Well median cell area
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: cp-pt-card-dna
    index: cp-pt-card-dna
    section: Per-group summaries
    workflow_tag: cellpainting
    data_collection_tag: cp-wells
    use: cytotable/well_profile
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: nucleus_dna_integrated
    column_type: float64
    display: {icon_name: 'mdi:dna', title_font_size: xl, value_font_size: xl}
    title_size: sm
    title_align: left
    title: Well median DNA content
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: figure
    tag: cp-pt-fig-cell-area
    section: Per-group summaries
    workflow_tag: cellpainting
    data_collection_tag: cp-wells
    use: cytotable/group_cell_area_box
    visu_type: box
    dict_kwargs: {x: group, y: cell_area, points: all, title: "Median cell area per well, by group"}
    title: Cell area by group
    description: One point per well, the median area of its cells.
    title_size: h3
    layout: {x: 0, y: 4, w: 4, h: 5}
  - component_type: figure
    tag: cp-pt-fig-dna
    section: Per-group summaries
    workflow_tag: cellpainting
    data_collection_tag: cp-wells
    use: cytotable/group_dna_box
    visu_type: box
    dict_kwargs: {x: group, y: nucleus_dna_integrated, points: all, title: "Median nuclear DNA per well, by group"}
    title: DNA content by group
    description: One point per well; a shift is a cell-cycle or ploidy effect.
    title_size: h3
    layout: {x: 4, y: 4, w: 4, h: 5}

  # -------------------------------------------------------- compare two groups
  - component_type: text
    tag: cp-pt-cmp-intro
    section: Compare two groups
    title: Which features separate two groups
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Pick two groups in the tile header (or two saved selections, for
      example cells lassoed on the PCA) and read the volcano for the features
      that move. Cells of one well are not independent, so treat it as a
      ranking of features to look at, not as a test of the perturbation.
    workflow_tag: cellpainting
    data_collection_tag: cp-cell-profiles
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: advanced_viz
    tag: cp-pt-av-compare
    index: cp-pt-av-compare
    section: Compare two groups
    workflow_tag: cellpainting
    data_collection_tag: cp-cell-profiles
    use: cytotable/group_feature_compare
    config:
      controls_placement: header
      index_col: cell_id
      group_col: group
      test: wilcoxon
      log_transform: false
      min_observations: 10
      fdr_threshold: 0.05
      log2fc_threshold: 0.25
      top_n_labels: 15
      auto_run: true
    title: Group A against group B, feature by feature
    description: Wilcoxon test per curated feature between the cells of the two groups, Benjamini-Hochberg corrected.
    title_size: h3
    layout: {x: 0, y: 2, w: 8, h: 9}
