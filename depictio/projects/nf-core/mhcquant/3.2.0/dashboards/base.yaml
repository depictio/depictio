version: 1
main_dashboard:
  title: nf-core/mhcquant
  subtitle: Identification QC from the MultiQC report. Check yield and score distributions before reading the peptides.
  project_tag: mhcquant Immunopeptidomics
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  # Persistent: the sample filters ride every tab. They are sourced on the
  # samplesheet hub and the template's links fan the selection out to every
  # sample-level and raw-file-level collection.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Samplesheet samples, groups and raw files, applied to every tab
    persistent: true
    pin: top
  - name: Report scope
    icon: mdi:tune
    color: orange
    description: Narrow the MultiQC panels to selected report samples
  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: teal
    description: Samples, raw files, groups and identified peptides in the current scope
    persistent: true
    pin: top
  - name: Sample sheet
    icon: mdi:table-account
    color: teal
    description: The samplesheet every other tab is filtered by
    collapsed: true
    persistent: true
    pin: top
  - name: Identification yield
    icon: mdi:chart-box-outline
    color: orange
    description: Identifications, q-values and search scores per sample
  - name: Peptide properties
    icon: mdi:chart-bell-curve
    color: orange
    description: Precursor m/z, retention time and intensity distributions
  - name: Acquisition and rescoring
    icon: mdi:chart-line
    color: gray
    description: Chromatograms, fragment mass error and Percolator feature weights
    collapsed: true
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The per-sample summary behind the tiles, on every tab
    collapsed: true
    persistent: true
    pin: bottom
  components:
  # ----------------------------------------------------------- glance strip
  - component_type: card
    tag: mq-glance-samples
    section: Run at a glance
    workflow_tag: mhcquant
    data_collection_tag: samples
    aggregation: nunique
    column_name: sample_id
    column_type: object
    secondary_layout: composition
    breakdown_col: "{GROUP_COL}"
    display: {icon_name: 'mdi:test-tube', title_font_size: xl, value_font_size: xl}
    title: Samples
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    tag: mq-glance-raw-files
    section: Run at a glance
    workflow_tag: mhcquant
    data_collection_tag: samples
    aggregation: nunique
    column_name: run_id
    column_type: object
    secondary_layout: composition
    breakdown_col: sample_id
    display: {icon_name: 'mdi:file-document-outline', title_font_size: xl, value_font_size: xl}
    title: Raw files
    title_size: sm
    title_align: left
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    tag: mq-glance-groups
    section: Run at a glance
    workflow_tag: mhcquant
    data_collection_tag: samples
    aggregation: nunique
    column_name: "{GROUP_COL}"
    column_type: object
    secondary_layout: composition
    breakdown_col: "{GROUP_COL}"
    display: {icon_name: 'mdi:account-group-outline', title_font_size: xl, value_font_size: xl}
    title: "{GROUP_COL_DISPLAY} groups"
    title_size: sm
    title_align: left
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    tag: mq-glance-peptides
    section: Run at a glance
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_sample_summary
    use: mhcquant/sample_summary
    aggregation: sum
    column_name: peptides
    column_type: int64
    secondary_layout: top_n
    breakdown_col: sample
    top_n_count: 3
    display: {icon_name: 'mdi:dna', title_font_size: xl, value_font_size: xl}
    title: Peptides identified
    title_size: sm
    title_align: left
    layout: {x: 6, y: 0, w: 2, h: 2}

  # ------------------------------------------------------------ sample sheet
  - component_type: text
    tag: mq-sheet-intro
    section: Sample sheet
    workflow_tag: mhcquant
    data_collection_tag: samples
    title: The samplesheet the run started from
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      One row per MS raw file, with the sample and raw-file keys every other
      table joins on. The filters on the left select rows of this table.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: table
    tag: mq-sheet-table
    section: Sample sheet
    workflow_tag: mhcquant
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample_id
    title: Samplesheet
    description: Sample, condition, raw file and search database of every raw file.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 4}

  # ------------------------------------------------------- reference tables
  - component_type: table
    tag: mq-ref-summary
    section: Reference tables
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_sample_summary
    use: mhcquant/sample_summary
    row_selection_enabled: true
    row_selection_column: sample
    title: Immunopeptidome summary per sample
    description: Yield, length signature, score and retention-time error, and replicate reproducibility, one row per sample.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 4}

  # ------------------------------------------------------ identification yield
  - component_type: text
    tag: mq-mqc-yield-intro
    section: Identification yield
    workflow_tag: mhcquant
    data_collection_tag: multiqc_data
    title: How much each sample identified, and how confidently
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Compare PSM and peptide counts across samples first, then check that the
      q-value and score distributions of a low-yield sample look like the others.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: multiqc
    tag: mq-mqc-stats
    section: Identification yield
    workflow_tag: mhcquant
    data_collection_tag: multiqc_data
    selected_module: stats_table
    selected_plot: stats_table-section
    title: Identification counts
    description: PSMs, peptides, modified peptides and proteins per sample.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 8, h: 4}
  - component_type: multiqc
    tag: mq-mqc-qvalue
    section: Identification yield
    workflow_tag: mhcquant
    data_collection_tag: multiqc_data
    selected_module: qvalue_plot
    selected_plot: qvalue_plot-section
    title: q-value distribution
    description: Distribution of the peptide-level q-values of the accepted identifications.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 6, w: 4, h: 5}
  - component_type: multiqc
    tag: mq-mqc-xcorr
    section: Identification yield
    workflow_tag: mhcquant
    data_collection_tag: multiqc_data
    selected_module: scores_plot_xcorr
    selected_plot: scores_plot_xcorr-section
    title: Comet Xcorr per sample
    description: Search score of the accepted identifications.
    title_size: sm
    title_align: left
    layout: {x: 4, y: 6, w: 4, h: 5}

  # --------------------------------------------------------- peptide properties
  - component_type: multiqc
    tag: mq-mqc-mz
    section: Peptide properties
    workflow_tag: mhcquant
    data_collection_tag: multiqc_data
    selected_module: mz_plot
    selected_plot: mz_plot-section
    title: Precursor m/z
    description: m/z distribution of the identified precursors.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: multiqc
    tag: mq-mqc-rt
    section: Peptide properties
    workflow_tag: mhcquant
    data_collection_tag: multiqc_data
    selected_module: rt_plot
    selected_plot: rt_plot-section
    title: Retention time
    description: Elution time distribution of the identified peptides.
    title_size: sm
    title_align: left
    layout: {x: 4, y: 0, w: 4, h: 5}
  - component_type: multiqc
    tag: mq-mqc-intensity
    section: Peptide properties
    workflow_tag: mhcquant
    data_collection_tag: multiqc_data
    selected_module: peptide_intensity_plot
    selected_plot: peptide_intensity_plot-section
    title: Peptide intensity
    description: Quantified peptide intensities per sample.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 5, w: 8, h: 5}

  # ------------------------------------------------ acquisition and rescoring
  - component_type: multiqc
    tag: mq-mqc-chromatogram
    section: Acquisition and rescoring
    workflow_tag: mhcquant
    data_collection_tag: multiqc_data
    selected_module: chromatogram
    selected_plot: chromatogram-section
    title: Total ion chromatograms
    description: Ion current over the gradient, one trace per raw file.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: multiqc
    tag: mq-mqc-mass-error
    section: Acquisition and rescoring
    workflow_tag: mhcquant
    data_collection_tag: multiqc_data
    selected_module: mass_error
    selected_plot: mass_error-section
    title: Fragment mass error
    description: Fragment ion mass error per raw file.
    title_size: sm
    title_align: left
    layout: {x: 0, y: 5, w: 4, h: 5}
  - component_type: multiqc
    tag: mq-mqc-percolator
    section: Acquisition and rescoring
    workflow_tag: mhcquant
    data_collection_tag: multiqc_data
    use: multiqc/percolator
    selected_module: percolator
    selected_plot: percolator_median_feature_weights
    title: Percolator feature weights
    description: Median weight of each rescoring feature, per sample.
    title_size: sm
    title_align: left
    layout: {x: 4, y: 5, w: 4, h: 5}

  # ------------------------------------------------------------- left panel
  - component_type: interactive
    tag: mq-filter-sample
    index: mq-sample-filter
    section: Sample filters
    group: Samples
    workflow_tag: mhcquant
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display: {title_size: md, custom_color: '#26A69A', icon_name: 'mdi:test-tube'}
    placement: left
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: mq-filter-group
    index: mq-group-filter
    section: Sample filters
    group: Samples
    workflow_tag: mhcquant
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: "{GROUP_COL}"
    column_type: object
    display: {title_size: md, custom_color: '#3F51B5', icon_name: 'mdi:account-group-outline'}
    placement: left
    title: "{GROUP_COL_DISPLAY}"
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    tag: mq-filter-raw-file
    index: mq-raw-file-filter
    section: Sample filters
    group: Samples
    workflow_tag: mhcquant
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: run_id
    column_type: object
    display: {title_size: md, custom_color: '#8E24AA', icon_name: 'mdi:file-document-outline'}
    placement: left
    title: Raw file
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    tag: mq-mqc-filter-report-sample
    index: mq-mqc-report-sample-filter
    section: Report scope
    group: Report scope
    workflow_tag: mhcquant
    data_collection_tag: multiqc_data
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display: {title_size: md, custom_color: '#FB8C00', icon_name: 'mdi:file-document-outline'}
    placement: left
    title: Report sample
    layout: {x: 0, y: 0, w: 1, h: 3}

tabs:
# =========================================================================
# Tab 2 - Identification: yield and FDR
# =========================================================================
- title: Identification
  subtitle: Peptide-spectrum matches, peptides and proteins per sample, and how the search behaves across FDR thresholds
  tab_order: 2
  tab_icon: mdi:magnify-scan
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Identification scope
    icon: mdi:tune
    color: blue
    description: Keep peptides inside a score or PSM-support band
  grid_sections:
  - name: Yield at a glance
    icon: mdi:counter
    color: blue
    description: Identifications per sample and per raw file
  - name: Search and FDR
    icon: mdi:chart-line
    color: blue
    description: Accepted PSMs across FDR thresholds and the score distribution
  - name: Search tables
    icon: mdi:table
    color: gray
    description: Comet search yield per raw file
    collapsed: true
  components:
  - component_type: text
    tag: mq-id-intro
    section: Yield at a glance
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_sample_summary
    title: Identification yield
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The per-sample cards count what passed the pipeline's FDR filter; the raw
      file card counts Comet matches at 1% FDR before rescoring, so a raw file
      that lags there has a spectrum or search problem.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: mq-id-card-psms
    section: Yield at a glance
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_sample_summary
    use: mhcquant/sample_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: psms
    column_type: int64
    display: {icon_name: 'mdi:chart-bar', title_font_size: xl, value_font_size: xl}
    title: PSMs per sample
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: mq-id-card-peptides
    section: Yield at a glance
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_sample_summary
    use: mhcquant/sample_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: peptides
    column_type: int64
    display: {icon_name: 'mdi:dna', title_font_size: xl, value_font_size: xl}
    title: Peptides per sample
    title_size: sm
    title_align: left
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: mq-id-card-proteins
    section: Yield at a glance
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_sample_summary
    use: mhcquant/sample_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: proteins
    column_type: int64
    display: {icon_name: 'mdi:shape-outline', title_font_size: xl, value_font_size: xl}
    title: Source proteins per sample
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: mq-id-card-comet-1pct
    section: Yield at a glance
    workflow_tag: mhcquant
    data_collection_tag: openms_comet_psms
    use: openms/comet_psms
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: psms_1pct_fdr
    column_type: int64
    display: {icon_name: 'mdi:check-decagram', title_font_size: xl, value_font_size: xl}
    title: Comet PSMs at 1% FDR per raw file
    title_size: sm
    title_align: left
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: mq-id-av-fdr-curve
    index: mq-id-av-fdr-curve
    section: Search and FDR
    workflow_tag: mhcquant
    data_collection_tag: openms_comet_fdr_curve
    use: openms/fdr_profile
    config:
      x_title: Target-decoy q-value threshold
      y_title: Accepted target PSMs
      reference_x: 0.01
      reference_label: 1% FDR
      legend_pos: bottom
      controls_placement: header
    title: Accepted PSMs against the FDR threshold, per raw file
    description: Comet target-decoy competition on Xcorr before rescoring. A curve that rises late or flattens low marks a raw file with weaker spectra.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: figure
    tag: mq-id-fig-score
    index: mq-id-score-histogram
    section: Search and FDR
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    use: mhcquant/peptides
    visu_type: histogram
    dict_kwargs: {x: score, color: sample}
    title: Score of the accepted peptides
    description: Best search score per accepted peptide precursor, by sample.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 6}
  - component_type: table
    tag: mq-id-table-comet
    section: Search tables
    workflow_tag: mhcquant
    data_collection_tag: openms_comet_psms
    use: openms/comet_psms
    row_selection_enabled: true
    row_selection_column: run_id
    title: Comet search yield per raw file
    description: Spectra searched, target and decoy matches, PSMs at 1% and 5% FDR, score and mass-error medians.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: interactive
    tag: mq-id-filter-score
    index: mq-id-score-range
    section: Identification scope
    group: Peptide support
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    interactive_component_type: RangeSlider
    column_name: score
    column_type: float64
    display: {title_size: md, custom_color: '#1E88E5', icon_name: 'mdi:chart-bell-curve'}
    placement: left
    title: Peptide score
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: mq-id-filter-psms
    index: mq-id-psm-range
    section: Identification scope
    group: Peptide support
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    interactive_component_type: RangeSlider
    column_name: psms
    column_type: int64
    display: {title_size: md, custom_color: '#3949AB', icon_name: 'mdi:counter'}
    placement: left
    title: PSMs per peptide
    layout: {x: 0, y: 3, w: 1, h: 3}

# =========================================================================
# Tab 3 - MHC signature: length profile and anchor motifs
# =========================================================================
- title: MHC signature
  subtitle: Peptide length profile and positional amino-acid preferences, the fingerprint of the presenting MHC class and alleles
  tab_order: 3
  tab_icon: mdi:ruler
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Signature scope
    icon: mdi:tune
    color: violet
    description: Restrict the length profile and motifs to chosen peptide lengths
  grid_sections:
  - name: Length signature
    icon: mdi:ruler
    color: violet
    description: How peptide lengths are distributed in each sample
  - name: Anchor motifs
    icon: mdi:dna
    color: violet
    description: Amino-acid frequency at each position, per sample and length
  - name: Signature tables
    icon: mdi:table
    color: gray
    description: Length counts behind the profile
    collapsed: true
  components:
  - component_type: text
    tag: mq-sig-intro
    section: Length signature
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_length_distribution
    title: Which MHC class the peptides come from
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Class I ligands peak sharply at 9 residues within 8 to 12, class II
      ligands spread over 13 to 25. A flat or shifted profile points at
      co-purified non-presented peptides or a length filter set too wide.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: mq-sig-card-ninemer
    section: Length signature
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_sample_summary
    use: mhcquant/sample_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: ninemer_fraction
    column_type: float64
    display: {icon_name: 'mdi:star-outline', title_font_size: xl, value_font_size: xl}
    title: 9-mer share per sample
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: mq-sig-card-class-i
    section: Length signature
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_sample_summary
    use: mhcquant/sample_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: class_i_fraction
    column_type: float64
    display: {icon_name: 'mdi:ruler', title_font_size: xl, value_font_size: xl}
    title: Share in the class I range
    title_size: sm
    title_align: left
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: mq-sig-card-class-ii
    section: Length signature
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_sample_summary
    use: mhcquant/sample_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: class_ii_fraction
    column_type: float64
    display: {icon_name: 'mdi:ruler', title_font_size: xl, value_font_size: xl}
    title: Share in the class II range
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: mq-sig-card-median-length
    section: Length signature
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_sample_summary
    use: mhcquant/sample_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: median_length
    column_type: float64
    display: {icon_name: 'mdi:chart-bell-curve', title_font_size: xl, value_font_size: xl}
    title: Median peptide length
    title_size: sm
    title_align: left
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: mq-sig-av-length-profile
    index: mq-sig-av-length-profile
    section: Length signature
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_length_distribution
    use: mhcquant/length_profile
    config:
      x_title: Peptide length (residues)
      y_title: Share of the sample's peptides
      shaded_bands:
      - [8, 12, Class I range]
      - [13, 25, Class II range]
      legend_pos: bottom
      controls_placement: header
    title: Peptide length distribution per sample
    description: Share of each sample's distinct sequences at each length, with the class I and class II length ranges shaded.
    title_size: h3
    layout: {x: 0, y: 4, w: 8, h: 7}
  - component_type: advanced_viz
    tag: mq-sig-av-composition
    index: mq-sig-av-composition
    section: Length signature
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptide_composition
    use: mhcquant/composition_bars
    config:
      default_rank: Peptide length
      normalise_to_one: true
      sample_sort: input
      sort_by: abundance
      top_n: 12
      controls_placement: header
    title: Peptide composition per sample
    description: Share of each sample's peptidoforms by length, switchable to precursor charge and modification state.
    title_size: h3
    layout: {x: 0, y: 11, w: 8, h: 7}
  - component_type: text
    tag: mq-sig-motif-intro
    section: Anchor motifs
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_motif_matrix
    title: Positional preferences of the presenting alleles
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Rows are positions of one peptide length in one sample, columns are amino
      acids. Anchor positions show up as rows dominated by a few residues; pick
