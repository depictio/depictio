- title: Identification
  subtitle: How many spectra became peptides, and at what FDR?
  tab_group: Search
  tab_order: 3
  tab_icon: mdi:magnify-scan
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Identification filters
    icon: mdi:filter-variant
    color: blue
    description: Keep peptides inside a score or PSM-support band
  grid_sections:
  - name: Yield at a glance
    icon: mdi:counter
    color: blue
    description: From spectra searched to the peptides that passed the FDR filter
  - name: Search and FDR
    icon: mdi:chart-line
    color: blue
    description: Accepted PSMs across FDR thresholds, and the score of the accepted peptides
  - name: Search table
    icon: mdi:table
    color: gray
    description: Comet search yield per raw file
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [Comet](https://uwpr.github.io/Comet/) searches every raw file against the database
      with its decoys; rescoring then separates true matches and the FDR filter keeps the
      confident peptides. The Comet numbers are the search's own yield before rescoring,
      so a raw file that lags there has a spectrum or search problem.
    tag: mq-id-intro
    index: id-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: score
    column_type: float64
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: blue
    section: Identification filters
    group: Peptide support
    tag: mq-id-filter-score
    index: id-score-range
    title: Peptide score
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: psms
    column_type: int64
    display:
      icon_name: mdi:counter
      custom_color: indigo
    section: Identification filters
    group: Peptide support
    tag: mq-id-filter-psms
    index: id-psm-range
    title: PSMs per peptide
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: openms_comet_psms
    use: openms/comet_psms
    aggregation: sum
    column_name: spectra_searched
    column_type: int64
    secondary_layout: attrition
    attrition_cols: [target_psms, psms_5pct_fdr, psms_1pct_fdr]
    display:
      icon_name: mdi:magnify-scan
      icon_color: blue
      caption: searched, matched, then accepted at 5% and 1%
    section: Yield at a glance
    tag: mq-id-card-spectra
    index: id-card-spectra
    title: Spectra searched
    description: MS2 spectra Comet searched, then those with a target match and those accepted at 5% and 1% FDR.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: openms_comet_psms
    use: openms/comet_psms
    aggregation: median
    column_name: identification_rate
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:target
      icon_color: cyan
      caption: median per raw file, with its distribution
      format: percent
    section: Yield at a glance
    tag: mq-id-card-rate
    index: id-card-rate
    title: Identification rate
    description: Share of the searched spectra accepted at 1% FDR before rescoring, per raw file.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_sample_summary
    use: mhcquant/sample_summary
    aggregation: sum
    column_name: psms
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bar
      icon_color: indigo
      caption: per sample, with their spread
    section: Yield at a glance
    tag: mq-id-card-psms
    index: id-card-psms
    title: PSMs
    description: Peptide-spectrum matches that passed the pipeline's FDR filter, after rescoring.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    use: mhcquant/peptides
    aggregation: count
    column_name: peptide
    column_type: object
    secondary_layout: composition
    breakdown_col: modification_state
    display:
      icon_name: mdi:dna
      icon_color: grape
      caption: precursors, by modification
    section: Yield at a glance
    tag: mq-id-card-precursors
    index: id-card-precursors
    title: Accepted precursors
    description: Peptide precursors that passed the FDR filter, one per sample, peptidoform and charge.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: mhcquant
    data_collection_tag: openms_comet_fdr_curve
    use: openms/fdr_profile
    config:
      x_title: Target-decoy q-value threshold
      y_title: Accepted target PSMs
      reference_x: 0.01
      reference_label: 1% FDR
      legend_pos: bottom
    section: Search and FDR
    tag: mq-id-av-fdr-curve
    index: id-fdr-curve
    title: Accepted PSMs against the FDR threshold, per raw file
    description: >-
      How many spectra can the search identify at each confidence level? One curve per raw file: the
      number of target PSMs accepted as the target-decoy q-value threshold on the raw Comet Xcorr is
      relaxed from 0 to 10%.

      How to read: a curve that rises early and keeps climbing is a file with good spectra. One that rises
      late or flattens low has weaker spectra or a search-space problem; open the Comet search yield table
      below for its identification rate and mass error.

      Lines and annotations: the dotted vertical line labelled 1% FDR marks a q-value of 0.01. It is the
      default fdr_threshold of nf-core/mhcquant, the level at which the final peptides are kept; it is a
      fixed reference of this tile and does not read the value the run was given.

      Sources: nf-core/mhcquant 3.2.0 parameters, https://nf-co.re/mhcquant/3.2.0/parameters; Elias and
      Gygi 2007, Nat Methods, doi:10.1038/nmeth1019 for target-decoy FDR.

      Note: the q-values come from target-decoy competition on Xcorr alone, before rescoring, so this is a
      conservative first estimate and the rescored counts are higher.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    use: mhcquant/peptides
    visu_type: histogram
    dict_kwargs:
      x: score
      color: sample
      labels: {score: Peptide score, sample: ''}
    section: Search and FDR
    tag: mq-id-fig-score
    index: id-score-histogram
    title: Score of the accepted peptides
    description: >-
      What do the search scores of the accepted peptides look like? A histogram of the best score of each
      accepted peptide precursor, one colour per sample.

      How to read: samples whose histograms overlap are scored alike. A sample shifted towards weaker
      scores, or with a long tail of borderline hits, was identified with less confidence than its peers.
      Which end is better depends on the score type, named in the score_type column of the Identified
      peptides table.

      Note: every peptide here already passed the FDR filter of the run, so no pass line is drawn and none
      of the bars is a rejected hit.
    layout: {x: 0, y: 6, w: 8, h: 4}
  - component_type: table
    workflow_tag: mhcquant
    data_collection_tag: openms_comet_psms
    use: openms/comet_psms
    row_selection_enabled: true
    row_selection_column: run_id
    section: Search table
    tag: mq-id-table-comet
    index: id-table-comet
    title: Comet search yield per raw file
    description: >-
      How productive was the search of each raw file, before rescoring? One row per raw file: spectra
      searched, target and decoy matches, PSMs at 1% and 5% FDR, the identification rate, the median Xcorr
      of targets and of decoys, and the median precursor mass error.

      How to read: a raw file with few PSMs at 1% FDR next to its peers has an acquisition or search-space
      problem, not a rescoring one. A target Xcorr median clearly above the decoy median is a clean
      separation, and a median mass error far from zero ppm points at calibration.

      Note: the FDR is estimated on the raw Comet Xcorr by target-decoy competition, so the counts are
      lower than the rescored peptides. The 1% and 5% levels are reporting levels of this table, not run
      settings.

      Source: Elias and Gygi 2007, Nat Methods, doi:10.1038/nmeth1019.
    layout: {x: 0, y: 0, w: 8, h: 6}
