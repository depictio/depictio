    index: rep-card-intensity
    title: Peptide intensity
    description: Median log10 intensity of the peptides where they were quantified.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_replicate_pairs
    use: mhcquant/replicate_pairs
    aggregation: count
    column_name: peptide
    column_type: object
    secondary_layout: composition
    breakdown_col: pair
    display:
      icon_name: mdi:vector-link
      icon_color: orange
      caption: peptides in both replicates, by pair
    section: Replicates at a glance
    tag: mq-rep-card-pairs
    index: rep-card-pairs
    title: Paired peptides
    description: Peptides quantified in both replicates of a pair, counted once per pair.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_replicate_pairs
    use: mhcquant/replicate_scatter
    config:
      x_title: log10 intensity, first replicate
      y_title: log10 intensity, second replicate
      reference_line: diagonal
      density_threshold: 5000
      opacity: 0.5
      marker_size: 5
      legend_pos: bottom
    section: Replicate agreement
    tag: mq-rep-av-pairs
    index: rep-pairs-scatter
    title: Peptide intensity, replicate against replicate
    description: >-
      How reproducible is the quantification between two injections of the same sample? Each point is one
      peptide quantified in both replicates of a pair, with its log10 intensity in the first replicate on
      x and in the second on y, coloured by pair.

      How to read: a tight cloud along the diagonal is a reproducible pair. A wide cloud, or one shifted
      off the diagonal, marks a replicate with a loading, spray or alignment problem. Compare with the
      replicate correlation columns of the Immunopeptidome summary table.

      Lines and annotations: the dashed line labelled x = y is the identity diagonal, drawn over the range
      both axes share; a point on it has the same intensity in both replicates. It is a geometric
      reference, not a cut-off, and no correlation threshold is drawn.

      Note: only peptides quantified in both replicates appear, and a very dense cloud is drawn as a
      density view instead of single points.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_replicate_detection
    use: mhcquant/replicate_upset
    config:
      set_columns_pattern: ^rep_
      sort_by: cardinality
      show_values: true
    section: Replicate overlap
    tag: mq-rep-av-upset
    index: rep-upset
    title: Peptides quantified per replicate combination
    description: >-
      How much of a sample is seen in every injection? Each bar counts the distinct peptidoforms
      quantified in exactly the replicate combination marked by the dots under it, pooled over the
      selected samples.

      How to read: bars are sorted by size, so on a well reproduced run the all-replicate combination
      comes first. Tall single-replicate bars are peptides that hang on one injection, so their
      intensities rest on little evidence.

      Note: replicate numbers count within each sample, so replicate 1 of one sample and replicate 1 of
      another are different injections. A peptide absent from a replicate was not quantified there; it may
      still be present below the detection limit.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_replicate_detection
    use: mhcquant/replicate_detection
    row_selection_enabled: true
    row_selection_column: peptide
    section: Replicate table
    tag: mq-rep-table-detection
    index: rep-table-detection
    title: Replicate membership per peptide
    description: >-
      Which replicates saw each peptide? One row per sample and peptidoform, with a 0/1 column for each
      replicate index telling whether the peptide was quantified in that raw file.

      How to read: filter a replicate column to 0 to list the peptides it missed, or sum the columns to
      see who is seen everywhere. It holds the rows behind the bars of the replicate combination plot.
    layout: {x: 0, y: 0, w: 8, h: 6}
