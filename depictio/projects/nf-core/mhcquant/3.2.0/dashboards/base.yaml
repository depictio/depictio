      set_columns_pattern: "^rep_"
      sort_by: cardinality
      show_values: true
      controls_placement: header
    title: Peptides quantified per replicate combination
    description: Replicate index within each sample, pooled over the selected samples. The leftmost bars should be the all-replicate core.
    title_size: h3
    layout: {x: 0, y: 7, w: 8, h: 7}
  - component_type: table
    tag: mq-rep-table-detection
    section: Replicate tables
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_replicate_detection
    use: mhcquant/replicate_detection
    row_selection_enabled: true
    row_selection_column: peptide
    title: Replicate membership per peptide
    description: One 0/1 column per replicate index, per sample and peptidoform.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: interactive
