    title: Picked peptide
    description: >-
      What is the peptide picked on the retention-time plot? A card with its sequence and sample, its
      retention-time evidence, its search evidence and its source protein.

      How to read: weigh the score and PSM support against the gap between observed and predicted
      retention time; a large gap on a weakly supported peptide is a doubtful identification. The protein
      accession links to UniProt.

      Note: the card stays empty until a point is picked on the plot.
    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: advanced_viz
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    use: mhcquant/rt_hydropathy
    config:
      x_title: Hydropathy (GRAVY)
      y_title: Observed retention time (min)
      density_threshold: 8000
      opacity: 0.5
      marker_size: 5
      legend_pos: bottom
      selection_enabled: true
      selection_column: sequence
    section: Hydropathy and charge
    tag: mq-phys-av-rt-gravy
    index: phys-rt-gravy
    title: Retention time against hydropathy
    description: >-
      Does retention time follow hydrophobicity? Each point is one accepted peptide precursor, with the
      Kyte-Doolittle hydropathy of its sequence (GRAVY, the mean over its residues) on x and the observed
      retention time on y, coloured by length.

      How to read: on reversed-phase chromatography hydrophobic peptides elute later, so the cloud should
      rise from left to right. A cloud that tilts differently from its peers, or is flat, points at a
      gradient problem. Click a point to read the peptide.

      Source: Kyte and Doolittle 1982, J Mol Biol, doi:10.1016/0022-2836(82)90515-0.

      Note: no line is drawn, and the hydropathy is computed on the unmodified sequence, so modifications
      are ignored. It is a trend, not a prediction; the prediction is the observed against predicted plot.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    use: mhcquant/mz_retention
    config:
      x_title: Observed retention time (min)
      y_title: Precursor m/z
      density_threshold: 8000
      opacity: 0.5
      marker_size: 5
      legend_pos: bottom
      selection_enabled: true
      selection_column: sequence
    section: Hydropathy and charge
    tag: mq-phys-av-mz-rt
    index: phys-mz-rt
    title: Precursor m/z over the gradient, by charge
    description: >-
      Where do the precursors fall over the gradient? Each point is one accepted peptide precursor, with
      its observed retention time on x and its precursor m/z on y, coloured by charge state.

      How to read: each charge state forms its own band. Crowding at one end of the gradient shows where
      the acquisition saturated, and an empty stretch is a part of the gradient that identified nothing.
      Click a point to read the peptide.
    layout: {x: 4, y: 0, w: 4, h: 6}
  # The fragment-ion annotation is optional (--annotate_ions): its cards stay
  # out of the KPI strip so a run without it keeps four cards there.
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_fragment_ions
    use: mhcquant/fragment_ions
    aggregation: median
    column_name: fragment_error_ppm
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:scale-balance
      icon_color: pink
      caption: median ppm, with its spread
      decimals: 1
    section: Fragment ions
    tag: mq-phys-card-fragment-ppm
    index: phys-card-fragment-ppm
    title: Fragment mass error
    description: Median mass error of the matched fragment ions, per peptide, in ppm.
    layout: {x: 0, y: 0, w: 4, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_fragment_ions
    use: mhcquant/fragment_ions
    aggregation: median
    column_name: fragment_ions
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-histogram
      icon_color: indigo
      caption: median per peptide, with its distribution
      decimals: 0
    section: Fragment ions
    tag: mq-phys-card-fragment-ions
    index: phys-card-fragment-ions
    title: Matched fragment ions
    description: b, y and other ions matched in each peptide's spectrum.
    layout: {x: 4, y: 0, w: 4, h: 2}
  - component_type: table
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_fragment_ions
    use: mhcquant/fragment_ions
    row_selection_enabled: true
    row_selection_column: peptide
    section: Fragment ions
    tag: mq-phys-table-fragments
    index: phys-table-fragments
    title: Matched fragment ions per peptide
    description: >-
      How well is each spectrum explained? One row per sample and peptidoform: the number of matched
      fragment ions (b, y and other series) and their median absolute mass error in ppm.

      How to read: few matched ions, or a large error, mark an identification resting on a handful of
      peaks. Sort by the error to find the spectra worth opening first.

      Note: the table is only filled when the run sets --annotate_ions, the pipeline's ion annotation
      option.

      Source: nf-core/mhcquant 3.2.0 parameters, https://nf-co.re/mhcquant/3.2.0/parameters.
    layout: {x: 0, y: 2, w: 8, h: 6}
# ============================================================================
# Immunopeptidome
