# =========================================================================
# Tab 4 - Reproducibility across raw replicates
# =========================================================================
- title: Reproducibility
  subtitle: How consistently each sample's peptides are quantified across its raw replicates
  tab_order: 4
  tab_icon: mdi:set-merge
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Replicate scope
    icon: mdi:tune
    color: cyan
    description: Pick replicate pairs, or peptides seen in a given number of replicates
  grid_sections:
  - name: Reproducibility at a glance
    icon: mdi:counter
    color: cyan
    description: Replicate correlation and completeness per sample
  - name: Replicate agreement
    icon: mdi:chart-scatter-plot
    color: cyan
    description: Intensity in one replicate against another, and detection overlap
  - name: Replicate tables
    icon: mdi:table
    color: gray
    description: Replicate membership of every peptide
    collapsed: true
  components:
  - component_type: text
    tag: mq-rep-intro
    section: Reproducibility at a glance
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_sample_summary
    title: Do the replicates agree
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Replicate injections of one sample should quantify the same peptides at
      similar intensities. A low correlation or a small shared core points at
      one injection to inspect in the chromatograms.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: mq-rep-card-median-r
    section: Reproducibility at a glance
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_sample_summary
    use: mhcquant/sample_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: replicate_median_r
    column_type: float64
    display: {icon_name: 'mdi:chart-scatter-plot', title_font_size: xl, value_font_size: xl}
    title: Replicate correlation
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: mq-rep-card-min-r
    section: Reproducibility at a glance
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_sample_summary
    use: mhcquant/sample_summary
    aggregation: min
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: replicate_min_r
    column_type: float64
    display: {icon_name: 'mdi:alert-outline', title_font_size: xl, value_font_size: xl}
    title: Weakest replicate pair
    title_size: sm
    title_align: left
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: mq-rep-card-complete
    section: Reproducibility at a glance
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_sample_summary
    use: mhcquant/sample_summary
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: all_replicates_fraction
    column_type: float64
    display: {icon_name: 'mdi:check-decagram', title_font_size: xl, value_font_size: xl}
    title: Share in every replicate
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: mq-rep-card-detected
    section: Reproducibility at a glance
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_replicate_detection
    use: mhcquant/replicate_detection
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: replicates_detected
    column_type: int64
    display: {icon_name: 'mdi:set-merge', title_font_size: xl, value_font_size: xl}
    title: Replicates per peptide
    title_size: sm
    title_align: left
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: mq-rep-av-pairs
    index: mq-rep-av-pairs
    section: Replicate agreement
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_replicate_pairs
    use: mhcquant/replicate_scatter
    config:
      x_title: log10 intensity, first replicate
      y_title: log10 intensity, second replicate
      reference_line: diagonal
      density_threshold: 5000
      opacity: 0.5
      marker_size: 5
      legend_pos: bottom
      controls_placement: header
    title: Peptide intensity, replicate against replicate
    description: One point per peptide quantified in both replicates of a pair. A tight cloud along the diagonal is a reproducible pair.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: advanced_viz
    tag: mq-rep-av-upset
