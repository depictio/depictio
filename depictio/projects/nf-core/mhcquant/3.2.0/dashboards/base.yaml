# =========================================================================
# Tab 5 - Peptides shared between conditions, and their source proteins
# =========================================================================
- title: Peptides and proteins
  subtitle: Which presented peptides are common to every condition, which are private, and which proteins they come from
  tab_order: 5
  tab_icon: mdi:relation-many-to-many
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Peptide scope
    icon: mdi:tune
    color: grape
    description: Narrow by condition sharing or by how many peptides a protein contributes
  grid_sections:
  - name: Peptides at a glance
    icon: mdi:counter
    color: grape
    description: Distinct peptides and source proteins in the current scope
  - name: Sharing between conditions
    icon: mdi:set-merge
    color: grape
    description: Peptides common to several conditions or private to one
  - name: Source proteins
    icon: mdi:chart-scatter-plot
    color: grape
    description: Proteins that feed the most peptides into presentation
  - name: Peptide detail
    icon: mdi:file-document-outline
    color: grape
    description: Pick a peptide in the table to read its record
  - name: Protein detail
    icon: mdi:file-document-outline
    color: grape
    description: Pick a protein in the table to read its record
  components:
  - component_type: text
    tag: mq-pep-intro
    section: Peptides at a glance
    workflow_tag: mhcquant
    data_collection_tag: peptide_condition_sharing
    title: Shared and private peptides
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      Peptides private to one condition are the candidates for
      condition-specific presentation; check their support in the peptide
      record before reading them as biology.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: mq-pep-card-distinct
    section: Peptides at a glance
    workflow_tag: mhcquant
    data_collection_tag: peptide_condition_sharing
    aggregation: nunique
    column_name: sequence
    column_type: object
    secondary_layout: composition
    breakdown_col: sharing
    display: {icon_name: 'mdi:dna', title_font_size: xl, value_font_size: xl}
    title: Distinct peptides
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: mq-pep-card-proteins
    section: Peptides at a glance
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_source_proteins
    use: mhcquant/source_proteins
    aggregation: nunique
    column_name: protein
    column_type: object
    secondary_layout: composition
    breakdown_col: sample
    display: {icon_name: 'mdi:shape-outline', title_font_size: xl, value_font_size: xl}
    title: Source proteins
    title_size: sm
    title_align: left
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: mq-pep-card-per-protein
    section: Peptides at a glance
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_source_proteins
    use: mhcquant/source_proteins
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: peptides
    column_type: int64
    display: {icon_name: 'mdi:chart-bar', title_font_size: xl, value_font_size: xl}
    title: Peptides per source protein
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: mq-pep-card-multimapping
    section: Peptides at a glance
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    use: mhcquant/peptides
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: n_proteins
    column_type: int64
    display: {icon_name: 'mdi:relation-many-to-many', title_font_size: xl, value_font_size: xl}
    title: Source proteins per peptide
    title_size: sm
    title_align: left
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: mq-pep-av-sharing-upset
    index: mq-pep-av-sharing-upset
    section: Sharing between conditions
    workflow_tag: mhcquant
    data_collection_tag: peptide_condition_sharing
    viz_kind: upset_plot
    config:
      viz_kind: upset_plot
      # One set per samplesheet condition. The two count columns can be all
      # ones on a small run, which would make them look like sets.
      set_columns_pattern: "^(?!samples_detected$|conditions_detected$)"
      sort_by: cardinality
      show_values: true
      controls_placement: header
    title: Peptides per condition combination
    description: Distinct sequences by the samplesheet conditions they were identified in. The first bar is the core every condition presents.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: advanced_viz
    tag: mq-pep-av-protein-scatter
    index: mq-pep-av-protein-scatter
    section: Source proteins
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_source_proteins
    use: mhcquant/protein_coverage
    config:
      x_title: Distinct peptides from the protein
      y_title: log10 summed peptide intensity
      log_x: true
      top_n_labels: 10
      density_threshold: 8000
      legend_pos: bottom
      selection_enabled: true
      selection_column: protein
      controls_placement: header
    title: Peptides per source protein against their intensity
    description: One point per protein and sample, sized by PSMs. Proteins far to the right are tiled by many presented peptides.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 7}
  - component_type: table
    tag: mq-pep-table-peptides
    section: Peptide detail
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    use: mhcquant/peptides
    row_selection_enabled: true
    row_selection_column: sequence
    title: Identified peptides
    description: Every accepted precursor with score, support, retention time, charge and source proteins. Select a row to open its record.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 5, h: 7}
  - component_type: advanced_viz
    tag: mq-pep-av-peptide-record
    index: mq-pep-av-peptide-record
    section: Peptide detail
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: mq-pep-table-peptides
      id_col: sequence
      title_col: peptide
      selection_source: table_selection
      sections:
        Peptide: [sequence, peptide, sample, length_class, modification_state, charge_state]
        Evidence: [score, score_type, psms, spectrum_correlation, fragment_ions, fragment_error_ppm]
        Chromatography: [rt_min, predicted_rt_min, rt_error_min, mz, neutral_mass, gravy]
        Source: [protein, protein_entry, proteins, n_proteins, aa_before, aa_after, start]
        Quantification: [log10_intensity, replicates_quantified, replicates_total]
      link_templates:
        protein: "https://www.uniprot.org/uniprotkb/{value}"
    title: Peptide record
    description: The selected peptide, one card per sample and precursor it was identified as.
    title_size: h3
    layout: {x: 5, y: 0, w: 3, h: 7}
  - component_type: table
    tag: mq-pep-table-proteins
    section: Protein detail
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_source_proteins
    use: mhcquant/source_proteins
    row_selection_enabled: true
    row_selection_column: protein
    title: Source proteins
    description: Peptides, shared peptides, PSMs and summed intensity per protein and sample. Select a row to open its record.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 5, h: 7}
  - component_type: advanced_viz
    tag: mq-pep-av-protein-record
    index: mq-pep-av-protein-record
    section: Protein detail
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_source_proteins
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: mq-pep-table-proteins
      id_col: protein
      title_col: protein_entry
      selection_source: any
      sections:
        Protein: [protein, protein_entry, sample]
        Presentation: [peptides, shared_peptides, psms, best_score, log10_intensity]
        Peptides: [peptide_list]
      link_templates:
        protein: "https://www.uniprot.org/uniprotkb/{value}"
    title: Protein record
    description: The selected protein, one card per sample it was seen in.
    title_size: h3
    layout: {x: 5, y: 0, w: 3, h: 7}
  - component_type: interactive
    tag: mq-pep-filter-sharing
    index: mq-pep-sharing-filter
    section: Peptide scope
    group: Peptides
    workflow_tag: mhcquant
    data_collection_tag: peptide_condition_sharing
    interactive_component_type: MultiSelect
    column_name: sharing
    column_type: object
    display: {title_size: md, custom_color: '#AB47BC', icon_name: 'mdi:set-merge'}
    placement: left
