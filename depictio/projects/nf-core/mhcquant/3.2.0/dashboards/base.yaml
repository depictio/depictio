    section: Replicate filters
    group: Replicates
    tag: mq-rep-filter-detected
    index: rep-detected-range
    title: Replicates detected
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_replicate_detection
    use: mhcquant/replicate_detection
    aggregation: median
    column_name: replicates_detected
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:set-merge
      icon_color: cyan
      caption: median, with its distribution
      decimals: 0
    section: Replicates at a glance
    tag: mq-rep-card-detected
    index: rep-card-detected
    title: Replicates per peptide
