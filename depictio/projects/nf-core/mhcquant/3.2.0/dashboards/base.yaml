    index: rep-card-detections
    title: Peptide detections
    description: Peptides quantified in a replicate, counted once per replicate they were seen in.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_replicate_intensity
    use: mhcquant/replicate_intensity
    aggregation: median
    column_name: log10_intensity
    column_type: float64
    filter_expr: col('detected') == 1
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
