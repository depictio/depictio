- title: MHC signature
  subtitle: Which MHC class do the peptide lengths and anchor motifs point to?
  tab_group: Immunopeptidome
  tab_order: 5
  tab_icon: mdi:ruler
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Signature filters
    icon: mdi:filter-variant
    color: violet
    description: Restrict the profile, the composition and the motifs to chosen lengths
  grid_sections:
  - name: Signature at a glance
    icon: mdi:counter
    color: violet
    description: The length mode and the anchor residues of the peptides
  - name: Length signature
    icon: mdi:ruler
    color: violet
    description: How peptide lengths, charges and modifications spread in each sample
  - name: Anchor motifs
    icon: mdi:dna
    color: violet
    description: Amino-acid frequency at each position, per sample and length
  - name: Length table
    icon: mdi:table
    color: gray
    description: Length counts behind the profile
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      mhcquant's [peptide tables](https://nf-co.re/mhcquant/3.2.0/docs/output) give each
      sample's length profile and anchor motifs. Class I ligands peak sharply at 9 residues
      within 8 to 12, class II ligands spread over 13 to 25. A flat or shifted profile points
      at co-purified peptides or a length filter set too wide; pick a length on the left to
      read one motif at a time.
    tag: mq-sig-intro
    index: sig-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    interactive_component_type: MultiSelect
    column_name: length_class
    column_type: object
    display:
      icon_name: mdi:ruler
      custom_color: pink
    section: Signature filters
    group: Peptides
    tag: mq-sig-filter-length
    index: sig-length-filter
    title: Peptide length
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    interactive_component_type: MultiSelect
    column_name: modification_state
    column_type: object
    display:
      icon_name: mdi:tag-outline
      custom_color: orange
    section: Signature filters
    group: Peptides
    tag: mq-sig-filter-modification
    index: sig-modification-filter
    title: Modification
    layout: {x: 0, y: 3, w: 1, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_sample_summary
    use: mhcquant/sample_summary
    aggregation: median
    column_name: ninemer_fraction
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:star-outline
      icon_color: violet
      caption: median per sample, with its spread
      format: percent
    section: Signature at a glance
    tag: mq-sig-card-ninemer
    index: sig-card-ninemer
    title: 9-mer share
    description: Share of each sample's distinct sequences that are 9 residues long, the class I mode.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    use: mhcquant/peptides
    aggregation: median
    column_name: length
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: blue
      caption: residues per peptide, with their spread
      decimals: 0
    section: Signature at a glance
    tag: mq-sig-card-median-length
    index: sig-card-median-length
    title: Median length
    description: Median length of the identified peptides, in residues.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    use: mhcquant/peptides
    aggregation: nunique
    column_name: sequence
    column_type: object
    secondary_layout: top_n
    breakdown_col: anchor_p2
    top_n_count: 5
    display:
      icon_name: mdi:target-arrow
      icon_color: pink
      caption: sequences by their P2 residue
    section: Signature at a glance
    tag: mq-sig-card-p2
    index: sig-card-p2
    title: P2 anchor
    description: Distinct sequences ranked by the residue at position 2, a class I anchor.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    use: mhcquant/peptides
    aggregation: nunique
    column_name: sequence
    column_type: object
    secondary_layout: top_n
    breakdown_col: anchor_c_term
    top_n_count: 5
    display:
      icon_name: mdi:ray-end
      icon_color: teal
      caption: sequences by their C-terminal residue
    section: Signature at a glance
    tag: mq-sig-card-cterm
    index: sig-card-cterm
    title: C-terminal anchor
    description: Distinct sequences ranked by their last residue, the other class I anchor.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_length_distribution
    use: mhcquant/length_profile
    config:
      x_title: Peptide length (residues)
      y_title: Share of the sample's peptides
      shaded_bands:
      - [8, 12, Class I range]
      - [13, 25, Class II range]
      legend_pos: bottom
    section: Length signature
    tag: mq-sig-av-length-profile
    index: sig-length-profile
    title: Peptide length distribution per sample
    description: >-
      Which MHC class do the peptide lengths point to? One line per sample: the share of its distinct
      sequences at each length.

      How to read: a sharp peak at 9 residues inside the class I band is the class I signature. A broad
      shoulder of longer peptides, inside the class II band, marks class II or contamination by peptides
      that were not presented. Read the anchor motifs below to see which alleles the samples present.

      Lines and annotations: the two shaded bands mark the class I range, 8 to 12 residues, and the class
      II range, 13 to 25 residues, each labelled above the plot. They are published length ranges of
      eluted ligands, not cut-offs, and nothing is filtered by them.

      Sources: class I, Gfeller et al. 2018, J Immunol 201:3705, doi:10.4049/jimmunol.1800914; class II,
      Chicz et al. 1992, Nature 358:764, doi:10.1038/358764a0.

      Note: nf-core/mhcquant keeps peptides of 8 to 12 residues by default (peptide_min_length 8,
      peptide_max_length 12), so a run on defaults holds no class II length peptides; raise the maximum to
      see them. Ranges vary between alleles (nf-core/mhcquant 3.2.0 parameters,
      https://nf-co.re/mhcquant/3.2.0/parameters).
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptide_composition
    use: mhcquant/composition_bars
    config:
      default_rank: Peptide length
      normalise_to_one: true
      sample_sort: input
      sort_by: abundance
      top_n: 8
    section: Length signature
    tag: mq-sig-av-composition
    index: sig-composition
    title: Peptide composition per sample
    description: >-
      How is each sample's peptide set composed? One stacked bar per sample, normalised to 100%, splitting
      its distinct peptidoforms by peptide length, by precursor charge or by modification state; the
      controls switch between the three.

      How to read: compare the splits between samples. A sample with a different mix of lengths or charges
      from its peers was loaded or eluted differently, and a high modified share can be biology or sample
      handling.

      Lines and annotations: the grey segment labelled Other lumps the categories beyond the eight largest
      of the view. No threshold is drawn.
    layout: {x: 0, y: 6, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_motif_matrix
    use: mhcquant/motif_heatmap
    config:
      index_column: row_id
      # The residues only: the matrix also carries `peptides`, a count in the
      # thousands that would push every frequency to the bottom of the scale.
      value_columns: [A, C, D, E, F, G, H, I, K, L, M, N, P, Q, R, S, T, V, W, Y]
      row_annotation_cols: [length_class]
      cluster_rows: false
      cluster_cols: true
      cluster_method: ward
      colorscale: Blues
    section: Anchor motifs
    tag: mq-sig-av-motif
    index: sig-motif
    title: Amino-acid frequency by peptide position
    description: >-
      Which residues anchor the presented peptides? Each row is one sample and peptide length at one
      position (P1, P2 and so on), each column an amino acid, and the colour is how often that residue
      sits at that position among the distinct sequences.

      How to read: anchor positions stand out as columns dominated by a few residues, while middle
      positions stay close to background; for class I 9-mers these are position 2 and the C-terminus. A
      donor with several alleles shows a mixture of motifs, so compare with the length profile above.

      Lines and annotations: the Blues colour scale runs from low to high frequency, the columns are
      clustered (Ward linkage) so residues with similar profiles sit together, and the side bar marks each
      row's length class. No cut-off is drawn.

      Note: lengths supported by fewer than 20 distinct sequences in a sample are left out, a
      data-sufficiency floor fixed in the recipe, because a position frequency over a handful of peptides
      is not a motif.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_length_distribution
    use: mhcquant/length_distribution
    section: Length table
    tag: mq-sig-table-length
    index: sig-table-length
    title: Peptides per length and sample
    description: >-
      How many peptides sit at each length? One row per sample and length: the distinct sequences as a
      count and as the share of the sample.

      How to read: look for the length with the largest share in each sample; a class I sample has a clear
      mode at 9 residues. Filter on length class to compare one length across samples.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Peptides and proteins
  subtitle: Which peptides do conditions share, and which proteins do they come from?
  tab_group: Immunopeptidome
  tab_order: 6
  tab_icon: mdi:relation-many-to-many
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Peptide filters
    icon: mdi:filter-variant
    color: grape
    description: Narrow by condition sharing or by how many peptides a protein gives
  grid_sections:
  - name: Peptides at a glance
    icon: mdi:counter
    color: grape
    description: Distinct peptides, their sharing and the proteins they come from
  - name: Sharing between conditions
    icon: mdi:set-merge
    color: grape
    description: Peptides common to several conditions or private to one
  - name: Source proteins
    icon: mdi:chart-scatter-plot
    color: grape
    description: Proteins that give the most peptides to presentation; click one to select it
  - name: Peptide detail
    icon: mdi:file-document-outline
    color: gray
    description: Pick a peptide in the table to read its record
    collapsed: true
  - name: Protein detail
    icon: mdi:file-document-outline
    color: gray
    description: Pick a protein in the table to read its record
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      Every distinct sequence by the conditions of the samplesheet it was identified in,
      and every source protein ([UniProt](https://www.uniprot.org) accession) by the
      peptides it gives. Peptides private to one condition
      are the candidates for condition-specific presentation; check their support in the
      peptide record before reading them as biology.
    tag: mq-pep-intro
    index: pep-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: mhcquant
    data_collection_tag: peptide_condition_sharing
    interactive_component_type: MultiSelect
    column_name: sharing
    column_type: object
    display:
      icon_name: mdi:set-merge
      custom_color: grape
    section: Peptide filters
    group: Peptides
    tag: mq-pep-filter-sharing
    index: pep-sharing-filter
    title: Condition sharing
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_source_proteins
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: peptides
    column_type: int64
    display:
      icon_name: mdi:counter
      custom_color: indigo
    section: Peptide filters
    group: Peptides
    tag: mq-pep-filter-protein-peptides
    index: pep-protein-peptides-range
    title: Peptides per protein
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: peptide_condition_sharing
    aggregation: count
    column_name: sequence
    column_type: object
    secondary_layout: composition
    breakdown_col: sharing
    display:
      icon_name: mdi:dna
      icon_color: grape
      caption: sequences, by condition sharing
    section: Peptides at a glance
    tag: mq-pep-card-distinct
    index: pep-card-distinct
    title: Distinct peptides
    description: Distinct sequences, split by whether every condition, several or only one presents them.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_source_proteins
    use: mhcquant/source_proteins
    aggregation: median
    column_name: peptides
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-bar
      icon_color: indigo
      caption: median per protein, with its distribution
      decimals: 0
    section: Peptides at a glance
    tag: mq-pep-card-per-protein
    index: pep-card-per-protein
    title: Peptides per protein
    description: Distinct peptides each source protein gives, per protein and sample.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_source_proteins
    use: mhcquant/source_proteins
    aggregation: median
    column_name: log10_intensity
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: orange
      caption: median log10, with its spread
      decimals: 1
    section: Peptides at a glance
    tag: mq-pep-card-intensity
    index: pep-card-intensity
    title: Protein intensity
    description: Summed log10 intensity of each protein's peptides, per protein and sample.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    use: mhcquant/peptides
    aggregation: median
    column_name: n_proteins
    column_type: int64
    secondary_layout: threshold
    threshold_value: 1
    threshold_direction: max
    display:
      icon_name: mdi:relation-many-to-many
      icon_color: cyan
      caption: median per precursor, one protein passes
      decimals: 0
    section: Peptides at a glance
    tag: mq-pep-card-multimapping
    index: pep-card-multimapping
    title: Proteins per peptide
    description: Source proteins a peptide sequence maps to; above 1, its origin is ambiguous.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: mhcquant
    data_collection_tag: peptide_condition_sharing
    viz_kind: upset_plot
    config:
      viz_kind: upset_plot
      # One set per samplesheet condition. The two count columns can be all
      # ones on a small run, which would make them look like sets.
      set_columns_pattern: ^(?!samples_detected$|conditions_detected$)
      sort_by: cardinality
      show_values: true
    section: Sharing between conditions
    tag: mq-pep-av-sharing-upset
    index: pep-sharing-upset
    title: Peptides per condition combination
    description: >-
      Which peptides do the conditions share? Each bar counts the distinct sequences identified in exactly
      the combination of conditions marked by the dots under it, with one set per samplesheet condition.

      How to read: when the conditions resemble each other the first bar is the shared core. Tall
      single-condition bars are peptides private to that condition, which is the result of interest when
      the conditions differ by design.

      Note: a peptide missing from a condition was not identified there; it may still be present below the
      identification threshold.
    layout: {x: 0, y: 0, w: 8, h: 5}
  # Labels name the five proteins giving the most peptides, by their entry
  # name, so the Overview's highlight stays readable.
  - component_type: advanced_viz
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_source_proteins
    use: mhcquant/protein_coverage
    config:
      x_title: Distinct peptides from the protein
      y_title: log10 summed peptide intensity
      log_x: true
      top_n_labels: 3
      density_threshold: 8000
      legend_pos: bottom
      selection_enabled: true
      selection_column: protein
    section: Source proteins
    tag: mq-pep-av-protein-scatter
    index: pep-protein-scatter
    title: Peptides per source protein against their intensity
    description: >-
      Which proteins feed the presented peptides most? Each point is one source protein in one sample,
      with the number of distinct peptides from it on x (log scale) and the log10 of their summed
      intensity on y, sized by PSMs and coloured by sample.

      How to read: proteins far to the right are tiled by many peptides. Points high and to the right are
      both well sampled and abundant; a protein with a single peptide is sampled once, which may be
      chance. Click a point to select the protein and open its record.

      Lines and annotations: the three points with the most PSMs carry a text label, the protein's entry
      name. No reference line is drawn, and labels are dropped when a very dense cloud switches to a
      density view.

      Note: a peptide that maps to several proteins is credited to each of them, so related proteins can
      look better sampled than they are.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    use: mhcquant/peptides
    row_selection_enabled: true
    row_selection_column: sequence
    section: Peptide detail
    tag: mq-pep-table-peptides
    index: pep-table-peptides
    title: Identified peptides
    description: >-
      Which peptides were identified? One row per sample and precursor (peptidoform and charge) that
      passed the FDR filter, with its score, PSM support, retention time, charge and source proteins.

      How to read: sort by score or PSMs for the best supported peptides, or filter on length class to
      isolate one length. Select a row to open its record next to the table.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: mq-pep-table-peptides
      id_col: sequence
      title_col: peptide
      selection_source: table_selection
      sections:
        Peptide: [sequence, peptide, sample, length_class, modification_state, charge_state]
        Evidence: [score, score_type, psms, spectrum_correlation, fragment_ions, fragment_error_ppm]
        Chromatography: [rt_min, predicted_rt_min, rt_error_min, mz, neutral_mass, gravy]
        Source: [protein, protein_entry, proteins, n_proteins, aa_before, aa_after, start]
        Quantification: [log10_intensity, replicates_quantified, replicates_total]
      link_templates:
        protein: https://www.uniprot.org/uniprotkb/{value}
    section: Peptide detail
    tag: mq-pep-av-peptide-record
    index: pep-peptide-record
    title: Peptide record
    description: >-
      What is known about the selected peptide? One card per sample and precursor it was identified as,
      with its sequence, evidence, chromatography, source protein and quantification.

      How to read: weigh the evidence (score, PSMs, spectrum correlation, fragment error) against the
      retention-time gap. The replicates quantified, out of the replicates the sample has, say how
      reproducible its intensity is. The protein accession links to UniProt.

      Note: the fragment-ion fields are filled only when the run sets --annotate_ions, and the
      quantification fields only with --quantify.
    layout: {x: 5, y: 0, w: 3, h: 6}
