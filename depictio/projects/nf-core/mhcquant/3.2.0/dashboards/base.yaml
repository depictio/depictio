# ============================================================================
# Search
# ============================================================================
- title: Identification
  subtitle: How many spectra became peptides, and at what FDR?
  tab_group: Search
  tab_order: 3
  tab_icon: mdi:magnify-scan
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Identification filters
    icon: mdi:filter-variant
    color: blue
    description: Keep peptides inside a score or PSM-support band
  grid_sections:
  - name: Yield at a glance
    icon: mdi:counter
    color: blue
    description: From spectra searched to the peptides that passed the FDR filter
  - name: Search and FDR
    icon: mdi:chart-line
    color: blue
    description: Accepted PSMs across FDR thresholds, and the score of the accepted peptides
  - name: Search table
    icon: mdi:table
    color: gray
    description: Comet search yield per raw file
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [Comet](https://uwpr.github.io/Comet/) searches every raw file against the database
      with its decoys; rescoring then separates true matches and the FDR filter keeps the
      confident peptides. The Comet numbers are the search's own yield before rescoring,
      so a raw file that lags there has a spectrum or search problem.
    tag: mq-id-intro
    index: id-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: score
    column_type: float64
    display:
      icon_name: mdi:chart-bell-curve
      custom_color: blue
    section: Identification filters
    group: Peptide support
    tag: mq-id-filter-score
    index: id-score-range
    title: Peptide score
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: psms
    column_type: int64
    display:
      icon_name: mdi:counter
      custom_color: indigo
    section: Identification filters
    group: Peptide support
    tag: mq-id-filter-psms
    index: id-psm-range
    title: PSMs per peptide
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: openms_comet_psms
    use: openms/comet_psms
    aggregation: sum
    column_name: spectra_searched
    column_type: int64
    secondary_layout: attrition
    attrition_cols: [target_psms, psms_5pct_fdr, psms_1pct_fdr]
    display:
      icon_name: mdi:magnify-scan
      icon_color: blue
      caption: searched, matched, then accepted at 5% and 1%
    section: Yield at a glance
    tag: mq-id-card-spectra
    index: id-card-spectra
    title: Spectra searched
    description: MS2 spectra Comet searched, then those with a target match and those accepted at 5% and 1% FDR.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: openms_comet_psms
    use: openms/comet_psms
    aggregation: median
    column_name: identification_rate
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:target
      icon_color: cyan
      caption: median per raw file, with its distribution
      decimals: 2
    section: Yield at a glance
    tag: mq-id-card-rate
    index: id-card-rate
    title: Identification rate
    description: Share of the searched spectra accepted at 1% FDR before rescoring, per raw file.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_sample_summary
    use: mhcquant/sample_summary
    aggregation: sum
    column_name: psms
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bar
      icon_color: indigo
      caption: per sample, with their spread
    section: Yield at a glance
    tag: mq-id-card-psms
    index: id-card-psms
    title: PSMs
    description: Peptide-spectrum matches that passed the pipeline's FDR filter, after rescoring.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    use: mhcquant/peptides
    aggregation: count
    column_name: peptide
    column_type: object
    secondary_layout: composition
    breakdown_col: modification_state
    display:
      icon_name: mdi:dna
      icon_color: grape
      caption: precursors, by modification
    section: Yield at a glance
    tag: mq-id-card-precursors
    index: id-card-precursors
    title: Accepted precursors
    description: Peptide precursors that passed the FDR filter, one per sample, peptidoform and charge.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: mhcquant
    data_collection_tag: openms_comet_fdr_curve
    use: openms/fdr_profile
    config:
      x_title: Target-decoy q-value threshold
      y_title: Accepted target PSMs
      reference_x: 0.01
      reference_label: 1% FDR
      legend_pos: bottom
    section: Search and FDR
    tag: mq-id-av-fdr-curve
    index: id-fdr-curve
    title: Accepted PSMs against the FDR threshold, per raw file
    description: Comet target-decoy competition on Xcorr before rescoring. A curve that rises late or flattens low marks a raw file with weaker spectra.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    use: mhcquant/peptides
    visu_type: histogram
    dict_kwargs:
      x: score
      color: sample
      labels: {score: Peptide score, sample: ''}
    section: Search and FDR
    tag: mq-id-fig-score
    index: id-score-histogram
    title: Score of the accepted peptides
    description: Best search score per accepted peptide precursor, by sample.
    layout: {x: 0, y: 6, w: 8, h: 4}
  - component_type: table
    workflow_tag: mhcquant
    data_collection_tag: openms_comet_psms
    use: openms/comet_psms
    row_selection_enabled: true
    row_selection_column: run_id
    section: Search table
    tag: mq-id-table-comet
    index: id-table-comet
    title: Comet search yield per raw file
    description: Spectra searched, target and decoy matches, PSMs at 1% and 5% FDR, score and mass-error medians.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Physico-chemical checks
  subtitle: Do the identified peptides elute and ionise as peptides should?
  tab_group: Search
  tab_order: 4
  tab_icon: mdi:waves
  tab_icon_color: lime
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Precursor filters
    icon: mdi:filter-variant
    color: lime
    description: Narrow by precursor charge or retention-time window
  grid_sections:
  - name: Accuracy at a glance
    icon: mdi:counter
    color: lime
    description: Retention-time and mass accuracy, spectrum agreement and charge
  - name: Chromatography
    icon: mdi:chart-scatter-plot
    color: lime
    description: Observed against predicted retention time; pick a point to read the peptide
  - name: Hydropathy and charge
    icon: mdi:chart-scatter-plot
    color: lime
    description: Retention time against hydropathy, and precursor m/z over the gradient
  - name: Fragment ions
    icon: mdi:file-document-outline
    color: gray
    description: Matched fragment ions and their mass error, per peptide
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      True identifications elute where [DeepLC](https://github.com/compomics/DeepLC)
      predicts, follow hydrophobicity and sit within the instrument's mass accuracy.
      Outliers on these plots are the identifications to question first: pick a point on
      the retention-time plot to read its evidence beside it.
    tag: mq-phys-intro
    index: phys-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    interactive_component_type: MultiSelect
    column_name: charge_state
    column_type: object
    display:
      icon_name: mdi:flash
      custom_color: lime
    section: Precursor filters
    group: Precursors
    tag: mq-phys-filter-charge
    index: phys-charge-filter
    title: Precursor charge
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: rt_min
    column_type: float64
    display:
      icon_name: mdi:clock-outline
      custom_color: yellow
    section: Precursor filters
    group: Precursors
    tag: mq-phys-filter-rt
    index: phys-rt-range
    title: Retention time (min)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_sample_summary
    use: mhcquant/sample_summary
    aggregation: median
    column_name: median_abs_rt_error_min
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:clock-outline
      icon_color: lime
      caption: median minutes per sample, with its spread
      decimals: 2
    section: Accuracy at a glance
    tag: mq-phys-card-rt-error
    index: phys-card-rt-error
    title: Retention-time error
    description: Median absolute gap between observed and DeepLC-predicted retention time, per sample.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: openms_comet_psms
    use: openms/comet_psms
    aggregation: median
    column_name: median_mass_error_ppm
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:scale-balance
      icon_color: orange
      caption: median ppm per raw file, distribution
      decimals: 1
    section: Accuracy at a glance
    tag: mq-phys-card-precursor-ppm
    index: phys-card-precursor-ppm
    title: Precursor mass error
    description: Median precursor mass error of the Comet matches, in ppm, per raw file.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    use: mhcquant/peptides
    aggregation: median
    column_name: spectrum_correlation
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: teal
      caption: median, with its spread
      decimals: 2
    section: Accuracy at a glance
    tag: mq-phys-card-spectrum-r
    index: phys-card-spectrum-r
    title: Spectrum correlation
    description: Median correlation between each peptide's spectrum and the one MS2PIP predicts for it.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    use: mhcquant/peptides
    aggregation: count
    column_name: peptide
    column_type: object
    secondary_layout: donut
    breakdown_col: charge_state
    display:
      icon_name: mdi:flash
      icon_color: grape
      caption: precursors, by charge
    section: Accuracy at a glance
    tag: mq-phys-card-charge
    index: phys-card-charge
    title: Precursors
    description: Accepted peptide precursors, split by their charge state.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    use: mhcquant/rt_observed_predicted
    config:
      x_title: Predicted retention time (min)
      y_title: Observed retention time (min)
      reference_line: diagonal
      density_threshold: 8000
      opacity: 0.5
      marker_size: 5
      legend_pos: bottom
      selection_enabled: true
      selection_column: sequence
    section: Chromatography
    tag: mq-phys-av-rt-predicted
    index: phys-rt-predicted
    title: Observed against predicted retention time
    description: DeepLC prediction on the x axis. Points far off the diagonal are identifications the chromatography does not support.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: mq-phys-av-rt-predicted
      id_col: sequence
      title_col: peptide
      selection_source: scatter_selection
      sections:
        Peptide: [sequence, peptide, sample, length_class, charge_state]
        Chromatography: [rt_min, predicted_rt_min, rt_error_min, gravy]
        Evidence: [score, score_type, psms, spectrum_correlation, fragment_error_ppm]
        Source: [protein, protein_entry, n_proteins]
      link_templates:
        protein: https://www.uniprot.org/uniprotkb/{value}
    section: Chromatography
    tag: mq-phys-av-rt-record
    index: phys-rt-record
    title: Picked peptide
    description: The peptide picked on the retention-time plot, with its evidence and source.
    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: advanced_viz
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    use: mhcquant/rt_hydropathy
    config:
      x_title: Hydropathy (GRAVY)
      y_title: Observed retention time (min)
      density_threshold: 8000
      opacity: 0.5
      marker_size: 5
      legend_pos: bottom
      selection_enabled: true
      selection_column: sequence
    section: Hydropathy and charge
    tag: mq-phys-av-rt-gravy
    index: phys-rt-gravy
    title: Retention time against hydropathy
    description: Kyte-Doolittle hydropathy of the sequence; hydrophobic peptides should elute later.
    layout: {x: 0, y: 0, w: 4, h: 6}
  - component_type: advanced_viz
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    use: mhcquant/mz_retention
    config:
      x_title: Observed retention time (min)
      y_title: Precursor m/z
      density_threshold: 8000
      opacity: 0.5
      marker_size: 5
      legend_pos: bottom
      selection_enabled: true
      selection_column: sequence
    section: Hydropathy and charge
    tag: mq-phys-av-mz-rt
    index: phys-mz-rt
    title: Precursor m/z over the gradient, by charge
    description: Each charge state forms its own band. Crowding at one end of the gradient shows where the acquisition saturated.
    layout: {x: 4, y: 0, w: 4, h: 6}
  # The fragment-ion annotation is optional (--annotate_ions): its cards stay
  # out of the KPI strip so a run without it keeps four cards there.
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_fragment_ions
    use: mhcquant/fragment_ions
    aggregation: median
    column_name: fragment_error_ppm
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:scale-balance
      icon_color: pink
      caption: median ppm, with its spread
      decimals: 1
    section: Fragment ions
    tag: mq-phys-card-fragment-ppm
    index: phys-card-fragment-ppm
    title: Fragment mass error
    description: Median mass error of the matched fragment ions, per peptide, in ppm.
    layout: {x: 0, y: 0, w: 4, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_fragment_ions
    use: mhcquant/fragment_ions
    aggregation: median
    column_name: fragment_ions
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-histogram
      icon_color: indigo
      caption: median per peptide, with its distribution
      decimals: 0
    section: Fragment ions
    tag: mq-phys-card-fragment-ions
    index: phys-card-fragment-ions
    title: Matched fragment ions
    description: b, y and other ions matched in each peptide's spectrum.
    layout: {x: 4, y: 0, w: 4, h: 2}
  - component_type: table
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_fragment_ions
    use: mhcquant/fragment_ions
    row_selection_enabled: true
    row_selection_column: peptide
    section: Fragment ions
    tag: mq-phys-table-fragments
    index: phys-table-fragments
    title: Matched fragment ions per peptide
    description: b, y and other matched ions and the median fragment mass error, per sample and peptidoform.
    layout: {x: 0, y: 2, w: 8, h: 6}
# ============================================================================
# Immunopeptidome
# ============================================================================
- title: MHC signature
  subtitle: Which MHC class do the peptide lengths and anchor motifs point to?
  tab_group: Immunopeptidome
  tab_order: 5
  tab_icon: mdi:ruler
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Signature filters
    icon: mdi:filter-variant
    color: violet
    description: Restrict the profile, the composition and the motifs to chosen lengths
  grid_sections:
  - name: Signature at a glance
    icon: mdi:counter
    color: violet
    description: The length mode and the anchor residues of the peptides
  - name: Length signature
    icon: mdi:ruler
    color: violet
    description: How peptide lengths, charges and modifications spread in each sample
  - name: Anchor motifs
    icon: mdi:dna
    color: violet
    description: Amino-acid frequency at each position, per sample and length
  - name: Length table
    icon: mdi:table
    color: gray
    description: Length counts behind the profile
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      mhcquant's [peptide tables](https://nf-co.re/mhcquant/3.2.0/docs/output) give each
      sample's length profile and anchor motifs. Class I ligands peak sharply at 9 residues
      within 8 to 12, class II ligands spread over 13 to 25. A flat or shifted profile points
      at co-purified peptides or a length filter set too wide; pick a length on the left to
      read one motif at a time.
    tag: mq-sig-intro
    index: sig-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    interactive_component_type: MultiSelect
    column_name: length_class
    column_type: object
    display:
      icon_name: mdi:ruler
      custom_color: pink
    section: Signature filters
    group: Peptides
    tag: mq-sig-filter-length
    index: sig-length-filter
    title: Peptide length
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    interactive_component_type: MultiSelect
    column_name: modification_state
    column_type: object
    display:
      icon_name: mdi:tag-outline
      custom_color: orange
    section: Signature filters
    group: Peptides
    tag: mq-sig-filter-modification
    index: sig-modification-filter
    title: Modification
    layout: {x: 0, y: 3, w: 1, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_sample_summary
    use: mhcquant/sample_summary
    aggregation: median
    column_name: ninemer_fraction
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:star-outline
      icon_color: violet
      caption: median per sample, with its spread
      decimals: 2
    section: Signature at a glance
    tag: mq-sig-card-ninemer
    index: sig-card-ninemer
    title: 9-mer share
    description: Share of each sample's distinct sequences that are 9 residues long, the class I mode.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    use: mhcquant/peptides
    aggregation: median
    column_name: length
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: blue
      caption: residues per peptide, with their spread
      decimals: 0
    section: Signature at a glance
    tag: mq-sig-card-median-length
    index: sig-card-median-length
    title: Median length
    description: Median length of the identified peptides, in residues.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    use: mhcquant/peptides
    aggregation: nunique
    column_name: sequence
    column_type: object
    secondary_layout: top_n
    breakdown_col: anchor_p2
    top_n_count: 5
    display:
      icon_name: mdi:target-arrow
      icon_color: pink
      caption: sequences by their P2 residue
    section: Signature at a glance
    tag: mq-sig-card-p2
    index: sig-card-p2
    title: P2 anchor
    description: Distinct sequences ranked by the residue at position 2, a class I anchor.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    use: mhcquant/peptides
    aggregation: nunique
    column_name: sequence
    column_type: object
    secondary_layout: top_n
    breakdown_col: anchor_c_term
    top_n_count: 5
    display:
      icon_name: mdi:ray-end
      icon_color: teal
      caption: sequences by their C-terminal residue
    section: Signature at a glance
    tag: mq-sig-card-cterm
    index: sig-card-cterm
    title: C-terminal anchor
    description: Distinct sequences ranked by their last residue, the other class I anchor.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_length_distribution
    use: mhcquant/length_profile
    config:
      x_title: Peptide length (residues)
      y_title: Share of the sample's peptides
      shaded_bands:
      - [8, 12, Class I range]
      - [13, 25, Class II range]
      legend_pos: bottom
    section: Length signature
    tag: mq-sig-av-length-profile
    index: sig-length-profile
    title: Peptide length distribution per sample
    description: Share of each sample's distinct sequences at each length, with the class I and class II ranges shaded.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptide_composition
    use: mhcquant/composition_bars
    config:
      default_rank: Peptide length
      normalise_to_one: true
      sample_sort: input
      sort_by: abundance
      top_n: 8
    section: Length signature
    tag: mq-sig-av-composition
    index: sig-composition
    title: Peptide composition per sample
    description: Share of each sample's peptidoforms by length, switchable to precursor charge and modification.
    layout: {x: 0, y: 6, w: 8, h: 5}
  - component_type: advanced_viz
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_motif_matrix
    use: mhcquant/motif_heatmap
    config:
      index_column: row_id
      # The residues only: the matrix also carries `peptides`, a count in the
      # thousands that would push every frequency to the bottom of the scale.
      value_columns: [A, C, D, E, F, G, H, I, K, L, M, N, P, Q, R, S, T, V, W, Y]
      row_annotation_cols: [length_class]
      cluster_rows: false
      cluster_cols: true
      cluster_method: ward
      colorscale: Blues
    section: Anchor motifs
    tag: mq-sig-av-motif
    index: sig-motif
    title: Amino-acid frequency by peptide position
    description: Residue frequency per position, per sample and length; lengths under 20 sequences left out.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_length_distribution
    use: mhcquant/length_distribution
    section: Length table
    tag: mq-sig-table-length
    index: sig-table-length
    title: Peptides per length and sample
    description: Distinct sequences per length, as counts and as the share of the sample.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Peptides and proteins
  subtitle: Which peptides do conditions share, and which proteins do they come from?
  tab_group: Immunopeptidome
  tab_order: 6
  tab_icon: mdi:relation-many-to-many
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Peptide filters
    icon: mdi:filter-variant
    color: grape
    description: Narrow by condition sharing or by how many peptides a protein gives
  grid_sections:
  - name: Peptides at a glance
    icon: mdi:counter
    color: grape
    description: Distinct peptides, their sharing and the proteins they come from
  - name: Sharing between conditions
    icon: mdi:set-merge
    color: grape
    description: Peptides common to several conditions or private to one
  - name: Source proteins
    icon: mdi:chart-scatter-plot
    color: grape
    description: Proteins that give the most peptides to presentation; click one to select it
  - name: Peptide detail
    icon: mdi:file-document-outline
    color: gray
    description: Pick a peptide in the table to read its record
    collapsed: true
  - name: Protein detail
    icon: mdi:file-document-outline
    color: gray
    description: Pick a protein in the table to read its record
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      Every distinct sequence by the conditions of the samplesheet it was identified in,
      and every source protein ([UniProt](https://www.uniprot.org) accession) by the
      peptides it gives. Peptides private to one condition
      are the candidates for condition-specific presentation; check their support in the
      peptide record before reading them as biology.
    tag: mq-pep-intro
    index: pep-intro
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: interactive
    workflow_tag: mhcquant
    data_collection_tag: peptide_condition_sharing
    interactive_component_type: MultiSelect
    column_name: sharing
    column_type: object
    display:
      icon_name: mdi:set-merge
      custom_color: grape
    section: Peptide filters
    group: Peptides
    tag: mq-pep-filter-sharing
    index: pep-sharing-filter
    title: Condition sharing
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_source_proteins
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: peptides
    column_type: int64
    display:
      icon_name: mdi:counter
      custom_color: indigo
    section: Peptide filters
    group: Peptides
    tag: mq-pep-filter-protein-peptides
    index: pep-protein-peptides-range
    title: Peptides per protein
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: peptide_condition_sharing
    aggregation: count
    column_name: sequence
    column_type: object
    secondary_layout: composition
    breakdown_col: sharing
    display:
      icon_name: mdi:dna
      icon_color: grape
      caption: sequences, by condition sharing
    section: Peptides at a glance
    tag: mq-pep-card-distinct
    index: pep-card-distinct
    title: Distinct peptides
    description: Distinct sequences, split by whether every condition, several or only one presents them.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_source_proteins
    use: mhcquant/source_proteins
    aggregation: median
    column_name: peptides
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-bar
      icon_color: indigo
      caption: median per protein, with its distribution
      decimals: 0
    section: Peptides at a glance
    tag: mq-pep-card-per-protein
    index: pep-card-per-protein
    title: Peptides per protein
    description: Distinct peptides each source protein gives, per protein and sample.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_source_proteins
    use: mhcquant/source_proteins
    aggregation: median
    column_name: log10_intensity
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-bell-curve
      icon_color: orange
      caption: median log10, with its spread
      decimals: 1
    section: Peptides at a glance
    tag: mq-pep-card-intensity
    index: pep-card-intensity
    title: Protein intensity
    description: Summed log10 intensity of each protein's peptides, per protein and sample.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    use: mhcquant/peptides
    aggregation: median
    column_name: n_proteins
    column_type: int64
    secondary_layout: threshold
    threshold_value: 1
    threshold_direction: max
    display:
      icon_name: mdi:relation-many-to-many
      icon_color: cyan
      caption: median per precursor, one protein passes
      decimals: 0
    section: Peptides at a glance
    tag: mq-pep-card-multimapping
    index: pep-card-multimapping
    title: Proteins per peptide
    description: Source proteins a peptide sequence maps to; above 1, its origin is ambiguous.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: mhcquant
    data_collection_tag: peptide_condition_sharing
    viz_kind: upset_plot
    config:
      viz_kind: upset_plot
      # One set per samplesheet condition. The two count columns can be all
      # ones on a small run, which would make them look like sets.
      set_columns_pattern: ^(?!samples_detected$|conditions_detected$)
      sort_by: cardinality
      show_values: true
    section: Sharing between conditions
    tag: mq-pep-av-sharing-upset
    index: pep-sharing-upset
    title: Peptides per condition combination
    description: Distinct sequences by the conditions they were identified in; the first bar is the shared core.
    layout: {x: 0, y: 0, w: 8, h: 5}
  # Labels name the five proteins giving the most peptides, by their entry
  # name, so the Overview's highlight stays readable.
  - component_type: advanced_viz
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_source_proteins
    use: mhcquant/protein_coverage
    config:
      x_title: Distinct peptides from the protein
      y_title: log10 summed peptide intensity
      log_x: true
      top_n_labels: 3
      density_threshold: 8000
      legend_pos: bottom
      selection_enabled: true
      selection_column: protein
    section: Source proteins
    tag: mq-pep-av-protein-scatter
    index: pep-protein-scatter
    title: Peptides per source protein against their intensity
    description: One point per protein and sample, sized by PSMs. Proteins far right are tiled by many peptides.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    use: mhcquant/peptides
    row_selection_enabled: true
    row_selection_column: sequence
    section: Peptide detail
    tag: mq-pep-table-peptides
    index: pep-table-peptides
    title: Identified peptides
    description: Every accepted precursor with score, support, retention time, charge and source proteins. Select a row to open its record.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: mq-pep-table-peptides
      id_col: sequence
      title_col: peptide
      selection_source: table_selection
      sections:
        Peptide: [sequence, peptide, sample, length_class, modification_state, charge_state]
        Evidence: [score, score_type, psms, spectrum_correlation, fragment_ions, fragment_error_ppm]
        Chromatography: [rt_min, predicted_rt_min, rt_error_min, mz, neutral_mass, gravy]
        Source: [protein, protein_entry, proteins, n_proteins, aa_before, aa_after, start]
        Quantification: [log10_intensity, replicates_quantified, replicates_total]
      link_templates:
        protein: https://www.uniprot.org/uniprotkb/{value}
    section: Peptide detail
    tag: mq-pep-av-peptide-record
    index: pep-peptide-record
    title: Peptide record
    description: The selected peptide, one card per sample and precursor it was identified as.
    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: table
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_source_proteins
    use: mhcquant/source_proteins
    row_selection_enabled: true
    row_selection_column: protein
    section: Protein detail
    tag: mq-pep-table-proteins
    index: pep-table-proteins
    title: Source proteins
    description: Peptides, shared peptides, PSMs and summed intensity per protein and sample. Select a row to open its record.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: advanced_viz
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_source_proteins
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: mq-pep-table-proteins
      id_col: protein
      title_col: protein_entry
      selection_source: any
      sections:
        Protein: [protein, protein_entry, sample]
        Presentation: [peptides, shared_peptides, psms, best_score, log10_intensity]
        Peptides: [peptide_list]
      link_templates:
        protein: https://www.uniprot.org/uniprotkb/{value}
    section: Protein detail
    tag: mq-pep-av-protein-record
    index: pep-protein-record
    title: Protein record
    description: The selected protein, one card per sample it was seen in.
    layout: {x: 5, y: 0, w: 3, h: 6}
