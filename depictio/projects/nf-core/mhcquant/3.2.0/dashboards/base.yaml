version: 1
# nf-core/mhcquant 3.2.0, on the family rules of depictio/projects/nf-core/RULES.md
# (ampliseq/2.18.0 is the reference implementation).
#
# Funnel: the MultiQC report and the replicate agreement (Data & QC) -> the
# search, its FDR and the physico-chemical checks of the identifications
# (Search) -> the immunopeptidome itself, its length and anchor signature and
# the peptides and proteins the conditions share (Immunopeptidome). The
# samplesheet (`samples`) is what every filter starts from: its links carry a
# pick to every sample-level table by sample_id and to the Comet tables by
# run_id.
#
# Routes: a run without --quantify prunes the three replicate collections, and
# with them the whole Reproducibility tab (all its tiles bind them); the
# per-sample summary keeps its replicate columns, empty. A run with
# --annotate_ions false prunes the fragment-ion annotation, the collapsed
# Fragment ions section of the Physico-chemical checks tab.
main_dashboard:
  title: nf-core/mhcquant
  subtitle: Immunopeptidomics, from the spectra to the peptides each sample presents
  project_tag: mhcquant Immunopeptidomics
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family.
  category_colors:
    '{GROUP_COL}': auto
    # Peptide lengths run past the palette's eight colours on a class II run:
    # the import ranks them by peptide count, the most common lengths first.
    length_class:
      '*': 'auto:peptides'
    length_window:
      Class I range: '#1c7ed6'
      Class II range: '#ae3ec9'
      Outside both: '#adb5bd'
    modification_state:
      Unmodified: '#868e96'
      Modified: '#f76707'
    sharing:
      All conditions: '#0ca678'
      Several conditions: '#1098ad'
      One condition: '#f59f00'
    charge_state: auto
    replicate_label: auto
    pair: auto
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. All
  # three are bound to the samplesheet, the source of every sample link.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab, which no route removes.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The samplesheet behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  - name: Reference tables
    icon: mdi:table
    color: gray
    description: The per-sample summary behind the tiles
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Samples, below).
  - component_type: interactive
    workflow_tag: mhcquant
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Key figures
    tag: mq-ov-kf-group
    index: ov-kf-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: mhcquant
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: mq-ov-kf-sample
    index: ov-kf-sample
    title: Sample
    layout: {x: 2, y: 0, w: 2, h: 1}
  # The pipeline's wordmark, read from its repository; where it cannot load (no
  # internet), the title is drawn as text.
  - component_type: text
    title: nf-core/mhcquant
    logo: https://raw.githubusercontent.com/nf-core/mhcquant/master/docs/images/nf-core-mhcquant_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/mhcquant/master/docs/images/nf-core-mhcquant_logo_dark.png
    order: 1
    body: >
      Immunopeptidomics spectra turned into the peptides each sample presents on its MHC
      molecules: how well the search went, which lengths and motifs the peptides show and
      which proteins they come from. [Run parameters](params:)
    tag: mq-ov-hero
    index: ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/mhcquant searches immunopeptidomics spectra with Comet, rescores the matches with predicted retention times and spectra, and keeps the peptides that pass an FDR filter. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      The sample filters in the left panel apply to every tab: narrow the samples once and the whole dashboard follows. A bar above a section narrows that section only.
    tag: mq-ov-about
    index: ov-about
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash.
  - component_type: text
    surface: card
    values:
      samples: {dc: samples, column: sample_id, aggregation: nunique, format: integer}
      raw_files: {dc: samples, column: run_id, aggregation: nunique, format: integer}
    body: |
      ### The run
      - ![](icon:mdi:flask-outline) **Samples** {{samples}}, {{raw_files}} raw files
      - ![](icon:mdi:magnify-scan) **Enzyme** {{param:enzyme}}
      - ![](icon:mdi:filter-outline) **FDR** {{param:fdr_threshold}}
      - ![](icon:mdi:ruler) **Lengths** {{param:peptide_min_length}} to {{param:peptide_max_length}}
      - ![](icon:mdi:molecule) **Rescoring** {{param:rescoring_engine}}
    tag: mq-ov-run
    index: ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  # The marks take the family's colour (the header's), not the theme's blue.
  # An unresolved tab link (Reproducibility, pruned without --quantify) is
  # drawn as plain text.
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Six steps from spectra to presented peptides
      Each step names its settings and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:magnify-scan) **Search** Comet matches spectra to the database · [Settings](params:precursor) · [Identification](tab:Identification)
      2. ![](icon:mdi:molecule) **Rescore** {{param:rescoring_engine}} with predicted features · [Settings](params:feature) · [Physico-chemical](tab:Physico-chemical checks)
      3. ![](icon:mdi:filter-outline) **Filter** Peptides kept at the set FDR · [Settings](params:fdr) · [Identification](tab:Identification)
      4. ![](icon:mdi:set-merge) **Quantify** Replicate injections aligned · [Settings](params:quantif) · [Reproducibility](tab:Reproducibility)
      5. ![](icon:mdi:ruler) **Profile** Lengths and anchor motifs · [Settings](params:peptide) · [MHC signature](tab:MHC signature)
      6. ![](icon:mdi:relation-many-to-many) **Compare** Conditions and source proteins · [Peptides](tab:Peptides and proteins)
      :::
    tag: mq-ov-steps
    index: ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. All four read collections every route writes.
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: samples
    aggregation: nunique
    column_name: sample_id
    column_type: object
    secondary_layout: composition
    breakdown_col: '{GROUP_COL}'
    display:
      icon_name: mdi:flask-outline
      icon_color: orange
      caption: in the samplesheet, by {GROUP_COL_DISPLAY}
      link: tab:MultiQC
    section: Key figures
    tag: mq-ov-kf-samples
    index: ov-kf-samples
    title: Samples
    description: Samples in the samplesheet, each with its raw replicate files. The bar splits them by {GROUP_COL_DISPLAY}.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_sample_summary
    use: mhcquant/sample_summary
    aggregation: sum
    column_name: psms
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:magnify-scan
      icon_color: blue
      caption: PSMs per sample, with their spread
      link: tab:Identification
    section: Key figures
    tag: mq-ov-kf-psms
    index: ov-kf-psms
    title: PSMs
    description: Peptide-spectrum matches that passed the FDR filter, over the samples in view. The box shows how many each sample yielded.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: peptide_condition_sharing
    aggregation: count
    column_name: sequence
    column_type: object
    secondary_layout: composition
    breakdown_col: length_class
    display:
      icon_name: mdi:dna
      icon_color: violet
      caption: distinct sequences, by length
      link: tab:MHC signature
    section: Key figures
    tag: mq-ov-kf-peptides
    index: ov-kf-peptides
    title: Peptides
    description: Distinct peptide sequences over the samples in view. The bar splits them by length, the first sign of the MHC class.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # identification_rate is per raw file, so the median is of files, not of
  # spectra.
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: openms_comet_psms
    use: openms/comet_psms
    aggregation: median
    column_name: identification_rate
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:target
      icon_color: blue
      caption: median per raw file, with its spread
      link: tab:Identification
      decimals: 2
    section: Key figures
    tag: mq-ov-kf-idrate
    index: ov-kf-idrate
    title: Identification rate
    description: Share of the searched spectra that Comet matches at 1% FDR, before rescoring, per raw file.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the group, then the peptide length.
  - component_type: interactive
    workflow_tag: mhcquant
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
      strip_label: '{GROUP_COL_DISPLAY}'
    section: Findings
    tag: mq-ov-findings-group
    index: ov-findings-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_peptides
    interactive_component_type: MultiSelect
    column_name: length_class
    column_type: object
    display:
      icon_name: mdi:ruler
      custom_color: pink
      strip_label: Length
    section: Findings
    tag: mq-ov-findings-length
    index: ov-findings-length
    title: Peptide length
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data.
  - component_type: text
    surface: card
    values:
      n_pep: {dc: mhcquant_peptides, column: sequence, aggregation: nunique, format: integer}
      rt_err: {dc: mhcquant_sample_summary, column: median_abs_rt_error_min, aggregation: median,
        format: 'decimals:1'}
      top_len: {dc: mhcquant_length_distribution, column: length_class, aggregation: top, weight: peptides}
      len_share: {dc: mhcquant_length_distribution, column: length_class, aggregation: top_share,
        weight: peptides, format: percent}
      n_prot: {dc: mhcquant_source_proteins, column: protein, aggregation: nunique, format: integer}
      pep_prot: {dc: mhcquant_source_proteins, column: peptides, aggregation: median, format: 'decimals:0'}
    body: |
      - **{{n_pep}}** distinct peptide sequences pass the FDR filter – after rescoring [Identification](tab:Identification)
      - **{{rt_err}}** minutes, the median gap to the predicted retention time – per sample [Physico-chemical](tab:Physico-chemical checks)
      - **{{len_share}}** of the peptides are {{top_len}}s – the most common length [MHC signature](tab:MHC signature)
      - **{{n_prot}}** source proteins give the peptides – median peptides per protein: {{pep_prot}} [Peptides](tab:Peptides and proteins)
    section: Findings
    tag: mq-ov-findings
    index: ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One highlight per analysis tab, in the order of the rows above. The tiles
  # of a row share a stored height.
  - component_type: highlight
    section: Findings
    source_tab: Identification
    source_component: id-fdr-curve
    caption: Target PSMs Comet accepts as the FDR threshold is relaxed, one curve per raw file; the line marks 1%.
    hide_legend: true
    tag: mq-ov-hl-fdr
    index: ov-hl-fdr
    layout: {x: 0, y: 2, w: 5, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Physico-chemical checks
    source_component: phys-rt-predicted
    caption: One point per peptide, observed against predicted retention time; off the diagonal, unsupported.
    hide_legend: true
    tag: mq-ov-hl-rt
    index: ov-hl-rt
    layout: {x: 5, y: 2, w: 3, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: MHC signature
    source_component: sig-length-profile
    caption: Each sample's peptides by length, one curve per sample; shaded, the class I and class II ranges.
    hide_legend: true
    tag: mq-ov-hl-length
    index: ov-hl-length
    layout: {x: 0, y: 6, w: 3, h: 4}
  - component_type: highlight
    section: Findings
    source_tab: Peptides and proteins
    source_component: pep-protein-scatter
    caption: One point per protein and sample, by the peptides it gives and their intensity; colour is the sample.
    hide_legend: true
    tag: mq-ov-hl-proteins
    index: ov-hl-proteins
    layout: {x: 3, y: 6, w: 5, h: 4}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers. A tab the run does not have is left out.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Reproducibility](tab:Reproducibility)

      ### Search
      - [Identification](tab:Identification)
      - [Physico-chemical checks](tab:Physico-chemical checks)

      ### Immunopeptidome
      - [MHC signature](tab:MHC signature)
      - [Peptides and proteins](tab:Peptides and proteins)
    section: How to read this dashboard
    tag: mq-ov-how-to-read
    index: ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the group first.
  - component_type: interactive
    workflow_tag: mhcquant
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: '{GROUP_COL}'
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Sample filters
    group: Sample scope
    tag: mq-filter-group
    index: sample-filters-group
    title: '{GROUP_COL_DISPLAY}'
    layout: {x: 0, y: 0, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: mhcquant
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: sample_id
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: mq-filter-sample
    index: sample-filters-sample
    title: Sample
    layout: {x: 0, y: 2, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: mhcquant
    data_collection_tag: samples
    interactive_component_type: MultiSelect
    column_name: run_id
    column_type: object
    display:
      icon_name: mdi:file-document-outline
      custom_color: cyan
    section: Sample filters
    group: Sample scope
    tag: mq-filter-raw-file
    index: sample-filters-raw-file
    title: Raw file
    layout: {x: 0, y: 5, w: 1, h: 3}
  # Row selection feeds the Analysis panel.
  - component_type: table
    workflow_tag: mhcquant
    data_collection_tag: samples
    row_selection_enabled: true
    row_selection_column: sample_id
    section: Sample sheet
    tag: mq-sample-sheet
    index: sample-sheet
    title: Samplesheet
    description: One row per raw file, with its sample, condition and search database.
    layout: {x: 0, y: 0, w: 8, h: 6}
  # Every column of the per-sample summary, the replicate correlations
  # included (empty on a run without --quantify).
  - component_type: table
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_sample_summary
    use: mhcquant/sample_summary
    row_selection_enabled: true
    row_selection_column: sample
    section: Reference tables
    tag: mq-ref-summary
    index: ref-sample-summary
    title: Immunopeptidome summary per sample
    description: Yield, length signature, score, retention-time error and replicate agreement, one row per sample.
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
# ============================================================================
# Data & QC
# ============================================================================
- title: MultiQC
  subtitle: Did the search identify peptides evenly across samples?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: MultiQC report
    icon: mdi:file-document-outline
    color: orange
    description: Samples as the MultiQC report names them
  grid_sections:
  - name: Identification yield
    icon: mdi:chart-box-outline
    color: orange
    description: Identifications, q-values and search scores per sample
  - name: Peptide properties
    icon: mdi:chart-bell-curve
    color: orange
    description: Precursor m/z, retention time and intensity of the identified peptides
  - name: Acquisition and rescoring
    icon: mdi:file-document-outline
    color: gray
    description: Chromatograms, fragment mass error and Percolator feature weights
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      mhcquant writes its own [MultiQC](https://multiqc.info) sections: identification
      counts, q-value and score distributions, and the m/z, retention time and intensity
      of the peptides. Compare the counts across samples first, then check that a
      low-yield sample's scores look like the others.
    tag: mq-mqc-intro
    index: mqc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: mhcquant
    data_collection_tag: multiqc_data
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: MultiQC report
    tag: mq-mqc-filter-report-sample
    index: mqc-report-sample-filter
    title: Report sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: multiqc
    workflow_tag: mhcquant
    data_collection_tag: multiqc_data
    selected_module: stats_table
    selected_plot: stats_table-section
    section: Identification yield
    tag: mq-mqc-stats
    title: Identification counts
    description: PSMs, peptides, modified peptides and proteins per sample.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: mhcquant
    data_collection_tag: multiqc_data
    selected_module: qvalue_plot
    selected_plot: qvalue_plot-section
    section: Identification yield
    tag: mq-mqc-qvalue
    title: q-value distribution
    description: Peptide-level q-values of the accepted identifications.
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: mhcquant
    data_collection_tag: multiqc_data
    selected_module: scores_plot_xcorr
    selected_plot: scores_plot_xcorr-section
    section: Identification yield
    tag: mq-mqc-xcorr
    title: Comet Xcorr per sample
    description: Search score of the accepted identifications.
    layout: {x: 4, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: mhcquant
    data_collection_tag: multiqc_data
    selected_module: mz_plot
    selected_plot: mz_plot-section
    section: Peptide properties
    tag: mq-mqc-mz
    title: Precursor m/z
    description: m/z distribution of the identified precursors.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: mhcquant
    data_collection_tag: multiqc_data
    selected_module: rt_plot
    selected_plot: rt_plot-section
    section: Peptide properties
    tag: mq-mqc-rt
    title: Retention time
    description: Elution time distribution of the identified peptides.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: mhcquant
    data_collection_tag: multiqc_data
    selected_module: peptide_intensity_plot
    selected_plot: peptide_intensity_plot-section
    section: Peptide properties
    tag: mq-mqc-intensity
    title: Peptide intensity
    description: Quantified peptide intensities per sample.
    layout: {x: 0, y: 4, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: mhcquant
    data_collection_tag: multiqc_data
    selected_module: chromatogram
    selected_plot: chromatogram-section
    section: Acquisition and rescoring
    tag: mq-mqc-chromatogram
    title: Total ion chromatograms
    description: Ion current over the gradient, one trace per raw file.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: multiqc
    workflow_tag: mhcquant
    data_collection_tag: multiqc_data
    selected_module: mass_error
    selected_plot: mass_error-section
    section: Acquisition and rescoring
    tag: mq-mqc-mass-error
    title: Fragment mass error
    description: Fragment ion mass error per raw file.
    layout: {x: 0, y: 4, w: 4, h: 4}
  - component_type: multiqc
    workflow_tag: mhcquant
    data_collection_tag: multiqc_data
    use: multiqc/percolator
    selected_module: percolator
    selected_plot: percolator_median_feature_weights
    section: Acquisition and rescoring
    tag: mq-mqc-percolator
    title: Percolator feature weights
    description: Median weight of each rescoring feature, per sample.
    layout: {x: 4, y: 4, w: 4, h: 4}
# Every tile binds a replicate collection, so a run without --quantify drops
# the whole tab with them. The per-sample replicate correlations live in the
# Reference tables (persistent, pinned at the bottom of this tab).
- title: Reproducibility
  subtitle: Do the replicate injections of a sample quantify the same peptides?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:set-merge
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Replicate filters
    icon: mdi:filter-variant
    color: cyan
    description: Replicate pairs, or peptides seen in a given number of replicates
  grid_sections:
  - name: Replicates at a glance
    icon: mdi:counter
    color: cyan
    description: How completely and how strongly the replicates quantify the peptides
  - name: Replicate agreement
    icon: mdi:chart-scatter-plot
    color: cyan
    description: Peptide intensity in one replicate against another, pair by pair
  - name: Replicate overlap
    icon: mdi:set-merge
    color: cyan
    description: Peptides by the combination of replicates they were quantified in
  - name: Replicate table
    icon: mdi:table
    color: gray
    description: Replicate membership of every peptide
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [OpenMS](https://openms.de) aligns the replicate injections of each sample and
      quantifies every peptide in each of them. Replicates of one sample should quantify
      the same peptides at similar intensities. A pair off the diagonal, or a small
      all-replicate core, points at one injection to check in the chromatograms.
    tag: mq-rep-intro
    index: rep-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_replicate_pairs
    interactive_component_type: MultiSelect
    column_name: pair
    column_type: object
    display:
      icon_name: mdi:vector-link
      custom_color: green
    section: Replicate filters
    group: Replicates
    tag: mq-rep-filter-pair
    index: rep-pair-filter
    title: Replicate pair
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_replicate_detection
    interactive_component_type: RangeSlider
    column_name: replicates_detected
