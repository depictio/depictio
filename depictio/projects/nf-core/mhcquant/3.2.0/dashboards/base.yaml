      icon_name: mdi:chart-bell-curve
      icon_color: indigo
      caption: median log10, with its spread
      decimals: 1
    section: Replicates at a glance
    tag: mq-rep-card-intensity
    index: rep-card-intensity
    title: Peptide intensity
    description: Median log10 intensity of the peptides where they were quantified.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: mhcquant
    data_collection_tag: mhcquant_replicate_pairs
    use: mhcquant/replicate_pairs
    aggregation: count
    column_name: peptide
    column_type: object
    secondary_layout: composition
    breakdown_col: pair
    display:
      icon_name: mdi:vector-link
      icon_color: orange
      caption: peptides in both replicates, by pair
    section: Replicates at a glance
    tag: mq-rep-card-pairs
