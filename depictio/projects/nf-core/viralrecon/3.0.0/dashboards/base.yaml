  # The consensus quality the lineages were called from: Nextclade's overall QC
  # score per genome, sorted, with its own good and bad marks. A figure that reads
  # the same on three samples and on a hundred, unlike a Sankey or a PCA.
  - component_type: figure
    workflow_tag: viralrecon
    data_collection_tag: nextclade_results
    use: nextclade/report
    visu_type: bar
    mode: code
    code_content: |-
      # Nextclade's overall QC score of each consensus genome, the worst first (at most 40) on a log
      # axis. A clean genome scores 0, drawn as a sliver. The dashed lines are Nextclade's own marks:
      # under 30 is good, 100 or more is bad.
      colors = depictio_category_colors.get('qc_overallStatus') or {}
      d = df.filter(pl.col('qc_overallScore').is_not_null()).sort(['qc_overallScore', 'sample'], descending=[True, False]).head(40).with_columns(pl.col('qc_overallScore').clip(lower_bound=0.1).alias('score'))
      fig = px.bar(d.to_pandas(), x='sample', y='score', color='qc_overallStatus', color_discrete_map=colors, category_orders={'sample': d.get_column('sample').to_list(), 'qc_overallStatus': ['good', 'mediocre', 'bad']}, custom_data=['sample'], hover_data={'qc_overallScore': ':.1f', 'score': False}, log_y=True, labels={'sample': '', 'score': 'Nextclade QC score', 'qc_overallScore': 'QC score', 'qc_overallStatus': ''})
      fig.add_hline(y=30, line_dash='dash', line_width=1, opacity=0.6)
      fig.add_hline(y=100, line_dash='dash', line_width=1, opacity=0.6)
      fig.update_yaxes(range=[np.log10(0.05), np.log10(max(d['score'].max() or 100, 100) * 2)], dtick=1)
      fig.update_xaxes(tickangle=-45, tickfont={'size': 9})
      fig.update_layout(margin=dict(t=10), legend=dict(orientation='h', y=-0.35))
    selection_enabled: true
    selection_column: sample
    section: Consensus quality
    tag: vr-lin-qc-score
    index: lin-qc-score
    title: Nextclade QC score per consensus genome
    description: Worst first, on a log axis; under the lower dashed line (30) is good, above the upper (100) is bad.
    layout: {x: 0, y: 0, w: 8, h: 4}
