    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      title_size: md
      custom_color: '#45B8AC'
      icon_name: mdi:flask
    title_align: left
    placement: left
    section: Sample filters
    group: Sample scope
