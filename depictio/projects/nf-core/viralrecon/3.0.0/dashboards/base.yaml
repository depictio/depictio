version: 1
main_dashboard:
  title: nf-core/viralrecon
  subtitle: MultiQC Analysis - Sequencing, Alignment & Variant Calling QC
  project_tag: Viralrecon Viral Genome Analysis
  main_tab_name: MultiQC
  tab_icon: /assets/images/logos/multiqc.png
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 746b0f3c1e4a2d7f8e5b9ca2
  # The persistent pair. `summary_metrics` is viralrecon's metadata table: one
  # row per sample carrying the identity every other collection is reached by,
  # and `template.yaml` makes it the source of all the project's links. A filter
  # placed here is therefore translated onto every linked collection, which is
  # what lets two sections cover five tabs.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Reaches every tab through the project links
    persistent: true
    pin: top
  - name: QC thresholds
    icon: mdi:tune
    color: cyan
    description: Coverage and yield floors, applied everywhere
    collapsed: true
    persistent: true
    pin: bottom
  # Deliberately NOT persistent, and bound to multiqc_data rather than
  # summary_metrics: on the nanopore / ARTIC routes summary_metrics is pruned and
  # the two sections above go with it. This one keeps the MultiQC tab filterable
  # on those routes.
  - name: MultiQC report
    icon: mdi:file-document-outline
    color: orange
    description: Fallback sample list, read from the MultiQC report itself
    collapsed: true
  grid_sections:
  - name: Run at a glance
    icon: mdi:counter
    color: blue
    description: What the run produced, per sample
  - name: QC overview
    icon: mdi:chart-box-outline
    color: teal
    description: The six panels worth reading first
  # Collapsed on purpose, and not only for tidiness: a MultiQC tile fetches its
  # data from `useInView`, and a tile inside a collapsed section has no height,
  # never intersects, and never fetches. Eighteen tiles here cost less on first
  # paint than the eleven that used to be expanded.
  - name: Read & alignment details
    icon: mdi:file-document-outline
    color: indigo
    description: FastQC, Kraken2, trimming and alignment, panel by panel
    collapsed: true
  - name: Variant & assembly details
    icon: mdi:dna
    color: orange
    description: iVar, snpEff, bcftools and QUAST, panel by panel
    collapsed: true
  components:
