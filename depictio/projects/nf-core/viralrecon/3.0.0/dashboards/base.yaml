  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    interactive_component_type: RangeSlider
    column_name: DP
    column_type: int64
    display:
      icon_name: mdi:layers-outline
      custom_color: violet
    section: Variant filters
    group: Support
    tag: vr-var-filter-depth
    index: var-depth-filter
    title: Read depth
    layout: {x: 0, y: 12, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: oncoplot_canonical
    interactive_component_type: MultiSelect
    column_name: mutation_type
    column_type: object
    display:
      icon_name: mdi:alert-circle-outline
      custom_color: violet
    section: Matrix filter
    tag: vr-var-filter-mutation-type
    index: var-mutation-type-filter
    title: Mutation type
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    aggregation: count
    column_name: POS
    column_type: int64
    secondary_layout: composition
    breakdown_col: FUNCLASS
    display:
      icon_name: mdi:dna
      icon_color: violet.4
      caption: calls, by functional class
      decimals: 0
    section: Calls at a glance
    tag: vr-var-card-calls
    index: var-card-calls
    title: Variant calls
    description: Calls over the samples in view, one per sample and mutation.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    aggregation: nunique
    column_name: mutation_label
    column_type: object
    secondary_layout: uniqueness
    display:
      icon_name: mdi:map-marker-outline
      icon_color: violet.6
      caption: and the one most samples share
      decimals: 0
    section: Calls at a glance
    tag: vr-var-card-mutations
    index: var-card-mutations
    title: Distinct mutations
    description: Distinct mutations over the samples in view; a mutation shared by many samples is a lineage marker.
    layout: {x: 2, y: 0, w: 2, h: 2}
  # 0.75: the allele frequency at which viralrecon's consensus takes a call.
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    aggregation: median
    column_name: AF
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.75
    threshold_direction: min
    display:
      icon_name: mdi:percent-outline
      icon_color: violet.8
      caption: calls against the 0.75 consensus cut-off
      decimals: 2
    section: Calls at a glance
    tag: vr-var-card-af
    index: var-card-af
    title: Allele frequency
    description: Median allele frequency of the calls; the bar counts those the consensus takes.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    aggregation: median
    column_name: DP
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:layers-outline
      icon_color: violet.9
      caption: median per call, with its spread
      decimals: 0
    section: Calls at a glance
    tag: vr-var-card-depth
    index: var-card-depth
    title: Read depth
    description: Median read depth at the called positions.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # No point labels: mutation labels pile up over the dots at any width, and
  # the Overview highlight draws this tile as it is here.
  # The navigator: every call at its position, as high as its allele frequency, in
  # its snpEff effect's colour. The browser below follows a pick, a brush and a
  # locus typed here, and its window shows on this axis as a band. No
  # default_region: the browser opens on the best supported call and the axis
  # opens on the window it shows.
  - component_type: advanced_viz
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    viz_kind: genome_view
    config:
      viz_kind: genome_view
      chr_col: CHROM
      pos_col: POS
      score_col: AF
      feature_col: mutation_label
      category_col: EFFECT
      mark: point
      point_size: 8
      score_title: Allele frequency
      # 0.75: the allele frequency at which the consensus takes a call.
      score_threshold: 0.75
      # The call's sample, gene, change, effect and depth, in the tooltip.
      hover_cols: [sample, GENE, AA, EFFECT, DP]
      region_filter_enabled: true
      open_on_view_window: true
      default_view: region
      follow_view_window: true
      # The least the axis shows around the browser's window, in bases.
      follow_context_bp: 10000
      selection_enabled: true
      # The mutation, not the sample: the browser jumps to the position and
      # opens the samples that carry it.
      selection_column: mutation_label
    section: Along the genome
    tag: vr-var-navigator
    index: var-navigator
    title: Allele frequency along the genome
    description: One dot per call, coloured by its effect; above the dashed 0.75 line, the call enters the consensus.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: jbrowse
    workflow_tag: viralrecon
    data_collection_tag: tracks
    section: Along the genome
    initial_tracks: 4
    max_tracks: 8
    show_overview: false
    selection_enabled: true
    selection_column: sample_id
    # The ARTIC primers the amplicons come from and the Nextstrain clade markers,
    # beside the assembly's gene track (show_annotation is on by default).
    ucsc_tracks: [artic, nextstrainClade]
    # The tracks take the hue the plots give the sample's lineage (the manifest
    # holds no colour of its own); the variants take their snpEff effect's colour.
    color_by: lineage
    # No fixed location: a location is a contig, and the view opens on the best
    # supported call instead: call_score ranks the allele frequency, then the depth
    # (the tie-break at 1.0), and puts intergenic calls last. The opening tracks are
    # the variants and the reads of that call's sample (the manifest leads with it),
    # then the next sample's. A picked call (navigator dot or table row) narrows
    # variants_long to the samples carrying it, and the view jumps to it; the
    # window then follows the other genome tiles of the tab.
    follow_window: true
    locus_from:
      data_collection_tag: variants_long
      chrom_column: CHROM
      start_column: POS
      padding: 150
      max_rows: 20
      sort_by: call_score
      descending: true
      label_column: mutation_label
      sample_column: sample
      columns: [GENE, EFFECT, AF]
      search_columns: [GENE, AA]
    # Variants take the colour the plots give their snpEff effect.
    variant_color_by:
      column: EFFECT
    tag: vr-var-browser
    index: var-browser
    title: Genome browser
    description: The variants and reads of the samples in view, at the call picked in the navigator above; it opens on the best supported call.
    layout: {x: 0, y: 4, w: 8, h: 9}
  - component_type: figure
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    visu_type: histogram
    mode: code
    code_content: |-
      # Allele frequency of every call, stacked by snpEff effect in the family's
      # effect colours, or by the column the reader picks in the Colour by
      # control (or by Analysis mode's groups); the dashed line is the 0.75
      # consensus cut-off.
      d = df.filter(pl.col('AF').is_not_null())
      kw = depictio_group_kwargs or {'color': 'EFFECT', 'color_discrete_map': depictio_category_colors.get('EFFECT') or {}}
      fig = px.histogram(d.to_pandas(), x='AF', nbins=40, labels={'AF': 'Allele frequency', 'EFFECT': 'Effect'}, **kw)
      fig.add_vline(x=0.75, line_dash='dash')
      fig.update_layout(barmode='stack', yaxis_title='Calls', margin=dict(t=10))
    section: Support
    tag: vr-var-af-histogram
    index: var-af-histogram
    title: Allele frequency of the calls
    description: Fixed calls pile up near 1; sub-consensus calls sit left of the line.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: advanced_viz
    workflow_tag: viralrecon
    data_collection_tag: oncoplot_canonical
    use: ivar/mutation_matrix
    viz_kind: oncoplot
    config:
      viz_kind: oncoplot
      sample_id_col: sample_id
      gene_col: gene
      mutation_type_col: mutation_type
    section: Co-occurrence
    tag: vr-var-oncoplot
    index: var-oncoplot
    title: Mutations per sample and gene
    description: Each cell is the effect class; rows and columns are ordered so shared calls line up.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: viralrecon
    use: ivar/lollipop
    data_collection_tag: variants_long
    config:
      effect_col: AF
      max_subplot_genes: 6
    section: Genes and effects
    tag: vr-var-lollipop
    index: var-lollipop
    title: Calls on each gene (lollipop)
    description: One panel per gene, the six most mutated; the stem height is the allele frequency.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    visu_type: bar
    mode: code
    code_content: |-
      # Calls per gene, stacked by functional class, the busiest gene first.
      d = df.group_by(['GENE', 'FUNCLASS']).agg(pl.len().alias('calls'))
      fig = px.bar(d.to_pandas(), x='GENE', y='calls', color='FUNCLASS', color_discrete_map=depictio_category_colors.get('FUNCLASS') or {}, labels={'GENE': 'Gene', 'calls': 'Calls', 'FUNCLASS': 'Functional class'})
      fig.update_layout(barmode='stack', xaxis={'categoryorder': 'total descending'}, margin=dict(t=10))
      fig.update_xaxes(tickangle=-45)
      # A count axis in whole steps: a short one otherwise ticks 0.5.
      fig.update_yaxes(dtick=max(1, round((d.group_by('GENE').agg(pl.col('calls').sum())['calls'].max() or 0) / 5)))
    section: Genes and effects
    tag: vr-var-by-gene
    index: var-by-gene
    title: Calls per gene
    description: Stacked by functional class.
    layout: {x: 0, y: 6, w: 4, h: 4}
  - component_type: figure
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    visu_type: bar
    mode: code
    code_content: |-
      # Calls per sample, stacked by functional class.
      d = df.group_by(['sample', 'FUNCLASS']).agg(pl.len().alias('calls')).sort('sample')
      fig = px.bar(d.to_pandas(), x='sample', y='calls', color='FUNCLASS', color_discrete_map=depictio_category_colors.get('FUNCLASS') or {}, labels={'sample': 'Sample', 'calls': 'Calls', 'FUNCLASS': 'Functional class'})
      fig.update_layout(barmode='stack', margin=dict(t=10))
      fig.update_xaxes(tickangle=-45, tickfont={'size': 9})
      # A count axis in whole steps: a short one otherwise ticks 0.5.
      fig.update_yaxes(dtick=max(1, round((d.group_by('sample').agg(pl.col('calls').sum())['calls'].max() or 0) / 5)))
    section: Genes and effects
    tag: vr-var-by-sample
    index: var-by-sample
    title: Calls per sample
    description: Stacked by functional class.
    layout: {x: 4, y: 6, w: 4, h: 4}
  - component_type: table
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    row_selection_enabled: true
    # The mutation, like the navigator: a row click opens its position in the
    # genome browser above, on the samples that carry it.
    row_selection_column: mutation_label
    section: Variant table
    tag: vr-var-table
    index: var-table
    title: Variant calls
    description: Pick a row to open its position in the genome browser.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Gene
  subtitle: Which mutations does this gene carry, and where do they sit?
  tab_group: Mutations
  tab_order: 5
  tab_icon: mdi:map-marker-outline
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 746b0f3c1e4a2d7f8e5b9cb6
  filter_sections:
  - name: Gene pick
    icon: mdi:tune
    color: grape
    description: Choose the gene the tab shows, and the effects it keeps
  grid_sections:
  - name: Gene at a glance
    icon: mdi:counter
    color: grape
    description: How many calls the picked gene carries, and how well supported
  # The lollipop and the carriers' plot share one screen: pick a stem or a
  # sample and the other follows.
  - name: Mutations in the gene
    icon: mdi:map-marker-outline
    color: grape
    description: Every mutation of the gene along it, beside the calls sample by sample
    display: linked
  - name: Mutations
    icon: mdi:table
    color: gray
    description: Every call of the gene with its support and annotation
    collapsed: true
  components:
  # always_selected: the plots show one gene, so the picker
  # always names one. default_by ranks by call_score, descending (allele
  # frequency, then depth, intergenic calls last): the tab opens on the gene
  # holding the best supported call, never on an intergenic pseudo-gene. No
  # banner_facts: the value is the gene itself.
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    interactive_component_type: Select
    always_selected: true
    default_by: call_score
    default_order: desc
    column_name: GENE
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: grape
    placement: left
    section: Gene pick
    group: Gene
    tag: vr-ge-filter-gene
    index: ge-filter-gene
    title: Gene
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    interactive_component_type: MultiSelect
    column_name: EFFECT
    column_type: object
    display:
      icon_name: mdi:alert-circle-outline
      custom_color: grape
    placement: left
    section: Gene pick
    group: Mutations
    tag: vr-ge-filter-effect
    index: ge-effect-filter
    title: Effect
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: text
    order: 1
    body: >
      Pick a gene on the left, and the lollipop gives each mutation's allele frequency along
      the gene while the dots give it sample by sample. Pick a stem or a sample to narrow the
      other plot and the table to that one. Open a mutation in the genome browser of the
      [Variants](tab:Variants) tab to read it against the [ARTIC](https://artic.network) primers
      and the reads.
    tag: vr-ge-intro
    index: ge-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    aggregation: count
    column_name: POS
    column_type: int64
    secondary_layout: composition
    breakdown_col: FUNCLASS
    display:
      icon_name: mdi:dna
      icon_color: grape.4
      caption: calls, by functional class
      decimals: 0
    section: Gene at a glance
    tag: vr-ge-card-calls
    index: ge-card-calls
    title: Variant calls
    description: Calls in the picked gene, one per sample and mutation.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    aggregation: nunique
    column_name: mutation_label
    column_type: object
    secondary_layout: uniqueness
    display:
      icon_name: mdi:map-marker-outline
      icon_color: grape.6
      caption: and the one most samples share
      decimals: 0
    section: Gene at a glance
    tag: vr-ge-card-mutations
    index: ge-card-mutations
    title: Distinct mutations
    description: Distinct mutations of the picked gene; one that many samples share is a lineage marker.
    layout: {x: 2, y: 0, w: 2, h: 2}
  # 0.75: the allele frequency at which viralrecon's consensus takes a call.
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    aggregation: median
    column_name: AF
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.75
    threshold_direction: min
    display:
      icon_name: mdi:percent-outline
      icon_color: grape.8
      caption: calls against the 0.75 consensus cut-off
      decimals: 2
    section: Gene at a glance
    tag: vr-ge-card-af
    index: ge-card-af
    title: Allele frequency
    description: Median allele frequency of the gene's calls; the bar counts those the consensus takes.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    aggregation: median
    column_name: DP
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:layers-outline
      icon_color: grape.9
      caption: median per call, with its spread
      decimals: 0
    section: Gene at a glance
    tag: vr-ge-card-depth
    index: ge-card-depth
    title: Read depth
    description: Median read depth at the positions of the gene's calls.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # A stem is a mutation: a pick emits mutation_label, which narrows the table
  # and the cards to it.
  - component_type: advanced_viz
    workflow_tag: viralrecon
    use: ivar/lollipop
    data_collection_tag: variants_long
    config:
      effect_col: AF
      label_col: mutation_label
      max_subplot_genes: 6
      selection_enabled: true
      selection_column: mutation_label
    section: Mutations in the gene
    tag: vr-ge-lollipop
    index: ge-lollipop
    title: Mutations along the gene (lollipop)
    description: One stem per mutation, as high as its allele frequency; pick one to narrow the table to it.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: figure
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    visu_type: scatter
    mode: code
    code_content: |-
      # Allele frequency of every call of the gene, one dot per call, samples
      # ordered by their best supported call. The colour is the snpEff effect, or
      # Analysis mode's groups when it has some; the dashed line is the 0.75
      # consensus cut-off. custom_data carries the sample the selection reads.
      d = df.filter(pl.col('AF').is_not_null())
      order = d.group_by('sample').agg(pl.col('AF').max().alias('top')).sort('top', descending=True)['sample'].to_list()
      kw = depictio_group_kwargs or {'color': 'EFFECT', 'color_discrete_map': depictio_category_colors.get('EFFECT') or {}}
      fig = px.scatter(d.to_pandas(), x='sample', y='AF', custom_data=['sample'], hover_name='mutation_label', labels={'sample': 'Sample', 'AF': 'Allele frequency', 'EFFECT': 'Effect'}, **kw)
      fig.update_traces(marker=dict(size=12))
      fig.add_hline(y=0.75, line_dash='dash')
      fig.update_xaxes(tickangle=-45, tickfont={'size': 9}, categoryorder='array', categoryarray=order)
      fig.update_yaxes(range=[0, 1.05])
      fig.update_layout(showlegend=False, margin=dict(t=10))
    selection_enabled: true
    selection_column: sample
    section: Mutations in the gene
    tag: vr-ge-af-by-sample
    index: ge-af-by-sample
    title: Allele frequency per sample
    description: One dot per call, coloured by effect; pick a sample to narrow the table to it.
    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: table
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    row_selection_enabled: true
    row_selection_column: mutation_label
    section: Mutations
    tag: vr-ge-table
    index: ge-table
    title: Mutations of the gene
    description: Tick a row to narrow the plots to that mutation.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Sample
  subtitle: What does one sample's genome look like, from reads to variants?
  tab_group: Mutations
  tab_order: 6
  tab_icon: mdi:test-tube
  tab_icon_color: pink
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 746b0f3c1e4a2d7f8e5b9cb7
  # The picker reads summary_metrics, the hub every link starts from, so its
  # pick reaches the calls, the depth and the tracks of the sample.
  filter_sections:
  - name: Sample pick
    icon: mdi:tune
    color: pink
    description: Choose the sample the tab shows, and the calls it keeps
  grid_sections:
  - name: Sample at a glance
    icon: mdi:counter
    color: pink
    description: The calls, their support and the depth of the picked sample
  # The call picker and the record card share one screen: pick a call and the
  # card reads it out.
  - name: The sample's genome
    icon: mdi:dna
    color: pink
    description: The sample's calls along the genome, beside the one picked
    display: linked
  - name: Depth along the genome
    icon: mdi:chart-line
    color: pink
    description: Depth per 200 bp window; a dropout reads as a gap
  - name: Variant table
    icon: mdi:table
    color: gray
    description: Every call of the sample with its support and annotation
    collapsed: true
  components:
  # always_selected: the cards and the tracks show one sample, so
  # the picker always names one. default_by ranks by median depth, descending:
  # the tab opens on the best covered sample, whose calls are best supported.
  # banner_facts read the sample's row of the run summary.
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    interactive_component_type: Select
    always_selected: true
    default_by: coverage_median
    default_order: desc
    banner_facts:
    - {column: lineage, label: Lineage, icon: 'tabler:dna-2'}
    - {column: pct_genome_covered_10x, label: Genome at 10x (%), format: 'decimals:1', icon: 'tabler:chart-area-line'}
    - {column: coverage_median, label: Median depth, format: si, icon: 'tabler:layers-intersect'}
    - {column: num_variants_total, label: Variants, format: integer, icon: 'tabler:variable'}
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: pink
    placement: left
    section: Sample pick
    group: Sample
    tag: vr-sm-filter-sample
    index: sm-filter-sample
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    interactive_component_type: RangeSlider
    column_name: AF
    column_type: float64
    display:
      icon_name: mdi:percent-outline
      custom_color: pink
    placement: left
    section: Sample pick
    group: Calls
    tag: vr-sm-filter-af
    index: sm-filter-af
    title: Allele frequency
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: text
    order: 1
    body: >
      Pick a sample on the left and the tab shows that one alone: its calls along the genome,
      with the one picked read out beside them. The depth track below shows where its coverage
      fell away. Open a call in the genome browser of the [Variants](tab:Variants) tab to read
      its reads.
    tag: vr-sm-intro
    index: sm-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    aggregation: count
    column_name: POS
    column_type: int64
    secondary_layout: composition
    breakdown_col: FUNCLASS
    display:
      icon_name: mdi:dna
      icon_color: pink.4
      caption: calls, by functional class
      decimals: 0
    section: Sample at a glance
    tag: vr-sm-card-calls
    index: sm-card-calls
    title: Variant calls
    description: Calls of the picked sample, one per mutation.
    layout: {x: 0, y: 0, w: 2, h: 2}
  # 0.75: the allele frequency at which viralrecon's consensus takes a call.
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    aggregation: median
    column_name: AF
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.75
    threshold_direction: min
    display:
      icon_name: mdi:percent-outline
      icon_color: pink.6
      caption: calls against the 0.75 consensus cut-off
      decimals: 2
    section: Sample at a glance
    tag: vr-sm-card-af
    index: sm-card-af
    title: Allele frequency
    description: Median allele frequency of the sample's calls; the bar counts those the consensus takes.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: mosdepth_amplicon_coverage
    use: mosdepth/amplicon_coverage
    aggregation: median
    column_name: coverage
    column_type: int64
    secondary_layout: threshold
    threshold_value: 10
    threshold_direction: min
    display:
      icon_name: mdi:chart-areaspline
      icon_color: pink.8
      caption: amplicons against 10x
      decimals: 0
    section: Sample at a glance
    tag: vr-sm-card-amplicon-depth
    index: sm-card-amplicon-depth
    title: Amplicon depth
    description: Median depth over the sample's amplicons; the bar counts those at 10x or more.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: mosdepth_genome_coverage
    use: mosdepth/genome_coverage
    aggregation: count
    column_name: coverage
    column_type: float64
    filter_expr: col('coverage') < 10
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-timeline-variant
      icon_color: pink.9
      caption: their depth, from no reads to just under 10x
      decimals: 0
    section: Sample at a glance
    tag: vr-sm-card-low-windows
    index: sm-card-low-windows
    title: Windows under 10x
    description: 200 bp windows of the sample under 10x, which the consensus masks; a bar at 0 is a true gap.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # The call picker of the linked section: a Manhattan of the
  # picked sample's calls. A pick emits the mutation, which the record card
  # follows. The table sits in its own section below.
  - component_type: advanced_viz
    workflow_tag: viralrecon
    use: ivar/manhattan
    data_collection_tag: variants_long
    config:
      feature_col: mutation_label
      score_kind: Allele frequency (AF)
      # 0.75: the allele frequency at which the consensus takes a call.
      score_threshold: 0.75
      top_n_labels: 0
      marker_size_above: 12
      color_by_columns:
      - EFFECT
      - FUNCLASS
      - sample
      default_color_by: EFFECT
      hover_cols: [GENE, AA, EFFECT, DP]
      selection_enabled: true
      selection_column: mutation_label
    section: The sample's genome
    tag: vr-sm-manhattan
    index: sm-manhattan
    title: Calls along the genome
    description: Pick a call to read it out beside the plot.
    layout: {x: 0, y: 0, w: 5, h: 5}
  # No default_record: the card waits for a pick. It follows the call picked in
  # the Manhattan and shows that call's row of the picked sample.
  - component_type: advanced_viz
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: vr-sm-manhattan
      id_col: mutation_label
      title_col: mutation_label
      selection_source: any
      sections:
        Call: [GENE, AA, EFFECT, FUNCLASS]
        Support: [AF, DP, REF_DP, ALT_DP]
        Position: [CHROM, POS, REF, ALT]
      labels:
        GENE: Gene
        AA: Amino acid change
        EFFECT: Effect
        FUNCLASS: Functional class
        AF: Allele frequency
        DP: Read depth
        REF_DP: Reference reads
        ALT_DP: Alternate reads
        CHROM: Reference sequence
        POS: Position
        REF: Reference base
        ALT: Alternate base
    section: The sample's genome
    tag: vr-sm-record
    index: sm-record
    title: Picked mutation
    description: The call picked in the plot, with its gene, effect and read support.
    layout: {x: 5, y: 0, w: 3, h: 5}
  - component_type: advanced_viz
    workflow_tag: viralrecon
    use: mosdepth/coverage_track_genome
    data_collection_tag: coverage_track_canonical
    config:
      end_col: end
      sample_col: sample
      y_scale: linear
      smoothing_window: 5
      show_annotation_lane: false
      views: [track]
    section: Depth along the genome
    tag: vr-sm-genome-track
    index: sm-genome-track
    title: Depth along the genome
    description: The picked sample on a linear axis; a dropout reads as a gap.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    row_selection_enabled: true
    row_selection_column: mutation_label
    section: Variant table
    tag: vr-sm-var-table
    index: sm-var-table
    title: Variant calls
    description: Tick a row to read the call out in the card above.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Lineage & Clustering
