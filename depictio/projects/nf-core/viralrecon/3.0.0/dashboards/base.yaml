  - component_type: figure
    workflow_tag: viralrecon
    data_collection_tag: pangolin_lineages
    use: pangolin/report
    visu_type: bar
    mode: code
    code_content: |-
      # Samples per Pangolin lineage: the eight largest, the rest folded into
      # Other, in the family's lineage colours.
      d = df.filter(pl.col('lineage').is_not_null()).group_by('lineage').agg(pl.len().alias('samples')).sort(['samples', 'lineage'], descending=[True, False])
      top = d['lineage'].head(8).to_list()
      d = d.with_columns(pl.when(pl.col('lineage').is_in(top)).then(pl.col('lineage')).otherwise(pl.lit('Other')).alias('lineage')).group_by('lineage').agg(pl.col('samples').sum()).sort('samples', descending=True)
      fig = px.bar(d.to_pandas(), x='lineage', y='samples', color='lineage', color_discrete_map=depictio_category_colors.get('lineage') or {}, labels={'lineage': 'Pangolin lineage', 'samples': 'Samples'})
      fig.update_layout(showlegend=False, margin=dict(t=10))
      # A count axis in whole steps: a short one otherwise ticks 0.5.
      fig.update_yaxes(dtick=max(1, round((d['samples'].max() or 0) / 5)))
    section: Calls per lineage and clade
    tag: vr-lin-lineage-bar
    index: lin-lineage-bar
