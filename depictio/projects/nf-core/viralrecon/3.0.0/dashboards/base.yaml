- title: Sample QC
  subtitle: Did each sample yield a well-covered, trustworthy consensus genome?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:stethoscope
  tab_icon_color: blue
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 746b0f3c1e4a2d7f8e5b9cc2
  # The missing-bases slider reads nextclade_results, which a nanopore run
  # keeps, so the tab never loses its own filter.
  filter_sections:
  - name: Variant yield
    icon: mdi:filter-variant
    color: blue
    description: Narrows the samples by the calls they produced and the bases they miss
  grid_sections:
  - name: QC at a glance
    icon: mdi:counter
    color: blue
    description: Reads, depth and breadth over the samples in view
  # The scatter and the record card of the sample picked in it share one screen.
  - name: Depth and breadth
    icon: mdi:chart-scatter-plot
    color: blue
    description: Depth against breadth, with the record of the sample picked in it
    display: linked
  - name: Diagnostics
    icon: mdi:shield-check-outline
    color: blue
    description: The consensus as Nextclade reads it
  - name: Breadth per sample
    icon: mdi:chart-bar
    color: blue
    description: Genome covered at 1x and at 10x, sample by sample
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      Each sample's alignment and consensus, from the pipeline's
      [variant summary](https://nf-co.re/viralrecon/3.0.0/docs/output) and the
      [Nextclade](https://clades.nextstrain.org) QC of its consensus. The first scatter tells a
      thin sample from one that lost amplicons; lasso a point to read its record beside it. It
      judges coverage only: a sample can pass it and still be rated mediocre or bad below, where
      Nextclade also counts the bases the consensus could not read.
    tag: vr-qc-intro
    index: qc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    interactive_component_type: RangeSlider
    column_name: num_variants_snp
    column_type: float64
    display:
      icon_name: mdi:dna
      custom_color: blue
    section: Variant yield
    group: Variant counts
    tag: vr-qc-filter-snps
    index: qc-snp-yield
    title: SNPs called
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    interactive_component_type: RangeSlider
    column_name: num_variants_indel
    column_type: float64
    display:
      icon_name: mdi:dna
      custom_color: blue
    section: Variant yield
    group: Variant counts
    tag: vr-qc-filter-indels
    index: qc-indel-yield
    title: Indels called
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: nextclade_results
    interactive_component_type: RangeSlider
    column_name: totalMissing
    column_type: int64
    display:
      icon_name: mdi:alert-outline
      custom_color: blue
    section: Variant yield
    group: Consensus
    tag: vr-qc-filter-missing
    index: qc-missing
    title: Missing bases
    layout: {x: 0, y: 6, w: 1, h: 3}
  # 1,000 reads: the pipeline's default --min_mapped_reads.
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    use: multiqc/summary_metrics
    aggregation: median
    column_name: num_reads_mapped
    column_type: float64
    secondary_layout: threshold
    threshold_value: 1000
    threshold_direction: min
    display:
      icon_name: mdi:target
      icon_color: blue.4
      caption: samples against the 1,000-read floor
      decimals: 0
    section: QC at a glance
    tag: vr-qc-card-reads
    index: qc-card-reads
    title: Reads mapped
    description: Median reads aligned per sample; under 1,000 a sample skips variant calling by default.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    use: multiqc/summary_metrics
    aggregation: median
    column_name: pct_reads_mapped
    column_type: float64
    filter_expr: col('pct_reads_mapped').is_not_null()
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:percent-outline
      icon_color: blue.6
      caption: median share of each sample's reads
      decimals: 1
    section: QC at a glance
    tag: vr-qc-card-mapped-pct
    index: qc-card-mapped-pct
    title: Reads mapped (%)
    description: Median share of each sample's reads that aligned to the viral reference.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    use: multiqc/summary_metrics
    aggregation: median
    column_name: coverage_median
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-line
      icon_color: blue.8
      caption: median per sample, with its spread
      decimals: 0
    section: QC at a glance
    tag: vr-qc-card-depth
    index: qc-card-depth
    title: Median depth
    description: Median of each sample's median depth along the genome.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    use: multiqc/summary_metrics
    aggregation: median
    column_name: pct_genome_covered_10x
    column_type: float64
    filter_expr: col('pct_genome_covered_10x').is_not_null()
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-areaspline
      icon_color: blue.9
      caption: median, with its distribution
      decimals: 1
    section: QC at a glance
    tag: vr-qc-card-genome-10x
    index: qc-card-genome-10x
    title: Genome at 10x (%)
    description: Median share of the genome covered by 10 reads or more; failed samples sit apart at the low end.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Colours by lineage, or by Analysis mode's groups when it has some.
  # hover_data puts sample first in customdata, which the selection reads.
  # Depth and breadth, not variant calls: every run's summary carries both,
  # while a run no caller reached writes NA for its calls.
  - component_type: figure
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    use: multiqc/summary_metrics
    visu_type: scatter
    mode: code
    code_content: |-
      # Depth against 10x breadth, one point per sample, coloured by verdict: a
      # sample passes with 80% of the genome at 10x and a median depth of 10x or
      # more, and the shaded corners are where it fails. Depth on a log axis:
      # samples of one run span orders of magnitude. A failing sample carries its name.
      d = df.filter(pl.col('coverage_median').is_not_null() & (pl.col('coverage_median') > 0) & pl.col('pct_genome_covered_10x').is_not_null())
      d = d.with_columns(pl.when((pl.col('pct_genome_covered_10x') >= 80) & (pl.col('coverage_median') >= 10)).then(pl.lit('pass')).otherwise(pl.lit('fail')).alias('qc_status')).with_columns(pl.when(pl.col('qc_status') == 'fail').then(pl.col('sample')).otherwise(pl.lit('')).alias('flag'))
      low = min(d['coverage_median'].min() or 10, 10) / 2
      top = max(d['coverage_median'].max() or 10, 10) * 2
      fig = px.scatter(d.to_pandas(), x='coverage_median', y='pct_genome_covered_10x', color='qc_status', color_discrete_map=depictio_category_colors.get('qc_status') or {}, category_orders={'qc_status': ['pass', 'fail']}, log_x=True, text='flag', hover_data=['sample', 'num_variants_total'], labels={'coverage_median': 'Median depth', 'pct_genome_covered_10x': 'Genome at 10x (%)', 'qc_status': 'Verdict', 'num_variants_total': 'Variants called'})
      fig.add_hrect(y0=0, y1=80, fillcolor='rgba(224, 49, 49, 0.08)', line_width=0, layer='below')
      fig.add_vrect(x0=low, x1=10, fillcolor='rgba(224, 49, 49, 0.08)', line_width=0, layer='below')
      fig.add_hline(y=80, line_dash='dash', line_width=1, opacity=0.6, annotation_text='80%')
      fig.add_vline(x=10, line_dash='dash', line_width=1, opacity=0.6, annotation_text='10x')
      fig.update_traces(marker=dict(size=14), textposition='top center')
      fig.update_xaxes(range=[np.log10(low), np.log10(top)])
      fig.update_yaxes(range=[0, 105])
      fig.update_layout(margin=dict(t=10), legend_title_text='')
    selection_enabled: true
    selection_column: sample
    section: Depth and breadth
    tag: vr-qc-depth-breadth
    index: qc-depth-breadth
    title: Median depth against genome covered at 10x
    description: A thin sample sits low and left; a deep one under the line lost amplicons. Coverage only, the consensus is rated below.
    layout: {x: 0, y: 0, w: 5, h: 6}
  # No default_record: the card waits for a pick rather than opening on a
  # sample of the reference run.
  - component_type: advanced_viz
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: vr-qc-depth-breadth
      id_col: sample
      title_col: sample
      selection_source: any
      sections:
        Alignment: [num_reads_mapped, pct_reads_mapped, coverage_median]
        Breadth: [pct_genome_covered_1x, pct_genome_covered_10x]
        Calls: [num_variants_snp, num_variants_indel, num_variants_total, lineage]
      labels:
        num_reads_mapped: Reads mapped
        pct_reads_mapped: Reads mapped (%)
        coverage_median: Median depth
        pct_genome_covered_1x: Genome at 1x (%)
        pct_genome_covered_10x: Genome at 10x (%)
        num_variants_snp: SNPs
        num_variants_indel: Indels
        num_variants_total: Variants
        lineage: Pangolin lineage
    section: Depth and breadth
    tag: vr-qc-sample-record
    index: qc-sample-record
    title: Sample record
    description: The sample picked in the scatter or the run summary, with its alignment, breadth and calls.
    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: figure
    workflow_tag: viralrecon
    data_collection_tag: nextclade_results
    use: nextclade/report
    visu_type: bar
    mode: code
    code_content: |-
      # Nextclade's reading of each consensus genome, in two panels because the counts differ by
      # orders of magnitude: the substitutions and deleted bases it finds against the reference
      # (top) and the bases it could not read (bottom, log axis), the most missing bases first.
      # The dot above each bottom bar is the sample's Nextclade QC verdict.
      colors = depictio_category_colors.get('qc_overallStatus') or {}
      names = {'totalSubstitutions': 'Substitutions', 'totalDeletions': 'Deleted bases', 'totalMissing': 'Missing bases'}
      d = df.with_columns(pl.col('totalMissing').fill_null(0)).sort(['totalMissing', 'sample'], descending=[True, False])
      long = d.select(['sample', *names.keys()]).unpivot(index='sample', variable_name='kind', value_name='n').with_columns(pl.col('n').fill_null(0), pl.col('kind').replace(names))
      fig = px.bar(long.to_pandas(), x='sample', y='n', color='kind', custom_data=['sample'], category_orders={'sample': d.get_column('sample').to_list(), 'kind': list(names.values())}, labels={'sample': '', 'n': '', 'kind': ''})
      bars = fig
      fig = go.Figure()
      fig.set_subplots(rows=2, cols=1, shared_xaxes=True, row_heights=[0.5, 0.5], vertical_spacing=0.08)
      for trace in bars.data:
          fig.add_trace(trace, row=2 if trace.name == 'Missing bases' else 1, col=1)
      for status in ['good', 'mediocre', 'bad']:
          sub = d.filter(pl.col('qc_overallStatus') == status)
          if not sub.is_empty():
              fig.add_scatter(x=sub.get_column('sample').to_list(), y=[max(m, 1) * 1.5 for m in sub.get_column('totalMissing').to_list()], mode='markers', name='Nextclade QC ' + status, marker=dict(color=colors.get(status), size=10), customdata=[[s] for s in sub.get_column('sample').to_list()], hovertemplate='%{x}: ' + status + '<extra></extra>', row=2, col=1)
      fig.update_yaxes(title_text='Differences', row=1, col=1)
      fig.update_yaxes(title_text='Missing bases', type='log', row=2, col=1)
      fig.update_xaxes(tickangle=-45, tickfont={'size': 9})
      fig.update_layout(barmode='stack', margin=dict(t=10), legend=dict(orientation='h', y=-0.3))
    selection_enabled: true
    selection_column: sample
    section: Diagnostics
    tag: vr-qc-nextclade-load
    index: qc-nextclade-load
    title: Differences and missing bases per consensus genome (Nextclade)
    description: Substitutions and deleted bases above, bases it could not read below (log axis); a tall green bar or a red dot is worth a look.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    use: multiqc/summary_metrics
    visu_type: bar
    mode: code
    code_content: |-
      # Samples ordered by 10x breadth. The order is pinned on the axis:
      # plotly regroups categories by trace otherwise, which breaks the sort.
      order = df.sort('pct_genome_covered_10x', descending=True, nulls_last=True)['sample'].to_list()
      d = df.select('sample', 'pct_genome_covered_1x', 'pct_genome_covered_10x').unpivot(index='sample', variable_name='depth', value_name='breadth').with_columns(pl.col('depth').replace({'pct_genome_covered_1x': 'at 1x', 'pct_genome_covered_10x': 'at 10x'}))
      fig = px.bar(d.to_pandas(), x='sample', y='breadth', color='depth', barmode='group', labels={'sample': 'Sample', 'breadth': 'Genome covered (%)', 'depth': 'Depth'})
      # 80%: the template's breadth floor for a usable consensus.
      fig.add_hline(y=80, line_dash='dash', annotation_text='80%')
      fig.update_xaxes(tickangle=-45, tickfont={'size': 9}, categoryorder='array', categoryarray=order)
      fig.update_layout(margin=dict(t=10))
    section: Breadth per sample
    tag: vr-qc-breadth
    index: qc-breadth
    title: Genome covered at 1x and 10x per sample
    description: The gap between the two bars is genome covered, but not deeply enough to call.
    layout: {x: 0, y: 0, w: 8, h: 4}
- title: Coverage & Depth
  subtitle: Where along the genome does each sample lose depth?
  tab_group: Data & QC
  tab_order: 3
  tab_icon: mdi:chart-areaspline
  tab_icon_color: cyan
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 746b0f3c1e4a2d7f8e5b9cb5
  # The genome-depth slider reads mosdepth_genome_coverage, which a run
  # without a primer scheme keeps when it drops the amplicon tables.
  filter_sections:
  - name: Coverage filters
    icon: mdi:filter-variant
    color: cyan
    description: Narrows the windows and amplicons by depth
  grid_sections:
  - name: Coverage at a glance
    icon: mdi:counter
    color: cyan
    description: Depth per window and per amplicon over the samples in view
  - name: Along the genome
    icon: mdi:chart-line
    color: cyan
    description: Depth per 200 bp window, one lane per sample
  - name: Per amplicon
    icon: mdi:chart-timeline-variant
    color: cyan
    description: Median depth of each amplicon, and one lane per sample; pick one to isolate it
  - name: Amplicon patterns
    icon: mdi:chart-box-outline
    color: gray
    description: Depth per sample and amplicon, clustered
    collapsed: true
  - name: Amplicon table
    icon: mdi:table
    color: gray
    description: Depth per sample and amplicon
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      An amplicon dropout is a stretch of the genome whose PCR product failed, so too few reads
      cover it and the consensus masks it. Depth comes from
      [mosdepth](https://github.com/brentp/mosdepth), per 200 bp window and per amplicon; a gap in
      the genome track is a dropout. Open a dropout in the genome browser of the
      [Variants](tab:Variants) tab to see the reads and the primers at the spot; picking an
      amplicon in the second plot isolates it.
    tag: vr-cov-intro
    index: cov-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: mosdepth_genome_coverage
    interactive_component_type: RangeSlider
    column_name: coverage
    column_type: float64
    display:
      icon_name: mdi:chart-line
      custom_color: cyan
    section: Coverage filters
    group: Depth
    tag: vr-cov-filter-genome-depth
    index: cov-genome-depth
    title: Window depth
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: mosdepth_amplicon_coverage
    interactive_component_type: MultiSelect
    column_name: region
    column_type: object
    display:
      icon_name: mdi:vector-line
      custom_color: cyan
    section: Coverage filters
    group: Depth
    tag: vr-cov-filter-amplicon
    index: cov-amplicon
    title: Amplicon
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: mosdepth_amplicon_coverage
    interactive_component_type: RangeSlider
    column_name: coverage
    column_type: int64
    display:
      icon_name: mdi:chart-areaspline
      custom_color: cyan
    section: Coverage filters
    group: Depth
    tag: vr-cov-filter-amplicon-depth
    index: cov-amplicon-depth
    title: Amplicon depth
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: mosdepth_genome_coverage
    use: mosdepth/genome_coverage
    aggregation: median
    column_name: coverage
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-line
      icon_color: cyan.4
      caption: per window, with its distribution
      decimals: 0
    section: Coverage at a glance
    tag: vr-cov-card-genome-depth
    index: cov-card-genome-depth
    title: Window depth
    description: Median depth over every sample and 200 bp window in view.
    layout: {x: 0, y: 0, w: 2, h: 2}
  # 10x: the depth under which the consensus masks a position. No trend along
  # `start`: its first-to-last change ("1 → 3 ▲ 200%") reads as growth over
  # time, which a genome position is not.
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: mosdepth_genome_coverage
    use: mosdepth/genome_coverage
    aggregation: count
    column_name: coverage
    column_type: float64
    filter_expr: col('coverage') < 10
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-timeline-variant
      icon_color: cyan.6
      caption: their depth, from no reads to just under 10x
      decimals: 0
    section: Coverage at a glance
    tag: vr-cov-card-low-windows
    index: cov-card-low-windows
    title: Windows under 10x
    description: Sample and window pairs under 10x, which the consensus masks; a bar at 0 is a true gap, the rest thin coverage.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: mosdepth_amplicon_coverage
    use: mosdepth/amplicon_coverage
    aggregation: median
    column_name: coverage
    column_type: int64
    secondary_layout: threshold
    threshold_value: 10
    threshold_direction: min
    display:
      icon_name: mdi:chart-areaspline
      icon_color: cyan.8
      caption: sample and amplicon pairs against 10x
      decimals: 0
    section: Coverage at a glance
    tag: vr-cov-card-amplicon-depth
    index: cov-card-amplicon-depth
    title: Amplicon depth
    description: Median depth over every sample and amplicon in view; the bar counts the pairs at 10x or more.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: mosdepth_amplicon_coverage
    use: mosdepth/amplicon_coverage
    aggregation: nunique
    column_name: region
    column_type: object
    filter_expr: col('coverage') < 10
    secondary_layout: uniqueness
    display:
      icon_name: mdi:alert-outline
      icon_color: cyan.9
      caption: and the one that drops out most often
      decimals: 0
    section: Coverage at a glance
    tag: vr-cov-card-dropouts
    index: cov-card-dropouts
    title: Amplicons under 10x
    description: Amplicons under 10x in at least one sample; one that fails in many samples points at its primers.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: viralrecon
    use: mosdepth/coverage_track_genome
    data_collection_tag: coverage_track_canonical
    config:
      end_col: end
      sample_col: sample
      y_scale: linear
      smoothing_window: 5
      show_annotation_lane: false
      views: [track]
    section: Along the genome
    tag: vr-cov-genome-track
    index: cov-genome-track
    title: Depth along the genome
    description: One lane per sample on a linear axis; a dropout reads as a gap.
    layout: {x: 0, y: 0, w: 8, h: 3}
  # The pick figure: one point per amplicon, at its start, as high as the median
  # depth over the samples in view. A pick filters mosdepth_amplicon_coverage on
  # region, which narrows the lanes beside it and the table. custom_data carries
  # the region the selection reads.
  - component_type: figure
    workflow_tag: viralrecon
    data_collection_tag: mosdepth_amplicon_coverage
    use: mosdepth/amplicon_coverage
    visu_type: scatter
    mode: code
    code_content: |-
      # Median depth of each amplicon over the samples in view, along the genome,
      # on a log axis floored at 1x. The dashed line is the 10x the consensus
      # needs; a point under it is an amplicon that drops out.
      d = df.group_by(['region', 'start']).agg(pl.col('coverage').median().alias('depth')).sort('start')
      d = d.with_columns(pl.col('depth').clip(lower_bound=1))
      fig = px.scatter(d.to_pandas(), x='start', y='depth', log_y=True, custom_data=['region'], hover_name='region', labels={'start': 'Genome position', 'depth': 'Median depth'})
      fig.update_traces(marker=dict(size=8))
      fig.add_hline(y=10, line_dash='dash')
      fig.update_yaxes(dtick=1)
      fig.update_layout(margin=dict(t=10))
    selection_enabled: true
    selection_column: region
    section: Per amplicon
    tag: vr-cov-amplicon-pick
    index: cov-amplicon-pick
    title: Median depth per amplicon
    description: Pick an amplicon to read its depth per sample beside it.
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: advanced_viz
    workflow_tag: viralrecon
    use: mosdepth/coverage_track_amplicon
    data_collection_tag: mosdepth_amplicon_coverage
    config:
      category_col: region
      sample_col: sample
      value_col: coverage
      y_scale: log
      views: [track]
    section: Per amplicon
    tag: vr-cov-amplicon-track
    index: cov-amplicon-track
    title: Depth per amplicon, by sample
    description: One lane per sample on a log axis; the amplicon filter on the left narrows it.
    layout: {x: 4, y: 0, w: 4, h: 5}
  # Blues, low to high: a weak amplicon or sample reads pale.
  - component_type: advanced_viz
    workflow_tag: viralrecon
    data_collection_tag: complex_heatmap_canonical
    use: mosdepth/complex_heatmap
    config:
      viz_kind: complex_heatmap
      index_column: sample
      cluster_rows: true
      cluster_cols: false
      normalize: none
      colorscale: Blues
    section: Amplicon patterns
    tag: vr-cov-heatmap
    index: cov-heatmap
    title: Amplicon depth per sample (clustered)
    description: Log10 depth, samples clustered, amplicons in scheme order. A pale column is a weak amplicon of the scheme, a pale row a weak sample, an isolated pale cell a likely primer-site mutation.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: viralrecon
    data_collection_tag: mosdepth_amplicon_coverage
    use: mosdepth/amplicon_coverage
    row_selection_enabled: true
    row_selection_column: region
    section: Amplicon table
    tag: vr-cov-amplicon-table
    index: cov-amplicon-table
    title: Depth per sample and amplicon
    description: Tick a row to narrow the dashboard to its amplicon.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Variants
  subtitle: Which mutations does each sample carry, and how well supported?
  tab_group: Mutations
  tab_order: 4
  tab_icon: mdi:dna
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 746b0f3c1e4a2d7f8e5b9cb4
  filter_sections:
  - name: Variant filters
    icon: mdi:filter-variant
    color: violet
    description: Narrows the calls by gene, effect and support
  # A separate collection on purpose: the mutation type narrows the matrix
  # without touching the calls above it.
  - name: Matrix filter
    icon: mdi:relation-many-to-many
    color: violet
    description: Narrows the mutation matrix only
    collapsed: true
  grid_sections:
  - name: Calls at a glance
    icon: mdi:counter
    color: violet
    description: How many calls, how distinct, and how well supported
  # The navigator and the browser share one screen: pick a call and the browser
  # opens on its position, with the reads and variants of the samples carrying it.
  - name: Along the genome
    icon: mdi:chart-timeline-variant
    color: violet
    description: Calls by position and frequency; the browser below follows the pick, the brush and the window
    display: linked
  - name: Support
    icon: mdi:chart-bell-curve
    color: violet
    description: Allele frequency of the calls against the cut-off the consensus takes
  - name: Co-occurrence
    icon: mdi:relation-many-to-many
    color: gray
    description: Which genes carry calls in which samples
  - name: Genes and effects
    icon: mdi:chart-bar
    color: gray
    description: Calls per gene and per sample, and the lollipop per gene
    collapsed: true
  - name: Variant table
    icon: mdi:table
    color: gray
    description: Every call with its support and annotation; a row click centres the genome browser on it
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      Every variant call ([iVar](https://andersen-lab.github.io/ivar/html/) by default) with its
      [snpEff](https://pcingola.github.io/SnpEff/) effect, one row per sample and mutation. A
      call at an allele frequency of 0.75 or more enters the consensus. Pick a dot or a table
      row to open that position in the genome browser, which opens on the best supported call (the
      highest allele frequency, then depth, intergenic calls last); the left panel narrows the calls
      by gene, effect and support.
    tag: vr-var-intro
    index: var-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    interactive_component_type: MultiSelect
    column_name: GENE
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: violet
    section: Variant filters
    group: Call properties
    tag: vr-var-filter-gene
    index: var-gene-filter
    title: Gene
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    interactive_component_type: MultiSelect
    column_name: EFFECT
    column_type: object
    display:
      icon_name: mdi:alert-circle-outline
      custom_color: violet
    section: Variant filters
    group: Call properties
    tag: vr-var-filter-effect
    index: var-effect-filter
    title: Effect
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    interactive_component_type: MultiSelect
    column_name: FUNCLASS
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: violet
    section: Variant filters
    group: Call properties
    tag: vr-var-filter-funclass
    index: var-funclass-filter
    title: Functional class
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    interactive_component_type: RangeSlider
    column_name: AF
    column_type: float64
    display:
      icon_name: mdi:percent-outline
      custom_color: violet
    section: Variant filters
    group: Support
    tag: vr-var-filter-af
    index: var-af-filter
