    color: gray
    description: Every call of the gene with its support and annotation
    collapsed: true
  components:
  # always_selected: the plots show one gene, so the picker
  # always names one. default_by ranks by allele frequency, descending: the tab
  # opens on the gene holding the best supported call. No banner_facts: the
  # value is the gene itself.
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    interactive_component_type: Select
    always_selected: true
    default_by: AF
    default_order: desc
    column_name: GENE
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: lime
    placement: left
    section: Gene pick
    group: Gene
    tag: vr2-ge-filter-gene
    index: vr2-ge-filter-gene
    title: Gene
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    interactive_component_type: MultiSelect
    column_name: EFFECT
    column_type: object
    display:
      icon_name: mdi:alert-circle-outline
      custom_color: violet
    placement: left
    section: Gene pick
    group: Mutations
    tag: vr2-ge-filter-effect
    index: vr2-ge-effect-filter
    title: Effect
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: text
    order: 1
    body: >
      Pick a gene on the left, and the lollipop gives each mutation's allele frequency along
      the gene while the dots give it sample by sample. Pick a stem or a sample to narrow the
      other plot and the table to that one. Open a mutation in the genome browser of the
      [Variants](tab:Variants) tab to read it against the [ARTIC](https://artic.network) primers
      and the reads.
    tag: vr2-ge-intro
    index: vr2-ge-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    aggregation: count
    column_name: POS
    column_type: int64
    secondary_layout: composition
    breakdown_col: FUNCLASS
    display:
      icon_name: mdi:dna
      icon_color: grape
      caption: calls, by functional class
      decimals: 0
    section: Gene at a glance
    tag: vr2-ge-card-calls
    index: vr2-ge-card-calls
    title: Variant calls
    description: Calls in the picked gene, one per sample and mutation.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    aggregation: nunique
    column_name: mutation_label
    column_type: object
    secondary_layout: uniqueness
    display:
      icon_name: mdi:map-marker-outline
      icon_color: orange
      caption: and the one most samples share
      decimals: 0
    section: Gene at a glance
    tag: vr2-ge-card-mutations
    index: vr2-ge-card-mutations
    title: Distinct mutations
    description: Distinct mutations of the picked gene; one that many samples share is a lineage marker.
    layout: {x: 2, y: 0, w: 2, h: 2}
  # 0.75: the allele frequency at which viralrecon's consensus takes a call.
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    aggregation: median
    column_name: AF
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.75
    threshold_direction: min
    display:
      icon_name: mdi:percent-outline
      icon_color: pink
      caption: calls against the 0.75 consensus cut-off
      decimals: 2
    section: Gene at a glance
    tag: vr2-ge-card-af
    index: vr2-ge-card-af
    title: Allele frequency
    description: Median allele frequency of the gene's calls; the bar counts those the consensus takes.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    aggregation: median
    column_name: DP
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:layers-outline
      icon_color: teal
      caption: median per call, with its spread
      decimals: 0
    section: Gene at a glance
    tag: vr2-ge-card-depth
    index: vr2-ge-card-depth
    title: Read depth
    description: Median read depth at the positions of the gene's calls.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # A stem is a mutation: a pick emits mutation_label, which narrows the table
  # and the cards to it.
  - component_type: advanced_viz
    workflow_tag: viralrecon
    use: ivar/lollipop
    data_collection_tag: variants_long
    config:
      effect_col: AF
      label_col: mutation_label
      max_subplot_genes: 6
      selection_enabled: true
      selection_column: mutation_label
    section: Mutations in the gene
    tag: vr2-ge-lollipop
    index: vr2-ge-lollipop
    title: Mutations along the gene (lollipop)
    description: One stem per mutation, as high as its allele frequency; pick one to narrow the table to it.
    layout: {x: 0, y: 0, w: 5, h: 6}
  - component_type: figure
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    visu_type: scatter
    mode: code
    code_content: |-
      # Allele frequency of every call of the gene, one dot per call, samples
      # ordered by their best supported call. The colour is the snpEff effect, or
      # Analysis mode's groups when it has some; the dashed line is the 0.75
      # consensus cut-off. custom_data carries the sample the selection reads.
      d = df.filter(pl.col('AF').is_not_null())
      order = d.group_by('sample').agg(pl.col('AF').max().alias('top')).sort('top', descending=True)['sample'].to_list()
      kw = depictio_group_kwargs or {'color': 'EFFECT', 'color_discrete_map': depictio_category_colors.get('EFFECT') or {}}
      fig = px.scatter(d.to_pandas(), x='sample', y='AF', custom_data=['sample'], hover_name='mutation_label', labels={'sample': 'Sample', 'AF': 'Allele frequency', 'EFFECT': 'Effect'}, **kw)
      fig.update_traces(marker=dict(size=9))
      fig.add_hline(y=0.75, line_dash='dash')
      fig.update_xaxes(tickangle=-45, tickfont={'size': 9}, categoryorder='array', categoryarray=order)
      fig.update_yaxes(range=[0, 1.05])
      fig.update_layout(showlegend=False, margin=dict(t=10))
    selection_enabled: true
    selection_column: sample
    section: Mutations in the gene
    tag: vr2-ge-af-by-sample
    index: vr2-ge-af-by-sample
    title: Allele frequency per sample
    description: One dot per call, coloured by effect; pick a sample to narrow the table to it.
    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: table
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    row_selection_enabled: true
    row_selection_column: mutation_label
    section: Mutations
    tag: vr2-ge-table
    index: vr2-ge-table
    title: Mutations of the gene
    description: Tick a row to narrow the plots to that mutation.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Sample
  subtitle: What does one sample's genome look like, from reads to variants?
  tab_group: Mutations
  tab_order: 6
  tab_icon: mdi:test-tube
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 746b0f3c1e4a2d7f8e5c2d07
  # The picker reads summary_metrics, the hub every link starts from, so its
  # pick reaches the calls, the depth and the tracks of the sample.
  filter_sections:
  - name: Sample pick
    icon: mdi:tune
    color: teal
    description: Choose the sample the tab shows, and the calls it keeps
  grid_sections:
  - name: Sample at a glance
    icon: mdi:counter
    color: teal
    description: The calls, their support and the depth of the picked sample
  # The call picker and the record card share one screen: pick a call and the
  # card reads it out.
  - name: The sample's genome
    icon: mdi:dna
    color: teal
    description: The sample's calls along the genome, beside the one picked
    display: linked
  - name: Depth along the genome
    icon: mdi:chart-line
    color: teal
    description: Depth per 200 bp window; a dropout reads as a gap
  - name: Variant table
    icon: mdi:table
    color: gray
    description: Every call of the sample with its support and annotation
    collapsed: true
  components:
  # always_selected: the cards and the tracks show one sample, so
  # the picker always names one. default_by ranks by median depth, descending:
  # the tab opens on the best covered sample, whose calls are best supported.
  # banner_facts read the sample's row of the run summary.
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    interactive_component_type: Select
    always_selected: true
    default_by: coverage_median
    default_order: desc
    banner_facts:
    - {column: lineage, label: Lineage, icon: 'tabler:dna-2'}
    - {column: pct_genome_covered_10x, label: Genome at 10x (%), format: 'decimals:1', icon: 'tabler:chart-area-line'}
    - {column: coverage_median, label: Median depth, format: si, icon: 'tabler:layers-intersect'}
    - {column: num_variants_total, label: Variants, format: integer, icon: 'tabler:variable'}
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    placement: left
    section: Sample pick
    group: Sample
    tag: vr2-sm-filter-sample
    index: vr2-sm-filter-sample
    title: Sample
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    interactive_component_type: RangeSlider
    column_name: AF
    column_type: float64
    display:
      icon_name: mdi:percent-outline
      custom_color: pink
    placement: left
    section: Sample pick
    group: Calls
    tag: vr2-sm-filter-af
    index: vr2-sm-filter-af
    title: Allele frequency
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: text
    order: 1
    body: >
      Pick a sample on the left and the tab shows that one alone: its calls along the genome,
      with the one picked read out beside them. The depth track below shows where its coverage
      fell away. Open a call in the genome browser of the [Variants](tab:Variants) tab to read
      its reads.
    tag: vr2-sm-intro
    index: vr2-sm-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    aggregation: count
    column_name: POS
    column_type: int64
    secondary_layout: composition
    breakdown_col: FUNCLASS
    display:
      icon_name: mdi:dna
      icon_color: grape
      caption: calls, by functional class
      decimals: 0
    section: Sample at a glance
    tag: vr2-sm-card-calls
    index: vr2-sm-card-calls
    title: Variant calls
    description: Calls of the picked sample, one per mutation.
    layout: {x: 0, y: 0, w: 2, h: 2}
  # 0.75: the allele frequency at which viralrecon's consensus takes a call.
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    aggregation: median
    column_name: AF
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.75
    threshold_direction: min
    display:
      icon_name: mdi:percent-outline
      icon_color: pink
      caption: calls against the 0.75 consensus cut-off
      decimals: 2
    section: Sample at a glance
    tag: vr2-sm-card-af
    index: vr2-sm-card-af
    title: Allele frequency
    description: Median allele frequency of the sample's calls; the bar counts those the consensus takes.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: mosdepth_amplicon_coverage
    use: mosdepth/amplicon_coverage
    aggregation: median
    column_name: coverage
    column_type: int64
    secondary_layout: threshold
    threshold_value: 10
    threshold_direction: min
    display:
      icon_name: mdi:chart-areaspline
      icon_color: teal
      caption: amplicons against 10x
      decimals: 0
    section: Sample at a glance
    tag: vr2-sm-card-amplicon-depth
    index: vr2-sm-card-amplicon-depth
    title: Amplicon depth
    description: Median depth over the sample's amplicons; the bar counts those at 10x or more.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: mosdepth_genome_coverage
    use: mosdepth/genome_coverage
    aggregation: count
    column_name: coverage
    column_type: float64
    filter_expr: col('coverage') < 10
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-timeline-variant
      icon_color: orange
      caption: their depth, from no reads to just under 10x
      decimals: 0
    section: Sample at a glance
    tag: vr2-sm-card-low-windows
    index: vr2-sm-card-low-windows
    title: Windows under 10x
    description: 200 bp windows of the sample under 10x, which the consensus masks; a bar at 0 is a true gap.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # The call picker of the linked section: the Variants tab's Manhattan, on the
  # picked sample's calls. A pick emits the mutation, which the record card
  # follows. The table sits in its own section below.
  - component_type: advanced_viz
    workflow_tag: viralrecon
    use: ivar/manhattan
    data_collection_tag: variants_long
    config:
      feature_col: mutation_label
      score_kind: Allele frequency (AF)
      # 0.75: the allele frequency at which the consensus takes a call.
      score_threshold: 0.75
      top_n_labels: 0
      marker_size_above: 12
      color_by_columns:
      - EFFECT
      - FUNCLASS
      - sample
      default_color_by: EFFECT
      hover_cols: [GENE, AA, EFFECT, DP]
      selection_enabled: true
      selection_column: mutation_label
    section: The sample's genome
    tag: vr2-sm-manhattan
    index: vr2-sm-manhattan
    title: Calls along the genome
    description: Pick a call to read it out beside the plot.
    layout: {x: 0, y: 0, w: 5, h: 5}
  # No default_record: the card waits for a pick. It follows the call picked in
  # the Manhattan and shows that call's row of the picked sample.
  - component_type: advanced_viz
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: vr2-sm-manhattan
      id_col: mutation_label
      title_col: mutation_label
      selection_source: any
      sections:
        Call: [GENE, AA, EFFECT, FUNCLASS]
        Support: [AF, DP, REF_DP, ALT_DP]
        Position: [CHROM, POS, REF, ALT]
      labels:
        GENE: Gene
        AA: Amino acid change
        EFFECT: Effect
        FUNCLASS: Functional class
        AF: Allele frequency
        DP: Read depth
        REF_DP: Reference reads
        ALT_DP: Alternate reads
        CHROM: Reference sequence
        POS: Position
        REF: Reference base
        ALT: Alternate base
    section: The sample's genome
    tag: vr2-sm-record
    index: vr2-sm-record
    title: Picked mutation
    description: The call picked in the plot, with its gene, effect and read support.
    layout: {x: 5, y: 0, w: 3, h: 5}
  - component_type: advanced_viz
    workflow_tag: viralrecon
    use: mosdepth/coverage_track_genome
    data_collection_tag: coverage_track_canonical
    config:
      end_col: end
      sample_col: sample
      y_scale: linear
      smoothing_window: 5
      show_annotation_lane: false
      views: [track]
    section: Depth along the genome
    tag: vr2-sm-genome-track
    index: vr2-sm-genome-track
    title: Depth along the genome
    description: The picked sample on a linear axis; a dropout reads as a gap.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    row_selection_enabled: true
    row_selection_column: mutation_label
    section: Variant table
    tag: vr2-sm-var-table
    index: vr2-sm-var-table
    title: Variant calls
    description: Tick a row to read the call out in the card above.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Lineage & Clustering
  subtitle: Which lineage and clade is each sample, and do they agree?
  tab_group: Typing
  tab_order: 7
  tab_icon: mdi:virus
  tab_icon_color: red
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 746b0f3c1e4a2d7f8e5c2d06
  filter_sections:
  - name: Typing filters
    icon: mdi:filter-variant
    color: red
    description: Narrows the samples by their calls and the QC verdict on each
  grid_sections:
  - name: Typing at a glance
    icon: mdi:counter
    color: red
    description: Lineages, clades and the quality of the consensus they were called from
  - name: Classification flow
    icon: mdi:relation-many-to-many
    color: red
    description: Each sample from its QC verdict to its lineage and its clade
  - name: Variant profiles
    icon: mdi:set-merge
    color: red
    description: Samples placed by shared mutations; a click on an UpSet bar lists them below
  # Collapsed: the open sections already fill the tab. Opens on its own table.
  - name: Mutations in an intersection
    icon: mdi:table
    color: gray
    description: A click on an UpSet intersection lists its mutations, genes, effects and samples
    collapsed: true
  - name: Calls per lineage and clade
    icon: mdi:chart-bar
    color: gray
    description: Samples per Pangolin lineage and per Nextclade clade
    collapsed: true
  - name: Typing tables
    icon: mdi:table
    color: gray
    description: The Pangolin and Nextclade reports, with a record of the picked call
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      [Pangolin](https://github.com/cov-lineages/pangolin) names each consensus genome's
      lineage and [Nextclade](https://clades.nextstrain.org) its clade, each with a QC verdict.
      The Sankey follows every sample from its verdict to both calls; the PCA and the UpSet group
      samples by the mutations they share.
    tag: vr2-lin-intro
    index: vr2-lin-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: pangolin_lineages
    interactive_component_type: MultiSelect
    column_name: lineage
    column_type: object
    display:
      icon_name: mdi:virus
      custom_color: red
    section: Typing filters
    group: Calls
    tag: vr2-lin-filter-lineage
    index: vr2-lin-lineage-filter
    title: Lineage
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: nextclade_results
    interactive_component_type: MultiSelect
    column_name: clade
    column_type: object
    display:
      icon_name: mdi:family-tree
      custom_color: grape
    section: Typing filters
    group: Calls
    tag: vr2-lin-filter-clade
    index: vr2-lin-clade-filter
    title: Clade
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: pangolin_lineages
    interactive_component_type: MultiSelect
    column_name: qc_status
    column_type: object
    display:
      icon_name: mdi:check-decagram
      custom_color: pink
    section: Typing filters
    group: QC verdicts
    tag: vr2-lin-filter-pangolin-qc
    index: vr2-lin-pangolin-qc
    title: Pangolin QC
    layout: {x: 0, y: 6, w: 1, h: 2}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: nextclade_results
    interactive_component_type: MultiSelect
    column_name: qc_overallStatus
    column_type: object
    display:
      icon_name: mdi:shield-check-outline
      custom_color: green
    section: Typing filters
    group: QC verdicts
    tag: vr2-lin-filter-nextclade-qc
    index: vr2-lin-nextclade-qc
    title: Nextclade QC
    layout: {x: 0, y: 8, w: 1, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: pangolin_lineages
    use: pangolin/report
    aggregation: nunique
    column_name: lineage
    column_type: object
    filter_expr: col('lineage') != 'Unassigned'
    secondary_layout: composition
    breakdown_col: lineage
    display:
      icon_name: mdi:virus
      icon_color: red
      caption: samples per assigned lineage
      decimals: 0
    section: Typing at a glance
    tag: vr2-lin-card-lineages
    index: vr2-lin-card-lineages
    title: Lineages
    description: Distinct Pangolin lineages, unassigned genomes left out. The bar splits the samples by lineage.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: nextclade_results
    use: nextclade/report
    aggregation: nunique
    column_name: clade
    column_type: object
    secondary_layout: donut
    breakdown_col: clade
    display:
      icon_name: mdi:family-tree
      icon_color: grape
      caption: samples per clade
      decimals: 0
    section: Typing at a glance
    tag: vr2-lin-card-clades
    index: vr2-lin-card-clades
    title: Clades
    description: Distinct Nextclade clades. The ring splits the samples by clade.
    layout: {x: 2, y: 0, w: 2, h: 2}
  # Nextclade's own marks: an overall score under 30 is good, 100 or more bad.
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: nextclade_results
    use: nextclade/report
    aggregation: median
    column_name: qc_overallScore
    column_type: float64
    secondary_layout: threshold
    threshold_value: 30
    threshold_direction: max
    threshold_warn: 100
    display:
      icon_name: mdi:shield-check-outline
      icon_color: green
      caption: genomes against Nextclade's good and bad marks
      decimals: 1
    section: Typing at a glance
    tag: vr2-lin-card-qc-score
    index: vr2-lin-card-qc-score
    title: Nextclade QC score
    description: Median overall QC score of the consensus genomes; lower is better.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: nextclade_results
    use: nextclade/report
    aggregation: median
    column_name: totalMissing
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:alert-outline
      icon_color: orange
      caption: median per genome, with its spread
      decimals: 0
    section: Typing at a glance
    tag: vr2-lin-card-missing
    index: vr2-lin-card-missing
    title: Missing bases
    description: Median count of N bases in the consensus genomes, the bases a call cannot read.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: viralrecon
    data_collection_tag: sankey_canonical
    viz_kind: sankey
    config:
      viz_kind: sankey
      step_cols:
      - qc_status
      - lineage
      - clade
      value_col: null
      sort_mode: total_flow
      # Every flow leaves the one QC verdict "pass" on most runs: coloured by
      # source, they would all take its colour.
      color_mode: target
      link_opacity: 0.5
