  - component_type: figure
    workflow_tag: viralrecon
    data_collection_tag: pangolin_lineages
    use: pangolin/report
    visu_type: bar
    mode: code
    code_content: |-
      # Samples per Pangolin lineage: the eight largest, the rest folded into
      # Other, in the family's lineage colours.
      d = df.filter(pl.col('lineage').is_not_null()).group_by('lineage').agg(pl.len().alias('samples')).sort(['samples', 'lineage'], descending=[True, False])
      top = d['lineage'].head(8).to_list()
      d = d.with_columns(pl.when(pl.col('lineage').is_in(top)).then(pl.col('lineage')).otherwise(pl.lit('Other')).alias('lineage')).group_by('lineage').agg(pl.col('samples').sum()).sort('samples', descending=True)
      fig = px.bar(d.to_pandas(), x='lineage', y='samples', color='lineage', color_discrete_map=depictio_category_colors.get('lineage') or {}, labels={'lineage': 'Pangolin lineage', 'samples': 'Samples'})
      fig.update_layout(showlegend=False, margin=dict(t=10))
      # A count axis in whole steps: a short one otherwise ticks 0.5.
      fig.update_yaxes(dtick=max(1, round((d['samples'].max() or 0) / 5)))
    section: Calls per lineage and clade
    tag: vr2-lin-lineage-bar
    index: vr2-lin-lineage-bar
    title: Samples per lineage
    layout: {x: 0, y: 0, w: 4, h: 4, fit: auto}
  - component_type: figure
    workflow_tag: viralrecon
    data_collection_tag: nextclade_results
    use: nextclade/report
    visu_type: bar
    mode: code
    code_content: |-
      # Samples per Nextclade clade: the eight largest, the rest folded into
      # Other, in the family's clade colours.
      d = df.filter(pl.col('clade').is_not_null()).group_by('clade').agg(pl.len().alias('samples')).sort(['samples', 'clade'], descending=[True, False])
      top = d['clade'].head(8).to_list()
      d = d.with_columns(pl.when(pl.col('clade').is_in(top)).then(pl.col('clade')).otherwise(pl.lit('Other')).alias('clade')).group_by('clade').agg(pl.col('samples').sum()).sort('samples', descending=True)
      fig = px.bar(d.to_pandas(), x='clade', y='samples', color='clade', color_discrete_map=depictio_category_colors.get('clade') or {}, labels={'clade': 'Nextclade clade', 'samples': 'Samples'})
      fig.update_layout(showlegend=False, margin=dict(t=10))
      # A count axis in whole steps: a short one otherwise ticks 0.5.
      fig.update_yaxes(dtick=max(1, round((d['samples'].max() or 0) / 5)))
    section: Calls per lineage and clade
    tag: vr2-lin-clade-bar
    index: vr2-lin-clade-bar
    title: Samples per clade
    layout: {x: 4, y: 0, w: 4, h: 4, fit: auto}
