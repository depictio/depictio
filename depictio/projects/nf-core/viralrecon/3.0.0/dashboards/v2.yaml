# nf-core/viralrecon 3.0.0, preview: base.yaml with the genome browser in the
# tabs. Every rule it follows is written out in depictio/projects/nf-core/RULES.md.
#
# What differs from base.yaml: every tag and index carries a vr2- prefix and the
# family has its own dashboard ids, so both dashboards can be imported side by
# side. The Variants tab holds the only genome browser, on the `tracks`
# collection, in a `display: linked` section beside the Manhattan; the Coverage,
# Gene and Sample tabs reach it through the Open in genome browser action of
# their genomic plots. Two tabs are new (Sample, Gene), each opening on one pick.
#
# Routes: summary_metrics is the sample hub (the source of every link in
# template.yaml). A nanopore run (IS_NANOPORE) prunes it with the illumina-only
# variant collections, so the tabs keep a tab-local filter on a collection that
# route keeps (mosdepth, Pangolin, Nextclade, multiqc_data). A non-SARS run has
# no Pangolin or Nextclade output and loses those tiles with their data.
#
# Tables are full width in this family (a narrower table is only allowed beside
# its linked record card), so where a section needs a narrow pick list it draws
# a selectable figure, and the table sits in a collapsed section below.
main_dashboard:
  title: nf-core/viralrecon (preview)
  subtitle: Viral genomes, from reads to variants, consensus and lineage
  project_tag: Viralrecon Viral Genome Analysis
  main_tab_name: Overview
  tab_icon: mdi:compass-outline
  tab_icon_color: brandPrimary
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 746b0f3c1e4a2d7f8e5c2d01
  filter_panel_default: collapsed
  content_width_default: compact
  show_tab_header: false
  # Declared once here, read by every tab of the family: figures, advanced viz
  # and filter chips all colour a value the same way.
  category_colors:
    # Lineages and clades outnumber the palette on a large run: the import
    # ranks them by that column's sum in the collection the filter reads, and
    # gives the eight largest the palette. The lineage bar folds the rest into
    # Other.
    lineage:
      '*': 'auto:pct_genome_covered_1x'
      Unassigned: '#adb5bd'
      NA: '#ced4da'
      Other: '#868e96'
    clade:
      '*': 'auto:coverage'
      Other: '#868e96'
    qc_status:
      pass: '#2f9e44'
      fail: '#e03131'
    qc_overallStatus:
      good: '#2f9e44'
      mediocre: '#f59f00'
      bad: '#e03131'
    FUNCLASS:
      MISSENSE: '#e8590c'
      NONSENSE: '#c92a2a'
      SILENT: '#1c7ed6'
      OTHER: '#adb5bd'
    # snpEff effects, the same vocabulary in variants_long (EFFECT) and in the
    # oncoplot's table (mutation_type).
    EFFECT:
      '*': auto
      missense_variant: '#e8590c'
      synonymous_variant: '#2f9e44'
      stop_gained: '#c92a2a'
      frameshift_variant: '#ae3ec9'
      disruptive_inframe_deletion: '#1c7ed6'
      conservative_inframe_deletion: '#74c0fc'
      intergenic_region: '#adb5bd'
    mutation_type:
      '*': auto
      missense_variant: '#e8590c'
      synonymous_variant: '#2f9e44'
      stop_gained: '#c92a2a'
      frameshift_variant: '#ae3ec9'
      disruptive_inframe_deletion: '#1c7ed6'
      conservative_inframe_deletion: '#74c0fc'
      intergenic_region: '#adb5bd'
  # Persistent: drawn in every tab's filter panel, picks kept across tabs. Bound
  # to summary_metrics, the source of every sample link in template.yaml.
  filter_sections:
  - name: Sample filters
    icon: mdi:filter-variant
    color: teal
    description: Applies to every tab
    persistent: true
    pin: top
  - name: QC thresholds
    icon: mdi:tune
    color: cyan
    description: Coverage and yield floors, applied to every tab
    collapsed: true
    persistent: true
    pin: bottom
  grid_sections:
  - name: Key figures
    icon: mdi:counter
    color: gray
    appearance: plain
    card_variant: headline
    filter_bar: true
    visible_filters: 2
    description: The run in four numbers. The filters here narrow these four only.
  - name: Findings
    icon: mdi:star-outline
    color: gray
    appearance: plain
    figure_style: minimal
    filter_bar: true
    visible_filters: 2
    description: What the data says, each with the tab that shows it, then the figures behind it.
  - name: How to read this dashboard
    icon: mdi:information-outline
    color: gray
    appearance: plain
    description: The tabs by group, each with the question it answers.
  # Declared on the main tab rather than on an analysis tab: a run that prunes
  # that tab would take a persistent section declared there with it.
  - name: Sample sheet
    icon: mdi:table-account
    color: gray
    description: The run summary behind every tab, narrowed by the sample filters
    collapsed: true
    persistent: true
    pin: bottom
    exclude_tabs:
    - Overview
  components:
  # First in component order on purpose: the Guide demos the first categorical
  # filter that shares a data collection with the first card (Samples, below).
  # No lineage here: the summary's lineage is Pangolin's, so a run without
  # Pangolin output (non-SARS, or a partial run) would offer "NA" alone. The
  # sample and the 10x breadth are in every run's summary.
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Sample
    section: Key figures
    tag: vr2-ov-kf-sample
    index: vr2-ov-kf-sample
    title: Sample ID
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    interactive_component_type: RangeSlider
    column_name: pct_genome_covered_10x
    column_type: float64
    display:
      icon_name: mdi:chart-areaspline
      custom_color: cyan
      strip_label: 10x (%)
    section: Key figures
    tag: vr2-ov-kf-genome-10x-range
    index: vr2-ov-kf-genome-10x-range
    title: Genome at 10x (%)
    layout: {x: 2, y: 0, w: 2, h: 1}
  - component_type: text
    title: nf-core/viralrecon
    logo: https://raw.githubusercontent.com/nf-core/viralrecon/master/docs/images/nf-core-viralrecon_logo_light.png
    logo_dark: https://raw.githubusercontent.com/nf-core/viralrecon/master/docs/images/nf-core-viralrecon_logo_dark.png
    order: 1
    body: >
      Viral genomes from amplicon or metagenomic reads: how well each sample was covered, which
      variants it carries and which lineage it belongs to. [Run parameters](params:)
    tag: vr2-ov-hero
    index: vr2-ov-hero
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: text
    surface: card
    body: |
      ### About this dashboard
      nf-core/viralrecon aligns each sample's reads to the viral reference, calls its variants, builds a consensus genome and names its lineage. This page sums up one run; each tab behind it answers one question, in the order of the steps below.

      Read the tabs from left to right: data quality first (Sample QC, Coverage & Depth), then the mutations, from the cohort (Variants) to one gene (Gene) to one sample (Sample), then what they mean for typing (Lineage & Clustering).

      The sample filters in the left panel apply to every tab: narrow the samples once and the whole dashboard follows, and pin one sample there to open the Sample tab on it. A bar above a section narrows that section only.
    tag: vr2-ov-about
    index: vr2-ov-about
    layout: {x: 0, y: 1, w: 5, h: 3}
  # The run's own settings, read from its params.json: a key the run did not
  # set prints a dash.
  - component_type: text
    surface: card
    values:
      samples: {dc: summary_metrics, column: sample, aggregation: nunique, format: integer}
    body: |
      ### The run
      - ![](icon:mdi:flask-outline) **Samples** {{samples}}
      - ![](icon:mdi:chip) **Platform** {{param:platform}} · {{param:protocol}}
      - ![](icon:mdi:virus-outline) **Reference** {{param:genome}}
      - ![](icon:mdi:dna) **Primers** {{param:primer_set}} v{{param:primer_set_version}}
      - ![](icon:mdi:tune) **Callers** {{param:variant_caller}} · {{param:consensus_caller}}
    tag: vr2-ov-run
    index: vr2-ov-run
    layout: {x: 5, y: 1, w: 3, h: 3}
  # The marks take the family's colour (the header's), not the theme's blue.
  - component_type: text
    surface: card
    accent: green
    body: |
      ### Six steps from reads to lineages
      Each step names its settings and the tab that shows its result.

      ::: steps
      1. ![](icon:mdi:content-cut) **Trim** Adapters cut by fastp · [Settings](params:fastp) · [MultiQC](tab:MultiQC)
      2. ![](icon:mdi:target) **Align** Bowtie 2, primers clipped by iVar · [Settings](params:ivar_trim) · [Sample QC](tab:Sample QC)
      3. ![](icon:mdi:chart-areaspline) **Cover** Depth by mosdepth · [Settings](params:mosdepth) · [Coverage](tab:Coverage & Depth)
      4. ![](icon:mdi:dna) **Call** Variants by {{param:variant_caller}}, effects by snpEff · [Settings](params:variant) · [Variants](tab:Variants) · [Gene](tab:Gene)
      5. ![](icon:mdi:source-merge) **Consensus** One genome per sample · [Settings](params:consensus) · [Sample QC](tab:Sample QC) · [Sample](tab:Sample)
      6. ![](icon:mdi:virus) **Type** Pangolin lineage, Nextclade clade · [Settings](params:nextclade) · [Lineages](tab:Lineage & Clustering)
      :::
    tag: vr2-ov-steps
    index: vr2-ov-steps
    layout: {x: 0, y: 4, w: 8, h: 3}
  # Key figures: one card per stage of the funnel, each opening the tab that
  # explains it. The icon colour is that tab's colour. All four read
  # summary_metrics, the hub of every illumina run, and none splits by
  # lineage: a run without Pangolin output writes "NA" there. A nanopore run
  # prunes the hub (template.yaml), which keeps no collection of its own to
  # stand in: the fix is the hub's recipe (see docs/dashboards.md).
  # 1,000 reads: the pipeline's default --min_mapped_reads, under which a
  # sample is left out of variant calling. One row per sample, so the count of
  # mapped-read values is the sample count.
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    use: multiqc/summary_metrics
    aggregation: count
    column_name: num_reads_mapped
    column_type: float64
    secondary_layout: threshold
    threshold_value: 1000
    threshold_direction: min
    display:
      icon_name: mdi:flask-outline
      icon_color: orange
      caption: against the 1,000-read floor for calling
      link: tab:MultiQC
      decimals: 0
    section: Key figures
    tag: vr2-ov-kf-samples
    index: vr2-ov-kf-samples
    title: Samples
    description: Samples in the run summary. The bar counts those above the pipeline's default 1,000 mapped reads, the floor for variant calling.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    use: multiqc/summary_metrics
    aggregation: median
    column_name: coverage_median
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-line
      icon_color: indigo
      caption: median per sample, with its spread
      link: tab:Sample QC
      decimals: 0
    section: Key figures
    tag: vr2-ov-kf-depth
    index: vr2-ov-kf-depth
    title: Median depth
    description: Median of each sample's median depth along the genome. The box shows how it spreads.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    use: multiqc/summary_metrics
    aggregation: median
    column_name: pct_genome_covered_10x
    column_type: float64
    filter_expr: col('pct_genome_covered_10x').is_not_null()
    secondary_layout: coverage
    coverage_max: 100
    display:
      icon_name: mdi:chart-areaspline
      icon_color: teal
      caption: median share of the genome
      link: tab:Coverage & Depth
      decimals: 1
    section: Key figures
    tag: vr2-ov-kf-genome-10x
    index: vr2-ov-kf-genome-10x
    title: Genome at 10x (%)
    description: Median share of each sample's genome covered by 10 reads or more, the depth the consensus needs.
    layout: {x: 4, y: 0, w: 2, h: 2}
  # The summary writes NA for both counts of a sample no caller reached (a
  # partial run), which the recipe adds up to 0: those rows are left out, so
  # such a run reads "–" here, not 0.
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    use: multiqc/summary_metrics
    aggregation: median
    column_name: num_variants_total
    column_type: float64
    filter_expr: col('num_variants_snp').is_not_null() | col('num_variants_indel').is_not_null()
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:dna
      icon_color: grape
      caption: median per sample, with its spread
      link: tab:Variants
      decimals: 0
    section: Key figures
    tag: vr2-ov-kf-variants
    index: vr2-ov-kf-variants
    title: Variants per sample
    description: Median number of variants called per sample. The box shows how it spreads.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Findings filter bar: the sample, then the 10x breadth, on the hub; the
  # links carry the pick to every collection the figures below read.
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
      strip_label: Sample
    section: Findings
    tag: vr2-ov-findings-sample
    index: vr2-ov-findings-sample
    title: Sample ID
    layout: {x: 0, y: 0, w: 2, h: 1}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    interactive_component_type: RangeSlider
    column_name: pct_genome_covered_10x
    column_type: float64
    display:
      icon_name: mdi:chart-areaspline
      custom_color: cyan
      strip_label: 10x (%)
    section: Findings
    tag: vr2-ov-findings-genome-10x
    index: vr2-ov-findings-genome-10x
    title: Genome at 10x (%)
    layout: {x: 2, y: 0, w: 2, h: 1}
  # One result row per finding, each citing one data collection, so the import
  # removes a row with its data (a non-SARS run loses the Nextclade and
  # Pangolin rows, a nanopore run the variant row).
  - component_type: text
    surface: card
    values:
      n_good: {dc: nextclade_results, column: sample, aggregation: count, filter_expr: "col('qc_overallStatus') == 'good'",
        format: integer}
      n_cons: {dc: nextclade_results, column: sample, aggregation: count, format: integer}
      n_low: {dc: mosdepth_amplicon_coverage, column: region, aggregation: nunique, filter_expr: "col('coverage') < 10",
        format: integer}
      n_amp: {dc: mosdepth_amplicon_coverage, column: region, aggregation: nunique, format: integer}
      n_mis: {dc: variants_long, column: POS, aggregation: count, filter_expr: "col('FUNCLASS') == 'MISSENSE'",
        format: integer}
      n_calls: {dc: variants_long, column: POS, aggregation: count, format: integer}
      top: {dc: pangolin_lineages, column: lineage, aggregation: top, filter_expr: "col('lineage') != 'Unassigned'"}
      top_share: {dc: pangolin_lineages, column: lineage, aggregation: top_share, filter_expr: "col('lineage') != 'Unassigned'",
        format: percent}
    body: |
      - **{{n_good}}** of {{n_cons}} consensus genomes rated good by Nextclade – the rest are mediocre or bad [Sample QC](tab:Sample QC) · [Sample](tab:Sample)
      - **{{n_low}}** of {{n_amp}} amplicons fall under 10x in at least one sample – that stretch of its consensus is masked [Coverage](tab:Coverage & Depth)
      - **{{n_mis}}** of {{n_calls}} variant calls change an amino acid – missense, by snpEff [Variants](tab:Variants) · [Gene](tab:Gene)
      - **{{top_share}}** of the assigned samples are {{top}} – the most common Pangolin lineage [Lineages](tab:Lineage & Clustering)
    section: Findings
    tag: vr2-ov-findings
    index: vr2-ov-findings
    layout: {x: 0, y: 0, w: 8, h: 2}
  # One figure per analysis tab, in the order of the rows above. The tiles of a
  # row share a stored height.
  - component_type: highlight
    section: Findings
    source_tab: Sample QC
    source_component: vr2-qc-depth-breadth
    caption: One point per sample, median depth against the share of the genome at 10x, coloured by lineage. Low and left is a thin sample; deep but low lost amplicons.
    hide_legend: true
    tag: vr2-ov-hl-depth-breadth
    index: vr2-ov-hl-depth-breadth
    layout: {x: 0, y: 2, w: 4, h: 5}
  # A summary of the Coverage tab's amplicon track: one line for the samples in
  # view rather than one lane per sample.
  - component_type: figure
    workflow_tag: viralrecon
    data_collection_tag: mosdepth_amplicon_coverage
    use: mosdepth/amplicon_coverage
    visu_type: line
    mode: code
    code_content: |-
      # Median depth of each amplicon over the samples in view, along the genome,
      # one line per Analysis mode group when it has some. Floored at 1x for the
      # log axis; the dashed line is the 10x the consensus needs.
      d = df.group_by([*depictio_group_by, 'region', 'start']).agg(pl.col('coverage').median().alias('depth')).sort('start')
      d = d.with_columns(pl.col('depth').clip(lower_bound=1))
      fig = px.line(d.to_pandas(), x='start', y='depth', hover_data=['region'], markers=True, log_y=True, labels={'start': 'Genome position', 'depth': 'Median depth', 'region': 'Amplicon'}, **depictio_group_kwargs)
      fig.add_hline(y=10, line_dash='dash')
      # One tick per power of ten: a log axis otherwise labels 2 and 5 between.
      fig.update_yaxes(dtick=1)
      fig.update_layout(margin=dict(t=10))
    title: Depth per amplicon
    link: tab:Coverage & Depth
    caption: Median depth of each amplicon along the genome, on a log axis; a dip under the dashed 10x line is a dropout.
    section: Findings
    tag: vr2-ov-amplicon-depth
    index: vr2-ov-amplicon-depth
    layout: {x: 4, y: 2, w: 4, h: 5}
  # top_n_labels is 0 on the source: mutation labels pile up over the points.
  - component_type: highlight
    section: Findings
    source_tab: Variants
    source_component: vr2-var-manhattan
    caption: One dot per call along the genome, as high as its allele frequency, coloured by effect; above the line, it enters the consensus.
    hide_legend: true
    tag: vr2-ov-hl-manhattan
    index: vr2-ov-hl-manhattan
    layout: {x: 0, y: 7, w: 4, h: 5}
  - component_type: highlight
    section: Findings
    source_tab: Lineage & Clustering
    source_component: vr2-lin-sankey
    caption: Each sample from its Pangolin QC verdict to its lineage and its Nextclade clade; a thin ribbon is a rare or mismatched call.
    tag: vr2-ov-hl-sankey
    index: vr2-ov-hl-sankey
    layout: {x: 4, y: 7, w: 4, h: 5}
  # Link-only tab tiles: each tile prints its tab's subtitle, the question the
  # tab answers. A tab the run does not have is left out, and a heading whose
  # tabs are all missing is hidden.
  - component_type: text
    body: |
      ### Data & QC
      - [MultiQC](tab:MultiQC)
      - [Sample QC](tab:Sample QC)
      - [Coverage & Depth](tab:Coverage & Depth)

      ### Mutations
      - [Variants](tab:Variants)
      - [Gene](tab:Gene)
      - [Sample](tab:Sample)

      ### Typing
      - [Lineage & Clustering](tab:Lineage & Clustering)
    section: How to read this dashboard
    tag: vr2-ov-how-to-read
    index: vr2-ov-how-to-read
    layout: {x: 0, y: 0, w: 8, h: 2}
  # Persistent sample filters, the lineage first.
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    interactive_component_type: MultiSelect
    column_name: lineage
    column_type: object
    display:
      icon_name: mdi:virus
      custom_color: red
    section: Sample filters
    group: Sample scope
    tag: vr2-filter-lineage
    index: vr2-sample-filters-lineage
    title: Lineage
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    interactive_component_type: MultiSelect
    column_name: sample
    column_type: object
    display:
      icon_name: mdi:flask-outline
      custom_color: teal
    section: Sample filters
    group: Sample scope
    tag: vr2-filter-sample
    index: vr2-sample-filters-sample
    title: Sample ID
    layout: {x: 0, y: 3, w: 1, h: 3}
  # QC floors, persistent and collapsed: the links carry a pick here to every
  # tab, so a reader can set a floor once and read the rest above it.
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    interactive_component_type: RangeSlider
    column_name: pct_genome_covered_10x
    column_type: float64
    display:
      icon_name: mdi:chart-areaspline
      custom_color: cyan
    section: QC thresholds
    group: Coverage & yield
    tag: vr2-filter-genome-10x
    index: vr2-qc-covered-10x
    title: Genome at 10x (%)
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    interactive_component_type: RangeSlider
    column_name: coverage_median
    column_type: float64
    display:
      icon_name: mdi:chart-line
      custom_color: blue
    section: QC thresholds
    group: Coverage & yield
    tag: vr2-filter-median-depth
    index: vr2-qc-median-depth
    title: Median depth
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    interactive_component_type: RangeSlider
    column_name: pct_reads_mapped
    column_type: float64
    display:
      icon_name: mdi:target
      custom_color: indigo
    section: QC thresholds
    group: Coverage & yield
    tag: vr2-filter-reads-mapped
    index: vr2-qc-reads-mapped
    title: Reads mapped (%)
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    interactive_component_type: RangeSlider
    column_name: num_variants_total
    column_type: float64
    display:
      icon_name: mdi:dna
      custom_color: grape
    section: QC thresholds
    group: Coverage & yield
    tag: vr2-filter-variants
    index: vr2-qc-variant-yield
    title: Variants called
    layout: {x: 0, y: 9, w: 1, h: 3}
  # Row selection feeds the Analysis panel and the Sample QC record card.
  - component_type: table
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    use: multiqc/summary_metrics
    row_selection_enabled: true
    row_selection_column: sample
    section: Sample sheet
    tag: vr2-sample-sheet
    index: vr2-sample-sheet
    title: Run summary
    layout: {x: 0, y: 0, w: 8, h: 6}
tabs:
- title: MultiQC
  subtitle: Did reads trim, align and cover the genome in every sample?
  tab_group: Data & QC
  tab_order: 1
  tab_icon: /assets/images/logos/multiqc_icon_color.svg
  tab_icon_color: orange
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 746b0f3c1e4a2d7f8e5c2d02
  # Bound to multiqc_data, not summary_metrics, so the tab keeps a sample
  # filter on a nanopore run, which prunes the persistent Sample filters.
  filter_sections:
  - name: MultiQC report
