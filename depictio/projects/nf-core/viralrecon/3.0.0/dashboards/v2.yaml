- title: Sample QC
  subtitle: Did each sample yield a well-covered, trustworthy consensus genome?
  tab_group: Data & QC
  tab_order: 2
  tab_icon: mdi:stethoscope
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 746b0f3c1e4a2d7f8e5c2d03
  # The missing-bases slider reads nextclade_results, which a nanopore run
  # keeps, so the tab never loses its own filter.
  filter_sections:
  - name: Variant yield
    icon: mdi:filter-variant
    color: indigo
    description: Narrows the samples by the calls they produced and the bases they miss
  grid_sections:
  - name: QC at a glance
    icon: mdi:counter
    color: indigo
    description: Reads, depth and breadth over the samples in view
  # The scatter and the record card of the sample picked in it share one screen.
  - name: Depth and breadth
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Depth against breadth, with the record of the sample picked in it
    display: linked
  - name: Diagnostics
    icon: mdi:shield-check-outline
    color: indigo
    description: The consensus as Nextclade reads it
  - name: Breadth per sample
    icon: mdi:chart-bar
    color: indigo
    description: Genome covered at 1x and at 10x, sample by sample
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      Each sample's alignment and consensus, from the pipeline's
      [variant summary](https://nf-co.re/viralrecon/3.0.0/docs/output) and the
      [Nextclade](https://clades.nextstrain.org) QC of its consensus. The first scatter tells a
      thin sample from one that lost amplicons; lasso a point to read its record beside it.
    tag: vr2-qc-intro
    index: vr2-qc-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    interactive_component_type: RangeSlider
    column_name: num_variants_snp
    column_type: float64
    display:
      icon_name: mdi:dna
      custom_color: grape
    section: Variant yield
    group: Variant counts
    tag: vr2-qc-filter-snps
    index: vr2-qc-snp-yield
    title: SNPs called
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    interactive_component_type: RangeSlider
    column_name: num_variants_indel
    column_type: float64
    display:
      icon_name: mdi:dna
      custom_color: violet
    section: Variant yield
    group: Variant counts
    tag: vr2-qc-filter-indels
    index: vr2-qc-indel-yield
    title: Indels called
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: nextclade_results
    interactive_component_type: RangeSlider
    column_name: totalMissing
    column_type: int64
    display:
      icon_name: mdi:alert-outline
      custom_color: orange
    section: Variant yield
    group: Consensus
    tag: vr2-qc-filter-missing
    index: vr2-qc-missing
    title: Missing bases
    layout: {x: 0, y: 6, w: 1, h: 3}
  # 1,000 reads: the pipeline's default --min_mapped_reads.
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    use: multiqc/summary_metrics
    aggregation: median
    column_name: num_reads_mapped
    column_type: float64
    secondary_layout: threshold
    threshold_value: 1000
    threshold_direction: min
    display:
      icon_name: mdi:target
      icon_color: indigo
      caption: samples against the 1,000-read floor
      decimals: 0
    section: QC at a glance
    tag: vr2-qc-card-reads
    index: vr2-qc-card-reads
    title: Reads mapped
    description: Median reads aligned per sample; under 1,000 a sample skips variant calling by default.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    use: multiqc/summary_metrics
    aggregation: median
    column_name: pct_reads_mapped
    column_type: float64
    filter_expr: col('pct_reads_mapped').is_not_null()
    secondary_layout: gauge
    coverage_max: 100
    display:
      icon_name: mdi:percent-outline
      icon_color: blue
      caption: median share of each sample's reads
      decimals: 1
    section: QC at a glance
    tag: vr2-qc-card-mapped-pct
    index: vr2-qc-card-mapped-pct
    title: Reads mapped (%)
    description: Median share of each sample's reads that aligned to the viral reference.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    use: multiqc/summary_metrics
    aggregation: median
    column_name: coverage_median
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:chart-line
      icon_color: cyan
      caption: median per sample, with its spread
      decimals: 0
    section: QC at a glance
    tag: vr2-qc-card-depth
    index: vr2-qc-card-depth
    title: Median depth
    description: Median of each sample's median depth along the genome.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    use: multiqc/summary_metrics
    aggregation: median
    column_name: pct_genome_covered_10x
    column_type: float64
    filter_expr: col('pct_genome_covered_10x').is_not_null()
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-areaspline
      icon_color: teal
      caption: median, with its distribution
      decimals: 1
    section: QC at a glance
    tag: vr2-qc-card-genome-10x
    index: vr2-qc-card-genome-10x
    title: Genome at 10x (%)
    description: Median share of the genome covered by 10 reads or more; failed samples sit apart at the low end.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Colours by lineage, or by Analysis mode's groups when it has some.
  # hover_data puts sample first in customdata, which the selection reads.
  # Depth and breadth, not variant calls: every run's summary carries both,
  # while a run no caller reached writes NA for its calls.
  - component_type: figure
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    use: multiqc/summary_metrics
    visu_type: scatter
    mode: code
    code_content: |-
      # Depth against 10x breadth, one point per sample: by lineage, or by
      # Analysis mode's groups when it has some. Depth on a log axis: samples
      # of one run span orders of magnitude. The dashed line is the 80% breadth
      # floor of the bars below.
      kw = depictio_group_kwargs or {'color': 'lineage', 'color_discrete_map': depictio_category_colors.get('lineage') or {}}
      fig = px.scatter(df.to_pandas(), x='coverage_median', y='pct_genome_covered_10x', log_x=True, hover_data=['sample', 'num_variants_total'], labels={'coverage_median': 'Median depth', 'pct_genome_covered_10x': 'Genome at 10x (%)', 'lineage': 'Lineage', 'num_variants_total': 'Variants called'}, **kw)
      fig.update_traces(marker=dict(size=10))
      fig.add_hline(y=80, line_dash='dash')
      fig.update_yaxes(range=[0, 105])
      fig.update_layout(margin=dict(t=10))
    selection_enabled: true
    selection_column: sample
    section: Depth and breadth
    tag: vr2-qc-depth-breadth
    index: vr2-qc-depth-breadth
    title: Median depth against genome covered at 10x
    description: A thin sample sits low and left; a deep one under the line lost amplicons.
    layout: {x: 0, y: 0, w: 5, h: 6}
  # No default_record: the card waits for a pick rather than opening on a
  # sample of the reference run.
  - component_type: advanced_viz
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: vr2-qc-depth-breadth
      id_col: sample
      title_col: sample
      selection_source: any
      sections:
        Alignment: [num_reads_mapped, pct_reads_mapped, coverage_median]
        Breadth: [pct_genome_covered_1x, pct_genome_covered_10x]
        Calls: [num_variants_snp, num_variants_indel, num_variants_total, lineage]
      labels:
        num_reads_mapped: Reads mapped
        pct_reads_mapped: Reads mapped (%)
        coverage_median: Median depth
        pct_genome_covered_1x: Genome at 1x (%)
        pct_genome_covered_10x: Genome at 10x (%)
        num_variants_snp: SNPs
        num_variants_indel: Indels
        num_variants_total: Variants
        lineage: Pangolin lineage
    section: Depth and breadth
    tag: vr2-qc-sample-record
    index: vr2-qc-sample-record
    title: Sample record
    description: The sample picked in the scatter or the run summary, with its alignment, breadth and calls.
    layout: {x: 5, y: 0, w: 3, h: 6}
  - component_type: figure
    workflow_tag: viralrecon
    data_collection_tag: nextclade_results
    use: nextclade/report
    visu_type: scatter
    mode: code
    code_content: |-
      # Substitutions against deletions per consensus genome: by clade, or by
      # Analysis mode's groups when it has some.
      kw = depictio_group_kwargs or {'color': 'clade', 'color_discrete_map': depictio_category_colors.get('clade') or {}}
      fig = px.scatter(df.to_pandas(), x='totalSubstitutions', y='totalDeletions', hover_data=['sample', 'qc_overallStatus', 'totalMissing'], opacity=0.8, labels={'totalSubstitutions': 'Substitutions', 'totalDeletions': 'Deleted bases', 'clade': 'Clade', 'qc_overallStatus': 'Nextclade QC', 'totalMissing': 'Missing bases'}, **kw)
      fig.update_traces(marker=dict(size=10))
      # Counts: from zero, in whole steps (a narrow range otherwise ticks 0.5).
      fig.update_xaxes(rangemode='tozero', dtick=max(1, round((df['totalSubstitutions'].max() or 0) / 5)))
      fig.update_yaxes(rangemode='tozero', dtick=max(1, round((df['totalDeletions'].max() or 0) / 5)))
      fig.update_layout(margin=dict(t=10))
    selection_enabled: true
    selection_column: sample
    section: Diagnostics
    tag: vr2-qc-nextclade-scatter
    index: vr2-qc-nextclade-scatter
    title: Substitutions against deletions (Nextclade)
    description: Each consensus genome's mutation load; a point far from its clade is worth a look.
    layout: {x: 0, y: 0, w: 8, h: 4}
  - component_type: figure
    workflow_tag: viralrecon
    data_collection_tag: summary_metrics
    use: multiqc/summary_metrics
    visu_type: bar
    mode: code
    code_content: |-
      # Samples ordered by 10x breadth. The order is pinned on the axis:
      # plotly regroups categories by trace otherwise, which breaks the sort.
      order = df.sort('pct_genome_covered_10x', descending=True, nulls_last=True)['sample'].to_list()
      d = df.select('sample', 'pct_genome_covered_1x', 'pct_genome_covered_10x').unpivot(index='sample', variable_name='depth', value_name='breadth').with_columns(pl.col('depth').replace({'pct_genome_covered_1x': 'at 1x', 'pct_genome_covered_10x': 'at 10x'}))
      fig = px.bar(d.to_pandas(), x='sample', y='breadth', color='depth', barmode='group', labels={'sample': 'Sample', 'breadth': 'Genome covered (%)', 'depth': 'Depth'})
      # 80%: the template's breadth floor for a usable consensus.
      fig.add_hline(y=80, line_dash='dash', annotation_text='80%')
      fig.update_xaxes(tickangle=-45, tickfont={'size': 9}, categoryorder='array', categoryarray=order)
      fig.update_layout(margin=dict(t=10))
    section: Breadth per sample
    tag: vr2-qc-breadth
    index: vr2-qc-breadth
    title: Genome covered at 1x and 10x per sample
    description: The gap between the two bars is genome covered, but not deeply enough to call.
    layout: {x: 0, y: 0, w: 8, h: 4}
- title: Coverage & Depth
  subtitle: Where along the genome does each sample lose depth?
  tab_group: Data & QC
  tab_order: 3
  tab_icon: mdi:chart-areaspline
  tab_icon_color: teal
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 746b0f3c1e4a2d7f8e5c2d04
  # The genome-depth slider reads mosdepth_genome_coverage, which a run
  # without a primer scheme keeps when it drops the amplicon tables.
  filter_sections:
  - name: Coverage filters
    icon: mdi:filter-variant
    color: teal
    description: Narrows the windows and amplicons by depth
  grid_sections:
  - name: Coverage at a glance
    icon: mdi:counter
    color: teal
    description: Depth per window and per amplicon over the samples in view
  - name: Along the genome
    icon: mdi:chart-line
    color: teal
    description: Depth per 200 bp window, one lane per sample
  - name: Per amplicon
    icon: mdi:chart-timeline-variant
    color: teal
    description: Median depth of each amplicon, and one lane per sample; pick one to isolate it
  - name: Amplicon patterns
    icon: mdi:chart-box-outline
    color: gray
    description: Depth per sample and amplicon, clustered
    collapsed: true
  - name: Amplicon table
    icon: mdi:table
    color: gray
    description: Depth per sample and amplicon
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      An amplicon dropout is a stretch of the genome whose PCR product failed, so too few reads
      cover it and the consensus masks it. Depth comes from
      [mosdepth](https://github.com/brentp/mosdepth), per 200 bp window and per amplicon; a gap in
      the genome track is a dropout. Open a dropout in the genome browser of the
      [Variants](tab:Variants) tab to see the reads and the primers at the spot; picking an
      amplicon in the second plot isolates it.
    tag: vr2-cov-intro
    index: vr2-cov-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: mosdepth_genome_coverage
    interactive_component_type: RangeSlider
    column_name: coverage
    column_type: float64
    display:
      icon_name: mdi:chart-line
      custom_color: blue
    section: Coverage filters
    group: Depth
    tag: vr2-cov-filter-genome-depth
    index: vr2-cov-genome-depth
    title: Window depth
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: mosdepth_amplicon_coverage
    interactive_component_type: MultiSelect
    column_name: region
    column_type: object
    display:
      icon_name: mdi:vector-line
      custom_color: cyan
    section: Coverage filters
    group: Depth
    tag: vr2-cov-filter-amplicon
    index: vr2-cov-amplicon
    title: Amplicon
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: mosdepth_amplicon_coverage
    interactive_component_type: RangeSlider
    column_name: coverage
    column_type: int64
    display:
      icon_name: mdi:chart-areaspline
      custom_color: teal
    section: Coverage filters
    group: Depth
    tag: vr2-cov-filter-amplicon-depth
    index: vr2-cov-amplicon-depth
    title: Amplicon depth
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: mosdepth_genome_coverage
    use: mosdepth/genome_coverage
    aggregation: median
    column_name: coverage
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-line
      icon_color: blue
      caption: per window, with its distribution
      decimals: 0
    section: Coverage at a glance
    tag: vr2-cov-card-genome-depth
    index: vr2-cov-card-genome-depth
    title: Window depth
    description: Median depth over every sample and 200 bp window in view.
    layout: {x: 0, y: 0, w: 2, h: 2}
  # 10x: the depth under which the consensus masks a position. No trend along
  # `start`: its first-to-last change ("1 → 3 ▲ 200%") reads as growth over
  # time, which a genome position is not.
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: mosdepth_genome_coverage
    use: mosdepth/genome_coverage
    aggregation: count
    column_name: coverage
    column_type: float64
    filter_expr: col('coverage') < 10
    secondary_layout: histogram
    display:
      icon_name: mdi:chart-timeline-variant
      icon_color: orange
      caption: their depth, from no reads to just under 10x
      decimals: 0
    section: Coverage at a glance
    tag: vr2-cov-card-low-windows
    index: vr2-cov-card-low-windows
    title: Windows under 10x
    description: Sample and window pairs under 10x, which the consensus masks; a bar at 0 is a true gap, the rest thin coverage.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: mosdepth_amplicon_coverage
    use: mosdepth/amplicon_coverage
    aggregation: median
    column_name: coverage
    column_type: int64
    secondary_layout: threshold
    threshold_value: 10
    threshold_direction: min
    display:
      icon_name: mdi:chart-areaspline
      icon_color: teal
      caption: sample and amplicon pairs against 10x
      decimals: 0
    section: Coverage at a glance
    tag: vr2-cov-card-amplicon-depth
    index: vr2-cov-card-amplicon-depth
    title: Amplicon depth
    description: Median depth over every sample and amplicon in view; the bar counts the pairs at 10x or more.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: mosdepth_amplicon_coverage
    use: mosdepth/amplicon_coverage
    aggregation: nunique
    column_name: region
    column_type: object
    filter_expr: col('coverage') < 10
    secondary_layout: uniqueness
    display:
      icon_name: mdi:alert-outline
      icon_color: red
      caption: and the one that drops out most often
      decimals: 0
    section: Coverage at a glance
    tag: vr2-cov-card-dropouts
    index: vr2-cov-card-dropouts
    title: Amplicons under 10x
    description: Amplicons under 10x in at least one sample; one that fails in many samples points at its primers.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: viralrecon
    use: mosdepth/coverage_track_genome
    data_collection_tag: coverage_track_canonical
    config:
      end_col: end
      sample_col: sample
      y_scale: linear
      smoothing_window: 5
      show_annotation_lane: false
      views: [track]
    section: Along the genome
    tag: vr2-cov-genome-track
    index: vr2-cov-genome-track
    title: Depth along the genome
    description: One lane per sample on a linear axis; a dropout reads as a gap.
    layout: {x: 0, y: 0, w: 8, h: 3}
  # The pick figure: one point per amplicon, at its start, as high as the median
  # depth over the samples in view. A pick filters mosdepth_amplicon_coverage on
  # region, which narrows the lanes beside it and the table. custom_data carries
  # the region the selection reads.
  - component_type: figure
    workflow_tag: viralrecon
    data_collection_tag: mosdepth_amplicon_coverage
    use: mosdepth/amplicon_coverage
    visu_type: scatter
    mode: code
    code_content: |-
      # Median depth of each amplicon over the samples in view, along the genome,
      # on a log axis floored at 1x. The dashed line is the 10x the consensus
      # needs; a point under it is an amplicon that drops out.
      d = df.group_by(['region', 'start']).agg(pl.col('coverage').median().alias('depth')).sort('start')
      d = d.with_columns(pl.col('depth').clip(lower_bound=1))
      fig = px.scatter(d.to_pandas(), x='start', y='depth', log_y=True, custom_data=['region'], hover_name='region', labels={'start': 'Genome position', 'depth': 'Median depth'})
      fig.update_traces(marker=dict(size=8))
      fig.add_hline(y=10, line_dash='dash')
      fig.update_yaxes(dtick=1)
      fig.update_layout(margin=dict(t=10))
    selection_enabled: true
    selection_column: region
    section: Per amplicon
    tag: vr2-cov-amplicon-pick
    index: vr2-cov-amplicon-pick
    title: Median depth per amplicon
    description: Pick an amplicon to read its depth per sample beside it.
    layout: {x: 0, y: 0, w: 4, h: 5}
  - component_type: advanced_viz
    workflow_tag: viralrecon
    use: mosdepth/coverage_track_amplicon
    data_collection_tag: mosdepth_amplicon_coverage
    config:
      category_col: region
      sample_col: sample
      value_col: coverage
      y_scale: log
      views: [track]
    section: Per amplicon
    tag: vr2-cov-amplicon-track
    index: vr2-cov-amplicon-track
    title: Depth per amplicon, by sample
    description: One lane per sample on a log axis; the amplicon filter on the left narrows it.
    layout: {x: 4, y: 0, w: 4, h: 5}
  # Blues, low to high: a weak amplicon or sample reads pale.
  - component_type: advanced_viz
    workflow_tag: viralrecon
    data_collection_tag: complex_heatmap_canonical
    use: mosdepth/complex_heatmap
    config:
      viz_kind: complex_heatmap
      index_column: sample
      cluster_rows: true
      cluster_cols: false
      normalize: none
      colorscale: Blues
    section: Amplicon patterns
    tag: vr2-cov-heatmap
    index: vr2-cov-heatmap
    title: Amplicon depth per sample (clustered)
    description: Log10 depth, samples clustered, amplicons in scheme order. A pale column is a weak amplicon of the scheme, a pale row a weak sample, an isolated pale cell a likely primer-site mutation.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: viralrecon
    data_collection_tag: mosdepth_amplicon_coverage
    use: mosdepth/amplicon_coverage
    row_selection_enabled: true
    row_selection_column: region
    section: Amplicon table
    tag: vr2-cov-amplicon-table
    index: vr2-cov-amplicon-table
    title: Depth per sample and amplicon
    description: Tick a row to narrow the dashboard to its amplicon.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Variants
  subtitle: Which mutations does each sample carry, and how well supported?
  tab_group: Mutations
  tab_order: 4
  tab_icon: mdi:dna
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  dashboard_id: 746b0f3c1e4a2d7f8e5c2d05
  filter_sections:
  - name: Variant filters
    icon: mdi:filter-variant
    color: grape
    description: Narrows the calls by gene, effect and support
  # A separate collection on purpose: the mutation type narrows the matrix
  # without touching the calls above it.
  - name: Matrix filter
    icon: mdi:relation-many-to-many
    color: violet
    description: Narrows the mutation matrix only
    collapsed: true
  grid_sections:
  - name: Calls at a glance
    icon: mdi:counter
    color: grape
    description: How many calls, how distinct, and how well supported
  # The Manhattan and the browser share one screen: pick a call and the browser
  # opens on its position, with the reads and variants of the samples carrying it.
  - name: Along the genome
    icon: mdi:chart-timeline-variant
    color: grape
    description: Every call at its position, as high as its allele frequency, beside the genome browser
    display: linked
  - name: Support
    icon: mdi:chart-bell-curve
    color: grape
    description: Allele frequency and read depth behind each call
  - name: Co-occurrence
    icon: mdi:relation-many-to-many
    color: gray
    description: Which genes carry calls in which samples
    collapsed: true
  - name: Genes and effects
    icon: mdi:chart-bar
    color: gray
    description: Calls per gene and per sample, and the lollipop per gene
    collapsed: true
  - name: Variant table
    icon: mdi:table
    color: gray
    description: Every call with its support and annotation
    collapsed: true
  components:
  # The tab's intro: the method, with its link, and how to read the tab.
  - component_type: text
    order: 1
    body: >
      Every variant call ([iVar](https://andersen-lab.github.io/ivar/html/) by default) with its
      [snpEff](https://pcingola.github.io/SnpEff/) effect, one row per sample and mutation. A
      call at an allele frequency of 0.75 or more enters the consensus. Pick a dot to open that
      position in the genome browser; the left panel narrows the calls by gene, effect and support.
    tag: vr2-var-intro
    index: vr2-var-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    interactive_component_type: MultiSelect
    column_name: GENE
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: lime
    section: Variant filters
    group: Call properties
    tag: vr2-var-filter-gene
    index: vr2-var-gene-filter
    title: Gene
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    interactive_component_type: MultiSelect
    column_name: EFFECT
    column_type: object
    display:
      icon_name: mdi:alert-circle-outline
      custom_color: violet
    section: Variant filters
    group: Call properties
    tag: vr2-var-filter-effect
    index: vr2-var-effect-filter
    title: Effect
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    interactive_component_type: MultiSelect
    column_name: FUNCLASS
    column_type: object
    display:
      icon_name: mdi:shape-outline
      custom_color: indigo
    section: Variant filters
    group: Call properties
    tag: vr2-var-filter-funclass
    index: vr2-var-funclass-filter
    title: Functional class
    layout: {x: 0, y: 6, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    interactive_component_type: RangeSlider
    column_name: AF
    column_type: float64
    display:
      icon_name: mdi:percent-outline
      custom_color: pink
    section: Variant filters
    group: Support
    tag: vr2-var-filter-af
    index: vr2-var-af-filter
    title: Allele frequency
    layout: {x: 0, y: 9, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    interactive_component_type: RangeSlider
    column_name: DP
    column_type: int64
    display:
      icon_name: mdi:layers-outline
      custom_color: orange
    section: Variant filters
    group: Support
    tag: vr2-var-filter-depth
    index: vr2-var-depth-filter
    title: Read depth
    layout: {x: 0, y: 12, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: viralrecon
    data_collection_tag: oncoplot_canonical
    interactive_component_type: MultiSelect
    column_name: mutation_type
    column_type: object
    display:
      icon_name: mdi:alert-circle-outline
      custom_color: violet
    section: Matrix filter
    tag: vr2-var-filter-mutation-type
    index: vr2-var-mutation-type-filter
    title: Mutation type
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    aggregation: count
    column_name: POS
    column_type: int64
    secondary_layout: composition
    breakdown_col: FUNCLASS
    display:
      icon_name: mdi:dna
      icon_color: grape
      caption: calls, by functional class
      decimals: 0
    section: Calls at a glance
    tag: vr2-var-card-calls
    index: vr2-var-card-calls
    title: Variant calls
    description: Calls over the samples in view, one per sample and mutation.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    aggregation: nunique
    column_name: mutation_label
    column_type: object
    secondary_layout: uniqueness
    display:
      icon_name: mdi:map-marker-outline
      icon_color: orange
      caption: and the one most samples share
      decimals: 0
    section: Calls at a glance
    tag: vr2-var-card-mutations
    index: vr2-var-card-mutations
    title: Distinct mutations
    description: Distinct mutations over the samples in view; a mutation shared by many samples is a lineage marker.
    layout: {x: 2, y: 0, w: 2, h: 2}
  # 0.75: the allele frequency at which viralrecon's consensus takes a call.
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    aggregation: median
    column_name: AF
    column_type: float64
    secondary_layout: threshold
    threshold_value: 0.75
    threshold_direction: min
    display:
      icon_name: mdi:percent-outline
      icon_color: pink
      caption: calls against the 0.75 consensus cut-off
      decimals: 2
    section: Calls at a glance
    tag: vr2-var-card-af
    index: vr2-var-card-af
    title: Allele frequency
    description: Median allele frequency of the calls; the bar counts those the consensus takes.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    aggregation: median
    column_name: DP
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:layers-outline
      icon_color: teal
      caption: median per call, with its spread
      decimals: 0
    section: Calls at a glance
    tag: vr2-var-card-depth
    index: vr2-var-card-depth
    title: Read depth
    description: Median read depth at the called positions.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # No point labels: mutation labels pile up over the dots at any width, and
  # the Overview highlight draws this tile as it is here.
  - component_type: advanced_viz
    workflow_tag: viralrecon
    use: ivar/manhattan
    data_collection_tag: variants_long
    config:
      feature_col: mutation_label
      score_kind: Allele frequency (AF)
      # 0.75: the allele frequency at which the consensus takes a call.
      score_threshold: 0.75
      top_n_labels: 0
      marker_size_above: 12
      color_by_columns:
      - EFFECT
      - FUNCLASS
      - sample
      default_color_by: EFFECT
      # The call's sample, gene, change, effect and depth, in the tooltip.
      hover_cols: [sample, GENE, AA, EFFECT, DP]
      selection_enabled: true
      # The mutation, not the sample: the browser jumps to the position and
      # opens the samples that carry it.
      selection_column: mutation_label
    section: Along the genome
    tag: vr2-var-manhattan
    index: vr2-var-manhattan
    title: Allele frequency along the genome
    description: One dot per call; above the 0.75 line, it enters the consensus.
    layout: {x: 0, y: 0, w: 8, h: 3}
  - component_type: jbrowse
    workflow_tag: viralrecon
    data_collection_tag: tracks
    section: Along the genome
    location: "MN908947.3:21,500-25,400"
    initial_tracks: 4
    max_tracks: 8
    show_overview: false
    selection_enabled: true
    selection_column: sample_id
    ucsc_tracks: [artic]
    # A picked call narrows variants_long to the samples carrying it (a few
    # rows): the view then jumps to its position.
    locus_from:
      data_collection_tag: variants_long
      chrom_column: CHROM
      start_column: POS
      padding: 150
      max_rows: 20
      sort_by: POS
      descending: false
      label_column: mutation_label
    # Variants take the colour the plots give their snpEff effect.
    variant_color_by:
      column: EFFECT
    tag: vr2-var-browser
    index: vr2-var-browser
    title: Genome browser
    description: The variants and reads of the samples in view, at the call picked in the plot.
    layout: {x: 0, y: 3, w: 8, h: 6}
  - component_type: figure
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    visu_type: histogram
    mode: code
    code_content: |-
      # Allele frequency of every call, stacked by snpEff effect in the family's
      # effect colours; the dashed line is the 0.75 consensus cut-off.
      d = df.filter(pl.col('AF').is_not_null())
      fig = px.histogram(d.to_pandas(), x='AF', color='EFFECT', nbins=40, color_discrete_map=depictio_category_colors.get('EFFECT') or {}, labels={'AF': 'Allele frequency', 'EFFECT': 'Effect'})
      fig.add_vline(x=0.75, line_dash='dash')
      fig.update_layout(barmode='stack', yaxis_title='Calls', margin=dict(t=10))
    section: Support
    tag: vr2-var-af-histogram
    index: vr2-var-af-histogram
    title: Allele frequency of the calls
    description: Fixed calls pile up near 1; sub-consensus calls sit left of the line.
    layout: {x: 0, y: 0, w: 4, h: 4}
  - component_type: figure
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    visu_type: scatter
    mode: code
    code_content: |-
      # Reference against alternate depth per call: by functional class, or by
      # Analysis mode's groups when it has some. custom_data carries the sample
      # the selection reads.
      d = df.filter(pl.col('REF_DP').is_not_null() & pl.col('ALT_DP').is_not_null())
      kw = depictio_group_kwargs or {'color': 'FUNCLASS', 'color_discrete_map': depictio_category_colors.get('FUNCLASS') or {}}
      fig = px.scatter(d.to_pandas(), x='REF_DP', y='ALT_DP', hover_name='mutation_label', custom_data=['sample'], opacity=0.8, labels={'REF_DP': 'Reference depth', 'ALT_DP': 'Alternate depth', 'FUNCLASS': 'Functional class'}, **kw)
      fig.update_layout(margin=dict(t=10))
    selection_enabled: true
    selection_column: sample
    section: Support
    tag: vr2-var-read-support
    index: vr2-var-read-support
    title: Read support per call
    description: A high frequency with few reads behind it sits near the origin.
    layout: {x: 4, y: 0, w: 4, h: 4}
  - component_type: advanced_viz
    workflow_tag: viralrecon
    data_collection_tag: oncoplot_canonical
    use: ivar/mutation_matrix
    viz_kind: oncoplot
    config:
      viz_kind: oncoplot
      sample_id_col: sample_id
      gene_col: gene
      mutation_type_col: mutation_type
    section: Co-occurrence
    tag: vr2-var-oncoplot
    index: vr2-var-oncoplot
    title: Mutations per sample and gene
    description: Each cell is the effect class; rows and columns are ordered so shared calls line up.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: viralrecon
    use: ivar/lollipop
    data_collection_tag: variants_long
    config:
      effect_col: AF
      max_subplot_genes: 6
    section: Genes and effects
    tag: vr2-var-lollipop
    index: vr2-var-lollipop
    title: Calls on each gene (lollipop)
    description: One panel per gene, the six most mutated; the stem height is the allele frequency.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: figure
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    visu_type: bar
    mode: code
    code_content: |-
      # Calls per gene, stacked by functional class, the busiest gene first.
      d = df.group_by(['GENE', 'FUNCLASS']).agg(pl.len().alias('calls'))
      fig = px.bar(d.to_pandas(), x='GENE', y='calls', color='FUNCLASS', color_discrete_map=depictio_category_colors.get('FUNCLASS') or {}, labels={'GENE': 'Gene', 'calls': 'Calls', 'FUNCLASS': 'Functional class'})
      fig.update_layout(barmode='stack', xaxis={'categoryorder': 'total descending'}, margin=dict(t=10))
      fig.update_xaxes(tickangle=-45)
      # A count axis in whole steps: a short one otherwise ticks 0.5.
      fig.update_yaxes(dtick=max(1, round((d.group_by('GENE').agg(pl.col('calls').sum())['calls'].max() or 0) / 5)))
    section: Genes and effects
    tag: vr2-var-by-gene
    index: vr2-var-by-gene
    title: Calls per gene
    description: Stacked by functional class.
    layout: {x: 0, y: 6, w: 4, h: 4}
  - component_type: figure
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    visu_type: bar
    mode: code
    code_content: |-
      # Calls per sample, stacked by functional class.
      d = df.group_by(['sample', 'FUNCLASS']).agg(pl.len().alias('calls')).sort('sample')
      fig = px.bar(d.to_pandas(), x='sample', y='calls', color='FUNCLASS', color_discrete_map=depictio_category_colors.get('FUNCLASS') or {}, labels={'sample': 'Sample', 'calls': 'Calls', 'FUNCLASS': 'Functional class'})
      fig.update_layout(barmode='stack', margin=dict(t=10))
      fig.update_xaxes(tickangle=-45, tickfont={'size': 9})
      # A count axis in whole steps: a short one otherwise ticks 0.5.
      fig.update_yaxes(dtick=max(1, round((d.group_by('sample').agg(pl.col('calls').sum())['calls'].max() or 0) / 5)))
    section: Genes and effects
    tag: vr2-var-by-sample
    index: vr2-var-by-sample
    title: Calls per sample
    description: Stacked by functional class.
    layout: {x: 4, y: 6, w: 4, h: 4}
  - component_type: table
    workflow_tag: viralrecon
    data_collection_tag: variants_long
    use: ivar/variants_long
    row_selection_enabled: true
    row_selection_column: sample
    section: Variant table
    tag: vr2-var-table
    index: vr2-var-table
    title: Variant calls
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Gene
  subtitle: Which mutations does this gene carry, and where do they sit?
  tab_group: Mutations
