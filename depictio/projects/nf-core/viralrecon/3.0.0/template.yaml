# nf-core/viralrecon Template v3.0.0 - Viral Genome Analysis
# ============================================================================
# This is a TEMPLATE project configuration. Use with:
#   depictio run --template nf-core/viralrecon/3.0.0 --data-root /path/to/your/data
#
# Tested against nf-core/viralrecon AWS megatest results:
#   s3://nf-core-awsmegatests/viralrecon/results-395079f1d24dce731ac22e03d7a5e71f110103fc
#
# Designed for nf-core/viralrecon amplicon (ivar) workflow outputs.
# Generic, core-facility compatible — no sensitive metadata required.
# Data collections use "Aggregated" metatype for time-series aggregation
# across multiple sequencing runs.
# ============================================================================

# Template metadata (parsed and removed before Project model validation)
template:
  template_id: "nf-core/viralrecon/3.0.0"
  description: "nf-core/viralrecon viral genome analysis template for amplicon sequencing (ivar variant caller)"
  version: "1.1.0"
  variables:
    - name: "DATA_ROOT"
      description: "Root directory containing viralrecon pipeline output (multiqc/, variants/)"
      required: true
    - name: "IS_NANOPORE"
      description: "Auto-set from params.json (platform=nanopore). Repoints coverage/lineage DCs at the artic_minion/ layout and drops illumina-only variant DCs."
      required: false
  dashboards:
    - "dashboards/base.yaml"
  # How a run's provenance is collected. Without this block the CLI falls back
  # to _DEFAULT_PROVENANCE_SPEC, which reads params.json but drops every key
  # into a single ungrouped "Parameters" list and never looks at the software
  # versions. viralrecon has ~106 parameters, so the grouping is what makes the
  # ingestion report and the dashboard Settings drawer readable.
  #
  # Globs are relative to DATA_ROOT; collect_run_provenance also tries
  # `*/pipeline_info/...`, which is what matches the run_N/ layout this
  # template expects.
  provenance:
    sources:
      - name: "params"
        glob: "pipeline_info/params*.json"
        format: "json"
        pick: "latest"
        exclude_keys:
          - "genomes.*"   # bundled genome catalog, identical every run
          - "hook_url"    # nf-core runs put a live Slack webhook here
      - name: "software_versions"
        glob: "pipeline_info/*software*versions.yml"
        format: "yaml"
        pick: "latest"
        group: "Software versions"
    groups:
      - group: "Protocol & primers"
        key_patterns: ["protocol", "platform", "primer_*", "artic_minion_*", "min_barcode_reads", "min_guppyplex_reads", "threeprime_adapters"]
      - group: "Reference genome"
        key_patterns: ["genome", "genomes", "fasta", "gff", "bowtie2_index", "nextclade_dataset*", "pango_database", "kraken2_db*", "blast_db", "freyja_db_name", "freyja_barcodes", "freyja_lineages", "additional_annotation"]
      - group: "Read processing"
        key_patterns: ["save_trimmed_fail", "save_unaligned", "save_mpileup", "save_reference", "filter_duplicates", "ivar_trim_*", "min_mapped_reads", "sequencing_summary", "fastq_dir"]
      - group: "Variant calling"
        key_patterns: ["variant_caller", "consensus_caller", "kraken2_variants_host_filter", "freyja_depthcutoff", "freyja_repeats"]
      - group: "Assembly"
        key_patterns: ["assemblers", "spades_*", "min_contig_length", "min_perc_contig_aligned", "kraken2_assembly_host_filter"]
      - group: "Run context"
        key_patterns: ["input*", "outdir", "version", "email*", "config_profile_*", "custom_config_*", "multiqc_*", "max_multiqc_email_size", "monochrome_logs", "validate_params", "help*", "show_hidden", "publish_dir_mode", "pipelines_testdata_base_path", "trace_report_suffix", "plaintext_email", "hook_url", "account", "clusterOptions"]
      - group: "Skipped steps"
        key_patterns: ["skip_*"]
    highlight:
      - "protocol"
      - "platform"
      - "primer_set"
      - "primer_set_version"
      - "variant_caller"
      - "consensus_caller"
      - "min_mapped_reads"
      - "genome"
  # No reference.vars needed — DATA_ROOT is resolved by db_init to the
  # bundled project directory (/app/depictio/projects/nf-core/viralrecon/3.0.0).
  conditional:
    # nanopore/ARTIC runs call variants with clair3 (not ivar/bowtie2): coverage and
    # lineage live under artic_minion/, and the MultiQC parquet lacks the ivar/bowtie2
    # columns the required summary_metrics recipe reads. IS_NANOPORE is auto-set from
    # the run's params.json. When present:
    #   - repoint the shared coverage/lineage DCs at the artic_minion/ layout (same
    #     tags → coverage_track / complex_heatmap / sankey canonicals keep working);
    #   - drop summary_metrics (the loud-failure point — no nanopore recipe yet) and
    #     the illumina-only ivar variant DCs (no variants_long_table.csv on ARTIC).
    # Illumina runs (no IS_NANOPORE) keep the default illumina bindings untouched.
    - if_var_present: "IS_NANOPORE"
      remove_dc_tags:
        ["summary_metrics", "variants_long", "oncoplot_canonical",
         "upset_canonical", "variant_feature_matrix_canonical"]
      override_dcs:
        - data_collection_tag: "mosdepth_amplicon_coverage"
          scan_pattern: "artic_minion/mosdepth/amplicon/all_samples.mosdepth.coverage.tsv"
        - data_collection_tag: "mosdepth_genome_coverage"
          scan_pattern: "artic_minion/mosdepth/genome/all_samples.mosdepth.coverage.tsv"
        - data_collection_tag: "mosdepth_amplicon_heatmap"
          scan_pattern: "artic_minion/mosdepth/amplicon/all_samples.mosdepth.heatmap.tsv"
        - data_collection_tag: "pangolin_lineages"
          source_overrides:
            pangolin_raw: {glob_pattern: "artic_minion/pangolin/*.pangolin.csv"}
        - data_collection_tag: "nextclade_results"
          source_overrides:
            nextclade_raw: {glob_pattern: "artic_minion/nextclade/*.csv"}

# ============================================================================
# PROJECT CONFIGURATION
# ============================================================================

name: "Viralrecon Viral Genome Analysis"
project_type: "advanced"
is_public: true
workflows:
  - name: "viralrecon"
    version: "3.0.0"
    engine:
      name: "nextflow"
      version: "24.10.4"
    catalog:
      name: "nf-core"
      url: "https://nf-co.re"
    repository_url: "https://github.com/nf-core/viralrecon"
    data_location:
      structure: "sequencing-runs"
      runs_regex: "run_.*"
      locations:
        - "{DATA_ROOT}"
    data_collections:
      # ----------------------------------------------------------------
      # MultiQC data collection (native parquet)
      # ----------------------------------------------------------------
      - data_collection_tag: "multiqc_data"
        description: "MultiQC report data with QC metrics from all pipeline tools"
        config:
          type: "MultiQC"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: "multiqc/multiqc_data/multiqc.parquet"
          dc_specific_properties:
            s3_location: null
            # Documentation only: `DCMultiQC.modules` / `.plots` are overwritten at
            # ingest from the report's own `parse_logs()` output, so nothing here
            # gates what renders. They are still worth keeping honest, since this
            # is what a dashboard author reads before writing a `selected_module`
            # / `selected_plot` pair. Every name below is one the shipped
            # viralrecon report actually carries; the previous list named four
            # modules that do not exist in it (picard, freyja, nextclade, and the
            # unsuffixed samtools / ivar / quast) and seven plot anchors under
            # names MultiQC does not use.
            modules:
              - "fastqc"
              - "fastp"
              - "cutadapt"
              - "kraken"
              - "bowtie2"
              - "samtools_bowtie2"
              - "samtools_ivar"
              - "samtools_markduplicates"
              - "mosdepth"
              - "ivar_variants"
              - "bcftools"
              - "snpeff"
              - "quast_variants"
              - "pangolin"
              - "nextclade_clade"
              - "fail_mapped_samples"
              - "summary_variants_metrics"
              - "summary_assembly_metrics"
            plots:
              fastqc:
                - "Sequence Counts"
                - "Sequence Quality Histograms"
                - "Per Sequence Quality Scores"
                - "Per Base N Content"
                - "Sequence Duplication Levels"
                - "Adapter Content"
                - "Status Checks"
              fastp:
                - "Filtered Reads"
                - "Insert Sizes"
              cutadapt:
                - "Filtered Reads"
              kraken:
                - "Top taxa"
              bowtie2:
                - "Paired-end alignments"
              samtools_bowtie2:
                - "Flagstat"
              samtools_ivar:
                - "Flagstat"
              samtools_markduplicates:
                - "Flagstat"
              mosdepth:
                - "Cumulative coverage distribution"
                - "Average coverage per contig"
              ivar_variants:
                - "ivar_variants-section"
              bcftools:
                - "Variant Substitution Types"
                - "Indel Distribution"
              snpeff:
                - "Variants by Genomic Region"
                - "Variant Effects by Impact"
                - "Variants by Effect Types"
                - "Variants by Functional Class"
              quast_variants:
                - "Assembly Statistics"
                - "Number of Contigs"
              pangolin:
                - "Run table"
              nextclade_clade:
                - "nextclade_clade-section"
              fail_mapped_samples:
                - "fail_mapped_samples-section"
              summary_variants_metrics:
                - "summary_variants_metrics-section"
              summary_assembly_metrics:
                - "summary_assembly_metrics-section"

      # ----------------------------------------------------------------
      # Recipe-transformed data collections (Aggregated metatype)
      # ----------------------------------------------------------------

      - data_collection_tag: "summary_metrics"
        description: "Per-sample alignment, coverage, and variant calling summary metrics"
        config:
          type: "Table"
          metatype: "Aggregated"
          source: "transformed"
          transform:
            recipe: "multiqc/summary_metrics.py"
          dc_specific_properties:
            format: "CSV"
            columns_description:
              "sample": "Sample identifier"
              "num_reads_mapped": "Number of reads mapped to reference"
              "pct_reads_mapped": "Percentage of reads mapped"
              "coverage_median": "Median genome coverage depth"
              "pct_genome_covered_1x": "Percentage of genome covered at >= 1x depth"
              "pct_genome_covered_10x": "Percentage of genome covered at >= 10x depth"
              "num_variants_snp": "Number of SNP variants called"
              "num_variants_indel": "Number of indel variants called"
              "num_variants_total": "Total number of variants called"
              "lineage": "Pangolin lineage assignment"

      - data_collection_tag: "variants_long"
        optional: true  # ivar variants_long_table.csv absent when consensus is empty / --skip_variants_long_table
        description: "Per-sample variant calls with functional annotations"
        config:
          type: "Table"
          metatype: "Aggregated"
          source: "transformed"
          transform:
            recipe: "ivar/variants_long.py"
          dc_specific_properties:
            format: "CSV"
            columns_description:
              "sample": "Sample identifier"
              "CHROM": "Chromosome/reference sequence"
              "POS": "Variant position on reference"
              "REF": "Reference allele"
              "ALT": "Alternative allele"
              "FILTER": "Variant filter status"
              "DP": "Read depth at position"
              "REF_DP": "Reference allele read depth"
              "ALT_DP": "Alternative allele read depth"
              "AF": "Allele frequency (0-1)"
              "GENE": "Gene annotation"
              "AA": "Amino acid change"
              "EFFECT": "Variant effect (e.g., missense, synonymous)"
              "FUNCLASS": "Functional class (SILENT, MISSENSE, NONSENSE)"
              "mutation_label": "Formatted mutation label (GENE:REFposALT)"

      - data_collection_tag: "pangolin_lineages"
        optional: true  # no *.pangolin.csv (non-SARS pathogen, --skip_pangolin, or empty consensus)
        description: "Pangolin lineage assignments for each sample"
        config:
          type: "Table"
          metatype: "Aggregated"
          source: "transformed"
          transform:
            recipe: "pangolin/pangolin_lineages.py"
          dc_specific_properties:
            format: "CSV"
            columns_description:
              "sample": "Sample identifier"
              "lineage": "PANGO lineage designation"
              "conflict": "Lineage assignment conflict score"
              "ambiguity_score": "Ambiguity in lineage assignment"
              "scorpio_call": "Scorpio constellation call"
              "scorpio_support": "Scorpio support score"
              "scorpio_conflict": "Scorpio constellation conflict score"
              "scorpio_notes": "Scorpio free-text notes on the call"
              "pangolin_version": "Pangolin software version"
              "note": "Pangolin free-text note on the assignment"
              "qc_status": "QC status (pass/fail)"

      - data_collection_tag: "nextclade_results"
        optional: true  # no nextclade output (non-SARS pathogen, --skip_nextclade, or empty consensus)
        description: "Nextclade clade assignments and sequence quality metrics"
        config:
          type: "Table"
          metatype: "Aggregated"
          source: "transformed"
          transform:
            recipe: "nextclade/nextclade_results.py"
          dc_specific_properties:
            format: "CSV"
            columns_description:
              "sample": "Sample identifier"
              "clade": "Nextclade clade designation"
              "Nextclade_pango": "PANGO lineage from Nextclade"
              "totalSubstitutions": "Total nucleotide substitutions vs reference"
              "totalDeletions": "Total deletions vs reference"
              "totalInsertions": "Total insertions vs reference"
              "totalFrameShifts": "Total frame shifts detected"
              "totalMissing": "Total missing (N) bases"
              "totalNonACGTNs": "Total non-ACGTN characters"
              "alignmentScore": "Alignment quality score"
              "coverage": "Genome coverage fraction"
              "qc_overallScore": "Nextclade overall QC score"
              "qc_overallStatus": "Nextclade QC status (good/mediocre/bad)"

      # ----------------------------------------------------------------
      # Mosdepth coverage data collections
      # ----------------------------------------------------------------

      - data_collection_tag: "mosdepth_amplicon_coverage"
        optional: true  # amplicon coverage absent without a primer panel (metagenomic/non-SARS)
        description: "Per-amplicon coverage depth across all samples (from mosdepth)"
        config:
          type: "Table"
          metatype: "Aggregated"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: "variants/bowtie2/mosdepth/amplicon/all_samples.mosdepth.coverage.tsv"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "chrom": "Chromosome/reference sequence"
              "start": "Amplicon start position on reference"
              "end": "Amplicon end position on reference"
              "region": "ARTIC amplicon name (e.g., SARS-CoV-2_1)"
              "coverage": "Mean read coverage depth for amplicon"
              "sample": "Sample identifier"

      - data_collection_tag: "mosdepth_genome_coverage"
        optional: true  # genome coverage absent when no bowtie2 alignment (nanopore/artic)
        description: "Genome-wide coverage in 200bp windows across all samples (from mosdepth)"
        config:
          type: "Table"
          metatype: "Aggregated"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: "variants/bowtie2/mosdepth/genome/all_samples.mosdepth.coverage.tsv"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "chrom": "Chromosome/reference sequence"
              "start": "Window start position on reference"
              "end": "Window end position on reference"
              "coverage": "Mean read coverage depth for window"
              "sample": "Sample identifier"

      - data_collection_tag: "mosdepth_amplicon_heatmap"
        optional: true  # amplicon heatmap absent without a primer panel
        description: "Log10 amplicon coverage heatmap matrix (samples × amplicons, from mosdepth)"
        config:
          type: "Table"
          metatype: "Aggregated"
          scan:
            mode: "recursive"
            scan_parameters:
              regex_config:
                pattern: "variants/bowtie2/mosdepth/amplicon/all_samples.mosdepth.heatmap.tsv"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Sample identifier (row index)"

      # ----------------------------------------------------------------
      # Advanced-viz canonical-schema DCs (consume the upstream typed DCs
      # above via dc_ref and rename to the role-based schema required by
      # depictio/models/components/advanced_viz/schemas.py).
      # ----------------------------------------------------------------

      # KEPT intentionally (unlike volcano/qq/lollipop, which were retired as
      # pure remappers). The recipe is a rename, but the SEPARATE DC earns its
      # keep by isolating the oncoplot's "Mutation Type" filter from the shared
      # variants_long scope — rebinding to variants_long would couple it to the
      # lollipop / variants-table filters. catalog/ivar/variants_long.yaml also
      # declares oncoplot as a render, so the relationship stays documented.
      - data_collection_tag: "oncoplot_canonical"
        optional: true  # dc_ref variants_long
        description: "Oncoplot-ready variant matrix (sample_id × gene × mutation_type)"
        config:
          type: "Table"
          metatype: "Aggregated"
          source: "transformed"
          transform:
            recipe: "nf-core/viralrecon/oncoplot_canonical.py"
          dc_specific_properties:
            format: "CSV"
            columns_description:
              "sample_id": "Sample identifier"
              "gene": "Gene annotation"
              "mutation_type": "Variant effect (cell colour)"
              "mutation_label": "Formatted mutation label (hover)"

      - data_collection_tag: "complex_heatmap_canonical"
        optional: true  # dc_ref mosdepth_amplicon_heatmap
        description: "ComplexHeatmap-ready amplicon-coverage matrix (samples × amplicons)"
        config:
          type: "Table"
          metatype: "Aggregated"
          source: "transformed"
          transform:
            recipe: "mosdepth/complex_heatmap_canonical.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "sample": "Sample identifier (use as index_column)"

      - data_collection_tag: "coverage_track_canonical"
        optional: true  # dc_ref mosdepth_genome_coverage
        description: "Coverage-track-ready genome-coverage tracks (chromosome / position / value)"
        config:
          type: "Table"
          metatype: "Aggregated"
          source: "transformed"
          transform:
            recipe: "mosdepth/coverage_track_canonical.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
              "chromosome": "Chromosome / reference sequence (renamed from chrom)"
              "position": "Window start position"
              "value": "Mean coverage depth"
              "end": "Window end position"
              "sample": "Sample identifier (faceting)"

      - data_collection_tag: "sankey_canonical"
        optional: true  # dc_ref pangolin_lineages + nextclade_results
        description: "Sankey-ready classification funnel (qc_status → lineage → clade)"
        config:
          type: "Table"
          metatype: "Aggregated"
          source: "transformed"
          transform:
            recipe: "nf-core/viralrecon/sankey_canonical.py"
          dc_specific_properties:
            format: "CSV"
            columns_description:
              "sample": "Sample identifier"
              "qc_status": "Pangolin QC status"
              "lineage": "PANGO lineage"
              "clade": "Nextclade clade"

      # Tier 2 derivations — UpSet (mutation × lineage) + live PCA feature matrix.
      - data_collection_tag: "upset_canonical"
        optional: true  # dc_ref variants_long
        description: "UpSet-ready mutation × lineage binary membership matrix"
        config:
          type: "Table"
          metatype: "Aggregated"
          source: "transformed"
          transform:
            recipe: "nf-core/viralrecon/upset_canonical.py"
          dc_specific_properties:
            format: "CSV"
            columns_description:
              "mutation_label": "Variant identifier (formatted GENE:REFposALT)"

      - data_collection_tag: "variant_feature_matrix_canonical"
        optional: true  # dc_ref variants_long
        description: "Sample × mutation binary matrix for live PCA / UMAP embedding"
        config:
          type: "Table"
          metatype: "Aggregated"
          source: "transformed"
          transform:
            recipe: "nf-core/viralrecon/variant_feature_matrix_canonical.py"
          dc_specific_properties:
            format: "CSV"
            columns_description:
              "sample_id": "Sample identifier (row index)"

# ============================================================================
# RUNTIME LINKS CONFIGURATION
# ============================================================================
# Links use data_collection_tag references (resolved to IDs at instantiation)
# ============================================================================

links:
  # Link 1: Summary Metrics -> MultiQC (for cross-filtering)
  - source_dc_tag: "summary_metrics"
    source_column: "sample"
    target_dc_tag: "multiqc_data"
    target_type: "multiqc"
    link_config:
      resolver: "sample_mapping"
      target_field: "sample_name"
    description: "Filter MultiQC by sample selections from summary metrics"
    enabled: true

  # Link 2: Summary Metrics -> Variants Long
  - source_dc_tag: "summary_metrics"
    source_column: "sample"
    target_dc_tag: "variants_long"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter variants table by selected samples"
    enabled: true

  # Link 3: Summary Metrics -> Pangolin Lineages
  - source_dc_tag: "summary_metrics"
    source_column: "sample"
    target_dc_tag: "pangolin_lineages"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter Pangolin lineages by selected samples"
    enabled: true

  # Link 4: Summary Metrics -> Nextclade Results
  - source_dc_tag: "summary_metrics"
    source_column: "sample"
    target_dc_tag: "nextclade_results"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter Nextclade results by selected samples"
    enabled: true

  # Link 5: Summary Metrics -> Mosdepth Amplicon Coverage
  - source_dc_tag: "summary_metrics"
    source_column: "sample"
    target_dc_tag: "mosdepth_amplicon_coverage"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter amplicon coverage by selected samples"
    enabled: true

  # Link 6: Summary Metrics -> Mosdepth Genome Coverage
  - source_dc_tag: "summary_metrics"
    source_column: "sample"
    target_dc_tag: "mosdepth_genome_coverage"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter genome coverage by selected samples"
    enabled: true

  # Link 7: Summary Metrics -> Mosdepth Amplicon Heatmap
  - source_dc_tag: "summary_metrics"
    source_column: "sample"
    target_dc_tag: "mosdepth_amplicon_heatmap"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter amplicon heatmap by selected samples"
    enabled: true

  # Link 8: Summary Metrics -> Complex Heatmap (canonical)
  #
  # `complex_heatmap_canonical` is a pass-through of the amplicon heatmap, and it
  # is the collection the only complex_heatmap tile in the project actually
  # binds. Without this link a filter set on any other summary_metrics column
  # (lineage, coverage, variant yield) is never translated onto it: the resolver
  # rewrites a filter to the link's target field, and with no link there is
  # nothing to rewrite to. The tile then logs FILTER MISMATCH and renders the
  # full matrix while every neighbouring tile has narrowed.
  - source_dc_tag: "summary_metrics"
    source_column: "sample"
    target_dc_tag: "complex_heatmap_canonical"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the clustered amplicon heatmap by selected samples"
    enabled: true

  # Links 9-12: the remaining `*_canonical` collections a dashboard tile binds.
  #
  # Same reasoning as link 8, and the same one-line-per-collection fix. Each of
  # these backs an advanced_viz tile that sits in a section next to a linked
  # tile: without the link the genome coverage track stays at every sample while
  # the amplicon track beside it narrows, and the oncoplot cards keep counting
  # the full cohort while the variant cards above them do not. `upset_canonical`
  # is deliberately absent — its columns are lineage names, so the runtime
  # narrows it by value with no link needed.
  - source_dc_tag: "summary_metrics"
    source_column: "sample"
    target_dc_tag: "coverage_track_canonical"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the genome coverage track by selected samples"
    enabled: true

  - source_dc_tag: "summary_metrics"
    source_column: "sample"
    target_dc_tag: "sankey_canonical"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample"
    description: "Filter the classification funnel by selected samples"
    enabled: true

  # The two matrices below index samples as `sample_id`, not `sample`.
  - source_dc_tag: "summary_metrics"
    source_column: "sample"
    target_dc_tag: "oncoplot_canonical"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample_id"
    description: "Filter the oncoplot by selected samples"
    enabled: true

  - source_dc_tag: "summary_metrics"
    source_column: "sample"
    target_dc_tag: "variant_feature_matrix_canonical"
    target_type: "table"
    link_config:
      resolver: "direct"
      target_field: "sample_id"
    description: "Filter the variant feature matrix by selected samples"
