# Megatest manifest for nf-core/pairgenomealign 3.0.4 (read by scripts/nfcore_megatest.py).
#
# Which AWS megatest run this template was validated against and the tables-only
# subset of it that the template recipes and MultiQC need. Fetch it with:
#
#   python scripts/nfcore_megatest.py fetch --pipeline pairgenomealign --version 3.0.4 --max-file-mb 50 [--dest DIR]
#   bash download_test_data.sh [DIR]      # same thing
#
# Keys are fnmatch globs relative to run_root (here the prefix root) and are
# mirrored 1:1 below the destination, which becomes the template DATA_ROOT.
#
# test_full profile: 34 query genomes (primates plus one rodent outgroup) aligned
# to one target assembly. The run is 42.8 GB, almost all of it alignments
# (alignment/*.o2o.maf.gz, 0.1 to 1.7 GB per pair, and one merged CRAM); the
# template reads the per-pair summaries LAST writes next to them, so the
# subset is about 20 MB.
#
# The pipeline does not publish its samplesheet, so the template ships it under
# input/samplesheet.csv (the test_full sheet, sample + fasta) together with a
# design table, input/genome_metadata.tsv (sample, clade, divergence_mya), that
# download_test_data.sh copies into {dest}/input/. The design table was written
# for the megatest from the taxonomy of each genome; the template never parses
# genome names.
#
# Synteny: the ring on the Synteny tab reads the PSL export of the one-to-one
# alignment (--export_aln_to psl). This megatest ran with no_export, so it has
# no PSL and the synteny collection is skipped (optional) on it.
pipeline: pairgenomealign
version: "3.0.4"
# s3://nf-core-awsmegatests/pairgenomealign/results-<results_sha>/ == the 3.0.4 release tag_sha.
results_sha: "8ee09a1cdc920fc90cd62358952045e5019e1fe0"
run_root: ""
multiqc:
  version: "1.33"
  parquet: multiqc/multiqc_data/multiqc.parquet
  reprocess: false
keys:
  - pipeline_info/params_*.json
  - pipeline_info/*software*versions*.yml
  # MultiQC parquet: pairgenomealign's custom content sections (one-to-one
  # identity, last-train parameters, assembly-scan contig and base content).
  - multiqc/multiqc_data/multiqc.parquet
  # Per-pair summaries last-split and last-train write next to each alignment.
  - alignment/*.o2o.tsv
  - alignment/*.o2o.matrix.txt
  - alignment/*.train.tsv
  # Per-genome assembly statistics and poly-N gaps of the query assemblies.
  - assemblyscan/*.json
  - cutn/*.bed
  #
  # Deliberately NOT fetched:
  #   alignment/*.o2o.maf.gz (0.1 to 1.7 GB each, 42 GB in total) and the merged
  #     CRAM (4.2 GB): the alignments themselves; the template reads their
  #     summaries, and synteny from the optional PSL export instead.
  #   alignment/*.fasta.gz and indexes: the target genome.
  #   alignment/*.png: last-dotplot images (Depictio renders no image files
  #     from a template scan).
  #   alignment/*.train: the full last-train log; *.train.tsv holds its result.
  #   targetgenome/*.cuts.bed: empty on this run (the target has no N run).
prefix_keys: []
renames: {}
# Megatest-specific terms that must never appear in the dashboard texts
# (checked by the template lint test).
forbidden_terms:
  - Homo sapiens
  - Homo_sapiens
  - human
  - chimpanzee
  - bonobo
  - gorilla
  - orangutan
  - gibbon
  - macaque
  - lemur
  - mouse
  - Mus musculus
  - Mus_musculus
  - primate
  - primates
  - Pan troglodytes
  - Pan paniscus
  - Macaca mulatta
  - T2T
  - CHM13
  - GRCh38
  - GCF_009914755.1
  - GCF_000001405.40
  - NC_060925.1
  - Great apes
  - Old World monkeys
  - New World monkeys
post_fetch_help: |
  === Quick test commands ===

  # The samplesheet is not published by the pipeline: the template's reference
  # vars read {dest}/input/genome_metadata.tsv (download_test_data.sh copies the
  # vendored design table there). Pass --var METADATA_FILE=... for another run.

  # 1. Dry run (validates the template against the data, no ingestion)
  depictio-cli run --template nf-core/pairgenomealign/3.0.4 --data-root {dest} --var METADATA_FILE={dest}/input/genome_metadata.tsv --dry-run

  # 2. Full run (needs a reachable server and ~/.depictio/CLI.yaml)
  depictio-cli run --template nf-core/pairgenomealign/3.0.4 --data-root {dest} --var METADATA_FILE={dest}/input/genome_metadata.tsv
