# =========================================================================
# Tab 4 - Synteny: where each query aligns on the target
# =========================================================================
- title: Synteny
  subtitle: Target and query sequences on one ring, one chord per long alignment, from the PSL export of the one-to-one alignment
  tab_order: 4
  tab_icon: mdi:vector-link
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Synteny scope
    icon: mdi:tune
    color: grape
    description: The query genome the ring shows, and the orientations kept
  grid_sections:
  - name: Synteny at a glance
    icon: mdi:counter
    color: grape
    description: Matching bases, spans and orientation of the links in scope
  - name: Synteny ring
    icon: mdi:chart-donut
    color: grape
    description: Target and query sequences with one chord per alignment
  - name: Link tables
    icon: mdi:table
    color: gray
    description: The alignments behind the chords
    collapsed: true
  components:
  - component_type: text
    tag: pg-syn-intro
    section: Synteny at a glance
    workflow_tag: pairgenomealign
    data_collection_tag: last_synteny_links
    title: Where each query genome lands on the target
    title_size: sm
    title_align: left
    order: 2
    alignment: left
    body: >
      The ring opens on one query genome, change it on the left: each chord
      joins a target sequence to the query sequence (prefixed q:) it aligns to,
      weighted by matching bases. This tab needs a run started with
      --export_aln_to psl and is left out otherwise.
    layout: {x: 0, y: 0, w: 8, h: 2}
  - component_type: card
    tag: pg-syn-card-weight
    section: Synteny at a glance
    workflow_tag: pairgenomealign
    data_collection_tag: last_synteny_links
    use: last/synteny_links
    aggregation: sum
    column_name: weight
    column_type: int64
    secondary_layout: top_n
    breakdown_col: chrom_a
    top_n_count: 3
    display: {icon_name: 'mdi:relation-many-to-many', title_font_size: xl, value_font_size: xl}
    title: Matching bases in the links
    title_size: sm
    title_align: left
    layout: {x: 0, y: 2, w: 2, h: 2}
  - component_type: card
    tag: pg-syn-card-span
    section: Synteny at a glance
    workflow_tag: pairgenomealign
    data_collection_tag: last_synteny_links
    use: last/synteny_links
    aggregation: sum
    column_name: aligned_bp
    column_type: int64
    secondary_layout: top_n
    breakdown_col: chrom_a
    top_n_count: 3
    display: {icon_name: 'mdi:ruler', title_font_size: xl, value_font_size: xl}
    title: Target span of the links
    title_size: sm
    title_align: left
    layout: {x: 2, y: 2, w: 2, h: 2}
  - component_type: card
    tag: pg-syn-card-orientation
    section: Synteny at a glance
    workflow_tag: pairgenomealign
    data_collection_tag: last_synteny_links
    use: last/synteny_links
    aggregation: nunique
    column_name: category
    column_type: object
    secondary_layout: donut
    breakdown_col: category
    display: {icon_name: 'mdi:chart-donut', title_font_size: xl, value_font_size: xl}
    title: Link orientation
    title_size: sm
    title_align: left
    layout: {x: 4, y: 2, w: 2, h: 2}
  - component_type: card
    tag: pg-syn-card-identity
    section: Synteny at a glance
    workflow_tag: pairgenomealign
    data_collection_tag: last_synteny_links
    use: last/synteny_links
    aggregation: median
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    column_name: identity_pct
    column_type: float64
    display: {icon_name: 'mdi:check-decagram', title_font_size: xl, value_font_size: xl}
    title: Identity of the links
    title_size: sm
    title_align: left
    layout: {x: 6, y: 2, w: 2, h: 2}
  - component_type: advanced_viz
    tag: pg-syn-av-ring
    index: pg-syn-av-ring
    section: Synteny ring
    workflow_tag: pairgenomealign
    data_collection_tag: last_synteny_links
    use: last/synteny_ring
    config:
      max_links: 2000
      colour_by: category
      show_labels: true
      intra_chromosomal: false
      selection_enabled: true
      selection_column: label
    title: Synteny between the target and the selected query
    description: Target sequences and query sequences share the ring; chord width is the matching bases of the alignment and its colour its orientation. Click chords to select their alignments in the table.
    title_size: h3
    layout: {x: 0, y: 0, w: 8, h: 9}
  - component_type: table
    tag: pg-syn-table-links
    section: Link tables
    workflow_tag: pairgenomealign
    data_collection_tag: last_synteny_links
    use: last/synteny_links
    columns: [label, chrom_a, start_a, end_a, chrom_b, start_b, end_b, weight, aligned_bp, identity_pct, category, rank]
    row_selection_enabled: true
    row_selection_column: label
    title: Alignments behind the chords
    description: Target and query interval, matching bases, identity and orientation of the longest alignments of each pair.
    title_size: h3
    title_align: left
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: interactive
    tag: pg-syn-filter-query
    index: pg-syn-query-select
    section: Synteny scope
    group: Synteny
    workflow_tag: pairgenomealign
    data_collection_tag: last_synteny_links
    interactive_component_type: Select
    always_selected: true
    column_name: query
    column_type: object
    display: {title_size: md, custom_color: '#AB47BC', icon_name: 'mdi:dna'}
    placement: left
    title: Query genome
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    tag: pg-syn-filter-orientation
    index: pg-syn-orientation-filter
    section: Synteny scope
    group: Synteny
    workflow_tag: pairgenomealign
    data_collection_tag: last_synteny_links
    interactive_component_type: MultiSelect
    column_name: category
    column_type: object
    display: {title_size: md, custom_color: '#EC407A', icon_name: 'mdi:swap-horizontal'}
    placement: left
    title: Orientation
    layout: {x: 0, y: 3, w: 1, h: 3}
