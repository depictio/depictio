    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: pairgenomealign
    data_collection_tag: seqtk_cutn_gap_lengths
    use: seqtk/gap_length_matrix
    config:
      sort_by: none
      show_profile: true
      reference_position: 2
      reference_label: 100 bp
    section: Scaffolding gaps
    tag: pg-asm-av-gap-lengths
    index: asm-gap-lengths
    title: Gap lengths per assembly
    description: One row per assembly, the share of its runs of N in each length bin. One dark cell is a fixed filler, the dotted line marks the usual 100 bp one; a spread row comes from estimated sizes.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: pairgenomealign
    data_collection_tag: assemblyscan_stats
    use: assemblyscan/stats
    row_selection_enabled: true
    row_selection_column: genome
    section: Assembly tables
    tag: pg-asm-table-stats
    index: asm-table-stats
    title: Assembly statistics
    description: Sequence counts, length statistics, N50, L50 and base composition of every query assembly.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: pairgenomealign
    data_collection_tag: seqtk_cutn_gaps
    use: seqtk/cutn_gaps
    row_selection_enabled: true
    row_selection_column: genome
    section: Assembly tables
    tag: pg-asm-table-gaps
    index: asm-table-gaps
    title: Assembly gaps
    description: Runs of N per assembly, their total, median and longest length. A genome without gaps has no row.
    layout: {x: 0, y: 6, w: 8, h: 6}
# ============================================================================
# Genome alignment
# ============================================================================
- title: Alignment
  subtitle: How much of the target does each genome cover, at what identity?
  tab_group: Genome alignment
  tab_order: 3
  tab_icon: mdi:align-horizontal-left
  tab_icon_color: violet
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Alignment scope
    icon: mdi:filter-variant
    color: violet
    description: Keep genome pairs inside an identity or target coverage band
  grid_sections:
  - name: Alignment at a glance
    icon: mdi:counter
    color: violet
    description: Identity, coverage, aligned length and fitted gap cost across the pairs
  - name: Identity and coverage
    icon: mdi:chart-scatter-plot
    color: violet
    description: Every genome by target coverage and identity, with the record of the picked one
  - name: Fitted parameters
    icon: mdi:tune
    color: violet
    description: The gap opening cost last-train fitted, against the identity it trained on
  - name: Alignment tables
    icon: mdi:table
    color: gray
    description: The one-to-one alignment and the fitted scoring parameters per genome pair
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      [LAST](https://gitlab.com/mcfrith/last) aligns every query to the target, and last-split
      keeps the one-to-one alignment. Identity falls with divergence, while coverage of the target
      also falls with assembly gaps, so a genome low on coverage but not on identity points back to
      the Assemblies tab. Click a point to open the record of its genome.
    tag: pg-aln-intro
    index: aln-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: pairgenomealign
    data_collection_tag: last_split_identity
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: percent_identity
    column_type: float64
    display:
      icon_name: mdi:check-decagram
      custom_color: violet
    section: Alignment scope
    group: Alignment
    tag: pg-aln-filter-identity
    index: aln-identity-range
    title: Percent identity
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: pairgenomealign
    data_collection_tag: last_split_identity
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: target_aligned_pct
    column_type: float64
    display:
      icon_name: mdi:relation-many-to-many
      custom_color: teal
    section: Alignment scope
    group: Alignment
    tag: pg-aln-filter-coverage
    index: aln-coverage-range
    title: Target covered (%)
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: pairgenomealign
    data_collection_tag: last_split_identity
    use: last/identity_median
    aggregation: median
    column_name: percent_identity
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:check-decagram
      icon_color: violet
      caption: median per genome, with the spread
      decimals: 1
    section: Alignment at a glance
    tag: pg-aln-card-identity
    index: aln-card-identity
    title: Percent identity
    description: Identical columns over all alignment columns, gaps included, in percent.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: pairgenomealign
    data_collection_tag: last_split_identity
    use: last/target_coverage
    aggregation: median
    column_name: target_aligned_pct
    column_type: float64
    secondary_layout: histogram
    display:
      icon_name: mdi:relation-many-to-many
      icon_color: teal
      caption: share of the target, per genome (%)
      decimals: 1
    section: Alignment at a glance
    tag: pg-aln-card-coverage
    index: aln-card-coverage
    title: Target covered
    description: Aligned length over the target genome length, in percent. Distant and fragmented genomes cover less.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: pairgenomealign
    data_collection_tag: last_split_identity
    use: last/aligned_length
    aggregation: median
    column_name: aligned_bp
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:arrow-expand-horizontal
      icon_color: blue
      caption: alignment columns, per genome
      format: si
    section: Alignment at a glance
    tag: pg-aln-card-aligned
    index: aln-card-aligned
    title: Aligned length
    description: Length of the one-to-one alignment in alignment columns.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: pairgenomealign
    data_collection_tag: last_train_params
    use: last/gap_open_cost
    aggregation: median
    column_name: deletion_open_cost
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:cog-outline
      icon_color: orange
      caption: fitted opening cost, per genome pair
      decimals: 0
    section: Alignment at a glance
    tag: pg-aln-card-gapcost
    index: aln-card-gapcost
    title: Gap opening cost
    description: Cost last-train fitted for opening a gap (lastal -a). A closer genome gets a higher cost.
    layout: {x: 6, y: 0, w: 2, h: 2}
  # Bound to the genome hub, which carries the design group the points take
  # their colour from; the hub always has the identity columns.
  - component_type: advanced_viz
    workflow_tag: pairgenomealign
    data_collection_tag: genomes
    viz_kind: scatter_xy
    config:
      viz_kind: scatter_xy
      x_col: target_aligned_pct
      y_col: percent_identity
      label_col: genome
      color_col: '{GROUP_COL}'
      size_col: aligned_bp
      x_title: Target covered by the one-to-one alignment (%)
      y_title: Percent identity
      legend_pos: bottom
      selection_enabled: true
      selection_column: genome
    section: Identity and coverage
    tag: pg-aln-av-identity-coverage
    index: aln-identity-coverage
    title: Target coverage against identity per genome
    description: One point per genome, sized by its aligned length. Points low and left are the most divergent; one left of genomes of similar identity lost coverage to its assembly.
    layout: {x: 0, y: 0, w: 5, h: 7}
  - component_type: advanced_viz
    workflow_tag: pairgenomealign
    data_collection_tag: genomes
    viz_kind: record_card
    config:
      viz_kind: record_card
      linked_component: aln-identity-coverage
      id_col: genome
      title_col: genome
      selection_source: scatter_selection
      sections:
        Genome: [genome, target, pair]
        Alignment: [aligned_bp, percent_identity, target_aligned_pct, query_aligned_pct, blocks]
        Divergence: [k80_distance, ts_tv_ratio]
        Assembly: [contigs, total_length, n50, gc_pct, gaps, gap_bp]
    section: Identity and coverage
    tag: pg-aln-av-genome-record
    index: aln-genome-record
    title: Picked genome
    description: The genome picked on the plot, with its alignment, divergence and assembly.
    layout: {x: 5, y: 0, w: 3, h: 7}
  - component_type: advanced_viz
    workflow_tag: pairgenomealign
    data_collection_tag: last_train_params
    use: last/gap_cost_vs_identity
    config:
      x_title: Identity of the training alignments (%)
      y_title: Gap opening cost
      legend_pos: none
      selection_enabled: true
      selection_column: query
    section: Fitted parameters
    tag: pg-aln-av-fitted-costs
    index: aln-fitted-costs
    title: Fitted gap cost against training identity
    description: One point per genome pair. A pair off the trend was fitted on an unusual training sample.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: pairgenomealign
    data_collection_tag: last_split_identity
    use: last/split_identity
    # The target and the pair key are the same on every row of a run.
    columns: [query, aligned_bp, percent_identity, percent_identity_no_gaps, target_aligned_pct, query_aligned_pct, query_sequences, query_length]
    row_selection_enabled: true
    row_selection_column: query
    section: Alignment tables
    tag: pg-aln-table-identity
    index: aln-table-identity
    title: One-to-one alignment per query genome
    description: Aligned length, identity with and without gaps, and the share of each genome covered.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: table
    workflow_tag: pairgenomealign
    data_collection_tag: last_train_params
    use: last/train_params
    columns: [query, training_percent_identity, score_scale, deletion_open_cost, insertion_open_cost, deletion_extend_cost, insertion_extend_cost, strand_setting]
    section: Alignment tables
    tag: pg-aln-table-train
    index: aln-table-train
    title: Fitted scoring parameters per genome pair
    description: Training identity, score scale, and opening and extension costs for deletions and insertions.
    layout: {x: 0, y: 6, w: 8, h: 6}
- title: Divergence
  subtitle: How far has each genome diverged from the target?
  tab_group: Genome alignment
  tab_order: 4
  tab_icon: mdi:family-tree
  tab_icon_color: indigo
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Divergence scope
    icon: mdi:filter-variant
    color: indigo
    description: Keep genome pairs inside a K80 distance band
  grid_sections:
  - name: Divergence at a glance
    icon: mdi:counter
    color: indigo
    description: Distance, transition bias, alignment blocks and deletions across the pairs
  - name: Saturation
    icon: mdi:chart-scatter-plot
    color: indigo
    description: Transition bias against raw distance, one point per genome pair
  - name: Substitution spectrum
    icon: mdi:chart-box-outline
    color: indigo
    description: The share of each of the 12 directed substitutions, per genome
  - name: Divergence tables
    icon: mdi:table
    color: gray
    description: Substitution counts and the five distance estimates per genome pair
    collapsed: true
  components:
  - component_type: text
    order: 1
    body: >
      Distances are counted on the aligned A, C, G and T columns of the one-to-one alignment. The
      K80 distance corrects the raw share of substituted columns for multiple hits, and the ratio
      of transitions to transversions falls as they saturate. Genomes that cluster apart in the
      spectrum have a different substitution process, not only a different distance.
    tag: pg-div-intro
    index: div-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: pairgenomealign
    data_collection_tag: last_split_matrix
    interactive_component_type: RangeSlider
    show_histogram: true
    column_name: k80_distance
    column_type: float64
    display:
      icon_name: mdi:family-tree
      custom_color: indigo
    section: Divergence scope
    group: Divergence
    tag: pg-div-filter-k80
    index: div-k80-range
    title: K80 distance
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: card
    workflow_tag: pairgenomealign
    data_collection_tag: last_split_matrix
    use: last/k80_median
    aggregation: median
    column_name: k80_distance
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:family-tree
      icon_color: indigo
      caption: median per genome, with the spread
      decimals: 3
    section: Divergence at a glance
    tag: pg-div-card-k80
    index: div-card-k80
    title: K80 distance
    description: Kimura two-parameter distance on the aligned A, C, G and T columns, substitutions per site.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: pairgenomealign
    data_collection_tag: last_split_matrix
    use: last/ts_tv_median
    aggregation: median
    column_name: ts_tv_ratio
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:scale-balance
      icon_color: cyan
      caption: median per genome, with the spread
      decimals: 2
    section: Divergence at a glance
    tag: pg-div-card-tstv
    index: div-card-tstv
    title: Transitions over transversions
    description: Transitions are purine to purine or pyrimidine to pyrimidine substitutions. The ratio falls as they saturate.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: pairgenomealign
    data_collection_tag: last_split_matrix
    use: last/blocks_median
    aggregation: median
    column_name: blocks
    column_type: int64
    secondary_layout: histogram
    display:
      icon_name: mdi:shape-outline
      icon_color: pink
      caption: blocks per genome, how they spread
      format: si
    section: Divergence at a glance
    tag: pg-div-card-blocks
    index: div-card-blocks
    title: Alignment blocks
    description: Blocks of the one-to-one alignment. A genome cut into more blocks is more rearranged or more fragmented.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: pairgenomealign
    data_collection_tag: last_split_matrix
    use: last/query_gap_median
    aggregation: median
    column_name: query_gap_columns
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:content-cut
      icon_color: orange
      caption: columns missing in the query, per genome
      format: si
    section: Divergence at a glance
    tag: pg-div-card-deletions
    index: div-card-deletions
    title: Deletions in the query
    description: Alignment columns with a target base against a gap in the query.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: pairgenomealign
    data_collection_tag: last_split_matrix
    use: last/saturation_scatter
    config:
      x_title: Raw distance (share of substituted columns)
      y_title: Transitions over transversions
      legend_pos: none
      selection_enabled: true
      selection_column: query
    section: Saturation
    tag: pg-div-av-saturation
    index: div-saturation
    title: Transition bias against divergence
    description: One point per genome pair, sized by its alignment blocks. The ratio falls as multiple hits saturate the transitions.
    layout: {x: 0, y: 0, w: 8, h: 6}
  - component_type: advanced_viz
    workflow_tag: pairgenomealign
    data_collection_tag: last_split_matrix
    use: last/substitution_spectrum
    config:
      cluster_rows: true
      cluster_cols: false
      cluster_method: ward
      normalize: col_z
      colorscale: Blues
    section: Substitution spectrum
    tag: pg-div-av-spectrum
    index: div-spectrum
    title: Substitution spectrum per genome
    description: Share of each of the 12 directed substitutions, target base first, scaled per column. Genomes that cluster apart substitute differently.
    layout: {x: 0, y: 0, w: 8, h: 5}
  - component_type: table
    workflow_tag: pairgenomealign
    data_collection_tag: last_split_matrix
    use: last/split_matrix
    columns: [query, blocks, columns_analyzed, p_distance, jc69_distance, f81_distance, k80_distance, t92_distance, identical_columns, substituted_columns, transitions, transversions, ts_tv_ratio, target_gap_columns, query_gap_columns]
    row_selection_enabled: true
    row_selection_column: query
    section: Divergence tables
    tag: pg-div-table-matrix
    index: div-table-matrix
    title: Substitutions and distances per genome pair
    description: Blocks, identical and substituted columns, transitions and transversions, gap columns and the five distance estimates.
    layout: {x: 0, y: 0, w: 8, h: 6}
- title: Synteny
  subtitle: Where do the long alignments of each query land on the target?
  tab_group: Genome alignment
  tab_order: 5
  tab_icon: mdi:vector-link
  tab_icon_color: grape
  icon: /assets/images/workflows/nf-core.png
  icon_color: green
  workflow_system: nf-core
  filter_sections:
  - name: Synteny scope
    icon: mdi:filter-variant
    color: grape
    description: The query genome the ring shows, and the orientations kept
  grid_sections:
  - name: Synteny at a glance
    icon: mdi:counter
    color: grape
    description: Links, matching bases, identity and span of the alignments in scope
  - name: Synteny ring
    icon: mdi:chart-donut
    color: grape
    description: Target and query sequences on one ring, one chord per alignment
  - name: Link tables
    icon: mdi:table
    color: gray
    description: The alignments behind the chords
    collapsed: true
  components:
  # This tab needs the PSL export (--export_aln_to psl). Every component below
  # reads last_synteny_links, which is optional: a run without the export has none
  # of them, and the import drops the tab.
  - component_type: text
    order: 1
    body: >
      Each chord joins a target sequence to the query sequence it aligns to (prefixed `q:`),
      weighted by matching bases. The ring reads one query genome, the first of the list until
      another is picked on the left. This tab needs a run started with `--export_aln_to psl`.
    tag: pg-syn-intro
    index: syn-intro
    layout: {x: 0, y: 0, w: 8, h: 1}
  - component_type: interactive
    workflow_tag: pairgenomealign
    data_collection_tag: last_synteny_links
    interactive_component_type: Select
    always_selected: true
    column_name: query
    column_type: object
    display:
      icon_name: mdi:dna
      custom_color: grape
    section: Synteny scope
    group: Synteny
    tag: pg-syn-filter-query
    index: syn-query-filter
    title: Query genome
    layout: {x: 0, y: 0, w: 1, h: 3}
  - component_type: interactive
    workflow_tag: pairgenomealign
    data_collection_tag: last_synteny_links
    interactive_component_type: MultiSelect
    column_name: category
    column_type: object
    display:
      icon_name: mdi:swap-horizontal
      custom_color: pink
    section: Synteny scope
    group: Synteny
    tag: pg-syn-filter-orientation
    index: syn-orientation-filter
    title: Orientation
    layout: {x: 0, y: 3, w: 1, h: 3}
  - component_type: card
    workflow_tag: pairgenomealign
    data_collection_tag: last_synteny_links
    use: last/links_total
    aggregation: count
    column_name: label
    column_type: object
    secondary_layout: composition
    breakdown_col: category
    display:
      icon_name: mdi:vector-link
      icon_color: grape
      caption: alignments kept, by orientation
      format: si
    section: Synteny at a glance
    tag: pg-syn-card-links
    index: syn-card-links
    title: Links
    description: Long alignments kept per genome pair. The bar splits them into same strand and inverted.
    layout: {x: 0, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: pairgenomealign
    data_collection_tag: last_synteny_links
    use: last/links_weight
    aggregation: sum
    column_name: weight
    column_type: int64
    secondary_layout: top_n
    breakdown_col: chrom_a
    top_n_count: 3
    display:
      icon_name: mdi:relation-many-to-many
      icon_color: teal
      caption: the target sequences with most
      format: si
    section: Synteny at a glance
    tag: pg-syn-card-weight
    index: syn-card-weight
    title: Matching bases
    description: Matching bases in the links, the weight of their chords.
    layout: {x: 2, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: pairgenomealign
    data_collection_tag: last_synteny_links
    use: last/links_identity
    aggregation: median
    column_name: identity_pct
    column_type: float64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:check-decagram
      icon_color: violet
      caption: median per link, with the spread
      decimals: 1
    section: Synteny at a glance
    tag: pg-syn-card-identity
    index: syn-card-identity
    title: Identity of the links
    description: Matches over matches plus mismatches of an alignment, in percent.
    layout: {x: 4, y: 0, w: 2, h: 2}
  - component_type: card
    workflow_tag: pairgenomealign
    data_collection_tag: last_synteny_links
    use: last/links_span
    aggregation: median
    column_name: aligned_bp
    column_type: int64
    aggregations: [box_plot_stats]
    secondary_layout: box_plot
    display:
      icon_name: mdi:ruler
      icon_color: blue
      caption: span on the target, median with the spread
      format: si
    section: Synteny at a glance
    tag: pg-syn-card-span
    index: syn-card-span
    title: Span of the links
    description: Length of an alignment on the target in base pairs.
    layout: {x: 6, y: 0, w: 2, h: 2}
  - component_type: advanced_viz
    workflow_tag: pairgenomealign
    data_collection_tag: last_synteny_links
    use: last/synteny_ring
    config:
      max_links: 2000
      colour_by: category
      show_labels: true
      intra_chromosomal: false
      selection_enabled: true
      selection_column: label
    section: Synteny ring
    tag: pg-syn-av-ring
    index: syn-ring
    title: Synteny between the target and the picked query
    description: Target and query sequences share the ring; chord width is the matching bases and its colour the orientation. Click chords to select their alignments.
    layout: {x: 0, y: 0, w: 8, h: 9}
  - component_type: table
    workflow_tag: pairgenomealign
    data_collection_tag: last_synteny_links
    use: last/synteny_links
    columns: [label, chrom_a, start_a, end_a, chrom_b, start_b, end_b, weight, aligned_bp, identity_pct, category, rank]
    row_selection_enabled: true
    row_selection_column: label
