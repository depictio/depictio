      - data_collection_tag: "proteinfold_msa"
        description: "Alignment each MSA-based engine folded from, query first, capped at 500 rows"
        optional: true
        config:
          type: "Table"
          metatype: "Aggregate"
          source: "transformed"
          transform:
            recipe: "proteinfold/msa.py"
          dc_specific_properties:
            format: "TSV"
            columns_description:
