              "coverage": "Share of the query's residues the row covers, 0 to 1"
              "chains": "Chain layout of a complex's query row (A:1-120,B:1-98, each chain in its own numbering), empty otherwise"
              "entity": "Structure id, equal to msa_id"
              "engine": "Prediction engine"
              "target": "Target id"
              "depth": "Sequences in the full alignment, before the 500-row cap"

links:
  - source_dc_tag: "targets"
    source_column: "target"
    target_dc_tag: "proteinfold_residues"
    target_type: "table"
    link_config: {resolver: "direct"}
    description: "Filter the residue table by target"
    enabled: true
  - source_dc_tag: "targets"
    source_column: "target"
    target_dc_tag: "proteinfold_engine_plddt"
    target_type: "table"
    link_config: {resolver: "direct"}
    description: "Filter the per-engine confidence curves by target"
    enabled: true
  - source_dc_tag: "targets"
    source_column: "target"
    target_dc_tag: "proteinfold_models"
    target_type: "table"
    link_config: {resolver: "direct"}
    description: "Filter the models by target"
    enabled: true
  - source_dc_tag: "targets"
    source_column: "target"
    target_dc_tag: "proteinfold_plddt_ranks"
    target_type: "table"
    link_config: {resolver: "direct"}
    description: "Filter the per-model confidence curves by target"
    enabled: true
  - source_dc_tag: "targets"
    source_column: "target"
    target_dc_tag: "proteinfold_pae"
    target_type: "table"
    link_config: {resolver: "direct"}
    description: "Filter the PAE matrices by target"
    enabled: true
  - source_dc_tag: "targets"
    source_column: "target"
    target_dc_tag: "proteinfold_msa"
    target_type: "table"
    link_config: {resolver: "direct"}
    description: "Filter the alignments by target"
    enabled: true
  # A structure picked on the residue table (engine and target, or a residue
  # selection) keeps every engine's curve of that target on screen: the curves
  # carry no engine column, so the engine filter cannot reach them by name...
  - source_dc_tag: "proteinfold_residues"
    source_column: "target"
    target_dc_tag: "proteinfold_engine_plddt"
    target_type: "table"
    link_config: {resolver: "direct"}
    description: "Follow the picked structure's target on the per-engine curves"
    enabled: true
  # ...and narrows the alignment and the PAE matrix to that structure.
  - source_dc_tag: "proteinfold_residues"
    source_column: "entity"
    target_dc_tag: "proteinfold_msa"
    target_type: "table"
    link_config: {resolver: "direct"}
    description: "Narrow the alignment to the picked structure"
    enabled: true
  - source_dc_tag: "proteinfold_residues"
    source_column: "entity"
    target_dc_tag: "proteinfold_pae"
    target_type: "table"
    link_config: {resolver: "direct"}
    description: "Narrow the PAE matrix to the picked structure"
    enabled: true
  # The Predicted error tab picks its engine and target on the PAE table; the
  # structure id (engine and target) carries that pick to the pTM and ipTM
  # cards, which read the models.
  - source_dc_tag: "proteinfold_pae"
    source_column: "entity"
    target_dc_tag: "proteinfold_models"
    target_type: "table"
    link_config: {resolver: "direct", target_field: "entity"}
    description: "Follow the picked PAE matrix on the model scores"
    enabled: true
  - source_dc_tag: "proteinfold_models"
    source_column: "entity"
    target_dc_tag: "proteinfold_plddt_ranks"
    target_type: "table"
    link_config: {resolver: "direct"}
    description: "Follow the engines and models in scope on the per-engine curves"
    enabled: true
