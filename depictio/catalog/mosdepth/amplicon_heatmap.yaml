id: mosdepth_amplicon_heatmap
name: Amplicon coverage matrix
mode: amplicon
description: Log10 amplicon-coverage matrix (samples × amplicons).
find: { path_glob: "**/mosdepth/amplicon/all_samples.mosdepth.heatmap.tsv" }
recipe: mosdepth/complex_heatmap_canonical.py
fixture: amplicon_heatmap.tsv
renders_as:
  # `index` is not optional in practice: ComplexHeatmapConfig.index_column
  # falls back to the literal "sample_id", which this matrix does not have,
  # and the component fails to render on the dashboard even though the
  # catalog preview (which infers the index from the frame) looks fine.
  - { id: complex_heatmap, component: advanced_viz, kind: complex_heatmap, roles: {index: sample} }
