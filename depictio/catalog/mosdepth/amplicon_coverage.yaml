id: mosdepth_amplicon_coverage
name: Amplicon coverage
mode: amplicon
description: Per-amplicon coverage depth, aggregated across all samples (bindable as-is).
find: { path_glob: "**/mosdepth/amplicon/all_samples.mosdepth.coverage.tsv" }
# no recipe → declare the columns:
columns:
  chrom: String
  start: Int64
  end: Int64
  region: String
  coverage: Float64
  sample: String
fixture: amplicon_coverage.tsv
renders_as:
  - { id: coverage_track_amplicon, component: advanced_viz, kind: coverage_track, roles: {chromosome: chrom, position: start, value: coverage} }
  # Depth is the one number a coverage table is read for, and a mean alone
  # hides the drop-outs: the Tukey strip shows the spread and the outliers.
  - { component: card, column: coverage, aggregation: median, aggregations: [box_plot_stats], secondary_layout: box_plot }
