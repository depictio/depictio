# miRDeep2: discovers miRNA precursors from reads mapped to the genome, scoring
# each candidate hairpin on read stacking (mature, loop and star reads), fold
# energy and randfold significance. One result table per sample, holding a
# score-cutoff summary, the novel candidates, the known miRBase miRNAs it
# re-detected, and the miRBase miRNAs it did not. The outputs here parse that
# table; the per-sample HTML report stays a download.
