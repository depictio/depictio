# VCF is a file format, not a tool: every variant caller in nf-core publishes
# one, and the rows inside it are the same rows whichever caller wrote them.
# The reader lives in depictio/recipes/lib/vcf.py and is pure Polars (bgzip is
# gzip-compatible), so no pipeline needs a VCF dependency to get a per-variant
# table. There is no nf-core/modules entry to point `nf_core_url` at, as for
# bambu, enchantr and QIIME 2.
#
# Besides `variants`, four outputs summarise those rows for a pipeline that
# publishes VCFs without a bcftools stats report (nf-core/rnavar): the
# per-callset summary, the folded substitution spectrum, the FILTER breakdown
# and the per-sample variant density in fixed windows (the ideogram input).
# All four read the `vcf_variants` collection through `dc_ref`.
id: vcf
name: VCF
version: "1.0.0"
description: >-
  Per-variant records read straight out of the VCFs a variant caller publishes,
  for the panels that need one row per call rather than a per-file summary.
homepage: https://samtools.github.io/hts-specs/
biotools_url: null  # no bio.tools entry for this tool
source_url: https://github.com/samtools/hts-specs
stage: variants
