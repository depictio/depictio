id: melon_ranks
name: Genome-copy composition
description: >-
  Melon's marker-gene estimate of the community, as genome copies rather than
  read counts, with the seven NCBI ranks already split into their own columns.
  The rows are pooled across the long-read samples the tool ran on: the sample
  id lives only in melon's output path.
nf_core_url: https://github.com/nf-core/modules/tree/master/modules/nf-core/melon
find: { path_glob: "**/melon/*/*/*.tsv" }
recipe: melon/ranks.py
fixture: ranks.tsv
renders_as:
  # wide per-rank columns -> sunburst fits; stacked_taxonomy would need the long
  # rank column, and a per-sample axis this pooled table does not carry.
  - {
      id: sunburst,
      component: advanced_viz,
      kind: sunburst,
      roles:
        {
          ranks: [superkingdom, phylum, class, order, family, genus, species],
          abundance: abundance,
        },
    }
  - {
      component: card,
      column: species,
      aggregation: nunique,
      secondary_layout: top_n,
      breakdown_col: phylum,
      top_n_count: 4,
    }
  - {
      component: card,
      column: copy_number,
      aggregation: sum,
      aggregations: [box_plot_stats],
      secondary_layout: box_plot,
    }
  - {
      component: card,
      column: identity_mean,
      aggregation: average,
      secondary_layout: gauge,
      coverage_max: 1,
    }
  - { component: table }
