id: epitopeprediction_peptides
name: Predicted peptides
mode: epitope/peptides
description: >-
  One row per sample and peptide: its best prediction over all alleles and
  tools (allele, tool and IC50), how many alleles were scored and how many a
  tool calls it a binder of, whether it binds, does not, or could not be scored,
  and its source: gene, transcript, consequence, protein change, genomic anchor
  and UniProt accession for variant input, the protein records for protein
  input, the peptide id for peptide input.
find:
  path_glob: "**/predictions/*.tsv"
recipe: epitopeprediction/peptides.py
fixture: peptides.tsv
renders_as:
  - { id: peptide_count, component: card, column: peptide_key, aggregation: count, secondary_layout: composition, breakdown_col: call, headline: true }
  - { id: binder_count, component: card, column: peptide_key, aggregation: count, filter_expr: "col('binder') == 1", secondary_layout: composition, breakdown_col: length_class, headline: true }
  - { id: binding_alleles, component: card, column: binding_alleles, aggregation: median, filter_expr: "col('binder') == 1", secondary_layout: histogram }
  - { id: peptide_length, component: card, column: length, aggregation: median, secondary_layout: histogram }
  - id: length_histogram
    component: figure
    visu_type: histogram
    dict_kwargs: { x: length, color: call, barmode: stack }
  - { component: figure, visu_type: bar, dict_kwargs: { x: sample, color: call } }
  - { component: interactive, interactive_type: MultiSelect, column_name: call }
  - { component: interactive, interactive_type: MultiSelect, column_name: length_class }
  - { component: table, row_selection_enabled: true, row_selection_column: peptide_key }
