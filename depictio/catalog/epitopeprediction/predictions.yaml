id: epitopeprediction_predictions
name: Binding predictions
mode: epitope/predictions
description: >-
  One row per sample, peptide, allele and prediction tool that scored it: the
  0-1 affinity score, the IC50 in nM behind it, the percentile rank, the
  pipeline's binder call and an affinity class (strong, binder, weak,
  non-binding), with the peptide's length and origin (mutant, wild type or input
  sequence) and, for variant input, its gene and consequence. Alleles are
  normalised to HLA-A*02:01 with their locus and MHC class. Mutant rows whose
  wild type was predicted carry its IC50 and the agretopicity.
find:
  path_glob: "**/predictions/*.tsv"
recipe: epitopeprediction/predictions.py
fixture: predictions.tsv
renders_as:
  # Affinity against rank, one point per prediction: the two scores agree for a
  # well-calibrated tool, and a tool's binder cut-off shows as an edge.
  - id: affinity_rank_scatter
    component: advanced_viz
    kind: scatter_xy
    roles: { x: ic50_nm, y: percentile_rank, label: sequence, color: predictor }
  # Mutant against wild-type affinity: below the diagonal, the mutation
  # strengthens binding (agretopicity under 1).
  - id: mutant_wildtype_scatter
    component: advanced_viz
    kind: scatter_xy
    roles: { x: wt_ic50_nm, y: ic50_nm, label: sequence, color: allele }
  - { component: figure, visu_type: histogram, dict_kwargs: { x: log10_ic50, color: predictor, barmode: overlay } }
  - { id: prediction_count, component: card, column: row_id, aggregation: count, secondary_layout: donut, breakdown_col: predictor, headline: true }
  - { id: binder_calls, component: card, column: row_id, aggregation: count, filter_expr: "col('binder') == 1", secondary_layout: composition, breakdown_col: hla_locus }
  - { id: allele_count, component: card, column: allele, aggregation: nunique, secondary_layout: top_n, breakdown_col: hla_locus, top_n_count: 4, headline: true }
  - { id: median_ic50, component: card, column: ic50_nm, aggregation: median, secondary_layout: threshold, threshold_value: 500, threshold_direction: max }
  - { component: interactive, interactive_type: MultiSelect, column_name: allele }
  - { component: interactive, interactive_type: MultiSelect, column_name: predictor }
  - { component: interactive, interactive_type: RangeSlider, column_name: log10_ic50 }
  - { component: table, row_selection_enabled: true, row_selection_column: row_id }
