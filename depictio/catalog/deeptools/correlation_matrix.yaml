id: deeptools_correlation_matrix
name: Sample correlation matrix
mode: exploratory/correlation
description: >-
  Pairwise correlation of the genome-wide bin counts, square (samples x
  samples). Replicates of one target correlate with each other and with nothing
  else; a block that spans two targets is a swap or a contamination.
find:
  path_glob: "**/*.plotCorrelation.mat.tab"
recipe: deeptools/correlation_matrix.py
fixture: correlation_matrix.tsv
renders_as:
  # `index` is not optional in practice: ComplexHeatmapConfig.index_column falls
  # back to the literal "sample_id", which this matrix does not have.
  # C6 N/A: value columns are the run's samples, known only at ingest.
  - id: correlation_heatmap
    component: advanced_viz
    kind: complex_heatmap
    roles: {index: sample}
    title: Sample correlation
    description: >-
      Each cell is the correlation between the genome-wide bin counts of two libraries,
      with rows and columns clustered. It answers which libraries have the most similar
      signal.

      How to read: replicates of one target should form blocks of high correlation and
      correlate little with other targets or controls. A library that clusters with the
      wrong block can be a sample swap or a failed enrichment, so check the sample
      sheet and the fingerprint metrics.

      Lines and annotations: the diagonal is 1, since each library correlates perfectly with itself. The coefficient is
      Pearson or Spearman, whichever the run chose, and the clustering uses complete
      linkage.

      Source: https://deeptools.readthedocs.io/en/latest/content/tools/plotCorrelation.html
  - component: table
    title: Sample correlation table
    description: >-
      Each row is a library with its correlation to every other library. It answers the
      exact value behind a cell of the heatmap.

      How to read: sort a column to find the library closest to or furthest from another.
