id: multiqc_sompy
name: Somatic benchmark (som.py)
origin_tool: som.py
mode: sompy
description: Somatic small-variant accuracy per caller (combined / indel / SNV precision, recall, F1) as som.py reports it through MultiQC.
find: { path_glob: "**/multiqc/multiqc_data/multiqc.parquet" }
# No bundled fixture: the nf-core/variantbenchmarking MultiQC parquet is not
# shipped with the repo. `section` selects this module's plot anchors out of
# the shared report.
renders_as:
  - { component: multiqc, section: sompy }
