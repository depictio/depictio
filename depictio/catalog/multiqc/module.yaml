# MultiQC: multi-output tool, so a folder. Home of the native report plus the
# per-tool sections surfaced through it (FastQC, …). The homepage differs from
# the nf-core meta.yml, which is stale (it still says multiqc.info; MultiQC is
# now maintained under Seqera).
id: multiqc
name: MultiQC
homepage: https://seqera.io/multiqc/ # override: meta.yml stale (multiqc.info)
nf_core_url: https://github.com/nf-core/modules/tree/master/modules/nf-core/multiqc
biotools_url: https://bio.tools/multiqc # from nf-core meta.yml identifier
description: >-
  Aggregates the logs and reports of many bioinformatics tools into one
  report.
stage: qc
