id: multiqc_spaceranger
name: Space Ranger count summary
origin_tool: Space Ranger
mode: spaceranger
description: Space Ranger count's per-sample summary stats table, genomic DNA UMI estimate, median-genes-per-spot and sequencing-saturation curves and run warnings, from Space Ranger via MultiQC.
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. rnaseq multiqc/star_salmon/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
# A MultiQC 1.35 report over the nf-core/spatialvi test-dataset Space Ranger
# outs (the shared conformance parquet carries no Space Ranger section yet).
fixture: ../../projects/nf-core/spatialvi/1.0.0dev/multiqc/multiqc_data/multiqc.parquet
renders_as:
  - { component: multiqc, section: spaceranger }
