id: multiqc_vcftools
name: Ts/Tv by quality and count
origin_tool: VCFtools
mode: vcftools
description: Transition/transversion ratio as a function of variant quality and non-reference allele count, VCFtools, via MultiQC.
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. rnaseq multiqc/star_salmon/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
# reuse the bundled nf-core pipeline MultiQC parquet (not a per-module copy);
# `section` selects this module's plot anchors out of the shared report.
fixture: ../../projects/init/catalog_conformance/run_1/multiqc/multiqc_data/multiqc.parquet
renders_as:
  - component: multiqc
    section: vcftools
    title: Ts/Tv by quality and count
    description: >-
      VCFtools' transition to transversion ratio as a function of variant quality
      and non-reference allele count. It answers whether the call quality tracks
      real variants.

      How to read: The ratio should be fairly stable across the range. A ratio that
      drops at low quality shows where false calls enter, which helps you choose a
      quality filter.

      Source: https://docs.seqera.io/multiqc/modules/vcftools
