id: multiqc_nanoq
name: Long-read filtering
origin_tool: nanoq
mode: nanoq
description: Long-read length and quality distributions after filtering, from nanoq via MultiQC.
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. rnaseq multiqc/star_salmon/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
# reuse the bundled nf-core pipeline MultiQC parquet (not a per-module copy);
# `section` selects this module's plot anchors out of the shared report.
fixture: ../../projects/init/catalog_conformance/run_1/multiqc/multiqc_data/multiqc.parquet
renders_as:
  - component: multiqc
    section: nanoq
    title: Long-read filtering
    description: >-
      nanoq's MultiQC plots: the read length and read quality distributions after
      filtering, per sample. They answer what the retained long-read library looks
      like.

      How to read: A length distribution with a long tail is typical for long reads.
      A quality distribution centred low means the library will need stricter
      filtering or better basecalling.

      Source: https://docs.seqera.io/multiqc/modules/nanoq
