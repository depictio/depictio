id: multiqc_centrifuge
name: Read classification (Centrifuge)
origin_tool: Centrifuge
mode: centrifuge
description: Taxonomic read classification against a compressed FM-index (top taxa), from Centrifuge via MultiQC.
stage: taxonomy
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. rnaseq multiqc/star_salmon/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
# reuse the bundled nf-core pipeline MultiQC parquet (not a per-module copy);
# `section` selects this module's plot anchors out of the shared report.
fixture: ../../projects/init/catalog_conformance/run_1/multiqc/multiqc_data/multiqc.parquet
renders_as:
  - component: multiqc
    section: centrifuge
    title: Read classification (Centrifuge)
    description: >-
      Centrifuge's MultiQC plot: the top taxa of each library, classified against a
      compressed index, as a stacked bar per sample. It answers which organisms the
      reads come from.

      How to read: The expected organisms should dominate. A large unclassified
      share means the index lacks the organisms present. Unexpected taxa seen in
      every sample suggest a contaminant.

      Source: https://ccb.jhu.edu/software/centrifuge/
