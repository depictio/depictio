id: multiqc_truvari
name: Structural-variant benchmark (Truvari)
origin_tool: Truvari
mode: truvari
description: Structural-variant accuracy per callset (precision vs recall, TP / FP / FN classifications) as Truvari reports it through MultiQC.
find: { path_glob: "**/multiqc/multiqc_data/multiqc.parquet" }
# No bundled fixture: the nf-core/variantbenchmarking MultiQC parquet is not
# shipped with the repo. `section` selects this module's plot anchors out of
# the shared report.
renders_as:
  - { component: multiqc, section: truvari }
