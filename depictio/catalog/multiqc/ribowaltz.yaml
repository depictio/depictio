id: multiqc_ribowaltz
name: Ribo-seq periodicity
origin_tool: riboWaltz
mode: ribowaltz
description: "Ribo-seq periodicity from riboWaltz: P-site region distribution, reading-frame distribution and metagene profiles at the start and stop codons, via MultiQC."
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. riboseq multiqc/star/multiqc_report_data/
