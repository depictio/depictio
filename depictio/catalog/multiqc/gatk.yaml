id: multiqc_gatk
name: Base quality recalibration
origin_tool: GATK
mode: gatk
description: Base Quality Score Recalibration (BQSR) diagnostics, observed vs. reported quality after recalibration, from GATK4, via MultiQC.
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. rnaseq multiqc/star_salmon/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
# reuse the bundled nf-core pipeline MultiQC parquet (not a per-module copy);
# `section` selects this module's plot anchors out of the shared report.
fixture: ../../projects/init/catalog_conformance/run_1/multiqc/multiqc_data/multiqc.parquet
renders_as:
  - component: multiqc
    section: gatk
    title: Base quality recalibration
    description: >-
      GATK4's base quality score recalibration plots: observed against reported base
      quality after recalibration, per sample. They answer whether the sequencer's
      reported qualities match reality.

      How to read: Points should lie close to the diagonal after recalibration.
      Large departures mean the reported qualities were miscalibrated, which can
      bias variant calls.

      Source: https://docs.seqera.io/multiqc/modules/gatk
