id: multiqc_nonpareil
name: Coverage redundancy
origin_tool: Nonpareil
mode: nonpareil
description: Metagenome coverage and sequencing-effort redundancy curves, from Nonpareil via MultiQC.
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. rnaseq multiqc/star_salmon/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
# reuse the bundled nf-core pipeline MultiQC parquet (not a per-module copy);
# `section` selects this module's plot anchors out of the shared report.
fixture: ../../projects/init/catalog_conformance/run_1/multiqc/multiqc_data/multiqc.parquet
renders_as:
  - component: multiqc
    section: nonpareil
    title: Coverage redundancy
    description: >-
      Nonpareil's curves of metagenome coverage against sequencing effort, one line
      per sample. They answer how much of the community the sequencing has captured
      and how much more would be needed.

      How to read: A curve that flattens near full coverage means the sample is well
      sequenced. A curve still rising steeply means more sequencing would reveal new
      sequence.

      Lines and annotations: The ideal coverage and ideal sequencing effort are
      computed by Nonpareil from the model fit, as the MultiQC module describes.

      Source: https://docs.seqera.io/multiqc/modules/nonpareil
