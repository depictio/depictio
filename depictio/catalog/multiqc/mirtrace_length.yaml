id: multiqc_mirtrace_length
name: Read length distribution
origin_tool: miRTrace
mode: qc/small-rna
description: >-
  Reads per length for each library, as a percentage of the library, with the
  length band miRTrace draws (under 18 nt, 18 to 26 nt for miRNA, 26 to 40 nt,
  40 nt and over). A clean miRNA library peaks near 22 nt.
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. multiqc/<route>/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
recipe: multiqc/mirtrace_length.py
# The fixture is enriched synthetically from 20 real rows (copies with seeded noise), so the preview shows several libraries.
fixture: mirtrace_length.tsv
renders_as:
  - id: length_profile
    component: advanced_viz
    kind: profile
    title: Read length distribution
    roles: {series: sample, x: length, y: percent}
    config:
      x_title: Read length (nt)
      y_title: Percent of library reads
      shaded_bands: [[18, 26, miRNA range]]
    description: >-
      Each line is one library: the share of its reads at each length after adapter
      removal. It answers whether the library is made of miRNA-sized fragments.

      How to read: a clean miRNA library peaks near 22 nt, the typical miRNA length
      named in the miRTrace paper. A pile-up below 18 nt
      points to adapter dimers or over-trimming, and a broad smear toward longer
      reads to degraded RNA. Libraries should overlay closely.

      Lines and annotations: the shaded band spans 18 to 26 nt, the length class
      miRTrace and MultiQC treat as miRNA in their length plot.

      Sources: https://raw.githubusercontent.com/MultiQC/MultiQC/main/multiqc/modules/mirtrace/mirtrace.py
      and https://pubmed.ncbi.nlm.nih.gov/30514392/
  - component: figure
    visu_type: line
    title: Read length per library
    dict_kwargs:
      x: length
      y: percent
      color: sample
      labels: {length: Read length (nt), percent: Percent of library reads, sample: Library}
    description: >-
      Each line is one library: the share of its reads at each length, drawn as a
      plain line figure. It answers the same question as the profile above, with the
      figure's own zoom and legend controls.

      How to read: look for a peak near 22 nt and compare the libraries. A
      library whose peak sits elsewhere or is flat deserves a closer look.
  - component: table
    title: Length values
    description: >-
      One row is one library at one read length, with its read count, its share of
      the library and the length class miRTrace assigns. It gives the exact values
      behind the curves and answers where each library's reads concentrate.

      How to read: sort by share to find each library's dominant length, and look for
      libraries whose peak sits at a different length from the rest. It complements
      the read length distribution tile.
