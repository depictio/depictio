id: multiqc_happy
name: Germline benchmark (hap.py)
origin_tool: hap.py
mode: happy
description: Germline small-variant accuracy per callset (SNP / INDEL precision, recall, F1) as hap.py reports it through MultiQC.
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. rnaseq multiqc/star_salmon/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
# reuse the bundled catalog-conformance MultiQC parquet (it carries the happy/
# sompy/truvari benchmark sections generated by scripts/multiqc_stubs.py);
# `section` selects this module's plot anchors out of the shared report.
fixture: ../../projects/init/catalog_conformance/run_1/multiqc/multiqc_data/multiqc.parquet
renders_as:
  - { component: multiqc, section: happy }
