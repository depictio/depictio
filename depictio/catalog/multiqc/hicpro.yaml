id: multiqc_hicpro
name: HiC-Pro mapping and filtering
origin_tool: HiC-Pro
mode: hicpro
description: Read mapping, pairing, valid-pair filtering and contact statistics, HiC-Pro plots aggregated by MultiQC.
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. rnaseq multiqc/star_salmon/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
# reuse the bundled nf-core pipeline MultiQC parquet (not a per-module copy);
# `section` selects this module's plot anchors out of the shared report.
fixture: ../../projects/init/catalog_conformance/run_1/multiqc/multiqc_data/multiqc.parquet
renders_as:
  - component: multiqc
    section: hicpro
    title: HiC-Pro mapping and filtering
    description: >-
      HiC-Pro's MultiQC plots: read mapping, pairing, valid-pair filtering and
      contact statistics per sample. They answer how many read pairs end up as
      usable chromatin contacts.

      How to read: A high share of valid interaction pairs is good. Many dangling
      ends or self-circles point to inefficient ligation or digestion, which lowers
      usable depth.

      Source: https://docs.seqera.io/multiqc/modules/hicpro
