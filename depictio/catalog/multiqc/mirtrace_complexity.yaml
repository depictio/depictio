id: multiqc_mirtrace_complexity
name: miRNA complexity curve
origin_tool: miRTrace
mode: qc/small-rna
description: >-
  Distinct miRNAs detected against reads sampled, per library. A flattened
  curve says deeper sequencing would find few new miRNAs; a climbing one says
  the library was sequenced short of its complexity.
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. multiqc/<route>/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
recipe: multiqc/mirtrace_complexity.py
fixture: mirtrace_complexity.tsv
renders_as:
  - { id: complexity_curve, component: advanced_viz, kind: profile,
      roles: {series: sample, x: reads, y: distinct_mirnas} }
  - { component: table }
