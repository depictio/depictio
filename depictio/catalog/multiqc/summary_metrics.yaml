id: multiqc_summary_metrics
name: Variant-calling summary
mode: summary-variants-metrics
description: >-
  Per-sample variant-calling summary (reads mapped, coverage, SNP/indel/total
  variant counts, lineage) parsed from MultiQC's summary_variants_metrics table.
find: { path_glob: "**/multiqc/summary_variants_metrics_mqc.csv" }
recipe: multiqc/summary_metrics.py
fixture: summary_metrics.tsv
renders_as:
  - { component: card, column: pct_genome_covered_10x, aggregation: average, aggregations: [box_plot_stats], secondary_layout: box_plot } # ≥10× breadth
  - { component: card, column: num_variants_total, aggregation: median, aggregations: [box_plot_stats], secondary_layout: box_plot } # variant load
  - { component: table }
  # Metric cards and the row-level table behind them: the readings the
  # nf-core dashboards were already computing off this output by hand.
  - { component: card, column: sample, aggregation: nunique, secondary_layout: top_n, breakdown_col: lineage }
  - { component: card, column: pct_reads_mapped, aggregation: average, aggregations: [box_plot_stats], secondary_layout: box_plot }
  - { component: card, column: pct_genome_covered_10x, aggregation: average, secondary_layout: threshold, threshold_value: 80, threshold_direction: min, threshold_warn: 90 }
  - { component: card, column: lineage, aggregation: nunique, secondary_layout: donut, breakdown_col: lineage }
  - { component: card, column: pct_genome_covered_1x, aggregation: average, aggregations: [box_plot_stats], secondary_layout: box_plot }
