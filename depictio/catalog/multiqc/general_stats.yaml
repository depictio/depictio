id: multiqc_general_stats
name: General statistics
mode: general_stats
description: >-
  The one table every MultiQC report has: one row per sample, one column per
  headline metric each module contributed. Not a module's own output, which is
  why it names no producing tool — MultiQC assembles it from all of them.
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. rnaseq multiqc/star_salmon/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
# reuse the bundled nf-core pipeline MultiQC parquet (not a per-module copy);
# `section` selects this module's plot anchors out of the shared report.
fixture: ../../projects/init/catalog_conformance/run_1/multiqc/multiqc_data/multiqc.parquet
renders_as:
  # `general`, not `general_stats`: a section is the anchor's leading token
  # (`multiqc_module`), and MultiQC anchors this table `general_stats_table`.
  - { component: multiqc, section: general }
