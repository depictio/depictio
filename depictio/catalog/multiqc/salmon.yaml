id: multiqc_salmon
name: Transcript quantification
origin_tool: Salmon
mode: salmon
description: Selective-alignment quantification summary (library type, fragment-length distribution, mapping rate), from Salmon via MultiQC.
stage: quantification
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. rnaseq multiqc/star_salmon/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
# reuse the bundled catalog-conformance MultiQC parquet (its sections are
# synthesised by scripts/multiqc_stubs.py); `section` selects this module's
# plot anchors out of the shared report.
fixture: ../../projects/init/catalog_conformance/run_1/multiqc/multiqc_data/multiqc.parquet
renders_as:
  - component: multiqc
    section: salmon
    title: Transcript quantification
    description: >-
      Salmon's MultiQC plots: the fragment-length distribution and the mapping rate,
      per sample. They answer how well the reads support the quantification.

      How to read: A smooth fragment-length distribution and a high mapping rate are
      good. A low mapping rate means contamination or an incomplete transcriptome.

      Source: https://docs.seqera.io/multiqc/modules/salmon
