id: multiqc_porechop
name: Long-read adapter trimming
origin_tool: Porechop_ABI
mode: porechop
description: Long-read adapter-trimming summary (reads and bases kept), Porechop_ABI, via MultiQC.
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. rnaseq multiqc/star_salmon/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
# reuse the bundled nf-core pipeline MultiQC parquet (not a per-module copy);
# `section` selects this module's plot anchors out of the shared report.
fixture: ../../projects/init/catalog_conformance/run_1/multiqc/multiqc_data/multiqc.parquet
renders_as:
  - component: multiqc
    section: porechop
    title: Long-read adapter trimming
    description: >-
      Porechop_ABI's summary of reads and bases kept after adapter trimming, per
      sample. It answers how much of the long-read library carried adapters.

      How to read: Most reads should be kept. A very large trimmed share or many
      reads split in the middle suggest chimeric reads or a wrong adapter set.

      Source: https://docs.seqera.io/multiqc/modules/porechop
