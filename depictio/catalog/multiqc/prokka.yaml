id: multiqc_prokka
name: Bin annotation (Prokka)
origin_tool: Prokka
mode: prokka
description: Per-bin gene-annotation summary (coding sequences, coding density, genome size), Prokka, via MultiQC.
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. rnaseq multiqc/star_salmon/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
# reuse the bundled nf-core pipeline MultiQC parquet (not a per-module copy);
# `section` selects this module's plot anchors out of the shared report.
fixture: ../../projects/init/catalog_conformance/run_1/multiqc/multiqc_data/multiqc.parquet
renders_as:
  - component: multiqc
    section: prokka
    title: Bin annotation (Prokka)
    description: >-
      Prokka's per-bin annotation summary: coding sequences, coding density and
      genome size. It answers whether each bin looks like a complete, well-annotated
      genome.

      How to read: Bacterial genomes are typically densely coding. A low gene count
      or unusual size points to a fragmentary or contaminated bin.

      Source: https://docs.seqera.io/multiqc/modules/prokka
