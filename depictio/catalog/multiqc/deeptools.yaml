id: multiqc_deeptools
name: Signal enrichment
origin_tool: deepTools
mode: deeptools
description: Signal enrichment across the genome — the plotFingerprint cumulative-coverage curve that separates an enriched ChIP from its input, from deepTools, via MultiQC.
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. rnaseq multiqc/star_salmon/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
# reuse the bundled nf-core pipeline MultiQC parquet (not a per-module copy);
# `section` selects this module's plot anchors out of the shared report.
fixture: ../../projects/init/catalog_conformance/run_1/multiqc/multiqc_data/multiqc.parquet
renders_as:
  - component: multiqc
    section: deeptools
    title: Signal enrichment
    description: >-
      deepTools plotFingerprint curve: the cumulative share of signal against the
      share of the genome covered, one curve per sample. It answers whether a ChIP
      sample is enriched over its input.

      How to read: An input or a failed ChIP follows the diagonal. An enriched
      sample bows toward the lower right because a few regions hold most of the
      signal, and the further it bows the stronger the enrichment.

      Source: https://docs.seqera.io/multiqc/modules/deeptools
