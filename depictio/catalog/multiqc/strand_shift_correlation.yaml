id: multiqc_strand_shift_correlation
name: Strand cross-correlation
origin_tool: phantompeakqualtools
mode: strand_shift_correlation
description: Cross-correlation between the plus and minus strand read densities across a range of strand shifts, one curve per sample. The fragment-length peak says how sharp the enrichment is; a peak at the read length alone is a phantom.
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. rnaseq multiqc/star_salmon/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
# reuse the bundled nf-core pipeline MultiQC parquet (not a per-module copy);
# `section` selects this module's plot anchors out of the shared report.
fixture: ../../projects/init/catalog_conformance/run_1/multiqc/multiqc_data/multiqc.parquet
renders_as:
  - { component: multiqc, section: strand }
