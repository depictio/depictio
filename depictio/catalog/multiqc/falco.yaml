id: multiqc_falco
name: Raw-read QC (Falco)
origin_tool: Falco
mode: falco
description: Per-base quality, GC content, duplication and adapter content of the demultiplexed reads, from Falco (a FastQC reimplementation) via MultiQC.
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. rnaseq multiqc/star_salmon/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
# reuse the bundled catalog-conformance MultiQC parquet (its section comes from
# the stub in scripts/multiqc_stubs.py, not a per-module copy);
# `section` selects this module's plot anchors out of the shared report.
fixture: ../../projects/init/catalog_conformance/run_1/multiqc/multiqc_data/multiqc.parquet
renders_as:
  - { component: multiqc, section: falco }
