id: multiqc_adapterremoval
name: Adapter trimming and read collapsing
origin_tool: AdapterRemoval
mode: adapterremoval
description: How many reads AdapterRemoval kept, discarded or collapsed into a single merged read, and the length ladder behind it, AdapterRemoval, via MultiQC.
find:
