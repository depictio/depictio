id: multiqc_rsc_coefficient
name: RSC coefficient
origin_tool: phantompeakqualtools
mode: rsc_coefficient
description: Relative strand cross-correlation per sample, the fragment-length correlation peak measured against the read-length artefact peak rather than against the background. It separates real enrichment from a phantom peak.
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. rnaseq multiqc/star_salmon/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
# reuse the bundled nf-core pipeline MultiQC parquet (not a per-module copy);
# `section` selects this module's plot anchors out of the shared report.
fixture: ../../projects/init/catalog_conformance/run_1/multiqc/multiqc_data/multiqc.parquet
renders_as:
  - component: multiqc
    section: rsc
    title: RSC coefficient
    description: >-
      The relative strand cross-correlation (RSC) of each sample: the
      fragment-length correlation peak measured against the read-length artefact
      peak. It answers whether the signal is real enrichment or a phantom peak.

      How to read: Higher values mean the fragment-length peak clearly beats the
      read-length peak. A low value means the library is dominated by the artefact,
      so interpret the peaks with caution.
