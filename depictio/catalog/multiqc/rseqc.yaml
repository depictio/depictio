id: multiqc_rseqc
name: RNA-seq read QC
origin_tool: RSeQC
mode: rseqc
description: Where the reads land on the transcriptome (read distribution, inner distance, junction annotation and saturation, strand inference), from RSeQC via MultiQC.
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. rnaseq multiqc/star_salmon/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
# reuse the bundled catalog-conformance MultiQC parquet (its sections are
# synthesised by scripts/multiqc_stubs.py); `section` selects this module's
# plot anchors out of the shared report.
fixture: ../../projects/init/catalog_conformance/run_1/multiqc/multiqc_data/multiqc.parquet
renders_as:
  - { component: multiqc, section: rseqc }
