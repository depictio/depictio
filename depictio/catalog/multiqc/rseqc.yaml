id: multiqc_rseqc
name: RNA-seq read QC
origin_tool: RSeQC
mode: rseqc
description: Where the reads land on the transcriptome (read distribution, inner distance, junction annotation and saturation, strand inference), from RSeQC via MultiQC.
stage: alignment
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. rnaseq multiqc/star_salmon/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
# reuse the bundled catalog-conformance MultiQC parquet (its sections are
# synthesised by scripts/multiqc_stubs.py); `section` selects this module's
# plot anchors out of the shared report.
fixture: ../../projects/init/catalog_conformance/run_1/multiqc/multiqc_data/multiqc.parquet
renders_as:
  - component: multiqc
    section: rseqc
    title: RNA-seq read QC
    description: >-
      RSeQC's MultiQC plots: read distribution over the transcriptome, inner
      distance, junction annotation and saturation, and strand inference, per
      sample. They answer how the reads map onto the gene models and whether the
      library is stranded.

      How to read: A high coding share, a clear strandedness call and junction
      saturation that levels off are good. A mixed strand call suggests an
      unstranded library or the wrong strandedness setting.

      Source: https://docs.seqera.io/multiqc/modules/rseqc
