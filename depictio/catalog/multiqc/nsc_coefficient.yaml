id: multiqc_nsc_coefficient
name: NSC coefficient
origin_tool: phantompeakqualtools
mode: nsc_coefficient
description: Normalised strand cross-correlation per sample, the ratio of the fragment-length correlation peak to the background. A value near 1 means the library carries no fragment-length enrichment at all.
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. rnaseq multiqc/star_salmon/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
# reuse the bundled nf-core pipeline MultiQC parquet (not a per-module copy);
# `section` selects this module's plot anchors out of the shared report.
fixture: ../../projects/init/catalog_conformance/run_1/multiqc/multiqc_data/multiqc.parquet
renders_as:
  - component: multiqc
    section: nsc
    title: NSC coefficient
    description: >-
      The normalised strand cross-correlation (NSC) of each sample: the ratio of the
      fragment-length correlation peak to the background. It answers whether a ChIP
      or ATAC library carries any fragment-length enrichment.

      How to read: A value near one means no enrichment at all, and higher values
      mean stronger enrichment. Read it together with the RSC coefficient to tell
      real signal from a phantom peak.
