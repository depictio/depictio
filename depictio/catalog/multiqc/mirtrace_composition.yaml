id: multiqc_mirtrace_composition
name: Small RNA library composition
origin_tool: miRTrace
mode: qc/small-rna
description: >-
  miRTrace's three per-library breakdowns in one stacked-composition frame:
  reads by RNA type (miRNA, rRNA, tRNA, artifact, unknown), reads by miRTrace
  QC outcome, and detected miRNAs by organism clade, the contamination check.
  Read from the plot input MultiQC stores in its parquet.
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. multiqc/<route>/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
recipe: multiqc/mirtrace_composition.py
fixture: mirtrace_composition.tsv
renders_as:
  - { id: rna_composition, component: advanced_viz, kind: stacked_taxonomy,
      roles: {sample_id: sample, taxon: taxon, rank: rank, abundance: abundance} }
  - { component: interactive, interactive_type: MultiSelect, column_name: rank }
  - { component: table }
