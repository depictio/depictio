id: multiqc_mosdepth
name: Coverage distribution
origin_tool: mosdepth
mode: mosdepth
description: Coverage-depth distribution and per-contig coverage — mosdepth, surfaced via MultiQC.
stage: alignment
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. rnaseq multiqc/star_salmon/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
# reuse the bundled nf-core pipeline MultiQC parquet (not a per-module copy);
# `section` selects this module's plot anchors out of the shared report.
fixture: ../../projects/nf-core/viralrecon/3.0.0/run_1/multiqc/multiqc_data/multiqc.parquet
renders_as:
  - component: multiqc
    section: mosdepth
    title: Coverage distribution
    description: >-
      mosdepth's MultiQC plots: the coverage distribution and coverage per contig,
      one line per sample. They answer how deeply and evenly the genome is covered.

      How to read: A narrow distribution around the target depth is good. A long
      tail at low coverage means gaps, and a second peak can mean copy-number
      changes or contamination.

      Source: https://docs.seqera.io/multiqc/modules/mosdepth
