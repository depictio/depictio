id: multiqc_cutadapt
name: Adapter trimming
origin_tool: Cutadapt
mode: cutadapt
description: Adapter/primer trimming summary (filtered reads, trimmed sequence lengths) — Cutadapt, surfaced via MultiQC.
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. rnaseq multiqc/star_salmon/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
# reuse the bundled nf-core pipeline MultiQC parquet (not a per-module copy);
# `section` selects this module's plot anchors out of the shared report.
fixture: ../../projects/nf-core/ampliseq/2.16.0/multiqc/multiqc_data/multiqc.parquet
renders_as:
  - component: multiqc
    section: cutadapt
    title: Adapter trimming
    description: >-
      Cutadapt's MultiQC plots: how many reads were filtered and the lengths of the
      trimmed sequences, per sample. They answer how much adapter was found and how
      much was removed.

      How to read: A moderate trimmed share is routine. A trimmed-length peak far
      from the adapter's true length hints at the wrong adapter, and a very high
      trimmed share suggests short inserts or adapter dimers.

      Source: https://docs.seqera.io/multiqc/modules/cutadapt
