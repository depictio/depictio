id: multiqc_checkm2
name: Bin quality (CheckM2)
origin_tool: CheckM2
mode: checkm2
description: Per-bin completeness and contamination estimates, CheckM2, via MultiQC. Where a pipeline publishes no standalone CheckM2 report, these numbers only reach Depictio through this MultiQC panel.
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. rnaseq multiqc/star_salmon/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
# reuse the bundled nf-core pipeline MultiQC parquet (not a per-module copy);
# `section` selects this module's plot anchors out of the shared report.
fixture: ../../projects/init/catalog_conformance/run_1/multiqc/multiqc_data/multiqc.parquet
renders_as:
  - component: multiqc
    section: checkm2
    title: Bin quality (CheckM2)
    description: >-
      CheckM2's completeness and contamination estimates for each bin, shown as bars
      per bin. It answers which metagenome-assembled genomes are complete and clean
      enough to use.

      How to read: High completeness with low contamination marks a trustworthy bin.
      High contamination means the bin mixes organisms and should be refined, and
      low completeness means a fragment of a genome.

      Source: https://docs.seqera.io/multiqc/modules/checkm2
