id: multiqc_kraken
name: Read classification
origin_tool: Kraken 2
mode: kraken
description: Taxonomic read classification (top species/clades) — Kraken2, surfaced via MultiQC.
stage: taxonomy
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. rnaseq multiqc/star_salmon/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
# reuse the bundled nf-core pipeline MultiQC parquet (not a per-module copy);
# `section` selects this module's plot anchors out of the shared report.
fixture: ../../projects/nf-core/viralrecon/3.0.0/run_1/multiqc/multiqc_data/multiqc.parquet
renders_as:
  - component: multiqc
    section: kraken
    title: Read classification
    description: >-
      Kraken 2's MultiQC plot: the top taxa of each library as a stacked bar per
      sample. It answers which species or clades the reads come from.

      How to read: The expected organisms should dominate. A large unclassified
      share means the database misses what is present, and unexpected taxa across
      all samples suggest contamination.

      Source: https://docs.seqera.io/multiqc/modules/kraken
