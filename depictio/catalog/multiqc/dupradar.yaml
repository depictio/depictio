id: multiqc_dupradar
name: Duplication vs expression
origin_tool: dupRadar
mode: dupradar
description: Duplication rate as a function of expression, the curve that separates a natural high-expression duplicate from a library-preparation artefact, from dupRadar via MultiQC.
find:
  path_glob: "**/multiqc/multiqc_data/multiqc.parquet"
  path_glob_alt: # nested report dirs, e.g. rnaseq multiqc/star_salmon/multiqc_report_data/
    - "**/multiqc/*_data/multiqc.parquet"
    - "**/multiqc/*/*_data/multiqc.parquet"
# reuse the bundled catalog-conformance MultiQC parquet (its sections are
# synthesised by scripts/multiqc_stubs.py); `section` selects this module's
# plot anchors out of the shared report.
fixture: ../../projects/init/catalog_conformance/run_1/multiqc/multiqc_data/multiqc.parquet
renders_as:
  - component: multiqc
    section: dupradar
    title: Duplication vs expression
    description: >-
      dupRadar's curve of the duplication rate against gene expression, one line or
      scatter per sample. It answers whether duplicates are natural, from highly
      expressed genes, or an artefact of library preparation.

      How to read: Duplication should rise only for the most expressed genes. A high
      rate across the whole range signals low input or over-amplification, and these
      reads should not be removed blindly in RNA-seq.

      Source: https://bioconductor.org/packages/release/bioc/html/dupRadar.html
