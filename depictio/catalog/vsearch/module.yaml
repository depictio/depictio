# VSEARCH — multi-output tool → a folder. Lightweight on purpose: identity
# (homepage, bio.tools id, EDAM topics) already lives in the nf-core meta.yml
# that `nf_core_url` points at, so it is not duplicated here.
#
# `nf_core_url` names the sintax subcommand because that is the only VSEARCH
# step depictio reads today; a second output from another subcommand overrides
# it per output, the way QIIME 2's outputs do.
id: vsearch
name: VSEARCH
nf_core_url: https://github.com/nf-core/modules/tree/master/modules/nf-core/vsearch/sintax
biotools_url: https://bio.tools/vsearch # from nf-core meta.yml identifier
