# SEACR — Sparse Enrichment Analysis for CUT&RUN. Multi-output tool, so it gets
# a folder. Lightweight on purpose: identity (homepage, bio.tools id, EDAM
# topics) already lives in the nf-core meta.yml that `nf_core_url` points at, so
# it is not duplicated here. The depictio glue (find / recipe / renders_as)
# lives in the sibling output YAMLs.
#
# SEACR calls peaks from the fragment coverage of a CUT&RUN experiment rather
# than from a read pileup model, which is why MACS2's schema does not fit it:
# a SEACR region carries a total signal, a max signal and the sub-interval where
# that max was reached, and no p-value or fold enrichment at all.
#
# The outputs are pipeline-agnostic and matched on file name, not on a pipeline
# path: `seacr_peaks` reads the caller's own BED, and the consensus and
# fragment-length outputs read the tables the nf-core CUT&RUN-family pipelines
# write around it (`*.consensus.peak_counts.bed`, `*.frags.len.txt`).
id: seacr
name: SEACR
nf_core_url: https://github.com/nf-core/modules/tree/master/modules/nf-core/seacr/callpeak
biotools_url: https://bio.tools/SEACR # from nf-core meta.yml identifier
