# Bambu, long-read transcript discovery and quantification. nf-core/nanoseq
# calls it from a LOCAL module (modules/local/bambu.nf), not a shared
# nf-core/modules entry, so identity is declared in full here rather than
# derived from a meta.yml (the same documented exception as enchantr / QIIME2).
# Bambu writes counts_gene.txt and counts_transcript.txt side by side; nanoseq's
# own DESeq2 / DEXSeq differential step runs directly on those counts and
# publishes into bambu/deseq2/ and bambu/dexseq/, so this folder also carries
# nanoseq's DEXSeq output (DESeq2's is bound through the shared `deseq2` tool,
# see dexseq/results.yaml and the nanoseq template.yaml for the wiring).
id: bambu
name: Bambu
description: >-
  Long-read transcript discovery and quantification from spliced alignments,
  used by nf-core/nanoseq for gene- and transcript-level counting.
homepage: https://github.com/GoekeLab/bambu
source_url: https://github.com/nf-core/nanoseq/blob/3.0.0/modules/local/bambu.nf
