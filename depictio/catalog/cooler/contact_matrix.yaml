id: cooler_contact_matrix
name: Binned contact matrix
mode: dump+balance
description: >-
  Binned, ICE-balanced intra-chromosomal contact matrix from a cooler dump,
  joined to its bins. One partition per resolution, keyed by the resolution
  column, so a tile re-bins itself as the reader zooms; coarser levels are
  derived by merging bins when the run dumped a single resolution.
find:
  path_glob: "**/*_balanced.txt"
recipe: cooler/contact_matrix.py
fixture: contact_matrix.tsv
renders_as:
  - id: binned_contact_map
    component: advanced_viz
    kind: contact_map
    roles: {chrom1: chrom1, start1: start1, chrom2: chrom2, start2: start2, count: count, resolution: resolution}
  - { component: card, column: count, aggregation: average, aggregations: [box_plot_stats], secondary_layout: box_plot }
  - { component: table }
