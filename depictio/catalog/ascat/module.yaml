# yaml-language-server: $schema=../module.schema.json
# ASCAT: multi-output tool, so a folder.
# nf-core/sarek publishes ASCAT under `variant_calling/ascat/<sample>/`.
id: ascat
name: ASCAT
nf_core_url: https://github.com/nf-core/modules/tree/master/modules/nf-core/ascat
biotools_url: https://bio.tools/ascat
description: >-
  Derives allele-specific copy number profiles of tumour cells, accounting for
  normal cell admixture and tumour aneuploidy.
homepage: https://github.com/VanLoo-lab/ascat
stage: variants
