id: nextclade_report
name: Clade assignment
mode: run
description: Per-sample clade assignment + sequence QC.
find: { path_glob: "**/nextclade/*.csv" }
recipe: nextclade/nextclade_results.py
fixture: report.tsv
renders_as:
  - { component: figure, visu_type: histogram, dict_kwargs: {x: clade, color: qc_overallStatus} } # clade calls
  - { component: card, column: coverage, aggregation: average, aggregations: [box_plot_stats], secondary_layout: box_plot } # genome coverage
  - { component: table }
  # Metric cards and the row-level table behind them: the readings the
  # nf-core dashboards were already computing off this output by hand.
  - { component: card, column: clade, aggregation: nunique, secondary_layout: top_n, breakdown_col: clade, top_n_count: 3 }
  - { component: card, column: totalMissing, aggregation: median, aggregations: [box_plot_stats], secondary_layout: box_plot }
