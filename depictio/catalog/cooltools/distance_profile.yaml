id: cooltools_distance_profile
name: Contact probability P(s)
mode: expected-cis
description: >-
  Contact probability against genomic distance, recomputed from the balanced
  cooler dump over log-spaced distance bins, one curve per chromosome plus the
  genome-wide pooled curve, with the log-log slope alongside it.
find:
  path_glob: "**/*_balanced.txt"
recipe: cooltools/distance_profile.py
fixture: distance_profile.tsv
renders_as:
  - id: ps_curve
    component: advanced_viz
    kind: profile
    roles: {series: chrom, x: distance, y: contact_probability}
  # The derivative of the same curve. Read on its own axis, because a slope
  # near -1 and a probability near 0.1 share no scale.
  - id: ps_slope
    component: advanced_viz
    kind: profile
    roles: {series: chrom, x: distance, y: log10_slope}
  - { component: card, column: log10_slope, aggregation: median, aggregations: [box_plot_stats], secondary_layout: box_plot }
  - { component: card, column: contact_probability, aggregation: max, aggregations: [box_plot_stats], secondary_layout: box_plot }
  - { component: table }
