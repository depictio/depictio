# DESeq2 is a multi-output tool, so it gets a folder. The depictio glue
# (find / recipe / renders_as) lives in the sibling output YAMLs.
#
# Every output is pipeline-agnostic: differentialabundance publishes the tables
# under tables/differential/ and tables/processed_abundance/, chipseq under
# consensus/<antibody>/deseq2/<contrast>/, rnaseq under star_salmon/deseq2_qc/.
# The recipes match on column vocabulary and file name, never on a pipeline path.
id: deseq2
name: DESeq2
nf_core_url: https://github.com/nf-core/modules/tree/master/modules/nf-core/deseq2/differential
biotools_url: https://bio.tools/deseq2 # from nf-core meta.yml identifier
description: >-
  Differential gene expression analysis based on the negative binomial
  distribution.
homepage: https://bioconductor.org/packages/release/bioc/html/DESeq2.html
stage: differential
