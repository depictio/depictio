# SUPPA2: splicing event PSI from transcript abundances. nf-core/rnasplice runs
# generateEvents, psiPerEvent / psiPerIsoform, diffSplice and clusterEvents from
# LOCAL modules (modules/local/suppa_*.nf) on the Salmon TPMs, so identity points
# at the pipeline module that writes the diffSplice tables read here.
id: suppa
name: SUPPA2
description: >-
  Fast, alignment-free differential splicing: PSI per local event and per
  isoform from transcript TPMs, and the delta PSI between two conditions with
  an empirical significance.
homepage: https://github.com/comprna/SUPPA
source_url: https://github.com/nf-core/rnasplice/blob/1.0.4/modules/local/suppa_diffsplice.nf
