id: cellranger_library_metrics_long
name: Library QC metrics, thresholded
mode: count/library_metrics_long
description: >-
  The 4 headline Cell Ranger metrics for which 10x's QC guidance (technical
  note CG000329) gives an expected value, one row per (sample, metric), with
  the threshold and the status it crosses. Sequencing saturation has no 10x
  expected value and is not thresholded.
find:
  path_glob: "**/metrics_summary.csv"
recipe: cellranger/library_metrics_long.py
fixture: library_metrics_long.tsv
renders_as:
  - { id: library_metric_picker, component: interactive, interactive_type: Select, column_name: metric }
  - { id: library_status_picker, component: interactive, interactive_type: SegmentedControl, column_name: status }
  - { component: card, column: value, aggregation: median, secondary_layout: box_plot, aggregations: [box_plot_stats] }
  - { component: card, column: metric, aggregation: nunique, secondary_layout: top_n, breakdown_col: status, top_n_count: 3 }
  - { component: table }
