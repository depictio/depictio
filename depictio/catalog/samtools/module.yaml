# SAMtools. Two outputs: `flagstat` (the report every pipeline needing this
# entry publishes without a BAM in hand) and `stats_sections` (the full
# `samtools stats` report, read line by line so the read-length, coverage and
# indel histograms and the SN summary block each become rows), plus `idxstats`
# (mapped reads per contig, classed autosome / X / Y / mitochondrion / other).
# Output ids and schemas are shared by several templates: extend them, do not
# rename them.
id: samtools
name: SAMtools
version: "1.1.0"
nf_core_url: https://github.com/nf-core/modules/tree/master/modules/nf-core/samtools/flagstat
homepage: https://www.htslib.org
description: >-
  Utilities for manipulating and post-processing sequence alignments in the
  SAM, BAM and CRAM formats.
biotools_url: https://bio.tools/samtools
stage: alignment
