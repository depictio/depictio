id: ribowaltz_metaprofile_stop
name: Metagene profile at the stop codon
mode: riboseq/metagene
description: >-
  P-site signal summed over all transcripts at each nucleotide around the
  annotated stop codon, per library. The 3-nt saw-tooth should run up to the
  stop codon and fade after it, where ribosomes release.
find: { path_glob: "**/*.ribowaltz.metaprofile_psite.tsv" }
recipe: ribowaltz/metaprofile_stop.py
# The fixture is enriched synthetically from 15 real rows (copies with seeded noise), so the preview shows several libraries.
fixture: metaprofile_stop.tsv
renders_as:
  - id: stop_profile
    component: advanced_viz
    kind: profile
    title: P-site signal around the stop codon
    roles: { series: sample, x: position, y: signal }
    config:
      reference_x: 0
      reference_label: First nucleotide of the stop codon
      x_title: Distance from the stop codon (nt)
      y_title: Share of the window's P-site signal (%)
    description: >-
      Each line is a library: its P-site signal at every nucleotide around the annotated
      stop codon, summed over all transcripts. It answers whether footprints are phased
      along the coding sequence.

      How to read: Position 0 is the first nucleotide of the stop codon. The saw-tooth should run up to it and fade after it, where ribosomes release. A flat or noisy line with no pattern means the offsets are wrong
      or the library has no periodicity.

      Lines and annotations: the vertical line at 0 marks the first nucleotide of the
      stop codon, the origin of the distance axis, defined by the annotation riboWaltz uses.

      Source: https://raw.githubusercontent.com/LabTranslationalArchitectomics/riboWaltz/master/README.md
  - component: table
    title: P-site signal around the stop codon
    description: >-
      Each row is a library and a position relative to the stop codon, with the share of
      the window's P-site signal. It answers the exact signal behind the lines.

      How to read: filter to one library and sort by position to follow its profile.
