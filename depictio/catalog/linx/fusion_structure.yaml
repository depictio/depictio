id: linx_fusion_structure
name: Fusion partners along the fused transcript
mode: linx
description: >-
  Each LINX fusion laid out as two partner lanes along the fused transcript in
  exon units: the 5' partner's exons up to the fused exon and the 3' partner's
  exons from its fused exon are kept, the rest are drawn as lost, and the
  breakpoint sits between them. LINX publishes no residue coordinates per
  fusion, which is why the axis is the exon rank.
find:
  path_glob: "**/*.linx.fusion.tsv"
recipe: linx/fusion_structure.py
fixture: fusion_structure.tsv
renders_as:
  - id: fusion_exon_layout
    component: advanced_viz
    kind: fusion_structure
    title: Exons kept in each fusion
    roles: {fusion_id: fusion, partner: partner, feature: feature, start: start, end: end, breakpoint: breakpoint, retained: retained, colour_by: phased}
    description: >-
      Each fusion is drawn as two partner lanes in exon units: the exons the fused
      transcript keeps and the exons it loses are drawn as separate blocks, and the
      breakpoint sits between the two partners. The colour is the phasing of the fusion. It answers
      which exons each partner contributes to a fusion.

      How to read: a fusion keeps the 5' partner's exons up to its last fused exon and the 3'
      partner's exons from its first fused exon on, the FusedExonUp and FusedExonDown LINX reports. Many lost exons on the 3' partner mean a large part of its
      protein is missing.

      Note: LINX publishes no residue coordinates per fusion, so the axis is the exon
      rank and not the amino-acid position.

      Source: https://raw.githubusercontent.com/hartwigmedical/hmftools/master/linx/README.md
  - component: table
    title: Fusion exons table
    description: >-
      Each row is a block of exons of one partner of a fusion, kept or lost, with its
      start and end in exon units. It answers exactly which exons are retained.

      How to read: filter on a fusion to read its two partners side by side.
