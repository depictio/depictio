# LINX (hmftools): clusters PURPLE's structural variants into events, chains
# them, and annotates the genes they disrupt and the fusions they create.
# nf-core/oncoanalyser publishes the somatic tables under
# <group_id>/linx/somatic_annotations/ and the germline ones under
# linx/germline_annotations/, named <tumor_id>.linx.*.
id: linx
name: LINX
version: "1.0.0"
description: >-
  Clusters structural variants into events, chains them, and annotates the genes they disrupt and the fusions they create.
homepage: https://github.com/hartwigmedical/hmftools/tree/master/linx
source_url: https://github.com/nf-core/oncoanalyser/tree/master/modules/local/linx
biotools_url: null  # hmftools has no bio.tools entry
stage: fusions
