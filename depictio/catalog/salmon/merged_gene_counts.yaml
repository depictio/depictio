id: salmon_merged_gene_counts
name: Merged gene counts
mode: quantification/counts
description: >-
  The raw merged gene-level count matrix (gene_id, gene_name and one estimated
  count column per sample) tximport writes next to the TPM matrix. Shown as
  rows: it is the input a differential-expression tool is handed, so the value a
  dashboard adds is letting someone read and search it, not replot it.
find: { path_glob: "**/salmon.merged.gene_counts.tsv" }
fixture: merged_gene_counts.tsv
renders_as:
  # A table only: the matrix is the input a differential tool is handed, with one
  # column per sample known at ingest, so there is nothing to bind to a plot.
  - component: table
    title: Merged gene counts
    description: >-
      Each row is a gene with its estimated read count in every sample, as summarised
      by tximport from the Salmon quantifications. It answers what the raw counts
      handed to a differential expression tool look like.

      How to read: counts are estimates and may be non-integer. Compare them across
      samples only after normalisation, which is what the differential expression
      step does; use the TPM views for comparisons.
