# Salmon is a multi-output tool, so it gets a folder. Lightweight on purpose:
# identity (homepage, bio.tools id, EDAM topics) already lives in the nf-core
# meta.yml that `nf_core_url` points at, so it is not duplicated here. The
# depictio glue (find / recipe / renders_as) lives in the sibling output YAMLs.
#
# The outputs below are the MERGED, gene-level matrices a pipeline builds from
# the per-sample `quant.sf` files (salmon/tximport). They are pipeline-agnostic:
# nf-core/rnaseq publishes them under `star_salmon/` and `salmon/`, a bare
# salmon/tximport run under the quantification directory. The recipes match on
# file name and column vocabulary, never on a pipeline path; a run that puts
# them elsewhere repoints the source with `transform.source_overrides`.
id: salmon
name: Salmon
nf_core_url: https://github.com/nf-core/modules/tree/master/modules/nf-core/salmon/quant
biotools_url: https://bio.tools/salmon # from nf-core meta.yml identifier
