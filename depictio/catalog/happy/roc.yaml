id: happy_roc
name: hap.py threshold sweep
mode: roc
description: >-
  Germline hap.py SNP precision-recall sweep across quality thresholds (one row
  per QQ threshold).
find: { path_glob: "**/benchmarks/happy/*.roc.Locations.SNP.PASS.csv.gz" }
recipe: happy/roc.py
fixture: roc.tsv
renders_as:
  - { id: pr_curve, component: advanced_viz, kind: roc_pr_curve, roles: {recall: recall, precision: precision} } # threshold-sweep PR curve + AUC
  - { component: table }
