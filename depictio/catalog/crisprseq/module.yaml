# nf-core/crisprseq targeted editing analysis. The tables read here come from
# pipeline-local processes (CIGAR_PARSER, an R script over the aligned reads,
# and CLONALITY_CLASSIFIER, a pandas script), so there is no nf-core module to
# derive identity from and it is declared in full, the same documented
# exception as mhcquant, comBGC and enchantR.
id: crisprseq
name: nf-core/crisprseq
description: >-
  Gene editing outcome tables of the nf-core/crisprseq targeted analysis: per
  library read accounting, edit outcome counts (wild type, template-based
  repair, insertions and deletions split by frame), every indel allele with
  its position relative to the cut site, per-position substitution rates and
  the clonality call.
homepage: https://nf-co.re/crisprseq
source_url: https://github.com/nf-core/crisprseq/tree/2.3.0/modules/local
edam_topics:
  - http://edamontology.org/topic_3912 # Genetic engineering
  - http://edamontology.org/topic_0199 # Genetic variation
