id: checkv_quality_summary
name: Viral genome quality
mode: quality-report
description: >-
  CheckV's verdict on every viral sequence: length, provirus call, viral and
  host genes, estimated completeness and contamination, and the quality tier
  those give. Completeness against contamination is the plane a viral genome
  is read on: complete genomes sit top left, proviruses with host flanks to
  the right.
find:
  path_glob: "**/checkv/**/quality_summary.tsv"
recipe: checkv/quality_summary.py
# The fixture is enriched synthetically from 14 real rows (copies with seeded noise), so the preview shows several quality classes.
fixture: quality_summary.tsv
renders_as:
  - id: quality_tiers
    component: card
    column: contig_length
    aggregation: count
    aggregations: [median, max]
    secondary_layout: composition
    breakdown_col: checkv_quality
    headline: true
    title: Sequences by quality tier
    caption: sequences, by CheckV tier
    description: >-
      The hero number is the count of viral sequences assessed, and the bar splits them by CheckV quality tier.
      It answers how much of the viral content is usable.

      How to read: complete and high-quality sequences are ready for analysis. Medium and low-quality ones are
      partial genomes, and undetermined ones could not be given a tier. Tiers rest on completeness alone.

      Source: https://bitbucket.org/berkeleylab/checkv/raw/master/README.md
  - id: completeness
    component: card
    column: completeness
    aggregation: median
    aggregations: [min, max]
    secondary_layout: threshold
    threshold_value: 90
    threshold_direction: min
    threshold_warn: 50
    title: Completeness
    caption: median against the 90% high-quality floor
    description: >-
      The hero number is the median estimated completeness of the sequences, in percent, and the bar compares
      it with the quality tiers. It answers how much of a full genome the sequences cover.

      How to read: a median above the high-quality floor means most sequences are near-complete genomes. A
      low median with a wide minimum to maximum spread points to many fragments, so check the scatter for
      which sequences pull it down.

      Lines and annotations: CheckV calls a sequence high-quality above 90% completeness and medium-quality
      between 50% and 90%, so the marks sit at 90 and 50.

      Source: https://bitbucket.org/berkeleylab/checkv/raw/master/README.md
  - id: contamination
    component: card
    column: contamination
    aggregation: max
    aggregations: [average]
    secondary_layout: histogram
    title: Host contamination
    caption: contamination, per sequence
    description: >-
      The hero number is the highest estimated host contamination of any sequence, in percent, with the mean
      beside it, and the histogram shows how it is distributed. It answers whether proviruses carry host
      sequence at their edges.

      How to read: a long tail points to proviruses with host flanks.
      CheckV does not use contamination in its tiers, because host sequence is easy to trim, so no cut-off is
      drawn.

      Source: https://bitbucket.org/berkeleylab/checkv/raw/master/README.md
  - id: completeness_vs_contamination
    component: advanced_viz
    kind: scatter_xy
    title: Completeness against contamination
    roles: { x: completeness, y: contamination, label: contig_id, color: checkv_quality, size: contig_length }
    config:
      x_title: Estimated completeness (%)
      y_title: Estimated host contamination (%)
      reference_line: vertical
      reference_value: 90
      reference_label: 90% completeness (high-quality tier)
      top_n_labels: 5
    description: >-
      Each point is a viral sequence: its estimated completeness on the horizontal axis and its host
      contamination on the vertical axis, sized by sequence length and coloured by quality tier. It answers
      which sequences are complete and clean.

      How to read: complete genomes sit at the right with no contamination, while proviruses with host flanks
      rise on the vertical axis. Fragments sit to the left, and large points are the longer sequences.

      Lines and annotations: the vertical line is 90% completeness, the floor of CheckV's high-quality tier.

      Source: https://bitbucket.org/berkeleylab/checkv/raw/master/README.md
  - component: table
    title: Viral sequence quality
    description: >-
      Each row is a viral sequence with its length, provirus call, gene counts, completeness, contamination,
      quality tier and warnings. It answers which sequences to keep.

      How to read: sort by completeness and read the warnings column before trusting a high-quality call.
