# OpenMS: the mass-spectrometry toolkit nf-core/mhcquant is built on. This
# folder holds the database-search side: the Comet search run through
# OpenMS' CometAdapter (nf-core module openmsthirdparty/cometadapter), whose
# Percolator input tables (`<run>_pin.tsv`, one per raw file) carry every
# target and decoy peptide-spectrum match before rescoring.
id: openms
