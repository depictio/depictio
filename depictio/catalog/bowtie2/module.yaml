# Bowtie 2. Multi-output tool folder.
#
# The output bundled today is the spike-in normalisation pair: a CUT&RUN or
# CUT&Tag pipeline aligns every library twice, once against the target genome
# and once against the carrier spike-in genome, and writes one Bowtie 2 summary
# log per alignment. The ratio between the two is what a scale factor is made
# of, so the output reads both log sets at once and keys them on the sample.
id: bowtie2
name: Bowtie 2
nf_core_url: https://github.com/nf-core/modules/tree/master/modules/nf-core/bowtie2/align
homepage: https://bowtie-bio.sourceforge.net/bowtie2/
biotools_url: https://bio.tools/bowtie2
description: >-
  Bowtie 2 is an ultrafast and memory-efficient tool for aligning sequencing
  reads to long reference sequences.
stage: alignment
