# ataqv — multi-output tool, so it gets a folder. Lightweight on purpose:
# identity (homepage, bio.tools id, EDAM topics) already lives in the nf-core
# meta.yml that `nf_core_url` points at, so it is not duplicated here. The
# depictio glue (find / recipe / renders_as) lives in the sibling output YAMLs.
#
# ataqv is the ATAC-seq-specific QC tool: it reads a filtered alignment plus the
# peak calls and a TSS annotation and writes one JSON per library holding the
# metrics an ATAC library is judged by — TSS enrichment, the fragment-length
# ladder, the high-quality autosomal alignment (HQAA) fractions, duplication
# and the peak statistics. MultiQC has no ataqv module, so none of this reaches
# a dashboard through the MultiQC report.
#
# The outputs are pipeline-agnostic: every one of them reads the `*.ataqv.json`
# the tool writes, matched on file name rather than on a pipeline path.
id: ataqv
name: ataqv
nf_core_url: https://github.com/nf-core/modules/tree/master/modules/nf-core/ataqv/ataqv
homepage: https://github.com/ParkerLab/ataqv
