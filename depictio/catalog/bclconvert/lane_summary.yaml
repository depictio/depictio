id: bclconvert_lane_summary
name: Lane run health
description: >-
  One row per lane: clusters detected and passing filter, yield, base quality,
  the Undetermined share and how evenly the libraries split the lane, from
  BCL Convert Reports CSVs.
find:
  path_glob: "**/Reports/Demultiplex_Stats.csv"
recipe: bclconvert/lane_summary.py
fixture: lane_summary.tsv
renders_as:
  - { id: lane_health, component: advanced_viz, kind: scatter_xy,
      roles: {x: pct_undetermined, y: pct_q30, label: lane_label, size: yield_gb} }
  - { component: figure, visu_type: bar, dict_kwargs: {x: lane_label, y: yield_gb, title: Yield per lane} }
  - { component: card, column: yield_gb, aggregation: sum, secondary_layout: top_n, breakdown_col: lane_label, top_n_count: 4 }
  - { component: card, column: clusters_pf, aggregation: sum, secondary_layout: top_n, breakdown_col: lane_label, top_n_count: 4 }
  - { component: card, column: pct_q30, aggregation: min, aggregations: [box_plot_stats], secondary_layout: box_plot }
  - { component: card, column: pct_undetermined, aggregation: max, aggregations: [box_plot_stats], secondary_layout: box_plot }
  - { component: table }
