# LAST: pairwise genome alignment (lastdb, last-train, lastal, last-split,
# last-dotplot, maf-convert). The outputs here are the small per-pair
# summaries nf-core/pairgenomealign publishes next to the MAF alignments
# (the one-line identity summary, the substitution matrix and the fitted
# scoring parameters), plus the optional PSL export; the MAF files themselves
# (up to gigabytes per pair) are not read.
id: last
name: LAST
version: "1.0.0"
nf_core_url: https://github.com/nf-core/modules/tree/master/modules/nf-core/last/split
homepage: https://gitlab.com/mcfrith/last
biotools_url: https://bio.tools/last # nf-core meta.yml leaves the identifier empty
description: >-
  Pairwise genome alignment: how much of a target genome each query aligns to
  one-to-one, at what identity and divergence, with which substitution spectrum
  and fitted scoring parameters, and where on the target the long alignments land.
edam_topics:
  - http://edamontology.org/topic_0182 # Sequence alignment
  - http://edamontology.org/topic_0622 # Genomics
stage: alignment
