# seqtk: FASTA/FASTQ toolkit. Only `seqtk cutN -g` is catalogued here: the
# poly-N runs (assembly gaps) of a genome as a 3-column BED.
id: seqtk
name: seqtk
version: "1.0.0"
nf_core_url: https://github.com/nf-core/modules/tree/master/modules/nf-core/seqtk/cutn
homepage: https://github.com/lh3/seqtk
biotools_url: https://bio.tools/seqtk # from nf-core meta.yml identifier
description: >-
  Fast processing of FASTA and FASTQ files. Here, the runs of N of an assembly
  (its scaffolding gaps), counted per genome and binned by length.
edam_topics:
  - http://edamontology.org/topic_0622 # Genomics
stage: qc
