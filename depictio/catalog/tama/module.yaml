# TAMA (Transcriptome Annotation by Modular Algorithms): poly(A) clean-up of
# FLNC reads, collapse of mapped reads into transcript models, and merge of
# several collapsed annotations into one.
#
# The recipes read TAMA's own file shapes: the poly(A) report of
# `tama_flnc_polya_cleanup.py` (`*_polya_flnc_report.txt[.gz]`), the per-model
# read counts of TAMA collapse (`*_trans_report.txt`), and TAMA merge's BED12
# annotation with its `*_merge.txt` membership table. Chaining the last three
# gives every final isoform its FLNC read support; comparing its intron chain
# with a reference GTF gives its SQANTI-style structural category.
id: tama
name: TAMA
version: "1.0.0"
nf_core_url: https://github.com/nf-core/modules/tree/master/modules/nf-core/gstama/merge
source_url: https://github.com/GenomeRIK/tama
homepage: https://github.com/GenomeRIK/tama
biotools_url: null  # no bio.tools entry for this tool
description: >-
  Transcript models built from long reads: the isoforms of each sample with the
  reads behind them, and their novelty against a reference annotation.
edam_topics:
  - http://edamontology.org/topic_3170 # RNA-Seq
  - http://edamontology.org/topic_0114 # Gene structure
stage: annotation
