id: qiime2_ma
name: Differential-abundance MA plot
mode: composition/ancombc
description: >-
  Mean abundance against log2 fold change per taxon, joining the ANCOM-BC
  differentials with the per-sample counts.
nf_core_url: https://github.com/nf-core/modules/tree/master/modules/nf-core/qiime2/ancombc
find: { path_glob: "**/qiime2/ancombc/differentials/*/lfc_slice.csv" }
recipe: nf-core/ampliseq/ma_canonical.py
fixture: ma.tsv
renders_as:
  - { id: ma_plot, component: advanced_viz, kind: ma, roles: {feature_id: feature_id, avg_log_intensity: avg_log_intensity, log2_fold_change: log2_fold_change} }
  - { component: table }
