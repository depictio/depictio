id: qiime2_taxonomy_heatmap
name: Abundance matrix
mode: rel-abundance/matrix
description: >-
  Taxon by sample abundance matrix (one row per taxon, one column per sample),
  pivoted from the relative-abundance table.
nf_core_url: https://github.com/nf-core/modules/tree/master/modules/nf-core/qiime2/relativeabundancetables
find: { path_glob: "**/qiime2/rel_abundance_tables/rel-table-*.tsv" }
recipe: qiime2/taxonomy_heatmap.py
fixture: taxonomy_heatmap.tsv
# The clustered heatmap binds to `qiime2_clustered_heatmap`, whose recipe casts
# the index + annotation columns the renderer needs. Here the matrix is the
# output, so a table is the honest render.
renders_as:
  - { component: table }
