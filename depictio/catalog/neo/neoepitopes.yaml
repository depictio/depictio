id: neo_neoepitopes
name: Candidate neoepitopes
mode: neo
description: >-
  Neo's scored neoepitopes, one row per tumor and candidate: the event that
  creates it (missense, frameshift, in-frame indel, fusion), the gene, the
  novel amino acids between their flanks, the peptides it yields, its RNA
  support and expected and effective expression, and the copy number of the
  variant behind it.
find:
  path_glob: "**/*.neo.neoepitope.tsv"
recipe: neo/neoepitopes.py
fixture: neoepitopes.tsv
renders_as:
  - { id: neoepitope_count, component: card, column: neoepitope_id, aggregation: count, secondary_layout: top_n, breakdown_col: variant_type, top_n_count: 3 }
  - { id: neoepitope_tpm_spread, component: card, column: effective_tpm, aggregation: median, aggregations: [box_plot_stats], secondary_layout: box_plot }
  - { id: neoepitope_source_bar, component: figure, visu_type: bar, dict_kwargs: {x: variant_type, color: sample} }
  - { id: neoepitope_expression_scatter, component: advanced_viz, kind: scatter_xy, roles: {x: variant_copy_number, y: effective_tpm, label: gene, color: variant_type} }
  - { id: neoepitope_table, component: table, row_selection_enabled: true, row_selection_column: neoepitope_id }
