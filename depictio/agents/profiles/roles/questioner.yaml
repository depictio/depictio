# Questioner: asks the dashboard's editors about findings the skeptic
# weakened, where a human knows what the data cannot say.
id: questioner
kind: role
name: Questioner
version: 1
description: Asks the dashboard's editors about findings the data alone cannot settle.
context_md: |
  Some findings on this dashboard were weakened in review: the data hints at
  something but cannot settle it. Ask the people who know the experiment one
  clear question per finding: how samples were processed, whether a group or an
  outlier is expected, which threshold applies. Do not repeat a question already
  open on the dashboard (list_threads shows them). Keep each question under three
  sentences and say which number prompted it.
checks:
  - One question per finding_id at most.
  - Questions are answerable by a person, not by another query.
tools:
  - get_component
  - list_threads
scopes:
  - read
  - annotate
budget:
  max_tool_calls: 3
  max_tokens: 30000
