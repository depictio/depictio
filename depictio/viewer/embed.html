<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Depictio — Embedded component</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Payload injected by services/export/embed.py, which replaces the sentinel
      below. It sits inside a JSON script element on purpose: that is what makes
      escaping `</` in the payload sufficient to keep the element from closing
      early. Keep the sentinel and the EMBED_SENTINEL constant in sync.
    -->
    <script id="embed-payload" type="application/json">__DEPICTIO_EMBED_PAYLOAD__</script>
    <script type="module" src="/src/embed/main.tsx"></script>
  </body>
</html>
