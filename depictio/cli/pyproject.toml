[project]
name = "depictio-cli"
version = "1.12.0-b1"
description = "Alias of the depictio package: installs the depictio CLI under its former name"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# Everything lives in `depictio` (the root pyproject.toml), dependencies included. This
# package pins the same version, so `pip install depictio-cli` keeps installing the CLI,
# and keeps the `depictio-cli` command that the Nextflow hook and existing scripts call.
dependencies = ["depictio==1.12.0-b1"]
authors = [{ name = "Thomas Weber", email = "thomas.weber@embl.de" }]
urls = { Homepage = "https://github.com/depictio/depictio" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
multiqc = ["depictio[multiqc]==1.12.0-b1"]

# Declared here as well as in depictio: `uv tool install depictio-cli` and pipx only
# expose the commands of the package they were asked for.
[project.scripts]
depictio = "depictio.cli.depictio_cli:main"
depictio-cli = "depictio.cli.depictio_cli:main"

# Should this directory get installed in development, uv takes depictio from the
# checkout rather than PyPI. To work on the CLI, install the root instead
# (`pip install -e ".[multiqc]"`): installing this alias makes `depictio` a namespace
# package. Published wheels keep the plain version pin above.
[tool.uv.sources]
depictio = { path = "../..", editable = true }

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The files come from the repository root, the tree the depictio wheel is built from.
# They are the ones earlier depictio-cli releases installed: `pip install -U
# depictio-cli` over one of those installs depictio, then removes the old release's
# files, so this wheel puts the same paths back.
package-dir = {"" = "../.."}
packages = [
  "depictio.cli",
  "depictio.cli.cli",
  "depictio.cli.cli.commands",
  "depictio.cli.cli.utils",
  "depictio.models",
  "depictio.models.models",
  "depictio.models.models.data_collections_types",
  "depictio.api",
  "depictio.api.v1",
  "depictio.api.v1.configs",
  "depictio.recipes",
  "depictio.telemetry",
  "depictio.catalog",
  "depictio.projects",
]

# Data files are NOT picked up by `packages` alone: every non-.py file has to be
# matched by a pattern here, relative to its package directory. These patterns select
# the files earlier depictio-cli releases installed that depictio still ships, and
# nothing else: scripts/check_depictio_wheel.py fails if this wheel holds a file depictio
# does not, or a copy that differs from depictio's.
[tool.setuptools.package-data]
"depictio.cli" = [
  # The Nextflow onComplete snippet users pass to `nextflow run -c`, and the
  # worked example beside it.
  "configs/nextflow/*.config",
  "configs/nextflow/example/*",
]
"depictio.recipes" = ["**/*.py"]
"depictio.catalog" = ["**/*.py", "**/*.yaml", "**/*.json"]
"depictio.projects" = [
  "nf-core/**/template.yaml",
  "nf-core/**/dashboards/*.yaml",
  "nf-core/**/recipes/*.py",
  "init/iris/dashboards/*.yaml",
  "init/penguins/dashboards/*.yaml",
]
