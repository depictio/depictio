[project]
name = "depictio-cli"
version = "1.9.2"
description = "Depictio CLI to interact with the Depictio API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  # Held at 1.36.21: the CLI has no s3fs/aiobotocore chain, so the root's
  # boto3==1.43.0 cap doesn't apply here — kept pinned to the current version.
  "boto3==1.36.21",
  "colorlog==6.10.1",
  "httpx==0.28.1",
  "devtools==0.12.2",
  # polars-lts-cpu is legacy; the modern LTS/older-CPU build is polars[rtcompat]
  # (-> polars-runtime-compat). rtcompat also matches multiqc 1.35's requirement.
  "polars[rtcompat,numpy,pandas,pyarrow,excel,deltalake]==1.41.2",
  "deltalake==1.6.0",
  "python-jose==3.5.0",
  "pyyaml>=6.0.2",
  "typer==0.26.7",
  # "typeguard",
  "tomli==2.2.1",
  "rich==15.0.0",
  "pydantic[email]==2.13.4",
  "pydantic-settings==2.14.1",
  # Held at 2.0.0: beanie 2.1.0 calls list_collection_names(authorizedCollections=
  # True) during init, which the latest mongomock (4.3.0) test double doesn't
  # accept, breaking the unit suite. Bump once mongomock supports the kwarg.
  "beanie==2.0.0",
  "python-dotenv==1.2.2",
  "bleach==6.4.0",
  # Required by catalog recipes that build colour scales / hierarchical figures
  # during processing (e.g. qiime2/taxonomy_heatmap.py imports plotly.colors).
  "plotly==6.8.0",
]
authors = [{ name = "Thomas Weber", email = "thomas.weber@embl.de" }]
urls = { Homepage = "http://github.com/depictio/depictio" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
multiqc = ["multiqc==1.35"]

[project.scripts]
depictio-cli = "depictio.cli.depictio_cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Fix the package directory mapping
package-dir = {"" = "../.."}
packages = [
  "depictio.cli",
  "depictio.cli.cli",
  "depictio.cli.cli.commands",
  "depictio.cli.cli.utils",
  "depictio.models",
  "depictio.models.models",
  "depictio.models.models.data_collections_types",
  "depictio.api",
  "depictio.api.v1",
  "depictio.api.v1.configs",
  "depictio.recipes",
  # Shared anonymous telemetry. The server-only half lives in
  # depictio.api.v1.telemetry, which is deliberately NOT shipped here.
  "depictio.telemetry",
  # Bundled templates and the recipes they run. `locate_template` reads these
  # from disk, so without them a pip-installed CLI resolves no --template and
  # no --pipeline-id at all: the nf-core flow is unusable. The published 1.9.2
  # wheel shipped zero of the nine templates. Only the container worked, and
  # only because its Dockerfile copies the source tree and bypasses packaging.
  "depictio.catalog",
  "depictio.projects",
]

# Data files are NOT picked up by `packages` alone: every non-.py file the CLI
# reads at runtime has to be matched by a pattern here, relative to its package
# directory. Deliberately narrow: `depictio/projects` also holds 54 MB of
# reference datasets for server-side seeding, which the CLI never opens.
[tool.setuptools.package-data]
"depictio.cli" = [
  "*.yaml",
  "*.yml",
  "*.json",
  # The Nextflow onComplete snippet users pass to `nextflow run -c`, and the
  # worked example beside it.
  "configs/nextflow/*.config",
  "configs/nextflow/example/*",
]
"depictio.recipes" = ["**/*.py"]
"depictio.catalog" = ["**/*.py", "**/*.yaml", "**/*.json"]
"depictio.projects" = [
  "**/template.yaml",
  "**/dashboards/*.yaml",
  "**/recipes/*.py",
]
