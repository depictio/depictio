# Second, backup-only S3 store (SeaweedFS `weed mini`) used by the backup CI
# jobs. Service/env names keep the historical `minio-backup` naming so the
# DEPICTIO_BACKUP_BACKUP_S3_* variables and workflows stay unchanged.
services:
  minio-backup:
    container_name: minio-backup
    image: chrislusf/seaweedfs:4.46
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./${DATA_DIR:-data}/seaweedfs_backup_data:/data
    environment:
      AWS_ACCESS_KEY_ID: backup_minio
      AWS_SECRET_ACCESS_KEY: backup_minio123
      S3_BUCKET: depictio-backup-bucket
    command: ["mini", "-dir=/data", "-s3.port=9000", "-admin.ui=false", "-webdav=false"]
    ports:
      - "127.0.0.1:9002:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - default
