name: tool-studio-ci

# CI for the Tool Studio web app. Two guarantees:
#   1. Frontend health — typecheck, unit tests (vitest), production build.
#   2. Round-trip — an entry generated by the app's own yamlGen MUST pass
#      `depictio dev catalog validate`, and the committed kinds.json /
#      catalog.schema.json snapshots must match their in-repo source (drift).
on:
  pull_request:
    paths:
      - "packages/tool-studio/**"
      - "packages/depictio-react-core/**"
      - "packages/depictio-components/**"
      # Compiled into the app through the `depictio-builder` alias.
      - "depictio/viewer/src/builder/**"
      # Snapshot sources: catalog.json (manifest), kinds.json, figureParams.json,
      # catalog.schema.json.
      - "depictio/catalog/**"
      - "depictio/models/components/advanced_viz/**"
      - "depictio/models/components/lite.py"
      - "depictio/api/v1/services/figure/definitions.py"
      - "depictio/api/v1/services/figure/parameter_discovery.py"
      - "depictio/cli/cli/commands/catalog.py"
      - ".github/workflows/tool-studio-ci.yaml"
  push:
    branches: [main]
    paths:
      - "packages/tool-studio/**"
      - "packages/depictio-react-core/**"
      - "packages/depictio-components/**"
      # Compiled into the app through the `depictio-builder` alias.
      - "depictio/viewer/src/builder/**"
      # Snapshot sources: catalog.json (manifest), kinds.json, figureParams.json,
      # catalog.schema.json.
      - "depictio/catalog/**"
      - "depictio/models/components/advanced_viz/**"
      - "depictio/models/components/lite.py"
      - "depictio/api/v1/services/figure/definitions.py"
      - "depictio/api/v1/services/figure/parameter_discovery.py"
      - "depictio/cli/cli/commands/catalog.py"
      - ".github/workflows/tool-studio-ci.yaml"

jobs:
  tool-studio:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # ── Python toolchain (for genKinds regeneration + round-trip validate) ──
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Install depictio
        run: |
          uv venv --python 3.12.9 venv
          source venv/bin/activate
          uv pip install -e ".[dev]"
          uv pip uninstall -y polars polars-runtime-32 2>/dev/null || true
          # Same pin as depictio-ci / catalog-ci (bumped in #985 for the
          # deltalake write_delta() skew) — this workflow was created before it.
          uv pip install --force-reinstall "polars-lts-cpu[numpy,pandas,pyarrow,excel,deltalake]==1.33.1"

      # ── Node toolchain ──────────────────────────────────────────────────────
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter tool-studio run typecheck

      - name: Unit tests (vitest)
        run: pnpm --filter tool-studio run test

      - name: Build (regenerates snapshots from source via genKinds)
        # STRICT_GEN turns "Python unavailable — keeping the committed snapshot"
        # into a failure. Without it the drift check below passes whenever
        # regeneration silently no-ops, which is the opposite of what it checks.
        env:
          TOOL_STUDIO_STRICT_GEN: "1"
        run: |
          source venv/bin/activate
          pnpm --filter tool-studio run build

      - name: Snapshot drift check
        # The build regenerated every snapshot from the Python source. If any
        # differs from the committed copy, fail — regenerate locally and commit.
        # catalog.json matters most: it is the append flow's view of the current
        # catalog and the recognition step's source of truth.
        run: |
          git diff --exit-code -- \
            packages/tool-studio/public/kinds.json \
            packages/tool-studio/public/figureParams.json \
            packages/tool-studio/public/catalog.json \
            packages/tool-studio/public/catalog.schema.json \
            packages/tool-studio/public/multiqc_modules.txt \
            packages/tool-studio/src/catalog/generated/ \
            packages/tool-studio/src/test/generated/ \
          || (echo "::error::snapshots out of date: run 'pnpm --filter tool-studio genkinds' and commit." && exit 1)

      - name: Round-trip, generated entry must pass catalog validate
        run: |
          source venv/bin/activate
          pnpm --filter tool-studio exec tsx scripts/genGolden.ts "$RUNNER_TEMP/golden"
          depictio dev catalog validate --path "$RUNNER_TEMP/golden"

  e2e:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter tool-studio exec playwright install --with-deps chromium

      - name: Run Playwright flow test
        run: pnpm --filter tool-studio run e2e

      # `trace: 'on-first-retry'` is pointless without this: a CI-only failure
      # left its trace on a runner that is about to be destroyed.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            packages/tool-studio/playwright-report/
            packages/tool-studio/test-results/
          retention-days: 7
          if-no-files-found: ignore
