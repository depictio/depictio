name: nf-core release monitor

# Weekly check: has nf-core shipped a newer version for any pipeline we template
# under depictio/projects/nf-core/? If so, compare each release's AWS megatest
# run with the one the template was built on and open ONE draft PR for the whole
# wave: a summary table plus one report per pipeline. The next wave updates the
# same branch and PR instead of opening twelve more.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      force_report_pipeline:
        description: "Report this pipeline even if no update is detected (dry-run)."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  wave:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          # avoid clashing with create-pull-request's own push token
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: |
          uv venv --python 3.12.9 venv
          source venv/bin/activate
          uv pip install -e ".[dev]"
          # Recipes need polars-lts-cpu (same pin as the quality/catalog jobs)
          uv pip uninstall -y polars polars-runtime-32 2>/dev/null || true
          uv pip install --force-reinstall "polars-lts-cpu[numpy,pandas,pyarrow,excel,deltalake]==1.33.1"

      - name: Release check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source venv/bin/activate
          {
            echo "## nf-core release check"
            echo '```'
            python scripts/nfcore_monitor.py check
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report the wave
        id: wave
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_PIPELINE: ${{ github.event.inputs.force_report_pipeline }}
        run: |
          source venv/bin/activate
          # stdout is one line: the PR title (empty when no pipeline has an update)
          title=$(python scripts/nfcore_monitor.py wave --out-dir .nfcore-monitor \
            ${FORCE_PIPELINE:+--force-pipeline "$FORCE_PIPELINE"})
          echo "title=$title" >> "$GITHUB_OUTPUT"
          if [ -f .nfcore-monitor/SUMMARY.md ]; then
            cat .nfcore-monitor/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
            echo "has_reports=1" >> "$GITHUB_OUTPUT"
          fi

      # One fixed branch: a new wave rewrites it from the base and updates the
      # open PR (if it is still open) rather than adding another one.
      - name: Open or update the wave's draft PR
        if: steps.wave.outputs.has_reports == '1'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: nfcore-monitor/wave
          draft: true
          add-paths: .nfcore-monitor
          commit-message: "chore(nf-core): megatest reports for the weekly release wave"
          title: ${{ steps.wave.outputs.title }}
          labels: nf-core
          body-path: .nfcore-monitor/SUMMARY.md
