name: catalog-ci

# Dedicated CI for the bio-catalog. Runs only when the catalog, its model/CLI,
# its tests, or the recipes it references change — fast, focused signal.
on:
  pull_request:
    paths:
      - "depictio/catalog/**"
      - "depictio/models/components/advanced_viz/catalog.py"
      - "depictio/cli/cli/commands/catalog.py"
      - "depictio/tests/models/test_catalog.py"
      - "depictio/projects/**/recipes/**"
      - ".github/workflows/catalog-ci.yaml"
  push:
    branches: [main]
    paths:
      - "depictio/catalog/**"
      - "depictio/models/components/advanced_viz/catalog.py"
      - "depictio/cli/cli/commands/catalog.py"
      - "depictio/tests/models/test_catalog.py"
      - "depictio/projects/**/recipes/**"

# A new push to a PR or branch supersedes its runs still queued or in progress.
# Tag, schedule, dispatch and workflow_run events are grouped by commit and never
# cancelled, so a release build cannot stop halfway through.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) }}

jobs:
  catalog:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: |
          uv venv --python 3.12.9 venv
          source venv/bin/activate
          uv pip install -e ".[dev]"
          # MultiQC/recipes need polars-lts-cpu (same pin as the quality job)
          uv pip uninstall -y polars polars-runtime-32 2>/dev/null || true
          uv pip install --force-reinstall "polars-lts-cpu[numpy,pandas,pyarrow,excel,deltalake]==1.33.1"

      - name: Validate bio-catalog
        # schema + component/roles + renders grounded against fixtures/recipes +
        # nf-core/EDAM existence + recipes resolve
        run: |
          source venv/bin/activate
          depictio dev catalog validate

      - name: Catalog tests
        run: |
          source venv/bin/activate
          python -m pytest depictio/tests/models/test_catalog.py -q
