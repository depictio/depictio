name: Build images (api / worker / viewer / cli / allinone)

# Canonical image build pipeline. Builds the four per-service images
# (see docker-images/Dockerfile.api / .worker / .viewer / .cli) and the
# all-in-one image (docker-images/allinone/Dockerfile) on tag pushes and
# validates them on PRs.
#
# Architectures (resolved by the `setup` job):
#   - PRs: linux/amd64 only — fast validation, no arm64 on every commit/PR.
#   - Any published version (tag push, beta or stable, + workflow_dispatch):
#     linux/amd64 AND linux/arm64, each built on a NATIVE runner (no QEMU
#     emulation), pushed by digest, then stitched into one multi-arch manifest by
#     the `merge` job. So every released version runs natively on Apple Silicon.
#
# Image namespaces: `depictio-api`, `depictio-worker`, `depictio-viewer`,
# `depictio-cli`, `depictio-allinone`. The CLI image is what lets a pipeline
# ingest its own results without a local install (see the Nextflow completion
# trigger); the all-in-one image reopens the artifact the Nextflow module
# publishes with one `docker run` / `apptainer run`.

on:
  pull_request:
    # PR runs are a dress-rehearsal for the release build recipe (registry
    # buildcache + VERSION arg + metadata tags) — not a general code check.
    # The full CI workflow (depictio-ci.yaml) already builds + boots the
    # api/worker/viewer images for every code PR, so we deliberately do NOT
    # trigger on broad source paths (depictio/**, packages/**) here. We only
    # run when files that change the *build recipe itself* are touched, which
    # is what could break the release pipeline at tag time.
    paths:
      - "docker-images/Dockerfile.api"
      - "docker-images/Dockerfile.worker"
      - "docker-images/Dockerfile.viewer"
      - "docker-images/Dockerfile.cli"
      - "docker-images/allinone/**"
      # The module runs in the all-in-one image (its artifact check below), and
      # `depictio local up` there is local_stack.py.
      - "depictio/cli/configs/nextflow/modules/depictio/ingest/**"
      - "depictio/cli/cli/local_stack.py"
      - "docker-images/nginx.conf.template"
      - "docker-images/run_fastapi.sh"
      - "docker-images/run_celery_worker.sh"
      - "pyproject.toml"
      - "uv.lock"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".dockerignore"
      - ".github/workflows/build-images.yaml"
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*-b*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to apply (e.g. 0.7.3-next). Required for manual dispatch."
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  # Per-service images use sibling repos under the same org owner so
  # PAT scopes already in place keep working.
  OWNER: ${{ github.repository_owner }}

jobs:
  setup:
    name: Resolve build platforms
    runs-on: ubuntu-latest
    outputs:
      # JSON array of {name, arch, runner} — consumed by `build` and `smoke-test`.
      platforms: ${{ steps.set.outputs.platforms }}
    steps:
      - name: Decide architectures
        id: set
        run: |
          AMD='{"name":"linux/amd64","arch":"amd64","runner":"ubuntu-22.04"}'
          ARM='{"name":"linux/arm64","arch":"arm64","runner":"ubuntu-24.04-arm"}'

          # PRs validate amd64 only — no arm64 on every PR/commit. Every
          # published version (tag push, beta or stable, or workflow_dispatch)
          # builds amd64 + arm64 so each release runs natively on Apple Silicon.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "platforms=[$AMD]" >> "$GITHUB_OUTPUT"
            echo "PR → amd64 only"
          else
            echo "platforms=[$AMD,$ARM]" >> "$GITHUB_OUTPUT"
            echo "Published build → amd64 + arm64"
          fi

  build:
    name: Build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    needs: setup
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: depictio-api, dockerfile: docker-images/Dockerfile.api }
          - { name: depictio-worker, dockerfile: docker-images/Dockerfile.worker }
          - { name: depictio-viewer, dockerfile: docker-images/Dockerfile.viewer }
          - { name: depictio-cli, dockerfile: docker-images/Dockerfile.cli }
          # arm64 runs natively on ubuntu-24.04-arm (Neoverse, ARMv8.2-A+, which
          # mongod needs); the Dockerfile runs `mongod --version` per platform.
          - { name: depictio-allinone, dockerfile: docker-images/allinone/Dockerfile }
        # amd64 always; arm64 added only for stable releases (see `setup`).
        platform: ${{ fromJSON(needs.setup.outputs.platforms) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine version + push policy
        id: meta-vars
        run: |
          # PR builds validate the Dockerfile without pushing — keeps the
          # registry clean and avoids needing write perms on fork PRs.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PUSH=false" >> "$GITHUB_OUTPUT"
            echo "VERSION=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "PUSH=true" >> "$GITHUB_OUTPUT"
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # Tag push: strip the leading `v`.
            GIT_TAG=${GITHUB_REF#refs/tags/}
            echo "PUSH=true" >> "$GITHUB_OUTPUT"
            echo "VERSION=${GIT_TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to the Container registry
        if: steps.meta-vars.outputs.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.OWNER }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Extract labels for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image.name }}

      - name: Build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.platform.name }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta-vars.outputs.VERSION }}
          # On push: emit a tag-less image and push by digest, so the two
          # per-arch builds can be merged into one manifest later. On PRs:
          # empty outputs → build-only validation (no load, no push).
          outputs: ${{ steps.meta-vars.outputs.PUSH == 'true' && format('type=image,name={0}/{1}/{2},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.OWNER, matrix.image.name) || '' }}
          # Per-image AND per-arch cache ref so api/worker/viewer and amd64/arm64
          # builds never poison each other's layer cache.
          #  - registry buildcache: shared across runs, but its write (cache-to)
          #    is push-gated because type=registry needs GHCR auth (skipped on
          #    fork PRs), so PR runs can only READ it.
          #  - GitHub Actions cache (type=gha): writable on PRs too (no registry
          #    auth), so an unchanged build on a PR or a rerun reuses cached
          #    layers instead of rebuilding from scratch.
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image.name }}:buildcache-${{ matrix.platform.arch }}
            type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: |
            ${{ steps.meta-vars.outputs.PUSH == 'true' && format('type=registry,ref={0}/{1}/{2}:buildcache-{3},mode=max', env.REGISTRY, env.OWNER, matrix.image.name, matrix.platform.arch) || '' }}
            type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }},mode=max

      - name: Export digest
        if: steps.meta-vars.outputs.PUSH == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: steps.meta-vars.outputs.PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  cli-image-check:
    # Dockerfile.cli already asserts that multiqc imports and that the bundled
    # templates resolve, so the build fails before an unusable image can be
    # tagged. That assertion runs as root at build time, though, and the image
    # runs as the unprivileged `depictio` user: this job re-checks both through
    # the real entrypoint, as that user, which is the only part the build cannot
    # cover. Runs on PRs too, since that is when the Dockerfile changes.
    name: CLI image contents
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the CLI image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker-images/Dockerfile.cli
          platforms: linux/amd64
          load: true
          tags: depictio-cli:ci
          cache-from: type=gha,scope=depictio-cli-amd64
          cache-to: type=gha,scope=depictio-cli-amd64,mode=max

      # CI=true does not cross into the container, so without the opt-out each
      # run files a `cli_install` under a fresh anonymous ID.
      - name: The entrypoint runs as the unprivileged user
        run: docker run --rm -e DEPICTIO_TELEMETRY_ENABLED=false depictio-cli:ci version

      - name: multiqc and the bundled templates are readable by that user
        run: |
          docker run --rm --entrypoint python depictio-cli:ci -c "
          import multiqc
          from depictio.cli.cli.utils.templates import locate_template
          print('multiqc', multiqc.__version__)
          print('templates', locate_template('nf-core/ampliseq/latest'))
          "

  allinone-image-check:
    # The all-in-one image (docker-images/allinone/) runs the whole single-user
    # stack on one /data folder, to reopen the <run>_depictio/ artifact the
    # Nextflow module publishes. The `build`/`merge` jobs publish it on releases;
    # this job is the PR gate. On each architecture it publishes, on a native
    # runner, it builds the image and goes through a user's life cycle: a first
    # run that loads the iris example, a clean stop, then a reopen that must read
    # back the same dashboards and the same Delta table rows (MongoDB and
    # SeaweedFS data both survived). Also on the runner's kernel: Linux 6.19+
    # needs GLIBC_TUNABLES for mongod, which the image sets. arm64 runs here on
    # PRs too (unlike `build`): this workflow only runs on PRs that touch a build
    # recipe, and the release would be the first arm64 run of the stack otherwise.
    name: All-in-one image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the all-in-one image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker-images/allinone/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: depictio-allinone:ci
          cache-from: type=gha,scope=depictio-allinone-${{ matrix.arch }}
          cache-to: type=gha,scope=depictio-allinone-${{ matrix.arch }},mode=max

      - name: First run with the iris example, then reopen it
        env:
          DATA: ${{ runner.temp }}/depictio-data
          # The iris Delta table (EXAMPLE_TABLES in depictio/cli/cli/local_stack.py).
          IRIS_DC: 646b0f3c1e4a2d7f8e5b8c9c
          API: http://127.0.0.1:8058/depictio/api/v1
        run: |
          set -euo pipefail
          mkdir -p "$DATA"
          docker image ls depictio-allinone:ci
          uname -srm

          wait_healthy() {
            for _ in $(seq 1 120); do
              status=$(docker inspect --format '{{.State.Health.Status}}' depictio)
              [ "$status" = healthy ] && return 0
              [ "$(docker inspect --format '{{.State.Running}}' depictio)" = true ] || break
              sleep 5
            done
            echo "The stack never became healthy"; docker logs depictio || true
            return 1
          }

          # The admin token the API wrote into the home's CLI config on the first run.
          token() {
            sed -n 's/^ *access_token: *//p' "$DATA/cli/admin_config.yaml" | head -1 | tr -d "\"'"
          }

          # "<rows> <dashboards>": the iris table read from SeaweedFS through the
          # API, and the dashboards MongoDB holds. Retries while the example loads.
          read_back() {
            local auth shape
            auth="Authorization: Bearer $(token)"
            for _ in $(seq 1 60); do
              if shape=$(curl -fsS -H "$auth" "$API/deltatables/shape/$IRIS_DC" 2>/dev/null); then
                rows=$(jq -r '.num_rows' <<< "$shape")
                dashboards=$(curl -fsS -H "$auth" "$API/dashboards/list" | jq 'length')
                # The example's dashboard may land a moment after its table.
                if [ "$dashboards" -ge 1 ]; then
                  echo "$rows $dashboards"
                  return 0
                fi
              fi
              sleep 5
            done
            echo "The iris table and its dashboard never became readable" >&2
            docker logs depictio >&2 || true
            tail -50 "$DATA"/logs/api.log >&2 || true
            return 1
          }

          for run in first reopen; do
            echo "::group::$run run"
            examples=none
            [ "$run" = first ] && examples=iris
            docker run -d --name depictio -p 127.0.0.1:8058:8058 \
              -e DEPICTIO_TELEMETRY_ENABLED=false -e DEPICTIO_EXAMPLES=$examples \
              -v "$DATA:/data" depictio-allinone:ci
            wait_healthy
            curl -fsS -o /dev/null -w "dashboards page: %{http_code}\n" http://127.0.0.1:8058/dashboards
            got=$(read_back)
            echo "$run run: iris rows, dashboards = $got"
            if [ "$run" = first ]; then
              want=$got
              read -r rows dashboards <<< "$got"
              [ "$rows" = 150 ] || { echo "::error::iris has $rows rows, expected 150"; exit 1; }
              [ "$dashboards" -ge 1 ] || { echo "::error::no dashboard after seeding iris"; exit 1; }
            else
              [ "$got" = "$want" ] || { echo "::error::reopen read '$got', first run '$want'"; exit 1; }
            fi
            docker stop -t 60 depictio
            # A clean stop: the entrypoint exits 0 and mongod leaves no lock behind.
            test "$(docker inspect --format '{{.State.ExitCode}}' depictio)" = 0
            docker logs depictio | tail -20
            docker rm depictio
            test ! -s "$DATA/mongo/mongod.lock"
            echo "::endgroup::"
          done

          # Everything under /data belongs to the folder's owner, not root.
          if find "$DATA" ! -user "$(id -u)" | grep -q .; then
            echo "Files not owned by the runner user:"; find "$DATA" ! -user "$(id -u)" | head
            exit 1
          fi

      - name: The Nextflow module builds its artifact in the image, which reopens it
        # The depictio/ingest module's container is this image. Its default mode
        # runs `depictio local up` in the task, ingests, `local down`, and publishes
        # the home: all of it must work with the services baked into the image
        # (DEPICTIO_SERVICES_PREFIX), downloading nothing, as a uid the image does
        # not know, on a read-only image (as under Apptainer).
        env:
          FIXTURES: ${{ github.workspace }}/docker-images/allinone/ci
          IRIS_CSV: ${{ github.workspace }}/depictio/projects/init/iris/data/iris.csv
          # The iris table of docker-images/allinone/ci/iris_project.yaml.
          IRIS_DC: 6a1d0c0ffee0000000000003
          API: http://127.0.0.1:8058/depictio/api/v1
          NXF_VER: 26.10.6
          NXF_ANSI_LOG: "false"
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/module"
          mkdir -p "$WORK/direct/data_root" "$WORK/direct/.home"
          cd "$WORK"

          echo "::group::The module's script logic, run directly"
          # What the task runs, with the stack's home in the work directory: no
          # <home>/env may appear, and py-rattler (the downloader) is not even there.
          cp "$IRIS_CSV" direct/data_root/
          cp "$FIXTURES/iris_project.yaml" direct/
          docker run --rm -u "$(id -u):$(id -g)" --read-only --tmpfs /tmp:rw,exec,size=2g \
            -v "$WORK/direct:/work" -w /work --entrypoint "" \
            -e DEPICTIO_TELEMETRY_ENABLED=false -e HOME=/work/.home \
            depictio-allinone:ci bash -euc '
              if python -c "import rattler" 2>/dev/null; then
                echo "py-rattler is in the image: a download would be possible"; exit 1
              fi
              export DEPICTIO_LOCAL_HOME=/work/stack DEPICTIO_DATA_ROOT=/work/data_root
              depictio local up --no-open --examples none
              depictio ingest /work/data_root --project-config-path /work/iris_project.yaml \
                --server local --result-json /work/result.json
              depictio local down'
          jq . direct/result.json
          test "$(jq -r .status direct/result.json)" = success
          if [ -e direct/stack/env ]; then
            echo "::error::local up downloaded the services into <home>/env"; exit 1
          fi
          echo "::endgroup::"

          echo "::group::The module under Nextflow (-profile docker)"
          if ! java -version 2>&1 | grep -qE 'version "(1[7-9]|[2-9][0-9])'; then
            sudo apt-get update -qq && sudo apt-get install -y -qq openjdk-21-jre-headless
          fi
          curl -fsSL https://get.nextflow.io | bash
          # `image` overrides the release tag the module pins, not published yet.
          ./nextflow run "$FIXTURES/module_artifact.nf" -profile docker \
            --iris "$IRIS_CSV" --outdir "$WORK/results" --image depictio-allinone:ci
          ARTIFACT="$WORK/results/depictio/iris_depictio"
          jq . results/depictio/iris.depictio.json
          test "$(jq -r .status results/depictio/iris.depictio.json)" = success
          test -f "$ARTIFACT/.depictio-local-home"
          test ! -e "$ARTIFACT/env"
          if grep -l "from conda-forge" work/*/*/.command.log; then
            echo "::error::the task downloaded the services"; exit 1
          fi
          # The task ran as the runner's uid, not root.
          if find work ! -user "$(id -u)" | grep -q .; then
            echo "Files not owned by the runner user:"; find work ! -user "$(id -u)" | head
            exit 1
          fi
          du -sh "$ARTIFACT"
          echo "::endgroup::"

          echo "::group::Reopen the artifact with the image's serve"
          docker run -d --name reopen -u "$(id -u):$(id -g)" -p 127.0.0.1:8058:8058 \
            -e DEPICTIO_TELEMETRY_ENABLED=false -v "$ARTIFACT:/data" depictio-allinone:ci
          for _ in $(seq 1 120); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' reopen)" = healthy ] && break
            [ "$(docker inspect --format '{{.State.Running}}' reopen)" = true ] || break
            sleep 5
          done
          if [ "$(docker inspect --format '{{.State.Health.Status}}' reopen)" != healthy ]; then
            echo "::error::the artifact never served"; docker logs reopen || true; exit 1
          fi
          token=$(sed -n 's/^ *access_token: *//p' "$ARTIFACT/cli/admin_config.yaml" | head -1 | tr -d "\"'")
          shape=$(curl -fsS -H "Authorization: Bearer $token" "$API/deltatables/shape/$IRIS_DC")
          echo "reopened iris table: $shape"
          [ "$(jq -r .num_rows <<< "$shape")" = 150 ] || { echo "::error::expected 150 rows"; exit 1; }
          docker stop -t 60 reopen
          test "$(docker inspect --format '{{.State.ExitCode}}' reopen)" = 0
          docker logs reopen | tail -20
          docker rm reopen
          echo "::endgroup::"

  merge:
    name: Merge ${{ matrix.image }} manifest
    needs: build
    # Only the push path publishes — PRs stop at per-arch validation builds.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [depictio-api, depictio-worker, depictio-viewer, depictio-cli, depictio-allinone]

    steps:
      - name: Determine version
        id: meta-vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            GIT_TAG=${GITHUB_REF#refs/tags/}
            echo "VERSION=${GIT_TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.OWNER }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract metadata (tags) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          # `next` is the moving pointer to the latest build; release tags also
          # get their explicit version tag (e.g. 1.0.0).
          tags: |
            type=raw,value=${{ steps.meta-vars.outputs.VERSION }}
            type=raw,value=next

      - name: Create multi-arch manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}@sha256:%s ' *)

      - name: Inspect merged image
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ steps.meta-vars.outputs.VERSION }}

  smoke-test:
    # Prove the published quick start actually boots from JUST the compose file
    # (no .env, no flags) — the exact thing a docs-following user runs. Runs on
    # both arches so the multi-arch images are validated end-to-end at runtime.
    name: Quick-start smoke test (${{ matrix.arch }})
    needs: [setup, merge]
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    env:
      # The shipped docker-compose.yaml has telemetry on and reads this from the shell
      # (not from a file, so "compose file alone" below still holds). CI=true does not
      # reach the containers: without it every release files a `server_install`.
      DEPICTIO_TELEMETRY_ENABLED: "false"
    strategy:
      fail-fast: false
      matrix:
        # Same arches that were actually built+published (amd64, plus arm64 on
        # stable releases) — so the arm64 smoke test only runs when arm64 exists.
        include: ${{ fromJSON(needs.setup.outputs.platforms) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine version
        id: meta-vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            GIT_TAG=${GITHUB_REF#refs/tags/}
            echo "VERSION=${GIT_TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.OWNER }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Boot the quick start from docker-compose.yaml alone (no .env)
        env:
          # Pin to the images this run just built + merged, so the smoke test
          # validates the exact release artifacts (works for betas too, whose
          # compose pin still points at the previous stable).
          DEPICTIO_VERSION: ${{ steps.meta-vars.outputs.VERSION }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/quickstart"
          mkdir -p "$work"
          # Isolate exactly what a docs-following user has: the compose file,
          # nothing else. No .env, no COMPOSE_PROFILES, no extra args.
          cp docker-compose.yaml "$work/docker-compose.yaml"
          cd "$work"

          # Registry pulls occasionally hit a transient 5xx (e.g. a gateway
          # timeout mid-layer on quay.io/Docker Hub) while `up` pulls six
          # images at once; retry a few times before failing the whole run
          # over what is usually a blip, not a real break.
          up_ok=false
          for attempt in 1 2 3; do
            if docker compose up -d; then
              up_ok=true
              break
            fi
            echo "::warning::docker compose up -d failed (attempt $attempt/3) — retrying"
            sleep 15
          done
          $up_ok || { echo "::error::docker compose up -d failed after 3 attempts"; exit 1; }

          echo "::group::Wait for backend health"
          ok=false
          # First boot seeds the reference datasets, so allow a generous window.
          for i in $(seq 1 90); do
            status="$(docker inspect -f '{{ .State.Health.Status }}' depictio-backend 2>/dev/null || echo missing)"
            echo "[$i] backend: $status"
            case "$status" in
              healthy) ok=true; break ;;
              unhealthy) echo "backend reported unhealthy"; break ;;
            esac
            sleep 5
          done
          echo "::endgroup::"
          $ok || { echo "::error::backend did not become healthy"; exit 1; }

          echo "Asserting published endpoints..."
          curl -fsS http://localhost:8058/health >/dev/null && echo "API /health: OK"
          # The viewer starts only after the backend is healthy, so nginx may not
          # be listening yet — poll (tolerating connection-refused) until it
          # serves. Bare `/` is a deliberate 302 -> /dashboards (see the
          # nginx.conf.template `location = /`), so any 2xx/3xx means nginx
          # rendered its config and is serving; 000 is connection-refused.
          code=000
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5080/ || echo 000)"
            case "$code" in 2??|3??) break ;; esac
            sleep 3
          done
          echo "viewer / -> HTTP $code"
          case "$code" in 2??|3??) : ;; *) echo "::error::viewer not serving on 5080 (HTTP $code)"; exit 1 ;; esac
          # Follow through to the SPA shell to prove the built bundle is served,
          # not just that nginx is up.
          shell_code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5080/dashboards/ || echo 000)"
          echo "viewer /dashboards/ -> HTTP $shell_code"
          [ "$shell_code" = "200" ] || { echo "::error::viewer SPA shell not served (/dashboards/ -> HTTP $shell_code)"; exit 1; }
          echo "Quick start booted cleanly with no .env on ${{ matrix.arch }}."

      - name: Sanity checks (status, version, schema, containers)
        env:
          DEPICTIO_VERSION: ${{ steps.meta-vars.outputs.VERSION }}
        run: |
          set -euo pipefail

          echo "::group::API status + version"
          # /depictio/api/v1/utils/status -> {"status": "online", "version": ...}
          status_json="$(curl -fsS http://localhost:8058/depictio/api/v1/utils/status)"
          echo "$status_json"
          api_status="$(echo "$status_json" | jq -r '.status // "unknown"')"
          api_version="$(echo "$status_json" | jq -r '.version // "unknown"')"
          [ "$api_status" = "online" ] || { echo "::error::API status is '$api_status', expected 'online'"; exit 1; }
          # The API reports the VERSION file verbatim; tolerate PEP 440 beta
          # normalization (1.0.0-b9 -> 1.0.0b9) just in case.
          want="$(echo "$DEPICTIO_VERSION" | tr -d '-')"
          got="$(echo "$api_version" | tr -d '-')"
          [ "$want" = "$got" ] || { echo "::error::API reports version '$api_version', expected '$DEPICTIO_VERSION' (the built image)"; exit 1; }
          echo "API online and serving version $api_version (matches the built image)."
          echo "::endgroup::"

          echo "::group::FastAPI OpenAPI schema"
          openapi_code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8058/openapi.json)"
          [ "$openapi_code" = "200" ] || { echo "::error::/openapi.json -> HTTP $openapi_code"; exit 1; }
          echo "/openapi.json: 200"
          echo "::endgroup::"

          echo "::group::All services running"
          # The bundled S3 store (SeaweedFS, service `s3`) must be up (the dropped profile / default creds) and
          # the worker must be up (required for design mode) — assert no container
          # exited or crash-looped.
          for c in mongo redis s3 depictio-backend depictio-viewer depictio-celery-worker; do
            state="$(docker inspect -f '{{ .State.Status }}' "$c" 2>/dev/null || echo missing)"
            echo "  $c: $state"
            [ "$state" = "running" ] || { echo "::error::container '$c' is '$state', expected 'running'"; exit 1; }
          done
          echo "All six services running."
          echo "::endgroup::"

      - name: Verify bootstrap admin + iris dashboard were seeded
        run: |
          set -euo pipefail
          # Mongo is internal-only (not published to the host), so query it from
          # inside the container. mongosh ships in the mongo image.
          mq() { docker exec mongo mongosh --quiet --port 27018 depictioDB --eval "$1" 2>/dev/null | tr -dc '0-9'; }
          # Non-anonymous admin = the single-user auto-seed (db_init) actually ran.
          q_admin='db.users.countDocuments({is_admin:true, is_anonymous:{$ne:true}})'
          # Match the iris reference dashboard case-insensitively (robust to the
          # exact title wording).
          q_dash='db.dashboards.countDocuments({title:/iris/i})'

          echo "::group::Wait for first-boot seeding"
          admins=0; dashes=0
          for i in $(seq 1 24); do  # up to ~2 min after the API is healthy
            admins="$(mq "$q_admin")"; admins="${admins:-0}"
            dashes="$(mq "$q_dash")"; dashes="${dashes:-0}"
            echo "[$i] admin users: $admins | iris dashboards: $dashes"
            if [ "$admins" -ge 1 ] && [ "$dashes" -ge 1 ]; then break; fi
            sleep 5
          done
          echo "::endgroup::"

          [ "$admins" -ge 1 ] || { echo "::error::no non-anonymous admin user seeded — single-user bootstrap did not run"; exit 1; }
          echo "Admin user created (single-user auto-seed works)."
          [ "$dashes" -ge 1 ] || { echo "::error::no iris reference dashboard found in MongoDB"; exit 1; }
          echo "Iris reference dashboard seeded and available."

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f "$RUNNER_TEMP/quickstart/docker-compose.yaml" logs --no-color || true

      - name: Tear down
        if: always()
        run: docker compose -f "$RUNNER_TEMP/quickstart/docker-compose.yaml" down -v || true

  # Tell depictio-docs a new version shipped so it regenerates the OpenAPI
  # reference + opens a docs-update PR (listener: depictio-docs
  # .github/workflows/update-on-release.yaml, on repository_dispatch:new-release).
  # This restores the notify step that lived in the old multi-arch-build.yaml /
  # amd64-build.yaml pipelines before they were consolidated into this file.
  # Gated to real tag pushes only (not PRs or manual workflow_dispatch validation
  # runs) and gated behind a green smoke test, so docs only hears about a
  # release whose images actually boot.
  notify-docs:
    name: Notify docs repository
    needs: smoke-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag + prerelease
        id: rel
        run: |
          TAG="${GITHUB_REF#refs/tags/}"            # e.g. v1.0.1 or v1.0.1-b7
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # Betas (…-b<N>) are prereleases; bare semver tags are stable.
          case "$TAG" in
            *-b*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)    echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Notify docs repository
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GHCR_PAT }}
          repository: depictio/depictio-docs
          event-type: new-release
          client-payload: |
            {
              "version": "${{ steps.rel.outputs.tag }}",
              "release_url": "https://github.com/${{ github.repository }}/releases/tag/${{ steps.rel.outputs.tag }}",
              "prerelease": "${{ steps.rel.outputs.prerelease }}"
            }
