# Throwaway: does GLIBC_TUNABLES=glibc.pthread.rseq=1 let mongo run on the runner kernel?
name: verify mongo rseq
on:
  push:
    branches: [verify/mongo-rseq]
permissions:
  contents: read
jobs:
  mongo:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Kernel
        run: |
          echo "runner=${{ matrix.runner }} kernel=$(uname -r)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Cases
        shell: bash
        run: |
          set +e
          run_case() {
            local label="$1" image="$2" env="$3"
            echo "::group::$label"
            docker rm -f m >/dev/null 2>&1
            docker run -d --name m --restart on-failure:5 ${env:+-e "$env"} "$image" --bind_ip_all >/dev/null
            sleep 20
            state=$(docker inspect -f '{{.State.Status}} restarts={{.RestartCount}}' m)
            result="FAILED TO START ($state)"
            if docker exec m mongosh --quiet --eval 'db.runCommand({ping:1}).ok' 2>/dev/null | grep -q 1; then
              pc=$(docker exec m mongosh --quiet --eval 'db.serverStatus().tcmalloc.usingPerCPUCaches' 2>/dev/null)
              for w in 1 2 3 4; do
                docker exec -d m mongosh --quiet --eval '
                  const c = db.getSiblingDB("t").c'$w';
                  for (let b = 0; b < 40; b++)
                    c.insertMany(Array.from({length: 5000}, (_, i) => ({i, s: "x".repeat(200)})));
                  c.find({i: {$gt: 10}}).sort({s: 1}).limit(1000).toArray();' >/dev/null
              done
              sleep 90
              state=$(docker inspect -f '{{.State.Status}} restarts={{.RestartCount}}' m)
              docs=$(docker exec m mongosh --quiet --eval 'db.getSiblingDB("t").getCollectionNames().reduce((n,c)=>n+db.getSiblingDB("t")[c].countDocuments(),0)' 2>/dev/null)
              if docker exec m mongosh --quiet --eval 'db.runCommand({ping:1}).ok' 2>/dev/null | grep -q 1; then
                result="OK after load: $state perCPUCaches=$pc docs=$docs"
              else
                result="DIED under load: $state perCPUCaches=$pc"
              fi
            fi
            docker logs m 2>&1 | grep -iE 'kernel|rseq|tcmalloc|critical|fatal' | head -5
            echo "::endgroup::"
            echo "| $label | $result |" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          echo "| case (${{ matrix.runner }}, $(uname -r)) | result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          run_case "8.0.23 no env"   mongo:8.0.23 ""
          run_case "8.0.23 rseq=1"   mongo:8.0.23 "GLIBC_TUNABLES=glibc.pthread.rseq=1"
          run_case "8.0.14 no env"   mongo:8.0.14 ""
          run_case "8.0.14 rseq=1"   mongo:8.0.14 "GLIBC_TUNABLES=glibc.pthread.rseq=1"
