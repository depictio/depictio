name: All-in-one image, nf-core pipelines through the module

# Seven nf-core pipelines, each at the release its shipped template targets, run
# with -profile test,docker, then the depictio/ingest module on their results in
# the all-in-one image, then the artifact reopened with the image's `serve`.
# About 4.5 hours of runner time per run, and each pipeline downloads its own
# reference data from third-party sites (CARD, SILVA, Pangolin's GitHub releases)
# whose outages fail the job without anything wrong on our side.
#
# So not on every pull request that touches a build recipe (build-images.yaml):
# there, nf-core/rnaseq through the module, under Docker and under Apptainer,
# is the gate. This workflow runs when what it checks changes (the module, the
# subworkflow, this script, one of these templates), weekly, on release tags,
# and by hand (Actions > Run workflow, or `gh workflow run allinone-nfcore.yaml`).
on:
  pull_request:
    paths:
      - "depictio/cli/configs/nextflow/modules/depictio/ingest/**"
      - "depictio/cli/configs/nextflow/subworkflows/depictio/publish/**"
      - "docker-images/allinone/ci/nfcore_through_module.sh"
      - "depictio/projects/nf-core/ampliseq/**"
      - "depictio/projects/nf-core/viralrecon/**"
      - "depictio/projects/nf-core/taxprofiler/**"
      - "depictio/projects/nf-core/airrflow/**"
      - "depictio/projects/nf-core/smrnaseq/**"
      - "depictio/projects/nf-core/sarek/**"
      - "depictio/projects/nf-core/funcscan/**"
      - ".github/workflows/allinone-nfcore.yaml"
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  schedule:
    # Mondays 03:17 UTC, before the release monitor (06:00): an upstream data
    # source that moved shows up here within the week.
    - cron: "17 3 * * 1"
  workflow_dispatch:

# A new push to a PR supersedes its runs still queued or in progress. Tag,
# schedule and dispatch runs are grouped by commit and never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  allinone-nfcore-templates:
    # The same path as allinone-nfcore-rnaseq in build-images.yaml: -profile
    # test,docker, the module with template detection, the reopen. They cover
    # the template shapes rnaseq does not (params-derived routes, MultiQC
    # recipes, databases, runs).
    # Not scrnaseq: its template reads a megatest layout, one aligner_<route>/
    # per --aligner run with aligner_cellranger/ required, which a single
    # pipeline run (the test profile aligns with star) never produces.
    name: All-in-one image, nf-core/${{ matrix.pipeline }} through the module
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pipeline: ampliseq, version: 2.18.0 }
          # Pangolin's database update asks GitHub's API, which the shared
          # runners exhaust (403); the template's pangolin collection is optional.
          - { pipeline: viralrecon, version: 3.0.0, args: --skip_pangolin }
          - { pipeline: taxprofiler, version: 2.0.1 }
          - { pipeline: airrflow, version: 5.1.2 }
          - { pipeline: smrnaseq, version: 2.4.1 }
          - { pipeline: sarek, version: 3.11.0 }
          - { pipeline: funcscan, version: 4.0.0 }
    env:
      NXF_VER: 26.10.6
      NXF_ANSI_LOG: "false"
      CI_SCRIPT: ${{ github.workspace }}/docker-images/allinone/ci/nfcore_through_module.sh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free disk space
        # nf-core's containers and the 2.9 GB image do not fit next to the
        # runner's preinstalled toolchains.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the all-in-one image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker-images/allinone/Dockerfile
          platforms: linux/amd64
          load: true
          tags: depictio-allinone:ci
          cache-from: |
            type=gha,scope=depictio-allinone-amd64
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/depictio-allinone:buildcache-amd64

      - name: Install Nextflow
        run: |
          set -euo pipefail
          if ! java -version 2>&1 | grep -qE 'version "(1[7-9]|[2-9][0-9])'; then
            sudo apt-get update -qq && sudo apt-get install -y -qq openjdk-21-jre-headless
          fi
          mkdir -p "$RUNNER_TEMP/bin"
          (cd "$RUNNER_TEMP/bin" && curl -fsSL https://get.nextflow.io | bash)
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run nf-core/${{ matrix.pipeline }} ${{ matrix.version }} (-profile test,docker)
        working-directory: ${{ runner.temp }}
        run: bash "$CI_SCRIPT" pipeline "${{ matrix.pipeline }}" "${{ matrix.version }}" ${{ matrix.args }}

      - name: Ingest the run with the module, in the all-in-one image
        working-directory: ${{ runner.temp }}
        run: bash "$CI_SCRIPT" module docker depictio-allinone:ci "nf-core/${{ matrix.pipeline }}/${{ matrix.version }}"

      - name: Reopen the artifact with the image's serve
        working-directory: ${{ runner.temp }}
        run: bash "$CI_SCRIPT" reopen docker depictio-allinone:ci
