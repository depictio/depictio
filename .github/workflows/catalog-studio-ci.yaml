name: catalog-studio-ci

# CI for the Catalog Studio web app. Two guarantees:
#   1. Frontend health — typecheck, unit tests (vitest), production build.
#   2. Round-trip — an entry generated by the app's own yamlGen MUST pass
#      `depictio dev catalog validate`, and the committed kinds.json /
#      catalog.schema.json snapshots must match their in-repo source (drift).
on:
  pull_request:
    paths:
      - "packages/catalog-studio/**"
      - "packages/depictio-react-core/**"
      - "packages/depictio-components/**"
      - "depictio/catalog/catalog.schema.json"
      - "depictio/models/components/advanced_viz/schemas.py"
      - "depictio/cli/cli/commands/catalog.py"
      - ".github/workflows/catalog-studio-ci.yaml"
  push:
    branches: [main]
    paths:
      - "packages/catalog-studio/**"
      - "depictio/catalog/catalog.schema.json"
      - "depictio/models/components/advanced_viz/schemas.py"
      - "depictio/cli/cli/commands/catalog.py"

jobs:
  catalog-studio:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # ── Python toolchain (for genKinds regeneration + round-trip validate) ──
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install depictio
        run: |
          uv venv --python 3.12.9 venv
          source venv/bin/activate
          uv pip install -e ".[dev]"
          uv pip uninstall -y polars polars-runtime-32 2>/dev/null || true
          uv pip install --force-reinstall "polars-lts-cpu[numpy,pandas,pyarrow,excel,deltalake]==1.19.0"

      # ── Node toolchain ──────────────────────────────────────────────────────
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter catalog-studio run typecheck

      - name: Unit tests (vitest)
        run: pnpm --filter catalog-studio run test

      - name: Build (regenerates snapshots from source via genKinds)
        run: |
          source venv/bin/activate
          pnpm --filter catalog-studio run build

      - name: Snapshot drift check
        # The build regenerated kinds.json + catalog.schema.json from the Python
        # source. If they differ from the committed snapshots, fail — regenerate
        # locally and commit.
        run: |
          git diff --exit-code -- \
            packages/catalog-studio/public/kinds.json \
            packages/catalog-studio/public/catalog.schema.json \
          || (echo "::error::kinds.json/catalog.schema.json out of date — run 'pnpm --filter catalog-studio genkinds' and commit." && exit 1)

      - name: Round-trip — generated entry must pass catalog validate
        run: |
          source venv/bin/activate
          pnpm --filter catalog-studio exec tsx scripts/genGolden.ts "$RUNNER_TEMP/golden"
          depictio dev catalog validate --path "$RUNNER_TEMP/golden"

  e2e:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter catalog-studio exec playwright install --with-deps chromium

      - name: Run Playwright flow test
        run: pnpm --filter catalog-studio run e2e
