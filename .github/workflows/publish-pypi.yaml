name: Publish to PyPI

# Publishes depictio, plotly-upset and plotly-complexheatmap on a release tag, through
# PyPI trusted publishing: each project trusts this workflow file in its own GitHub
# environment, so no token is stored. Pull requests touching the packaging, and
# manual runs, build and check the distributions without publishing them.

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-b*"
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "packages/plotly-*/pyproject.toml"
      - "scripts/check_depictio_wheel.py"
      - ".github/workflows/publish-pypi.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm

      # The depictio wheel carries the viewer bundle, built as in local-server-smoke.yaml.
      - name: Build the viewer bundle
        run: |
          pnpm install --frozen-lockfile
          cd depictio/viewer
          VITE_NO_SOURCEMAP=true NODE_OPTIONS="--max-old-space-size=4096" pnpm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # depictio ships a wheel only: an sdist would need the viewer bundle, which is
      # not built by Python, to install.
      - name: Build the distributions
        run: |
          uv build --wheel --out-dir dist/depictio .
          uv build --out-dir dist/plotly-upset packages/plotly-upset
          uv build --out-dir dist/plotly-complexheatmap packages/plotly-complexheatmap
          ls -la dist/*

      - name: Check the distributions
        run: |
          python3 scripts/check_depictio_wheel.py dist/depictio/depictio-*.whl
          uvx twine check --strict dist/*/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # One job per project, since PyPI ties each one to its own GitHub environment.
  # The plotly packages go first, so a depictio release never shows up before the
  # versions it pins. They keep their own version numbers and most tags leave them
  # unchanged: skip-existing then publishes nothing for them, which also means a
  # change to their code reaches PyPI only with a version bump.
  publish-plotly-upset:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment:
      name: pypi-plotly-upset
      url: https://pypi.org/project/plotly-upset/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/plotly-upset/
          skip-existing: true

  publish-plotly-complexheatmap:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment:
      name: pypi-plotly-complexheatmap
      url: https://pypi.org/project/plotly-complexheatmap/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/plotly-complexheatmap/
          skip-existing: true

  publish-depictio:
    needs: [publish-plotly-upset, publish-plotly-complexheatmap]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/depictio/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/depictio/
