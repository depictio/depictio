name: deploy-catalog-studio

# Build the backend-less Catalog Studio SPA and publish it to its own showcase
# repository, depictio/depictio-catalog-studio, whose GitHub Pages site serves
# https://depictio.github.io/depictio-catalog-studio/ (Vite base '/depictio-catalog-studio/').
#
# Why a second repository: a Pages site's URL path is its repository name, so
# publishing from depictio/depictio can only ever be /depictio/ — which reads
# like the project's own site while the documentation actually lives at
# /depictio-docs/. The showcase repo holds ONLY the built site; the source
# stays here, so the `depictio-builder` alias and the committed catalog
# snapshots keep working exactly as they do in CI.
#
# Path-filtered so it only runs when the app (or the in-repo schema/kinds it
# snapshots) change. The build reads committed snapshots
# (public/kinds.json + public/catalog.schema.json); their freshness is enforced
# by the drift check in catalog-studio-ci.yaml, so this job stays lean
# (pure Node — no Python).
on:
  push:
    branches: [main]
    paths:
      - "packages/catalog-studio/**"
      - "packages/depictio-react-core/**"
      - "packages/depictio-components/**"
      # Compiled into the bundle through the `depictio-builder` alias.
      - "depictio/viewer/src/builder/**"
      # A merged tool changes the committed catalog.json snapshot the app reads
      # for recognition and duplicate detection — redeploy so the live app sees it.
      - "depictio/catalog/**"
      - ".github/workflows/deploy-catalog-studio.yaml"
  workflow_dispatch:

# This workflow only reads this repository; the write happens in the showcase
# repo through DEPLOY_TOKEN, never through GITHUB_TOKEN.
permissions:
  contents: read

# Never run two deploys at once; let the newest win.
concurrency:
  group: catalog-studio-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Catalog Studio
        # One-click PR ("Sign in with GitHub") is only enabled when BOTH are set
        # at build time — Vite inlines them, there is no runtime config. Without
        # them the deployed app silently falls back to zip + web upload.
        #
        # Set them as repository *variables* (Settings → Secrets and variables →
        # Actions → Variables); neither is a secret. The client id is public by
        # design, and the worker URL is just an endpoint — the OAuth client
        # secret lives only in the Cloudflare Worker (see
        # packages/catalog-studio/oauth-worker/README.md).
        env:
          VITE_GH_CLIENT_ID: ${{ vars.VITE_GH_CLIENT_ID }}
          VITE_GH_OAUTH_WORKER_URL: ${{ vars.VITE_GH_OAUTH_WORKER_URL }}
        run: |
          if [ -z "${VITE_GH_CLIENT_ID}" ] || [ -z "${VITE_GH_OAUTH_WORKER_URL}" ]; then
            echo "::warning::VITE_GH_CLIENT_ID / VITE_GH_OAUTH_WORKER_URL are unset — \
          deploying WITHOUT one-click PR (zip + web-upload fallback). \
          Set them as repository variables to enable it."
          fi
          pnpm --filter catalog-studio run build

      - name: Publish to depictio/depictio-catalog-studio
        # CATALOG_STUDIO_DEPLOY_TOKEN: a fine-grained PAT scoped to
        # depictio/depictio-catalog-studio ONLY, with Contents: Read and write. When it is
        # absent the workflow stops here with a clear message instead of failing
        # on an opaque git 403 (e.g. on a fork, where the secret is not exposed).
        env:
          DEPLOY_TOKEN: ${{ secrets.CATALOG_STUDIO_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_TOKEN}" ]; then
            echo "::warning::CATALOG_STUDIO_DEPLOY_TOKEN is unset — built the site but skipped publishing."
            exit 0
          fi
          DIST=packages/catalog-studio/dist
          # Pages would otherwise run Jekyll and drop any asset directory
          # starting with an underscore.
          touch "$DIST/.nojekyll"
          # A SPA served from a subpath: unknown routes must fall back to the
          # entry document rather than Pages' own 404.
          cp "$DIST/index.html" "$DIST/404.html"

          cd "$DIST"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy Catalog Studio from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          # A single-commit force push: the showcase repo is a build output, so
          # it carries no history worth preserving and stays small over time.
          git push -q --force \
            "https://x-access-token:${DEPLOY_TOKEN}@github.com/depictio/depictio-catalog-studio.git" \
            HEAD:refs/heads/gh-pages
          echo "Published https://depictio.github.io/depictio-catalog-studio/"
