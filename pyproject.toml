[project]
name = "depictio"
version = "1.12.0-b1"
description = "Interactive dashboards for bioinformatics pipeline results: server, worker, viewer and CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  # Core dependencies
  "bcrypt==5.0.0",
  "bleach==6.4.0",
  # Held at 2.0.0 — blocked on motor, not on the test suite. beanie 2.1.0's
  # Initializer does:
  #     elif database is not None and callable(database.client.append_metadata):
  #         database.client.append_metadata(_DRIVER_METADATA)
  # append_metadata only exists on pymongo's native AsyncMongoClient (>=4.14).
  # motor has no such method, and its client returns a MotorDatabase for any
  # unknown attribute (treating it as a database name). MotorDatabase defines
  # __call__ purely to raise a friendly error, so `callable(...)` is True, the
  # guard passes, and init_beanie dies with "MotorDatabase object is not
  # callable" — the API never finishes startup. Verified on CI in PR #966:
  # unit tests green, every docker/e2e job red.
  #
  # Note the unit suite CANNOT catch this: on mongomock-motor the same attribute
  # resolves to a non-callable, so beanie skips the branch entirely. The mock is
  # more permissive than the real driver in exactly the way that hides the bug.
  #
  # Unblocking this means migrating motor -> pymongo.AsyncMongoClient (motor is
  # deprecated upstream), which touches lifespan.py, celery_app.py,
  # mongodb_watcher.py, log_handler.py, cli/utils/api_calls.py and the test
  # conftests. That is its own piece of work, not a dependency bump — tracked
  # in #971.
  #
  # Secondary blocker, still open once the above is done: beanie 2.1.0 also
  # calls list_collection_names(nameOnly=True, authorizedCollections=True),
  # which mongomock's Database rejects (81 test failures). mongomock 4.3.0 /
  # mongomock-motor 0.0.36 remain the newest releases.
  "beanie==2.0.0",
  # Capped at 1.43.0: s3fs 2026.4.0 -> aiobotocore caps botocore<1.43.1, so this
  # is the highest boto3 compatible with the pinned s3fs/aiobotocore chain.
  "boto3==1.43.0",
  "celery==5.6.3",
  "cloudpickle==3.1.2",
  "cryptography==50.0.0",
  "colorlog==6.12.0",
  # Visualization
  "plotly-express==0.4.1",
  # In-tree packages (packages/): [tool.uv.sources] installs them from the
  # checkout; the pins are what a published depictio wheel requires.
  "plotly-complexheatmap==0.1.0",
  "plotly-upset==0.1.0",
  # Data processing
  "deltalake==1.6.2",
  "fastparquet==2026.5.0",
  "numpy==2.4.6",
  "orjson==3.11.9",
  "pandas==3.0.5",
  # polars-lts-cpu is legacy; the modern LTS/older-CPU build is polars[rtcompat]
  # (-> polars-runtime-compat). rtcompat also matches multiqc 1.35's requirement.
  "polars[rtcompat,numpy,pandas,pyarrow,excel,deltalake]==1.43.2",
  # LLM client for the AI endpoints (provider-agnostic; lazy-imported so the
  # app boots without a working install when DEPICTIO_AI_ENABLED is false)
  "litellm>=1.50,<2",
  # API and web
  "devtools==0.12.2",
  "diskcache==5.6.3",
  "fastapi==0.141.1",
  "gunicorn==26.0.0",
  "httpx==0.28.1",
  "uvicorn==0.52.1",
  "websockets==17.0.1",
  # Database
  "motor==3.7.1",
  "pymongo==4.17.0",
  # Authentication and security
  "pydantic[email]==2.13.4",
  "pydantic-settings==2.14.2",
  "pyjwt==2.13.0",
  "python-jose==3.5.0",
  "python-multipart==0.0.32",
  "restrictedpython==8.4",
  # Playwright for screenshots (pure Python - installs its own browsers)
  "playwright==1.62.0",
  # Utilities
  "multiqc==1.35",
  "mypy-boto3-s3==1.43.50",
  "psutil==7.2.2",
  "python-dotenv==1.2.2",
  "pyyaml>=6.0.3",
  # Held at 5.2.1 (main's pin): redis-py 8.0 regressed the real-time pub/sub
  # event listener (connection_manager) — it starves the API event loop, so
  # internal HTTP self-calls time out and reference-dataset ingestion never
  # writes deltatables. Bisecting via CI; bump again once that's resolved.
  # Still pinned as of the 2026-08 runtime bumps: the unit suite does not cover
  # this regression (it's runtime pub/sub behaviour), so a green `pytest` run is
  # not evidence that redis 8 is safe — verifying it needs the e2e/docker jobs.
  "redis==5.2.1",
  "tomli==2.4.1",
  "types-requests==2.33.0.20260712",
  "umap-learn==0.5.12",
  # Storage
  "s3fs==2026.4.0",
  "fsspec==2026.4.0",
  # CLI utilities (required by API code that imports CLI helpers)
  "typer==0.27.0",
  "rich==15.0.0",
]
authors = [{ name = "Thomas Weber", email = "thomas.weber@embl.de" }]
urls = { Homepage = "https://github.com/depictio/depictio", Documentation = "https://depictio.github.io/depictio-docs/latest/" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "ruff==0.16.1",
  "ty==0.0.65",
  "pre-commit==4.6.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "pytest-xdist==3.8.0",
  "mongomock==4.3.0",
  "mongomock-motor==0.0.36",
  "bump2version==1.0.1",
  "testcontainers==4.15.0",
  "types-bleach==6.4.0.20260728",
  "types-boto3==1.43.62",
]
# `depictio local up`: fetches MongoDB, Redis and SeaweedFS from conda-forge.
local = ["py-rattler==0.26.0"]

# Groups are never published with the wheel, unlike extras.
[dependency-groups]
# File watcher for live-reloading the Celery worker: run_celery_worker.sh wraps
# celery in `watchmedo auto-restart` when DEPICTIO_DEV_MODE=true (Celery has no
# built-in reloader). Dockerfile.worker installs this group so the published
# worker image still supports dev mode. Kept out of the core dependencies
# because watchdog 6.0.0 has no Python 3.14 macOS wheel. The API's opt-in YAML
# watcher (yaml_watcher.py) uses it when present and polls otherwise.
worker-reload = ["watchdog==6.0.0"]


[project.scripts]
depictio-api = "depictio.api.run:main"
depictio = "depictio.cli.depictio_cli:main"


[tool.uv.sources]
plotly-complexheatmap = { path = "packages/plotly-complexheatmap", editable = true }
plotly-upset = { path = "packages/plotly-upset", editable = true }

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

# The wheel serves `depictio local up`: the iris and penguins examples, plus the
# nf-core templates for ingesting the user's own results. The Docker images copy the
# source tree instead of installing the wheel, so none of the trimming below affects
# them: they keep every reference project and thumbnail.
[tool.setuptools]
# Data files come from package-data alone, so a stale depictio.egg-info/SOURCES.txt
# from an earlier build cannot add files back.
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["depictio*"]
exclude = [
  "depictio.viewer.node_modules*",
  "depictio.tests*",
  # Maintainer scripts (reseeding, seed and docs generation), run from a checkout.
  "depictio.dev_scripts*",
  "depictio.projects.test*",
  # Example projects; iris and penguins ship as package-data below.
  "depictio.projects.init.*",
]

# Files the server reads at runtime. The viewer bundle must be built first:
# cd depictio/viewer && pnpm run build. Include globs are glob()-based: `**` recurses
# but skips dot-directories, hence the separate .db_seeds patterns.
[tool.setuptools.package-data]
"depictio" = [
  "viewer/dist/**/*",
  # Reference thumbnails of the iris and penguins dashboards only.
  "api/static/screenshots/6824cb3b89d2b72169309737_*.png",
  "api/static/screenshots/6824cb3b89d2b72169309738_*.png",
  "api/static/branding/**/*",
  "api/static/dashboard_logos/**/*",
  "api/static_assets/**/*",
  "projects/init/iris/**/*",
  "projects/init/iris/.db_seeds/*",
  "projects/init/penguins/**/*",
  "projects/init/penguins/.db_seeds/*",
  "projects/nf-core/**/*",
  "projects/nf-core/**/.db_seeds/*",
  "catalog/**/*",
  "cli/configs/**/*",
]

# Exclude patterns are fnmatch-based: `*` also crosses `/`, so each pattern matches
# at any depth below its prefix, and no pattern can carve an exception out of another.
[tool.setuptools.exclude-package-data]
"depictio" = [
  "viewer/dist/*.map",
  "*/__pycache__/*",
  "*.pyc",
  # Template docs (screenshots), validation reports and megatest inputs: never read
  # by the API or the CLI.
  "projects/nf-core/*/docs/*",
  "projects/nf-core/*.md",
  "projects/nf-core/*/megatest.yaml",
  "projects/nf-core/*/download_test_data.sh",
  # Reference datasets of ampliseq and viralrecon (canonical TSVs, MultiQC parquet,
  # trees, reference metadata). Only reference seeding reads them
  # (db_init_reference_datasets.py); ingesting the user's own results reads the
  # template.yaml, dashboards and recipes, and the user's files.
  "projects/nf-core/ampliseq/*.tsv",
  "projects/nf-core/ampliseq/*.parquet",
  "projects/nf-core/ampliseq/*.nwk",
  "projects/nf-core/viralrecon/*.tsv",
  "projects/nf-core/viralrecon/*.parquet",
  "projects/nf-core/viralrecon/*.nwk",
]

# [tool.mypy]
# exclude = ["build/", "depictio/api/"]
# files = ["depictio/tests/", "depictio/models/", "depictio/cli/"]

[tool.ruff]
line-length = 100
exclude = ["dev/", "packages/", "scripts/"]

[tool.ruff.lint]
select = ["E", "F", "I"] # Enable import sorting (I rules) - restored original
ignore = ["E501"]        # Ignore all line length errors

[tool.ruff.lint.isort]
known-first-party = ["depictio"]


[tool.ty.src]
# TEMPORARY (Phase A tooling bump): upgrading ty 0.0.1-alpha.12 -> 0.0.44 surfaced
# many new diagnostics that the old alpha never reported. The pre-commit `ty` hook
# was narrowed to `depictio/models/` (api/ and cli/ cleanup is deferred to a
# dedicated follow-up). The files below still carry error-level type-debt that
# needs real investigation rather than a mechanical fix — pydantic
# `ValidationError.from_exception_data` arg typing, union narrowing on a falsy
# `rules`, a possibly-real `DCImageConfig()` missing-argument call, and an
# unresolved `MVPDashboard` import. Excluded so the narrowed gate stays green;
# remove entries here as each file is cleaned up.
exclude = [
  "depictio/models/validation/ag_grid.py",
  "depictio/models/validation/dash_mantine.py",
  "depictio/models/validation/plotly_express.py",
  "depictio/models/yaml_serialization/validation.py",
  "depictio/models/models/data_collections.py",
]


[tool.mypy]
# Basic settings
python_version = "3.11"             # Adjust to your Python version
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
strict_optional = false

# Display settings - simpler output
show_error_context = false
show_column_numbers = true
error_summary = true
pretty = true

# Permissive settings
ignore_missing_imports = true
follow_imports = "silent"
warn_redundant_casts = false
warn_no_return = false
warn_unreachable = false

# Per-module settings - only check specific directories
[[tool.mypy.overrides]]
module = ["depictio.models.*", "depictio.cli.*"]
check_untyped_defs = true


[tool.pytest.ini_options]
python_files = "test_*.py"
testpaths = [
  "depictio/tests/api",
  # The catalog's project-level tests: they hold the generated conformance
  # project and the CLI smoke project to what the catalog currently declares.
  # catalog-ci covers the catalog itself but not the projects built from it.
  "depictio/tests/catalog",
  "depictio/tests/models",
  "depictio/tests/cli",
  "depictio/tests/unit",
  # The recipe tests were written but never run in CI: `pytest -xvs -n auto`
  # takes its paths from this list, and this directory was not on it. They pin
  # the canonical-seed transforms, including the annotation carry-over whose
  # absence from the shipped seed nothing else would notice.
  "depictio/tests/recipes",
]
markers = [
  "no_db: mark test to skip database setup",
  "integration: mark test as an integration test.",
  "playwright: mark test as a playwright test.",
  "docker: mark test as requiring docker.",
]
addopts = "-s"
filterwarnings = [
  "ignore::pydantic.warnings.PydanticDeprecatedSince20",
  "ignore::DeprecationWarning:pydantic.*",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
