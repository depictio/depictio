# =====================================================
# Google Analytics Configuration Example
# =====================================================
# This values file demonstrates how to enable Google Analytics
# tracking for your Depictio deployment.
#
# Usage:
#   helm upgrade depictio ./helm-charts/depictio \
#     -f values.yaml \
#     -f examples/values-google-analytics.yaml

# The BACKEND is the only place these belong. The viewer ships as a static,
# pre-built bundle served by nginx, so it cannot read environment variables at
# runtime — it fetches this configuration from the API at boot instead
# (GET /depictio/api/v1/utils/public-config). Earlier revisions of this file also
# set the keys under `frontend.env`, where nothing ever read them.
backend:
  env:
    # Enable Google Analytics tracking
    DEPICTIO_GOOGLE_ANALYTICS_ENABLED: "true"

    # Set your GA4 Measurement ID (get from Google Analytics dashboard)
    DEPICTIO_GOOGLE_ANALYTICS_TRACKING_ID: "G-XXXXXXXXXX"

# =====================================================
# Getting Your Google Analytics Tracking ID
# =====================================================
#
# 1. Go to Google Analytics (https://analytics.google.com)
# 2. Create a new GA4 property for your domain
# 3. Navigate to Admin → Property → Data Streams
# 4. Create or select a web stream for your Depictio instance
# 5. Copy the Measurement ID (starts with G-)
# 6. Replace "G-XXXXXXXXXX" above with your actual ID
#
# =====================================================
# Features
# =====================================================
#
# When enabled, Google Analytics will track page views and session engagement in
# the React viewer. Advertising features (Google Signals and ad personalization)
# are switched off and IP anonymization is on, since this is product analytics for
# a research tool.
#
# This is one of three separate, independent systems — do not confuse them:
#
# 1. Google Analytics (this file) — per-deployment web analytics. Opt-in, and the
#    data goes to YOUR GA4 property, not to the Depictio maintainers.
# 2. DEPICTIO_ANALYTICS_* — Depictio's own session/activity tracking. Stays in
#    your MongoDB and is never transmitted anywhere. Opt-in.
# 3. DEPICTIO_TELEMETRY_* — anonymous installation counting sent to the Depictio
#    maintainers. Enabled by default; see docs/telemetry.md to review or disable.
