{{- $s3 := include "depictio.s3" . | fromYaml }}
{{- $s3Ingress := $s3.ingress | default dict }}
{{- $useSeparateS3Ingress := and .Values.ingress.enabled $s3.enabled (or $s3Ingress.separateRoute $s3Ingress.annotations $s3Ingress.labels $s3Ingress.hosts $s3Ingress.tls $s3Ingress.ingressClassName) }}
{{- $backendIngress := .Values.backend.ingress | default dict }}
{{- $useSeparateBackendIngress := and .Values.ingress.enabled (or $backendIngress.separateRoute $backendIngress.annotations $backendIngress.labels $backendIngress.hosts $backendIngress.tls $backendIngress.ingressClassName) }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app: depictio
    component: ingress
    {{- if .Values.ingress.labels }}
    {{- toYaml .Values.ingress.labels | nindent 4 }}
    {{- end }}
  annotations:
    {{- if .Values.ingress.annotations }}
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.ingressClassName }}
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{- end }}
  rules:
  {{- if .Values.ingress.hosts }}
  {{- /* If hosts are explicitly defined in values, use them */}}
  {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
        {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ printf "%s-%s" $.Release.Name .service.name }}
                port:
                  {{- if .service.portName }}
                  name: {{ .service.portName }}
                  {{- else }}
                  number: {{ .service.port }}
                  {{- end }}
        {{- end }}
  {{- end }}
  {{- else }}
  {{- /* Generate default host configurations using URL pattern helpers */}}
    - host: {{ include "depictio.frontendUrl" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-depictio-viewer
                port:
                  number: {{ .Values.viewer.service.httpPort }}
    {{- if not $useSeparateBackendIngress }}
    - host: {{ include "depictio.apiUrl" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-depictio-backend
                port:
                  number: {{ .Values.backend.service.httpPort }}
    {{- end }}
    {{- if and $s3.enabled (not $useSeparateS3Ingress) }}
    - host: {{ include "depictio.s3Url" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-minio
                port:
                  number: {{ $s3.service.httpPort }}
    {{- end }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
{{- end }}
{{- /* The dedicated S3 Ingress keeps its "-minio-ingress" name and the
       "-minio" backend Service / host, like the rest of the S3 store. */}}
{{- if $useSeparateS3Ingress }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-minio-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app: depictio
    component: minio-ingress
    {{- if $s3Ingress.labels }}
    {{- toYaml $s3Ingress.labels | nindent 4 }}
    {{- else if .Values.ingress.labels }}
    {{- toYaml .Values.ingress.labels | nindent 4 }}
    {{- end }}
  annotations:
    {{- if $s3Ingress.annotations }}
    {{- toYaml $s3Ingress.annotations | nindent 4 }}
    {{- end }}
spec:
  {{- if $s3Ingress.ingressClassName }}
  ingressClassName: {{ $s3Ingress.ingressClassName }}
  {{- else if .Values.ingress.ingressClassName }}
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{- end }}
  rules:
  {{- if $s3Ingress.hosts }}
  {{- range $s3Ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
        {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ printf "%s-%s" $.Release.Name .service.name }}
                port:
                  {{- if .service.portName }}
                  name: {{ .service.portName }}
                  {{- else }}
                  number: {{ .service.port }}
                  {{- end }}
        {{- end }}
  {{- end }}
  {{- else }}
    - host: {{ include "depictio.s3Url" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-minio
                port:
                  number: {{ $s3.service.httpPort }}
  {{- end }}
  {{- if $s3Ingress.tls }}
  tls:
    {{- toYaml $s3Ingress.tls | nindent 4 }}
  {{- else if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
{{- end }}
{{- if $useSeparateBackendIngress }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-backend-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app: depictio
    component: backend-ingress
    {{- if $backendIngress.labels }}
    {{- toYaml $backendIngress.labels | nindent 4 }}
    {{- else if .Values.ingress.labels }}
    {{- toYaml .Values.ingress.labels | nindent 4 }}
    {{- end }}
  annotations:
    {{- if $backendIngress.annotations }}
    {{- toYaml $backendIngress.annotations | nindent 4 }}
    {{- end }}
spec:
  {{- if $backendIngress.ingressClassName }}
  ingressClassName: {{ $backendIngress.ingressClassName }}
  {{- else if .Values.ingress.ingressClassName }}
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{- end }}
  rules:
  {{- if $backendIngress.hosts }}
  {{- range $backendIngress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
        {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ printf "%s-%s" $.Release.Name .service.name }}
                port:
                  {{- if .service.portName }}
                  name: {{ .service.portName }}
                  {{- else }}
                  number: {{ .service.port }}
                  {{- end }}
        {{- end }}
  {{- end }}
  {{- else }}
    - host: {{ include "depictio.apiUrl" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-depictio-backend
                port:
                  number: {{ .Values.backend.service.httpPort }}
  {{- end }}
  {{- if $backendIngress.tls }}
  tls:
    {{- toYaml $backendIngress.tls | nindent 4 }}
  {{- else if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
{{- end }}
