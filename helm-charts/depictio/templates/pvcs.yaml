# MongoDB PVC is now handled by StatefulSet volumeClaimTemplates
# No manual PVC needed for StatefulSet

{{- $s3 := include "depictio.s3" . | fromYaml }}
{{- $s3Persistence := include "depictio.s3Persistence" . | fromYaml }}
{{- /* The PVC keeps its historical "-minio-pvc" name and `app: minio` label:
       renaming it would orphan the existing claim and start the bundled S3
       store on an empty volume after an upgrade. */}}
{{- if $s3.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-minio-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    app: minio
spec:
  storageClassName: {{ .Values.storageClass }}
  accessModes:
    - {{ $s3Persistence.accessMode }}
  resources:
    requests:
      storage: {{ $s3Persistence.size }}
{{- end }}
