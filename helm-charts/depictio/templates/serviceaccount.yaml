{{- $sa := .Values.serviceAccount | default dict }}
{{- if $sa.create }}
# Identity of the backend and the Celery worker pods. On GKE, annotate it with
# iam.gke.io/gcp-service-account so the pods reach a GCS bucket through
# Workload Identity, with no key (storage.backend: gcs, #1358).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "depictio.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    release: {{ .Release.Name }}
    project: {{ .Values.project.slug }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
