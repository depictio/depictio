# EMBL Dev Environment - dev.demo.depictio.embl.org
# Every tag (beta and stable) deploys here automatically
#
# Layered on top of:
#   - values.yaml (base configuration)
#   - values-embl-demo-base.yaml (EMBL infrastructure + demo mode)
#   - values-embl-secrets.yaml (shared secrets), then
#     values-embl-secrets-demodev.yaml (dev's own S3 bucket); both kept on the
#     self-hosted runner, outside the repo
#
# Tenant quota: 32 CPU / 64 GiB / 30 pods, shared between this env and
# values-embl-demo.yaml. Budget with MongoDB Community Operator HA (3 replicas
# × 2 envs = 6 pods, ~4.2 CPU / 9 GiB limits for all MongoDB):
#
#   Component         dev-demo limits    demo limits    Both envs
#   Backend ×2        4 CPU / 8 GiB      4 CPU / 8 GiB  8 CPU / 16 GiB
#   Celery            8 CPU / 16 GiB     5 CPU / 10 GiB 13 CPU / 26 GiB
#   Viewer ×2         1 CPU / 512 Mi     1 CPU / 512 Mi  2 CPU / 1 GiB
#   MongoDB ×3        2.1 CPU / 4.5 GiB  2.1 CPU / 4.5G  4.2 CPU / 9 GiB
#   Redis             0.5 CPU / 512 Mi   0.5 CPU / 512M  1 CPU / 1 GiB
#   TOTAL             ~15.6 CPU / ~29 G  ~12.6 CPU / ~24 ~28 CPU / ~53 GiB ✅
#
# Pods are also capped at 10 per namespace (Capsule quota, seen 2026-10-05),
# which is what limits the viewer to one replica below.

# Demo environment configuration - auto-wipe on upgrades
demo:
  autoWipeOnUpgrade: true  # Delete PVCs before each upgrade for fresh demo state

# Viewer (nginx SPA) — stateless and tiny: one replica, rolled with a surge
# pod so a deploy has no downtime (no PVC, so RollingUpdate is safe here).
# One replica, not two, because the namespace is capped at 10 pods: with
# backend ×2, celery ×2, MongoDB ×3 and Redis, a second viewer leaves no room
# for the pre-upgrade wipe job, and every upgrade hangs until Helm times out.
viewer:
  replicas: 1
  strategy: "RollingUpdate"

# Protect the multi-replica workloads during node drains / cluster upgrades.
# Only components with >1 replica get a PDB here: backend and celery.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Celery worker — advanced-viz compute bottleneck (Playwright screenshots,
# polars C-extension). dev validates multi-replica celery before promoting to
# stable. 4 CPU / 8 GiB limits per pod × 2 pods = 8 CPU / 16 GiB total.
celery:
  enabled: true
  replicas: 2
  resources:
    requests:
      memory: "3Gi"
      cpu: "1.5"
    limits:
      memory: "8Gi"
      cpu: "4"
  env:
    DEPICTIO_CELERY_WORKERS: "4"  # 4 slots per pod × 2 pods = 8 total
  extraEnv: &s3ChecksumEnv
    # The EMBL S3 gateway rejects the checksums botocore >= 1.36 sends by
    # default (PutObject: "x-amz-content-sha256 must be UNSIGNED-PAYLOAD, ..."),
    # which fails the backend's startup write check. EMBL's S3 docs recommend
    # these two switches for every client.
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: "when_required"
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: "when_required"

# Backend API — serves the React viewer SPA + its data-fetching endpoints
# (render_figure, bulk_compute_cards, …). 2 replicas for HA + tail latency;
# budget-neutral (per-pod halved, aggregate 2 CPU / 4 Gi req, 4 CPU / 8 Gi
# limit, 4 gunicorn workers unchanged). Safe across pods via the Mongo
# `init_lock`. Kept on Recreate — this env auto-wipes PVCs on upgrade.
backend:
  replicas: 2
  resources:
    requests:
      memory: "2Gi"
      cpu: "1"
    limits:
      memory: "4Gi"
      cpu: "2"
  env:
    # Demo mode with guided tour tooltips
    DEPICTIO_AUTH_DEMO_MODE: "true"
    DEPICTIO_AUTH_PUBLIC_MODE: "true"
    # Anonymous user configuration
    DEPICTIO_AUTH_ANONYMOUS_USER_EMAIL: "anonymous@depict.io"
    DEPICTIO_AUTH_TEMPORARY_USER_EXPIRY_HOURS: "1"
    # Performance — 2 gunicorn workers per pod × 2 pods = 4 total, sized to
    # the 2-CPU per-pod limit.
    DEPICTIO_FASTAPI_WORKERS: "2"  # Gunicorn workers for API
    DEPICTIO_DEV_MODE: "false"
    DEPICTIO_MONGODB_WIPE: "true"
    DEPICTIO_GOOGLE_ANALYTICS_ENABLED: "true"
    DEPICTIO_GOOGLE_ANALYTICS_TRACKING_ID: "G-MCC33FDF2Z"
    # Explicit API URL to match ingress host (for browser-based requests)
    DEPICTIO_FASTAPI_PUBLIC_URL: "https://dev.api.demo.depictio.embl.org"
  extraEnv: *s3ChecksumEnv

# Ingress - Dev Environment
ingress:
  enabled: true
  ingressClassName: "external-users"

  annotations:
    cert-manager.io/cluster-issuer: harica-issuer
    # Traefik automatically handles WebSocket upgrades

  hosts:
    - host: "dev.demo.depictio.embl.org"
      paths:
        - path: /
          pathType: Prefix
          service:
            name: depictio-viewer
            portName: http
    - host: "dev.api.demo.depictio.embl.org"
      paths:
        - path: /
          pathType: Prefix
          service:
            name: depictio-backend
            portName: http

  tls:
    - hosts:
        - "dev.demo.depictio.embl.org"
        - "dev.api.demo.depictio.embl.org"
      secretName: devdemo-depictio-tls

# Global domain settings
global:
  domain: "depictio.embl.org"
  urlPattern:
    type: "subdomain"
    subdomain: "dev"
