packages:
  - 'packages/*'
  - 'depictio/viewer'

# pnpm v10+ doesn't run lifecycle/postinstall scripts unless explicitly
# approved. esbuild's postinstall is what installs the platform-specific
# native binary; without it Vite's esbuild service dies on first transform
# ("The service is no longer running"). es5-ext just prints a donation
# notice, but allowlisting it silences the warning.
onlyBuiltDependencies:
  - esbuild
  - es5-ext

# @genome-spy/core pins @gmod/tabix 3.2.2, which still calls
# unzipChunkSlice(buf, chunk, cache); @gmod/bgzf-filehandle 6.4+ reads that third
# argument as a worker pool and throws "workerPool.decompressBlocks is not a
# function", so every tabix-backed lazy source (VCF, GFF3, tabix) fails to load.
# 6.3.3 satisfies both @gmod/bam (^6.2.0) and @gmod/tabix (^6.0.9). The override
# lives in the root package.json (pnpm 9 reads `pnpm.overrides` there); drop it
# once @genome-spy/core moves to a @gmod/tabix that passes two args.
# JBrowse's own @gmod/tabix (^3.10) is held at 3.10.2 for the same reason: 3.12
# imports unzipChunkSegments, which bgzf-filehandle 6.3.3 does not export.

# JBrowse 4.3's track selector calls React 19's useEffectEvent; the viewer runs
# React 18, so patches/ swaps it for a ref. Declared in the root package.json
# (`pnpm.patchedDependencies`): pnpm 9 ignores the key in this file.
